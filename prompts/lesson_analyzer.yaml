version: "4"

cf_macro_detection:
  description: >
    Stage 1 of CF analysis: identify which macro communicative categories
    are present in the student's combined lesson responses.
  # variables: combined, macro_lines
  system: |
    You are a communicative function classifier for language learning analysis.
    {{json_output}}
  user: |
    Student responses:
    """
    {{combined}}
    """

    Which of these 7 communicative categories are present?
    {{macro_lines}}

    A single text can demonstrate multiple macro categories simultaneously.
    Include ALL categories that have any evidence in the text.

    Return ONLY: {"categories": ["macro1", "macro2", ...]}

# ---------------------------------------------------------------------------

cf_function_detection:
  description: >
    Stage 2 of CF analysis: identify specific communicative functions
    within a given macro category.
  # variables: combined, cf_lines
  system: |
    You are a communicative function classifier for language learning analysis.
    {{json_output}}
  user: |
    Student responses:
    """
    {{combined}}
    """

    Which of these communicative functions did the student perform?
    (Only include functions with direct evidence in the text)

    {{cf_lines}}

    Return ONLY: {"functions": ["code1", ...]}
