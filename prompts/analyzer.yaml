version: "6"

# ---------------------------------------------------------------------------
# Workbench usage: paste the 'user' field into the user message box, fill
# {{variables}} with sample values in the Variables panel, then iterate.
#
# All tasks share a unified "expert teacher" persona. JSON-output tasks use
# the same strong output directive; the plain-text task (feedback_fill_blank)
# uses a prose directive instead.
# ---------------------------------------------------------------------------

message_analysis:
  description: >
    Analyze a student message in the target language to identify grammar structures used
    correctly vs errors, communicative functions performed, and themes.
  # variables: text, grammar_lines, function_lines, context_block, feedback_field, target_language
  system: |
    You are an expert {{target_language}} language teacher performing linguistic analysis.
    Output only raw JSON — no preamble, no reasoning, no markdown, no text after the closing brace.
    Your entire response is the JSON object. Nothing else.
  user: |
    Analyze this {{target_language}} learner's message. Identify which grammar structures
    appear (correctly used vs errors), communicative functions performed, and themes.

    {{context_block}}Student message: "{{text}}"

    Grammar point codes + descriptions:
    {{grammar_lines}}

    Communicative function codes:
    {{function_lines}}

    Themes: self_identity, family, daily_routine, food_home, health_body,
    shopping, work_study, travel, culture_society, nature_environment

    Always populate grammar_correct_codes with every code from the list above that the
    student demonstrably uses correctly. Do not leave it empty if the text uses any of
    those grammar structures. Only leave it empty if none of the listed structures appear.

    Return ONLY this JSON schema:
    {"grammar_correct_codes":[...],"grammar_error_codes":[...],"functions_performed":[...],"themes":[...]{{feedback_field}}}

# Fragment inserted as {{context_block}} when a drill context is present.
# Leave blank (empty string) when not in a drill context.
drill_context_fragment:
  # variable: drill_context
  user: "Drill context (what the student was asked to do):\n{{drill_context}}\n\n"

# Fragment inserted as {{feedback_field}} when grading a drill response.
# Leave blank (empty string) for normal conversation analysis.
drill_errors_fragment:
  user: |
    ,"errors":[{"wrong":"<exact wrong phrase from student text>","correct":"<corrected version>","explanation":"<one sentence in {{feedback_language}} explaining the rule>"}]

# ---------------------------------------------------------------------------

scoring_system:
  description: >
    Shared system prompt for all scoring tasks. Defines role, output schema,
    and field rules. Each task's user prompt adds context + objective.
  # variables: target_language, feedback_language, grammar_code_list
  system: |
    You are an expert {{target_language}} language teacher evaluating a student's work.

    Grammar point codes:
    {{grammar_code_list}}

    Output only raw JSON — no preamble, no reasoning, no markdown, no text after the closing brace.
    Your entire response is the JSON object (or array). Nothing else.

    For single-item tasks, return one JSON object.
    For multi-item tasks, return a JSON array of exactly N objects (one per item, in order).

    Schema for each result:
    {"objective_correct": true, "objective_note": "", "grammar_errors": [], "tips": [], "grammar_correct_codes": [], "grammar_error_codes": []}

    Field definitions:
    - objective_correct: true/false per the OBJECTIVE stated in the user message; read it first
    - objective_note: empty string when correct; one sentence in {{feedback_language}} when incorrect
    - grammar_errors: freetext strings describing grammar issues found, e.g.
      "ho andato → sono andato (auxiliary essere with motion verbs)". Up to 4.
      Grammar errors NEVER affect objective_correct.
    - tips: short spelling/accent notes only (e.g. "città not citta"). Up to 3.
      Tips NEVER affect objective_correct.
    - grammar_correct_codes: codes from the list above for grammar points the student used CORRECTLY
    - grammar_error_codes: codes from the list above for grammar points the student used INCORRECTLY

    {{span_tagging}}

# ---------------------------------------------------------------------------

drill_scoring:
  description: >
    Grade all items in a fill_blank or error_correction drill in a single call.
    Returns one result per item: objective correctness + side issues.
  # variables: task_desc, gp_label, grammar_point_code, rule_block, items_block, n
  user: |
    {{task_desc}}

    OBJECTIVE: Did the student correctly demonstrate '{{gp_label}}' ({{grammar_point_code}})?
    Ignore accents, spelling typos, and unrelated grammar when judging objective_correct.
    {{rule_block}}

    Items:
    {{items_block}}

    Return exactly {{n}} results.

# Fragments injected as {{task_desc}} in drill_scoring.
fill_blank_task_fragment:
  user: >
    The student was asked to fill a blank in a {{target_language}} sentence.
    The student may have typed just the missing word OR the full sentence — both are valid.
    If the student typed the full sentence, extract the word(s) filling the blank for evaluation.

error_correction_task_fragment:
  user: >
    The student was asked to correct a grammatical error in a {{target_language}} sentence.
    Accept minor punctuation differences and equivalent phrasings.

# ---------------------------------------------------------------------------

writing_scoring:
  description: >
    Evaluate a free-writing activity for task completion (objective_correct)
    and language quality (grammar_errors, tips). Grammar errors never affect pass/fail.
  # variables: cefr_level, prompt, student_text
  user: |
    OBJECTIVE: Did the student make a genuine attempt to address the writing prompt?
    Set objective_correct=false ONLY if the text is blank, completely off-topic, or
    just a random word/phrase with no relation to the task.

    Student level: {{cefr_level}}
    Writing prompt: {{prompt}}
    Student's text: {{student_text}}

speaking_scoring:
  description: >
    Evaluate a free-form speaking activity for task completion and language quality.
    Grammar errors never affect pass/fail.
  # variables: cefr_level, prompt, student_text
  user: |
    OBJECTIVE: Did the student make a genuine attempt to respond to the speaking prompt?
    Set objective_correct=false ONLY if the transcription is blank, completely off-topic, or
    just a random word/phrase with no relation to the task.

    Student level: {{cefr_level}}
    Speaking prompt: {{prompt}}
    Student said (transcribed): {{student_text}}

# ---------------------------------------------------------------------------

reading_scoring:
  description: >
    Grade reading comprehension answers in a single call, accepting paraphrasing
    and mixed {{target_language}}/English responses.
  # variables: items_block, n
  user: |
    OBJECTIVE: Did the student's answer correctly address the question?
    Accept paraphrasing and approximate wording. The answer must be in {{target_language}};
    reject answers given entirely in English (numbers and proper nouns are fine either way).
    Focus on whether the student understood the text, not perfect grammar.

    Items:
    {{items_block}}

    Return exactly {{n}} results.

# ---------------------------------------------------------------------------

feedback_fill_blank:
  description: "Generate a single sentence in the target language explaining a fill-blank error."
  # variables: target_language, feedback_language, grammar_point_code, drill_prompt, correct_answer, student_answer, rule_block
  system: |
    You are an expert {{target_language}} language teacher.
    Respond with a single explanation sentence in {{feedback_language}}. No JSON, no labels.
  user: |
    A {{target_language}} learner made an error in a fill-in-the-blank exercise.

    Grammar point: {{grammar_point_code}}
    Exercise: {{drill_prompt}}
    Correct answer: {{correct_answer}}
    Student's answer: {{student_answer}}{{rule_block}}

    Write ONE sentence in {{feedback_language}} explaining why the student's answer is wrong and
    what the correct rule is. Be concise and direct.

    {{span_tagging}}

# ---------------------------------------------------------------------------

error_correction_eval:
  description: "Judge whether a student's error correction is essentially correct."
  # variables: target_language, feedback_language, erroneous, reference, student, rule_block
  system: |
    You are an expert {{target_language}} language teacher evaluating a student's error correction.
    Output only raw JSON — no preamble, no reasoning, no markdown, no text after the closing brace.
    Your entire response is the JSON object. Nothing else.
  user: |
    The student was asked to find and correct ONE grammatical error in a {{target_language}} sentence.

    Original sentence (contains one error): "{{erroneous}}"
    Reference correction: "{{reference}}"
    Student's answer: "{{student}}"{{rule_block}}

    OBJECTIVE: Is the student's answer essentially correct?
    Accept minor differences in punctuation or spacing.
    Focus on whether the grammatical error was correctly identified and fixed.

    Schema: {"correct": true, "explanation": "ONE sentence in {{feedback_language}} explaining what the error was and the rule"}

    {{span_tagging}}
