version: "1"

# ---------------------------------------------------------------------------
# Workbench usage: paste the 'user' field into the user message box, fill
# {{variables}} with sample values in the Variables panel, then iterate.
# ---------------------------------------------------------------------------

analyze_message:
  description: >
    Analyze a student message in the target language to identify grammar structures used
    correctly vs errors, communicative functions performed, and themes.
  # variables: text, grammar_lines, function_lines, context_block, feedback_field, target_language
  user: |
    Analyze this {{target_language}} learner's message. Identify which grammar structures
    appear (correctly used vs errors), communicative functions performed, and themes.

    {{context_block}}Student message: "{{text}}"

    Grammar point codes + descriptions:
    {{grammar_lines}}

    Communicative function codes:
    {{function_lines}}

    Themes: self_identity, family, daily_routine, food_home, health_body,
    shopping, work_study, travel, culture_society, nature_environment

    Return ONLY valid JSON (no markdown, no explanation):
    {"grammar_correct":[...],"grammar_errors":[...],"functions_performed":[...],"themes":[...]{{feedback_field}}}

# Fragment inserted as {{context_block}} when a drill context is present.
# Leave blank (empty string) when not in a drill context.
context_block_fragment:
  # variable: drill_context
  user: "Drill context (what the student was asked to do):\n{{drill_context}}\n\n"

# Fragment inserted as {{feedback_field}} when grading a drill response.
# Leave blank (empty string) for normal conversation analysis.
feedback_field_fragment:
  user: |
    ,"errors":[{"wrong":"<exact wrong phrase from student text>","correct":"<corrected version>","explanation":"<one sentence in {{target_language}} explaining the rule>"}]

# ---------------------------------------------------------------------------

score_multi_item:
  description: >
    Grade all items in a fill_blank or error_correction drill in a single call.
    Returns one result per item: objective correctness + side issues.
  # variables: task_desc, gp_label, grammar_point_code, rule_block,
  #            grammar_code_list, items_block, n
  user: |
    You are grading a {{target_language}} grammar exercise. {{task_desc}}

    LEARNING OBJECTIVE: {{gp_label}} ({{grammar_point_code}})
    {{rule_block}}

    For each item evaluate TWO things independently:
    1. OBJECTIVE — Did the student correctly demonstrate '{{gp_label}}'?
    Ignore accents, spelling typos, and unrelated grammar when judging this.
    2. OTHER ISSUES — Identify any additional problems:
       a) Other grammar errors: tag with codes from this list:
    {{grammar_code_list}}
       b) Spelling/accent issues: short freetext note (e.g. "città not citta")

    Items:
    {{items_block}}

    Return ONLY a JSON array of exactly {{n}} objects, one per item, in order.
    Schema:
    [{"objective_correct": true, "objective_note": "", "grammar_errors": [], "tips": []}, ...]
    Rules:
    - objective_note: empty string when correct; one sentence in {{target_language}} when wrong
    - grammar_errors: codes for OTHER grammar errors (never include {{grammar_point_code}} here)
    - tips: short strings for spelling/accent issues only
    No markdown, no other text.

task_fill_blank:
  user: >
    The student was asked to fill a blank in a {{target_language}} sentence.
    The student may have typed just the missing word OR the full sentence — both are valid.
    If the student typed the full sentence, extract the word(s) filling the blank for evaluation.

task_error_correction:
  user: >
    The student was asked to correct a grammatical error in a {{target_language}} sentence.
    Accept minor punctuation differences and equivalent phrasings.

# ---------------------------------------------------------------------------

generate_writing_feedback:
  description: >
    Evaluate a free-writing activity for task completion (objective_correct)
    and language quality (grammar_errors, tips). Grammar errors never affect pass/fail.
  # variables: cefr_level, prompt, student_text
  user: |
    You are a {{target_language}} language teacher reviewing a {{cefr_level}} student's writing.

    Writing prompt: {{prompt}}

    Student's text: {{student_text}}

    Evaluate TWO things independently:
    1. TASK COMPLETION — Did the student make a genuine attempt to address the prompt?
    Set objective_correct=false ONLY if the text is blank, completely off-topic, or
    just a random word/phrase with no relation to the task.
    2. LANGUAGE QUALITY — Separately list grammar errors and spelling/accent tips.
    These never affect objective_correct.

    grammar_errors: list of freetext strings describing grammar issues
    (e.g. "ha mangiato → aveva mangiato (trapassato prossimo)"). Up to 4.
    tips: spelling/accent issues only (e.g. "città not citta"). Up to 3.

    Return ONLY valid JSON (no markdown):
    {"objective_correct":true,"objective_note":"","grammar_errors":[],"tips":[]}

# ---------------------------------------------------------------------------

score_free_form_drill:
  description: >
    Score a free-form drill on task completion only. Grammar errors are reported
    but never cause a fail.
  # variables: cefr_level, grammar_point_code, prompt, student_text, rule_block
  user: |
    You are grading a free-form {{target_language}} drill for a {{cefr_level}} learner.

    Grammar point being practised: {{grammar_point_code}}
    Drill prompt: {{prompt}}
    Student's answer: {{student_text}}{{rule_block}}

    Evaluate TWO things independently:
    1. TASK COMPLETION — Did the student make a genuine attempt at the task?
    Set objective_correct=false ONLY if the answer is blank, completely off-topic,
    or so short/nonsensical it shows no engagement.
    Grammar errors alone must NOT make this false.
    2. LANGUAGE QUALITY — Separately list grammar errors and spelling/accent tips.
    These never affect objective_correct.

    grammar_errors: list of freetext strings (e.g. "ho andato → sono andato (essere verbs)"). Up to 4.
    tips: spelling/accent issues only (e.g. "perché not perche"). Up to 3.

    Return ONLY valid JSON (no markdown):
    {"objective_correct":true,"objective_note":"","grammar_errors":[],"tips":[]}

# ---------------------------------------------------------------------------

score_reading_answers:
  description: >
    Grade reading comprehension answers in a single call, accepting paraphrasing
    and mixed {{target_language}}/English responses.
  # variables: items_block, n
  user: |
    You are grading reading comprehension answers for a {{target_language}} language learner.

    For each item, judge whether the student's answer correctly addresses the question.
    Accept paraphrasing, approximate wording, and answers in a mix of {{target_language}} and English.
    Focus on whether the student understood the text, not perfect grammar.

    Items:
    {{items_block}}

    Return ONLY a JSON array of exactly {{n}} objects, one per item, in order.
    Schema:
    [{"objective_correct": true, "objective_note": "", "grammar_errors": [], "tips": []}, ...]
    Rules:
    - objective_note: empty when correct; one {{target_language}} sentence explaining what was wrong or missing when incorrect
    - grammar_errors: list of short strings describing grammar issues in the student's {{target_language}} (if any)
    - tips: short spelling/accent tip strings only
    No markdown, no other text.

# ---------------------------------------------------------------------------

feedback_fill_blank:
  description: "Generate a single sentence in the target language explaining a fill-blank error."
  # variables: grammar_point_code, drill_prompt, correct_answer, student_answer, rule_block
  user: |
    A {{target_language}} learner made an error in a fill-in-the-blank exercise.

    Grammar point: {{grammar_point_code}}
    Exercise: {{drill_prompt}}
    Correct answer: {{correct_answer}}
    Student's answer: {{student_answer}}{{rule_block}}

    Write ONE sentence in {{target_language}} explaining why the student's answer is wrong and
    what the correct rule is. Be concise and direct.
    Return ONLY the explanation sentence, no JSON, no labels.

# ---------------------------------------------------------------------------

evaluate_error_correction:
  description: "Judge whether a student's error correction is essentially correct."
  # variables: erroneous, reference, student, rule_block
  user: |
    You are evaluating a {{target_language}} grammar exercise.
    The student was asked to find and correct ONE grammatical error in a sentence.

    Original sentence (contains one error): "{{erroneous}}"
    Reference correction: "{{reference}}"
    Student's answer: "{{student}}"{{rule_block}}

    Decide whether the student's answer is essentially correct.
    Accept minor differences in punctuation or spacing.
    Focus on whether the grammatical error was correctly identified and fixed.

    Return ONLY valid JSON (no markdown, no explanation):
    {"correct":true,"explanation":"ONE sentence in {{target_language}} explaining what the error was and the rule"}
