version: "8"

# ---------------------------------------------------------------------------

lesson_content_system:
  description: >
    System prompt for the lesson content generation LLM call.
  # variables: target_language
  system: |
    You are an experienced language teacher creating a lesson in {{target_language}}.
    {{json_output}}

# ---------------------------------------------------------------------------

lesson_feedback:
  description: >
    System prompt for end-of-lesson feedback generation.
  system: |
    You are an encouraging language teacher.
    Write brief, honest lesson feedback in English.
  # variables: target_language, activity_summary, weak_note
  user: |
    A student just completed a {{target_language}} lesson. Summary:
    {{activity_summary}}{{weak_note}}

    Write 2-3 sentences of feedback in English that: mentions what was practiced,
    notes any areas of difficulty, and ends with one specific encouragement.

# ---------------------------------------------------------------------------

archetype_introduction:
  description: >
    Guidance inserted when the lesson archetype is "introduction" (new grammar).
  user: |
    LESSON TYPE: Introduction
    This lesson INTRODUCES new grammar points for the first time.
    Explain each grammar point clearly before drilling it.
    Use simple, supportive language. Drills should be straightforward
    and build confidence with the new concept.

archetype_consolidation:
  description: >
    Guidance inserted when the lesson archetype is "consolidation" (practice).
  user: |
    LESSON TYPE: Consolidation
    This is a PRACTICE lesson. The student has seen all these grammar
    points before. Focus on varied drills and usage in context.
    No lengthy grammar explanations needed — brief reminders only.

archetype_application:
  description: >
    Guidance inserted when the lesson archetype is "application" (immersive).
  user: |
    LESSON TYPE: Application
    This is an IMMERSIVE scenario lesson. Grammar should support
    communication, not be the focus. Prioritize natural dialogue,
    real-world usage, and communicative tasks over explicit grammar work.

# ---------------------------------------------------------------------------

lesson_content_header:
  user: |
    You are generating a lesson in {{target_language}}.
    Where student details are provided, you may draw on them for inspiration, but feel free to explore other angles too.
    The reading, writing, and speaking activities should share a setting or theme where practical, so the lesson feels like one continuous experience rather than three separate drills.
    Generate a creative {{target_language}} topic_title and topic_description for this lesson.

lesson_content_footer:
  description: >
    JSON schema instruction and drill rules appended to the lesson content prompt.
    schema_json is the JSON-serialised expected-output schema for this lesson.
  # variables: schema_json, reading_count, speaking_count, grammar_count
  user: |
    {{json_output}}
    Match this structure:
    {{schema_json}}

    Drill rules:
    - fill_blank: items is a list of EXACTLY 10 objects {prompt, correct_answer}; each prompt is a {{target_language}} sentence with ___ as placeholder; correct_answer is the word/phrase that fills the blank
    - error_correction: items is a list of EXACTLY 10 objects {prompt, correct_answer}; each prompt is a bare erroneous {{target_language}} sentence (no intro text); correct_answer is the corrected sentence
    - All content in {{target_language}}
    {{span_tagging}}
    - Return drills in the same order as listed in the drill specs
    - readings: return EXACTLY {{reading_count}} reading object(s) in the array
    - speakings: return EXACTLY {{speaking_count}} speaking object(s) in the array
