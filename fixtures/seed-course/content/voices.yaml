# TTS voices (docs/04 § Audio). PROPOSAL to audition in week 4: the audio reviewer picks, the owner records
# the final choice here. Use standard (non-HD) it-IT neural voices only: batch synthesis + word boundaries +
# IPA phonemes (ADR-07). Check every name against the Azure voice list before rendering.
default_rate: "0%"
voices:
  narrator:    {voice: it-IT-ElsaNeural}                    # reserved speaker (no story-bible entry)
  announcer:   {voice: it-IT-BenignoNeural, effect: station} # reserved speaker (no story-bible entry)
  items:       {voice: it-IT-ElsaNeural, rate: "-10%"}      # single words and chunks in previews and cards
  ch:marco:    {voice: it-IT-DiegoNeural}
  ch:rossi:    {voice: it-IT-PalmiraNeural}
  ch:sara:     {voice: it-IT-FiammaNeural}
  ch:giulia:   {voice: it-IT-IsabellaNeural, rate: "+8%"}   # "talks fast"
  ch:luca:     {voice: it-IT-PierinaNeural, pitch: "+15%"}  # Azure has no it-IT child voice that we know of: Pierina is an
                                                            # adult voice. Audition pitch settings; the owner decides.
  ch:zia-rosa: {voice: it-IT-ImeldaNeural}
  ch:you:                                                   # model answers and help lines spoken as the learner:
    m: {voice: it-IT-LisandroNeural}                        # rendered twice when the text has {m:…|f:…} forms;
    f: {voice: it-IT-FabiolaNeural}                         # the app plays the one matching the onboarding gender
  ch:extra:
    voices: [it-IT-GianniNeural, it-IT-CataldoNeural, it-IT-IrmaNeural, it-IT-BenignoNeural]
    pick: fnv1a64(textId) mod 4                             # stable per text; FNV-1a 64-bit over the UTF-8 text ID
slow_rate: "-25%"     # "Play slower" uses the same file at 0.75× playback; this rate is only for dictation if needed
