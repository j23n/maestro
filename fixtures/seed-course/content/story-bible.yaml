  - {from: ch:extra, to: ch:luca, register: tu, units: all}
  - {from: ch:zia-rosa, to: ch:marco, register: tu, units: all}
  - {from: ch:marco, to: ch:zia-rosa, register: tu, units: all, note: "family; content lead may prefer Lei until she says Dammi del tu! (use a switch point)"}
  - {from: ch:zia-rosa, to: ch:you, register: tu, units: all}
  - {from: ch:you, to: ch:zia-rosa, register: lei, units: all}
