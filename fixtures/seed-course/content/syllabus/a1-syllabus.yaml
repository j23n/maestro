# A1 syllabus inventory. Encoded from the plan's "A1 syllabus" tab, in our own words.
# The sources (CILS A1, CELI Impatto, the certification bodies' joint A1 syllabus, PLIDA, CLIQ) are
# copyrighted references: never copy their wording or examples into content.
# Key for `sources`: P produce · R recognise · listed (status not stated) · '-' not listed · A2 only at A2.
# `covered_by` refs: g: s: cd: topic: kind: format: section: — tracing rules in docs/04 § Check 1.
# `roles` (optional) narrows what check 1 requires; the default is [introduced, practised, assessed].
# Status: DRAFT for content-lead sign-off (C1, week 3).

