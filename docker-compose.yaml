services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      - ENVIRONMENT=development
      - MONGODB_URI=mongodb://db:27017/
    depends_on:
      - db

  db:
    image: mongodb/mongodb-atlas-local
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db

volumes:
  mongodata:
