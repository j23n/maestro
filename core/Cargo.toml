[package]
name = "maestro-core"
version = "0.1.0"
edition = "2021"
description = "Portable core for Maestro: pack reader, learner record, scoring"
license = "MIT"

[lib]
name = "maestro_core"
crate-type = ["lib", "staticlib", "cdylib"]

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uniffi = { version = "0.29", features = ["cli"] }
