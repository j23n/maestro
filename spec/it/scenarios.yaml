  overview: You'll need to ask for help. Learn the phrases that keep conversations going when you're
    stuck.
  scene_setting: 'Someone on the street gives you directions — but they''re speaking

    too fast and you only caught "a sinistra." It''s completely normal.

    In this lesson, you''ll learn the phrases that keep a conversation

    going even when you don''t understand everything.

    '
  outro: You now know how to ask for help in Italian. Getting stuck is no longer a dead end.
