  overview: You've come a long way! Final review of everything before moving on to A1.
  scene_setting: 'You''ve travelled across Italy, ordered meals, asked for help, met

    people, and handled problems — all in Italian. This final lesson

    pulls everything together. Think of it as packing your suitcase:

    making sure nothing gets left behind before the next chapter.

    '
  outro: You've completed A0. From zero Italian to real conversations — that took courage.
    Bravo.
