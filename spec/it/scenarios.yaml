  overview: 'You''re on the plane to Italy. Learn the absolute essentials: hello, thank you, please,
    excuse me, and the one phrase that gets you anything.'
  scene_setting: 'You''re on a plane to Italy. The captain just announced the descent

    into Rome in Italian — and you didn''t catch a word. By the end of

    this lesson, you''ll know how to say hello, thank the flight

    attendant, and ask for what you need. That''s all it takes to start.

    '
  outro: You learned your first Italian words — enough to land in Italy and not feel lost.
  image: images/scenarios/a0-01-in-aereo.png
