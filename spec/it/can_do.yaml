# Can-do inventory — Italian, A0–A2.
#
# The learner-facing spine of the curriculum (docs/plans/03 Phase 1).
# Descriptor text is original; the CEFR Companion Volume and the Profilo
# della lingua italiana were used as completeness checklists only.
#
# LLM-drafted, awaiting the human curation pass. The *set* of descriptors
# freezes at the end of Phase 1; wording can be refined in content passes.
#
# Conventions:
# - id: <level>.<slug>, stable forever once packs reference it.
# - skill: one of the CEFR's five modes (listening, reading,
#   spoken_interaction, spoken_production, writing).
# - decomposition may reference grammar/functions at or below the can-do's
#   level (the validator warns on anything above).
# - A2 rows reference A1 scenarios where the scenario's depth 2–3 framing
#   covers them; A2-specific scenarios arrive with Phase 7 content fill.

# ============================================================ A0
# Survival: the crash-course promise — land in Italy, not feel lost.

- id: a0.greet_take_leave
  cefr_level: A0
  skill: spoken_interaction
  label: Can greet people, say goodbye, and use please, thank you, and sorry at the right moments.
  theme: social
  function_ids: [a0_salutare, a0_congedarsi, a0_ringraziare, a0_chiedere_cortesemente, a0_scusarsi]
  grammar_ids: [saluti, polite_exp]
  scenario_ids: [a0-01-in-aereo, a0-03-al-bar]
  vocab_domains: [greetings]

- id: a0.say_who_i_am
