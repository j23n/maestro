# Leveled vocabulary — Italian, v0.
#
# ~480 lemmas: A0 essentially complete (crash-course scope), A1 core,
# A2 starter. Expansion to the plan's ~1,500 happens with Phase 7 content
# fill (frequency-list cross-check + generate tooling); the *schema* and
# validator wiring are what v0 locks in. Entries are lemmas; multi-word
# fixed expressions use pos: phrase.

# ============================================================ A0
# Function words. Grammatical rather than cardable (docs/plans/08 §2):
# they earn a dictionary entry and a gloss so a learner can look them up,
# and the grammar point that teaches them carries the practice.
# Articles are one lemma per written form — a learner tapping "gli" wants
# "gli", not a paradigm.
- {id: il, cefr_level: A0, pos: art, gloss: the (masculine singular)}
- {id: lo, cefr_level: A0, pos: art, gloss: the (masculine singular before s+consonant / z)}
- {id: la, cefr_level: A0, pos: art, gloss: the (feminine singular)}
