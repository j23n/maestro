  - Ti consiglio / consiglierei di proposizione infinitiva
  - Al posto tuo, io verbo condizionale
  - Proposizione imperativa
  examples:
  - Potresti parlarne con il professore.
  - Dovresti mangiare più carne.
  - Perché non ci vai subito?
  - Ti consiglio di andare in quel ristorante.
  - Al posto tuo, io lo farei.
