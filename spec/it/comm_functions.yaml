    titles like 'Il dottor / La dottoressa' for formal ones.
  patterns:
  - Questo è (titolo) Nome / Cognome
  - Il / la titolo Nome / Cognome
  examples:
  - Questo è Mario.
  - La dottoressa Corti.
- id: intritsoc_presqualc_a2
  cefr_level: A2
  category: interagire_rituali_sociali
  label: Presentare qualcuno
  patterns:
  - Questo / ecco gruppo nominale
  examples:
  - Questo è il mio amico Paolo.
- id: intritsoc_presqualc_b1
  cefr_level: B1
  category: interagire_rituali_sociali
  label: Presentare qualcuno
  patterns:
  - Ti presento nome
  - Posso presentarti (titolo) Nome/Cognome
- id: intritsoc_presqualc_b2
  cefr_level: B2
  category: interagire_rituali_sociali
  label: Presentare qualcuno
  patterns:
  - Ho il piacere di presentarti/ titolo / nome / cognome
  - Conosci il / la signor / signora titolo / Nome / Cognome
- id: intritsoc_presentarsi_a1
  cefr_level: A1
  category: interagire_rituali_sociali
  label: Presentarsi
  description: Introduce yourself by giving your name. Use <span lang="it">Mi chiamo...</span>
    or <span lang="it">Sono...</span> to tell others who you are.
  patterns:
  - Sono Nome / Cognome
  - Mi chiamo Nome / Cognome
  - Buongiorno, ( sono / mi chiamo) Nome / Cognome
  examples:
  - Sono Anna Rossi.
- id: intritsoc_presentarsi_a2
  cefr_level: A2
  category: interagire_rituali_sociali
  label: Presentarsi
  patterns:
  - Salve, (sono /mi chiamo)
  - Nome / Cognome
- id: intritsoc_risppresent_a1
  cefr_level: A1
  category: interagire_rituali_sociali
  label: Rispondere a una presentazione
  description: Respond when someone introduces themselves or another person. Use 'Piacere'
    or 'Piacere, sono [name]' to say 'nice to meet you'.
  patterns:
  - Piacere
  - Piacere (sono / mi chiamo) Nome/Cognome
  examples:
  - <span lang="it">— Mi chiamo Luca. — Piacere, Luca! Sono Anna.</span>
  - <span lang="it">— Le presento il dottor Rossi. — Piacere, dottor Rossi. Mi chiamo Giulia
    Ferri.</span>
  - <span lang="it">— Ciao, io sono Marco! — Piacere, Marco! Sono Sofia.</span>
  - <span lang="it">— Questo è il mio collega, Paolo. — Piacere, sono Marta.</span>
  - <span lang="it">— Ti presento Chiara. — Piacere!</span>
- id: intritsoc_risppresent_b1
  cefr_level: B1
  category: interagire_rituali_sociali
  label: Rispondere a una presentazione
  patterns:
  - È un piacere conoscerti
- id: intritsoc_risppresent_b2
  cefr_level: B2
  category: interagire_rituali_sociali
  label: Rispondere a una presentazione
  patterns:
  - È un piacere fare la Sua conoscenza
- id: intritsoc_accqualc_a1
  cefr_level: A1
  category: interagire_rituali_sociali
  label: Accogliere qualcuno
  patterns:
  - Entra / vieni
- id: intritsoc_accqualc_a2
  cefr_level: A2
  category: interagire_rituali_sociali
  label: Accogliere qualcuno
  patterns:
  - Benvenuto!
  - Prego, entra / entrate
- id: intritsoc_accqualc_b1
  cefr_level: B1
  category: interagire_rituali_sociali
  label: Accogliere qualcuno
  patterns:
  - Accomodati!
- id: intritsoc_accqualc_b2
  cefr_level: B2
  category: interagire_rituali_sociali
  label: Accogliere qualcuno
  patterns:
  - Fa' come se fossi a casa tua!
  - Mettiti comodo!
  - Prego, accomodati pure!
- id: intritsoc_farebrind_a1
  cefr_level: A1
  category: interagire_rituali_sociali
  label: Fare un brindisi
  description: Make a toast to celebrate a moment. Use 'Cin cin!' or 'Salute!' when raising
    your glass with others.
  patterns:
  - Cin cin / Salute!
  examples:
  - <span lang="it">Cin cin! Buon compleanno, Marco!</span>
  - <span lang="it">Salute! Benvenuti a tutti!</span>
  - <span lang="it">Alziamo i bicchieri! Cin cin!</span>
  - <span lang="it">Salute! Al nuovo anno!</span>
  - <span lang="it">Cin cin! Auguri a voi due!</span>
- id: intritsoc_farebrind_b2
  cefr_level: B2
  category: interagire_rituali_sociali
  label: Fare un brindisi
  patterns:
  - Brindiamo a
  - Facciamo un brindisi a…
  - Alla tua / nostra / vostra…!
- id: intritsoc_congratul_a1
  cefr_level: A1
  category: interagire_rituali_sociali
  label: Congratularsi
  description: Congratulate someone on an achievement or good news. Use phrases like <span
    lang="it">Bravo!</span> or <span lang="it">Molto bene!</span> to show praise and enthusiasm.
  patterns:
  - Molto bene! / Bravo!
  examples:
  - <span lang="it">Hai superato l'esame? Bravo!</span>
  - <span lang="it">Molto bene, Sofia! Sei bravissima!</span>
  - <span lang="it">Complimenti per il tuo compleanno, Marco!</span>
  - <span lang="it">Bravo, hai vinto! Sono molto contento per te.</span>
  - <span lang="it">Molto bene! Hai fatto un ottimo lavoro.</span>
- id: intritsoc_congratul_a2
  cefr_level: A2
  category: interagire_rituali_sociali
  label: Congratularsi
  patterns:
  - Congratulazioni!
  - Complimenti!
  - (Tanti) auguri!
  - Bravissimo!
  - Che bravo!
- id: intritsoc_congratul_b2
  cefr_level: B2
  category: interagire_rituali_sociali
  label: Congratularsi
  patterns:
  - I miei complimenti!
  - Mi congratulo con te!
  - Le mie congratulazioni!
- id: intritsoc_farecond_b1
  cefr_level: B1
  category: interagire_rituali_sociali
  label: Fare le proprie condoglianze
  patterns:
  - Condoglianze
- id: intritsoc_farecond_b2
  cefr_level: B2
  category: interagire_rituali_sociali
  label: Fare le proprie condoglianze
  patterns:
  - Le mie più sentite/sincere condoglianze¹
- id: intritsoc_augqualqual_a1
  cefr_level: A1
  category: interagire_rituali_sociali
  label: Augurare qualcosa a qualcuno
  description: Wish someone well for a special occasion or event. Use phrases like <span lang="it">Buon
    Natale!</span> or <span lang="it">Buon viaggio!</span> to express good wishes.
  patterns:
  - Buon nome
  - Buon Natale!
  - Buon compleanno!
  - Buona Pasqua!
  - Buon anno!
  - Buona giornata!
  - Buone vacanze!
  - Buon viaggio!
  examples:
  - <span lang="it">Buon compleanno, Marco! Quanti anni compi?</span>
  - <span lang="it">Buone vacanze a tutti! Ci vediamo a settembre.</span>
  - <span lang="it">— Parto domani per Roma. — Ah, davvero? Buon viaggio!</span>
  - <span lang="it">Buon Natale e Buon anno a te e alla tua famiglia!</span>
  - <span lang="it">Buona giornata! A presto!</span>
  - <span lang="it">— Domani è Pasqua! — Sì, Buona Pasqua!</span>
- id: intritsoc_augqualqual_a2
  cefr_level: A2
  category: interagire_rituali_sociali
  label: Augurare qualcosa a qualcuno
  patterns:
  - Buon gruppo nominale
  - Buon appetito!
  - Buona fortuna!
  - Buon divertimento!
  - Buon fine settimana!
- id: intritsoc_augqualqual_b1
  cefr_level: B1
  category: interagire_rituali_sociali
  label: Augurare qualcosa a qualcuno
  patterns:
  - I miei migliori auguri
  - Spero che proposizione
  - In bocca al lupo! (Crepi!) ¹
- id: intritsoc_augqualqual_b2
  cefr_level: B2
  category: interagire_rituali_sociali
  label: Augurare qualcosa a qualcuno
  patterns:
  - Mi auguro che proposizione
  - Altrettanto!
  examples:
  - Mi auguro che vada tutto bene.
- id: intritsoc_prendcong_a1
  cefr_level: A1
  category: interagire_rituali_sociali
  label: Prendere congedo
  description: Say goodbye in Italian using formal or informal farewells. Use 'Arrivederci'
    in formal settings and 'Ciao!' or 'Ci vediamo!' with friends.
  patterns:
  - Arrivederci / Buongiorno / buonasera / buonanotte
  - Ciao!/ Ci vediamo!
  - A …
  examples:
  - A presto! A dopo! A domani!
- id: intritsoc_prendcong_a2
  cefr_level: A2
  category: interagire_rituali_sociali
  label: Prendere congedo
  patterns:
  - Ci vediamo…
  examples:
  - Ci vediamo la settimana prossima
- id: intritsoc_prendcong_b1
  cefr_level: B1
  category: interagire_rituali_sociali
  label: Prendere congedo
  patterns:
  - È stato un piacere incontrarti
  - È stato un piacere conoscerti
- id: intritsoc_prendcong_b2
  cefr_level: B2
  category: interagire_rituali_sociali
  label: Prendere congedo
  patterns:
  - Fatti sentire!
  - Stammi bene!
- id: intritsoc_inttelrisp_a1
  cefr_level: A1
  category: interagire_rituali_sociali
  label: Interagire al telefono rispondendo
  description: Answer a phone call in Italian. Use <span lang='it'>Sì?</span> or similar short
    responses to pick up and signal you're ready to speak.
  patterns:
  - Sì?
  examples:
  - Sì?
  - Pronto?
  - Pronto, chi parla?
  - Sì, sono io.
  - Sì, pronto!
  - Pronto, casa Rossi.
- id: intritsoc_inttelrisp_a2
  cefr_level: A2
  category: interagire_rituali_sociali
  label: Interagire al telefono rispondendo
  patterns:
  - Pronto?
- id: intritsoc_inttelrisp_b2
  cefr_level: B2
  category: interagire_rituali_sociali
  label: Interagire al telefono rispondendo
  patterns:
  - Pronto / Buongiorno gruppo nominale¹
  examples:
  - Buongiorno, studio del dottor Donati,
  - desidera?
- id: intritsoc_inttelpres_a1
  cefr_level: A1
  category: interagire_rituali_sociali
  label: Interagire al telefono presentandosi
  description: Introduce yourself by name when answering or making a phone call. Use 'Sono
    [nome]' or state your full name to identify yourself.
  patterns:
  - (Sono) nome e cognome
  examples:
  - Pronto, sono Marco Rossi.
  - Buongiorno, sono Anna Bianchi.
  - Ciao, sono Luca!
  - Salve, sono la signora Ferretti.
  - Pronto? Sono Giovanni Marini, chiamo per un appuntamento.
  - Buonasera, sono Marta Conti dell'agenzia Sole.
- id: intritsoc_inttelparqual_a1
  cefr_level: A1
  category: interagire_rituali_sociali
  label: Interagire al telefono chiedendo di parlare con qualcuno
  description: Ask to speak with someone on the phone. Use 'C'è nome?' to ask if a person
    is available.
  patterns:
  - C’è nome ( cognome )?
  examples:
  - Pronto, c'è Marco?
  - Buongiorno, c'è la signora Ferretti?
  - Ciao, c'è Giulia?
  - Salve, c'è il dottor Bianchi?
  - Pronto, c'è Paolo Rossi, per favore?
- id: intritsoc_inttelparqual_a2
  cefr_level: A2
  category: interagire_rituali_sociali
  label: Interagire al telefono chiedendo di parlare con qualcuno
  patterns:
  - Posso / vorrei parlare con titolo / nome / cognome , per favore?
  - Parlo con…?
- id: intritsoc_inttelparqual_b1
  cefr_level: B1
  category: interagire_rituali_sociali
  label: Interagire al telefono chiedendo di parlare con qualcuno
  patterns:
  - Potrei / volevo parlare con titolo / nome / cognome , per favore?
- id: intritsoc_inttelparqual_b2
  cefr_level: B2
  category: interagire_rituali_sociali
  label: Interagire al telefono chiedendo di parlare con qualcuno
  patterns:
  - Potrebbe passarmi titolo / nome / cognome , per favore / cortesia?
- id: intritsoc_inttelinfint_a1
  cefr_level: A1
  category: interagire_rituali_sociali
  label: Interagire al telefono informandosi sull’identità dell’interlocutore
  description: Ask who is calling during a phone conversation. Use 'Chi è?' to find out the
    identity of the person on the line.
  patterns:
  - Chi è?
  examples:
  - — Pronto? — Chi è?
  - Scusi, chi è? Non ho capito il nome.
  - — Ciao! — Chi è? Non riconosco la voce.
  - Chi è, per favore? Vuole parlare con mia madre?
  - Aspetti un momento — chi è? — Sono Marco, il collega di Paolo.
- id: intritsoc_inttelinfint_b1
  cefr_level: B1
  category: interagire_rituali_sociali
  label: Interagire al telefono informandosi sull’identità dell’interlocutore
  patterns:
  - Con chi parlo, scusi?
  - Chi parla, prego?
- id: intritsoc_inttelinfint_b2
  cefr_level: B2
  category: interagire_rituali_sociali
  label: Interagire al telefono informandosi sull’identità dell’interlocutore
  patterns:
  - Chi devo dire?
- id: intritsoc_inttelfacatt_a1
  cefr_level: A1
  category: interagire_rituali_sociali
  label: Interagire al telefono facendo attendere
  description: Ask a phone caller to wait. Use 'Un momento' to put someone on hold briefly
    while you find a person or information.
  patterns:
  - Un momento
  examples:
  - <span lang="it">Un momento, per favore!</span>
  - <span lang="it">Un momento, la passo subito.</span>
  - <span lang="it">Un momento, chiamo il signor Rossi.</span>
  - <span lang="it">Un momento, non riesco a sentirla bene.</span>
  - <span lang="it">Un momento, sto cercando il numero.</span>
- id: intritsoc_inttelfacatt_b1
  cefr_level: B1
  category: interagire_rituali_sociali
  label: Interagire al telefono facendo attendere
  patterns:
  - Mi dispiace è occupato/a
- id: intritsoc_inttelfacatt_b2
  cefr_level: B2
  category: interagire_rituali_sociali
  label: Interagire al telefono facendo attendere
  patterns:
  - Mi dispiace è sull’altra linea
- id: intritsoc_inttelconconv_a1
  cefr_level: A1
  category: interagire_rituali_sociali
  label: Interagire al telefono concludendo la conversazione
  description: End a phone call politely. Use phrases like <span lang="it">Arrivederci</span>
    or <span lang="it">A presto</span> to say goodbye and close the conversation.
  patterns:
  - Arrivederci / Buongiorno / buonasera / buonanotte
  - Ciao!/ Ci vediamo!
  - A …
  examples:
  - A presto! A dopo! A domani!
- id: intritsoc_inttelconconv_a2
  cefr_level: A2
  category: interagire_rituali_sociali
  label: Interagire al telefono concludendo la conversazione
  patterns:
  - Scusi ho sbagliato (numero)
  - Ci sentiamo
- id: intritsoc_inttelconconv_b1
  cefr_level: B1
  category: interagire_rituali_sociali
  label: Interagire al telefono concludendo la conversazione
  patterns:
  - Grazie della telefonata.
- id: intritsoc_inttelconconv_b2
  cefr_level: B2
  category: interagire_rituali_sociali
  label: Interagire al telefono concludendo la conversazione
  patterns:
  - Grazie di aver chiamato/telefonato.
- id: intritsoc_intcoremail_a1
  cefr_level: A1
  category: interagire_rituali_sociali
  label: Interagire per corrispondenza iniziando una lettera / cartolina /messaggio / e-mail
  description: Opens a written message, letter, or email with the right greeting. Use phrases
    like <span lang="it">Caro Marco</span> or <span lang="it">Ciao</span> to address your
    reader appropriately.
  patterns:
  - Mio caro / mia cara Nome ( cognome )
  - Ciao
  - Caro Nome ( cognome )
  - Caro Titolo ( cognome )
  examples:
  - <span lang="it">Ciao Giulia, come stai?</span>
  - <span lang="it">Cara Anna, ti scrivo dalla Sicilia!</span>
  - <span lang="it">Caro Signor Rossi, Le scrivo per...</span>
  - <span lang="it">Mio caro Marco, sono a Parigi e penso a te.</span>
  - <span lang="it">Cara professoressa Bianchi, ho una domanda.</span>
  - <span lang="it">Caro Luca, come va?</span>
- id: intritsoc_intcoremail_b1
  cefr_level: B1
  category: interagire_rituali_sociali
  label: Interagire per corrispondenza iniziando una lettera / cartolina /messaggio / e-mail
  patterns:
  - Gentile / Egregio/a signore / signora ( nome / cognome )
  - Spettabile ditta
- id: intritsoc_intconcemail_a1
  cefr_level: A1
  category: interagire_rituali_sociali
  label: Interagire per corrispondenza concludendo una lettera / cartolina /messaggio / e-mail
  description: Sign off a letter, postcard, message, or email. Use warm closings like <span
    lang="it">A presto</span>, <span lang="it">Con affetto</span>, or <span lang="it">Baci</span>
    to end your message.
  patterns:
  - A presto / Baci / Con affetto / Un bacio
  - Ciao
  examples:
  - <span lang="it">A presto! Ciao, Marco</span>
  - <span lang="it">Un bacio grande. A presto, Giulia</span>
  - <span lang="it">Con affetto, la tua amica Sara</span>
  - <span lang="it">Baci a tutti! Ci vediamo presto. Luca</span>
  - <span lang="it">Ciao per ora! Un bacio, Marta</span>
  - <span lang="it">Con affetto e a presto, tua nonna Rosa</span>
- id: intritsoc_intconcemail_a2
  cefr_level: A2
  category: interagire_rituali_sociali
  label: Interagire per corrispondenza concludendo una lettera / cartolina /messaggio / e-mail
  patterns:
  - Cari saluti
  - Un abbraccio
  - Un bacione
- id: intritsoc_intconcemail_b1
  cefr_level: B1
  category: interagire_rituali_sociali
  label: Interagire per corrispondenza concludendo una lettera / cartolina /messaggio / e-mail
  patterns:
  - Con i miei più cari / affettuosi saluti
  - Cordiali / distinti saluti / cordialmente
  - Aspetto / attendo Sue / Vostre notizie
- id: intritsoc_intconcemail_b2
  cefr_level: B2
  category: interagire_rituali_sociali
  label: Interagire per corrispondenza concludendo una lettera / cartolina /messaggio / e-mail
  patterns:
  - In attesa di un Suo/ Vostro sollecito riscontro
  - Colgo l’occasione per porgere distinti saluti
- id: strutdisc_annarg_b1
  cefr_level: B1
  category: strutturare_discorso
  label: Annunciare l’inizio di un argomento
  patterns:
  - All’inizio…
  - Allora
  - Dunque
  - Prima di tutto….
- id: strutdisc_annarg_b2
  cefr_level: B2
  category: strutturare_discorso
  label: Annunciare l’inizio di un argomento
  patterns:
  - Innanzitutto / per cominciare... in seguito / poi /…
  - Parlerò dei seguenti punti / di nome …
  - Vedremo che proposizione
  - Prenderò in considerazione /… i seguenti punti /…
  - Parlerò di nome / proposizione
  - Concluderò / finirò proposizione
  - L’ultimo punto /… che prenderò in considerazione /
- id: strutdisc_intstoracane_b1
  cefr_level: B1
  category: strutturare_discorso
  label: Introdurre una storia, un racconto, un aneddoto
  patterns:
  - Ti racconto proposizione
  examples:
  - Ti racconto che cosa è successo a mio fratello.
- id: strutdisc_intstoracane_b2
  cefr_level: B2
  category: strutturare_discorso
  label: Introdurre una storia, un racconto, un aneddoto
  patterns:
  - Non so se lo sai, ma…
  - Tu non sai quello che mi è successo…
  - Non ti ho detto che proposizione
  - C’era una volta …
- id: strutdisc_intinf_a2
  cefr_level: A2
  category: strutturare_discorso
  label: Introdurre un’informazione
  patterns:
  - Sai che proposizione ?
  examples:
  - Sai che Mario è partito?
- id: strutdisc_intinf_b1
  cefr_level: B1
  category: strutturare_discorso
  label: Introdurre un’informazione
  patterns:
  - Sapevi che proposizione ?
  examples:
  - Sapevi che non c’è lezione oggi?
- id: strutdisc_intinf_b2
  cefr_level: B2
  category: strutturare_discorso
  label: Introdurre un’informazione
  patterns:
  - Ti informo che proposizione
  - Vorrei dire una parola a proposito di / su gruppo nominale
  - In quanto a gruppo nominale
  - E poi proposizione
  - A proposito di gruppo nominale
  - Per quanto riguarda gruppo nominale
  - Vorrei sottolineare / … che proposizione
  - Questo è l’argomento / l’aspetto /… che prenderò in considerazione
  - È noto /… che proposizione
  - È interessante notare / … che proposizione¹
  examples:
  - E poi per quel lavoro, hai pensato di rispondere all’annuncio?
- id: strutdisc_sviargenumer_a1
  cefr_level: A1
  category: strutturare_discorso
  label: Sviluppare un tema, un argomento, enumerando
  description: List items or ideas in sequence using 'e' (and) to link them. E.g. 'un letto,
    una sedia e un armadio' or 'caffè, cornetto e succo'.
  patterns:
  - Gruppo nominale e gruppo nominale
  examples:
  - In camera c’è un letto, una sedia e….
- id: strutdisc_sviargenumer_a2
  cefr_level: A2
  category: strutturare_discorso
  label: Sviluppare un tema, un argomento, enumerando
  patterns:
  - Prima…poi / allora /…
- id: strutdisc_sviargenumer_b1
  cefr_level: B1
  category: strutturare_discorso
  label: Sviluppare un tema, un argomento, enumerando
  patterns:
  - Primo proposizione , secondo proposizione , terzo proposizione …
  - Non solo… ma anche
  - …ed anche
  - inoltre
  - Infine
  - Finalmente
  - Alla fine
- id: strutdisc_sviargenumer_b2
  cefr_level: B2
  category: strutturare_discorso
  label: Sviluppare un tema, un argomento, enumerando
  patterns:
  - In primo luogo proposizione , in secondo luogo
  - proposizione , …
  - In conclusione, proposizione
  - Da un lato, … dall’altro …
  - Eccetera
- id: strutdisc_sviargclass_b2
  cefr_level: B2
  category: strutturare_discorso
  label: Sviluppare un tema, un argomento, classificando
  patterns:
  - Gruppo nominale appartiene a /… gruppo nominale
  - È un tipo di gruppo nominale
  - È dello stesso genere / tipo … di gruppo nominale
- id: strutdisc_sviargconfront_b1
  cefr_level: B1
  category: strutturare_discorso
  label: Sviluppare un tema, un argomento, confrontando
  patterns:
  - Gruppo nominale è ...come / quanto... gruppo nominale
  - Gruppo nominale è simile / uguale /… a gruppo nominale
  examples:
  - Mc Donald’s non è un ristorante caro come gli altri .
- id: strutdisc_sviargconfront_b2
  cefr_level: B2
  category: strutturare_discorso
  label: Sviluppare un tema, un argomento, confrontando
  patterns:
  - Si può confrontare / paragonare gruppo nominale a/con gruppo nominale
  - In confronto / rispetto a gruppo nominale
- id: strutdisc_svitemadesc_a1
  cefr_level: A1
  category: strutturare_discorso
  label: Sviluppare un tema, un argomento, descrivendo
  description: Develop a topic by describing it. Use '…è aggettivo…' or 'C'è…' to add descriptive
    details, e.g. 'La mia camera è grande' or 'C'è un parco vicino.'
  patterns:
  - …è aggettivo …
  - C’è gruppo nominale …
  examples:
  - La mia camera è grande.
- id: strutdisc_svitemadesc_a2
  cefr_level: A2
  category: strutturare_discorso
  label: Sviluppare un tema, un argomento, descrivendo
  patterns:
  - C’è gruppo nominale / gruppo preposizionale…
  examples:
  - Sulla parete del mio soggiorno ci sono due quadri e vicino al divano c’è un mobile antico.
- id: strutdisc_svitemadesc_b1
  cefr_level: B1
  category: strutturare_discorso
  label: Sviluppare un tema, un argomento, descrivendo
  patterns:
  - Proposizione ( o sequenza di proposizioni )
  examples:
  - Il mio appartamento si trovava in periferia e ci voleva mezz’ora per arrivare in centro.
- id: strutdisc_svitemadesc_b2
  cefr_level: B2
  category: strutturare_discorso
  label: Sviluppare un tema, un argomento, descrivendo
  patterns:
  - Proposizione ( o sequenza di proposizioni )¹
  - …come…²
  examples:
  - In fondo alla piazza c’è il duomo. A destra il museo e a sinistra la torre.
  - In primo piano la figura di donna, sullo sfondo il paesaggio.
  - Il quadro rappresenta un paesaggio.
  - Era bello come il sole.
- id: strutdisc_svitemaracc_a2
  cefr_level: A2
  category: strutturare_discorso
  label: Sviluppare un tema, un argomento, raccontando
  patterns:
  - Proposizione (o sequenza di proposizioni )
  - Proposizione (o sequenza di proposizioni )
  examples:
  - Ieri sono andato a scuola e poi sono andato in biblioteca.
  - Ora Luca abita a Londra, è sposato e ha due bambini.
- id: strutdisc_svitemaracc_b1
  cefr_level: B1
  category: strutturare_discorso
  label: Sviluppare un tema, un argomento, raccontando
  patterns:
  - Proposizione (o sequenza di proposizioni )
  - Gruppo nominale / pronome ha detto che proposizione
  examples:
  - Domenica scorsa mio fratello ha incontrato un suo vecchio amico mentre camminava sulla
    spiaggia.
  - Il professore ha detto che dobbiamo finire l’esercizio.
- id: strutdisc_svitemaracc_b2
  cefr_level: B2
  category: strutturare_discorso
  label: Sviluppare un tema, un argomento, raccontando
  patterns:
  - Gruppo nominale/pronome ha detto proposizione (verbo condizionale)
  - Si tratta/si parla di ...
  - Proposizione (o sequenza di proposizioni) presente narrativo¹
  - Proposizione (o sequenza di proposizioni) passato remoto
  examples:
  - Il professore ha detto che oggi non avrebbe fatto lezione.
- id: strutdisc_sotmetevid_b1
  cefr_level: B1
  category: strutturare_discorso
  label: Sottolineare, mettere in evidenza
  patterns:
  - '...particolarmente / proprio / veramente /....'
  examples:
  - Questa pasta è proprio buona.
- id: strutdisc_sotmetevid_b2
  cefr_level: B2
  category: strutturare_discorso
  label: Sottolineare, mettere in evidenza
  patterns:
  - È chiaro / evidente / certo che proposizione
  - Vorrei sottolineare / mettere in evidenza… il fatto che proposizione
  examples:
  - È chiaro che è una questione molto difficile.
- id: strutdisc_faretransarg_b2
  cefr_level: B2
  category: strutturare_discorso
  label: Fare una transizione, cambiare argomento
  patterns:
  - Passiamo ora al prossimo punto / argomento /… ¹
  - Un altro punto / argomento /… da considerare è gruppo nominale
  - Il punto / l’argomento /… seguente è gruppo nominale
  - Al contrario …
  - Per quanto riguarda gruppo nominale , proposizione
- id: strutdisc_proptemaarg_b1
  cefr_level: B1
  category: strutturare_discorso
  label: Proporre un nuovo tema, un nuovo argomento
  patterns:
  - Che ne pensi di gruppo nominale ?
  examples:
  - Che ne pensi del nuovo professore?
- id: strutdisc_proptemaarg_b2
  cefr_level: B2
  category: strutturare_discorso
  label: Proporre un nuovo tema, un nuovo argomento
  patterns:
  - A proposito, proposizione
  - A parte questo / gruppo nominale , proposizione
  - Passando ad altro, proposizione
  examples:
  - A proposito, quando parti?
  - A parte il rumore, com’è la tua camera?
  - Passando ad altro, che ne pensi del nuovo presidente?
- id: strutdisc_resptemarg_b2
  cefr_level: B2
  category: strutturare_discorso
  label: Respingere un tema, un argomento
  patterns:
  - Non ne parliamo più
  - Questo non c’entra niente
  - Questo non ha niente a che fare con proposizione
  - Parliamo d’altro che è meglio
- id: strutdisc_aprdigres_b2
  cefr_level: B2
  category: strutturare_discorso
  label: Aprire una digressione
  patterns:
  - Tra l’altro, …
  - Tra parentesi, …
  - A ( questo) proposito, …
  - Apro una parentesi
- id: strutdisc_chiudigres_b2
  cefr_level: B2
  category: strutturare_discorso
  label: Chiudere una digressione
  patterns:
  - Cosa stavo dicendo?
  - Quindi…. proposizione
  - Chiusa parentesi, proposizione
  - Chiudo la parentesi
- id: strutdisc_torntemtrat_b2
  cefr_level: B2
  category: strutturare_discorso
  label: Tornare su un tema, su un argomento già trattato
  patterns:
  - Riprendendo / continuando / … il discorso
  - Ritornando a gruppo nominale
  - Come dicevo / stavo dicendo, proposizione
  - Come ho detto prima
- id: strutdisc_daresemp_b1
  cefr_level: B1
  category: strutturare_discorso
  label: Dare un esempio
  patterns:
  - Per esempio, proposizione
  - È come gruppo nominale che…
  examples:
  - Per esempio, se spedisco questo pacco, quanto costa?
  - Sì, è come quella medicina che uso per il mal di testa.
- id: strutdisc_daresemp_b2
  cefr_level: B2
  category: strutturare_discorso
  label: Dare un esempio
  patterns:
  - Ti faccio un esempio, …
  - Per fare un esempio, proposizione
- id: strutdisc_rifopialtrui_b1
  cefr_level: B1
  category: strutturare_discorso
  label: Riferire opinioni altrui
  patterns:
  - Gruppo nominale dice / pensa /… che
  - Gruppo nominale spera che .. proposizione
  examples:
  - Mio padre dice che Roma è una città molto bella.
- id: strutdisc_rifopialtrui_b2
  cefr_level: B2
  category: strutturare_discorso
  label: Riferire opinioni altrui
  patterns:
  - Gruppo nominale afferma / … che proposizione
  - Si dice / dicono che proposizione
- id: strutdisc_citare_b2
  cefr_level: B2
  category: strutturare_discorso
  label: Citare
  patterns:
  - 'Cito : “…”'
  - Nome afferma / sottolinea / … che “ …”
  - Come afferma / sottolinea / … gruppo nominale “…”
- id: strutdisc_riassumere_b1
  cefr_level: B1
  category: strutturare_discorso
  label: Riassumere
  patterns:
  - Insomma, …
  examples:
  - C’era tanta gente e tante cose buone da mangiare, insomma una bella festa!
- id: strutdisc_riassumere_b2
  cefr_level: B2
  category: strutturare_discorso
  label: Riassumere
  patterns:
  - Riassumendo…
  - In breve, ..
  - In poche parole, …
- id: strutdisc_corriprend_a1
  cefr_level: A1
  category: strutturare_discorso
  label: Correggersi, riprendersi
  description: Use this to correct yourself mid-sentence. Say <span lang="it">no</span> or
    <span lang="it">scusi/scusa</span> to signal you are starting over, e.g. <span lang="it">Vorrei
    una matita… no, una penna.</span>
  patterns:
  - … no …
  - …scusi/scusa …¹
  examples:
  - Vorrei una matita, … no, una penna.
  - Vorrei una matita,… scusi, una penna.
- id: strutdisc_corriprend_a2
  cefr_level: A2
  category: strutturare_discorso
  label: Correggersi, riprendersi
  patterns:
  - ….no (scusa / scusi), non
  - …ma …
  examples:
  - Vorrei un etto di formaggio, no scusi non un etto ma due.
- id: strutdisc_corriprend_b2
  cefr_level: B2
  category: strutturare_discorso
  label: Correggersi, riprendersi
  patterns:
  - … o per essere più precisi …
  - … o più esattamente …
  - …precisamente …
  - …anzi …
- id: strutdisc_cerparfrase_a1
  cefr_level: A1
  category: strutturare_discorso
  label: Cercare una parola o una frase
  description: Ask what something is called in Italian using gestures. Use 'Come si dice?'
    or 'Come si chiama?' when you don't know the word for something.
  patterns:
  - Come si dice? ( con supporto gestuale )
  - Come si chiama? ( con supporto gestuale )
  examples:
  - Come si dice? (indica la finestra)
  - Come si chiama questo? (indica il menu sul tavolo)
  - Scusi, come si dice in italiano? (indica la borsa)
  - Come si chiama quella cosa lì? (indica il semaforo)
  - Come si dice 'apple' in italiano?
  - Come si chiama? Non ricordo la parola. (indica il dizionario)
- id: strutdisc_cerparfrase_a2
  cefr_level: A2
  category: strutturare_discorso
  label: Cercare una parola o una frase
  patterns:
  - …come si dice / come si chiama…?
  - …. non so le parole…
  examples:
  - Io ho un…come si chiama il marito di mia sorella?
- id: strutdisc_cerparfrase_b2
  cefr_level: B2
  category: strutturare_discorso
  label: Cercare una parola o una frase
  patterns:
  - Non mi viene in mente
- id: strutdisc_sostppartout_a2
  cefr_level: A2
  category: strutturare_discorso
  label: Sostituire una parola dimenticata o sconosciuta con un nome o una parola passe-partout
  patterns:
  - …cosa / persona / oggetto…
  examples:
  - È la cosa che uso per aprire la bottiglia.
- id: strutdisc_sostppartout_b1
  cefr_level: B1
  category: strutturare_discorso
  label: Sostituire una parola dimenticata o sconosciuta con un nome o una parola passe-partout
  patterns:
  - … qualcosa …
  examples:
  - Dottore, vorrei qualcosa per il mal di testa.
- id: strutdisc_chiedespres_a1
  cefr_level: A1
  category: strutturare_discorso
  label: Chiedere aiuto a proposito di una parola, di una espressione
  description: Ask how to say a word or phrase in Italian. Use 'Come si dice … in italiano?'
    to get the translation you need.
  patterns:
  - Come si dice …, in …?
  examples:
  - Come si dice [espressione in lingua madre] in italiano?
- id: strutdisc_chiedespres_a2
  cefr_level: A2
  category: strutturare_discorso
  label: Chiedere aiuto a proposito di una parola, di una espressione
  patterns:
  - In ..si dice …?
  - Non so come si dice …
  examples:
  - In italiano si dice “monumento”?
- id: strutdisc_chiedespres_b1
  cefr_level: B1
  category: strutturare_discorso
  label: Chiedere aiuto a proposito di una parola, di una espressione
  patterns:
  - Non mi ricordo / Ho dimenticato la parola per…
  - In italiano qual è la parola per ……
  examples:
  - In italiano, qual è la parola per [parola in lingua madre]?
- id: strutdisc_concdisc_b1
  cefr_level: B1
  category: strutturare_discorso
  label: Concludere un discorso
  patterns:
  - Insomma, …
  - (E) allora, quindi, dunque …
  - Infine, …
- id: strutdisc_concdisc_b2
  cefr_level: B2
  category: strutturare_discorso
  label: Concludere un discorso
  patterns:
  - Di conseguenza, …
  - E questo è tutto
  - Concludo …
  - Ho concluso (grazie)
  - In conclusione, …Per concludere / finire
  - Grazie per la vostra attenzione¹
  - Speriamo che vada tutto bene²
  - (Mah) vedremo³
- id: strintverb_comconv_b1
  cefr_level: B1
  category: strutturare_interazione_verbale
  label: Cominciare una conversazione
  patterns:
  - Ecco, proposizione
  - Allora, dunque
  - Beh, proposizione
- id: strintverb_comconv_b2
  cefr_level: B2
  category: strutturare_interazione_verbale
  label: Cominciare una conversazione
  patterns:
  - Vorrei parlarti di gruppo nominale
  - Posso parlarti di gruppo nominale ?
  - Hai un minuto?
  - Ho bisogno di parlarti
- id: strintverb_preparconv_b1
  cefr_level: B1
  category: strutturare_interazione_verbale
  label: Prendere la parola nel corso di una conversazione
  patterns:
  - Beh,
  - Secondo me, …
- id: strintverb_preparconv_b2
  cefr_level: B2
  category: strutturare_interazione_verbale
  label: Prendere la parola nel corso di una conversazione
  patterns:
  - Io voglio dire che proposizione
  - Io penso / credo / … gruppo nominale / che proposizione
  - A mio parere, …
  - Beh, guarda,
  - Ascolta, …
- id: strintverb_chiupar_b1
  cefr_level: B1
  category: strutturare_interazione_verbale
  label: Chiedere la parola
  patterns:
  - Vorrei dire una cosa
  - Potrei dire una cosa?
- id: strintverb_chiupar_b2
  cefr_level: B2
  category: strutturare_interazione_verbale
  label: Chiedere la parola
  patterns:
  - Posso / potrei prendere la parola / intervenire?¹
- id: strintverb_ripparinter_b1
  cefr_level: B1
  category: strutturare_interazione_verbale
  label: Riprendere la parola dopo essere stati interrotti
  patterns:
  - (Solo) un minuto/secondo, per favore
  - Per favore¹
- id: strintverb_ripparinter_b2
  cefr_level: B2
  category: strutturare_interazione_verbale
  label: Riprendere la parola dopo essere stati interrotti
  patterns:
  - Lasciami finire, per favore
  - Non mi interrompere, per favore
  - Devo dire/aggiungere un’ultima cosa
- id: strintverb_impqualparl_b2
  cefr_level: B2
  category: strutturare_interazione_verbale
  label: Impedire a qualcuno di parlare
  patterns:
  - Basta!
  - (Sta’) zitto!
  - (Fa’) silenzio!¹
  - Silenzio, per favore
- id: strintverb_asscapsegue_a2
  cefr_level: A2
  category: strutturare_interazione_verbale
  label: Assicurarsi che l’interlocutore abbia capito bene chiedendogli se capisce o sta seguendo
  patterns:
  - Capisci?
  - (Hai) capito?
- id: strintverb_asscapsegue_b1
  cefr_level: B1
  category: strutturare_interazione_verbale
  label: Assicurarsi che l’interlocutore abbia capito bene chiedendogli se capisce o sta seguendo
  patterns:
  - È (tutto) chiaro?
  - Capisci quello che voglio dire?
- id: strintverb_asscapsegue_b2
  cefr_level: B2
  category: strutturare_interazione_verbale
  label: Assicurarsi che l’interlocutore abbia capito bene chiedendogli se capisce o sta seguendo
  patterns:
  - Mi segui?
- id: strintverb_assparespres_a2
  cefr_level: A2
  category: strutturare_interazione_verbale
  label: Assicurarsi che l’interlocutore abbia capito bene definendo una parola, un’espressione
  patterns:
  - Gruppo nominale è …
  examples:
  - La sorella di mio padre è mia zia.
- id: strintverb_assparespres_b1
  cefr_level: B1
  category: strutturare_interazione_verbale
  label: Assicurarsi che l’interlocutore abbia capito bene definendo una parola, un’espressione
  patterns:
  - Gruppo nominale è come gruppo nominale
  - '..., è un / il nome proposizione relativa'
  - …, è quando proposizione
  - …, è per proposizione infinitiva
  examples:
  - Il giornalista è la persona che scrive sui giornali.
- id: strintverb_assattparaf_b1
  cefr_level: B1
  category: strutturare_interazione_verbale
  label: Assicurarsi che l’interlocutore abbia capito bene attraverso una parafrasi
  patterns:
  - … cioè …
  - …(questo) significa / vuol dire che …
  - …, dunque …
  - Voglio dire che
- id: strintverb_assattparaf_b2
  cefr_level: B2
  category: strutturare_interazione_verbale
  label: Assicurarsi che l’interlocutore abbia capito bene attraverso una parafrasi
  patterns:
  - …in altre parole …
  - … vale a dire (che) …
  - …, con questo voglio dire che …
  - Mi spiego (meglio), …
  - … ovvero….
- id: strintverb_asstradpar_a2
  cefr_level: A2
  category: strutturare_interazione_verbale
  label: Assicurarsi che l’interlocutore abbia capito bene traducendo una parola
  patterns:
  - … significa …
  - In [ lingua ], … si dice …
- id: strintverb_asstradpar_b1
  cefr_level: B1
  category: strutturare_interazione_verbale
  label: Assicurarsi che l’interlocutore abbia capito bene traducendo una parola
  patterns:
  - … si traduce …
  - … vuol dire ….
- id: strintverb_asscapbenesil_a1
  cefr_level: A1
  category: strutturare_interazione_verbale
  label: Assicurarsi che l’interlocutore abbia capito bene sillabando
  description: Spell out a word letter by letter or syllable by syllable so the listener understands
    correctly. Use patterns like <span lang="it">C-A-N-E</span> or <span lang="it">… si scrive
    …</span>.
  patterns:
  - '[Pronunciando la sequenza di lettere]'
  - '[Sillabando]'
  - … si scrive …
  examples:
  - C (ci)-A-N (enne)-E
  - CA- NE
  - Mamma si scrive M (emme) A doppia M (emme) A
- id: strintverb_assfacpres_a1
  cefr_level: A1
  category: strutturare_interazione_verbale
  label: Assicurarsi di aver capito bene l’interlocutore facendoglielo presente
  description: Signal that you didn't understand by saying 'Scusa? Come? Non ho capito.' Keeps
    the conversation going when something is unclear.
  patterns:
  - Scusa / scusi?¹ Come? / Cosa? / Che?
  - Non ho capito
  examples:
  - — Il treno parte alle diciassette e quarantadue. — Scusa? Non ho capito.
  - — Devi prendere la seconda strada a sinistra. — Come? Puoi ripetere?
  - — Il suo nome è Bartholomew. — Scusi? Cosa ha detto?
  - — La riunione è domani mattina presto. — Che? Non ho capito bene.
  - — Vai sempre dritto fino al semaforo. — Scusa, non ho capito. Puoi ripetere?
  - — Il prezzo totale è cinquantasette euro. — Come? Non ho capito il prezzo.
- id: strintverb_assfacpres_a2
  cefr_level: A2
  category: strutturare_interazione_verbale
  label: Assicurarsi di aver capito bene l’interlocutore facendoglielo presente
  patterns:
  - Che cosa hai/ha detto?
  - Come?
  - Non è chiaro
  - Non capisco
- id: strintverb_assfacpres_b1
  cefr_level: B1
  category: strutturare_interazione_verbale
  label: Assicurarsi di aver capito bene l’interlocutore facendoglielo presente
  patterns:
  - Cioè?
  - Non capisco/non ho capito cosa vuoi dire
  - Eh?¹
- id: strintverb_assfacpres_b2
  cefr_level: B2
  category: strutturare_interazione_verbale
  label: Assicurarsi di aver capito bene l’interlocutore facendoglielo presente
  patterns:
  - Non ti seguo
  - Scusa che vuoi dire con gruppo nominale ?
  - Prego?
  - In che senso?
- id: strintverb_asschiedrip_a1
  cefr_level: A1
  category: strutturare_interazione_verbale
  label: Assicurarsi di aver capito bene l’interlocutore chiedendogli di ripetere
  description: Ask someone to repeat what they said to make sure you understood. Use <span
    lang="it">Scusa/Scusi?</span> or <span lang="it">Puoi/Può ripetere, per favore?</span>
  patterns:
  - Scusa /Scusi?¹ / Puoi / può ripetere, per favore?
  - '¹ Nota: uso formulaico'
  examples:
  - — <span lang="it">Il treno parte alle diciassette e quarantadue.</span> — <span lang="it">Scusa?
    Puoi ripetere, per favore?</span>
  - <span lang="it">Scusi, non ho capito. Può ripetere, per favore?</span>
  - — <span lang="it">Mi chiamo Wojciech.</span> — <span lang="it">Scusa? Come?</span>
  - <span lang="it">Puoi ripetere, per favore? Non ho sentito bene.</span>
  - — <span lang="it">La farmacia è in via Garibaldi, al numero dodici.</span> — <span lang="it">Scusi,
    può ripetere? Grazie.</span>
- id: strintverb_asschiedrip_a2
  cefr_level: A2
  category: strutturare_interazione_verbale
  label: Assicurarsi di aver capito bene l’interlocutore chiedendogli di ripetere
  patterns:
  - Scusa, come / cosa hai detto / dici / ?
- id: strintverb_asschiedrip_b2
  cefr_level: B2
  category: strutturare_interazione_verbale
  label: Assicurarsi di aver capito bene l’interlocutore chiedendogli di ripetere
  patterns:
  - Mi potresti dire / spiegare il significato di …?
  - Prego?
  examples:
  - Mi potresti spiegare il significato di “ “?
- id: strintverb_asschiedscrive_a1
  cefr_level: A1
  category: strutturare_interazione_verbale
  label: Assicurarsi di aver capito bene l’interlocutore chiedendogli come si scrive
  description: Ask how a word is spelled to make sure you understood correctly. Use 'Come
    si scrive …?' or 'Come si scrive questa parola?' when you need clarification.
  patterns:
  - Come si scrive …?
  - Come si scrive questa parola?
  examples:
  - Scusi, come si scrive il suo cognome?
  - Come si scrive questa parola? Non capisco.
  - Come si scrive 'zaino'? Con la zeta?
  - Mi può dire come si scrive il nome della via?
  - Come si scrive 'spaghetti'? Con una 'g' o due?
- id: strintverb_asschiedparlent_a1
  cefr_level: A1
  category: strutturare_interazione_verbale
  label: Assicurarsi di aver capito bene l’interlocutore chiedendogli di parlare lentamente
  description: Ask someone to slow down so you can understand them. Use phrases like 'Puoi
    parlare più piano, per favore?' or simply 'Più piano!'
  patterns:
  - Puoi parlare più piano, per favore?
  - Piano! / Più piano!
  - Più piano, per favore
  examples:
  - Scusa, puoi parlare più piano, per favore? Non capisco bene.
  - Più piano, per favore! Sto imparando l'italiano.
  - Piano! Parli troppo veloce per me.
  - Può parlare più piano, per favore? Sono straniero.
  - Più piano, grazie! Così capisco meglio.
  - Scusi, può parlare un po' più piano? Non ho capito.
- id: strintverb_asschieddefparaf_a1
  cefr_level: A1
  category: strutturare_interazione_verbale
  label: Assicurarsi di aver capito bene l’interlocutore chiedendogli una definizione, una
    parafrasi
  description: Ask for a definition or paraphrase to make sure you understood a word or phrase.
    Use 'Che cos'è…?' or 'Cosa significa…?' to clarify meaning.
  patterns:
  - Che cos’è / sono …?
  - Che / Cosa significa?
  examples:
  - Che cos’è “la sala da pranzo”?
- id: strintverb_asschieddefparaf_a2
  cefr_level: A2
  category: strutturare_interazione_verbale
  label: Assicurarsi di aver capito bene l’interlocutore chiedendogli una definizione, una
    parafrasi
  patterns:
  - Che significa …?
  examples:
  - Scusa, che significa “divieto di fermata”?
- id: strintverb_asschieddefparaf_b1
  cefr_level: B1
  category: strutturare_interazione_verbale
  label: Assicurarsi di aver capito bene l’interlocutore chiedendogli una definizione, una
    parafrasi
  patterns:
  - Che vuol dire ...? ..., che vuol dire ?
- id: strintverb_asschiedconfer_a2
  cefr_level: A2
  category: strutturare_interazione_verbale
  label: Assicurarsi di aver capito bene l’interlocutore chiedendogli una conferma
  patterns:
  - Hai / ha detto …
  examples:
  - Scusa, hai detto “il sedici aprile?”
- id: strintverb_assvercap_b1
  cefr_level: B1
  category: strutturare_interazione_verbale
  label: Assicurarsi di aver capito bene l’interlocutore verificando ciò che si è capito
  patterns:
  - Vuoi dire che proposizione?
  examples:
  - Mamma, vuoi dire che non mi posso alzare ancora per una settimana?
- id: strintverb_assvercap_b2
  cefr_level: B2
  category: strutturare_interazione_verbale
  label: Assicurarsi di aver capito bene l’interlocutore verificando ciò che si è capito
  patterns:
  - Ti riferisci a gruppo nominale ?
  - Dunque…?
  examples:
  - Scusa, ti riferisci al mio conto corrente?
  - Dunque dobbiamo fare la denuncia alla polizia?
- id: strintverb_cedparola_a2
  cefr_level: A2
  category: strutturare_interazione_verbale
  label: Cedere la parola
  patterns:
  - Non so
- id: strintverb_cedparola_b1
  cefr_level: B1
  category: strutturare_interazione_verbale
  label: Cedere la parola
  patterns:
  - E secondo te?
  - Tu che ne dici?
  examples:
