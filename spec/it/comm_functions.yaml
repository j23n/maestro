    drinks, or other items.
  patterns:
  - Vuoi gruppo nominale ?
  - Prendi gruppo nominale ?
  examples:
  - Vuoi un bicchiere d’acqua?
  - Prendi un caffè?
- id: intazio_offrqualc_a2
  cefr_level: A2
  category: interagire_attivita_azioni
  label: Offrire qualcosa a qualcuno
  patterns:
  - Posso offrirti gruppo nominale ?
  - Hai voglia di gruppo nominale ?
  - Ancora gruppo nominale ?
- id: intazio_offrqualc_b1
  cefr_level: B1
  category: interagire_attivita_azioni
  label: Offrire qualcosa a qualcuno
  patterns:
