- id: intazio_rispricrif_a1
  cefr_level: A1
  category: interagire_attivita_azioni
  label: Rispondere a una richiesta rifiutando
  description: Decline a request politely or directly. Use 'No' or short phrases like <span
    lang="it">Mi dispiace, non posso</span> to turn someone down.
  patterns:
  - 'No'
  examples:
  - <span lang="it">— Puoi aiutarmi? — No, mi dispiace.</span>
  - <span lang="it">— Hai un momento? — No, non ho tempo adesso.</span>
  - <span lang="it">— Mi dai il tuo numero? — No, mi dispiace.</span>
  - <span lang="it">— Puoi venire domani? — No, non posso.</span>
  - <span lang="it">— Mi presti la penna? — No, mi dispiace, non ce l'ho.</span>
- id: intazio_rispricrif_a2
  cefr_level: A2
  category: interagire_attivita_azioni
  label: Rispondere a una richiesta rifiutando
  patterns:
  - Mi dispiace, ma …
  - Non posso
  examples:
  - Mi dispiace, ma non posso.
- id: intazio_rispricrif_b1
  cefr_level: B1
  category: interagire_attivita_azioni
  label: Rispondere a una richiesta rifiutando
  patterns:
  - È vietato proposizione infinitiva
  - Non si deve proposizione infinitiva
  - Non bisogna proposizione infinitiva
  examples:
  - È vietato parcheggiare qui.
- id: intazio_proqualins_a1
  cefr_level: A1
  category: interagire_attivita_azioni
  label: Proporre a qualcuno di fare qualcosa insieme
