  - Se vuoi un consiglio, proposizione
  - Ti do un consiglio, proposizione imperativa
  examples:
  - Se fossi in te, io non glielo chiederei un’altra volta.
  - Faresti meglio a non uscire con questo freddo.
  - Sarebbe meglio se ci andassi tu.
  - Se vuoi un consiglio, dovresti lasciar perdere subito.
  - Ti do un consiglio, pensaci bene prima di lasciare questo lavoro.
