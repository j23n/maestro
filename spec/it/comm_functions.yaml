- id: intemo_insultare_b2
  cefr_level: B2
  category: interagire_emozioni_sentimenti
  label: Insultare
  patterns:
  - Va’ al diavolo / a quel paese!¹
- id: intemo_imprecare_b2
  cefr_level: B2
  category: interagire_emozioni_sentimenti
  label: Imprecare
  patterns:
  - Accidenti!
  - Porca miseria!¹
- id: intemo_espintqualc_a1
  cefr_level: A1
  category: interagire_emozioni_sentimenti
  label: Esprimere interesse per qualcosa
  description: Express that something caught your attention or fascinates you. Use 'Interessante!'
    or similar short reactions to show curiosity.
  patterns:
  - Interessante!
  examples:
  - Interessante! Non lo sapevo.
  - — Studio il giapponese. — Davvero? Interessante!
  - Questo museo è molto interessante.
  - Che interessante! Puoi ripetere?
  - — Lavoro come architetto. — Oh, interessante!
- id: intemo_espintqualc_a2
  cefr_level: A2
  category: interagire_emozioni_sentimenti
  label: Esprimere interesse per qualcosa
  patterns:
  - Gruppo nominale è interessante
  examples:
  - Questo libro è interessante.
- id: intemo_espintqualc_b1
  cefr_level: B1
  category: interagire_emozioni_sentimenti
  label: Esprimere interesse per qualcosa
  patterns:
  - Mi interesso di gruppo nominale
  - Sono (veramente / molto) appassionato di gruppo nominale
  - Amo proposizione infinitiva
  - Mi interessa gruppo nominale / proposizione infinitiva
  examples:
  - Mi interesso di archeologia.
  - Amo leggere poesie.
  - Mi interessano le lezioni di arte.
- id: intemo_espintqualc_b2
  cefr_level: B2
  category: interagire_emozioni_sentimenti
  label: Esprimere interesse per qualcosa
  patterns:
  - Adoro gruppo nominale
  examples:
  - Adoro leggere poesie.
- id: intemo_espintperqualc_a2
  cefr_level: A2
  category: interagire_emozioni_sentimenti
  label: Esprimere interesse per ciò che dice qualcuno
  patterns:
  - Veramente?
  - È vero?
  - Ah sì?
- id: intemo_espintperqualc_b1
  cefr_level: B1
  category: interagire_emozioni_sentimenti
  label: Esprimere interesse per ciò che dice qualcuno
  patterns:
  - Davvero?
  - È veramente interessante.
- id: intemo_espsorpresa_a2
  cefr_level: A2
  category: interagire_emozioni_sentimenti
  label: Esprimere sorpresa
  patterns:
  - Che sorpresa!
  - Sei sicuro?
- id: intemo_espsorpresa_b1
  cefr_level: B1
  category: interagire_emozioni_sentimenti
  label: Esprimere sorpresa
  patterns:
  - Davvero?
  - Non ci credo!
  - Non ci posso credere!
  - Non è possibile!
  - È incredibile!¹
- id: intemo_espsorpresa_b2
  cefr_level: B2
  category: interagire_emozioni_sentimenti
  label: Esprimere sorpresa
  patterns:
  - Scherzi? Stai scherzando?
  - Dici sul serio?
  - Pazzesco!
  - Non è vero!¹
  - Ah!
  - Uh!²
  - (Questo) non me l’aspettavo!
- id: intemo_espnonsorpresi_a2
  cefr_level: A2
  category: interagire_emozioni_sentimenti
  label: Esprimere il fatto di non essere sorpresi
  patterns:
  - (Sì), lo so.
- id: intemo_espnonsorpresi_b1
  cefr_level: B1
  category: interagire_emozioni_sentimenti
  label: Esprimere il fatto di non essere sorpresi
  patterns:
  - (Sì), lo sapevo.
  - Era sicuro
- id: intemo_espnonsorpresi_b2
  cefr_level: B2
  category: interagire_emozioni_sentimenti
  label: Esprimere il fatto di non essere sorpresi
  patterns:
  - Sono al corrente
  - Me lo aspettavo
  - Era evidente
- id: intemo_espindiffer_a2
  cefr_level: A2
  category: interagire_emozioni_sentimenti
  label: Esprimere indifferenza
  patterns:
  - È lo stesso
  - Non è importante
- id: intemo_espindiffer_b1
  cefr_level: B1
  category: interagire_emozioni_sentimenti
  label: Esprimere indifferenza
  patterns:
  - Non mi interessa / importa
- id: intemo_espindiffer_b2
  cefr_level: B2
  category: interagire_emozioni_sentimenti
  label: Esprimere indifferenza
  patterns:
  - “Boh”
  - E allora?
  - (Mi) è indifferente
  - Come vuoi
  - Me ne frego
  - Non me ne frega niente
- id: intemo_espgratring_a1
  cefr_level: A1
  category: interagire_emozioni_sentimenti
  label: Esprimere gratitudine, ringraziare
  description: Express thanks or gratitude. Use <span lang="it">Grazie</span> or <span lang="it">Grazie
    mille</span> to thank someone in everyday situations.
  patterns:
  - Grazie (mille)
  examples:
  - <span lang="it">Grazie mille per il regalo!</span>
  - <span lang="it">Grazie, sei molto gentile.</span>
  - <span lang="it">— Ecco il tuo caffè. — Grazie!</span>
  - <span lang="it">Grazie mille, professore.</span>
  - <span lang="it">— Ti aiuto con la valigia. — Oh, grazie mille!</span>
- id: intemo_espgratring_a2
  cefr_level: A2
  category: interagire_emozioni_sentimenti
  label: Esprimere gratitudine, ringraziare
  patterns:
  - (Molte/mille/tante) grazie (molte/mille/tante) per gruppo nominale
  examples:
  - Molte grazie per la tua cartolina.
- id: intemo_espgratring_b1
  cefr_level: B1
  category: interagire_emozioni_sentimenti
  label: Esprimere gratitudine, ringraziare
  patterns:
  - Ti ringrazio per gruppo nominale
  examples:
  - Ti ringrazio per il bel regalo.
- id: intemo_espgratring_b2
  cefr_level: B2
  category: interagire_emozioni_sentimenti
  label: Esprimere gratitudine, ringraziare
  patterns:
  - Essere gentile a proposizione infinitiva
  - Ti ringrazio (di cuore) per proposizione infinitiva
  examples:
  - Sei veramente gentile ad avermi telefonato.
  - Ti ringrazio di cuore per aver ospitato mia figlia.
- id: intemo_rispringr_a1
  cefr_level: A1
  category: interagire_emozioni_sentimenti
  label: Rispondere ad un ringraziamento
  description: Respond when someone thanks you. Use 'Prego' and similar phrases to acknowledge
    gratitude politely.
  patterns:
  - Prego
  examples:
  - — Grazie mille! — Prego!
  - — Grazie per l'aiuto. — Prego, non c'è problema!
  - — Grazie, sei gentile. — Ma prego, figurati!
  - — Grazie tante, signora. — Prego, s'immagini!
  - — Grazie! — Di niente!
- id: intemo_rispringr_b1
  cefr_level: B1
  category: interagire_emozioni_sentimenti
  label: Rispondere ad un ringraziamento
  patterns:
  - Di niente
- id: intemo_rispringr_b2
  cefr_level: B2
  category: interagire_emozioni_sentimenti
  label: Rispondere ad un ringraziamento
  patterns:
  - Non c’è di che¹
- id: intazio_chiordistr_a2
  cefr_level: A2
  category: interagire_attivita_azioni
  label: Chiedere a qualcuno di fare qualcosa impartendo un ordine o un’istruzione
  patterns:
  - Proposizione imperativa (solo in contesto informale)
  examples:
  - Prendi / leggi qui.
- id: intazio_chiordistr_b1
  cefr_level: B1
  category: interagire_attivita_azioni
  label: Chiedere a qualcuno di fare qualcosa impartendo un ordine o un’istruzione
  patterns:
  - Proposizione imperativa
  examples:
  - Vada dritto e poi giri a destra.
- id: intazio_chiordistr_b2
  cefr_level: B2
  category: interagire_attivita_azioni
  label: Chiedere a qualcuno di fare qualcosa impartendo un ordine o un’istruzione
  patterns:
  - È necessario / bisogna proposizione infinitiva /
  - proposizione
  - ', prego'
  - Pronome ordino di proposizione infinitiva
  examples:
  - Bisogna rispettare queste regole.
  - È necessario che tu ti iscriva al corso.
- id: intazio_chiaatqualfare_a2
  cefr_level: A2
  category: interagire_attivita_azioni
  label: Chiedere in modo attenuato a qualcuno di fare qualcosa
  patterns:
  - Puoi verbo infinito (per favore)?
  examples:
  - Puoi chiudere la finestra?
- id: intazio_chiaatqualfare_b1
  cefr_level: B1
  category: interagire_attivita_azioni
  label: Chiedere in modo attenuato a qualcuno di fare qualcosa
  patterns:
  - Potresti verbo infinito (per favore)?
  examples:
  - Potresti chiudere la finestra?
  - Mi daresti la tua penna?
- id: intazio_chiaatqualfare_b2
  cefr_level: B2
  category: interagire_attivita_azioni
  label: Chiedere in modo attenuato a qualcuno di fare qualcosa
  patterns:
  - Sarebbe / è possibile proposizione infinitiva
  - Potrei domandarti di proposizione infinitiva
  - Ti dispiacerebbe proposizione infinitiva
  examples:
  - Sarebbe possibile chiudere la finestra?
  - Ti dispiacerebbe chiudere la finestra?
- id: intazio_chiqualsupplic_b1
  cefr_level: B1
  category: interagire_attivita_azioni
  label: Chiedere a qualcuno di fare qualcosa supplicando
  patterns:
  - Ti prego / per favore, proposizione imperativa!
  examples:
  - Ti prego, aiutami!
- id: intazio_chiqualsupplic_b2
  cefr_level: B2
  category: interagire_attivita_azioni
  label: Chiedere a qualcuno di fare qualcosa supplicando
  patterns:
  - Ti prego di proposizione infinitiva
  examples:
  - Ti prego di non dire questa cosa a Maria.
- id: intazio_chiincserv_a1
  cefr_level: A1
  category: interagire_attivita_azioni
  label: Chiedere a qualcuno di fare qualcosa in un incontro di servizio (es. negozio, bar,
    ristorante, ecc.)
  description: Ask for something in a shop, bar, or restaurant. Use patterns like 'Due caffè,
    per favore' or 'Vorrei gruppo nominale, per favore' to place an order or make a request.
  patterns:
  - Gruppo nominale , per favore
  - Io prendo gruppo nominale
  - Vorrei gruppo nominale , per favore
  examples:
  - Due caffè, per favore.
  - Io prendo la pasta al pomodoro.
- id: intazio_chiincserv_b1
  cefr_level: B1
  category: interagire_attivita_azioni
  label: Chiedere a qualcuno di fare qualcosa in un incontro di servizio (es. negozio, bar,
    ristorante, ecc.)
  patterns:
  - Volevo verbo infinito
  - Io prenderei gruppo nominale
  examples:
  - Volevo due etti di prosciutto, grazie.
  - Io prenderei la pizza margherita.
- id: intazio_rispaccsenris_a1
  cefr_level: A1
  category: interagire_attivita_azioni
  label: Rispondere a una richiesta accettando senza riserve
  description: Accept a request without hesitation. Use simple affirmatives like <span lang="it">Sì</span>
    or <span lang="it">Certo!</span> to show you agree to do what someone has asked.
  patterns:
  - Sì
  examples:
  - — Puoi aprire la finestra? — Sì, certo!
  - — Mi passi il sale, per favore? — Sì, ecco a lei.
  - — Puoi aspettare un momento? — Sì, nessun problema.
  - — Mi aiuti con i bagagli? — Sì, volentieri!
  - — Può portarmi un bicchiere d'acqua? — Sì, subito!
  - — Puoi ripetere, per favore? — Sì, certo, con piacere.
