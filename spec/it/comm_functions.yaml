  - Perdonami se insisto.
  - Ti chiedo scusa per il mio comportamento.
- id: intritsoc_attattenz_a1
  cefr_level: A1
  category: interagire_rituali_sociali
  label: Attirare l’attenzione
  patterns:
  - Scusi / Scusa¹ / Signore / Signora
  - '¹ Nota: uso formulaico'
- id: intritsoc_attattenz_a2
  cefr_level: A2
  category: interagire_rituali_sociali
  label: Attirare l’attenzione
  patterns:
  - Scusa(mi)! senti (per favore)!
- id: intritsoc_attattenz_b1
  cefr_level: B1
  category: interagire_rituali_sociali
