- id: a0_salutare
  cefr_level: A0
  category: interagire_rituali_sociali
  label: Salutare
  description: Greeting someone informally or formally
  patterns:
  - Ciao!
  - Buongiorno!
  - Buonasera!
  examples:
  - Ciao!
  - Buongiorno, signora!
- id: a0_congedarsi
  cefr_level: A0
  category: interagire_rituali_sociali
  label: Congedarsi
  description: Saying goodbye
  patterns:
  - Arrivederci!
  - Ciao!
  - A presto!
  examples:
  - Arrivederci!
  - Ciao, a presto!
- id: a0_ringraziare
  cefr_level: A0
  category: interagire_rituali_sociali
  label: Ringraziare
  description: Thanking someone
  patterns:
  - Grazie!
  - Grazie mille!
  examples:
  - Grazie!
  - Grazie mille!
- id: a0_presentarsi
  cefr_level: A0
  category: interagire_rituali_sociali
  label: Presentarsi
  description: Introducing yourself by name
  patterns:
  - Mi chiamo...
  - Sono...
  examples:
  - Mi chiamo Marco.
  - Sono Maria.
- id: a0_chiedere_cortesemente
  cefr_level: A0
  category: interagire_attivita_azioni
  label: Chiedere cortesemente
  description: Making a polite request
  patterns:
  - Per favore...
  - Vorrei...
  examples:
  - Un caffe, per favore.
  - Vorrei un'acqua.
- id: a0_rispondere_si_no
  cefr_level: A0
  category: interagire_informazioni
  label: Rispondere si/no
  description: Answering yes or no
  patterns:
  - Si.
  - No.
  - No, grazie.
  examples:
  - Si!
  - No, grazie.
- id: a0_identificare
  cefr_level: A0
  category: interagire_informazioni
  label: Identificare oggetti
  description: Identifying objects
  patterns:
  - Questo e...
  - Che cos'e?
  examples:
  - Che cos'e questo?
  - Questo e un libro.
- id: a0_esprimere_gusti
  cefr_level: A0
  category: interagire_opinioni_atteggiamenti
  label: Esprimere gusti
  description: Expressing likes and dislikes
  patterns:
  - Mi piace...
  - Non mi piace...
  examples:
  - Mi piace il caffe.
  - Non mi piace il te.
- id: a0_chiedere_dove
  cefr_level: A0
  category: interagire_informazioni
  label: Chiedere dove
  description: Asking where something/someone is
  patterns:
  - Dov'e...?
  - Dove...?
  examples:
  - Dov'e il bagno?
  - Dove sei?
- id: a0_scusarsi
  cefr_level: A0
  category: interagire_rituali_sociali
  label: Scusarsi
  description: Apologizing or getting attention
  patterns:
  - Scusi!
  - Scusa!
  - Mi dispiace.
  examples:
  - Scusi, dov'e il bagno?
  - Mi dispiace!
- id: a0_dire_nome
  cefr_level: A0
  category: interagire_informazioni
  label: Dire il proprio nome
  description: Stating your name
  patterns:
  - Mi chiamo...
  - Il mio nome e...
  examples:
  - Mi chiamo Anna.
- id: a0_contare
  cefr_level: A0
  category: interagire_informazioni
  label: Contare
  description: Counting and using numbers
  patterns:
  - uno, due, tre...
  examples:
  - Due caffe, per favore.
  - Tre euro.
- id: a0_ordinare
  cefr_level: A0
  category: interagire_attivita_azioni
  label: Ordinare
  description: Ordering food, drinks, or services
  patterns:
  - Vorrei...
  - Vorrei + numero + cosa...
  - Un/una..., per favore.
  examples:
  - Vorrei un caffè, per favore.
  - Vorrei due cornetti.
  - Vorrei la pasta come primo.
- id: a0_chiedere_aiuto
  cefr_level: A0
  category: interagire_attivita_azioni
  label: Chiedere aiuto
  description: Asking for repetition, clarification, or help understanding
  patterns:
  - Può ripetere, per favore?
  - Più lentamente, per favore.
  - Come si dice ... in italiano?
  - Come?
  examples:
  - Scusi, può ripetere?
  - Più lentamente, per favore.
  - Come si dice 'train' in italiano?
- id: a0_dire_ora
  cefr_level: A0
  category: interagire_informazioni
  label: Dire l'ora
  description: Asking and telling the time
  patterns:
  - Che ore sono?
  - Sono le...
  - È l'una.
  - A che ora...?
  examples:
  - Che ore sono?
  - Sono le tre e mezza.
  - A che ora parte il treno?
- id: a0_comprare_biglietto
  cefr_level: A0
  category: interagire_attivita_azioni
  label: Comprare un biglietto
  description: Buying transport tickets and asking about timetables
  patterns:
  - Vorrei un biglietto per...
  - Andata e ritorno.
  - Da che binario?
  - A che ora parte...?
  examples:
  - Vorrei un biglietto per Roma, per favore.
  - Andata e ritorno.
  - Da che binario parte il treno?
- id: a0_descrivere_problema
  cefr_level: A0
  category: interagire_attivita_azioni
  label: Descrivere un problema
  description: Describing an emergency or problem and asking for help
  patterns:
  - Ho perso...
  - Ho bisogno di...
  - Aiuto!
  - Dov'è l'ospedale / la farmacia?
  examples:
  - Ho perso il passaporto.
  - Ho bisogno di un medico.
  - Dov'è la farmacia?
- id: interag_identi_a1
  cefr_level: A1
  category: interagire_informazioni
  label: Identificare
  description: Point out or name people and things using 'questo', 'quello', or 'si chiama'.
    E.g. <span lang="it">Questo è il mio libro</span> or <span lang="it">Lei si chiama Anna</span>.
  patterns:
  - …questo (a) / quello (a) / questi (e) / quelli (e)
  - …è gruppo nominale …
  - …si chiama nome …
  examples:
  - Vorrei questo (con supporto gestuale).
  - È la mia professoressa.
  - Lui si chiama Mario.
- id: interag_identi_a2
  cefr_level: A2
  category: interagire_informazioni
  label: Identificare
  patterns:
  - …ecco pronome
  - '... ecco gruppo nominale …'
  - …è nome …
  - '...è pronome'
  - … gruppo nominale …
  - … pronome è…
  - …è quello/a che…
  examples:
  - Eccola!
  - Ecco la tua borsa.
  - Guarda, è Anna!
  - (Di chi è questo libro?) È il mio.
  - (Chi è Mario?) È lui.
  - Oggi metto il vestito blu.
  - (È questo il Suo cappotto?)
  - No, il mio è nero e senza tasche.
  - È quello che ho visto in vetrina.
- id: interag_identi_b2
  cefr_level: B2
  category: interagire_informazioni
  label: Identificare
  patterns:
  - …intendo pronome …
  - È / sono gruppo nominale che proposizione
  examples:
  - Intendo lui, non lei.
  - È Lucia che ho incontrato in stazione.
- id: interag_asserire_a1
  cefr_level: A1
  category: interagire_informazioni
  label: Asserire
  description: State facts about yourself or the world. Use phrases like <span lang="it">Sono
    stanco</span> or <span lang="it">Abito a Milano</span> to share basic information.
  patterns:
  - …sono gruppo nominale / aggettivo o gruppo aggettivale …
  - Proposizione
  examples:
  - Sono uno studente.
  - Sono stanco.
  - Abito a Milano.
  - Non ho capito.
- id: interag_asserire_a2
  cefr_level: A2
  category: interagire_informazioni
  label: Asserire
  patterns:
  - Proposizione (o sequenza di proposizioni )
  examples:
  - Piove.
- id: interag_descriv_a1
  cefr_level: A1
  category: interagire_informazioni
  label: Descrivere
  description: Describe people, places, and things using adjectives or 'c'è / ci sono'. E.g.
    <span lang="it">La mia camera è grande</span> or <span lang="it">C'è un tavolo</span>.
  patterns:
  - …è aggettivo o gruppo aggettivale …
  - C’è gruppo nominale …
  examples:
  - La mia camera è grande.
  - Ci sono un letto e un tavolo.
- id: interag_descriv_a2
  cefr_level: A2
  category: interagire_informazioni
  label: Descrivere
  patterns:
  - …c’è gruppo nominale / gruppo preposizionale …
  - Sta + verbo gerundio
  - Era / aveva …
  examples:
  - Sulla parete del mio soggiorno ci sono due quadri e vicino al divano c’è un mobile antico.
  - Quel ragazzo sta leggendo.
  - Era alto e aveva i capelli biondi.
- id: interag_descriv_b1
  cefr_level: B1
  category: interagire_informazioni
  label: Descrivere
  patterns:
  - Proposizione ( o sequenza di proposizioni )
  examples:
  - Il mio appartamento si trovava in periferia e ci voleva mezz’ora per arrivare in centro.
- id: interag_descriv_b2
  cefr_level: B2
  category: interagire_informazioni
  label: Descrivere
  patterns:
  - Proposizione ( o sequenza di proposizioni )¹
  - …come…²
  examples:
  - In fondo alla piazza c’è il duomo. A destra il museo e a sinistra la torre.
  - In primo piano la figura di donna, sullo sfondo il paesaggio.
  - Il quadro rappresenta un paesaggio.
  - Era bello come il sole.
- id: interag_racrip_a2
  cefr_level: A2
  category: interagire_informazioni
  label: Raccontare / Riportare
  patterns:
  - Proposizione (o sequenza di proposizioni )
  - Proposizione (o sequenza di proposizioni )
  examples:
  - Ieri sono andato a scuola e poi sono andato in biblioteca.
  - Ora Luca abita a Londra, è sposato e ha due bambini.
- id: interag_racrip_b1
  cefr_level: B1
  category: interagire_informazioni
  label: Raccontare / Riportare
  patterns:
  - Proposizione (o sequenza di proposizioni )¹
  - Gruppo nominale / pronome dice / ha detto che proposizione
  examples:
  - Domenica scorsa mio fratello ha incontrato un suo vecchio amico mentre camminava sulla
    spiaggia.
  - Il professore ha detto che dobbiamo finire l’esercizio .
- id: interag_racrip_b2
  cefr_level: B2
  category: interagire_informazioni
  label: Raccontare / Riportare
  patterns:
  - Gruppo nominale/pronome ha detto proposizione (verbo condizionale)
  - Si tratta/si parla di ...
  - Proposizione (o sequenza di proposizioni) presente narrativo
  - Proposizione (o sequenza di proposizioni) passato remoto
  examples:
  - Il professore ha detto che oggi non avrebbe fatto lezione.
- id: interag_inform01_a1
  cefr_level: A1
  category: interagire_informazioni
  label: Informarsi su un oggetto / una persona
  description: Ask questions to find out about a person or thing. Use interrogative sentences
    like <span lang="it">Che cosa mangi?</span> or <span lang="it">Chi è quella persona?</span>.
  patterns:
  - Proposizione interrogativa
  examples:
  - Che cosa mangi?
- id: interag_inform01_a2
  cefr_level: A2
  category: interagire_informazioni
  label: Informarsi su un oggetto / una persona
  patterns:
  - Gruppo preposizionale
  examples:
  - A che cosa pensi?
  - Di chi è questo libro?
- id: interag_inform01_b1
  cefr_level: B1
  category: interagire_informazioni
  label: Informarsi su un oggetto / una persona
  patterns:
  - Sai proposizione interrogativa
- id: interag_inform01_b2
  cefr_level: B2
  category: interagire_informazioni
  label: Informarsi su un oggetto / una persona
  patterns:
  - Mi piacerebbe sapere chi / che cosa proposizione
  - Mi piacerebbe conoscere gruppo nominale
  examples:
  - Mi piacerebbe sapere che cosa ne pensa lui.
  - Mi piacerebbe conoscere la tua opinione.
- id: interag_inform02_a1
  cefr_level: A1
  category: interagire_informazioni
  label: Informarsi sul tempo
  description: Ask about time — when something happens or what time it is. Use questions like
    <span lang="it">A che ora parte il treno?</span> or <span lang="it">Quando apre il negozio?</span>
  patterns:
  - Quando / A che ora /…?
  examples:
  - A che ora parte il treno per Roma?
- id: interag_inform02_a2
  cefr_level: A2
  category: interagire_informazioni
  label: Informarsi sul tempo
  patterns:
  - Quando / A che ora /…?
  examples:
  - Quando hai letto questo libro?
  - A che ora ci vediamo?
- id: interag_inform03_a1
  cefr_level: A1
  category: interagire_informazioni
  label: Informarsi sul luogo
  description: Ask where something or someone is located using <span lang="it">Dove /...?</span>
    (Where is...?). Essential for navigating new places and finding what you need.
  patterns:
  - Dove /...?
  examples:
  - Dov'è Piazza Maggiore?
- id: interag_inform03_a2
  cefr_level: A2
  category: interagire_informazioni
  label: Informarsi sul luogo
  patterns:
  - Dove /...?
  examples:
  - Dove sei andato ieri?
- id: interag_inform03_b1
  cefr_level: B1
  category: interagire_informazioni
  label: Informarsi sul luogo
  patterns:
  - In quale /...?
  examples:
  - In quale regione si trova Roma?
- id: interag_inform04_a1
  cefr_level: A1
  category: interagire_informazioni
  label: Informarsi sul modo
  description: Ask 'how' questions to find out the way something is done or how someone is.
    Use <span lang="it">Come ti chiami?</span> or <span lang="it">Come stai?</span>.
  patterns:
  - Come /...?
  examples:
  - Come ti chiami?
- id: interag_inform04_a2
  cefr_level: A2
  category: interagire_informazioni
  label: Informarsi sul modo
  patterns:
  - Come /...?
  examples:
  - Come posso fare?
- id: interag_inform04_b1
  cefr_level: B1
  category: interagire_informazioni
  label: Informarsi sul modo
  patterns:
  - In che modo /...?
  examples:
  - In che modo si prepara l’arrosto?
- id: interag_inform05_a1
  cefr_level: A1
  category: interagire_informazioni
  label: Informarsi sulla quantità
  description: Ask 'how much/many' about prices, ages, quantities, and more. Use <span lang="it">Quanto
    costa?</span> or <span lang="it">Quanti anni hai?</span> to get the numbers you need.
  patterns:
  - Quanto / i / a / e...?
  examples:
  - Quanto costa?
  - Quanti anni hai?
- id: interag_inform05_a2
  cefr_level: A2
  category: interagire_informazioni
  label: Informarsi sulla quantità
  patterns:
  - Quanto / i / a / e...?
  examples:
  - Quanti caffè hai bevuto?
- id: interag_inform06_a1
  cefr_level: A1
  category: interagire_informazioni
  label: Informarsi sulla causa
  description: Ask why something is happening or happened. Use <span lang='it'>Perché?</span>
    on its own or in a question like <span lang='it'>Perché sei triste?</span>
  patterns:
  - Perché?
  examples:
  - Perché?
- id: interag_inform06_a2
  cefr_level: A2
  category: interagire_informazioni
  label: Informarsi sulla causa
  patterns:
  - Perché?
  examples:
  - Perché esci?
- id: interag_inform06_b1
  cefr_level: B1
  category: interagire_informazioni
  label: Informarsi sulla causa
  patterns:
  - Per quale motivo /...?
  examples:
  - Per quale motivo hai scelto questa facoltà?
- id: interag_inform06_b2
  cefr_level: B2
  category: interagire_informazioni
  label: Informarsi sulla causa
  patterns:
  - Come mai...?
  examples:
  - Come mai non è possibile pagare con la carta di credito?
- id: interag_inform07_a1
  cefr_level: A1
  category: interagire_informazioni
  label: Informarsi chiedendo di identificare
  description: Ask 'which one?' to identify a specific person, thing, or option. Use <span
    lang="it">Quale…?</span> or <span lang="it">Qual è…?</span> to narrow down a choice.
  patterns:
  - Quale…?
  examples:
  - Qual è il tuo numero di telefono?
- id: interag_inform07_a2
  cefr_level: A2
  category: interagire_informazioni
  label: Informarsi chiedendo di identificare
  patterns:
  - Quale...?
  - Che / Chi...come...?
  - Gruppo preposizionale ...?
  examples:
  - Quale camicia preferisci?
  - Per chi hai comprato questo regalo?
- id: interag_inform07_b1
  cefr_level: B1
  category: interagire_informazioni
  label: Informarsi chiedendo di identificare
  patterns:
  - Che tipo di / ...?
  - '...quale...?'
  examples:
  - Che tipo di lavoro dovrei fare?
  - Tra queste materie quale t’interessa di più?
- id: interag_inform08_a2
  cefr_level: A2
  category: interagire_informazioni
  label: Informarsi chiedendo una conferma o una smentita
  patterns:
  - Va bene?
- id: interag_inform08_b1
  cefr_level: B1
  category: interagire_informazioni
  label: Informarsi chiedendo una conferma o una smentita
  patterns:
  - Proposizione , vero?
  examples:
  - Parti domani, vero?
- id: interag_inform08_b2
  cefr_level: B2
  category: interagire_informazioni
  label: Informarsi chiedendo una conferma o una smentita
  patterns:
  - Proposizione interrogativa (indiretta)
  - Proposizione , non credi?
  - Se ho capito bene/ se non mi sbaglio, proposizione ?
  - Proposizione , eh?
  - Proposizione , no?
  examples:
  - Vorrei (volevo) sapere se il treno è in orario.
  - È simpatica, non credi?
  - Se ho capito bene, l’appuntamento è alle nove?
  - È bello, eh?
  - Il film è interessante, no?
- id: interag_inform09_b2
  cefr_level: B2
  category: interagire_informazioni
  label: Informarsi pretendendo una risposta (conferma o smentita)
  patterns:
  - Proposizione , sì o no?
  - Proposizione o proposizione negativa ?
  - Proposizione o no?¹
  examples:
  - Signorina, il fax lo ha spedito, sì o no?
  - Mi ascolti o non mi ascolti?
  - Mi ascolti o no?
- id: interag_inform10_b1
  cefr_level: B1
  category: interagire_informazioni
  label: Informarsi mettendo in dubbio un’affermazione
  patterns:
  - Sei sicuro / a ?
  - Veramente /…?
  examples:
  - Sono già le otto?
  - Sei sicuro?
- id: interag_inform11_b2
  cefr_level: B2
  category: interagire_informazioni
  label: Informarsi esprimendo la propria curiosità
  patterns:
  - Mi piacerebbe (volevo, vorrei) sapere /… proposizione interrogativa ( indiretta )
  examples:
  - Mi piacerebbe sapere che cosa ne pensa lui.
- id: interag_confsment_a1
  cefr_level: A1
  category: interagire_informazioni
  label: Confermare, smentire
  description: Confirm or deny a statement using simple words like 'Sì', 'No', 'Certo', or
    phrases like 'È vero' / 'Non è vero'. Max ~150 chars.
  patterns:
  - Sì / No / Certo
  - Non è vero / È vero
  examples:
  - — Sei italiano? — Sì, sono italiano.
  - — Maria abita a Roma? — No, non abita a Roma.
  - — È vero che hai un cane? — Certo, ho un cane!
  - — Questo è il tuo zaino? — No, non è vero, non è mio.
  - — Parli francese? — No, non parlo francese.
  - — È vero che la lezione è alle nove? — Sì, è vero.
- id: interag_confsment_b1
  cefr_level: B1
  category: interagire_informazioni
  label: Confermare, smentire
  patterns:
  - Penso / credo di sì / no
  - No, ti sbagli
  - No, per niente
- id: interag_confsment_b2
  cefr_level: B2
  category: interagire_informazioni
  label: Confermare, smentire
  patterns:
  - Proposizione negativa affatto
  examples:
  - Non è affatto vero.
- id: interag_contrad01_a2
  cefr_level: A2
  category: interagire_informazioni
  label: Contraddire un’asserzione positiva
  patterns:
  - Proposizione negativa ,
  - proposizione
  examples:
  - (Quel ragazzo è italiano)
- id: interag_contrad01_b2
  cefr_level: B2
  category: interagire_informazioni
  label: Contraddire un’asserzione positiva
  patterns:
  - No , proposizione
  examples:
  - (Ha ragione lui)
- id: interag_contrad02_b2
  cefr_level: B2
  category: interagire_informazioni
  label: Contraddire un’asserzione negativa
  patterns:
  - Certo che proposizione
  examples:
  - (Ma proprio non hai capito!) Certo che ho capito.
- id: interag_rispondere01_a1
  cefr_level: A1
  category: interagire_informazioni
  label: Rispondere a una domanda con una conferma o una smentita
  description: Confirm or deny something by answering 'yes', 'no', or 'of course'. Use phrases
    like <span lang="it">Sì / No / Certo</span> or <span lang="it">È vero / Non è vero</span>.
  patterns:
  - Sì / No / Certo
  - Non è vero / È vero
  examples:
  - — Sei italiano? — Sì, sono italiano.
  - — Parli francese? — No, non parlo francese.
  - — È vero che Marco è a Roma? — Sì, è vero.
  - — Questa è la tua borsa? — No, non è mia.
  - — Sei tu il nuovo studente? — Certo, sono io!
  - — Non è vero che hai un cane? — È vero, ho un cane.
- id: interag_rispondere01_b1
  cefr_level: B1
  category: interagire_informazioni
  label: Rispondere a una domanda con una conferma o una smentita
  patterns:
  - Penso / credo di sì / no
  - No, ti sbagli
  - No, per niente
- id: interag_rispondere01_b2
  cefr_level: B2
  category: interagire_informazioni
  label: Rispondere a una domanda con una conferma o una smentita
  patterns:
  - Proposizione negativa affatto
  examples:
  - Non è affatto vero.
- id: interag_rispondere02_a1
  cefr_level: A1
  category: interagire_informazioni
  label: Rispondere a una domanda dando delle informazioni sul tempo
  description: Answer questions about time — when something happens or how long it takes.
    Use words like <span lang="it">oggi</span>, <span lang="it">domani</span>, or phrases
    like <span lang="it">alle 8.00</span>.
  patterns:
  - Avverbio …
  - Preposizione
  examples:
  - (Quando parti?) Oggi.
  - Alle 8.00.
- id: interag_rispondere02_a2
  cefr_level: A2
  category: interagire_informazioni
  label: Rispondere a una domanda dando delle informazioni sul tempo
  patterns:
  - Gruppo preposizionale
  examples:
  - (Quando parti?)
- id: interag_rispondere02_b1
  cefr_level: B1
  category: interagire_informazioni
  label: Rispondere a una domanda dando delle informazioni sul tempo
  patterns:
  - Proposizione
  examples:
  - (Quando parti?)
  - Dopo che avrò finito il corso.
- id: interag_rispondere03_a1
  cefr_level: A1
  category: interagire_informazioni
  label: Rispondere a una domanda dando delle informazioni sul luogo
  description: Answer 'where' questions using simple location adverbs or short phrases. E.g.
    <span lang="it">Lì</span>, <span lang="it">Qui</span>, or <span lang="it">È in centro</span>.
  patterns:
  - Avverbio …
  examples:
  - (Dov’è la scuola?)
  - Lì (con supporto gestuale).
- id: interag_rispondere03_a2
  cefr_level: A2
  category: interagire_informazioni
  label: Rispondere a una domanda dando delle informazioni sul luogo
  patterns:
  - Gruppo preposizionale
  - Pronome
  examples:
  - (Dov’è la scuola?)
  - Di fronte alla farmacia.
  - (Sei andato in biblioteca?)
  - Sì, ci sono andato ieri.
- id: interag_rispondere04_a1
  cefr_level: A1
  category: interagire_informazioni
  label: Rispondere a una domanda dando delle informazioni sul modo
  description: Answer questions about *how* something happens or how someone feels. Use adverbs
    like <span lang="it">bene</span>, <span lang="it">male</span>, or <span lang="it">lentamente</span>
    to describe manner.
  patterns:
  - Avverbio
  examples:
  - (Come stai?)
  - Bene, grazie.
- id: interag_rispondere04_a2
  cefr_level: A2
  category: interagire_informazioni
  label: Rispondere a una domanda dando delle informazioni sul modo
  patterns:
  - Gruppo preposizionale
  examples:
  - (Come chiudi la porta?)
  - Con questa chiave.
- id: interag_rispondere04_b1
  cefr_level: B1
  category: interagire_informazioni
  label: Rispondere a una domanda dando delle informazioni sul modo
  patterns:
  - Avverbio
  - Gruppo preposizionale
  examples:
  - (Come guida tua sorella?) Attentamente.
  - Con attenzione.
- id: interag_rispondere04_b2
  cefr_level: B2
  category: interagire_informazioni
  label: Rispondere a una domanda dando delle informazioni sul modo
  patterns:
  - Verbo gerundio
  examples:
  - (Come passavi il tempo?) Ascoltando la musica.
- id: interag_rispondere05_a1
  cefr_level: A1
  category: interagire_informazioni
  label: Rispondere a una domanda, dando delle informazioni sul grado e sulla quantità
  description: Answer questions about degree or quantity using adjectives or adverbs. E.g.
    'Molto bene' or 'Venticinque.'
  patterns:
  - Avverbio
  - Aggettivo
  examples:
  - (Come va?) Molto bene.
  - (Quanti anni hai?) Venticinque.
- id: interag_rispondere05_a2
  cefr_level: A2
  category: interagire_informazioni
  label: Rispondere a una domanda, dando delle informazioni sul grado e sulla quantità
  patterns:
  - Gruppo nominale
  examples:
  - (Quanto ne vuole?) Due etti.
- id: interag_rispondere05_b1
  cefr_level: B1
  category: interagire_informazioni
  label: Rispondere a una domanda, dando delle informazioni sul grado e sulla quantità
  patterns:
  - Pronome
  examples:
  - (Quanti ne prende?) Ne prendo due.
- id: interag_rispondere06_a1
  cefr_level: A1
  category: interagire_informazioni
  label: Rispondere a una domanda dando delle informazioni sulla causa
  description: Answer 'why' questions by giving a reason. Use <span lang="it">Perché</span>
    to explain causes, e.g. <span lang="it">Perché sono stanco</span> ('Because I'm tired').
  patterns:
  - Perché gruppo verbale
  examples:
  - (Perché vai a casa?)
  - Perché sono stanco.
- id: interag_rispondere06_a2
  cefr_level: A2
  category: interagire_informazioni
  label: Rispondere a una domanda dando delle informazioni sulla causa
  patterns:
  - Proposizione
  examples:
  - (Perché parti la settimana prossima?)
  - Perché devo tornare a scuola.
- id: interag_rispondere07_a1
  cefr_level: A1
  category: interagire_informazioni
  label: Rispondere a una domanda, identificando
  description: Answer a question by identifying a person or thing. Use 'questo/quello', 'è
    + noun', or 'si chiama + name' — e.g. 'È la mia professoressa' or 'Lui si chiama Mario.'
  patterns:
  - …questo (a) / quello (a) / questi (e) / quelli (e)
  - …è gruppo nominale …
  - …si chiama nome …
  examples:
  - Vorrei questo (con supporto gestuale).
  - È la mia professoressa.
  - Lui si chiama Mario.
- id: interag_rispondere07_a2
  cefr_level: A2
  category: interagire_informazioni
  label: Rispondere a una domanda, identificando
  patterns:
  - …ecco pronome
  - '... ecco gruppo nominale …'
  - …è nome …
  - '...è pronome'
  - … gruppo nominale …
  - … pronome è…
  - …è quello/a che…
  examples:
  - Eccola!
  - Ecco la tua borsa.
  - Guarda, è Anna!
  - (Di chi è questo libro?) È il mio.
  - (Chi è Mario?) È lui.
  - Oggi metto il vestito blu.
  - (È questo il Suo cappotto?)
  - No, il mio è nero e senza tasche.
  - È quello che ho visto in vetrina.
- id: interag_rispondere08_b1
  cefr_level: B1
  category: interagire_informazioni
  label: Rispondere a una domanda con un’altra domanda
  patterns:
  - E secondo te?
- id: interag_rispondere08_b2
  cefr_level: B2
  category: interagire_informazioni
  label: Rispondere a una domanda con un’altra domanda
  patterns:
  - Proposizione?
  - Proposizione?
  examples:
  - (Pensi di parlargli subito?) Perché me lo chiedi?
  - Tu che ne dici?
- id: interag_rispondere09_a1
  cefr_level: A1
  category: interagire_informazioni
  label: Rispondere a una domanda dichiarando la propria ignoranza
  description: Respond to a question by admitting you don't know the answer. Use phrases like
    <span lang="it">Non lo so</span> or <span lang="it">Non so</span>.
  patterns:
  - Non lo so / Non so¹
  - '¹ Nota: uso formulaico'
  examples:
  - <span lang="it">— Dove abita Marco? — Non lo so.</span>
  - <span lang="it">— A che ora arriva il treno? — Non so, mi dispiace.</span>
  - <span lang="it">— Come si chiama quel ristorante? — Non lo so, non sono di qui.</span>
  - <span lang="it">— Quanti anni ha la professoressa? — Non lo so!</span>
  - <span lang="it">— Perché Luigi non è venuto? — Non so, forse è malato.</span>
- id: interag_rispondere09_b1
  cefr_level: B1
  category: interagire_informazioni
  label: Rispondere a una domanda dichiarando la propria ignoranza
  patterns:
  - Non ne ho idea
- id: interag_rispondere09_b2
  cefr_level: B2
  category: interagire_informazioni
  label: Rispondere a una domanda dichiarando la propria ignoranza
  patterns:
  - Non ne so niente
- id: intatt_espop_a2
  cefr_level: A2
  category: interagire_opinioni_atteggiamenti
  label: Esprimere la propria opinione
  patterns:
  - Secondo me / per me, proposizione
  - (Mi) sembra + aggettivo / gruppo nominale
  examples:
  - Secondo me Luisa è una ragazza intelligente.
  - Sembra simpatico.
- id: intatt_espop_b1
  cefr_level: B1
  category: interagire_opinioni_atteggiamenti
  label: Esprimere la propria opinione
  patterns:
  - Penso/credo che proposizione
  - Sembra + proposizione infinitiva
  - Mi sembra / pare che proposizione
  examples:
  - Penso che tu abbia ragione.
  - Quella ragazza sembra essere felice.
  - Mi sembra che Luca non stia bene.
- id: intatt_espop_b2
  cefr_level: B2
  category: interagire_opinioni_atteggiamenti
  label: Esprimere la propria opinione
  patterns:
  - Dal mio punto di vista / a mio parere, proposizione
  - Per quanto mi riguarda, proposizione
  - Personalmente, proposizione
  - Ho l’impressione / Ho la sensazione che proposizione
  - Direi che proposizione
  - È opportuno / bene… che proposizione
  - Trovo che proposizione
  examples:
  - Dal mio punto di vista, questa cosa non è corretta.
  - Per quanto mi riguarda,l’argomento è chiuso.
  - Personalmente, la lascerei stare.
  - Ho l’impressione che questa storia vada a finire male.
  - Direi che non è colpa nostra.
  - È bene che tu domani vada a scuola.
  - Trovo che Maria sia davvero simpatica.
- id: intatt_espaccsrisp_a1
  cefr_level: A1
  category: interagire_opinioni_atteggiamenti
  label: Esprimere il proprio accordo senza riserve
  description: Express full agreement with what someone has said. Use <span lang="it">Sì</span>
    to confirm you share their view completely.
  patterns:
  - Sì
  examples:
  - (Fa freddo). Sì.
- id: intatt_espaccsrisp_a2
  cefr_level: A2
  category: interagire_opinioni_atteggiamenti
  label: Esprimere il proprio accordo senza riserve
  patterns:
  - Sì, è vero
  - Sì, va bene
  - Hai ragione/ Sono d’accordo
  examples:
  - (Questo abito è molto bello) Sì, è vero.
  - (Luca non è molto simpatico) Hai ragione.
- id: intatt_espaccsrisp_b1
  cefr_level: B1
  category: interagire_opinioni_atteggiamenti
  label: Esprimere il proprio accordo senza riserve
  patterns:
  - Assolutamente
- id: intatt_espaccsrisp_b2
  cefr_level: B2
  category: interagire_opinioni_atteggiamenti
  label: Esprimere il proprio accordo senza riserve
  patterns:
  - Sì è (proprio) vero (che) proposizione
  examples:
  - (È veramente un bel quadro)
  - Sì, è proprio vero che è bello.
- id: intatt_espaccriserv_b1
  cefr_level: B1
  category: interagire_opinioni_atteggiamenti
  label: Esprimere il proprio accordo con delle riserve
  patterns:
  - È probabile / possibile
  - Forse sì, ma
  - Sì va bene, però
- id: intatt_espaccriserv_b2
  cefr_level: B2
  category: interagire_opinioni_atteggiamenti
  label: Esprimere il proprio accordo con delle riserve
  patterns:
  - Chissà
  - Forse, ma io non ne sarei così sicuro
  - Potrebbe essere, ma proposizione
  - Può darsi
  - Non è sicuro che proposizione
- id: intatt_espaccaltern_b2
  cefr_level: B2
  category: interagire_opinioni_atteggiamenti
  label: Esprimere il proprio accordo proponendo un’alternativa
  patterns:
  - È giusto / vero, ma proposizione
  - Sì certo / sono d’accordo / ma proposizione
  - È giusto / vero che proposizione , ma proposizione
  - Proposizione , ma proposizione
  examples:
  - È vero, ma sarà comunque interessante.
  - È giusto che tu ci vada, ma io sceglierei un altro momento.
  - È una buona occasione, ma io ci penserei un po’.
- id: intatt_espdisaspo_a1
  cefr_level: A1
  category: interagire_opinioni_atteggiamenti
  label: Esprimere un disaccordo rispetto ad un’asserzione positiva
  description: Disagree with a positive statement someone has made. Use 'No,' followed by
    the correct information, e.g. 'No, fa caldo.'
  patterns:
  - No, proposizione
  examples:
  - (Fa freddo). No, fa caldo.
- id: intatt_espdisaspo_a2
  cefr_level: A2
  category: interagire_opinioni_atteggiamenti
  label: Esprimere un disaccordo rispetto ad un’asserzione positiva
  patterns:
  - Non sono d’accordo, secondo me…
  - No, non è vero
  examples:
  - (È un film noioso)
  - Non sono d’accordo, secondo me è divertente.
- id: intatt_espdisaspo_b1
  cefr_level: B1
  category: interagire_opinioni_atteggiamenti
  label: Esprimere un disaccordo rispetto ad un’asserzione positiva
  patterns:
  - No, assolutamente / per niente
- id: intatt_espdisaspo_b2
  cefr_level: B2
  category: interagire_opinioni_atteggiamenti
  label: Esprimere un disaccordo rispetto ad un’asserzione positiva
  patterns:
  - Non penso proprio¹
  - Hai torto
- id: intatt_espdisasneg_b1
  cefr_level: B1
  category: interagire_opinioni_atteggiamenti
  label: Esprimere un disaccordo rispetto ad un’asserzione negativa
  patterns:
  - Sì (...)
  examples:
  - (Valeria non frequenta le lezioni).
- id: intatt_espdisasneg_b2
  cefr_level: B2
  category: interagire_opinioni_atteggiamenti
  label: Esprimere un disaccordo rispetto ad un’asserzione negativa
  patterns:
  - Sì / Certo che proposizione
  examples:
  - (Questo studente non ha restituito il libro).
- id: intatt_espdisattenuato_b2
  cefr_level: B2
  category: interagire_opinioni_atteggiamenti
  label: Esprimere un disaccordo in modo attenuato
  patterns:
  - Non credo / penso. Io (piuttosto) credo che proposizione
  - Non ne sono così sicuro, secondo me proposizione
  - Tu credi / pensi?¹
  - Sei sicuro?²
  - Non proprio
- id: intatt_espdistotale_b1
  cefr_level: B1
  category: interagire_opinioni_atteggiamenti
  label: Esprimere un disaccordo totale
  patterns:
  - Hai fatto male
- id: intatt_espdistotale_b2
  cefr_level: B2
  category: interagire_opinioni_atteggiamenti
  label: Esprimere un disaccordo totale
  patterns:
  - Male!
  - Non ha senso!
  - È assurdo / ridicolo / impensabile /...!
  - Lascia perdere!
- id: intatt_espapprov_a1
  cefr_level: A1
  category: interagire_opinioni_atteggiamenti
  label: Esprimere la propria approvazione
  description: Express approval of something or someone. Use simple words like <span lang="it">Bene!</span>
    to show you think something is good or done well.
  patterns:
  - Bene!
  examples:
  - — Ho finito i compiti! — Bene!
  - — Come stai? — Bene, grazie!
  - — Ecco il tuo caffè. — Bene, grazie mille!
  - — Ho prenotato il tavolo per le otto. — Bene! Perfetto.
  - — Ho parlato con il professore. — Bene! Molto bene.
- id: intatt_espapprov_a2
  cefr_level: A2
  category: interagire_opinioni_atteggiamenti
  label: Esprimere la propria approvazione
  patterns:
  - È una buona idea!
- id: intatt_espapprov_b1
  cefr_level: B1
  category: interagire_opinioni_atteggiamenti
  label: Esprimere la propria approvazione
  patterns:
  - Ottimo!
  - Perfetto!
  - Hai fatto bene
- id: intatt_espdisapprov_b1
  cefr_level: B1
  category: interagire_opinioni_atteggiamenti
  label: Esprimere la propria disapprovazione
  patterns:
  - Hai fatto male
- id: intatt_espdisapprov_b2
  cefr_level: B2
  category: interagire_opinioni_atteggiamenti
  label: Esprimere la propria disapprovazione
  patterns:
  - Male!
  - Non ha senso!
  - È assurdo / ridicolo / impensabile /...!
  - Lascia perdere!
- id: intatt_direconosce_a1
  cefr_level: A1
  category: interagire_opinioni_atteggiamenti
  label: Dire ciò che si sa / si conosce
  description: Express that you know something or someone. Use phrases like <span lang="it">Lo
    so</span> or <span lang="it">Conosco...</span> to share your knowledge in conversation.
  patterns:
  - Lo so.
  examples:
  - — Sai dov'è la stazione? — Sì, lo so! È vicino al centro.
  - Conosco Maria. È la mia amica.
  - So parlare un po' di italiano.
  - — Come si chiama il professore? — Non lo so, ma so che è italiano.
  - Conosco questo posto. Ci vengo spesso.
  - So già la risposta!
- id: intatt_direconosce_a2
  cefr_level: A2
  category: interagire_opinioni_atteggiamenti
  label: Dire ciò che si sa / si conosce
  patterns:
  - Conoscere gruppo nominale .
  examples:
  - Conosco quel ragazzo.
- id: intatt_direconosce_b1
  cefr_level: B1
  category: interagire_opinioni_atteggiamenti
  label: Dire ciò che si sa / si conosce
  patterns:
  - So che proposizione
  examples:
  - So che Mario è già partito.
- id: intatt_direconosce_b2
  cefr_level: B2
  category: interagire_opinioni_atteggiamenti
  label: Dire ciò che si sa / si conosce
  patterns:
  - Ho sentito dire che proposizione
  examples:
  - Ho sentito dire che l’ultimo film di Benigni è molto divertente.
  - Ho sentito parlare di Italo Calvino.
- id: intatt_espproigno_a1
  cefr_level: A1
  category: interagire_opinioni_atteggiamenti
  label: Esprimere la propria ignoranza
  description: Express that you don't know something. Use 'Non lo so' when you can't answer
    a question or lack information.
  patterns:
  - Non lo so¹
  - '¹ Nota: uso formulaico'
  examples:
  - — Dove abita Marco? — Non lo so.
  - — Quanti anni ha la professoressa? — Non lo so!
  - — A che ora apre il museo? — Mah, non lo so.
  - — Com'è il tempo a Milano adesso? — Non lo so, mi dispiace.
  - — Dov'è la fermata dell'autobus? — Non lo so, sono nuovo qui.
- id: intatt_espproigno_a2
  cefr_level: A2
  category: interagire_opinioni_atteggiamenti
  label: Esprimere la propria ignoranza
  patterns:
  - Non conosco gruppo nominale
  examples:
  - Non conosco questa persona.
- id: intatt_espproigno_b2
  cefr_level: B2
  category: interagire_opinioni_atteggiamenti
  label: Esprimere la propria ignoranza
  patterns:
  - Non so se proposizione
  examples:
  - Non so se Valeria sia riuscita a prendere il treno in tempo.
- id: intatt_espfatric_a2
  cefr_level: A2
  category: interagire_opinioni_atteggiamenti
  label: Esprimere il fatto di ricordarsi
  patterns:
  - Sì, mi ricordo
  - Mi ricordo / non ho dimenticato gruppo nominale
  examples:
  - (Ti ricordi del nostro appuntamento di domani?)
  - Sì, mi ricordo.
  - Mi ricordo il suo numero di telefono.
- id: intatt_espfatric_b1
  cefr_level: B1
  category: interagire_opinioni_atteggiamenti
  label: Esprimere il fatto di ricordarsi
  patterns:
  - Mi ricordo che proposizione
  - Mi sono ricordato / non ho dimenticato di proposizione infinitiva
  - Mi ricordo di gruppo nominale / pronome
  examples:
  - Mi ricordo che c’era il sole.
  - Mi sono ricordato di comprare il vino.
  - Mi ricordo di sua madre.
- id: intatt_espfatdim_a2
  cefr_level: A2
  category: interagire_opinioni_atteggiamenti
  label: Esprimere il fatto di avere dimenticato
  patterns:
  - No, non mi ricordo
  - Non ricordo / ho dimenticato gruppo nominale
  examples:
  - (Ti ricordi di mio cugino Gianni?) No, non mi ricordo.
  - Non ricordo il suo nome.
- id: intatt_espfatdim_b1
  cefr_level: B1
  category: interagire_opinioni_atteggiamenti
  label: Esprimere il fatto di avere dimenticato
  patterns:
  - Ho dimenticato che proposizione
  - Non mi sono ricordato/ ho dimenticato di proposizione infinitiva
  - Non mi ricordo di gruppo nominale / pronome
  examples:
  - Ho dimenticato che domani è festa.
  - Non mi sono ricordato di fare la spesa.
  - Non mi ricordo di lui.
- id: intatt_espfatdim_b2
  cefr_level: B2
  category: interagire_opinioni_atteggiamenti
  label: Esprimere il fatto di avere dimenticato
  patterns:
  - Non mi viene in mente
  - Non mi ricordo (più) se proposizione
- id: intatt_ricqualqualcuno_b1
  cefr_level: B1
  category: interagire_opinioni_atteggiamenti
  label: Ricordare qualcosa a qualcuno
  patterns:
  - ( Proposizione ,) ti ricordi?
  - Ti ricordi che / come / quando... proposizione ?
  - Ricordati/ non dimenticarti ( gruppo nominale / di) !
  examples:
  - L’albergo era bellissimo, ti ricordi?
  - Ti ricordi come si chiama?
  - Ti ricordi che domani è il suo compleanno?
  - Ricordati le chiavi.
  - Ricordati che domani è vacanza.
  - Non dimenticarti di pagare l’affitto.
- id: intatt_espprocert_a2
  cefr_level: A2
  category: interagire_opinioni_atteggiamenti
  label: Esprimere la propria certezza
  patterns:
  - Sì, sono sicuro
- id: intatt_espprocert_b1
  cefr_level: B1
  category: interagire_opinioni_atteggiamenti
  label: Esprimere la propria certezza
  patterns:
  - Sono sicuro /… di proposizione infinitiva che proposizione
  examples:
  - Sono sicuro che Mario ha trent’anni.
  - Sono sicuro di incontrarlo alla festa.
- id: intatt_espprocert_b2
  cefr_level: B2
  category: interagire_opinioni_atteggiamenti
  label: Esprimere la propria certezza
  patterns:
  - È sicuro/certo/ ...che proposizione
  examples:
  - È sicuro che lui non cambierà idea.
  - Non c’è dubbio che passerà l’esame.
  - Lo farà, senza dubbio.
- id: intatt_espproincert_a2
  cefr_level: A2
  category: interagire_opinioni_atteggiamenti
  label: Esprimere la propria incertezza o la propria perplessità
  patterns:
  - No, non sono sicuro
- id: intatt_espproincert_b1
  cefr_level: B1
  category: interagire_opinioni_atteggiamenti
  label: Esprimere la propria incertezza o la propria perplessità
  patterns:
  - Non sono sicuro /… di proposizione infinitiva
  - Non so che cosa dire
  examples:
  - Non sono sicuro di partire domani.
- id: intatt_espproincert_b2
  cefr_level: B2
  category: interagire_opinioni_atteggiamenti
  label: Esprimere la propria incertezza o la propria perplessità
  patterns:
  - Non sono sicuro che.../ proposizione
  - Non so (bene) se proposizione
  examples:
  - Non sono sicuro che lui abbia detto la verità.
- id: intatt_espproincred_a2
  cefr_level: A2
  category: interagire_opinioni_atteggiamenti
  label: Esprimere la propria incredulità
  patterns:
  - Veramente?
  examples:
  - (Mia sorella ha avuto una bambina).
  - Veramente?
- id: intatt_espproincred_b2
  cefr_level: B2
  category: interagire_opinioni_atteggiamenti
  label: Esprimere la propria incredulità
  patterns:
  - Dubito che proposizione
  - Mi sembra / mi pare improbabile / impossibile /... che proposizione
  examples:
  - Dubito che Valeria sia già partita.
- id: intatt_espevidenza_b1
  cefr_level: B1
  category: interagire_opinioni_atteggiamenti
  label: Esprimere l’evidenza
  patterns:
  - È chiaro /... che proposizione
  examples:
  - È chiaro che a Mario piace Lucia.
- id: intatt_espevidenza_b2
  cefr_level: B2
  category: interagire_opinioni_atteggiamenti
  label: Esprimere l’evidenza
  patterns:
  - Non c’è (alcun) dubbio che proposizione
  examples:
  - Non c’è dubbio che tu abbia capito male.
- id: intatt_espprobpos_a2
  cefr_level: A2
  category: interagire_opinioni_atteggiamenti
  label: Esprimere la probabilità o la possibilità
  patterns:
  - Probabilmente / forse proposizione .
  - È possibile .
  examples:
  - Probabilmente tornerà in aereo
- id: intatt_espprobpos_b1
  cefr_level: B1
  category: interagire_opinioni_atteggiamenti
  label: Esprimere la probabilità o la possibilità
  patterns:
  - '... verbo futuro (semplice e anteriore)'
  - È probabile.
  - Potrei / dovrei
  examples:
  - (Che ore saranno) Saranno circa le otto.
  - (Dov’è Valeria?) Mah, sarà già andata a casa.
  - Potrei arrivare a casa tua stasera tardi.
  - Dovrei essere a Milano verso le otto.
- id: intatt_espprobpos_b2
  cefr_level: B2
  category: interagire_opinioni_atteggiamenti
  label: Esprimere la probabilità o la possibilità
  patterns:
  - Immagino / ho l’impressione che proposizione
  examples:
  - Ho l’impressione che il professore sia di cattivo umore.
- id: intatt_espimprobab_b1
  cefr_level: B1
  category: interagire_opinioni_atteggiamenti
  label: Esprimere l’improbabilità
  patterns:
  - È improbabile.
  - Non sembra che proposizione
- id: intatt_espimprobab_b2
  cefr_level: B2
  category: interagire_opinioni_atteggiamenti
  label: Esprimere l’improbabilità
  patterns:
  - È improbabile che proposizione
  - Ci sono poche probabilità che proposizione
  examples:
  - È improbabile che venga anche lei stasera.
- id: intatt_espprocapincap_a1
  cefr_level: A1
  category: interagire_opinioni_atteggiamenti
  label: Esprimere la propria capacità/incapacità
  description: Express what you can or can't do using <span lang="it">so</span> + infinitive.
    E.g. <span lang="it">So scrivere</span> (I can write) or <span lang="it">Non so nuotare</span>
    (I can't swim).
  patterns:
  - Proposizione (io) so + verbo infinito
  examples:
  - So scrivere.
- id: intatt_espprocapincap_a2
  cefr_level: A2
  category: interagire_opinioni_atteggiamenti
  label: Esprimere la propria capacità/incapacità
  patterns:
  - Posso / non posso verbo infinito
  examples:
  - Oggi non posso cucinare.
- id: intatt_espprocapincap_b1
  cefr_level: B1
  category: interagire_opinioni_atteggiamenti
  label: Esprimere la propria capacità/incapacità
  patterns:
  - Sono capace di proposizione infinitiva
  - Riesco a proposizione infinitiva
  examples:
  - Sono capace di nuotare per ore.
- id: intatt_espprocapincap_b2
  cefr_level: B2
  category: interagire_opinioni_atteggiamenti
  label: Esprimere la propria capacità/incapacità
  patterns:
  - Ce la faccio a proposizione infinitiva
  - Sono in grado di proposizione infinitiva
  examples:
  - Ce la faccio a finire in tempo.
- id: intatt_espdesiderio_a1
  cefr_level: A1
  category: interagire_opinioni_atteggiamenti
  label: Esprimere un desiderio
  description: Express what you want or wish for. Use <span lang="it">Vorrei</span> + a noun
    to politely say what you'd like, e.g. <span lang="it">Vorrei un caffè</span>.
  patterns:
  - Vorrei / gruppo nominale
  examples:
  - Vorrei un caffè.
- id: intatt_espdesiderio_a2
  cefr_level: A2
  category: interagire_opinioni_atteggiamenti
  label: Esprimere un desiderio
  patterns:
  - Vorrei / verbo infinito
  - Ho voglia di gruppo nominale
  examples:
  - Vorrei andare al mare.
  - Ho voglia di un bel gelato.
- id: intatt_espdesiderio_b1
  cefr_level: B1
  category: interagire_opinioni_atteggiamenti
  label: Esprimere un desiderio
  patterns:
  - Mi piacerebbe proposizione infinitiva / gruppo nominale
  - Ho voglia di proposizione infinitiva
  - '...verbo condizionale ( volentieri )...'
  - Non vedo l’ora di proposizione infinitiva
  examples:
  - Mi piacerebbe leggere le favole di Italo Calvino in italiano.
- id: intatt_espdesiderio_b2
  cefr_level: B2
  category: interagire_opinioni_atteggiamenti
  label: Esprimere un desiderio
  patterns:
  - Voglio / vorrei / mi piacerebbe che proposizione
  - Mi auguro di proposizione infinitiva / che proposizione
  - Desidero / desidererei gruppo nominale / proposizione / che proposizione
  - Mi va gruppo nominale / di proposizione infinitiva / che proposizione
  examples:
  - Voglio che Luca torni presto.
- id: intatt_espintenz_a1
  cefr_level: A1
  category: interagire_opinioni_atteggiamenti
  label: Esprimere un’intenzione
  description: Express what you plan or intend to do. Use 'Voglio + infinitive', e.g. <span
    lang="it">Voglio cambiare casa</span> or <span lang="it">Voglio studiare italiano</span>.
  patterns:
  - Voglio verbo infinito
  examples:
  - Voglio cambiare casa.
- id: intatt_espintenz_a2
  cefr_level: A2
  category: interagire_opinioni_atteggiamenti
  label: Esprimere un’intenzione
  patterns:
  - Verbo futuro
  examples:
  - La settimana prossima andrò a Roma.
- id: intatt_espintenz_b1
  cefr_level: B1
  category: interagire_opinioni_atteggiamenti
  label: Esprimere un’intenzione
  patterns:
  - Credo / penso /... di proposizione infinitiva
  - Ho deciso di proposizione infinitiva
  examples:
  - Penso di tornare verso le otto.
  - Ho deciso di partire domani.
- id: intatt_espintenz_b2
  cefr_level: B2
  category: interagire_opinioni_atteggiamenti
  label: Esprimere un’intenzione
  patterns:
  - Ho intenzione di proposizione infinitiva
  examples:
  - Ho intenzione di iscrivermi al corso di letteratura contemporanea
- id: intatt_espobbdivieto_a1
  cefr_level: A1
  category: interagire_opinioni_atteggiamenti
  label: Esprimere un obbligo, un divieto
  description: Express that something must or must not be done. Use 'Devo...' (I must/have
    to) for obligations, e.g. 'Devo andare a lezione.'
  patterns:
  - Devo verbo futuro
  examples:
  - Devo andare a lezione.
- id: intatt_espobbdivieto_b1
  cefr_level: B1
  category: interagire_opinioni_atteggiamenti
  label: Esprimere un obbligo, un divieto
  patterns:
  - Devo (assolutamente) verbo infinito
  - Bisogna proposizione infinitiva
  examples:
  - Devo assolutamente partire con questo aereo.
  - Ora bisogna andare.
- id: intatt_espobbdivieto_b2
  cefr_level: B2
  category: interagire_opinioni_atteggiamenti
  label: Esprimere un obbligo, un divieto
  patterns:
  - È obbligatorio / necessario / indispensabile proposizione / gruppo nominale
  - È vietato / proibito proposizione
  - Proposizione infinitiva
  - Sono obbligato / costretto a proposizione infinitiva
  examples:
  - È obbligatorio mettersi la cintura di sicurezza .
  - Togliersi le scarpe prima di entrare.¹
  - Sono obbligato a pagare questa multa.
- id: intatt_espnorsocmor_b1
  cefr_level: B1
  category: interagire_opinioni_atteggiamenti
  label: Esprimere una norma sociale o morale
  patterns:
  - (Non) devi / puoi verbo infinito
  - Si deve / bisogna proposizione infinitiva
  examples:
  - Non devi gettare la carta per terra.
  - Non puoi attraversare la strada con il semaforo rosso.
  - Si deve proteggere la natura.
- id: intatt_espnorsocmor_b2
  cefr_level: B2
  category: interagire_opinioni_atteggiamenti
  label: Esprimere una norma sociale o morale
  patterns:
  - È buona educazione / cattiva educazione proposizione infinitiva
  - È scorretto proposizione infinitiva
  - Tutti hanno diritto di proposizione infinitiva / a gruppo nominale
  examples:
  - È buona educazione spegnere il cellulare a teatro.
  - È scorretto parlare male degli altri.
- id: intatt_accusconf_b1
  cefr_level: B1
  category: interagire_opinioni_atteggiamenti
  label: Accusare, accusarsi, confessare
  patterns:
  - È colpa mia / tua /…
- id: intatt_accusconf_b2
  cefr_level: B2
  category: interagire_opinioni_atteggiamenti
  label: Accusare, accusarsi, confessare
  patterns:
  - È pronome / gruppo nominale che gruppo verbale
  - È colpa di gruppo nominale se proposizione
  - È a causa mia (di gruppo nominale ) se proposizione
  - Gruppo nominale è responsabile di gruppo nominale / proposizione
  examples:
  - Sei tu che hai fatto tutto questo.
  - È colpa di Luca se siamo in ritardo.
  - È a causa tua se sto così male.
- id: intatt_respaccusa_b1
  cefr_level: B1
  category: interagire_opinioni_atteggiamenti
  label: Respingere un’accusa
  patterns:
  - Non è colpa mia
- id: intatt_respaccusa_b2
  cefr_level: B2
  category: interagire_opinioni_atteggiamenti
  label: Respingere un’accusa
  patterns:
  - Non è pronome / gruppo nominale che gruppo verbale
  - Non è colpa di gruppo nominale se proposizione
  - Non è a causa mia (di gruppo nominale ) se proposizione
  - Non gruppo nominale è responsabile di gruppo nominale / proposizione
  examples:
  - Non sei tu che hai fatto tutto questo.
  - Non è colpa di Luca se siamo in ritardo.
  - Non è a causa mia se sto così male.
- id: intatt_scusarsi_a1
  cefr_level: A1
  category: interagire_opinioni_atteggiamenti
  label: Scusarsi
  description: Use this to apologize or excuse yourself. Say <span lang="it">Scusi</span>
    (formal) or <span lang="it">Scusa</span> (informal) to say sorry or get someone's attention
    politely.
  patterns:
  - Scusi / Scusa¹
  - '¹ Nota: uso formulaico'
  examples:
  - <span lang="it">Scusi, non ho capito.</span>
  - <span lang="it">Scusa, sono in ritardo!</span>
  - <span lang="it">Scusi, può ripetere per favore?</span>
  - <span lang="it">Scusa, ho sbagliato numero.</span>
  - <span lang="it">Scusi, professore, non ho il libro oggi.</span>
- id: intatt_scusarsi_a2
  cefr_level: A2
  category: interagire_opinioni_atteggiamenti
  label: Scusarsi
  patterns:
  - (Mi) scusi / scusa (mi) (per gruppo nominale )
  - Mi dispiace
  examples:
  - Scusa per il ritardo .
- id: intatt_scusarsi_b1
  cefr_level: B1
  category: interagire_opinioni_atteggiamenti
  label: Scusarsi
  patterns:
  - Mi dispiace di proposizione / gruppo nominale
  examples:
  - Mi dispiace di essere così in ritardo.
- id: intatt_scusarsi_b2
  cefr_level: B2
  category: interagire_opinioni_atteggiamenti
  label: Scusarsi
  patterns:
  - Perdonami (per gruppo nominale / verbo infinito; se proposizione )
  - Ti chiedo scusa / perdono per gruppo nominale / proposizione
  - Scusa, non volevo
  examples:
  - Perdonami per essere arrivato tardi.
  - Perdonami se insisto.
  - Ti chiedo scusa per il mio comportamento.
- id: intatt_accetscuse_a2
  cefr_level: A2
  category: interagire_opinioni_atteggiamenti
  label: Accettare le scuse
  patterns:
  - Non c’è problema
- id: intatt_accetscuse_b1
  cefr_level: B1
  category: interagire_opinioni_atteggiamenti
  label: Accettare le scuse
  patterns:
  - Non importa
- id: intatt_espipotesi_b1
  cefr_level: B1
  category: interagire_opinioni_atteggiamenti
  label: Esprimere un’ipotesi
  patterns:
  - Se verbo indicativo , verbo indicativo
  examples:
  - Se mangio troppo, sto male.
- id: intatt_espipotesi_b2
  cefr_level: B2
  category: interagire_opinioni_atteggiamenti
  label: Esprimere un’ipotesi
  patterns:
  - Se verbo congiuntivo, verbo condizionale
  examples:
  - Se tu volessi potresti diventare vegetariana.
  - Se mi fossi trovata in questa situazione avrei fatto la stessa cosa.
- id: intemo_espfelicita_a1
  cefr_level: A1
  category: interagire_emozioni_sentimenti
  label: Esprimere piacere, gioia, felicità
  description: Express happiness, joy, or pleasure. Use phrases like 'Sono felice' or 'Che
    bello!' to share positive feelings in everyday situations.
  patterns:
  - Sono felice
  examples:
  - Sono felice di essere qui con voi!
  - Che bello! Ho passato l'esame!
  - Sono molto contenta — oggi è il mio compleanno!
  - Evviva! Domani andiamo al mare!
  - Che gioia rivedere tutti!
- id: intemo_espfelicita_a2
  cefr_level: A2
  category: interagire_emozioni_sentimenti
  label: Esprimere piacere, gioia, felicità
  patterns:
  - Bellissimo!
  - Che bello!
- id: intemo_espfelicita_b1
  cefr_level: B1
  category: interagire_emozioni_sentimenti
  label: Esprimere piacere, gioia, felicità
  patterns:
  - È magnifico / meraviglioso / fantastico /...
- id: intemo_espfelicita_b2
  cefr_level: B2
  category: interagire_emozioni_sentimenti
  label: Esprimere piacere, gioia, felicità
  patterns:
  - Figo / ganzo!
  - Grande!
  - Che bellezza!
  - Mi fa (molto) piacere che proposizione
  - È un (vero) piacere / una (vera) gioia proposizione infinitiva
  - Ho il piacere di proposizione infinitiva
  examples:
  - Mi fa molto piacere che tu sia venuta con noi.
- id: intemo_esptrisnost_a1
  cefr_level: A1
  category: interagire_emozioni_sentimenti
  label: Esprimere tristezza, nostalgia
  description: Express sadness or longing. Use phrases like 'Non sto bene' or 'Sono triste'
    to tell someone how you're feeling emotionally.
  patterns:
  - Non sto bene / sono triste
  examples:
  - Non sto bene oggi, sono molto triste.
  - Mi manca tanto la mia famiglia.
  - Sono triste perché il mio cane è malato.
  - Non sono felice, mi sento solo.
  - Mi manca la mia città.
  - Oggi non sto bene, ho nostalgia di casa.
- id: intemo_esptrisnost_a2
  cefr_level: A2
  category: interagire_emozioni_sentimenti
  label: Esprimere tristezza, nostalgia
  patterns:
  - Ho nostalgia di gruppo nominale
  examples:
  - Ho nostalgia di casa.
- id: intemo_esptrisnost_b1
  cefr_level: B1
  category: interagire_emozioni_sentimenti
  label: Esprimere tristezza, nostalgia
  patterns:
  - Purtroppo proposizione
  - Sono disperato / depresso
  - Mi manca...
  - Mi dispiace di...
  - Sono di cattivo umore
  - Che sfortuna!
- id: intemo_esptrisnost_b2
  cefr_level: B2
  category: interagire_emozioni_sentimenti
  label: Esprimere tristezza, nostalgia
  patterns:
  - Non ne posso più
  - Ne ho abbastanza
  - Non sono in forma
  - Mi sento giù
- id: intemo_intgioiatrist_a1
  cefr_level: A1
  category: interagire_emozioni_sentimenti
  label: Interrogare sulla gioia o sulla tristezza
  description: Ask how someone is feeling — happy or sad. Use phrases like 'Come stai?' or
    'Tutto bene?' to check in on a person's emotional state.
  patterns:
  - Come stai?
  - Tutto bene?
  examples:
  - Ciao Maria, come stai oggi?
  - Tutto bene? Sembri un po' triste.
  - Come sta tuo fratello? È ancora triste?
  - Sei felice adesso? Tutto bene con il lavoro?
  - Signora Rossi, come sta? È contenta?
- id: intemo_intgioiatrist_a2
  cefr_level: A2
  category: interagire_emozioni_sentimenti
  label: Interrogare sulla gioia o sulla tristezza
  patterns:
  - Come va?
  - Sei felice/contento/triste...?
  - (Non) stai bene/stai bene?
- id: intemo_intgioiatrist_b1
  cefr_level: B1
  category: interagire_emozioni_sentimenti
  label: Interrogare sulla gioia o sulla tristezza
  patterns:
  - Cosa è successo?
  - Hai dei problemi?
- id: intemo_intgioiatrist_b2
  cefr_level: B2
  category: interagire_emozioni_sentimenti
  label: Interrogare sulla gioia o sulla tristezza
  patterns:
  - Che hai?
- id: intemo_consincoconf_a2
  cefr_level: A2
  category: interagire_emozioni_sentimenti
  label: Consolare, incoraggiare, confortare
  patterns:
  - Non ti preoccupare
- id: intemo_consincoconf_b1
  cefr_level: B1
  category: interagire_emozioni_sentimenti
  label: Consolare, incoraggiare, confortare
  patterns:
  - Forza! Coraggio!
  - Non è niente
  - Non aver paura
  - Sta tranquillo / calmo
  - Su! Dai!
- id: intemo_consincoconf_b2
  cefr_level: B2
  category: interagire_emozioni_sentimenti
  label: Consolare, incoraggiare, confortare
  patterns:
  - Che importa!
  - (Mi raccomando)
  - rimettiti, riprenditi
  - Tutto andrà per il meglio
  - Mantieni la calma
- id: intemo_esppartecip_b1
  cefr_level: B1
  category: interagire_emozioni_sentimenti
  label: Esprimere la propria partecipazione
  patterns:
  - Ti capisco
  - Povero / poverino / poveretto!
- id: intemo_esppartecip_b2
  cefr_level: B2
  category: interagire_emozioni_sentimenti
  label: Esprimere la propria partecipazione
  patterns:
  - Beato/a te!
  - So/immagino come ti senti.
  - Comprendo/capisco gruppo nominale .
  - Le mie più sentite condoglianze
  - Condoglianze vivissime
  - Partecipo al tuo dolore con affetto¹
- id: intemo_esperanza_b1
  cefr_level: B1
  category: interagire_emozioni_sentimenti
  label: Esprimere una speranza
  patterns:
  - Spero / che proposizione / di proposizione infinitiva
  examples:
  - Spero che guarirai presto.
  - Spero di superare l’esame.
- id: intemo_esperanza_b2
  cefr_level: B2
  category: interagire_emozioni_sentimenti
  label: Esprimere una speranza
  patterns:
  - Magari¹
  - Mi auguro che proposizione / di proposizione infinitiva
  examples:
  - (Comprerai una casa al mare?) Magari! Mi piacerebbe.
  - Mi auguro che l’esame vada bene.
- id: intemo_espdelus_a2
  cefr_level: A2
  category: interagire_emozioni_sentimenti
  label: Esprimere una delusione
  patterns:
  - (Che) peccato!
- id: intemo_espdelus_b2
  cefr_level: B2
  category: interagire_emozioni_sentimenti
  label: Esprimere una delusione
  patterns:
  - Come mi dispiace!
  - Sono (molto) deluso da gruppo nominale .
  - È una grande delusione (per me).
  - Accidenti / cavolo /...!
- id: intemo_espinquietud_a1
  cefr_level: A1
  category: interagire_emozioni_sentimenti
  label: Esprimere inquietudine, paura, angoscia
  description: Express worry, fear, or distress. Use cries like 'Aiuto!' or simple phrases
    to show you are scared or anxious.
  patterns:
  - Aiuto!
  examples:
  - Aiuto! C'è un uomo strano!
  - Ho paura del buio.
  - Sono molto preoccupata, non trovo il mio passaporto.
  - Mi fa paura questo cane!
  - Aiuto! Non so nuotare!
- id: intemo_espinquietud_a2
  cefr_level: A2
  category: interagire_emozioni_sentimenti
  label: Esprimere inquietudine, paura, angoscia
  patterns:
  - Che paura!
  - Ho paura di gruppo nominale
- id: intemo_espinquietud_b1
  cefr_level: B1
  category: interagire_emozioni_sentimenti
  label: Esprimere inquietudine, paura, angoscia
  patterns:
  - È orribile, terribile, spaventoso
  - Ho paura che proposizione / di proposizione infinitiva
- id: intemo_espinquietud_b2
  cefr_level: B2
  category: interagire_emozioni_sentimenti
  label: Esprimere inquietudine, paura, angoscia
  patterns:
  - Sono terrorizzato da gruppo nominale
  - Temo che proposizione / di proposizione infinitiva / gruppo nominale
  - Mi preoccupo per gruppo nominale
  - Non mi sento tranquillo / sicuro / a mio agio
  examples:
  - Sono terrorizzato dai tuoni.
- id: intemo_espsollievo_b1
  cefr_level: B1
  category: interagire_emozioni_sentimenti
  label: Esprimere sollievo
  patterns:
  - Va / sto (molto) meglio!
- id: intemo_espsollievo_b2
  cefr_level: B2
  category: interagire_emozioni_sentimenti
  label: Esprimere sollievo
  patterns:
  - Mi sento meglio.
  - Meno male!
  - Meno male che proposizione
  - Grazie a Dio!
  - Per fortuna!
- id: intemo_espsoffis_a1
  cefr_level: A1
  category: interagire_emozioni_sentimenti
  label: Esprimere sofferenza fisica
  description: Express physical pain or discomfort. Use phrases like 'Fa male!' or 'Sto male!'
    to tell someone you are hurting or feeling unwell.
  patterns:
  - Fa (molto) male!
  - Ho male (qui)!¹
  - Sto male!
  examples:
  - Ahi! Fa molto male!
  - Ho male qui, alla gamba.
  - Sto male, ho bisogno di un medico.
  - Mi fa male la testa.
  - Ho male alla pancia!
  - Sto molto male, puoi aiutarmi?
- id: intemo_espsoffis_a2
  cefr_level: A2
  category: interagire_emozioni_sentimenti
  label: Esprimere sofferenza fisica
  patterns:
  - Che male!
  - Ho mal di gruppo nominale
  - Ho gruppo nominale
  examples:
  - Ho mal di testa.
  - Ho la tosse, il raffreddore, la febbre.
- id: intemo_espsoffis_b1
  cefr_level: B1
  category: interagire_emozioni_sentimenti
  label: Esprimere sofferenza fisica
  patterns:
  - Mi fa male!
  - Che dolore!
  - Mi fa male gruppo nominale .
  - Sono aggettivo
- id: intemo_espsoffis_b2
  cefr_level: B2
  category: interagire_emozioni_sentimenti
  label: Esprimere sofferenza fisica
  patterns:
  - Ho un (forte) dolore a gruppo nominale
  - Soffro di gruppo nominale .
  examples:
  - Ho un forte dolore al braccio.
  - Soffro di mal di testa.
- id: intemo_espamappqual_a1
  cefr_level: A1
  category: interagire_emozioni_sentimenti
  label: Esprimere il fatto di amare, di apprezzare qualcosa o qualcuno
  description: Express love or appreciation for things and people. Use 'Mi piace', 'Amo',
    or simple adjectives like 'Bello!' and 'Bravo!' to show you like something.
  patterns:
  - Gruppo nominale è buono
  - Mi piace
  - Amare gruppo nominale
  - Bene!
  - Bravo!
  - Bello!
  examples:
  - Questa pizza è buona.
  - Amo l’Italia.
- id: intemo_espamappqual_a2
  cefr_level: A2
  category: interagire_emozioni_sentimenti
  label: Esprimere il fatto di amare, di apprezzare qualcosa o qualcuno
  patterns:
  - Mi piace gruppo nominale / proposizione infinitiva
  examples:
  - Mi piace il cioccolato.
  - Mi piace ballare.
- id: intemo_espamappqual_b1
  cefr_level: B1
  category: interagire_emozioni_sentimenti
  label: Esprimere il fatto di amare, di apprezzare qualcosa o qualcuno
  patterns:
  - Ottimo!
  - Amo proposizione infinitiva .
  - Ti amo!
  - Voglio bene a gruppo nominale .
  - Che gruppo nominale !
  - Gruppo nominale non è male
  - Sono innamorato di gruppo nominale / pronome .
  - Sono appassionato / a di gruppo nominale
  - Con tutto il mio amore, con tutto il mio cuore
  examples:
  - Amo andare in bicicletta in campagna.
  - Voglio bene alla mia famiglia.
  - Che serata magnifica!
  - Quel film non è male.
  - Sono innamorato di te.
  - Sono appassionata di film gialli.
- id: intemo_espamappqual_b2
  cefr_level: B2
  category: interagire_emozioni_sentimenti
  label: Esprimere il fatto di amare, di apprezzare qualcosa o qualcuno
  patterns:
  - Adoro gruppo nominale / proposizione infinitiva
  - Ho preso una cotta per gruppo nominale .
  - Ammiro / apprezzo gruppo nominale .
  - Vado matto per gruppo nominale
  examples:
  - Adoro andare in spiaggia.
  - Ho preso una cotta per il mio vicino di casa.
  - Ammiro la tua onestà.
  - Vado matto per il cioccolato.
- id: intemo_espnonama_a1
  cefr_level: A1
  category: interagire_emozioni_sentimenti
  label: Esprimere il fatto di non amare
  description: Express dislike for something or someone. Use 'Non mi piace' or '[cosa] non
    è buono/a' to say you don't like something.
  patterns:
  - Gruppo nominale non è buono
  - Non mi piace
  examples:
  - Questa carne non è buona.
- id: intemo_espnonama_a2
  cefr_level: A2
  category: interagire_emozioni_sentimenti
  label: Esprimere il fatto di non amare
  patterns:
  - Non mi piace gruppo nominale / proposizione infinitiva
  examples:
  - Non mi piace questo ristorante.
  - Non mi piace guardare la televisione.
- id: intemo_espnonama_b1
  cefr_level: B1
  category: interagire_emozioni_sentimenti
  label: Esprimere il fatto di non amare
  patterns:
  - Odio gruppo nominale / proposizione infinitiva .
  - Che schifo!¹
  examples:
  - Odio i romanzi rosa.
- id: intemo_espnonama_b2
  cefr_level: B2
  category: interagire_emozioni_sentimenti
  label: Esprimere il fatto di non amare
  patterns:
  - Non sopporto / detesto gruppo nominale / proposizione infinitiva .
  - È disgustoso.
  - Mi dà fastidio / gruppo nominale / proposizione infinitiva
  examples:
  - Mi dà fastidio la musica troppo alta.
- id: intemo_esppreferenza_a2
  cefr_level: A2
  category: interagire_emozioni_sentimenti
  label: Esprimere una preferenza
  patterns:
  - Gruppo nominale è ...più
  - Preferisco gruppo nominale / proposizione infinitiva
  examples:
  - Questo vestito è più bello.
  - Preferisco un caffè, grazie.
- id: intemo_esppreferenza_b1
  cefr_level: B1
  category: interagire_emozioni_sentimenti
  label: Esprimere una preferenza
  patterns:
  - Proposizione infinitiva ...più / meno che proposizione infinitiva
  - Proposizione infinitiva è meglio che proposizione infinitiva
  - è migliore di gruppo nominale
  - Preferisco gruppo nominale / proposizione infinitiva che gruppo nominale / proposizione
    infinitiva
  - Verbo condizionale (volentieri)... piuttosto che...
  - Mi piace (di) più gruppo nominale / proposizione infinitiva che gruppo nominale / proposizione
    infinitiva
  examples:
  - Leggere un buon romanzo è più interessante che guardare la TV.
- id: intemo_esppreferenza_b2
  cefr_level: B2
  category: interagire_emozioni_sentimenti
  label: Esprimere una preferenza
  patterns:
  - Preferisco gruppo nominale a gruppo nominale
  examples:
  - Preferisco il mare alla montagna.
- id: intemo_espsoddisf_a1
  cefr_level: A1
  category: interagire_emozioni_sentimenti
  label: Esprimere soddisfazione
  description: Express satisfaction or delight about something. Use phrases like 'Che bello!'
    to show you are pleased with a situation, object, or outcome.
  patterns:
  - Che bello!
  examples:
  - <span lang="it">Che bello! Ho trovato le chiavi!</span>
  - <span lang="it">Perfetto! La pizza è ottima.</span>
  - <span lang="it">Sono contento/a di questo regalo, grazie!</span>
  - <span lang="it">Che bello! Domani non lavoro.</span>
  - <span lang="it">Benissimo! Il treno arriva in orario.</span>
- id: intemo_espsoddisf_a2
  cefr_level: A2
  category: interagire_emozioni_sentimenti
  label: Esprimere soddisfazione
  patterns:
  - Sono (molto) contento
  - Benissimo!
- id: intemo_espsoddisf_b1
  cefr_level: B1
  category: interagire_emozioni_sentimenti
  label: Esprimere soddisfazione
  patterns:
  - Perfetto/ottimo!
  - Sono (molto) contento di proposizione infinitiva / gruppo nominale che proposizione
- id: intemo_espsoddisf_b2
  cefr_level: B2
  category: interagire_emozioni_sentimenti
  label: Esprimere soddisfazione
  patterns:
  - Questo è proprio quello che speravo / volevo / mi aspettavo / desideravo /...
  - Questo è proprio quello di cui ho bisogno / di cui avevo bisogno
  - Sono soddisfatto di gruppo nominale
  - Mi trovo a mio agio …
- id: intemo_espinsoddisf_b1
  cefr_level: B1
  category: interagire_emozioni_sentimenti
  label: Esprimere insoddisfazione, lamentarsi
  patterns:
  - Così non va bene
- id: intemo_espinsoddisf_b2
  cefr_level: B2
  category: interagire_emozioni_sentimenti
  label: Esprimere insoddisfazione, lamentarsi
  patterns:
  - Non è (proprio) così
  - Uffa!
  - Sono deluso di gruppo nominale
  - Dovrei fare un reclamo
- id: intemo_intsodinsod_a1
  cefr_level: A1
  category: interagire_emozioni_sentimenti
  label: Interrogare sulla soddisfazione e sull’insoddisfazione
  description: Ask if someone is satisfied or happy with something. Use 'Ti piace?' to check
    whether a person likes or enjoys what they have.
  patterns:
  - Ti piace?
  examples:
  - Ti piace la pizza?
  - Ti piace questo film?
  - — Come ti sembra l'appartamento? Ti piace? — Sì, mi piace molto!
  - Ti piace il tuo lavoro?
  - — Ecco il tuo caffè. Ti piace? — Sì, grazie, è ottimo!
  - Ti piace vivere a Roma?
- id: intemo_intsodinsod_a2
  cefr_level: A2
  category: interagire_emozioni_sentimenti
  label: Interrogare sulla soddisfazione e sull’insoddisfazione
  patterns:
  - Non ti piace?
- id: intemo_intsodinsod_b1
  cefr_level: B1
  category: interagire_emozioni_sentimenti
  label: Interrogare sulla soddisfazione e sull’insoddisfazione
  patterns:
  - Ci sono problemi?
  - Qual è il problema?
  - Sei contento di proposizione infinitiva / gruppo nominale , che proposizione ?
- id: intemo_intsodinsod_b2
  cefr_level: B2
  category: interagire_emozioni_sentimenti
  label: Interrogare sulla soddisfazione e sull’insoddisfazione
  patterns:
  - Non ti va più?
  - Sei soddisfatto di gruppo nominale ?
  examples:
  - Sei soddisfatto del corso?
- id: intemo_espcollera_a2
  cefr_level: A2
  category: interagire_emozioni_sentimenti
  label: Esprimere collera, cattivo umore
  patterns:
  - Sono arrabbiato / nervoso
- id: intemo_espcollera_b1
  cefr_level: B1
  category: interagire_emozioni_sentimenti
  label: Esprimere collera, cattivo umore
  patterns:
  - Basta!
- id: intemo_espcollera_b2
  cefr_level: B2
  category: interagire_emozioni_sentimenti
  label: Esprimere collera, cattivo umore
  patterns:
  - È pazzesco!
- id: intemo_placollera_b1
  cefr_level: B1
  category: interagire_emozioni_sentimenti
  label: Placare la collera o il cattivo umore altrui
  patterns:
  - Calma!
  - Dai, calmati!
- id: intemo_placollera_b2
  cefr_level: B2
  category: interagire_emozioni_sentimenti
  label: Placare la collera o il cattivo umore altrui
  patterns:
  - Dai non prendertela!
  - Non c’è motivo di proposizione infinitiva
  - Non vale la pena proposizione infinitiva
  examples:
