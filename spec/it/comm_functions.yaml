- id: intritsoc_salutare_a1
  cefr_level: A1
  category: interagire_rituali_sociali
  label: Salutare
  description: Greet someone in Italian. Use formal phrases like <span lang="it">Buongiorno,
    signora</span> or informal <span lang="it">Ciao, come stai?</span> depending on the situation.
  patterns:
  - Buongiorno/ buonasera/buonanotte signor/signora /(titolo) prof!
  - Ciao (nome) / Ciao, come stai?
  examples:
  - <span lang="it">Buongiorno, signora Rossi! Come sta?</span>
  - <span lang="it">Ciao, Marco! Come stai?</span>
  - <span lang="it">Buonasera, professore!</span>
  - <span lang="it">Ciao, Giulia! Tutto bene?</span>
  - <span lang="it">Buongiorno a tutti!</span>
  - <span lang="it">Buonanotte, signor Bianchi!</span>
- id: intritsoc_salutare_a2
  cefr_level: A2
  category: interagire_rituali_sociali
  label: Salutare
  patterns:
  - Salve! Addio
- id: intritsoc_rispsal_a1
  cefr_level: A1
  category: interagire_rituali_sociali
  label: Rispondere a un saluto
  description: Reply to a greeting. Use 'Buongiorno / Ciao' to greet back, or answer 'Come
    stai?' with 'Bene, grazie — e tu?'
  patterns:
  - Buongiorno / buonasera / buonanotte signor / signora / titolo
  - Ciao (nome)
  - Bene / non c’è male /... grazie e tu?
  examples:
  - — <span lang="it">Buongiorno, signora Rossi!</span> — <span lang="it">Buongiorno!</span>
  - — <span lang="it">Ciao, Marco! Come stai?</span> — <span lang="it">Bene, grazie! E tu?</span>
  - — <span lang="it">Buonasera, professore.</span> — <span lang="it">Buonasera, prego, si
    accomodi.</span>
  - — <span lang="it">Ciao! Come va?</span> — <span lang="it">Non c'è male, grazie. E tu come
    stai?</span>
  - — <span lang="it">Salve, signor Bianchi. Come sta?</span> — <span lang="it">Bene, grazie.
    E lei?</span>
- id: intritsoc_presqualc_a1
