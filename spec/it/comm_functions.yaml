  cefr_level: B1
  category: interagire_attivita_azioni
  label: Rispondere ad una proposta accettandola
  patterns:
  - Perché no! Volentieri!
- id: intazio_rispproacc_b2
  cefr_level: B2
  category: interagire_attivita_azioni
  label: Rispondere ad una proposta accettandola
  patterns:
