  - Vieni con me!
  - Se vuoi, possiamo andare al cinema insieme.
- id: intazio_proqualins_b1
  cefr_level: B1
  category: interagire_attivita_azioni
  label: Proporre a qualcuno di fare qualcosa insieme
  patterns:
