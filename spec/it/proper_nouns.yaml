# Proper nouns appearing in lesson text. Not vocabulary — a learner does
# not need to "learn" Roma — but they must be recognised, so an unlinked
# word can be treated as an authoring error rather than noise.
#
# `kind` is person | place | event. Register a name here rather than in
# vocab.yaml whenever it has no gloss worth teaching and no paradigm: an
# entry here says "known, deliberately not a lemma".

