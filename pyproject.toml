[project]
name = "maestro"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=0.83.0",
    "beanie>=2.0.1",
    "beautifulsoup4>=4.14.3",
    "fastapi[standard]>=0.129.0",
    "httpx>=0.28.1",
    "langchain-anthropic>=1.3.3",
    "markdown>=3.10.2",
    "markdownify>=1.2.2",
    "pymongo>=4.16.0",
    "ragas>=0.4.3",
    "rapidfuzz>=3.14.3",
    "sentence-transformers>=5.2.3",
    "spacy>=3.8.11",
    "mlx-lm>=0.22.0",
]

[dependency-groups]
dev = [
    "ruff>=0.15.2",
    "ty>=0.0.17",
]
[build-system]
requires = ["uv_build>=0.6,<0.7"]
build-backend = "uv_build"

[tool.uv.build-backend]
source-directory = "src"
