[project]
name = "maestro"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=0.83.0",
    "bcrypt>=4.0",
    "beanie>=2.0.1",
    "beautifulsoup4>=4.14.3",
    "fastapi[standard]>=0.129.0",
    "httpx>=0.28.1",
    "itsdangerous>=2.1",
    "markdown>=3.10.2",
    "markdownify>=1.2.2",
    "pymongo>=4.16.0",
    "sentence-transformers>=5.2.3",
    "pyyaml>=6.0",
    "slowapi>=0.1.9",
    "spacy>=3.8.11",
    "it-core-news-md @ https://github.com/explosion/spacy-models/releases/download/it_core_news_md-3.8.0/it_core_news_md-3.8.0.tar.gz",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-mock>=3.14",
    "mongomock-motor>=0.0.21",
    "httpx>=0.28",
    "ruff>=0.15.2",
    "ty>=0.0.17",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "unit: pure logic, no I/O",
    "integration: mongomock DB + mocked LLM",
    "llm_eval: real Anthropic API calls (slow, opt-in)",
]
[build-system]
requires = ["uv_build>=0.6,<0.7"]
build-backend = "uv_build"

[tool.uv.build-backend]
source-directory = "src"
