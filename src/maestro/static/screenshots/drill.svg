<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <defs>
    <style>
      text { font-family: system-ui, -apple-system, sans-serif; }
    </style>
  </defs>
  <!-- Background -->
  <rect width="800" height="600" fill="#FAF7F2"/>

  <!-- Nav -->
  <rect width="800" height="44" fill="#fff"/>
  <line x1="0" y1="43" x2="800" y2="43" stroke="#E8E2D9" stroke-width="2"/>
  <text x="150" y="28" font-size="14" font-weight="600" fill="#2D2926">Lesson</text>
  <text x="220" y="28" font-size="14" fill="#8A8279">Vocabulary</text>
  <text x="320" y="28" font-size="14" fill="#8A8279">Grammar</text>
  <text x="410" y="28" font-size="14" fill="#8A8279">Functions</text>
  <text x="590" y="28" font-size="14" font-weight="600" fill="#2D2926">Sara</text>
  <rect x="625" y="15" width="46" height="20" rx="4" fill="none" stroke="#E8E2D9"/>
  <text x="648" y="29" font-size="10" font-weight="600" fill="#8A8279" text-anchor="middle">Italian</text>

  <!-- Segmented progress -->
  <g transform="translate(150, 65)">
    <rect x="0" y="0" width="35" height="8" rx="4" fill="#6B8F71"/>
    <rect x="38" y="0" width="35" height="8" rx="4" fill="#6B8F71"/>
    <rect x="76" y="0" width="35" height="8" rx="4" fill="#6B8F71"/>
    <rect x="114" y="0" width="35" height="8" rx="4" fill="#6B8F71"/>
    <rect x="152" y="0" width="35" height="8" rx="4" fill="#6B8F71"/>
    <rect x="190" y="0" width="35" height="8" rx="4" fill="#6B8F71"/>
    <rect x="228" y="0" width="35" height="8" rx="4" fill="#6B8F71"/>
    <rect x="266" y="0" width="35" height="8" rx="4" fill="#C75B39"/>
    <rect x="304" y="0" width="35" height="8" rx="4" fill="#E8E2D9"/>
    <rect x="342" y="0" width="35" height="8" rx="4" fill="#E8E2D9"/>
    <rect x="380" y="0" width="35" height="8" rx="4" fill="#E8E2D9"/>
    <rect x="418" y="0" width="35" height="8" rx="4" fill="#E8E2D9"/>
    <rect x="456" y="0" width="35" height="8" rx="4" fill="#E8E2D9"/>
  </g>
  <text x="150" y="88" font-size="11" fill="#8A8279">8 / 13</text>

  <!-- Card -->
  <rect x="150" y="100" width="500" height="460" rx="10" fill="#fff" stroke="#E8E2D9"/>

  <!-- Card meta -->
  <text x="170" y="130" font-size="13" fill="#8A8279">Drill 2</text>
  <rect x="230" y="117" width="28" height="18" rx="9" fill="#F3EDE4"/>
  <text x="244" y="130" font-size="10" fill="#8A8279" text-anchor="middle">A1</text>
  <rect x="264" y="117" width="62" height="18" rx="9" fill="#F3EDE4"/>
  <text x="295" y="130" font-size="10" fill="#8A8279" text-anchor="middle">fill blank</text>

  <!-- Instruction -->
  <text x="170" y="165" font-size="13" fill="#8A8279" font-style="italic">Write the missing word in the correct form.</text>

  <!-- Item 1 — correct -->
  <text x="178" y="205" font-size="12" fill="#8A8279" text-anchor="end">1</text>
  <rect x="190" y="191" width="440" height="32" rx="4" fill="#FAF7F2"/>
  <line x1="190" y1="191" x2="190" y2="223" stroke="#E8E2D9" stroke-width="2"/>
  <text x="200" y="212" font-size="14" fill="#2D2926" font-style="italic">Io ___ al bar ogni mattina.</text>

  <rect x="190" y="228" width="440" height="26" rx="0" fill="#f0fdf4"/>
  <line x1="190" y1="228" x2="190" y2="254" stroke="#6B8F71" stroke-width="3"/>
  <text x="200" y="246" font-size="13" fill="#14532d">vado</text>
  <text x="240" y="246" font-size="13" fill="#16a34a">&#10003;</text>

  <!-- Item 2 — wrong -->
  <text x="178" y="285" font-size="12" fill="#8A8279" text-anchor="end">2</text>
  <rect x="190" y="271" width="440" height="32" rx="4" fill="#FAF7F2"/>
  <line x1="190" y1="271" x2="190" y2="303" stroke="#E8E2D9" stroke-width="2"/>
  <text x="200" y="292" font-size="14" fill="#2D2926" font-style="italic">Maria ___ una studentessa brava.</text>

  <rect x="190" y="308" width="440" height="26" rx="0" fill="#fef2f2"/>
  <line x1="190" y1="308" x2="190" y2="334" stroke="#dc2626" stroke-width="3"/>
  <text x="200" y="326" font-size="13" fill="#7f1d1d" text-decoration="line-through">e</text>

  <rect x="190" y="339" width="440" height="26" rx="0" fill="#f0fdf4"/>
  <line x1="190" y1="339" x2="190" y2="365" stroke="#6B8F71" stroke-width="3"/>
  <text x="200" y="357" font-size="13" fill="#14532d">è</text>

  <!-- Explanation -->
  <text x="200" y="388" font-size="12" fill="#3D3833">The accent distinguishes "è" (verb) from "e" (conjunction).</text>

  <!-- Grammar tag -->
  <rect x="200" y="400" width="100" height="20" rx="3" fill="#fef3c7"/>
  <text x="210" y="414" font-size="10" fill="#92400e">accent: è vs e</text>

  <!-- Rule ref -->
  <rect x="190" y="430" width="440" height="26" rx="0" fill="#F3EDE4"/>
  <line x1="190" y1="430" x2="190" y2="456" stroke="#E8E2D9" stroke-width="2"/>
  <text x="200" y="448" font-size="11" fill="#3D3833">→ Required accents (A1)</text>

  <!-- Item 3 — correct -->
  <text x="178" y="485" font-size="12" fill="#8A8279" text-anchor="end">3</text>
  <rect x="190" y="471" width="440" height="32" rx="4" fill="#FAF7F2"/>
  <line x1="190" y1="471" x2="190" y2="503" stroke="#E8E2D9" stroke-width="2"/>
  <text x="200" y="492" font-size="14" fill="#2D2926" font-style="italic">Noi ___ la pizza il venerdì.</text>

  <rect x="190" y="508" width="440" height="26" rx="0" fill="#f0fdf4"/>
  <line x1="190" y1="508" x2="190" y2="534" stroke="#6B8F71" stroke-width="3"/>
  <text x="200" y="526" font-size="13" fill="#14532d">mangiamo</text>
  <text x="270" y="526" font-size="13" fill="#16a34a">&#10003;</text>
</svg>
