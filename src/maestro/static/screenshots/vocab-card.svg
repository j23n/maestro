<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <defs>
    <style>
      text { font-family: system-ui, -apple-system, sans-serif; }
    </style>
  </defs>
  <!-- Background -->
  <rect width="800" height="600" fill="#FAF7F2"/>

  <!-- Nav -->
  <rect width="800" height="44" fill="#fff"/>
  <line x1="0" y1="43" x2="800" y2="43" stroke="#E8E2D9" stroke-width="2"/>
  <text x="150" y="28" font-size="14" fill="#8A8279">Lesson</text>
  <text x="220" y="28" font-size="14" font-weight="600" fill="#2D2926">Vocabulary</text>
  <text x="320" y="28" font-size="14" fill="#8A8279">Grammar</text>
  <text x="410" y="28" font-size="14" fill="#8A8279">Functions</text>
  <text x="590" y="28" font-size="14" font-weight="600" fill="#2D2926">Sara</text>
  <rect x="625" y="15" width="46" height="20" rx="4" fill="none" stroke="#E8E2D9"/>
  <text x="648" y="29" font-size="10" font-weight="600" fill="#8A8279" text-anchor="middle">Italian</text>

  <!-- Segmented progress bar -->
  <g transform="translate(200, 65)">
    <rect x="0" y="0" width="24" height="8" rx="4" fill="#6B8F71"/>
    <rect x="27" y="0" width="24" height="8" rx="4" fill="#6B8F71"/>
    <rect x="54" y="0" width="24" height="8" rx="4" fill="#C75B39"/>
    <rect x="81" y="0" width="24" height="8" rx="4" fill="#E8E2D9"/>
    <rect x="108" y="0" width="24" height="8" rx="4" fill="#E8E2D9"/>
    <rect x="135" y="0" width="24" height="8" rx="4" fill="#E8E2D9"/>
    <rect x="162" y="0" width="24" height="8" rx="4" fill="#E8E2D9"/>
    <rect x="189" y="0" width="24" height="8" rx="4" fill="#E8E2D9"/>
  </g>
  <text x="200" y="88" font-size="11" fill="#8A8279">3 / 8</text>

  <!-- Card -->
  <rect x="200" y="105" width="400" height="420" rx="10" fill="#fff" stroke="#E8E2D9"/>

  <!-- Queue -->
  <text x="220" y="135" font-size="12" fill="#8A8279">5 / 12</text>

  <!-- Prompt -->
  <text x="220" y="162" font-size="11" fill="#8A8279" letter-spacing="0.04em">WHAT'S THE ITALIAN WORD FOR...</text>

  <!-- Word -->
  <text x="400" y="212" font-size="32" font-weight="600" fill="#2D2926" text-anchor="middle">mangiare</text>
  <text x="400" y="237" font-size="13" fill="#8A8279" text-anchor="middle">v. tr. · man·già·re · A1</text>

  <!-- Divider -->
  <line x1="230" y1="258" x2="570" y2="258" stroke="#E8E2D9"/>

  <!-- Senses -->
  <text x="230" y="290" font-size="14" font-weight="600" fill="#3D3833">to eat</text>
  <text x="230" y="310" font-size="13" fill="#8A8279" font-style="italic">Mangiamo alle otto stasera.</text>

  <text x="230" y="344" font-size="14" font-weight="600" fill="#3D3833">to corrode, to eat away</text>
  <text x="230" y="364" font-size="13" fill="#8A8279" font-style="italic">La ruggine mangia il ferro.</text>

  <!-- Rating buttons -->
  <rect x="220" y="415" width="170" height="42" rx="6" fill="#C75B39"/>
  <text x="305" y="441" font-size="14" font-weight="600" fill="#fff" text-anchor="middle">Incorrect</text>

  <rect x="410" y="415" width="170" height="42" rx="6" fill="#6B8F71"/>
  <text x="495" y="441" font-size="14" font-weight="600" fill="#fff" text-anchor="middle">Correct</text>

  <!-- Skip -->
  <text x="580" y="545" font-size="12" fill="#8A8279" text-anchor="end">Skip activity</text>
</svg>
