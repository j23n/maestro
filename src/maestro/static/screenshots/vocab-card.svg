<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <defs>
    <style>
      text { font-family: system-ui, -apple-system, sans-serif; }
    </style>
  </defs>
  <!-- Background -->
  <rect width="800" height="600" fill="#fff"/>
  <!-- Nav -->
  <rect width="800" height="40" fill="#fff"/>
  <line x1="0" y1="40" x2="800" y2="40" stroke="#e5e5e5"/>
  <text x="150" y="26" font-size="13" fill="#555">Lezione</text>
  <text x="230" y="26" font-size="13" fill="#555">Vocabolario</text>
  <text x="330" y="26" font-size="13" fill="#555">Grammatica</text>
  <text x="430" y="26" font-size="13" fill="#555">Profilo</text>

  <!-- Progress bar -->
  <rect x="200" y="60" width="400" height="4" rx="2" fill="#e5e5e5"/>
  <rect x="200" y="60" width="120" height="4" rx="2" fill="#111"/>
  <text x="200" y="78" font-size="11" fill="#aaa">3 / 15</text>

  <!-- Card -->
  <rect x="200" y="100" width="400" height="400" rx="8" fill="#fff" stroke="#e5e5e5"/>

  <!-- Card queue -->
  <text x="220" y="130" font-size="12" fill="#bbb">5 / 12</text>

  <!-- Word -->
  <text x="400" y="180" font-size="32" font-weight="600" fill="#111" text-anchor="middle">mangiare</text>
  <text x="400" y="205" font-size="13" fill="#999" text-anchor="middle">v. tr.</text>

  <!-- Divider (back revealed) -->
  <line x1="230" y1="230" x2="570" y2="230" stroke="#e5e5e5"/>

  <!-- Translation -->
  <text x="400" y="265" font-size="18" font-weight="600" fill="#111" text-anchor="middle">to eat</text>

  <!-- Senses -->
  <text x="240" y="300" font-size="13" fill="#333">1. consumare cibo, nutrirsi</text>
  <text x="260" y="320" font-size="12" fill="#888" font-style="italic">Mangiamo alle otto stasera.</text>
  <text x="240" y="348" font-size="13" fill="#333">2. corrodere, consumare</text>
  <text x="260" y="368" font-size="12" fill="#888" font-style="italic">La ruggine mangia il ferro.</text>

  <!-- Rating buttons -->
  <rect x="220" y="415" width="64" height="34" rx="4" fill="#f5f5f5" stroke="#d0d0d0"/>
  <text x="252" y="437" font-size="13" fill="#555" text-anchor="middle">1</text>

  <rect x="294" y="415" width="64" height="34" rx="4" fill="#f5f5f5" stroke="#d0d0d0"/>
  <text x="326" y="437" font-size="13" fill="#555" text-anchor="middle">2</text>

  <rect x="368" y="415" width="64" height="34" rx="4" fill="#f5f5f5" stroke="#d0d0d0"/>
  <text x="400" y="437" font-size="13" fill="#555" text-anchor="middle">3</text>

  <rect x="442" y="415" width="64" height="34" rx="4" fill="#f5f5f5" stroke="#d0d0d0"/>
  <text x="474" y="437" font-size="13" fill="#555" text-anchor="middle">4</text>

  <rect x="516" y="415" width="64" height="34" rx="4" fill="#f5f5f5" stroke="#d0d0d0"/>
  <text x="548" y="437" font-size="13" fill="#555" text-anchor="middle">5</text>

  <!-- Rating labels -->
  <text x="252" y="465" font-size="9" fill="#bbb" text-anchor="middle">di nuovo</text>
  <text x="400" y="465" font-size="9" fill="#bbb" text-anchor="middle">difficile</text>
  <text x="548" y="465" font-size="9" fill="#bbb" text-anchor="middle">facile</text>

  <!-- Skip -->
  <text x="600" y="530" font-size="12" fill="#bbb" text-anchor="end">Salta attività</text>
</svg>
