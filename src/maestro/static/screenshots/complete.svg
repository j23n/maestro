<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <defs>
    <style>
      text { font-family: system-ui, -apple-system, sans-serif; }
    </style>
  </defs>
  <!-- Background -->
  <rect width="800" height="600" fill="#fff"/>
  <!-- Nav -->
  <rect width="800" height="40" fill="#fff"/>
  <line x1="0" y1="40" x2="800" y2="40" stroke="#e5e5e5"/>
  <text x="150" y="26" font-size="13" fill="#555">Lezione</text>
  <text x="230" y="26" font-size="13" fill="#555">Vocabolario</text>
  <text x="330" y="26" font-size="13" fill="#555">Grammatica</text>
  <text x="430" y="26" font-size="13" fill="#555">Profilo</text>

  <!-- Hero -->
  <text x="400" y="90" font-size="36" text-anchor="middle">🎉</text>
  <text x="400" y="125" font-size="22" font-weight="600" fill="#111" text-anchor="middle">Lezione completata!</text>
  <text x="400" y="150" font-size="14" fill="#888" text-anchor="middle">Ottimo lavoro. Ecco il riepilogo.</text>

  <!-- Stats grid (3 cards) -->
  <rect x="190" y="170" width="130" height="72" rx="8" fill="#fff" stroke="#e5e5e5"/>
  <text x="255" y="205" font-size="26" font-weight="600" fill="#111" text-anchor="middle">12</text>
  <text x="255" y="225" font-size="11" fill="#999" text-anchor="middle">completate</text>

  <rect x="335" y="170" width="130" height="72" rx="8" fill="#fff" stroke="#e5e5e5"/>
  <text x="400" y="205" font-size="26" font-weight="600" fill="#111" text-anchor="middle">1</text>
  <text x="400" y="225" font-size="11" fill="#999" text-anchor="middle">saltate</text>

  <rect x="480" y="170" width="130" height="72" rx="8" fill="#fff" stroke="#e5e5e5"/>
  <text x="545" y="205" font-size="26" font-weight="600" fill="#111" text-anchor="middle">20'</text>
  <text x="545" y="225" font-size="11" fill="#999" text-anchor="middle">durata prevista</text>

  <!-- Activity summary -->
  <rect x="190" y="258" width="420" height="170" rx="8" fill="#fff" stroke="#e5e5e5"/>
  <text x="210" y="282" font-size="11" font-weight="500" fill="#aaa" letter-spacing="0.05em">ATTIVITÀ SVOLTE</text>
  <line x1="190" y1="290" x2="610" y2="290" stroke="#e5e5e5"/>

  <text x="210" y="312" font-size="12" fill="#16a34a">✓</text>
  <text x="230" y="312" font-size="13" fill="#333">Ripasso vocabolario</text>
  <line x1="190" y1="322" x2="610" y2="322" stroke="#f0f0f0"/>

  <text x="210" y="342" font-size="12" fill="#16a34a">✓</text>
  <text x="230" y="342" font-size="13" fill="#333">Esercizio 1 — Al ristorante</text>
  <line x1="190" y1="352" x2="610" y2="352" stroke="#f0f0f0"/>

  <text x="210" y="372" font-size="12" fill="#16a34a">✓</text>
  <text x="230" y="372" font-size="13" fill="#333">Esercizio 2 — Articoli</text>
  <line x1="190" y1="382" x2="610" y2="382" stroke="#f0f0f0"/>

  <text x="210" y="402" font-size="12" fill="#16a34a">✓</text>
  <text x="230" y="402" font-size="13" fill="#333">Lettura — La giornata di Marco</text>
  <line x1="190" y1="412" x2="610" y2="412" stroke="#f0f0f0"/>

  <text x="210" y="418" font-size="12" fill="#bbb">–</text>
  <text x="230" y="418" font-size="13" fill="#bbb">Scrittura — Al mercato</text>

  <!-- Feedback box -->
  <rect x="190" y="440" width="420" height="72" rx="8" fill="#fff" stroke="#e5e5e5"/>
  <text x="210" y="462" font-size="11" font-weight="500" fill="#aaa" letter-spacing="0.05em">FEEDBACK</text>
  <text x="210" y="485" font-size="13" fill="#333">
    <tspan x="210" dy="0">Hai dimostrato buon controllo degli articoli</tspan>
    <tspan x="210" dy="18">determinativi. Ripassa l'uso dell'accento su "è".</tspan>
  </text>

  <!-- Action links -->
  <rect x="190" y="530" width="160" height="40" rx="8" fill="#111"/>
  <text x="270" y="555" font-size="14" font-weight="500" fill="#fff" text-anchor="middle">Nuova lezione →</text>

  <rect x="365" y="530" width="110" height="40" rx="8" fill="#fff" stroke="#d0d0d0"/>
  <text x="420" y="555" font-size="14" fill="#333" text-anchor="middle">Vocabolario</text>

  <rect x="490" y="530" width="90" height="40" rx="8" fill="#fff" stroke="#d0d0d0"/>
  <text x="535" y="555" font-size="14" fill="#333" text-anchor="middle">Profilo</text>
</svg>
