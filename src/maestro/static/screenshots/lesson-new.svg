<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <defs>
    <style>
      text { font-family: system-ui, -apple-system, sans-serif; }
      .serif { font-family: Georgia, 'Times New Roman', serif; }
    </style>
  </defs>
  <!-- Background -->
  <rect width="800" height="600" fill="#FAF7F2"/>

  <!-- Nav -->
  <rect width="800" height="44" fill="#fff"/>
  <line x1="0" y1="43" x2="800" y2="43" stroke="#E8E2D9" stroke-width="2"/>
  <text x="150" y="28" font-size="14" font-weight="600" fill="#2D2926">Lesson</text>
  <text x="220" y="28" font-size="14" fill="#8A8279">Vocabulary</text>
  <text x="320" y="28" font-size="14" fill="#8A8279">Grammar</text>
  <text x="410" y="28" font-size="14" fill="#8A8279">Functions</text>
  <text x="590" y="28" font-size="14" font-weight="600" fill="#2D2926">Sara</text>
  <rect x="625" y="15" width="46" height="20" rx="4" fill="none" stroke="#E8E2D9"/>
  <text x="648" y="29" font-size="10" font-weight="600" fill="#8A8279" text-anchor="middle">Italian</text>

  <!-- Title -->
  <text x="400" y="110" class="serif" font-size="24" font-weight="600" fill="#2D2926" text-anchor="middle">New Lesson</text>
  <text x="400" y="136" font-size="14" fill="#8A8279" text-anchor="middle">Your teacher will prepare a lesson tailored to you.</text>

  <!-- Topic selector -->
  <text x="240" y="185" font-size="11" font-weight="700" fill="#C75B39" letter-spacing="0.08em">TOPIC</text>
  <rect x="240" y="195" width="320" height="38" rx="6" fill="#fff" stroke="#E8E2D9"/>
  <text x="256" y="219" font-size="14" fill="#3D3833">Al ristorante · 1/3</text>
  <text x="544" y="220" font-size="11" fill="#8A8279">&#9662;</text>

  <!-- Focus weak grammar -->
  <rect x="240" y="250" width="320" height="46" rx="8" fill="#fff" stroke="#E8E2D9"/>
  <rect x="254" y="266" width="14" height="14" rx="3" fill="none" stroke="#E8E2D9" stroke-width="1.5"/>
  <text x="278" y="278" font-size="13" font-weight="500" fill="#3D3833">Focus weak grammar</text>
  <rect x="420" y="265" width="70" height="18" rx="9" fill="#F3EDE4"/>
  <text x="455" y="278" font-size="10" fill="#8A8279" text-anchor="middle">pres. ind.</text>
  <rect x="496" y="265" width="50" height="18" rx="9" fill="#F3EDE4"/>
  <text x="521" y="278" font-size="10" fill="#8A8279" text-anchor="middle">def. art.</text>

  <!-- Duration -->
  <text x="240" y="330" font-size="11" font-weight="700" fill="#C75B39" letter-spacing="0.08em">HOW MUCH TIME DO YOU HAVE?</text>

  <!-- 10 min -->
  <rect x="240" y="345" width="100" height="72" rx="8" fill="#fff" stroke="#E8E2D9"/>
  <text x="290" y="378" font-size="24" font-weight="600" fill="#3D3833" text-anchor="middle">10</text>
  <text x="290" y="400" font-size="12" fill="#8A8279" text-anchor="middle">minutes</text>

  <!-- 20 min (selected) -->
  <rect x="350" y="345" width="100" height="72" rx="8" fill="#2D2926"/>
  <text x="400" y="378" font-size="24" font-weight="600" fill="#fff" text-anchor="middle">20</text>
  <text x="400" y="400" font-size="12" fill="rgba(255,255,255,0.7)" text-anchor="middle">minutes</text>

  <!-- 40 min -->
  <rect x="460" y="345" width="100" height="72" rx="8" fill="#fff" stroke="#E8E2D9"/>
  <text x="510" y="378" font-size="24" font-weight="600" fill="#3D3833" text-anchor="middle">40</text>
  <text x="510" y="400" font-size="12" fill="#8A8279" text-anchor="middle">minutes</text>

  <!-- Start button -->
  <rect x="240" y="455" width="320" height="46" rx="6" fill="#C75B39"/>
  <text x="400" y="483" font-size="15" font-weight="600" fill="#fff" text-anchor="middle">Start lesson</text>

  <!-- Hint -->
  <text x="400" y="525" font-size="12" fill="#8A8279" text-anchor="middle">Preparation takes a few seconds.</text>
</svg>
