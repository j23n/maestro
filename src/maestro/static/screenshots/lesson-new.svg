<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <defs>
    <style>
      text { font-family: system-ui, -apple-system, sans-serif; }
    </style>
  </defs>
  <!-- Background -->
  <rect width="800" height="600" fill="#fff"/>
  <!-- Nav bar -->
  <rect width="800" height="40" fill="#fff"/>
  <line x1="0" y1="40" x2="800" y2="40" stroke="#e5e5e5"/>
  <text x="150" y="26" font-size="13" fill="#555">Lezione</text>
  <text x="230" y="26" font-size="13" fill="#555">Vocabolario</text>
  <text x="330" y="26" font-size="13" fill="#555">Grammatica</text>
  <text x="430" y="26" font-size="13" fill="#555">Profilo</text>

  <!-- Page content centered -->
  <text x="400" y="140" font-size="22" font-weight="600" fill="#111" text-anchor="middle">Nuova Lezione</text>
  <text x="400" y="168" font-size="14" fill="#666" text-anchor="middle">Il tuo insegnante preparerà una lezione su misura per te.</text>

  <!-- Section label -->
  <text x="240" y="220" font-size="11" font-weight="500" fill="#777" text-transform="uppercase" letter-spacing="0.05em">QUANTO TEMPO HAI?</text>

  <!-- Duration options: 10 / 20 / 40 -->
  <!-- 10 min -->
  <rect x="240" y="238" width="100" height="70" rx="8" fill="#fff" stroke="#d0d0d0"/>
  <text x="290" y="272" font-size="22" font-weight="600" fill="#333" text-anchor="middle">10</text>
  <text x="290" y="293" font-size="12" fill="#333" text-anchor="middle" opacity="0.8">minuti</text>

  <!-- 20 min (selected) -->
  <rect x="350" y="238" width="100" height="70" rx="8" fill="#111"/>
  <text x="400" y="272" font-size="22" font-weight="600" fill="#fff" text-anchor="middle">20</text>
  <text x="400" y="293" font-size="12" fill="#fff" text-anchor="middle" opacity="0.8">minuti</text>

  <!-- 40 min -->
  <rect x="460" y="238" width="100" height="70" rx="8" fill="#fff" stroke="#d0d0d0"/>
  <text x="510" y="272" font-size="22" font-weight="600" fill="#333" text-anchor="middle">40</text>
  <text x="510" y="293" font-size="12" fill="#333" text-anchor="middle" opacity="0.8">minuti</text>

  <!-- Start button -->
  <rect x="240" y="350" width="320" height="46" rx="8" fill="#111"/>
  <text x="400" y="379" font-size="16" font-weight="500" fill="#fff" text-anchor="middle">Inizia la lezione</text>

  <!-- Hint -->
  <text x="400" y="420" font-size="13" fill="#999" text-anchor="middle">La preparazione richiede qualche secondo.</text>
</svg>
