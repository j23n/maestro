  chunk_ref: book_7_il_pronome_pronomi_indefiniti
  label: Pronomi indefiniti nessuno, niente
  explanations:
    en:
      title: Saying 'nobody' and 'nothing' in Italian
      tip: Use 'nessuno' for 'nobody/no one' and 'niente' for 'nothing'. When they
        come after the verb, you must also put 'non' before the verb — but never use
        both together before the verb.
      explanation: '## The two pronouns


        <span lang="it">**nessuno**</span> means ''nobody,'' ''no one,'' or ''not
        anyone.''

        <span lang="it">**niente**</span> (also <span lang="it">nulla</span>, which
        is slightly more formal) means ''nothing'' or ''not anything.''


        Both are **indefinite pronouns** — they refer to a person or thing in a completely
        unspecified, zero-quantity way.


        ## The double-negative rule


        Italian uses a double negative that English does not. The rule works like
        this:


        - If <span lang="it">nessuno</span> or <span lang="it">niente</span> comes
        **before** the verb, no <span lang="it">non</span> is needed.

        - If <span lang="it">nessuno</span> or <span lang="it">niente</span> comes
        **after** the verb, you **must** add <span lang="it">non</span> before the
        verb.


        This is not an error — it is correct, standard Italian grammar.


        ### Position before the verb (no ''non'' needed)


        | Italian | English |

        |---|---|

        | Nessuno è a casa. | Nobody is home. |

        | Niente è pronto. | Nothing is ready. |


        ### Position after the verb (''non'' required before the verb)


        | Italian | English |

        |---|---|

        | Non c''è nessuno a casa. | There is nobody home. |

        | Non ho niente. | I have nothing. |


        The second pattern (<span lang="it">non</span> + verb + <span lang="it">nessuno/niente</span>)
        is by far the more common word order in everyday Italian. You will see and
        hear it constantly.


        ## Examples


        **1.** <span lang="it">Non c''è nessuno in cucina.</span>

        (There is nobody in the kitchen.)

        — Everyday situation; <span lang="it">nessuno</span> follows the verb, so
        <span lang="it">non</span> is required.


        **2.** <span lang="it">Nessuno mangia la verdura.</span>

        (Nobody eats the vegetables.)

        — <span lang="it">Nessuno</span> is the subject before the verb; no <span
        lang="it">non</span> needed.


        **3.** <span lang="it">Non ho niente da mangiare.</span>

        (I have nothing to eat.)

        — Common daily-life sentence; double negative is correct and required.


        **4.** <span lang="it">— Cosa c''è nel frigo? — Niente.</span>

        (— What is in the fridge? — Nothing.)

        — As a one-word answer, <span lang="it">niente</span> stands alone with no
        verb, so no <span lang="it">non</span> is needed.


        **5.** <span lang="it">Non conosco nessuno qui.</span>

        (I don''t know anyone here.)

        — Contrastive note: in English you switch to ''anyone'' after a negative;
        in Italian you keep <span lang="it">nessuno</span>, not a separate word.


        **6.** <span lang="it">Niente è difficile per lei.</span>

        (Nothing is difficult for her.)

        — <span lang="it">Niente</span> as subject before the verb; no <span lang="it">non</span>
        needed.


        ## Common learner mistakes


        **Mistake 1 — Omitting <span lang="it">non</span> when the negative word follows
        the verb:**

        <span lang="it">*Ho niente.</span> ✗

        <span lang="it">Non ho niente.</span> ✓

        English speakers drop <span lang="it">non</span> because they think ''I have
        nothing'' already contains one negative. In Italian, both are required.


        **Mistake 2 — Using <span lang="it">non</span> when the negative word is already
        before the verb:**

        <span lang="it">*Non nessuno è a casa.</span> ✗

        <span lang="it">Nessuno è a casa.</span> ✓

        When <span lang="it">nessuno</span> or <span lang="it">niente</span> leads
        the sentence, do not also add <span lang="it">non</span>.


        **Mistake 3 — Using ''anything'' logic and choosing a different word:**

        Learners sometimes try to say ''I don''t know anyone'' by inventing a word
        like <span lang="it">*qualcuno</span> in a negative sentence. This is wrong.
        Italian keeps <span lang="it">nessuno</span> even in sentences that are already
        negative: <span lang="it">Non conosco nessuno.</span> ✓


        **Mistake 4 — Confusing <span lang="it">niente</span> (pronoun) with <span
        lang="it">nessuno</span> (pronoun):**

        <span lang="it">nessuno</span> refers only to **people**; <span lang="it">niente</span>
        refers only to **things**. Do not swap them: <span lang="it">Non vedo nessuno</span>
        (I see nobody) vs. <span lang="it">Non vedo niente</span> (I see nothing).


        ## Quick-reference summary


        | Pronoun | Refers to | Before verb | After verb |

        |---|---|---|---|

        | nessuno | people | Nessuno viene. | Non viene nessuno. |

        | niente | things | Niente cambia. | Non cambia niente. |'
      language: en
      why_this_matters: From your very first conversations in Italian, you will need
        to say things like 'Nobody is home' or 'I have nothing.' These two words —
        <span lang="it">nessuno</span> and <span lang="it">niente</span> — are among
        the most common indefinite pronouns in the language. Getting their position
        and double-negative rule right will immediately make your Italian sound natural
        and prevent one of the most persistent errors learners make.
