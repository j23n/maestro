- code: coord_disj
  cefr_level: A1
  category: frase_complessa
  source_url: https://www.unistrapg.it/profilo_lingua_italiana/site/gram_frasecomplessa_a1.html
  unistr_code: proposizioni_coordinate_disgiuntive_utilizzando_il_connettivo_o_es_mangi_qui_o
  unistr_label: Proposizioni coordinate disgiuntive utilizzando il connettivo o ,
    es. Mangi qui o vai a casa?
  chunk_ref: book_11_la_congiunzione_congiunzioni_coordinative
  label: Proposizioni coordinate disgiuntive con congiunzione o
  explanations:
    en:
      title: Joining alternatives with 'o'
      tip: Use 'o' (or) between two words or sentences to show a choice between alternatives.
        It works exactly like English 'or' — place it between the two options you
        want to connect.
      explanation: '## The rule


        The coordinating conjunction <span lang="it">o</span> (meaning ''or'') joins
        two words, phrases, or whole sentences (''proposizioni coordinate disgiuntive''
        — disjunctive co-ordinate clauses) that are alternatives: choosing one logically
        excludes the other. Simply place <span lang="it">o</span> between the two
        items you want to contrast.


        **Basic pattern:** [option A] + <span lang="it">o</span> + [option B]


        There is no change for gender, number, or person — <span lang="it">o</span>
        is invariable.


        ## Variants and related words


        Italian offers several words that mean ''or''. They are interchangeable in
        most everyday situations, but each has a slightly different register or nuance:


        | Forma | English | Notes |

        |---|---|---|

        | o | or | the most common, neutral form |

        | oppure | or / or else | slightly more emphatic; very common in speech |

        | ovvero | or / that is to say | more formal; can also introduce a clarification
        |


        At A1 level, focus on <span lang="it">o</span> and <span lang="it">oppure</span>.
        You will hear and read both constantly.


        ### The doubled form: o...o


        When you want to stress that the choice is strictly between two options and
        no others, Italian repeats the conjunction: <span lang="it">o... o...</span>
        (''either... or...''). This is called a correlative use.


        <span lang="it">O ora o mai più.</span> (Either now or never.)


        You do not need to produce this form at A1, but you will encounter it, so
        it is worth recognising.


        ## Examples


        **Joining two nouns (a simple choice):**

        <span lang="it">Vuoi tè o caffè?</span>

        (Do you want tea or coffee?)


        **Joining two adjectives:**

        <span lang="it">Il latte è caldo o freddo?</span>

        (Is the milk hot or cold?)


        **Joining two verb phrases:**

        <span lang="it">Mangi a casa o al ristorante?</span>

        (Are you eating at home or at a restaurant?)


        **Joining two full sentences:**

        <span lang="it">Non ho deciso se scrivere oppure telefonare.</span>

        (I haven''t decided whether to write or to call.)


        **Edge case — <span lang="it">o</span> versus <span lang="it">e</span> (and):**

        <span lang="it">Prendo il pane e il latte.</span> (I''m buying bread and milk.)
        — both items, no choice

        <span lang="it">Prendo il pane o il latte.</span> (I''m buying bread or milk.)
        — one item, a choice must be made


        This contrast is important: <span lang="it">e</span> adds things together,
        while <span lang="it">o</span> separates them into alternatives.


        ## Common learner mistakes


        **Mistake 1: Confusing <span lang="it">o</span> with <span lang="it">e</span>.**

        Learners sometimes write <span lang="it">e</span> when they mean <span lang="it">o</span>
        because both connect two items. Ask yourself: are both things happening together?
        Use <span lang="it">e</span>. Is only one possible? Use <span lang="it">o</span>.


        ✗ <span lang="it">Vieni martedì e mercoledì?</span> (Are you coming Tuesday
        and Wednesday? — implies both days)

        ✓ <span lang="it">Vieni martedì o mercoledì?</span> (Are you coming Tuesday
        or Wednesday? — one day, a choice)


        **Mistake 2: Adding an accent — writing <span lang="it">ò</span> instead of
        <span lang="it">o</span>.**

        The conjunction <span lang="it">o</span> (''or'') has no accent. The accented
        form <span lang="it">ò</span> does not exist as a standard word. Do not confuse
        this with <span lang="it">è</span> (accented form of <span lang="it">e</span>,
        meaning ''is''), which does carry an accent. Write simply <span lang="it">o</span>.


        **Mistake 3: Omitting <span lang="it">o</span> and listing options without
        a connector.**

        In English, informal speech sometimes drops ''or'' (''Tea? Coffee?''). In
        Italian, it is normal and much clearer to include <span lang="it">o</span>
        between the final two options.


        ✗ <span lang="it">Vuoi tè, caffè?</span>

        ✓ <span lang="it">Vuoi tè o caffè?</span>'
      language: en
      why_this_matters: Almost every conversation involves making choices or offering
        alternatives — 'tea or coffee?', 'today or tomorrow?', 'do you want to walk
        or take the bus?' Without <span lang="it">o</span> ('or'), you cannot express
        any of these ideas in Italian. This tiny word appears in questions, suggestions,
        and everyday decisions at every level of the language, so recognising and
        using it correctly from day one removes a constant gap in your speech.
