- code: subord_fin
  cefr_level: A1
  category: frase_complessa
  source_url: https://www.unistrapg.it/profilo_lingua_italiana/site/gram_frasecomplessa_a1.html
  unistr_code: proposizioni_finali_implicite_con_uso_della_preposizione_per_infinito_es_sono
  unistr_label: Proposizioni finali implicite con uso della preposizione per + infinito,
    es. Sono qui per imparare l’italiano .
  chunk_ref: book_11_la_congiunzione_congiunzioni_subordinative
  label: Proposizioni finali implicite con preposizione per e infinito
  explanations:
    en:
      title: Expressing purpose with 'per' and the infinitive
      tip: To say why you do something, use 'per' followed by the infinitive. This
        works whenever the subject of both verbs is the same person. It is the simplest
        and most natural way to express purpose in Italian.
      explanation: '## The rule


        To express purpose — the reason or goal behind an action — Italian uses the
        preposition <span lang="it">per</span> (''in order to'', ''to'', ''for'')
        followed by the **infinitive** of a verb. This construction is called an *implicit
        final clause* because the purpose is expressed without a full subordinate
        clause.


        **Formula:**


        Main clause + <span lang="it">per</span> + infinitive


        Example:

        <span lang="it">Studio l''italiano per parlare con la mia famiglia.</span>

        (I study Italian to speak with my family.)


        The infinitive is always in its base form — the form you find in the dictionary,
        ending in <span lang="it">-are</span>, <span lang="it">-ere</span>, or <span
        lang="it">-ire</span>. It does **not** change to agree with the subject.


        ## The key condition: same subject


        This structure is only used when **both verbs share the same subject** — that
        is, the person doing the main action and the person doing the purpose action
        are the same.


        ✔ Same subject (use <span lang="it">per</span> + infinitive):

        <span lang="it">Vado al bar per prendere un caffè.</span>

        (I go to the bar to get a coffee. — *I* go, *I* get.)


        ✘ Different subjects (do NOT use this structure — use <span lang="it">affinché/perché</span>
        + subjunctive instead):

        <span lang="it">Ti scrivo perché tu sappia la verità.</span>

        (I write to you so that *you* know the truth. — *I* write, *you* know.)


        At A1 level, you will almost always be dealing with the same-subject case,
        so <span lang="it">per</span> + infinitive is your go-to tool for expressing
        purpose.


        ## Forming the construction


        No changes are needed to the infinitive. Here is how the structure looks with
        verbs from all three conjugation classes:


        | Infinitive class | Example infinitive | With per |

        |---|---|---|

        | -are | mangiare (to eat) | per mangiare |

        | -ere | prendere (to take) | per prendere |

        | -ire | dormire (to sleep) | per dormire |


        Irregular verbs use their standard infinitive form too:


        | Infinitive | With per |

        |---|---|

        | essere (to be) | per essere |

        | avere (to have) | per avere |

        | fare (to do/make) | per fare |

        | andare (to go) | per andare |


        ## Position in the sentence


        The <span lang="it">per</span> + infinitive phrase most naturally comes **after**
        the main clause, but it can also appear at the **beginning** of the sentence
        for emphasis. Both positions are correct.


        After the main clause (most common):

        <span lang="it">Apro la finestra per prendere aria.</span>

        (I open the window to get some air.)


        At the start of the sentence (for emphasis):

        <span lang="it">Per mangiare bene, andiamo al ristorante.</span>

        (To eat well, we go to the restaurant.)


        ## Examples


        **1. Daily routine (basic use)**

        <span lang="it">Mi alzo presto per fare colazione con la mia famiglia.</span>

        (I get up early to have breakfast with my family.)


        **2. Movement with a goal (very common at A1)**

        <span lang="it">Vado al supermercato per comprare il pane.</span>

        (I go to the supermarket to buy bread.)


        **3. Learning a language**

        <span lang="it">Studio l''italiano per capire i miei amici.</span>

        (I study Italian to understand my friends.)


        **4.** <span lang="it">Per</span> at the start of the sentence

        <span lang="it">Per dormire meglio, bevo una camomilla la sera.</span>

        (To sleep better, I drink chamomile tea in the evening.)


        **5. Edge case — contrastive pair (same vs. different subject)**

        <span lang="it">Chiamo la nonna per salutarla.</span>

        (I call grandma to greet her. ← same subject: *I* call, *I* greet. ✔ Use <span
        lang="it">per</span> + infinitive.)


        <span lang="it">Chiamo la nonna perché lei sappia che sto bene.</span>

        (I call grandma so that *she* knows I am well. ← different subjects: *I* call,
        *she* knows. ✘ Cannot use <span lang="it">per</span> + infinitive here.)


        **6. Negative purpose (to avoid doing something)**

        <span lang="it">Parlo piano per non svegliare il bambino.</span>

        (I speak quietly so as not to wake the baby.)

        (Add <span lang="it">non</span> directly before the infinitive to make the
        purpose negative.)


        ## Common learner mistakes


        **Mistake 1: Conjugating the infinitive**

        <span lang="it">✘ Vado al bar per prendo un caffè.</span>

        (Incorrect — <span lang="it">prendo</span> is a conjugated form, not an infinitive.)

        <span lang="it">✔ Vado al bar per prendere un caffè.</span>


        **Mistake 2: Inserting a second subject pronoun**

        <span lang="it">✘ Studio per io parlare italiano.</span>

        (Incorrect — no subject pronoun is used inside the <span lang="it">per</span>
        + infinitive phrase.)

        <span lang="it">✔ Studio per parlare italiano.</span>


        **Mistake 3: Using** <span lang="it">per</span> **when the subjects are different**

        <span lang="it">✘ Le parlo per lei capisce.</span>

        (Incorrect structure entirely.)

        <span lang="it">✔ Le parlo perché lei capisca.</span>

        (Correct — use <span lang="it">perché</span> + subjunctive when subjects differ.
        This is a B1 structure; at A1 simply remember that <span lang="it">per</span>
        + infinitive requires the same subject.)


        **Mistake 4: Confusing purposive** <span lang="it">per</span> **with causal**
        <span lang="it">perché</span>

        These two words look similar but work differently.

        <span lang="it">Resto a casa perché sono stanco.</span> (I stay home *because*
        I am tired. ← <span lang="it">perché</span> gives a reason/cause with a full
        conjugated clause.)

        <span lang="it">Resto a casa per riposare.</span> (I stay home *in order to*
        rest. ← <span lang="it">per</span> + infinitive gives a purpose/goal.)'
      language: en
      why_this_matters: Saying *why* you do something is one of the first things you
        need in any language. Without this structure, you cannot explain that you
        are studying Italian *to travel*, eating *to stay healthy*, or going to the
        shop *to buy bread*. The pattern <span lang="it">per</span> + infinitive appears
        in almost every real conversation, so mastering it early removes a major gap
        in your ability to communicate.
