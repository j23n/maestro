- code: ord_primo
  cefr_level: A1
  category: aggettivi
  source_url: https://www.unistrapg.it/profilo_lingua_italiana/site/gram_aggettivi_a1.html
  unistr_code: aggettivi_numerali_ordinali_da_primo_a_decimo_nota_principalmente_prima
  unistr_label: 'Aggettivi numerali ordinali da primo a decimo Nota: principalmente
    prima singolare con i nomi di famiglia'
  chunk_ref: book_6_l_aggettivo_aggettivi_numerali
  label: Aggettivi numerali ordinali da primo a decimo
  explanations:
    en:
      title: 'Ordinal numbers: primo to decimo'
      tip: Ordinal numbers (first, second, third…) tell you the position of something
        in a sequence. Unlike most cardinal numbers, they change their ending to match
        the noun they describe — just like regular adjectives.
      explanation: '## The rule: what ordinal numbers are


        Ordinal numbers — called <span lang="it">numerali ordinali</span> (ordinal
        numerals) in Italian — answer the question ''which one in a series?'' They
        correspond to English ''first'', ''second'', ''third'', and so on. In Italian,
        they are adjectives, so they must agree in gender (masculine/feminine) and
        number (singular/plural) with the noun they modify. This is different from
        cardinal numbers like <span lang="it">due</span> or <span lang="it">tre</span>,
        which never change their form.


        ## The ten forms: primo to decimo


        Here are the ten ordinals with their four possible endings. The masculine
        singular form is the base form you should memorise first.


        | Cardinal | Masc. sg. | Fem. sg. | Masc. pl. | Fem. pl. | English |

        |---|---|---|---|---|---|

        | uno | primo | prima | primi | prime | first |

        | due | secondo | seconda | secondi | seconde | second |

        | tre | terzo | terza | terzi | terze | third |

        | quattro | quarto | quarta | quarti | quarte | fourth |

        | cinque | quinto | quinta | quinti | quinte | fifth |

        | sei | sesto | sesta | sesti | seste | sixth |

        | sette | settimo | settima | settimi | settime | seventh |

        | otto | ottavo | ottava | ottavi | ottave | eighth |

        | nove | nono | nona | noni | none | ninth |

        | dieci | decimo | decima | decimi | decime | tenth |


        ## How agreement works


        Treat ordinal numbers exactly like a regular adjective ending in <span lang="it">-o</span>
        (like <span lang="it">rosso</span>, red). Choose the ending that matches the
        noun:


        - masculine singular → <span lang="it">-o</span> (e.g. <span lang="it">il
        primo giorno</span>, the first day)

        - feminine singular → <span lang="it">-a</span> (e.g. <span lang="it">la prima
        lezione</span>, the first lesson)

        - masculine plural → <span lang="it">-i</span> (e.g. <span lang="it">i primi
        giorni</span>, the first days)

        - feminine plural → <span lang="it">-e</span> (e.g. <span lang="it">le prime
        lezioni</span>, the first lessons)


        ## Examples


        <span lang="it">Abito al terzo piano.</span> (I live on the third floor.)
        — masculine singular, agreeing with <span lang="it">piano</span> (floor, masc.).


        <span lang="it">Oggi è la mia prima lezione di italiano.</span> (Today is
        my first Italian lesson.) — feminine singular, agreeing with <span lang="it">lezione</span>
        (lesson, fem.).


        <span lang="it">Marco arriva secondo e Luca arriva quinto.</span> (Marco comes
        second and Luca comes fifth.) — both masculine singular, used without a noun
        after a verb.


        <span lang="it">La quinta porta a sinistra è la cucina.</span> (The fifth
        door on the left is the kitchen.) — feminine singular, agreeing with <span
        lang="it">porta</span> (door, fem.).


        <span lang="it">I primi giorni di scuola sono difficili.</span> (The first
        days of school are difficult.) — masculine plural, agreeing with <span lang="it">giorni</span>
        (days, masc.).


        Contrastive pair — ordinal vs. cardinal: <span lang="it">Ho due sorelle</span>
        (I have two sisters) uses the invariable cardinal <span lang="it">due</span>.
        But <span lang="it">la mia seconda sorella</span> (my second sister) uses
        the ordinal <span lang="it">seconda</span>, which agrees with the feminine
        noun <span lang="it">sorella</span>.


        ## Position in the sentence


        Ordinal numbers almost always come before the noun, just like in English:
        <span lang="it">il primo caffè della mattina</span> (the first coffee of the
        morning). They can also follow a verb directly — <span lang="it">sono arrivato
        terzo</span> (I arrived third) — where they still agree with the subject.


        ## Writing ordinals: words vs. symbols


        In normal writing, Italian prefers the word form: <span lang="it">il terzo
        capitolo</span> (the third chapter) is preferred over <span lang="it">il 3°
        capitolo</span>. Roman numerals (<span lang="it">I, II, III, IV</span>…) are
        used for popes, kings, and centuries: <span lang="it">Giovanni Paolo II</span>,
        <span lang="it">il XX secolo</span>. At A1 level, simply focus on knowing
        and using the word form.


        ## Common learner mistakes


        **Mistake 1 — treating ordinals as invariable like cardinals:** Learners sometimes
        write <span lang="it">*la primo lezione*</span> by analogy with cardinals,
        which never change. Correction: ordinals always agree, so the correct form
        is <span lang="it">la prima lezione</span>.


        **Mistake 2 — using a cardinal where an ordinal is needed:** Saying <span
        lang="it">*abito al tre piano*</span> (using the cardinal <span lang="it">tre</span>)
        instead of <span lang="it">abito al terzo piano</span> (using the ordinal
        <span lang="it">terzo</span>) is a very common error, especially for floors
        of a building and numbered sequences.


        **Mistake 3 — wrong ending on a feminine noun:** Writing <span lang="it">*la
        quinto strada*</span> instead of <span lang="it">la quinta strada</span> (the
        fifth street). Always check the gender of the noun and choose the matching
        <span lang="it">-o / -a / -i / -e</span> ending.


        **Mistake 4 — forgetting the article:** In Italian, ordinal numbers used with
        a noun almost always require the definite article: <span lang="it">il primo
        giorno</span>, not <span lang="it">*primo giorno*</span> (unless in a title
        or heading). This is different from English, which sometimes drops ''the''
        (''first day of school'').'
      language: en
      why_this_matters: Ordinal numbers come up constantly in everyday Italian — telling
        someone you live on the third floor, talking about the first day of school,
        or describing the second street on the left. Without them, you cannot place
        things in order or talk about sequences, rankings, or positions. Mastering
        these ten forms also gives you the pattern you need to build every higher
        ordinal number later.
