  category: costruzione_frase
  source_url: https://www.unistrapg.it/profilo_lingua_italiana/site/gram_costruz_a1.html
  unistr_code: consapevolezza_dellordine_vs_nelle_interrogative_introdotte_da_un_pronome_o_un
  unistr_label: 'Consapevolezza dell’ordine VS nelle interrogative introdotte da un
    pronome o un avverbio: Dove va Luca? Quando parte Luca?'
  chunk_ref: book_2_la_frase
  label: Ordine VS nelle interrogative con pronome o avverbio
  explanations:
    en:
      title: Word order in questions with question words
      tip: When you ask a question using a question word like 'who', 'what', or 'where',
        put the question word first, then the verb, then the subject. This order is
        the most natural way to ask these questions in Italian.
      explanation: '## The basic rule


        In Italian questions that begin with a question word (an interrogative pronoun
        or adverb), the standard word order is:


        **Question word → Verb → Subject (if stated)**


        <span lang="it">Domanda word + Verbo + Soggetto</span> — the subject, if you
        include it, comes *after* the verb. This is called Subject-Verb inversion,
        and it is the default in these questions. You do not add a separate word like
        English ''do'' or ''does'': the verb form alone carries the question.


        ## How to form it


        1. Start with the interrogative word.

        2. Follow immediately with the conjugated verb.

        3. Place the subject noun or pronoun after the verb (or leave it out if it
        is obvious from context).


        Compare the statement and the question:


        | Statement | Question |

        |---|---|

        | Maria abita qui. | Dove abita Maria? |

        | (Maria lives here.) | (Where does Maria live?) |

        | Tuo fratello si chiama Luca. | Come si chiama tuo fratello? |

        | (Your brother is called Luca.) | (What is your brother called?) |


        ## The main interrogative words at A1


        | Italian | Meaning | Notes |

        |---|---|---|

        | chi | who / whom | always singular, never changes |

        | cosa / che cosa / che | what | three equally correct forms |

        | dove | where | |

        | quando | when | |

        | come | how | |

        | perché | why | |

        | quanto / quanta / quanti / quante | how much / how many | agrees with noun
        in gender and number |


        ## Examples


        **1. <span lang="it">Dove</span> (''where'') — verb immediately after:**

        <span lang="it">Dove abita tuo padre?</span>

        (Where does your father live?)


        **2. <span lang="it">Chi</span> (''who'') — subject unknown, so <span lang="it">chi</span>
        itself acts as subject:**

        <span lang="it">Chi parla italiano?</span>

        (Who speaks Italian?) — here <span lang="it">chi</span> is the subject; no
        separate subject follows.


        **3. <span lang="it">Cosa</span> (''what'') — verb then subject:**

        <span lang="it">Cosa mangia Marco a colazione?</span>

        (What does Marco eat for breakfast?)


        **4. <span lang="it">Come</span> (''how'') — common greeting pattern:**

        <span lang="it">Come stai?</span>

        (How are you?) — subject <span lang="it">tu</span> is dropped because it is
        obvious from the verb ending.


        **5. <span lang="it">Quanto</span> (''how much'') agreeing with the noun:**

        <span lang="it">Quanti fratelli hai?</span>

        (How many brothers do you have?) — <span lang="it">quanti</span> is masculine
        plural to match <span lang="it">fratelli</span>.


        **6. Contrastive pair — subject before vs. after verb:**

        <span lang="it">✓ Dove lavora tua madre?</span> (Where does your mother work?)
        — correct inversion.

        <span lang="it">✗ Dove tua madre lavora?</span> — this feels unnatural in
        standard Italian; avoid placing the subject between the question word and
        the verb.


        ## When the subject can come before the verb


        In informal spoken Italian, especially for emphasis or contrast, a noun subject
        sometimes appears before the verb:

        <span lang="it">E Marco, dove abita?</span>

        (And Marco, where does he live?) — the subject is fronted for emphasis, almost
        as a ''topic''. This is acceptable in conversation but is not the neutral
        default. At A1, practise the standard order first.


        ## Common learner mistakes


        **Mistake 1: Copying English ''do/does'' word order without inversion.**

        <span lang="it">✗ Dove Maria abita?</span> — subject between question word
        and verb, mirroring ''Where does Maria live?'' literally.

        <span lang="it">✓ Dove abita Maria?</span> — verb comes directly after the
        question word.


        **Mistake 2: Adding a redundant pronoun after the question word.**

        <span lang="it">✗ Dove lei abita?</span> — the pronoun <span lang="it">lei</span>
        interrupts the pattern.

        <span lang="it">✓ Dove abita lei?</span> — if you want to include the pronoun
        for clarity or emphasis, it goes after the verb.


        **Mistake 3: Using only <span lang="it">che</span> and forgetting <span lang="it">cosa</span>
        or <span lang="it">che cosa</span>.**

        All three forms — <span lang="it">che</span>, <span lang="it">cosa</span>,
        <span lang="it">che cosa</span> — mean ''what'' when asking questions. Any
        one of them is correct: <span lang="it">Che mangi? / Cosa mangi? / Che cosa
        mangi?</span> are all fine.


        **Mistake 4: Forgetting gender/number agreement with <span lang="it">quanto</span>.**

        <span lang="it">✗ Quanto sorelle hai?</span>

        <span lang="it">✓ Quante sorelle hai?</span> — <span lang="it">sorelle</span>
        is feminine plural, so <span lang="it">quanto</span> becomes <span lang="it">quante</span>.'
      language: en
      why_this_matters: Question words like <span lang="it">chi</span> ('who'), <span
        lang="it">cosa</span> ('what'), <span lang="it">dove</span> ('where'), and
        <span lang="it">quando</span> ('when') appear in almost every real conversation.
        Without knowing where to place them, you cannot ask basic questions about
        people, places, or things — and misplacing the verb or subject is one of the
        most noticeable errors beginners make. Getting this pattern right immediately
        makes your Italian sound natural.
