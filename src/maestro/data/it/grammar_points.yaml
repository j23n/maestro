      tip: Every Italian noun needs an article, and the article must match the noun's
        gender (masculine or feminine) and number (singular or plural). The definite
        article ('the') points to something specific and known; the indefinite article
        ('a / an') introduces something new or unspecified.
      explanation: 'Every Italian noun needs an article, and the article must match
        the noun''s gender (masculine or feminine) and number (singular or plural).
        The definite article points to something specific and known; the indefinite
        article introduces something new or unspecified.


        ## What an article does


        The article (<span lang="it">l''articolo</span>, literally ''the article'')
        is the small word placed directly before a noun. It tells the listener two
        things at once: whether the noun is specific and already known (definite)
        or general and newly introduced (indefinite), and whether the noun is masculine
        or feminine, singular or plural.


        ## The definite article — ''the''


        Use the definite article (<span lang="it">l''articolo determinativo</span>)
        when both speaker and listener know exactly which person or thing is meant
        — because it has already been mentioned, because there is only one of it,
        or because it is being discussed as a category in general.


        The form of the definite article changes depending on the gender and number
        of the noun that follows it, and also on the first sound of that noun.


        | Gender &amp; number | Starts with… | Article | Example |

        |---|---|---|---|

        | Masculine singular | most consonants | il | il libro (the book) |

        | Masculine singular | s + consonant, z, gn, ps, x, y | lo | lo studente (the
        student) |

        | Masculine singular | any vowel | l'' | l''amico (the friend) |

        | Masculine plural | most consonants | i | i libri (the books) |

        | Masculine plural | s + consonant, z, gn, ps, x, y, vowel | gli | gli studenti
        (the students) |

        | Feminine singular | any consonant | la | la madre (the mother) |

        | Feminine singular | any vowel | l'' | l''amica (the female friend) |

        | Feminine plural | any sound | le | le madri (the mothers) |


        ## The indefinite article — ''a / an''


        Use the indefinite article (<span lang="it">l''articolo indeterminativo</span>)
        when you are introducing a noun for the first time, when you are talking about
        one unspecified example of something, or when you mean ''a certain kind of
        thing''. The indefinite article only has singular forms in Italian — to express
        ''some'' in the plural, Italian uses the partitive article (<span lang="it">del,
        della, dei</span>, etc.), which is covered in a separate entry.


        | Gender | Starts with… | Article | Example |

        |---|---|---|---|

        | Masculine | most consonants or any vowel | un | un caffè (a coffee) |

        | Masculine | s + consonant, z, gn, ps, x, y | uno | uno zaino (a backpack)
        |

        | Feminine | any consonant | una | una pizza (a pizza) |

        | Feminine | any vowel | un'' | un''arancia (an orange) |


        Notice that the masculine <span lang="it">un</span> does not add an apostrophe
        before a vowel (<span lang="it">un amico</span>, not <span lang="it">*un''amico</span>),
        while the feminine <span lang="it">una</span> always drops its final vowel
        and adds an apostrophe before a vowel (<span lang="it">un''amica</span>).


        ## When each article is used


        Use the <strong>definite article</strong> when:


        - the noun has already been mentioned or is clearly identified: <span lang="it">Ho
        un cane. Il cane si chiama Leo.</span> (I have a dog. The dog is called Leo.)

        - you refer to something as a whole category: <span lang="it">Mi piace la
        pasta.</span> (I like pasta — pasta in general.)

        - there is only one of the thing: <span lang="it">Il sole è grande.</span>
        (The sun is big.)


        Use the <strong>indefinite article</strong> when:


        - you introduce something for the first time: <span lang="it">Ho un cane.</span>
        (I have a dog — introducing it.)

        - you mean ''one of many'', not a specific item: <span lang="it">Vorrei una
        mela.</span> (I would like an apple — any apple.)


        ## Examples


        <span lang="it">Il bambino mangia la pizza.</span>

        (The child is eating the pizza. — both are specific and known.)


        <span lang="it">Ho una sorella e un fratello.</span>

        (I have a sister and a brother. — introducing family members for the first
        time.)


        <span lang="it">L''acqua è fredda.</span>

        (The water is cold. — a specific glass of water already in view, or water
        as a substance in general.)


        <span lang="it">Gli studenti sono in classe.</span>

        (The students are in class. — a specific known group.)


        <span lang="it">Voglio un caffè, per favore.</span>

        (I want a coffee, please. — one unspecified coffee.)


        <span lang="it">Mi piace il caffè.</span> vs. <span lang="it">Voglio un caffè.</span>

        (I like coffee — coffee in general / I want a coffee — one specific cup. This
        contrast is crucial.)


        ## Common learner mistakes


        <strong>Mistake 1 — Omitting the article:</strong> English sometimes drops
        the article (''I like coffee'', ''She is a teacher''), but Italian almost
        always requires one. Do not write <span lang="it">*Mi piace caffè</span>;
        write <span lang="it">Mi piace il caffè</span>.


        <strong>Mistake 2 — Wrong gender:</strong> <span lang="it">*il problema</span>
        looks masculine because <span lang="it">problema</span> ends in <span lang="it">-a</span>,
        but it is actually masculine (from Greek): <span lang="it">il problema</span>
        is correct. Always learn the article together with each new noun.


        <strong>Mistake 3 — Using <span lang="it">il</span> instead of <span lang="it">lo</span>:</strong>
        Before <span lang="it">s</span> + consonant or <span lang="it">z</span>, masculine
        singular nouns take <span lang="it">lo</span>, not <span lang="it">il</span>.
        Write <span lang="it">lo zaino</span>, not <span lang="it">*il zaino</span>.


        <strong>Mistake 4 — Apostrophe on masculine <span lang="it">un</span>:</strong>
        Only the feminine <span lang="it">una</span> takes an apostrophe before a
        vowel. The masculine form stays <span lang="it">un</span> without an apostrophe:
        <span lang="it">un uomo</span> (a man), never <span lang="it">*un''uomo</span>.


        <strong>Mistake 5 — Definite where indefinite is needed:</strong> Saying <span
        lang="it">*Ho il gatto</span> to introduce a pet for the first time sounds
        as if the listener already knows the cat. Use <span lang="it">Ho un gatto</span>
        (I have a cat) to introduce it.'
      language: en
      why_this_matters: 'Articles appear in front of almost every noun in Italian,
        so you will meet them in the very first sentences you read or hear. Getting
        them right is not optional: the wrong article — or a missing one — makes a
        sentence sound ungrammatical to a native speaker. Mastering articles also
        forces you to learn the gender of every new noun, which unlocks agreement
        with adjectives and past-tense verbs later on.'
- code: art_hora
  cefr_level: A1
  category: articoli
  source_url: https://www.unistrapg.it/profilo_lingua_italiana/site/gram_articoli_a1.html
  unistr_code: uso_dellarticolo_determinativo_per_esprimere_lora_es_sono_le_otto
  unistr_label: Uso dell’articolo determinativo per esprimere l’ora, es. Sono le otto.
  chunk_ref: book_5_l_articolo_usi_particolari
  label: Articolo determinativo per esprimere l'ora
  explanations:
    en:
      title: Telling the time with the definite article
      tip: In Italian, you always use a definite article — 'la' or 'le' — when saying
        what time it is. Without the article, a time expression sounds incomplete
        or wrong to a native speaker.
      explanation: '## The rule: what article to use and when


        Italian treats each hour as a feminine noun. The hours are thought of as <span
        lang="it">le ore</span> (the hours), which is feminine plural. This is why
        the article is always feminine.


        Use <span lang="it">l''una</span> (the one) for 1:00, because <span lang="it">una</span>
        is singular — it uses the singular elided form <span lang="it">l''</span>.


        Use <span lang="it">le</span> + the number for every other hour (2:00 through
        12:00 / midnight / noon), because all other numbers are plural.


        The verb used to express the time is <span lang="it">essere</span> (to be),
        and it must agree with the article:


        - <span lang="it">È l''una.</span> — singular verb <span lang="it">è</span>

        - <span lang="it">Sono le due.</span> — plural verb <span lang="it">sono</span>


        ## Full paradigm of the hours


        | Time | Italiano |

        |---|---|

        | 1:00 | È l''una. |

        | 2:00 | Sono le due. |

        | 3:00 | Sono le tre. |

        | 4:00 | Sono le quattro. |

        | 5:00 | Sono le cinque. |

        | 6:00 | Sono le sei. |

        | 7:00 | Sono le sette. |

        | 8:00 | Sono le otto. |

        | 9:00 | Sono le nove. |

        | 10:00 | Sono le dieci. |

        | 11:00 | Sono le undici. |

        | 12:00 (noon) | È mezzogiorno. |

        | 12:00 (midnight) | È mezzanotte. |


        Note: <span lang="it">mezzogiorno</span> (noon) and <span lang="it">mezzanotte</span>
        (midnight) are masculine and feminine nouns respectively, used without any
        article.


        ## Adding minutes


        To say minutes past the hour, add <span lang="it">e</span> (and) followed
        by the minutes:


        <span lang="it">Sono le tre e venti.</span> — It is twenty past three.


        For a quarter past, use <span lang="it">e un quarto</span> (and a quarter):


        <span lang="it">Sono le otto e un quarto.</span> — It is a quarter past eight.


        For half past, use <span lang="it">e mezza</span> or <span lang="it">e mezzo</span>
        (and a half — both forms are acceptable):


        <span lang="it">Sono le sei e mezza.</span> — It is half past six.


        For minutes to the hour, use <span lang="it">meno</span> (minus/less) followed
        by the minutes:


        <span lang="it">Sono le cinque meno dieci.</span> — It is ten to five (literally:
        five minus ten).


        For a quarter to, use <span lang="it">meno un quarto</span>:


        <span lang="it">È l''una meno un quarto.</span> — It is a quarter to one.


        ## Asking and answering ''What time is it?''


        The standard question is:


        <span lang="it">Che ora è?</span> or <span lang="it">Che ore sono?</span>
        — What time is it?


        Both forms are correct and very common. <span lang="it">Che ore sono?</span>
        (plural) is slightly more frequent in everyday speech.


        ## Saying ''at'' a particular time


        To say something happens <span lang="it">at</span> a certain time, replace
        <span lang="it">è / sono</span> with the preposition <span lang="it">a</span>
        (at), which combines with the article:


        - <span lang="it">a + l'' → all''</span>: <span lang="it">all''una</span>
        (at one o''clock)

        - <span lang="it">a + le → alle</span>: <span lang="it">alle tre</span> (at
        three o''clock)


        The article is still required here — it just merges with <span lang="it">a</span>.


        ## Examples


        <span lang="it">— Che ore sono? — Sono le sette.</span>

        (— What time is it? — It is seven o''clock.)


        <span lang="it">La scuola inizia alle otto e mezza.</span>

        (School starts at half past eight.)


        <span lang="it">Mangiamo all''una.</span>

        (We eat at one o''clock.)


        <span lang="it">Il treno parte alle nove e un quarto.</span>

        (The train leaves at a quarter past nine.)


        <span lang="it">— A che ora finisce il film? — Alle undici meno venti.</span>

        (— At what time does the film end? — At twenty to eleven.)


        <span lang="it">Il negozio chiude a mezzogiorno.</span>

        (The shop closes at noon.) — Note: no article with <span lang="it">mezzogiorno</span>.


        ## Common learner mistakes


        **Mistake 1 — omitting the article:**

        ❌ <span lang="it">Sono tre.</span> ✅ <span lang="it">Sono le tre.</span>

        The article is never optional. Dropping it sounds ungrammatical.


        **Mistake 2 — using <span lang="it">è</span> instead of <span lang="it">sono</span>
        for hours other than one:**

        ❌ <span lang="it">È le due.</span> ✅ <span lang="it">Sono le due.</span>

        Because <span lang="it">le due</span> is plural, the verb must be plural too.
        Only <span lang="it">l''una</span>, <span lang="it">mezzogiorno</span>, and
        <span lang="it">mezzanotte</span> use <span lang="it">è</span>.


        **Mistake 3 — forgetting that <span lang="it">a</span> contracts with the
        article:**

        ❌ <span lang="it">a le cinque</span> ✅ <span lang="it">alle cinque</span>

        ❌ <span lang="it">a l''una</span> ✅ <span lang="it">all''una</span>

        The preposition <span lang="it">a</span> always combines with the article
        — it never stands alone before a time.


        **Mistake 4 — adding an article before <span lang="it">mezzogiorno</span>
        or <span lang="it">mezzanotte</span>:**

        ❌ <span lang="it">Sono le mezzogiorno.</span> ✅ <span lang="it">È mezzogiorno.</span>

        These two words stand alone — they never take an article.'
      language: en
      why_this_matters: Telling the time is one of the first practical tasks you face
        in Italian, and it works differently from English. Every time expression in
        Italian requires a definite article — <span lang="it">la</span> or <span lang="it">le</span>
        — in front of the number. Without it, sentences like <span lang="it">'Sono
        le tre'</span> ('It is three o'clock') cannot be formed correctly. Mastering
        this small rule means you can immediately ask and answer questions about schedules,
        appointments, meals, and daily routines.
