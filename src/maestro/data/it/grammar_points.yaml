- code: subord_cau
  cefr_level: A1
  category: frase_complessa
  source_url: https://www.unistrapg.it/profilo_lingua_italiana/site/gram_frasecomplessa_a1.html
  unistr_code: proposizioni_causali_introdotte_da_perche_es_perche_vai_a_casa_perche_sono
  unistr_label: Proposizioni causali introdotte da perché , es. (Perché vai a casa?)
    Perché sono stanco .
  chunk_ref: book_11_la_congiunzione_congiunzioni_subordinative
  label: Proposizioni causali con congiunzione perché
  explanations:
    en:
      title: Giving reasons with 'perché'
      tip: Use 'perché' to explain why something happens. It connects two parts of
        a sentence, where the second part gives the reason for the first. This is
        one of the most common words in Italian — you will hear and use it every day.
      explanation: '## The rule


        A causal clause, called a <span lang="it">proposizione causale</span> (reason
        clause), explains the cause or reason behind the action in the main clause,
        called the <span lang="it">proposizione reggente</span> (main/governing clause).
        At A1 level, you form it simply by placing <span lang="it">perché</span> between
        the main clause and the reason clause:


        **[main clause]** + <span lang="it">perché</span> + **[reason clause]**


        Both clauses use a normal, straightforward verb form — at A1, this is always
        the present tense (<span lang="it">presente indicativo</span>). No subjunctive,
        no special verb change is needed at this level.


        **Formation at a glance:**


        <span lang="it">Mangio la pizza perché mi piace.</span>

        (I eat pizza because I like it.)


        The sentence has two parts:

        - <span lang="it">Mangio la pizza</span> — main clause (what happens)

        - <span lang="it">perché mi piace</span> — reason clause (why it happens)


        ## Position: before or after?


        The reason clause with <span lang="it">perché</span> almost always comes **after**
        the main clause in everyday speech. This is the safest and most natural order
        at A1 level. In Italian it is also possible — though less common — to place
        another causal conjunction such as <span lang="it">siccome</span> (since/as)
        at the very start of the sentence, but <span lang="it">perché</span> does
        **not** normally open a sentence on its own in standard usage.


        ## Examples


        <span lang="it">Studio l''italiano perché è bella lingua.</span>

        (I study Italian because it is a beautiful language.) — giving a reason for
        a habit


        <span lang="it">Non mangio la carne perché non mi piace.</span>

        (I don''t eat meat because I don''t like it.) — giving a reason for a negative
        action


        <span lang="it">Maria beve acqua perché ha sete.</span>

        (Maria drinks water because she is thirsty.) — third-person subject in both
        clauses


        <span lang="it">Siamo a casa perché fa freddo.</span>

        (We are at home because it is cold.) — state of being, not an action


        <span lang="it">Non dormo bene perché il bambino piange.</span>

        (I don''t sleep well because the baby cries.) — the subjects of the two clauses
        are different: ''I'' and ''the baby''


        <span lang="it">Vado al supermercato perché non c''è pane.</span>

        (I''m going to the supermarket because there is no bread.) — everyday, A1-level
        scenario


        ## Important note: ''perché'' has two meanings


        The word <span lang="it">perché</span> does **double duty** in Italian: it
        means both **''because''** (giving a reason) and **''why''** (asking a question).
        You tell them apart by context:


        | Use | Example | Meaning |

        |---|---|---|

        | Question | Perché studi? | ''Why do you study?'' |

        | Answer/reason | Studio perché mi piace. | ''I study because I like it.''
        |


        When <span lang="it">perché</span> opens a question, it means ''why''. When
        it follows a main clause inside a sentence, it means ''because''. At A1, you
        will use both constantly — in question-and-answer pairs especially.


        ## Other causal conjunctions (for awareness)


        Italian has several other words that also introduce reason clauses. You do
        not need to use them at A1, but you may hear them:


        - <span lang="it">siccome</span> (since/as) — goes at the **start** of the
        sentence: <span lang="it">Siccome ho fame, mangio.</span> (Since I''m hungry,
        I eat.)

        - <span lang="it">dato che</span> (given that): <span lang="it">Dato che è
        tardi, andiamo.</span> (Given that it''s late, let''s go.)

        - <span lang="it">visto che</span> (seeing that): <span lang="it">Visto che
        piove, resto a casa.</span> (Seeing that it''s raining, I''m staying home.)


        For now, focus on <span lang="it">perché</span>: it is by far the most frequent
        and the most useful.


        ## Common learner mistakes


        **Mistake 1 — Confusing ''because'' and ''why'':**

        Learners sometimes write <span lang="it">*perché vuoi?*</span> when they mean
        ''because I want to'' (as an answer), or forget that the question form also
        uses <span lang="it">perché</span>. Remember: in an answer, <span lang="it">perché</span>
        always sits **after** the main clause, not at the start.


        **Mistake 2 — Using ''because'' to start a standalone sentence:**

        In English, people sometimes write ''Because I like it.'' as a full sentence
        (especially in informal writing). In Italian, <span lang="it">perché</span>
        must always be connected to a main clause. <span lang="it">*Perché mi piace.*</span>
        alone is not a complete sentence — it is a fragment. Always attach it: <span
        lang="it">Lo faccio perché mi piace.</span> (I do it because I like it.)


        **Mistake 3 — Using ''perché'' with a noun instead of a verb:**

        Learners sometimes write <span lang="it">*Sono stanco perché il lavoro.*</span>
        This is wrong — <span lang="it">perché</span> must be followed by a full clause
        with a conjugated verb, not just a noun. Correct form: <span lang="it">Sono
        stanco perché lavoro molto.</span> (I am tired because I work a lot.)


        **Mistake 4 — Accent confusion:**

        Note that <span lang="it">perché</span> always carries an accent on the final
        <span lang="it">é</span>. Writing it without the accent (<span lang="it">*perche*</span>)
        is a spelling error in Italian.'
      language: en
      why_this_matters: Every time you explain why you do something — why you are
        hungry, why you are tired, why you like something — you need a word to link
        the reason to the action. In Italian, that word is <span lang="it">perché</span>
        (because). Without it, you can state facts, but you cannot explain them. Mastering
        this one word immediately lets you answer questions like <span lang="it">Perché
        studi l'italiano?</span> (Why do you study Italian?) and unlocks a huge range
        of everyday conversation.
