  - ind_pres
- code: imper_prim
  cefr_level: A1
  category: verbi
  unistr_code: la_coniugazione_attiva_con_particolare_riferimento_a_tutte_e_tre_le_persone
  unistr_label: imperativo prima persona plurale per invitare (andiamo )
  source_url: https://www.unistrapg.it/profilo_lingua_italiana/site/gram_verbi_a1.html
  chunk_ref: book_8_il_verbo_uso_degli_altri_modi_imperativo
  label: Imperativo prima persona plurale per invitare
  explanations:
    en:
      title: Using 'let's' to make suggestions in Italian
      tip: To suggest doing something together in Italian, use the 'noi' (we) form
        of the present tense as a command — the same form you already know. Just say
        it with the meaning 'let's do this!' No extra word is needed.
      explanation: '## The rule: how to form it


        The imperative (''command mood'') in Italian has only one tense: the present.
        Because you cannot give an order to yourself, the imperative has no first-person
        singular (''I'') form. However, it does have a **first-person plural** form,
        used to include yourself in an invitation or suggestion — exactly like English
        ''let''s''.


        **Formation:** The first-person plural imperative is identical to the present-tense
        <span lang="it">noi</span> (''we'') form of the verb. You do not need to add
        any extra word like ''let''s'' — the verb form alone carries that meaning.


        <span lang="it">noi</span> present tense = first-person plural imperative


        ### Verb endings at a glance


        | Infinitive | Present noi form | Meaning as imperative |

        |---|---|---|

        | parlare (to speak) | parliamo | let''s speak / let''s talk |

        | mangiare (to eat) | mangiamo | let''s eat |

        | prendere (to take/have) | prendiamo | let''s take / let''s have |

        | partire (to leave) | partiamo | let''s leave |

        | andare (to go) | andiamo | let''s go |

        | essere (to be) | siamo | let''s be |

        | avere (to have) | abbiamo | let''s have |


        ## How to make it negative: ''let''s not…''


        To say ''let''s not do something'', simply place <span lang="it">non</span>
        (''not'') directly before the same verb form. The verb form itself does not
        change.


        <span lang="it">Non mangiamo</span> lì. → Let''s not eat there.


        **Important contrast:** For the second-person singular (''you'') negative
        imperative, Italian uses the infinitive (e.g. <span lang="it">non parlare!</span>
        — don''t speak!). But for the first-person plural, the rule is simpler: <span
        lang="it">non</span> + the ordinary <span lang="it">noi</span> present form,
        just like the positive command.


        ## Examples


        1. <span lang="it">Andiamo a casa!</span> — Let''s go home!


        2. <span lang="it">Mangiamo la pizza stasera.</span> — Let''s eat pizza tonight.


        3. <span lang="it">Parliamo con la maestra.</span> — Let''s talk to the teacher.


        4. <span lang="it">Prendiamo un caffè insieme.</span> — Let''s have a coffee
        together.


        5. <span lang="it">Non usciamo stasera, fa freddo.</span> — Let''s not go
        out tonight, it''s cold.


        6. <span lang="it">Siamo pazienti!</span> — Let''s be patient! (edge case:
        <span lang="it">essere</span> is irregular in the present, so its <span lang="it">noi</span>
        form <span lang="it">siamo</span> is the one to remember)


        ## Common learner mistakes


        **Mistake 1: Translating ''let''s'' word for word.**

        English learners sometimes try to invent a word for ''let''s'' in Italian.
        There is no separate word — the verb form itself does the job.

        ✗ <span lang="it">*Lasciamo mangiare.</span> (This means ''let them/us eat''
        in a different sense, not a natural suggestion.)

        ✓ <span lang="it">Mangiamo!</span> — Let''s eat!


        **Mistake 2: Confusing the imperative with a simple statement.**

        Because the form is identical to the present tense, context and intonation
        do the work of showing it is a suggestion. In writing, an exclamation mark
        is common; in speech, a rising-then-falling intonation signals an invitation.

        ✗ Thinking <span lang="it">Andiamo</span> can only mean ''we go/we are going''
        — it also means ''let''s go!'' depending on context.


        **Mistake 3: Using the infinitive for the negative.**

        Some learners apply the second-person singular rule (<span lang="it">non</span>
        + infinitive) to the <span lang="it">noi</span> form. This rule does not apply
        here.

        ✗ <span lang="it">*Non andare insieme.</span> (This is a command to one person:
        ''don''t go together.'')

        ✓ <span lang="it">Non andiamo insieme.</span> — Let''s not go together.


        ## Quick summary


        - Positive suggestion: <span lang="it">noi</span> present form alone → <span
        lang="it">Mangiamo!</span> (Let''s eat!)

        - Negative suggestion: <span lang="it">non</span> + <span lang="it">noi</span>
        present form → <span lang="it">Non mangiamo!</span> (Let''s not eat!)

        - No extra word for ''let''s'' is needed or used.'
      language: en
      why_this_matters: The moment you want to say <span lang="it">'andiamo!'</span>
        ('let's go!') or suggest a plan to a friend, you need the first-person plural
        imperative. It comes up constantly in everyday conversation — making plans,
        ordering food together, inviting someone to sit down — and the good news is
        that it is identical to a verb form you already know, so there is almost nothing
        new to memorise.
  prerequisites:
  - ind_pres
- code: percez_sig
  cefr_level: A1
  category: verbi
  unistr_code: la_coniugazione_attiva_con_particolare_riferimento_a_tutte_e_tre_le_persone
  unistr_label: la percezione del significato modale dei verbi potere, volere e dovere
  source_url: https://www.unistrapg.it/profilo_lingua_italiana/site/gram_verbi_a1.html
  chunk_ref: book_8_il_verbo_verbi_servili
  label: Valore modale dei verbi potere, volere e dovere
  explanations:
    en:
      title: 'Modal verbs: potere, volere, dovere'
      tip: The verbs potere, volere, and dovere come before another verb in its infinitive
        form to say what someone can, wants, or must do. They change their ending
        to match the subject, but the second verb always stays in the infinitive.
        These three verbs appear in almost every Italian conversation.
      explanation: '## What modal verbs are


        <span lang="it">Potere</span>, <span lang="it">volere</span>, and <span lang="it">dovere</span>
        are called <span lang="it">verbi modali</span> (modal verbs) — sometimes also
        <span lang="it">verbi servili</span> (auxiliary verbs, literally ''servant
        verbs''). They are called this because they ''serve'' another verb: they always
        appear together with a second verb in the <span lang="it">infinito</span>
        (infinitive — the base form ending in <span lang="it">-are</span>, <span lang="it">-ere</span>,
        or <span lang="it">-ire</span>). Each modal adds a specific meaning to that
        second verb:


        - <span lang="it">dovere</span> → necessity or obligation: <span lang="it">''must
        / have to''</span>

        - <span lang="it">volere</span> → desire or intention: <span lang="it">''want
        to''</span>

        - <span lang="it">potere</span> → possibility or permission: <span lang="it">''can
        / may / be able to''</span>


        ## How to form them


        The structure is simple:


        **modal verb (conjugated) + infinitive of the main verb**


        The modal verb changes to match the subject. The main verb never changes —
        it always stays in the infinitive.


        Here are the full present-tense forms of all three:




        | Subject | dovere (must) | volere (want) | potere (can) |

        |---|---|---|---|

        | io | devo | voglio | posso |

        | tu | devi | vuoi | puoi |

        | lui / lei | deve | vuole | può |

        | noi | dobbiamo | vogliamo | possiamo |

        | voi | dovete | volete | potete |

        | loro | devono | vogliono | possono |


        All three verbs are irregular — their forms must be learned individually.
        Notice that <span lang="it">volere</span> and <span lang="it">potere</span>
        have vowel changes in the stem for <span lang="it">io</span>, <span lang="it">tu</span>,
        <span lang="it">lui/lei</span>, and <span lang="it">loro</span> (the so-called
        ''boot'' pattern), while <span lang="it">noi</span> and <span lang="it">voi</span>
        forms stay closer to the infinitive.


        ## Examples


        <span lang="it">Devo studiare stasera.</span>

        (I have to study tonight.) — obligation


        <span lang="it">Vuoi mangiare la pizza?</span>

        (Do you want to eat pizza?) — desire


        <span lang="it">Marco può venire domani.</span>

        (Marco can come tomorrow.) — possibility


        <span lang="it">Dobbiamo parlare con la mamma.</span>

        (We have to talk to Mum.) — obligation, plural subject


        <span lang="it">Non posso bere il caffè.</span>

        (I can''t drink coffee.) — negation: <span lang="it">non</span> goes before
        the modal, not before the infinitive


        <span lang="it">Loro vogliono dormire.</span>

        (They want to sleep.) — third person plural


        ## Negation


        To make a modal sentence negative, place <span lang="it">non</span> directly
        before the modal verb:


        <span lang="it">Non voglio mangiare.</span> (I don''t want to eat.) ✓


        <span lang="it">*Voglio non mangiare.</span> ✗ — This is incorrect in standard
        usage at this level.


        ## Asking questions


        In Italian, questions are formed without changing the word order — simply
        raise your intonation, or add a question mark in writing:


        <span lang="it">Puoi aprire la finestra?</span> (Can you open the window?)


        <span lang="it">Vuole un caffè?</span> (Would you like a coffee? — formal,
        addressing one person as <span lang="it">Lei</span>)


        ## Common learner mistakes


        **Mistake 1: conjugating the second verb**


        <span lang="it">*Voglio mangio la pasta.</span> ✗


        <span lang="it">Voglio mangiare la pasta.</span> ✓


        The verb after the modal must stay in the infinitive. Never conjugate it.


        **Mistake 2: confusing <span lang="it">puoi</span> and <span lang="it">puòi</span>**


        The <span lang="it">tu</span> form of <span lang="it">potere</span> is <span
        lang="it">puoi</span> (no accent). The <span lang="it">lui/lei</span> form
        is <span lang="it">può</span> (with an accent, no <span lang="it">i</span>).
        These are two different words.


        **Mistake 3: using <span lang="it">voglio</span> as a direct translation of
        ''I would like''**


        <span lang="it">Voglio un caffè.</span> is grammatically correct but can sound
        abrupt in some social situations. At A1, it is perfectly acceptable — just
        be aware that Italian also has politer alternatives you will learn later.


        **Mistake 4: wrong form of <span lang="it">dovere</span> for <span lang="it">noi</span>**


        <span lang="it">*Devemo andare.</span> ✗


        <span lang="it">Dobbiamo andare.</span> ✓


        The <span lang="it">noi</span> form of <span lang="it">dovere</span> is irregular:
        <span lang="it">dobbiamo</span>, not <span lang="it">devemo</span>. This is
        one of the most common spelling errors with this verb.'
      language: en
      why_this_matters: Without modal verbs, you cannot express some of the most basic
        things people say every day — that they <span lang="it">devono lavorare</span>
        (must work), <span lang="it">vogliono mangiare</span> (want to eat), or <span
        lang="it">possono venire</span> (can come). These three verbs appear constantly
        in Italian — in requests, offers, rules, invitations, and descriptions of
        daily life. Mastering them lets you move far beyond simple statements and
        start expressing intention, obligation, and ability.
