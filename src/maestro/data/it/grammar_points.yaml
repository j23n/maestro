  explanations:
    en:
      title: Reflexive pronouns in Italian
      tip: Reflexive pronouns go with reflexive verbs to show that the subject is
        doing something to or for themselves — like getting dressed or washing yourself.
        Each subject pronoun has its own matching reflexive pronoun, and it usually
        comes directly before the verb.
      explanation: '## The rule


        A reflexive pronoun is used when the action performed by the subject falls
        back onto that same subject. In other words, the subject and the object of
        the action are the same person. In Italian these pronouns always accompany
        a reflexive verb — a verb whose infinitive ends in <span lang="it">-si</span>
        (for example <span lang="it">lavarsi</span>, ''to wash oneself''; <span lang="it">alzarsi</span>,
        ''to get up''; <span lang="it">chiamarsi</span>, ''to be called'').


        The reflexive pronoun must **agree with the subject** — each person has one
        fixed form. In a normal statement the pronoun is placed **directly before
        the conjugated verb**.


        ## Forms


        | Subject pronoun | Reflexive pronoun | Meaning |

        |---|---|---|

        | io | mi | myself |

        | tu | ti | yourself |

        | lui / lei / Lei | si | himself / herself / yourself (formal) |

        | noi | ci | ourselves |

        | voi | vi | yourselves |

        | loro | si | themselves |


        ## How to form a sentence


        Take the infinitive (e.g. <span lang="it">lavarsi</span>), remove <span lang="it">-si</span>,
        conjugate the verb normally, and place the correct reflexive pronoun immediately
        before it.


        Full conjugation of <span lang="it">lavarsi</span> (''to wash oneself'') in
        the present tense:


        | | |

        |---|---|

        | io mi lavo | I wash myself |

        | tu ti lavi | you wash yourself |

        | lui / lei si lava | he / she washes himself / herself |

        | noi ci laviamo | we wash ourselves |

        | voi vi lavate | you (plural) wash yourselves |

        | loro si lavano | they wash themselves |


        ## Examples


        <span lang="it">Mi chiamo Marco.</span> (My name is Marco. Literally: I call
        myself Marco.) — the most common reflexive phrase at A1 level.


        <span lang="it">Mi alzo alle sette.</span> (I get up at seven o''clock.) —
        <span lang="it">alzarsi</span> is a key verb for daily routines.


        <span lang="it">Lei si veste in fretta.</span> (She gets dressed quickly.)
        — note that <span lang="it">si</span> covers both ''himself'' and ''herself''.


        <span lang="it">Ci sediamo qui.</span> (We sit down here.) — <span lang="it">sedersi</span>,
        ''to sit down'', is another very common reflexive verb.


        <span lang="it">Vi svegliate tardi la domenica?</span> (Do you all wake up
        late on Sundays?) — reflexive pronoun in a question; position does not change.


        Contrastive pair — reflexive vs. non-reflexive:

        <span lang="it">Lavo la macchina.</span> (I wash the car.) — no reflexive
        pronoun; the action falls on an external object.

        <span lang="it">Mi lavo.</span> (I wash myself.) — reflexive pronoun required
        because the subject is washing themselves.


        ## Common mistakes


        **Omitting the pronoun.** Learners sometimes conjugate the verb but forget
        the pronoun entirely. This produces a grammatically incomplete or wrong sentence.

        Mistake: <span lang="it">*Chiamo Marco.</span> — this means ''I call Marco''
        (someone else named Marco), not ''my name is Marco''.

        Correct: <span lang="it">Mi chiamo Marco.</span>


        **Using the wrong pronoun for the subject.** Because the reflexive pronoun
        must match the subject, mixing them is a very common error.

        Mistake: <span lang="it">*Lei mi lava.</span> — this means ''she washes me'',
        not ''she washes herself''.

        Correct: <span lang="it">Lei si lava.</span>


        **Placing the pronoun after the verb in a normal statement.** In a standard
        present-tense sentence the pronoun comes before the verb, not after it.

        Mistake: <span lang="it">*Alzo mi alle sette.</span>

        Correct: <span lang="it">Mi alzo alle sette.</span>


        **Confusing <span lang="it">si</span> with <span lang="it">se</span>.** The
        reflexive pronoun for third-person singular and plural is always <span lang="it">si</span>,
        never <span lang="it">se</span> (which is a conjunction meaning ''if'').

        Mistake: <span lang="it">*Se chiama Anna.</span>

        Correct: <span lang="it">Si chiama Anna.</span> (Her name is Anna.)'
      language: en
      why_this_matters: Reflexive pronouns are everywhere in everyday Italian. Dozens
        of the most common verbs — getting up, getting dressed, washing, sitting down,
        being called — are reflexive verbs, and they cannot work at all without their
        matching reflexive pronoun. Without this rule you cannot say your name, describe
        your morning routine, or talk about how you feel.
  prerequisites:
