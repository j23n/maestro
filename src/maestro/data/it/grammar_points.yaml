- code: art_pos_ad
  cefr_level: A1
  category: articoli
  source_url: https://www.unistrapg.it/profilo_lingua_italiana/site/gram_articoli_a1.html
  unistr_code: presenza_dellarticolo_determinativo_in_posizione_che_precede_gli_aggettivi
  unistr_label: Presenza dell’articolo determinativo in posizione che precede gli
    aggettivi possessivi, es. la mia sedia
  chunk_ref: book_5_l_articolo_usi_particolari
  label: Articolo determinativo con aggettivi possessivi
  explanations:
    en:
      title: Definite articles with possessive adjectives
      tip: 'In Italian, you usually drop the definite article before singular family
        nouns used with a possessive adjective — so ''my mother'' is ''mia madre'',
        not ''la mia madre''. But there are important exceptions: always keep the
        article in the plural, with ''mamma'' and ''papà'', and when an extra describing
        word is added.'
      explanation: '## The basic rule


        When a singular family noun is directly preceded by a possessive adjective
        (<span lang="it">mio, tuo, suo, nostro, vostro, loro</span> — my, your, his/her,
        our, your, their), you do **not** use the definite article (<span lang="it">il,
        la, l''</span>).


        **Pattern:** possessive adjective + family noun (no article)


        | Italian | English |

        |---|---|

        | mio padre | my father |

        | tua sorella | your sister |

        | suo fratello | his/her brother |

        | nostra madre | our mother |

        | vostro zio | your uncle |

        | loro figlia | their daughter |


        This pattern applies to the most common singular family terms: <span lang="it">padre</span>
        (father), <span lang="it">madre</span> (mother), <span lang="it">figlio/figlia</span>
        (son/daughter), <span lang="it">fratello</span> (brother), <span lang="it">sorella</span>
        (sister), <span lang="it">nonno/nonna</span> (grandfather/grandmother), <span
        lang="it">zio/zia</span> (uncle/aunt), <span lang="it">cugino/cugina</span>
        (cousin), <span lang="it">nipote</span> (nephew/niece/grandchild).


        ## When you MUST keep the article


        There are four important exceptions — situations where the definite article
        is **required** even with a possessive adjective and a family noun.


        ### 1. Plural family nouns


        In the plural, the article always returns.


        | Italian | English |

        |---|---|

        | i miei nonni | my grandparents |

        | i nostri cugini | our cousins |

        | le tue sorelle | your sisters |

        | i suoi fratelli | his/her brothers |


        ### 2. ''Mamma'' and ''papà'' — always take the article


        The everyday words <span lang="it">mamma</span> (mum) and <span lang="it">papà</span>
        (dad) always keep the article, even in the singular.


        | Italian | English |

        |---|---|

        | la mia mamma | my mum |

        | il tuo papà | your dad |


        ### 3. When an adjective is added


        If any describing word (adjective) accompanies the family noun, the article
        is required.


        | Italian | English |

        |---|---|

        | il nostro caro zio | our dear uncle |

        | la mia piccola sorella | my little sister |


        ### 4. When an altered form (diminutive or similar) is used


        Italian family nouns can take suffixes that add a shade of meaning — for example,
        making a word sound smaller or more affectionate. These altered forms (<span
        lang="it">alterati</span>) always keep the article.


        | Italian | English |

        |---|---|

        | la mia cuginetta | my little/dear cousin |

        | il mio fratellino | my little brother |


        ## Examples in context


        <span lang="it">Mio fratello si chiama Marco.</span>

        (My brother''s name is Marco.) — singular, no adjective: no article.


        <span lang="it">I miei fratelli si chiamano Marco e Luca.</span>

        (My brothers are called Marco and Luca.) — plural: article required.


        <span lang="it">La mia mamma cucina bene.</span>

        (My mum cooks well.) — ''mamma'' always takes the article.


        <span lang="it">Il nostro caro nonno abita a Roma.</span>

        (Our dear grandfather lives in Rome.) — adjective ''caro'' present: article
        required.


        <span lang="it">Tua sorella parla italiano?</span>

        (Does your sister speak Italian?) — singular, no adjective: no article.


        <span lang="it">La mia sorellina dorme.</span>

        (My little sister is sleeping.) — diminutive form: article required.


        ## Common learner mistakes


        **Mistake 1 — Adding the article in the simple singular case:**

        Learners often write <span lang="it">*la mia sorella</span> by analogy with
        English ''my sister'', not realising Italian drops the article here. Correct
        form: <span lang="it">mia sorella</span>.


        **Mistake 2 — Dropping the article in the plural:**

        Having learned the ''no article'' rule, learners then wrongly say <span lang="it">*miei
        nonni</span> without an article. Correct form: <span lang="it">i miei nonni</span>.


        **Mistake 3 — Forgetting the article with ''mamma'' and ''papà'':**

        Because <span lang="it">madre</span> and <span lang="it">padre</span> drop
        the article, learners assume the same for <span lang="it">mamma</span> and
        <span lang="it">papà</span>. Incorrect: <span lang="it">*mia mamma</span>.
        Correct: <span lang="it">la mia mamma</span>.


        **Mistake 4 — Dropping the article when an adjective is present:**

        Learners sometimes write <span lang="it">*nostro caro zio</span> instead of
        <span lang="it">il nostro caro zio</span>. Any time a describing word joins
        the phrase, the article comes back.


        ## Quick summary table


        | Situation | Article? | Example |

        |---|---|---|

        | Singular family noun, no adjective | No | mio padre |

        | Plural family noun | Yes | i miei fratelli |

        | Mamma or papà, any number | Yes | la mia mamma |

        | Family noun + adjective | Yes | il nostro caro zio |

        | Diminutive / altered form | Yes | la mia sorellina |'
      language: en
      why_this_matters: Talking about your family is one of the very first things
        you do in Italian — introducing your parents, siblings, and grandparents comes
        up constantly at A1 level. The rule about dropping or keeping the article
        with family nouns is one of the most frequent sources of errors for English
        speakers, because English always says 'my brother', 'your sister' with no
        article at all, whereas Italian has a nuanced pattern you need to follow from
        day one.
