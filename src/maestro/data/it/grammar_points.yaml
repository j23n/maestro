- code: imper_form
  cefr_level: A1
  category: verbi
  unistr_code: la_coniugazione_attiva_con_particolare_riferimento_a_tutte_e_tre_le_persone
  unistr_label: imperativo formale ed informale del verbo scusare ( scusi/scusa )
  source_url: https://www.unistrapg.it/profilo_lingua_italiana/site/gram_verbi_a1.html
  chunk_ref: book_8_il_verbo_uso_degli_altri_modi_imperativo
  label: Imperativo formale e informale del verbo scusare
  explanations:
    en:
      title: Formal and Informal Imperative of 'scusare'
      tip: To ask someone to excuse you, say 'scusa' to a friend and 'scusi' to a
        stranger or someone older. These two forms come from different grammatical
        persons, so you cannot swap them without sounding rude or odd.
      explanation: '## The rule: imperative of scusare


        The verb <span lang="it">scusare</span> (to excuse, to forgive) is a regular
        <span lang="it">-are</span> verb. Its imperative forms follow the standard
        pattern for <span lang="it">-are</span> verbs, but there is one important
        twist: the <span lang="it">Lei</span> (formal ''you'') form is borrowed from
        the <span lang="it">congiuntivo presente</span> (present subjunctive), not
        the indicative.


        ## Imperative forms of scusare


        | Person | Form | When to use it |

        |---|---|---|

        | tu (informal singular) | scusa | one friend, family member, child, peer
        |

        | Lei (formal singular) | scusi | stranger, older person, professional context
        |

        | voi (informal plural) | scusate | a group of friends or peers |

        | Loro (formal plural, rare) | scusino | very formal, e.g. addressing a group
        of clients |


        Note: the first person singular (<span lang="it">io</span>) does not exist
        in the imperative — you cannot give an order to yourself.


        ## Informal imperative: scusa (tu)


        Use <span lang="it">scusa</span> when speaking to one person you address as
        <span lang="it">tu</span>. This is the standard second-person singular imperative
        of a regular <span lang="it">-are</span> verb: drop the <span lang="it">-re</span>
        from the infinitive <span lang="it">scusare</span> to get <span lang="it">scusa</span>.


        ## Formal imperative: scusi (Lei)


        Use <span lang="it">scusi</span> when speaking to one person you address as
        <span lang="it">Lei</span> (the formal singular ''you''). This form ends in
        <span lang="it">-i</span> because it is drawn from the present subjunctive.
        This <span lang="it">-i</span> ending is the key marker of the formal imperative
        for all regular <span lang="it">-are</span> verbs.


        ## Negative imperative


        To tell someone <span lang="it">not</span> to do something, the rule changes
        for the informal singular only: place <span lang="it">non</span> before the
        infinitive <span lang="it">scusare</span>, not before the imperative form.


        | Person | Negative form |

        |---|---|

        | tu (informal) | non scusare |

        | Lei (formal) | non scusi |

        | voi | non scusate |


        For <span lang="it">Lei</span> and <span lang="it">voi</span>, the negative
        is simply <span lang="it">non</span> + the same imperative form. Only the
        <span lang="it">tu</span> negative uses the infinitive.


        ## Examples


        <span lang="it">Scusa, come ti chiami?</span> (Sorry, what''s your name?)
        — informal, talking to a friend.


        <span lang="it">Scusi, dov''è la stazione?</span> (Excuse me, where is the
        station?) — formal, asking a stranger for directions.


        <span lang="it">Scusate, siete pronti?</span> (Excuse me, are you ready?)
        — informal plural, addressing a group of friends.


        <span lang="it">Non scusare sempre lui!</span> (Don''t always make excuses
        for him!) — informal negative, using the infinitive after <span lang="it">non</span>.


        <span lang="it">Scusi, signora, questo posto è libero?</span> (Excuse me,
        madam, is this seat free?) — formal, polite address to an older woman.


        <span lang="it">Scusa, non scusare — </span>contrastive pair: <span lang="it">scusa</span>
        is the affirmative imperative (''say sorry / excuse me''), while <span lang="it">non
        scusare</span> is the negative imperative (''don''t excuse / don''t apologise'').


        ## Common learner mistakes


        **Mistake 1 — using <span lang="it">scusa</span> in a formal situation:**
        Saying <span lang="it">scusa</span> to a professor or a shop assistant you
        have just met sounds too familiar. Always use <span lang="it">scusi</span>
        when in doubt about the relationship.


        **Mistake 2 — using <span lang="it">scusi</span> with friends:** Conversely,
        using <span lang="it">scusi</span> with a classmate or a sibling sounds comically
        stiff. Match the form to the relationship.


        **Mistake 3 — negative informal with the imperative form:** A common error
        is <span lang="it">*non scusa!</span> This is wrong. The correct informal
        negative is <span lang="it">non scusare!</span> — always use the infinitive
        after <span lang="it">non</span> for the <span lang="it">tu</span> form.


        **Mistake 4 — confusing <span lang="it">scusa</span> and <span lang="it">scusi</span>
        as simply ''polite vs. casual'':** The difference is grammatical, not just
        social. <span lang="it">Scusi</span> is a subjunctive-derived form linked
        to the pronoun <span lang="it">Lei</span>, while <span lang="it">scusa</span>
        is a true imperative linked to <span lang="it">tu</span>. Understanding this
        helps you apply the same pattern to other verbs.'
      language: en
      why_this_matters: '''Excuse me'' and ''sorry'' are among the first things you
        need in any language. In Italian, the word you choose depends on <span lang="it">registro</span>
        (register) — whether you are speaking informally to a friend or formally to
        a stranger. Getting this right immediately makes you sound polite and natural;
        getting it wrong can come across as rude or overly stiff.'
