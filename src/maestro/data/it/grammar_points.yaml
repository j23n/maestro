- code: adv_manner
  cefr_level: A1
  category: avverbi
  source_url: https://www.unistrapg.it/profilo_lingua_italiana/site/gram_avverbi_a1.html
  unistr_code: di_modo_bene_male
  unistr_label: 'Di modo: bene, male'
  chunk_ref: book_9_l_avverbio
  label: 'Avverbi di modo: bene, male'
  explanations:
    en:
      title: 'Adverbs of manner: bene and male'
      tip: The words 'bene' (well) and 'male' (badly) describe how an action is done.
        They never change their form — they look the same no matter who is doing the
        action or what tense the verb is in.
      explanation: '## What adverbs of manner are


        An adverb of manner answers the question <span lang="it">''come?''</span>
        (how?). It modifies a verb, an adjective, or another adverb, telling us in
        what way something happens. The textbook category of manner adverbs (<span
        lang="it">avverbi di modo</span>) is the largest class of adverbs in Italian.
        <span lang="it">Bene</span> and <span lang="it">male</span> are the two most
        essential members of this class at A1 level.


        ## The core rule


        Both <span lang="it">bene</span> and <span lang="it">male</span> are **invariable**:
        they have one fixed form only. They do not agree with any noun or pronoun
        in gender or number. They are placed **directly after the verb** they modify
        in a simple tense, or after the past participle in a compound tense.


        ### Forms at a glance


        | Adverb | Meaning | Changes form? |

        |---|---|---|

        | bene | well | never |

        | male | badly, poorly | never |


        ## How to use them


        ### Modifying a verb


        Place <span lang="it">bene</span> or <span lang="it">male</span> immediately
        after the conjugated verb:


        - <span lang="it">Marco parla bene l''italiano.</span> — Marco speaks Italian
        well.

        - <span lang="it">Io canto male.</span> — I sing badly.


        In compound tenses (e.g. the <span lang="it">passato prossimo</span>, present
        perfect), the adverb follows the past participle:


        - <span lang="it">Hai dormito bene?</span> — Did you sleep well?

        - <span lang="it">Ho mangiato male ieri sera.</span> — I ate badly last night.


        ### The greeting formula


        The single most common use of these two adverbs at A1 level is in greetings.
        When someone asks <span lang="it">''Come stai?''</span> (How are you?), the
        standard replies use <span lang="it">bene</span> or <span lang="it">male</span>
        with the verb <span lang="it">stare</span> (to be, in the sense of feeling):


        - <span lang="it">Sto bene, grazie.</span> — I am well, thank you.

        - <span lang="it">Sto male oggi.</span> — I am not well / I feel bad today.


        Note that <span lang="it">bene</span> and <span lang="it">male</span> can
        also stand alone as short answers: <span lang="it">''Bene!''</span> or <span
        lang="it">''Male...''</span>


        ## Important variants and related forms


        ### Modifying an adjective or another adverb


        Less commonly at A1, <span lang="it">bene</span> can strengthen an adjective,
        where it means ''quite'' or ''really'':


        - <span lang="it">È bene cotto.</span> — It is well cooked / properly cooked.


        ### Comparative and superlative forms


        Like most adverbs, <span lang="it">bene</span> and <span lang="it">male</span>
        have irregular comparative and superlative forms. You will meet these at a
        higher level, but they are listed here for completeness:


        | Form | bene | male |

        |---|---|---|

        | base | bene (well) | male (badly) |

        | comparative | meglio (better) | peggio (worse) |

        | superlative | benissimo (very well) | malissimo (very badly) |


        At A1 you only need <span lang="it">bene</span> and <span lang="it">male</span>
        themselves, but recognising <span lang="it">benissimo</span> and <span lang="it">malissimo</span>
        (formed by adding <span lang="it">-issimo</span> to the stem) is useful from
        the start.


        ## Examples covering key uses


        1. <span lang="it">La bambina disegna bene.</span> — The little girl draws
        well. *(verb modified)*

        2. <span lang="it">Mio fratello cucina male.</span> — My brother cooks badly.
        *(verb modified)*

        3. <span lang="it">Come stai? — Sto bene!</span> — How are you? — I am well!
        *(greeting formula)*

        4. <span lang="it">Hai capito bene la lezione?</span> — Did you understand
        the lesson well? *(compound tense)*

        5. <span lang="it">Ho dormito male stanotte.</span> — I slept badly last night.
        *(compound tense + time adverb)*

        6. <span lang="it">Parla bene lui, ma lei parla male.</span> — He speaks well,
        but she speaks badly. *(contrastive pair — note: <span lang="it">bene</span>
        and <span lang="it">male</span> are identical in form whether the subject
        is masculine or feminine)*


        ## Common learner mistakes


        ### Mistake 1: Confusing the adverb with the adjective


        The adjective meaning ''good'' is <span lang="it">buono/buona</span>, and
        the adjective meaning ''bad'' is <span lang="it">cattivo/cattiva</span>. These
        describe nouns and must agree in gender and number. <span lang="it">Bene</span>
        and <span lang="it">male</span> describe actions (verbs) and never change.


        ❌ <span lang="it">*Parla buono l''italiano.</span> — Wrong: <span lang="it">buono</span>
        is an adjective; it cannot modify a verb.

        ✅ <span lang="it">Parla bene l''italiano.</span> — Correct: use the adverb
        <span lang="it">bene</span> to modify the verb.


        ❌ <span lang="it">*Canta cattiva.</span> — Wrong: <span lang="it">cattiva</span>
        is an adjective and cannot describe how someone sings.

        ✅ <span lang="it">Canta male.</span> — Correct.


        ### Mistake 2: Making the adverb agree with the subject


        Because Italian adjectives agree with nouns, beginners sometimes try to make
        adverbs agree too. This is never correct.


        ❌ <span lang="it">*Le ragazze parlano beni.</span> — Wrong: <span lang="it">bene</span>
        does not take a plural form.

        ✅ <span lang="it">Le ragazze parlano bene.</span> — Correct: the adverb stays
        <span lang="it">bene</span> regardless of the subject.


        ### Mistake 3: Using ''stare'' vs ''essere'' with bene


        When talking about health or how someone feels, Italian uses <span lang="it">stare
        bene / stare male</span>, not <span lang="it">essere bene</span>.


        ❌ <span lang="it">*Sono bene.</span> — Unnatural in this context.

        ✅ <span lang="it">Sto bene.</span> — Correct: I am well / I feel well.


        ### Mistake 4: Wrong word order


        In Italian, manner adverbs come after the verb (or after the past participle
        in compound tenses), not before it as sometimes happens in English (''she
        well understands'').


        ❌ <span lang="it">*Bene parla italiano.</span>

        ✅ <span lang="it">Parla bene italiano.</span> — Correct word order.'
      language: en
      why_this_matters: The adverbs <span lang="it">bene</span> (well) and <span lang="it">male</span>
        (badly/poorly) are among the most frequently used words in everyday Italian.
        You will need them from your very first conversations — to say how someone
        is feeling, how well you understand something, or how a meal tastes. Because
        they are invariable (they never change form), learning them is straightforward,
        but knowing exactly where to place them and how they differ from similar adjectives
        removes one of the most persistent errors beginners make.
- code: adv_place
  cefr_level: A1
  category: avverbi
  source_url: https://www.unistrapg.it/profilo_lingua_italiana/site/gram_avverbi_a1.html
  unistr_code: di_luogo_qui_qua_li_la_fuori_dentro_dietro_davanti_sopra_sotto_vicino_lontano
  unistr_label: 'Di luogo: qui, qua, lì, là, fuori, dentro, dietro, davanti, sopra,
    sotto, vicino, lontano, su, giù, indietro, avanti'
  chunk_ref: book_9_l_avverbio
  label: 'Avverbi di luogo: qui, qua, lì, là, fuori, dentro, dietro, davanti, sopra,
    sotto, vicino, lontano, su, giù, indietro, avanti'
  explanations:
    en:
      title: 'Adverbs of place: here, there, inside, outside…'
      tip: Italian adverbs of place tell you *where* something or someone is — words
        like 'here', 'there', 'inside', 'outside', 'near', 'far'. They never change
        their form, no matter what noun or verb they are used with.
      explanation: '## The rule: what adverbs of place are and how they work


        An adverb of place (<span lang="it">avverbio di luogo</span>, an unchanging
        word that says *where*) is an **invariable** word — it has only one form.
        It never agrees with a noun like an adjective does. It modifies a verb, telling
        you where the action happens, or it modifies another word to give location.


        The core A1 adverbs of place are listed below with their meanings:


        | Italiano | English |

        |---|---|

        | qui / qua | here |

        | lì / là | there |

        | dentro | inside |

        | fuori | outside |

        | sopra | above / on top |

        | sotto | below / underneath |

        | davanti | in front |

        | dietro | behind / at the back |

        | vicino | near / nearby |

        | lontano | far / far away |

        | su | up |

        | giù | down |

        | avanti | forward / ahead |

        | indietro | back / backward |


        ## qui / qua and lì / là — what is the difference?


        Both pairs mean ''here'' and ''there'' respectively, and in everyday spoken
        Italian they are largely interchangeable. The traditional distinction is:


        - <span lang="it">qui</span> and <span lang="it">lì</span> point to a **precise**
        spot.

        - <span lang="it">qua</span> and <span lang="it">là</span> point to a **vaguer
        or wider** area.


        At A1 level, do not worry about this distinction — both forms are correct
        and understood. Just be consistent within a sentence.


        ## Examples


        <span lang="it">Il gatto è qui.</span>

        (The cat is here.)


        <span lang="it">La borsa è là, sul tavolo.</span>

        (The bag is there, on the table.)


        <span lang="it">I bambini giocano fuori.</span>

        (The children are playing outside.)


        <span lang="it">Vieni dentro! Fa freddo.</span>

        (Come inside! It''s cold.)


        <span lang="it">Il libro è sopra, il quaderno è sotto.</span>

        (The book is on top, the notebook is underneath.) — a contrastive pair showing
        two adverbs of place in the same sentence.


        <span lang="it">La scuola non è lontano; è vicino.</span>

        (The school is not far; it is nearby.) — a contrastive pair with a negative.


        ## Adverbs of place used with a following noun (preposition + noun)


        Many of these adverbs can also work as **prepositions** when followed directly
        by a noun. When they stand alone (no noun after them), they are adverbs. Compare:


        - Adverb alone: <span lang="it">Marco è davanti.</span> (Marco is in front.)

        - Followed by a noun: <span lang="it">Marco è davanti alla scuola.</span>
        (Marco is in front of the school.)


        At A1 level you will mostly use these words as standalone adverbs. Just be
        aware that adding <span lang="it">a</span> (''to/at'') or <span lang="it">di</span>
        (''of'') after them is also possible and very common.


        ## Invariability — the key point


        Unlike adjectives, adverbs **never change**. Whether the subject is masculine,
        feminine, singular, or plural, the adverb stays the same:


        - <span lang="it">Il papà è dentro.</span> ✓

        - <span lang="it">La mamma è dentro.</span> ✓

        - <span lang="it">I bambini sono dentro.</span> ✓


        There is nothing to agree with — the form never changes.


        ## Common learner mistakes


        **Mistake 1 — trying to make the adverb agree with the noun**


        <span lang="it">*Il gatto è fuora.</span> ✗ — <span lang="it">fuori</span>
        has only one form. Write: <span lang="it">Il gatto è fuori.</span> ✓


        **Mistake 2 — confusing qui/qua and lì/là with the pronouns ci and vi**


        You may soon meet <span lang="it">ci</span> and <span lang="it">vi</span>
        (also meaning ''there/here'' in certain structures). At A1, stick to <span
        lang="it">qui/qua</span> and <span lang="it">lì/là</span> for simple location;
        <span lang="it">ci</span> and <span lang="it">vi</span> are covered at a higher
        level.


        **Mistake 3 — using su and giù for location instead of direction**


        In Italian, <span lang="it">su</span> (''up'') and <span lang="it">giù</span>
        (''down'') most naturally describe **movement or direction**, not a static
        position. For a static position, <span lang="it">sopra</span> and <span lang="it">sotto</span>
        are more natural:


        - Direction: <span lang="it">Vai su!</span> (Go up!) ✓

        - Position: <span lang="it">Il gatto è sopra il letto.</span> (The cat is
        on top of the bed.) ✓ — not <span lang="it">*su il letto</span> ✗


        **Mistake 4 — forgetting the accent on là**


        Write <span lang="it">là</span> (with a grave accent) for the adverb ''there''.
        Without the accent, <span lang="it">la</span> is the feminine definite article
        or an object pronoun — a completely different word.'
      language: en
      why_this_matters: 'Every time you describe where something is, where you are
        going, or where someone is standing, you need an adverb of place. These words
        appear in almost every conversation — giving directions, describing your home,
        talking about people around you. Without them you cannot answer the most basic
        question of all: <span lang="it">Dov''è?</span> (''Where is it?'')'
- code: adv_time_a
  cefr_level: A1
  category: avverbi
  source_url: https://www.unistrapg.it/profilo_lingua_italiana/site/gram_avverbi_a1.html
  unistr_code: di_tempo_ora_adessooggi_dopo_ieri_domani_spesso_sempre_mai_presto_tardi
  unistr_label: 'Di tempo: ora, adesso,oggi, dopo, ieri, domani, spesso, sempre, mai
    , presto, tardi'
  chunk_ref: book_9_l_avverbio
  label: 'Avverbi di tempo: ora, adesso, oggi, dopo, ieri, domani, spesso, sempre,
    mai, presto, tardi'
  explanations:
    en:
      title: 'Time adverbs: when, how often, how soon'
      tip: Italian time adverbs tell you when something happens or how often it happens.
        They never change their form — they are the same word whether the subject
        is singular or plural, masculine or feminine.
      explanation: '## What a time adverb is


        An adverb (<span lang="it">avverbio</span>, an unchanging word that modifies
        a verb) of time tells you <em>when</em> or <em>how often</em> an action happens.
        Italian time adverbs are <strong>invariable</strong> — they have only one
        form. They never agree with a noun or verb, so there is nothing to conjugate
        or decline.


        ## Core time adverbs at A1


        The table below groups the most important A1 time adverbs by meaning.


        | Italian | English meaning | Category |

        |---|---|---|

        | ora / adesso | now | point in time |

        | oggi | today | point in time |

        | ieri | yesterday | point in time |

        | domani | tomorrow | point in time |

        | dopo | after / later | point in time |

        | presto | soon / early | point in time |

        | tardi | late | point in time |

        | sempre | always | frequency |

        | spesso | often | frequency |

        | mai | never / ever | frequency |


        ## Where to place a time adverb in a sentence


        The most common position is <strong>after the verb</strong> (or after the
        object if there is one). This is the neutral, unmarked order.


        <span lang="it">Mangio adesso.</span> — I am eating now.


        You can also place a time adverb <strong>at the beginning</strong> of the
        sentence for emphasis, especially with words like <span lang="it">oggi</span>,
        <span lang="it">domani</span>, and <span lang="it">ieri</span>.


        <span lang="it">Oggi ho scuola.</span> — Today I have school.


        Frequency adverbs (<span lang="it">sempre</span>, <span lang="it">spesso</span>,
        <span lang="it">mai</span>) most naturally sit <strong>after the verb</strong>
        in a simple tense.


        <span lang="it">Mia madre cucina sempre.</span> — My mother always cooks.


        ## Using <span lang="it">mai</span> (''never'' / ''ever'')


        <strong>This adverb has two distinct uses and is one of the trickiest at A1.</strong>


        1. In a <strong>negative</strong> sentence, <span lang="it">mai</span> means
        <em>never</em>. Italian requires <strong>double negation</strong>: you must
        keep <span lang="it">non</span> before the verb <em>and</em> add <span lang="it">mai</span>
        after it.


        <span lang="it">Non mangio mai la carne.</span> — I never eat meat.


        2. In a <strong>question</strong>, <span lang="it">mai</span> means <em>ever</em>.


        <span lang="it">Mangi mai la pizza?</span> — Do you ever eat pizza?


        ## <span lang="it">ora</span> and <span lang="it">adesso</span>: two words
        for ''now''


        Both <span lang="it">ora</span> and <span lang="it">adesso</span> mean <em>now</em>
        and are interchangeable in everyday speech. Neither is more formal than the
        other at this level.


        <span lang="it">Sono a casa ora.</span> — I am at home now.

        <span lang="it">Sono a casa adesso.</span> — I am at home now. (same meaning)


        ## <span lang="it">presto</span>: ''soon'' or ''early''


        Context decides the meaning. When <span lang="it">presto</span> refers to
        <em>how soon</em> something will happen, it means <em>soon</em>. When it describes
        <em>the time of day</em> something happens, it means <em>early</em>.


        <span lang="it">A presto!</span> — See you soon!

        <span lang="it">Mi alzo presto.</span> — I get up early.


        ## Examples covering the main uses


        1. <span lang="it">Ieri ho mangiato la pasta.</span> — Yesterday I ate pasta.


        2. <span lang="it">Domani c''è una festa.</span> — Tomorrow there is a party.


        3. <span lang="it">Arrivo tardi oggi.</span> — I am arriving late today.


        4. <span lang="it">Mio fratello studia sempre.</span> — My brother always
        studies.


        5. <span lang="it">Non vado mai a letto presto.</span> — I never go to bed
        early.


        6. <span lang="it">Dopo, beviamo il caffè.</span> — Afterwards, we drink coffee.


        ## Common learner mistakes


        <strong>Mistake 1 — Dropping </strong><span lang="it">non</span><strong> with
        </strong><span lang="it">mai</span><strong>:</strong>


        ❌ <span lang="it">Mangio mai la carne.</span>

        ✅ <span lang="it">Non mangio mai la carne.</span> — Italian always needs <span
        lang="it">non</span> before the verb even when <span lang="it">mai</span>
        is present. You cannot drop <span lang="it">non</span> the way English drops
        ''not'' when it uses ''never''.


        <strong>Mistake 2 — Treating </strong><span lang="it">domani</span><strong>
        or </strong><span lang="it">ieri</span><strong> as adjectives and trying to
        make them agree:</strong>


        ❌ <span lang="it">la lezione domania</span>

        ✅ <span lang="it">la lezione di domani</span> — When you want to say ''tomorrow''s
        lesson'', use the preposition <span lang="it">di</span> before the time adverb.
        The adverb itself never changes.


        <strong>Mistake 3 — Placing </strong><span lang="it">sempre</span><strong>
        or </strong><span lang="it">spesso</span><strong> before the verb in a simple
        tense, copying English word order:</strong>


        ❌ <span lang="it">Io sempre mangio la colazione.</span>

        ✅ <span lang="it">Io mangio sempre la colazione.</span> — In Italian the frequency
        adverb follows the conjugated verb, not precedes it.


        <strong>Mistake 4 — Confusing </strong><span lang="it">presto</span><strong>
        (early/soon) with </strong><span lang="it">prima</span><strong> (before/first):</strong>


        These are two different adverbs. <span lang="it">Presto</span> relates to
        how early or how soon; <span lang="it">prima</span> means <em>before</em>
        or <em>first</em> in a sequence.


        ✅ <span lang="it">Prima mangio, poi studio.</span> — First I eat, then I study.'
      language: en
      why_this_matters: Time adverbs are among the very first words you need in Italian.
        Without them, you cannot say 'today', 'never', 'always', 'yesterday', or 'tomorrow'
        — words that appear in almost every conversation. Because they never change
        form, they are also one of the easiest building blocks to master, and getting
        them right immediately makes your Italian sound natural.
- code: adv_quant
  cefr_level: A1
  category: avverbi
  source_url: https://www.unistrapg.it/profilo_lingua_italiana/site/gram_avverbi_a1.html
  unistr_code: di_quantita_molto_poco_tanto_piu_meno_niente_un_po
  unistr_label: 'Di quantità: molto, poco, tanto, più, meno, niente, un po’'
  chunk_ref: book_9_l_avverbio
  label: 'Avverbi di quantità: molto, poco, tanto, più, meno, niente, un po'''
  explanations:
    en:
      title: 'Adverbs of quantity: molto, poco, tanto, and more'
      tip: Words like 'molto' (a lot), 'poco' (a little), and 'troppo' (too much)
        can describe verbs, adjectives, or other adverbs without ever changing their
        form. When used as adverbs, they stay the same no matter what word they modify
        — do not add endings to match gender or number.
      explanation: '## The rule: what adverbs of quantity are and how they work


        An adverb of quantity tells you *how much* or *to what degree* something happens
        or is true. In Italian, adverbs are **invariable** — they never change their
        ending for gender or number. An adverb of quantity can modify:


        - a **verb**: <span lang="it">Mangio molto.</span> (I eat a lot.)

        - an **adjective**: <span lang="it">È molto stanca.</span> (She is very tired.)

        - another **adverb**: <span lang="it">Parla troppo lentamente.</span> (He
        speaks too slowly.)


        The key point: when one of these words functions as an **adverb**, it is frozen
        in one form. It does **not** agree with any noun or adjective it appears near.


        ## The most important adverbs of quantity at A1


        Here are the core adverbs you need to know first, with their basic meanings:


        | Avverbio | English |

        |---|---|

        | molto | a lot, very, much |

        | poco | a little, not very, not much |

        | tanto | so much, a lot |

        | troppo | too much, too |

        | abbastanza | enough, quite |

        | quasi | almost, nearly |

        | più | more |

        | meno | less, fewer |

        | niente / nulla | nothing (also used to mean ''not at all'' in some constructions)
        |

        | un po'' | a little bit (short for un poco) |

        | assai | very, quite a lot (slightly formal) |

        | parecchio | quite a lot, rather a lot |

        | soltanto / solo | only, just |

        | almeno | at least |

        | piuttosto | rather, quite |


        ## Forming sentences: position and use


        **When modifying a verb**, the adverb usually comes directly after the verb:


        <span lang="it">Dormo molto.</span> — I sleep a lot.

        <span lang="it">Mangi poco.</span> — You eat very little.

        <span lang="it">Studiamo tanto.</span> — We study a lot.


        **When modifying an adjective or another adverb**, it comes directly before
        that word:


        <span lang="it">Il caffè è troppo caldo.</span> — The coffee is too hot.

        <span lang="it">Parla abbastanza bene.</span> — She speaks quite well.


        ## Examples covering the main uses


        **1. Modifying a verb**

        <span lang="it">Mia sorella mangia poco.</span>

        My sister eats very little.


        **2. Modifying an adjective**

        <span lang="it">Questo esercizio è molto facile.</span>

        This exercise is very easy.


        **3. Expressing excess**

        <span lang="it">Bevi troppo caffè!</span>

        You drink too much coffee!


        **4. Using <span lang="it">un po''</span> to soften a statement**

        <span lang="it">Sono un po'' stanco oggi.</span>

        I am a little tired today.


        **5. Modifying another adverb**

        <span lang="it">Arriva sempre molto tardi.</span>

        He always arrives very late.


        **6. Contrastive pair — <span lang="it">più</span> and <span lang="it">meno</span>**

        <span lang="it">Marco parla più di me, ma capisce meno.</span>

        Marco talks more than me, but understands less.


        ## Critical exception: adverb vs. adjective


        Several of these words — <span lang="it">molto</span>, <span lang="it">poco</span>,
        <span lang="it">tanto</span>, <span lang="it">troppo</span>, <span lang="it">parecchio</span>,
        <span lang="it">altrettanto</span> — can also be used as **adjectives** that
        directly modify a noun. When they are adjectives, they **do** agree in gender
        and number with the noun.


        Compare:


        | Function | Italian | English |

        |---|---|---|

        | Adverb (modifies adjective) | una pizza molto buona | a very good pizza
        |

        | Adjective (modifies noun) | molta pizza | a lot of pizza |

        | Adverb (modifies verb) | mangio molto | I eat a lot |

        | Adjective (modifies noun) | molti bambini | many children |


        **Rule of thumb**: if the word comes before a noun and you could replace it
        with a number or ''many/much'', it is an adjective and must agree. If it comes
        after a verb, or before another adjective or adverb, it is functioning as
        an adverb and stays invariable.


        ## Special note on ''un po''''


        <span lang="it">Un po''</span> is a contraction of <span lang="it">un poco</span>
        (a little bit) and is far more common in everyday speech. It is always written
        with an apostrophe showing the dropped syllable. It softens adjectives and
        verbs:


        <span lang="it">Parla un po'' piano, per favore.</span> — Speak a little quietly,
        please.

        <span lang="it">Ho un po'' di fame.</span> — I am a little hungry. (lit. I
        have a little of hunger.)


        Note: <span lang="it">un po'' di</span> (a little of) is followed by a noun
        and is a fixed expression.


        ## Common learner mistakes


        **Mistake 1: Adding adjective endings to an adverb.**

        Incorrect: <span lang="it">*È multa brava.</span>

        Correct: <span lang="it">È molto brava.</span> (She is very good.)

        When <span lang="it">molto</span> modifies an adjective like <span lang="it">brava</span>,
        it is an adverb. It does not change to match <span lang="it">brava</span>''s
        feminine form. It is always <span lang="it">molto</span>, never <span lang="it">*molta</span>
        in this role.


        **Mistake 2: Confusing <span lang="it">molto</span> (adverb) with <span lang="it">molti/molte</span>
        (adjective).**

        Incorrect: <span lang="it">*Ho molto amici.</span>

        Correct: <span lang="it">Ho molti amici.</span> (I have many friends.) — here
        <span lang="it">molti</span> is an adjective agreeing with the masculine plural
        noun <span lang="it">amici</span>.


        **Mistake 3: Writing <span lang="it">un po</span> without the apostrophe.**

        Incorrect: <span lang="it">*un po</span>

        Correct: <span lang="it">un po''</span> — the apostrophe is always required
        because a syllable has been dropped.


        **Mistake 4: Using <span lang="it">molto</span> where English uses ''very
        much'' after a verb, then trying to translate ''very'' and ''much'' separately.**

        Incorrect: <span lang="it">*Mi piace molto molto.</span>

        Correct: <span lang="it">Mi piace molto.</span> — I like it very much. One
        <span lang="it">molto</span> is enough; doubling it is non-standard (though
        informal repetition like <span lang="it">tantissimo</span> exists as a separate
        intensified form).'
      language: en
      why_this_matters: 'Adverbs of quantity are among the most frequently used words
        in everyday Italian. You need them to say things like ''I eat a lot'', ''she
        speaks a little'', or ''this is very good'' — sentences that come up from
        the very first day of learning. Without them, you cannot express degree or
        amount, and you will also avoid a very common error: adding adjective endings
        to words that must stay invariable.'
- code: adv_judge
  cefr_level: A1
  category: avverbi
  source_url: https://www.unistrapg.it/profilo_lingua_italiana/site/gram_avverbi_a1.html
  unistr_code: di_giudizio_si_no_non_certo_quasi
  unistr_label: 'Di giudizio: sì, no, non, certo, quasi'
  chunk_ref: book_9_l_avverbio
  label: 'Avverbi di giudizio: sì, no, non, certo, quasi'
  explanations:
    en:
      title: 'Adverbs of judgement: yes, no, not, and more'
      tip: 'Italian has a small set of words — like ''sì'', ''no'', ''non'', ''certo'',
        and ''forse'' — that let you agree, disagree, or express doubt. The most important
        rule: ''non'' always comes directly before the verb, while ''no'' and ''sì''
        stand alone.'
      explanation: '## What adverbs of judgement are


        An <span lang="it">avverbio di giudizio</span> is an adverb that does not
        describe how, when, or where an action happens — instead, it expresses your
        verdict on what is being said. Italian grammar divides these into three groups:


        - **Affirmative** (you confirm or agree): <span lang="it">sì, certo, certamente,
        davvero, naturalmente, sicuramente, proprio, esattamente</span>

        - **Negative** (you deny or contradict): <span lang="it">no, non, mica, neanche,
        nemmeno, neppure</span>

        - **Dubitative** (you express doubt or possibility): <span lang="it">forse,
        quasi, magari, probabilmente, eventualmente</span>


        ## The core rule: ''sì'' and ''no'' stand alone; ''non'' goes before the verb


        This is the single most important distinction in this group.


        - <span lang="it">Sì</span> and <span lang="it">no</span> are used **as a
        complete answer on their own**, or as a short tag. They never attach directly
        to a verb.

        - <span lang="it">Non</span> is the word that actually **negates a verb**.
        It must be placed **immediately before the verb** in the sentence.


        Think of them as having two different jobs: <span lang="it">sì/no</span> are
        replies, while <span lang="it">non</span> is a grammatical operator that flips
        the meaning of a verb.


        ## Forming negative sentences with ''non''


        Place <span lang="it">non</span> directly before the conjugated verb. Nothing
        comes between <span lang="it">non</span> and the verb (except object pronouns
        — see note below).


        | Affirmative | Negative |

        |---|---|

        | Parlo italiano. | Non parlo italiano. |

        | Hai fame. | Non hai fame. |

        | È mia sorella. | Non è mia sorella. |


        **Note on pronouns:** Object pronouns (<span lang="it">mi, ti, lo, la, ci,
        vi, li, le</span>) attach between <span lang="it">non</span> and the verb
        — for example, <span lang="it">non lo so</span> (''I don''t know it''). This
        is simply how Italian works; do not let it confuse the basic rule.


        ## How the affirmative adverbs work


        Words like <span lang="it">certo, certamente, davvero, sicuramente</span>
        and <span lang="it">naturalmente</span> intensify or confirm a statement.
        They can stand alone as a reply, or appear inside a sentence — usually at
        the start or end, but sometimes mid-sentence. They do **not** change form
        (they are invariable).


        ## How the dubitative adverbs work


        Words like <span lang="it">forse</span> (''perhaps/maybe'') and <span lang="it">probabilmente</span>
        (''probably'') express uncertainty. They are invariable and typically placed
        at the beginning or end of a sentence, or before the verb. At A1 level, <span
        lang="it">forse</span> is by far the most useful to know.


        ## Examples


        **1. Answering yes or no:**

        <span lang="it">— Parli italiano? — Sì, parlo italiano.</span>

        (Do you speak Italian? — Yes, I speak Italian.)


        **2. Answering no — ''no'' as a standalone reply:**

        <span lang="it">— Hai un cane? — No, non ho un cane.</span>

        (Do you have a dog? — No, I don''t have a dog.)

        Notice: <span lang="it">no</span> is the reply; <span lang="it">non</span>
        negates the verb in the sentence that follows.


        **3. Confirming strongly with ''certo'':**

        <span lang="it">— Ti piace la pizza? — Certo, mi piace molto!</span>

        (Do you like pizza? — Of course, I like it a lot!)


        **4. Expressing doubt with ''forse'':**

        <span lang="it">Forse Maria è a casa.</span>

        (Maybe Maria is at home.)


        **5. Using ''davvero'' to show surprise or sincerity:**

        <span lang="it">Davvero non sai dov''è il bar?</span>

        (Really? You don''t know where the café is?)


        **6. Contrastive pair — ''no'' alone vs. ''non'' before the verb:**

        <span lang="it">No, non mangio carne.</span>

        (No, I don''t eat meat.)

        Here both words appear: <span lang="it">no</span> is the standalone negative
        reply; <span lang="it">non</span> negates the verb <span lang="it">mangio</span>.


        ## Common learner mistakes


        **Mistake 1: Using ''no'' before a verb instead of ''non''.**

        ❌ <span lang="it">Io no parlo inglese.</span>

        ✅ <span lang="it">Io non parlo inglese.</span> (I don''t speak English.)

        The word <span lang="it">no</span> can never be placed directly in front of
        a verb to negate it. Only <span lang="it">non</span> does this job.


        **Mistake 2: Leaving out ''non'' and using only ''no'' inside a sentence.**

        ❌ <span lang="it">Io no ho fame.</span>

        ✅ <span lang="it">Io non ho fame.</span> (I''m not hungry.)


        **Mistake 3: Putting another word between ''non'' and the verb (at A1 level).**

        ❌ <span lang="it">Io non oggi mangio.</span>

        ✅ <span lang="it">Io non mangio oggi.</span> (I''m not eating today.)

        Keep <span lang="it">non</span> and the verb together.


        **Mistake 4: Confusing ''forse'' (perhaps) with ''magari''.**

        Both can translate as ''maybe'', but <span lang="it">magari</span> often implies
        a wish or hope (''if only!''). At A1, stick with <span lang="it">forse</span>
        for simple ''maybe''.


        ## Quick-reference summary


        | Word | Type | Position | Meaning |

        |---|---|---|---|

        | sì | affirmative | standalone or sentence start | ''yes'' |

        | no | negative | standalone or sentence start | ''no'' |

        | non | negative | directly before the verb | ''not'' |

        | certo / certamente | affirmative | standalone or start/end of sentence |
        ''certainly / of course'' |

        | davvero | affirmative | start/end of sentence | ''really / truly'' |

        | forse | dubitative | start/end of sentence or before verb | ''perhaps /
        maybe'' |

        | quasi | dubitative | before verb or adjective | ''almost / nearly'' |}'
      language: en
      why_this_matters: From your very first conversation in Italian, you need to
        say yes, no, maybe, and certainly — and you need to say them correctly. Italian
        has a dedicated group of adverbs called <span lang="it">avverbi di giudizio</span>
        (adverbs of judgement) that do exactly this job. Getting them right — especially
        knowing when to use <span lang="it">no</span> versus <span lang="it">non</span>
        — will immediately prevent one of the most common mistakes Italian learners
        make.
- code: adv_interr
  cefr_level: A1
  category: avverbi
  source_url: https://www.unistrapg.it/profilo_lingua_italiana/site/gram_avverbi_a1.html
  unistr_code: interrogativi_come_dove_quando_quanto_perche
  unistr_label: 'Interrogativi: come, dove, quando, quanto, perché'
  chunk_ref: book_9_l_avverbio
  label: 'Avverbi interrogativi: come, dove, quando, quanto, perché'
  explanations:
    en:
      title: 'Question adverbs: come, dove, quando, quanto, perché'
      tip: Italian has five key question adverbs — come, dove, quando, quanto, and
        perché — that let you ask about manner, place, time, quantity, and reason.
        They always stay the same no matter what they describe, and they go at or
        near the start of a question. Mastering these five words unlocks most everyday
        questions in Italian.
      explanation: '## The five Italian question adverbs


        Italian has five core question adverbs. They are **invariable** — they never
        change their form, regardless of the noun, verb, or tense they appear with.




        | Avverbio | English meaning | What it asks about |

        |---|---|---|

        | come | how / what (name) | manner, description |

        | dove | where | place, location |

        | quando | when | time |

        | quanto | how much / how many | quantity, price, degree |

        | perché | why / because | reason, cause |


        ## How to form a question with these adverbs


        Place the question adverb at the **beginning** of the sentence (or very close
        to the start), then add the verb and the rest of the sentence. In spoken Italian,
        the subject pronoun often comes after the verb, or is dropped entirely.


        Basic pattern:


        <span lang="it">[avverbio interrogativo] + [verbo] + [soggetto / resto della
        frase]?</span>


        Example structure: <span lang="it">Dove abiti?</span> (Where do you live?)


        ## Each adverb explained


        ### come — how, what


        <span lang="it">Come</span> (how) asks about the **manner** in which something
        happens, or — very commonly at A1 — it asks for a **name or description**.
        It is also the standard word used in greetings.


        - <span lang="it">Come stai?</span> — How are you?

        - <span lang="it">Come si chiama tua madre?</span> — What is your mother''s
        name? (literally: How is your mother called?)

        - <span lang="it">Come vai a scuola?</span> — How do you get to school?


        **Note:** When <span lang="it">come</span> is followed by a verb beginning
        with a vowel, the final <span lang="it">-e</span> is sometimes dropped in
        informal writing and speech: <span lang="it">com''è?</span> (how is it? /
        what is it like?).


        ### dove — where


        <span lang="it">Dove</span> (where) asks about **location or destination**.
        Like <span lang="it">come</span>, it may drop its final vowel before a verb
        starting with a vowel: <span lang="it">dov''è?</span> (where is it?).


        - <span lang="it">Dove abiti?</span> — Where do you live?

        - <span lang="it">Dov''è il bagno?</span> — Where is the bathroom?


        ### quando — when


        <span lang="it">Quando</span> (when) asks about **time** — a moment, a day,
        a period. It does not elide (drop a vowel) before other vowels.


        - <span lang="it">Quando mangi?</span> — When do you eat?

        - <span lang="it">Quando arriva il treno?</span> — When does the train arrive?


        ### quanto — how much, how many


        <span lang="it">Quanto</span> (how much / how many) asks about **quantity,
        price, or degree**. As a question **adverb** modifying a verb or adjective,
        it is invariable and stays as <span lang="it">quanto</span>. (Be careful:
        when <span lang="it">quanto</span> is used as an **adjective** directly before
        a noun — meaning ''how many [things]?'' — it must agree in gender and number
        with the noun: <span lang="it">quanta acqua</span>, <span lang="it">quanti
        studenti</span>. At A1, the adverb use with a verb is most common.)


        - <span lang="it">Quanto costa?</span> — How much does it cost?

        - <span lang="it">Quanto è lontano?</span> — How far is it? (literally: How
        far away is it?)


        ### perché — why (and also: because)


        <span lang="it">Perché</span> (why) asks for a **reason or cause**. Importantly,
        the same word <span lang="it">perché</span> is also the word for **''because''**
        in answers — so you will see it in both questions and replies. Context makes
        the meaning clear.


        - <span lang="it">Perché sei stanco?</span> — Why are you tired?

        - <span lang="it">Perché non mangi?</span> — Why aren''t you eating?

        - Answer: <span lang="it">Perché non ho fame.</span> — Because I''m not hungry.


        ## Reinforcing with mai


        Any of these five adverbs can be strengthened by adding <span lang="it">mai</span>
        (ever / on earth) immediately after them. This makes the question feel more
        emphatic or impatient.


        - <span lang="it">Come mai sei qui?</span> — How come / Why on earth are you
        here?

        - <span lang="it">Dove mai hai messo le chiavi?</span> — Where on earth have
        you put the keys?

        - <span lang="it">Perché mai piange?</span> — Why on earth is he/she crying?


        ## Full examples covering all five adverbs


        1. <span lang="it">Come si chiama?</span> — What is his/her name? (literally:
        How is he/she called?)


        2. <span lang="it">Dov''è la stazione?</span> — Where is the station?


        3. <span lang="it">Quando apre il negozio?</span> — When does the shop open?


        4. <span lang="it">Quanto costa questo panino?</span> — How much does this
        sandwich cost?


        5. <span lang="it">Perché non vieni a cena?</span> — Why aren''t you coming
        to dinner?


        6. Contrastive pair — question vs. answer with <span lang="it">perché</span>:

        <span lang="it">Perché non studi?</span> — Why don''t you study? / <span lang="it">Perché
        sono stanco.</span> — Because I''m tired.


        ## Common learner mistakes


        **Mistake 1 — Confusing <span lang="it">perché</span> as only ''why''.**

        Learners sometimes try to use <span lang="it">perché</span> only for questions
        and search for a different word for ''because''. Remember: in Italian, <span
        lang="it">perché</span> does both jobs. <span lang="it">Perché sei qui? —
        Perché ho fame.</span> (Why are you here? — Because I''m hungry.)


        **Mistake 2 — Making <span lang="it">quanto</span> invariable in all uses.**

        As a question adverb before a verb (<span lang="it">Quanto costa?</span>),
        <span lang="it">quanto</span> does not change. But before a noun it works
        as an adjective and must agree: <span lang="it">Quanta acqua?</span> (How
        much water?), <span lang="it">Quanti anni hai?</span> (How old are you? —
        literally: How many years do you have?). Do not write <span lang="it">*quanto
        anni</span>.


        **Mistake 3 — Forgetting elision with <span lang="it">come</span> and <span
        lang="it">dove</span>.**

        Before <span lang="it">è</span> (is), both <span lang="it">come</span> and
        <span lang="it">dove</span> normally contract: <span lang="it">com''è</span>,
        <span lang="it">dov''è</span>. Writing <span lang="it">come è</span> or <span
        lang="it">dove è</span> is not incorrect, but <span lang="it">com''è</span>
        and <span lang="it">dov''è</span> are far more natural and what you will see
        in texts.


        **Mistake 4 — Putting the question adverb in the middle of the sentence.**

        In Italian, question adverbs go at or near the **beginning**: <span lang="it">Dove
        lavori?</span> — not <span lang="it">*Lavori dove?</span> (while technically
        interpretable in speech, it is non-standard in written Italian).


        **Mistake 5 — Using <span lang="it">come</span> to ask for a name in English
        word order.**

        English says ''What is your name?'' using ''what''. Italian uses <span lang="it">come</span>:
        <span lang="it">Come ti chiami?</span> Do not translate literally and write
        <span lang="it">*Cosa è il tuo nome?</span> — this sounds very unnatural.'
      language: en
      why_this_matters: Without question adverbs, you cannot ask most of the basic
        questions you need every day — 'Where is the bathroom?', 'When does the lesson
        start?', 'How much does it cost?', 'Why are you tired?'. These five words
        appear in almost every conversation, every sign, and every exercise at A1
        level. Mastering them immediately makes you able to ask — and understand —
        a huge range of real questions.
