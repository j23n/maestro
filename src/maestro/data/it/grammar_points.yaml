  explanations:
    en:
      title: Using 'di' to express where you are from
      tip: Use 'di' before a city or place name to say where someone is from or where
        something comes from. It works like 'from' in English when talking about origin.
        This is one of the first prepositions you will need in Italian.
      explanation: '## The rule


        The preposition <span lang="it">di</span> expresses **origin or provenance**
        — the idea that someone comes from a place, or that something comes from a
        source. In English this corresponds to ''from''.


        The structure is simple:


        **Subject + <span lang="it">essere</span> + <span lang="it">di</span> + place
        name**


        For example: <span lang="it">Sono di Roma.</span> — ''I am from Rome.''


        The verb used is always <span lang="it">essere</span> (''to be''). The place
        name follows <span lang="it">di</span> directly, with no article, when it
        is a city or town.




        ## Formation at a glance


        | Person | Verb form | Example |

        |---|---|---|

        | io (I) | sono | Sono di Napoli. |

        | tu (you, singular) | sei | Sei di Milano? |

        | lui / lei (he / she) | è | È di Torino. |

        | noi (we) | siamo | Siamo di Venezia. |

        | voi (you, plural) | siete | Siete di Bologna? |

        | loro (they) | sono | Sono di Firenze. |




        ## The key question form


        The standard question is <span lang="it">Di dove sei?</span> (informal, ''Where
        are you from?'') or <span lang="it">Di dov''è?</span> (formal). Notice that
        <span lang="it">dove</span> (''where'') contracts to <span lang="it">dov''</span>
        before <span lang="it">è</span> to avoid two vowels side by side. The preposition
        <span lang="it">di</span> stays at the front of the question — it does not
        move to the end as ''from'' sometimes does in English.




        ## Examples


        <span lang="it">— Di dove sei?

        — Sono di Roma.</span>

        (''Where are you from?'' — ''I am from Rome.'')


        <span lang="it">Marco è di Milano.</span>

        (''Marco is from Milan.'')


        <span lang="it">Mia madre è di Napoli e mio padre è di Palermo.</span>

        (''My mother is from Naples and my father is from Palermo.'')


        <span lang="it">Questo vino è di Toscana.</span>

        (''This wine is from Tuscany.'') — <span lang="it">di</span> can also express
        the origin of things, not just people.


        <span lang="it">Siete di qui?</span>

        (''Are you from here?'') — <span lang="it">di</span> is used with <span lang="it">qui</span>
        (''here'') and <span lang="it">lì</span> (''there'') in exactly the same way.


        <span lang="it">Non sono di Londra, sono di Manchester.</span>

        (''I am not from London, I am from Manchester.'') — negation is formed by
        placing <span lang="it">non</span> before the verb.




        ## Cities vs. countries: an important edge case


        With **city names**, use <span lang="it">di</span> directly and with no article:
        <span lang="it">Sono di Parigi.</span> (''I am from Paris.'')


        With **country names**, Italian normally uses <span lang="it">venire da</span>
        (''to come from'') rather than <span lang="it">essere di</span>: <span lang="it">Vengo
        dall''Italia.</span> / <span lang="it">Vengo dalla Francia.</span> This is
        because country names take a definite article in Italian, which combines with
        <span lang="it">da</span> (not <span lang="it">di</span>) to express national
        origin. You do not need to master this now, but it is good to know that <span
        lang="it">Sono di Italia</span> sounds unnatural to a native speaker.




        ## Common learner mistakes


        **Mistake 1 — Omitting <span lang="it">di</span>:**

        <span lang="it">*Sono Roma.</span> ✗ — This means nothing in Italian.

        <span lang="it">Sono di Roma.</span> ✓


        **Mistake 2 — Adding an article after <span lang="it">di</span> with city
        names:**

        <span lang="it">*Sono di la Roma.</span> ✗ — City names do not take an article
        here.

        <span lang="it">Sono di Roma.</span> ✓


        **Mistake 3 — Translating ''from'' with <span lang="it">da</span> instead
        of <span lang="it">di</span> for city origin:**

        English speakers sometimes reach for <span lang="it">da</span> because it
        can also translate as ''from''. With cities and the verb <span lang="it">essere</span>,
        the correct choice for origin is <span lang="it">di</span>.

        <span lang="it">*Sono da Roma.</span> — possible in some contexts (e.g. ''I
        have come from Rome'' as a journey), but <span lang="it">Sono di Roma</span>
        is the natural way to state where you are originally from.


        **Mistake 4 — Putting <span lang="it">di</span> at the end of the question:**

        <span lang="it">*Dove sei di?</span> ✗ — This does not exist in Italian.

        <span lang="it">Di dove sei?</span> ✓ — The preposition always stays at the
        beginning.'
      language: en
      why_this_matters: The very first question an Italian speaker will ask you is
        <span lang="it">Di dove sei?</span> — 'Where are you from?' Without <span
        lang="it">di</span>, you cannot answer it. This small word unlocks introductions,
        descriptions of people and products, and dozens of everyday conversations.
        Getting it right from day one removes one of the most common errors beginners
        make.
