  unistr_code: percezione_della_pertinenza_dellordine_non_marcato_svo_dei_costituenti_di_un
  unistr_label: Percezione della pertinenza dell’ordine non marcato (SVO) dei costituenti
    di un enunciato semplice
  chunk_ref: book_2_la_frase
  label: Ordine non marcato SVO dei costituenti in enunciato semplice
  explanations:
    en:
      title: Basic word order in Italian sentences
      tip: Italian sentences usually follow Subject–Verb–Object order, just like English.
        Getting this right from the start means you can build clear, correct sentences
        immediately, even with a very small vocabulary.
      explanation: '## The basic rule: Subject – Verb – Object (SVO)


        In a simple Italian sentence (<span lang="it">una frase semplice</span>, a
        sentence with exactly one verb and one complete thought), the default, neutral
        word order is:


        **Subject → Verb → Object**


        This is called the <span lang="it">ordine non marcato</span> — the ''unmarked
        order'', meaning the plain, neutral arrangement with no special emphasis.
        It is the order you should use unless you have a specific reason to do otherwise.


        - The **subject** (<span lang="it">il soggetto</span>) is who or what performs
        the action.

        - The **verb** (<span lang="it">il verbo</span>) expresses the action or state.

        - The **object** (<span lang="it">l''oggetto</span>) is who or what receives
        the action.


        ## Forming the sentence


        Simply place the three elements in order. There is no inversion or rearrangement
        needed for a basic statement:


        | Subject | Verb | Object |

        |---|---|---|

        | Marco | mangia | la pizza. |

        | La mamma | beve | il caffè. |

        | I bambini | guardano | la televisione. |


        ## Examples with translations


        <span lang="it">Marco mangia la pizza.</span>

        (Marco eats pizza.) — the classic S–V–O pattern.


        <span lang="it">La mamma beve il caffè.</span>

        (Mum drinks coffee.) — subject is a noun phrase with an article; order is
        unchanged.


        <span lang="it">Il gatto dorme.</span>

        (The cat sleeps.) — no object needed; a verb can stand alone after the subject
        when there is nothing to receive the action.


        <span lang="it">Anna studia l''italiano.</span>

        (Anna studies Italian.) — object includes its article; the article travels
        with the noun but does not change its position.


        <span lang="it">I bambini mangiano il pane.</span>

        (The children eat bread.) — plural subject and plural verb, same S–V–O order.


        <span lang="it">Mio padre legge un libro.</span>

        (My father reads a book.) — subject is a possessive noun phrase; order is
        still S–V–O.


        ## Important variants and notes


        **The subject pronoun is often dropped**


        Italian is a <span lang="it">lingua pro-drop</span> — a language that drops
        the subject pronoun when it is clear from the verb ending. This does not change
        the underlying S–V–O order; it simply removes the spoken subject:


        <span lang="it">Mangio la pasta.</span> (I eat pasta.) — <span lang="it">io</span>
        (I) is implied by the ending <span lang="it">-o</span>, so it is left out.
        The verb still comes before the object.


        **Sentences with no object**


        Many Italian verbs — especially verbs of motion or state — need no object
        at all. The sentence is simply Subject + Verb:


        <span lang="it">Il bambino dorme.</span> (The child is sleeping.)

        <span lang="it">La nonna arriva.</span> (Grandma is arriving.)


        **Adjectives after the noun (a side note)**


        Inside the noun phrases that make up your subject or object, adjectives most
        commonly follow the noun in Italian — <span lang="it">una pizza buona</span>
        (a good pizza) rather than before it as in English. This is a separate rule,
        but it is worth knowing it does not affect S–V–O order.


        **Marked order exists — but not at A1**


        Italian speakers sometimes move the object to the front of the sentence for
        emphasis or contrast: <span lang="it">La pizza, Marco la mangia volentieri.</span>
        (Pizza — Marco happily eats it.) This is called <span lang="it">ordine marcato</span>
        (marked order) and involves extra grammar (a repeated pronoun). You do not
        need to produce it at A1, but recognising that it exists explains why you
        will occasionally hear sentences that seem to start with the ''wrong'' word.


        ## Common learner mistakes


        **Mistake 1 — Placing the verb at the end (influence from German or Japanese)**


        Some learners put the verb last: <span lang="it">*Marco la pizza mangia.</span>
        This is not standard Italian. Correction: <span lang="it">Marco mangia la
        pizza.</span>


        **Mistake 2 — Inverting subject and verb to form questions**


        In English, questions invert subject and verb: ''Does Marco eat pizza?'' Learners
        sometimes copy this: <span lang="it">*Mangia Marco la pizza?</span> In everyday
        Italian, you can form a yes/no question simply by keeping S–V–O order and
        using a rising intonation, or by adding <span lang="it">?</span> in writing:
        <span lang="it">Marco mangia la pizza?</span> (Is Marco eating pizza?) The
        inversion form does exist in formal or written Italian, but it is not the
        default at A1.


        **Mistake 3 — Omitting the article on the object**


        Learners sometimes drop the article thinking it affects the word order: <span
        lang="it">*Marco mangia pizza.</span> The article is a separate rule, but
        it belongs attached to its noun in the object slot: <span lang="it">Marco
        mangia la pizza.</span> Order and articles are independent — fix each separately.


        **Mistake 4 — Confusing subject and object because Italian nouns do not change
        form**


        Unlike Latin or German, Italian nouns do not have case endings to mark subject
        versus object. Word order does this job. So <span lang="it">Il cane morde
        l''uomo</span> (The dog bites the man) means something completely different
        from <span lang="it">L''uomo morde il cane</span> (The man bites the dog).
        Position in the sentence is the signal: first noun phrase = subject, noun
        phrase after the verb = object. Never swap them without meaning to change
        the meaning.'
      language: en
      why_this_matters: Word order is the skeleton of every sentence you produce.
        Italian's default order — Subject, then Verb, then Object — matches English
        closely enough that you can transfer this instinct directly, making it one
        of the first things you get right without extra effort. Understanding it explicitly
        also prepares you to notice when Italian speakers deliberately change the
        order for emphasis, which you will encounter very soon after A1.
