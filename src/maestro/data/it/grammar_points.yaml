- code: ind_pres
  cefr_level: A1
  category: verbi
  unistr_code: la_coniugazione_attiva_con_particolare_riferimento_a_tutte_e_tre_le_persone
  unistr_label: indicativo presente
  source_url: https://www.unistrapg.it/profilo_lingua_italiana/site/gram_verbi_a1.html
  chunk_ref: book_8_il_verbo_uso_dell_indicativo_presente
  label: Indicativo presente
  explanations:
    en:
      title: The present tense (indicativo presente)
      tip: The Italian present tense covers what is happening right now, what happens
        regularly, and — very commonly in spoken Italian — what will happen in the
        future. One tense does the work of several English ones, so mastering its
        forms early unlocks a huge range of everyday conversation.
      explanation: '## What the present tense expresses


        Unlike English, which splits these ideas across several forms (''I write'',
        ''I am writing'', ''I do write''), Italian uses one form — the <span lang="it">presente</span>
        — to cover four distinct situations:


        1. **Something happening right now:** <span lang="it">Carlo scrive</span>
        means both ''Carlo writes'' and ''Carlo is writing'' — the Italian present
        covers both.

        2. **A habitual or repeated action:** things that happen regularly, always,
        or as a general truth.

        3. **A future action** (especially in spoken Italian): using the present with
        a future time word is natural and extremely common.

        4. **The historic present** (<span lang="it">presente storico</span>): retelling
        past events as if they are happening now, to make the story feel vivid and
        immediate.


        ## How to form the present tense


        Italian verbs belong to three conjugation classes, identified by the infinitive
        ending: <span lang="it">-are</span>, <span lang="it">-ere</span>, or <span
        lang="it">-ire</span>. To form the present, drop the infinitive ending and
        add the endings for that class.


        ### Regular -are verbs (e.g. parlare, ''to speak'')


        | Person | Ending | Full form |

        |---|---|---|

        | io (I) | -o | parlo |

        | tu (you, singular) | -i | parli |

        | lui/lei (he/she) | -a | parla |

        | noi (we) | -iamo | parliamo |

        | voi (you, plural) | -ate | parlate |

        | loro (they) | -ano | parlano |


        ### Regular -ere verbs (e.g. scrivere, ''to write'')


        | Person | Ending | Full form |

        |---|---|---|

        | io | -o | scrivo |

        | tu | -i | scrivi |

        | lui/lei | -e | scrive |

        | noi | -iamo | scriviamo |

        | voi | -ete | scrivete |

        | loro | -ono | scrivono |


        ### Regular -ire verbs: two patterns


        <span lang="it">-ire</span> verbs split into two groups. Most everyday <span
        lang="it">-ire</span> verbs you meet at A1 follow the <span lang="it">-isc-</span>
        pattern (also called the ''inchoative'' pattern), which inserts <span lang="it">-isc-</span>
        between the stem and the ending in four of the six forms. A smaller group
        conjugates without the insert.


        **With <span lang="it">-isc-</span> insert** (e.g. <span lang="it">finire</span>,
        ''to finish''):


        | Person | Full form |

        |---|---|

        | io | finisco |

        | tu | finisci |

        | lui/lei | finisce |

        | noi | finiamo |

        | voi | finite |

        | loro | finiscono |


        **Without <span lang="it">-isc-</span> insert** (e.g. <span lang="it">dormire</span>,
        ''to sleep''):


        | Person | Full form |

        |---|---|

        | io | dormo |

        | tu | dormi |

        | lui/lei | dorme |

        | noi | dormiamo |

        | voi | dormite |

        | loro | dormono |


        ## Common irregular verbs


        Several high-frequency verbs are irregular in the present. You will need these
        from day one — learn them as fixed forms rather than trying to apply regular
        rules.


        | Infinitive | io | tu | lui/lei | noi | voi | loro |

        |---|---|---|---|---|---|---|

        | essere (''to be'') | sono | sei | è | siamo | siete | sono |

        | avere (''to have'') | ho | hai | ha | abbiamo | avete | hanno |

        | andare (''to go'') | vado | vai | va | andiamo | andate | vanno |

        | fare (''to do/make'') | faccio | fai | fa | facciamo | fate | fanno |

        | venire (''to come'') | vengo | vieni | viene | veniamo | venite | vengono
        |

        | volere (''to want'') | voglio | vuoi | vuole | vogliamo | volete | vogliono
        |

        | potere (''to be able to'') | posso | puoi | può | possiamo | potete | possono
        |


        ## Examples covering all four uses


        **1. Action happening right now**


        <span lang="it">Carlo scrive una lettera.</span> — ''Carlo is writing a letter.''
        (or ''Carlo writes a letter.'')


        <span lang="it">Mangio la pizza.</span> — ''I am eating pizza.'' / ''I eat
        pizza.''


        Notice that where English needs ''is writing'' or ''am eating'' to signal
        an ongoing action, Italian simply uses the present tense.


        **2. Habitual action or general truth**


        <span lang="it">In montagna d''inverno nevica.</span> — ''In the mountains
        it snows in winter.''


        <span lang="it">La mia famiglia mangia insieme ogni sera.</span> — ''My family
        eats together every evening.''


        **3. Future action (with a time marker)**


        <span lang="it">L''estate prossima vado in vacanza in Sardegna.</span> — ''Next
        summer I am going on holiday to Sardinia.''


        The time word <span lang="it">l''estate prossima</span> (''next summer'')
        makes it clear this is future. This use is extremely common in spoken Italian
        — using the present here sounds completely natural, not sloppy.


        **4. The historic present**


        <span lang="it">Dante nasce a Firenze nel 1265 e muore a Ravenna nel 1321.</span>
        — ''Dante was born in Florence in 1265 and died in Ravenna in 1321.''


        The present tense here (''is born'', ''dies'') pulls the past into the foreground
        and is standard in historical writing and storytelling.


        ## Common learner mistakes


        **Mistake 1: Using the wrong ending for the wrong class.**

        Learners sometimes apply <span lang="it">-are</span> endings to <span lang="it">-ere</span>
        or <span lang="it">-ire</span> verbs. For example, writing <span lang="it">*lui
        scriva</span> instead of <span lang="it">lui scrive</span>. Always identify
        the infinitive class before adding endings.


        **Mistake 2: Translating ''I am eating'' with a separate construction.**

        English has a continuous form (''I am eating'') that Italian does not. Do
        not try to invent one — <span lang="it">mangio</span> already covers both
        ''I eat'' and ''I am eating''. The construction <span lang="it">sto mangiando</span>
        (gerund with <span lang="it">stare</span>) does exist for emphasis, but the
        plain present is always correct and always natural.


        **Mistake 3: Reaching for the future tense when talking about plans.**

        When you have a clear future time word (<span lang="it">domani</span> ''tomorrow'',
        <span lang="it">la settimana prossima</span> ''next week''), Italian speakers
        almost always use the present, not the future tense. Saying <span lang="it">domani
        vado al mercato</span> (''tomorrow I am going to the market'') is more natural
        than <span lang="it">domani andrò al mercato</span>, especially in conversation.


        **Mistake 4: Forgetting the <span lang="it">-isc-</span> insert in <span lang="it">-ire</span>
        verbs.**

        Writing <span lang="it">*finisco</span> is actually correct, but writing <span
        lang="it">*fino</span> (missing the insert entirely) is a frequent error.
        If you are unsure whether a verb takes <span lang="it">-isc-</span>, check
        a dictionary or word list — there is no simple spelling rule to predict it.


        **Mistake 5: Omitting the subject pronoun thinking it is required.**

        In Italian, subject pronouns (<span lang="it">io, tu, lui</span>, etc.) are
        optional because the verb ending already shows who the subject is. <span lang="it">Parlo
        italiano</span> and <span lang="it">io parlo italiano</span> are both correct.
        Pronouns are kept mainly for contrast or emphasis: <span lang="it">Io parlo
        italiano, tu parli spagnolo.</span> (''I speak Italian, you speak Spanish.'')'
      language: en
      why_this_matters: 'The <span lang="it">indicativo presente</span> (indicative
        present tense) is the single most useful verb form in Italian. Nearly every
        sentence a beginner needs — describing yourself, talking about daily routines,
        making plans — uses this tense. Without it you cannot say who you are, what
        you do, or where you are going. Mastering it also removes one of the most
        common early mistakes: reaching for a future tense when Italians simply use
        the present.'
- code: cond_simp
  cefr_level: A1
  category: verbi
  unistr_code: la_coniugazione_attiva_con_particolare_riferimento_a_tutte_e_tre_le_persone
  unistr_label: condizionale semplice solo del verbo volere alla I persona singolare
    ( vorrei )
  source_url: https://www.unistrapg.it/profilo_lingua_italiana/site/gram_verbi_a1.html
  chunk_ref: book_8_il_verbo_uso_degli_altri_modi_condizionale
  label: Condizionale semplice del verbo volere alla prima persona singolare
  explanations:
    en:
      title: Saying what you would like with 'vorrei'
      tip: Use 'vorrei' — the conditional form of 'volere' — to say what you would
        like politely. It is softer and more natural than 'voglio' (I want) in most
        everyday situations, especially when asking for something.
      explanation: '## The rule: what ''vorrei'' is and how it works


        <span lang="it">Vorrei</span> is the first-person singular conditional form
        of the verb <span lang="it">volere</span> (to want). The conditional mood
        — <span lang="it">il condizionale</span> — expresses something you would do
        or would like under certain conditions. Think of it as the ''would'' form
        in English.


        In Italian, the conditional has two tenses: a simple form (<span lang="it">condizionale
        semplice</span>, referring to the present or future) and a compound form (<span
        lang="it">condizionale passato</span>, referring to the past). At A1 level,
        you focus on the simple form, and specifically on the most important word
        in it: <span lang="it">vorrei</span>.


        The underlying logic is: <span lang="it">vorrei un caffè</span> means ''I
        would like a coffee'' — that is, ''I would like one, if you have it, if I
        may.'' The condition is often left unspoken, but it makes the sentence polite
        rather than demanding.


        ## Formation: the full conditional of ''volere''


        Even though you only need the first-person singular for now, it helps to see
        the complete pattern so you recognise all the forms when you hear them.


        <span lang="it">Volere</span> is an irregular verb in the conditional. Its
        conditional stem is <span lang="it">vorr-</span>, and the endings are the
        same for all conditional verbs:


        | Person | Forma | English |

        |---|---|---|

        | io | vorrei | I would like / I would want |

        | tu | vorresti | you would like |

        | lui / lei | vorrebbe | he / she would like |

        | noi | vorremmo | we would like |

        | voi | vorreste | you (plural) would like |

        | loro | vorrebbero | they would like |


        The stem <span lang="it">vorr-</span> is irregular — do not try to build it
        from the infinitive <span lang="it">volere</span> by a regular rule. Just
        learn <span lang="it">vorrei</span> as a single, ready-made word first.


        ## How to use ''vorrei''


        <span lang="it">Vorrei</span> is followed directly by a noun or by an infinitive
        verb:


        - With a noun: <span lang="it">Vorrei + [noun]</span> → ''I would like [thing]''

        - With an infinitive: <span lang="it">Vorrei + [infinitive]</span> → ''I would
        like to [do something]''


        ## Examples


        <span lang="it">Vorrei un caffè, per favore.</span>

        (I would like a coffee, please.) — ordering in a bar, the classic use.


        <span lang="it">Vorrei una pizza margherita.</span>

        (I would like a margherita pizza.) — ordering in a restaurant.


        <span lang="it">Vorrei parlare con il professore.</span>

        (I would like to speak with the teacher.) — polite request using an infinitive.


        <span lang="it">Vorrei un chilo di pane, grazie.</span>

        (I would like a kilo of bread, thank you.) — shopping at a bakery.


        Contrastive pair — notice the difference in tone:


        <span lang="it">Voglio un caffè.</span> (I want a coffee.) — direct, can sound
        blunt or even rude in a service context.


        <span lang="it">Vorrei un caffè.</span> (I would like a coffee.) — polite
        and natural; the form Italians actually use when ordering.


        ## Common learner mistakes


        **Mistake 1: Using <span lang="it">voglio</span> when ordering or asking for
        something.**


        Saying <span lang="it">voglio una birra</span> (I want a beer) is grammatically
        correct, but it is often too direct for a polite request. In Italian service
        situations, <span lang="it">vorrei</span> is the expected and natural choice.
        Use <span lang="it">voglio</span> when expressing a strong wish or general
        preference, not when addressing a waiter or shopkeeper.


        **Mistake 2: Trying to conjugate <span lang="it">vorrei</span> further or
        add a subject pronoun as if it changes the meaning.**


        <span lang="it">Vorrei</span> already means ''I would like.'' You do not need
        to say <span lang="it">*io vorrei io</span> — the ending <span lang="it">-ei</span>
        already identifies the subject as first-person singular. The optional pronoun
        <span lang="it">io</span> can be added for emphasis, but it is not required:
        <span lang="it">Io vorrei un tè</span> is fine for emphasis, but <span lang="it">Vorrei
        un tè</span> is the normal, natural form.


        **Mistake 3: Spelling or pronouncing the stem incorrectly.**


        Some learners write <span lang="it">*volerei</span> or <span lang="it">*voglerei</span>,
        trying to keep the infinitive stem. The correct stem is <span lang="it">vorr-</span>,
        giving <span lang="it">vorrei</span>. The double <span lang="it">r</span>
        is both spelled and pronounced — do not drop it.


        **Mistake 4: Forgetting <span lang="it">di</span> or using it incorrectly
        before an infinitive.**


        Unlike some Italian verbs, <span lang="it">volere</span> connects directly
        to an infinitive with no preposition: <span lang="it">Vorrei mangiare qualcosa</span>
        (I would like to eat something) — NOT <span lang="it">*vorrei di mangiare</span>.
        Never insert <span lang="it">di</span> between <span lang="it">vorrei</span>
        and the infinitive.'
      language: en
      why_this_matters: The single word <span lang="it">vorrei</span> (I would like)
        is one of the most useful words you will learn in Italian. You need it every
        time you order food, ask for something in a shop, or make a polite request.
        Without it, you risk sounding abrupt — knowing it immediately makes your Italian
        sound natural and courteous.
