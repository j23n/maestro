  explanations:
    en:
      title: Subject personal pronouns in Italian
      tip: In Italian, you usually leave out the subject pronoun ('I', 'you', 'he',
        etc.) because the verb ending already shows who is acting. Use the pronoun
        only when you need to make a contrast, add emphasis, or avoid confusion.
      explanation: '## The subject pronouns — full list


        These are the Italian subject pronouns — the words that tell you *who* performs
        the action of the verb.


        | Person | Italian form(s) | English equivalent |

        |---|---|---|

        | 1st singular | io | I |

        | 2nd singular | tu | you (informal, one person) |

        | 3rd singular masc. | lui / egli / esso | he / it |

        | 3rd singular fem. | lei / ella / essa | she / it |

        | 1st plural | noi | we |

        | 2nd plural | voi | you (plural) |

        | 3rd plural masc./mixed | loro / essi | they |

        | 3rd plural fem. | loro / esse | they (all female) |


        At A1, the forms you will use and hear every day are: <span lang="it">io</span>,
        <span lang="it">tu</span>, <span lang="it">lui</span>, <span lang="it">lei</span>,
        <span lang="it">noi</span>, <span lang="it">voi</span>, <span lang="it">loro</span>.
        The others (<span lang="it">egli</span>, <span lang="it">ella</span>, <span
        lang="it">esso</span>, <span lang="it">essa</span>, <span lang="it">essi</span>,
        <span lang="it">esse</span>) appear mainly in literary or formal written Italian
        and are explained below under ''Variants and formal forms''.


        ## The core rule: usually omit the pronoun


        Unlike English, where ''I speak'', ''you speak'', ''she speaks'' all need
        a pronoun to show who is acting, Italian verb endings already carry that information.
        The pronoun is therefore *optional in most sentences* and is routinely left
        out in speech and informal writing.


        Compare:


        English (pronoun obligatory): <span lang="it">I work → I work</span> (you
        cannot say just ''work'')


        Italian (pronoun optional): <span lang="it">(Io) lavoro.</span> — ''I work.''
        The ending <span lang="it">-o</span> already signals first-person singular,
        so <span lang="it">io</span> adds no new information.


        ## When the pronoun IS required


        There are three clear situations in which you must include the subject pronoun:


        ### 1. Contrast between two different subjects


        When two clauses in a row have *different* subjects, use pronouns to signal
        the switch clearly.


        > <span lang="it">Lui va in montagna, io vado al mare.</span>

        > (He is going to the mountains; I am going to the seaside.)


        ### 2. Emphasis or focus on the subject


        When you want to stress *who* is performing the action — ''it was specifically
        *you*, not someone else'' — the pronoun must be present. This use is also
        required after words such as <span lang="it">anche</span> (''also/too''),
        <span lang="it">neanche</span> (''not even/neither''), and <span lang="it">pure</span>
        (''too/also'').


        > <span lang="it">Sei stato tu a dire questo.</span>

        > (It was *you* who said that — emphasising ''you and no one else''.)


        > <span lang="it">È venuta anche lei.</span>

        > (She came too.)


        ### 3. Avoiding ambiguity


        When leaving out the pronoun would make the sentence unclear about who is
        involved, include it.


        > <span lang="it">È bene che vada.</span>

        > (It is good that [someone] goes.) — Without context, this could mean I,
        you, he or she should go. If the subject needs to be clear, say: <span lang="it">È
        bene che vada lui.</span> (It is good that *he* goes.)


        ## Third-person singular and plural: which form to choose


        The third person has several competing forms. Here is the practical guidance
        for A1 students:


        **Singular — <span lang="it">lui</span> and <span lang="it">lei</span>**


        Use <span lang="it">lui</span> for ''he'' and <span lang="it">lei</span> for
        ''she''. These are the standard forms in modern spoken and written Italian.
        Whenever a subject pronoun of the third person singular is *required* (contrast,
        emphasis, or clarity), <span lang="it">lui</span> and <span lang="it">lei</span>
        are the correct choices.


        > <span lang="it">Io resto, lui parte.</span>

        > (I am staying; he is leaving.)


        **Plural — <span lang="it">loro</span>**


        Use <span lang="it">loro</span> for ''they'' when referring to people. Note
        that <span lang="it">loro</span> is the only plural third-person form permitted
        when a pronoun is required.


        > <span lang="it">Noi siamo italiani, loro sono francesi.</span>

        > (We are Italian; they are French.)


        ## Variants and formal forms


        The forms <span lang="it">egli</span> (''he'', formal/literary), <span lang="it">ella</span>
        (''she'', formal/literary), <span lang="it">esso</span> / <span lang="it">essa</span>
        (''it'' — for animals or things, and in formal style also for people in the
        feminine), and <span lang="it">essi</span> / <span lang="it">esse</span> (''they'',
        formal/literary, for groups of things or all-female groups) belong mainly
        to written, formal, or literary Italian. Historically, <span lang="it">egli</span>
        was prescribed for referring to a male person and <span lang="it">esso</span>
        for animals and things, but today even in formal writing <span lang="it">egli</span>
        is increasingly rare and <span lang="it">lui</span> has taken its place. As
        an A1 student, you do not need to *use* these forms, but you should recognise
        them when you see them in a text.


        **Reinforced forms**


        Any subject pronoun can be reinforced by adding <span lang="it">stesso</span>
        (''myself/yourself/himself'' etc.) immediately after it: <span lang="it">io
        stesso</span>, <span lang="it">tu stesso</span>, <span lang="it">lui stesso</span>,
        <span lang="it">lei stessa</span>, and so on. There are also the old reinforced
        forms <span lang="it">noialtri</span> and <span lang="it">voialtri</span>
        (written as one word), used in some regional varieties to add emphasis, though
        these are rarely needed at A1.


        ## Examples covering the main uses


        1. Normal sentence — pronoun omitted (most common situation):

        > <span lang="it">Mangio la pasta.</span>

        > (I eat pasta.) — No pronoun needed; the <span lang="it">-o</span> ending
        identifies the speaker.


        2. Contrast between subjects — pronoun required:

        > <span lang="it">Lei beve il caffè, io bevo il tè.</span>

        > (She drinks coffee; I drink tea.)


        3. Emphasis — pronoun required:

        > <span lang="it">Sei tu il professore?</span>

        > (Are *you* the teacher? — ''you specifically, not someone else'')


        4. After <span lang="it">anche</span> — pronoun required:

        > <span lang="it">Anche lui parla italiano.</span>

        > (He speaks Italian too.)


        5. Avoiding ambiguity — pronoun added for clarity:

        > <span lang="it">È importante che lei risponda.</span>

        > (It is important that *she* answers. — Without <span lang="it">lei</span>,
        we would not know who must answer.)


        6. Contrastive pair showing the difference between using and omitting the
        pronoun:

        > <span lang="it">Lavoro ogni giorno.</span> (I work every day. — neutral,
        no pronoun.)

        > <span lang="it">Io lavoro ogni giorno, tu no.</span> (I work every day;
        you don''t. — pronoun added for contrast.)


        ## Common learner mistakes


        **Mistake 1 — Always inserting the pronoun, as in English:**


        Because English requires ''I'', ''you'', ''he'' etc. in every sentence, English
        speakers often add them in Italian even when they are not needed. This is
        not wrong, but it sounds unnatural and over-emphatic, as if you are stressing
        the subject every single time.


        Avoid: <span lang="it">Io mi chiamo Marco. Io ho diciotto anni. Io abito a
        Roma.</span> (sounds forced)

        Better: <span lang="it">Mi chiamo Marco. Ho diciotto anni. Abito a Roma.</span>


        **Mistake 2 — Using <span lang="it">egli</span> or <span lang="it">ella</span>
        in conversation:**


        These forms sound archaic or literary in spoken Italian. Use <span lang="it">lui</span>
        and <span lang="it">lei</span> instead.


        Avoid in speech: <span lang="it">Egli è mio fratello.</span>

        Natural: <span lang="it">Lui è mio fratello.</span> (He is my brother.)


        **Mistake 3 — Confusing <span lang="it">lei</span> (''she'') with <span lang="it">Lei</span>
        (formal ''you''):**


        In written Italian, <span lang="it">Lei</span> with a capital letter is the
        formal polite form of ''you'' (used with strangers, teachers, etc.), while
        <span lang="it">lei</span> with a lower-case letter means ''she''. In speech
        the two sound identical, so context tells you which is meant. At A1, simply
        note that when someone writes <span lang="it">Lei</span> with a capital in
        the middle of a sentence, it signals formality, not ''she''.


        **Mistake 4 — Using <span lang="it">essi</span> / <span lang="it">esse</span>
        where <span lang="it">loro</span> is needed:**


        When referring to people and a pronoun is required (contrast, emphasis), only
        <span lang="it">loro</span> is acceptable. <span lang="it">Essi</span> and
        <span lang="it">esse</span> are reserved for objects or formal writing.


        Avoid in a contrast sentence: <span lang="it">*Noi mangiamo, essi bevono.</span>

        Correct: <span lang="it">Noi mangiamo, loro bevono.</span> (We eat; they drink.)'
      language: en
      why_this_matters: Subject pronouns are among the very first words you meet in
        Italian, yet Italian uses them very differently from English or French — leaving
        them out is not lazy, it is the normal, correct thing to do. Understanding
        when to drop them and when to keep them will immediately make your Italian
        sound natural and will prevent one of the most common A1 mistakes. Mastering
        these pronouns also unlocks the ability to contrast two people ('I am staying,
        you are going') and to add emphasis ('It was *you* who said that').
