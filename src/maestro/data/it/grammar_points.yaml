      title: Using 'a' to show who receives something
      tip: The preposition 'a' marks the person or thing that receives or benefits
        from an action — the indirect object. It answers the question 'to whom?' or
        'for whom?' and is essential any time you say you give, send, speak, or show
        something to someone.
      explanation: '## The rule


        Place <span lang="it">a</span> directly before the noun or name of the person
        (or thing) that receives or benefits from the action. This use is called <span
        lang="it">complemento di termine</span> (indirect object complement) — it
        answers the questions <span lang="it">a chi?</span> (to whom?) or <span lang="it">a
        che cosa?</span> (to what?).


        **Basic word order:**


        <span lang="it">soggetto + verbo + oggetto diretto + a + persona</span>


        Example: <span lang="it">Do il libro a Marco.</span> (I give the book to Marco.)


        The indirect object introduced by <span lang="it">a</span> typically comes
        **after** the direct object, but it can also appear immediately after the
        verb for emphasis or when there is no direct object.


        ## Combining ''a'' with the definite article


        When <span lang="it">a</span> is followed by a **definite article** (<span
        lang="it">il, lo, la, l'', i, gli, le</span>), the two words **merge** into
        a single contracted form called an <span lang="it">articolo preposizionale</span>
        (prepositional article). These contractions are **mandatory** — you cannot
        keep them separate.


        | Preposition | + Article | Contracted form | Example |

        |---|---|---|---|

        | a | il | al | al bambino (to the child) |

        | a | lo | allo | allo studente (to the student) |

        | a | la | alla | alla bambina (to the girl) |

        | a | l'' | all'' | all''amica (to the friend) |

        | a | i | ai | ai ragazzi (to the boys) |

        | a | gli | agli | agli amici (to the friends) |

        | a | le | alle | alle sorelle (to the sisters) |


        Note: when <span lang="it">a</span> is followed by a **proper name** or an
        **indefinite article** (<span lang="it">un, una</span>), no contraction occurs:
        <span lang="it">a Marco</span>, <span lang="it">a una ragazza</span>.


        ## Common verbs that take ''a'' + indirect object


        These are among the most frequent verbs at A1 level that require an indirect
        object introduced by <span lang="it">a</span>:


        | Italian verb | English meaning |

        |---|---|

        | dare | to give |

        | mandare | to send |

        | scrivere | to write |

        | parlare | to speak/talk |

        | dire | to say/tell |

        | mostrare | to show |

        | portare | to bring |

        | chiedere | to ask |

        | rispondere | to reply |

        | telefonare | to phone |


        ## Examples


        **1. Giving something to a named person:**

        <span lang="it">Do il libro a Maria.</span>

        (I give the book to Maria.)


        **2. Speaking to a person with a definite article (contraction required):**

        <span lang="it">Parlo al professore.</span>

        (I speak to the teacher.) — <span lang="it">a + il = al</span>


        **3. Writing to a group (plural contraction):**

        <span lang="it">Scrivo una lettera agli amici.</span>

        (I write a letter to my friends.) — <span lang="it">a + gli = agli</span>


        **4. Bringing something to a female person:**

        <span lang="it">Porto il caffè alla mamma.</span>

        (I bring the coffee to Mum.) — <span lang="it">a + la = alla</span>


        **5. Asking something — verb with no direct object:**

        <span lang="it">Chiedo a Luca.</span>

        (I ask Luca. / I''ll ask Luca.) — <span lang="it">a</span> follows the verb
        directly because there is no direct object.


        **6. Contrastive pair — direct vs indirect object:**

        <span lang="it">Chiamo Maria.</span> (I call Maria. — direct object, no preposition.)

        <span lang="it">Telefono a Maria.</span> (I phone Maria. — indirect object,
        <span lang="it">a</span> required. With <span lang="it">telefonare</span>,
        Italian always uses <span lang="it">a</span>, unlike English ''I phone Maria''.)


        ## Common learner mistakes


        **Mistake 1 — Omitting <span lang="it">a</span> after <span lang="it">telefonare</span>:**

        <span lang="it">✗ Telefono Maria.</span>

        <span lang="it">✓ Telefono a Maria.</span>

        Because English says ''I phone Maria'' with no preposition, learners drop
        <span lang="it">a</span>. In Italian, <span lang="it">telefonare</span> always
        requires <span lang="it">a</span>.


        **Mistake 2 — Forgetting the contraction:**

        <span lang="it">✗ Parlo a il professore.</span>

        <span lang="it">✓ Parlo al professore.</span>

        The forms <span lang="it">a il</span>, <span lang="it">a lo</span>, <span
        lang="it">a la</span>, etc. are not acceptable in standard Italian. Always
        use the contracted form when a definite article follows.


        **Mistake 3 — Adding <span lang="it">a</span> when the verb takes a direct
        object:**

        <span lang="it">✗ Chiamo a Maria.</span>

        <span lang="it">✓ Chiamo Maria.</span>

        The verb <span lang="it">chiamare</span> (to call) takes a **direct** object
        — no preposition. Do not confuse it with <span lang="it">telefonare</span>.


        **Mistake 4 — Using <span lang="it">per</span> instead of <span lang="it">a</span>:**

        <span lang="it">✗ Do il libro per Maria.</span>

        <span lang="it">✓ Do il libro a Maria.</span>

        English speakers sometimes use ''for'' and ''to'' interchangeably, but in
        Italian, the indirect object (the receiver of an action) always takes <span
        lang="it">a</span>, not <span lang="it">per</span>. (<span lang="it">Per</span>
        expresses purpose or benefit in a different sense.)'
      language: en
      why_this_matters: Almost every conversation involves giving, telling, or showing
        something to someone. In Italian, the preposition <span lang="it">a</span>
        (to, at) is the word that connects the verb to the person who receives the
        action — the indirect object. Without it, sentences like 'I give the book
        to Maria' or 'She writes to her mother' are impossible to form correctly.
        Mastering this single preposition immediately unlocks dozens of everyday sentences.
- code: prep_a_tem
  cefr_level: A1
  category: preposizioni
  unistr_code: a_termine_es_do_il_libro_a_giovanni_tempo_es_a_mezzogiorno_alle_tre_a_domani
  unistr_label: tempo es. a mezzogiorno, alle tre
  source_url: https://www.unistrapg.it/profilo_lingua_italiana/site/gram_preposizioni_a1.html
  chunk_ref: book_10_la_preposizione_preposizioni_proprie
  label: Preposizione a con valore di tempo
  explanations:
    en:
      title: Using 'a' to express time in Italian
      tip: Use 'a' to say what time something happens or to name a specific point
        in time, like a holiday or a meal. It works like 'at' in English for clock
        times, but Italian also uses it in a few fixed time phrases that English handles
        differently.
      explanation: '## The core rule


        Use <span lang="it">a</span> to indicate a precise, clock-like point in time
        — most importantly with hours of the day and with a set of fixed time-of-day
        or calendar expressions. It corresponds closely to English ''at'', but the
        two languages do not always match exactly, so the fixed phrases below need
        to be memorised.


        ## Forming time phrases with ''a''


        The basic pattern is:


        **verb + <span lang="it">a</span> + time expression**


        When the time expression begins with a definite article (<span lang="it">il,
        la, le</span>), <span lang="it">a</span> contracts with that article to form
        a single word. These contracted forms are called <span lang="it">preposizioni
        articolate</span> (articulated prepositions):


        | a + | Result | Example |

        |---|---|---|

        | a + il | al | al mattino (in the morning) |

        | a + la | alla | alla sera (in the evening) |

        | a + le | alle | alle tre (at three o''clock) |

        | a + l'' | all'' | all''una (at one o''clock) |


        Note: <span lang="it">a</span> does **not** contract when the time expression
        has no article: <span lang="it">a mezzogiorno</span> (at noon), <span lang="it">a
        mezzanotte</span> (at midnight), <span lang="it">a Natale</span> (at Christmas).


        ## The main uses


        ### 1. Clock times


        For all hours except one o''clock, the article is <span lang="it">le</span>
        (because <span lang="it">le ore</span>, ''the hours'', is plural). For one
        o''clock the article is <span lang="it">la</span> (singular), giving the contracted
        form <span lang="it">all''una</span>.


        - <span lang="it">La lezione inizia alle nove.</span> (The lesson starts at
        nine.)

        - <span lang="it">Mangio alle tredici.</span> (I eat at one p.m.)

        - <span lang="it">Il treno parte all''una e mezza.</span> (The train leaves
        at half past one.)


        ### 2. Fixed time-of-day expressions


        A small set of time-of-day nouns always take <span lang="it">a</span> (with
        contraction where there is an article):


        | Italian | English |

        |---|---|

        | al mattino / la mattina | in the morning |

        | al pomeriggio / il pomeriggio | in the afternoon |

        | alla sera / la sera | in the evening |

        | a mezzogiorno | at noon / at midday |

        | a mezzanotte | at midnight |


        Note that English says ''in the morning / evening'' but Italian uses <span
        lang="it">a</span> for these — a common false-friend trap for learners.


        ### 3. Holidays and calendar reference points


        Italian uses <span lang="it">a</span> (no article, no contraction) before
        holiday names, matching English ''at'':


        - <span lang="it">a Natale</span> — at Christmas

        - <span lang="it">a Pasqua</span> — at Easter

        - <span lang="it">a Capodanno</span> — at New Year


        ## Full examples


        1. <span lang="it">La colazione è alle sette e mezza.</span> — Breakfast is
        at half past seven.


        2. <span lang="it">Ci vediamo a mezzogiorno.</span> — We''ll see each other
        at noon.


        3. <span lang="it">La sera guardo la televisione con la mia famiglia.</span>
        — In the evening I watch television with my family. (Note: here <span lang="it">la
        sera</span> without <span lang="it">a</span> is also possible with the article
        alone when it has a habitual meaning, but <span lang="it">alla sera</span>
        is equally correct and very common.)


        4. <span lang="it">A Natale mangio molto!</span> — At Christmas I eat a lot!


        5. <span lang="it">La farmacia apre all''otto.</span> — The pharmacy opens
        at eight. (Contraction with <span lang="it">le</span> → <span lang="it">alle</span>,
        but before a vowel: <span lang="it">alle otto</span> — note that <span lang="it">otto</span>
        does not trigger elision because the contracted article is <span lang="it">alle</span>,
        not <span lang="it">all''</span>; <span lang="it">all''</span> appears only
        with <span lang="it">una</span>.)


        6. <span lang="it">Il negozio chiude alle venti.</span> — The shop closes
        at eight p.m. (twenty hundred hours).


        ## Common learner mistakes


        **Mistake 1 — Using <span lang="it">in</span> instead of <span lang="it">a</span>
        for clock times**


        ❌ <span lang="it">La festa inizia in otto.</span>

        ✅ <span lang="it">La festa inizia alle otto.</span> — The party starts at
        eight.


        Italian never uses <span lang="it">in</span> for a clock hour. Reserve <span
        lang="it">in</span> for months, years, seasons, and places.


        **Mistake 2 — Forgetting the contraction**


        ❌ <span lang="it">Arrivo a le tre.</span>

        ✅ <span lang="it">Arrivo alle tre.</span> — I arrive at three.


        The sequence <span lang="it">a le</span> is never written as two separate
        words. Contraction is obligatory.


        **Mistake 3 — Translating ''in the morning/evening'' literally with <span
        lang="it">in</span>**


        ❌ <span lang="it">In mattina bevo il caffè.</span>

        ✅ <span lang="it">Al mattino bevo il caffè.</span> — In the morning I drink
        coffee.


        English ''in the morning'' maps onto Italian <span lang="it">al mattino</span>
        or <span lang="it">la mattina</span>, not <span lang="it">in mattina</span>.


        **Mistake 4 — Using <span lang="it">all''</span> instead of <span lang="it">alle</span>
        before hours other than one**


        ❌ <span lang="it">Mangio all''otto.</span>

        ✅ <span lang="it">Mangio alle otto.</span> — I eat at eight.


        The elided form <span lang="it">all''</span> is used only before <span lang="it">una</span>
        (one o''clock), because that is the only singular hour. All other hours use
        <span lang="it">alle</span>.'
      language: en
      why_this_matters: 'Telling the time, arranging to meet someone, and describing
        your daily routine are among the very first things you need to do in Italian.
        The preposition <span lang="it">a</span> (''at'') is the key word that links
        an action to a specific point in time — without it, sentences like ''I eat
        lunch at noon'' or ''The lesson starts at three o''clock'' are simply impossible
        to form correctly. Getting this right from the start also prevents a persistent
        mistake: reaching for the wrong preposition, such as <span lang="it">in</span>
        or <span lang="it">di</span>, in contexts where Italian always uses <span
        lang="it">a</span>.'
- code: prep_a_dom
  cefr_level: A1
  category: preposizioni
  unistr_code: a_termine_es_do_il_libro_a_giovanni_tempo_es_a_mezzogiorno_alle_tre_a_domani
  unistr_label: a domani!
  source_url: https://www.unistrapg.it/profilo_lingua_italiana/site/gram_preposizioni_a1.html
  chunk_ref: book_10_la_preposizione_preposizioni_proprie
  label: Preposizione a in espressioni di distanza temporale prossima
  explanations:
    en:
      title: Using 'a' for near future time expressions
      tip: Use 'a' to say something will happen in a set amount of time — like 'in
        ten minutes' or 'in two days'. It points forward from now to a specific, near
        moment. Think of it as a countdown to the next event.
      explanation: '## The rule


        In Italian, when you want to express that something will happen after a short,
        specific amount of time — counting forward from now — you use the preposition
        <span lang="it">a</span> before certain fixed time expressions. This is called
        <span lang="it">distanza temporale prossima</span> (near future time distance).
        The structure is simple:


        <span lang="it">**a + time expression**</span>


        This pattern is especially common with:


        - <span lang="it">domani</span> — tomorrow

        - <span lang="it">dopodomani</span> — the day after tomorrow

        - <span lang="it">fra/tra + number + time unit</span> — in [X] minutes / hours
        / days (see note below)

        - <span lang="it">più tardi</span> — later

        - <span lang="it">presto</span> — soon


        The most frequent fixed phrases with <span lang="it">a</span> are farewells
        and short announcements:


        | Italiano | English |

        |---|---|

        | a domani | see you tomorrow / until tomorrow |

        | a dopodomani | see you the day after tomorrow |

        | a più tardi | see you later |

        | a presto | see you soon |

        | a lunedì / a martedì … | see you on Monday / Tuesday … |

        | a stasera | see you tonight |

        | a dopo | see you in a bit / until later |


        ## How it is used in speech


        These <span lang="it">a</span>-phrases appear in two main ways:


        **1. As a farewell (most common at A1)**


        You say the phrase on its own, like a goodbye. No verb is needed.


        > <span lang="it">— Ciao, Anna! A domani!</span> — Bye, Anna! See you tomorrow!


        > <span lang="it">— Arrivederci! A presto!</span> — Goodbye! See you soon!


        **2. Inside a sentence with a verb**


        The phrase can also follow a verb to say when something will happen.


        > <span lang="it">Il treno parte a momenti.</span> — The train is leaving
        any moment now.


        ## Examples


        **1.** A simple farewell between friends:

        <span lang="it">Ciao, Marco! A stasera!</span>

        (Bye, Marco! See you tonight!)


        **2.** Saying goodbye until a specific day:

        <span lang="it">— Buona giornata! — Grazie, a lunedì!</span>

        (— Have a good day! — Thanks, see you Monday!)


        **3.** A parent speaking to a child:

        <span lang="it">A dopo, tesoro. Mamma torna presto.</span>

        (See you in a bit, sweetheart. Mum is coming back soon.)


        **4.** Two colleagues at the end of the day:

        <span lang="it">— Arrivederci a tutti! — A domani!</span>

        (— Goodbye everyone! — See you tomorrow!)


        **5.** Contrastive pair — notice the difference in meaning between <span lang="it">a</span>
        and <span lang="it">tra/fra</span>:

        <span lang="it">A domani.</span> (See you tomorrow — farewell phrase, fixed
        expression.)

        <span lang="it">Torno tra due giorni.</span> (I am coming back in two days
        — counting a span of time, uses <span lang="it">tra/fra</span> instead.)


        **6.** Edge case — <span lang="it">a momenti</span> (any moment now):

        <span lang="it">La nonna arriva a momenti.</span>

        (Grandma is arriving any moment now.)

        Here <span lang="it">a momenti</span> means ''very soon / imminently'', not
        ''at moments''. It is a fixed idiomatic phrase.


        ## Important distinction: ''a'' vs. ''tra/fra''


        Students sometimes confuse <span lang="it">a</span> with <span lang="it">tra</span>
        or <span lang="it">fra</span> (both meaning ''in'' when counting forward in
        time). The rule is:


        - <span lang="it">**a**</span> → used in **fixed, named time expressions**
        (a tomorrow, a Monday, a later, a soon). These are points on the calendar
        or clock you can name.

        - <span lang="it">**tra/fra + number**</span> → used when you count a **span**
        of time forward from now (in 5 minutes, in 3 days, in an hour).


        | Meaning | Correct Italian | Notes |

        |---|---|---|

        | See you tomorrow | A domani | fixed farewell with a |

        | In two days | Tra due giorni | counted span, use tra/fra |

        | See you in five minutes | A tra cinque minuti | farewell + counted span:
        both appear together |

        | See you soon | A presto | fixed farewell with a |


        Note the combined form <span lang="it">a tra/fra</span>: when you want to
        say ''see you in five minutes'' as a farewell, Italian uses both prepositions
        together: <span lang="it">A tra cinque minuti!</span> or <span lang="it">A
        fra poco!</span> This is a natural, spoken combination — do not drop the <span
        lang="it">a</span>.


        ## Common learner mistakes


        **Mistake 1 — Dropping ''a'' in farewells:**

        <span lang="it">*Domani!</span> ✗ — This sounds abrupt or incomplete as a
        farewell.

        <span lang="it">A domani!</span> ✓ — Always include <span lang="it">a</span>
        to signal ''see you / until''.


        **Mistake 2 — Using ''a'' with a counted span:**

        <span lang="it">*A due giorni.</span> ✗ — You cannot say ''a two days''.

        <span lang="it">Tra due giorni.</span> ✓ — Use <span lang="it">tra/fra</span>
        for counted spans.


        **Mistake 3 — Translating ''in'' directly as ''in'':**

        English says ''in two days'' — Italian says <span lang="it">tra due giorni</span>,
        not <span lang="it">*in due giorni</span>. The preposition <span lang="it">in</span>
        exists in Italian but is not used for counting forward in time.


        **Mistake 4 — Forgetting ''a'' in the combined farewell form:**

        <span lang="it">*Tra poco!</span> ✗ as a farewell.

        <span lang="it">A tra poco!</span> ✓ — The <span lang="it">a</span> is required
        at the start of the farewell phrase.'
      language: en
      why_this_matters: Telling someone when something is about to happen — <span
        lang="it">'tra cinque minuti'</span> or <span lang="it">'a domani'</span>
        — is one of the first practical things you need in Italian. The preposition
        <span lang="it">a</span> (to/at/in) is used constantly in these short, fixed
        time phrases, and getting it right instantly makes your speech sound natural.
        Without it, you cannot say things like 'see you tomorrow', 'in an hour', or
        'in two days'.
- code: prep_a_loc
  cefr_level: A1
  category: preposizioni
  unistr_code: a_termine_es_do_il_libro_a_giovanni_tempo_es_a_mezzogiorno_alle_tre_a_domani
  unistr_label: stato in e moto a luogo, es. Sono / vado a casa / a scuola, vado a
    fare la spesa
  source_url: https://www.unistrapg.it/profilo_lingua_italiana/site/gram_preposizioni_a1.html
  chunk_ref: book_10_la_preposizione_preposizioni_proprie
  label: Preposizione a con valore di stato in luogo e moto a luogo
  explanations:
    en:
      title: 'Preposition ''a'': place and movement'
      tip: Use 'a' to say where you are or where you are going when the destination
        is a city or a specific place. It means both 'at/in' (staying) and 'to' (moving
        towards) depending on the verb you use with it.
      explanation: '## The rule


        The preposition <span lang="it">a</span> has two closely related uses that
        depend on the verb in the sentence, not on a different word for ''at'' versus
        ''to''.


        **Stato in luogo** (being in a place): use <span lang="it">a</span> to say
        where someone or something **is**. The verb will typically be <span lang="it">essere</span>
        (''to be''), <span lang="it">stare</span> (''to stay/be''), or a verb of activity
        like <span lang="it">lavorare</span> (''to work'') or <span lang="it">studiare</span>
        (''to study''). In this use, <span lang="it">a</span> translates as **''in''**
        or **''at''** in English.


        **Moto a luogo** (movement towards a place): use <span lang="it">a</span>
        to say where someone or something **is going**. The verb will typically be
        <span lang="it">andare</span> (''to go''), <span lang="it">venire</span> (''to
        come''), or <span lang="it">tornare</span> (''to return''). In this use, <span
        lang="it">a</span> translates as **''to''** in English.


        The preposition itself does **not change** — only the verb signals whether
        you are talking about being somewhere or going somewhere.


        ## When to use ''a''


        Use <span lang="it">a</span> before:


        - **Cities and towns**: <span lang="it">a Roma</span> (''in/to Rome''), <span
        lang="it">a Milano</span> (''in/to Milan''), <span lang="it">a Napoli</span>
        (''in/to Naples'')

        - **Specific named places and venues**: <span lang="it">a casa</span> (''at
        home''), <span lang="it">a scuola</span> (''at school''), <span lang="it">a
        lavoro</span> (''at work''), <span lang="it">a teatro</span> (''at the theatre''),
        <span lang="it">a letto</span> (''in bed'')


        Note that many of these fixed expressions — especially <span lang="it">a casa</span>,
        <span lang="it">a scuola</span>, <span lang="it">a letto</span> — are used
        **without an article**. This is normal and must be memorised.


        ## Important contrast: ''a'' vs ''in''


        Both <span lang="it">a</span> and <span lang="it">in</span> can mean ''in''
        or ''to'' in English, so students often confuse them. The key rule at A1 level:


        - Use <span lang="it">**a**</span> before **cities**: <span lang="it">a Firenze</span>
        (''in/to Florence'')

        - Use <span lang="it">**in**</span> before **countries, regions, and continents**:
        <span lang="it">in Italia</span> (''in/to Italy''), <span lang="it">in Toscana</span>
        (''in/to Tuscany'')


        This distinction is fundamental and will be reinforced as you learn more prepositions.


        ## Examples


        **Stato in luogo** (being in a place):


        <span lang="it">Sono a Roma.</span> — ''I am in Rome.''


        <span lang="it">Mia madre è a casa.</span> — ''My mother is at home.''


        <span lang="it">I bambini sono a scuola.</span> — ''The children are at school.''


        **Moto a luogo** (movement towards a place):


        <span lang="it">Vado a Milano domani.</span> — ''I am going to Milan tomorrow.''


        <span lang="it">Andiamo a casa.</span> — ''We are going home.'' / ''Let''s
        go home.''


        **Contrastive pair** — same preposition, different verb:


        <span lang="it">Sono a scuola.</span> — ''I am at school.'' (stato in luogo)

        <span lang="it">Vado a scuola.</span> — ''I am going to school.'' (moto a
        luogo)


        Notice that <span lang="it">a scuola</span> is identical in both sentences
        — only the verb changes the meaning.


        ## Common learner mistakes


        **Mistake 1 — Using ''in'' before a city:**

        <span lang="it">*Sono in Roma.</span> ✗ — Incorrect. Cities always take <span
        lang="it">a</span>, not <span lang="it">in</span>.

        <span lang="it">Sono a Roma.</span> ✓


        **Mistake 2 — Adding an article after ''a'' with fixed expressions:**

        <span lang="it">*Vado a la casa.</span> ✗ — Incorrect. Fixed place expressions
        like <span lang="it">casa</span>, <span lang="it">scuola</span>, <span lang="it">letto</span>,
        and <span lang="it">teatro</span> do not take an article after <span lang="it">a</span>
        in their standard uses.

        <span lang="it">Vado a casa.</span> ✓


        **Mistake 3 — Confusing ''a'' with ''to go to'' in English and dropping it:**

        <span lang="it">*Vado Roma.</span> ✗ — In Italian, the preposition cannot
        be omitted the way it sometimes is in casual English. You must always include
        <span lang="it">a</span>.

        <span lang="it">Vado a Roma.</span> ✓


        ## Quick reference


        | Use | Italian term | Verb type | English equivalent |

        |---|---|---|---|

        | Being in a place | stato in luogo | essere, stare, lavorare… | ''in'', ''at''
        |

        | Going to a place | moto a luogo | andare, venire, tornare… | ''to'' |


        | Place type | Preposition | Example |

        |---|---|---|

        | City | a | a Napoli |

        | Country | in | in Italia |

        | Fixed place | a (no article) | a casa, a scuola |'
      language: en
      why_this_matters: The preposition <span lang="it">a</span> is one of the most
        common words in Italian. You need it every time you say where someone is or
        where someone is going — two things that come up in almost every conversation.
        Without it, you cannot answer basic questions like <span lang="it">'Dove sei?'</span>
        ('Where are you?') or <span lang="it">'Dove vai?'</span> ('Where are you going?'),
        so mastering it immediately opens up a huge range of everyday sentences.
- code: prep_a_l_2
  cefr_level: A1
  category: preposizioni
  unistr_code: a_termine_es_do_il_libro_a_giovanni_tempo_es_a_mezzogiorno_alle_tre_a_domani
  unistr_label: stato in e moto a luogo con nomi di città, es. Vado a Roma.
  source_url: https://www.unistrapg.it/profilo_lingua_italiana/site/gram_preposizioni_a1.html
  chunk_ref: book_10_la_preposizione_preposizioni_proprie
  label: Preposizione a con valore di luogo con nomi di città
  explanations:
    en:
      title: Using 'a' for location with city names
      tip: To say you are in a city or going to a city, use the preposition 'a' directly
        before the city name — no article needed. This one small word does the work
        of both 'in' and 'to' when talking about cities.
      explanation: '## The rule


        Use <span lang="it">a</span> (meaning ''in'' or ''to'', depending on context)
        directly before the name of a city. No article is needed between <span lang="it">a</span>
        and the city name.


        The formula is simply:


        **verb + <span lang="it">a</span> + city name**


        This applies whether you are talking about:

        - **location** — where someone is or lives (English: ''in'')

        - **destination** — where someone is going (English: ''to'')


        The preposition <span lang="it">a</span> does not change its form before city
        names. It stays <span lang="it">a</span> regardless of whether the city name
        begins with a vowel or a consonant.


        ## Forms at a glance


        | Use | Italian | English |

        |---|---|---|

        | Location | Abito a Roma. | I live in Rome. |

        | Location | Sono a Napoli. | I am in Naples. |

        | Destination | Vado a Milano. | I am going to Milan. |

        | Destination | Vai a Firenze? | Are you going to Florence? |


        ## Examples


        <span lang="it">Mia madre abita a Torino.</span> — My mother lives in Turin.


        <span lang="it">Domani vado a Venezia.</span> — Tomorrow I am going to Venice.


        <span lang="it">Marco è a Roma per lavoro.</span> — Marco is in Rome for work.


        <span lang="it">Andiamo a Palermo in estate.</span> — We are going to Palermo
        in the summer.


        <span lang="it">Sei mai stato a Oslo?</span> — Have you ever been to Oslo?
        (Note: <span lang="it">a</span> is used with foreign city names too.)


        <span lang="it">Studio a Bologna, ma la mia famiglia è a Bari.</span> — I
        study in Bologna, but my family is in Bari. (A single sentence using <span
        lang="it">a</span> twice, each time with a different city.)


        ## Important exception: countries and regions


        The rule above applies **only to cities**. For countries and regions, Italian
        uses <span lang="it">in</span> instead of <span lang="it">a</span>, usually
        with an article.


        <span lang="it">Abito in Italia.</span> — I live in Italy. (country → <span
        lang="it">in</span>)

        <span lang="it">Abito a Roma.</span> — I live in Rome. (city → <span lang="it">a</span>)


        Do not mix these up: <span lang="it">*Abito a Italia*</span> is incorrect.


        ## City names that look unusual


        A small number of city names are traditionally used with a definite article
        (<span lang="it">il, la, i, le</span> — the article words). The most common
        example is <span lang="it">L''Aia</span> (The Hague). When <span lang="it">a</span>
        combines with a definite article beginning with a consonant, it forms a single
        merged word called a ''contracted preposition'': for example, <span lang="it">a</span>
        + <span lang="it">la</span> → <span lang="it">alla</span>. However, these
        cases are rare and you will not need them at A1 level. For the vast majority
        of city names, <span lang="it">a</span> is used alone.


        ## Common learner mistakes


        **Mistake 1 — using <span lang="it">in</span> instead of <span lang="it">a</span>
        with cities:**

        <span lang="it">*Vado in Roma.*</span> ✗ → <span lang="it">Vado a Roma.</span>
        ✓

        English speakers sometimes reach for ''in'' because in English we say ''in
        Rome''. In Italian, ''in'' is reserved for countries and regions, not cities.


        **Mistake 2 — adding an article before the city name:**

        <span lang="it">*Vado a la Milano.*</span> ✗ → <span lang="it">Vado a Milano.</span>
        ✓

        City names in Italian do not take an article in ordinary use. Write <span
        lang="it">a</span> and then the city name directly — nothing in between.


        **Mistake 3 — confusing location and destination:**

        Both ''I am in Rome'' and ''I am going to Rome'' use <span lang="it">a Roma</span>
        in Italian. The difference is expressed by the verb, not by changing the preposition:
        <span lang="it">Sono a Roma</span> (I am in Rome) vs. <span lang="it">Vado
        a Roma</span> (I am going to Rome). The preposition itself stays the same
        in both cases.'
      language: en
      why_this_matters: Saying where you are and where you are going are among the
        very first things you need to do in Italian. The preposition <span lang="it">a</span>
        — one of the nine core Italian prepositions — is the word that connects you
        to a city in both of these situations. Without it, you cannot say 'I live
        in Rome' or 'I'm going to Milan', so mastering this small word immediately
        unlocks dozens of everyday sentences.
- code: prep_in_lo
  cefr_level: A1
  category: preposizioni
  unistr_code: in_stato_in_e_moto_a_luogo_con_nomi_di_nazioni_es_abito_vado_in_italia_mezzo_es
  unistr_label: in stato in e moto a luogo con nomi di nazioni, es. Abito / vado in
    Italia
  source_url: https://www.unistrapg.it/profilo_lingua_italiana/site/gram_preposizioni_a1.html
  chunk_ref: book_10_la_preposizione_preposizioni_proprie
  label: Preposizione in con valore di stato in luogo e moto a luogo con nazioni
  explanations:
    en:
      title: 'Using ''in'' with countries: location and movement'
      tip: Use 'in' before the name of a country to say you are there or going there.
        Unlike English, Italian uses the same word 'in' for both 'in a country' and
        'to a country', and you do not use an article with most country names.
      explanation: '## The rule


        The preposition <span lang="it">in</span> is used before country names in
        two distinct situations:


        **1. Stato in luogo** (location — being in a place): answering the question
        <span lang="it">Dove sei? / Dove abiti?</span> (''Where are you? / Where do
        you live?'')


        **2. Moto a luogo** (movement toward a place — going to a place): answering
        the question <span lang="it">Dove vai? / Dove andate?</span> (''Where are
        you going?'')


        In both cases the structure is simply:


        <span lang="it">**in + country name (no article)**</span>


        This is different from English, which uses ''in'' for location but ''to''
        for movement. Italian uses <span lang="it">in</span> for both.


        ## Formation: no article with most countries


        The most important detail is that country names used with <span lang="it">in</span>
        for location or movement do **not** take a definite article. You do not say
        <span lang="it">*in la Francia*</span>; you say <span lang="it">in Francia</span>.
        The article is dropped.


        This applies to the overwhelming majority of country names you will meet at
        A1 level:


        | Country | in + country |

        |---|---|

        | Italia (Italy) | in Italia |

        | Francia (France) | in Francia |

        | Spagna (Spain) | in Spagna |

        | Germania (Germany) | in Germania |

        | Inghilterra (England) | in Inghilterra |

        | Cina (China) | in Cina |

        | Giappone (Japan) | in Giappone |

        | Portogallo (Portugal) | in Portogallo |

        | Brasile (Brazil) | in Brasile |


        ## Examples


        **Location (stato in luogo):**


        <span lang="it">Abito in Italia.</span> — I live in Italy.


        <span lang="it">I miei genitori sono in Francia.</span> — My parents are in
        France.


        **Movement toward (moto a luogo):**


        <span lang="it">Domani vado in Spagna.</span> — Tomorrow I am going to Spain.


        <span lang="it">Quest''estate andiamo in Giappone.</span> — This summer we
        are going to Japan.


        **Contrastive pair — same preposition, two meanings:**


        <span lang="it">Sono in Germania.</span> — I am in Germany. (location)


        <span lang="it">Vado in Germania.</span> — I am going to Germany. (movement)


        Notice that the <span lang="it">in</span> does not change; only the verb signals
        whether the meaning is location or movement.


        ## Important exception: countries with a plural name


        A small number of countries have a plural name. These keep their article even
        after <span lang="it">in</span>, and <span lang="it">in</span> combines with
        the article to form a contracted preposition:


        | Country | Full form (not used) | Contracted form (correct) |

        |---|---|---|

        | gli Stati Uniti (the United States) | in + gli | negli Stati Uniti |

        | i Paesi Bassi (the Netherlands) | in + i | nei Paesi Bassi |


        At A1 level the most important one to remember is <span lang="it">negli Stati
        Uniti</span> (''in/to the United States'').


        <span lang="it">Vado negli Stati Uniti.</span> — I am going to the United
        States.


        ## Common learner mistakes


        **Mistake 1: Using <span lang="it">a</span> instead of <span lang="it">in</span>
        with countries.**


        Learners who know that <span lang="it">a</span> is used with cities (<span
        lang="it">a Roma</span>, <span lang="it">a Parigi</span>) sometimes carry
        this over to countries. This is wrong.


        <span lang="it">*Vado a Italia.</span> ✗ — incorrect


        <span lang="it">Vado in Italia.</span> ✓ — correct


        **Rule of thumb:** <span lang="it">a</span> for cities; <span lang="it">in</span>
        for countries.


        **Mistake 2: Keeping the article after <span lang="it">in</span> with singular
        countries.**


        <span lang="it">*Vado in la Francia.</span> ✗ — incorrect


        <span lang="it">Vado in Francia.</span> ✓ — correct


        Drop the article with singular country names. (Remember: plural country names
        like <span lang="it">gli Stati Uniti</span> are the exception and do keep
        a contracted article.)


        **Mistake 3: Translating ''to'' as <span lang="it">a</span> for countries.**


        English uses ''to'' for movement (''I am going **to** Italy''), so students
        sometimes look for an Italian equivalent. There is none needed here — <span
        lang="it">in</span> covers both ''in'' and ''to'' for countries.


        <span lang="it">*Vado a in Italia.</span> ✗ — incorrect (never double the
        preposition)


        <span lang="it">Vado in Italia.</span> ✓ — correct'
      language: en
      why_this_matters: Talking about where you live, where you are from, and where
        you are going are some of the very first things you do in Italian. The preposition
        <span lang="it">in</span> is your essential tool for all of these situations
        with country names. Getting this right removes one of the most frequent errors
        beginners make — reaching for <span lang="it">a</span> or adding an unnecessary
        article — and lets you talk about travel and home from day one.
- code: prep_in_me
  cefr_level: A1
  category: preposizioni
  unistr_code: in_stato_in_e_moto_a_luogo_con_nomi_di_nazioni_es_abito_vado_in_italia_mezzo_es
  unistr_label: mezzo, es. in treno, in macchina
  source_url: https://www.unistrapg.it/profilo_lingua_italiana/site/gram_preposizioni_a1.html
  chunk_ref: book_10_la_preposizione_preposizioni_proprie
  label: Preposizione in con valore di mezzo
  explanations:
    en:
      title: Using 'in' to express means of transport
      tip: In Italian, use 'in' before most forms of transport to say how you travel
        — for example, by car, by bus, or by train. This is different from English,
        which uses 'by'. The noun after 'in' has no article.
      explanation: '## The rule


        To say you travel by a particular vehicle or mode of transport, place <span
        lang="it">in</span> directly before the noun naming that vehicle. Do not use
        an article (no <span lang="it">il</span>, <span lang="it">la</span>, <span
        lang="it">un</span>, etc.) between <span lang="it">in</span> and the noun.


        **Pattern:** <span lang="it">viaggiare / andare / venire</span> + <span lang="it">in</span>
        + [vehicle noun, no article]


        ## Common transport nouns used with ''in''


        | Italian | English |

        |---|---|

        | in macchina | by car |

        | in autobus | by bus |

        | in treno | by train |

        | in aereo | by plane |

        | in bici / in bicicletta | by bike |

        | in moto / in motocicletta | by motorbike |

        | in taxi | by taxi |

        | in metropolitana | by metro / underground |

        | in nave | by ship / by boat |

        | in pullman | by coach |


        ## The important exception: ''a piedi'' and ''a piedi''


        When you travel on foot, Italian does **not** use <span lang="it">in</span>.
        Instead it uses the preposition <span lang="it">a</span> (at/to/by):


        <span lang="it">a piedi</span> — on foot / by foot


        Similarly, for a horse, Italian uses <span lang="it">a cavallo</span> (on
        horseback). These are fixed expressions with <span lang="it">a</span>, not
        <span lang="it">in</span>, and must simply be memorised.


        ## Examples


        <span lang="it">Vado a scuola in autobus.</span>

        (I go to school by bus.)


        <span lang="it">Mia madre va al lavoro in macchina.</span>

        (My mother goes to work by car.)


        <span lang="it">Loro viaggiano in treno ogni settimana.</span>

        (They travel by train every week.)


        <span lang="it">Vieni in bici o in autobus?</span>

        (Are you coming by bike or by bus?)


        <span lang="it">Di solito vado al supermercato a piedi.</span>

        (I usually go to the supermarket on foot.) — note <span lang="it">a piedi</span>,
        not <span lang="it">in piedi</span>.


        <span lang="it">Andiamo a Roma in aereo, non in treno.</span>

        (We are going to Rome by plane, not by train.) — a contrastive pair showing
        <span lang="it">in</span> used twice in one sentence.


        ## Common learner mistakes


        **Mistake 1 — adding an article:**

        <span lang="it">*Vado in la macchina.</span> ✗

        The preposition <span lang="it">in</span> for means of transport is always
        followed directly by the noun, with no article. Correct: <span lang="it">Vado
        in macchina.</span> ✓


        **Mistake 2 — using ''con'' instead of ''in'':**

        <span lang="it">*Vengo con il treno.</span> ✗

        English speakers sometimes translate ''I come with the train'', but Italian
        uses <span lang="it">in</span> for this meaning. Correct: <span lang="it">Vengo
        in treno.</span> ✓ (Note: <span lang="it">con</span> is used in other contexts,
        but not for standard means of transport.)


        **Mistake 3 — using ''in piedi'' for ''on foot'':**

        <span lang="it">*Vado al parco in piedi.</span> ✗

        The expression <span lang="it">in piedi</span> means ''standing up'', not
        ''on foot''. Always use <span lang="it">a piedi</span> to mean travelling
        on foot. Correct: <span lang="it">Vado al parco a piedi.</span> ✓


        **Mistake 4 — using ''by'' logic for all vehicles:**

        Not every English ''by + vehicle'' maps to <span lang="it">in</span> in Italian.
        As noted above, <span lang="it">a piedi</span> and <span lang="it">a cavallo</span>
        use <span lang="it">a</span>. When in doubt, check whether the noun appears
        in the standard list above.'
      language: en
      why_this_matters: Talking about how you get from place to place is one of the
        first things you need to do in Italian. The preposition <span lang="it">in</span>
        (in/by) is the standard way to express means of transport, and it appears
        in everyday questions and answers from the very first lessons. Getting this
        right removes a whole category of small but persistent errors, because English
        learners often reach for <span lang="it">con</span> (with) or try to add an
        article — both of which sound unnatural to a native speaker.
- code: prep_con_c
  cefr_level: A1
  category: preposizioni
  source_url: https://www.unistrapg.it/profilo_lingua_italiana/site/gram_preposizioni_a1.html
  unistr_code: con_compagnia_es_vado_a_scuola_con_mario
  unistr_label: con compagnia, es. Vado a scuola con Mario .
  chunk_ref: book_10_la_preposizione_preposizioni_proprie
  label: Preposizione con con valore di compagnia
  explanations:
    en:
      title: Using 'con' to express 'with' (company)
      tip: Use 'con' before a noun or pronoun to say you are doing something together
        with another person or thing. It never changes its form — just place it directly
        before the word that follows. This is one of the most common prepositions
        you will meet from your very first conversations.
      explanation: '## The rule


        <span lang="it">Con</span> is a <span lang="it">preposizione propria</span>
        (a ''true'' preposition — a word used exclusively as a preposition). Its core
        meaning is **company or accompaniment**: it tells you *who* or *what* is together
        with the subject of the sentence.


        **Formation:** <span lang="it">con</span> does not change. It stays exactly
        the same regardless of the gender or number of the noun that follows it. Place
        it directly before the noun, pronoun, or noun phrase:


        <span lang="it">con</span> + [person / thing] = ''with'' [person / thing]


        ## Forms and combinations


        Unlike most Italian prepositions, <span lang="it">con</span> does **not**
        merge with the definite articles (<span lang="it">il, lo, la, i, gli, le</span>)
        to form a single combined word in modern standard Italian. You simply write
        the two words separately:


        | Preposition + article | Form used | Example |

        |---|---|---|

        | con + il | con il (two words) | con il bambino (''with the child'') |

        | con + la | con la (two words) | con la mamma (''with mum'') |

        | con + i | con i (two words) | con i miei amici (''with my friends'') |

        | con + gli | con gli (two words) | con gli studenti (''with the students'')
        |

        | con + le | con le (two words) | con le sorelle (''with the sisters'') |


        **Note for advanced curiosity:** Older or literary Italian occasionally used
        the merged forms <span lang="it">col</span> (<span lang="it">con + il</span>)
        and <span lang="it">coi</span> (<span lang="it">con + i</span>). You may see
        these in old texts or set phrases, but at A1 level always use the two-word
        form — it is correct everywhere in modern Italian.


        ## With pronouns


        When <span lang="it">con</span> is followed by a personal pronoun, Italian
        uses the <span lang="it">pronomi tonici</span> (stressed/independent pronouns),
        not the short object pronouns:


        | Italian | English |

        |---|---|

        | con me | ''with me'' |

        | con te | ''with you'' (informal singular) |

        | con lui | ''with him'' |

        | con lei | ''with her'' |

        | con Lei | ''with you'' (formal) |

        | con noi | ''with us'' |

        | con voi | ''with you'' (plural) |

        | con loro | ''with them'' |


        ## Examples


        **1. Basic company (person + person):**

        <span lang="it">Mangio con la mamma.</span>

        (I am eating with mum.)


        **2. Going somewhere with someone:**

        <span lang="it">Vieni con me al supermercato?</span>

        (Are you coming with me to the supermarket?)


        **3. With a plural noun:**

        <span lang="it">Gioco con i miei amici ogni pomeriggio.</span>

        (I play with my friends every afternoon.)


        **4. With a stressed pronoun:**

        <span lang="it">Maria studia con lui.</span>

        (Maria studies with him.)


        **5. Contrastive pair — alone vs. with someone:**

        <span lang="it">Oggi mangio da solo.</span> (Today I am eating alone.) /

        <span lang="it">Oggi mangio con un amico.</span> (Today I am eating with a
        friend.) — notice only <span lang="it">con</span> expresses company.


        **6. With a thing (not a person):**

        <span lang="it">Bevo il tè con il latte.</span>

        (I drink tea with milk.) — <span lang="it">con</span> can link a thing to
        another thing, not only people.


        ## Common learner mistakes


        **Mistake 1 — using a short object pronoun after <span lang="it">con</span>:**

        <span lang="it">*con mi</span> ✗ → correct form: <span lang="it">con me</span>
        ✓

        <span lang="it">*con ti</span> ✗ → correct form: <span lang="it">con te</span>
        ✓

        Always use the stressed (tonic) pronoun after any preposition in Italian.


        **Mistake 2 — trying to merge <span lang="it">con</span> with the article:**

        <span lang="it">*col bambino</span> — while not wrong in older Italian, avoid
        this at A1 and write <span lang="it">con il bambino</span> ✓ to keep things
        clear and consistent.


        **Mistake 3 — confusing <span lang="it">con</span> with <span lang="it">e</span>
        (''and''):**

        <span lang="it">Vado con Marco e Sofia.</span> ✓ (I am going with Marco and
        Sofia — all three go together.)

        <span lang="it">Marco e Sofia vanno.</span> ✓ (Marco and Sofia go — they are
        the subject, no ''with''.)

        Use <span lang="it">con</span> when *you* accompany someone; use <span lang="it">e</span>
        simply to list people or things without implying one accompanies another.


        **Mistake 4 — omitting <span lang="it">con</span> entirely (translating literally
        from English ''I''m going shopping Mum''):**

        <span lang="it">*Vado a fare la spesa mamma.</span> ✗ → <span lang="it">Vado
        a fare la spesa con la mamma.</span> ✓

        Italian always requires <span lang="it">con</span> to express accompaniment;
        you cannot simply place the companion''s name next to the verb.'
      language: en
      why_this_matters: Almost every conversation involves other people — and Italian
        uses <span lang="it">con</span> ('with') to show who is present or involved.
        Without it, you cannot say 'I am eating with my mum', 'he lives with a friend',
        or 'she is coming with me'. It appears constantly in everyday speech and is
        one of the first prepositions you need to master.
- code: prep_pe_va
  cefr_level: A1
  category: preposizioni
  unistr_code: per_vantaggio_es_il_regalo_e_per_luca_moto_a_luogoes_a_che_ora_parte_il_treno
  unistr_label: 'per : vantaggio es. Il regalo è per Luca'
  source_url: https://www.unistrapg.it/profilo_lingua_italiana/site/gram_preposizioni_a1.html
  chunk_ref: book_10_la_preposizione_preposizioni_proprie
  label: Preposizione per con valore di vantaggio
  explanations:
    en:
      title: Using 'per' to mean 'for someone'
      tip: Use 'per' to show that something is intended for a person or done in their
        benefit. It is one of the nine core Italian prepositions and works much like
        English 'for' in this meaning.
      explanation: '## The rule


        Italian has nine core prepositions called <span lang="it">preposizioni proprie</span>
        (proper prepositions). They are: <span lang="it">di, a, da, in, con, su, per,
        fra/tra</span>. These words function exclusively as prepositions (with the
        minor exception of <span lang="it">su</span>, which can also be an adverb).


        Among them, <span lang="it">per</span> has several uses. This entry focuses
        on its **value of advantage or benefit** — expressing that something is done,
        given, bought, prepared, or intended **for the benefit of a person or group**.
        In English this corresponds to ''for''.


        **Formation:** <span lang="it">per</span> is invariable — it never changes
        form regardless of gender, number, or the word that follows. Place it directly
        before the noun, pronoun, or noun phrase indicating the beneficiary.


        **Pattern:**


        <span lang="it">per</span> + [person / group / pronoun]


        Examples of what follows <span lang="it">per</span>:


        | Italian | English gloss |

        |---|---|

        | per me | for me |

        | per te | for you (singular) |

        | per lui / per lei | for him / for her |

        | per noi | for us |

        | per voi | for you (plural) |

        | per loro | for them |

        | per mia madre | for my mother |

        | per i bambini | for the children |


        Note: <span lang="it">per</span> **does not combine** with the definite article
        to form a contraction (unlike <span lang="it">di, a, da, in, su</span>, which
        do). You always write <span lang="it">per il</span>, <span lang="it">per la</span>,
        <span lang="it">per i</span>, etc. as two separate words.


        ## Examples


        **1. Giving or buying something for someone**


        <span lang="it">Ho comprato un regalo per mia sorella.</span>

        (I bought a gift for my sister.)


        **2. Preparing food for someone**


        <span lang="it">La mamma cucina la pasta per i bambini.</span>

        (Mum is cooking pasta for the children.)


        **3. Doing a favour for someone**


        <span lang="it">Puoi aprire la porta per me?</span>

        (Can you open the door for me?)


        **4. Something intended for a specific person**


        <span lang="it">Questo caffè è per te.</span>

        (This coffee is for you.)


        **5. Ordering or requesting on behalf of someone**


        <span lang="it">Un succo di frutta per lui, per favore.</span>

        (A fruit juice for him, please.)


        **6. Contrastive pair — distinguishing the beneficiary**


        <span lang="it">Questo libro è per me, non per te.</span>

        (This book is for me, not for you.)

        Here <span lang="it">per</span> is used twice in the same sentence to contrast
        two different beneficiaries — a very natural pattern in spoken Italian.


        ## Common learner mistakes


        **Mistake 1: Using <span lang="it">a</span> instead of <span lang="it">per</span>
        to express benefit**


        ❌ <span lang="it">Ho comprato un regalo a mia sorella.</span>

        ✅ <span lang="it">Ho comprato un regalo per mia sorella.</span>


        The preposition <span lang="it">a</span> can appear with verbs of giving (<span
        lang="it">dare qualcosa a qualcuno</span> — to give something to someone),
        but when you want to say something is ''for'' someone in the sense of benefit
        or destination, use <span lang="it">per</span>.


        **Mistake 2: Trying to contract <span lang="it">per</span> with the article**


        ❌ <span lang="it">pel bambino</span> (an old literary form, never used in
        modern Italian)

        ✅ <span lang="it">per il bambino</span>


        Students sometimes assume <span lang="it">per</span> contracts like <span
        lang="it">di + il = del</span> or <span lang="it">a + il = al</span>. It does
        not. Always write <span lang="it">per</span> as a separate word.


        **Mistake 3: Omitting <span lang="it">per</span> entirely**


        ❌ <span lang="it">Questo è te.</span>

        ✅ <span lang="it">Questo è per te.</span>


        In English, informal speech sometimes drops ''for'' (''This one''s you''),
        but in Italian the preposition <span lang="it">per</span> must always be present
        to convey the beneficiary meaning.'
      language: en
      why_this_matters: The preposition <span lang="it">per</span> with the meaning
        of advantage or benefit ('for someone') appears in everyday Italian from the
        very first conversations — buying a gift, ordering food, doing a favour. Without
        it, you cannot express who something is meant for or who benefits from an
        action. Mastering this single use of <span lang="it">per</span> immediately
        makes your Italian sound natural in dozens of common situations.
- code: prep_pe_mv
  cefr_level: A1
  category: preposizioni
  unistr_code: per_vantaggio_es_il_regalo_e_per_luca_moto_a_luogoes_a_che_ora_parte_il_treno
  unistr_label: moto a luogo,es. A che ora parte il treno per Roma? introduzione di
    proposizione secondaria finale implicita, es. Sono qui per studiare l’italiano
    .
  source_url: https://www.unistrapg.it/profilo_lingua_italiana/site/gram_preposizioni_a1.html
  chunk_ref: book_10_la_preposizione_preposizioni_proprie
  label: Preposizione per con valore di moto a luogo e finalità
  explanations:
    en:
      title: Using 'per' for destination and purpose
      tip: Use 'per' to say where someone is heading or why they are doing something.
        It answers both 'where to?' and 'what for?' in Italian.
      explanation: '## The rule: two main uses


        ### 1. Motion towards a destination


        Use <span lang="it">per</span> after a verb of motion to say where someone
        or something is headed — that is, their destination or direction of travel.
        This is sometimes called <span lang="it">moto a luogo</span> (motion to a
        place).


        **Pattern:** [verb of motion] + <span lang="it">per</span> + [place]


        The key idea is that the person or thing is on their way there — they have
        not necessarily arrived yet. Think of <span lang="it">per</span> here as meaning
        ''for'' or ''to'' in the sense of ''bound for''.


        ### 2. Purpose or goal


        Use <span lang="it">per</span> to say why something is done, what something
        is intended for, or who something is meant for. This answers the question
        <span lang="it">perché?</span> (why? / what for?).


        **Pattern A — followed by an infinitive:** [main verb] + <span lang="it">per</span>
        + [infinitive] → means ''in order to do something''


        **Pattern B — followed by a noun:** [noun or verb] + <span lang="it">per</span>
        + [noun] → means ''for (the purpose of / intended for) something/someone''


        ## Formation notes


        Unlike <span lang="it">di</span>, <span lang="it">a</span>, <span lang="it">in</span>,
        and <span lang="it">su</span>, the preposition <span lang="it">per</span>
        does **not** combine with the definite articles (<span lang="it">il</span>,
        <span lang="it">la</span>, <span lang="it">i</span>, <span lang="it">le</span>,
        etc.) to form contracted forms. You always write it as a separate word.


        | Article | Contracted?  | Example |

        |---|---|---|

        | il | No — stays per il | per il treno (for the train) |

        | la | No — stays per la | per la mamma (for mum) |

        | i | No — stays per i | per i bambini (for the children) |

        | le | No — stays per le | per le vacanze (for the holidays) |


        This is an advantage for beginners: you never need to memorise merged forms
        for <span lang="it">per</span>.


        ## Examples


        **1. Destination (motion towards a place)**


        <span lang="it">Parto per Roma domani.</span>

        (I''m leaving for Rome tomorrow.)

        → The speaker is on their way to Rome; they haven''t arrived yet.


        <span lang="it">Il treno parte per Milano alle otto.</span>

        (The train leaves for Milan at eight.)

        → Classic use with transport and departure.


        **2. Purpose followed by an infinitive**


        <span lang="it">Studio l''italiano per parlare con la mia famiglia.</span>

        (I study Italian in order to speak with my family.)

        → <span lang="it">per</span> + infinitive clearly states the goal of the action.


        <span lang="it">Vado al supermercato per comprare il pane.</span>

        (I''m going to the supermarket to buy bread.)

        → Note that this sentence combines both uses: <span lang="it">al supermercato</span>
        is the destination (expressed with <span lang="it">a</span> + article here),
        while <span lang="it">per comprare</span> states the purpose.


        **3. Purpose followed by a noun (intended for something/someone)**


        <span lang="it">Questo regalo è per te.</span>

        (This gift is for you.)

        → <span lang="it">per</span> + pronoun to say who something is intended for.


        <span lang="it">Ho comprato il latte per la colazione.</span>

        (I bought the milk for breakfast.)

        → <span lang="it">per</span> + noun to say what the milk is meant for.


        ## Contrastive pair: ''per'' vs ''a''


        Both <span lang="it">per</span> and <span lang="it">a</span> can appear after
        verbs of motion, but they are not interchangeable:


        | Sentence | Meaning | Focus |

        |---|---|---|

        | Parto per Roma. | I''m leaving for Rome. | Destination — still travelling,
        not yet there |

        | Vado a Roma. | I''m going to Rome. | Movement towards and arrival in Rome
        |


        Use <span lang="it">per</span> especially with verbs like <span lang="it">partire</span>
        (to leave/depart) and <span lang="it">prendere</span> (to take), where the
        emphasis is on setting out rather than arriving. Use <span lang="it">a</span>
        with <span lang="it">andare</span> (to go) when you want to say you are going
        to and reaching a place.


        ## Common learner mistakes


        **Mistake 1 — Using <span lang="it">per</span> + infinitive with <span lang="it">andare</span>
        when the destination itself is enough:**


        <span lang="it">*Vado per il supermercato.</span> ✗

        <span lang="it">Vado al supermercato.</span> ✓ (I''m going to the supermarket.)

        → With <span lang="it">andare</span> and a place name or noun, use <span lang="it">a</span>
        (+ article if needed), not <span lang="it">per</span>. Reserve <span lang="it">per</span>
        for verbs of departure or when you want to add a purpose clause.


        **Mistake 2 — Forgetting the infinitive and using a conjugated verb after
        <span lang="it">per</span>:**


        <span lang="it">*Studio per parlo con la famiglia.</span> ✗

        <span lang="it">Studio per parlare con la famiglia.</span> ✓ (I study to speak
        with the family.)

        → After <span lang="it">per</span> expressing purpose, the verb must always
        be in the infinitive (the base form ending in <span lang="it">-are</span>,
        <span lang="it">-ere</span>, or <span lang="it">-ire</span>), never conjugated.


        **Mistake 3 — Trying to contract <span lang="it">per</span> with an article:**


        <span lang="it">*pel treno</span> ✗ (archaic / non-standard)

        <span lang="it">per il treno</span> ✓ (for the train)

        → You may occasionally see the old contracted form <span lang="it">pel</span>
        in literary texts, but it is not used in modern Italian. Always keep <span
        lang="it">per</span> separate from the article.'
      language: en
      why_this_matters: The preposition <span lang="it">per</span> is one of the nine
        core prepositions in Italian — the ones that exist only to link words together.
        Two of its most frequent jobs at A1 level are expressing destination ('heading
        to a place') and purpose ('in order to do something' or 'intended for someone/something').
        You will hear and read these uses in almost every conversation, from asking
        where someone is going to explaining why you are doing something. Without
        <span lang="it">per</span>, you cannot express these ideas naturally in Italian.
- code: prep_idiom
  cefr_level: A1
  category: preposizioni
  source_url: https://www.unistrapg.it/profilo_lingua_italiana/site/gram_preposizioni_a1.html
  unistr_code: uso_idiomatico_di_preposizioni_in_forme_di_uso_frequente_es_giocare_a
  unistr_label: Uso idiomatico di preposizioni in forme di uso frequente, es. giocare
    a
  chunk_ref: book_10_la_preposizione_preposizioni_proprie
  label: Uso idiomatico di preposizioni in forme frequenti
  explanations:
    en:
      title: Idiomatic prepositions in common phrases
      tip: Italian prepositions don't always match English ones — the same preposition
        can have many meanings depending on the phrase. Learning fixed combinations
        as whole chunks is the fastest way to get them right.
      explanation: 'Italian has nine core prepositions — called <span lang="it">preposizioni
        proprie</span> (proper prepositions) — and they are: <span lang="it">di, a,
        da, in, con, su, per, fra, tra</span>. Unlike English prepositions, which
        often translate one-to-one, Italian prepositions are highly idiomatic: the
        ''correct'' preposition depends on the fixed phrase, not on logic or direct
        translation.


        ## The nine core prepositions


        | Italian | Closest English equivalent(s) |

        |---|---|

        | di | of, from, about |

        | a | to, at, in (a city) |

        | da | from, since, at someone''s place |

        | in | in, to (a country/region), by (transport) |

        | con | with |

        | su | on, about |

        | per | for, in order to |

        | fra / tra | between, among, in (time from now) |


        Note: <span lang="it">fra</span> and <span lang="it">tra</span> are completely
        interchangeable in meaning. Italians choose between them mainly for sound
        — to avoid awkward repetition of similar sounds in the same phrase.


        ## Key rule: learn phrases as fixed chunks


        Because preposition use is largely idiomatic, the most reliable strategy at
        A1 level is to learn each high-frequency combination as a single unit. The
        sections below group the most important ones by meaning area.


        ### Telling time and scheduling — <span lang="it">a</span> and <span lang="it">di</span>


        Use <span lang="it">a</span> to say what time something happens: <span lang="it">a
        che ora? a mezzogiorno, alle tre</span> (at what time? at noon, at three o''clock).

        Use <span lang="it">di</span> for parts of the day: <span lang="it">di mattina,
        di sera, di notte</span> (in the morning, in the evening, at night).


        ### Location — <span lang="it">a</span>, <span lang="it">in</span>, <span
        lang="it">da</span>


        Use <span lang="it">a</span> with cities and small places: <span lang="it">a
        Roma, a casa</span> (in/at Rome, at home).

        Use <span lang="it">in</span> with countries, regions, and rooms: <span lang="it">in
        Italia, in cucina</span> (in Italy, in the kitchen).

        Use <span lang="it">da</span> to mean ''at someone''s place'': <span lang="it">da
        Marco, dal medico</span> (at Marco''s place, at the doctor''s).


        ### Means of transport — <span lang="it">in</span> and <span lang="it">a</span>


        Use <span lang="it">in</span> for enclosed vehicles: <span lang="it">in macchina,
        in autobus, in treno</span> (by car, by bus, by train).

        Use <span lang="it">a</span> for non-enclosed or human-powered transport:
        <span lang="it">a piedi, a bicicletta</span> (on foot, by bicycle).


        ### Duration and purpose — <span lang="it">per</span>


        Use <span lang="it">per</span> to express how long something lasts or why
        you do it: <span lang="it">per un''ora, per mangiare</span> (for an hour,
        in order to eat).


        ### Time from now — <span lang="it">fra / tra</span>


        Use <span lang="it">fra</span> or <span lang="it">tra</span> to say something
        will happen after a given interval: <span lang="it">fra cinque minuti, tra
        una settimana</span> (in five minutes, in a week).


        ## Examples


        <span lang="it">La lezione comincia alle nove di mattina.</span>

        (The lesson starts at nine in the morning.)

        → <span lang="it">alle</span> = <span lang="it">a + le</span> for clock time;
        <span lang="it">di mattina</span> for part of the day.


        <span lang="it">Vado a Roma in treno.</span>

        (I''m going to Rome by train.)

        → <span lang="it">a</span> for a city; <span lang="it">in</span> for an enclosed
        vehicle.


        <span lang="it">Mangio a casa di Marco.</span>

        (I''m eating at Marco''s house.)

        → <span lang="it">a casa</span> is a fixed phrase; <span lang="it">di Marco</span>
        specifies whose house.


        <span lang="it">Arrivo fra dieci minuti.</span>

        (I''ll arrive in ten minutes.)

        → <span lang="it">fra</span> signals future time from now, not duration.


        <span lang="it">Studio italiano per un''ora ogni sera.</span>

        (I study Italian for one hour every evening.)

        → <span lang="it">per</span> expresses duration; <span lang="it">ogni sera</span>
        is another fixed time phrase worth learning as a chunk.


        <span lang="it">Vado dal medico domani.</span>

        (I''m going to the doctor''s tomorrow.)

        → <span lang="it">da</span> meaning ''at/to someone''s place'' — never use
        <span lang="it">a</span> here.


        ## Common learner mistakes


        **Mistake 1 — translating <span lang="it">in</span> literally for cities**

        English says ''in Rome'', but Italian uses <span lang="it">a</span>: <span
        lang="it">a Roma</span>, not <span lang="it">*in Roma</span>. Reserve <span
        lang="it">in</span> for countries and regions: <span lang="it">in Italia</span>.


        **Mistake 2 — using <span lang="it">a</span> for ''by car''**

        English says ''by car'', which might suggest <span lang="it">a macchina</span>,
        but the correct form is <span lang="it">in macchina</span>. Only non-enclosed
        transport uses <span lang="it">a</span>: <span lang="it">a piedi</span>.


        **Mistake 3 — using <span lang="it">per</span> for ''in five minutes'' (future)**

        English ''in five minutes'' (meaning ''after five minutes'') is <span lang="it">fra
        cinque minuti</span>, not <span lang="it">*per cinque minuti</span>. <span
        lang="it">Per cinque minuti</span> means ''for five minutes'' (duration).


        **Mistake 4 — forgetting <span lang="it">da</span> for ''at someone''s place''**

        Saying ''at the doctor''s'' or ''at Anna''s'' requires <span lang="it">da</span>:
        <span lang="it">dal medico, da Anna</span>. Using <span lang="it">a</span>
        here is a common error with no direct English parallel to guide you — this
        one must be memorised.


        **Mistake 5 — confusing <span lang="it">di mattina</span> and <span lang="it">alle
        … di mattina</span>**

        <span lang="it">Di mattina</span> alone means ''in the morning (generally)''.
        When you give a clock time, you add both: <span lang="it">alle otto di mattina</span>
        (at eight in the morning). Don''t drop <span lang="it">alle</span> when a
        specific hour is mentioned.'
      language: en
      why_this_matters: Prepositions appear in almost every Italian sentence. Because
        they don't map neatly onto English equivalents, they are one of the most common
        sources of errors for beginners. Mastering the most frequent fixed combinations
        — for telling time, locations, means of transport, and daily routines — lets
        you build correct, natural-sounding sentences from day one instead of guessing
        and getting it wrong.
- code: prep_other
  cefr_level: A1
  category: preposizioni
  source_url: https://www.unistrapg.it/profilo_lingua_italiana/site/gram_preposizioni_a1.html
  unistr_code: altre_forme_preposizionali_es_senza_nota_acquisite_a_livello_formulaico
  unistr_label: 'Altre forme preposizionali, es. senza Nota: acquisite a livello formulaico'
  chunk_ref: book_10_la_preposizione_preposizioni_proprie
  label: Altre preposizioni semplici di uso formulaico
  explanations:
    en:
      title: Simple prepositions in everyday formulas
      tip: Italian has nine core prepositions — di, a, da, in, con, su, per, fra/tra
        — and you will meet them in fixed phrases from your very first lessons. Learning
        the most common phrase-by-phrase combinations now will let you speak naturally
        before you have mastered every grammatical rule behind them.
      explanation: '## The nine core prepositions


        Italian grammarians call these the <span lang="it">preposizioni proprie</span>
        (''proper prepositions'') because — with one small exception — they work exclusively
        as prepositions. They are:


        | Italian | Closest English equivalent(s) |

        |---|---|

        | di | of, from |

        | a | to, at |

        | da | from, by, since |

        | in | in, into, to |

        | con | with |

        | su | on, on top of |

        | per | for, through, in order to |

        | fra / tra | between, among, in (time) |


        <span lang="it">Fra</span> and <span lang="it">tra</span> are completely interchangeable
        in meaning; you may choose either one freely. The only reason to prefer one
        over the other is to avoid awkward-sounding repetition — for example, native
        speakers usually avoid saying <span lang="it">tra treni</span> and would choose
        <span lang="it">fra treni</span> instead.


        ## The one exception: su as an adverb


        All nine prepositions are used exclusively as prepositions, with one small
        exception: <span lang="it">su</span> can also function as an adverb meaning
        ''up''. You will see this in phrases like <span lang="it">vieni su!</span>
        (''come up!''). At A1 level you do not need to worry about this distinction
        — simply be aware that <span lang="it">su</span> sometimes stands alone without
        a following noun.


        ## Formulaic uses you need from day one


        At A1, the most practical approach is to learn these prepositions inside the
        fixed phrases you encounter most often. Below are the key formulas grouped
        by preposition.


        ### di — of, from


        <span lang="it">Di</span> shows possession or origin and appears in countless
        set expressions.


        - <span lang="it">un bicchiere di acqua</span> — a glass of water

        - <span lang="it">Sono di Roma.</span> — I am from Rome.

        - <span lang="it">di mattina</span> — in the morning (set time expression)


        ### a — to, at


        <span lang="it">A</span> expresses location (staying somewhere) or direction
        (going somewhere), and appears in greetings and time expressions.


        - <span lang="it">a casa</span> — at home

        - <span lang="it">a scuola</span> — at school

        - <span lang="it">a domani!</span> — see you tomorrow! (literally ''until
        tomorrow'')

        - <span lang="it">a presto!</span> — see you soon!

        - <span lang="it">alle tre</span> — at three o''clock


        ### da — from, by, since, at someone''s place


        <span lang="it">Da</span> is one of the most versatile prepositions. Its key
        formulaic uses at A1 are:


        - <span lang="it">Vengo da Milano.</span> — I come from Milan.

        - <span lang="it">da quanto tempo?</span> — since how long? / how long has
        it been?

        - <span lang="it">da stamattina</span> — since this morning

        - <span lang="it">da Maria</span> — at Maria''s place (used like French <span
        lang="it">chez</span>)


        ### in — in, to, into


        <span lang="it">In</span> is used with countries, rooms, and means of transport.


        - <span lang="it">in Italia</span> — in Italy / to Italy

        - <span lang="it">in cucina</span> — in the kitchen

        - <span lang="it">in autobus</span> — by bus


        ### con — with


        <span lang="it">Con</span> is the most straightforward preposition — it almost
        always means ''with''.


        - <span lang="it">con la famiglia</span> — with the family

        - <span lang="it">un caffè con latte</span> — a coffee with milk


        ### su — on


        - <span lang="it">Il libro è sul tavolo.</span> — The book is on the table.
        (Note: <span lang="it">sul</span> = <span lang="it">su + il</span>, a contracted
        form — see the note on contracted prepositions below.)


        ### per — for, in order to


        - <span lang="it">per favore</span> — please (literally ''as a favour'') —
        one of the most essential fixed phrases in Italian

        - <span lang="it">per te</span> — for you

        - <span lang="it">Studiamo per imparare.</span> — We study in order to learn.


        ### fra / tra — between, among, in (future time)


        - <span lang="it">fra due giorni</span> — in two days (time counted forward
        from now)

        - <span lang="it">tra amici</span> — among friends

        - <span lang="it">fra me e te</span> — between me and you


        ## Important: prepositions combine with articles


        Several prepositions merge with the definite article (<span lang="it">il,
        la, lo, i, gli, le</span>) to form a single contracted word called a <span
        lang="it">preposizione articolata</span> (''articulated preposition''). This
        is a separate rule, but you need to recognise these forms as soon as you start
        reading Italian.


        The most common contractions you will meet at A1:


        | Preposition + article | Contracted form | Example |

        |---|---|---|

        | di + il | del | del pane (some bread / of the bread) |

        | a + il | al | al bar (at the café) |

        | da + il | dal | dal medico (at the doctor''s) |

        | in + il | nel | nel parco (in the park) |

        | su + il | sul | sul tavolo (on the table) |


        <span lang="it">Con</span>, <span lang="it">per</span>, <span lang="it">fra</span>,
        and <span lang="it">tra</span> do **not** contract with the article in modern
        Italian — they always stay separate.


        ## Full examples with translations


        1. <span lang="it">Vado a scuola con mia sorella.</span> — I go to school
        with my sister.

        2. <span lang="it">Il gatto è sul divano.</span> — The cat is on the sofa.

        3. <span lang="it">Abito in Italia da tre anni.</span> — I have lived in Italy
        for three years. (<span lang="it">da</span> + time period = duration up to
        the present)

        4. <span lang="it">Un caffè per favore, senza zucchero.</span> — A coffee
        please, without sugar.

        5. <span lang="it">Arriviamo fra cinque minuti.</span> — We will arrive in
        five minutes.

        6. <span lang="it">Sei di Milano o di Roma?</span> — Are you from Milan or
        from Rome?


        ## Common learner mistakes


        **Mistake 1 — Confusing <span lang="it">a</span> and <span lang="it">in</span>
        for location.**

        English uses ''in'' for most places, but Italian uses <span lang="it">a</span>
        with cities and <span lang="it">in</span> with countries and rooms.

        - ✗ <span lang="it">*Sono in Roma.</span>

        - ✓ <span lang="it">Sono a Roma.</span> — I am in Rome.

        - ✓ <span lang="it">Sono in Italia.</span> — I am in Italy.


        **Mistake 2 — Translating ''for + time'' with <span lang="it">per</span> when
        you mean duration up to now.**

        When an action started in the past and is still happening, Italian uses <span
        lang="it">da</span>, not <span lang="it">per</span>.

        - ✗ <span lang="it">*Studio italiano per due anni.</span>

        - ✓ <span lang="it">Studio italiano da due anni.</span> — I have been studying
        Italian for two years.


        **Mistake 3 — Forgetting that <span lang="it">fra</span> and <span lang="it">tra</span>
        are identical in meaning.**

        Students sometimes assume one is more formal or more correct. They are fully
        interchangeable — choose whichever sounds better next to the words around
        it.


        **Mistake 4 — Writing contracted prepositions as two separate words.**

        - ✗ <span lang="it">*a il bar</span>

        - ✓ <span lang="it">al bar</span> — the contraction is mandatory, not optional.'
      language: en
      why_this_matters: Prepositions are the small words that glue sentences together,
        and in Italian they appear constantly — in greetings, times, places, and everyday
        requests. Even at the very beginning, you will need fixed phrases like <span
        lang="it">a casa</span> ('at home') or <span lang="it">per favore</span> ('please')
        long before you understand every rule that governs prepositions. Recognising
        these nine core words and their most common formulaic uses removes a huge
        source of early confusion and lets you communicate from day one.
