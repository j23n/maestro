  unistr_code: consapevolezza_dellomissione_del_soggetto_in_frasi_dichiarative_e_interrogative
  unistr_label: 'Consapevolezza dell’omissione del soggetto in frasi dichiarative
    e interrogative: Sono americano; vai al cinema ?'
  chunk_ref: book_7_il_pronome_pronomi_personali_pronomi_personali_soggetto
  label: Omissione del soggetto in frasi dichiarative e interrogative
  explanations:
    en:
      title: Dropping or keeping the subject pronoun
      tip: In Italian, you usually leave out the subject pronoun — the verb ending
        already tells you who is acting. Keep the pronoun only when you need to avoid
        confusion, contrast two subjects, or add emphasis.
      explanation: '## The basic rule: drop the pronoun by default


        Italian is a <span lang="it">lingua pro-drop</span> (a ''subject-dropping
        language''). Because each verb form has its own ending that identifies the
        person and number, the pronoun adds no new information and is normally left
        out.


        Compare English and Italian:


        | English (pronoun required) | Italiano (pronoun optional / usually dropped)
        |

        |---|---|

        | I speak | (Io) parlo |

        | You eat | (Tu) mangi |

        | He/She works | (Lui/Lei) lavora |

        | We are | (Noi) siamo |

        | You (pl.) have | (Voi) avete |

        | They go | (Loro) vanno |


        The forms in parentheses are grammatically correct but are usually omitted
        in normal speech and writing.


        ## When you MUST keep the pronoun


        There are three clear situations where the subject pronoun is required or
        strongly preferred.


        ### 1. Contrasting two different subjects


        When two clauses follow each other with different subjects, the pronoun makes
        it clear who does what:


        > <span lang="it">Lui va in montagna, io vado al mare.</span>

        > (He is going to the mountains; I am going to the sea.)


        Without <span lang="it">lui</span> and <span lang="it">io</span>, the sentence
        would be confusing because both verbs could belong to the same person.


        ### 2. Emphasis on who is acting


        When you want to stress that it is a particular person — and not someone else
        — who performs the action, you keep the pronoun. This is especially common
        after words like <span lang="it">anche</span> (''also''), <span lang="it">neanche</span>
        (''not even''), and <span lang="it">pure</span> (''too/also''):


        > <span lang="it">Sei stato tu a dire questo.</span>

        > (It was YOU who said this — not someone else.)


        > <span lang="it">È venuta anche lei.</span>

        > (She came too.)


        ### 3. Avoiding ambiguity


        Some verb forms are identical across different persons. In those cases, dropping
        the pronoun can make the sentence unclear:


        > <span lang="it">È bene che vada.</span>

        > (It is good that [someone] goes.) — Who? The pronoun is needed to clarify:
        <span lang="it">È bene che tu vada</span> / <span lang="it">È bene che lui
        vada</span>, etc.


        ## The subject pronouns: full list and notes on the third person


        The Italian subject pronouns are:


        | Person | Singular | Plural |

        |---|---|---|

        | 1st | io (I) | noi (we) |

        | 2nd | tu (you, informal) | voi (you all) |

        | 3rd masc. | lui / egli / esso (he / it) | loro / essi (they) |

        | 3rd fem. | lei / ella / essa (she / it) | loro / esse (they) |


        **Important note on the third person:** Historically, <span lang="it">egli</span>
        (he) and <span lang="it">ella</span> (she) were the ''correct'' forms for
        referring to people, while <span lang="it">esso / essa</span> were reserved
        for animals and things. Today, <span lang="it">egli</span> and <span lang="it">ella</span>
        are very rare — even in writing — and have been largely replaced by <span
        lang="it">lui</span> and <span lang="it">lei</span>. At A1 level, use <span
        lang="it">lui</span> and <span lang="it">lei</span> without hesitation.


        **Rule for obligatory third-person pronouns:** Whenever the situation requires
        a subject pronoun in the third person (contrast, emphasis, clarity), the only
        acceptable forms are <span lang="it">lui</span>, <span lang="it">lei</span>,
        and <span lang="it">loro</span>:


        > <span lang="it">Io sono italiana, lui è francese.</span>

        > (I am Italian; he is French.)


        ## Reinforced pronouns


        Subject pronouns can be strengthened by adding <span lang="it">stesso</span>
        (''himself/herself/myself'', etc.) after any pronoun:


        > <span lang="it">io stesso, tu stesso, lui stesso, lei stessa, noi stessi,
        voi stessi, loro stessi</span>


        There are also the combined forms <span lang="it">noialtri</span> and <span
        lang="it">voialtri</span> (written as one word), used regionally or for extra
        emphasis on ''we'' and ''you all'' as a group. These are less common and not
        essential at A1.


        ## Full examples covering main uses


        **Pronoun dropped (normal default):**


        > <span lang="it">Mangio la pizza.</span>

        > (I am eating pizza.) — <span lang="it">Io</span> is omitted; the ending
        <span lang="it">-o</span> already signals first person singular.


        > <span lang="it">Parli italiano?</span>

        > (Do you speak Italian?) — <span lang="it">Tu</span> is dropped in the question;
        the <span lang="it">-i</span> ending identifies second person singular.


        **Pronoun kept for contrast:**


        > <span lang="it">Lei beve il caffè, io bevo il tè.</span>

        > (She drinks coffee; I drink tea.) — Two different subjects require the pronouns
        to be explicit.


        **Pronoun kept for emphasis:**


        > <span lang="it">L''ho fatto io!</span>

        > (I did it! / It was ME who did it!) — <span lang="it">Io</span> placed after
        the verb for strong emphasis.


        **After <span lang="it">anche</span>:**


        > <span lang="it">Viene anche lui alla festa?</span>

        > (Is he coming to the party too?) — The pronoun is required after <span lang="it">anche</span>.


        **Avoiding ambiguity (contrastive pair):**


        > <span lang="it">Spero che vada bene.</span>

        > (I hope it goes well.) — Here no specific person is implied; the sentence
        is fine.


        > <span lang="it">È importante che tu vada adesso.</span>

        > (It is important that YOU go now.) — Without <span lang="it">tu</span>,
        it would be unclear who must go.


        ## Common learner mistakes


        **Mistake 1 — Always copying English and using the pronoun:**

        Learners whose first language requires a subject (e.g. English, French) often
        write <span lang="it">Io mangio, io bevo, io dormo</span> in every sentence.
        This is not wrong, but it sounds unnatural and over-emphatic. Drop it unless
        one of the three conditions above applies.


        **Mistake 2 — Using <span lang="it">egli</span> or <span lang="it">ella</span>
        in speech:**

        Students who learn from older textbooks may use <span lang="it">egli</span>
        and <span lang="it">ella</span> in conversation. These forms sound archaic
        or overly literary today. Use <span lang="it">lui</span> and <span lang="it">lei</span>
        instead.


        **Mistake 3 — Confusing <span lang="it">lei</span> (she) with <span lang="it">Lei</span>
        (formal ''you''):**

        The pronoun <span lang="it">Lei</span> (with a capital L) is also used as
        the formal second-person singular (''you'', polite). In writing, the capital
        letter marks the difference; in speech, context makes it clear. This is a
        separate topic, but be aware that <span lang="it">lei</span> and <span lang="it">Lei</span>
        are distinct uses of the same word.


        **Mistake 4 — Dropping the pronoun when it is needed for clarity:**

        In a sentence like <span lang="it">Quando lavoro, non voglio essere disturbato</span>,
        dropping both pronouns is fine — the context is clear. But in <span lang="it">Lui
        va in montagna, vado al mare</span>, omitting <span lang="it">io</span> from
        the second clause is confusing because the subject shifts. Keep <span lang="it">io</span>
        whenever the subject changes mid-sentence.'
      language: en
      why_this_matters: 'Italian verb endings carry so much information that repeating
        the subject pronoun is usually unnecessary — and leaving it out is what sounds
        natural. From your very first lessons you will see sentences like <span lang="it">Parlo
        italiano</span> instead of <span lang="it">Io parlo italiano</span>, and you
        may wonder whether the pronoun has been forgotten. It has not: dropping it
        is the default. Understanding when to drop it — and when to keep it — removes
        one of the most persistent sources of unnatural-sounding Italian among beginners.'
