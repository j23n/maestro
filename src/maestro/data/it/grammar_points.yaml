- code: pron_inter
  cefr_level: A1
  category: pronomi
  source_url: https://www.unistrapg.it/profilo_lingua_italiana/site/gram_pronomi_a1.html
  unistr_code: pronomi_interrogativi_chi_che_cosa_quanto_quale
  unistr_label: 'Pronomi interrogativi: chi, che (cosa), quanto, quale?'
  chunk_ref: book_7_il_pronome_pronomi_interrogativi
  label: Pronomi interrogativi chi, che, quanto, quale
  explanations:
    en:
      title: 'Interrogative pronouns: chi, che, quanto, quale'
      tip: 'Italian has four main question pronouns: ''chi'' (who), ''che'' (what,
        for things), ''quale'' (which one), and ''quanto'' (how much/many). Each one
        covers a specific type of question, so choosing the right one depends on whether
        you are asking about a person, a thing, an identity, or a quantity.'
      explanation: '## The four interrogative pronouns


        Italian has four core interrogative pronouns. Unlike interrogative adjectives,
        which accompany a noun, interrogative pronouns stand alone in place of a noun
        — they replace it entirely.


        | Pronoun | Meaning | Refers to |

        |---|---|---|

        | chi | who / whom | people and animate beings only |

        | che | what | things only |

        | quale / quali | which one / which ones | people or things (asking for identity)
        |

        | quanto / quanta / quanti / quante | how much / how many | people or things
        (asking for quantity) |


        ## Chi — who, whom


        Use <span lang="it">chi</span> to ask about a person or animate being. It
        is invariable — it never changes its form, regardless of number or gender.
        It can function as the subject of the sentence (''who'') or as the object
        (''whom''), including after a preposition (''to whom'', ''with whom'', ''for
        whom'', etc.).


        As subject:

        <span lang="it">Chi è quella ragazza?</span> (Who is that girl?)


        As object:

        <span lang="it">Chi cerchi?</span> (Who are you looking for?)


        After a preposition:

        <span lang="it">A chi parli?</span> (Who are you talking to? / To whom are
        you talking?)

        <span lang="it">Con chi vieni?</span> (Who are you coming with?)


        Important: <span lang="it">chi</span> is always singular in form, even when
        the answer might be plural. The verb that follows agrees with the expected
        answer, not with <span lang="it">chi</span> itself — but in simple A1 questions
        this rarely causes difficulty.


        ## Che — what


        Use <span lang="it">che</span> to ask about things. Like <span lang="it">chi</span>,
        it is completely invariable. It cannot refer to people when used as an interrogative
        pronoun.


        <span lang="it">Che dici?</span> (What are you saying?)

        <span lang="it">Che mangi stasera?</span> (What are you eating tonight?)


        You will also see the longer form <span lang="it">che cosa</span> (''what
        thing'') and the form <span lang="it">cosa</span> used alone. All three —
        <span lang="it">che</span>, <span lang="it">che cosa</span>, and <span lang="it">cosa</span>
        — mean ''what'' and are interchangeable in everyday speech.


        <span lang="it">Che cosa fai?</span> = <span lang="it">Cosa fai?</span> =
        <span lang="it">Che fai?</span> (What are you doing?)


        ## Quale / Quali — which one, which ones


        Use <span lang="it">quale</span> (singular) or <span lang="it">quali</span>
        (plural) to ask someone to identify a specific person or thing from a set.
        It can refer to both people and things.


        <span lang="it">Ho due fratelli. Quale preferisci?</span> (I have two brothers.
        Which one do you prefer?)

        <span lang="it">Ci sono molte pizze. Quali vuoi?</span> (There are many pizzas.
        Which ones do you want?)


        Note: before the verb <span lang="it">è</span> (is), <span lang="it">quale</span>
        drops the final <span lang="it">-e</span> and becomes <span lang="it">qual</span>
        — no apostrophe is used:

        <span lang="it">Qual è il tuo nome?</span> (What is your name? / Which is
        your name?) — NOT <span lang="it">*quale è</span> and NOT <span lang="it">*qual''è</span>.


        ## Quanto / Quanta / Quanti / Quante — how much, how many


        Use <span lang="it">quanto</span> to ask about quantity or number. Unlike
        <span lang="it">chi</span> and <span lang="it">che</span>, <span lang="it">quanto</span>
        changes to agree in gender and number with the noun it replaces:


        | Form | Gender / Number | Example |

        |---|---|---|

        | quanto | masculine singular | Quanto costa? (How much does it cost?) |

        | quanta | feminine singular | Quanta ne vuoi? (How much of it do you want?)
        |

        | quanti | masculine plural | Quanti siete? (How many of you are there?) |

        | quante | feminine plural | Quante sono? (How many are there?) |


        ## Use as exclamatory pronouns


        All four pronouns can also be used in exclamations rather than questions.
        The form and meaning stay the same — only the context and punctuation change.


        <span lang="it">Chi l''avrebbe detto!</span> (Who would have thought it!)

        <span lang="it">Quanti sono!</span> (There are so many of them!)


        ## Examples covering the main uses


        1. <span lang="it">Chi è tua madre?</span> — Who is your mother? (<span lang="it">chi</span>
        as subject, referring to a person)


        2. <span lang="it">A chi scrivi?</span> — Who are you writing to? (<span lang="it">chi</span>
        after a preposition)


        3. <span lang="it">Che mangi a colazione?</span> — What do you eat for breakfast?
        (<span lang="it">che</span> referring to a thing)


        4. <span lang="it">Qual è la tua borsa?</span> — Which one is your bag? (<span
        lang="it">quale</span> asking for identity, with elision before <span lang="it">è</span>)


        5. <span lang="it">Quanti vengono alla festa?</span> — How many people are
        coming to the party? (<span lang="it">quanti</span>, masculine plural, asking
        for number)


        6. Contrastive pair — <span lang="it">chi</span> vs <span lang="it">che</span>:

        <span lang="it">Chi hai incontrato?</span> — Who did you meet? (a person)

        <span lang="it">Che hai mangiato?</span> — What did you eat? (a thing)


        ## Common learner mistakes


        **Mistake 1: Using <span lang="it">che</span> to ask about people**

        Incorrect: <span lang="it">*Che è tuo padre?</span>

        Correct: <span lang="it">Chi è tuo padre?</span> (Who is your father?)

        Remember: <span lang="it">che</span> refers only to things; <span lang="it">chi</span>
        refers only to people.


        **Mistake 2: Writing <span lang="it">qual''è</span> with an apostrophe**

        Incorrect: <span lang="it">*Qual''è il problema?</span>

        Correct: <span lang="it">Qual è il problema?</span> — no apostrophe. This
        is not an elision (vowel dropped); it is simply the standard short form of
        <span lang="it">quale</span> before <span lang="it">è</span>.


        **Mistake 3: Treating <span lang="it">quanto</span> as invariable**

        Incorrect: <span lang="it">*Quanto persone vengono?</span>

        Correct: <span lang="it">Quante persone vengono?</span> — <span lang="it">persone</span>
        is feminine plural, so <span lang="it">quanto</span> must become <span lang="it">quante</span>.


        **Mistake 4: Confusing <span lang="it">quale</span> (pronoun) with <span lang="it">quale</span>
        (adjective)**

        As a pronoun, <span lang="it">quale</span> stands alone: <span lang="it">Quale
        preferisci?</span> (Which one do you prefer?)

        As an adjective, it accompanies a noun: <span lang="it">Quale pizza preferisci?</span>
        (Which pizza do you prefer?)

        Both are correct — just make sure you are not omitting the noun by accident
        when you need the adjective form.'
      language: en
      why_this_matters: Every conversation involves questions. Without interrogative
        pronouns — the words for 'who', 'what', 'which one', and 'how much' — you
        cannot ask who someone is, what they want, which option they prefer, or how
        many people are coming. These four pronouns appear in almost every exchange
        you will have in Italian, from greetings to shopping to making plans, so getting
        them right from the start saves you from constant confusion.
- code: pron_indef
  cefr_level: A1
