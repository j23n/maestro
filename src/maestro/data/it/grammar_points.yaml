  unistr_code: pronomi_indefiniti_nessuno_niente_nota_i_pronomi_tonici_preceduti_da
  unistr_label: 'Pronomi indefiniti: nessuno, niente Nota: i pronomi tonici preceduti
    da preposizione (es. per me) e i pronomi atoni in alcune strutture (es. lo so)
    vengono acquisiti a livello A1 quali formule non analizzate Nota: i pronomi riflessivi
