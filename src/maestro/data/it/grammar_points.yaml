- code: qual_o_a_e
  cefr_level: A1
  category: aggettivi
  source_url: https://www.unistrapg.it/profilo_lingua_italiana/site/gram_aggettivi_a1.html
  unistr_code: aggettivi_qualificativi_a_suffisso_o_e_a_e_a_suffisso_-e
  unistr_label: Aggettivi qualificativi a suffisso –O e –A e a suffisso -E
  chunk_ref: book_6_l_aggettivo
  label: Aggettivo qualificativo con suffisso o, a, e
  explanations:
    en:
      title: 'Qualifying adjectives: forms and agreement'
      tip: Qualifying adjectives must match the noun they describe in both gender
        and number. Most adjectives have four forms ending in -o, -a, -i, -e. Always
        change the ending to match the noun.
      explanation: '## What a qualifying adjective is


        A qualifying adjective (<span lang="it">aggettivo qualificativo</span>, ''quality
        adjective'') is a word that describes a quality of a noun: its size, colour,
        character, or condition. In Italian, every adjective must <span lang="it">accordarsi</span>
        (''agree'') with the noun it modifies — that is, it must take the same gender
        (masculine or feminine) and the same number (singular or plural) as that noun.


        ## The four-form adjective (-o type)


        Most Italian adjectives belong to the <span lang="it">-o</span> class. They
        have four distinct forms:


        | | Singular | Plural |

        |---|---|---|

        | Masculine | -o | -i |

        | Feminine | -a | -e |


        Take the adjective <span lang="it">alto</span> (''tall'') as a model:


        | | Singular | Plural |

        |---|---|---|

        | Masculine | alto | alti |

        | Feminine | alta | alte |


        The same pattern applies to adjectives such as <span lang="it">piccolo</span>
        (''small''), <span lang="it">nuovo</span> (''new''), <span lang="it">brutto</span>
        (''ugly''), <span lang="it">stanco</span> (''tired''), <span lang="it">buono</span>
        (''good''), and <span lang="it">cattivo</span> (''bad'').


        ## The two-form adjective (-e type)


        A second group of adjectives ends in <span lang="it">-e</span> in the singular
        and <span lang="it">-i</span> in the plural. These adjectives have the same
        form for masculine and feminine:


        | | Singular | Plural |

        |---|---|---|

        | Masculine | -e | -i |

        | Feminine | -e | -i |


        Take <span lang="it">grande</span> (''big, great'') as a model:


        | | Singular | Plural |

        |---|---|---|

        | Masculine | grande | grandi |

        | Feminine | grande | grandi |


        Other common adjectives of this type: <span lang="it">felice</span> (''happy''),
        <span lang="it">triste</span> (''sad''), <span lang="it">verde</span> (''green''),
        <span lang="it">dolce</span> (''sweet''), <span lang="it">giovane</span> (''young''),
        <span lang="it">forte</span> (''strong'').


        ## How adjectives agree with nouns


        The rule is simple: look at the noun, identify its gender and number, then
        choose the matching adjective ending.


        - A masculine singular noun takes an adjective in <span lang="it">-o</span>
        (or <span lang="it">-e</span> for the second group).

        - A feminine singular noun takes an adjective in <span lang="it">-a</span>
        (or <span lang="it">-e</span> for the second group).

        - A masculine plural noun takes an adjective in <span lang="it">-i</span>.

        - A feminine plural noun takes an adjective in <span lang="it">-e</span> (first
        group) or <span lang="it">-i</span> (second group).


        When an adjective modifies two or more nouns of different genders, use the
        masculine plural form:

        <span lang="it">Marco e Maria sono stanchi.</span> (Marco and Maria are tired.)


        ## Where the adjective goes


        In Italian, the qualifying adjective usually comes after the noun: <span lang="it">un
        ragazzo alto</span> (''a tall boy''), <span lang="it">una pizza buona</span>
        (''a good pizza''). This is the safe, default word order for A1 learners.
        Some very common adjectives — such as <span lang="it">bello</span> (''beautiful''),
        <span lang="it">buono</span> (''good''), <span lang="it">grande</span> (''great''),
        <span lang="it">piccolo</span> (''small''), and <span lang="it">brutto</span>
        (''ugly'') — can also precede the noun without changing the essential meaning,
        though adjective-before-noun tends to sound more descriptive and adjective-after-noun
        tends to be more specific or contrastive. At A1, placing the adjective after
        the noun is always correct.


        ## Invariable adjectives (no ending change)


        A small but important group of adjectives never change their ending, regardless
        of the gender or number of the noun. The most common at A1 are certain colour
        adjectives: <span lang="it">rosa</span> (''pink''), <span lang="it">blu</span>
        (''blue''), <span lang="it">viola</span> (''violet''), <span lang="it">lilla</span>
        (''lilac''). These are called <span lang="it">aggettivi invariabili</span>
        (''invariable adjectives''):

        <span lang="it">una scarpa rosa / due scarpe rosa / un fiore rosa / tre fiori
        rosa.</span> (''a pink shoe / two pink shoes / a pink flower / three pink
        flowers'') — the adjective stays <span lang="it">rosa</span> throughout.


        ## Examples


        1. <span lang="it">Il fratello è alto.</span> — ''The brother is tall.'' (masculine
        singular: <span lang="it">alto</span>)


        2. <span lang="it">La sorella è alta.</span> — ''The sister is tall.'' (feminine
        singular: <span lang="it">alta</span>)


        3. <span lang="it">I bambini sono stanchi.</span> — ''The children are tired.''
        (masculine plural: <span lang="it">stanchi</span>)


        4. <span lang="it">Le ragazze sono felici.</span> — ''The girls are happy.''
        (feminine plural, <span lang="it">-e</span> type adjective: <span lang="it">felici</span>
        — same form as masculine plural)


        5. Contrastive pair — <span lang="it">-o</span> type vs <span lang="it">-e</span>
        type in the feminine:

        <span lang="it">La pizza è buona e dolce.</span> — ''The pizza is good and
        sweet.'' (<span lang="it">buona</span>: feminine singular of <span lang="it">buono</span>,
        <span lang="it">-o</span> type; <span lang="it">dolce</span>: feminine singular
        of <span lang="it">dolce</span>, <span lang="it">-e</span> type — no change
        from masculine)


        6. Invariable colour adjective:

        <span lang="it">Ho una borsa blu e due scarpe blu.</span> — ''I have a blue
        bag and two blue shoes.'' (<span lang="it">blu</span> does not change)


        ## Common learner mistakes


        **Mistake 1 — treating all adjectives as four-form:**

        Learners sometimes add an <span lang="it">-a</span> ending to a two-form adjective
        in the feminine:

        <span lang="it">✗ La ragazza è felica.</span>

        <span lang="it">✓ La ragazza è felice.</span> — ''The girl is happy.''

        Adjectives ending in <span lang="it">-e</span> do not change between masculine
        and feminine. Only the singular → plural change (<span lang="it">-e</span>
        → <span lang="it">-i</span>) applies.


        **Mistake 2 — forgetting to change the adjective at all:**

        Using the masculine singular form everywhere is a very frequent error:

        <span lang="it">✗ Le ragazze sono stanco.</span>

        <span lang="it">✓ Le ragazze sono stanche.</span> — ''The girls are tired.''
        (feminine plural: <span lang="it">stanche</span>)


        **Mistake 3 — changing invariable colour adjectives:**

        <span lang="it">✗ Ho due scarpe rosei.</span>

        <span lang="it">✓ Ho due scarpe rosa.</span> — ''I have two pink shoes.''
        (<span lang="it">rosa</span> never changes)

        Note: <span lang="it">rosso</span> (''red'') is a regular four-form adjective
        (<span lang="it">rosso, rossa, rossi, rosse</span>) — do not confuse it with
        invariable <span lang="it">rosa</span> (''pink'').


        **Mistake 4 — mixed-gender nouns: using feminine plural:**

        <span lang="it">✗ Il papà e la mamma sono alte.</span>

        <span lang="it">✓ Il papà e la mamma sono alti.</span> — ''Dad and mum are
        tall.'' (at least one masculine noun → use masculine plural adjective)'
      language: en
      why_this_matters: Adjectives are everywhere in Italian. You need them to describe
        people, places, food, and feelings — the most basic things you want to say.
        Without knowing how to change the adjective ending to match the noun, almost
        every descriptive sentence you produce will contain an error. Master this
        rule and a huge part of Italian description becomes available to you immediately.
  prerequisites:
  - noun_o_a_e
- code: poss_adj
  cefr_level: A1
  category: aggettivi
  source_url: https://www.unistrapg.it/profilo_lingua_italiana/site/gram_aggettivi_a1.html
  unistr_code: aggettivi_possessivi
  unistr_label: Aggettivi possessivi
  chunk_ref: book_6_l_aggettivo_aggettivi_possessivi
  label: Aggettivo possessivo
  explanations:
    en:
      title: 'Possessive adjectives: my, your, his, her…'
      tip: Possessive adjectives in Italian agree in gender and number with the thing
        owned, not the owner. They almost always appear with a definite article in
        front of them — except with singular, unmodified family members.
      explanation: 'Possessive adjectives tell you who something belongs to. Italian
        has a full set of them, and they work quite differently from English ones
        — they must agree with the noun they describe, and they almost always travel
        with a definite article. Getting these right will let you talk about your
        family, your things, and your daily life from your very first conversations.


        ## The full set of forms


        Each possessive has four forms: masculine singular, feminine singular, masculine
        plural, feminine plural. The article in front agrees with the noun in gender
        and number in the normal way.


        | Person | Masc. sg. | Fem. sg. | Masc. pl. | Fem. pl. |

        |---|---|---|---|---|

        | I (my) | il mio | la mia | i miei | le mie |

        | you sg. (your) | il tuo | la tua | i tuoi | le tue |

        | he/she/it (his/her/its) | il suo | la sua | i suoi | le sue |

        | we (our) | il nostro | la nostra | i nostri | le nostre |

        | you pl. (your) | il vostro | la vostra | i vostri | le vostre |

        | they (their) | il loro | la loro | i loro | le loro |


        Notice that <span lang="it">loro</span> never changes its ending — only the
        article changes. All other possessives agree fully with the noun.


        ## The key rule: agreement follows the object, not the owner


        In English, ''his'' or ''her'' depends on the sex of the owner. In Italian,
        <span lang="it">suo / sua / suoi / sue</span> depends entirely on the gender
        and number of the thing owned. So ''his bag'' and ''her bag'' are both <span
        lang="it">la sua borsa</span> — because <span lang="it">borsa</span> (bag)
        is feminine. Context or earlier mention tells you whose it is.


        ## The article rule — and the big exception


        Italian possessive adjectives are almost always preceded by the appropriate
        definite article (<span lang="it">il, la, i, le,</span> etc.).


        **Exception — singular, unmodified family members:** When the noun is a singular
        family-member noun in its basic, unmodified form, the article is dropped.


        Family-member nouns that trigger this rule include: <span lang="it">madre</span>
        (mother), <span lang="it">padre</span> (father), <span lang="it">sorella</span>
        (sister), <span lang="it">fratello</span> (brother), <span lang="it">figlia</span>
        (daughter), <span lang="it">figlio</span> (son), <span lang="it">moglie</span>
        (wife), <span lang="it">marito</span> (husband), <span lang="it">nonna</span>
        (grandmother), <span lang="it">nonno</span> (grandfather), <span lang="it">zia</span>
        (aunt), <span lang="it">zio</span> (uncle).


        The article **stays** when any of the following is true:

        - the noun is **plural**: <span lang="it">i miei fratelli</span> (my brothers)

        - the possessive is <span lang="it">**loro**</span>: <span lang="it">il loro
        padre</span> (their father)

        - the noun has a **suffix** (diminutive, etc.): <span lang="it">il mio fratellino</span>
        (my little brother)

        - the noun is modified by an **adjective**: <span lang="it">la mia cara sorella</span>
        (my dear sister)


        ## Examples


        <span lang="it">Dov''è il mio zaino?</span> (Where is my backpack?) — article
        present; <span lang="it">zaino</span> is not a family noun.


        <span lang="it">Questa è mia sorella.</span> (This is my sister.) — no article;
        singular, unmodified family noun with <span lang="it">mio/mia</span>.


        <span lang="it">Ho parlato con i miei genitori.</span> (I spoke with my parents.)
        — article present because the noun is plural.


        <span lang="it">Lui mangia a casa sua ogni sera.</span> (He eats at his own
        home every evening.) — <span lang="it">sua</span> agrees with <span lang="it">casa</span>
        (feminine), not with ''he''.


        <span lang="it">Come si chiama il loro cane?</span> (What is their dog''s
        name?) — article stays because the possessive is <span lang="it">loro</span>.


        <span lang="it">La nostra scuola è grande.</span> (Our school is big.) — <span
        lang="it">nostra</span> agrees with <span lang="it">scuola</span> (feminine
        singular).


        ## The special possessive ''proprio''


        The adjective <span lang="it">proprio</span> (one''s own) can replace <span
        lang="it">suo</span> or <span lang="it">loro</span> when the possessive refers
        back to the subject of the same sentence. It is especially preferred when
        using <span lang="it">suo</span> or <span lang="it">loro</span> would be ambiguous,
        or when the subject is indefinite (e.g. <span lang="it">ognuno</span> — everyone,
        <span lang="it">nessuno</span> — no one).


        Compare these two sentences:


        <span lang="it">Francesco parlò con Giuseppe, poi telefonò a sua sorella.</span>
        (Francesco spoke with Giuseppe, then called his sister.) — Ambiguous: whose
        sister?


        <span lang="it">Francesco parlò con Giuseppe, poi telefonò alla propria sorella.</span>
        (Francesco spoke with Giuseppe, then called his own sister.) — Clear: Francesco''s
        sister.


        With an indefinite subject: <span lang="it">Ognuno ha il diritto di seguire
        la propria strada.</span> (Everyone has the right to follow their own path.)


        Like all other possessives, <span lang="it">proprio</span> agrees in gender
        and number with the noun it modifies: <span lang="it">proprio, propria, propri,
        proprie</span>.


        ## The invariable ''altrui''


        Italian also has <span lang="it">altrui</span> (someone else''s / other people''s),
        which functions as a possessive adjective. It has only one form — it never
        changes for gender or number — and it usually follows the noun rather than
        preceding it: <span lang="it">fare la volontà altrui</span> (to do another''s
        will); <span lang="it">acconsentire agli altrui desideri</span> (to agree
        to other people''s wishes). At A1 level you mainly need to recognise it; active
        use comes later.


        ## Common learner mistakes


        **Mistake 1 — Agreeing with the owner instead of the object:**

        ❌ <span lang="it">Maria ha perso il suo borsa.</span> — wrong; <span lang="it">borsa</span>
        is feminine.

        ✅ <span lang="it">Maria ha perso la sua borsa.</span> (Maria lost her bag.)


        **Mistake 2 — Forgetting the article with non-family nouns:**

        ❌ <span lang="it">Dov''è mio libro?</span>

        ✅ <span lang="it">Dov''è il mio libro?</span> (Where is my book?)


        **Mistake 3 — Adding the article with singular, unmodified family nouns:**

        ❌ <span lang="it">Questa è la mia madre.</span>

        ✅ <span lang="it">Questa è mia madre.</span> (This is my mother.)


        **Mistake 4 — Changing <span lang="it">loro</span> to agree with the noun:**

        ❌ <span lang="it">la lora casa / i lori libri</span> — <span lang="it">loro</span>
        is invariable.

        ✅ <span lang="it">la loro casa</span> (their house), <span lang="it">i loro
        libri</span> (their books).


        **Mistake 5 — Translating ''his'' / ''her'' as different words:**

        ❌ Thinking that ''his book'' and ''her book'' use different Italian words.

        ✅ Both are <span lang="it">il suo libro</span>. The gender of the owner is
        irrelevant; only the noun matters.'
      language: en
      why_this_matters: You will need possessive adjectives constantly — to say 'my
        bag', 'her mother', 'our house', 'their names'. Without them you cannot describe
        possession, relationships, or anything that belongs to someone. Because Italian
        possessives behave very differently from English ones (they agree with the
        object, not the owner; they carry an article; 'his' and 'her' are the same
        word), this is one of the rules where learners make the most errors — and
        getting it right early removes a huge source of confusion.
  prerequisites:
  - noun_o_a_e
  - all_det_in
- code: dem_questo
  cefr_level: A1
  category: aggettivi
  source_url: https://www.unistrapg.it/profilo_lingua_italiana/site/gram_aggettivi_a1.html
  unistr_code: aggettivi_dimostrativi_questo_quello
  unistr_label: 'Aggettivi dimostrativi: questo, quello'
  chunk_ref: book_6_l_aggettivo_aggettivi_dimostrativi
  label: Aggettivo dimostrativo questo e quello
  explanations:
    en:
      title: 'Demonstrative adjectives: questo and quello'
      tip: Use 'questo' (this/these) for people or things close to you, and 'quello'
        (that/those) for people or things far away. Both adjectives must agree in
        gender and number with the noun they describe.
      explanation: '## The core rule


        In Italian, demonstrative adjectives agree in **gender** (masculine or feminine)
        and **number** (singular or plural) with the noun they modify. The two main
        demonstrative adjectives are:


        - <span lang="it">**questo**</span> — ''this / these'': points to someone
        or something **close to the speaker**

        - <span lang="it">**quello**</span> — ''that / those'': points to someone
        or something **far from the speaker**


        ## Forms of questo


        The forms of <span lang="it">questo</span> follow the regular pattern of a
        first/second-declension adjective. Before a vowel, the singular forms <span
        lang="it">questo</span> and <span lang="it">questa</span> may drop their final
        vowel and add an apostrophe (<span lang="it">quest''</span>), though the full
        form is always acceptable too.


        | | Masculine | Feminine |

        |---|---|---|

        | Singular | questo | questa |

        | Plural | questi | queste |


        Before a vowel (optional elision):


        | | Masculine | Feminine |

        |---|---|---|

        | Singular before vowel | quest'' | quest'' |


        Example: <span lang="it">quest''uomo</span> (this man), <span lang="it">quest''arancia</span>
        (this orange). The plural forms <span lang="it">questi</span> and <span lang="it">queste</span>
        are **never** elided.


        ## Forms of quello


        The forms of <span lang="it">quello</span> follow the same pattern as the
        definite article (<span lang="it">il, lo, la, i, gli, le</span>). This is
        the trickiest part: the form changes depending on the first letter(s) of the
        noun that follows.


        | Context | Masculine Singular | Masculine Plural | Feminine Singular | Feminine
        Plural |

        |---|---|---|---|---|

        | before most consonants | quel | quei | quella | quelle |

        | before s+consonant, z, ps, gn, x, y | quello | quegli | quella | quelle
        |

        | before a vowel | quell'' | quegli | quell'' | quelle |


        A simple way to remember this: the form of <span lang="it">quello</span> before
        the noun mirrors whichever definite article (<span lang="it">il → quel</span>,
        <span lang="it">lo → quello</span>, <span lang="it">l'' → quell''</span>,
        <span lang="it">i → quei</span>, <span lang="it">gli → quegli</span>, <span
        lang="it">la → quella</span>, <span lang="it">le → quelle</span>) that noun
        would normally take.


        ## Examples


        **1. Pointing to something close vs. far away:**


        <span lang="it">Questo libro è interessante.</span> (This book is interesting.
        — the book is near the speaker.)


        <span lang="it">Quel libro è interessante.</span> (That book is interesting.
        — the book is far from the speaker.)


        **2. Feminine plural:**


        <span lang="it">Queste scarpe sono nuove.</span> (These shoes are new.)


        <span lang="it">Quelle scarpe sono vecchie.</span> (Those shoes are old.)


        **3. Elision of <span lang="it">questo</span> before a vowel:**


        <span lang="it">Quest''arancia è buona.</span> (This orange is good.)


        **4. <span lang="it">quello</span> before <span lang="it">s+consonant</span>:**


        <span lang="it">Quello studente è bravo.</span> (That student is good.) —
        note <span lang="it">quello</span>, not <span lang="it">quel</span>, because
        <span lang="it">studente</span> begins with <span lang="it">st-</span>.


        **5. Referring back to something already mentioned:**


        <span lang="it">Ho un gatto. Questo gatto si chiama Micio.</span> (I have
        a cat. This cat is called Micio.) — <span lang="it">questo</span> here refers
        back to the cat just mentioned.


        **6. Contrastive pair (near vs. far, masculine plural):**


        <span lang="it">Questi ragazzi sono italiani, quei ragazzi sono francesi.</span>
        (These boys are Italian, those boys are French.)


        ## A note on codesto


        The textbook lists a third demonstrative, <span lang="it">codesto</span>,
        which historically pointed to something near the **listener** (''that near
        you''). In modern standard Italian it is virtually obsolete — you will only
        hear it in Tuscany. In everyday speech, Italians use either <span lang="it">questo</span>
        or <span lang="it">quello</span> to cover all situations, relying on context
        or a pointing gesture to make the distance clear. You do not need to use <span
        lang="it">codesto</span> at this level.


        ## Common learner mistakes


        **Mistake 1 — Using <span lang="it">quello</span> instead of <span lang="it">quel
        / quell''</span>:**


        <span lang="it">*Quello libro è mio.</span> ✗ — <span lang="it">libro</span>
        begins with a plain consonant, so the correct form is <span lang="it">quel
        libro</span> ✓.


        **Mistake 2 — Forgetting gender/number agreement:**


        <span lang="it">*Questo ragazza è simpatica.</span> ✗ — <span lang="it">ragazza</span>
        is feminine, so the correct form is <span lang="it">questa ragazza</span>
        ✓.


        **Mistake 3 — Eliding the plural:**


        <span lang="it">*Quest''amici sono gentili.</span> ✗ — Elision only applies
        in the singular. The correct form is <span lang="it">questi amici</span> ✓.


        **Mistake 4 — Using <span lang="it">quegli</span> before an ordinary consonant:**


        <span lang="it">*Quegli ragazzi giocano.</span> ✗ — <span lang="it">quegli</span>
        is reserved for nouns starting with a vowel or <span lang="it">s+consonant,
        z</span>, etc. The correct form is <span lang="it">quei ragazzi</span> ✓.'
      language: en
      why_this_matters: Every time you point something out — 'this book', 'that table',
        'these shoes', 'those people' — you need a demonstrative adjective. Without
        them you cannot distinguish between what is near and what is far, or refer
        back to something already mentioned in conversation. These two words appear
        in almost every Italian exchange, so getting their forms right early removes
        a persistent source of errors.
  prerequisites:
  - noun_o_a_e
- code: inter_che
  cefr_level: A1
  category: aggettivi
  source_url: https://www.unistrapg.it/profilo_lingua_italiana/site/gram_aggettivi_a1.html
  unistr_code: aggettivi_interrogativi_che_quanto
  unistr_label: 'Aggettivi interrogativi: che, quanto'
  chunk_ref: book_6_l_aggettivo_aggettivi_interrogativied_esclamativi
  label: Aggettivo interrogativo che e quanto
  explanations:
    en:
      title: Asking questions with 'che' and 'quanto'
      tip: Use 'che' before a noun to ask 'what?' or 'which?' — it never changes its
        form. Use 'quanto' to ask 'how much?' or 'how many?' — it must agree in gender
        and number with the noun it describes.
      explanation: '## The interrogative adjectives: what they are and how they work


        Interrogative adjectives (<span lang="it">aggettivi interrogativi</span>,
        literally ''asking adjectives'') are placed directly before a noun to ask
        a question about it. Italian has three: <span lang="it">che</span>, <span
        lang="it">quale</span>, and <span lang="it">quanto</span>. This entry focuses
        on <span lang="it">che</span> and <span lang="it">quanto</span>, the two introduced
        at A1.


        ## ''Che'' — what / which


        <span lang="it">Che</span> means ''what'' or ''which'' when placed before
        a noun. Its most important feature is that it is **invariable** — it has one
        single form for masculine, feminine, singular, and plural. It never changes.


        It works exactly like <span lang="it">quale</span> in questions with a noun:
        <span lang="it">che giorno?</span> and <span lang="it">quale giorno?</span>
        both mean ''which day?'' and are fully interchangeable in this context.


        **Important exception — exclamations:** <span lang="it">Che</span> can also
        be used as an exclamative adjective (expressing surprise or emotion) before
        **another adjective**. In this use, <span lang="it">quale</span> cannot replace
        it. For example, you can say <span lang="it">Che bello!</span> (''How beautiful!''),
        but <span lang="it">*Quale bello!</span> is incorrect.


        **The phrase <span lang="it">che cosa</span>:** When asking ''what?'' without
        a following noun, Italian often uses <span lang="it">che cosa</span> (literally
        ''what thing''). In everyday speech, <span lang="it">che</span> can be dropped
        and you can simply say <span lang="it">cosa</span>. All three forms — <span
        lang="it">che cosa</span>, <span lang="it">che</span>, and <span lang="it">cosa</span>
        — are correct and common.


        ## ''Quanto'' — how much / how many


        <span lang="it">Quanto</span> means ''how much'' (with uncountable nouns)
        or ''how many'' (with countable nouns). Unlike <span lang="it">che</span>,
        it is **variable** — it must agree in gender and number with the noun it modifies,
        exactly like a regular adjective.


        Here are its four forms:


        | | Masculine | Feminine |

        |---|---|---|

        | **Singular** | quanto | quanta |

        | **Plural** | quanti | quante |


        Use the singular with uncountable nouns (things you cannot count individually,
        like water or time) and the plural with countable nouns.


        ## Examples


        <span lang="it">Che libro leggi?</span> — ''Which book are you reading?''
        (<span lang="it">che</span> + singular masculine noun; invariable)


        <span lang="it">Che lingue parli?</span> — ''What languages do you speak?''
        (<span lang="it">che</span> + plural feminine noun; still invariable — no
        change)


        <span lang="it">Che bella giornata!</span> — ''What a beautiful day!'' (<span
        lang="it">che</span> as exclamative adjective before another adjective; <span
        lang="it">quale</span> could not replace it here)


        <span lang="it">Quanto zucchero vuoi?</span> — ''How much sugar do you want?''
        (<span lang="it">quanto</span> + singular masculine uncountable noun)


        <span lang="it">Quante sorelle hai?</span> — ''How many sisters do you have?''
        (<span lang="it">quante</span> + plural feminine noun — agreement is required)


        <span lang="it">Dimmi cosa vuoi.</span> — ''Tell me what you want.'' (<span
        lang="it">cosa</span> used alone in an indirect question; <span lang="it">che
        cosa</span> or <span lang="it">che</span> would also be correct)


        ## Common learner mistakes


        **Mistake 1 — Changing <span lang="it">che</span> to agree with the noun:**

        Learners sometimes write <span lang="it">*chi libro</span> or try to make
        <span lang="it">che</span> plural. Remember: <span lang="it">che</span> is
        always <span lang="it">che</span>, regardless of the noun. Correct form: <span
        lang="it">che libro</span>, <span lang="it">che libri</span>, <span lang="it">che
        pizza</span>, <span lang="it">che pizze</span> — always the same.


        **Mistake 2 — Not changing <span lang="it">quanto</span> to agree with the
        noun:**

        Because <span lang="it">che</span> is invariable, learners sometimes treat
        <span lang="it">quanto</span> the same way. This is wrong. <span lang="it">*Quanto
        sorelle hai?</span> is incorrect. The noun <span lang="it">sorelle</span>
        is feminine and plural, so the correct form is <span lang="it">Quante sorelle
        hai?</span>


        **Mistake 3 — Using <span lang="it">quale</span> in exclamations before an
        adjective:**

        <span lang="it">*Quale bello!</span> is not Italian. Only <span lang="it">che</span>
        can introduce an exclamation before a bare adjective: <span lang="it">Che
        bello!</span>, <span lang="it">Che buono!</span>, <span lang="it">Che strano!</span>


        **Mistake 4 — Thinking only <span lang="it">che cosa</span> is correct:**

        All three forms — <span lang="it">che cosa</span>, <span lang="it">che</span>,
        and <span lang="it">cosa</span> — are equally acceptable when asking or saying
        ''what''. Do not hesitate to use <span lang="it">cosa</span> alone in conversation;
        it is not informal or incorrect.'
      language: en
      why_this_matters: Two of the most basic things you need to do in Italian are
        ask questions and express surprise — and both depend on a small set of adjectives
        that appear constantly in everyday conversation. Without <span lang="it">che</span>
        and <span lang="it">quanto</span>, you cannot ask 'what time is it?', 'which
        pizza do you want?', or 'how many brothers do you have?' Mastering these two
        words immediately unlocks dozens of essential questions and exclamations.
  prerequisites:
  - noun_o_a_e
- code: indef_poco
  cefr_level: A1
  category: aggettivi
  source_url: https://www.unistrapg.it/profilo_lingua_italiana/site/gram_aggettivi_a1.html
  unistr_code: aggettivi_indefiniti_poco_molto_tanto
  unistr_label: 'Aggettivi indefiniti: poco, molto, tanto'
  chunk_ref: book_6_l_aggettivo_aggettivi_indefiniti
  label: Aggettivo indefinito poco, molto, tanto
  explanations:
    en:
      title: 'Indefinite adjectives: poco, molto, tanto'
      tip: The adjectives poco, molto, and tanto tell you how much or how many of
        something there is. They must agree in gender and number with the noun they
        describe, just like regular adjectives.
      explanation: '## The rule: what these adjectives mean


        The adjectives <span lang="it">poco</span>, <span lang="it">molto</span>,
        and <span lang="it">tanto</span> are called <span lang="it">aggettivi indefiniti</span>
        (indefinite adjectives). They go directly before a noun and express a vague,
        non-exact idea of quantity or degree:


        - <span lang="it">poco</span> — little, few, not much, not many

        - <span lang="it">molto</span> — much, many, a lot of

        - <span lang="it">tanto</span> — so much, so many; (without a correlating
        word) also equivalent to <span lang="it">molto</span> (a lot of)


        ## Formation: agreement with the noun


        All three adjectives follow the standard four-form pattern of Italian adjectives
        ending in <span lang="it">-o</span>. They must agree with the gender (masculine/feminine)
        and number (singular/plural) of the noun they modify.


        | | Masculine singular | Feminine singular | Masculine plural | Feminine plural
        |

        |---|---|---|---|---|

        | | poco | poca | pochi | poche |

        | | molto | molta | molti | molte |

        | | tanto | tanta | tanti | tante |


        Notice that the masculine plural forms of <span lang="it">poco</span> are
        <span lang="it">pochi</span> / <span lang="it">poche</span> — the <span lang="it">-h-</span>
        is added to keep the hard <span lang="it">c</span> sound, exactly as with
        adjectives like <span lang="it">bianco → bianchi</span>.


        ## Position: always before the noun


        As indefinite adjectives, <span lang="it">poco</span>, <span lang="it">molto</span>,
        and <span lang="it">tanto</span> must come directly before the noun they modify.
        Placing them after the noun changes their function or makes the sentence ungrammatical
        in this context.


        ## A note on tanto


        According to Italian grammar, <span lang="it">tanto</span> has a specific
        meaning of ''so much / so many'' when it is used in a correlation with <span
        lang="it">che</span> (that) or <span lang="it">quanto</span> (as): for example,
        <span lang="it">Ha tanti amici che non li ricorda tutti</span> (He has so
        many friends that he cannot remember them all). Without this correlation,
        <span lang="it">tanto</span> is simply equivalent to <span lang="it">molto</span>
        and means ''a lot of''. At A1 level, you will mostly encounter <span lang="it">tanto</span>
        in this second, simpler sense.


        ## Examples


        <span lang="it">Ho poca acqua.</span> (I have little water.) — feminine singular
        noun, feminine singular form <span lang="it">poca</span>.


        <span lang="it">Ci sono pochi studenti in classe oggi.</span> (There are few
        students in class today.) — masculine plural noun, masculine plural form <span
        lang="it">pochi</span>.


        <span lang="it">Mia madre ha molta pazienza.</span> (My mother has a lot of
        patience.) — feminine singular noun, feminine singular form <span lang="it">molta</span>.


        <span lang="it">Marco ha molti libri.</span> (Marco has many books.) — masculine
        plural noun, masculine plural form <span lang="it">molti</span>.


        <span lang="it">Ho tanto tempo libero.</span> (I have a lot of free time.)
        — masculine singular noun, masculine singular form <span lang="it">tanto</span>;
        here <span lang="it">tanto</span> simply means ''a lot of''.


        <span lang="it">Giorgio ha tanti soldi che non sa cosa farci.</span> (Giorgio
        has so much money that he does not know what to do with it.) — edge case:
        <span lang="it">tanto</span> in correlation with <span lang="it">che</span>,
        meaning ''so many''.


        ## Common learner mistakes


        **Mistake 1 — not agreeing the adjective with the noun:**

        Incorrect: <span lang="it">*Ho molto amiche.</span>

        Correct: <span lang="it">Ho molte amiche.</span> (I have many friends [female].)

        The noun <span lang="it">amiche</span> is feminine plural, so the adjective
        must also be feminine plural: <span lang="it">molte</span>, not <span lang="it">molto</span>.


        **Mistake 2 — forgetting the <span lang="it">-h-</span> in the plural of <span
        lang="it">poco</span>:**

        Incorrect: <span lang="it">*poci studenti</span> or <span lang="it">*poce
        ragazze</span>

        Correct: <span lang="it">pochi studenti</span> (few students), <span lang="it">poche
        ragazze</span> (few girls).

        The <span lang="it">-h-</span> preserves the hard <span lang="it">c</span>
        sound before <span lang="it">-i</span> and <span lang="it">-e</span>.


        **Mistake 3 — using <span lang="it">molto</span> as an adverb but keeping
        adjective agreement rules confused:**

        Note that <span lang="it">molto</span>, <span lang="it">poco</span>, and <span
        lang="it">tanto</span> can also work as adverbs modifying a verb or another
        adjective (e.g. <span lang="it">Mangio molto</span> — I eat a lot). When used
        as adverbs, they do not change form. This entry covers only their use as adjectives
        before a noun, where agreement is required.


        **Mistake 4 — placing the adjective after the noun:**

        Incorrect: <span lang="it">*Ho tempo molto.</span>

        Correct: <span lang="it">Ho molto tempo.</span> (I have a lot of time.) As
        indefinite adjectives, these words must precede the noun.'
      language: en
      why_this_matters: These three words appear in almost every Italian conversation
        — you need them to say things like 'a little water', 'many friends', or 'so
        much time'. Without them, you cannot talk about quantities in everyday situations
        such as ordering food, describing your family, or explaining your daily routine.
        Getting their forms right also builds the habit of adjective agreement, which
        is one of the most important skills in Italian grammar.
  prerequisites:
  - noun_o_a_e
- code: card_1_100
  cefr_level: A1
  category: aggettivi
  source_url: https://www.unistrapg.it/profilo_lingua_italiana/site/gram_aggettivi_a1.html
  unistr_code: aggettivi_numerali_cardinali_da_1_a_100
  unistr_label: 'Aggettivi numerali cardinali: da 1 a 100'
  chunk_ref: book_6_l_aggettivo_aggettivi_numerali
  label: Aggettivi numerali cardinali da uno a cento
  explanations:
    en:
      title: 'Cardinal numbers: one to one hundred'
      tip: Cardinal numbers in Italian almost never change form — only 'uno' (one)
        has a feminine form, 'una'. All other cardinal numbers stay the same regardless
        of the gender or number of the noun they describe.
      explanation: '## What cardinal numbers are


        <span lang="it">I numerali cardinali</span> (cardinal numbers) are the ordinary
        counting numbers: <span lang="it">uno, due, tre...</span> They answer the
        question ''how many?'' They can be used before a noun like an adjective, or
        on their own as a number.


        ## The core rule: cardinal numbers are invariable


        With one important exception, all Italian cardinal numbers are **invariable**
        — they do not change for grammatical gender (masculine/feminine) or number
        (singular/plural). The same form is used with masculine and feminine nouns
        alike.


        > <span lang="it">diciotto ragazzi</span> — eighteen boys

        > <span lang="it">diciotto ragazze</span> — eighteen girls


        The number stays <span lang="it">diciotto</span> in both cases.


        ## The one exception: uno / una


        <span lang="it">Uno</span> (one) has a feminine form <span lang="it">una</span>.
        Use <span lang="it">uno</span> before masculine nouns and <span lang="it">una</span>
        before feminine nouns.


        > <span lang="it">un fratello</span> — one brother (masculine)

        > <span lang="it">una sorella</span> — one sister (feminine)


        Note: before a masculine noun beginning with a vowel or <span lang="it">z</span>,
        the form is <span lang="it">uno</span>: <span lang="it">uno zaino</span> (one
        backpack), <span lang="it">uno studente</span> (one student). Before a feminine
        noun beginning with a vowel, <span lang="it">una</span> shortens to <span
        lang="it">un''</span>: <span lang="it">un''amica</span> (one friend, female).


        ## The numbers from 1 to 100


        | Numeral | Italian | | Numeral | Italian |

        |---|---|---|---|---|

        | 1 | uno / una | | 11 | undici |

        | 2 | due | | 12 | dodici |

        | 3 | tre | | 13 | tredici |

        | 4 | quattro | | 14 | quattordici |

        | 5 | cinque | | 15 | quindici |

        | 6 | sei | | 16 | sedici |

        | 7 | sette | | 17 | diciassette |

        | 8 | otto | | 18 | diciotto |

        | 9 | nove | | 19 | diciannove |

        | 10 | dieci | | 20 | venti |


        | Numeral | Italian | | Numeral | Italian |

        |---|---|---|---|---|

        | 20 | venti | | 60 | sessanta |

        | 30 | trenta | | 70 | settanta |

        | 40 | quaranta | | 80 | ottanta |

        | 50 | cinquanta | | 90 | novanta |

        | 100 | cento | | | |


        ## How compound numbers (21–99) are formed


        Compound numbers are built by joining the tens form and the units form into
        a single word.


        **Key spelling rules for compounds:**


        1. When the units digit is <span lang="it">uno</span> or <span lang="it">otto</span>,
        drop the final vowel of the tens word before adding the units: <span lang="it">venti
        + uno → ventuno</span>, <span lang="it">venti + otto → ventotto</span>, <span
        lang="it">trenta + uno → trentuno</span>, <span lang="it">trenta + otto →
        trentotto</span>, and so on through all the tens.


        2. In all other cases, simply join the two parts with no change: <span lang="it">venti
        + due → ventidue</span>, <span lang="it">trenta + tre → trentatré</span> (note
        the written accent on <span lang="it">tré</span> when it ends a compound number).


        3. The feminine rule for <span lang="it">uno</span> carries through to compounds:
        <span lang="it">ventuno studenti</span> (masculine), <span lang="it">ventuna
        studentesse</span> (feminine).


        ### Selected compound examples


        | Numeral | Italian |

        |---|---|

        | 21 | ventuno |

        | 22 | ventidue |

        | 23 | ventitrè |

        | 28 | ventotto |

        | 31 | trentuno |

        | 33 | trentatré |

        | 38 | trentotto |

        | 44 | quarantaquattro |

        | 55 | cinquantacinque |

        | 68 | sessantotto |

        | 81 | ottantuno |

        | 99 | novantanove |


        ## Examples in context


        1. <span lang="it">Ho due fratelli e una sorella.</span> — I have two brothers
        and one sister.

        *(<span lang="it">due</span> is invariable; <span lang="it">una</span> is
        feminine because <span lang="it">sorella</span> is feminine.)*


        2. <span lang="it">La classe ha ventidue studenti.</span> — The class has
        twenty-two students.

        *(<span lang="it">ventidue</span> does not change.)*


        3. <span lang="it">Ho trentun anni.</span> — I am thirty-one years old.

        *(<span lang="it">trentuno</span> drops the final <span lang="it">-o</span>
        before a noun beginning with a consonant; the full form <span lang="it">trentuno</span>
        is also widely accepted.)*


        4. <span lang="it">Il negozio apre alle otto.</span> — The shop opens at eight.

        *(Used on its own without a noun — cardinal numbers work independently too.)*


        5. <span lang="it">Ci sono cinquanta ragazzi e cinquanta ragazze.</span> —
        There are fifty boys and fifty girls.

        *(Contrastive pair: the same form <span lang="it">cinquanta</span> is used
        with both masculine and feminine nouns.)*


        6. <span lang="it">Ventotto studentesse sono in aula.</span> — Twenty-eight
        female students are in the classroom.

        *(<span lang="it">Ventotto</span> — the tens vowel is dropped before <span
        lang="it">otto</span> — and the number is still invariable despite the feminine
        noun.)*


        ## Common learner mistakes


        **Mistake 1 — Changing the number to match gender:**

        <span lang="it">*due fratelli / *duei fratelli / *due sorelle → duE sorelle</span>
        — wrong; the correct form is just <span lang="it">due sorelle</span>. Only
        <span lang="it">uno/una</span> changes.


        **Mistake 2 — Forgetting the feminine of uno:**

        <span lang="it">*Ho uno sorella.</span> — incorrect. Correct: <span lang="it">Ho
        una sorella.</span> Always use <span lang="it">una</span> (or <span lang="it">un''</span>
        before a vowel) with feminine nouns.


        **Mistake 3 — Not dropping the vowel before uno or otto in compounds:**

        <span lang="it">*ventiuno, *ventiotto</span> — incorrect spellings. Correct:
        <span lang="it">ventuno, ventotto</span>.


        **Mistake 4 — Forgetting the accent on trè in compounds:**

        <span lang="it">*ventitre</span> — missing accent. Correct written form: <span
        lang="it">ventitrè</span>.


        **Mistake 5 — Writing numbers as digits in ordinary prose:**

        In normal written Italian, numbers are preferred in full letters except for
        dates, technical contexts, and proper names: write <span lang="it">ventidue
        alunni</span>, not <span lang="it">22 alunni</span>, in a standard sentence.'
      language: en
      why_this_matters: Numbers are everywhere in Italian — telling the time, shopping,
        giving your age, counting people in a family. Without cardinal numbers you
        cannot handle the most basic everyday transactions. Because Italian numbers
        work differently from English in a few important ways (especially the single
        irregular form <span lang="it">uno/una</span>), learning the rule precisely
        now will save you from a persistent error that appears even at advanced levels.
