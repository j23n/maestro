- code: sent_affir
  cefr_level: A1
  category: frase_semplice
  source_url: https://www.unistrapg.it/profilo_lingua_italiana/site/gram_frasesemplice_a1.html
  unistr_code: proposizioni_enunciative_affermative_e_negative
  unistr_label: 'Proposizioni enunciative: affermative e negative'
  chunk_ref: book_2_la_frase
  label: Proposizioni enunciative affermative e negative
  explanations:
    en:
      title: Making affirmative and negative statements
      tip: To say something is true, just use a normal sentence. To say something
        is NOT true, place 'non' directly before the verb — that single word makes
        any Italian statement negative.
      explanation: '## What is a statement?


        A <span lang="it">proposizione enunciativa</span> (declarative clause) is
        a complete unit of meaning built around a verb. It states a fact, describes
        a situation, or reports information. When a statement asserts that something
        IS the case, it is <span lang="it">affermativa</span> (affirmative). When
        it asserts that something is NOT the case, it is <span lang="it">negativa</span>
        (negative).


        A statement is different from a question or a command: it simply tells you
        how things are — or are not.


        ## Forming affirmative statements


        An affirmative statement in Italian follows a straightforward order:


        **Subject + Verb (+ rest of sentence)**


        The subject can be a noun or a pronoun. Because Italian verb endings already
        signal who is speaking, the subject pronoun is often omitted — this is perfectly
        normal at every level.


        ## Forming negative statements


        To make any statement negative, place <span lang="it">non</span> (not) **immediately
        before the verb** — and nothing else changes.


        **Subject + <span lang="it">non</span> + Verb (+ rest of sentence)**


        This is the complete rule. There is no second negative word required in standard
        negation. <span lang="it">Non</span> never moves away from the verb; it always
        sits directly in front of it.


        ## The rule at a glance


        | Type | Structure | Example |

        |---|---|---|

        | Affirmative | Subject + Verb | Io mangio la pizza. |

        | Negative | Subject + non + Verb | Io non mangio la pizza. |

        | Affirmative (no pronoun) | Verb | Mangio la pizza. |

        | Negative (no pronoun) | Non + Verb | Non mangio la pizza. |


        ## Examples


        **1. Simple affirmative statement**

        <span lang="it">Maria parla italiano.</span> — Maria speaks Italian.


        **2. Simple negative statement**

        <span lang="it">Maria non parla inglese.</span> — Maria does not speak English.


        **3. Affirmative with <span lang="it">essere</span> (to be)**

        <span lang="it">Io sono stanco.</span> — I am tired.


        **4. Negative with <span lang="it">essere</span>**

        <span lang="it">Io non sono stanco.</span> — I am not tired.


        **5. Affirmative without subject pronoun (very common in Italian)**

        <span lang="it">Abito a Roma.</span> — I live in Rome.


        **6. Negative without subject pronoun — contrastive pair**

        <span lang="it">Non abito a Milano, abito a Roma.</span> — I do not live in
        Milan; I live in Rome.


        ## Important variants: double negatives with words like <span lang="it">niente</span>
        and <span lang="it">nessuno</span>


        When a negative word such as <span lang="it">niente</span> (nothing), <span
        lang="it">nessuno</span> (nobody), or <span lang="it">mai</span> (never) comes
        **after** the verb, <span lang="it">non</span> is still required before the
        verb. Italian uses this double negative construction — it is correct and mandatory,
        not a mistake.


        <span lang="it">Non mangio niente.</span> — I eat nothing. / I do not eat
        anything.

        <span lang="it">Non viene nessuno.</span> — Nobody is coming.


        However, if the negative word comes **before** the verb, <span lang="it">non</span>
        is dropped:


        <span lang="it">Nessuno viene.</span> — Nobody is coming.


        This variant is introduced here for awareness; you will practise it fully
        at a later level.


        ## Common learner mistakes


        **Mistake 1 — Putting <span lang="it">non</span> after the verb**

        <span lang="it">❌ Mangio non la pizza.</span>

        <span lang="it">✅ Non mangio la pizza.</span>

        <span lang="it">Non</span> must come directly **before** the verb, never after
        it.


        **Mistake 2 — Separating <span lang="it">non</span> from the verb with another
        word**

        <span lang="it">❌ Non io mangio la pizza.</span>

        <span lang="it">✅ Io non mangio la pizza.</span>

        <span lang="it">Non</span> belongs immediately before the verb, not before
        the subject.


        **Mistake 3 — Translating English ''do not'' with two words**


        English needs a helper verb: ''I <span lang="it">do not</span> eat.'' Italian
        does not. One word — <span lang="it">non</span> — placed before the verb is
        all that is needed.

        <span lang="it">❌ Io faccio non mangio.</span>

        <span lang="it">✅ Io non mangio.</span> — I do not eat.


        **Mistake 4 — Omitting <span lang="it">non</span> when a negative word follows
        the verb**

        <span lang="it">❌ Mangio niente.</span>

        <span lang="it">✅ Non mangio niente.</span> — I eat nothing.


        When <span lang="it">niente, mai,</span> or <span lang="it">nessuno</span>
        follows the verb, <span lang="it">non</span> before the verb is still compulsory.'
      language: en
      why_this_matters: 'Every conversation requires you to confirm or deny things:
        <span lang="it">''Parlo italiano''</span> versus <span lang="it">''Non parlo
        italiano.''</span> These two sentence types — affirmative and negative statements
        — are the most basic building blocks of Italian. Without them you cannot introduce
        yourself, describe your family, order food, or correct a misunderstanding.
        Master this rule and every topic you study becomes expressible.'
- code: sent_desir
  cefr_level: A1
  category: frase_semplice
  source_url: https://www.unistrapg.it/profilo_lingua_italiana/site/gram_frasesemplice_a1.html
  unistr_code: proposizioni_volitive_desiderative_introdotte_da_vorrei
  unistr_label: 'Proposizioni volitive: desiderative introdotte da vorrei'
  chunk_ref: book_8_il_verbo_uso_degli_altri_modi_condizionale
  label: Proposizioni volitive desiderative con verbo volitivo
  explanations:
    en:
      title: Expressing wishes with volitive verbs
      tip: To say what you would like or want, use a verb like 'volere' or 'piacere'
        in the conditional tense. This softer form is more polite than a direct request
        and is the standard way to express a wish or desire in Italian.
      explanation: '## The rule: expressing a wish with a volitive verb in the conditional


        A **volitive verb** is a verb that expresses wanting, wishing, or liking.
        The most important ones at A1 are:


        | Infinito | Meaning |

        |---|---|

        | volere | to want |

        | desiderare | to desire / wish |

        | piacere | to like (literally: to be pleasing) |


        To express a wish politely, put the volitive verb into the **conditional present**
        (<span lang="it">condizionale presente</span>) — the Italian equivalent of
        ''would like'' or ''would love to''. The conditional signals that something
        is desired but depends on circumstances; it is also simply the polite, softened
        form used for everyday wishes.


        ## Forming the conditional present of the key verbs


        The conditional present is formed by taking the **infinitive stem** (with
        a small spelling change for most verbs: the final <span lang="it">-e</span>
        of the infinitive is dropped and the <span lang="it">-a-</span> of <span lang="it">-are</span>
        verbs changes to <span lang="it">-e-</span>) and adding the conditional endings:



        | Person | Ending | volere → vorr- | desiderare → desiderer- |

        |---|---|---|---|

        | io | -ei | vorrei | desidererei |

        | tu | -esti | vorresti | desidereresti |

        | lui/lei | -ebbe | vorrebbe | desidererebbe |

        | noi | -emmo | vorremmo | desidereremmo |

        | voi | -este | vorreste | desiderereste |

        | loro | -ebbero | vorrebbero | desidererebbero |


        **Important:** <span lang="it">volere</span> is **irregular** in the conditional.
        Its stem changes from <span lang="it">vol-</span> to <span lang="it">vorr-</span>.
        You simply need to learn this form. <span lang="it">desiderare</span> is regular.


        ### <span lang="it">Piacere</span> in the conditional


        <span lang="it">Piacere</span> works differently from <span lang="it">volere</span>.
        In Italian, ''I would like'' using <span lang="it">piacere</span> is expressed
        as ''it would be pleasing **to me**''. The verb agrees with the thing liked
        (the grammatical subject), not with the person. At A1, the two forms you need
        are:


        - <span lang="it">mi piacerebbe</span> — I would like (singular thing)

        - <span lang="it">mi piacerebbero</span> — I would like (plural things)


        The indirect object pronoun changes with the person: <span lang="it">mi</span>
        (me), <span lang="it">ti</span> (you), <span lang="it">gli/le</span> (him/her),
        <span lang="it">ci</span> (us), <span lang="it">vi</span> (you all), <span
        lang="it">gli</span> (them).


        ## Structure of a wish sentence


        The most common pattern at A1 is simply:


        **[subject] + [conditional of volitive verb] + [noun / infinitive]**


        <span lang="it">Io vorrei un caffè.</span>

        <span lang="it">Noi vorremmo mangiare adesso.</span>


        The subject pronoun is often dropped in Italian because the verb ending makes
        it clear:


        <span lang="it">Vorrei un caffè.</span> is perfectly natural.


        ## Examples


        1. <span lang="it">Vorrei un caffè, per favore.</span> — I would like a coffee,
        please. *(simple polite request in a bar)*


        2. <span lang="it">Desidererei parlare con tua madre.</span> — I would like
        to speak with your mother. *(slightly more formal wish)*


        3. <span lang="it">Mi piacerebbe mangiare una pizza stasera.</span> — I would
        like to eat a pizza tonight. *(expressing a personal wish using <span lang="it">piacere</span>)*


        4. <span lang="it">Mia sorella vorrebbe un gatto.</span> — My sister would
        like a cat. *(third-person wish)*


        5. <span lang="it">Vorreste venire a cena con noi?</span> — Would you (all)
        like to come to dinner with us? *(second-person plural; also used as a polite
        invitation)*


        6. <span lang="it">Vorrei un panino, ma non ho fame adesso.</span> vs. <span
        lang="it">Voglio un panino.</span> — ''I would like a sandwich'' (polite,
        hypothetical wish) vs. ''I want a sandwich'' (direct, immediate demand). The
        conditional is softer and more polite than the plain present tense of <span
        lang="it">volere</span>.


        ## Common learner mistakes


        **Mistake 1: Using the present tense instead of the conditional for polite
        wishes.**

        <span lang="it">*Voglio un caffè, per favore.*</span> — This is grammatically
        correct but sounds blunt or childlike in a service context. Prefer: <span
        lang="it">Vorrei un caffè, per favore.</span>


        **Mistake 2: Using the wrong stem for <span lang="it">volere</span>.**

        <span lang="it">*Volerei*</span> — incorrect; the stem is <span lang="it">vorr-</span>,
        not <span lang="it">vol-</span>. The correct form is <span lang="it">vorrei</span>.


        **Mistake 3: Making <span lang="it">piacere</span> agree with the person instead
        of the thing liked.**

        <span lang="it">*Mi piacerei una pizza.*</span> — incorrect. The verb agrees
        with <span lang="it">una pizza</span> (singular), and the form is fixed as
        third person: <span lang="it">Mi piacerebbe una pizza.</span>


        **Mistake 4: Forgetting the indirect object pronoun with <span lang="it">piacere</span>.**

        <span lang="it">*Piacerebbe una pizza.*</span> — This sounds incomplete. Always
        include the pronoun: <span lang="it">Mi piacerebbe una pizza.</span>


        **Mistake 5: Confusing conditional with future tense.**

        The future of <span lang="it">volere</span> is <span lang="it">vorrò</span>
        (''I will want''), which expresses a future fact. The conditional <span lang="it">vorrei</span>
        expresses a present wish or polite request — these are different meanings.
        At A1, focus on <span lang="it">vorrei</span> for wishes.'
      language: en
      why_this_matters: The moment you walk into a café, a shop, or a friend's home
        in Italy, you need to express what you would like. Without this pattern, you
        are limited to blunt demands or pointing — with it, you can make polite requests,
        state preferences, and express wishes naturally. This structure appears in
        almost every real-life conversation at A1 level and beyond.
  prerequisites:
  - ind_pres
- code: sent_excla
  cefr_level: A1
  category: frase_semplice
  source_url: https://www.unistrapg.it/profilo_lingua_italiana/site/gram_frasesemplice_a1.html
  unistr_code: esclamative_quasi_sempre_con_il_verbo_sottinteso
  unistr_label: Esclamative, quasi sempre con il verbo sottinteso
  chunk_ref: book_2_la_frase
  label: Proposizioni esclamative con verbo sottinteso
  explanations:
    en:
      title: Exclamatory phrases without a verb
      tip: In Italian, you can express strong feelings with just a noun, adjective,
        or adverb — no verb needed. These short exclamations are complete, natural
        sentences on their own. Learning them lets you react and express emotion immediately,
        just like a native speaker.
      explanation: '## The rule


        A <span lang="it">proposizione esclamativa</span> (exclamatory clause) expresses
        a strong feeling or reaction. In Italian, such clauses very often omit the
        verb entirely — the verb is <span lang="it">sottinteso</span>, meaning ''understood''
        or ''implied.'' The remaining words — a noun, an adjective, an adverb, or
        a short phrase — carry the full meaning on their own, supported by tone of
        voice and context.


        This is not sloppy Italian. It is grammatically recognised and completely
        standard. The sentence is still considered <span lang="it">dotata di senso
        compiuto</span> — ''endowed with complete meaning'' — even without a verb.


        ## How to form them


        The structure is simply:


        **[exclamatory word] + [noun / adjective / adverb / noun phrase] + !**


        Common exclamatory words used this way include:


        | Parola | Meaning | Notes |

        |---|---|---|

        | Che | What (a) / How | most common; used before nouns and adjectives |

        | Quanto / Quanta / Quanti / Quante | How much / How many | agrees in gender
        and number with the noun |

        | Come | How | often used with adjectives |

        | Quale / Quali | What (a) / Which | more formal or literary |


        ## Examples


        <span lang="it">Che bella giornata!</span>

        (What a beautiful day!)

        → The verb <span lang="it">è</span> (''is'') is omitted. Full form would be:
        <span lang="it">Che bella giornata è!</span> — but that sounds unnatural and
        overly formal.


        <span lang="it">Che fame!</span>

        (I''m so hungry! / How hungry I am!)

        → Literally ''What hunger!'' The noun alone, with no verb, perfectly expresses
        the feeling.


        <span lang="it">Quanta gente!</span>

        (So many people! / What a crowd!)

        → <span lang="it">Quanta</span> agrees with <span lang="it">gente</span>,
        which is feminine singular in Italian.


        <span lang="it">Che buono!</span>

        (How good this is! / This is so good!)

        → Said when tasting food. The adjective <span lang="it">buono</span> (''good/tasty'')
        stands alone; no verb required.


        <span lang="it">Quanti bambini!</span>

        (So many children!)

        → <span lang="it">Quanti</span> is masculine plural to match <span lang="it">bambini</span>
        (''children'', masculine plural).


        <span lang="it">Che bello!</span> vs. <span lang="it">Che bella!</span>

        → Both mean ''How lovely!'' but the adjective changes to match what is being
        described. If you are reacting to a masculine noun (e.g. <span lang="it">il
        vestito</span>, ''the dress'' — masculine in Italian), say <span lang="it">Che
        bello!</span> If reacting to a feminine noun (e.g. <span lang="it">la casa</span>,
        ''the house''), say <span lang="it">Che bella!</span>


        ## Agreement rules


        When the exclamation contains an adjective or <span lang="it">quanto</span>,
        it must agree in gender and number with the noun it describes — exactly as
        it would in a full sentence.


        | Noun | Gender / Number | Exclamation |

        |---|---|---|

        | il bambino (boy) | masc. sing. | Che bambino simpatico! |

        | la bambina (girl) | fem. sing. | Che bambina simpatica! |

        | i bambini (boys/children) | masc. pl. | Quanti bambini simpatici! |

        | le bambine (girls) | fem. pl. | Quante bambine simpatiche! |


        ## Common learner mistakes


        **Mistake 1: Forgetting agreement with <span lang="it">quanto</span>**


        <span lang="it">*Quanto gente!</span> ✗ — <span lang="it">gente</span> is
        feminine, so the correct form is <span lang="it">Quanta gente!</span> ✓


        **Mistake 2: Adding a verb unnecessarily**


        Writing <span lang="it">Che bella giornata è!</span> instead of <span lang="it">Che
        bella giornata!</span> is not wrong, but it sounds stiff and unnatural. Native
        speakers almost always drop the verb in exclamations like these.


        **Mistake 3: Using <span lang="it">come</span> with a noun instead of an adjective**


        Say <span lang="it">Che fame!</span> (not <span lang="it">*Come fame!</span>).
        <span lang="it">Come</span> works best before adjectives (<span lang="it">Come
        sei gentile!</span>, ''How kind you are!''), while <span lang="it">che</span>
        works before both nouns and adjectives.


        **Mistake 4: Confusing <span lang="it">che</span> (exclamatory) with <span
        lang="it">che</span> (question word)**


        In a question, <span lang="it">Che cos''è?</span> means ''What is it?'' In
        an exclamation, <span lang="it">Che bello!</span> means ''How lovely!'' The
        exclamatory <span lang="it">che</span> always carries an emotional charge
        and ends with an exclamation mark, not a question mark.'
      language: en
      why_this_matters: 'Exclamations are among the very first things you say in any
        language — surprise, joy, admiration, frustration. In Italian, many of the
        most common exclamations have no verb at all: the verb is simply left out
        because the emotion makes the meaning obvious. If you wait until you can build
        a full sentence, you will miss these moments entirely. Mastering verbless
        exclamations lets you sound natural from day one and helps you understand
        what native speakers say around you constantly.'
  prerequisites:
  - sent_affir
- code: sent_inter
  cefr_level: A1
  category: frase_semplice
  source_url: https://www.unistrapg.it/profilo_lingua_italiana/site/gram_frasesemplice_a1.html
  unistr_code: interrogative_totali_sino_e_parziali_introdotte_da_come_dove_quando_perche
  unistr_label: 'Interrogative: totali (SÌ/NO) e parziali introdotte da: come, dove,
    quando, perché, quanto, chi, che, cosa, che cosa, quale?'
  chunk_ref: book_2_la_frase
  label: Proposizioni interrogative totali e parziali
  explanations:
    en:
      title: 'Asking questions: total and partial'
      tip: 'Italian has two kinds of questions: ones you answer with yes or no (total
        questions), and ones that ask for specific information using a question word
        like ''who'' or ''where'' (partial questions). Both are easy to form — word
        order often stays the same as in a statement, and your voice or a question
        mark does the rest.'
      explanation: '## The two types of question


        Italian grammar divides questions into two categories based on what kind of
        answer they expect.


        A **total question** (<span lang="it">proposizione interrogativa totale</span>,
        literally ''total interrogative clause'') is a question that can be answered
        with a simple yes or no. The question is ''total'' because the answer concerns
        the whole statement — either it is true or it is not.


        A **partial question** (<span lang="it">proposizione interrogativa parziale</span>,
        literally ''partial interrogative clause'') is a question that asks about
        one specific part of a statement — a person, a place, a time, a thing. It
        requires a real piece of information as an answer, not just yes or no. These
        questions always begin with a **question word** (<span lang="it">parola interrogativa</span>).


        ## Forming total questions


        In English, yes/no questions require you to invert the subject and verb (''You
        are tired'' → ''Are you tired?''). In Italian, **word order does not have
        to change**. You can form a total question simply by:


        1. Raising your voice at the end when speaking, or

        2. Adding a question mark at the end when writing.


        The statement and the question can be identical in written form except for
        the punctuation, and identical in spoken form except for intonation.


        You *may* also invert subject and verb (putting the verb before the subject),
        but this is optional and more common in formal or written Italian. At A1 level,
        the rising-intonation pattern is the most natural and widely used.


        ### Total question examples


        Statement: <span lang="it">Tu parli italiano.</span> (You speak Italian.)

        Question: <span lang="it">Tu parli italiano?</span> (Do you speak Italian?)


        Statement: <span lang="it">Maria è a casa.</span> (Maria is at home.)

        Question: <span lang="it">Maria è a casa?</span> (Is Maria at home?)


        With inversion (more formal): <span lang="it">Parli tu italiano?</span> (Do
        you speak Italian?)


        ## Forming partial questions


        Partial questions always begin with a question word. The question word comes
        at the **start of the sentence**, followed by the verb, then the subject (if
        stated). This is the standard word order for partial questions in Italian.


        Here are the most important question words at A1 level:


        | Parola interrogativa | English meaning |

        |---|---|

        | chi | who / whom |

        | che cosa / cosa / che | what |

        | dove | where |

        | quando | when |

        | come | how |

        | perché | why |

        | quanto / quanta / quanti / quante | how much / how many |

        | quale / quali | which / which ones |


        Note: <span lang="it">che cosa</span>, <span lang="it">cosa</span>, and <span
        lang="it">che</span> all mean ''what'' and are used interchangeably in everyday
        speech. <span lang="it">Che cosa</span> is slightly more formal; <span lang="it">cosa</span>
        is the most common in informal conversation.


        Note: <span lang="it">quanto</span> agrees in gender and number with the noun
        it refers to: <span lang="it">quanto pane</span> (how much bread), <span lang="it">quanta
        acqua</span> (how much water), <span lang="it">quanti fratelli</span> (how
        many brothers), <span lang="it">quante sorelle</span> (how many sisters).


        ### Partial question examples


        <span lang="it">Chi è lei?</span> (Who is she?)


        <span lang="it">Cosa mangi a colazione?</span> (What do you eat for breakfast?)


        <span lang="it">Dove abita tua madre?</span> (Where does your mother live?)


        <span lang="it">Quando arrivi?</span> (When are you arriving?)


        <span lang="it">Come stai?</span> (How are you?)


        <span lang="it">Quanti anni hai?</span> (How old are you? — literally ''How
        many years do you have?'')


        ## A contrastive pair


        Notice how the same topic produces a very different sentence depending on
        which type of question you use:


        Total: <span lang="it">Hai un fratello?</span> (Do you have a brother?) —
        answer: <span lang="it">Sì</span> or <span lang="it">No.</span>


        Partial: <span lang="it">Quanti fratelli hai?</span> (How many brothers do
        you have?) — answer requires a number or name.


        ## Common learner mistakes


        **Mistake 1: Translating English word order directly into Italian for total
        questions.**


        English requires ''do'' or auxiliary inversion: ''Do you speak Italian?''
        Italian does not need this. Never add <span lang="it">*fare</span> as a dummy
        auxiliary.


        Incorrect: <span lang="it">*Fai parli italiano?</span>

        Correct: <span lang="it">Parli italiano?</span>


        **Mistake 2: Forgetting to put the question word first in a partial question.**


        The question word must open the sentence.


        Incorrect: <span lang="it">*Tu abiti dove?</span> (placing <span lang="it">dove</span>
        at the end)

        Correct: <span lang="it">Dove abiti?</span>


        (Note: placing the question word at the end does occur in very informal spoken
        Italian for emphasis, but it is not standard and should be avoided at A1 level.)


        **Mistake 3: Confusing <span lang="it">come</span> (how) with <span lang="it">che
        / cosa</span> (what).**


        Incorrect: <span lang="it">*Come si chiama questo?</span> — actually this
        is correct! But learners sometimes use <span lang="it">cosa</span> where <span
        lang="it">come</span> is needed: <span lang="it">*Cosa ti chiami?</span> instead
        of the standard <span lang="it">Come ti chiami?</span> (What is your name?)


        **Mistake 4: Using <span lang="it">quale</span> where <span lang="it">che</span>
        or <span lang="it">cosa</span> is needed, or vice versa.**


        <span lang="it">Quale</span> means ''which'' and implies a choice among known
        options. <span lang="it">Che cosa</span> means ''what'' in an open sense.
        Compare: <span lang="it">Quale pizza preferisci?</span> (Which pizza do you
        prefer? — from a menu) vs. <span lang="it">Cosa mangi?</span> (What are you
        eating? — open question).


        ## Summary


        | Type | Italian name | Starts with | Expected answer |

        |---|---|---|---|

        | Total question | interrogativa totale | No special word — intonation only
        | sì or no |

        | Partial question | interrogativa parziale | A question word (chi, cosa,
        dove…) | A specific piece of information |'
      language: en
      why_this_matters: Questions are among the very first things you need in any
        language. From your first Italian conversation — ordering food, asking directions,
        meeting someone new — you will need to ask and understand questions constantly.
        Knowing the difference between the two types of question, and how to form
        each one correctly, removes one of the most common sources of confusion for
        beginners and immediately makes you sound more natural.
