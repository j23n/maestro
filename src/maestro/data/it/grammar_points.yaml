- code: costru_ess
  cefr_level: A1
  category: verbi
  unistr_code: la_coniugazione_attiva_con_particolare_riferimento_a_tutte_e_tre_le_persone
  unistr_label: la costruzione ci + verbo essere solo alla III persona singolare e
    plurale dell’indicativo presente ( c’è, ci sono )
  source_url: https://www.unistrapg.it/profilo_lingua_italiana/site/gram_verbi_a1.html
  chunk_ref: book_7_il_pronome_pronomi_dimostrativi_ci
  label: Costruzione ci + indicativo presente del verbo essere
  explanations:
    en:
      title: Using 'ci' with the verb 'essere'
      tip: Use 'ci' in front of 'essere' to say that something exists or is present
        in a place. 'C'è' means 'there is' and 'ci sono' means 'there are'. This construction
        is one of the most common in everyday Italian.
      explanation: '## The rule and how to form it


        Place the particle <span lang="it">ci</span> (meaning roughly ''here/there''
        in this use) directly before the present-tense forms of <span lang="it">essere</span>
        (''to be''). Only two forms are used in practice at this level:


        | Form | Used with | Meaning |

        |---|---|---|

        | c''è | one thing (singular noun) | ''there is'' |

        | ci sono | more than one thing (plural noun) | ''there are'' |


        Notice that <span lang="it">ci è</span> contracts to <span lang="it">c''è</span>
        (with an apostrophe) because <span lang="it">ci</span> ends in a vowel and
        <span lang="it">è</span> begins with one. <span lang="it">Ci sono</span> does
        not contract.


        ## Full present-tense paradigm


        Although only two forms appear in normal use, here is the complete picture
        for reference:


        | Italian | English |

        |---|---|

        | c''è | ''there is'' (singular) |

        | ci sono | ''there are'' (plural) |


        The forms <span lang="it">ci sei</span>, <span lang="it">ci siamo</span>,
        etc. exist but carry a different meaning (''are you there?'', ''we are here'')
        — they are not part of this construction and appear at higher levels.


        ## How to use it


        Put <span lang="it">c''è</span> or <span lang="it">ci sono</span> at the start
        of the sentence, followed by the noun (the thing that exists or is present).
        The noun after <span lang="it">c''è / ci sono</span> is the subject of the
        sentence — Italian treats it this way even though in English we say ''there
        is/are'' first.


        Basic word order:


        <span lang="it">C''è / Ci sono + [noun] + [optional: location or extra information]</span>


        ## Examples


        <span lang="it">C''è un gatto sul divano.</span> (There is a cat on the sofa.)


        <span lang="it">Ci sono tre sedie in cucina.</span> (There are three chairs
        in the kitchen.)


        <span lang="it">C''è latte nel frigorifero?</span> (Is there any milk in the
        fridge?) — question formed simply by using a rising intonation or a question
        mark; no word order change is needed.


        <span lang="it">No, non c''è latte, ma ci sono due uova.</span> (No, there
        is no milk, but there are two eggs.) — negative formed by placing <span lang="it">non</span>
        directly before <span lang="it">c''è</span> or <span lang="it">ci sono</span>.


        <span lang="it">C''è mia sorella a casa oggi.</span> (My sister is at home
        today.) — note that <span lang="it">c''è</span> can refer to a person being
        present, not just an object existing.


        <span lang="it">Ci sono molti bambini nel parco.</span> (There are many children
        in the park.)


        ## Negatives and questions at a glance


        | Type | Singular | Plural |

        |---|---|---|

        | Positive | c''è | ci sono |

        | Negative | non c''è | non ci sono |

        | Question | c''è…? | ci sono…? |


        ## Articles after c''è and ci sono


        The noun that follows almost always carries an indefinite article (<span lang="it">un,
        una, uno, un''</span>) when you are introducing something for the first time,
        or no article at all with uncountable nouns:


        <span lang="it">C''è un bambino alla porta.</span> (There is a child at the
        door.) — first mention, indefinite.


        <span lang="it">C''è acqua sul tavolo.</span> (There is water on the table.)
        — uncountable noun, no article.


        Using a definite article (<span lang="it">il, la, i, le</span>) is possible
        when the thing is already known to both speakers, but at A1 level you will
        mostly see the indefinite article or no article.


        ## Common learner mistakes


        **Mistake 1 — using the singular form with a plural noun:**

        <span lang="it">*C''è due ragazzi.</span> ✗ — incorrect. The noun <span lang="it">ragazzi</span>
        is plural, so you must use <span lang="it">ci sono</span>: <span lang="it">Ci
        sono due ragazzi.</span> ✓


        **Mistake 2 — forgetting the apostrophe in <span lang="it">c''è</span>:**

        <span lang="it">*ci è un libro</span> ✗ — in writing, this must always be
        contracted: <span lang="it">c''è un libro.</span> ✓


        **Mistake 3 — confusing <span lang="it">c''è</span> (there is) with <span
        lang="it">è</span> (he/she/it is):**

        <span lang="it">Il gatto è sul divano</span> means ''The cat is on the sofa''
        (describing where a specific, known cat is). <span lang="it">C''è un gatto
        sul divano</span> means ''There is a cat on the sofa'' (announcing its existence).
        Do not swap these two structures.


        **Mistake 4 — placing <span lang="it">non</span> in the wrong position:**

        <span lang="it">*C''è non latte.</span> ✗ — <span lang="it">non</span> must
        come before the verb, not after it: <span lang="it">Non c''è latte.</span>
        ✓'
      language: en
      why_this_matters: 'The construction <span lang="it">ci + essere</span> — giving
        us <span lang="it">c''è</span> and <span lang="it">ci sono</span> — is the
        standard Italian way to say ''there is'' and ''there are''. You will need
        it from your very first conversations: describing a room, asking what is on
        the menu, talking about your family, or checking whether a friend is home.
        Without it, you cannot describe the world around you in the most basic way.'
