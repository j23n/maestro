- code: art_un_una
  cefr_level: A0
  category: basics
  unistr_code: a0_articoli_un_una
  unistr_label: 'Indefinite articles: un, una, un'''
  label: Articoli indeterminativi singolari un una un'
  chunk_ref: book_5_l_articolo_le_forme
  bridges_to: all_det_in
  explanations:
    en:
      title: 'Indefinite Articles: un, una, un'''
      tip: ''
      explanation: |
        ## A / An in Italian

        In English you say "a coffee" or "an apple." In Italian, the word for "a" changes depending on the gender of the noun:

        - <span lang="it">**un**</span> = a (masculine) — <span lang="it">un caffè, un cornetto, un biglietto</span>
        - <span lang="it">**una**</span> = a (feminine) — <span lang="it">una pizza, una birra, una stazione</span>
        - <span lang="it">**un'**</span> = a (feminine, before a vowel) — <span lang="it">un'acqua, un'aranciata</span>

        **Quick rule of thumb:**
        - If the noun uses <span lang="it">**il**</span>, use <span lang="it">**un**</span>
        - If the noun uses <span lang="it">**la**</span>, use <span lang="it">**una**</span> (or <span lang="it">**un'**</span> before a vowel)

        **Examples:**

        - <span lang="it">*Vorrei **un** caffè.*</span> (I'd like a coffee.)
        - <span lang="it">*Vorrei **una** pizza.*</span> (I'd like a pizza.)
        - <span lang="it">*Vorrei **un'**acqua.*</span> (I'd like a water.)
      language: en
      why_this_matters: ''

- code: art_i_le
  cefr_level: A0
  category: basics
  unistr_code: a0_articoli_i_le
  unistr_label: 'Plural articles: i, le'
  label: Articoli determinativi plurali i e le
  chunk_ref: book_5_l_articolo_le_forme
  bridges_to: all_det_in
  explanations:
    en:
      title: 'Plural Articles: i and le'
      tip: ''
      explanation: |
        ## "The" in the plural

        You already know <span lang="it">**il**</span> (the, m.) and <span lang="it">**la**</span> (the, f.) for single things. When talking about more than one, use:

        - <span lang="it">**i**</span> = the (masculine plural) — <span lang="it">i gatti, i libri, i treni</span>
        - <span lang="it">**le**</span> = the (feminine plural) — <span lang="it">le pizze, le case, le stazioni</span>

        **How nouns change:**
        - Masculine nouns ending in **-o** → **-i**: <span lang="it">gatto → gatti</span>
        - Feminine nouns ending in **-a** → **-e**: <span lang="it">pizza → pizze</span>

        At this stage, you just need to recognize <span lang="it">**i**</span> and <span lang="it">**le**</span> when you see them — especially with <span lang="it">*mi piacciono*</span>:

        - <span lang="it">*Mi piacciono **i** gatti.*</span> (I like cats.)
        - <span lang="it">*Mi piacciono **le** pizze.*</span> (I like pizzas.)
      language: en
      why_this_matters: ''

- code: num_20_100
  cefr_level: A0
  category: basics
  unistr_code: a0_numeri_20_100
  unistr_label: Numbers 20–100
  label: Numeri da venti a cento
  chunk_ref: null
  bridges_to: card_1_100
  explanations:
    en:
      title: Numbers from Twenty to One Hundred
      tip: ''
      explanation: |
        ## I numeri da 20 a 100

        You already know 0–20. Now for prices, times, and addresses, you need the rest:

        ### Tens

        | Number | Italian |
        |--------|---------|
        | 20 | <span lang="it">venti</span> |
        | 30 | <span lang="it">trenta</span> |
        | 40 | <span lang="it">quaranta</span> |
        | 50 | <span lang="it">cinquanta</span> |
        | 60 | <span lang="it">sessanta</span> |
        | 70 | <span lang="it">settanta</span> |
        | 80 | <span lang="it">ottanta</span> |
        | 90 | <span lang="it">novanta</span> |
        | 100 | <span lang="it">cento</span> |

        ### Combining tens and units

        Just join the ten and the unit: <span lang="it">*venti* + *uno* = **ventuno**</span>.

        **Drop the final vowel of the ten** before <span lang="it">*uno*</span> and <span lang="it">*otto*</span>:
        - <span lang="it">vent**uno**</span> (21), <span lang="it">vent**otto**</span> (28)
        - <span lang="it">trent**uno**</span> (31), <span lang="it">trent**otto**</span> (38)

        All others just join: <span lang="it">venti**due**</span> (22), <span lang="it">trenta**cinque**</span> (35), <span lang="it">quaranta**sei**</span> (46).

        **Examples:**

        - <span lang="it">*Sono quarantacinque euro.*</span> (It's forty-five euros.)
        - <span lang="it">*Binario ventuno.*</span> (Platform twenty-one.)
      language: en
      why_this_matters: ''

- code: ore_giorni
  cefr_level: A0
  category: basics
  unistr_code: a0_ore_giorni
  unistr_label: Telling time and days of the week
  label: Ore e giorni della settimana
  chunk_ref: null
  bridges_to: art_hora
  explanations:
    en:
      title: Telling Time and Days of the Week
      tip: ''
      explanation: |
        ## Che ore sono? — What time is it?

        ### Asking the time

        - <span lang="it">**Che ore sono?**</span> — What time is it?
        - <span lang="it">**A che ora...?**</span> — At what time...?

        ### Telling the time

        - <span lang="it">**È l'una.**</span> — It's one o'clock. (singular)
        - <span lang="it">**Sono le due.**</span> — It's two o'clock. (plural for 2–12)
        - <span lang="it">**Sono le tre e mezza.**</span> — It's three thirty.
        - <span lang="it">**Sono le dieci e un quarto.**</span> — It's quarter past ten.

        Italy uses the 24-hour clock in formal contexts (timetables, appointments):
        - <span lang="it">**Sono le quindici.**</span> — It's 3 PM. (15:00)
        - <span lang="it">**Il treno parte alle diciotto.**</span> — The train leaves at 6 PM.

        ### Days of the week

        | Italian | English |
        |---------|---------|
        | <span lang="it">lunedì</span> | Monday |
        | <span lang="it">martedì</span> | Tuesday |
        | <span lang="it">mercoledì</span> | Wednesday |
        | <span lang="it">giovedì</span> | Thursday |
        | <span lang="it">venerdì</span> | Friday |
        | <span lang="it">sabato</span> | Saturday |
        | <span lang="it">domenica</span> | Sunday |

        Days are not capitalised in Italian.

        - <span lang="it">*Oggi è lunedì.*</span> (Today is Monday.)
        - <span lang="it">*Il museo è chiuso il martedì.*</span> (The museum is closed on Tuesdays.)
      language: en
      why_this_matters: ''

- code: vocab_cibo
  cefr_level: A0
  category: basics
  unistr_code: a0_cibo
  unistr_label: Food and restaurant vocabulary
  label: Vocabolario del cibo e del ristorante
  chunk_ref: null
  explanations:
    en:
      title: Food and Restaurant Vocabulary
      tip: ''
      explanation: |
        ## Al ristorante

        ### The Italian menu

        An Italian meal follows a traditional order:

        | Course | Italian | What it is |
        |--------|---------|------------|
        | Starters | <span lang="it">**antipasti**</span> | Cold cuts, bruschetta, etc. |
        | First course | <span lang="it">**primo**</span> | Pasta, risotto, soup |
        | Second course | <span lang="it">**secondo**</span> | Meat or fish |
        | Side dish | <span lang="it">**contorno**</span> | Vegetables, salad |
        | Dessert | <span lang="it">**dolce**</span> | Cake, tiramisù, gelato |

        You don't have to order every course — a <span lang="it">primo</span> and a <span lang="it">contorno</span> is a perfectly normal lunch.

        ### Useful restaurant phrases

        - <span lang="it">**Un tavolo per due, per favore.**</span> — A table for two, please.
        - <span lang="it">**Il menù, per favore.**</span> — The menu, please.
        - <span lang="it">**Il conto, per favore.**</span> — The bill, please.
        - <span lang="it">**Acqua naturale o frizzante?**</span> — Still or sparkling water?

        ### Dietary needs

        - <span lang="it">**Sono vegetariano/a.**</span> — I'm vegetarian.
        - <span lang="it">**Sono allergico/a a...**</span> — I'm allergic to...
        - <span lang="it">**Senza glutine**</span> — Gluten-free
      language: en
      why_this_matters: ''

- code: vocab_viaggio
  cefr_level: A0
  category: basics
  unistr_code: a0_viaggio
  unistr_label: Transport and travel vocabulary
  label: Vocabolario del viaggio e dei trasporti
  chunk_ref: null
  explanations:
    en:
      title: Transport and Travel Vocabulary
      tip: ''
      explanation: |
        ## In viaggio — Getting around

        ### Key transport words

        | Italian | English |
        |---------|---------|
        | <span lang="it">il treno</span> | the train |
        | <span lang="it">l'autobus</span> | the bus |
        | <span lang="it">il taxi</span> | the taxi |
        | <span lang="it">la metropolitana / la metro</span> | the metro / underground |
        | <span lang="it">il biglietto</span> | the ticket |
        | <span lang="it">andata</span> | one way |
        | <span lang="it">andata e ritorno</span> | return / round trip |
        | <span lang="it">il binario</span> | the platform |
        | <span lang="it">la fermata</span> | the stop (bus/tram) |
        | <span lang="it">la stazione</span> | the station |
        | <span lang="it">l'aeroporto</span> | the airport |

        ### Essential travel phrases

        - <span lang="it">**Vorrei un biglietto per Roma.**</span> — I'd like a ticket to Rome.
        - <span lang="it">**Andata e ritorno.**</span> — Round trip.
        - <span lang="it">**A che ora parte il treno?**</span> — What time does the train leave?
        - <span lang="it">**Da che binario?**</span> — From which platform?
        - <span lang="it">**Quanto costa il biglietto?**</span> — How much is the ticket?
        - <span lang="it">**Dov'è la fermata dell'autobus?**</span> — Where is the bus stop?
      language: en
      why_this_matters: ''

- code: saluti
  cefr_level: A0
  category: basics
  unistr_code: a0_saluti
  unistr_label: Greetings and farewells
  label: Saluti e congedi
  chunk_ref: null
  explanations:
    en:
      title: Greetings and Farewells in Italian
      tip: ''
      explanation: 'In Italian, you use different greetings depending on the time
        of day and how formal the situation is. <span lang="it">**Ciao**</span> is
        a friendly, informal word that means both "hello" and "goodbye" — you can
        use it with friends and family. For more formal situations, or when meeting
        someone for the first time, use <span lang="it">**buongiorno**</span> (good
        morning/good day) or <span lang="it">**buonasera**</span> (good evening).


        - <span lang="it">**Ciao, Marco!**</span> (Hi, Marco! / Bye, Marco!)

        - <span lang="it">**Buongiorno, signora Rossi.**</span> (Good morning, Mrs.
        Rossi.)

        - <span lang="it">**Buonasera a tutti!**</span> (Good evening, everyone!)


        When saying goodbye, <span lang="it">**arrivederci**</span> is a polite way
        to say "goodbye" (literally "until we see each other again"), and <span lang="it">**a
        presto**</span> means "see you soon" — a warm way to end a conversation with
        someone you expect to meet again.'
      language: en
      why_this_matters: ''
- code: pronun_bas
  cefr_level: A0
  category: basics
  unistr_code: a0_pronuncia
  unistr_label: Italian pronunciation basics
  label: Pronuncia italiana fondamentale
  chunk_ref: null
  explanations:
    en:
      title: Italian Pronunciation Basics
      tip: ''
      explanation: "## How to Pronounce Italian\n\nItalian is a very **phonetic**\
        \ language — almost every letter is always pronounced the same way, so once\
        \ you learn the sounds, you can read any Italian word out loud!\n\n### The\
        \ Five Vowels\n\nItalian has five vowels, and each one has only **one** clear,\
        \ pure sound:\n\n| Letter | Sound | Example |\n|--------|-------|---------|\n\
        | **a** | like 'ah' | <span lang=\"it\">**a**more</span> (love) |\n| **e**\
        \ | like 'eh' | <span lang=\"it\">**e**state</span> (summer) |\n| **i** |\
        \ like 'ee' | <span lang=\"it\">**i**sola</span> (island) |\n| **o** | like\
        \ 'oh' | <span lang=\"it\">**o**ra</span> (hour/now) |\n| **u** | like 'oo'\
        \ | <span lang=\"it\">**u**va</span> (grape) |\n\nEvery vowel is **always**\
        \ pronounced clearly — never swallowed or skipped.\n\n### Hard and Soft C\
        \ and G\n\nThe letters **c** and **g** change their sound depending on the\
        \ vowel that follows:\n\n- **Hard sound** (like English *k* / *g*) — before\
        \ **a, o, u**:\n  - <span lang=\"it\">**ca**sa</span> (house), <span lang=\"\
        it\">**co**sa</span> (thing), <span lang=\"it\">**cu**ore</span> (heart)\n\
        \  - <span lang=\"it\">**ga**tto</span> (cat), <span lang=\"it\">**go**mma</span>\
        \ (rubber), <span lang=\"it\">**gu**sto</span> (taste)\n\n- **Soft sound**\
        \ (like English *ch* / *j*) — before **e, i**:\n  - <span lang=\"it\">**ce**na</span>\
        \ (*cheh*-na — dinner), <span lang=\"it\">**ci**ao</span> (*chow* — hi/bye)\n\
        \  - <span lang=\"it\">**ge**lato</span> (*jeh*-lato — ice cream), <span lang=\"\
        it\">**gi**ro</span> (*jee*-ro — tour)\n\n### Double Consonants\n\nWhen you\
        \ see a double consonant (like **tt**, **ll**, **nn**), you hold the sound\
        \ **slightly longer**. This matters because it can change the meaning of a\
        \ word!\n\n- <span lang=\"it\">**fato**</span> (fate) vs. <span lang=\"it\"\
        >**fatto**</span> (done/fact)\n- <span lang=\"it\">**nono**</span> (ninth)\
        \ vs. <span lang=\"it\">**nonno**</span> (grandfather)\n- <span lang=\"it\"\
        >**pala**</span> (shovel) vs. <span lang=\"it\">**palla**</span> (ball)\n\n\
        Think of it like a tiny pause or extra emphasis on that consonant.\n\n###\
        \ Quick Tips\n- Every letter in Italian is **pronounced** — there are almost\
        \ no silent letters.\n- Stress usually falls on the **second-to-last** syllable:\
        \ <span lang=\"it\">*pa-**sta***</span>, <span lang=\"it\">*ca-**sa***</span>,\
        \ <span lang=\"it\">*a-**mi**-co*</span>.\n- Practice saying the vowels out\
        \ loud every day — they are the heart of Italian pronunciation!"
      language: en
      why_this_matters: ''
- code: num_0_20
  cefr_level: A0
  category: basics
  unistr_code: a0_numeri_0_20
  unistr_label: Numbers 0–20
  label: Numeri da zero a venti
  chunk_ref: null
  explanations:
    en:
      title: Numbers from Zero to Twenty
      tip: ''
      explanation: 'Numbers in Italian from 0 to 20 are essential building blocks
        for everyday communication. Learning them allows you to count, give your age,
        talk about quantities, and much more. Here are the numbers to memorize:


        | Number | Italian |

        |--------|----------|

        | 0 | <span lang="it">zero</span> |

        | 1 | <span lang="it">uno</span> |

        | 2 | <span lang="it">due</span> |

        | 3 | <span lang="it">tre</span> |

        | 4 | <span lang="it">quattro</span> |

        | 5 | <span lang="it">cinque</span> |

        | 6 | <span lang="it">sei</span> |

        | 7 | <span lang="it">sette</span> |

        | 8 | <span lang="it">otto</span> |

        | 9 | <span lang="it">nove</span> |

        | 10 | <span lang="it">dieci</span> |

        | 11 | <span lang="it">undici</span> |

        | 12 | <span lang="it">dodici</span> |

        | 13 | <span lang="it">tredici</span> |

        | 14 | <span lang="it">quattordici</span> |

        | 15 | <span lang="it">quindici</span> |

        | 16 | <span lang="it">sedici</span> |

        | 17 | <span lang="it">diciassette</span> |

        | 18 | <span lang="it">diciotto</span> |

        | 19 | <span lang="it">diciannove</span> |

        | 20 | <span lang="it">venti</span> |


        **Examples:**


        - <span lang="it">*Ho due gatti.*</span> (I have two cats.)

        - <span lang="it">*Lei ha quindici anni.*</span> (She is fifteen years old.)

        - <span lang="it">*Ci sono venti studenti in classe.*</span> (There are twenty
        students in class.)


        > **Tip:** Notice that numbers 11-16 end in <span lang="it">**-dici**</span>
        (from <span lang="it">*dieci*</span>, meaning ten), and numbers 17-19 start
        with <span lang="it">**dici-**</span>. This can help you remember them more
        easily!'
      language: en
      why_this_matters: ''
- code: si_no_non
  cefr_level: A0
  category: basics
  unistr_code: a0_si_no_non
  unistr_label: Yes, no, not
  label: Affermazione, negazione e negativo
  chunk_ref: null
  explanations:
    en:
      title: How to Say Yes, No, and Not
      tip: ''
      explanation: 'In Italian, you use <span lang="it">**sì**</span> to say yes and
        <span lang="it">**no**</span> to say no. When you want to make a verb negative
        (say you do *not* do something), you put <span lang="it">**non**</span> directly
        before the verb.


        **Examples:**


        - <span lang="it">*Sì, parlo italiano.*</span> (Yes, I speak Italian.)

        - <span lang="it">*No, non parlo francese.*</span> (No, I do not speak French.)

        - <span lang="it">*Non capisco.*</span> (I do not understand.)


        **Tip:** Remember that <span lang="it">**no**</span> is used on its own as
        a short answer, while <span lang="it">**non**</span> always comes right before
        a verb to make it negative. You will use both of them all the time!'
      language: en
      why_this_matters: ''
- code: simp_sent
  cefr_level: A0
  category: basics
  unistr_code: a0_frase_semplice
  unistr_label: Simple sentences
  label: Frasi semplici dichiarative
  chunk_ref: book_2_la_frase
  explanations:
    en:
      title: Building a Simple Italian Sentence
      tip: ''
      explanation: 'In Italian, a basic sentence follows a simple order: **subject**
        (who does the action) + **verb** (the action) + **object** (what the action
        is done to). This is very similar to English, so it is easy to get started!
        Just put the pieces together in the right order.


        **Examples:**


        - <span lang="it">*Marco mangia una pizza.*</span> (Marco eats a pizza.)

        - <span lang="it">*Io bevo il caffè.*</span> (I drink the coffee.)

        - <span lang="it">*La bambina legge un libro.*</span> (The little girl reads
        a book.)


        **Tip:** In Italian, you can often leave out the subject pronoun (like <span
        lang="it">*io*</span>, <span lang="it">*tu*</span>, <span lang="it">*lui*</span>)
        because the verb ending already tells you who is doing the action. For example,
        <span lang="it">*Mangio una pizza*</span> means **I** eat a pizza — the <span
        lang="it">*-o*</span> ending on <span lang="it">*mangio*</span> shows it is
        "I".'
      language: en
      why_this_matters: ''
- code: vorrei
  cefr_level: A0
  category: basics
  unistr_code: a0_vorrei
  unistr_label: Vorrei (I would like)
  label: Condizionale presente di volere per cortesia
  chunk_ref: book_8_il_verbo_uso_degli_altri_modi_condizionale
  explanations:
    en:
      title: 'Vorrei: Making Polite Requests'
      tip: ''
      explanation: '<span lang="it">**Vorrei**</span> means **"I would like"** and
        is the polite way to ask for something in Italian. It is much more common
        and courteous than simply saying "I want" (<span lang="it">*voglio*</span>).
        Use it whenever you are ordering food, shopping, or making a request.


        **How to use it:**

        Just say <span lang="it">**vorrei**</span> + the thing you want.


        **Examples:**

        - <span lang="it">*Vorrei un caffè.*</span> (I would like a coffee.)

        - <span lang="it">*Vorrei un biglietto, per favore.*</span> (I would like
        a ticket, please.)

        - <span lang="it">*Vorrei dell''acqua.*</span> (I would like some water.)


        > **Tip:** You can always add <span lang="it">**per favore**</span> (please)
        at the end to sound extra polite!'
      language: en
      why_this_matters: ''
- code: polite_exp
  cefr_level: A0
  category: basics
  unistr_code: a0_cortesia
  unistr_label: Polite expressions
  label: Espressioni di cortesia e ringraziamento
  chunk_ref: null
  explanations:
    en:
      title: 'Polite Words: per favore, grazie and More'
      tip: ''
      explanation: 'Italian has a few very important **polite words** that you will
        use every day. Learning these words first will help you be friendly and respectful
        right away.


        **The key polite words:**


        | Italian | English |

        |---|---|

        | <span lang="it">per favore</span> | please |

        | <span lang="it">grazie</span> | thank you |

        | <span lang="it">prego</span> | you''re welcome |

        | <span lang="it">scusi</span> / <span lang="it">scusa</span> | excuse me
        / sorry |

        | <span lang="it">mi dispiace</span> | I''m sorry |


        **Examples:**


        - <span lang="it">*Un caffè, per favore.*</span> (A coffee, please.)

        - <span lang="it">*Grazie!*</span> — <span lang="it">*Prego!*</span> (Thank
        you! — You''re welcome!)

        - <span lang="it">*Scusi, dov''è la stazione?*</span> (Excuse me, where is
        the train station?)


        **Quick tip:** Use <span lang="it">**scusi**</span> with strangers or adults
        you don''t know (formal), and <span lang="it">**scusa**</span> with friends
        or people your own age (informal). Use <span lang="it">**mi dispiace**</span>
        when you feel genuinely sorry about something, for example: <span lang="it">*Mi
        dispiace, non lo so.*</span> (I''m sorry, I don''t know.)'
      language: en
      why_this_matters: ''
- code: art_il_la
  cefr_level: A0
  category: basics
  unistr_code: a0_articoli_il_la
  unistr_label: 'Articles: il and la'
  label: Articoli determinativi singolari il e la
  chunk_ref: book_5_l_articolo_le_forme
  explanations:
    en:
      title: 'Articles il and la: Masculine and Feminine'
      tip: ''
      explanation: 'In Italian, every noun (person, place, or thing) is either **masculine**
        or **feminine**. The word for **"the"** changes depending on the gender: use
        <span lang="it">**il**</span> before masculine nouns and <span lang="it">**la**</span>
        before feminine nouns. You will need to learn the gender of each new word
        as you go — it is usually shown in a dictionary.


        **Examples:**

        - <span lang="it">*il ragazzo*</span> (the boy) — masculine, so we use <span
        lang="it">**il**</span>

        - <span lang="it">*la ragazza*</span> (the girl) — feminine, so we use <span
        lang="it">**la**</span>

        - <span lang="it">*il libro*</span> (the book) — masculine, so we use <span
        lang="it">**il**</span>

        - <span lang="it">*la porta*</span> (the door) — feminine, so we use <span
        lang="it">**la**</span>


        **Quick tip:** Most masculine nouns end in **-o** and most feminine nouns
        end in **-a**, but there are exceptions, so always check!'
      language: en
      why_this_matters: ''
- code: che_cose
  cefr_level: A0
  category: basics
  unistr_code: a0_che_cose
  unistr_label: What is it? (Che cos'è?)
  label: Domanda identificativa che cos'è
  chunk_ref: null
  explanations:
    en:
      title: 'Asking What Something Is: Che cos''è?'
      tip: ''
      explanation: "## Asking \"What is it?\" in Italian\n\n<span lang=\"it\">**Che\
        \ cos'è?**</span> is how you ask *\"What is it?\"* or *\"What is this?\"*\
        \ in Italian. You can also say <span lang=\"it\">**Che cos'è questo?**</span>\
        \ when you want to point at something specific and ask what it is. It is one\
        \ of the most useful questions for beginners!\n\n### Examples\n\n- <span lang=\"\
        it\">**Che cos'è?**</span> (What is it?)\n- <span lang=\"it\">**Che cos'è\
        \ questo?**</span> (What is this?)\n- <span lang=\"it\">**Che cos'è quella\
        \ cosa?**</span> (What is that thing?)\n\n### How to answer\n\nTo answer,\
        \ you use <span lang=\"it\">**È**</span> (it is) followed by the name of the\
        \ thing:\n\n- — <span lang=\"it\">Che cos'è questo?</span> *(What is this?)*\n\
        \  — <span lang=\"it\">**È un libro.**</span> *(It is a book.)*\n- — <span\
        \ lang=\"it\">Che cos'è?</span> *(What is it?)*\n  — <span lang=\"it\">**È\
        \ una mela.**</span> *(It is an apple.)*\n\n> **Tip:** <span lang=\"it\">**È**</span>\
        \ comes from the verb <span lang=\"it\">*essere*</span> (to be). You don't\
        \ need to say a word for \"it\" — <span lang=\"it\">**È**</span> alone already\
        \ means *\"It is.\"*"
      language: en
      why_this_matters: ''
- code: subj_pron
  cefr_level: A0
  category: basics
  unistr_code: a0_pronomi_soggetto
  unistr_label: 'Subject pronouns: io, tu, lui/lei'
  label: Pronomi personali soggetto io tu lui lei
  chunk_ref: book_7_il_pronome_pronomi_personali_pronomi_personali_soggetto
  explanations:
    en:
      title: 'Subject Pronouns: io, tu, lui, lei'
      tip: ''
      explanation: 'In Italian, subject pronouns tell us *who* is doing the action
        in a sentence. The most common ones are: <span lang="it">**io**</span> (I),
        <span lang="it">**tu**</span> (you), <span lang="it">**lui**</span> (he),
        and <span lang="it">**lei**</span> (she). Unlike in English, Italian speakers
        often leave these pronouns out, because the verb ending already shows who
        is doing the action — but they are still very useful to know!


        **Examples:**

        - <span lang="it">**Io sono Marco.**</span> (I am Marco.)

        - <span lang="it">**Tu parli italiano.**</span> (You speak Italian.)

        - <span lang="it">**Lui si chiama Luca.**</span> (He is called Luca.)

        - <span lang="it">**Lei è studentessa.**</span> (She is a student.)


        > **Quick tip:** Notice that <span lang="it">**lei**</span> (she) is written
        with a lowercase *l*. When <span lang="it">**Lei**</span> is written with
        a capital *L*, it means *you* in a formal/polite context — but don''t worry
        about that just yet!'
      language: en
      why_this_matters: ''
- code: essere_pre
  cefr_level: A0
  category: basics
  unistr_code: a0_essere
  unistr_label: 'To be: sono, sei, è'
  label: Indicativo presente di essere forme sono sei è
  chunk_ref: book_8_il_verbo_prospetto_dei_modi_e_dei_tempi_del_verbopresente_passato_futuro_essere
  explanations:
    en:
      title: 'The Verb essere: sono, sei, è...'
      tip: ''
      explanation: '## The verb *essere* (to be)


        In Italian, the verb <span lang="it">**essere**</span> means *to be*. Here
        are all six forms:


        | Italian | English |

        |---|---|

        | <span lang="it">io **sono**</span> | I am |

        | <span lang="it">tu **sei**</span> | you are |

        | <span lang="it">lui/lei **è**</span> | he/she is |

        | <span lang="it">noi **siamo**</span> | we are |

        | <span lang="it">voi **siete**</span> | you (plural) are |

        | <span lang="it">loro **sono**</span> | they are |


        > Focus on <span lang="it">io</span>/<span lang="it">tu</span>/<span lang="it">lui</span>
        for now — you''ll practice the others soon!


        > Notice that <span lang="it">**è**</span> has an accent mark — this helps
        distinguish it from the word <span lang="it">*e*</span>, which means *and*.


        **Examples:**


        - <span lang="it">*Io sono Marco.*</span> (I am Marco.)

        - <span lang="it">*Tu sei italiana.*</span> (You are Italian.)

        - <span lang="it">*Lei è studentessa.*</span> (She is a student.)


        Just match the correct form to the person you are talking about, and you are
        ready to go!'
      language: en
      why_this_matters: ''
- code: mi_piace
  cefr_level: A0
  category: basics
  unistr_code: a0_mi_piace
  unistr_label: I like / I don't like
  label: Indicativo presente di piacere forme mi piace non mi piace
  chunk_ref: null
  explanations:
    en:
      title: 'Likes and Dislikes: mi piace / non mi piace'
      tip: ''
      explanation: '## Saying What You Like and Don''t Like


        In Italian, you don''t say "I like pizza" the way you do in English. Instead,
        you say <span lang="it">**mi piace**</span>, which works more like "pizza
        pleases me." Think of it as the thing you like *doing the action* — it pleases
        you!


        - Use <span lang="it">**mi piace**</span> to say you like something.

        - Use <span lang="it">**non mi piace**</span> to say you don''t like something.

        - Use <span lang="it">**ti piace?**</span> to ask someone else if they like
        something.


        ### With a noun (a thing)


        When you like **one thing**, use <span lang="it">**mi piace**</span> + the
        noun:


        - <span lang="it">**Mi piace la pizza.**</span> (I like pizza.)

        - <span lang="it">**Non mi piace il caffè.**</span> (I don''t like coffee.)


        > Notice that Italian uses <span lang="it">**la**</span> or <span lang="it">**il**</span>
        (the) before the noun — this is normal and required in Italian!


        ### With a verb (an activity)


        When you like **doing something**, use <span lang="it">**mi piace**</span>
        + the infinitive (the base form of a verb, like <span lang="it">*mangiare*</span>
        = to eat):


        - <span lang="it">**Mi piace mangiare.**</span> (I like eating / I like to
        eat.)

        - <span lang="it">**Non mi piace studiare.**</span> (I don''t like studying
        / I don''t like to study.)


        ### Asking a question


        To ask someone if they like something, just use <span lang="it">**ti piace?**</span>:


        - <span lang="it">**Ti piace la musica?**</span> (Do you like music?)


        ### Quick summary


        | Italian | English |

        |---|---|

        | <span lang="it">Mi piace la pizza.</span> | I like pizza. |

        | <span lang="it">Non mi piace il caffè.</span> | I don''t like coffee. |

        | <span lang="it">Mi piace mangiare.</span> | I like eating. |

        | <span lang="it">Ti piace la musica?</span> | Do you like music? |


        > **Tip:** To make it negative, just add <span lang="it">**non**</span> before
        <span lang="it">**mi piace**</span>. Easy!'
      language: en
      why_this_matters: ''
- code: dove_e
  cefr_level: A0
  category: basics
  unistr_code: a0_dove
  unistr_label: Where is it? (Dov'è?)
  label: Domanda di localizzazione dov'è
  chunk_ref: null
  explanations:
    en:
      title: 'Asking Where Something Is: Dov''è?'
      tip: ''
      explanation: '## Asking "Where is...?" in Italian


        <span lang="it">**Dov''è**</span> is how you ask "Where is...?" in Italian.
        It is a combination of <span lang="it">**dove**</span> (where) and <span lang="it">**è**</span>
        (is), joined together with an apostrophe. Use it whenever you want to find
        out the location of a person, place, or thing.


        ### How to use it


        Simply say <span lang="it">**Dov''è**</span> and then the person or thing
        you are looking for:


        > <span lang="it">**Dov''è**</span> + [the thing/person you want to find]


        ### Examples


        - <span lang="it">**Dov''è il bagno?**</span>

        (Where is the bathroom?)


        - <span lang="it">**Dov''è la stazione?**</span>

        (Where is the train station?)


        - <span lang="it">**Dov''è Marco?**</span>

        (Where is Marco?)


        ### Useful tip


        In Italian, nouns have a gender — they are either **masculine** or **feminine**.
        This affects the small word before the noun (the article):


        - <span lang="it">**il**</span> is used before most masculine nouns

        - <span lang="it">**la**</span> is used before most feminine nouns


        But don''t worry about this too much right now — just start using <span lang="it">**Dov''è?**</span>
        and you will pick it up naturally!


        ### Quick answer phrases


        When someone answers your question, they might say:

        - <span lang="it">**È qui.**</span> (It is here.)

        - <span lang="it">**È lì.**</span> (It is there.)

        - <span lang="it">**È a destra.**</span> (It is on the right.)

        - <span lang="it">**È a sinistra.**</span> (It is on the left.)'
      language: en
      why_this_matters: ''
- code: prep_place
  cefr_level: A0
  category: basics
  unistr_code: a0_preposizioni
  unistr_label: 'Prepositions of place: a, in, di'
  label: 'Preposizioni di luogo: a, in, di'
  chunk_ref: book_10_la_preposizione_preposizioni_proprie
  explanations:
    en:
      title: 'Prepositions of Place: a, in, di'
      tip: ''
      explanation: '## Prepositions of Place: a, in, di


        In Italian, small words called **prepositions** tell us where something or
        someone is, or where they are going. The three most common ones are <span
        lang="it">**a**</span> (to / at), <span lang="it">**in**</span> (in / inside),
        and <span lang="it">**di**</span> (of / from). Think of them as location connectors
        — they link a person or thing to a place.


        ### a — to / at

        Use <span lang="it">**a**</span> before the name of a city, or to say you
        are at a specific place.


        - <span lang="it">*Vado **a** Roma.*</span> (I am going **to** Rome.)

        - <span lang="it">*Sono **a** scuola.*</span> (I am **at** school.)


        ### in — in / inside

        Use <span lang="it">**in**</span> before the name of a country, region, or
        a general space you are inside.


        - <span lang="it">*Abito **in** Italia.*</span> (I live **in** Italy.)

        - <span lang="it">*Il gatto è **in** giardino.*</span> (The cat is **in**
        the garden.)


        ### di — of / from

        Use <span lang="it">**di**</span> to show where someone comes from or that
        something belongs to a place.


        - <span lang="it">*Sono **di** Milano.*</span> (I am **from** Milan.)

        - <span lang="it">*È la pizza **di** Napoli.*</span> (It is the pizza **of**
        Naples.)


        > **Quick tip:** Use <span lang="it">**a**</span> with cities and <span lang="it">**in**</span>
        with countries — this is the most common pattern for beginners!'
      language: en
      why_this_matters: ''
- code: mi_chiamo
  cefr_level: A0
  category: basics
  unistr_code: a0_mi_chiamo
  unistr_label: My name is... (Mi chiamo)
  label: Verbo chiamarsi al presente indicativo per l'autopresentazione
  chunk_ref: null
  explanations:
    en:
      title: 'Introducing Yourself: Mi chiamo...'
      tip: ''
      explanation: '## Saying Your Name in Italian


        In Italian, you don''t say *"I am called..."* word for word — instead, you
        use the phrase <span lang="it">**mi chiamo**</span> followed by your name.
        Think of it like saying *"I call myself..."* It is the most natural and common
        way to introduce yourself in Italian.


        **The formula is simple:**

        > <span lang="it">**Mi chiamo**</span> + [your name]


        ### Examples


        - <span lang="it">**Mi chiamo Marco.**</span> (My name is Marco.)

        - <span lang="it">**Mi chiamo Sofia.**</span> (My name is Sofia.)

        - <span lang="it">**Mi chiamo Anna. E tu?**</span> (My name is Anna. And you?)


        ### How to Use It


        When you meet someone new, you can say <span lang="it">**mi chiamo**</span>
        and add your name right after. That''s it! No other words are needed. You
        can also ask someone else their name by saying:


        - <span lang="it">**Come ti chiami?**</span> (What is your name? / literally:
        What do you call yourself?)


        And they will answer:

        - <span lang="it">**Mi chiamo Luca.**</span> (My name is Luca.)


        ### Quick Tip


        <span lang="it">*Mi chiamo*</span> comes from the verb <span lang="it">**chiamarsi**</span>
        (to call oneself). For now, you don''t need to learn the whole verb — just
        remember this one ready-made phrase and use it every time you introduce yourself!'
      language: en
      why_this_matters: ''
- code: noun_o_a_e
  cefr_level: A1
  category: nome
  source_url: https://www.unistrapg.it/profilo_lingua_italiana/site/gram_nome_a1.html
  unistr_code: la_distinzione_genere_e_numero_dei_nomi_regolari_a_suffisso_o_a_e_a_suffisso_e
  unistr_label: La distinzione genere e numero dei nomi regolari a suffisso –O –A
    e a suffisso –E
  chunk_ref: book_4_il_nome_la_formazione_del_plurale
  label: Genere e numero regolari di nomi suffissi O A E
  explanations:
    en:
      title: Plural forms of Italian nouns
      tip: Most Italian nouns change their final vowel to form the plural. Nouns ending
        in -o or -e change to -i, and nouns ending in -a change to -e. Learning these
        three patterns lets you talk about more than one person, animal, or thing.
      explanation: "## The three regular patterns\n\nItalian nouns belong to one of\
        \ three groups based on their singular ending. To make them plural, replace\
        \ that final vowel as follows:\n\n| Singular ending | Plural ending | Typical\
        \ gender |\n|---|---|---|\n| -o | -i | masculine |\n| -a | -e | feminine |\n\
        | -e | -i | masculine or feminine |\n\nThe article changes alongside the noun.\
        \ Masculine singular <span lang=\"it\">il</span> becomes <span lang=\"it\"\
        >i</span>, and feminine singular <span lang=\"it\">la</span> becomes <span\
        \ lang=\"it\">le</span>. Nouns whose singular form uses the article <span\
        \ lang=\"it\">lo</span> (used before certain consonant clusters) take <span\
        \ lang=\"it\">gli</span> in the plural.\n\n---\n\n## Pattern 1: <span lang=\"\
        it\">-o → -i</span> (mostly masculine)\n\nMost nouns ending in <span lang=\"\
        it\">-o</span> are masculine. Replace <span lang=\"it\">-o</span> with <span\
        \ lang=\"it\">-i</span> and change <span lang=\"it\">il</span> to <span lang=\"\
        it\">i</span>:\n\n| Singular | Plural | Meaning |\n|---|---|---|\n| il libro\
        \ | i libri | book / books |\n| il ragazzo | i ragazzi | boy / boys |\n| il\
        \ cane | — | (see Pattern 3) |\n\n---\n\n## Pattern 2: <span lang=\"it\">-a\
        \ → -e</span> (mostly feminine)\n\nMost nouns ending in <span lang=\"it\"\
        >-a</span> are feminine. Replace <span lang=\"it\">-a</span> with <span lang=\"\
        it\">-e</span> and change <span lang=\"it\">la</span> to <span lang=\"it\"\
        >le</span>:\n\n| Singular | Plural | Meaning |\n|---|---|---|\n| la mela |\
        \ le mele | apple / apples |\n| la sorella | le sorelle | sister / sisters\
        \ |\n| la preda | le prede | prey / (instances of) prey |\n\n---\n\n## Pattern\
        \ 3: <span lang=\"it\">-e → -i</span> (masculine or feminine)\n\nNouns ending\
        \ in <span lang=\"it\">-e</span> can be either masculine or feminine — you\
        \ need to learn each noun's gender individually. Both genders replace <span\
        \ lang=\"it\">-e</span> with <span lang=\"it\">-i</span>:\n\n| Singular |\
        \ Plural | Meaning | Gender |\n|---|---|---|---|\n| il cane | i cani | dog\
        \ / dogs | masculine |\n| la madre | le madri | mother / mothers | feminine\
        \ |\n| il padre | i padri | father / fathers | masculine |\n\n---\n\n## Examples\
        \ in context\n\n1. <span lang=\"it\">Il bambino mangia una mela.</span> —\
        \ The child eats an apple.\n   <span lang=\"it\">I bambini mangiano le mele.</span>\
        \ — The children eat the apples.\n\n2. <span lang=\"it\">Ho un fratello e\
        \ due sorelle.</span> — I have one brother and two sisters.\n\n3. <span lang=\"\
        it\">Il cane è grande; i cani sono grandi.</span> — The dog is big; the dogs\
        \ are big.\n\n4. <span lang=\"it\">C'è un libro sul tavolo. Ci sono tre libri\
        \ sul tavolo.</span> — There is a book on the table. There are three books\
        \ on the table.\n\n5. <span lang=\"it\">La madre e il padre sono a casa. Le\
        \ madri e i padri sono a casa.</span> — The mother and father are at home.\
        \ The mothers and fathers are at home.\n\n6. (Contrastive pair) <span lang=\"\
        it\">la mano</span> (hand) ends in <span lang=\"it\">-o</span> but is feminine,\
        \ and its plural is <span lang=\"it\">le mani</span> — an irregular form covered\
        \ separately at a higher level.\n\n---\n\n## Nouns whose plural is identical\
        \ to their singular\n\nSome nouns do not change at all in the plural. This\
        \ happens with:\n\n- Nouns ending in an accented vowel: <span lang=\"it\"\
        >la città → le città</span> (city / cities), <span lang=\"it\">la tribù →\
        \ le tribù</span> (tribe / tribes).\n- Nouns ending in a consonant (mostly\
        \ foreign words): <span lang=\"it\">il bar → i bar</span>, <span lang=\"it\"\
        >lo sport → gli sport</span>.\n- Monosyllabic nouns: <span lang=\"it\">il\
        \ re → i re</span> (king / kings), <span lang=\"it\">la gru → le gru</span>\
        \ (crane / cranes).\n\nIn all these cases, the article is the only signal\
        \ that the noun is plural, so learning the article alongside every noun is\
        \ essential.\n\n---\n\n## Common learner mistakes\n\n**Mistake 1 — Applying\
        \ the wrong pattern to <span lang=\"it\">-e</span> nouns:**\nLearners sometimes\
        \ write <span lang=\"it\">*i padres</span> or <span lang=\"it\">*i padree</span>.\
        \ The correct form is <span lang=\"it\">i padri</span>. All <span lang=\"\
        it\">-e</span> nouns, whether masculine or feminine, take <span lang=\"it\"\
        >-i</span> in the plural.\n\n**Mistake 2 — Forgetting to change the article:**\n\
        Writing <span lang=\"it\">*la sorelle</span> is wrong even though the noun\
        \ ending is correct. The article must agree: <span lang=\"it\">le sorelle</span>.\
        \ The article and the noun always change together.\n\n**Mistake 3 — Assuming\
        \ all <span lang=\"it\">-o</span> nouns are masculine:**\nA small number of\
        \ <span lang=\"it\">-o</span> nouns are feminine (e.g. <span lang=\"it\">la\
        \ mano</span>, hand). These are exceptions to be memorised; the three-pattern\
        \ system above covers the vast majority of everyday nouns.\n\n**Mistake 4\
        \ — Adding a plural ending to an invariable noun:**\nDo not write <span lang=\"\
        it\">*le cittàe</span> or <span lang=\"it\">*le città</span> with a changed\
        \ ending. Nouns with a final accented vowel never change: <span lang=\"it\"\
        >una città, due città</span>.\n\n---\n\n## Quick-reference summary\n\n| Singular\
        \ | Plural | Example |\n|---|---|---|\n| -o | -i | libro → libri |\n| -a |\
        \ -e | mela → mele |\n| -e | -i | cane → cani |\n| accented vowel or consonant\
        \ | no change | città → città |"
      language: en
      why_this_matters: 'Almost every sentence you say in Italian will include a noun,
        and Italian nouns almost always signal whether you mean one thing or many
        by changing their final vowel — the ending grammarians call the <span lang="it">desinenza</span>
        (ending). Without this rule you cannot say ''two friends'', ''some apples'',
        or ''my sisters'' — you will be stuck talking about only one of everything.
        Mastering these three patterns removes one of the most frequent sources of
        beginner errors immediately.


        ---'
- code: noun_invar
  cefr_level: A1
  category: nome
  source_url: https://www.unistrapg.it/profilo_lingua_italiana/site/gram_nome_a1.html
  unistr_code: i_principali_nomi_invariabili_es_caffe_cinema_citta_universita
  unistr_label: I principali nomi invariabili (es. caffè, cinema, città, università
    )
  chunk_ref: book_4_il_nome_la_formazione_del_plurale_nomi_invariabili
  label: Nomi invariabili caffè cinema città università
  explanations:
    en:
      title: Nouns that never change in the plural
      tip: Some Italian nouns look exactly the same in the singular and the plural
        — only the article changes to show whether you mean one or many. This happens
        with short, clipped words, words ending in a stressed vowel, and foreign borrowings.
      explanation: '## The core rule


        Most Italian nouns change their ending to form the plural (<span lang="it">ragazzo
        → ragazzi</span>, <span lang="it">porta → porte</span>). But a category called
        <span lang="it">nomi invariabili</span> (invariable nouns) keeps exactly the
        same form in both singular and plural. The article is the only thing that
        changes.


        Singular: <span lang="it">il caffè</span> → Plural: <span lang="it">i caffè</span>
        (the coffees)

        Singular: <span lang="it">la città</span> → Plural: <span lang="it">le città</span>
        (the cities)


        ## Which nouns are invariable?


        ### 1. Words ending in a stressed (accented) vowel


        Any noun whose final vowel carries a written accent is invariable. These are
        called <span lang="it">polisillabi tronchi</span> (words ''cut short'' with
        stress on the last syllable). This is the largest and most important group
        for A1 learners.


        | Singular | Plural | Meaning |

        |---|---|---|

        | il caffè | i caffè | coffee(s) |

        | la città | le città | city/cities |

        | l''università | le università | university/universities |

        | l''età | le età | age(s) |

        | la virtù | le virtù | virtue(s) |

        | il bignè | i bignè | cream puff(s) |


        ### 2. Monosyllables (one-syllable words)


        All nouns of just one syllable are invariable.


        | Singular | Plural | Meaning |

        |---|---|---|

        | il re | i re | king(s) |

        | la gru | le gru | crane(s) (the bird or machine) |


        ### 3. Shortened (clipped) words


        Italian often shortens longer words. The clipped form — called a <span lang="it">nome
        accorciato</span> (shortened noun) — is always invariable, even though the
        full original word would have a regular plural.


        | Singular | Plural | Full form |

        |---|---|---|

        | l''auto | le auto | automobile → automobili |

        | la bici | le bici | bicicletta → biciclette |

        | il cinema | i cinema | cinematografo → cinematografi |

        | la foto | le foto | fotografia → fotografie |

        | la moto | le moto | motocicletta → motociclette |


        ### 4. Nouns of foreign origin


        Words borrowed from other languages and used without adaptation keep their
        original form and do not add any Italian plural ending.


        | Singular | Plural | Meaning |

        |---|---|---|

        | il bar | i bar | bar(s) / café(s) |

        | il film | i film | film(s) |

        | lo sport | gli sport | sport(s) |


        ### 5. Other invariable groups (less common at A1)


        There are a few additional categories you may encounter:


        - Nouns ending in <span lang="it">-i</span> in the singular (e.g. <span lang="it">l''analisi
        → le analisi</span>, ''analysis/analyses''; <span lang="it">la tesi → le tesi</span>,
        ''thesis/theses'')

        - Feminine nouns ending in <span lang="it">-ie</span> (e.g. <span lang="it">la
        serie → le serie</span>, ''series''; <span lang="it">la carie → le carie</span>,
        ''cavity/cavities'') — but note that <span lang="it">-cie</span>, <span lang="it">-gie</span>,
        and <span lang="it">-glie</span> endings follow different rules

        - Masculine animal nouns ending in <span lang="it">-a</span> (e.g. <span lang="it">il
        gorilla → i gorilla</span>, ''gorilla/gorillas'')


        ## Examples in sentences


        <span lang="it">Vorrei due caffè, per favore.</span>

        (I would like two coffees, please.)

        — The noun <span lang="it">caffè</span> is identical in singular and plural;
        only the number word tells you there are two.


        <span lang="it">Quante città hai visitato?</span>

        (How many cities have you visited?)

        — <span lang="it">città</span> does not change, even though the question clearly
        refers to multiple places.


        <span lang="it">C''è un''università in questa città.</span> / <span lang="it">Ci
        sono tre università in questa città.</span>

        (There is one university in this city. / There are three universities in this
        city.)

        — A perfect contrastive pair: the noun stays the same; the verb and numeral
        carry the plural meaning.


        <span lang="it">Andiamo al cinema stasera?</span>

        (Shall we go to the cinema tonight?)

        — <span lang="it">cinema</span> is a clipped word and never changes.


        <span lang="it">Ho due bici: una rossa e una blu.</span>

        (I have two bikes: a red one and a blue one.)

        — <span lang="it">bici</span> is the clipped form of <span lang="it">bicicletta</span>
        and stays invariable.


        <span lang="it">In questo paese ci sono tre bar.</span>

        (In this town there are three bars.)

        — Foreign borrowing <span lang="it">bar</span> takes no ending in the plural.


        ## Common learner mistakes


        **Adding a regular plural ending**

        Mistake: <span lang="it">*le cittàe*</span>, <span lang="it">*i caffèi*</span>,
        <span lang="it">*i bars*</span>

        Correction: <span lang="it">le città</span>, <span lang="it">i caffè</span>,
        <span lang="it">i bar</span> — these nouns never take a plural suffix.


        **Pluralising the clipped form as if it were a full word**

        Mistake: <span lang="it">*le auti*</span> (treating <span lang="it">auto</span>
        like a regular <span lang="it">-o</span> noun)

        Correction: <span lang="it">le auto</span> — once a word is clipped, it becomes
        invariable.


        **Forgetting to change the article**

        Mistake: <span lang="it">*la città sono belle*</span>

        Correction: <span lang="it">le città sono belle</span> (the cities are beautiful)
        — the noun stays the same, but the article must still agree in number.


        **Confusing <span lang="it">foto</span> and <span lang="it">moto</span> with
        masculine nouns**

        Because <span lang="it">-o</span> endings are usually masculine, learners
        sometimes say <span lang="it">*il foto*</span> or <span lang="it">*il moto*</span>.
        Both are feminine: <span lang="it">la foto / le foto</span>, <span lang="it">la
        moto / le moto</span>. They inherit the gender of their full forms (<span
        lang="it">la fotografia</span>, <span lang="it">la motocicletta</span>).


        ## Quick-reference summary


        | Type | Key feature | Example |

        |---|---|---|

        | Stressed final vowel | written accent on last vowel | città, caffè, università
        |

        | Monosyllable | one syllable only | re, gru |

        | Clipped word | shortened from a longer word | auto, bici, cinema, foto |

        | Foreign borrowing | kept in original form | bar, film, sport |

        | Singular ending in -i | already ends in -i | analisi, tesi |

        | Feminine -ie nouns | ends in -ie (not -cie/-gie) | serie, carie |'
      language: en
      why_this_matters: A huge number of everyday Italian words — <span lang="it">caffè</span>,
        <span lang="it">città</span>, <span lang="it">università</span>, <span lang="it">cinema</span>,
        <span lang="it">bar</span> — belong to this group. If you try to add a regular
        plural ending to them, you will produce errors that native speakers immediately
        notice. Understanding this rule also trains you to watch the article carefully,
        because it is often the only signal that tells you whether someone means one
        thing or many.
- code: noun_plur
  cefr_level: A1
  category: nome
  source_url: https://www.unistrapg.it/profilo_lingua_italiana/site/gram_nome_a1.html
  unistr_code: i_principali_nomi_generalmente_utilizzati_al_plurale_es_occhiali_pantaloni
  unistr_label: I principali nomi generalmente utilizzati al plurale (es. occhiali,
    pantaloni, spaghetti )
  chunk_ref: book_4_il_nome_la_formazione_del_plurale_nomi_difettivi
  label: Nomi generalmente utilizzati al plurale occhiali pantaloni
  explanations:
    en:
      title: Nouns used only in the plural
      tip: Some Italian nouns exist only in the plural — they have no singular form.
        You must always use a plural article and plural adjective with them, even
        when you mean just one item.
      explanation: '## The rule


        In Italian, some nouns are called <span lang="it">nomi difettivi</span> (defective
        nouns) — nouns that are ''defective'' in that they lack one of the two number
        forms. The group that matters most at A1 level is nouns that exist **only
        in the plural**: they have no singular form and cannot be used with a singular
        article.


        The reason is logical: many of these nouns name objects that are physically
        made of two matching parts — two lenses, two legs, two blades. Italian treats
        the whole object as inherently plural. Because the object itself implies two
        parts, there is no ''one unit'' form to express.


        The practical consequence is straightforward: **always use the plural article
        and plural agreement** with these words. You say <span lang="it">gli occhiali
        sono</span> (the glasses are), never <span lang="it">*l''occhiale è</span>.


        ## Core vocabulary: the most common plural-only nouns


        Learn these as fixed plural forms from the start:


        | Forma plurale | English | Article to use |

        |---|---|---|

        | gli occhiali | glasses (spectacles) | gli / i |

        | i pantaloni | trousers / pants | i |

        | i calzoni | trousers (informal) | i |

        | le mutande | underwear / underpants | le |

        | le forbici | scissors | le |

        | le pinze | pliers / tongs | le |

        | le tenaglie | pincers / tongs | le |

        | le cesoie | shears / garden scissors | le |

        | le redini | reins (for a horse) | le |

        | le manette | handcuffs | le |


        At A1 level, focus especially on <span lang="it">gli occhiali</span> and <span
        lang="it">i pantaloni</span>, as these come up in everyday conversation about
        clothing and personal items.


        ## Examples


        <span lang="it">Gli occhiali sono sul tavolo.</span> (The glasses are on the
        table.)


        <span lang="it">I pantaloni sono neri.</span> (The trousers are black.)


        <span lang="it">Dove sono le forbici?</span> (Where are the scissors?)


        <span lang="it">Ho comprato i pantaloni nuovi.</span> (I bought new trousers.)
        — note: <span lang="it">nuovi</span>, not <span lang="it">*nuovo</span>, because
        the adjective must agree in the plural.


        <span lang="it">I miei occhiali sono rotti.</span> (My glasses are broken.)
        — both the possessive <span lang="it">miei</span> and the adjective <span
        lang="it">rotti</span> are plural.


        <span lang="it">Questi pantaloni sono troppo grandi.</span> (These trousers
        are too big.) — <span lang="it">questi</span> (these), not <span lang="it">*questo</span>,
        because the noun is always plural.


        ## Common learner mistakes


        **Mistake 1 — using a singular article:**

        Incorrect: <span lang="it">*un occhiale, il pantalone</span>. Correct: <span
        lang="it">degli occhiali, i pantaloni</span>. These nouns have no singular
        form, so a singular article is never correct.


        **Mistake 2 — singular adjective agreement:**

        Incorrect: <span lang="it">*i pantaloni è bello</span>. Correct: <span lang="it">i
        pantaloni sono belli</span>. Both the verb and the adjective must be plural,
        because the noun is always plural.


        **Mistake 3 — translating ''a pair of'' literally to make a singular:**

        In English you can say ''a pair of trousers'' to signal one item. In Italian,
        if you want to be explicit you can say <span lang="it">un paio di pantaloni</span>
        (a pair of trousers), but the noun <span lang="it">pantaloni</span> stays
        plural. Do not invent a singular form like <span lang="it">*un pantalone</span>
        to mean a single garment.


        **Mistake 4 — applying this rule too broadly:**

        Not every clothing word is plural-only. For example, <span lang="it">la maglietta</span>
        (the T-shirt) and <span lang="it">la scarpa</span> (the shoe) have normal
        singular and plural forms. Only memorise the specific words in the table above
        as exceptions.


        ## A note on everyday speech


        You may occasionally hear Italian speakers use forms like <span lang="it">il
        pantalone</span> in very informal speech, treating the noun as if it had a
        singular. This does happen in casual conversation, but it is considered non-standard.
        In writing and in careful speech, always use the plural forms listed above.'
      language: en
      why_this_matters: A handful of very common Italian words — including everyday
        items like glasses and trousers — are always plural, even when you are talking
        about a single object. Getting this wrong produces immediate errors, because
        pairing these words with a singular article or adjective sounds unnatural
        to any native speaker. Mastering this small group removes a persistent source
        of mistakes from the very first weeks of learning Italian.
  prerequisites:
  - noun_o_a_e
- code: noun_irr_p
  cefr_level: A1
  category: nome
  source_url: https://www.unistrapg.it/profilo_lingua_italiana/site/gram_nome_a1.html
  unistr_code: alcuni_nomi_con_plurale_irregolare_es_uomouomini
  unistr_label: Alcuni nomi con plurale irregolare (es. uomo/uomini )
  chunk_ref: book_4_il_nome_la_formazione_del_plurale_nomi_in_o
  label: Plurali irregolari uomo uomini
  explanations:
    en:
      title: 'Irregular plurals: uomo and similar nouns'
      tip: A small group of Italian nouns ending in -o do not follow the regular -o
        → -i pattern in the plural. The most important one at A1 level is uomo (man)
        → uomini (men). You simply have to learn these forms by heart.
      explanation: '## The regular rule (and why these nouns break it)


        Most masculine nouns ending in <span lang="it">-o</span> form their plural
        by changing <span lang="it">-o</span> to <span lang="it">-i</span>:


        | Singular | Plural | Meaning |

        |---|---|---|

        | libro | libri | book / books |

        | ragazzo | ragazzi | boy / boys |


        A small but very important group of nouns does **not** follow this pattern.
        Their plurals must be memorised individually.


        ## The key irregular plural: uomo → uomini


        <span lang="it">uomo</span> (man) has the completely irregular plural <span
        lang="it">uomini</span> (men). The change is not a simple vowel swap — the
        entire word stem shifts. This is the single most important irregular plural
        at A1 level.


        ## Other irregular plurals in the same family


        The authoritative reference lists a set of nouns ending in <span lang="it">-o</span>
        (or closely related forms) whose plurals are irregular. Learn all of them:


        | Singular | Article | Plural | Article | Meaning |

        |---|---|---|---|---|

        | uomo | l'' | uomini | gli | man / men |

        | uovo | l'' | uova | le | egg / eggs |

        | mano | la | mani | le | hand / hands |

        | dio | il | dei | gli | god / gods |

        | paio | il | paia | le | pair / pairs |

        | miglio | il | miglia | le | mile / miles |

        | migliaio | il | migliaia | le | thousand / thousands |

        | centinaio | il | centinaia | le | hundred / hundreds |

        | riso (= laughing) | il | risa | le | laugh / laughs |

        | tempio | il | templi | i | temple / temples |

        | eco | la | echi | gli | echo / echoes |


        **Important notes on this table:**


        - <span lang="it">uovo, paio, miglia, risa, centinaia, migliaia</span> are
        unusual because they change gender in the plural — they are masculine in the
        singular but feminine in the plural. This affects the article too.

        - <span lang="it">mano</span> is feminine even in the singular (<span lang="it">la
        mano</span>) — it does not end in <span lang="it">-a</span> as most feminine
        nouns do, and its plural is <span lang="it">le mani</span>, not <span lang="it">*le
        mane</span>.

        - <span lang="it">riso</span> meaning ''rice'' (the food) is a regular masculine
        noun: <span lang="it">il riso / i risi</span>. Only <span lang="it">riso</span>
        meaning ''laughter'' has the irregular plural <span lang="it">le risa</span>.

        - At A1, the most important items to know are <span lang="it">uomo/uomini</span>,
        <span lang="it">uovo/uova</span>, and <span lang="it">mano/mani</span>.


        ## Examples


        1. <span lang="it">C''è un uomo alla porta.</span> (There is a man at the
        door.)


        2. <span lang="it">Ci sono tre uomini alla porta.</span> (There are three
        men at the door.) — Note: <span lang="it">uomini</span>, not <span lang="it">*uomi</span>
        or <span lang="it">*uomos</span>.


        3. <span lang="it">Vuoi un uovo per colazione?</span> (Do you want an egg
        for breakfast?)


        4. <span lang="it">Ho comprato due uova al mercato.</span> (I bought two eggs
        at the market.) — The article changes from <span lang="it">il/l''</span> to
        <span lang="it">le</span> in the plural.


        5. <span lang="it">Dammi la mano!</span> (Give me your hand!)


        6. <span lang="it">Ho le mani fredde.</span> (My hands are cold.) — Contrastive
        pair: <span lang="it">la mano → le mani</span>, not <span lang="it">*le mane</span>.


        ## Common learner mistakes


        **Mistake 1 — Applying the regular rule to <span lang="it">uomo</span>:**

        <span lang="it">*gli uomi</span> ✗ — Correction: <span lang="it">gli uomini</span>
        ✓. The plural is not formed by simply changing <span lang="it">-o</span> to
        <span lang="it">-i</span>.


        **Mistake 2 — Wrong article with <span lang="it">uova</span>:**

        <span lang="it">*gli uova</span> ✗ — Correction: <span lang="it">le uova</span>
        ✓. Because <span lang="it">uova</span> is feminine plural, it takes <span
        lang="it">le</span>, not <span lang="it">gli</span>.


        **Mistake 3 — Wrong plural of <span lang="it">mano</span>:**

        <span lang="it">*le mane</span> or <span lang="it">*le manos</span> ✗ — Correction:
        <span lang="it">le mani</span> ✓.


        **Mistake 4 — Treating <span lang="it">riso</span> (rice) as irregular:**

        The food ''rice'' is regular: <span lang="it">il riso</span> has no common
        plural in everyday use. Only <span lang="it">riso</span> meaning ''laughter''
        has the feminine plural <span lang="it">le risa</span>.


        ## Practical advice


        <span lang="it">Uomo/uomini</span> is the form you will encounter most at
        A1 level — prioritise it. For the others, learn <span lang="it">uovo/uova</span>
        and <span lang="it">mano/mani</span> next, since they appear in everyday food
        and body-part vocabulary. When in doubt about any irregular plural, consult
        a dictionary — there is no shortcut rule that predicts all of them.'
      language: en
      why_this_matters: The word <span lang="it">uomo</span> (man) is one of the most
        common nouns in Italian — you will need it from your very first conversations.
        Because its plural <span lang="it">uomini</span> looks nothing like the singular,
        students who have only learned the regular rule will produce errors every
        time. Learning this small set of exceptions now will save you constant embarrassment
        and confusion.
  prerequisites:
  - noun_o_a_e
- code: noun_forei
  cefr_level: A1
  category: nome
  source_url: https://www.unistrapg.it/profilo_lingua_italiana/site/gram_nome_a1.html
  unistr_code: alcuni_nomi_di_origine_straniera_con_plurale_invariato_es_bar_computer_sport
  unistr_label: Alcuni nomi di origine straniera con plurale invariato (es. bar, computer,
    sport )
  chunk_ref: book_4_il_nome_la_formazione_del_plurale_nomi_invariabili
  label: Nomi di origine straniera con plurale invariato bar computer
  explanations:
    en:
      title: Foreign words that don't change in the plural
      tip: Many Italian nouns borrowed from other languages — like 'bar', 'film',
        and 'computer' — have the same form in both singular and plural. Only the
        article changes to show whether you mean one or more than one.
      explanation: '## The rule


        Nouns borrowed from foreign languages — mostly English, but also French and
        others — that have kept their original spelling do **not** change their ending
        in the plural. They are called <span lang="it">nomi invariabili</span> (invariable
        nouns). The only thing that changes is the **article** in front of the noun.


        > Singular: <span lang="it">il bar</span> → Plural: <span lang="it">i bar</span>
        (not <span lang="it">*i bari</span>)


        ## How to form the plural


        Keep the noun exactly as it is. Change only the article from singular to plural.


        | Singular article | Plural article | Noun (unchanged) |

        |---|---|---|

        | il | i | bar, film, computer, autobus |

        | lo | gli | sport, stress, yogurt |

        | la | le | email, chat |

        | l'' | gli / le | hotel (gli hotel) |


        The article follows normal Italian rules for gender and the first letter of
        the noun, just as with any Italian word.


        ## Common examples at A1 level


        These are the foreign-origin nouns you will meet most often at beginner level:


        | Singular | Plural | Meaning |

        |---|---|---|

        | il bar | i bar | café / bar |

        | il film | i film | film / movie |

        | il computer | i computer | computer |

        | lo sport | gli sport | sport |

        | l''autobus | gli autobus | bus |

        | l''hotel | gli hotel | hotel |

        | il weekend | i weekend | weekend |

        | lo yogurt | gli yogurt | yogurt |


        ## Examples in sentences


        1. <span lang="it">C''è un bar vicino a casa mia.</span> (There is a café
        near my house.)

        2. <span lang="it">Ci sono due bar vicino a casa mia.</span> (There are two
        cafés near my house.) — notice: <span lang="it">bar</span> does not change.

        3. <span lang="it">Guardo un film stasera.</span> (I am watching a film tonight.)

        4. <span lang="it">Guardo tre film nel weekend.</span> (I watch three films
        at the weekend.) — <span lang="it">film</span> and <span lang="it">weekend</span>
        both stay the same.

        5. <span lang="it">Ho un computer nuovo.</span> (I have a new computer.)

        6. <span lang="it">In questa scuola ci sono venti computer.</span> (In this
        school there are twenty computers.) — the noun is unchanged; only context
        and number words tell you it is plural.


        ## Why only the article changes


        Italian nouns normally signal singular or plural through their ending (<span
        lang="it">-o / -i</span>, <span lang="it">-a / -e</span>, etc.). Foreign words
        end in consonant clusters or vowels that do not fit the Italian pattern, so
        Italian leaves the word untouched and relies on the article — and on context
        or numbers — to show quantity.


        ## Common learner mistakes


        **Mistake 1 — Adding an Italian plural ending:**

        <span lang="it">*i filmi, i bari, i computeri</span> — these forms do not
        exist. The noun never changes: <span lang="it">i film, i bar, i computer</span>.


        **Mistake 2 — Keeping the singular article:**

        <span lang="it">*il computer sono nuovi</span> — wrong; if the noun is plural,
        the article must be plural too: <span lang="it">i computer sono nuovi</span>
        (the computers are new).


        **Mistake 3 — Using the wrong article for <span lang="it">sport</span> and
        <span lang="it">yogurt</span>:**

        Because these words begin with <span lang="it">s + consonant</span> (<span
        lang="it">sp-, st-</span>), they take <span lang="it">lo / gli</span>, not
        <span lang="it">il / i</span>. So it is <span lang="it">lo sport → gli sport</span>,
        not <span lang="it">*il sport / *i sport</span>.


        **Mistake 4 — Forgetting that the noun is still singular or plural in agreement:**

        Even though the noun looks the same, adjectives and verbs must still agree
        in number: <span lang="it">il film è bello</span> (the film is good) vs. <span
        lang="it">i film sono belli</span> (the films are good).


        ## Quick reference


        To check whether a foreign word is invariable, ask: does it end in a consonant,
        or in a vowel that does not match a standard Italian ending? If yes, leave
        it unchanged and adjust only the article and any adjectives.'
      language: en
      why_this_matters: Italian borrows many everyday words from English and other
        languages, and these words appear constantly in daily life — at the café,
        talking about technology, discussing hobbies. Because their plural form looks
        identical to the singular, students who try to add <span lang="it">-i</span>
        or <span lang="it">-e</span> endings will always be wrong. Mastering this
        small rule means you can speak and write these very common words correctly
        from day one.
  prerequisites:
  - noun_o_a_e
- code: noun_e_ess
  cefr_level: A1
  category: nome
  source_url: https://www.unistrapg.it/profilo_lingua_italiana/site/gram_nome_a1.html
  unistr_code: i_principali_nomi_a_suffisso_-e_-essa_es_dottoredottoressa
  unistr_label: I principali nomi a suffisso -E /-ESSA (es. dottore/dottoressa, professore/professoressa,
    studente/studentessa)
  chunk_ref: book_4_il_nome_la_formazione_del_femminile_nomi_a_genere_differenziato
  label: Nomi suffisso E ESSA dottore dottoressa professore professoressa
  explanations:
    en:
      title: Masculine and feminine noun suffixes
      tip: 'Many Italian nouns that name people have two forms: one for males and
        one for females. Learning the most common pairs — especially -tore/-trice
        and -e/-essa — lets you talk about people and their jobs correctly from day
        one.'
      explanation: '## The core rule


        A noun with differentiated gender (<span lang="it">nome a genere differenziato</span>,
        a noun that has separate masculine and feminine forms) changes its ending
        to show whether it refers to a male or a female. The ending you swap out is
        called the <span lang="it">desinenza</span> (suffix or ending). The table
        below shows the main patterns.


        ## The main suffix patterns


        ### Pattern 1: -o (masculine) → -a (feminine)


        This is the largest and most common group.


        | Masculine | Feminine | Meaning |

        |---|---|---|

        | maestro | maestra | teacher (primary school) |

        | ragazzo | ragazza | boy / girl |

        | cuoco | cuoca | cook |


        ### Pattern 2: -e (masculine) → -a (feminine)


        A sizeable group, but watch out: many nouns ending in <span lang="it">-e</span>
        do not change (see the exception note below).


        | Masculine | Feminine | Meaning |

        |---|---|---|

        | cameriere | cameriera | waiter / waitress |

        | panettiere | panettiera | baker |

        | padrone | padrona | owner / boss |


        ### Pattern 3: -tore (masculine) → -trice (feminine)


        Nouns built on Latin agent suffixes follow this pattern reliably. It covers
        many job and role words.


        | Masculine | Feminine | Meaning |

        |---|---|---|

        | direttore | direttrice | director / headteacher |

        | pittore | pittrice | painter |

        | salvatore | salvatrice | saviour / rescuer |


        A related group replaces <span lang="it">-sore</span> with <span lang="it">-itrice</span>:


        | Masculine | Feminine | Meaning |

        |---|---|---|

        | difensore | difenditrice | defender |


        ### Pattern 4: adding -essa to the masculine


        Some nouns — especially for professions and titles — form the feminine by
        adding <span lang="it">-essa</span> to the masculine base. This group is most
        important at A1 for a small set of very common words.


        | Masculine | Feminine | Meaning |

        |---|---|---|

        | dottore | dottoressa | doctor / graduate (title) |

        | professore | professoressa | professor / secondary-school teacher |

        | avvocato | avvocatessa | lawyer |

        | leone | leonessa | lion / lioness |

        | poeta | poetessa | poet |


        Notice that <span lang="it">dottore</span> and <span lang="it">professore</span>
        both end in <span lang="it">-tore</span>, yet they take <span lang="it">-essa</span>
        rather than <span lang="it">-trice</span>. These two words are the most important
        exceptions to Pattern 3 and must simply be memorised.


        ## Irregular and special pairs


        A handful of very common nouns are completely irregular — the feminine is
        not derived from the masculine at all:


        | Masculine | Feminine | Meaning |

        |---|---|---|

        | re | regina | king / queen |

        | dio | dea | god / goddess |

        | abate | badessa | abbot / abbess |

        | cane | cagna | dog / female dog |


        ## Important exception: nouns that do not change


        Some nouns ending in <span lang="it">-e</span> use the same form for both
        genders. The article or context shows the gender. The most common examples
        at A1 are:


        - <span lang="it">insegnante</span> (teacher) — <span lang="it">il/la insegnante
        → l''insegnante</span>

        - <span lang="it">giovane</span> (young person)

        - <span lang="it">cantante</span> (singer)


        These are called <span lang="it">nomi di genere comune</span> (common-gender
        nouns) and are covered in their own entry. Do not try to add <span lang="it">-a</span>
        to them.


        ## Examples in context


        1. <span lang="it">Il maestro spiega la lezione.</span> — The (male) teacher
        explains the lesson.


        2. <span lang="it">La maestra spiega la lezione.</span> — The (female) teacher
        explains the lesson.


        3. <span lang="it">Mia madre è dottoressa.</span> — My mother is a doctor.
        (Note: <span lang="it">-essa</span>, not <span lang="it">-trice</span>.)


        4. <span lang="it">Il professore è in aula; la professoressa è in biblioteca.</span>
        — The (male) teacher is in the classroom; the (female) teacher is in the library.


        5. <span lang="it">La direttrice della scuola si chiama Anna.</span> — The
        (female) headteacher is called Anna. (<span lang="it">direttore → direttrice</span>,
        Pattern 3.)


        6. Contrastive pair: <span lang="it">il cameriere / la cameriera</span> (Pattern
        2) vs. <span lang="it">il professore / la professoressa</span> (Pattern 4)
        — both end in <span lang="it">-e</span> in the masculine, but they form the
        feminine differently. Always check which group a word belongs to.


        ## Common learner mistakes


        **Mistake 1 — Applying <span lang="it">-trice</span> to <span lang="it">professore</span>
        and <span lang="it">dottore</span>:**

        Learners who have just learned the <span lang="it">-tore/-trice</span> rule
        often write <span lang="it">*professorice</span> or <span lang="it">*dottrice</span>.
        These do not exist. The correct forms are <span lang="it">professoressa</span>
        and <span lang="it">dottoressa</span>.


        **Mistake 2 — Forgetting to change the article:**

        Changing only the noun ending is not enough. The article must also agree:
        <span lang="it">il direttore → la direttrice</span>, not <span lang="it">*il
        direttrice</span>.


        **Mistake 3 — Adding <span lang="it">-a</span> to a common-gender noun:**

        Writing <span lang="it">*insegnanta</span> for a female teacher is wrong.
        Use <span lang="it">la insegnante / l''insegnante</span> and let the article
        carry the gender.


        **Mistake 4 — Using the masculine form as a ''neutral'' title for a woman:**

        In everyday Italian at A1, use the feminine form when referring to a woman:
        say <span lang="it">la professoressa</span>, not <span lang="it">*la professore</span>.
        The feminine forms exist precisely for this purpose and are the expected choice.'
      language: en
      why_this_matters: Italian nouns that refer to people almost always have a masculine
        form and a feminine form. If you use the wrong ending, you may accidentally
        say the wrong thing about a person's identity. The suffix pairs covered here
        — especially <span lang="it">-tore/-trice</span> and <span lang="it">-e/-essa</span>
        — appear constantly when talking about jobs, roles, and titles, so mastering
        them early removes one of the most common A1 mistakes.
