    description: "Welcome to Maestro — your Italian learning journey starts here"
    cefr_level: A0
    sequence: 1
    cf_codes:
      - a0_salutare
      - a0_presentarsi
      - a0_dire_nome
    gp_codes:
      - saluti
      - mi_chiamo
    depths:
      - "Onboarding and first Italian words"

  - slug: a0-02-saluti
    label: "Saluti"
    description: "Greetings and goodbyes in depth"
    cefr_level: A0
    sequence: 2
    cf_codes:
      - a0_salutare
      - a0_congedarsi
    gp_codes:
      - saluti
      - pronun_bas
