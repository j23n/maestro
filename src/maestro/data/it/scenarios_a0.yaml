      - "Formal and informal greetings, goodbyes, time-of-day greetings"

  - slug: a0-03-numeri
    label: "Comunicare"
    description: "Essential phrases for daily interactions"
    cefr_level: A0
    sequence: 4
    cf_codes:
      - a0_scusarsi
    gp_codes:
      - polite_exp
      - simp_sent
    depths:
      - "Everyday expressions, asking and clarifying"

