"a0-10-conoscere-qualcuno":
  topic_title: Conoscere qualcuno
  topic_description: "Meeting people — essere, pronouns, nationality, origin"
  overview: "You meet someone at the piazza. Learn to say who you are, where you're from, and ask others the same."
  activities:
  - type: vocab_review
  - type: grammar
    title: Essere — to be
    description: The most important Italian verb
    grammar_point_code: essere_pre
    content: |
      ## Essere (to be)

      | Pronoun | Essere | Example |
      |---------|--------|---------|
      | <span lang="it">**io**</span> (I) | <span lang="it">**sono**</span> | <span lang="it">Sono Marco.</span> |
      | <span lang="it">**tu**</span> (you) | <span lang="it">**sei**</span> | <span lang="it">Sei italiano?</span> |
      | <span lang="it">**lui/lei**</span> (he/she) | <span lang="it">**è**</span> | <span lang="it">Lei è Maria.</span> |

      You can drop the pronoun — the verb tells you who:
      - <span lang="it">**Sono italiano.**</span> = I am Italian.
      - <span lang="it">**Sei pronto?**</span> = Are you ready?

      To ask a question, just raise your voice:
      - <span lang="it">**Sei italiano?**</span> ↗
  - type: drill
    title: Essere
    description: Fill in the right form
    hint: "io → sono, tu → sei, lui/lei → è."
    grammar_point_code: essere_pre
    exercise_type: fill_blank
    items:
    - prompt: "I am Italian. = ___ italiano."
      correct_answer: Sono
    - prompt: "Are you English? = ___ inglese?"
      correct_answer: Sei
    - prompt: "She is Maria. = Lei ___ Maria."
      correct_answer: è
    - prompt: "I am a student. = Sono uno ___."
      correct_answer: studente
  - type: grammar
    title: "Where are you from?"
    description: "Origin, nationality, simple sentences"
    grammar_point_code: simp_sent
    content: |
      ## Introducing yourself

      - <span lang="it">**Sono di Londra.**</span> — I'm from London.
      - <span lang="it">**Di dove sei?**</span> — Where are you from?

      ### Nationalities

      | Italian | English |
      |---------|---------|
      | <span lang="it">inglese</span> | English |
      | <span lang="it">americano/a</span> | American (m./f.) |
      | <span lang="it">tedesco/a</span> | German (m./f.) |
      | <span lang="it">francese</span> | French |
      | <span lang="it">spagnolo/a</span> | Spanish (m./f.) |

      ### Simple sentences

      Italian follows the same order as English: **Subject + Verb + Object**
      - <span lang="it">**Parlo italiano.**</span> — I speak Italian.

      And you can drop the pronoun:
      - <span lang="it">**(Io) Parlo un po' di italiano.**</span> — I speak a little Italian.
  - type: drill
    title: About yourself
    description: Introductions
    hint: "Sono di... = I'm from. Sono + nationality."
    grammar_point_code: simp_sent
    exercise_type: fill_blank
    items:
    - prompt: "I'm from London. = Sono ___ Londra."
      correct_answer: di
    - prompt: "Where are you from? = Di ___ sei?"
      correct_answer: dove
    - prompt: "I speak a little Italian. = Parlo un ___ di italiano."
      correct_answer: po'
    - prompt: "I am French. = Sono ___."
      correct_answer: francese
  - type: reading
    title: Meeting at the piazza
    description: Two people introducing themselves
    content: |
      <span lang="it">— Ciao! Mi chiamo Luca. E tu, come ti chiami?</span>

      <span lang="it">— Ciao! Mi chiamo Sophie. Sei italiano?</span>

      <span lang="it">— Sì, sono italiano, di Roma. E tu?</span>

      <span lang="it">— Sono francese, di Parigi. Parlo un po' di italiano.</span>

      <span lang="it">— Parli molto bene! Ti piace l'Italia?</span> (You speak very well!)

      <span lang="it">— Sì, mi piace molto!</span>
    questions:
    - text: "Where is Sophie from?"
      correct_answer: Parigi / Paris
      grammar_point_codes:
      - simp_sent
    - text: "Does she speak Italian?"
      correct_answer: "Sì, un po' / Yes, a little"
      grammar_point_codes:
      - simp_sent
  - type: listening
    title: New friends
    description: Listen to two people meeting
    audio_path: /static/audio/a0_10_conoscere_qualcuno.wav
    content: |
      — Buonasera! Mi chiamo Anna. Sei americano?
      — Sì, sono americano, di Chicago. Mi chiamo David.
      — Parli italiano?
      — Un po'. E tu, sei italiana?
      — Sì, di Firenze.
      — Mi piace molto Firenze!
    questions:
    - text: "Where is David from?"
      correct_answer: Chicago
      grammar_point_codes:
      - simp_sent
    - text: "Where is Anna from?"
      correct_answer: Firenze / Florence
      grammar_point_codes:
      - simp_sent
  - type: speaking
    title: Introduce yourself
    description: "Practice your self-introduction"
    content: "Say this out loud: **Ciao! Mi chiamo [your name]. Sono [nationality]. Sono di [city]. Parlo un po' di italiano.**\
      \ Try to sound natural and confident!"
    grammar_point_codes:
    - mi_chiamo
    - simp_sent
  - type: writing
    title: About you
    description: Write your introduction
    content: "Write 3-4 sentences introducing yourself. Include your name, nationality, city, and something you like about\
      \ Italy."
    grammar_point_codes:
    - mi_chiamo
    - simp_sent
    - essere_pre
  - type: drill
    title: Fix the mistakes
    description: Error correction
    hint: "io → sono, tu → sei. il (m.), la (f.)."
    grammar_point_code: essere_pre
    exercise_type: error_correction
    items:
    - prompt: Io è italiano.
      correct_answer: Io sono italiano.
      grammar_point_code: essere_pre
    - prompt: Tu sono inglese.
      correct_answer: Tu sei inglese.
      grammar_point_code: essere_pre
    - prompt: Il casa è grande.
      correct_answer: La casa è grande.
      grammar_point_code: art_il_la
  - type: drill
    title: "Review: transport"
    description: Keep lesson 9 fresh
    hint: "Biglietto = ticket. Binario = platform."
    grammar_point_code: vocab_viaggio
    exercise_type: fill_blank
    items:
    - prompt: "A ticket to Rome. = Un biglietto ___ Roma."
      correct_answer: per
      grammar_point_code: vocab_viaggio
    - prompt: "Round trip. = Andata e ___."
      correct_answer: ritorno
      grammar_point_code: vocab_viaggio
    - prompt: "The bus = ___"
      correct_answer: l'autobus
      grammar_point_code: vocab_viaggio
    - prompt: "The train leaves at 6 PM. = Il treno parte alle ___."
      correct_answer: diciotto
      grammar_point_code: ore_giorni
"a0-11-un-problema":
  topic_title: Un problema
  topic_description: "When things go wrong — clarifying, emergencies, and staying calm"
  overview: "Something doesn't go to plan. Learn to handle problems, find help, and know the key emergency phrases."
  activities:
  - type: vocab_review
  - type: grammar
    title: Slowing things down
    description: Phrases for when it's all too fast
    grammar_point_code: polite_exp
    content: |
      ## When things go wrong

      You already know <span lang="it">*Non capisco*</span> and <span lang="it">*Può ripetere?*</span>. Here's the full toolkit:

      - <span lang="it">**Più lentamente, per favore.**</span> — More slowly, please.
      - <span lang="it">**Parlo un po' di italiano.**</span> — I speak a little Italian.
      - <span lang="it">**D'accordo.**</span> — Agreed. / OK.
      - <span lang="it">**Perfetto!**</span> — Perfect!
  - type: drill
    title: Staying calm
    description: "What do you say?"
    hint: "Think about the situation — which phrase helps?"
    grammar_point_code: polite_exp
    exercise_type: fill_blank
    items:
    - prompt: "More slowly, please. = Più ___, per favore."
      correct_answer: lentamente
    - prompt: "I speak a little Italian. = Parlo un ___ di italiano."
      correct_answer: po'
    - prompt: "Agreed. = D'___."
      correct_answer: accordo
    - prompt: "I don't understand. = Non ___."
      correct_answer: capisco
  - type: grammar
    title: Emergency phrases
    description: For when you really need help
    grammar_point_code: si_no_non
    content: |
      ## Emergencies

      Hopefully you won't need these, but just in case:

      - <span lang="it">**Aiuto!**</span> — Help!
      - <span lang="it">**Ho bisogno di un medico.**</span> — I need a doctor.
      - <span lang="it">**Dov'è l'ospedale?**</span> — Where is the hospital?
      - <span lang="it">**Dov'è la farmacia?**</span> — Where is the pharmacy?
      - <span lang="it">**Ho perso il passaporto.**</span> — I've lost my passport.
      - <span lang="it">**Ho perso il portafoglio.**</span> — I've lost my wallet.

      > Italian pharmacies (<span lang="it">*farmacie*</span>) have a green cross. Pharmacists can advise on minor ailments without a doctor.
  - type: drill
    title: Emergency drill
    description: Practice emergency phrases
    hint: "Ho bisogno di = I need. Ho perso = I've lost. Dov'è = where is."
    grammar_point_code: si_no_non
    exercise_type: fill_blank
    items:
    - prompt: "Help! = ___!"
      correct_answer: Aiuto
    - prompt: "I need a doctor. = Ho bisogno di un ___."
      correct_answer: medico
    - prompt: "I've lost my passport. = Ho perso il ___."
      correct_answer: passaporto
    - prompt: "Where is the pharmacy? = Dov'è la ___?"
      correct_answer: farmacia
    - prompt: "I've lost my wallet. = Ho perso il ___."
      correct_answer: portafoglio
  - type: reading
    title: A lost wallet
    description: Asking for help
    content: |
      <span lang="it">— Scusi! Ho perso il portafoglio!</span>

      <span lang="it">— Oh no. Dov'era?</span> (Where was it?)

      <span lang="it">— Non capisco. Può ripetere, più lentamente?</span>

      <span lang="it">— Dove... era... il portafoglio?</span>

      <span lang="it">— Al bar, credo.</span> (At the bar, I think.)

      <span lang="it">— Va bene. Andiamo al bar.</span> (OK. Let's go to the bar.)

      <span lang="it">— Grazie mille!</span>
    questions:
    - text: "What did the tourist lose?"
      correct_answer: il portafoglio / the wallet
      grammar_point_codes:
      - si_no_non
    - text: "Where do they think they lost it?"
      correct_answer: al bar / at the bar
      grammar_point_codes:
      - dove_e
  - type: listening
    title: At the pharmacy
    description: Listen to someone asking for help
    audio_path: /static/audio/a0_11_un_problema.wav
    content: |
      — Buongiorno. Ho bisogno di aiuto.
      — Mi dica.
      — Mi fa male la testa.
      — Ecco, queste pastiglie. Due al giorno.
      — Quanto costa?
      — Cinque euro e cinquanta.
      — Grazie mille!
    questions:
    - text: "What is the problem?"
      correct_answer: mal di testa / headache
      grammar_point_codes:
      - si_no_non
    - text: "How much do the tablets cost?"
      correct_answer: cinque euro e cinquanta / 5.50 euros
      grammar_point_codes:
      - num_20_100
  - type: speaking
    title: Emergency practice
    description: Say the emergency phrases out loud
    content: "Say these clearly and firmly: **Non capisco. Può ripetere, per favore?** Then: **Più lentamente, per favore.**\
      \ Then: **Ho bisogno di aiuto.** These phrases could genuinely help you — practice them until they feel automatic."
    grammar_point_codes:
    - polite_exp
    - si_no_non
  - type: writing
    title: Something went wrong
    description: Write what you'd say in a crisis
    content: "You lost your bag at the train station. Write 3-4 sentences explaining what happened and asking for help. Use\
      \ **Scusi**, **Ho perso...**, **Dov'è...?**, and **Ho bisogno di...**"
    grammar_point_codes:
    - si_no_non
    - polite_exp
    - dove_e
  - type: drill
    title: "Review: introductions"
    description: Keep lesson 10 fresh
    hint: "Sono = I am. Sei = you are. Di dove sei? = where are you from?"
    grammar_point_code: essere_pre
    exercise_type: fill_blank
    items:
    - prompt: "I am English. = ___ inglese."
      correct_answer: Sono
      grammar_point_code: essere_pre
    - prompt: "Are you Italian? = ___ italiano?"
      correct_answer: Sei
      grammar_point_code: essere_pre
    - prompt: "She is French. = Lei ___ francese."
      correct_answer: è
      grammar_point_code: essere_pre
    - prompt: "Where are you from? = Di ___ sei?"
      correct_answer: dove
      grammar_point_code: simp_sent
"a0-12-ultimo-giorno":
  topic_title: L'ultimo giorno
  topic_description: "Your last day — goodbyes, expressing thanks, reflections"
  overview: "Your trip is ending. Review everything through one final day of farewells, thanks, and looking back."
  activities:
  - type: vocab_review
  - type: grammar
    title: Goodbyes and thanks
    description: Saying farewell like an Italian
    grammar_point_code: saluti
    content: |
      ## Saying goodbye

      Let's bring all the farewells together:

      - <span lang="it">**Ciao!**</span> — Bye! (informal)
      - <span lang="it">**Arrivederci!**</span> — Goodbye! (formal)
      - <span lang="it">**A presto!**</span> — See you soon!
      - <span lang="it">**A domani!**</span> — See you tomorrow!
      - <span lang="it">**Buonanotte!**</span> — Good night!
      - <span lang="it">**Buon viaggio!**</span> — Have a good trip!

      ### Expressing thanks

      - <span lang="it">**Grazie di tutto!**</span> — Thanks for everything!
      - <span lang="it">**È stato bellissimo!**</span> — It was wonderful!
  - type: drill
    title: Goodbyes
    description: Match the farewell
    hint: Think about the context.
    grammar_point_code: saluti
    exercise_type: fill_blank
    items:
    - prompt: "See you soon! = A ___!"
      correct_answer: presto
    - prompt: "Have a good trip! = Buon ___!"
      correct_answer: viaggio
    - prompt: "Thanks for everything! = Grazie di ___!"
      correct_answer: tutto
    - prompt: "See you tomorrow! = A ___!"
      correct_answer: domani
    - prompt: "Good night! = ___!"
      correct_answer: Buonanotte
  - type: reading
    title: Checking out
    description: Leaving the hotel
    content: |
      <span lang="it">— Buongiorno. Vorrei il conto, per favore. Camera dodici.</span>

      <span lang="it">— Certo. Sono centoventi euro per tre notti.</span> (120 euros for three nights.)

      <span lang="it">— Ecco. Grazie di tutto! L'albergo è bellissimo.</span>

      <span lang="it">— Grazie a Lei! Torna presto!</span> (Come back soon!)

      <span lang="it">— Sicuramente! Arrivederci!</span> (Definitely!)

      <span lang="it">— Arrivederci! Buon viaggio!</span>
    questions:
    - text: "How many nights did the guest stay?"
      correct_answer: tre / 3
      grammar_point_codes:
      - num_0_20
    - text: "How much is the total?"
      correct_answer: centoventi euro / 120 euros
      grammar_point_codes:
      - num_20_100
  - type: drill
    title: Everything review
    description: Mixed review of all lessons
    hint: "This covers everything — take your time!"
    grammar_point_code: saluti
    exercise_type: fill_blank
    items:
    - prompt: "Hello! = ___!"
      correct_answer: Ciao
      grammar_point_code: saluti
    - prompt: "I'd like a coffee. = ___ un caffè."
      correct_answer: Vorrei
      grammar_point_code: vorrei
    - prompt: "Where is the station? = Dov'è la ___?"
      correct_answer: stazione
      grammar_point_code: dove_e
    - prompt: "I am American. = Sono ___."
      correct_answer: americano
      grammar_point_code: essere_pre
    - prompt: "I like pizza. = Mi ___ la pizza."
      correct_answer: piace
      grammar_point_code: mi_piace
    - prompt: "A ticket to Rome. = Un biglietto ___ Roma."
      correct_answer: per
      grammar_point_code: vocab_viaggio
  - type: drill
    title: Fix the mistakes
    description: Error correction review
    hint: "Articles, verb forms, word order."
    grammar_point_code: simp_sent
    exercise_type: error_correction
    items:
    - prompt: Io è italiano.
      correct_answer: Io sono italiano.
      grammar_point_code: essere_pre
    - prompt: Mi piacciono la pizza.
      correct_answer: Mi piace la pizza.
      grammar_point_code: mi_piace
    - prompt: Vorrei un pizza.
      correct_answer: Vorrei una pizza.
      grammar_point_code: art_un_una
    - prompt: Non capisco non.
      correct_answer: Non capisco.
      grammar_point_code: si_no_non
  - type: listening
    title: A farewell conversation
    description: Listen to friends saying goodbye
    audio_path: /static/audio/a0_12_ultimo_giorno.wav
    content: |
      — Allora, domani parti?
      — Sì, il treno parte alle nove. Mi dispiace!
      — È stato bellissimo! Mi è piaciuto molto.
      — Anche a me. Grazie di tutto!
      — Torna presto! A presto!
      — Sicuramente! Arrivederci!
      — Ciao! Buon viaggio!
    questions:
    - text: "What time does the train leave?"
      correct_answer: "alle nove / at 9:00"
      grammar_point_codes:
      - ore_giorni
    - text: "How did both people feel about the visit?"
      correct_answer: È stato bellissimo / It was wonderful
      grammar_point_codes:
      - saluti
  - type: speaking
    title: Your farewell
    description: Say goodbye in Italian
    content: "Say this out loud: **Grazie di tutto! È stato bellissimo! Mi piace molto l'Italia.** Then: **Arrivederci! A\
      \ presto!** Say it like you mean it!"
    grammar_point_codes:
    - saluti
    - mi_piace
  - type: writing
    title: Goodbye letter
