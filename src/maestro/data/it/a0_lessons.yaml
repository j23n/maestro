##############################################################################
# Maestro A0 — Scenario-first Italian crash course (v2)
# 12 lessons + 1 ripasso = 13 total
# Designed for ~12-15 min daily sessions over two weeks
#
# Design principles:
#   - Never more than 2 grammar cards before a practice activity
#   - Listening + speaking in every lesson
#   - ~15 new vocab items per lesson (max 18)
#   - Active:passive ratio >= 2:1
#   - 10-12 activities per lesson
#   - Every lesson ends with a review drill of earlier material
##############################################################################

"a0-01-in-aereo":
  topic_title: In aereo
  topic_description: Your first Italian words — on the plane and at the airport
  overview: "You're on the plane to Italy. Learn the absolute essentials: hello, thank you, please, excuse me, and the one\
    \ phrase that gets you anything."
  activities:
  - type: info
    title: "Your first Italian lesson!"
    description: How Maestro works
    content: |
      ## Welcome to Maestro!

      Each lesson is built around a real situation you'll face in Italy. Along the way you'll pick up grammar, vocabulary, and cultural tips.

      Activities include:

      - **<span lang="it" data-no-save>Grammatica</span>** — grammar explanations (look for the grammar pill icon)
      - **<span lang="it" data-no-save>Vocabolario</span>** — flashcards to build your word bank
      - **<span lang="it" data-no-save>Esercizio</span>** — drills to practise what you've learned
      - **<span lang="it" data-no-save>Lettura</span>** — reading passages with comprehension questions
      - **<span lang="it" data-no-save>Ascolto</span>** — listening activities with audio
      - **<span lang="it" data-no-save>Scrittura</span>** — writing prompts
      - **<span lang="it" data-no-save>Parlare</span>** — speaking practice

      You can **skip** any activity — just click the skip link at the bottom.

      ---

      ### The scene

      You're on a plane to Italy. The cabin crew greets you, the drinks trolley comes around, and you land at the airport.
  - type: onboarding
    title: "Come ti chiami?"
    description: Tell us your name
    content: "What's your name? Type it below — we'll show you how to say it in Italian!"
    profile_field: name
    response_template: |
      Nice to meet you! In Italian you'd say: **<span lang="it">Mi chiamo {answer}</span>!** (mee KYAH-mo)
  - type: grammar
    title: Greetings and magic words
    description: "Hello, goodbye, please, thank you"
    grammar_point_code: saluti
    content: |
      ## Your first Italian words

      ### Greetings

      | Italian | Meaning | When | Pronunciation |
      |---------|---------|------|---------------|
      | **<span lang="it">Ciao!</span>** | Hello! / Bye! | Informal | *chow* |
      | **<span lang="it">Buongiorno!</span>** | Good morning | Formal, daytime | *bwon-JOR-no* |
      | **<span lang="it">Buonasera!</span>** | Good evening | Formal, evening | *bwon-ah-SEH-rah* |
      | **<span lang="it">Arrivederci!</span>** | Goodbye | Formal | *ah-ree-veh-DEHR-chee* |

      ### Magic words

      | Italian | Meaning | Pronunciation |
      |---------|---------|---------------|
      | **<span lang="it">Grazie!</span>** | Thank you! | *GRAH-tsyeh* |
      | **<span lang="it">Per favore</span>** | Please | *pair fah-VOH-reh* |
      | **<span lang="it">Prego!</span>** | You're welcome | *PREH-go* |
      | **<span lang="it">Scusi</span>** | Excuse me (formal) | *SKOO-zee* |

      > **On the plane:** The crew will greet you with <span lang="it">*Buongiorno!*</span> or <span lang="it">*Buonasera!*</span>. A smile and the same word back is all you need.
  - type: drill
    title: First words
    description: Practise greetings and polite phrases
    hint: "These are the words you just learned — try to recall them!"
    grammar_point_code: saluti
    exercise_type: fill_blank
    items:
    - prompt: "Hello! (informal) = ___!"
      correct_answer: Ciao
    - prompt: "Good morning! = ___!"
      correct_answer: Buongiorno
    - prompt: "Thank you! = ___!"
      correct_answer: Grazie
    - prompt: "Please = Per ___"
      correct_answer: favore
    - prompt: "Excuse me! (formal) = ___!"
      correct_answer: Scusi
  - type: grammar
    title: Survival Italian
    description: When you don't understand + ordering
    grammar_point_code: si_no_non
    content: |
      ## Survival phrases

      - **<span lang="it">Sì</span>** — Yes
      - **<span lang="it">No</span>** — No
      - **<span lang="it">Non capisco.</span>** — I don't understand.
      - **<span lang="it">Parla inglese?</span>** — Do you speak English?
      - **<span lang="it">Mi dispiace.</span>** — I'm sorry.

      ### How to say "not"

      Put **<span lang="it">non</span>** before any verb. That's it — one rule, works every time:
      - <span lang="it">**Capisco**</span> → <span lang="it">**Non capisco**</span> (I don't understand)

      ### The most useful phrase in Italy

      **<span lang="it">Vorrei</span>** means "I would like." It works everywhere — cafés, restaurants, ticket counters, shops:
      - <span lang="it">**Vorrei un caffè, per favore.**</span> — I'd like a coffee, please.
      - <span lang="it">**Vorrei un'acqua.**</span> — I'd like a water.

      Don't worry about the grammar — just use <span lang="it">**vorrei**</span> + what you want + <span lang="it">**per favore**</span>.
  - type: drill
    title: Survival check
    description: "Can you get by?"
    hint: "Non capisco = I don't understand. Vorrei = I would like."
    grammar_point_code: si_no_non
    exercise_type: fill_blank
    items:
    - prompt: "I don't understand. = Non ___."
      correct_answer: capisco
    - prompt: "Do you speak English? = ___ inglese?"
      correct_answer: Parla
    - prompt: "I'd like a coffee. = ___ un caffè."
      correct_answer: Vorrei
    - prompt: "Goodbye! (formal) = ___!"
      correct_answer: Arrivederci
    - prompt: "I'm sorry. = Mi ___."
      correct_answer: dispiace
  - type: reading
    title: On the plane
    description: A short exchange with the cabin crew
    content: |
      <span lang="it">— Buongiorno!</span> (Good morning!)

      <span lang="it">— Buongiorno! Vorrei un'acqua, per favore.</span> (I'd like a water, please.)

      <span lang="it">— Ecco.</span> (Here you go.)

      <span lang="it">— Grazie!</span>

      <span lang="it">— Prego!</span>
    questions:
    - text: "What does the passenger order?"
      correct_answer: un'acqua / a water
      grammar_point_codes:
      - vorrei
    - text: "What does 'prego' mean here?"
      correct_answer: You're welcome
      grammar_point_codes:
      - saluti
  - type: listening
    title: At the airport
    description: Listen to a short exchange at arrivals
    audio_path: /static/audio/a0_01_in_aereo.wav
    content: |
      — Buonasera!
      — Buonasera. Scusi, parla inglese?
      — No, mi dispiace.
      — Va bene. Grazie!
      — Prego. Arrivederci!
    questions:
    - text: "Does the airport worker speak English?"
      correct_answer: 'No'
      grammar_point_codes:
      - si_no_non
    - text: "Is this conversation formal or informal?"
      correct_answer: Formal
      grammar_point_codes:
      - saluti
  - type: speaking
    title: Say it out loud
    description: Practice your first Italian
    content: "Say these three sentences out loud, one after the other: **Buongiorno!** ... **Vorrei un caffè, per favore.**\
      \ ... **Grazie!** Try to sound natural — Italians appreciate the effort!"
    grammar_point_codes:
    - saluti
    - si_no_non
    - vorrei
  - type: info
    title: What's next
    description: How your learning journey continues
    content: |
      ## What happens next

      You've just completed your first Maestro lesson!

      **Lessons** follow your trip chronologically — next you'll check into the hotel.

      **Vocabulary** cards use spaced repetition — words come back just when you're about to forget them.

      **Tip:** Short daily sessions beat long infrequent ones. Even 10 minutes a day works.

      <span lang="it">**Avanti!**</span> (Let's go!)
"a0-02-in-albergo":
  topic_title: In albergo
  topic_description: "Checking into the hotel — names, numbers, and Italian sounds"
  overview: "You've arrived at the hotel. Learn to introduce yourself, understand room numbers, and start reading Italian\
    \ out loud."
  activities:
  - type: vocab_review
  - type: grammar
    title: Mi chiamo...
    description: Giving your name
    grammar_point_code: mi_chiamo
    content: |
      ## At the reception

      - **<span lang="it">Mi chiamo...</span>** — My name is... (*mee KYAH-mo*)
      - **<span lang="it">Ho una prenotazione.</span>** — I have a reservation.
      - **<span lang="it">Come si chiama?</span>** — What is your name? (formal)

      > Walk up to reception and say: <span lang="it">*Buonasera. Mi chiamo [your name]. Ho una prenotazione.*</span> That's all you need.
  - type: drill
    title: "Check-in phrases"
    description: At the hotel reception
    hint: "Mi chiamo = My name is. Ho una prenotazione = I have a reservation."
    grammar_point_code: mi_chiamo
    exercise_type: fill_blank
    items:
    - prompt: "My name is Maria. = Mi ___ Maria."
      correct_answer: chiamo
    - prompt: "I have a reservation. = Ho una ___."
      correct_answer: prenotazione
    - prompt: "What is your name? (formal) = Come si ___?"
      correct_answer: chiama
  - type: grammar
    title: "Numbers 0-20"
    description: "For room numbers, floors, and times"
    grammar_point_code: num_0_20
    content: |
      ## I numeri da 0 a 20

      The receptionist will tell you your room number and floor:

      | # | Italian | | # | Italian |
      |---|---------|---|---|---------|
      | 0 | **<span lang="it">zero</span>** | | 11 | **<span lang="it">undici</span>** |
      | 1 | **<span lang="it">uno</span>** | | 12 | **<span lang="it">dodici</span>** |
      | 2 | **<span lang="it">due</span>** | | 13 | **<span lang="it">tredici</span>** |
      | 3 | **<span lang="it">tre</span>** | | 14 | **<span lang="it">quattordici</span>** |
      | 4 | **<span lang="it">quattro</span>** | | 15 | **<span lang="it">quindici</span>** |
      | 5 | **<span lang="it">cinque</span>** | | 16 | **<span lang="it">sedici</span>** |
      | 6 | **<span lang="it">sei</span>** | | 17 | **<span lang="it">diciassette</span>** |
      | 7 | **<span lang="it">sette</span>** | | 18 | **<span lang="it">diciotto</span>** |
      | 8 | **<span lang="it">otto</span>** | | 19 | **<span lang="it">diciannove</span>** |
      | 9 | **<span lang="it">nove</span>** | | 20 | **<span lang="it">venti</span>** |
      | 10 | **<span lang="it">dieci</span>** | | | |

      **Patterns:** 11–16 end in <span lang="it">*-dici*</span>. 17–19 start with <span lang="it">*dici-*</span>.
  - type: drill
    title: Numbers
    description: Write the Italian number
    hint: "11-16 end in -dici, 17-19 start with dici-."
    grammar_point_code: num_0_20
    exercise_type: fill_blank
    items:
    - prompt: "3 = ___"
      correct_answer: tre
    - prompt: "7 = ___"
      correct_answer: sette
    - prompt: "12 = ___"
      correct_answer: dodici
    - prompt: "15 = ___"
      correct_answer: quindici
    - prompt: "20 = ___"
      correct_answer: venti
  - type: reading
    title: At the reception
    description: Checking in
    content: |
      <span lang="it">— Buonasera!</span>

      <span lang="it">— Buonasera. Mi chiamo Sarah Jones. Ho una prenotazione.</span>

      <span lang="it">— Sì, camera dodici, secondo piano.</span> (Yes, room twelve, second floor.)

      <span lang="it">— Grazie!</span>

      <span lang="it">— Prego. La colazione è dalle sette alle dieci.</span> (Breakfast is from seven to ten.)

      <span lang="it">— Grazie mille! Buonanotte!</span>
    questions:
    - text: "What room number does Sarah get?"
      correct_answer: dodici / 12
      grammar_point_codes:
      - num_0_20
    - text: "What time does breakfast start?"
      correct_answer: sette / 7
      grammar_point_codes:
      - num_0_20
  - type: listening
    title: Checking in
    description: "Listen to a hotel check-in"
    audio_path: /static/audio/a0_02_in_albergo.wav
    content: |
      — Buonasera. Mi chiamo Marco Bianchi. Ho una prenotazione.
      — Sì, signor Bianchi. Camera diciotto, terzo piano.
      — Grazie. Scusi, dov'è l'ascensore?
      — Là, a destra.
      — Grazie mille!
    questions:
    - text: "What room number does Marco get?"
      correct_answer: diciotto / 18
      grammar_point_codes:
      - num_0_20
    - text: "Where is the lift?"
      correct_answer: "là, a destra / there, on the right"
      grammar_point_codes:
      - dove_e
  - type: speaking
    title: Check in
    description: "Practice your hotel check-in"
    content: "Say this out loud as one smooth phrase: **Buonasera. Mi chiamo [your name]. Ho una prenotazione.** Then try:\
      \ **Grazie mille! Buonanotte!**"
    grammar_point_codes:
    - mi_chiamo
    - saluti
  - type: info
    title: Italian sounds
    description: A pronunciation reference card
    content: |
      ## Italian pronunciation — reference card

      Good news: Italian is mostly phonetic — you read it as it's written! Keep this card handy.

      ### Vowels (always the same sound)

      | Letter | Sound | Example |
      |--------|-------|---------|
      | **a** | ah (father) | <span lang="it">casa</span> (KAH-za) |
      | **e** | eh (bed) | <span lang="it">bene</span> (BEH-neh) |
      | **i** | ee (feet) | <span lang="it">vino</span> (VEE-no) |
      | **o** | oh (go) | <span lang="it">notte</span> (NOT-teh) |
      | **u** | oo (moon) | <span lang="it">uno</span> (OO-no) |

      ### Tricky consonants

      | Pattern | Sound | Example |
      |---------|-------|---------|
      | **c** before e/i | "ch" | <span lang="it">ciao</span> = chow |
      | **c** before a/o/u | "k" | <span lang="it">caffè</span> = kaf-FEH |
      | **g** before e/i | "j" | <span lang="it">gelato</span> = jeh-LAH-to |
      | **g** before a/o/u | hard "g" | <span lang="it">grazie</span> = GRAH-tsyeh |
      | **gn** | "ny" | <span lang="it">gnocchi</span> = NYOH-kee |
      | **sc** before e/i | "sh" | <span lang="it">pesce</span> = PEH-sheh |

      Double consonants are **held longer**: <span lang="it" data-no-save>*penna*</span> (PEN-nah), <span lang="it" data-no-save>*notte*</span> (NOT-teh).

      > You don't need to memorise this — come back to it whenever you meet a new word.
  - type: drill
    title: "Review: lesson 1"
    description: Keep yesterday's words fresh
    hint: "Vorrei = I would like. Non capisco = I don't understand."
    grammar_point_code: saluti
    exercise_type: fill_blank
    items:
    - prompt: "I'd like a water. = ___ un'acqua."
      correct_answer: Vorrei
      grammar_point_code: vorrei
    - prompt: "I don't understand. = Non ___."
      correct_answer: capisco
      grammar_point_code: si_no_non
    - prompt: "Good evening! = ___!"
      correct_answer: Buonasera
      grammar_point_code: saluti
    - prompt: "You're welcome. = ___!"
      correct_answer: Prego
      grammar_point_code: saluti
"a0-03-al-bar":
  topic_title: Al bar
  topic_description: "Your first Italian coffee — un/una, counting, and café culture"
  overview: Morning in Italy starts at the bar. Learn to order with the right articles and numbers.
  activities:
  - type: vocab_review
  - type: grammar
    title: "Un caffè, una pizza"
    description: A/an in Italian
    grammar_point_code: art_un_una
    content: |
      ## Un e una — a / an

      When you order, you need the right word for "a":

      - <span lang="it">**un**</span> = a (masculine) — <span lang="it">un caffè, un cornetto, un cappuccino</span>
      - <span lang="it">**una**</span> = a (feminine) — <span lang="it">una pizza, una birra</span>
      - <span lang="it">**un'**</span> = a (feminine, before a vowel) — <span lang="it">un'acqua, un'aranciata</span>

      **Quick rule:** Words ending in **-o** → <span lang="it">un</span>. Words ending in **-a** → <span lang="it">una</span>.

      > **Cultural note:** In Italy, a <span lang="it">*bar*</span> is where you get morning coffee and pastry. Standing at the counter is cheaper than sitting!
  - type: drill
    title: "Un or una?"
    description: Choose the right article
    hint: "Words ending in -o → un. Words ending in -a → una. Feminine before a vowel → un'."
    grammar_point_code: art_un_una
    exercise_type: fill_blank
    items:
    - prompt: "a coffee = ___ caffè"
      correct_answer: un
    - prompt: "a pizza = ___ pizza"
      correct_answer: una
    - prompt: "a water = ___ acqua"
      correct_answer: un'
    - prompt: "a croissant = ___ cornetto"
      correct_answer: un
    - prompt: "a beer = ___ birra"
      correct_answer: una
  - type: grammar
    title: Ordering with numbers
    description: "Due caffè, tre cornetti..."
    grammar_point_code: vorrei
    content: |
      ## Ordering for the group

      You already know <span lang="it">*vorrei*</span>. Now add numbers:

      - <span lang="it">**Vorrei due caffè, per favore.**</span> — I'd like two coffees.
      - <span lang="it">**Vorrei tre cornetti.**</span> — I'd like three croissants.

      Formula: <span lang="it">**Vorrei**</span> + number + item + <span lang="it">**per favore**</span>.

      To ask the price:
      - **<span lang="it">Quanto costa?</span>** — How much does it cost?
  - type: drill
    title: At the counter
    description: Order and pay
    hint: "Vorrei + number + item. Quanto costa? = How much?"
    grammar_point_code: vorrei
    exercise_type: fill_blank
    items:
    - prompt: "I'd like two coffees. = Vorrei ___ caffè."
      correct_answer: due
    - prompt: "How much does it cost? = ___ costa?"
      correct_answer: Quanto
    - prompt: "I'd like the bill. = Vorrei il ___."
      correct_answer: conto
    - prompt: "Thank you very much! = Grazie ___!"
      correct_answer: mille
  - type: reading
    title: Morning coffee
    description: Ordering at an Italian bar
    content: |
      <span lang="it">— Buongiorno!</span>

      <span lang="it">— Buongiorno. Vorrei due caffè e tre cornetti, per favore.</span>

      <span lang="it">— Certo. Sette euro.</span> (Sure. Seven euros.)

      <span lang="it">— Ecco dieci euro.</span> (Here's ten euros.)

      <span lang="it">— Grazie. Tre euro di resto.</span> (Thanks. Three euros change.)

      <span lang="it">— Prego. Buona giornata!</span> (Have a nice day!)
    questions:
    - text: "How many coffees are ordered?"
      correct_answer: due / 2
      grammar_point_codes:
      - vorrei
      - num_0_20
    - text: "How much change does the customer get?"
      correct_answer: tre euro / 3 euros
      grammar_point_codes:
      - num_0_20
  - type: listening
    title: Al bar
    description: Listen to a café order
    audio_path: /static/audio/a0_03_al_bar.wav
    content: |
      — Buongiorno!
      — Buongiorno. Vorrei un cappuccino e una brioche, per favore.
      — Certo. Tre euro e cinquanta.
      — Ecco cinque euro.
      — Grazie. Un euro e cinquanta di resto.
      — Grazie! Buona giornata!
    questions:
    - text: "What does the customer order?"
      correct_answer: un cappuccino e una brioche
      grammar_point_codes:
      - vorrei
      - art_un_una
    - text: "How much is the total?"
      correct_answer: tre euro e cinquanta / 3.50 euros
      grammar_point_codes:
      - num_0_20
  - type: writing
    title: Your order
    description: Write a café order
    content: "You're at an Italian bar. Write a sentence ordering something for breakfast. Use **Vorrei** + un/una + item\
      \ + **per favore**."
    grammar_point_codes:
    - vorrei
    - art_un_una
  - type: speaking
    title: Order politely
    description: Practice ordering at a café
    content: "Say this as one smooth sentence: **Buongiorno. Vorrei un cappuccino e un cornetto, per favore.** Then try asking:\
      \ **Quanto costa?**"
    grammar_point_codes:
    - vorrei
    - art_un_una
    - saluti
  - type: drill
    title: "Review: hotel"
    description: Keep lesson 2 fresh
    hint: "Mi chiamo = My name is. Numbers: tre, sette, dodici..."
    grammar_point_code: mi_chiamo
    exercise_type: fill_blank
    items:
    - prompt: "My name is... = Mi ___..."
      correct_answer: chiamo
      grammar_point_code: mi_chiamo
    - prompt: "Good night! = ___!"
      correct_answer: Buonanotte
      grammar_point_code: saluti
    - prompt: "7 = ___"
      correct_answer: sette
      grammar_point_code: num_0_20
    - prompt: "12 = ___"
      correct_answer: dodici
      grammar_point_code: num_0_20
"a0-04-in-giro":
  topic_title: In giro
  topic_description: "Walking around the city — il/la, asking where things are"
  overview: "Time to explore! Learn the word for 'the', ask where things are, and follow basic directions."
  activities:
  - type: vocab_review
  - type: grammar
    title: Il e la — the
    description: Every noun has a gender
    grammar_point_code: art_il_la
    content: |
      ## Il e la

      Every Italian noun is either **masculine** or **feminine**. The word for "the" changes:

      - <span lang="it">**il**</span> = the (masculine) — <span lang="it">il museo, il bagno, il ristorante</span>
      - <span lang="it">**la**</span> = the (feminine) — <span lang="it">la stazione, la piazza, la farmacia</span>

      Before a vowel, both become <span lang="it">**l'**</span>:
      - <span lang="it">**l'**albergo</span> (the hotel, m.), <span lang="it">**l'**acqua</span> (the water, f.)

      **Rule of thumb:** words ending in **-o** → <span lang="it">il</span>; words ending in **-a** → <span lang="it">la</span>.

      You already know <span lang="it">*un/una*</span> (a). Now <span lang="it">*il/la*</span> (the) works the same way: <span lang="it">*un museo*</span> → <span lang="it">*il museo*</span>.
  - type: drill
    title: "Il or la?"
    description: Choose the right article
    hint: "-o ending → il. -a ending → la. Before a vowel → l'."
    grammar_point_code: art_il_la
    exercise_type: fill_blank
    items:
    - prompt: "___ museo (museum, m.)"
      correct_answer: il
    - prompt: "___ stazione (station, f.)"
      correct_answer: la
    - prompt: "___ bagno (bathroom, m.)"
      correct_answer: il
    - prompt: "___ farmacia (pharmacy, f.)"
      correct_answer: la
    - prompt: "___ albergo (hotel, m.)"
      correct_answer: l'
  - type: grammar
    title: "Dov'è...?"
    description: Asking where things are
    grammar_point_code: dove_e
    content: |
      ## Dov'è...? — Where is...?

      - <span lang="it">**Dov'è il bagno?**</span> — Where is the bathroom?
      - <span lang="it">**Dov'è la stazione?**</span> — Where is the station?

      <span lang="it">**Dov'è**</span> = <span lang="it">dove</span> (where) + <span lang="it">è</span> (is).

      ### Basic directions

      - <span lang="it">**a destra**</span> — on the right
      - <span lang="it">**a sinistra**</span> — on the left
      - <span lang="it">**sempre dritto**</span> — straight ahead
      - <span lang="it">**qui vicino**</span> — near here

      > Start with <span lang="it">*Scusi*</span> to get attention: <span lang="it">*Scusi, dov'è la stazione?*</span>
  - type: drill
