"a0-05-chiedere-aiuto":
  topic_title: Chiedere aiuto
  topic_description: "Getting help — asking for repetition, clarifying, key phrases"
  overview: You'll need to ask for help. Learn the phrases that keep conversations going when you're stuck.
  activities:
  - type: vocab_review
  - type: grammar
    title: When you're stuck
    description: Phrases to keep the conversation going
    grammar_point_code: polite_exp
    content: |
      ## Getting unstuck

      These phrases will save you every day:

      - <span lang="it">**Come?**</span> — What? / Pardon?
      - <span lang="it">**Può ripetere, per favore?**</span> — Can you repeat, please?
      - <span lang="it">**Come si dice ___ in italiano?**</span> — How do you say ___ in Italian?
      - <span lang="it">**Non lo so.**</span> — I don't know.
      - <span lang="it">**Va bene.**</span> — OK. / That's fine.
      - <span lang="it">**Un momento, per favore.**</span> — One moment, please.

      > <span lang="it">*Come?*</span> is the most natural way to ask someone to repeat. Italians say it all the time!
  - type: drill
    title: "What do you say?"
    description: Choose the right phrase
    hint: "Think about the situation — what gets you unstuck?"
    grammar_point_code: polite_exp
    exercise_type: fill_blank
    items:
    - prompt: "The waiter speaks too fast. → Può ___, per favore?"
      correct_answer: ripetere
    - prompt: "You want to know a word in Italian. → Come si ___ in italiano?"
      correct_answer: dice
    - prompt: Someone asks you something. You don't know. → Non lo ___.
      correct_answer: so
    - prompt: "You need a second to think. → Un ___, per favore."
      correct_answer: momento
    - prompt: "You didn't hear. → ___?"
      correct_answer: Come
  - type: grammar
    title: "Prepositions: a, in, di"
    description: Basic location words
    grammar_point_code: prep_place
    content: |
      ## Where things are

      Three little words that tell you where:

      | Italian | English | Example |
      |---------|---------|---------|
      | <span lang="it">**a**</span> | to, at | <span lang="it">Vado **a** Roma.</span> (I go to Rome.) |
      | <span lang="it">**in**</span> | in | <span lang="it">Sono **in** Italia.</span> (I'm in Italy.) |
      | <span lang="it">**di**</span> | of, from | <span lang="it">Sono **di** Londra.</span> (I'm from London.) |

      Common phrases:
      - <span lang="it">**a casa**</span> — at home
      - <span lang="it">**in centro**</span> — in the centre / downtown
      - <span lang="it">**di Roma**</span> — from Rome
  - type: drill
    title: "A, in, or di?"
    description: Choose the right preposition
    hint: "a = to/at. in = in. di = of/from."
    grammar_point_code: prep_place
    exercise_type: fill_blank
    items:
    - prompt: "I am in Italy. = Sono ___ Italia."
      correct_answer: in
    - prompt: "I am from London. = Sono ___ Londra."
      correct_answer: di
    - prompt: "I go to Rome. = Vado ___ Roma."
      correct_answer: a
    - prompt: "I am at home. = Sono ___ casa."
      correct_answer: a
  - type: reading
    title: At the information desk
    description: Asking for help at a train station
    content: |
      <span lang="it">— Scusi, come si dice "platform" in italiano?</span>

      <span lang="it">— Binario.</span>

      <span lang="it">— Può ripetere, per favore?</span>

      <span lang="it">— Bi-na-rio.</span>

      <span lang="it">— Ah, grazie! E quanto costa il biglietto?</span>

      <span lang="it">— Mi dispiace, non lo so. Chieda alla biglietteria.</span> (Ask at the ticket office.)

      <span lang="it">— Va bene. Grazie!</span>
    questions:
    - text: "What word does the tourist learn?"
      correct_answer: binario / platform
      grammar_point_codes:
      - polite_exp
    - text: "Does the person know the ticket price?"
      correct_answer: 'No'
      grammar_point_codes:
      - polite_exp
  - type: listening
    title: At the tourist office
    description: Listen to someone asking for help
    audio_path: /static/audio/a0_05_chiedere_aiuto.wav
    content: |
      — Buongiorno. Scusi, parla inglese?
      — Un po'. Mi dica.
      — Come si dice "church" in italiano?
      — Chiesa.
      — Come?
      — Chie-sa.
      — Grazie! E dov'è la chiesa?
      — In centro, a sinistra dopo la piazza.
      — Grazie mille!
    questions:
    - text: "What word does the tourist learn?"
      correct_answer: chiesa / church
      grammar_point_codes:
      - polite_exp
    - text: "Where is the church?"
      correct_answer: "in centro, a sinistra dopo la piazza / in the centre, left after the square"
      grammar_point_codes:
      - dove_e
  - type: speaking
    title: Ask for help
    description: Practice the help phrases
    content: "Say these out loud: **Scusi, come si dice 'train' in italiano?** Then: **Può ripetere, per favore?** These two\
      \ phrases will rescue you constantly!"
    grammar_point_codes:
    - polite_exp
  - type: writing
    title: A tricky situation
    description: Write what you'd say
    content: "You're at a shop and don't understand the shopkeeper. Write 2-3 sentences using your help phrases: **Non capisco**,\
      \ **Può ripetere?**, **Come si dice...?**, **Parla inglese?**"
    grammar_point_codes:
    - polite_exp
    - si_no_non
  - type: drill
    title: "Review: directions"
    description: Keep lesson 4 fresh
    hint: "il (masculine), la (feminine). Dov'è = where is."
    grammar_point_code: dove_e
    exercise_type: fill_blank
    items:
    - prompt: "Where is the museum? = Dov'è ___ museo?"
      correct_answer: il
      grammar_point_code: art_il_la
    - prompt: "On the left = A ___"
      correct_answer: sinistra
      grammar_point_code: dove_e
    - prompt: "Near here = Qui ___"
      correct_answer: vicino
      grammar_point_code: dove_e
    - prompt: "___ stazione (the station, f.)"
      correct_answer: la
      grammar_point_code: art_il_la
"a0-06-a-pranzo":
  topic_title: A pranzo
  topic_description: "Lunch at a trattoria — menu vocabulary, ordering a meal"
  overview: "It's lunchtime! Learn to read an Italian menu, ask what things are, and order a full meal."
  activities:
  - type: vocab_review
  - type: grammar
    title: The Italian menu
    description: How a meal is structured
    grammar_point_code: vocab_cibo
    content: |
      ## Al ristorante

      An Italian meal follows a traditional order:

      | Course | Italian | What it is |
      |--------|---------|------------|
      | Starters | **<span lang="it">antipasti</span>** | Cold cuts, bruschetta |
      | First course | **<span lang="it">primo</span>** | Pasta, risotto, soup |
      | Second course | **<span lang="it">secondo</span>** | Meat or fish |
      | Side dish | **<span lang="it">contorno</span>** | Vegetables, salad |
      | Dessert | **<span lang="it">dolce</span>** | Cake, tiramisù, gelato |

      You don't need every course — a <span lang="it">primo</span> and a <span lang="it">contorno</span> is a perfectly normal lunch.

      ### At the table

      - <span lang="it">**Un tavolo per due, per favore.**</span> — A table for two.
      - <span lang="it">**Il menù, per favore.**</span> — The menu, please.
      - <span lang="it">**Acqua naturale o frizzante?**</span> — Still or sparkling water?
      - <span lang="it">**Il conto, per favore.**</span> — The bill, please.
  - type: drill
    title: Restaurant basics
    description: Ordering and menu vocab
    hint: "Primo = pasta. Secondo = meat/fish. Contorno = side."
    grammar_point_code: vocab_cibo
    exercise_type: fill_blank
    items:
    - prompt: "A table for two. = Un tavolo per ___, per favore."
      correct_answer: due
    - prompt: "The menu, please. = Il ___, per favore."
      correct_answer: menù
    - prompt: "The bill, please. = Il ___, per favore."
      correct_answer: conto
    - prompt: "Still or sparkling? = ___ o frizzante?"
      correct_answer: Naturale
    - prompt: "The pasta course = il ___"
      correct_answer: primo
  - type: grammar
    title: "Che cos'è questo?"
    description: Asking what things are
    grammar_point_code: che_cose
    content: |
      ## What is it?

      At a restaurant, point at the menu or a dish and ask:

      - <span lang="it">**Che cos'è?**</span> — What is it?
      - <span lang="it">**Che cos'è questo?**</span> — What is this? (m.)
      - <span lang="it">**Che cos'è questa?**</span> — What is this? (f.)

      To answer: <span lang="it">**È...**</span> (It is...)
      - <span lang="it">*Che cos'è questo?*</span> → <span lang="it">*È il tiramisù.*</span>

      **<span lang="it">Questo</span>** (this, m.) and **<span lang="it">questa</span>** (this, f.) match the noun's gender.

      ### Dietary needs

      - <span lang="it">**Sono vegetariano/a.**</span> — I'm vegetarian. (m./f.)
      - <span lang="it">**Sono allergico/a a...**</span> — I'm allergic to... (m./f.)
      - <span lang="it">**Senza glutine**</span> — Gluten-free
  - type: drill
    title: "What is this?"
    description: Asking about dishes
    hint: "Che cos'è = what is it? Questo (m.), questa (f.)."
    grammar_point_code: che_cose
    exercise_type: fill_blank
    items:
    - prompt: "What is this? (m.) = Che cos'è ___?"
      correct_answer: questo
    - prompt: "I'm vegetarian. (m.) = Sono ___."
      correct_answer: vegetariano
    - prompt: "Gluten-free = Senza ___"
      correct_answer: glutine
    - prompt: "I'm allergic to... (f.) = Sono ___ a..."
      correct_answer: allergica
  - type: reading
    title: Ordering lunch
    description: At a trattoria
    content: |
      <span lang="it">— Buongiorno! Un tavolo per due, per favore.</span>

      <span lang="it">— Certo, prego. Ecco il menù.</span>

      <span lang="it">— Grazie. Che cos'è questo?</span>

      <span lang="it">— È la ribollita, una zuppa toscana.</span> (It's ribollita, a Tuscan soup.)

      <span lang="it">— Vorrei la ribollita come primo e un'insalata come contorno.</span>

      <span lang="it">— E da bere?</span> (And to drink?)

      <span lang="it">— Acqua naturale, per favore.</span>
    questions:
    - text: "What is the ribollita?"
      correct_answer: una zuppa toscana / a Tuscan soup
      grammar_point_codes:
      - che_cose
    - text: "What does the customer order to drink?"
      correct_answer: acqua naturale / still water
      grammar_point_codes:
      - vocab_cibo
  - type: listening
    title: At the trattoria
    description: Listen to a lunch order
    audio_path: /static/audio/a0_06_a_pranzo.wav
    content: |
      — Buongiorno! Un tavolo per tre, per favore.
      — Prego. Ecco il menù. Acqua naturale o frizzante?
      — Frizzante, per favore.
      — Cosa prendete?
      — Vorrei la pasta al pomodoro come primo.
      — E per lei?
      — Vorrei il pesce come secondo e un'insalata come contorno.
      — Certo!
    questions:
    - text: "How many people at the table?"
      correct_answer: tre / 3
      grammar_point_codes:
      - num_0_20
    - text: "What water do they choose?"
      correct_answer: frizzante / sparkling
      grammar_point_codes:
      - vocab_cibo
  - type: speaking
    title: Order a meal
    description: Practice ordering at a restaurant
    content: "Say this out loud: **Vorrei la pasta come primo e un'insalata come contorno. Acqua naturale, per favore.** Try\
      \ it as one continuous flow!"
    grammar_point_codes:
    - vocab_cibo
    - vorrei
  - type: writing
    title: Your lunch
    description: Write a restaurant order
    content: "You're at a trattoria. Write 2-3 sentences ordering a meal. Include a primo, something to drink, and use **Vorrei...**\
      \ and **per favore**."
    grammar_point_codes:
    - vocab_cibo
    - vorrei
  - type: drill
    title: "Review: asking for help"
    description: Keep lesson 5 fresh
    hint: "Può ripetere = can you repeat. Come si dice = how do you say."
    grammar_point_code: polite_exp
    exercise_type: fill_blank
    items:
    - prompt: "Can you repeat? = Può ___, per favore?"
      correct_answer: ripetere
      grammar_point_code: polite_exp
    - prompt: "I don't know. = Non lo ___."
      correct_answer: so
      grammar_point_code: polite_exp
    - prompt: "OK. = Va ___."
      correct_answer: bene
      grammar_point_code: polite_exp
    - prompt: "I'm from London. = Sono ___ Londra."
      correct_answer: di
      grammar_point_code: prep_place
"a0-07-mi-piace":
  topic_title: Mi piace
  topic_description: Expressing what you like and don't like — with a preview of plural articles
  overview: "Everyone has opinions about food! Learn to say what you like and don't like in Italian."
  activities:
  - type: vocab_review
  - type: grammar
    title: Mi piace / Non mi piace
    description: Likes and dislikes
    grammar_point_code: mi_piace
    content: |
      ## Likes and dislikes

      - <span lang="it">**Mi piace**</span> + one thing = I like...
      - <span lang="it">**Non mi piace**</span> + one thing = I don't like...
      - <span lang="it">**Mi piacciono**</span> + several things = I like... (plural)

      Examples:
      - <span lang="it">**Mi piace la pizza.**</span> — I like pizza.
      - <span lang="it">**Mi piace il gelato.**</span> — I like gelato.
      - <span lang="it">**Non mi piace la carne.**</span> — I don't like meat.
      - <span lang="it">**Mi piacciono i dolci.**</span> — I like desserts.

      > <span lang="it">*Mi piace*</span> literally means "it pleases me" — the thing you like is the subject. That's why it changes to <span lang="it">*mi piacciono*</span> for plural things.
  - type: drill
    title: Mi piace
    description: Express your preferences
    hint: Mi piace + singular. Mi piacciono + plural. Non goes before mi.
    grammar_point_code: mi_piace
    exercise_type: fill_blank
    items:
    - prompt: "I like pizza. = Mi ___ la pizza."
      correct_answer: piace
    - prompt: "I don't like meat. = ___ mi piace la carne."
      correct_answer: Non
    - prompt: "I like desserts. = Mi ___ i dolci."
      correct_answer: piacciono
    - prompt: "I like fish. = Mi piace il ___."
      correct_answer: pesce
  - type: grammar
    title: "Plural articles: i and le"
    description: The in the plural
    grammar_point_code: art_i_le
    content: |
      ## I and le — "the" in the plural

      You know <span lang="it">**il**</span> and <span lang="it">**la**</span> for one thing. For more than one:

      - <span lang="it">**i**</span> = the (masculine plural) — <span lang="it">i gatti, i dolci, i libri</span>
      - <span lang="it">**le**</span> = the (feminine plural) — <span lang="it">le pizze, le verdure</span>

      **How nouns change:**
      - Masculine **-o** → **-i**: <span lang="it">gatto → gatti</span>
      - Feminine **-a** → **-e**: <span lang="it">pizza → pizze</span>

      You mainly need these with <span lang="it">*mi piacciono*</span>:
      - <span lang="it">*Mi piacciono **i** gatti.*</span> — I like cats.
      - <span lang="it">*Mi piacciono **le** pizze.*</span> — I like pizzas.
  - type: drill
    title: "Singular or plural?"
    description: Choose the right form
    hint: il → i (m. plural). la → le (f. plural). Mi piace → mi piacciono.
    grammar_point_code: art_i_le
    exercise_type: fill_blank
    items:
    - prompt: "___ gatti (the cats, m.)"
      correct_answer: i
    - prompt: "___ pizze (the pizzas, f.)"
      correct_answer: le
    - prompt: "I like cats. = Mi ___ i gatti."
      correct_answer: piacciono
    - prompt: "I like the gelato. = Mi ___ il gelato."
      correct_answer: piace
  - type: drill
    title: Fix the sentence
    description: Correct the errors
    hint: Mi piace + singular. Mi piacciono + plural. Non before mi.
    grammar_point_code: mi_piace
    exercise_type: error_correction
    items:
    - prompt: Mi piacciono la pizza.
      correct_answer: Mi piace la pizza.
    - prompt: Mi piace i dolci.
      correct_answer: Mi piacciono i dolci.
    - prompt: Mi non piace il pesce.
      correct_answer: Non mi piace il pesce.
  - type: reading
    title: "What do you like?"
    description: Friends discussing preferences
    content: |
      <span lang="it">— Mi piace il caffè. E a te?</span> (I like coffee. And you?)

      <span lang="it">— Non mi piace il caffè. Mi piace il tè.</span> (I don't like coffee. I like tea.)

      <span lang="it">— Mi piacciono i dolci. Ti piacciono i dolci?</span> (I like desserts. Do you like desserts?)

      <span lang="it">— Sì, mi piacciono molto!</span> (Yes, I like them a lot!)
    questions:
    - text: "Does the second person like coffee?"
      correct_answer: 'No'
      grammar_point_codes:
      - mi_piace
    - text: "Do both people like desserts?"
      correct_answer: Sì / Yes
      grammar_point_codes:
      - mi_piace
  - type: listening
    title: "Cosa ti piace?"
    description: Listen to friends discussing preferences
    audio_path: /static/audio/a0_07_mi_piace.wav
    content: |
      — Mi piace la pizza. E a te?
      — Anche a me! Mi piace il calcio.
      — Non mi piace il calcio. Mi piacciono i gatti.
      — Anch'io! Mi piacciono molto i gatti.
    questions:
    - text: "What food does the first speaker like?"
      correct_answer: la pizza
      grammar_point_codes:
      - mi_piace
    - text: "What sport does the second speaker like?"
      correct_answer: il calcio / football
      grammar_point_codes:
      - mi_piace
  - type: speaking
    title: Your preferences
    description: Say what you like
    content: "Say these out loud: **Mi piace la pizza.** Then: **Mi piace il gelato.** Now try the negative: **Non mi piace\
      \ il tè.** And the plural: **Mi piacciono i dolci.**"
    grammar_point_codes:
    - mi_piace
  - type: writing
    title: Likes and dislikes
    description: Write about your preferences
    content: "Write 3 sentences about things you like and don't like. Use **Mi piace...**, **Non mi piace...**, and **Mi piacciono...**"
    grammar_point_codes:
    - mi_piace
  - type: drill
    title: "Review: restaurant"
    description: Keep lesson 6 fresh
    hint: "Primo = pasta. Che cos'è = what is it."
    grammar_point_code: vocab_cibo
    exercise_type: fill_blank
    items:
    - prompt: "What is this? = Che cos'è ___?"
      correct_answer: questo
      grammar_point_code: che_cose
    - prompt: "The bill, please. = Il ___, per favore."
      correct_answer: conto
      grammar_point_code: vocab_cibo
    - prompt: "I'm vegetarian. (f.) = Sono ___."
      correct_answer: vegetariana
      grammar_point_code: che_cose
    - prompt: "A table for two. = Un ___ per due."
      correct_answer: tavolo
      grammar_point_code: vocab_cibo
"a0-08-i-numeri-grandi":
  topic_title: I numeri grandi
  topic_description: "Numbers 20-100 and telling time — for prices and timetables"
  overview: "Real-world prices go beyond 20 and trains run on schedules. Learn bigger numbers and how to tell time."
  activities:
  - type: vocab_review
  - type: grammar
    title: "Numbers 20-100"
    description: For prices and addresses
    grammar_point_code: num_20_100
    content: |
      ## Tens

      | # | Italian | | # | Italian |
      |---|---------|---|---|---------|
      | 20 | **<span lang="it">venti</span>** | | 60 | **<span lang="it">sessanta</span>** |
      | 30 | **<span lang="it">trenta</span>** | | 70 | **<span lang="it">settanta</span>** |
      | 40 | **<span lang="it">quaranta</span>** | | 80 | **<span lang="it">ottanta</span>** |
      | 50 | **<span lang="it">cinquanta</span>** | | 90 | **<span lang="it">novanta</span>** |
      | | | | 100 | **<span lang="it">cento</span>** |

      ### Combining

      Join the ten and the unit: <span lang="it">*trenta* + *due* = **trentadue**</span> (32).

      **Drop the final vowel** before <span lang="it">*uno*</span> and <span lang="it">*otto*</span>:
      - <span lang="it">vent**uno**</span> (21), <span lang="it">vent**otto**</span> (28)

      All others just join: <span lang="it">venti**due**</span> (22), <span lang="it">trenta**cinque**</span> (35).
  - type: drill
    title: Bigger numbers
    description: "Numbers 20-100"
    hint: "Drop the final vowel before -uno and -otto."
    grammar_point_code: num_20_100
    exercise_type: fill_blank
    items:
    - prompt: "30 = ___"
      correct_answer: trenta
    - prompt: "50 = ___"
      correct_answer: cinquanta
    - prompt: "21 = ___"
      correct_answer: ventuno
    - prompt: "45 = ___"
      correct_answer: quarantacinque
    - prompt: "100 = ___"
      correct_answer: cento
  - type: grammar
    title: "Che ore sono?"
    description: Telling time and days of the week
    grammar_point_code: ore_giorni
    content: |
      ## Telling time

      - **<span lang="it">Che ore sono?</span>** — What time is it?
      - <span lang="it">**È l'una.**</span> — It's 1:00. (singular)
      - <span lang="it">**Sono le due.**</span> — It's 2:00. (plural for 2+)
      - <span lang="it">**Sono le tre e mezza.**</span> — It's 3:30.

      Italy uses the 24-hour clock for timetables:
      - <span lang="it">**Sono le quindici.**</span> — It's 3 PM.
      - <span lang="it">**Il treno parte alle diciotto.**</span> — The train leaves at 6 PM.

      ### Days of the week

      | Italian | English | | Italian | English |
      |---------|---------|---|---------|---------|
      | <span lang="it">lunedì</span> | Monday | | <span lang="it">venerdì</span> | Friday |
      | <span lang="it">martedì</span> | Tuesday | | <span lang="it">sabato</span> | Saturday |
      | <span lang="it">mercoledì</span> | Wednesday | | <span lang="it">domenica</span> | Sunday |
      | <span lang="it">giovedì</span> | Thursday | | | |

      Days are not capitalised in Italian.
  - type: drill
    title: Time and days
    description: Telling time
    hint: "È l'una (1:00). Sono le + number (for 2+). E mezza = :30."
    grammar_point_code: ore_giorni
    exercise_type: fill_blank
    items:
    - prompt: "What time is it? = Che ___ sono?"
      correct_answer: ore
    - prompt: "It's 3:00. = Sono ___ tre."
      correct_answer: le
    - prompt: "It's 1:00. = È ___."
      correct_answer: l'una
    - prompt: "Monday = ___"
      correct_answer: lunedì
    - prompt: "Saturday = ___"
      correct_answer: sabato
  - type: reading
    title: "What time is it?"
    description: A conversation about schedules
    content: |
      <span lang="it">— Scusi, che ore sono?</span> (Excuse me, what time is it?)

      <span lang="it">— Sono le undici e mezza.</span> (It's 11:30.)

      <span lang="it">— Grazie. E il museo, a che ora apre?</span> (Thanks. And the museum, what time does it open?)

      <span lang="it">— Alle nove. Ma oggi è lunedì — il museo è chiuso il lunedì.</span> (At nine. But today is Monday — the museum is closed on Mondays.)

      <span lang="it">— Ah, mi dispiace! Grazie.</span>
    questions:
    - text: "What time is it?"
      correct_answer: "le undici e mezza / 11:30"
      grammar_point_codes:
      - ore_giorni
    - text: "Why can't they visit the museum?"
      correct_answer: è chiuso il lunedì / it's closed on Mondays
      grammar_point_codes:
      - ore_giorni
  - type: listening
    title: The schedule
    description: "Listen: what time does it open?"
    audio_path: /static/audio/a0_08_i_numeri_grandi.wav
    content: |
      — Buongiorno. A che ora parte il treno per Napoli?
      — Alle quattordici e trenta. Binario sette.
      — Quanto costa?
      — Ventidue euro.
      — Ecco trenta euro.
      — Otto euro di resto. Buon viaggio!
    questions:
    - text: "What time does the train leave?"
      correct_answer: "alle quattordici e trenta / 14:30"
      grammar_point_codes:
      - ore_giorni
    - text: "How much change does the customer get?"
      correct_answer: otto euro / 8 euros
      grammar_point_codes:
      - num_20_100
  - type: speaking
    title: Numbers and time
    description: Practice saying times and prices
    content: "Say these out loud: **Sono le tre e mezza.** Then: **Quarantacinque euro.** Then: **Il treno parte alle quindici.**\
      \ Numbers need practice — say each one twice!"
    grammar_point_codes:
    - num_20_100
    - ore_giorni
  - type: drill
    title: "Review: mi piace"
    description: Keep lesson 7 fresh
    hint: Mi piace + singular. Mi piacciono + plural.
    grammar_point_code: mi_piace
    exercise_type: fill_blank
    items:
    - prompt: "I like pizza. = Mi ___ la pizza."
      correct_answer: piace
      grammar_point_code: mi_piace
    - prompt: "I like desserts. = Mi ___ i dolci."
      correct_answer: piacciono
      grammar_point_code: mi_piace
    - prompt: "I don't like meat. = ___ mi piace la carne."
      correct_answer: Non
      grammar_point_code: mi_piace
    - prompt: ___ gatti (the cats)
      correct_answer: i
      grammar_point_code: art_i_le
