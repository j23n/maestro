      grammar_point_code: num_0_20
    - prompt: "50 = ___"
      correct_answer: cinquanta
      grammar_point_code: num_20_100
    - prompt: "I don't understand. = Non ___."
      correct_answer: capisco
      grammar_point_code: si_no_non
    - prompt: "I'd like a coffee. = ___ un caffè."
      correct_answer: Vorrei
      grammar_point_code: vorrei
    - prompt: "___ pizza (the, f.)"
      correct_answer: la
      grammar_point_code: art_il_la
    - prompt: "I am Italian. = ___ italiano."
      correct_answer: Sono
      grammar_point_code: essere_pre
    - prompt: "I like music. = Mi ___ la musica."
      correct_answer: piace
      grammar_point_code: mi_piace
    - prompt: "A round-trip ticket. = Andata e ___."
      correct_answer: ritorno
      grammar_point_code: vocab_viaggio
    - prompt: "Goodbye! (formal) = ___!"
      correct_answer: Arrivederci
      grammar_point_code: saluti
  - type: reading
    title: A full day in Italy
    description: All your skills in one conversation
    content: |
      <span lang="it">— Buongiorno! Mi chiamo Luca. E tu?</span>

      <span lang="it">— Ciao! Mi chiamo Sofia. Sono di Londra. Sei italiano?</span>

      <span lang="it">— Sì, di Roma. Ti piace l'Italia?</span>

      <span lang="it">— Sì, mi piace molto! Vorrei un caffè, per favore.</span>

      <span lang="it">— Anch'io! Due caffè, per favore. Quanto costa?</span>

      <span lang="it">— Tre euro. Ecco.</span>

      <span lang="it">— Grazie! Poi vorrei un biglietto per Firenze.</span>

      <span lang="it">— A che ora parte il treno?</span>

      <span lang="it">— Alle quattordici e trenta. Binario cinque.</span>

      <span lang="it">— Perfetto! Grazie di tutto. Arrivederci!</span>

      <span lang="it">— Arrivederci! Buon viaggio!</span>
    questions:
    - text: "Where is Sofia from?"
      correct_answer: Londra / London
      grammar_point_codes:
      - simp_sent
    - text: "How many coffees do they order?"
      correct_answer: due / 2
      grammar_point_codes:
      - vorrei
      - num_0_20
    - text: "What time is the train?"
      correct_answer: "alle quattordici e trenta / 14:30"
      grammar_point_codes:
      - ore_giorni
    - text: "Which platform?"
      correct_answer: binario cinque / platform 5
      grammar_point_codes:
      - vocab_viaggio
  - type: listening
    title: The whole trip
    description: Listen to a traveller's story
    audio_path: /static/audio/a0_13_ripasso.wav
    content: |
      — Ciao! Mi chiamo Emma. Sono inglese, di Manchester.
      — Parlo un po' di italiano. Mi piace molto l'Italia!
      — Mi piace la pizza e il gelato. Non mi piace la carne.
      — Sono a Roma da lunedì. Domani vado a Firenze — il treno parte alle dieci.
      — Il biglietto costa trentacinque euro, andata e ritorno.
      — È stato bellissimo! Grazie di tutto. Arrivederci!
    questions:
