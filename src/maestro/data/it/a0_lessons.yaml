a0-01-benvenuto:
  topic_title: "Benvenuto!"
  topic_description: "Welcome to Maestro — your Italian learning journey starts here"
  overview: "In this first lesson you'll meet Maestro, tell us about yourself, and learn your very first Italian words."
  activities:
    - type: grammar
      title: "Welcome to Maestro"
      description: "How Maestro works"
      content: |
        ## Welcome to Maestro!

        Each lesson is built around a grammar topic and includes a mix of activities:

        - **<span lang="it">Grammatica</span>** — grammar explanations (look for the grammar pill icon in the progress bar)
        - **<span lang="it">Vocabolario</span>** — flashcards to build your word bank
        - **<span lang="it">Esercizio</span>** — drills to practise what you've learned
        - **<span lang="it">Lettura</span>** — reading passages with comprehension questions
        - **<span lang="it">Ascolto</span>** — listening activities with audio
        - **<span lang="it">Scrittura</span>** — writing prompts
        - **<span lang="it">Parlare</span>** — speaking practice

        You can **skip** any activity you want — just click the skip link at the bottom.

        The progress bar at the top shows how far you are through the lesson.

        ---

        ### Your first Italian words

        **<span lang="it">Ciao!</span>** — Hello! (informal, also used for goodbye)

        **<span lang="it">Buongiorno!</span>** — Good morning! / Good day! (formal)

        Try saying them out loud: *chow* and *bwon-JOR-no*.

    - type: onboarding
      title: "Come ti chiami?"
      description: "Tell us your name"
      content: "What's your name? Type it below — we'll show you how to say it in Italian!"
      profile_field: name
      response_template: "Nice to meet you! In Italian you'd say: **Mi chiamo {answer}!** (mee KYAH-mo)"

    - type: onboarding
      title: "Chi sei?"
      description: "Tell us about yourself"
      content: "What describes you? For example: student, retired, working in finance, living abroad, parent..."
      profile_field: background
      response_template: "Great — we'll use this to personalise your lessons. In Italian, **Sono...** means 'I am...'."

    - type: onboarding
      title: "Cosa ti piace?"
      description: "Tell us your interests"
      content: "What are your interests? For example: cooking, football, travel, wine, music, history..."
      profile_field: interests
      response_template: "Noted! In Italian, **Mi piace...** means 'I like...'. We'll weave your interests into future lessons."

    - type: onboarding
      title: "Perché l'italiano?"
      description: "Your motivation"
      content: "Why are you learning Italian? For example: travel, family, work, love of Italian culture..."
      profile_field: goal
      response_template: "Great motivation! **Perché** means 'why' (and also 'because'). We'll keep your goal in mind."

    - type: drill
      title: "First words"
      description: "Practise your first Italian phrases"
      hint: "Now, for your first exercise — here are some basic Italian words you just learned. You must attempt every question. Don't worry if you get one wrong — that's how the scoring works!"
      grammar_point_code: saluti
      exercise_type: fill_blank
      items:
        - prompt: "Hello! (informal) = ___!"
          correct_answer: "Ciao"
        - prompt: "Good morning! = ___!"
          correct_answer: "Buongiorno"
        - prompt: "Thank you! = ___!"
          correct_answer: "Grazie"
        - prompt: "Please = Per ___"
          correct_answer: "favore"
        - prompt: "How do you say 'good evening' in Italian? = ___!"
          correct_answer: "Buonasera"

    - type: grammar
      title: "Vocabulary trainer"
      description: "How your vocabulary grows"
      content: |
        ## Your vocabulary

        As you work through lessons, Maestro automatically adds new Italian words to your personal vocabulary.

        Each word becomes a **flashcard** that uses **spaced repetition** — words come back for review just when you're about to forget them.

        - New words are added automatically when they appear in grammar, reading, and listening activities
        - You can also tap any Italian word in a lesson to see its meaning and add it manually
        - Visit your **Vocabulary** page any time to review due cards

        This system means you don't need to make your own flashcards — Maestro handles it for you.

    - type: grammar
      title: "What's next"
      description: "How your learning journey continues"
      content: |
        ## What happens next

        You've just completed your first Maestro lesson! Here's what to expect going forward:

        **Lessons** get progressively more Italian as you advance. Right now everything is in English — soon you'll be reading full Italian explanations.

        **Vocabulary** cards use spaced repetition: words come back for review just when you're about to forget them.

        **Your profile** page tracks your progress across grammar, vocabulary, and communicative skills.

        After completing all 10 introductory lessons, you'll graduate to **A1** where lessons are dynamically generated just for you.

        **Tip:** Short, daily sessions work better than long, infrequent ones. Even 10 minutes a day makes a difference.

        <span lang="it">**Avanti!**</span> (Let's go!)

a0-02-saluti:
  topic_title: "Saluti e addii"
  topic_description: "Formal and informal greetings and goodbyes throughout the day"
  overview: "Learn all the ways Italians greet each other and say goodbye, from casual ciao to formal buonasera."
  activities:
    - type: grammar
      title: "Italian pronunciation basics"
      description: "How to pronounce Italian sounds"
      grammar_point_code: pronun_bas
      content: |
        ## Italian pronunciation

        Good news: Italian is mostly phonetic — you read it as it's written!

        ### The alphabet

        Italian uses the same 26 letters as English, but **j, k, w, x, y** only appear in foreign words. Here are the key sounds:

        ### Vowels (always the same sound)

        | Letter | Sound | Example | Audio |
        |--------|-------|---------|-------|
        | **a** | ah (as in "father") | <span lang="it">casa</span> (KAH-za) | /static/audio/vowel_a.wav |
        | **e** | eh (as in "bed") | <span lang="it">bene</span> (BEH-neh) | /static/audio/vowel_e.wav |
        | **i** | ee (as in "feet") | <span lang="it">vino</span> (VEE-no) | /static/audio/vowel_i.wav |
        | **o** | oh (as in "go") | <span lang="it">mondo</span> (MON-do) | /static/audio/vowel_o.wav |
        | **u** | oo (as in "moon") | <span lang="it">luna</span> (LOO-na) | /static/audio/vowel_u.wav |

        Italian vowels are always pure and short — no diphthongs like in English "name" or "go".

        ### Tricky consonants

        | Pattern | Sound | Example | IPA |
        |---------|-------|---------|-----|
        | **c** before e/i | "ch" | <span lang="it">ciao</span> = chow | /tʃ/ |
        | **c** before a/o/u | "k" | <span lang="it">caffè</span> = kaf-FEH | /k/ |
        | **ch** | always "k" | <span lang="it">che</span> = keh | /k/ |
        | **g** before e/i | "j" | <span lang="it">gelato</span> = jeh-LAH-to | /dʒ/ |
        | **g** before a/o/u | hard "g" | <span lang="it">grazie</span> = GRAH-tsee-eh | /ɡ/ |
        | **gh** | always hard "g" | <span lang="it">spaghetti</span> = spa-GET-tee | /ɡ/ |
        | **gn** | "ny" | <span lang="it">gnocchi</span> = NYOH-kee | /ɲ/ |
        | **gl** + i | "ly" | <span lang="it">famiglia</span> = fah-MEE-lyah | /ʎ/ |
        | **sc** before e/i | "sh" | <span lang="it">pesce</span> = PEH-sheh | /ʃ/ |
        | **z** | "ts" or "dz" | <span lang="it">pizza</span> = PIT-tsah | /ts/ |

        ### Double consonants

        In Italian, double consonants are **held longer**. This changes meaning:

        - <span lang="it">*nono*</span> (NOH-no) = grandfather vs <span lang="it">*nonno*</span> (NON-no) = grandfather
        - <span lang="it">*pena*</span> (PEH-nah) = penalty vs <span lang="it">*penna*</span> (PEN-nah) = pen
        - <span lang="it">*notte*</span> (NOT-teh), <span lang="it">*caffè*</span> (kaf-FEH), <span lang="it">*pizza*</span> (PIT-tsah)

    - type: grammar
      title: "Greetings throughout the day"
      description: "When to use each greeting"
      grammar_point_code: saluti
      content: |
        ## Italian greetings

        Italians use different greetings depending on the time of day and formality:

        | Time | Formal | Informal |
        |------|--------|----------|
        | Morning | **<span lang="it">Buongiorno!</span>** | **<span lang="it">Ciao!</span>** |
        | Afternoon | **<span lang="it">Buon pomeriggio!</span>** | **<span lang="it">Ciao!</span>** |
        | Evening | **<span lang="it">Buonasera!</span>** | **<span lang="it">Ciao!</span>** |

        <span lang="it">**Ciao**</span> is the universal informal greeting — use it with friends, family, and people your age.

        <span lang="it">**Buongiorno**</span> and <span lang="it">**Buonasera**</span> are more formal — use them with strangers, shopkeepers, and older people.

        > **Cultural note:** Italians often greet friends and family with a kiss on each cheek (starting from the right). With strangers, a handshake is fine.

        ### Goodbyes

        - **<span lang="it">Ciao!</span>** — Bye! (informal)
        - **<span lang="it">Arrivederci!</span>** — Goodbye! (formal)
        - **<span lang="it">A presto!</span>** — See you soon!
        - **<span lang="it">A domani!</span>** — See you tomorrow!
        - **<span lang="it">Buonanotte!</span>** — Good night! (when going to bed)

    - type: drill
      title: "Saluti"
      description: "Match the right greeting"
      hint: "Think about time of day and formality. Ciao is always informal!"
      grammar_point_code: saluti
      exercise_type: fill_blank
      items:
        - prompt: "Good morning! (formal) = ___!"
          correct_answer: "Buongiorno"
        - prompt: "Good evening! (formal) = ___!"
          correct_answer: "Buonasera"
        - prompt: "Hello/Bye! (informal) = ___!"
          correct_answer: "Ciao"
        - prompt: "Goodbye! (formal) = ___!"
          correct_answer: "Arrivederci"
        - prompt: "See you soon! = A ___!"
          correct_answer: "presto"
        - prompt: "See you tomorrow! = A ___!"
          correct_answer: "domani"
        - prompt: "Good night! = ___!"
          correct_answer: "Buonanotte"

    - type: reading
      title: "At the hotel"
      description: "A short greeting dialogue"
      content: |
        <span lang="it">— Buongiorno, signora!</span> (Good morning, ma'am!)

        <span lang="it">— Buongiorno! Come sta?</span> (Good morning! How are you?)

        <span lang="it">— Bene, grazie. Arrivederci!</span> (Well, thanks. Goodbye!)

        <span lang="it">— Arrivederci, a presto!</span> (Goodbye, see you soon!)
      questions:
        - "What greeting does the first speaker use?"
        - "How does the conversation end?"
      correct_answers:
        - "Buongiorno"
        - "Arrivederci / A presto"

    - type: listening
      title: "Alla reception"
      description: "Listen to a hotel greeting"
      # Generated by scripts/generate_a0_audio.py — matches a0_audio_path(slug) in tts.py
      audio_path: "/static/audio/a0_a0_02_saluti.wav"
      content: |
        — Buonasera, signore! Benvenuto!
        — Buonasera! Grazie. Come sta?
        — Bene, grazie. La sua camera è al secondo piano.
        — Grazie mille! A domani!
        — A domani! Buonanotte!
      questions:
        - "What time of day is it — morning or evening?"
        - "What does the guest say at the end?"
      correct_answers:
        - "Evening / Buonasera"
        - "A domani"

    - type: drill
      title: "Fix the greeting"
      description: "Find and correct the error"
      hint: "Check formality and time of day. Buonanotte is only for bedtime!"
      grammar_point_code: saluti
      exercise_type: error_correction
      items:
        - prompt: "Buonanotte, signora! (greeting someone in the morning)"
          correct_answer: "Buongiorno, signora!"
        - prompt: "Ciao, professore! (greeting your teacher formally)"
          correct_answer: "Buongiorno, professore!"
        - prompt: "Arrivederci! A presto! Buonanotte! (leaving a shop at 3pm)"
          correct_answer: "Arrivederci! A presto!"
        - prompt: "Buonasera! (greeting a friend informally)"
          correct_answer: "Ciao!"

a0-04-si-e-no:
  topic_title: "Sì e no"
  topic_description: "Saying yes and no, and forming simple negative sentences"
  overview: "Learn to affirm, deny, and form basic Italian sentences with correct word order."
  activities:
    - type: grammar
      title: "Sì, no, and non"
      description: "Affirmation and negation in Italian"
      grammar_point_code: si_no_non
      content: |
        ## Sì e no

        - **<span lang="it">Sì</span>** = Yes
        - **<span lang="it">No</span>** = No

        To make a sentence negative, put **<span lang="it">non</span>** before the verb:

        - <span lang="it">**Parlo italiano.**</span> — I speak Italian.
        - <span lang="it">**Non parlo italiano.**</span> — I don't speak Italian.
        - <span lang="it">**Capisco.**</span> — I understand.
        - <span lang="it">**Non capisco.**</span> — I don't understand.

        ### Useful phrases

        Here are some phrases you'll need in conversations:

        - <span lang="it">**Va bene.**</span> — OK. / That's fine.
        - <span lang="it">**Un po'.**</span> — A little.
        - <span lang="it">**Mi dispiace.**</span> — I'm sorry.

        ### Simple sentence structure

        Italian sentences follow the same basic order as English:

        **Subject + Verb + Object**

        - <span lang="it">*Io parlo italiano.*</span> — I speak Italian.
        - <span lang="it">*Tu mangi la pizza.*</span> — You eat pizza.

        But the subject pronoun is often dropped because the verb form tells you who's speaking:

        - <span lang="it">*Parlo italiano.*</span> — (I) speak Italian.
        - <span lang="it">*Mangi la pizza.*</span> — (You) eat pizza.

        ### Frasi di sopravvivenza (Survival phrases)

        - <span lang="it">**Non parlo italiano.**</span> — I don't speak Italian.
        - <span lang="it">**Non capisco.**</span> — I don't understand.
        - <span lang="it">**Parla inglese?**</span> — Do you speak English?
        - <span lang="it">**Aiuto!**</span> — Help!

    - type: drill
      title: "Sì o no?"
      description: "Practise negation"
      hint: "To negate, put 'non' before the verb. Sì has an accent!"
      grammar_point_code: si_no_non
      exercise_type: fill_blank
      items:
        - prompt: "I don't understand. = ___ capisco."
          correct_answer: "Non"
        - prompt: "I speak Italian. = ___ italiano."
          correct_answer: "Parlo"
        - prompt: "Yes = ___"
          correct_answer: "Sì"
        - prompt: "No = ___"
          correct_answer: "No"
        - prompt: "I don't know. = Non ___ ."
          correct_answer: "so"

    - type: reading
      title: "Do you speak Italian?"
      description: "A tourist asking for help"
      content: |
        <span lang="it">— Scusi, parla inglese?</span> (Excuse me, do you speak English?)

        <span lang="it">— No, mi dispiace. Non parlo inglese.</span> (No, I'm sorry. I don't speak English.)

        <span lang="it">— Va bene. Parlo un po' di italiano.</span> (That's OK. I speak a little Italian.)

        <span lang="it">— Ah, bene!</span> (Ah, great!)
      questions:
        - "Does the second person speak English?"
        - "Does the tourist speak any Italian?"
      correct_answers:
        - "No"
        - "Sì / Yes, a little"

    - type: drill
      title: "Fix the negation"
      description: "Correct these sentences"
      hint: "Remember: non goes BEFORE the verb. Check that positive and negative match the meaning."
      grammar_point_code: si_no_non
      exercise_type: error_correction
      items:
        - prompt: "Parlo non italiano."
          correct_answer: "Non parlo italiano."
        - prompt: "Capisco non."
          correct_answer: "Non capisco."
        - prompt: "Non sì. (meaning: No.)"
          correct_answer: "No."
        - prompt: "No parlo inglese."
          correct_answer: "Non parlo inglese."

    - type: speaking
      title: "Say it in Italian"
      description: "Practice saying negative sentences"
      content: "Say this sentence out loud in Italian: **I don't speak English.** (Non parlo inglese.)"

    - type: drill
      title: "Review: greetings"
      description: "Quick review of lessons 1-2"
      hint: "Keep earlier material fresh!"
      grammar_point_code: saluti
      exercise_type: fill_blank
      items:
        - prompt: "Hello! (informal) = ___!"
          correct_answer: "Ciao"
        - prompt: "Good evening! = ___!"
          correct_answer: "Buonasera"
        - prompt: "Goodbye! (formal) = ___!"
          correct_answer: "Arrivederci"
        - prompt: "See you tomorrow! = A ___!"
          correct_answer: "domani"
        - prompt: "Good night! = ___!"
          correct_answer: "Buonanotte"

a0-03-numeri:
  topic_title: "I numeri"
  topic_description: "Learn to count from 0 to 20 in Italian"
  overview: "Numbers are everywhere — prices, addresses, phone numbers. Learn 0-20 so you're ready."
  activities:
    - type: grammar
      title: "Numbers 0-10"
      description: "Learn Italian numbers from zero to ten"
      grammar_point_code: num_0_20
      content: |
        ## I numeri da 0 a 10

        | # | Italian | Pronunciation | Audio |
        |---|---------|--------------|-------|
        | 0 | **<span lang="it">zero</span>** | DZEH-ro | /static/audio/num_0.wav |
        | 1 | **<span lang="it">uno</span>** | OO-no | /static/audio/num_1.wav |
        | 2 | **<span lang="it">due</span>** | DOO-eh | /static/audio/num_2.wav |
        | 3 | **<span lang="it">tre</span>** | TREH | /static/audio/num_3.wav |
        | 4 | **<span lang="it">quattro</span>** | KWAT-tro | /static/audio/num_4.wav |
        | 5 | **<span lang="it">cinque</span>** | CHEEN-kweh | /static/audio/num_5.wav |
        | 6 | **<span lang="it">sei</span>** | SEH-ee | /static/audio/num_6.wav |
        | 7 | **<span lang="it">sette</span>** | SET-teh | /static/audio/num_7.wav |
        | 8 | **<span lang="it">otto</span>** | OT-to | /static/audio/num_8.wav |
        | 9 | **<span lang="it">nove</span>** | NO-veh | /static/audio/num_9.wav |
        | 10 | **<span lang="it">dieci</span>** | dee-EH-chee | /static/audio/num_10.wav |

        **Tip:** These are the building blocks — learn them well and the teens become easy!

        Notice that <span lang="it">**sei**</span> (6) sounds like the word for "you are" — context will tell you which one it is.

    - type: drill
      title: "Numeri 0-10"
      description: "Write the Italian number"
      hint: "Sound them out in your head — Italian numbers are very phonetic."
      grammar_point_code: num_0_20
      exercise_type: fill_blank
      items:
        - prompt: "1 = ___"
          correct_answer: "uno"
        - prompt: "3 = ___"
          correct_answer: "tre"
        - prompt: "5 = ___"
          correct_answer: "cinque"
        - prompt: "7 = ___"
          correct_answer: "sette"
        - prompt: "10 = ___"
          correct_answer: "dieci"
        - prompt: "0 = ___"
          correct_answer: "zero"
        - prompt: "8 = ___"
          correct_answer: "otto"

    - type: grammar
      title: "Numbers 11-20"
      description: "Learn Italian numbers from eleven to twenty"
      grammar_point_code: num_0_20
      content: |
        ## I numeri da 11 a 20

        | # | Italian | Pronunciation | Audio |
        |---|---------|--------------|-------|
        | 11 | **<span lang="it">undici</span>** | OON-dee-chee | /static/audio/num_11.wav |
        | 12 | **<span lang="it">dodici</span>** | DO-dee-chee | /static/audio/num_12.wav |
        | 13 | **<span lang="it">tredici</span>** | TREH-dee-chee | /static/audio/num_13.wav |
        | 14 | **<span lang="it">quattordici</span>** | kwat-TOR-dee-chee | /static/audio/num_14.wav |
        | 15 | **<span lang="it">quindici</span>** | KWEEN-dee-chee | /static/audio/num_15.wav |
        | 16 | **<span lang="it">sedici</span>** | SEH-dee-chee | /static/audio/num_16.wav |
        | 17 | **<span lang="it">diciassette</span>** | dee-chas-SET-teh | /static/audio/num_17.wav |
        | 18 | **<span lang="it">diciotto</span>** | dee-CHOT-to | /static/audio/num_18.wav |
        | 19 | **<span lang="it">diciannove</span>** | dee-chan-NO-veh | /static/audio/num_19.wav |
        | 20 | **<span lang="it">venti</span>** | VEN-tee | /static/audio/num_20.wav |

        **Tip:** 11-16 end in <span lang="it">*-dici*</span>. 17-19 start with <span lang="it">*dici-*</span> + the unit.

    - type: drill
      title: "Numeri 11-20"
      description: "Write the Italian number"
      hint: "Remember: 11-16 end in -dici, 17-19 start with dici-."
      grammar_point_code: num_0_20
      exercise_type: fill_blank
      items:
        - prompt: "11 = ___"
          correct_answer: "undici"
        - prompt: "12 = ___"
          correct_answer: "dodici"
        - prompt: "15 = ___"
          correct_answer: "quindici"
        - prompt: "17 = ___"
          correct_answer: "diciassette"
        - prompt: "20 = ___"
          correct_answer: "venti"
        - prompt: "14 = ___"
          correct_answer: "quattordici"
        - prompt: "18 = ___"
          correct_answer: "diciotto"

    - type: reading
      title: "At the market"
      description: "Numbers in a real situation"
      content: |
        <span lang="it">— Buongiorno! Vorrei tre panini, per favore.</span> (Good morning! I'd like three sandwiches, please.)

        <span lang="it">— Tre panini. Sono cinque euro.</span> (Three sandwiches. That's five euros.)

        <span lang="it">— Ecco dieci euro.</span> (Here's ten euros.)

        <span lang="it">— Grazie. Cinque euro di resto.</span> (Thanks. Five euros change.)
      questions:
        - "How many sandwiches does the customer want? Answer in Italian."
        - "How much change does the customer get? Answer in Italian."
      correct_answers:
        - "tre / 3"
        - "cinque euro / 5"

    - type: drill
      title: "Review: greetings and negation"
      description: "Mixed review of lessons 1-3"
      hint: "Review time! Mix of greetings and negation from previous lessons."
      grammar_point_code: saluti
      exercise_type: fill_blank
      items:
        - prompt: "Good evening! = ___!"
          correct_answer: "Buonasera"
        - prompt: "4 = ___"
          correct_answer: "quattro"
        - prompt: "I don't understand. = Non ___."
          correct_answer: "capisco"
        - prompt: "13 = ___"
          correct_answer: "tredici"
        - prompt: "See you tomorrow! = A ___!"
          correct_answer: "domani"
        - prompt: "9 = ___"
          correct_answer: "nove"

a0-05-per-favore:
  topic_title: "Per favore"
  topic_description: "Polite phrases and how to ask for things with vorrei"
  overview: "Being polite goes a long way in Italy. Learn the magic words and how to order like a local."
  activities:
    - type: grammar
      title: "Polite phrases"
      description: "Essential courtesy expressions"
      grammar_point_code: polite_exp
      content: |
        ## Formule di cortesia

        These are the magic words of Italian:

        - <span lang="it">**Per favore**</span> — Please
        - <span lang="it">**Grazie**</span> — Thank you
        - <span lang="it">**Grazie mille**</span> — Thank you very much
        - <span lang="it">**Prego**</span> — You're welcome / Go ahead
        - <span lang="it">**Scusi**</span> — Excuse me (formal)
        - <span lang="it">**Scusa**</span> — Excuse me (informal)
        - <span lang="it">**Mi dispiace**</span> — I'm sorry

        > <span lang="it">**Prego**</span> has many uses: "you're welcome", "go ahead", "please sit down", "after you". You'll hear it everywhere.

        ### Vorrei — "I would like"

        <span lang="it">**Vorrei**</span> is the polite way to ask for things. It works like magic at cafes, restaurants, and shops:

        - <span lang="it">**Vorrei un caffè.**</span> — I'd like a coffee.
        - <span lang="it">**Vorrei un'acqua.**</span> — I'd like a water.
        - <span lang="it">**Vorrei il conto.**</span> — I'd like the bill.

        Just say: <span lang="it">**Vorrei**</span> + what you want + <span lang="it">**per favore**</span>.

        > **Cultural note:** In many Italian bars, you order and pay at the <span lang="it">**cassa**</span> (register) first, then take the receipt to the counter. Standing at the bar is cheaper than sitting at a table!

    - type: drill
      title: "Cortesia"
      description: "Polite phrases practice"
      hint: "Vorrei means 'I would like' — it's the polite way to order anything."
      grammar_point_code: polite_exp
      exercise_type: fill_blank
      items:
        - prompt: "Thank you! = ___!"
          correct_answer: "Grazie"
        - prompt: "Please = Per ___"
          correct_answer: "favore"
        - prompt: "You're welcome = ___"
          correct_answer: "Prego"
        - prompt: "Excuse me! (formal) = ___!"
          correct_answer: "Scusi"
        - prompt: "I'm sorry = Mi ___"
          correct_answer: "dispiace"
        - prompt: "I'd like a coffee. = ___ un caffè."
          correct_answer: "Vorrei"
        - prompt: "I'd like a water, please. = Vorrei un'acqua, per ___."
          correct_answer: "favore"

    - type: reading
      title: "At the café"
      description: "Ordering at an Italian bar"
      content: |
        <span lang="it">— Buongiorno!</span>

        <span lang="it">— Buongiorno. Vorrei un caffè, per favore.</span>

        <span lang="it">— Certo. Un euro e venti.</span> (Sure. One euro twenty.)

        <span lang="it">— Ecco. Grazie!</span> (Here you go. Thanks!)

        <span lang="it">— Prego. Buona giornata!</span> (You're welcome. Have a nice day!)
      questions:
        - "What does the customer order?"
        - "What does the barista say after 'Grazie'?"
      correct_answers:
        - "un caffè / a coffee"
        - "Prego"

    - type: listening
      title: "Al bar"
      description: "Listen to a café order"
      # Generated by scripts/generate_a0_audio.py — matches a0_audio_path(slug) in tts.py
      audio_path: "/static/audio/a0_a0_05_per_favore.wav"
      content: |
        — Buonasera!
        — Buonasera. Vorrei un'acqua e un cornetto, per favore.
        — Certo. Due euro e cinquanta.
        — Ecco tre euro. Grazie!
        — Prego. Cinquanta centesimi di resto. Buona serata!
      questions:
        - "What two things does the customer order?"
        - "How much does the customer pay?"
      correct_answers:
        - "un'acqua e un cornetto / a water and a croissant"
        - "tre euro / 3 euros"

    - type: writing
      title: "Order something"
      description: "Write a polite order"
      content: "You're at an Italian café. Write a sentence ordering something you'd like. Use **Vorrei** and **per favore**."

    - type: speaking
      title: "Order politely"
      description: "Practice ordering at a café"
      content: "Say this out loud: **Vorrei un caffè, per favore.** (I'd like a coffee, please.) Try to say it naturally!"

    - type: drill
      title: "More polite phrases"
      description: "Additional courtesy practice"
      hint: "Vorrei + per favore is the perfect combination for polite requests."
      grammar_point_code: polite_exp
      exercise_type: fill_blank
      items:
        - prompt: "Thank you very much! = Grazie ___!"
          correct_answer: "mille"
        - prompt: "I'd like the bill. = Vorrei il ___."
          correct_answer: "conto"
        - prompt: "Excuse me! (informal) = ___!"
          correct_answer: "Scusa"
        - prompt: "I'd like a water. = ___ un'acqua."
          correct_answer: "Vorrei"

    - type: drill
      title: "Review: negation"
      description: "Quick review of lesson 3"
      hint: "Keep practising! Non goes before the verb."
      grammar_point_code: si_no_non
      exercise_type: fill_blank
      items:
        - prompt: "I don't understand. = Non ___."
          correct_answer: "capisco"
        - prompt: "I don't speak Italian. = Non ___ italiano."
          correct_answer: "parlo"
        - prompt: "Yes = ___"
          correct_answer: "Sì"
        - prompt: "19 = ___"
          correct_answer: "diciannove"
        - prompt: "See you soon! = A ___!"
          correct_answer: "presto"

a0-06-che-cose:
  topic_title: "Che cos'è?"
  topic_description: "Learning il and la, and asking what things are"
  overview: "Every Italian noun has a gender. Learn the two most common articles and how to ask about objects."
  activities:
    - type: grammar
      title: "Il e la"
      description: "The basic definite articles"
      grammar_point_code: art_il_la
      content: |
        ## Articles: il e la

        Every Italian noun is either **masculine** or **feminine**. The word for "the" changes:

        - <span lang="it">**il**</span> = the (masculine) — <span lang="it">il caffè, il libro, il treno</span>
        - <span lang="it">**la**</span> = the (feminine) — <span lang="it">la pizza, la casa, la stazione</span>

        **Quick rule of thumb:**
        - Words ending in **-o** are usually masculine → <span lang="it">**il**</span>
        - Words ending in **-a** are usually feminine → <span lang="it">**la**</span>
        - Words ending in **-e** can be either (you'll learn these one by one)

        Before a vowel, both <span lang="it">**il**</span> and <span lang="it">**la**</span> become <span lang="it">**l'**</span>:
        - <span lang="it">**l'acqua**</span> (the water, f.)
        - <span lang="it">**l'uomo**</span> (the man, m.)

    - type: grammar
      title: "Che cos'è?"
      description: "Asking what things are"
      grammar_point_code: che_cose
      content: |
        ## Che cos'è?

        To ask "What is this?" say:

        - <span lang="it">**Che cos'è?**</span> — What is it?
        - <span lang="it">**Che cos'è questo?**</span> — What is this? (masculine)
        - <span lang="it">**Che cos'è questa?**</span> — What is this? (feminine)

        To answer: <span lang="it">**È...**</span> (It is...)

        - <span lang="it">*Che cos'è?*</span> — <span lang="it">*È il caffè.*</span> (It's the coffee.)
        - <span lang="it">*Che cos'è questo?*</span> — <span lang="it">*È il libro.*</span> (It's the book.)
        - <span lang="it">*Che cos'è questa?*</span> — <span lang="it">*È la pizza.*</span> (It's the pizza.)

        **<span lang="it">Questo</span>** (this, masculine) and **<span lang="it">questa</span>** (this, feminine) change to match the noun's gender.

    - type: drill
      title: "Il o la?"
      description: "Choose the right article"
      hint: "Words ending in -o are usually il (masculine), words ending in -a are usually la (feminine)."
      grammar_point_code: art_il_la
      exercise_type: fill_blank
      items:
        - prompt: "___ caffè (coffee, m.)"
          correct_answer: "il"
        - prompt: "___ pizza (pizza, f.)"
          correct_answer: "la"
        - prompt: "___ libro (book, m.)"
          correct_answer: "il"
        - prompt: "___ casa (house, f.)"
          correct_answer: "la"
        - prompt: "___ acqua (water, f.)"
          correct_answer: "l'"
        - prompt: "___ treno (train, m.)"
          correct_answer: "il"
        - prompt: "What is this? (masc.) = Che cos'è ___?"
          correct_answer: "questo"

    - type: reading
      title: "What's on the table?"
      description: "Naming everyday objects"
      content: |
        <span lang="it">— Che cos'è questo?</span> (What is this?)

        <span lang="it">— È il caffè.</span> (It's the coffee.)

        <span lang="it">— E questo?</span> (And this?)

        <span lang="it">— È la pizza!</span> (It's the pizza!)

        <span lang="it">— Ah, la pizza! Mi piace la pizza.</span> (Ah, pizza! I like pizza.)
      questions:
        - "What is the first object?"
        - "What article goes with 'pizza'?"
      correct_answers:
        - "il caffè / the coffee"
        - "la"

    - type: drill
      title: "Fix the article"
      description: "Correct the gender errors"
      hint: "Words ending in -o → il, words ending in -a → la."
      grammar_point_code: art_il_la
      exercise_type: error_correction
      items:
        - prompt: "La libro è interessante."
          correct_answer: "Il libro è interessante."
        - prompt: "Il pizza è buona."
          correct_answer: "La pizza è buona."
        - prompt: "La treno è veloce."
          correct_answer: "Il treno è veloce."
        - prompt: "Il casa è grande."
          correct_answer: "La casa è grande."

    - type: writing
      title: "Describe some objects"
      description: "Write about things around you"
      content: "Look around you. Choose 2-3 objects and write what they are in Italian using **il** or **la**. For example: *È il libro. È la pizza.*"

    - type: drill
      title: "Review: polite phrases"
      description: "Quick review of lesson 5"
      hint: "Vorrei = I would like, Per favore = please."
      grammar_point_code: polite_exp
      exercise_type: fill_blank
      items:
        - prompt: "I'd like the bill. = ___ il conto."
          correct_answer: "Vorrei"
        - prompt: "I'm sorry. = Mi ___."
          correct_answer: "dispiace"
        - prompt: "Excuse me! (formal) = ___!"
          correct_answer: "Scusi"
        - prompt: "I don't speak Italian. = ___ parlo italiano."
          correct_answer: "Non"
        - prompt: "11 = ___"
          correct_answer: "undici"

a0-07-io-sono:
  topic_title: "Io sono"
  topic_description: "Subject pronouns and the verb essere (to be) in singular"
  overview: "Learn to talk about yourself and others using the most important Italian verb: essere."
  activities:
    - type: grammar
      title: "Pronouns and essere"
      description: "I am, you are, he/she is"
      grammar_point_code: essere_pre
      content: |
        ## Subject pronouns

        | Italian | English |
        |---------|---------|
        | <span lang="it">**io**</span> | I |
        | <span lang="it">**tu**</span> | you (informal) |
        | <span lang="it">**lui**</span> | he |
        | <span lang="it">**lei**</span> | she |
        | <span lang="it">**Lei**</span> | you (formal) |

        ## Essere (to be) — singular

        | Pronoun | Essere | Example |
        |---------|--------|---------|
        | <span lang="it">io</span> | <span lang="it">**sono**</span> | <span lang="it">Io sono Marco.</span> (I am Marco.) |
        | <span lang="it">tu</span> | <span lang="it">**sei**</span> | <span lang="it">Tu sei italiano?</span> (Are you Italian?) |
        | <span lang="it">lui/lei</span> | <span lang="it">**è**</span> | <span lang="it">Lei è Maria.</span> (She is Maria.) |

        Remember: you can drop the pronoun because the verb tells you who:
        - <span lang="it">**Sono italiano.**</span> = I am Italian.
        - <span lang="it">**Sei pronto?**</span> = Are you ready?

        To ask a question, just raise your intonation:
        - <span lang="it">**Sei italiano?**</span> ↗ (Are you Italian?)

        ### Where are you from?

        To say where you're from, use <span lang="it">**Sono di...**</span>:
        - <span lang="it">**Sono di Londra.**</span> — I'm from London.
        - <span lang="it">**Sono di New York.**</span> — I'm from New York.

        Or your nationality:
        - <span lang="it">**Sono inglese.**</span> — I'm English.
        - <span lang="it">**Sono americano/americana.**</span> — I'm American. (m./f.)
        - <span lang="it">**Sono tedesco/tedesca.**</span> — I'm German. (m./f.)
        - <span lang="it">**Sono francese.**</span> — I'm French.
        - <span lang="it">**Sono spagnolo/spagnola.**</span> — I'm Spanish. (m./f.)

    - type: drill
      title: "Essere"
      description: "Fill in the right form of essere"
      hint: "<table><tr><th>Pronome</th><th>essere</th></tr><tr><td>io</td><td><b>sono</b></td></tr><tr><td>tu</td><td><b>sei</b></td></tr><tr><td>lui/lei</td><td><b>è</b></td></tr><tr><td>noi</td><td><b>siamo</b></td></tr><tr><td>voi</td><td><b>siete</b></td></tr><tr><td>loro</td><td><b>sono</b></td></tr></table>"
      grammar_point_code: essere_pre
      exercise_type: fill_blank
      items:
        - prompt: "I am a student. = Io ___ uno studente."
          correct_answer: "sono"
        - prompt: "You are Italian. = Tu ___ italiano."
          correct_answer: "sei"
        - prompt: "She is Maria. = Lei ___ Maria."
          correct_answer: "è"
        - prompt: "I am happy. = ___ contento."
          correct_answer: "Sono"
        - prompt: "Are you ready? = ___ pronto?"
          correct_answer: "Sei"
        - prompt: "He is a teacher. = Lui ___ un professore."
          correct_answer: "è"

    - type: reading
      title: "Meeting someone"
      description: "Two people introducing themselves"
      content: |
        <span lang="it">— Ciao! Io sono Marco. Tu come ti chiami?</span> (Hi! I'm Marco. What's your name?)

        <span lang="it">— Ciao! Mi chiamo Anna. Sei italiano?</span> (Hi! My name is Anna. Are you Italian?)

        <span lang="it">— Sì, sono italiano. E tu?</span> (Yes, I'm Italian. And you?)

        <span lang="it">— No, non sono italiana. Sono inglese.</span> (No, I'm not Italian. I'm English.)
      questions:
        - "What is the man's name?"
        - "Is Anna Italian?"
      correct_answers:
        - "Marco"
        - "No"

    - type: writing
      title: "Introduce yourself"
      description: "Write about yourself in Italian"
      content: |
        Write 2-3 sentences introducing yourself. Use **Mi chiamo...**, **Sono...**, and any other words you know.

        For example: *Mi chiamo Marco. Sono italiano. Sono di Roma.*

        Some nationalities you can use: inglese (English), americano/a (American), tedesco/a (German), francese (French), spagnolo/a (Spanish), australiano/a (Australian).

    - type: speaking
      title: "Introduce yourself"
      description: "Practice your self-introduction"
      content: "Say these sentences out loud: **Mi chiamo [your name]. Sono [nationality]. Sono di [city].** Try to sound natural!"

    - type: drill
      title: "Review: articles and 'Che cos'è?'"
      description: "Quick review of lesson 6"
      hint: "Remember: il (masculine), la (feminine)."
      grammar_point_code: art_il_la
      exercise_type: fill_blank
      items:
        - prompt: "___ stazione (station, f.)"
          correct_answer: "la"
        - prompt: "___ gelato (ice cream, m.)"
          correct_answer: "il"
        - prompt: "What is it? = Che cos'___?"
          correct_answer: "è"
        - prompt: "You're welcome. = ___."
          correct_answer: "Prego"
        - prompt: "15 = ___"
          correct_answer: "quindici"

a0-08-mi-piace:
  topic_title: "Mi piace"
  topic_description: "Expressing what you like and don't like"
  overview: "Everyone has opinions! Learn to say what you like and don't like in Italian."
  activities:
    - type: grammar
      title: "Mi piace"
      description: "Likes and dislikes"
      grammar_point_code: mi_piace
      content: |
        ## Mi piace / Non mi piace

        To say you like something:

        - <span lang="it">**Mi piace**</span> + singular noun or infinitive verb
        - <span lang="it">**Mi piacciono**</span> + plural noun

        Examples:
        - <span lang="it">**Mi piace il caffè.**</span> — I like coffee.
        - <span lang="it">**Mi piace viaggiare.**</span> — I like travelling.
        - <span lang="it">**Mi piacciono i gatti.**</span> — I like cats.

        To say you don't like something, add <span lang="it">**non**</span>:
        - <span lang="it">**Non mi piace il tè.**</span> — I don't like tea.
        - <span lang="it">**Non mi piacciono i ragni.**</span> — I don't like spiders.

        **Note:** Literally, <span lang="it">*mi piace*</span> means "it pleases me" — the thing you like is the subject!

    - type: listening
      title: "Cosa ti piace?"
      description: "Listen to two friends discussing what they like"
      # Generated by scripts/generate_a0_audio.py — matches a0_audio_path(slug) in tts.py
      audio_path: "/static/audio/a0_a0_08_mi_piace.wav"
      content: |
        — Mi piace la pizza. E a te?
        — Anche a me! Mi piace il calcio.
        — Non mi piace il calcio. Mi piacciono i gatti.
        — Anch'io! Mi piacciono molto i gatti.
      questions:
        - "What food does the first speaker like?"
        - "What sport does the second speaker like?"
      correct_answers:
        - "la pizza"
        - "il calcio"

    - type: drill
      title: "Mi piace"
      description: "Express your preferences"
      hint: "Mi piace = singular, Mi piacciono = plural. Non goes before mi."
      grammar_point_code: mi_piace
      exercise_type: fill_blank
      items:
        - prompt: "I like coffee. = Mi ___ il caffè."
          correct_answer: "piace"
        - prompt: "I don't like tea. = ___ mi piace il tè."
          correct_answer: "Non"
        - prompt: "I like travelling. = Mi piace ___."
          correct_answer: "viaggiare"
        - prompt: "I like cats. = Mi ___ i gatti."
          correct_answer: "piacciono"
        - prompt: "I don't like spiders. = Non mi piacciono i ___."
          correct_answer: "ragni"

    - type: reading
      title: "What do you like?"
      description: "Two friends talking about their preferences"
      content: |
        <span lang="it">— Mi piace il caffè. E a te?</span> (I like coffee. And you?)

        <span lang="it">— Non mi piace il caffè. Mi piace il tè.</span> (I don't like coffee. I like tea.)

        <span lang="it">— Mi piacciono i gatti. Ti piacciono i gatti?</span> (I like cats. Do you like cats?)

        <span lang="it">— Sì, mi piacciono molto!</span> (Yes, I like them a lot!)
      questions:
        - "Does the second person like coffee?"
        - "Do both people like cats?"
      correct_answers:
        - "No"
        - "Sì / Yes"

    - type: writing
      title: "Your likes and dislikes"
      description: "Write about what you like"
      content: "Write 2-3 sentences about things you like and don't like. Use **Mi piace...** / **Non mi piace...** / **Mi piacciono...**"

    - type: drill
      title: "Fix the sentence"
      description: "Correct the errors"
      hint: "Mi piace + singular, Mi piacciono + plural. Non goes before mi."
      grammar_point_code: mi_piace
      exercise_type: error_correction
      items:
        - prompt: "Mi piacciono il caffè."
          correct_answer: "Mi piace il caffè."
        - prompt: "Mi piace i gatti."
          correct_answer: "Mi piacciono i gatti."
        - prompt: "Mi non piace il tè."
          correct_answer: "Non mi piace il tè."
        - prompt: "Mi piace i libri."
          correct_answer: "Mi piacciono i libri."

a0-09-dove:
  topic_title: "Dov'è?"
  topic_description: "Asking where things are and using basic prepositions"
  overview: "Learn to ask for directions and talk about locations with simple prepositions."
  activities:
    - type: grammar
      title: "Dov'è? and prepositions"
      description: "Where is it? and basic prepositions"
      grammar_point_code: dove_e
      content: |
        ## Dov'è...?

        To ask where something is:
        - <span lang="it">**Dov'è il bagno?**</span> — Where is the bathroom?
        - <span lang="it">**Dov'è la stazione?**</span> — Where is the station?
        - <span lang="it">**Dove sei?**</span> — Where are you?

        ## Basic prepositions

        | Italian | English | Example |
        |---------|---------|---------|
        | <span lang="it">**a**</span> | to, at | <span lang="it">Vado **a** Roma.</span> (I go to Rome.) |
        | <span lang="it">**in**</span> | in | <span lang="it">Sono **in** Italia.</span> (I am in Italy.) |
        | <span lang="it">**di**</span> | of, from | <span lang="it">Sono **di** Londra.</span> (I am from London.) |

        Common location phrases:
        - <span lang="it">**a casa**</span> — at home
        - <span lang="it">**a scuola**</span> — at school
        - <span lang="it">**in centro**</span> — in the centre / downtown
        - <span lang="it">**in Italia**</span> — in Italy
        - <span lang="it">**di Roma**</span> — from Rome

    - type: drill
      title: "Dove?"
      description: "Locations and prepositions"
      hint: "Dov'è = Dove + è (where is). Use a/in/di for location prepositions."
      grammar_point_code: dove_e
      exercise_type: fill_blank
      items:
        - prompt: "Where is the bathroom? = ___'è il bagno?"
          correct_answer: "Dov"
        - prompt: "I am in Italy. = Sono ___ Italia."
          correct_answer: "in"
        - prompt: "I am from London. = Sono ___ Londra."
          correct_answer: "di"
        - prompt: "I go to Rome. = Vado ___ Roma."
          correct_answer: "a"
        - prompt: "Where are you? = ___ sei?"
          correct_answer: "Dove"
        - prompt: "I am at home. = Sono a ___."
          correct_answer: "casa"

    - type: reading
      title: "Where is the museum?"
      description: "A tourist asking for directions"
      content: |
        <span lang="it">— Scusi, dov'è il museo?</span> (Excuse me, where is the museum?)

        <span lang="it">— Il museo? È in centro.</span> (The museum? It's in the centre.)

        <span lang="it">— Grazie! E dov'è la stazione?</span> (Thanks! And where is the station?)

        <span lang="it">— La stazione è a due minuti, là.</span> (The station is two minutes away, there.)

        <span lang="it">— Grazie mille! Arrivederci!</span>
      questions:
        - "Where is the museum?"
        - "How far is the station?"
      correct_answers:
        - "in centro / in the centre"
        - "due minuti / two minutes"

    - type: writing
      title: "Ask for directions"
      description: "Write a question asking where something is"
      content: "Write 2 sentences: ask where a place is and say where you are from. Use **Dov'è...?** and **Sono di...**"

    - type: drill
      title: "Review: essere and mi piace"
      description: "Quick review of lessons 7-8"
      hint: "io sono, tu sei, lui/lei è. Mi piace + singular, mi piacciono + plural."
      grammar_point_code: essere_pre
      exercise_type: fill_blank
      items:
        - prompt: "I am a student. = ___ uno studente."
          correct_answer: "Sono"
        - prompt: "You are kind. = Tu ___ gentile."
          correct_answer: "sei"
        - prompt: "I like pizza. = Mi ___ la pizza."
          correct_answer: "piace"
        - prompt: "I don't like spiders. = ___ mi piacciono i ragni."
          correct_answer: "Non"
        - prompt: "She is Italian. = Lei ___ italiana."
          correct_answer: "è"

a0-10-ripasso:
  topic_title: "Ripasso A0"
  topic_description: "Cumulative review of everything you've learned in the introduction"
  overview: "You've come a long way! Let's review everything from greetings to prepositions before moving on to A1."
  activities:
    - type: grammar
      title: "What you've learned"
      description: "Summary of A0"
      content: |
        ## Congratulations!

        You've completed the Maestro introduction. Here's everything you now know:

        - **Greetings:** <span lang="it">Ciao, Buongiorno, Buonasera, Arrivederci</span>
        - **Numbers:** 0-20
        - **Polite phrases:** <span lang="it">Per favore, Grazie, Prego, Scusi, Vorrei</span>
        - **Yes/No:** <span lang="it">Sì, No, Non</span> + verb
        - **Articles:** <span lang="it">il</span> (m.), <span lang="it">la</span> (f.)
        - **Essere:** <span lang="it">sono, sei, è</span>
        - **Likes:** <span lang="it">Mi piace</span> / <span lang="it">Non mi piace</span>
        - **Locations:** <span lang="it">Dov'è?</span> + <span lang="it">a, in, di</span>
        - **Self-intro:** <span lang="it">Mi chiamo...</span>

        After this lesson, you'll graduate to **A1** — where lessons become dynamic, personalised, and increasingly in Italian.

        <span lang="it">**Bravissimo!**</span>

