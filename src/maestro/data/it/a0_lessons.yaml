    - mi_piace
"a0-13-ripasso":
  topic_title: Ripasso A0
  topic_description: Cumulative review before A1
  overview: "You've come a long way! Final review of everything before moving on to A1."
  activities:
  - type: vocab_review
  - type: info
    title: What you've learned
    description: Summary of A0
    content: |
      ## Congratulations!

      Over 12 lessons you've learned to:

      - **Greet and say goodbye:** <span lang="it">Ciao, Buongiorno, Buonasera, Arrivederci, A presto</span>
      - **Be polite:** <span lang="it">Per favore, Grazie, Prego, Scusi, Mi dispiace</span>
      - **Survive when lost:** <span lang="it">Non capisco, Parla inglese?, Può ripetere?</span>
      - **Order anything:** <span lang="it">Vorrei + un/una + item + per favore</span>
      - **Count and pay:** numbers 0–100, <span lang="it">Quanto costa?</span>
      - **Ask directions:** <span lang="it">Dov'è...? A destra, a sinistra, sempre dritto</span>
      - **Navigate menus:** <span lang="it">primo, secondo, contorno, dolce</span>
      - **Tell time:** <span lang="it">Che ore sono? Sono le tre e mezza</span>
      - **Buy tickets:** <span lang="it">biglietto, andata e ritorno, binario</span>
      - **Introduce yourself:** <span lang="it">Mi chiamo... Sono di... Sono + nationality</span>
      - **Use essere:** <span lang="it">sono, sei, è</span>
      - **Express preferences:** <span lang="it">Mi piace / Non mi piace / Mi piacciono</span>
      - **Handle problems:** <span lang="it">Aiuto! Ho bisogno di... Ho perso...</span>
      - **Use articles:** <span lang="it">il/la/l', un/una/un', i/le</span>

      <span lang="it">**Bravissimo!**</span>
  - type: drill
    title: Ripasso generale
    description: All A0 material
    hint: "Take your time — this covers everything!"
    grammar_point_code: saluti
    exercise_type: fill_blank
    items:
