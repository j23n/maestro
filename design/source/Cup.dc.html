<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Coffee cup mascot</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div role="img" aria-label="{{label}}" style="width: {{px}}; height: {{px}}; color: #2B211C; display: flex">
<sc-if value="{{ isTazzina }}" hint-placeholder-val="{{ true }}">
<svg width="100%" height="100%" viewBox="0 0 120 120" aria-hidden="true">
<path d="M52 44 Q47 37 52 30 Q57 23 52 16 M62 44 Q57 36 62 28 M72 44 Q67 37 72 30" stroke="#B9AFA6" stroke-width="2.4" fill="none" stroke-linecap="round"></path>
<ellipse cx="60" cy="101" rx="42" ry="8.5" fill="#F4EFEA" stroke="#2B211C" stroke-width="2.5"></ellipse>
<path d="M90 64 Q107 64 105 77 Q103 88 86 85" stroke="#2B211C" stroke-width="9" fill="none" stroke-linecap="round"></path>
<path d="M90 64 Q107 64 105 77 Q103 88 86 85" stroke="#FFFFFF" stroke-width="4" fill="none" stroke-linecap="round"></path>
<path d="M30 56 L90 56 Q89 93 60 97 Q31 93 30 56 Z" fill="#FFFFFF" stroke="#2B211C" stroke-width="2.5" stroke-linejoin="round"></path>
<path d="M31 65 Q60 72 89 65" stroke="{{accent}}" stroke-width="4.5" fill="none" stroke-linecap="round"></path>
<ellipse cx="60" cy="56" rx="30" ry="7" fill="#6B3E26" stroke="#2B211C" stroke-width="2.5"></ellipse>
<ellipse cx="60" cy="56.5" rx="23" ry="4.4" fill="#C08552"></ellipse>
<circle cx="51" cy="78" r="3.2" fill="#2B211C"></circle>
<circle cx="69" cy="78" r="3.2" fill="#2B211C"></circle>
<circle cx="50" cy="76.9" r="1" fill="#FFFFFF"></circle>
<circle cx="68" cy="76.9" r="1" fill="#FFFFFF"></circle>
<path d="M55 85 Q60 89.5 65 85" stroke="#2B211C" stroke-width="2.3" fill="none" stroke-linecap="round"></path>
<ellipse cx="44.5" cy="83.5" rx="3.4" ry="2.4" fill="#E8A07A" opacity="0.75"></ellipse>
<ellipse cx="75.5" cy="83.5" rx="3.4" ry="2.4" fill="#E8A07A" opacity="0.75"></ellipse>
</svg>
</sc-if>
<sc-if value="{{ isCappuccio }}" hint-placeholder-val="{{ false }}">
<svg width="100%" height="100%" viewBox="0 0 120 120" aria-hidden="true">
<path d="M88 52 Q108 52 106 70 Q104 86 86 84" stroke="#2B211C" stroke-width="11" fill="none" stroke-linecap="round"></path>
<path d="M88 52 Q108 52 106 70 Q104 86 86 84" stroke="#C96A43" stroke-width="5.5" fill="none" stroke-linecap="round"></path>
<path d="M30 42 L90 42 L86 102 Q60 108 34 102 Z" fill="#C96A43" stroke="#2B211C" stroke-width="2.5" stroke-linejoin="round"></path>
<path d="M33 88 Q60 94 87 88" stroke="#8A3D1E" stroke-width="3" fill="none" stroke-linecap="round"></path>
<path d="M27 43 Q30 24 60 23 Q90 24 93 43 Z" fill="#F6EEE4" stroke="#2B211C" stroke-width="2.5" stroke-linejoin="round"></path>
<circle cx="48" cy="34" r="1.6" fill="#8A5A3B"></circle>
<circle cx="57" cy="30" r="1.6" fill="#8A5A3B"></circle>
<circle cx="66" cy="33" r="1.6" fill="#8A5A3B"></circle>
<circle cx="74" cy="37" r="1.6" fill="#8A5A3B"></circle>
<circle cx="51" cy="65" r="3.4" fill="#2B211C"></circle>
<circle cx="69" cy="65" r="3.4" fill="#2B211C"></circle>
<circle cx="50" cy="63.8" r="1.1" fill="#FFFFFF"></circle>
<circle cx="68" cy="63.8" r="1.1" fill="#FFFFFF"></circle>
<path d="M54 73 Q60 78.5 66 73" stroke="#2B211C" stroke-width="2.4" fill="none" stroke-linecap="round"></path>
<ellipse cx="44" cy="71" rx="3.6" ry="2.6" fill="#F0B392" opacity="0.85"></ellipse>
<ellipse cx="76" cy="71" rx="3.6" ry="2.6" fill="#F0B392" opacity="0.85"></ellipse>
</svg>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"kind":{"editor":"enum","options":["tazzina","cappuccio"],"default":"tazzina"},"size":{"editor":"int","default":160,"min":24,"max":400},"accent":{"editor":"color","default":"#A84A24","options":["#A84A24","#8C5A2B","#2F6B3A"]},"$preview":{"width":160,"height":160}}'>
class Component extends DCLogic {
renderVals() {
const kind = this.props.kind ?? 'tazzina';
const size = Number(this.props.size ?? 160);
return {
px: size + 'px',
accent: this.props.accent ?? '#A84A24',
isTazzina: kind === 'tazzina',
isCappuccio: kind === 'cappuccio',
label: kind === 'cappuccio' ? 'Cappuccio, a smiling cappuccino mug' : 'Tazzina, a smiling espresso cup'
};
}
}
</script>
</body>
</html>
