class Component extends DCLogic {
renderVals() {
const pose = this.props.pose ?? 'hello';
const size = Number(this.props.size ?? 160);
const labels = { hello: 'Moka the coffee pot, waving', think: 'Moka the coffee pot, thinking', cheer: 'Moka the coffee pot, cheering', sleep: 'Moka the coffee pot, resting' };
return {
px: size + 'px',
accent: this.props.accent ?? '#A84A24',
isHello: pose === 'hello',
isThink: pose === 'think',
isCheer: pose === 'cheer',
isSleep: pose === 'sleep',
label: labels[pose] || labels.hello
};
}
}
