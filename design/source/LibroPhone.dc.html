<div style="display: flex; gap: 8px">

<button style="flex: 1; height: 44px; border-radius: 10px; border: 1px solid #EDE5DE; background: #FFFFFF; color: #2B211C; font: 400 18px 'Literata', serif; cursor: pointer">ì</button>
<button style="flex: 1; height: 44px; border-radius: 10px; border: 1px solid #EDE5DE; background: #FFFFFF; color: #2B211C; font: 400 18px 'Literata', serif; cursor: pointer">ò</button>
<button style="flex: 1; height: 44px; border-radius: 10px; border: 1px solid #EDE5DE; background: #FFFFFF; color: #2B211C; font: 400 18px 'Literata', serif; cursor: pointer">ù</button>

<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0014 0M12 18v3"></path></svg>

<button style="flex: 1; height: 56px; border-radius: 28px; border: none; background: {{accent}}; color: #FFFFFF; font: 600 17px 'Instrument Sans', sans-serif; cursor: pointer">Check</button>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#A84A24","options":["#A84A24","#8C5A2B","#2F6B3A"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return { accent: this.props.accent ?? '#A84A24' };
}
}
</script>
