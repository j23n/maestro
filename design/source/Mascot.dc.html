<script type="text/x-dc" data-dc-script data-props='{"pose":{"editor":"enum","options":["hello","think","cheer","sleep"],"default":"hello"},"size":{"editor":"int","default":160,"min":32,"max":400},"scarf":{"editor":"color","default":"#A84A24","options":["#A84A24","#2F6B3A","#1F4E8C"]},"$preview":{"width":160,"height":160}}'>
class Component extends DCLogic {
renderVals() {
const pose = this.props.pose ?? 'hello';
const size = Number(this.props.size ?? 160);
const labels = { hello: 'Tito the pigeon, waving', think: 'Tito the pigeon, thinking', cheer: 'Tito the pigeon, cheering', sleep: 'Tito the pigeon, resting' };
return {
px: size + 'px',
scarf: this.props.scarf ?? '#A84A24',
isHello: pose === 'hello',
isThink: pose === 'think',
isCheer: pose === 'cheer',
isSleep: pose === 'sleep',
label: labels[pose] || labels.hello
};
}
}
