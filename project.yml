# Maestro: one multiplatform target for iPhone, iPad and Mac, the MaestroKit package, and unit
# tests. XcodeGen writes Maestro.xcodeproj from this file (make project); git ignores the project.
name: Maestro

options:
  bundleIdPrefix: com.j23n
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"

# Bundle ID and the owner's team (from the gitignored Signing.xcconfig; apple-ci README, "Signing").
configFiles:
  Debug: Config/Project.xcconfig
  Release: Config/Project.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: 0.1.0

packages:
  MaestroKit:
    path: Packages/MaestroKit

targets:
  Maestro:
    type: application
    platform: auto
    supportedDestinations: [iOS, macOS]
    sources:
      - path: App
        excludes:
          - "Resources/Content"
      # The content database and starter packs, built by `make content` (tools/). A folder
      # reference, so whatever the pipeline wrote is copied as it is.
      - path: App/Resources/Content
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_IDENTIFIER)
        PRODUCT_NAME: Maestro
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Maestro
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.education
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        # CloudKit sync pushes changes with silent notifications.
        INFOPLIST_KEY_UIBackgroundModes: remote-notification
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: Config/Maestro.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": Config/Maestro-macOS.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        # The build number script reads .git (apple-ci README, "Build numbers").
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    dependencies:
      - package: MaestroKit
        product: ItalianCore
      - package: MaestroKit
        product: LexiconKit
      - package: MaestroKit
        product: GrammarKit
      - package: MaestroKit
        product: PackKit
      - package: MaestroKit
        product: SRSKit
      - package: MaestroKit
        product: SyncLogic
    postBuildScripts:
      - name: Build number
        script: '"$SRCROOT/.apple-ci/build-number.sh"'
        inputFiles:
          - $(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)
        basedOnDependencyAnalysis: false

  MaestroTests:
    type: bundle.unit-test
    platform: auto
    supportedDestinations: [iOS, macOS]
    sources: [AppTests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_IDENTIFIER).tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Maestro.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Maestro"
        "TEST_HOST[sdk=macosx*]": "$(BUILT_PRODUCTS_DIR)/Maestro.app/Contents/MacOS/Maestro"
        BUNDLE_LOADER: $(TEST_HOST)
    dependencies:
      - target: Maestro
      - package: MaestroKit
        product: SRSKit
      - package: MaestroKit
        product: ItalianCore

  # Screenshots of the main screens for checking the UI against the mocks (`make screenshots`).
  # iOS only; `make test-app` skips it.
  MaestroUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [AppUITests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_IDENTIFIER).uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Maestro
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - target: Maestro

schemes:
  Maestro:
    build:
      targets:
        Maestro: all
    test:
      targets:
        - MaestroTests
        - MaestroUITests
