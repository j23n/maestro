  # 5 · Note: di, a and in for places, and e (and) without an accent
  - kind: note
    id: u01.l1.step-note-2
    note_id: u01.l1.note-2
    grammar: [g:simple-prepositions, g:conjunctions]
    title_en: "di, a, in, and e"
    intro: {mascot: hello, text_en: "Marco is *di Toronto*, but now he is *a Bologna*, *in Italia*."}
    body:
      - p: "Three short words tell people where you're from and where you are."
      - table:
          columns: ["di: from (a city)", "a: in, at, to (a city)", "in: in, to (a country)"]
          rows:
            - ["*Sono **di** Toronto.*", "*Marco è **a** Bologna.*", "*Toronto è **in** Canada.*"]
            - ["*Lei è **di** Bologna?*", "*Benvenuto **a** Bologna!*", "*Bologna è **in** Italia.*"]
      - p: "Say where you're from with *di* and a city: *sono di Toronto*. Not with a country: in Lesson 2 you'll use your nationality for that."
      - p: "*E* without an accent means \"and\": *Marco **e** la signora Rossi*. With an accent, *è* means \"is\" or formal \"you are\"."
      - examples: [u01.l1.story#1, u01.l1.story#16]
      - tip: "Read the narrator's line aloud: *Marco è di Toronto e la signora Rossi è di Bologna.* Each *è* is a verb and carries the stress; *e* just joins the two halves."

