  # 3 · Note: essere with io, tu, lei and Lei, and the choice between tu and Lei (built from the story)
  - kind: note
    id: u01.l1.step-note
    note_id: u01.l1.note
    grammar: [g:essere-present-sg, g:subject-pronouns, g:tu-lei]
    title_en: "sono, sei, è: and tu or Lei"
    intro: {mascot: think, text_en: "Did you notice? Signora Rossi asks *Tu come ti chiami?*, but Marco asks *E Lei come si chiama?*"}
    body:
      - p: "The verb for \"to be\" (essere in the dictionary) has three forms for one person: *sono* (I am), *sei* (you are) and *è* (he, she or it is)."
      - p: "The pronouns: *io* (I), *tu* (you, informal), *lei* (she) and *Lei* (you, formal)."
      - table:
          columns: [Who, essere, From the story]
          rows:
            - ["*io*", "**sono**", "*Io **sono** la signora Rossi.*"]
            - ["*tu*", "**sei**", "*Tu **sei** Marco di Toronto.*"]
            - ["*lei*", "**è**", "*La signora Rossi **è** di Bologna.*"]
            - ["*Lei*", "**è**", "*Lei **è** di Bologna?*"]
      - p: "*Lei* with a capital L is the polite \"you\". It takes the same form as \"she\", so *Lei è di Bologna?* can mean \"Are you from Bologna?\" or \"Is she from Bologna?\". The situation tells you which."
      - p: "Use *tu* with friends, family and children. Use *Lei* with people you don't know, in shops and offices, and with older people, until they offer *tu*. Signora Rossi is older, so she says *tu* to Marco; Marco answers with *Lei*: *E Lei, come sta?*"
      - examples: [u01.l1.story#7, u01.l1.story#8, u01.l1.story#12]
      - tip: "You can usually leave out *io* and *tu*: *Sono di Toronto* is enough, because *sono* already says \"I\". Keep *Lei* in polite questions: *E Lei?*"

