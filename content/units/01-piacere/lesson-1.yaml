  # 8 · Sounds: questions rise, statements fall (s:intonation); e and è (s:accents-e-si).
  #     The answers mix question and statement, so always picking one doesn't pass.
  - kind: sounds
    id: u01.l1.step-sounds
    exercises:
      - id: u01.l1.ex33
        format: sound-pair
        targets: [{item: s:intonation, skill: listen}]
        tags: [sy:ss.intonation]
        question: which-word
        pair: ["Sei di Bologna?", "Sei di Bologna."]
        play: "Sei di Bologna?"
        glosses: {"Sei di Bologna?": "Are you from Bologna?", "Sei di Bologna.": "You're from Bologna."}
        tip_en: "A yes/no question goes up at the end. A statement goes down."
      - id: u01.l1.ex34
        format: sound-pair
        targets: [{item: s:intonation, skill: listen}]
        tags: [sy:ss.intonation]
        question: which-word
        pair: ["Lei è la signora Rossi?", "Lei è la signora Rossi."]
        play: "Lei è la signora Rossi."
        glosses: {"Lei è la signora Rossi?": "Are you Signora Rossi?", "Lei è la signora Rossi.": "You're Signora Rossi."}
        tip_en: "Same words, different tune: listen to the last word."
      - id: u01.l1.ex35
        format: sound-pair
        targets: [{item: s:accents-e-si, skill: listen}]
        tags: [sy:ss.accented-pairs]
        question: which-word
        pair: [e, è]
        play: è
        glosses: {e: and, è: is}
        tip_en: "È (is) is a word on its own, stressed and a little more open. E (and) is short and runs into the next word."

