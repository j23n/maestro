        - {speaker: ch:marco, to: ch:rossi, register: lei, it: "Grazie, signora.", en: "Thank you, Signora."}
        - {speaker: ch:rossi, to: ch:marco, register: tu, it: "E come stai, Marco?", en: "And how are you, Marco?"}
        - {speaker: ch:marco, to: ch:rossi, register: lei, it: "Bene, grazie. E Lei, come sta?", en: "Fine, thanks. And how are you?"}
        - {speaker: ch:rossi, to: ch:marco, register: tu, it: "Bene, bene, grazie.", en: "Fine, fine, thank you."}
        - {speaker: ch:marco, to: ch:rossi, register: lei, it: "Lei è di Bologna, signora?", en: "Are you from Bologna, Signora?"}
        - {speaker: ch:rossi, to: ch:marco, register: tu, it: "Sì, io sono di Bologna.", en: "Yes, I'm from Bologna."}
