  # 7 · Use: meet Sara at the coworking space and ask her a question back (tu)
  - kind: use
    id: u01.l2.step-use
    exercise:
      id: u01.l2.ex30
      format: conversation
      with: ch:sara
      register: tu
      title: {en: "Tell Sara about yourself"}
      tags: [cd:introduce-yourself, cd:say-where-from]
      goals:
        - {id: name, en: "Say your name"}
        - {id: from, en: "Say where you're from"}
        - {id: born, en: "Ask Sara where she was born"}
      start: n1
      nodes:
        n1:
          say: "Ciao! Io sono Sara. Tu come ti chiami?"
          en: "Hi! I'm Sara. What's your name?"
          expect:
            - intent: name
              goal: name
              accept: ["(ciao )mi chiamo {NAME}", "(ciao )(io )sono {NAME}", "(ciao )(io )mi chiamo {NAME}( piacere)", "{NAME}"]
              next: n2
          help: ["Ciao! Mi chiamo…"]
          hint_en: "Say your name."
        n2:
          say: "Piacere! Di dove sei?"
          en: "Nice to meet you! Where are you from?"
          expect:
            - intent: origin
              goal: from
              accept: ["(io )sono {ME.nationality}", "(io )sono di {NAME}", "(io )sono {ME.nationality} di {NAME}", "(io )sono {ME.nationality} e abito {ME.home}", "piacere (io )sono {ME.nationality}", "piacere (io )sono di {NAME}", "(piacere )(io )sono {ME.nationality} e sono di {NAME}"]
              next: n3
          near: [{answer: "(piacere )(io )sono di {Canada|Italia|America|Stati Uniti|Inghilterra|Francia|Spagna|Australia|Irlanda}", hint: "For a country, use your nationality: sono + nationality."}]
          help: ["Sono…", "Sono di…"]
          hint_en: "Say your nationality, or your city with di."
        n3:
          say: "Ah, bene! Io sono di Bologna."
          en: "Oh, great! I'm from Bologna."
          expect:
            - {intent: ask-born, goal: born, accept: ["e tu dove sei nata", "(e )dove sei nata", "(e tu )sei nata a Bologna", "tu dove sei nata", "dove sei nata Sara", "e tu Sara dove sei nata"], next: end}
          near:
            - {answer: "(e )(tu )dove sei nato", hint: "Sara is a woman: check the ending."}
            - {answer: "(e )(Lei )dov'è nata", hint: "You and Sara say tu to each other."}
          help: ["E tu, dove sei nata?"]
          hint_en: "Ask Sara where she was born."
        end:
          say: "Sono nata a Bologna! Ci vediamo!"
          en: "I was born in Bologna! See you!"
          final: true
