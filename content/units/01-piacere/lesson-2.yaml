# Unit 1, Lesson 2. DRAFT (C3): the Italian must be reviewed by the content lead before it is approved.
# Marco's first morning at the coworking space: the receptionist (a minor role) uses Lei, Sara uses tu.
# Note: nationalities (-o/-a and -e) and non. Story line references (#n) are 1-based.
id: u01.l2
title: {it: "Di dove sei?", en: "Where are you from?"}
scene: Marco's first morning at the coworking space. The receptionist (a minor role, unnamed) uses Lei; Sara uses tu. Everyone guesses he's American or English.
review: {status: draft, by: null, date: null, hash: null}

steps:
