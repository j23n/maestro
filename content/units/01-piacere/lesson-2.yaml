  # 2 · Read and listen, then check meaning in English
  - kind: story
    id: u01.l2.step-story
    text:
      id: u01.l2.story
      kind: story
      title: {it: "Di dove sei?", en: "Where are you from?"}
      lines:
        - {speaker: ch:extra, to: ch:marco, register: lei, it: "Buongiorno! Lei è nuovo qui, vero?", en: "Good morning! You're new here, aren't you?"}
        - {speaker: ch:marco, to: ch:extra, register: lei, it: "Sì, buongiorno. Mi chiamo Marco.", en: "Yes, good morning. My name is Marco."}
        - {speaker: ch:extra, to: ch:marco, register: lei, it: "Benvenuto, Marco! Lei è americano?", en: "Welcome, Marco! Are you American?"}
        - {speaker: ch:marco, to: ch:extra, register: lei, it: "No, non sono americano. Sono canadese.", en: "No, I'm not American. I'm Canadian."}
        - {speaker: ch:extra, to: ch:marco, register: lei, it: "Ah, canadese! Di dov'è?", en: "Oh, Canadian! Where are you from?"}
        - {speaker: ch:marco, to: ch:extra, register: lei, it: "Sono di Toronto.", en: "I'm from Toronto."}
        - {speaker: ch:extra, to: ch:marco, register: lei, it: "Bene. Buona giornata, Marco!", en: "Good. Have a good day, Marco!"}
        - {speaker: ch:sara, to: ch:marco, register: tu, it: "Ciao! Sei nuovo? Io sono Sara.", en: "Hi! Are you new? I'm Sara."}
        - {speaker: ch:marco, to: ch:sara, register: tu, it: "Ciao, Sara! Sì, sono nuovo. Mi chiamo Marco. Piacere!", en: "Hi, Sara! Yes, I'm new. My name is Marco. Nice to meet you!"}
        - {speaker: ch:sara, to: ch:marco, register: tu, it: "Piacere! Di dove sei? Sei inglese?", en: "Nice to meet you! Where are you from? Are you English?"}
        - {speaker: ch:marco, to: ch:sara, register: tu, it: "No, non sono inglese. Sono canadese.", en: "No, I'm not English. I'm Canadian."}
        - {speaker: ch:sara, to: ch:marco, register: tu, it: "Ah, canadese! Dove abiti in Canada?", en: "Oh, Canadian! Where do you live in Canada?"}
        - {speaker: ch:marco, to: ch:sara, register: tu, it: "Sono nato e abito a Toronto. Sono arrivato a Bologna ieri.", en: "I was born in Toronto and I live there. I arrived in Bologna yesterday.", recognise: [ieri], gloss: {ieri: yesterday}}
        - {speaker: ch:sara, to: ch:marco, register: tu, it: "Benvenuto a Bologna!", en: "Welcome to Bologna!"}
        - {speaker: ch:marco, to: ch:sara, register: tu, it: "Grazie! E tu, Sara? Sei italiana?", en: "Thanks! And you, Sara? Are you Italian?"}
        - {speaker: ch:sara, to: ch:marco, register: tu, it: "Sì, sono italiana. Sono di Bologna.", en: "Yes, I'm Italian. I'm from Bologna."}
        - {speaker: ch:marco, to: ch:sara, register: tu, it: "E dove sei nata?", en: "And where were you born?"}
        - {speaker: ch:sara, to: ch:marco, register: tu, it: "Sono nata e abito a Bologna. Sono bolognese!", en: "I was born in Bologna and I live here. I'm from Bologna, born and bred!", gloss: {bolognese: from Bologna}}
        - {speaker: narrator, it: "Sara è italiana: lei è di Bologna. Marco non è italiano: lui è canadese.", en: "Sara is Italian: she's from Bologna. Marco isn't Italian: he's Canadian."}
        - {speaker: ch:sara, to: ch:marco, register: tu, it: "Ciao, Marco! Ci vediamo!", en: "Bye, Marco! See you!"}
        - {speaker: ch:marco, to: ch:sara, register: tu, it: "Sì, ci vediamo! Ciao!", en: "Yes, see you! Bye!"}
