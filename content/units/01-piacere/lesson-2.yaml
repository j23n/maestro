  # 3 · Note: nationalities (-o/-a and -e) and non (built from the story)
  - kind: note
    id: u01.l2.step-note
    note_id: u01.l2.note
    grammar: [g:adjectives-o-a-e, g:negation-non]
    title_en: "italiano, italiana: and non"
    intro: {mascot: think, text_en: "Did you spot it? Sara is *italiana*, and Marco says *non sono americano*: he's *canadese*."}
    body:
      - p: "Nationalities are adjectives. Many end in *-o* for a man and *-a* for a woman; others end in *-e* and are the same for both."
      - table:
          columns: [A man, A woman]
          rows:
            - ["*italiano*", "*italiana*"]
            - ["*americano*", "*americana*"]
            - ["*canadese*", "*canadese*"]
            - ["*inglese*", "*inglese*"]
      - p: "The ending fits the person: *Sara è italiana*, *Marco è canadese*. With *Lei*, it fits the person you're talking to: *Lei è americano?* to a man, *Lei è americana?* to a woman."
      - p: "To say \"not\", put *non* before the verb: *Non sono inglese.* *Marco non è italiano.* With *mi chiamo*, *non* goes before the whole chunk: *Non mi chiamo Marco.*"
      - examples: [u01.l2.story#4, u01.l2.story#19, u01.l2.story#16]
      - tip: "*No* answers a question; *non* goes before a verb. You often need both: *No, non sono americano.* Nationalities are lowercase in Italian."

