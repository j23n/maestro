  - kind: preview
    id: u01.l2.step-preview
    batches:
      - [w:lui, w:non, w:nuovo, w:qui, w:citta, w:italiano]
      - [w:americano, w:canadese, w:inglese, c:di-dove-sei, c:di-dov-e, c:dove-sei-nato]
