  # 6 · Listening (the spec's phone call, CL28): later that morning Scuola Arcobaleno phones Marco about his course. The
  #     caller is a minor role (unnamed, gender not fixed) and uses Lei; Marco answers with Pronto? (c:pronto, CL34),
  #     spells Lenzi (CL14) and gives his number with the numbers 0–20 (347 812 2015, said in small groups, CL20).
  - kind: listening
    id: u01.l3.step-listening
    text:
      id: u01.l3.call
      kind: phone
      lines:
        - {speaker: ch:marco, to: ch:extra, register: lei, it: "Pronto?", en: "Hello?"}
        - {speaker: ch:extra, to: ch:marco, register: lei, it: "Buongiorno! Sono della Scuola Arcobaleno. Lei è Marco?", en: "Good morning! I'm calling from Scuola Arcobaleno. Is that Marco?", recognise: [della], gloss: {della: from (the)}}
        - {speaker: ch:marco, to: ch:extra, register: lei, it: "Sì, sono io. Buongiorno!", en: "Yes, speaking. Good morning!"}
        - {speaker: ch:extra, to: ch:marco, register: lei, it: "Allora, nome e cognome, per favore.", en: "Right: your first name and last name, please."}
        - {speaker: ch:marco, to: ch:extra, register: lei, it: "Marco Lenzi.", en: "Marco Lenzi."}
        - {speaker: ch:extra, to: ch:marco, register: lei, it: "Lenzi? Scusi, come si scrive?", en: "Lenzi? Sorry, how do you spell that?"}
        - {speaker: ch:marco, to: ch:extra, register: lei, it: "Elle, e, enne, zeta, i.", en: "L, E, N, Z, I.", lemmas: {e: w:e~letter, i: w:i~letter}}
        - {speaker: ch:extra, to: ch:marco, register: lei, it: "Elle, e, enne, zeta, i. Grazie! Il numero di telefono, per favore?", en: "L, E, N, Z, I. Thank you! Your phone number, please?", lemmas: {e: w:e~letter, i: w:i~letter}}
        - {speaker: ch:marco, to: ch:extra, register: lei, it: "Tre quattro sette, otto dodici, venti quindici.", en: "347 812 2015."}
        - {speaker: ch:extra, to: ch:marco, register: lei, it: "Tre quattro sette, otto dodici, venti quindici. Bene, grazie! Arrivederci!", en: "347 812 2015. Good, thank you! Goodbye!"}
        - {speaker: ch:marco, to: ch:extra, register: lei, it: "Grazie! Arrivederci!", en: "Thank you! Goodbye!"}
    plays: unlimited
    exercises:
