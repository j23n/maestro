# Unit 1, Lesson 3. DRAFT (C3): the Italian must be reviewed by the content lead before it is approved.
# Sara calls from Marco's door; at the entrance they meet Signora Rossi and her cat Mimì. Marco introduces Sara
# (Le presento), Signora Rossi introduces Mimì (ti presento). Rossi says tu to both; they answer with Lei.
# Then a second preview and a real form from the language school (the unit task's writing form).
# Story line references (#n) are 1-based.
id: u01.l3
title: {it: "Ti presento Sara", en: "This is Sara"}
scene: Sara phones Marco from the door of his building, then they meet Signora Rossi and her cat Mimì at the entrance. Rossi says tu to both; Marco and Sara answer with Lei.
review: {status: draft, by: null, date: null, hash: null}

steps:
  # 1 · Preview: introductions, the phone and the small words ma, o, anche (allora is met glossed in the story)
  - kind: preview
    id: u01.l3.step-preview
    batches:
      - [c:ti-presento, c:le-presento, c:questo-e, w:anche, w:ma, w:o]
      - [w:pronto, c:puoi-ripetere, c:a-presto]

  # 2 · Read and listen, then check meaning in English
  - kind: story
    id: u01.l3.step-story
    text:
      id: u01.l3.story
      kind: story
      title: {it: "Ti presento Sara", en: "This is Sara"}
      lines:
        - {speaker: ch:marco, to: ch:sara, register: tu, it: "Pronto?", en: "Hello?"}
        - {speaker: ch:sara, to: ch:marco, register: tu, it: "Ciao, Marco! Sono Sara. Sono arrivata!", en: "Hi, Marco! It's Sara. I'm here!"}
        - {speaker: ch:marco, to: ch:sara, register: tu, it: "Scusa, Sara, non capisco. Puoi ripetere?", en: "Sorry, Sara, I don't understand. Can you say that again?"}
        - {speaker: ch:sara, to: ch:marco, register: tu, it: "Sì, sono arrivata! Sono qui!", en: "Yes, I'm here! I'm right here!"}
        - {speaker: ch:marco, to: ch:sara, register: tu, it: "Sì, sì! Ciao!", en: "Yes, yes! Bye!"}
        - {speaker: ch:rossi, to: ch:marco, register: tu, it: "Ciao, Marco! Come va?", en: "Hi, Marco! How's it going?"}
        - {speaker: ch:marco, to: ch:rossi, register: lei, it: "Bene, grazie. E Lei, signora?", en: "Fine, thanks. And you, Signora?"}
        - {speaker: ch:rossi, to: ch:marco, register: tu, it: "Bene, bene. E lei come si chiama?", en: "Fine, fine. And what's her name?"}
        - {speaker: ch:marco, to: ch:rossi, register: lei, it: "Signora, Le presento Sara. Sara è di Bologna.", en: "Signora, this is Sara. Sara is from Bologna."}
        - {speaker: ch:sara, to: ch:rossi, register: lei, it: "Buongiorno, signora! Piacere.", en: "Good morning, Signora! Nice to meet you."}
        - {speaker: ch:rossi, to: ch:sara, register: tu, it: "Piacere, Sara! Tu sei di Bologna? Anche io sono di Bologna!", en: "Nice to meet you, Sara! You're from Bologna? I'm from Bologna too!"}
        - {speaker: ch:rossi, to: ch:sara, register: tu, it: "Sara, ti presento Mimì! Mimì, questa è Sara.", en: "Sara, meet Mimì! Mimì, this is Sara."}
        - {speaker: ch:sara, it: "Ciao, Mimì!", en: "Hi, Mimì!"}
        - {speaker: ch:marco, to: ch:rossi, register: lei, it: "E Mimì? È italiana o canadese?", en: "And Mimì? Is she Italian or Canadian?"}
        - {speaker: ch:rossi, to: ch:marco, register: tu, it: "Mimì è bolognese! E tu sei canadese, vero?", en: "Mimì is from Bologna! And you're Canadian, right?"}
        - {speaker: ch:marco, to: ch:rossi, register: lei, it: "Sì, sono canadese, ma sono anche un po' italiano!", en: "Yes, I'm Canadian, but I'm a bit Italian too!", recognise: ["un po'"], gloss: {"un po'": a bit}}
        - {speaker: ch:rossi, to: ch:marco, register: tu, it: "Ah, bene, bene!", en: "Oh, good, good!"}
        - {speaker: ch:sara, to: ch:rossi, register: lei, it: "Arrivederci, signora! Buona giornata!", en: "Goodbye, Signora! Have a good day!"}
        - {speaker: ch:rossi, to: ch:sara, register: tu, it: "Ciao, Sara! Allora, a presto!", en: "Bye, Sara! Well then, see you soon!", gloss: {Allora: well then}}
        - {speaker: ch:marco, to: ch:rossi, register: lei, it: "A presto, signora!", en: "See you soon, Signora!"}
    questions:
      - id: u01.l3.q1
        format: choice
        tags: [sy:cefr.oral-comprehension]
        question_en: "Why does Sara phone Marco?"
        options: ["To tell him she's at his building", "To ask him his name", "To say goodbye"]
        answer: 0
      - id: u01.l3.q2
        format: choice
        tags: [cd:introduce-others]
        question_en: "What do Sara and Signora Rossi have in common?"
        options: ["They're both from Bologna", "They're both new in Bologna", "They're both Canadian"]
        answer: 0
      - id: u01.l3.q3
        format: choice
        tags: [cd:say-where-from]
        question_en: "What does Marco say about himself?"
        options: ["He's Canadian, but a bit Italian too", "He's Italian, from Bologna", "He's American"]
        answer: 0

  # 3 · Note: introducing people with tu and Lei, and ma / o (built from the story)
  - kind: note
    id: u01.l3.step-note
    note_id: u01.l3.note
    grammar: [g:tu-lei, g:conjunctions]
    title_en: "ti presento, Le presento: and ma, o"
    intro: {mascot: hello, text_en: "Marco says *Signora, Le presento Sara*, and Signora Rossi says *Sara, ti presento Mimì!*"}
    body:
      - p: "To introduce someone, say *ti presento…* to a person you call *tu* and *Le presento…* to a person you call *Lei*. Like *Lei*, the formal one starts with a capital L."
      - p: "*Questo è…* (for a man) and *questa è…* (for a woman) work with everyone: *Mimì, questa è Sara.*"
      - table:
          columns: [With tu, With Lei]
          rows:
            - ["*ti presento Sara*", "*Le presento Sara*"]
            - ["*come ti chiami?*", "*come si chiama?*"]
            - ["*come stai?*", "*come sta?*"]
            - ["*di dove sei?*", "*di dov'è?*"]
            - ["*puoi ripetere?*", "*può ripetere?*"]
      - p: "Two more small words: *ma* means \"but\" and *o* means \"or\". Like *e*, they never change."
      - examples: [u01.l3.story#9, u01.l3.story#12, u01.l3.story#14, u01.l3.story#16]
      - tip: "Signora Rossi says *tu* to Sara, and Sara answers with *Lei*, just like Marco. You'll do the same with her."

