# Unit 0 check (docs/06 §18; C3 draft). 12 items (unit.yaml: check.items), every Unit 0 can-do, all four skills.
# Check mode: one attempt, no hints, listening plays twice. No new situations or facts: a shop, a neighbor and the
# taxi from the lessons. Prices here are not the taxi fare (u00.l2.ride: diciotto euro), so they don't need to match it.
id: u00.check
review: {status: draft, by: null, date: null, hash: null}
pass: {overall: 0.70, section_min: 0.50}

sections:
  - id: listening
    title_en: Listening
    exercises:
      - id: u00.check.01
        format: choice
        targets: [{item: c:buona-giornata, skill: listen}]
        tags: [cd:greet-farewell, sy:fn.good-wishes, sy:ex.cils-listening]
        audio_text:
          id: u00.check.01.audio
          kind: dialogue
          lines:
            - {speaker: ch:extra, to: ch:you, register: lei, it: "Grazie! Buona giornata!", en: "Thank you! Have a good day!"}
        plays: 2
        question_en: "You leave a shop. What does the shop assistant say?"
        options: ["Thanks! Have a good day!", "Good evening! Welcome!", "Sorry! Can you say that again?"]
        answer: 0
      - id: u00.check.02
        format: choice
        targets: [{item: w:quindici, skill: listen}]
        tags: [cd:count-to-20, sy:cefr.oral-comprehension]
        audio_text:
          id: u00.check.02.audio
          kind: dialogue
          lines:
            - {speaker: ch:extra, to: ch:you, register: lei, it: "Quindici euro, per favore.", en: "Fifteen euros, please."}
        plays: 2
        question_en: "How much is it?"
        options: ["€15", "€50", "€5"]
        answer: 0
      - id: u00.check.03
        format: dictation
        targets: [{item: w:tredici, skill: listen}, {item: w:quattordici, skill: listen}, {item: s:c-g-front, skill: listen}]
        tags: [cd:count-to-20, sy:cefr.orthographic-control, sy:ss.sounds-spellings, sy:ss.double-consonants]
        say: "Tredici, quattordici, venti."
        plays: 2
      - id: u00.check.04
        format: sound-pair
        targets: [{item: s:alphabet, skill: listen}]
        tags: [cd:spell-name, sy:ss.alphabet]
        question: which-word
        pair: [emme, enne]
        play: emme
        glosses: {emme: "the letter M", enne: "the letter N"}

  - id: reading
    title_en: Reading
    exercises:
      - id: u00.check.05
        format: choice
        targets: [{item: c:puo-ripetere, skill: read}]
        tags: [cd:dont-understand, sy:cefr.reading]
        prompt_it: "Scusi, non capisco. Può ripetere?"
        question_en: "What does the speaker want?"
        options: ["To hear it again", "To pay", "To say goodbye"]
        answer: 0
      - id: u00.check.06
        format: choice
        targets: [{item: w:prego, skill: read}]
        tags: [cd:politeness, sy:ss.politeness]
        question_en: "Someone says Grazie! to you. What do you answer?"
        options: ["Prego!", "Scusi!", "Buonasera!"]
        answer: 0
      - id: u00.check.07
        format: match
        targets:
          - {item: w:dodici, skill: read}
          - {item: w:due, skill: read}
          - {item: w:venti, skill: read}
          - {item: w:sette, skill: read}
          - {item: w:diciassette, skill: read}
        tags: [cd:count-to-20, sy:gr.cardinal-numbers]
        pairs: [["dodici", "12"], ["due", "2"], ["venti", "20"], ["sette", "7"], ["diciassette", "17"]]

  - id: writing
    title_en: Writing
    exercises:
      - id: u00.check.08
        format: cloze
        targets: [{item: c:per-favore, skill: recall}]
        tags: [cd:politeness, sy:ex.cils-structures]
        text: "Buonasera! Taxi, [[per favore]]."
        prompt_en: "Good evening! A taxi, please."
      - id: u00.check.09
        format: recall
        targets: [{item: w:buonasera, skill: recall}]
        tags: [cd:greet-farewell, sy:ss.greetings-register]
        prompt_en: "Good evening! (you walk into a shop at seven in the evening)"
        answer: "buonasera"
        near: [{answer: "buona sera", outcome: correctWithNote, hint: "Right! It's usually written as one word: buonasera."}]
      - id: u00.check.10
        format: recall
        targets: [{item: c:non-capisco, skill: recall}]
        tags: [cd:dont-understand, sy:fn.dont-understand]
        prompt_en: "Sorry, I don't understand. (to someone you don't know)"
        answer: "{scusi|mi scusi} non capisco( può ripetere)( per favore)"
        near: [{answer: "scusa non capisco( può ripetere)( per favore)", hint: "You don't know this person. Scusa is for friends."}]

  - id: speaking
    title_en: Speaking
    exercises:
      - id: u00.check.11
        format: conversation
        score: 2
        with: ch:extra
        register: lei
        title: {en: "Meet a neighbor late in the evening"}
        tags: [cd:greet-farewell, cd:dont-understand, sy:ex.cils-dialogue]
        goals:
          - {id: greet, en: "Say good evening"}
          - {id: clarify, en: "Say sorry, you don't understand (your neighbor talks fast)"}
          - {id: answer, en: "Say how you are"}
          - {id: bye, en: "Say good night"}
        start: n1
        nodes:
          n1:
            say: "Buonasera!"
            en: "Good evening!"
            expect:
              - {intent: greet, goal: greet, accept: ["buonasera"], next: n2}
            help: []
          n2:
            say: "Come va? Bene?"
            en: "How's it going? All good?"
            expect:
              - intent: clarify
                goal: clarify
                accept:
                  - "{scusi|mi scusi} non capisco( può ripetere)( per favore)"
                  - "{scusi|mi scusi} può ripetere( per favore)"
                next: n3
              - {intent: answer-now, goal: answer, accept: ["(ah )bene( grazie)", "(ah )bene grazie e Lei"], next: n4}
            help: []
          n3:
            say: "Come va?"
            en: "How's it going?"
            expect:
              - {intent: answer, goal: answer, accept: ["(ah )bene( grazie)", "(ah )bene grazie e Lei"], next: n4}
            help: []
          n4:
            say: "Bene! Buonanotte!"
            en: "Good! Good night!"
            expect:
              - {intent: bye, goal: bye, accept: ["(grazie )buonanotte( grazie)", "(grazie )arrivederci( buonanotte)"], next: end}
            help: []
          end: {say: "Buonanotte!", en: "Good night!", final: true}
      - id: u00.check.12
        format: talk
        score: 2
        tags: [cd:greet-farewell, cd:spell-name, sy:ss.greetings-register, sy:ss.alphabet, sy:ex.cils-monologue]
        prompt_en: "You arrive at a desk in the evening. Say hello, say your first name and spell it."
        lemmas: {a: w:a~letter, e: w:e~letter, i: w:i~letter, o: w:o~letter, ci: w:ci~letter, di: w:di~letter, ti: w:ti~letter, vi: w:vu}
        points:
          - {id: greet, en: "Say good evening", accept: ["buonasera"]}
          - {id: spell, en: "Spell your first name, letter by letter", accept: ["{bi|ci|di|effe|gi|acca|i lunga|cappa|elle|emme|enne|pi|cu|erre|esse|ti|vu|vi|ics|ipsilon|i greca|zeta} {a|e|i|o|u|ipsilon|i greca}", "{a|e|i|o|u} {a|e|i|o|u}"]}
          - {id: spell-more, en: "Keep spelling after a vowel", accept: ["{a|e|i|o|u|ipsilon|i greca|doppia|due} {bi|ci|di|effe|gi|acca|i lunga|cappa|elle|emme|enne|pi|cu|erre|esse|ti|vu|vi|ics|ipsilon|i greca|zeta}", "{a|e|i|o|u} {a|e|i|o|u}"]}
        pass: 2
        model: "Buonasera! Marco: emme, a, erre, ci, o."
        duration_s: {min: 3, max: 45}
