        format: choice
        targets: [{item: w:buonanotte, skill: read}]
        tags: [cd:greet-farewell]
        question_en: "It's eleven at night and you're leaving. What do you say?"
        options: ["Buonanotte!", "Buongiorno!", "Buona giornata!"]
        answer: 0
        hint: "Think about the time of day."
      - id: u00.l2.ex14
        format: recall
        targets: [{item: w:sette, skill: recall}]
        tags: [cd:count-to-20, cd:politeness]
        prompt_en: "€7, please."
        answer: "sette euro( per favore)"
        near: [{answer: "sei euro( per favore)", hint: "Sei is six. Seven has a double t."}]
        audio_after: true
      - id: u00.l2.ex15
        format: recall
        targets: [{item: c:non-capisco, skill: recall}, {item: c:scusa, skill: recall}]
        tags: [cd:dont-understand, cd:politeness]
        prompt_en: "Sorry, I don't understand. (to a friend)"
        answer: "scusa non capisco"
        near: [{answer: "scusi non capisco", hint: "Scusi is for people you don't know. This is a friend."}]
        audio_after: true
      - id: u00.l2.ex45
        format: recall
        targets: [{item: w:quattro, skill: recall}]
        tags: [cd:count-to-20]
        prompt_en: "€4"
        answer: "{quattro euro|quattro}"
        near: [{answer: "{cinque|tre}( euro)", hint: "Count again: one, two, three, four."}]
        audio_after: true

