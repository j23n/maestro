          - {item: c:come-si-dice, skill: read}
          - {item: c:scusi, skill: read}
        tags: [cd:dont-understand, sy:cefr.reading]
        pairs: [["non capisco", "I don't understand"], ["può ripetere?", "can you say that again?"], ["come si dice…?", "how do you say…?"], ["scusi", "excuse me"]]

  # 5 · Read and listen: the taxi ride, then check meaning in English
  - kind: story
    id: u00.l2.step-story
    text:
      id: u00.l2.ride
      kind: story
      title: {it: "Buonanotte!", en: "Good night!"}
      lines:
        - {speaker: ch:extra, to: ch:marco, register: lei, it: "Tutto bene? Come va?", en: "Everything OK? How's it going?", recognise: [Tutto], gloss: {Tutto: everything}}
        - {speaker: ch:marco, to: ch:extra, register: lei, it: "Scusi, non capisco. Può ripetere, per favore?", en: "Sorry, I don't understand. Can you say that again, please?"}
        - {speaker: ch:extra, to: ch:marco, register: lei, it: "Come va?", en: "How's it going?"}
        - {speaker: ch:marco, to: ch:extra, register: lei, it: "Ah! Bene, grazie!", en: "Oh! Fine, thanks!"}
        - {speaker: ch:extra, to: ch:marco, register: lei, it: "Bene, bene!", en: "Good, good!"}
        - {speaker: ch:extra, to: ch:marco, register: lei, it: "Ok! Diciotto euro, per favore.", en: "Here we are! Eighteen euros, please."}
        - {speaker: ch:marco, to: ch:extra, register: lei, it: "Diciassette euro?", en: "Seventeen euros?"}
        - {speaker: ch:extra, to: ch:marco, register: lei, it: "No, no: diciotto. Uno, otto.", en: "No, no: eighteen. One, eight."}
        - {speaker: ch:marco, to: ch:extra, register: lei, it: "Ah, diciotto! Ok. Venti euro.", en: "Oh, eighteen! OK. Here's twenty."}
        - {speaker: ch:extra, to: ch:marco, register: lei, it: "Grazie! Due euro, prego.", en: "Thank you! Two euros change, here you are."}
        - {speaker: ch:extra, to: ch:marco, register: lei, it: "Uno, due, tre... ok!", en: "One, two, three... OK!"}
        - {speaker: ch:marco, to: ch:extra, register: lei, it: 'Grazie! Scusi, come si dice "good night"?', en: 'Thanks! Excuse me, how do you say "good night"?', foreign: [good night]}
        - {speaker: ch:extra, to: ch:marco, register: lei, it: 'Buonanotte. Si dice "buonanotte".', en: 'Buonanotte. You say "buonanotte".'}
        - {speaker: ch:marco, to: ch:extra, register: lei, it: "Ah, buonanotte! Grazie, buonanotte!", en: "Ah, good night! Thank you, good night!"}
        - {speaker: ch:extra, to: ch:marco, register: lei, it: "Prego! Buonanotte!", en: "You're welcome! Good night!"}
    questions:
      - id: u00.l2.q1
        format: choice
        tags: [cd:dont-understand]
        question_en: "What does Marco ask the driver to repeat?"
        options: ["How's it going?", "The price", "Good night"]
        answer: 0
      - id: u00.l2.q2
        format: choice
        tags: [cd:count-to-20]
        question_en: "How much is the taxi?"
        options: ["€18", "€17", "€20"]
        answer: 0
      - id: u00.l2.q3
        format: choice
        tags: [cd:dont-understand]
        question_en: "What new word does Marco learn at the end?"
        options: ["Good night", "Thank you", "Eighteen"]
        answer: 0

