  # 8 · Use: your own taxi ride ends; you don't catch the price, check it and say good night (Lei).
  - kind: use
    id: u00.l2.step-use
    exercise:
      id: u00.l2.ex44
      format: conversation
      with: ch:extra
      register: lei
      title: {en: "Pay the taxi driver"}
      tags: [cd:dont-understand, cd:count-to-20, cd:greet-farewell]
      goals:
        - {id: clarify, en: "Say you don't understand"}
        - {id: price, en: "Say the price back to check it"}
        - {id: bye, en: "Say good night"}
      start: n1
      nodes:
        n1:
          say: "Diciotto euro, per favore."
          en: "Eighteen euros, please."
          expect:
            - intent: clarify
              goal: clarify
              accept:
                - "(scusi )non capisco( può ripetere)( per favore)"
                - "(scusi )può ripetere( per favore)"
              next: n2
          near: [{answer: "scusa( non capisco)( può ripetere)( per favore)", hint: "You don't know the driver. Scusa or scusi?"}]
          help: ["Scusi, non capisco. Può ripetere?"]
          hint_en: "You didn't catch the price. Say you don't understand."
        n2:
          say: "Diciotto. Diciotto euro."
          en: "Eighteen. Eighteen euros."
          expect:
            - {intent: check-price, goal: price, accept: ["diciotto euro", "(ah )(ok )diciotto( euro)( ok)( grazie)", "sì diciotto( euro)"], next: n3}
          near: [{answer: "(ah )diciassette( euro)", hint: "Listen again: dici-otto."}]
          help: ["Ah, diciotto euro! Ok."]
          hint_en: "Say the price back to check it."
        n3:
          say: "Sì! Grazie, buonanotte!"
          en: "Yes! Thank you, good night!"
          expect:
            - intent: bye
              goal: bye
              accept:
                - "(grazie )buonanotte( grazie)"
                - "(grazie )arrivederci( buonanotte)"
                - "grazie e buonanotte"
                - "buonanotte arrivederci"
                - "arrivederci grazie"
              next: end
          near:
            - {answer: "(grazie )ciao", hint: "You don't know the driver. Ciao is for friends."}
            - {answer: "(grazie )buongiorno", hint: "It's late at night."}
          help: ["Grazie, buonanotte!"]
          hint_en: "Say good night."
        end:
          say: "Buonanotte!"
          en: "Good night!"
          final: true
