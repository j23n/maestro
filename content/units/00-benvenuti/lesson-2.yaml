# Unit 0, Lesson 2 (C3 draft). The taxi ride into town late at night, the fare, "come si dice…?", and the next
# morning at the door of Marco's new flat. Pre-A1: chunks only, no grammar note. Numbers 0–20 come in two previews
# (0–10, practice, then 11–20) before the story, which needs 17, 18 and 20. Story line references (#n) are 1-based.
# Bare "sei" resolves to essere (disambiguation.yaml), so exercises only say it as "sei euro".
# The taxi driver is the same ch:extra as in Lesson 1 (u00.l1.taxi-stand); see the note there about the voice.
# The fare (diciotto euro, late evening, airport to the flat) is a real-world fact to check: it is listed
# in the story bible's facts_to_check.
# The next morning brings the alphabet (cd:spell-name): the 26 letter names in a preview, the alphabet read aloud, names
# spelled to recognise and to spell, and a neighbor of yours, Federica, who spells her name at your door. Letter names
# that are also words (a, e, i, o, di, ci, ti) are letters only where a line's or an exercise's `lemmas:` says so.
id: u00.l2
title: {it: "Scusi, non capisco!", en: "Sorry, I don't understand!"}
scene: The taxi ride late at night, the fare and a new word; the next morning a neighbor greets Marco at the door of his flat, and a neighbor of yours, Federica, spells her name at your door; everyone uses Lei
review: {status: draft, by: null, date: null, hash: null}

steps:
  # 1 · Preview: the classroom chunks and good night, then 0–10
  - kind: preview
    id: u00.l2.step-preview
    batches:
      - [c:non-capisco, c:puo-ripetere, c:come-si-dice, w:buonanotte]
      - [w:zero, w:uno, w:due, w:tre, w:quattro, w:cinque]
      - [w:sei, w:sette, w:otto, w:nove, w:dieci]

  # 2 · Practice 0–10 and the new chunks before the teens (a block, then a short mix with Lesson 1)
  - kind: practice
    id: u00.l2.step-practice
    block:
      - id: u00.l2.ex01
        format: match
        targets:                      # targets[i] belongs to pairs[i]
          - {item: w:zero, skill: read}
          - {item: w:uno, skill: read}
          - {item: w:due, skill: read}
          - {item: w:tre, skill: read}
          - {item: w:quattro, skill: read}
          - {item: w:cinque, skill: read}
        tags: [cd:count-to-20, sy:gr.cardinal-numbers]
        pairs: [["zero", "0"], ["uno", "1"], ["due", "2"], ["tre", "3"], ["quattro", "4"], ["cinque", "5"]]
      - id: u00.l2.ex02
        format: match
        targets:
          - {item: w:sei, skill: read}
          - {item: w:sette, skill: read}
          - {item: w:otto, skill: read}
          - {item: w:nove, skill: read}
          - {item: w:dieci, skill: read}
        tags: [cd:count-to-20, sy:gr.cardinal-numbers]
        pairs: [["sei euro", "€6"], ["sette euro", "€7"], ["otto euro", "€8"], ["nove euro", "€9"], ["dieci euro", "€10"]]
      - id: u00.l2.ex03
        format: dictation
        targets: [{item: w:quattro, skill: listen}, {item: w:cinque, skill: listen}]
        tags: [cd:count-to-20, sy:cefr.orthographic-control]
        say: "Uno, due, tre, quattro, cinque."
        slow: true
      - id: u00.l2.ex04
        format: dictation
        targets: [{item: w:sette, skill: listen}, {item: w:otto, skill: listen}]
        tags: [cd:count-to-20, sy:ss.double-consonants]
        say: "Sei euro, sette euro, otto euro."
        slow: true
        hint: "Two of the numbers have a double consonant."
      - id: u00.l2.ex05
        format: recall
        targets: [{item: w:zero, skill: recall}]
        tags: [cd:count-to-20]
        prompt_en: "0"
        answer: "zero"
        audio_after: true
      - id: u00.l2.ex06
        format: recall
        targets: [{item: w:nove, skill: recall}]
        tags: [cd:count-to-20]
        prompt_en: "9"
        answer: "nove"
        audio_after: true
      - id: u00.l2.ex07
        format: recall
        targets: [{item: w:dieci, skill: recall}]
        tags: [cd:count-to-20]
        prompt_en: "10"
        answer: "dieci"
        near: [{answer: "dici", outcome: almost, hint: "Close! A vowel is missing."}]
        audio_after: true
      - id: u00.l2.ex08
        format: recall
        targets: [{item: c:non-capisco, skill: recall}]
        tags: [cd:dont-understand, sy:fn.dont-understand]
        prompt_en: "I don't understand."
        answer: "{non capisco|scusi non capisco|scusa non capisco|mi scusi non capisco}"
        near: [{answer: "capisco", hint: "That means I understand. Add the word for not in front."}]
        audio_after: true
      - id: u00.l2.ex09
        format: recall
        targets: [{item: c:puo-ripetere, skill: recall}]
        tags: [cd:dont-understand, sy:cefr.clarification]
        prompt_en: "Can you say that again? (to the taxi driver)"
        answer: "{può ripetere|può ripetere per favore|scusi può ripetere|scusi può ripetere per favore|mi scusi può ripetere|può ripetere scusi}"
        audio_after: true
      - id: u00.l2.ex10
        format: recall
        targets: [{item: c:come-si-dice, skill: recall}]
        tags: [cd:dont-understand, sy:cefr.clarification]
        prompt_en: "How do you say…? (to ask for an Italian word)"
        answer: "{come si dice|scusi come si dice|come si dice in italiano|scusi come si dice in italiano}"
        audio_after: true
      - id: u00.l2.ex11
        format: recall
        targets: [{item: w:buonanotte, skill: recall}]
        tags: [cd:greet-farewell]
        prompt_en: "Good night!"
        answer: "buonanotte"
        near: [{answer: "buona notte", outcome: correctWithNote, hint: "Right! It's usually written as one word: buonanotte."}]
        audio_after: true
      - id: u00.l2.ex12
        format: repeat
        targets: [{item: c:puo-ripetere, skill: speak}]
        tags: [sy:cefr.phonological-control, cd:dont-understand]
        say: "Scusi, non capisco. Può ripetere?"
    mix:
      - id: u00.l2.ex13
        format: choice
        targets: [{item: w:buonanotte, skill: read}]
        tags: [cd:greet-farewell]
        question_en: "It's eleven at night and you're leaving. What do you say?"
        options: ["Buonanotte!", "Buongiorno!", "Buona giornata!"]
        answer: 0
        hint: "Think about the time of day."
      - id: u00.l2.ex14
        format: recall
        targets: [{item: w:sette, skill: recall}]
        tags: [cd:count-to-20, cd:politeness]
        prompt_en: "€7, please."
        answer: "sette euro( per favore)"
        near: [{answer: "sei euro( per favore)", hint: "Sei is six. Seven has a double t."}]
        audio_after: true
      - id: u00.l2.ex15
        format: recall
        targets: [{item: c:non-capisco, skill: recall}, {item: c:scusa, skill: recall}]
        tags: [cd:dont-understand, cd:politeness]
        prompt_en: "Sorry, I don't understand. (to a friend)"
        answer: "scusa non capisco"
        near: [{answer: "scusi non capisco", hint: "Scusi is for people you don't know. This is a friend."}]
        audio_after: true
      - id: u00.l2.ex45
        format: recall
        targets: [{item: w:quattro, skill: recall}]
        tags: [cd:count-to-20]
        prompt_en: "€4"
        answer: "{quattro euro|quattro}"
        near: [{answer: "{cinque|tre}( euro)", hint: "Count again: one, two, three, four."}]
        audio_after: true

