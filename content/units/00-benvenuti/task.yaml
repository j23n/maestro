# Unit 0 task (docs/06 §12, §13; C3 draft). The unit spec asks for one conversation (a neighbor on the stairs) and a
# talk (say hello, say your name and spell it); Unit 0 has no writing or relay task. Everything said to you avoids
# gendered forms (no benvenuto/benvenuta), because the learner's gender varies.
# Letter names (emme, erre…) are not items yet, so no gated string can spell: the talk's model shows the greeting and
# the name, the prompt shows how to spell, and the spelling point accepts the vowel letters and the letter names
# Morph-it! knows (open question for the content lead, see PROGRESS.md).
id: u00.task
review: {status: draft, by: null, date: null, hash: null}

conversations:
  - id: u00.task.conv1
    format: conversation
    with: ch:extra
    register: lei
    title: {en: "Say hello to a neighbor on the stairs"}
    tags: [cd:greet-farewell, cd:dont-understand, cd:politeness]
    goals:
      - {id: greet, en: "Say good morning"}
      - {id: clarify, en: "Say you don't understand"}
      - {id: answer, en: "Say how you are"}
      - {id: bye, en: "Say goodbye"}
    start: n1
    nodes:
      n1:
        say: "Buongiorno!"
        en: "Good morning!"
        expect:
          - {intent: greet, goal: greet, accept: ["buongiorno"], next: n2}
        near:
          - {answer: "buonasera", hint: "It's nine in the morning. Which greeting fits?"}
          - {answer: "ciao", hint: "You don't know your neighbor yet. Ciao is for friends."}
        help: ["Buongiorno!"]
        hint_en: "It's nine in the morning. Greet your neighbor."
      n2:
        say: "Come va? Bene?"
        en: "How's it going? All good?"
        expect:
          - intent: clarify
            goal: clarify
            accept:
              - "(scusi )non capisco( può ripetere)( per favore)"
              - "(scusi )può ripetere( per favore)"
            next: n3
          - {intent: answer-now, goal: answer, accept: ["bene( grazie)", "bene grazie e Lei"], next: n4}
        near: [{answer: "scusa( non capisco)( può ripetere)( per favore)", hint: "You don't know your neighbor. Scusa or scusi?"}]
        help: ["Scusi, non capisco. Può ripetere?"]
        hint_en: "Your neighbor talks very fast. Say you don't understand."
      n3:
        say: "Come va?"
        en: "How's it going?"
        expect:
          - {intent: answer, goal: answer, accept: ["(ah )bene( grazie)", "(ah )bene grazie e Lei"], next: n4}
        help: ["Bene, grazie!"]
        hint_en: "Say you're fine, thanks."
      n4:
        say: "Bene! Buona giornata!"
        en: "Good! Have a good day!"
        expect:
          - intent: bye
            goal: bye
            accept:
              - "(grazie )buona giornata( arrivederci)"
              - "(grazie )arrivederci( buona giornata)"
              - "grazie( anche a Lei)( arrivederci)"
            next: end
        near:
          - {answer: "(grazie )ciao", hint: "You don't know your neighbor well. Which goodbye is polite?"}
          - {answer: "(grazie )buonanotte", hint: "It's the morning. What do you wish someone for the day?"}
        help: ["Grazie, buona giornata!"]
        hint_en: "Say thanks and goodbye."
      end:
        say: "Arrivederci!"
        en: "Goodbye!"
        final: true

talk:
  id: u00.task.talk
  format: talk
  tags: [cd:spell-name, cd:greet-farewell, sy:ss.alphabet]
  prompt_en: "Someone at a desk needs your name. Say hello, say your first name, then spell it letter by letter, the Italian way (for example, Marco: emme, a, erre, ci, o)."
  points:
    - {id: greet, en: "Say hello", accept: ["{buongiorno|buonasera|ciao}"]}
    - {id: name, en: "Say your first name", accept: ["{NAME}"]}
    - {id: spell, en: "Spell it letter by letter", accept: ["{a|e|i|o}", "{erre|esse|doppia}"]}
  pass: 2
  model: "Buongiorno! Marco."
  duration_s: {min: 5, max: 60}
