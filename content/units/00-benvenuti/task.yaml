# Unit 0 task (docs/06 §12, §13; C3 draft). The unit spec asks for one conversation (a neighbor on the stairs) and a
# talk (say hello, say your name and spell it); Unit 0 has no writing or relay task. Everything said to you avoids
# gendered forms (no benvenuto/benvenuta), because the learner's gender varies.
# The talk has three points, pass 2 (CL24): the greeting and two spelling points, so it can't be passed without
# spelling (a name point would match any answer). The matcher finds each point anywhere in the answer on its own, so
# the spelling points are pairs of letter names that only a spelled word has: `spell` is a letter's name followed by a
# vowel's (emme, a; i, a), `spell-more` a vowel's name followed by another letter's (a, erre; i, a), or doppia (or due)
# and a consonant's (doppia esse). Every spelled name finds at least one; spelling a whole name finds both (Marco,
# Rossi; Ian, Mia, Leo and Zoe through their two vowels). Ipsilon (or i greca) counts as a vowel and as a consonant
# (Bryn, Lynn), and vi is accepted for V (CL23). The talk's `lemmas:` read the spelled vowels, ci, di, ti and vi as
# letters (u00.l3 teaches the alphabet).
id: u00.task
review: {status: draft, by: null, date: null, hash: null}

conversations:
  - id: u00.task.conv1
    format: conversation
    with: ch:extra
    register: lei
    title: {en: "Say hello to a neighbor on the stairs"}
    tags: [cd:greet-farewell, cd:dont-understand, cd:politeness]
    goals:
      - {id: greet, en: "Say good morning"}
      - {id: clarify, en: "Say sorry, you don't understand"}
      - {id: answer, en: "Say how you are"}
      - {id: bye, en: "Say goodbye"}
    start: n1
    nodes:
      n1:
        say: "Buongiorno!"
        en: "Good morning!"
        expect:
          - {intent: greet, goal: greet, accept: ["buongiorno( come va)"], next: n2}
        near:
          - {answer: "buonasera", hint: "It's nine in the morning. Which greeting fits?"}
          - {answer: "ciao", hint: "You don't know your neighbor yet. Ciao is for friends."}
        help: ["Buongiorno!"]
        hint_en: "It's nine in the morning. Greet your neighbor."
      n2:
        say: "Come va? Bene?"
        en: "How's it going? All good?"
        expect:
          - intent: clarify
            goal: clarify
            accept:
              - "{scusi|mi scusi} non capisco( può ripetere)( per favore)"
              - "{scusi|mi scusi} può ripetere( per favore)"
            next: n3
          - {intent: answer-now, goal: answer, accept: ["bene( grazie)", "bene grazie e Lei"], next: n4}
        near: [{answer: "scusa( non capisco)( può ripetere)( per favore)", hint: "You don't know your neighbor. Scusa or scusi?"}]
        help: ["Scusi, non capisco. Può ripetere?"]
        hint_en: "Your neighbor talks very fast. Say sorry, you don't understand."
      n3:
        say: "Come va?"
        en: "How's it going?"
        expect:
          - {intent: answer, goal: answer, accept: ["(ah )bene( grazie)", "(ah )bene grazie e Lei"], next: n4}
        near: [{answer: "(ah )bene grazie e tu", hint: "You don't know your neighbor, and e tu is for friends. Leave it out."}]
        help: ["Bene, grazie!"]
        hint_en: "Say you're fine, thanks."
      n4:
        say: "Bene! Buona giornata!"
        en: "Good! Have a good day!"
        expect:
          - intent: bye
            goal: bye
            accept:
              - "(grazie )buona giornata( arrivederci)"
              - "grazie e buona giornata( arrivederci)"
              - "(grazie )buona giornata anche a Lei"
              - "(grazie )arrivederci( buona giornata)"
              - "grazie( anche a Lei)( arrivederci)"
            next: end
        near:
          - {answer: "(grazie )ciao", hint: "You don't know your neighbor well. Which goodbye is polite?"}
          - {answer: "(grazie )buonanotte", hint: "It's the morning. What do you wish someone for the day?"}
        help: ["Grazie, buona giornata!"]
        hint_en: "Say thanks and goodbye."
      end:
        say: "Arrivederci!"
        en: "Goodbye!"
        final: true

talk:
  id: u00.task.talk
  format: talk
  tags: [cd:greet-farewell, cd:spell-name, sy:ss.greetings-register, sy:ss.alphabet]
  prompt_en: "Someone at a desk needs your name. Say hello, say your first name and spell it."
  lemmas: {a: w:a~letter, e: w:e~letter, i: w:i~letter, o: w:o~letter, ci: w:ci~letter, di: w:di~letter, ti: w:ti~letter, vi: w:vu}
  points:
    - {id: greet, en: "Say hello", accept: ["{buongiorno|buonasera}"]}
    - {id: spell, en: "Spell your first name, letter by letter", accept: ["{bi|ci|di|effe|gi|acca|i lunga|cappa|elle|emme|enne|pi|cu|erre|esse|ti|vu|vi|ics|ipsilon|i greca|zeta} {a|e|i|o|u|ipsilon|i greca}", "{a|e|i|o|u} {a|e|i|o|u}"]}
    - {id: spell-more, en: "Keep spelling after a vowel", accept: ["{a|e|i|o|u|ipsilon|i greca|doppia|due} {bi|ci|di|effe|gi|acca|i lunga|cappa|elle|emme|enne|pi|cu|erre|esse|ti|vu|vi|ics|ipsilon|i greca|zeta}", "{a|e|i|o|u} {a|e|i|o|u}"]}
  pass: 2
  model: "Buongiorno! Marco: emme, a, erre, ci, o."
  duration_s: {min: 5, max: 60}
