        answer: 0

  # 4 · Note: plurals, from the story's own lines; piacere; paying at the till (CL6's culture note)
  - kind: note
    id: u02.l3.step-note
    note_id: u02.l3.note
    grammar: [g:noun-plural]
    title_en: One cornetto, two cornetti
    intro: {mascot: think, text_en: "Giulia offers Marco *un cornetto*, but Sara asks for *due cornetti*."}
    body:
      - p: For more than one, change the last vowel of the noun. Masculine nouns in *-o* usually end in *-i*, and feminine nouns in *-a* in *-e*.
      - table:
          columns: [One, Two]
          rows:
            - ["un cornetto", "due **cornetti**"]
            - ["un cappuccino", "due **cappuccini**"]
            - ["una spremuta", "due **spremute**"]
            - ["un nome", "due **nomi**"]
            - ["un caffè", "due **caffè**"]
      - p: "Nouns in *-e* also end in *-i*. Nouns that end in an accented vowel, like *caffè*, stay the same, and so do *bar* and *euro*: *due bar*, *cinque euro*."
      - examples: [u02.l3.story#7, u02.l3.story#9, u02.l3.story#10]
      - tip: "Watch *amico*: *un amico*, *due amici*, but *un'amica*, *due amiche*. The h keeps the hard sound of the c."
      - p: "*Mi piace* means \"I like\". To ask a friend, say *Ti piace?*; to ask someone you call Lei, *Le piace?*. Keep the article, although English drops it: *mi piace il caffè* (I like coffee)."
      - p: "At a neighborhood bar like Bar Aurora, you order at the counter and pay *alla cassa*, at the till, when you've finished. You get *lo scontrino*, the receipt. In busy bars in the center, you often pay at the till first and show the receipt at the counter."

