  # 9 · Use: order for you and Sara at the counter. Two cappuccini 3,20 + two cornetti 2,80 = sei euro (Bar Aurora menu,
  #      task.yaml), paid at the till afterwards (step 10, CL6).
  - kind: use
    id: u02.l3.step-use
    exercise:
      id: u02.l3.ex32
      format: conversation
      with: ch:giulia
      register: lei
      title: {en: "Order for you and Sara"}
      tags: [cd:order-food-drink, sy:gr.noun-gender-number]
      goals:
        - {id: drinks, en: "Order two cappuccinos"}
        - {id: ask, en: "Ask if they have croissants"}
        - {id: food, en: "Order two croissants"}
      start: n1
      nodes:
        n1:
          say: "Buongiorno! Cosa prende?"
          en: "Good morning! What will you have?"
          expect:
            - intent: order-drinks
              goal: drinks
              accept:
                - "(buongiorno )({vorrei|prendo} )due cappuccini( per favore)"
                - "(buongiorno )({vorrei|prendo} )due cappuccini grazie"
              next: n2
          near:
            - {answer: "(buongiorno )({vorrei|prendo} )due cappuccino( {per favore|grazie})", outcome: almost, hint: "Two cappuccinos: change the last vowel for more than one."}
            - {answer: "(buongiorno )({vorrei|prendo} )due cappuccini e due cornetti( {per favore|grazie})", hint: "Just the drinks first: Giulia will ask about food."}
          help: ["Due cappuccini, per favore."]
          hint_en: "Order two cappuccinos, for you and Sara."
        n2:
          say: "Certo. E da mangiare?"
          en: "Of course. Anything to eat?"
          expect:
            - intent: ask-have
              goal: ask
              accept: ["(scusi )avete cornetti", "(scusi )avete ancora cornetti", "(scusi )avete( ancora) {i|dei} cornetti", "(scusi )avete( ancora) un cornetto"]
              next: n3
          near: [{answer: "(scusi )avete cornetto", outcome: almost, hint: "More than one croissant: change the last vowel."}]
          help: ["Scusi, avete cornetti?"]
          hint_en: "Ask if they have croissants."
        n3:
          say: "Sì! Uno o due?"
          en: "Yes! One or two?"
          expect:
            - intent: order-food
              goal: food
              accept: ["due( cornetti)( {per favore|grazie})", "({vorrei|prendo} )due cornetti( {per favore|grazie})", "sì( grazie) due( cornetti)( {per favore|grazie})"]
              next: end
          near: [{answer: "(due )cornetto( per favore)", outcome: almost, hint: "Two croissants: change the last vowel for more than one."}]
          help: ["Due, per favore."]
          hint_en: "Ask for two."
        end:
          say: "Ecco: due cappuccini e due cornetti. Buona colazione!"
          en: "Here you are: two cappuccinos and two croissants. Enjoy your breakfast!"
          final: true

  # 10 · Use: pay at the till afterwards (CL6): sei euro for the order above, a ten-euro note, quattro euro back with
  #      Ecco il resto (CL35). The goodbye is the register turn (CL37: a Lei goodbye is required).
  - kind: use
    id: u02.l3.step-use-2
    exercise:
      id: u02.l3.ex44
      format: conversation
      with: ch:giulia
      register: lei
      title: {en: "Pay at the till"}
      tags: [cd:ask-price-pay, cd:choose-tu-lei]
      goals:
        - {id: price, en: "Ask how much it is"}
        - {id: pay, en: "Pay with a ten-euro note"}
        - {id: bye, en: "Thank Giulia and say goodbye"}
      start: n1
      nodes:
        n1:
          say: "Prego!"
          en: "Yes?"
          expect:
            - {intent: ask-price, goal: price, accept: ["(scusi ){quant'è|quanto è|quanto costa}( per favore)", "(buongiorno )(scusi ){quant'è|quanto è}"], next: n2}
          help: ["Scusi, quant'è?"]
          hint_en: "Ask how much it is."
        n2:
          say: "Sei euro, grazie."
          en: "Six euros, thanks."
          expect:
            - {intent: pay, goal: pay, accept: ["ecco dieci euro", "(ecco )dieci euro( grazie)", "(sì )ecco dieci euro"], next: n3}
          near: [{answer: "(ecco )sei euro", hint: "Pay with a ten-euro note. How do you say ten?"}]
          help: ["Ecco dieci euro."]
          hint_en: "Pay with a ten-euro note."
        n3:
          say: "Grazie! Ecco il resto: quattro euro. E lo scontrino!"
          en: "Thank you! Here's your change: four euros. And the receipt!"
          expect:
            - {intent: bye, goal: bye, accept: ["(grazie )(e ){arrivederci|buona giornata}", "{arrivederci|buona giornata} e grazie", "grazie arrivederci e buona giornata"], next: end}
          near: [{answer: "(grazie )ciao", hint: "Giulia says Lei to you. Which goodbye goes with Lei?"}]
          help: ["Grazie, arrivederci!"]
          hint_en: "Thank Giulia and say goodbye."
        end:
          say: "Arrivederci! Buona giornata!"
          en: "Goodbye! Have a good day!"
          final: true
