        answer: false

  # 3 · Read and listen. Sara: spremuta 3,20 + cornetto 1,40; Marco: cappuccino 1,60 + cornetto 1,40
  #     = sette euro e sessanta. At the till he gives eight euros and gets quaranta centesimi back (CL35).
  - kind: story
    id: u02.l3.step-story
    text:
      id: u02.l3.story
      kind: story
      title: {it: "Due cornetti", en: "Two croissants"}
      lines:
        - {speaker: narrator, it: "Ecco Marco e Sara al bar Aurora.", en: "Here are Marco and Sara at Bar Aurora."}
        - {speaker: ch:giulia, to: ch:sara, register: tu, it: "Ciao, Sara! Un caffè?", en: "Hi, Sara! A coffee?"}
        - {speaker: ch:sara, to: ch:giulia, register: tu, it: "No, grazie. Oggi una spremuta d'arancia!", en: "No, thanks. Today, a fresh orange juice!"}
        - {speaker: ch:giulia, to: ch:marco, register: lei, it: "E Lei, cosa prende?", en: "And you, what will you have?"}
        - {speaker: ch:marco, to: ch:giulia, register: lei, it: "Prendo un cappuccino, per favore.", en: "I'll have a cappuccino, please."}
        - {speaker: ch:giulia, to: ch:marco, register: lei, it: "E da mangiare?", en: "Anything to eat?"}
        - {speaker: ch:marco, to: ch:giulia, register: lei, it: "Scusi, avete ancora cornetti?", en: "Excuse me, do you still have croissants?", gloss: {ancora: still}}
        - {speaker: ch:giulia, to: ch:marco, register: lei, it: "Certo! Un cornetto?", en: "Of course! One croissant?"}
        - {speaker: ch:sara, to: ch:giulia, register: tu, it: "Due cornetti, Giulia, per favore!", en: "Two croissants, Giulia, please!"}
        - {speaker: ch:giulia, it: "Ecco: una spremuta, un cappuccino e due cornetti.", en: "Here you are: a fresh orange juice, a cappuccino and two croissants."}
        - {speaker: ch:giulia, to: ch:marco, register: lei, it: "Le piace il cornetto?", en: "Do you like the croissant?"}
        - {speaker: ch:marco, to: ch:giulia, register: lei, it: "Sì, mi piace! È buono.", en: "Yes, I like it! It's good."}
        - {speaker: ch:sara, to: ch:marco, register: tu, it: "E ti piace il caffè italiano?", en: "And do you like Italian coffee?"}
        - {speaker: ch:marco, to: ch:sara, register: tu, it: "Sì, mi piace! E il cappuccino è buono.", en: "Yes, I like it! And the cappuccino's good."}
        - {speaker: ch:giulia, to: ch:marco, register: lei, it: "E un latte, oggi?", en: "And a latte today?"}
        - {speaker: ch:marco, to: ch:giulia, register: lei, it: "No, grazie! Un latte è solo latte!", en: 'No, thanks! "Un latte" is just milk!'}
        - {speaker: ch:sara, to: ch:marco, register: tu, it: "E Bologna? Ti piace?", en: "And Bologna? Do you like it?"}
        - {speaker: ch:marco, to: ch:sara, register: tu, it: "Sì! Mi piace Bologna, e mi piace il bar Aurora.", en: "Yes! I like Bologna, and I like Bar Aurora."}
        - {speaker: narrator, it: "Marco è alla cassa.", en: "Marco is at the till.", gloss: {alla cassa: at the till}}
        - {speaker: ch:marco, to: ch:giulia, register: lei, it: "Scusi, quant'è?", en: "Excuse me, how much is it?"}
        - {speaker: ch:giulia, to: ch:marco, register: lei, it: "Sette euro e sessanta.", en: "€7.60."}
        - {speaker: ch:marco, to: ch:giulia, register: lei, it: "Ecco otto euro.", en: "Here's eight euros."}
        - {speaker: ch:giulia, to: ch:marco, register: lei, it: "Grazie! Ecco il resto: quaranta centesimi. E lo scontrino!", en: "Thank you! Here's your change: forty cents. And the receipt!", gloss: {centesimi: cents}}
        - {speaker: ch:sara, to: ch:marco, register: tu, it: "Grazie, Marco! Buono, il cornetto!", en: "Thanks, Marco! The croissant's good!"}
        - {speaker: ch:marco, to: ch:sara, register: tu, it: "Prego!", en: "You're welcome!"}
    questions:
      - id: u02.l3.q1
        format: choice
        tags: [cd:order-food-drink]
        question_en: "What does Sara have?"
        options: [A fresh orange juice and a croissant, A coffee and a croissant, A cappuccino and a croissant]
