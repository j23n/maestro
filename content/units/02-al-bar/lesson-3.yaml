    id: u02.l3.step-preview
    batches:
      - [c:mi-piace, c:ti-piace, c:le-piace, c:prendo]
      - [c:avete, w:certo, w:arancia]
      - [w:solo, w:resto, w:scontrino]

  # 2 · Listening: Sara phones Marco (audio first; the transcript opens after the questions).
  #     *Pronto* stays glossed here until Unit 1's c:pronto is merged (CL34).
  - kind: listening
    id: u02.l3.step-listening
    text:
      id: u02.l3.phone
      kind: phone
      lines:
        - {speaker: ch:marco, to: ch:sara, register: tu, it: "Pronto?", en: "Hello?", gloss: {pronto: "hello? (on the phone)"}}
        - {speaker: ch:sara, to: ch:marco, register: tu, it: "Ciao, Marco! Sono Sara. Come va?", en: "Hi, Marco! It's Sara. How's it going?"}
        - {speaker: ch:marco, to: ch:sara, register: tu, it: "Bene, grazie! E tu?", en: "Fine, thanks! And you?"}
        - {speaker: ch:sara, to: ch:marco, register: tu, it: "Bene! Un caffè al bar Aurora, oggi?", en: "Fine! Coffee at Bar Aurora today?"}
        - {speaker: ch:marco, to: ch:sara, register: tu, it: "Sì, certo! Mi piace il bar Aurora. Il caffè è buono!", en: "Yes, of course! I like Bar Aurora. The coffee's good!"}
        - {speaker: ch:sara, to: ch:marco, register: tu, it: "Ok! Ci vediamo al bar!", en: "OK! See you at the café!"}
        - {speaker: ch:marco, to: ch:sara, register: tu, it: "Ci vediamo! Ciao!", en: "See you! Bye!"}
    plays: unlimited
    exercises:
