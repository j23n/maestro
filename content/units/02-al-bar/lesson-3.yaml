# Unit 2, Lesson 3. DRAFT (C5) for the content lead: plural nouns, ordering for two, mi/ti/Le piace, paying at the till.
# Prices follow the Bar Aurora menu in task.yaml (caffè 1,20 · cappuccino 1,60 · spremuta 3,20 · cornetto 1,40). You
# order at the counter and pay Giulia alla cassa afterwards, getting the change (Ecco il resto) and the receipt (CL6,
# CL35). Shape as in the golden sample (lesson-1.yaml), plus a phone call (listening), the receipt (real-world reading,
# CL13e: the bar's name, the lines, Totale, Contanti, Resto) and a second use at the till.
# Story line references (#n) are 1-based.
id: u02.l3
title: {it: "Mi piace!", en: "I like it!"}
scene: Sara phones Marco and they meet at Bar Aurora; they order two croissants, talk about what Marco likes, and he pays at the till
review: {status: draft, by: null, date: null, hash: null}

steps:
  # 1 · Preview: the chunks for liking and ordering, then the words of the scene (the receipt's own words come in a
  #     second preview just before the receipt)
