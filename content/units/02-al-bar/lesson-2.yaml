# Unit 2, Lesson 2. DRAFT (C5) for the content lead: numbers to 100 and prices.
# Prices follow the Bar Aurora menu in task.yaml (caffè 1,20 · cappuccino 1,60 · spremuta 3,20 · cornetto 1,40), plus
# the day's breakfast offer on the chalkboard (CL36): cappuccino e cornetto 2,50. You order at the counter and pay
# Giulia afterwards (CL6). Shape as in the golden sample (lesson-1.yaml), plus a real-world reading (the chalkboard),
# a listening dialogue and a repeat-after-me block (CL21). Story line references (#n) are 1-based.
id: u02.l2
title: {it: "Quanto costa?", en: "How much is it?"}
scene: Marco nearly orders a glass of milk at Bar Aurora, asks Giulia the prices, takes the day's breakfast offer and buys Sara a coffee
review: {status: draft, by: null, date: null, hash: null}

steps:
  # 1 · Preview: the chunks and breakfast first, then the tens (numbers are a closed set: two short batches).
  #     Thirteen items, one over the guide: the eight tens are one system (see the Unit 2 report).
  - kind: preview
    id: u02.l2.step-preview
    batches:
      - [c:senta, c:al-bar, w:latte, c:quanto-costa, w:colazione]
      - [w:trenta, w:quaranta, w:cinquanta, w:sessanta]
      - [w:settanta, w:ottanta, w:novanta, w:cento]

  # 2 · Read and listen. Marco: the breakfast offer (cappuccino e cornetto) 2,50 + Sara's caffè 1,20 = tre euro e
  #     settanta, paid at the end (CL6). *Guardi* is Giulia's Lei form (CL35); *solo* is taught in Lesson 3.
  - kind: story
    id: u02.l2.step-story
    text:
      id: u02.l2.story
      kind: story
      title: {it: "Un latte?", en: "A latte?"}
      lines:
        - {speaker: narrator, it: "Oggi Marco è al bar Aurora.", en: "Today Marco is at Bar Aurora."}
        - {speaker: ch:marco, to: ch:giulia, register: lei, it: "Senta, scusi! Buongiorno!", en: "Excuse me! Good morning!"}
        - {speaker: ch:giulia, to: ch:marco, register: lei, it: "Buongiorno! Cosa prende oggi?", en: "Good morning! What will you have today?"}
        - {speaker: ch:marco, to: ch:giulia, register: lei, it: "Vorrei un latte, per favore.", en: "I'd like a latte, please."}
        - {speaker: ch:giulia, to: ch:marco, register: lei, it: "Un latte? Guardi, in Italia un latte è solo latte!", en: 'A latte? Look, in Italy "un latte" is just milk!', recognise: [Guardi, solo], gloss: {Guardi: "look (formal)", solo: just}}
        - {speaker: ch:marco, to: ch:giulia, register: lei, it: "Oh! No, no. Vorrei un cappuccino, per favore.", en: "Oh! No, no. I'd like a cappuccino, please."}
        - {speaker: ch:giulia, to: ch:marco, register: lei, it: "Un cappuccino! E da mangiare?", en: "A cappuccino! Anything to eat?"}
        - {speaker: ch:marco, to: ch:giulia, register: lei, it: "Quanto costa un cornetto?", en: "How much is a croissant?"}
        - {speaker: ch:giulia, to: ch:marco, register: lei, it: "Un euro e quaranta.", en: "€1.40."}
        - {speaker: ch:marco, to: ch:giulia, register: lei, it: "E il cappuccino?", en: "And the cappuccino?"}
        - {speaker: ch:giulia, to: ch:marco, register: lei, it: "Un euro e sessanta. Ma oggi la colazione è due euro e cinquanta!", en: "€1.60. But today, breakfast is €2.50!"}
        - {speaker: ch:marco, to: ch:giulia, register: lei, it: "La colazione?", en: "Breakfast?"}
        - {speaker: ch:giulia, to: ch:marco, register: lei, it: "Sì: cappuccino e cornetto!", en: "Yes: a cappuccino and a croissant!"}
        - {speaker: ch:marco, to: ch:giulia, register: lei, it: "Allora la colazione, per favore!", en: "Breakfast, then, please!"}
        - {speaker: narrator, it: "Ecco Sara.", en: "Here comes Sara."}
        - {speaker: ch:sara, to: ch:marco, register: tu, it: "Ciao, Marco! Come va?", en: "Hi, Marco! How's it going?"}
        - {speaker: ch:marco, to: ch:sara, register: tu, it: "Bene! Sara, un caffè?", en: "Fine! Sara, a coffee?"}
        - {speaker: ch:sara, to: ch:marco, register: tu, it: "Sì, grazie!", en: "Yes, thanks!"}
        - {speaker: ch:marco, to: ch:giulia, register: lei, it: "E un caffè, per favore.", en: "And a coffee, please."}
        - {speaker: ch:giulia, it: "Ecco: un cappuccino, un cornetto e un caffè.", en: "Here you are: a cappuccino, a croissant and a coffee."}
        - {speaker: ch:sara, it: "Mmm! Buono, il caffè!", en: "Mmm! The coffee's good!"}
        - {speaker: ch:marco, to: ch:sara, register: tu, it: "Sì! E anche il cornetto è buono.", en: "Yes! And the croissant's good too."}
        - {speaker: ch:marco, to: ch:giulia, register: lei, it: "Scusi, quant'è?", en: "Excuse me, how much is it?"}
        - {speaker: ch:giulia, to: ch:marco, register: lei, it: "Tre euro e settanta.", en: "€3.70."}
        - {speaker: ch:marco, to: ch:giulia, register: lei, it: "Ecco. Grazie, arrivederci!", en: "Here you go. Thanks, goodbye!"}
        - {speaker: ch:giulia, to: ch:marco, register: lei, it: "Grazie! Buona giornata!", en: "Thank you! Have a good day!"}
    questions:
      - id: u02.l2.q1
        format: choice
        tags: [cd:order-food-drink]
        question_en: "What does Marco drink in the end?"
        options: [A cappuccino, A glass of milk, A coffee]
        answer: 0
      - id: u02.l2.q2
        format: choice
        tags: [cd:ask-price-pay]
        question_en: "How much is a croissant on its own at Bar Aurora?"
        options: ["€1.40", "€1.60", "€2.50"]
        answer: 0
      - id: u02.l2.q3
        format: choice
        tags: [cd:ask-price-pay]
        question_en: "What does Marco's order come to?"
        options: ["€3.70", "€2.50", "€4.20"]      # €2.50 is the offer alone; €4.20 is the three things without the offer
        answer: 0

  # 3 · Note: the tens and how prices are said, from the story's own lines
  - kind: note
    id: u02.l2.step-note
    note_id: u02.l2.note
    grammar: [g:numbers-to-100]
    title_en: Numbers to 100 and prices
    intro: {mascot: think, text_en: "Giulia says *un euro e quaranta*. That's €1.40: the euros, then *e*, then the cents."}
    body:
      - p: From 40 to 90, the tens end in *-anta*; 30 is *trenta*. Many of them sound like the numbers you know, so *sette* gives *settanta* and *otto* gives *ottanta*.
      - table:
          columns: [Number, Italian]
          rows:
            - ["20", "**venti**"]
            - ["30", "**trenta**"]
            - ["40", "**quaranta**"]
            - ["50", "**cinquanta**"]
            - ["60", "**sessanta**"]
            - ["70", "**settanta**"]
            - ["80", "**ottanta**"]
            - ["90", "**novanta**"]
            - ["100", "**cento**"]
      - p: A price is the euros, then *e*, then the cents, and people usually don't say the word for cents. *Un euro e sessanta* is €1.60, and *tre euro e settanta* is €3.70.
      - examples: [u02.l2.story#9, u02.l2.story#11, u02.l2.story#24]
      - tip: "*Sessanta* (60) and *settanta* (70) sound alike: 60 has a double s, 70 a double t."

  # 4 · Real-world reading: the chalkboard at the counter with the day's breakfast offer (CL36). Not the task's menu:
  #     the story's prices (cornetto 1,40 + cappuccino 1,60 = 3,00) against the offer (2,50).
  - kind: reading
    id: u02.l2.step-reading
    text:
      id: u02.l2.chalkboard
      kind: real_world
      title: {en: "The chalkboard at Bar Aurora"}
      layout:
        type: sign
        style: info
        lines:
          - "Buongiorno!"
          - "Oggi"
          - "Colazione: cappuccino e cornetto"
          - "2,50 €"
    exercises:
      - id: u02.l2.ex01
        format: choice
        targets: [{item: w:colazione, skill: read}]
        tags: [cd:order-food-drink, sy:cefr.reading]
        question_en: "What do you get with today's breakfast offer?"
        options: [A cappuccino and a croissant, A coffee and a croissant, A cappuccino and a fresh orange juice]
        answer: 0
      - id: u02.l2.ex02
        format: choice
        tags: [cd:pass-on-prices, sy:cefr.mediation]
        question_en: "A friend who doesn't read Italian asks: \"How much is the breakfast deal on the board?\" What do you tell them?"
        options: ["€2.50", "€3.00", "€1.60"]
        answer: 0
      - id: u02.l2.ex03
        format: choice
        tags: [cd:ask-price-pay, sy:cefr.reading]
        question_en: "A cappuccino is €1.60 and a croissant €1.40. How much do you save with today's offer?"
        options: ["€0.50", "€2.50", "€1.10"]
        answer: 0

  # 5 · Practice: a block on the new material (story lines first), then a mix with Units 0–2.
  #     Each new P item gets at least 4 retrievals in this lesson, counting the preview (docs/04 § Check 3).
  - kind: practice
    id: u02.l2.step-practice
    block:
      - id: u02.l2.ex04
        format: cloze
        targets: [{item: g:numbers-to-100, skill: recall}, {item: w:quaranta, skill: recall}]
        tags: [cd:ask-price-pay]
        source: u02.l2.story#9
        text: "Un euro e [[quaranta]]."
        prompt_en: "€1.40."
        hint: "It starts like quattro."
        rule: "Tens from 40 to 90 end in -anta: quaranta, cinquanta, sessanta… (30 is trenta)."
        near: [{answer: quattordici, hint: "Quattordici is 14. You need the tens: 40."}]
      - id: u02.l2.ex05
        format: cloze
        targets: [{item: g:numbers-to-100, skill: recall}, {item: w:sessanta, skill: recall}]
        tags: [cd:ask-price-pay]
        source: u02.l2.story#11
        text: "Un euro e [[sessanta]]."
        prompt_en: "€1.60."
        hint: "Sixty has a double s."
        rule: "Tens from 40 to 90 end in -anta: quaranta, cinquanta, sessanta… (30 is trenta)."
        near:
          - {answer: settanta, hint: "Settanta is 70. You need 60."}
          - {answer: sedici, hint: "Sedici is 16. You need the tens: 60."}
      - id: u02.l2.ex06
        format: cloze
        targets: [{item: c:senta, skill: recall}]
        tags: [cd:get-attention]
        source: u02.l2.story#2
        text: "[[Senta]], scusi! Buongiorno!"
        prompt_en: "Excuse me! Good morning! (to get Giulia's attention)"
        hint: "Marco says Lei to Giulia. It's the other word for getting attention, not scusi."
        near:
          - {answer: senti, hint: "Senti goes with tu. Marco says Lei to Giulia."}
          - {answer: scusi, hint: "Scusi comes next. Marco starts with the other word for getting attention."}
      - id: u02.l2.ex07
        format: cloze
        targets: [{item: c:al-bar, skill: recall}]
        tags: [sy:tp.food-drink]
        source: u02.l2.story#1
        text: "Oggi Marco è [[al bar]] Aurora."
        prompt_en: "Today Marco is at Bar Aurora."
        hint: "Two words: at the café."
        near: [{answer: "in un bar", hint: "That's 'in a café'. Marco is at one café you know: Aurora."}]
      - id: u02.l2.ex08
        format: recall
        targets: [{item: c:quanto-costa, skill: recall}]
        tags: [cd:ask-price-pay]
        prompt_en: "How much is a croissant?"
        answer: "{quanto costa un cornetto|(buongiorno )(senta )(scusi ){quanto costa|quant'è|quanto è} {un|il} cornetto|{un|il} cornetto quanto costa}"
        near: [{answer: "quanto costa una cornetto", outcome: almost, hint: "Cornetto is masculine."}]
        audio_after: true
      - id: u02.l2.ex09
        format: recall
        targets: [{item: w:latte, skill: recall}]
        tags: [cd:order-food-drink]
        prompt_en: "a glass of milk (at the café)"
        answer: "{un [latte]|un bicchiere di latte}"
        near: [{answer: "una latte", outcome: almost, hint: "Latte is masculine, although it ends in -e."}]
        audio_after: true
      - id: u02.l2.ex10
        format: choice
        targets: [{item: w:latte, skill: read}]
        tags: [cd:order-food-drink]
        prompt_it: "Un latte, per favore."
        audio: {speaker: ch:marco}
        question_en: "You say this at an Italian café. What do you get?"
        options: ["A glass of milk", "A coffee with milk", "A cappuccino"]
        answer: 0
      - id: u02.l2.ex11
        format: match
        targets:                      # targets[i] belongs to pairs[i]
          - {item: w:trenta, skill: read}
          - {item: w:quaranta, skill: read}
          - {item: w:cinquanta, skill: read}
          - {item: w:settanta, skill: read}
          - {item: w:novanta, skill: read}
          - {item: w:cento, skill: read}
        tags: [sy:gr.cardinal-numbers]
        pairs: [["trenta", "30"], ["quaranta", "40"], ["cinquanta", "50"], ["settanta", "70"], ["novanta", "90"], ["cento", "100"]]
      - id: u02.l2.ex12
        format: cloze
        targets: [{item: g:numbers-to-100, skill: recall}, {item: w:settanta, skill: recall}]
        tags: [cd:ask-price-pay]
        source: u02.l2.story#24
        text: "Tre euro e [[settanta]]."
        prompt_en: "€3.70."
        hint: "It starts like sette."
        rule: "Tens from 40 to 90 end in -anta: quaranta, cinquanta, sessanta… (30 is trenta)."
        near:
          - {answer: sessanta, hint: "Sessanta is 60. Seventy comes from sette."}
          - {answer: diciassette, hint: "Diciassette is 17. You need the tens: 70."}
      - id: u02.l2.ex33
        format: cloze
        targets: [{item: w:colazione, skill: recall}]
        tags: [cd:order-food-drink, sy:tp.food-drink]
        source: u02.l2.story#11
        text: "Ma oggi la [[colazione]] è due euro e cinquanta!"
        prompt_en: "But today, breakfast is €2.50!"
        hint: "The word on the board: breakfast."
      - id: u02.l2.ex13
        format: recall
        targets: [{item: g:numbers-to-100, skill: recall}, {item: w:ottanta, skill: recall}]
        tags: [cd:ask-price-pay]
        prompt_en: "€2.80"
        answer: "{due euro e [ottanta]|due euro e ottanta centesimi|due euro ottanta|due( e) ottanta}"
        rule: "A price is the euros, e, then the cents: due euro e venti is €2.20."
        near:
          - {answer: "due euro e otto", hint: "That's €2.08. You need eighty cents."}
          - {answer: "due euro e diciotto", hint: "Diciotto is 18. You need the tens: 80."}
        audio_after: true
      - id: u02.l2.ex14
        format: dictation
        targets: [{item: c:quanto-costa, skill: listen}]
        tags: [sy:cefr.orthographic-control]
        say: "Senta, quanto costa un cappuccino?"
        slow: true
      - id: u02.l2.ex15
        format: dictation
        targets: [{item: w:trenta, skill: listen}, {item: w:cinquanta, skill: listen}, {item: w:novanta, skill: listen}, {item: w:cento, skill: listen}]
        tags: [sy:gr.cardinal-numbers]
        say: "Trenta, cinquanta, settanta, novanta e cento."
        slow: true
      - id: u02.l2.ex16
        format: sentence-building
        targets: [{item: c:al-bar, skill: recall}]
        tags: [sy:tp.food-drink]
        prompt_en: "Today I'm at the café."
        tiles: [oggi, sono, al bar]
        distractors: [sei]
        answer: ["oggi sono al bar", "sono al bar oggi"]
      - id: u02.l2.ex17
        format: repeat
        targets: [{item: c:senta, skill: speak}]
        tags: [sy:cefr.phonological-control]
        say: "Senta, scusi! Quanto costa un cornetto?"
    mix:
      - id: u02.l2.ex18
        format: choice
        targets: [{item: w:sessanta, skill: read}]
        tags: [sy:gr.cardinal-numbers]
        question_en: "Which one is 60?"
        options: ["sessanta", "sedici", "settanta"]
        answer: 0
      - id: u02.l2.ex19
        format: choice
        targets: [{item: w:trenta, skill: read}]
        tags: [sy:gr.cardinal-numbers]
        question_en: "Which one is 30?"
        options: ["trenta", "tredici", "tre"]
        answer: 0
      - id: u02.l2.ex20
        format: cloze
        targets: [{item: g:indefinite-article, skill: recall}, {item: g:noun-gender, skill: recall}]
        tags: [sy:gr.articles]
        text: "Ecco [[un]] latte!"
        prompt_en: "Here's a glass of milk!"
        hint: "Marco orders one in the story: '… latte, per favore.'"
        rule: "Nouns ending in -e can be masculine or feminine: learn each one with un or una."
        near:
          - {answer: una, hint: "Latte is masculine, although it doesn't end in -o."}
          - {answer: "un'", hint: "Un' is only for feminine nouns that start with a vowel."}
      - id: u02.l2.ex21
        format: recall
        targets: [{item: g:tu-lei, skill: recall}]
        tags: [cd:get-attention, cd:choose-tu-lei]
        prompt_en: "Excuse me! (to Sara, a friend)"
        answer: "{scusa|senti|senti scusa|scusa senti|scusa Sara|senti Sara|Sara scusa|Sara senti}"
        near:
          - {answer: scusi, hint: "Sara is a friend. Which form goes with tu?"}
          - {answer: senta, hint: "Senta goes with Lei. Sara is a friend."}
        audio_after: true
      - id: u02.l2.ex22
        format: match
        targets:                      # targets[i] belongs to pairs[i]
          - {item: w:cinquanta, skill: read}
          - {item: w:sessanta, skill: read}
          - {item: w:quaranta, skill: read}
          - {item: w:ottanta, skill: read}
        tags: [cd:ask-price-pay]
        pairs: [["due euro e cinquanta", "€2.50"], ["un euro e sessanta", "€1.60"], ["un euro e quaranta", "€1.40"], ["due euro e ottanta", "€2.80"]]
      - id: u02.l2.ex23
        format: choice
        targets: [{item: g:numbers-to-100, skill: read}, {item: w:novanta, skill: read}]
        tags: [cd:ask-price-pay]
        prompt_it: "Tre euro e novanta."             # today's offer 2,50 + a cornetto 1,40
        audio: {speaker: ch:giulia}
        question_en: "Giulia tells you the price. How much is it?"
        options: ["€3.90", "€3.09", "€13.90"]
        answer: 0
      - id: u02.l2.ex24
        format: choice
        targets: [{item: c:quant-e, skill: read}]
        tags: [cd:ask-price-pay]
        question_en: "You want to know what your order comes to. What do you ask?"
        options: ["Quant'è?", "Cosa prende?", "Come va?"]
        answer: 0
      - id: u02.l2.ex25
        format: recall
        targets: [{item: w:cento, skill: recall}]
        tags: [sy:gr.cardinal-numbers]
        prompt_en: "a hundred"
        answer: "cento"
        near: [{answer: cinquanta, hint: "Cinquanta is 50. You need twice as much."}]
        audio_after: true

  # 6 · Listening: another customer at the counter (audio first; the transcript opens after the questions).
  #     Spremuta 3,20 + cornetto 1,40 = quattro euro e sessanta, paid at the end (CL6); not today's offer.
  - kind: listening
    id: u02.l2.step-listening
    text:
      id: u02.l2.dialogue
      kind: dialogue
      lines:
        - {speaker: ch:extra, to: ch:giulia, register: lei, it: "Buongiorno! Quanto costa una spremuta?", en: "Good morning! How much is a fresh orange juice?"}
        - {speaker: ch:giulia, to: ch:extra, register: lei, it: "Tre euro e venti.", en: "€3.20."}
        - {speaker: ch:extra, to: ch:giulia, register: lei, it: "E un cornetto?", en: "And a croissant?"}
        - {speaker: ch:giulia, to: ch:extra, register: lei, it: "Un euro e quaranta.", en: "€1.40."}
        - {speaker: ch:extra, to: ch:giulia, register: lei, it: "Una spremuta e un cornetto, per favore.", en: "A fresh orange juice and a croissant, please."}
        - {speaker: ch:giulia, to: ch:extra, register: lei, it: "Ecco!", en: "Here you are!"}
        - {speaker: ch:extra, to: ch:giulia, register: lei, it: "Grazie! Quant'è?", en: "Thanks! How much is it?"}
        - {speaker: ch:giulia, to: ch:extra, register: lei, it: "Quattro euro e sessanta.", en: "€4.60."}
        - {speaker: ch:extra, to: ch:giulia, register: lei, it: "Ecco. Buona giornata!", en: "Here you go. Have a good day!"}
    plays: unlimited
    exercises:
      - id: u02.l2.ex26
        format: choice
        tags: [cd:order-food-drink, sy:cefr.oral-comprehension]
        question_en: "What does the customer order?"
        options: ["A fresh orange juice and a croissant", "A cappuccino and a croissant", "Just a fresh orange juice"]
        answer: 0
      - id: u02.l2.ex27
        format: true-false
        tags: [cd:ask-price-pay, sy:cefr.oral-comprehension]
        statement_en: "A croissant costs €1.60."
        answer: false
      - id: u02.l2.ex28
        format: choice
        tags: [cd:ask-price-pay, sy:cefr.oral-comprehension]
        question_en: "How much does the customer pay?"
        options: ["€4.60", "€4.70", "€3.20"]
        answer: 0

  # 7 · Sounds: double consonants (rule 11). Answers mix single and double.
  - kind: sounds
    id: u02.l2.step-sounds
    exercises:
