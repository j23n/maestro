# Unit 2 task (docs/06 §12, §13, §15). DRAFT. It uses items from all three lessons. Unit 2 has no writing task (see
# unit.yaml). Prices come from the Bar Aurora menu below; every price said anywhere in Unit 2 must match it (the only
# other price is the day's breakfast offer on Lesson 2's chalkboard, CL36).
id: u02.task
review: {status: draft, by: null, date: null, hash: null}

conversations:
  # Order at the counter, then pay Giulia at the end (CL6). Prices: cappuccino 1,60 + cornetto 1,40 = tre euro, or the
  # cappuccino alone. Five turns: the unit's ordering, likes and paying, with the Lei goodbye as the register turn (CL37).
  - id: u02.task.conv1
    format: conversation
    with: ch:giulia
    register: lei
    title: {en: "Order breakfast from Giulia"}
    tags: [cd:order-food-drink, cd:ask-price-pay, sy:fn.likes-wants]
    goals:
      - {id: drink, en: "Order a cappuccino"}
      - {id: food, en: "Order something to eat, or say no thanks"}
      - {id: like, en: "Say you like it"}
      - {id: price, en: "Ask how much it is"}
      - {id: bye, en: "Pay and say goodbye"}
    start: n1
    nodes:
      n1:
        say: "Buongiorno! Cosa prende?"
        en: "Good morning! What will you have?"
        expect:
          - intent: order-drink
            goal: drink
            accept: ["(buongiorno )({vorrei|prendo} )un cappuccino( per favore)", "(buongiorno )({vorrei|prendo} )un cappuccino grazie"]
            next: n2
        help: ["Vorrei un cappuccino, per favore."]
        hint_en: "Order a cappuccino."
      n2:
        say: "Certo. E da mangiare?"
        en: "Of course. Anything to eat?"
        expect:
          - {intent: order-food, goal: food, accept: ["(vorrei )un cornetto( per favore)", "{sì|e}( {vorrei|prendo}) un cornetto( per favore)", "(sì )un cornetto grazie", "prendo un cornetto( {per favore|grazie})"], next: n3}
          - {intent: ask-have, goal: food, accept: ["(scusi )avete {cornetti|un cornetto}", "(scusi )avete ancora {cornetti|un cornetto}", "(scusi )ci sono( ancora) cornetti"], next: n2b}
          - {intent: nothing-to-eat, goal: food, accept: ["no grazie", "no grazie solo {il|un} cappuccino( grazie)", "solo {il|un} cappuccino( grazie)"], next: n3b}
        help: ["Un cornetto, per favore.", "No, grazie."]
        hint_en: "Order something to eat, or say no thanks."
      n2b:                                  # after avete…?, Giulia answers before the croissant comes
        say: "Certo! Un cornetto?"
        en: "Of course! A croissant?"
        expect:
          - {intent: yes-food, goal: food, accept: ["sì( grazie)( un cornetto)( per favore)", "un cornetto( {per favore|grazie})", "sì un cornetto grazie"], next: n3}
        help: ["Sì, grazie!"]
        hint_en: "Say yes."
      n3:
        say: "Allora? Le piace il cornetto?"
        en: "Well? Do you like the croissant?"
        expect:
          - {intent: like, goal: like, accept: ["sì mi piace( è buono)", "sì grazie mi piace( è buono)", "(sì )mi piace molto( è buono)", "(sì )(grazie )è buono", "mi piace( è buono)"], next: n4}
        near: [{answer: "(sì )ti piace", hint: "Ti piace asks a question. Talk about yourself: I like it."}]
        help: ["Sì, mi piace! È buono."]
        hint_en: "Say you like it."
      n3b:
        say: "Allora? Le piace il cappuccino?"
        en: "Well? Do you like the cappuccino?"
        expect:
          - {intent: like, goal: like, accept: ["sì mi piace( è buono)", "sì grazie mi piace( è buono)", "(sì )mi piace molto( è buono)", "(sì )(grazie )è buono", "mi piace( è buono)"], next: n4b}
        near: [{answer: "(sì )ti piace", hint: "Ti piace asks a question. Talk about yourself: I like it."}]
        help: ["Sì, mi piace! È buono."]
        hint_en: "Say you like it."
      n4:
        say: "Bene!"
        en: "Good!"
        expect:
          - {intent: ask-price, goal: price, accept: ["(grazie )(scusi ){quant'è|quanto è|quanto costa}"], next: n5}
        help: ["Scusi, quant'è?"]
        hint_en: "Ask how much it is."
      n4b:
        say: "Bene!"
        en: "Good!"
        expect:
          - {intent: ask-price, goal: price, accept: ["(grazie )(scusi ){quant'è|quanto è|quanto costa}"], next: n5b}
        help: ["Scusi, quant'è?"]
        hint_en: "Ask how much it is."
      n5:                                   # cappuccino 1,60 + cornetto 1,40
        say: "Tre euro, grazie."
        en: "Three euros, thanks."
        expect:
          - {intent: pay-bye, goal: bye, accept: ["(ecco )(grazie )(e ){arrivederci|buona giornata}", "{arrivederci|buona giornata} e grazie", "(ecco )(grazie )(e ){arrivederci( e)( grazie) buona giornata|buona giornata( e)( grazie) arrivederci}"], next: end}
        near: [{answer: "(ecco )(grazie )ciao", hint: "Giulia says Lei to you. Which goodbye goes with Lei?"}]
        help: ["Ecco. Grazie, arrivederci!"]
        hint_en: "Pay (\"here you are\") and say goodbye."
      n5b:                                  # cappuccino only
        say: "Un euro e sessanta, grazie."
        en: "€1.60, thanks."
        expect:
          - {intent: pay-bye, goal: bye, accept: ["(ecco )(grazie )(e ){arrivederci|buona giornata}", "{arrivederci|buona giornata} e grazie", "(ecco )(grazie )(e ){arrivederci( e)( grazie) buona giornata|buona giornata( e)( grazie) arrivederci}"], next: end}
        near: [{answer: "(ecco )(grazie )ciao", hint: "Giulia says Lei to you. Which goodbye goes with Lei?"}]
        help: ["Ecco. Grazie, arrivederci!"]
        hint_en: "Pay (\"here you are\") and say goodbye."
      end:
        say: "Grazie! Buona giornata!"
        en: "Thank you! Have a good day!"
        final: true

talk:
  id: u02.task.talk
  format: talk
  tags: [cd:order-food-drink, cd:ask-price-pay]
  prompt_en: "You're at Bar Aurora. Greet Giulia, order something for you and a friend, and ask the price."
  points:
    - {id: greet, en: "Greet Giulia", accept: ["{buongiorno|buonasera}"]}
    - {id: first, en: "Order something", accept: ["{un {caffè|cappuccino|cornetto}|una spremuta}", "due {caffè|cappuccini|cornetti|spremute}"]}
    - {id: second, en: "Order a second thing, or two of the same", accept: ["e( anche) {un {caffè|cappuccino|cornetto}|una spremuta}", "due {caffè|cappuccini|cornetti|spremute}"]}
    - {id: price, en: "Ask the price", accept: ["{quant'è|quanto è|quanto costa}"]}
  pass: 3                                   # four points: a greeting and a price alone can't pass without an order
  model: "Buongiorno! Vorrei un cappuccino e una spremuta, per favore. Quant'è?"
  duration_s: {min: 5, max: 60}

relay:
  id: u02.task.relay
  format: relay
  tags: [cd:pass-on-prices, sy:cefr.mediation]
  source:
    text:
      id: u02.task.menu
      kind: real_world
      layout:
        type: menu
        title: Bar Aurora
        sections:
          - title: Caffetteria
            rows:
              - {name: caffè, price: "1,20"}
              - {name: cappuccino, price: "1,60"}
          - title: Bevande
            rows:
              - {name: spremuta, price: "3,20"}
          - title: Pasticceria
            rows:
              - {name: cornetto, price: "1,40"}
        ignore: [Caffetteria, Bevande, Pasticceria]   # section headings: gloss-free layout words (docs/06 § 4)
  friend_en: "I'm waiting outside. How much is a cappuccino in there?"
  answer_en: {type: price, value: 1.60}
