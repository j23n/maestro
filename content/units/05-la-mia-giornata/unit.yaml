# Unit spec (u05). The contract every draft for this unit must satisfy (docs/03, docs/04).
# Encoded from the plan's scope and sequence. DRAFT for content-lead sign-off (C1, week 3): approval = review.status.
# `chunks` lists set phrases in prose; the item graph (C2) turns them into c: items.

id: u05
title: {it: La mia giornata, en: My day}
episode: A day in Marco's life; Giulia offers tu
arc: settling
est_hours: 4.5
lessons: 3
can_do:
- id: cd:tell-time
  text: Tell the time and ask for it
  scale: oral-interaction
  syllabus: ['sy:fn.numbers-prices-times']
- id: cd:describe-routine
  text: Describe your daily routine
  scale: oral-production
  syllabus: ['sy:fn.routine-plans', 'sy:tp.routine']
- id: cd:say-how-often
  text: Say how often you do things
  scale: oral-production
  syllabus: ['sy:gr.adverbs']
- id: cd:write-short-message
  text: Write a short message about your day
  scale: written-interaction
  syllabus: ['sy:fn.messages-postcards', 'sy:ss.message-conventions']
grammar:
- {id: 'g:reflexive-sg', status: P}
- {id: 'g:irregular-movement', status: P}
- {id: 'g:telling-time', status: chunk}
- {id: 'g:frequency-adverbs', status: P}
- {id: 'g:negation-mai-niente', status: P}
- {id: 'g:adverbs-time-place', status: P}
chunks: sono le otto, è l'una, alle otto; ci diamo del tu? (R); bevo…, bevi…? (a colazione bevo un caffè; the verb bere
  stays R in Unit 8, docs/13 CL2)
items:
  new_words: 55-70
  topics: ['topic:daily-routine', 'topic:objects']
  note: daily actions, times, days, meals
recycle_from: [u02, u03, u04]
sounds: ['s:z']
texts:
  stories: {count: 3, words: 140-240, new_token_max: 0.05}
  listening: [dialogue, message]
  real_world: [timetable, message]
tasks:
  conversation:
  - {id: u05.task.conv1, brief: Giulia asks about your day and offers tu}
  talk: {brief: Describe a typical day}
  writing:
    kind: message
    brief: A message to Sara about your day (15–30 words)
    tags: ['sy:ex.cils-message']
  relay: null
check:
  items: 18
  sections: [listening, reading, writing, speaking]
notes: Giulia offers tu to Marco in the Lesson 1 story and to you in the unit conversation (story-bible switch points).
review: {status: draft, by: null, date: null, hash: null}
