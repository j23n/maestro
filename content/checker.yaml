# Thresholds and estimates for content checks 1–5 (docs/04). Changing a threshold is a decision:
# note it in PROGRESS.md and, if it loosens a rule from the plan, propose it in docs/13 first.

coverage_mode: report          # report until gate G3 (week 18), then enforce (build fails below 100%)

level_gate:
  story_new_token_max: 0.05    # stories and listening texts
  real_world_new_token_max: 0.10
  allow_requires_reason: true  # lines may carry allow: {reason: …}; all are listed in the report

recycling:
  encounters_p_min: 10         # warning below this (P items, introduction → course end)
  encounters_p_error_below: 6
  encounters_r_min: 6
  retrievals_in_lesson_p_min: 4
  retrievals_in_lesson_p_error_below: 2
  earlier_unit_content_share_min: 0.30
  grammar_spiral_later_units_min: 2

strands:                        # check 3 · strand balance (docs/04; CL21): each strand's share of a complete unit's
                                # estimated minutes must be within its band [min, max]. A bound is a share, or a map
                                # {unit: share} whose shares each hold from their unit on, in course order
  bands:
    input: {min: {u00: 0.10, u01: 0.15}, max: 0.35}                # CL39: 10% in Unit 0
    output: {min: 0.15, max: 0.35}
    fluency: {min: 0.10, max: 0.35}
    language-focus: {min: 0.15, max: {u00: 0.65, u01: 0.60, u03: 0.50}}  # 65% in Unit 0 (CL39), 60% in Units 1–2, 50% from Unit 3
  by_kind:                      # step kind or exercise format → strand
    story: input
    listening: input
    reading: input
    comprehension: input
    preview: language-focus
    note: language-focus
    cloze: language-focus
    recall: language-focus
    sentence-building: language-focus
    dictation: language-focus
    sound-pair: language-focus
    choice: language-focus
    match: language-focus
    true-false: language-focus
    repeat: fluency
    fluency: fluency
    conversation: output
    talk: output
    writing: output
    relay: output
    use: output

durations_seconds:              # nominal times used for strand balance and lesson length estimates
  preview_item: 25
  story_per_word: 0.6           # reading a story, listening or reading text, per word
  audio_per_word: 0.6           # check 3 only (the pack's est_seconds leave audio out): hearing a story once, a
                                # listening text up to twice (its step's `plays`), and fluency replay (÷ fluency_rate).
                                # Nothing is rendered yet, so a nominal ~100 words a minute: the audio budget's
                                # speaking rate (13 characters/s, line gaps, padding; docs/04 § Audio › Budget) over
                                # the Unit 0–2 stories and listening texts gives 0.61 s a word
  comprehension: 15
  note: 180
  cloze: 25
  recall: 25
  sentence-building: 35
  dictation: 45
  sound-pair: 12
  repeat: 25
  choice: 15
  match: 40
  true-false: 12
  relay: 45
  conversation_turn: 40
  talk: 180
  writing: 360
  fluency_rate: 1.15

warnings_fail_in_release: false
