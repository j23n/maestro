# Countries for onboarding personalisation (docs/03 § personal slots: {ME.home}, {ME.nationality}, {ME.country}).
# home_phrase is what follows "abito": the article-bearing forms (negli, nel, nei, nelle) are personal chunks,
# exempt from the Unit 6 articulated-preposition gate. alt_home_phrases are accepted in answers, never shown.
# IDs are ISO 3166-1 alpha-2 codes, lowercase, plus gb-eng/gb-sct/gb-wls/gb-nir (ISO 3166-2) for the UK nations.
# Drafters: nationality is "sono + adjective" (sono canadese) and origin is "sono di + city" (sono di Toronto);
# never write "sono di + country".
# DRAFT: the content lead checks every line (C1).
