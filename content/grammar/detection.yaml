# Detection rules and morphology unlocks for the course grammar points (docs/04 § Annotation, step 5).
# Engineering-owned: agents refine these in M1.7 and later as content arrives; they are NOT part of the content
# lead's approval of points.yaml. Every rule needs a passing and a failing test in pipeline/tests/.
#
# unlock: Morph-it! feature patterns that become legal from the point's unit (regex on the features after the colon,
#         e.g. "ind+pres+3+s"); `lemmas: "*"` means every verb.
# detect: token sequences; matchers take form (regex on the lowercase surface), lemma (list), pos (Morph-it!
#         category prefixes), morph (regex) and optional: true. `none` = traced via exercise targets only.
#         A matcher matches a token only if EVERY Morph-it! analysis left after disambiguation matches.

rules:
- id: g:essere-present-sg
  unlock:
  - lemmas: [essere]
    morph: ind\+pres\+[123]\+s
  detect: none
- id: g:subject-pronouns
  detect:
  - seq:
    - pos: [PRO-PERS]
      form: ^(io|tu|lui|lei)$
- id: g:negation-non
  detect:
  - seq:
    - {form: ^non$}
    - pos: [PRO-PERS, SI, CI]
      optional: true
    - pos: [VER, AUX, MOD, CAU, ASP]
- {id: 'g:tu-lei', detect: none}
- {id: 'g:adjectives-o-a-e', detect: none}
- id: g:conjunctions
  detect:
  - seq:
    - pos: [CON]
      form: ^(e|ma|o)$
- id: g:simple-prepositions
  detect:
  - seq:
    - pos: [PRE]
- id: g:indefinite-article
  detect:
  - seq:
    - pos: [ART, DET-INDEF]
      form: ^(un|uno|una|un')$
- {id: 'g:noun-gender', detect: none}
- id: g:noun-plural
  detect:
  - seq:
    - pos: [NOUN]
      morph: \bp$
  note: Fires only when every analysis of the token is plural, so invariable nouns (caffè, bar, euro) never fire (docs/04 § Annotation, step 5).
- id: g:numbers-to-100
  detect:
  - seq:
    - pos: [DET-NUM-CARD, PRO-NUM]
      form: ^(vent[iu].+|ventotto|trent.*|quarant.*|cinquant.*|sessant.*|settant.*|ottant.*|novant.*|cento)$
- id: g:conditional-courtesy
  detect:
  - seq:
    - {morph: ^cond\+}
- {id: 'g:lei-questions', detect: none}
- {id: 'g:piacere-chunk', detect: none, note: 'mi/ti/Le piace are chunks (exempt); plural forms (piacciono) belong to g:piacere-full.'}
- id: g:avere-present-sg
  unlock:
  - lemmas: [avere]
    morph: ind\+pres\+[123]\+s
  detect: none
- id: g:essere-avere-3pl
  unlock:
  - lemmas: [essere, avere]
    morph: ind\+pres\+3\+p
  detect: none
- id: g:definite-article
  detect:
  - seq:
    - pos: [ART]
      form: ^(il|lo|la|l'|i|gli|le)$
- {id: 'g:irregular-nouns', detect: none}
- id: g:possessives
  detect:
  - seq:
    - pos: [DET-POSS]
- {id: 'g:np-agreement', detect: none}
- {id: 'g:predicative-agreement', detect: none}
- id: g:molto
  detect:
  - seq:
    - lemma: [molto]
- id: g:present-regular-sg
  unlock:
  - {lemmas: '*', morph: 'ind\+pres\+[123]\+s'}
  detect: none
- id: g:present-noi
  unlock:
  - {lemmas: '*', morph: ind\+pres\+1\+p}
  detect:
  - seq:
    - {morph: ^ind\+pres\+1\+p}
- id: g:present-isc
  detect:
  - seq:
    - lemma: [capire, preferire, finire, pulire, spedire]
      morph: ^ind\+pres
- id: g:fare-present
  detect:
  - seq:
    - lemma: [fare]
      morph: ^ind\+pres
- id: g:infinitive
  unlock:
  - {lemmas: '*', morph: ^inf}
  detect:
  - seq:
    - {morph: ^inf}
- id: g:question-words
  detect:
  - seq:
    - pos: [WH, WH-CHE, PRO-WH, DET-WH]
- id: g:reflexive-sg
  detect:
  - seq:
    - form: ^(mi|ti|si)$
      pos: [PRO-PERS, SI]
    - lemma: [alzare, svegliare, lavare, vestire, chiamare, riposare, sentire, divertire, preparare, addormentare]
      morph: ^ind\+pres\+[123]\+s
- id: g:irregular-movement
  detect:
  - seq:
    - lemma: [andare, venire, uscire, stare]
      morph: ^ind\+pres
- {id: 'g:telling-time', detect: none}
- id: g:frequency-adverbs
  detect:
  - seq:
    - {form: ^(sempre|spesso|mai)$}
- id: g:negation-mai-niente
  detect:
  - seq:
    - {form: ^non$}
    - pos: [PRO-PERS, SI, CI]
      optional: true
    - pos: [VER, AUX, MOD, CAU, ASP]
    - {form: ^(mai|niente|nulla)$}
- {id: 'g:adverbs-time-place', detect: none}
- id: g:c-e-ci-sono
  detect:
  - seq:
    - {form: ^c'$}
    - {form: ^è$}
  - seq:
    - {form: ^ci$}
    - lemma: [essere]
      morph: ^ind\+pres\+3
- id: g:articulated-prepositions
  detect:
  - seq:
    - pos: [ARTPRE]
      form: ^(al|alla|all'|ai|alle|nel|nella|nell'|nei|nelle|dal|dalla|dall'|dai|dalle|del|della|dell'|dei|delle|sul|sulla|sull'|sui|sulle)$
- id: g:articulated-prepositions-lo-gli
  detect:
  - seq:
    - pos: [ARTPRE]
      form: ^(allo|agli|nello|negli|dallo|dagli|dello|degli|sullo|sugli)$
- {id: 'g:place-prepositions', detect: none}
- id: g:imperative-tu-voi
  unlock:
  - {lemmas: '*', morph: '^impr\+pres\+2\+[sp]'}
  detect: none
  note: 'tu imperatives of -are verbs look like the 3rd singular present (gira), and of -ere/-ire verbs like the 2nd singular present (prendi):
    traced via exercise targets.'
- id: g:imperative-lei
  unlock:
  - lemmas: [girare, prendere, andare, continuare, attraversare, scusare, sentire, guardare, aspettare, venire, salire, scendere, entrare, dire,
      fare]
    morph: ^sub\+pres\+3\+s
  detect: none
- id: g:present-voi
  unlock:
  - {lemmas: '*', morph: ind\+pres\+2\+p}
  detect:
  - seq:
    - {morph: ^ind\+pres\+2\+p}
- id: g:ordinals
  detect:
  - seq:
    - lemma: [primo, secondo, terzo]
      pos: [ADJ]
- id: g:questo-quello
  detect:
  - seq:
    - lemma: [questo, quello]
- id: g:present-loro
  unlock:
  - {lemmas: '*', morph: ind\+pres\+3\+p}
  detect:
  - seq:
    - {form: '^(?!(sono|hanno)$).+$', morph: ^ind\+pres\+3\+p}
- {id: 'g:quantities', detect: none}
- id: g:tutto-tanto
  detect:
  - seq:
    - lemma: [tutto, tanto, poco]
- {id: 'g:numbers-above-100', detect: none}
- id: g:direct-object-pronouns
  detect:
  - seq:
    - form: ^(lo|la|li|le)$
      pos: [PRO-PERS]
    - pos: [VER, AUX, MOD, CAU, ASP]
- id: g:ne-partitive
  detect:
  - seq:
    - {form: ^ne$}
- id: g:piacere-full
  detect:
  - seq:
    - lemma: [piacere]
      morph: \+p$
- id: g:modal-verbs
  detect:
  - seq:
    - lemma: [volere, potere, dovere]
    - {morph: ^inf}
- id: g:sapere
  detect:
  - seq:
    - lemma: [sapere]
- id: g:stressed-pronouns
  detect:
  - seq:
    - pos: [PRE]
      form: ^(a|con|per|da|di)$
    - {form: ^(me|te|lui|lei|noi|voi|loro|Lei)$}
- id: g:perche
  detect:
  - seq:
    - {form: ^perché$}
- id: g:indirect-object-pronouns
  detect:
  - seq:
    - form: ^(gli|le)$
      pos: [PRO-PERS]
    - pos: [VER, AUX, MOD, CAU, ASP]
- id: g:irregular-dare-dire-bere
  detect:
  - seq:
    - lemma: [dare, dire, bere]
- {id: 'g:agree-disagree', detect: none}
- id: g:location-prepositions
  detect:
  - seq:
    - {form: ^(sopra|sotto|accanto)$}
- id: g:passato-prossimo-avere
  unlock:
  - {lemmas: '*', morph: ^part\+past}
  detect:
  - seq:
    - lemma: [avere]
      morph: ^ind\+pres
    - pos: [ADV]
      optional: true
    - {morph: ^part\+past}
- {id: 'g:weather', detect: none}
- {id: 'g:dates-years', detect: none}
- {id: 'g:colours', detect: none}
- id: g:comparative-chunks
  detect:
  - seq:
    - {form: ^più$}
    - pos: [ADJ]
- {id: 'g:present-for-plans', detect: none}
- id: g:quando
  detect:
  - seq:
    - form: ^quando$
      pos: [CON]
- id: g:stare-gerund
  unlock:
  - {lemmas: '*', morph: ^ger}
  detect:
  - seq:
    - lemma: [stare]
    - {morph: ^ger}
- id: g:se-if
  detect:
  - seq:
    - form: ^se$
      pos: [CON]
- id: g:passato-prossimo-essere
  detect:
  - seq:
    - lemma: [essere]
      morph: ^ind\+pres
    - pos: [ADV]
      optional: true
    - lemma: [andare, venire, arrivare, partire, tornare, uscire, entrare, stare, essere, restare, rimanere, salire, scendere, nascere, diventare]
      morph: ^part\+past
- {id: 'g:time-24h', detect: none}
- {id: 'g:da-a', detect: none}
- id: g:per-infinitive
  detect:
  - seq:
    - {form: ^per$}
    - {morph: ^inf}
- {id: 'g:mal-di', detect: none}
- {id: 'g:passato-prossimo-auxiliary', detect: none}
- id: g:past-time-expressions
  detect:
  - seq:
    - {form: ^(ieri|scorso|scorsa|scorsi|scorse)$}
  - seq:
    - {form: ^(anni|anno|mesi|mese|settimane|settimana|giorni|giorno|ore|ora|minuti|minuto)$}
    - {form: ^fa$}
- id: g:era-cera
  detect:
  - seq:
    - lemma: [essere]
      morph: ^ind\+impf
- {id: 'g:relative-che', detect: none}
