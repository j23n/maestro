# Course grammar points (76). Pedagogical fields only: title, unit, status, syllabus, requires, confusable,
# graded, about, decide. Derived from the plan's scope and sequence and the A1 syllabus tab.
# Status: DRAFT for content-lead sign-off (C1). Detection and morphology unlocks live in detection.yaml
# (engineering-owned, not part of the content lead's approval).
# graded: developing → in free production, errors on this point never fail a task (rule 9).

review: {status: draft, by: null, date: null, hash: null}
points:
- id: g:essere-present-sg
  title: essere, singular and Lei (sono, sei, è)
  unit: u01
  status: P
  syllabus: ['sy:gr.essere-avere']
  confusable: ['g:avere-present-sg']
  about: Learners use these for identity, nationality and place. "Lei è" addresses one person formally.
- id: g:subject-pronouns
  title: Subject pronouns io, tu, lui, lei, Lei (noi in Unit 4, voi in Unit 6, loro in Unit 7)
  unit: u01
  status: P
  syllabus: ['sy:gr.subject-pronouns']
- id: g:negation-non
  title: non + verb
  unit: u01
  status: P
  syllabus: ['sy:gr.negation']
- id: g:tu-lei
  title: 'tu or Lei: choosing the register, incl. adjectives after Lei (Lei è americano? to a man)'
  unit: u01
  status: P
  syllabus: ['sy:ss.tu-lei', 'sy:cefr.sociolinguistic']
  requires: ['g:essere-present-sg']
  about: Learners also recognise an older person saying tu while they answer with Lei (Signora Rossi).
- id: g:adjectives-o-a-e
  title: Adjectives in -o/-a and -e (nationalities first)
  unit: u01
  status: P
  syllabus: ['sy:gr.adjectives']
- id: g:conjunctions
  title: e, ma, o
  unit: u01
  status: P
  syllabus: ['sy:gr.conjunctions']
- id: g:simple-prepositions
