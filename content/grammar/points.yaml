  status: chunk
  syllabus: ['sy:gr.piacere']
  about: Chunks c:mi-piace, c:ti-piace, c:le-piace. The article in mi piace il caffè is lexical before Unit 3 (docs/04).
- id: g:avere-present-sg
  title: avere, singular (ho, hai, ha); ho … anni
  unit: u03
  status: P
  syllabus: ['sy:gr.essere-avere']
