  status: P
  syllabus: ['sy:gr.noun-gender-number']
  requires: ['g:noun-gender']
- id: g:numbers-to-100
  title: 'Numbers to 100 (prices: due euro e venti)'
  unit: u02
  status: P
  syllabus: ['sy:gr.cardinal-numbers']
- id: g:conditional-courtesy
  title: vorrei (and potrei to recognise) as polite requests
  unit: u02
  status: chunk
  syllabus: ['sy:gr.vorrei', 'sy:ss.vorrei-polite']
  about: Allowed only inside chunks (c:vorrei, c:potrei). Any other conditional form fails the gate.
- id: g:lei-questions
  title: Service questions with Lei (Cosa prende? Desidera?)
