- id: g:definite-article
  title: il, lo, la, l', i, gli, le
  unit: u03
  status: P
  syllabus: ['sy:gr.articles']
  requires: ['g:indefinite-article']
  confusable: ['g:indefinite-article']
  about: 'Nouns are shown with their article from Unit 0, and article + noun appears in texts before Unit 3 as part of the
    noun (docs/04 § Annotation). Unit 3 teaches the system: all forms, choosing lo/gli, and the article in general statements
    (mi piace il caffè).'
