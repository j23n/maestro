  status: P
  syllabus: ['sy:gr.simple-prepositions']
- id: g:indefinite-article
  title: un, uno, una, un'
  unit: u02
  status: P
  syllabus: ['sy:gr.articles']
  requires: ['g:noun-gender']
  confusable: ['g:definite-article']
  about: 'Before Unit 2, un/una + noun is lexical (part of the noun). Unit 2 teaches the choice: un, uno, una, un''.'
- id: g:noun-gender
  title: 'Noun gender: -o masculine, -a feminine, -e either'
  unit: u02
  status: P
  syllabus: ['sy:gr.noun-gender-number']
- id: g:noun-plural
  title: Plural of regular nouns (-o → -i, -a → -e, -e → -i)
