# The German grammar base: every point of the A0 to B2 syllabus (HANDOFF.md 5.3 and 6.4). Levels follow
# Profile deutsch and the Goethe-Institut's exam descriptions as references; the labels are our own, in German.
# Each point's `topic` names the reference page in content/de/grammar/ that covers it, when there is one; the
# unmapped points are the pages still to write. IDs are frozen once shipped; the pipeline adds the `de:` prefix.
#
# id        stable short ID
# level     A0 (survival basics) to B2
# category  basics, verben, nomen, artikel, pronomen, praepositionen, adjektive, adverbien, satz,
#           satzverbindungen, wortbildung
# label     the point, in German
# topic     optional: the content/de/grammar page for it
