{# Feature hint partial — renders dismissable contextual hints.
   Expects `hints` list of HintConfig objects in template context. #}
{% for hint in hints %}
<div class="feature-hint" lang="en" data-hint-id="{{ hint.id }}" data-anchor="{{ hint.anchor_selector }}">
  <button type="button" class="hint-info-btn" title="Info"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><circle cx="12" cy="8" r="0.5" fill="currentColor" stroke="none"/></svg></button>
  <div class="hint-bubble">
    <p class="hint-message">{{ hint.message }}</p>
    <button type="button" class="hint-dismiss"
            hx-post="/hints/{{ hint.id }}/dismiss"
            hx-swap="none">Got it</button>
  </div>
</div>
{% endfor %}
