{# Feature hint partial — renders dismissable contextual hints.
   Expects `hints` list of HintConfig objects in template context. #}
{% for hint in hints %}
<div class="feature-hint" data-hint-id="{{ hint.id }}" data-anchor="{{ hint.anchor_selector }}">
  <button type="button" class="hint-info-btn" title="Info">(i)</button>
  <div class="hint-bubble">
    <p class="hint-message">{{ hint.message }}</p>
    <button type="button" class="hint-dismiss"
            hx-post="/hints/{{ hint.id }}/dismiss"
            hx-swap="none">Got it</button>
  </div>
</div>
{% endfor %}
