{% extends "base.html" %}
{% block title %}{{ t("page_title_speaking") }} — Maestro{% endblock %}

{% block content %}
<div class="activity-container">
  {% include "lezione-progress.html" %}

  <div class="card" style="text-align:center; padding:2.5rem;">
    <div class="stub-icon">🎙️</div>
    <div class="stub-title">{{ t("speaking_title") | lang_it }}</div>
    <div class="stub-desc">{{ t("speaking_desc") | lang_it }}</div>

    <button class="continue-btn"
            hx-post="/lezione/{{ lesson.id }}/activity/{{ idx }}/skip"
            hx-target="body">
      {{ t("skip_btn") | lang_it }}
    </button>
  </div>
</div>
{% endblock %}
