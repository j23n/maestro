{% extends "base.html" %}
{% block title %}Preparazione Lezione — Maestro{% endblock %}

{% block content %}
<div
  class="generating-wrap"
  hx-get="/lezione/{{ lesson.id }}/generating"
  hx-trigger="every 3s"
  hx-target="body"
  hx-swap="outerHTML"
>
  <div class="spinner"></div>
  <p class="generating-title">Stiamo preparando la tua lezione…</p>
  <p class="generating-sub">Grammatica, letture ed esercizi in arrivo. Un momento.</p>
</div>
{% endblock %}
