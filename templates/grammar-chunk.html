{% extends "base.html" %}
{% block title %}{{ heading }} — Maestro{% endblock %}

{% block content %}
<div class="grammar-detail">
  <div class="gp-header">
    <div class="gp-level">{{ t("grammar_rule_label") }}</div>
    <h1 class="gp-title">{{ heading }}</h1>
  </div>

  <!-- lang="it" is always correct here: chunks are grammar explanations
       written in the target language (Italian). Unlike grammar-detail.html,
       which conditionally sets lang based on the student's level, chunks
       are standalone reference content that is always in Italian. -->
  <div class="grammar-content" lang="it">
    {{ content | markdown | safe }}
  </div>

  <a class="back-link" href="javascript:history.back()">{{ t("back_link") }}</a>
</div>
{% endblock %}
