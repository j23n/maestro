<!doctype html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Maestro</title>
  <script src="https://unpkg.com/htmx.org"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 14px;
      line-height: 1.5;
      color: #111;
      background: #fff;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    /* scaled-down markdown headers inside messages */
    #messages h1 { font-size: 1.3em; font-weight: 600; margin: 0.25em 0; }
    #messages h2 { font-size: 1.15em; font-weight: 600; margin: 0.25em 0; }
    #messages h3 { font-size: 1.05em; font-weight: 600; margin: 0.25em 0; }
    #messages h4,
    #messages h5,
    #messages h6 { font-size: 1em; font-weight: 600; margin: 0.25em 0; }

    #messages p  { margin: 0.25em 0; }
    #messages pre, #messages code { font-size: 0.875em; }
    #messages pre { overflow-x: auto; }

    .meta {
      font-size: 0.75em;
      color: #999;
      margin-bottom: 0.15em;
    }

    form {
      display: flex;
      gap: 0.5rem;
      padding: 0.75rem 1rem;
      border-top: 1px solid #e5e5e5;
    }

    input[type="text"] {
      flex: 1;
      padding: 0.4rem 0.6rem;
      font-size: 14px;
      border: 1px solid #d0d0d0;
      border-radius: 4px;
      outline: none;
    }

    input[type="text"]:focus { border-color: #888; }

    button {
      padding: 0.4rem 0.8rem;
      font-size: 14px;
      border: 1px solid #d0d0d0;
      border-radius: 4px;
      background: #f5f5f5;
      cursor: pointer;
    }

    button:hover { background: #e8e8e8; }
  </style>
</head>
<body>
  <div id="messages"
      hx-get="/chat/{{ chat.id }}/messages"
      hx-swap="innerHTML"
      hx-trigger="load">
  </div>

  <form hx-post="/chat/{{ chat.id }}/messages"
        hx-target="#messages"
        hx-swap="beforeend"
        hx-on:htmx:after-request="this.reset()">
    <input type="text" name="message" placeholder="I'd like to...">
    <button>Send</button>
  </form>

</body>
</html>
