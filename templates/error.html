{% extends "base.html" %}
{% block title %}{{ code }} — Maestro{% endblock %}
{% block content %}
<div class="generating-wrap has-error">
  <div class="generating-error-card" style="text-align:center;">
    <div class="generating-error-icon" style="margin:0 auto 1rem;">
      {% if code == 403 %}
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
      </svg>
      {% elif code == 404 %}
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/>
        <polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/>
      </svg>
      {% elif code == 500 %}
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
        <line x1="12" y1="9" x2="12" y2="13"/>
        <line x1="12" y1="17" x2="12.01" y2="17"/>
      </svg>
      {% else %}
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/>
        <line x1="12" y1="8" x2="12" y2="12"/>
        <line x1="12" y1="16" x2="12.01" y2="16"/>
      </svg>
      {% endif %}
    </div>
    <p style="font-family:var(--f-serif);font-size:3rem;font-weight:700;color:var(--c-border);margin:0 0 0.75rem;line-height:1;">{{ code }}</p>
    <p class="generating-title">{{ message }}</p>
    {% if subtitle %}
    <p class="generating-sub">{{ subtitle }}</p>
    {% endif %}
    <div style="margin-top:1.25rem;">
      <a href="/lessons/" class="continue-btn">{{ t("error_back") }}</a>
    </div>
  </div>
</div>
{% endblock %}
