{% extends "base.html" %}
{% block title %}{{ code }} — Maestro{% endblock %}
{% block content %}
<div class="generating-wrap has-error">
  <div class="generating-error-card" style="text-align:center;">
    <p style="font-family:var(--f-serif);font-size:3rem;font-weight:700;color:var(--c-border);margin:0 0 0.75rem;line-height:1;">{{ code }}</p>
    <p class="generating-title">{{ message }}</p>
    <div style="margin-top:1.25rem;">
      <a href="/lezione/" class="continue-btn">{{ t("error_back") }}</a>
    </div>
  </div>
</div>
{% endblock %}
