{% extends "base.html" %}
{% block title %}{{ t("page_title_new_lesson") }} — Maestro{% endblock %}

{% block content %}
<div class="lesson-new">
  <h1>{{ t("new_lesson_title") }}</h1>
  <p class="subtitle">{{ t("new_lesson_subtitle") }}</p>

  <form method="post" action="/lezione/" onsubmit="this.querySelector('.btn-start').disabled=true; this.querySelector('.btn-start').textContent='{{ t("new_lesson_preparing") }}'">

    {% if cefr == "A0" %}
    <input type="hidden" name="duration" value="20">
    {% else %}
    <div class="form-section">
      <label class="section-label">{{ t("new_lesson_duration") }}</label>
      <div class="duration-options">
        <span>
          <input type="radio" name="duration" id="d10" value="10">
          <label for="d10">
            <span class="dur-min">10</span>
            <span class="dur-label">{{ t("new_lesson_minutes") }}</span>
          </label>
        </span>
        <span>
          <input type="radio" name="duration" id="d20" value="20" checked>
          <label for="d20">
            <span class="dur-min">20</span>
            <span class="dur-label">{{ t("new_lesson_minutes") }}</span>
          </label>
        </span>
        <span>
          <input type="radio" name="duration" id="d40" value="40">
          <label for="d40">
            <span class="dur-min">40</span>
            <span class="dur-label">{{ t("new_lesson_minutes") }}</span>
          </label>
        </span>
      </div>
    </div>
    {% endif %}

    <button class="btn-start" type="submit">{{ t("new_lesson_start") }}</button>
    <p class="loading-hint">{{ t("new_lesson_note") }}</p>
  </form>
</div>
{% endblock %}
