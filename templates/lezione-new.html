{% extends "base.html" %}
{% block title %}Nuova Lezione — Maestro{% endblock %}

{% block content %}
<div class="lesson-new">
  <h1>Nuova Lezione</h1>
  <p class="subtitle">Il tuo insegnante preparerà una lezione su misura per te.</p>

  <form method="post" action="/lezione/" onsubmit="this.querySelector('.btn-start').disabled=true; this.querySelector('.btn-start').textContent='Preparazione…'">

    {% if cefr == "A0" %}
    <input type="hidden" name="duration" value="20">
    {% else %}
    <div class="form-section">
      <label class="section-label">Quanto tempo hai?</label>
      <div class="duration-options">
        <span>
          <input type="radio" name="duration" id="d10" value="10">
          <label for="d10">
            <span class="dur-min">10</span>
            <span class="dur-label">minuti</span>
          </label>
        </span>
        <span>
          <input type="radio" name="duration" id="d20" value="20" checked>
          <label for="d20">
            <span class="dur-min">20</span>
            <span class="dur-label">minuti</span>
          </label>
        </span>
        <span>
          <input type="radio" name="duration" id="d40" value="40">
          <label for="d40">
            <span class="dur-min">40</span>
            <span class="dur-label">minuti</span>
          </label>
        </span>
      </div>
    </div>
    {% endif %}

    <button class="btn-start" type="submit">Inizia la lezione</button>
    <p class="loading-hint">La preparazione richiede qualche secondo.</p>
  </form>
</div>
{% endblock %}
