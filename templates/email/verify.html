<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body style="margin:0; padding:0; background-color:#f5f5f5; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; color:#1a1a1a; -webkit-text-size-adjust:100%;">
  <div style="max-width:560px; margin:0 auto; padding:40px 20px;">
    <div style="background-color:#ffffff; border-radius:8px; padding:40px 32px;">
      <h1 style="font-size:22px; font-weight:600; margin:0 0 16px 0; color:#1a1a1a;">{{ t("email_verify_heading") }}</h1>
      <p style="font-size:15px; line-height:1.6; color:#444; margin:0 0 24px 0;">{{ t("email_verify_body") }}</p>
      <a href="{{ verify_url }}" style="display:inline-block; background-color:#1a1a1a; color:#ffffff !important; text-decoration:none; padding:12px 28px; border-radius:6px; font-size:15px; font-weight:500;">{{ t("email_verify_cta") }}</a>
      <p style="font-size:13px; color:#888; margin:24px 0 0 0; line-height:1.5;">{{ t("email_verify_note") }}</p>
    </div>
    <div style="text-align:center; padding:24px 0 0 0; font-size:12px; color:#aaa;">Maestro</div>
  </div>
</body>
</html>
