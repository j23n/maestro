{% extends "base.html" %}
{% block title %}Scrittura — Maestro{% endblock %}

{% block content %}
<div class="activity-container">
  {% include "lezione-progress.html" %}

  <div class="card">
    <div class="card-label">Scrittura</div>
    <div class="prompt-text">{{ annotated_content | safe }}</div>

    <form hx-post="/lezione/{{ lesson.id }}/activity/{{ idx }}/writing-submit"
          hx-target=".activity-container"
          hx-swap="innerHTML"
          hx-on:htmx:before-request="this.querySelector('button[type=submit]').disabled=true; this.querySelector('button[type=submit]').textContent='Invio…'">
      <textarea class="answer-area"
                name="answer"
                placeholder="Scrivi qui la tua risposta in italiano…"
                required></textarea>
      <button class="submit-btn" type="submit">Invia</button>
    </form>
  </div>

  <a class="skip-link"
     hx-post="/lezione/{{ lesson.id }}/activity/{{ idx }}/skip"
     hx-target="body"
     hx-push-url="true"
     href="#">Salta →</a>
</div>
{% endblock %}
