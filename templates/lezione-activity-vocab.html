{% extends "base.html" %}
{% block title %}{{ activity.title }} — Maestro{% endblock %}

{% block content %}
<div class="activity-container">
  {% include "lezione-progress.html" %}

  <div class="card" id="practice-card">
    <div class="card-queue">{{ card_idx + 1 }} / {{ activity.card_ids | length }}</div>
    <div class="word">{{ card.word.word }}</div>

    <button class="reveal-btn"
            id="reveal-btn"
            hx-get="/lezione/{{ lesson.id }}/activity/{{ idx }}/vocab-reveal?card_idx={{ card_idx }}"
            hx-target="#practice-card"
            hx-swap="outerHTML">
      {{ t("vocab_reveal") }}
    </button>

    <script>
      document.addEventListener('keydown', function(e) {
        if (e.key === ' ' || e.key === 'Enter') {
          var btn = document.getElementById('reveal-btn');
          if (btn) { e.preventDefault(); btn.click(); }
        }
      });
    </script>
  </div>

  <div class="submit-row" style="justify-content:flex-end;">
    <a class="skip-link"
       hx-post="/lezione/{{ lesson.id }}/activity/{{ idx }}/skip"
       hx-target="body"
       href="#">{{ t("vocab_skip_activity") }}</a>
  </div>
</div>
{% endblock %}
