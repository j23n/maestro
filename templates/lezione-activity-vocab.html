{% extends "base.html" %}
{% block title %}{{ activity.title }} — Maestro{% endblock %}

{% block content %}
<div class="activity-container">
  {% include "lezione-progress.html" %}
  {% include "vocab-card-front.html" %}

  {% if card and not is_complete %}
  <div class="submit-row" style="justify-content:flex-end;">
    <a class="skip-link"
       hx-post="/lezione/{{ lesson.id }}/activity/{{ idx }}/skip"
       hx-target="body"
       href="#">{{ t("vocab_skip_activity") }}</a>
  </div>
  {% endif %}
</div>
{% endblock %}
