{% extends "base.html" %}
{% block title %}Maestro — {{ t("page_title_students") }}{% endblock %}
{% block content %}
<h1>{{ t("students_title") }}</h1>

{% if students %}
<div class="student-grid">
  {% for s in students %}
  <div class="student-card-form">
    <form method="post" action="/students/{{ s.id }}/select">
      <button type="submit" class="student-card">{{ s.name or t("students_default_name") }}</button>
    </form>
    <button hx-delete="/students/{{ s.id }}"
            hx-confirm="{{ t('students_delete_confirm') }}"
            hx-target="closest .student-card-form"
            hx-swap="delete"
            class="delete-btn">&times;</button>
  </div>
  {% endfor %}
</div>
{% endif %}

<form method="post" action="/students/" class="new-student-form">
  <button type="submit">{{ t("students_new") }}</button>
</form>
{% endblock %}
