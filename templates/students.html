{% extends "base.html" %}
{% block title %}Maestro — {{ t("page_title_students") }}{% endblock %}
{% block content %}
<h1>{{ t("students_title") }}</h1>

{% if students %}
<div class="student-grid">
  {% for s in students %}
  <form method="post" action="/students/{{ s.id }}/select" class="student-card-form">
    <button type="submit" class="student-card">{{ s.name }}</button>
  </form>
  {% endfor %}
</div>
{% endif %}

<h2>{{ t("students_new") }}</h2>
<form method="post" action="/students/" class="new-student-form">
  <input type="text" name="name" placeholder="{{ t("students_name_placeholder") }}" required autofocus>
  <button type="submit">{{ t("students_create_btn") }}</button>
</form>
{% endblock %}
