<!doctype html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Maestro{% endblock %}</title>
  <script src="https://unpkg.com/htmx.org"></script>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div id="vocab-tooltip">
    <div class="tt-header">
      <span class="tt-word"></span>
      <span class="tt-pos"></span>
    </div>
    <div class="tt-syllabization"></div>
    <div class="tt-senses"></div>
    <div class="tt-translation"></div>
    <a class="tt-more" href="#">→ definizione completa</a>
  </div>
  <nav>
    <div class="site-container">
      <a href="/lezione/">Lezione</a>
      <a href="/vocab">Vocabolario</a>
      <a href="/profilo">Profilo</a>
    </div>
  </nav>
  <div class="site-container">
    {% block content %}{% endblock %}
  </div>

  <script>
    const tooltip = document.getElementById('vocab-tooltip');
    document.addEventListener('mouseover', e => {
      const word = e.target.closest('.vocab-word');
      if (!word) return;
      tooltip.querySelector('.tt-word').textContent = word.dataset.word || '';
      tooltip.querySelector('.tt-pos').textContent = word.dataset.pos || '';
      const syl = word.dataset.syllabization;
      tooltip.querySelector('.tt-syllabization').textContent = syl ? '[' + syl + ']' : '';

      const sensesEl = tooltip.querySelector('.tt-senses');
      sensesEl.innerHTML = '';
      let senses = [];
      try { senses = JSON.parse(word.dataset.senses || '[]'); } catch(_) {}
      const shown = senses.slice(0, 3);
      shown.forEach((s, i) => {
        const wrap = document.createElement('div');
        wrap.className = 'tt-sense';
        const defLine = document.createElement('div');
        defLine.textContent = (shown.length > 1 ? (i + 1) + '. ' : '') + s.definition;
        wrap.appendChild(defLine);
        if (s.examples && s.examples[0]) {
          const ex = document.createElement('div');
          ex.className = 'tt-example';
          ex.textContent = s.examples[0];
          wrap.appendChild(ex);
        }
        if (s.translation) {
          const tr = document.createElement('div');
          tr.className = 'tt-sense-translation';
          tr.textContent = 'English: ' + s.translation;
          wrap.appendChild(tr);
        }
        sensesEl.appendChild(wrap);
      });

      tooltip.querySelector('.tt-translation').textContent = word.dataset.translation || '';

      const link = tooltip.querySelector('.tt-more');
      const entryId = word.dataset.entryId;
      if (entryId) {
        link.href = '/vocab/word/' + entryId;
        link.style.display = 'block';
      } else {
        link.style.display = 'none';
      }

      const r = word.getBoundingClientRect();
      tooltip.style.display = 'block';
      const gap = 8;
      let top = r.bottom + gap;
      if (top + tooltip.offsetHeight > window.innerHeight) top = r.top - tooltip.offsetHeight - gap;
      tooltip.style.top = top + 'px';
      tooltip.style.left = Math.min(r.left, window.innerWidth - tooltip.offsetWidth - 8) + 'px';
    });
    document.addEventListener('mouseout', e => {
      if (!e.target.closest('.vocab-word')) return;
      tooltip.style.display = 'none';
    });
  </script>
</body>
</html>
