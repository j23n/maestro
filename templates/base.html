<!doctype html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Maestro{% endblock %}</title>
  <script src="https://unpkg.com/htmx.org"></script>
  <link rel="stylesheet" href="/static/style.css">
  {% block head %}{% endblock %}
</head>
<body>
  <div id="vocab-tooltip">
    <div class="tt-header">
      <span class="tt-word"></span>
      <span class="tt-pos"></span>
      <span class="tt-syllabization"></span>
    </div>
    <div class="tt-senses"></div>
  </div>
  <nav>
    <div class="site-container">
      <a href="/lezione/" {% if request.url.path.startswith('/lezione') %}class="active"{% endif %}>{{ t("nav_lesson") }}</a>
      <a href="/vocab" {% if request.url.path.startswith('/vocab') %}class="active"{% endif %}>{{ t("nav_vocab") }}</a>
      <a href="/grammar" {% if request.url.path.startswith('/grammar') %}class="active"{% endif %}>{{ t("nav_grammar") }}</a>
      <a href="/profilo" {% if request.url.path.startswith('/profilo') %}class="active"{% endif %}>{{ t("nav_profile") }}</a>
      {% if request.state.student is defined and request.state.student %}
      <span class="student-name">{{ request.state.student.name or t("students_default_name") }}</span>
      <form method="post" action="/auth/logout" style="display:inline">
        <button type="submit" class="nav-logout">{{ t("nav_logout") }}</button>
      </form>
      {% endif %}
    </div>
  </nav>
  <div class="site-container">
    {% block content %}{% endblock %}
  </div>

  <script>
    // CSRF: send token header on HTMX requests
    document.addEventListener('htmx:configRequest', function(evt) {
      var m = document.cookie.match(/csrftoken=([^;]+)/);
      if (m) evt.detail.headers['x-csrftoken'] = m[1];
    });
    // CSRF: inject hidden field on plain form submissions
    document.addEventListener('submit', function(evt) {
      var form = evt.target;
      if (form.method.toLowerCase() !== 'post') return;
      if (form.querySelector('input[name="csrftoken"]')) return;
      var m = document.cookie.match(/csrftoken=([^;]+)/);
      if (m) {
        var input = document.createElement('input');
        input.type = 'hidden';
        input.name = 'csrftoken';
        input.value = m[1];
        form.appendChild(input);
      }
    });
  </script>
  <script>
    const tooltip = document.getElementById('vocab-tooltip');
    document.addEventListener('mouseover', e => {
      const word = e.target.closest('.vocab-word');
      if (!word) return;
      tooltip.querySelector('.tt-word').textContent = word.dataset.word || '';
      tooltip.querySelector('.tt-pos').textContent = word.dataset.pos || '';
      const syl = word.dataset.syllabization;
      tooltip.querySelector('.tt-syllabization').textContent = syl ? '[' + syl + ']' : '';

      const sensesEl = tooltip.querySelector('.tt-senses');
      sensesEl.innerHTML = '';
      let senses = [];
      try { senses = JSON.parse(word.dataset.senses || '[]'); } catch(_) {}
      const shown = senses.slice(0, 3);
      shown.forEach((s, i) => {
        const wrap = document.createElement('div');
        wrap.className = 'tt-sense';
        const defLine = document.createElement('div');
        defLine.textContent = (shown.length > 1 ? (i + 1) + '. ' : '') + s.definition;
        if (s.translation) {
          defLine.textContent += ' (' + s.translation + ')';
        }

        wrap.appendChild(defLine);
        if (s.examples && s.examples[0]) {
          const ex = document.createElement('div');
          ex.className = 'tt-example';
          ex.textContent = s.examples[0];
          wrap.appendChild(ex);
        }

        sensesEl.appendChild(wrap);
      });

      const entryId = word.dataset.entryId;

      const r = word.getBoundingClientRect();
      tooltip.style.display = 'block';
      const gap = 8;
      let top = r.bottom + gap;
      if (top + tooltip.offsetHeight > window.innerHeight) top = r.top - tooltip.offsetHeight - gap;
      tooltip.style.top = top + 'px';
      tooltip.style.left = Math.min(r.left, window.innerWidth - tooltip.offsetWidth - 8) + 'px';
    });
    document.addEventListener('mouseout', e => {
      if (!e.target.closest('.vocab-word')) return;
      tooltip.style.display = 'none';
    });
    document.addEventListener('click', e => {
      var toggle = e.target.closest('.translation-toggle');
      if (toggle) toggle.classList.toggle('revealed');
    });
  </script>
</body>
</html>
