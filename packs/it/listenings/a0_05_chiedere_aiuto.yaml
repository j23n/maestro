  id: listening.chiedere_aiuto.001
  cefr_level: A0
  title: Non ho capito
  turns:
    - { speaker: "Marco", text: "Scusi, signora!" }
    - { speaker: "Signora", text: "Sì, prego." }
    - { speaker: "Marco", text: "Non parlo bene italiano. Mi può aiutare?" }
    - { speaker: "Signora", text: "Certo!" }
    - { speaker: "Marco", text: "Dov'è il bagno?" }
    - { speaker: "Signora", text: "Il bagno è lì, al bar." }
    - { speaker: "Marco", text: "Scusi, non ho capito." }
    - { speaker: "Signora", text: "Al bar. Lì." }
    - { speaker: "Marco", text: "Va bene. Grazie mille!" }
    - { speaker: "Signora", text: "Prego!" }
  audio: null
  questions:
    - prompt: "Che cosa cerca Marco?"
      answers:
        - { text: "il bagno", canonical: true }
        - { text: "bagno" }
      explanation: "«Dov'è il bagno?»"
    - prompt: "Dov'è il bagno?"
      answers:
        - { text: "al bar", canonical: true }
        - { text: "bar" }
      explanation: "«Il bagno è lì, al bar.»"
    - prompt: "Che cosa dice Marco quando non capisce?"
      answers:
        - { text: "non ho capito", canonical: true }
        - { text: "scusi, non ho capito" }
      explanation: "«Scusi, non ho capito» — and she says it again, shorter."
