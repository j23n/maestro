# d2: the night porter. He asks nothing twice, so the name and the number
# have to come out together.
- status: draft
  scenario_ids: [a0-02-in-albergo]
  lesson_id: a0-02-in-albergo.d2
  id: listening.in_albergo.002
  cefr_level: A0
  title: La chiave
  turns:
    - { speaker: "Anna", text: "Buonasera." }
    - { speaker: "Portiere", text: "Buonasera, signora. Come si chiama?" }
    - { speaker: "Anna", text: "Mi chiamo Anna Rossi. La chiave della camera quindici, per favore." }
    - { speaker: "Portiere", text: "Un momento... la quindici. Ecco." }
    - { speaker: "Anna", text: "Grazie mille. Buonanotte." }
    - { speaker: "Portiere", text: "Buonanotte, signora Rossi." }
  audio: null
  questions:
    - prompt: "Che cosa vuole Anna?"
      answers:
        - { text: "la chiave", canonical: true }
        - { text: "chiave" }
        - { text: "la chiave della camera" }
      explanation: "«La chiave della camera quindici, per favore.»"
    - prompt: "Qual è il numero della camera?"
      answers:
        - { text: "quindici", canonical: true }
        - { text: "15" }
        - { text: "la quindici" }
      explanation: "«La chiave della camera quindici.»"
    - prompt: "Come si saluta di notte?"
      answers:
        - { text: "buonanotte", canonical: true }
        - { text: "buonasera" }
      explanation: "«Buonanotte» on the way to bed; «buonasera» on the way in."
  evidence:
