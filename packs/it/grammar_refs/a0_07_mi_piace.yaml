  id: grammar_ref.art_i_le
  item_type: grammar_ref
  cefr_level: A0
  grammar_id: art_i_le
  title: "The plural \"the\" — i and le"
  body_md: |
    You already have **il** and **la** for one thing. For more than one,
    each of them has a plural partner.

    | Singular | Plural | Example |
    |---|---|---|
    | **il** piatto | **i** piatti | i piatti sono caldi |
    | **la** mela | **le** mele | le mele sono buone |
    | **lo** spaghetto, **l'**amico | **gli** spaghetti, **gli** amici | gli spaghetti al pomodoro |

    **il → i, la → le.** That covers almost everything. The odd one out is
    **gli**, which replaces *lo* and *l'* — masculine words starting with a
    vowel or with s + consonant.

    The noun changes ending too: **-o → -i** (piatto, piatti) and
    **-a → -e** (mela, mele). Words ending in **-e** go to **-i**
    (dolce, dolci) whichever gender they are.

    This is where *mi piacciono* lives: **mi piacciono i dolci**, **mi
    piacciono le mele**. Plural article, plural verb.
  examples:
    - I dolci sono buoni.
    - Le mele sono buone.
    - Mi piacciono i piatti caldi.
    - Non mi piacciono le insalate.
    - Gli spaghetti al pomodoro sono molto buoni.
  evidence:
    - { axis: grammar, id: art_i_le, weight: 1.0 }
    - { axis: grammar, id: art_il_la, weight: 0.5 }
