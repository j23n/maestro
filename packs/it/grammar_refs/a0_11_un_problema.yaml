- status: draft
  scenario_ids: [a0-11-un-problema]
  lesson_id: a0-11-un-problema.d1
  id: grammar_ref.avere_pre
  item_type: grammar_ref
  cefr_level: A0
  grammar_id: avere_pre
  title: avere — ho, hai, ha
  body_md: |
    *Avere* is *to have*. Three forms carry the whole of A0:

    | | |
    |---|---|
    | io | **ho** |
    | tu | **hai** |
    | lui / lei / Lei | **ha** |

    **The h is silent.** *Ho* sounds like the letter *o*, *hai* like *ai*.
    It is written only to keep these forms apart from *o* (or) and *ai*
    (to the). Say them, and nobody hears the h; write them, and it has to
    be there.

    **Italian *has* states that English *is*.** Where English says *I am
    cold*, Italian says *I have cold*:

    - *Ho freddo.* — I'm cold.
    - *Ho caldo.* — I'm hot.
    - *Ho fame.* — I'm hungry.

    Never *sono freddo* — that would describe your character, not your
    evening. The same *ho* opens a problem: *Ho un problema.*

    **Formal you takes *ha*.** The pharmacist, the receptionist, the man
    at the counter will all ask you *Ha i documenti?* — same form as
    *he/she has*. It is the polite one, not a mistake.
  examples:
    - Ho un problema.
    - Hai fame?
    - Non ho la chiave.
    - Ha freddo?
    - Ho caldo e sono stanco.
  evidence:
    - { axis: grammar, id: avere_pre, weight: 1.0 }

- status: draft
  scenario_ids: [a0-11-un-problema]
