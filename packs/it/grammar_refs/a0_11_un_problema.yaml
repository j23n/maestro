  id: grammar_ref.si_no_non
  item_type: grammar_ref
  cefr_level: A0
  grammar_id: si_no_non
  title: sì, no, non
  body_md: |
    Three words, and one rule about where the third goes.

    **sì** — yes. The accent matters: *sì* is *yes*, *si* without it is a
    different word entirely.

    **no** — no, as a whole answer. *— Hai fame? — No.*

    **non** — *not*, and it goes **directly in front of the verb**:

    - *Non capisco.* — I don't understand.
    - *Non trovo la valigia.* — I can't find the suitcase.
    - *Non è mio.* — It isn't mine.

    Nothing gets between *non* and the verb, and there is no extra word
    to insert: Italian has no *do*, so *I don't have* is simply *non ho*.

    **no and non are not swappable.** *No* answers a question; *non*
    negates a verb. A full answer usually needs both:

    - *— Ha fame? — No, non ho fame.*

    Say only *non ho fame* and you have answered; say only *no* and you
    have answered too. The pair is what a native speaker actually says.
  examples:
    - Sì, ho fame.
    - No, non ho fame.
    - Non trovo la valigia.
    - Non è mio.
    - La farmacia non è aperta.
  evidence:
    - { axis: grammar, id: si_no_non, weight: 1.0 }
