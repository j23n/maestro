  item_type: grammar_ref
  cefr_level: A0
  grammar_id: ore_giorni
  title: Telling the time, and the days of the week
  body_md: |
    ## What time is it?

    Ask with **Che ore sono?** Answer with **Sono le** + the hour:

    | | |
    |---|---|
    | Sono le due. | It's two o'clock. |
    | Sono le dieci e venti. | It's twenty past ten. |
    | Sono le sedici e trenta. | It's 16:30. |

    **One exception, and only one:** one o'clock is singular, so it takes
    *è* and *l'* — **È l'una.**

    Minutes are added with **e**: *le nove e quindici*, *le nove e trenta*.

    ## At what time?

    **A che ora...?** — and the answer takes **alle** (a + le):
    *alle otto*, *alle quattordici e trenta*. One o'clock is again the odd
    one out: **all'una**.

    Timetables, shops and stations use the 24-hour clock, so an evening
    time is spoken as *le venti*, not *le otto di sera*. Both are correct;
    the door of a shop will show you the first.

    ## The days

    | lunedì | martedì | mercoledì | giovedì | venerdì | sabato | domenica |
    |---|---|---|---|---|---|---|
    | Mon | Tue | Wed | Thu | Fri | Sat | Sun |

    They are not capitalised. The first five end in a stressed **-ì**.

    **The article changes the meaning.** *Lunedì il negozio è chiuso* — this
    coming Monday. *Il lunedì il negozio è chiuso* — every Monday. A sign on
    a door means the second one.
  examples:
    - Che ore sono? Sono le tre.
    - È l'una.
    - A che ora parte il treno?
    - Il treno parte alle otto e quindici.
    - Oggi è lunedì.
    - Il mercato è chiuso il lunedì.
