  id: reading.a_pranzo.001
  cefr_level: A0
  title: Il menù
  text: 'Il menù di un ristorante italiano è breve. C''è la pasta, c''è la carne o

    il pesce, c''è l''insalata e poi c''è il dolce.


    «Buongiorno. Ecco il menù.»


    «Grazie. Cos''è il piatto del giorno?»


    «Oggi è pollo con l''insalata.»


    «Va bene, prendo il piatto del giorno. E il pane, per favore.»


    «Da bere?»


    «Un''acqua naturale, grazie.»

    '
  glossary:
    poi: then
    cliente: customer
    Da bere?: Anything to drink?
  questions:
  - prompt: Che cosa è il piatto del giorno?
    answers:
    - text: pollo con l'insalata
      canonical: true
    - text: il pollo con l'insalata
    - text: pollo
    explanation: «Oggi è pollo con l'insalata.»
  - prompt: Che cosa ordina il cliente?
    answers:
    - text: il piatto del giorno
      canonical: true
    - text: il piatto del giorno e il pane
    explanation: «Va bene, prendo il piatto del giorno.»
  - prompt: Che cosa prende da bere?
    answers:
    - text: un'acqua naturale
      canonical: true
    - text: acqua naturale
    - text: acqua
    explanation: «Un'acqua naturale, grazie.»
