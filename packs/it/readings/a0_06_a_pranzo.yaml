  id: reading.a_pranzo.003
  cefr_level: A0
  title: All'una, al banco
  text: 'A pranzo il ristorante è pieno e la gente aspetta al banco. Ci sono

    quattro piatti caldi, ma niente nomi.


    «Prego, signore?»


    «Un momento, scusi. Cos''è?»


    «Pasta al formaggio.»


    «E che cosa sono?»


    «Sono panini: prosciutto, formaggio, pomodoro.»


    «Va bene. Vorrei la pasta al formaggio e un panino al prosciutto.»


    «Insalata?»


    «Sì, grazie. E un''acqua naturale. Quanto costa tutto?»


    «Nove euro e cinquanta. Il tavolo è lì, vicino alla porta.»

    '
  glossary:
    gente: people
    niente: no / nothing
    tutto: everything (in tutto = altogether)
    vicino: near
    cliente: customer
  questions:
  - prompt: Che cosa c'è al banco?
    answers:
    - text: quattro piatti caldi
      canonical: true
    - text: piatti caldi
    - text: quattro piatti
    explanation: «Al banco ci sono quattro piatti caldi, ma niente nomi.»
  - prompt: Che cosa sono i panini?
    answers:
    - text: prosciutto, formaggio, pomodoro
      canonical: true
    - text: panini al prosciutto, al formaggio e al pomodoro
    explanation: '«Sono panini: prosciutto, formaggio, pomodoro.» Plural things → «sono».'
  - prompt: Che cosa ordina il cliente?
    answers:
    - text: la pasta al formaggio e un panino al prosciutto
      canonical: true
    - text: pasta al formaggio e panino al prosciutto
    explanation: «Vorrei la pasta al formaggio e un panino al prosciutto.»
  - prompt: Quanto costa il pranzo?
    answers:
    - text: nove euro e cinquanta
      canonical: true
    - text: 9,50
    - text: '9.50'
    explanation: «Nove euro e cinquanta.»
