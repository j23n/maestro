  id: reading.a_pranzo.002
  cefr_level: A0
  title: Il piatto del giorno
  text: 'Giovedì il menù non c''è. Il cameriere arriva al tavolo e dice i piatti

    di oggi, veloce.


    «Oggi abbiamo pasta al pomodoro, pollo con l''insalata, pesce, e per

    dolce la frutta.»


    Anna capisce la pasta e il pollo, ma il dolce no.


    «Scusi, non capisco. Cos''è il dolce di oggi?»


    «Frutta: una mela, o il gelato.»


    «Va bene. Prendo la pasta al pomodoro e una mela, grazie.»


    «E da bere?»


    «Un bicchiere di vino, per favore.»

    '
  glossary:
    cameriere: waiter
    abbiamo: we have
    Da bere?: Anything to drink?
  questions:
  - prompt: Che cosa dice il cameriere al tavolo?
    answers:
    - text: i piatti di oggi
      canonical: true
    - text: i piatti del giorno
    - text: piatti di oggi
    explanation: «dice i piatti di oggi, veloce» — nothing is written down.
  - prompt: Che cosa non capisce Anna?
    answers:
    - text: il dolce
      canonical: true
    - text: il dolce di oggi
    - text: dolce
    explanation: «Scusi, non capisco. Cos'è il dolce di oggi?»
  - prompt: Che cosa ordina Anna?
    answers:
    - text: la pasta al pomodoro e una mela
      canonical: true
    - text: pasta al pomodoro e mela
    - text: la pasta e una mela
    explanation: «Prendo la pasta al pomodoro e una mela, grazie.»
  - prompt: Che cosa prende da bere?
    answers:
    - text: un bicchiere di vino
      canonical: true
    - text: vino
    explanation: «Un bicchiere di vino, per favore.»
