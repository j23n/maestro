  id: reading.conoscere.003
  cefr_level: A0
  title: Domenica in piazza
  text: 'È domenica e la piazza è piena. Marco arriva e saluta gli amici.


    — Ciao Giulia, come stai?


    — Bene, grazie. Marco, lei è la mia amica Anna.


    — Piacere, Anna. Io sono Marco. Di dove sei?


    — Sono inglese, sono di Londra. Ma adesso abito qui a Firenze.


    — Anna è studentessa — dice Giulia. — Studia italiano.


    — E lui? — dice Anna.


    — Marco lavora in un negozio, in centro. È il mio amico.


    — Anna, il tuo numero di telefono? — dice Marco. — Domenica siamo

    sempre qui in piazza.

    '
  questions:
  - prompt: Dove abita Anna adesso?
    answers:
    - text: a Firenze
      canonical: true
    - text: Firenze
    explanation: «Sono di Londra. Ma adesso abito qui a Firenze.»
  - prompt: Dove lavora Marco?
    answers:
    - text: in un negozio
      canonical: true
    - text: negozio
    explanation: «Marco lavora in un negozio, in centro.»
  - prompt: Che cosa studia Anna?
    answers:
    - text: italiano
      canonical: true
    explanation: «Anna è studentessa. Studia italiano.»
  - prompt: Chi saluta gli amici in piazza?
    answers:
    - text: Marco
      canonical: true
    explanation: «Marco arriva e saluta gli amici.»
