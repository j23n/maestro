  title: Di dove sei?
  text: '— Ciao! Sono Luca. Come ti chiami?


    — Mi chiamo Anna. Piacere.


    — Piacere. Di dove sei, Anna?


    — Sono inglese, sono di Londra. E tu?


    — Io sono di Roma, ma abito a Milano.


    — Sei studente?


    — No, sono barista. E tu?


    — Io sono studentessa.

    '
  questions:
  - prompt: Di dov'è Anna?
    answers:
    - text: di Londra
      canonical: true
    - text: Londra
    - text: è inglese
    explanation: «Sono inglese, sono di Londra.»
  - prompt: Dove abita Luca?
    answers:
    - text: a Milano
      canonical: true
    - text: Milano
    explanation: «Io sono di Roma, ma abito a Milano» — born in one city, living in another.
  - prompt: Chi è la studentessa?
    answers:
    - text: Anna
      canonical: true
    explanation: «Io sono studentessa», dice Anna. Luca è barista.
