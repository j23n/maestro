  title: Luca e Giulia
  text: 'Luca è di Roma, ma abita a Milano. Lavora in un bar in centro.


    La sua amica Giulia non è di Milano: è di Firenze. Non è studentessa,

    lavora in un museo.


    Giulia parla inglese molto bene, perché la sua amica Anna è di Londra.

    Anna studia italiano a Firenze.

    '
