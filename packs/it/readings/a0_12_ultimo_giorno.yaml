  id: reading.ultimo_giorno.002
  cefr_level: A0
  title: Tre volte grazie
  text: 'Oggi Anna parte. Adesso è in albergo, con la valigia.


    «Buongiorno, signora. Grazie mille per la camera. L''albergo è molto

    bello.»


    «Grazie a lei! Buona giornata.»


    Anna va anche in farmacia.


    «Grazie per l''aiuto di ieri. Adesso sto bene.»


    «Bene! Arrivederci, signora.»


    In piazza c''è Luca.


    «Ciao, Luca. Io parto oggi. Mi piace molto la tua città.»


    «Ciao, Anna! Ci vediamo.»

    '
  questions:
  - prompt: Perché Anna dice grazie in farmacia?
    answers:
    - text: per l'aiuto
      canonical: true
    - text: per l'aiuto di ieri
    - text: l'aiuto
    explanation: «Grazie per l'aiuto di ieri.»
  - prompt: Che cosa piace ad Anna?
    answers:
    - text: la città
      canonical: true
    - text: la città di Luca
    - text: mi piace molto la tua città
    explanation: «Mi piace molto la tua città.»
  - prompt: Come saluta Anna la signora dell'albergo?
    answers:
    - text: buongiorno
      canonical: true
    - text: buongiorno, signora
    explanation: «Buongiorno, signora.» — «arrivederci» is for the pharmacist, «ciao» only
      for Luca.
