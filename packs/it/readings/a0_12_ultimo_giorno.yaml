  title: L'ultimo caffè
  text: 'Marco è al bar. È mattina e il bar è aperto.


    «Buongiorno! Vorrei un caffè e un cornetto, per favore.»


    «Ecco. Sono tre euro.»


    «Grazie. Ecco i soldi.»


    Marco paga e beve il caffè al banco, in piedi.


    «Oggi parto. Il volo è alle sei.»


    «Parte oggi! Buona giornata, signore.»


    «Grazie mille. Arrivederci!»

    '
  questions:
  - prompt: Che cosa prende Marco?
    answers:
    - text: un caffè e un cornetto
      canonical: true
    - text: caffè e cornetto
    - text: un caffè e un cornetto, per favore
    explanation: «Vorrei un caffè e un cornetto, per favore.»
  - prompt: Quanto paga Marco?
    answers:
    - text: tre euro
      canonical: true
    - text: tre
    explanation: «Sono tre euro.»
  - prompt: Come saluta Marco?
    answers:
    - text: arrivederci
      canonical: true
    - text: grazie mille, arrivederci
    - text: grazie mille e arrivederci
    explanation: «Grazie mille. Arrivederci!» — the thanks and the goodbye are two moves,
      not one.
