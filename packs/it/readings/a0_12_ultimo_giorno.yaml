  title: Uscita B14
  text: 'All''aeroporto. Marco aspetta all''uscita. Una signora aspetta con lui.


    «Buongiorno. Lei è italiano?»


    «No, non sono italiano. Sono inglese, ma abito a Roma. Mi chiamo

    Marco.»


    «Io mi chiamo Giulia e sono di Milano. A che ora parte l''aereo?»


    «Alle sei e venti. Arrivo a Londra alle otto.»


    «Anche io vado a Londra! Lavoro lì.»


    «Bene! Buona giornata, signora.»


    «Grazie, anche a lei. Arrivederci!»

    '
  questions:
  - prompt: Marco è italiano?
    answers:
    - text: no, non è italiano
      canonical: true
    - text: 'no'
    - text: no, è inglese
    explanation: «No, non sono italiano. Sono inglese, ma abito a Roma.»
  - prompt: Di dove è Giulia?
    answers:
    - text: di Milano
      canonical: true
    - text: Milano
    explanation: «Io mi chiamo Giulia e sono di Milano.»
  - prompt: A che ora parte l'aereo?
    answers:
    - text: alle sei e venti
      canonical: true
    - text: sei e venti
    - text: alle sei e venti di mattina
    explanation: «Alle sei e venti.» — the hour takes «alle», not «a».
  - prompt: Dove lavora Giulia?
    answers:
    - text: a Londra
      canonical: true
    - text: Londra
    explanation: «Anche io vado a Londra! Lavoro lì.»
