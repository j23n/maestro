  title: Caffè o tè?
  text: 'L''assistente arriva con il caffè e il tè.


    «Buongiorno, signora. Un caffè?»


    «No, grazie. Un tè, per favore.»


    «Ecco a lei. Zucchero?»


    «Sì, grazie mille.»


    «Prego. Il volo arriva a Roma alle undici.»


    «Bene, grazie!»

    '
  glossary:
    Ecco a lei: Here you are (formal)
  questions:
  - prompt: Che cosa prende la signora?
    answers:
    - text: un tè
      canonical: true
    - text: tè
    - text: il tè
    explanation: «No, grazie. Un tè, per favore.»
  - prompt: La signora dice sì o no allo zucchero?
    answers:
    - text: sì
      canonical: true
    - text: si
    explanation: «Zucchero?» — «Sì, grazie mille.»
  - prompt: A che ora arriva il volo a Roma?
    answers:
    - text: alle undici
      canonical: true
    - text: undici
    - text: '11'
    explanation: «Il volo arriva a Roma alle undici.»
