  id: reading.in_aereo.003
  cefr_level: A0
  title: Allo sbarco
  text: 'L''aereo arriva a Roma alle nove. Anna prende la valigia e va

    all''uscita.


    L''assistente è alla porta.


    «Arrivederci, signora. Buona giornata!»


    «Grazie, arrivederci!»


    Anna non trova l''uscita. Una signora è in piedi lì.


    «Scusi, dov''è l''uscita?»


    «L''uscita è lì.»


    «Grazie mille!»


    Il signore del passaporto dice:


    «Buonasera. Il passaporto, per favore.»


    «Ecco.»


    «Grazie. È italiana?»


    «No, sono inglese.»


    «Va bene. Benvenuta a Roma!»


    «Grazie. Arrivederci!»

    '
  glossary:
    Buona giornata: Have a good day
    Va bene: All right / fine
  questions:
  - prompt: Che cosa prende Anna?
    answers:
    - text: la valigia
      canonical: true
    - text: valigia
    explanation: «Anna prende la valigia e va all'uscita.»
  - prompt: Che cosa dice Anna all'assistente alla porta?
    answers:
    - text: grazie, arrivederci
      canonical: true
    - text: arrivederci
    - text: grazie
    explanation: The crew says «arrivederci» first; Anna gives it back with a «grazie».
  - prompt: Anna è italiana o inglese?
    answers:
    - text: inglese
      canonical: true
    - text: è inglese
    explanation: «È italiana?» — «No, sono inglese.»
  - prompt: Dove arriva l'aereo?
    answers:
    - text: a Roma
      canonical: true
    - text: Roma
    explanation: «L'aereo arriva a Roma alle nove.»
