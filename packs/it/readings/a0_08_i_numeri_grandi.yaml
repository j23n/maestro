  title: La porta del negozio
  text: 'Il negozio di Marco è in centro, in piazza Garibaldi. Sulla porta ci

    sono i giorni e le ore:


    lunedì: chiuso

    da martedì a sabato: aperto dalle nove alle tredici e dalle sedici alle venti

    domenica: aperto la mattina


    Marco lavora sempre. «Il lunedì no,» dice. «Il lunedì è la mia

    giornata libera.»

    '
  questions:
  - prompt: Quando è chiuso il negozio?
    answers:
    - text: il lunedì
      canonical: true
    - text: lunedì
    explanation: '«lunedì: chiuso» — and Marco says so himself.'
  - prompt: A che ora è aperto il negozio la mattina?
    answers:
    - text: dalle nove alle tredici
      canonical: true
    - text: dalle 9 alle 13
    explanation: «aperto dalle nove alle tredici e dalle sedici alle venti».
  - prompt: Che giorno è aperto la mattina e non il pomeriggio?
    answers:
    - text: domenica
      canonical: true
    - text: la domenica
    explanation: '«domenica: aperto la mattina».'
