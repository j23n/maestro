  title: Ci vediamo mercoledì
  text: 'Giulia e Marco vogliono vedere il museo in centro.


    «Ci vediamo martedì?» dice Giulia.


    «Martedì non posso. Mercoledì?»


    «Mercoledì va bene. A che ora?»


    «Alle quindici e trenta. Il museo è aperto dalle dieci alle diciotto.»


    «Va bene. Quanto costa il biglietto?»


    «Dodici euro. La domenica non si paga.»


    Mercoledì Giulia arriva alle quindici e venti. Marco arriva alle

    sedici.


    «Scusa!» dice Marco.


    «Non c''è problema,» dice Giulia. «Il museo è aperto.»

    '
  questions:
  - prompt: Che giorno vedono il museo?
    answers:
    - text: mercoledì
      canonical: true
    - text: il mercoledì
    explanation: Marco cannot do Tuesday, so they settle on «Mercoledì va bene».
  - prompt: A che ora arriva Giulia?
    answers:
    - text: alle quindici e venti
      canonical: true
    - text: '15:20'
    explanation: «Giulia arriva alle quindici e venti» — forty minutes before Marco.
  - prompt: Quanto costa il biglietto?
    answers:
    - text: dodici euro
      canonical: true
    - text: 12 euro
    explanation: «Dodici euro. La domenica non si paga.»
  - prompt: Quando non si paga il biglietto?
    answers:
    - text: la domenica
      canonical: true
    - text: domenica
    explanation: «La domenica non si paga.»
