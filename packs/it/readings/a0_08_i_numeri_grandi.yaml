  title: Il banco della frutta
  text: 'Sabato mattina, al mercato. Il banco della frutta è aperto dalle sette

    alle quattordici.


    «Quanto costano le mele?» dice una signora.


    «Sei euro,» dice il signore del banco.


    «E i pomodori?»


    «Tre euro. Sono nove euro.»


    La signora paga con venti euro.


    «Ecco undici euro,» dice il signore. «Il mercato è chiuso il lunedì e

    il mercoledì pomeriggio. Buona giornata!»

    '
  questions:
  - prompt: Quanto costano le mele?
    answers:
    - text: sei euro
      canonical: true
    - text: 6 euro
    explanation: «Sei euro,» dice il signore del banco.
  - prompt: Quanto paga la signora?
    answers:
    - text: nove euro
      canonical: true
    - text: 9 euro
    explanation: Sei euro di mele e tre euro di pomodori — nove euro.
  - prompt: A che ora è aperto il banco della frutta?
    answers:
    - text: dalle sette alle quattordici
      canonical: true
    - text: dalle 7 alle 14
    explanation: «aperto dalle sette alle quattordici».
  - prompt: Quando è chiuso il mercato?
    answers:
    - text: il lunedì e il mercoledì pomeriggio
      canonical: true
    - text: lunedì e mercoledì pomeriggio
    explanation: «Il mercato è chiuso il lunedì e il mercoledì pomeriggio.»
