  cefr_level: A0
  title: In farmacia
  text: 'È domenica sera. Paolo non sta bene: è stanco, ha freddo e non ha fame.


    La farmacia del centro è chiusa, ma in piazza c''è una farmacia aperta.


    «Buonasera. Mi può aiutare? Non sto bene.»


    «Certo. Ha caldo?»


    «No, non ho caldo. Ho freddo. E sono molto stanco.»


    «Un momento... Ecco. Sono dodici euro.»


    «È caro. Ha altro?»


    «Sì. Ecco: cinque euro.»


    «Va bene, grazie. La farmacia è aperta anche domani?»


    «Sì, ogni giorno.»

    '
  questions:
  - prompt: Come sta Paolo?
    answers:
    - text: non sta bene
      canonical: true
    - text: male
    - text: è stanco e ha freddo
    explanation: '«Paolo non sta bene: è stanco, ha freddo e non ha fame.»'
  - prompt: Paolo ha caldo?
    answers:
    - text: 'no'
      canonical: true
    - text: no, ha freddo
    - text: ha freddo
    explanation: «No, non ho caldo. Ho freddo.»
  - prompt: Quanto paga Paolo?
    answers:
    - text: cinque euro
      canonical: true
    - text: 5 euro
    explanation: The first one was twelve euros — «È caro. Ha altro?» got him the five-euro
      one.
  - prompt: La farmacia è aperta ogni giorno?
    answers:
    - text: sì
      canonical: true
    - text: sì, ogni giorno
    explanation: «Sì, ogni giorno.»
