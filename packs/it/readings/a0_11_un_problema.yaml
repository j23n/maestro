  title: Ho un problema
  text: 'Marco è in albergo. È stanco e ha fame.


    «Scusi, ho un problema. Non trovo la chiave della camera.»


    «Che numero ha la camera?»


    «Il numero otto.»


    «Un momento... Ecco la chiave. È qui.»


    «Grazie! Ho anche fame. Il bar è aperto?»


    «Sì, è aperto. È lì.»

    '
