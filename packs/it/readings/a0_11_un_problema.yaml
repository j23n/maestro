  title: Sì, no, non è mia
  text: 'Anna è alla stazione. Cerca la valigia, ma non la trova.


    «Buongiorno, signore. Ho un problema: non trovo la valigia.»


    «La valigia è grande?»


    «No, non è grande. È piccola e nuova.»


    «Ha i documenti in valigia?»


    «Sì, ho il passaporto e il telefono.»


    «Un momento... Ecco. È sua?»


    «No, non è mia. La mia è piccola e nuova.»


    «Ecco un''altra valigia. È sua?»


    «Sì! È mia. Grazie mille!»

    '
  questions:
  - prompt: Che cosa cerca Anna?
    answers:
    - text: la valigia
      canonical: true
    - text: valigia
    explanation: «Cerca la valigia, ma non la trova.»
  - prompt: La valigia di Anna è grande o piccola?
    answers:
    - text: piccola
      canonical: true
    - text: è piccola
    - text: piccola e nuova
    explanation: «No, non è grande. È piccola e nuova.»
  - prompt: Che cosa ha Anna in valigia?
    answers:
    - text: il passaporto e il telefono
      canonical: true
    - text: passaporto e telefono
    - text: i documenti
