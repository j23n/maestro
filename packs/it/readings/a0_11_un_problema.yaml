    explanation: «Marco è in albergo.»
  - prompt: Che cosa non trova Marco?
    answers:
    - text: la chiave
      canonical: true
    - text: chiave
    - text: la chiave della camera
    explanation: «Non trovo la chiave della camera.»
  - prompt: Il bar è aperto?
