  title: La chiave
  text: 'Sono le undici di sera. La porta dell''albergo è chiusa. Al banco c''è un

    altro signore: non è la signora di ieri.


    «Buonasera. Come si chiama?»


    «Mi chiamo Anna Rossi. La camera è la quindici.»


    «Un momento, signora... camera quindici. Ecco la chiave.»


    «Grazie mille. Buonanotte.»


    «Buonanotte, signora Rossi.»

    '
