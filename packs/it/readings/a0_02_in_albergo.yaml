  id: reading.in_albergo.003
  cefr_level: A0
  title: A colazione
  text: 'La mattina, a colazione. Anna prende un caffè e un cornetto.


    Al tavolo vicino c''è una signora.


    «Buongiorno! Io mi chiamo Maria. E lei?»


    «Buongiorno. Mi chiamo Anna. Piacere.»


    «Piacere. Lei è inglese?»


    «Sì. Sono a Roma per tre giorni.»


    Arriva il cameriere. «Scusi, il numero della camera?»


    «La dodici.»


    «Grazie. Buona giornata!»

    '
  glossary:
    vicino: next to / nearby
    cameriere: waiter
  questions:
  - prompt: Come si chiama la signora al tavolo vicino?
    answers:
    - text: maria
      canonical: true
    - text: si chiama maria
    explanation: «Io mi chiamo Maria. E lei?»
  - prompt: Che cosa prende Anna a colazione?
    answers:
    - text: un caffè e un cornetto
      canonical: true
    - text: caffè e cornetto
    explanation: «Anna prende un caffè e un cornetto.»
  - prompt: Che numero dice Anna al cameriere?
    answers:
    - text: dodici
      canonical: true
    - text: la dodici
    - text: '12'
    explanation: «La dodici.» — the room number, without the word camera.
  - prompt: Quanti giorni sta Anna a Roma?
    answers:
    - text: tre
      canonical: true
    - text: tre giorni
    - text: '3'
    explanation: «Sono a Roma per tre giorni.»
