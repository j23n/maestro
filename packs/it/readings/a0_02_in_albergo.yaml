  title: Alla reception
  text: 'Anna arriva in albergo. Al banco c''è una signora.


    «Buonasera. Mi chiamo Anna Rossi. Ho una prenotazione.»


    «Buonasera, signora Rossi. Un momento... sì, ecco. La camera è la

    numero dodici.»


    «Dodici. Grazie.»


    «Ecco la chiave. La colazione è dalle sette alle dieci. Buonanotte!»

    '
