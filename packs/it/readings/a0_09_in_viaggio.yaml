    explanation: «Il binario nove è chiuso.»
  - prompt: A che ora parte il treno?
    answers:
    - text: alle venti
      canonical: true
    - text: venti
    explanation: «Il treno per Roma parte alle venti.»
  - prompt: Che cosa ha Marco?
    answers:
