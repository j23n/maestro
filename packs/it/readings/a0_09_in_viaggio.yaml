  cefr_level: A0
  title: Binario nove, binario otto
  text: 'Marco aspetta al binario nove. Il treno per Roma parte alle venti.

    Ha una valigia, un bagaglio piccolo e il passaporto.


    Adesso il numero sul binario non è nove. È otto.


    «Scusi, il treno per Roma parte dal binario otto?»


    «Sì, dal binario otto. Il binario nove è chiuso.»


    «Grazie mille!»


    Marco prende la valigia e va. Alle venti è sul treno per Roma.

    '
