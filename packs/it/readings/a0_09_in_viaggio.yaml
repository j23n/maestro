  title: Un biglietto per Firenze
  text: 'Marco è alla stazione di Roma. Vuole andare a Firenze.


    «Buongiorno. Vorrei un biglietto per Firenze, per favore.»


    «Per oggi?»


    «Sì, per oggi.»


    «Sono venti euro. Il treno parte alle nove e arriva alle undici.»


    «Grazie. Da che binario parte?»


    «Dal binario dodici.»


    Marco paga, prende il biglietto e cerca il binario dodici.

    '
