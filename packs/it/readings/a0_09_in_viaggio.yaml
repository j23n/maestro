  title: La macchina dei biglietti
  text: 'Anna non aspetta: c''è una macchina dei biglietti alla stazione, e la

    macchina parla italiano.


    DOVE? — Firenze.

    BIGLIETTI? — Due.

    QUANDO? — Oggi.

    QUANTO? — Quaranta euro.


    Anna paga e prende i due biglietti. Adesso cerca il treno:


    TRENO PER FIRENZE — ORE 9:20 — BINARIO 12


    Anna prende le valigie e va al binario dodici. Il treno è lì, aperto, e

    parte alle nove e venti.

    '
