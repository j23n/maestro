  title: Due gelati
  text: 'Al bar c''è il gelato. Marco prende un gelato al caffè.


    «Mi piace molto il caffè», dice Marco. «E tu?»


    «Mi piacciono i dolci», dice Anna. «Prendo un gelato alla frutta. I

    gelati al latte non mi piacciono.»


    «Due gelati, per favore», dice Marco al barista.


    «Sono quattro euro.»


    Il gelato alla frutta è molto buono. Anna è contenta.

    '
