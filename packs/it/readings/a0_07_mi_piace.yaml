  title: Gusti diversi
  text: 'A cena da Giulia c''è il pesce.


    «Mi piace molto il pesce», dice Giulia. «È buono!»


    Anna non dice sì. «Il pesce mi piace poco», dice. «Ma mi piacciono le

    mele e i dolci.»


    «Anche i dolci mi piacciono», dice Giulia. «Che bella cena!»


    Anna beve il vino. Oggi il tempo è bello e la musica è bella. Anna è

    contenta.

    '
  questions:
  - prompt: A chi piace il pesce?
    answers:
    - text: a Giulia
