  title: Le piace la pasta?
  text: 'Anna è al ristorante. Prende la pasta al pomodoro.


    «Le piace la pasta?» dice la signora al tavolo.


    «Sì, mi piace molto. È buona!»


    «E il pesce? Le piace il pesce?»


    «No, il pesce mi piace poco. Ma mi piacciono i dolci.»


    «Anche i dolci mi piacciono», dice la signora. «Il gelato al caffè è

    molto buono.»

    '
  questions:
  - prompt: Che cosa mangia Anna?
    answers:
    - text: la pasta
      canonical: true
    - text: pasta
    - text: la pasta al pomodoro
    explanation: «Prende la pasta al pomodoro.»
  - prompt: Le piace il pesce?
    answers:
    - text: no, le piace poco
      canonical: true
    - text: poco
    - text: 'no'
    explanation: «Il pesce mi piace poco.» — a soft no.
  - prompt: Che cosa piace anche alla signora?
    answers:
    - text: i dolci
      canonical: true
    - text: dolci
    explanation: «Anche i dolci mi piacciono», dice la signora.
