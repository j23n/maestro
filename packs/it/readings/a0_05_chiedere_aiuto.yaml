  title: Dov'è la farmacia?
  text: 'Marco è in centro. Cerca una farmacia.


    «Scusi, signora. Dov''è la farmacia, per favore?»


    «La farmacia è in via Garibaldi, vicino al mercato.»


    «Scusi, non ho capito. Come?»


    «In via Garibaldi. Il mercato è lì, e la farmacia è vicino.»


    «Va bene, ho capito. Grazie mille!»


    «Prego. Buona giornata!»

    '
  glossary:
    vicino: near, next to
    mercato: market
