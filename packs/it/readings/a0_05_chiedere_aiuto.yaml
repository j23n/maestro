  title: Ho perso la valigia
  text: 'All''aeroporto di Roma, Anna non trova la sua valigia.


    «Scusi, mi può aiutare? Ho perso la valigia.»


    «Certo, signora. Lei è di dove?»


    «Sono di Londra. Sono arrivata da Londra alle nove.»


    «Va bene. Come si chiama?»


    «Mi chiamo Anna Rossi.»


    «Un momento… la valigia è qui, all''ufficio bagagli.»


    «Grazie mille! Non capivo dove cercare.»

    '
