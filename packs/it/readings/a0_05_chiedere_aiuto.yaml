  title: Buonasera, mi può aiutare?
  text: 'È sera e Anna non sa dov''è il suo albergo. In strada c''è una signora.


    «Scusi! Mi può aiutare, per favore? Non so dove sono.»


    «Certo. Come si chiama l''albergo?»


    «Albergo Roma. È in via Garibaldi, forse.»


    «No, l''albergo Roma non è in via Garibaldi. È in piazza Garibaldi, vicino alla stazione.»


    «Scusi, non ho capito. In via o in piazza?»


    «In piazza. La stazione è lì, e l''albergo è vicino.»


    «Va bene, ho capito. Grazie mille, signora!»


    «Prego. Buonanotte!»

    '
  glossary:
    vicino: near, next to
  questions:
  - prompt: Che cosa cerca Anna?
    answers:
    - text: l'albergo
      canonical: true
    - text: albergo
    - text: il suo albergo
    explanation: «Anna non sa dov'è il suo albergo.»
  - prompt: Dov'è l'albergo Roma?
    answers:
    - text: in piazza Garibaldi
      canonical: true
    - text: piazza Garibaldi
    - text: in piazza
    explanation: «È in piazza Garibaldi, vicino alla stazione» — non in via.
  - prompt: Che cosa dice Anna quando non capisce?
    answers:
    - text: non ho capito
      canonical: true
    - text: scusi, non ho capito
    explanation: «Scusi, non ho capito. In via o in piazza?» — she names the two things she
      is confusing.
