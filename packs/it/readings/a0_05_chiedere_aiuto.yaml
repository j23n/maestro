# Reading — lesson a0-05-chiedere-aiuto. Drafted, not yet reviewed.

- status: draft
  id: reading.chiedere_aiuto.001
  cefr_level: A0
  title: Ho perso la valigia
  text: |
    All'aeroporto di Roma, Anna non trova la sua valigia.

    «Scusi, mi può aiutare? Ho perso la valigia.»

    «Certo, signora. Lei è di dove?»

    «Sono di Londra. Sono arrivata da Londra alle nove.»

    «Va bene. Come si chiama?»

    «Mi chiamo Anna Rossi.»

    «Un momento… la valigia è qui, all'ufficio bagagli.»

    «Grazie mille! Non capivo dove cercare.»
  glossary:
    chiedere: to ask
    frase: sentence
    momento: moment
    perso: lost
    ufficio: office
    usa: uses
    non trova: can't find
    Certo: Of course
    ufficio bagagli: baggage office
    Non capivo: I didn't understand
  questions:
