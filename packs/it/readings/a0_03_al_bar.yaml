  title: Un tavolo per due
  text: 'Marco e Anna prendono un tavolo. Il barista arriva subito.


    «Buongiorno. Prego?»


    «Vorrei un cappuccino e una birra piccola, per favore.»


    «Anche un''acqua frizzante, grazie», dice Anna.


    «Subito.»


    Al banco il caffè costa un euro. Al tavolo costa tre euro.


    «Quant''è?»


    «Otto euro.»

    '
  questions:
  - prompt: Che cosa ordina Marco?
    answers:
    - text: un cappuccino e una birra
      canonical: true
    - text: cappuccino e birra
    explanation: «Vorrei un cappuccino e una birra piccola, per favore.»
  - prompt: Che cosa ordina Anna?
    answers:
    - text: un'acqua frizzante
      canonical: true
    - text: acqua frizzante
    explanation: «Anche un'acqua frizzante, grazie», dice Anna.
  - prompt: Quanto costa il caffè al tavolo?
    answers:
    - text: tre euro
      canonical: true
    - text: '3'
    explanation: «Al banco il caffè costa un euro. Al tavolo costa tre euro.»
