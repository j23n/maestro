  cefr_level: A0
  title: Ogni mattina
  text: 'Ogni mattina Marco entra nel bar. Il barista lo vede e aspetta.


    «Buongiorno. Un cappuccino e un cornetto, per favore.»


    «Caldo il latte?»


    «Sì, grazie.»


    Il barista prende una tazza e fa il cappuccino. Marco beve in piedi,

    al banco.


    «Zucchero?»


    «No, grazie. Il conto, per favore.»


    «Due euro e ottanta.»

    '
  glossary:
    in piedi: standing up
  questions:
  - prompt: Dove beve Marco?
    answers:
    - text: al banco
      canonical: true
    - text: banco
    - text: in piedi al banco
    explanation: «Marco beve in piedi, al banco.»
  - prompt: Marco vuole lo zucchero?
    answers:
    - text: no, grazie
      canonical: true
    - text: 'no'
    explanation: «Zucchero?» — «No, grazie.»
  - prompt: Quanto paga Marco?
    answers:
    - text: due euro e ottanta
      canonical: true
    - text: 2,80
    - text: '2.80'
    explanation: «Due euro e ottanta.»
