  cefr_level: A0
  title: Senza mappa
  text: 'Il telefono di Marco non va. Marco cerca via Firenze e non sa dov''è.


    Alla fermata dell''autobus ci sono due signore.


    «Buongiorno, scusi. Dov''è via Firenze?»


    «Via Firenze? Vede la chiesa? È lì, dopo la chiesa, a destra.»


    «E c''è un autobus per il centro?»


    «Sì, il numero otto. La fermata è qui.»


    «Grazie mille, arrivederci!»

    '
  glossary:
    fermata: stop (bus stop)
    dopo: after / past
    destra: right
  questions:
  - prompt: Che cosa cerca Marco?
    answers:
    - text: via Firenze
      canonical: true
    - text: la via
    explanation: «Marco cerca via Firenze e non sa dov'è.»
