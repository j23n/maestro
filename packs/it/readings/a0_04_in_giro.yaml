  title: Il museo è chiuso
  text: 'Il museo è chiuso. Sulla porta c''è un numero di telefono, niente

    altro.


    Anna entra in un negozio.


    «Scusi, signora. Il museo è chiuso. Dov''è il mercato?»


    «Il mercato è in piazza Garibaldi, vicino alla chiesa.»


    «È lontano?»


    «No, è qui vicino. Anche il supermercato è lì.»


    «Grazie mille!»

    '
