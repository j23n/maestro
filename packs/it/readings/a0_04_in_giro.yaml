  title: Con la mappa
  text: 'Anna è in centro. Cerca il museo, ma non lo trova.


    Vede una signora e dice: «Scusi!»


    «Sì, prego.»


    «Dov''è il museo, per favore?»


    «Il museo è in via Roma. È lì, dopo la banca.»


    «Grazie mille!»


    «Prego, arrivederci.»

    '
