  title: Il biglietto per Firenze
  text: 'Marco è alla stazione. Vuole un biglietto per Firenze.


    «Buongiorno. Vorrei un biglietto per Firenze, per favore.»


    «Sì. A che ora vuole partire?»


    «Alle sette, o alle otto. Il treno delle sette è pieno?»


    «No, è libero. Sono trenta euro.»


    «Va bene. Ecco i soldi.»


    «Ecco il biglietto. Il treno parte dal binario cinque.»


    «Scusi, non capisco. Che binario?»


    «Il binario cinque. Ha il passaporto?»


    «Sì, ho il passaporto. Grazie mille!»

    '
  questions:
  - prompt: Dove va Marco?
    answers:
    - text: a Firenze
      canonical: true
    - text: Firenze
    explanation: «Vorrei un biglietto per Firenze, per favore.»
  - prompt: Quanto costa il biglietto?
    answers:
    - text: trenta euro
      canonical: true
    - text: trenta
    explanation: «No, è libero. Sono trenta euro.»
  - prompt: Da che binario parte il treno?
    answers:
    - text: dal binario cinque
      canonical: true
    - text: binario cinque
    - text: cinque
    explanation: «Il treno parte dal binario cinque.»
