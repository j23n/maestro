  title: Di nuovo la prima ora
  text: 'Anna è in aereo. Un signore la saluta.


    «Buongiorno. Come si chiama?»


    «Buongiorno. Mi chiamo Anna. E lei?»


    «Io mi chiamo Paolo. Lei è italiana?»


    «No, non sono italiana. Sono inglese, ma parlo poco italiano.»


    «Molto bene! Il volo è di due ore.»


    «Due ore? Va bene, grazie.»


    «Prego. Buona giornata, signora.»

    '
