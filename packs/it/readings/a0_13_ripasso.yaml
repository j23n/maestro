  title: Un pomeriggio in centro
  text: 'Marco è in centro. Ha fame e va in un bar.


    «Buongiorno. Vorrei un panino e un''acqua naturale, per favore.»


    «Ecco. Sono sei euro.»


    Marco mangia al tavolo. Adesso cerca il museo, ma non trova la strada.


    «Scusi, signora. Dov''è il museo?»


    «È in via Garibaldi, in piazza. È lì.»


    «Grazie mille!»


    Al museo una signora vede Marco e dice:


    «Le piace il museo?»


    «Sì, mi piace molto. È molto bello.»

    '
