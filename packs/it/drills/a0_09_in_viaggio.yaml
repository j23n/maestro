- status: draft
  scenario_ids: [a0-09-in-viaggio]
  lesson_id: a0-09-in-viaggio.d1
  id: drill.vocab_viaggio.001
  item_type: drill_cloze
  cefr_level: A0
  prompt: "Vorrei un ___ per Roma, per favore."
  answers:
    - { text: "biglietto", canonical: true }
  distractor_feedback:
    binario: "«Binario» is the platform you leave from, not the thing you buy."
    treno: "«Vorrei un treno» buys you a locomotive. You want «un biglietto»."
  explanation: "Vorrei un biglietto per + city — the phrase that buys a ticket."
  evidence:
    - { axis: grammar, id: vocab_viaggio, weight: 1.0 }
    - { axis: function, id: a0_comprare_biglietto, weight: 1.0 }
    - { axis: vocab, id: biglietto, weight: 0.5 }

- status: draft
  scenario_ids: [a0-09-in-viaggio]
  lesson_id: a0-09-in-viaggio.d1
  id: drill.vocab_viaggio.002
  item_type: drill_cloze
  cefr_level: A0
  prompt: "Da che ___ parte il treno per Firenze?"
  answers:
    - { text: "binario", canonical: true }
  distractor_feedback:
    stazione: "The station is where you are; the platform is what you need."
    ora: "«A che ora?» asks the time. This sentence asks about the place."
  explanation: "Da che binario parte…? — the question that gets you a number back."
  evidence:
    - { axis: grammar, id: vocab_viaggio, weight: 1.0 }
    - { axis: function, id: a0_comprare_biglietto, weight: 1.0 }
    - { axis: vocab, id: binario, weight: 0.5 }

- status: draft
  scenario_ids: [a0-09-in-viaggio]
