  explanation: "è becomes sono in the plural."
  evidence:
    - { axis: grammar, id: dove_e, weight: 1.0 }

- status: draft
  id: drill.dove_e.011
  item_type: drill_multiple_choice
  cefr_level: A0
  prompt: "Vuoi sapere se c'è un bagno nel bar. Che cosa chiedi?"
  choices:
    - "Scusi, c'è un bagno?"
    - "Scusi, dove sono un bagno?"
    - "Scusi, dov'è un bagno?"
    - "Scusi, c'è dov'è il bagno?"
  answers:
    - { text: "Scusi, c'è un bagno?", canonical: true }
  explanation: "Existence → c'è; location of a known thing → dov'è."
  evidence:
