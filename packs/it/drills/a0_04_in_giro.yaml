# --------------------------------------------------------------- dove_e
- status: draft
  id: drill.dove_e.001
  item_type: drill_cloze
  cefr_level: A0
  prompt: "Scusi, ___ la stazione?"
  answers:
    - { text: "dov'è", canonical: true }
  distractor_feedback:
    dove: "«Dove» alone isn't a question — you need the verb: «dov'è»."
    "dove è": "Correct in principle, but Italians contract it: «dov'è»."
  explanation: "dove + è = dov'è."
  evidence:
    - { axis: grammar, id: dove_e, weight: 1.0 }
    - { axis: function, id: a0_chiedere_dove, weight: 1.0 }

- status: draft
  id: drill.dove_e.002
  item_type: drill_cloze
  cefr_level: A0
  prompt: "___, dov'è il bagno? (a una persona che non conosci)"
  answers:
    - { text: "scusi", canonical: true }
  distractor_feedback:
    scusa: "«Scusa» is informal. With a stranger, «scusi»."
  explanation: "Open with scusi and the question becomes a request."
  evidence:
    - { axis: grammar, id: dove_e, weight: 1.0 }
    - { axis: function, id: a0_scusarsi, weight: 1.0 }

- status: draft
  id: drill.dove_e.003
  item_type: drill_multiple_choice
  cefr_level: A0
  prompt: "Quale frase è la più naturale?"
  choices:
    - "Scusi, dov'è la farmacia?"
    - "Scusi, dove la farmacia?"
    - "Dove è la farmacia, scusi?"
    - "Scusi, dov'è farmacia?"
  answers:
    - { text: "Scusi, dov'è la farmacia?", canonical: true }
  distractor_feedback:
    "Scusi, dov'è farmacia?": "Italian keeps the article: «la farmacia»."
    "Scusi, dove la farmacia?": "The verb is missing."
  explanation: "scusi + dov'è + article + noun."
  evidence:
    - { axis: grammar, id: dove_e, weight: 1.0 }
    - { axis: function, id: a0_chiedere_dove, weight: 1.0 }

- status: draft
  id: drill.dove_e.004
  item_type: drill_cloze
  cefr_level: A0
  prompt: "Per il plurale: «___ ___ i taxi?»"
  answers:
    - { text: "dove sono", canonical: true }
  distractor_feedback:
    "dov'è": "«Dov'è» is singular. With «i taxi» (plural) use «dove sono»."
  explanation: "dov'è for one thing, dove sono for several."
  evidence:
    - { axis: grammar, id: dove_e, weight: 1.0 }
    - { axis: function, id: a0_chiedere_dove, weight: 1.0 }

- status: draft
  id: drill.dove_e.005
  item_type: drill_cloze
  cefr_level: A0
  prompt: "Chiedi se esiste una farmacia vicina: «___ una farmacia qui vicino?»"
  answers:
    - { text: "c'è", canonical: true }
  distractor_feedback:
    "dov'è": "«Dov'è» asks where a known thing is. To ask whether one exists nearby: «c'è»."
  explanation: "c'è = there is; dov'è = where is."
  evidence:
    - { axis: grammar, id: dove_e, weight: 1.0 }
    - { axis: function, id: a0_chiedere_dove, weight: 1.0 }

- status: draft
  id: drill.dove_e.006
  item_type: drill_multiple_choice
  cefr_level: A0
  prompt: "«Dov'è» è la contrazione di:"
  choices: ["dove è", "dove sono", "dove ha", "dove va"]
  answers:
    - { text: "dove è", canonical: true }
  explanation: "dove + è, with the apostrophe marking the dropped vowel."
  evidence:
    - { axis: grammar, id: dove_e, weight: 1.0 }

- status: draft
  id: drill.dove_e.007
  item_type: drill_cloze
  cefr_level: A0
  prompt: "Rispondi indicando la direzione a destra: «È ___ ___.»"
  answers:
    - { text: "a destra", canonical: true }
  explanation: "a destra / a sinistra / sempre dritto — the three answers you'll hear."
  evidence:
    - { axis: grammar, id: dove_e, weight: 1.0 }
    - { axis: function, id: a0_chiedere_dove, weight: 0.5 }

- status: draft
  id: drill.dove_e.008
  item_type: drill_multiple_choice
  cefr_level: A0
  prompt: "«Sempre dritto» significa:"
  choices: ["straight ahead", "on the right", "on the left", "very far"]
  answers:
    - { text: "straight ahead", canonical: true }
  explanation: "Literally «always straight»."
  evidence:
    - { axis: grammar, id: dove_e, weight: 1.0 }

- status: draft
  id: drill.dove_e.009
  item_type: drill_cloze
  cefr_level: A0
  prompt: "Scusi, ___ il museo?"
  answers:
    - { text: "dov'è", canonical: true }
