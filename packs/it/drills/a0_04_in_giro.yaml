    - { axis: function, id: a0_chiedere_dove, weight: 1.0 }

- status: draft
  id: drill.dove_e.010
  item_type: drill_transform
  cefr_level: A0
  prompt: "Metti al plurale: «Dov'è il taxi?» → «___ ___ i taxi?»"
