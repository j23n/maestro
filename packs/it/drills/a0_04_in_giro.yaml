# ------------------------------------------------------------ art_il_la
- status: draft
  scenario_ids: [a0-04-in-giro]
  id: drill.art_il_la.003
  item_type: drill_cloze
  cefr_level: A0
  prompt: "Dov'è ___ stazione?"
  answers:
    - { text: "la", canonical: true }
  distractor_feedback:
    il: "«Stazione» is feminine — la stazione."
  explanation: "Feminine noun starting with a consonant → la."
  evidence:
    - { axis: grammar, id: art_il_la, weight: 1.0 }

- status: draft
  scenario_ids: [a0-04-in-giro]
  id: drill.art_il_la.004
  item_type: drill_cloze
  cefr_level: A0
  prompt: "___ museo è in centro."
  answers:
    - { text: "il", canonical: true }
  distractor_feedback:
    la: "«Museo» is masculine — il museo."
  explanation: "Masculine noun starting with a consonant → il."
  evidence:
    - { axis: grammar, id: art_il_la, weight: 1.0 }

- status: draft
  scenario_ids: [a0-04-in-giro]
  id: drill.art_il_la.005
  item_type: drill_cloze
  cefr_level: A0
  prompt: "___ albergo è in centro."
  answers:
    - { text: "l'", canonical: true }
  distractor_feedback:
    il: "Before a vowel, «il» becomes «l'» — l'albergo."
    la: "Albergo is masculine, and before a vowel both genders use «l'»."
  explanation: "Before a vowel, il and la both become l'."
  evidence:
    - { axis: grammar, id: art_il_la, weight: 1.0 }

- status: draft
  scenario_ids: [a0-04-in-giro]
  id: drill.art_il_la.006
  item_type: drill_multiple_choice
  cefr_level: A0
  prompt: "Masculine noun before a vowel takes: «___ albergo»"
  choices: ["l'", "la", "lo", "il"]
  answers:
    - { text: "l'", canonical: true }
  distractor_feedback:
    il: "Before a vowel «il» elides to «l'»."

  explanation: "l'albergo (m) and l'acqua (f), but only un'acqua — un amico has no apostrophe."
  evidence:
    - { axis: grammar, id: art_il_la, weight: 1.0 }
    - { axis: grammar, id: art_un_una, weight: 0.5 }

