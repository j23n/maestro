  cefr_level: A0
  prompt: "Saluti un amico che conosci bene: «___, Marco!»"
  answers:
    - { text: "ciao", canonical: true }
  distractor_feedback:
    salve: "«Salve» works, but it's cooler and more distant. With a friend, «ciao»."
    arrivederci: "«Arrivederci» is only goodbye. To greet a friend, «ciao»."
  explanation: "Ciao is the informal hello and goodbye, for people you'd call tu."
