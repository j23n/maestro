  explanation: "Scusa (tu) becomes scusi (Lei)."
  evidence:
    - { axis: grammar, id: polite_exp, weight: 1.0 }

- status: draft
  id: drill.polite_exp.008
  item_type: drill_cloze
  cefr_level: A0
  prompt: "Rafforza il ringraziamento: «___ mille!»"
  answers:
    - { text: "grazie", canonical: true }
  distractor_feedback:
    prego: "«Prego mille» isn't Italian. The set phrase is «grazie mille»."
  explanation: "Grazie mille — literally a thousand thanks."
