# ----------------------------------------------------------- pronun_bas
# Sound contrasts built only from A0 words, so the choices stay inside the
# learner's vocabulary instead of leaning on phonetic notation.
- status: draft
  scenario_ids: [a0-01-in-aereo]
  id: drill.pronun_bas.001
  item_type: drill_multiple_choice
  cefr_level: A0
  prompt: "Which word has the same soft c as «ciao»? «___»"
  choices: ["cena", "casa", "chiave", "caffè"]
  answers:
    - { text: "cena", canonical: true }
  distractor_feedback:
    casa: "c + a is hard, like English *k*."
    chiave: "The h keeps the c hard."
    caffè: "c + a is hard."
  explanation: "c + i/e is soft (the ch of chair); c + a/o/u is hard."
  evidence:
    - { axis: grammar, id: pronun_bas, weight: 1.0 }

- status: draft
  scenario_ids: [a0-01-in-aereo]
  id: drill.pronun_bas.002
  item_type: drill_multiple_choice
  cefr_level: A0
  prompt: "Which word has a hard k sound? «___»"
  choices: ["chiave", "ciao", "cena", "cinque"]
  answers:
    - { text: "chiave", canonical: true }
  distractor_feedback:
    ciao: "c + i is soft."
    cena: "c + e is soft."
    cinque: "The first c is soft; only the qu is hard."
  explanation: "ch is always hard — the h exists precisely to block the softening."
  evidence:
    - { axis: grammar, id: pronun_bas, weight: 1.0 }

- status: draft
  scenario_ids: [a0-01-in-aereo]
  id: drill.pronun_bas.003
  item_type: drill_multiple_choice
  cefr_level: A0
  prompt: "Which word starts with the same soft g as «gelato»? «___»"
  choices: ["giorno", "grande", "spaghetti", "grazie"]
  answers:
    - { text: "giorno", canonical: true }
  distractor_feedback:
    grande: "g + r is hard."
    spaghetti: "gh is hard."
  explanation: "g + i/e is soft (the j of jam); g + a/o/u and gh are hard."
  evidence:
    - { axis: grammar, id: pronun_bas, weight: 1.0 }

- status: draft
  scenario_ids: [a0-01-in-aereo]
  id: drill.pronun_bas.004
  item_type: drill_multiple_choice
  cefr_level: A0
  prompt: "«Spaghetti» has a hard g. Which word also has one? «___»"
  choices: ["grande", "gelato", "giorno", "formaggio"]
  answers:
    - { text: "grande", canonical: true }
  distractor_feedback:
    formaggio: "gg + i is soft, like the j of jam."
  explanation: "gh and g + consonant stay hard; g + i/e goes soft."
  evidence:
    - { axis: grammar, id: pronun_bas, weight: 1.0 }

- status: draft
  scenario_ids: [a0-01-in-aereo]
  id: drill.pronun_bas.005
  item_type: drill_multiple_choice
  cefr_level: A0
  prompt: "Which word contains the ny sound of *canyon*? «___»"
