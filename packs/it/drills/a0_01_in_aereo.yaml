# ----------------------------------------------------------- polite_exp
- status: draft
  scenario_ids: [a0-01-in-aereo]
  id: drill.polite_exp.001
  item_type: drill_cloze
  cefr_level: A0
  prompt: "Un caffè, ___ ___."
  answers:
    - { text: "per favore", canonical: true }
  distractor_feedback:
    prego: "«Prego» is the *reply*, not the request. Asking for something: «per favore»."
    grazie: "«Grazie» thanks after the fact. To make the request polite: «per favore»."
  explanation: "Per favore = please, and it goes at the end of the request."
  evidence:
    - { axis: grammar, id: polite_exp, weight: 1.0 }
    - { axis: function, id: a0_ordinare, weight: 1.0 }

- status: draft
  scenario_ids: [a0-01-in-aereo]
  id: drill.polite_exp.002
  item_type: drill_cloze
  cefr_level: A0
  prompt: "«Grazie!» — «___.»"
  answers:
    - { text: "prego", canonical: true }
  distractor_feedback:
    grazie: "You'd be thanking them back. The reply to «grazie» is «prego»."
  explanation: "Prego is the standard answer to grazie — you're welcome."
  evidence:
    - { axis: grammar, id: polite_exp, weight: 1.0 }
    - { axis: function, id: a0_ringraziare, weight: 1.0 }

- status: draft
  scenario_ids: [a0-01-in-aereo]
