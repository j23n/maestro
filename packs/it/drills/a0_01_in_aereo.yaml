- status: draft
  scenario_ids: [a0-01-in-aereo]
  id: drill.pronun_bas.012
  item_type: drill_multiple_choice
  cefr_level: A0
  prompt: "In which word is the h silent and doing no work at all? «___»"
  choices: ["ho", "chiave", "chiesa", "perché"]
  answers:
    - { text: "ho", canonical: true }
  distractor_feedback:
    chiave: "Here the h hardens the c — it's silent but it is doing a job."
  explanation: "h is never pronounced. In chi/che it hardens c and g; in «ho» it only distinguishes the word from «o»."
