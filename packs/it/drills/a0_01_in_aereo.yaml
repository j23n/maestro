  prompt: "Stopping a stranger to ask something: «___, dove è il bagno?»"
  answers:
    - { text: "scusi", canonical: true }
  distractor_feedback:
    scusa: "«Scusa» is the informal form. With a stranger, use «scusi»."
    prego: "«Prego» answers a thank-you; it doesn't get someone's attention."
  explanation: "Scusi is the formal excuse-me — the safe choice with strangers."
  evidence:
    - { axis: grammar, id: polite_exp, weight: 1.0 }
    - { axis: function, id: a0_ringraziare, weight: 0.5 }

- status: draft
  scenario_ids: [a0-01-in-aereo]
