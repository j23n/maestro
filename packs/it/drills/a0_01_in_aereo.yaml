    - { axis: grammar, id: polite_exp, weight: 1.0 }
    - { axis: function, id: a0_rispondere_si_no, weight: 1.0 }

- status: draft
  id: drill.polite_exp.010
  item_type: drill_cloze
  cefr_level: A0
  prompt: "Rifiuti gentilmente: «___, grazie.»"
  answers:
    - { text: "no", canonical: true }
  distractor_feedback:
    sì: "That accepts the offer; you were declining."
  explanation: "«No, grazie» is the polite refusal — the grazie does the softening."
