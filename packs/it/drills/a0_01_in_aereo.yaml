# Drill bank — lesson a0-01-in-aereo (saluti, polite_exp, pronun_bas).
#
# Drafted in-session, not yet human-reviewed: status: draft throughout, so
# `build` skips these unless --include-draft is passed.
#
# Conventions (authoring/quality.py): Italian material sits in «guillemets»
# when the instruction is English; multiple-choice choices stay short;
# explanations and distractor feedback carry the English teaching.

# ---------------------------------------------------------------- saluti
- status: draft
  scenario_ids: [a0-01-in-aereo]
  id: drill.saluti.001
  item_type: drill_cloze
  cefr_level: A0
  prompt: "Sono le nove di mattina. «___, signora!»"
  answers:
    - { text: "buongiorno", canonical: true }
  distractor_feedback:
    buonasera: "«Buonasera» starts in the late afternoon. At nine in the morning it's «buongiorno»."
    buonanotte: "«Buonanotte» is for leaving at night, never for arriving."
    ciao: "«Ciao» is for people you know well. To someone you've never met, «buongiorno»."
  explanation: "Buongiorno covers the morning until roughly mid-afternoon."
  evidence:
    - { axis: grammar, id: saluti, weight: 1.0 }
    - { axis: function, id: a0_salutare, weight: 1.0 }

