    - { text: "buonasera", canonical: true }
  distractor_feedback:
    buonanotte: "«Buonanotte» is said when you leave at night, not when you arrive. Arriving at 8pm: «buonasera»."
    buongiorno: "«Buongiorno» is for the morning and early afternoon. At eight in the evening: «buonasera»."
  explanation: "Buonasera from the late afternoon onwards, on arrival."
  evidence:
    - { axis: grammar, id: saluti, weight: 1.0 }
    - { axis: function, id: a0_salutare, weight: 1.0 }

