# ----------------------------------------------------------- pronun_bas
- status: draft
  id: drill.pronun_bas.001
  item_type: drill_multiple_choice
  cefr_level: A0
  prompt: "Come si pronuncia «ciao»?"
  choices: ["chow (come «chair»)", "kow (come «cat»)", "syow", "tsyow"]
  answers:
    - { text: "chow (come «chair»)", canonical: true }
  distractor_feedback:
    "kow (come «cat»)": "C before i or e is soft. Hard k would need «chi»: «chiao» isn't a word."
  explanation: "c + i/e = the ch of chair. c + a/o/u = hard k."
  evidence:
    - { axis: grammar, id: pronun_bas, weight: 1.0 }

- status: draft
  id: drill.pronun_bas.002
  item_type: drill_multiple_choice
  cefr_level: A0
  prompt: "In «chi», la combinazione «ch» si pronuncia:"
  choices: ["k dura", "ch di «chair»", "sh", "h aspirata"]
  answers:
    - { text: "k dura", canonical: true }
  distractor_feedback:
    "ch di «chair»": "That's what plain «ci» does. The h is there precisely to keep the c hard: «chi» = kee."
  explanation: "h never sounds; its job is to keep c and g hard before i and e."
  evidence:
    - { axis: grammar, id: pronun_bas, weight: 1.0 }

- status: draft
  id: drill.pronun_bas.003
  item_type: drill_multiple_choice
  cefr_level: A0
  prompt: "Quale parola comincia con il suono «j» di «jam»?"
  choices: ["gelato", "gatto", "ghiaccio", "gnocchi"]
  answers:
    - { text: "gelato", canonical: true }
  distractor_feedback:
    gatto: "g + a is hard, as in «go»."
    ghiaccio: "The h keeps the g hard."
    gnocchi: "«gn» is the ny sound of canyon."
  explanation: "g + i/e is soft (j); g + a/o/u and gh are hard."
  evidence:
    - { axis: grammar, id: pronun_bas, weight: 1.0 }

- status: draft
  id: drill.pronun_bas.004
  item_type: drill_multiple_choice
  cefr_level: A0
  prompt: "In «spaghetti», la «gh» si pronuncia:"
  choices: ["g dura come «go»", "j come «jam»", "sh", "muta"]
  answers:
    - { text: "g dura come «go»", canonical: true }
  distractor_feedback:
    "j come «jam»": "That would be «gi/ge». The h blocks the softening."
  explanation: "gh = hard g, always."
  evidence:
    - { axis: grammar, id: pronun_bas, weight: 1.0 }

- status: draft
  id: drill.pronun_bas.005
  item_type: drill_multiple_choice
  cefr_level: A0
  prompt: "«signore» — come suona «gn»?"
  choices: ["ny come «canyon»", "g + n separate", "n semplice", "ng come «sing»"]
  answers:
    - { text: "ny come «canyon»", canonical: true }
  explanation: "gn is a single sound, the ny of canyon — as in signore, bagno, gnocchi."
  evidence:
    - { axis: grammar, id: pronun_bas, weight: 1.0 }

- status: draft
  id: drill.pronun_bas.006
  item_type: drill_multiple_choice
  cefr_level: A0
  prompt: "«bottiglia» — come suona «gli»?"
  choices: ["lli come «million»", "g + l separate", "l semplice", "j"]
  answers:
    - { text: "lli come «million»", canonical: true }
  explanation: "gli is the lli of million — famiglia, bottiglia, figlio."
  evidence:
    - { axis: grammar, id: pronun_bas, weight: 1.0 }

- status: draft
  id: drill.pronun_bas.007
  item_type: drill_multiple_choice
  cefr_level: A0
  prompt: "In «scusi», la «sc» davanti a «u» si pronuncia:"
  choices: ["sk", "sh", "s semplice", "ch"]
  answers:
    - { text: "sk", canonical: true }
  distractor_feedback:
    sh: "«sc» is sh only before i or e — «pesce», «sciare». Before u it's sk."
  explanation: "sc + a/o/u = sk; sc + i/e = sh."
  evidence:
    - { axis: grammar, id: pronun_bas, weight: 1.0 }

- status: draft
  id: drill.pronun_bas.008
  item_type: drill_multiple_choice
  cefr_level: A0
  prompt: "Quale coppia di parole si distingue SOLO per la consonante doppia?"
  choices:
    - "nono / nonno"
    - "casa / cosa"
    - "sono / sano"
    - "pane / cane"
  answers:
    - { text: "nono / nonno", canonical: true }
  distractor_feedback:
    "casa / cosa": "Those differ by a vowel, not a doubled consonant."
  explanation: "Double consonants change meaning: nono (ninth) vs nonno (grandfather). Hold the sound."
  evidence:
    - { axis: grammar, id: pronun_bas, weight: 1.0 }

- status: draft
  id: drill.pronun_bas.009
  item_type: drill_multiple_choice
  cefr_level: A0
  prompt: "In «caffè», dove cade l'accento?"
  choices: ["sull'ultima sillaba (caf-FÈ)", "sulla prima (CAF-fe)", "sulla penultima", "non c'è accento"]
  answers:
    - { text: "sull'ultima sillaba (caf-FÈ)", canonical: true }
  explanation: "A written accent marks stress on the final vowel: caffè, città, perché."
  evidence:
    - { axis: grammar, id: pronun_bas, weight: 1.0 }

- status: draft
  id: drill.pronun_bas.010
  item_type: drill_multiple_choice
  cefr_level: A0
  prompt: "Nella maggior parte delle parole italiane l'accento cade:"
  choices: ["sulla penultima sillaba", "sulla prima sillaba", "sull'ultima sillaba", "a caso"]
  answers:
    - { text: "sulla penultima sillaba", canonical: true }
  explanation: "The default is the second-to-last syllable: ca-ME-ra, sta-ZIO-ne, a-MI-co."
  evidence:
    - { axis: grammar, id: pronun_bas, weight: 1.0 }

- status: draft
  id: drill.pronun_bas.011
  item_type: drill_multiple_choice
  cefr_level: A0
  prompt: "Quale parola contiene un suono «k»?"
  choices: ["perché", "cena", "ciao", "gelato"]
  answers:
    - { text: "perché", canonical: true }
  distractor_feedback:
    cena: "c + e is soft — «chena»."
    ciao: "c + i is soft."
  explanation: "«ché» has the h, so the c stays hard."
  evidence:
    - { axis: grammar, id: pronun_bas, weight: 1.0 }

- status: draft
  id: drill.pronun_bas.012
  item_type: drill_multiple_choice
  cefr_level: A0
  prompt: "La lettera «h» in italiano:"
  choices:
    - "non si pronuncia mai"
    - "si pronuncia come in inglese"
    - "si pronuncia solo all'inizio"
    - "cambia la vocale seguente"
  answers:
    - { text: "non si pronuncia mai", canonical: true }
  explanation: "h is silent. It exists to harden c and g, and to distinguish ho/o, hai/ai."
  evidence:
    - { axis: grammar, id: pronun_bas, weight: 1.0 }
