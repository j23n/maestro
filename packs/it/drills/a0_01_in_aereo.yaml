- status: draft
  id: drill.polite_exp.011
  item_type: drill_multiple_choice
  cefr_level: A0
  prompt: "Ordini al bar. Quale frase è completa e cortese?"
  choices:
    - "Un cornetto, per favore."
    - "Un cornetto, prego."
    - "Un cornetto, grazie mille per favore."
