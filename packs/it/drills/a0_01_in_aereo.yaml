    - { text: "Grazie", canonical: true }
  distractor_feedback:
    Prego: "«Prego» is what *he* might say after you thank him."
    Per favore: "You already asked; now the coffee has arrived, so you thank."
  explanation: "Grazie thanks for something received."
  evidence:
    - { axis: grammar, id: polite_exp, weight: 1.0 }
    - { axis: function, id: a0_ringraziare, weight: 1.0 }

- status: draft
  id: drill.polite_exp.006
  item_type: drill_multiple_choice
  cefr_level: A0
  prompt: "Quale parola significa sia «you're welcome» sia «go ahead»?"
