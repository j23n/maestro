# ----------------------------------------------------------- polite_exp
- status: draft
  id: drill.polite_exp.001
  item_type: drill_cloze
  cefr_level: A0
  prompt: "Un caffè, ___ ___."
  answers:
    - { text: "per favore", canonical: true }
  distractor_feedback:
    prego: "«Prego» is the *reply*, not the request. Asking for something: «per favore»."
    grazie: "«Grazie» thanks after the fact. To make the request polite: «per favore»."
  explanation: "Per favore = please, and it goes at the end of the request."
  evidence:
    - { axis: grammar, id: polite_exp, weight: 1.0 }
    - { axis: function, id: a0_ordinare, weight: 1.0 }

- status: draft
  id: drill.polite_exp.002
  item_type: drill_cloze
  cefr_level: A0
  prompt: "«Grazie mille!» — «___.»"
  answers:
    - { text: "prego", canonical: true }
  distractor_feedback:
    grazie: "You'd be thanking them back. The reply to «grazie» is «prego»."
    per favore: "«Per favore» asks for something; it can't answer a thank-you."
  explanation: "Prego is the standard answer to grazie — you're welcome."
  evidence:
    - { axis: grammar, id: polite_exp, weight: 1.0 }
    - { axis: function, id: a0_ringraziare, weight: 1.0 }

- status: draft
  id: drill.polite_exp.003
  item_type: drill_cloze
  cefr_level: A0
  prompt: "Fermi un signore che non conosci per chiedere un'informazione: «___, dov'è il bagno?»"
  answers:
    - { text: "scusi", canonical: true }
  distractor_feedback:
    scusa: "«Scusa» is the informal form. With a stranger, use «scusi»."
    prego: "«Prego» answers a thank-you; it doesn't get someone's attention."
  explanation: "Scusi is the formal excuse-me — the safe choice with strangers."
  evidence:
    - { axis: grammar, id: polite_exp, weight: 1.0 }
    - { axis: function, id: a0_ringraziare, weight: 0.5 }

- status: draft
  id: drill.polite_exp.004
  item_type: drill_cloze
  cefr_level: A0
  prompt: "Chiedi scusa a un amico: «___, sono in ritardo.»"
  answers:
    - { text: "scusa", canonical: true }
  distractor_feedback:
    scusi: "«Scusi» is formal. With a friend, «scusa»."
  explanation: "Scusa is the tu form; scusi is the Lei form."
  evidence:
    - { axis: grammar, id: polite_exp, weight: 1.0 }

- status: draft
  id: drill.polite_exp.005
  item_type: drill_multiple_choice
  cefr_level: A0
  prompt: "Il barista ti porta il caffè. Che cosa dici?"
  choices: ["Grazie", "Prego", "Per favore", "Scusi"]
