# ------------------------------------------------------------- mi_chiamo
- status: draft
  scenario_ids: [a0-02-in-albergo]
  lesson_id: a0-02-in-albergo.d1
  id: drill.mi_chiamo.001
  item_type: drill_cloze
  cefr_level: A0
  prompt: "Mi ___ Anna."
  answers:
    - { text: "chiamo", canonical: true }
  distractor_feedback:
    chiami: "«Chiami» goes with «ti» (you). With «mi» (I), it's «chiamo»."
    chiama: "«Chiama» goes with «si» (he/she/you formal). With «mi», it's «chiamo»."
  explanation: "Chiamarsi, present: mi chiamo, ti chiami, si chiama."
  evidence:
    - { axis: grammar, id: mi_chiamo, weight: 1.0 }
    - { axis: function, id: a0_dire_nome, weight: 1.0 }

