# --------------------------------------------------------------- vorrei
- status: draft
  id: drill.vorrei.003
  item_type: drill_cloze
  cefr_level: A0
  prompt: "Chiedi cortesemente un cappuccino: «___ un cappuccino, per favore.»"
  answers:
    - { text: "vorrei", canonical: true }
  distractor_feedback:
    voglio: "«Voglio» means *I want* and sounds blunt when ordering. Use «vorrei»."
  explanation: "Vorrei = I'd like — the polite request form."
  evidence:
    - { axis: grammar, id: vorrei, weight: 1.0 }
    - { axis: function, id: a0_chiedere_cortesemente, weight: 1.0 }

- status: draft
  id: drill.vorrei.004
  item_type: drill_multiple_choice
  cefr_level: A0
  prompt: "Qual è la differenza fra «voglio» e «vorrei»?"
  choices:
    - "«vorrei» è più cortese"
    - "«voglio» è più cortese"
    - "sono identici"
    - "«vorrei» è al passato"
  answers:
    - { text: "«vorrei» è più cortese", canonical: true }
  distractor_feedback:
    "«vorrei» è al passato": "It's a conditional, not a past tense — «I would like»."
  explanation: "Voglio = I want (blunt); vorrei = I'd like (polite)."
  evidence:
    - { axis: grammar, id: vorrei, weight: 1.0 }

- status: draft
  id: drill.vorrei.005
  item_type: drill_cloze
  cefr_level: A0
  prompt: "Vuoi pagare. Dici: «___ ___, per favore.»"
  answers:
    - { text: "vorrei pagare", canonical: true }
  explanation: "vorrei + infinitive: vorrei pagare, vorrei prenotare."
  evidence:
    - { axis: grammar, id: vorrei, weight: 1.0 }
    - { axis: function, id: a0_chiedere_cortesemente, weight: 1.0 }

- status: draft
  id: drill.vorrei.006
  item_type: drill_multiple_choice
  cefr_level: A0
  prompt: "Quale frase è corretta?"
  choices:
    - "Vorrei prenotare un tavolo."
    - "Vorrei prenoto un tavolo."
    - "Vorrei prenotazione un tavolo."
    - "Vorrei che prenotare un tavolo."
  answers:
    - { text: "Vorrei prenotare un tavolo.", canonical: true }
  distractor_feedback:
    "Vorrei prenoto un tavolo.": "After «vorrei» the second verb stays in the infinitive: prenotare."
  explanation: "vorrei + infinitive, never a conjugated verb."
  evidence:
    - { axis: grammar, id: vorrei, weight: 1.0 }

- status: draft
  id: drill.vorrei.007
  item_type: drill_cloze
  cefr_level: A0
  prompt: "Al bar: «___ un'acqua naturale, grazie.»"
  answers:
    - { text: "vorrei", canonical: true }
  explanation: "vorrei + noun is the standard ordering shape."
  evidence:
    - { axis: grammar, id: vorrei, weight: 1.0 }
    - { axis: function, id: a0_ordinare, weight: 1.0 }

- status: draft
  id: drill.vorrei.008
  item_type: drill_transform
  cefr_level: A0
  prompt: "Rendi cortese: «Voglio un caffè.» — scrivi solo la prima parola."
  answers:
    - { text: "vorrei", canonical: true }
  distractor_feedback:
    voglio: "That's the blunt form you were asked to soften."
  explanation: "Swap voglio for vorrei and the sentence becomes polite."
  evidence:
    - { axis: grammar, id: vorrei, weight: 1.0 }
    - { axis: function, id: a0_chiedere_cortesemente, weight: 1.0 }

- status: draft
  id: drill.vorrei.009
  item_type: drill_cloze
  cefr_level: A0
  prompt: "Vorrei ___ (prenotare) un tavolo per due."
  answers:
    - { text: "prenotare", canonical: true }
  distractor_feedback:
    prenoto: "After vorrei the verb stays in the infinitive."
  explanation: "vorrei + infinitive."
  evidence:
    - { axis: grammar, id: vorrei, weight: 1.0 }

- status: draft
  id: drill.vorrei.010
  item_type: drill_multiple_choice
  cefr_level: A0
  prompt: "Al bar il barista dice «Prego?». Che cosa vuole dire?"
  choices:
    - "«Che cosa desidera?»"
