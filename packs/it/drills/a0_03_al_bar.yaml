- status: draft
  id: drill.art_un_una.008
  item_type: drill_multiple_choice
  cefr_level: A0
  prompt: "Se un nome prende «la», quale articolo indeterminativo prende?"
  choices: ["una", "un", "un'", "lo"]
  answers:
    - { text: "una", canonical: true }
  explanation: "la → una; il → un. The quickest reliable shortcut."
  evidence:
    - { axis: grammar, id: art_un_una, weight: 1.0 }

