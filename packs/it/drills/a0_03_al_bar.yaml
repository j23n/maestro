  explanation: "Feminine noun starting with a consonant → una."
  evidence:
    - { axis: grammar, id: art_un_una, weight: 1.0 }
    - { axis: function, id: a0_ordinare, weight: 1.0 }

- status: draft
  scenario_ids: [a0-03-al-bar]
  lesson_id: a0-03-al-bar.d1
  id: drill.art_un_una.004
  item_type: drill_cloze
  cefr_level: A0
  prompt: "Vorrei ___ acqua fredda."
  answers:
    - { text: "un'", canonical: true }
  distractor_feedback:
    una: "Before a vowel, «una» drops the a and takes an apostrophe: «un'acqua»."
    un: "«Acqua» is feminine, so it needs «un'», not «un»."
  explanation: "Feminine + vowel → un' with an apostrophe."
  evidence:
    - { axis: grammar, id: art_un_una, weight: 1.0 }
    - { axis: function, id: a0_ordinare, weight: 1.0 }

- status: draft
