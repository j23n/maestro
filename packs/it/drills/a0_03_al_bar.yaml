# Drill bank — lesson a0-03-al-bar (art_un_una, vorrei).
# Ids continue the series already in a0_basics.yaml. Drafted, not reviewed.

# ----------------------------------------------------------- art_un_una
- status: draft
  id: drill.art_un_una.002
  item_type: drill_cloze
  cefr_level: A0
  prompt: "Vorrei ___ caffè, per favore."
  answers:
    - { text: "un", canonical: true }
  distractor_feedback:
    una: "«Caffè» is masculine (il caffè), so it takes «un»."
    un': "The apostrophe form is only for feminine nouns."
  explanation: "Masculine noun → un."
  evidence:
    - { axis: grammar, id: art_un_una, weight: 1.0 }
    - { axis: function, id: a0_ordinare, weight: 1.0 }

- status: draft
  id: drill.art_un_una.003
  item_type: drill_cloze
  cefr_level: A0
  prompt: "Vorrei ___ birra, grazie."
  answers:
    - { text: "una", canonical: true }
  distractor_feedback:
    un: "«Birra» is feminine (la birra), so it takes «una»."
  explanation: "Feminine noun starting with a consonant → una."
  evidence:
    - { axis: grammar, id: art_un_una, weight: 1.0 }
    - { axis: function, id: a0_ordinare, weight: 1.0 }

- status: draft
  id: drill.art_un_una.004
  item_type: drill_cloze
  cefr_level: A0
  prompt: "Vorrei ___ acqua naturale."
  answers:
    - { text: "un'", canonical: true }
  distractor_feedback:
    una: "Before a vowel, «una» drops the a and takes an apostrophe: «un'acqua»."
    un: "«Acqua» is feminine, so it needs «un'», not «un»."
  explanation: "Feminine + vowel → un' with an apostrophe."
  evidence:
    - { axis: grammar, id: art_un_una, weight: 1.0 }
    - { axis: function, id: a0_ordinare, weight: 1.0 }

- status: draft
  id: drill.art_un_una.005
  item_type: drill_cloze
  cefr_level: A0
  prompt: "Ho ___ amico a Roma. (amico = maschile)"
  answers:
    - { text: "un", canonical: true }
  distractor_feedback:
    un': "The apostrophe is feminine only. A masculine noun keeps plain «un», even before a vowel."
  explanation: "un amico — no apostrophe, because amico is masculine."
  evidence:
    - { axis: grammar, id: art_un_una, weight: 1.0 }

- status: draft
  id: drill.art_un_una.006
