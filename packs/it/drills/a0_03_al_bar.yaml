    - "«Non c'è di che»"
  answers:
    - { text: "«Che cosa desidera?»", canonical: true }
  explanation: "Prego? with a question intonation invites your order."
  evidence:
    - { axis: grammar, id: vorrei, weight: 1.0 }
    - { axis: function, id: a0_ordinare, weight: 0.5 }

