  cefr_level: A0
  prompt: "Quale forma è corretta?"
  choices: ["un'aranciata", "un aranciata", "una aranciata", "un'arancciata"]
  answers:
    - { text: "un'aranciata", canonical: true }
  distractor_feedback:
    "una aranciata": "Before a vowel «una» elides to «un'»."
    "un aranciata": "Aranciata is feminine, so it needs the apostrophe form."
  explanation: "Feminine + vowel = un'."
  evidence:
    - { axis: grammar, id: art_un_una, weight: 1.0 }

