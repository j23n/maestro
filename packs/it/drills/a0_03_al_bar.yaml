  item_type: drill_cloze
  cefr_level: A0
  prompt: "Asking to pay: «___ pagare, per favore.»"
  answers:
    - { text: "vorrei pagare", canonical: true }
  explanation: "vorrei + infinitive: vorrei pagare, vorrei prenotare."
  evidence:
    - { axis: grammar, id: vorrei, weight: 1.0 }
    - { axis: function, id: a0_chiedere_cortesemente, weight: 1.0 }

