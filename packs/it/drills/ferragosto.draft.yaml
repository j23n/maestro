- status: reviewed
  id: drill.ferragosto.003
  item_type: drill_multiple_choice
  cefr_level: A1
  modality: writing
  prompt: Mi ___ la spiaggia e il sole.
  answers:
  - text: piace
    canonical: true
  distractor_feedback:
    piacciono: '«Piacciono» is for plural things; «la spiaggia» is singular (the second noun
      does not change that — the verb agrees with the first subject here: one thing at a time
      is safest at A1).'
    piaci: «Piaci» means *you are pleasing* — a different person, not a thing.
  explanation: 'Mi piace + singular noun: mi piace la spiaggia.'
  evidence:
  - axis: grammar
    id: mi_piace
    weight: 1.0
  - axis: function
    id: a0_esprimere_gusti
    weight: 1.0
  choices:
  - piace
  - piacciono
  - piaci
- status: reviewed
  id: drill.ferragosto.004
  item_type: drill_cloze
  cefr_level: A1
  modality: writing
  prompt: In estate io ___ (nuotare) ogni giorno (every day).
  answers:
  - text: nuoto
    canonical: true
  distractor_feedback:
    nuota: «Nuota» is the *lui/lei* form. With «io», -are verbs end in -o.
  explanation: 'Regular -are verbs: io nuoto.'
  evidence:
