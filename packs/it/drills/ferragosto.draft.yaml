- status: reviewed
  id: drill.ferragosto.001
  item_type: drill_cloze
  cefr_level: A1
  modality: writing
  prompt: A Ferragosto noi ___ (andare) al mare.
  answers:
  - text: andiamo
    canonical: true
  distractor_feedback:
    andate: «Andate» is the *voi* form. With «noi», use «andiamo».
    vanno: «Vanno» is the *loro* form. With «noi», use «andiamo».
  explanation: 'Andare is irregular: noi andiamo.'
  evidence:
  - axis: grammar
    id: ind_pres
    weight: 1.0
