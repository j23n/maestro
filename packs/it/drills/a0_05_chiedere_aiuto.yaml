  item_type: drill_multiple_choice
  cefr_level: A0
  prompt: "Which sentence is correct? «___»"
  choices:
    - "Sono a Roma, in Italia."
    - "Sono in Roma, a Italia."
    - "Sono a Roma, a Italia."
    - "Sono in Roma, in Italia."
  answers:
    - { text: "Sono a Roma, in Italia.", canonical: true }
  explanation: "City → a; country → in. Both in one sentence."
  evidence:
    - { axis: grammar, id: prep_place, weight: 1.0 }

