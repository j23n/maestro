# polite_exp reuse — help-seeking, the lesson's own angle
- status: draft
  scenario_ids: [a0-05-chiedere-aiuto]
  lesson_id: a0-05-chiedere-aiuto.d1
  id: drill.polite_exp.013
  item_type: drill_cloze
  cefr_level: A0
  prompt: "Hai bisogno di aiuto. Dici: «Scusi, mi può ___?»"
  answers:
    - { text: "aiutare", canonical: true }
  explanation: "Mi può aiutare? — Can you help me? The one phrase to memorise."
  evidence:
    - { axis: grammar, id: polite_exp, weight: 1.0 }
    - { axis: function, id: a0_chiedere_aiuto, weight: 1.0 }

- status: draft
  scenario_ids: [a0-05-chiedere-aiuto]
  lesson_id: a0-05-chiedere-aiuto.d1
  id: drill.polite_exp.014
  item_type: drill_multiple_choice
  cefr_level: A0
  prompt: "Your passport is missing. What do you say to an official? «___»"
  choices:
    - "Scusi, mi può aiutare?"
    - "Ciao, mi può aiutare?"
    - "Voglio il passaporto."
    - "Prego, il passaporto."
  answers:
    - { text: "Scusi, mi può aiutare?", canonical: true }
  distractor_feedback:
    "Ciao, mi può aiutare?": "«Ciao» is too informal with an official. Use «scusi»."
    "Voglio il passaporto.": "«Voglio» is blunt, and it doesn't explain the problem."
  explanation: "scusi + the problem + mi può aiutare."
  evidence:
    - { axis: grammar, id: polite_exp, weight: 1.0 }
    - { axis: function, id: a0_chiedere_aiuto, weight: 1.0 }

- status: draft
  scenario_ids: [a0-05-chiedere-aiuto]
