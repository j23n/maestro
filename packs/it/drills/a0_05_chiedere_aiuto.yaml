# Drill bank — lesson a0-05-chiedere-aiuto (prep_place, plus polite_exp
# reuse from lesson 1). Drafted, not yet human-reviewed.

- status: draft
  scenario_ids: [a0-05-chiedere-aiuto]
  lesson_id: a0-05-chiedere-aiuto.d1
  id: drill.prep_place.001
  item_type: drill_cloze
  cefr_level: A0
  prompt: "Sono ___ Roma."
  answers:
    - { text: "a", canonical: true }
  distractor_feedback:
    in: "Cities take «a»; «in» is for countries and regions. «Sono a Roma, in Italia.»"
  explanation: "Cities → a."
  evidence:
    - { axis: grammar, id: prep_place, weight: 1.0 }

- status: draft
  scenario_ids: [a0-05-chiedere-aiuto]
  lesson_id: a0-05-chiedere-aiuto.d1
  id: drill.prep_place.002
  item_type: drill_cloze
  cefr_level: A0
  prompt: "Sono ___ Italia."
  answers:
    - { text: "in", canonical: true }
  distractor_feedback:
    a: "Countries take «in». «a» is for cities."
  explanation: "Countries and regions → in."
  evidence:
    - { axis: grammar, id: prep_place, weight: 1.0 }

- status: draft
  scenario_ids: [a0-05-chiedere-aiuto]
  lesson_id: a0-05-chiedere-aiuto.d1
  id: drill.prep_place.003
  item_type: drill_cloze
  cefr_level: A0
  prompt: "Sono ___ Londra. (la mia città d'origine)"
  answers:
    - { text: "di", canonical: true }
  distractor_feedback:
    a: "«Sono a Londra» means you're there right now. Stating origin: «sono di Londra»."
    da: "«Da» is movement from. Origin with essere takes «di»."
  explanation: "essere di + city = to be from."
  evidence:
    - { axis: grammar, id: prep_place, weight: 1.0 }

- status: draft
  scenario_ids: [a0-05-chiedere-aiuto]
