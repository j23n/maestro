  cefr_level: A0
  prompt: "Non capisci. Dici: «Scusi, non ___.»"
  answers:
    - { text: "capisco", canonical: true }
  explanation: "Non capisco — I don't understand. Pair it with «può ripetere?»"
  evidence:
    - { axis: grammar, id: polite_exp, weight: 1.0 }
    - { axis: function, id: a0_chiedere_aiuto, weight: 1.0 }

- status: draft
  scenario_ids: [a0-05-chiedere-aiuto]
  lesson_id: a0-05-chiedere-aiuto.d1
