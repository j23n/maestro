  id: drill.vocab_cibo.006
  item_type: drill_multiple_choice
  cefr_level: A0
  demand: use
  prompt: "Standing at the counter at 8am, which do you order? «___»"
  choices: ["un cappuccino", "il conto", "una birra", "un'acqua frizzante"]
  answers:
    - { text: "un cappuccino", canonical: true }
  distractor_feedback:
    il conto: "That's what you ask for at the end, not what you drink."
    una birra: "At eight in the morning, that's a story rather than a breakfast."
    un'acqua frizzante: "Fine any time, but the breakfast order is a cappuccino."
  explanation: "Cappuccino is a morning drink — Italians stop before lunch."
  evidence:
    - { axis: grammar, id: vocab_cibo, weight: 1.0 }
    - { axis: function, id: a0_ordinare, weight: 1.0 }
