# ---------------------------------------------------------- num_20_100
- status: draft
  scenario_ids: [a0-08-i-numeri-grandi]
  lesson_id: a0-08-i-numeri-grandi.d1
  id: drill.num_20_100.001
  item_type: drill_cloze
  cefr_level: A0
  prompt: "Il biglietto costa ___ euro. (30)"
  answers:
    - { text: "trenta", canonical: true }
  distractor_feedback:
    tredici: "«Tredici» is 13. Thirty is «trenta» — the teens end in -dici, the tens in -anta."
    tre: "«Tre» is 3. Thirty is «trenta»."
  explanation: "Each ten has its own word: venti, trenta, quaranta, cinquanta."
  evidence:
    - { axis: grammar, id: num_20_100, weight: 1.0 }
    - { axis: function, id: a0_contare, weight: 1.0 }

- status: draft
  scenario_ids: [a0-08-i-numeri-grandi]
  lesson_id: a0-08-i-numeri-grandi.d1
  id: drill.num_20_100.002
  item_type: drill_cloze
  cefr_level: A0
  prompt: "Marco ha ___ anni. (80)"
  answers:
    - { text: "ottanta", canonical: true }
  distractor_feedback:
    otto: "«Otto» is 8. Eighty is «ottanta»."
    diciotto: "«Diciotto» is 18. Eighty is «ottanta»."
  explanation: "80 is «ottanta»; 18 is «diciotto». The -anta ending is the ten."
  evidence:
    - { axis: grammar, id: num_20_100, weight: 1.0 }
    - { axis: function, id: a0_contare, weight: 1.0 }

- status: draft
  scenario_ids: [a0-08-i-numeri-grandi]
  lesson_id: a0-08-i-numeri-grandi.d1
  id: drill.num_20_100.003
  item_type: drill_multiple_choice
  cefr_level: A0
  demand: meet
  prompt: "Il negozio dice «Sono settanta euro». Quanto costa?"
  choices: ["70 euro", "17 euro", "7 euro"]
  answers:
    - { text: "70 euro", canonical: true }
  distractor_feedback:
    "17 euro": "17 is «diciassette» — it ends in -dici. «Settanta» ends in -anta, so it is 70."
    "7 euro": "7 is «sette». «Settanta» is ten times that: 70."
  explanation: "«Settanta» = 70. The -anta ending always marks a ten."
  evidence:
    - { axis: grammar, id: num_20_100, weight: 1.0 }
    - { axis: grammar, id: num_0_20, weight: 1.0 }
    - { axis: function, id: a0_contare, weight: 1.0 }

