  id: drill.ore_giorni.004
  item_type: drill_multiple_choice
  cefr_level: A0
  demand: meet
  prompt: "Oggi è giovedì. Domani è ___."
  choices: ["venerdì", "mercoledì", "sabato"]
  answers:
