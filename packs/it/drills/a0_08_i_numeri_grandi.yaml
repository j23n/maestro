  prompt: "In lettere: «Il volo costa 1000 euro.» → «Il volo costa ___ euro.»"
  answers:
    - { text: "mille", canonical: true }
  distractor_feedback:
    cento: "«Cento» is 100. A thousand is «mille»."
    milla: "The word is «mille», with an e."
  explanation: "100 is «cento», 1000 is «mille» — neither takes an article."
