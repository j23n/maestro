  distractor_feedback:
    mercoledì: "«Mercoledì» comes before «giovedì» — that was yesterday."
    sabato: "«Sabato» is two days after «giovedì»."
  explanation: "lunedì, martedì, mercoledì, giovedì, venerdì, sabato, domenica."
  evidence:
    - { axis: grammar, id: ore_giorni, weight: 1.0 }

- status: draft
  scenario_ids: [a0-08-i-numeri-grandi]
  lesson_id: a0-08-i-numeri-grandi.d1
  id: drill.ore_giorni.005
  item_type: drill_cloze
  cefr_level: A0
  prompt: "Che ___ sono? Sono le dieci."
  answers:
    - { text: "ore", canonical: true }
  distractor_feedback:
    ora: "The question is plural: «Che ore sono?». «Che ora è?» exists too, but then the verb is «è»."
    giorno: "That asks the day, not the time."
  explanation: "«Che ore sono?» — plural question, plural answer."
  evidence:
    - { axis: grammar, id: ore_giorni, weight: 1.0 }
    - { axis: function, id: a0_dire_ora, weight: 1.0 }

- status: draft
  scenario_ids: [a0-08-i-numeri-grandi]
