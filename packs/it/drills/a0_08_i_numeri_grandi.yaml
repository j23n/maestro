# ---------------------------------------------------------- ore_giorni
- status: draft
  scenario_ids: [a0-08-i-numeri-grandi]
  lesson_id: a0-08-i-numeri-grandi.d1
  id: drill.ore_giorni.001
  item_type: drill_cloze
  cefr_level: A0
  prompt: "Che ore sono? ___ le tre."
  answers:
    - { text: "Sono", canonical: true }
  distractor_feedback:
    È: "«È» is only for one o'clock: «È l'una». Every other hour is plural: «Sono le tre»."
    Sei: "«Sei» is «you are». The time takes «sono»."
  explanation: "Hours are plural in Italian — «sono le due, sono le tre»."
  evidence:
    - { axis: grammar, id: ore_giorni, weight: 1.0 }
    - { axis: function, id: a0_dire_ora, weight: 1.0 }

- status: draft
  scenario_ids: [a0-08-i-numeri-grandi]
  lesson_id: a0-08-i-numeri-grandi.d1
  id: drill.ore_giorni.002
  item_type: drill_cloze
  cefr_level: A0
  prompt: "È ___ una. (13:00)"
  answers:
    - { text: "l'", canonical: true }
  distractor_feedback:
    la: "«La una» never happens — «la» elides before the vowel: «l'una»."
    le: "«Le» is for the plural hours. One o'clock is singular: «è l'una»."
  explanation: "One o'clock is the singular hour: «è l'una», not «sono le una»."
  evidence:
    - { axis: grammar, id: ore_giorni, weight: 1.0 }
    - { axis: function, id: a0_dire_ora, weight: 1.0 }

- status: draft
  scenario_ids: [a0-08-i-numeri-grandi]
  lesson_id: a0-08-i-numeri-grandi.d1
  id: drill.ore_giorni.003
  item_type: drill_cloze
  cefr_level: A0
  prompt: "A che ora parte il treno? Parte ___ otto e trenta."
  answers:
    - { text: "alle", canonical: true }
  distractor_feedback:
    a: "«A» fuses with the article: a + le = «alle»."
    alla: "«Alla» is singular feminine. The hours are plural: «alle otto»."
    all': "«All'» is for «all'una» only, before the vowel."
  explanation: "«A che ora?» is answered with «alle» + the hour."
  evidence:
    - { axis: grammar, id: ore_giorni, weight: 1.0 }
    - { axis: function, id: a0_dire_ora, weight: 1.0 }

- status: draft
  scenario_ids: [a0-08-i-numeri-grandi]
