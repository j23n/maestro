  id: speaking.numeri_grandi.perform.001
  item_type: speaking_prompt
  cefr_level: A0
  demand: perform
  prompt: Al mercato. (Say what the market costs you in a week, in a month and in a year,
    and give your verdict on the price. Nothing on screen to read.)
  target_text: Quanto pago? Venti euro alla settimana, cento al mese, mille all'anno. Il prezzo
    è buono, ma non ho soldi.
  variants:
  - Venti euro alla settimana, cento euro al mese, mille euro all'anno. Non ho soldi!
  - Pago venti euro alla settimana, cento al mese e mille all'anno.
  explanation: The three scales — week, month, year — are where the big numbers live.
