  id: speaking.a0_congedarsi.001
  item_type: speaking_prompt
  cefr_level: A0
  demand: use
  prompt: Al bar. (You have paid. Now leave properly — thank him and say goodbye.)
  target_text: Grazie mille e buona giornata. Arrivederci!
  variants:
  - Grazie mille. Arrivederci e buona giornata!
  - Grazie e arrivederci!
  explanation: Walking out on a «grazie» is not a goodbye. «Arrivederci» is what closes the
    exchange — the thanks comes before it, not instead of it.
