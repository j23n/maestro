  id: speaking.a0_congedarsi.005
  item_type: speaking_prompt
  cefr_level: A0
  demand: perform
  prompt: All'uscita. Una signora dice «Lei è italiano?» (Answer no, then say who you are
    and where you are from.)
  target_text: No, non sono italiano. Io sono inglese, di Londra. Mi chiamo Marco.
  variants:
  - No, non sono italiano. Sono inglese e mi chiamo Marco.
  - No, sono inglese. Io mi chiamo Marco e sono di Londra.
  explanation: A bare «no» ends the conversation; «no, non sono...» keeps it open, because
    the sentence after it is your turn.
