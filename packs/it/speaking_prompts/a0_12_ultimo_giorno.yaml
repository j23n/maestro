  id: speaking.a0_congedarsi.002
  item_type: speaking_prompt
  cefr_level: A0
  demand: use
  prompt: In albergo, con la valigia. (You are checking out. Thank the woman at the desk for
    the room and say goodbye to her.)
  target_text: Grazie mille per la camera, signora. Arrivederci!
  variants:
  - Grazie per la camera. Arrivederci, signora!
  - Grazie mille, signora. Buona giornata e arrivederci!
  explanation: «Arrivederci» to someone you are not going to see again; «ciao» only to a Luca,
    never to a signora behind a desk.
