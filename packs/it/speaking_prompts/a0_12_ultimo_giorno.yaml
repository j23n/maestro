  item_type: speaking_prompt
  cefr_level: A0
  demand: perform
  prompt: All'aeroporto. La signora vuole sapere l'ora del volo. (Say what time the flight
    leaves, and what day you get there.)
  target_text: Il volo parte alle sei e venti. Arrivo domani mattina.
  variants:
  - Parte alle sei e venti, e arrivo domani mattina.
  - L'aereo parte alle sei e venti. Domani mattina sono a casa.
  explanation: '«Alle» for every hour but one: «all''una». And the day goes after the hour,
    not before it.'
