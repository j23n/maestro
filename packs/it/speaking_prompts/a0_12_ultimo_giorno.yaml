  item_type: speaking_prompt
  cefr_level: A0
  demand: perform
  prompt: La sera, alla porta. (Say goodnight, say goodbye, and say you will see them tomorrow.)
  target_text: Buonanotte e arrivederci. Ci vediamo domani!
  variants:
  - Buonanotte, arrivederci. Ci vediamo domani.
  - Buonanotte! Ci vediamo domani, arrivederci.
  explanation: 'Three moves, in this order: the greeting for the hour («buonanotte»), the
    goodbye, and when. «Ci vediamo domani» is the ordinary way to say the last one.'
