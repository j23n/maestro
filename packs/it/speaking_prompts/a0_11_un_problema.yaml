  item_type: speaking_prompt
  cefr_level: A0
  demand: perform
  prompt: Alla stazione. (Your suitcase is missing. Say you can't find it, that you have been
    looking for an hour, and that you will wait here.)
  target_text: Non trovo la valigia. Cerco da un'ora e aspetto qui.
  variants:
  - Non trovo la mia valigia. La cerco da un'ora. Aspetto qui.
  explanation: «Cercare» is the looking, «trovare» the finding. A problem usually needs both.
  evidence:
