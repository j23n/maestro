  cefr_level: A0
  demand: perform
  prompt: Alla porta. (Ask whether you may come in, then admit you do not know how to say
    it in Italian.)
  target_text: Posso entrare? Scusi, non so come si dice in italiano.
  variants:
  - Posso entrare, per favore? Non so come si dice.
  explanation: «Come si dice...?» buys you the word you are missing — the one question worth
    memorising whole.
