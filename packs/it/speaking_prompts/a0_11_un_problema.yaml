  item_type: speaking_prompt
  cefr_level: A0
  demand: perform
  prompt: Al telefono con l'albergo. (Answer the phone, then say you are not well and that
    you cannot hear properly.)
  target_text: Pronto? Scusi, non sto bene e non sento bene.
  variants:
  - Pronto? Non sto bene. Scusi, non sento bene.
  explanation: Italians answer the phone with «pronto?», not with their name. The same word
    means *ready* everywhere else.
