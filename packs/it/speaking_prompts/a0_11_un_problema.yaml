  cefr_level: A0
  demand: perform
  prompt: In farmacia. (You have been handed something too expensive. Turn it down politely
    and ask what else there is.)
  target_text: No, grazie. È molto caro. Ha altro?
  variants:
  - No, grazie, non desidero. È caro. Ha altro, per favore?
  explanation: «No, grazie» is a complete refusal; «è caro. Ha altro?» turns it into a second
    offer instead of a dead end.
