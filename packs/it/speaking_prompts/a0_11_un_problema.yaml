  item_type: speaking_prompt
  cefr_level: A0
  demand: use
  prompt: In albergo. (Tell the receptionist you have a problem and ask for help.)
  target_text: Scusi, ho un problema. Mi può aiutare?
  variants:
  - Scusi, ho un problema. Mi aiuta, per favore?
  explanation: «Ho un problema» first, «mi può aiutare?» second — in that order the other
    person already knows what they are helping with.
