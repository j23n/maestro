  item_type: speaking_prompt
  cefr_level: A0
  demand: perform
  prompt: '«Lei è italiano? Abita qui?» (Answer both — no, then yes — and give your house
    number: fourteen.)'
  target_text: No, non sono italiano. Sì, abito qui, al numero quattordici.
  variants:
  - No, non sono italiano, sono inglese. Sì, abito qui al numero quattordici.
  - No, non sono italiano. Sì, abito al numero quattordici.
  explanation: Two questions, two answers, and every «no» brings its «non» with it. A «no»
    on its own leaves the other person guessing.
