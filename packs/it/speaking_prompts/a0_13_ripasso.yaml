  prompt: Non trovi il museo. (Stop a stranger properly and ask where it is.)
  target_text: Scusi, dov'è il museo?
  variants:
  - Scusi, signora. Dov'è il museo?
  - Mi scusi, dov'è il museo, per favore?
  explanation: «Scusi» first — it is what buys you the other person's attention. Then one
    short question, not two.
