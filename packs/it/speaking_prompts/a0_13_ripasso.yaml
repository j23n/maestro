  demand: perform
  prompt: In aereo. Un signore ti saluta. (Greet him back, say your name, and ask his.)
  target_text: Buongiorno! Mi chiamo Marco. E lei, come si chiama?
  variants:
  - Buongiorno. Io mi chiamo Marco. Lei come si chiama?
  - Salve! Mi chiamo Marco. E lei?
  explanation: «Mi chiamo» for yourself, «si chiama» for the person you are speaking to. Same
    verb, two shapes — that is the whole exchange.
