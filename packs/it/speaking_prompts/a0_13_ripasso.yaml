  prompt: Al banco, all'ora di pranzo. (Order a sandwich and a still water, politely.)
  target_text: Vorrei un panino e un'acqua naturale, per favore.
  variants:
  - Un panino e un'acqua naturale, per favore.
  - Vorrei un panino e un'acqua naturale. Grazie!
  explanation: «Un'acqua» with the apostrophe — «acqua» is feminine and starts with a vowel;
    «un panino» never takes one.
