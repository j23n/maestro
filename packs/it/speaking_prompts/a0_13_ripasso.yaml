  prompt: Il passaporto non c'è. (Say what the problem is, say you have another document,
    and ask for help.)
  target_text: 'Ho un problema: non trovo il passaporto. Ho un altro documento. Mi può aiutare?'
  variants:
  - Scusi, ho un problema. Non trovo il passaporto, ma ho un altro documento. Mi può aiutare?
  - Non trovo il passaporto. Ho un documento. Mi aiuta, per favore?
  explanation: Problem, then what you do have, then the request. In that order the other person
    can help on the first pass.
