  item_type: speaking_prompt
  cefr_level: A0
  demand: perform
  prompt: «Lei è di Roma?» (Say no, say where you are from, and say where you are going.)
  target_text: No, io non sono di Roma. Sono inglese e vado a Firenze.
  variants:
  - No, non sono di Roma. Io sono inglese, e adesso vado a Firenze.
  - No, sono inglese. Io vado a Firenze.
  explanation: «Io» is optional in Italian — you put it in exactly when you are setting yourself
    against someone else, which is what this answer is doing.
