  prompt: «A che ora vuole partire?» (Say half past seven in the morning, and that you get
    there at nine.)
  target_text: Alle sette e trenta di mattina. Arrivo alle nove.
  variants:
  - Vorrei partire alle sette e trenta di mattina, e arrivo alle nove.
  - Alle sette e trenta. Arrivo alle nove di mattina.
  explanation: «Alle sette e trenta» — the minutes come after «e», and «di mattina» is what
    keeps it from meaning the evening.
