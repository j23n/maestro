  demand: perform
  prompt: 'Sei al bar e non trovi il bagno. (Get the barista''s attention, say your

    Italian is not good, and ask.)

    '
  target_text: Scusi! Non parlo bene italiano. Dov'è il bagno, per favore?
  variants:
  - Mi scusi! Non parlo italiano. Dov'è il bagno?
  explanation: Saying «non parlo bene italiano» is not an apology — it tells the other person
    to slow down, which is exactly what you want.
