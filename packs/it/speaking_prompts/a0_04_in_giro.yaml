  id: speaking.a0_scusarsi.001
  item_type: speaking_prompt
  cefr_level: A0
  prompt: In strada. (Stop a woman you do not know — apologise for interrupting, then say
    hello.)
  target_text: Scusi, signora! Buongiorno.
  variants:
  - Scusi! Buongiorno, signora.
  - Scusi, signora.
  explanation: «Scusi» to a stranger, «scusa» to a friend. Say it before the question, never
    after.
