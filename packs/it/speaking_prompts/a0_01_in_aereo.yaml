  id: speaking.in_aereo.perform.002
  item_type: speaking_prompt
  cefr_level: A0
  demand: perform
  prompt: 'Una signora è in piedi alla porta e non ti vede.

    (She is between you and the way out. Get past her, and thank her when

    she moves.)

    '
  target_text: Scusi! Grazie mille.
  variants:
  - Scusi, per favore. Grazie!
  - Scusi... grazie.
  explanation: '«Scusi» to a stranger, «scusa» to a friend — the one letter is the

    whole difference. Two words move a person out of your way; that is

    the entire economy of «cortesia».

    '
