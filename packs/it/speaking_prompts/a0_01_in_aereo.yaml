  id: speaking.in_aereo.perform.001
  item_type: speaking_prompt
  cefr_level: A0
  demand: perform
  prompt: 'Sono le nove di sera. L''assistente è alla porta.

    (Say goodbye to the crew on your way out — pick the greeting that

    fits the hour and the fact that you have never met her.)

    '
  target_text: Buonasera, grazie. Arrivederci!
  variants:
  - Buonanotte, arrivederci!
  - Arrivederci, signore. Grazie!
  - Grazie mille. Arrivederci!
  explanation: '«Ciao» is for friends; to the crew it is «arrivederci», with

    «buonasera» or «buonanotte» depending on the hour. «Salve» is the

    safe one when you cannot tell. Note that «benvenuto» was for the way

    in — it has no place on the way out.

    '
