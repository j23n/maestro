  id: speaking.in_aereo.perform.003
  item_type: speaking_prompt
  cefr_level: A0
  demand: perform
  prompt: 'Il signore del passaporto non ti vede. Dice: «Buonasera. Il volo da

    Londra?» (Answer him. He is not going to ask twice.)

    '
  target_text: Sì, il volo da Londra.
  variants:
  - Sì, signore.
  - Sì. Ecco il passaporto.
  - No, da Milano.
  explanation: 'A closed question at full speed gets a one-word answer. «Sì» or «no»

    first; if anything follows, it follows after.

    '
