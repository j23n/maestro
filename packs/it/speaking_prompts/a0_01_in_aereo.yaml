  item_type: speaking_prompt
  cefr_level: A0
  demand: use
  prompt: «Un caffè, signore?» (Turn it down politely.)
  target_text: No, grazie.
  variants:
  - No, grazie mille.
  - No, grazie. Un'acqua, per favore.
  explanation: 'A bare «no» is blunt in any language. «No, grazie» is the whole

    refusal — nothing else is needed and nothing else is expected.

    '
