  item_type: speaking_prompt
  cefr_level: A0
  demand: perform
  prompt: In piazza, di domenica. (Greet Giulia and ask how she is.)
  target_text: Ciao Giulia, come stai?
  variants:
  - Salve Giulia, come stai?
  - Ciao Giulia, come va?
  explanation: 'Greeting first, then «come stai?» — one word of essere is not enough here:
    how you are is «stare».'
  evidence:
  - axis: grammar
    id: simp_sent
    weight: 0.5
