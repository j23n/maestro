  prompt: Il tuo amico. (Say who your friend is and where he is from.)
  target_text: Lui è il mio amico Marco. È di Milano.
  variants:
  - Lui è Marco, il mio amico. È di Milano.
  explanation: Third person, so the verb is «è» — «lui è», then just «è».
