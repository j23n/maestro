# XcodeGen spec — the source of truth for the Xcode project.
#
#   brew install xcodegen
#   cd ios && xcodegen
#
# Regenerating is safe: Maestro.xcodeproj is derived, never hand-edited,
# and is not committed. See ios/BUILD.md for the full first-run sequence.

name: Maestro

options:
  bundleIdPrefix: com.maestro
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    # Swift 5 language mode on purpose: the evidence arrays crossing the
    # core boundary are [[String: Any]], which Swift 6 strict concurrency
    # rejects in a View. Revisit once evidence is a typed struct.
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Maestro:
    type: application
    platform: iOS
    sources:
      - path: Maestro
      # Generated by core/generate-swift-bindings.sh and committed, so a
      # first build needs only the xcframework.
      - path: ../core/bindings/swift/maestro_core.swift
        group: Core
      # The content bundle, built by:
      #   uv run python -m authoring.cli build --include-draft
      # CoreBridge looks it up as "it.pack.sqlite".
      - path: ../build/it.pack.sqlite
        group: Resources
        buildPhase: resources
    dependencies:
      # Built by core/build-xcframework.sh (macOS only) — it will not
      # exist on a fresh clone until you run that script.
      - framework: ../core/build/MaestroCore.xcframework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.maestro.italian
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_CFBundleDisplayName: Maestro
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        # Speaking practice records and transcribes on device.
        INFOPLIST_KEY_NSMicrophoneUsageDescription:
          Maestro listens while you practise speaking Italian, and scores your
          pronunciation on device.
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription:
          Maestro transcribes your speech on device to check it against the
          sentence you were asked to say.
