[project]
name = "itcontent"
version = "0.1.0"
description = "Italiano content pipeline: lint, annotate, check, TTS and pack build (docs/04)"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "ruamel.yaml>=0.18",
    "jsonschema>=4.23",
    "pydantic>=2.9",
    "typer>=0.15",
    "requests>=2.32",
]

[project.scripts]
content = "itcontent.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "playwright>=1.48",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/itcontent"]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]   # Italian text and typographic quotes are intentional

[tool.ruff.format]
quote-style = "double"
