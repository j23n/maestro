id: u02.task
review: {status: draft, by: null, date: null, hash: null}
conversations:
  - id: u02.task.conv1
    format: conversation
    with: ch:giulia
    register: lei
    title: {en: "Order breakfast from Giulia"}
    tags: [cd:order-food-drink]
    goals: [{id: food, en: "Order something to eat, or say no thanks"}]
    start: n1
    nodes:
      n1:
        say: "Buongiorno! E da mangiare?"
        en: "Good morning! Anything to eat?"
        expect:
          - {intent: order-food, goal: food, accept: ["(vorrei )un cornetto( per favore)"], next: end}
          - {intent: nothing-to-eat, goal: food, accept: ["no grazie"], next: end}
        help: ["Un cornetto, per favore.", "No, grazie."]
      end: {say: "Ecco!", en: "Here you are!", final: true}
talk:
  id: u02.task.talk
  format: talk
  tags: [cd:order-food-drink]
  prompt_en: "Greet Giulia and order."
  points:
    - {id: greet, en: "Greet Giulia", accept: ["{buongiorno|buonasera}"]}
  pass: 1
  model: "Buongiorno! Vorrei un cornetto."
  duration_s: {min: 5, max: 60}
relay:
  id: u02.task.relay
  format: relay
  tags: [cd:order-food-drink]
  source:
    text:
      id: u02.task.menu
      kind: real_world
      layout:
        type: menu
        title: Bar Aurora
        sections:
          - title: Colazione
            rows:
              - {name: cornetto, price: "1,40"}
        ignore: [Colazione]
  friend_en: "How much is a croissant in there?"
  answer_en: {type: price, value: 1.40}
