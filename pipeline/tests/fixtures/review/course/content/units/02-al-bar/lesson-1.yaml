id: u02.l1
title: {it: "Un cappuccino, per favore", en: "A cappuccino, please"}
scene: Marco's first breakfast at Bar Aurora
review: {status: draft, by: null, date: null, hash: null}
steps:
  - kind: preview
    id: u02.l1.step-preview
    batches: [[w:cornetto, c:vorrei], [w:amico]]
  - kind: story
    id: u02.l1.step-story
    text:
      id: u02.l1.story
      kind: story
      title: {it: "Bar Aurora", en: "Bar Aurora"}
      lines:
        - {speaker: narrator, it: "Marco è in un bar a Bologna.", en: "Marco is in a café in Bologna."}
        - {speaker: ch:giulia, to: ch:marco, register: lei, it: "Buongiorno! Cosa prende? E da mangiare?", en: "Good morning! What will you have? Anything to eat?", gloss: {da mangiare: to eat}}
        - {speaker: ch:marco, to: ch:giulia, register: lei, it: 'Vorrei un cornetto, per favore. Come si dice "croissant"?', en: 'I''d like a croissant, please. How do you say "croissant"?', foreign: [croissant]}
    questions:
      - id: u02.l1.q1
        format: choice
        tags: [cd:order-food-drink]
        question_en: "What does Marco order?"
        options: [A croissant, A coffee]
        answer: 0
  - kind: note
    id: u02.l1.step-note
    note_id: u02.l1.note
    grammar: [g:indefinite-article]
    title_en: un and una
    intro: {mascot: think, text_en: "Marco orders *un cornetto*."}
    body:
      - p: "*Un* and *una* both mean \"a\"."
      - table: {columns: [Masculine, Feminine], rows: [["**un** cornetto", "**una** spremuta"]]}
      - examples: [u02.l1.story#3]
      - tip: Learn every noun with its article.
  - kind: practice
    id: u02.l1.step-practice
    block:
      - id: u02.l1.ex01
        format: cloze
        targets: [{item: g:indefinite-article, skill: recall}]
        tags: [cd:order-food-drink]
        source: u02.l1.story#3
        text: "Vorrei [[un]] cornetto, per favore."
        prompt_en: "I'd like a croissant, please."
        hint: "Cornetto is masculine."
        near: [{answer: una, hint: "Una is for feminine nouns."}]
      - id: u02.l1.ex04
        format: recall
        targets: [{item: w:cornetto, skill: recall}]
        tags: [cd:order-food-drink]
        prompt_en: "a croissant"
        answer: "un [cornetto]"
        near: [{answer: "una cornetto", outcome: almost, hint: "Cornetto is masculine."}]
        audio_after: true
      - id: u02.l1.ex10
        format: sentence-building
        targets: [{item: c:vorrei, skill: recall}]
        tags: [cd:order-food-drink]
        prompt_en: "I'd like a croissant."
        tiles: [vorrei, un, cornetto]
        distractors: [una]
        answer: ["vorrei un cornetto"]
      - id: u02.l1.ex13
        format: dictation
        targets: [{item: w:cornetto, skill: listen}]
        tags: [sy:fn.goods-services]
        say: "Vorrei un cornetto."
        slow: true
    mix:
      - id: u02.l1.ex20
        format: match
        targets: [{item: w:cornetto, skill: read}, {item: w:amico, skill: read}]
        tags: [sy:fn.goods-services]
        pairs: [["un cornetto", "a croissant"], ["un'amica", "a (female) friend"]]
  - kind: sounds
    id: u02.l1.step-sounds
    exercises:
      - id: u02.l1.ex22
        format: sound-pair
        targets: [{item: s:double-consonants, skill: listen}]
        tags: [sy:fn.goods-services]
        question: which-word
        pair: [eco, ecco]
        play: ecco
        glosses: {eco: echo, ecco: here is}
        tip_en: "Listen for the double c."
  - kind: use
    id: u02.l1.step-use
    exercise:
      id: u02.l1.ex25
      format: conversation
      with: ch:giulia
      register: lei
      title: {en: "Order what Marco had"}
      tags: [cd:order-food-drink]
      goals: [{id: order, en: "Order a croissant"}]
      start: n1
      nodes:
        n1:
          say: "Buongiorno! Cosa prende?"
          en: "Good morning! What will you have?"
          expect:
            - {intent: order, goal: order, accept: ["(buongiorno )(vorrei )un cornetto( per favore)"], next: end}
          near: [{answer: "(vorrei )una cornetto", hint: "Cornetto is masculine."}]
          help: ["Vorrei un cornetto, per favore."]
          hint_en: "Order a croissant."
        end:
          say: "Ecco! Buona giornata!"
          en: "Here you are! Have a good day!"
          final: true
