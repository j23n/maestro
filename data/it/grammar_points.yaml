- code: prep_other
  cefr_level: A1
  category: preposizioni
  subcategory: preposizioni semplici
  unistr_code: altre_forme_preposizionali_es_senza_nota_acquisite_a_livello_formulaico
  unistr_label: 'Altre forme preposizionali, es. senza Nota: acquisite a livello formulaico'
  label: Altre preposizioni semplici di uso formulaico
  description: Fixed, high-frequency Italian prepositions (da, su, fra/tra, verso,
    senza) used in set everyday expressions at A1 level.
  examples:
  - Arrivo da Roma domani.
  - Il libro è su tavolo.
  - Ci vediamo fra cinque minuti.
  - Vado verso la stazione.
  - Un caffè senza zucchero, per favore.
  - Torno tra due giorni.
  chunk_ref: book_10_la_preposizione_preposizioni_proprie
  explanations:
    en:
      title: Simple prepositions in everyday formulas
      tip: Italian has nine core prepositions — di, a, da, in, con, su, per, fra/tra
        — and you will meet them in fixed phrases from your very first lessons. Learning
        the most common phrase-by-phrase combinations now will let you speak naturally
        before you have mastered every grammatical rule behind them.
      explanation: |-
        ## The nine core prepositions

        Italian grammarians call these the <span lang="it">preposizioni proprie</span> ('proper prepositions') because — with one small exception — they work exclusively as prepositions. They are:

        | Italian | Closest English equivalent(s) |
        |---|---|
        | di | of, from |
        | a | to, at |
        | da | from, by, since |
        | in | in, into, to |
        | con | with |
        | su | on, on top of |
        | per | for, through, in order to |
        | fra / tra | between, among, in (time) |

        <span lang="it">Fra</span> and <span lang="it">tra</span> are completely interchangeable in meaning; you may choose either one freely. The only reason to prefer one over the other is to avoid awkward-sounding repetition — for example, native speakers usually avoid saying <span lang="it">tra treni</span> and would choose <span lang="it">fra treni</span> instead.

        ## The one exception: su as an adverb

        All nine prepositions are used exclusively as prepositions, with one small exception: <span lang="it">su</span> can also function as an adverb meaning 'up'. You will see this in phrases like <span lang="it">vieni su!</span> ('come up!'). At A1 level you do not need to worry about this distinction — simply be aware that <span lang="it">su</span> sometimes stands alone without a following noun.

        ## Formulaic uses you need from day one

        At A1, the most practical approach is to learn these prepositions inside the fixed phrases you encounter most often. Below are the key formulas grouped by preposition.

        ### di — of, from

        <span lang="it">Di</span> shows possession or origin and appears in countless set expressions.

        - <span lang="it">un bicchiere di acqua</span> — a glass of water
        - <span lang="it">Sono di Roma.</span> — I am from Rome.
        - <span lang="it">di mattina</span> — in the morning (set time expression)

        ### a — to, at

        <span lang="it">A</span> expresses location (staying somewhere) or direction (going somewhere), and appears in greetings and time expressions.

        - <span lang="it">a casa</span> — at home
        - <span lang="it">a scuola</span> — at school
        - <span lang="it">a domani!</span> — see you tomorrow! (literally 'until tomorrow')
        - <span lang="it">a presto!</span> — see you soon!
        - <span lang="it">alle tre</span> — at three o'clock

        ### da — from, by, since, at someone's place

        <span lang="it">Da</span> is one of the most versatile prepositions. Its key formulaic uses at A1 are:

        - <span lang="it">Vengo da Milano.</span> — I come from Milan.
        - <span lang="it">da quanto tempo?</span> — since how long? / how long has it been?
        - <span lang="it">da stamattina</span> — since this morning
        - <span lang="it">da Maria</span> — at Maria's place (used like French <span lang="it">chez</span>)

        ### in — in, to, into

        <span lang="it">In</span> is used with countries, rooms, and means of transport.

        - <span lang="it">in Italia</span> — in Italy / to Italy
        - <span lang="it">in cucina</span> — in the kitchen
        - <span lang="it">in autobus</span> — by bus

        ### con — with

        <span lang="it">Con</span> is the most straightforward preposition — it almost always means 'with'.

        - <span lang="it">con la famiglia</span> — with the family
        - <span lang="it">un caffè con latte</span> — a coffee with milk

        ### su — on

        - <span lang="it">Il libro è sul tavolo.</span> — The book is on the table. (Note: <span lang="it">sul</span> = <span lang="it">su + il</span>, a contracted form — see the note on contracted prepositions below.)

        ### per — for, in order to

        - <span lang="it">per favore</span> — please (literally 'as a favour') — one of the most essential fixed phrases in Italian
        - <span lang="it">per te</span> — for you
        - <span lang="it">Studiamo per imparare.</span> — We study in order to learn.

        ### fra / tra — between, among, in (future time)

        - <span lang="it">fra due giorni</span> — in two days (time counted forward from now)
        - <span lang="it">tra amici</span> — among friends
        - <span lang="it">fra me e te</span> — between me and you

        ## Important: prepositions combine with articles

        Several prepositions merge with the definite article (<span lang="it">il, la, lo, i, gli, le</span>) to form a single contracted word called a <span lang="it">preposizione articolata</span> ('articulated preposition'). This is a separate rule, but you need to recognise these forms as soon as you start reading Italian.

        The most common contractions you will meet at A1:

        | Preposition + article | Contracted form | Example |
        |---|---|---|
        | di + il | del | del pane (some bread / of the bread) |
        | a + il | al | al bar (at the café) |
        | da + il | dal | dal medico (at the doctor's) |
        | in + il | nel | nel parco (in the park) |
        | su + il | sul | sul tavolo (on the table) |

        <span lang="it">Con</span>, <span lang="it">per</span>, <span lang="it">fra</span>, and <span lang="it">tra</span> do **not** contract with the article in modern Italian — they always stay separate.

        ## Full examples with translations

        1. <span lang="it">Vado a scuola con mia sorella.</span> — I go to school with my sister.
        2. <span lang="it">Il gatto è sul divano.</span> — The cat is on the sofa.
        3. <span lang="it">Abito in Italia da tre anni.</span> — I have lived in Italy for three years. (<span lang="it">da</span> + time period = duration up to the present)
        4. <span lang="it">Un caffè per favore, senza zucchero.</span> — A coffee please, without sugar.
        5. <span lang="it">Arriviamo fra cinque minuti.</span> — We will arrive in five minutes.
        6. <span lang="it">Sei di Milano o di Roma?</span> — Are you from Milan or from Rome?

        ## Common learner mistakes

        **Mistake 1 — Confusing <span lang="it">a</span> and <span lang="it">in</span> for location.**
        English uses 'in' for most places, but Italian uses <span lang="it">a</span> with cities and <span lang="it">in</span> with countries and rooms.
        - ✗ <span lang="it">*Sono in Roma.</span>
        - ✓ <span lang="it">Sono a Roma.</span> — I am in Rome.
        - ✓ <span lang="it">Sono in Italia.</span> — I am in Italy.

        **Mistake 2 — Translating 'for + time' with <span lang="it">per</span> when you mean duration up to now.**
        When an action started in the past and is still happening, Italian uses <span lang="it">da</span>, not <span lang="it">per</span>.
        - ✗ <span lang="it">*Studio italiano per due anni.</span>
        - ✓ <span lang="it">Studio italiano da due anni.</span> — I have been studying Italian for two years.

        **Mistake 3 — Forgetting that <span lang="it">fra</span> and <span lang="it">tra</span> are identical in meaning.**
        Students sometimes assume one is more formal or more correct. They are fully interchangeable — choose whichever sounds better next to the words around it.

        **Mistake 4 — Writing contracted prepositions as two separate words.**
        - ✗ <span lang="it">*a il bar</span>
        - ✓ <span lang="it">al bar</span> — the contraction is mandatory, not optional.
      language: en
      why_this_matters: Prepositions are the small words that glue sentences together,
        and in Italian they appear constantly — in greetings, times, places, and everyday
        requests. Even at the very beginning, you will need fixed phrases like <span
        lang="it">a casa</span> ('at home') or <span lang="it">per favore</span> ('please')
        long before you understand every rule that governs prepositions. Recognising
        these nine core words and their most common formulaic uses removes a huge
        source of early confusion and lets you communicate from day one.
  source_url: https://www.unistrapg.it/profilo_lingua_italiana/site/gram_preposizioni_a1.html

