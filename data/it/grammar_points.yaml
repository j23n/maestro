- code: all_det_in
  cefr_level: A1
  category: articoli
  subcategory: articoli
  unistr_code: la_differente_funzione_di_tutti_gli_articoli_determinativi_ed_indeterminativi
  unistr_label: La differente funzione di tutti gli articoli determinativi ed indeterminativi
  label: Funzioni dell'articolo determinativo e indeterminativo
  description: Italian articles mark whether a noun is specific (the) or non-specific
    (a/an). Choice depends on definiteness, gender, and the noun's initial sound.
  examples:
  - <span lang='it'>Il cane di Maria è molto grande.</span>
  - <span lang='it'>Ho un fratello e una sorella.</span>
  - <span lang='it'>Lo zaino è sul tavolo.</span>
  - <span lang='it'>L'amica di Paolo si chiama Giulia.</span>
  - <span lang='it'>Prendo un caffè, per favore.</span>
  - <span lang='it'>Le ragazze sono in classe.</span>
  chunk_ref: book_5_l_articolo
  explanations:
    en:
      title: Definite and indefinite articles in Italian
      tip: Every Italian noun needs an article, and the article must match the noun's
        gender (masculine or feminine) and number (singular or plural). The definite
        article ('the') points to something specific and known; the indefinite article
        ('a / an') introduces something new or unspecified.
      explanation: |-
        Every Italian noun needs an article, and the article must match the noun's gender (masculine or feminine) and number (singular or plural). The definite article points to something specific and known; the indefinite article introduces something new or unspecified.

        ## What an article does

        The article (<span lang="it">l'articolo</span>, literally 'the article') is the small word placed directly before a noun. It tells the listener two things at once: whether the noun is specific and already known (definite) or general and newly introduced (indefinite), and whether the noun is masculine or feminine, singular or plural.

        ## The definite article — 'the'

        Use the definite article (<span lang="it">l'articolo determinativo</span>) when both speaker and listener know exactly which person or thing is meant — because it has already been mentioned, because there is only one of it, or because it is being discussed as a category in general.

        The form of the definite article changes depending on the gender and number of the noun that follows it, and also on the first sound of that noun.

        | Gender &amp; number | Starts with… | Article | Example |
        |---|---|---|---|
        | Masculine singular | most consonants | il | il libro (the book) |
        | Masculine singular | s + consonant, z, gn, ps, x, y | lo | lo studente (the student) |
        | Masculine singular | any vowel | l' | l'amico (the friend) |
        | Masculine plural | most consonants | i | i libri (the books) |
        | Masculine plural | s + consonant, z, gn, ps, x, y, vowel | gli | gli studenti (the students) |
        | Feminine singular | any consonant | la | la madre (the mother) |
        | Feminine singular | any vowel | l' | l'amica (the female friend) |
        | Feminine plural | any sound | le | le madri (the mothers) |

        ## The indefinite article — 'a / an'

        Use the indefinite article (<span lang="it">l'articolo indeterminativo</span>) when you are introducing a noun for the first time, when you are talking about one unspecified example of something, or when you mean 'a certain kind of thing'. The indefinite article only has singular forms in Italian — to express 'some' in the plural, Italian uses the partitive article (<span lang="it">del, della, dei</span>, etc.), which is covered in a separate entry.

        | Gender | Starts with… | Article | Example |
        |---|---|---|---|
        | Masculine | most consonants or any vowel | un | un caffè (a coffee) |
        | Masculine | s + consonant, z, gn, ps, x, y | uno | uno zaino (a backpack) |
        | Feminine | any consonant | una | una pizza (a pizza) |
        | Feminine | any vowel | un' | un'arancia (an orange) |

        Notice that the masculine <span lang="it">un</span> does not add an apostrophe before a vowel (<span lang="it">un amico</span>, not <span lang="it">*un'amico</span>), while the feminine <span lang="it">una</span> always drops its final vowel and adds an apostrophe before a vowel (<span lang="it">un'amica</span>).

        ## When each article is used

        Use the <strong>definite article</strong> when:

        - the noun has already been mentioned or is clearly identified: <span lang="it">Ho un cane. Il cane si chiama Leo.</span> (I have a dog. The dog is called Leo.)
        - you refer to something as a whole category: <span lang="it">Mi piace la pasta.</span> (I like pasta — pasta in general.)
        - there is only one of the thing: <span lang="it">Il sole è grande.</span> (The sun is big.)

        Use the <strong>indefinite article</strong> when:

        - you introduce something for the first time: <span lang="it">Ho un cane.</span> (I have a dog — introducing it.)
        - you mean 'one of many', not a specific item: <span lang="it">Vorrei una mela.</span> (I would like an apple — any apple.)

        ## Examples

        <span lang="it">Il bambino mangia la pizza.</span>
        (The child is eating the pizza. — both are specific and known.)

        <span lang="it">Ho una sorella e un fratello.</span>
        (I have a sister and a brother. — introducing family members for the first time.)

        <span lang="it">L'acqua è fredda.</span>
        (The water is cold. — a specific glass of water already in view, or water as a substance in general.)

        <span lang="it">Gli studenti sono in classe.</span>
        (The students are in class. — a specific known group.)

        <span lang="it">Voglio un caffè, per favore.</span>
        (I want a coffee, please. — one unspecified coffee.)

        <span lang="it">Mi piace il caffè.</span> vs. <span lang="it">Voglio un caffè.</span>
        (I like coffee — coffee in general / I want a coffee — one specific cup. This contrast is crucial.)

        ## Common learner mistakes

        <strong>Mistake 1 — Omitting the article:</strong> English sometimes drops the article ('I like coffee', 'She is a teacher'), but Italian almost always requires one. Do not write <span lang="it">*Mi piace caffè</span>; write <span lang="it">Mi piace il caffè</span>.

        <strong>Mistake 2 — Wrong gender:</strong> <span lang="it">*il problema</span> looks masculine because <span lang="it">problema</span> ends in <span lang="it">-a</span>, but it is actually masculine (from Greek): <span lang="it">il problema</span> is correct. Always learn the article together with each new noun.

        <strong>Mistake 3 — Using <span lang="it">il</span> instead of <span lang="it">lo</span>:</strong> Before <span lang="it">s</span> + consonant or <span lang="it">z</span>, masculine singular nouns take <span lang="it">lo</span>, not <span lang="it">il</span>. Write <span lang="it">lo zaino</span>, not <span lang="it">*il zaino</span>.

        <strong>Mistake 4 — Apostrophe on masculine <span lang="it">un</span>:</strong> Only the feminine <span lang="it">una</span> takes an apostrophe before a vowel. The masculine form stays <span lang="it">un</span> without an apostrophe: <span lang="it">un uomo</span> (a man), never <span lang="it">*un'uomo</span>.

        <strong>Mistake 5 — Definite where indefinite is needed:</strong> Saying <span lang="it">*Ho il gatto</span> to introduce a pet for the first time sounds as if the listener already knows the cat. Use <span lang="it">Ho un gatto</span> (I have a cat) to introduce it.
      language: en
      why_this_matters: 'Articles appear in front of almost every noun in Italian,
        so you will meet them in the very first sentences you read or hear. Getting
        them right is not optional: the wrong article — or a missing one — makes a
        sentence sound ungrammatical to a native speaker. Mastering articles also
        forces you to learn the gender of every new noun, which unlocks agreement
        with adjectives and past-tense verbs later on.'
    it:
      title: Articoli determinativi e indeterminativi in italiano
      tip: L'articolo determinativo (<span lang='it'>il, lo, la, l', i, gli, le</span>)
        si usa quando parliamo di qualcosa di specifico o già noto. L'articolo indeterminativo
        (<span lang='it'>un, uno, una, un'</span>) si usa quando menzioniamo qualcosa
        per la prima volta o in modo generico. La forma dell'articolo dipende dal
        genere, dal numero e dalla lettera con cui inizia il nome.
      explanation: |-
        ## Articoli determinativi e indeterminativi in italiano

        ### Che cos'è l'articolo?

        L'articolo (article) è una piccola parola che si mette davanti al nome. In italiano ci sono due tipi:

        - **Articolo determinativo** (definite article): equivale a *the* in inglese. Si usa quando il nome è specifico, già noto o unico nel suo genere.
        - **Articolo indeterminativo** (indefinite article): equivale a *a / an* in inglese. Si usa quando il nome è generico, nuovo nel discorso, o uno tra tanti.

        ---

        ### Articolo determinativo — forme

        La forma cambia secondo il **genere** (maschile/femminile), il **numero** (singolare/plurale) e la **lettera iniziale** del nome.

        | | Singolare | Plurale |
        |---|---|---|
        | **Maschile** — consonante normale | <span lang='it'>il</span> | <span lang='it'>i</span> |
        | **Maschile** — s + consonante, z, gn, ps, x, y | <span lang='it'>lo</span> | <span lang='it'>gli</span> |
        | **Maschile** — vocale | <span lang='it'>l'</span> | <span lang='it'>gli</span> |
        | **Femminile** — consonante | <span lang='it'>la</span> | <span lang='it'>le</span> |
        | **Femminile** — vocale | <span lang='it'>l'</span> | <span lang='it'>le</span> |

        **Esempi:**

        - <span lang='it'>il libro</span> (the book) → <span lang='it'>i libri</span> (the books)
        - <span lang='it'>lo studente</span> (the student, m.) → <span lang='it'>gli studenti</span> (the students)
        - <span lang='it'>l'amico</span> (the friend, m.) → <span lang='it'>gli amici</span> (the friends)
        - <span lang='it'>la casa</span> (the house) → <span lang='it'>le case</span> (the houses)
        - <span lang='it'>l'amica</span> (the friend, f.) → <span lang='it'>le amiche</span> (the friends)
        - <span lang='it'>lo zaino</span> (the backpack) → <span lang='it'>gli zaini</span> (the backpacks)

        ---

        ### Articolo indeterminativo — forme

        Esiste solo al singolare. Il plurale si esprime senza articolo (o con l'espressione <span lang='it'>dei / delle</span>, ma questo si impara dopo).

        | | Singolare |
        |---|---|
        | **Maschile** — consonante normale | <span lang='it'>un</span> |
        | **Maschile** — s + consonante, z, gn, ps, x, y | <span lang='it'>uno</span> |
        | **Femminile** — consonante | <span lang='it'>una</span> |
        | **Femminile** — vocale | <span lang='it'>un'</span> |

        > ⚠️ Attenzione: <span lang='it'>un</span> maschile non ha apostrofo; <span lang='it'>un'</span> femminile ha sempre l'apostrofo.

        **Esempi:**

        - <span lang='it'>un gatto</span> (a cat)
        - <span lang='it'>uno specchio</span> (a mirror)
        - <span lang='it'>una borsa</span> (a bag)
        - <span lang='it'>un'ora</span> (an hour)

        ---

        ### Quando si usa l'articolo determinativo?

        1. **Quando il nome è già noto** nel discorso:
           - <span lang='it'>Ho un cane. Il cane si chiama Rex.</span> (I have a dog. The dog is called Rex.)

        2. **Quando il nome è unico o specifico:**
           - <span lang='it'>Il sole è caldo oggi.</span> (The sun is warm today.)

        3. **Con i nomi geografici** (paesi, fiumi, montagne):
           - <span lang='it'>L'Italia è bella.</span> (Italy is beautiful.)

        4. **Con i giorni della settimana** per indicare abitudine:
           - <span lang='it'>Il lunedì vado in palestra.</span> (On Mondays I go to the gym.)

        5. **Con le lingue** (dopo il verbo <span lang='it'>parlare</span> l'articolo spesso si omette):
           - <span lang='it'>L'italiano è bello.</span> (Italian is beautiful.) / <span lang='it'>Parlo italiano.</span> (I speak Italian.)

        ---

        ### Quando si usa l'articolo indeterminativo?

        1. **Quando il nome appare per la prima volta** nel discorso:
           - <span lang='it'>Ho un fratello.</span> (I have a brother.)

        2. **Quando il nome è uno qualunque** di una categoria:
           - <span lang='it'>Voglio un caffè.</span> (I want a coffee.)

        3. **Dopo il verbo <span lang='it'>essere</span>** con professioni (senza articolo a livello base):
           - <span lang='it'>Sono un medico.</span> (I am a doctor.) — in italiano questo uso è accettato, ma spesso si dice anche semplicemente <span lang='it'>Sono medico.</span>

        ---

        ### Errori comuni degli studenti

        | Errore | Correzione | Spiegazione |
        |---|---|---|
        | <span lang='it'>*un' amico*</span> | <span lang='it'>un amico</span> | <span lang='it'>amico</span> è maschile: si usa <span lang='it'>un</span> senza apostrofo |
        | <span lang='it'>*il studente*</span> | <span lang='it'>lo studente</span> | <span lang='it'>st-</span> richiede <span lang='it'>lo</span> |
        | <span lang='it'>*una ora*</span> | <span lang='it'>un'ora</span> | femminile che inizia con vocale: apostrofo obbligatorio |
        | <span lang='it'>*i gli amici*</span> | <span lang='it'>gli amici</span> | maschile plurale con vocale: solo <span lang='it'>gli</span> |

        ---

        ### Riepilogo visivo

        ```
        Nome maschile singolare:
          consonante normale → il (il libro)
          s+cons., z, gn...  → lo (lo zaino)
          vocale             → l' (l'amico)

        Nome femminile singolare:
          consonante         → la (la borsa)
          vocale             → l' (l'amica)

        Nome maschile plurale:
          consonante normale → i (i libri)
          s+cons., z, gn...  → gli (gli zaini)
          vocale             → gli (gli amici)

        Nome femminile plurale:
          tutti              → le (le borse, le amiche)

        Indeterminativo singolare:
          maschile normale   → un (un libro)
          maschile spec.     → uno (uno zaino)
          femminile cons.    → una (una borsa)
          femminile vocale   → un' (un'amica)
        ```
      language: it
      why_this_matters: Gli articoli compaiono quasi in ogni frase italiana, prima
        di quasi ogni nome. Senza saperli usare correttamente non si riesce a costruire
        nemmeno le frasi più semplici. Imparare bene le forme degli articoli aiuta
        anche a riconoscere subito il genere e il numero dei nomi.
  source_url: https://www.unistrapg.it/profilo_lingua_italiana/site/gram_articoli_a1.html

- code: art_hora
  cefr_level: A1
  category: articoli
  subcategory: articolo determinativo
  unistr_code: uso_dellarticolo_determinativo_per_esprimere_lora_es_sono_le_otto
  unistr_label: Uso dell’articolo determinativo per esprimere l’ora, es. Sono le otto.
  label: Articolo determinativo per esprimere l'ora
  description: In Italian, the definite article (la/le) is always used before clock
    times. 'È l'una' for 1:00; 'Sono le tre' for all other hours.
  examples:
  - <span lang='it'>Sono le otto di mattina.</span>
  - <span lang='it'>È l'una e mezza.</span>
  - <span lang='it'>A che ora parti? Parto alle nove.</span>
  - <span lang='it'>Il treno arriva alle tre e un quarto.</span>
  - <span lang='it'>La lezione finisce a mezzogiorno.</span>
  - <span lang='it'>Sono le undici e cinque di sera.</span>
  chunk_ref: book_5_l_articolo_usi_particolari
  prerequisites:
  - all_det_in
  explanations:
    en:
      title: Telling the time with the definite article
      tip: In Italian, you always use a definite article — 'la' or 'le' — when saying
        what time it is. Without the article, a time expression sounds incomplete
        or wrong to a native speaker.
      explanation: |-
        ## The rule: what article to use and when

        Italian treats each hour as a feminine noun. The hours are thought of as <span lang="it">le ore</span> (the hours), which is feminine plural. This is why the article is always feminine.

        Use <span lang="it">l'una</span> (the one) for 1:00, because <span lang="it">una</span> is singular — it uses the singular elided form <span lang="it">l'</span>.

        Use <span lang="it">le</span> + the number for every other hour (2:00 through 12:00 / midnight / noon), because all other numbers are plural.

        The verb used to express the time is <span lang="it">essere</span> (to be), and it must agree with the article:

        - <span lang="it">È l'una.</span> — singular verb <span lang="it">è</span>
        - <span lang="it">Sono le due.</span> — plural verb <span lang="it">sono</span>

        ## Full paradigm of the hours

        | Time | Italiano |
        |---|---|
        | 1:00 | È l'una. |
        | 2:00 | Sono le due. |
        | 3:00 | Sono le tre. |
        | 4:00 | Sono le quattro. |
        | 5:00 | Sono le cinque. |
        | 6:00 | Sono le sei. |
        | 7:00 | Sono le sette. |
        | 8:00 | Sono le otto. |
        | 9:00 | Sono le nove. |
        | 10:00 | Sono le dieci. |
        | 11:00 | Sono le undici. |
        | 12:00 (noon) | È mezzogiorno. |
        | 12:00 (midnight) | È mezzanotte. |

        Note: <span lang="it">mezzogiorno</span> (noon) and <span lang="it">mezzanotte</span> (midnight) are masculine and feminine nouns respectively, used without any article.

        ## Adding minutes

        To say minutes past the hour, add <span lang="it">e</span> (and) followed by the minutes:

        <span lang="it">Sono le tre e venti.</span> — It is twenty past three.

        For a quarter past, use <span lang="it">e un quarto</span> (and a quarter):

        <span lang="it">Sono le otto e un quarto.</span> — It is a quarter past eight.

        For half past, use <span lang="it">e mezza</span> or <span lang="it">e mezzo</span> (and a half — both forms are acceptable):

        <span lang="it">Sono le sei e mezza.</span> — It is half past six.

        For minutes to the hour, use <span lang="it">meno</span> (minus/less) followed by the minutes:

        <span lang="it">Sono le cinque meno dieci.</span> — It is ten to five (literally: five minus ten).

        For a quarter to, use <span lang="it">meno un quarto</span>:

        <span lang="it">È l'una meno un quarto.</span> — It is a quarter to one.

        ## Asking and answering 'What time is it?'

        The standard question is:

        <span lang="it">Che ora è?</span> or <span lang="it">Che ore sono?</span> — What time is it?

        Both forms are correct and very common. <span lang="it">Che ore sono?</span> (plural) is slightly more frequent in everyday speech.

        ## Saying 'at' a particular time

        To say something happens <span lang="it">at</span> a certain time, replace <span lang="it">è / sono</span> with the preposition <span lang="it">a</span> (at), which combines with the article:

        - <span lang="it">a + l' → all'</span>: <span lang="it">all'una</span> (at one o'clock)
        - <span lang="it">a + le → alle</span>: <span lang="it">alle tre</span> (at three o'clock)

        The article is still required here — it just merges with <span lang="it">a</span>.

        ## Examples

        <span lang="it">— Che ore sono? — Sono le sette.</span>
        (— What time is it? — It is seven o'clock.)

        <span lang="it">La scuola inizia alle otto e mezza.</span>
        (School starts at half past eight.)

        <span lang="it">Mangiamo all'una.</span>
        (We eat at one o'clock.)

        <span lang="it">Il treno parte alle nove e un quarto.</span>
        (The train leaves at a quarter past nine.)

        <span lang="it">— A che ora finisce il film? — Alle undici meno venti.</span>
        (— At what time does the film end? — At twenty to eleven.)

        <span lang="it">Il negozio chiude a mezzogiorno.</span>
        (The shop closes at noon.) — Note: no article with <span lang="it">mezzogiorno</span>.

        ## Common learner mistakes

        **Mistake 1 — omitting the article:**
        ❌ <span lang="it">Sono tre.</span> ✅ <span lang="it">Sono le tre.</span>
        The article is never optional. Dropping it sounds ungrammatical.

        **Mistake 2 — using <span lang="it">è</span> instead of <span lang="it">sono</span> for hours other than one:**
        ❌ <span lang="it">È le due.</span> ✅ <span lang="it">Sono le due.</span>
        Because <span lang="it">le due</span> is plural, the verb must be plural too. Only <span lang="it">l'una</span>, <span lang="it">mezzogiorno</span>, and <span lang="it">mezzanotte</span> use <span lang="it">è</span>.

        **Mistake 3 — forgetting that <span lang="it">a</span> contracts with the article:**
        ❌ <span lang="it">a le cinque</span> ✅ <span lang="it">alle cinque</span>
        ❌ <span lang="it">a l'una</span> ✅ <span lang="it">all'una</span>
        The preposition <span lang="it">a</span> always combines with the article — it never stands alone before a time.

        **Mistake 4 — adding an article before <span lang="it">mezzogiorno</span> or <span lang="it">mezzanotte</span>:**
        ❌ <span lang="it">Sono le mezzogiorno.</span> ✅ <span lang="it">È mezzogiorno.</span>
        These two words stand alone — they never take an article.
      language: en
      why_this_matters: Telling the time is one of the first practical tasks you face
        in Italian, and it works differently from English. Every time expression in
        Italian requires a definite article — <span lang="it">la</span> or <span lang="it">le</span>
        — in front of the number. Without it, sentences like <span lang="it">'Sono
        le tre'</span> ('It is three o'clock') cannot be formed correctly. Mastering
        this small rule means you can immediately ask and answer questions about schedules,
        appointments, meals, and daily routines.
    it:
      title: L'articolo determinativo per dire l'ora
      tip: 'In italiano, per dire l''ora si usa sempre l''articolo determinativo femminile:
        <span lang=''it''>la</span> o <span lang=''it''>le</span>. Si dice <span lang=''it''>è
        l''una</span> (solo per l''una, al singolare) e <span lang=''it''>sono le
        due, le tre</span>, ecc. (al plurale per tutte le altre ore).'
      explanation: |-
        ## L'articolo determinativo con l'ora

        ### Regola principale

        In italiano, l'ora si esprime sempre con l'articolo determinativo femminile, perché si sottintende la parola <span lang='it'>**ora**</span> (femminile). La struttura di base è:

        - <span lang='it'>**È** + **l'una**</span> → per le 13:00 / 01:00
        - <span lang='it'>**Sono** + **le** [numero]</span> → per tutte le altre ore

        ### Formazione

        | Ora | Forma italiana |
        |---|---|
        | 1:00 | <span lang='it'>È l'una.</span> |
        | 2:00 | <span lang='it'>Sono le due.</span> |
        | 3:00 | <span lang='it'>Sono le tre.</span> |
        | 12:00 | <span lang='it'>Sono le dodici.</span> |

        > **Nota:** Si usa <span lang='it'>**è**</span> (singolare) solo con <span lang='it'>l'una</span>. Per tutte le altre ore si usa <span lang='it'>**sono**</span> (plurale).

        ### Eccezioni speciali

        Due espressioni non usano l'articolo determinativo:

        - <span lang='it'>**mezzogiorno**</span> (noon) → <span lang='it'>È mezzogiorno.</span>
        - <span lang='it'>**mezzanotte**</span> (midnight) → <span lang='it'>È mezzanotte.</span>

        ### Minuti e frazioni

        Per i minuti, si aggiunge <span lang='it'>**e**</span> + il numero dei minuti:

        - <span lang='it'>Sono le tre **e** dieci.</span> (3:10)
        - <span lang='it'>Sono le otto **e** venti.</span> (8:20)

        Espressioni comuni per le frazioni:

        | Espressione | Significato |
        |---|---|
        | <span lang='it'>e un quarto</span> | quarter past (e.g. 3:15) |
        | <span lang='it'>e mezza / e mezzo</span> | half past (e.g. 3:30) |
        | <span lang='it'>meno un quarto</span> | quarter to (e.g. 2:45 = <span lang='it'>le tre meno un quarto</span>) |

        ### La preposizione A + ora

        Quando si specifica **a che ora** succede qualcosa, si usa la preposizione <span lang='it'>**a**</span> che si fonde con l'articolo:

        - <span lang='it'>a + le → **alle**</span>
        - <span lang='it'>a + l' → **all'**</span>

        Esempi:

        - <span lang='it'>Il film inizia **alle** sette.</span> (The film starts at seven.)
        - <span lang='it'>Arrivo **all'** una.</span> (I arrive at one.)
        - <span lang='it'>La lezione è **alle** nove e mezza.</span> (The lesson is at half past nine.)

        ### Mattina, pomeriggio, sera, notte

        Per specificare il momento della giornata si aggiunge <span lang='it'>**di**</span> + il periodo:

        - <span lang='it'>Sono le otto **di mattina**.</span> (It's eight in the morning.)
        - <span lang='it'>Sono le tre **del pomeriggio**.</span> (It's three in the afternoon.)
        - <span lang='it'>Sono le undici **di sera**.</span> (It's eleven in the evening.)
        - <span lang='it'>È l'una **di notte**.</span> (It's one at night.)

        > **Nota:** Si dice <span lang='it'>del pomeriggio</span> (articolo fuso) e <span lang='it'>di mattina / di sera / di notte</span> (senza articolo).

        ### Esempi con traduzione

        1. <span lang='it'>Sono le due.</span> (It's two o'clock.)
        2. <span lang='it'>È l'una e un quarto.</span> (It's quarter past one.)
        3. <span lang='it'>Il treno parte alle sei e mezza.</span> (The train leaves at half past six.)
        4. <span lang='it'>La farmacia apre alle nove di mattina.</span> (The pharmacy opens at nine in the morning.)
        5. <span lang='it'>A che ora mangi? Mangio all'una.</span> (What time do you eat? I eat at one.)
        6. <span lang='it'>È mezzogiorno. Andiamo a pranzo!</span> (It's noon. Let's go for lunch!)

        ### Errori comuni

        | ❌ Errore | ✅ Forma corretta | Spiegazione |
        |---|---|---|
        | <span lang='it'>È le tre.</span> | <span lang='it'>**Sono** le tre.</span> | Solo con <span lang='it'>l'una</span> si usa <span lang='it'>è</span>. |
        | <span lang='it'>Sono l'una.</span> | <span lang='it'>**È** l'una.</span> | Con <span lang='it'>l'una</span> si usa <span lang='it'>è</span> (singolare). |
        | <span lang='it'>a le due</span> | <span lang='it'>**alle** due</span> | La preposizione <span lang='it'>a</span> si fonde con <span lang='it'>le</span>. |
        | <span lang='it'>È dodici.</span> | <span lang='it'>Sono **le** dodici.</span> | L'articolo non si omette mai con i numeri. |
      language: it
      why_this_matters: 'Dire l''ora è una delle abilità più utili nella vita quotidiana:
        orari di treni, appuntamenti, lezioni. Senza l''articolo corretto, la frase
        suona sbagliata anche se il numero è giusto.'
  source_url: https://www.unistrapg.it/profilo_lingua_italiana/site/gram_articoli_a1.html

- code: art_omit_d
  cefr_level: A1
  category: articoli
  subcategory: articoli determinativi
  unistr_code: omissione_dellarticolo_determinativo_con_gli_aggettivi_dimostrativi_es_questo
  unistr_label: Omissione dell’articolo determinativo con gli aggettivi dimostrativi,
    es. questo quaderno
  label: Omissione dell'articolo determinativo con aggettivi dimostrativi
  description: In Italian, demonstrative adjectives (questo, quello) replace the definite
    article — never combine both before a noun.
  examples:
  - <span lang='it'>Questo libro è interessante.</span>
  - <span lang='it'>Quella ragazza si chiama Maria.</span>
  - <span lang='it'>Questi studenti sono bravi.</span>
  - <span lang='it'>Quell'uomo è il mio professore.</span>
  - <span lang='it'>Quelle scarpe sono rosse.</span>
  chunk_ref: book_5_l_articolo_usi_particolari
  prerequisites:
  - all_det_in
  - dem_questo
  explanations:
    en:
      title: When to drop the definite article
      tip: Italian normally uses definite articles before nouns, but there are important
        exceptions. Learning the main cases — family members with possessives, most
        city names, and titles before names — will help you sound natural from the
        very beginning.
      explanation: |-
        ## The core rule

        Italian uses the definite article before most nouns, but omits it in several specific, predictable situations. The most important ones for beginners are family-member nouns combined with possessive adjectives, most city names, and personal names preceded by a title. Each case has its own logic — learn the pattern, not just a list.

        ## Case 1: Family members with possessive adjectives

        When a noun referring to a family member — <span lang="it">padre</span> ('father'), <span lang="it">madre</span> ('mother'), <span lang="it">fratello</span> ('brother'), <span lang="it">sorella</span> ('sister'), <span lang="it">zio</span> ('uncle'), <span lang="it">zia</span> ('aunt'), <span lang="it">nonno</span> ('grandfather'), <span lang="it">cugino</span> ('cousin') — is preceded by a possessive adjective (<span lang="it">mio, tuo, suo, nostro, vostro, loro</span>), the definite article is normally dropped.

        **Formation without article:** possessive adjective + family noun

        | Con articolo (SBAGLIATO) | Senza articolo (GIUSTO) | English |
        |---|---|---|
        | *il mio padre | mio padre | my father |
        | *la tua sorella | tua sorella | your sister |
        | *il suo fratello | suo fratello | his/her brother |
        | *la nostra zia | nostra zia | our aunt |

        ### Exceptions — when the article comes back

        The article **must** be used with family nouns in the following situations:

        **1. Plural family nouns always keep the article:**

        <span lang="it">i miei nonni</span> (my grandparents) — NOT <span lang="it">*miei nonni</span>

        <span lang="it">i nostri cugini</span> (our cousins) — NOT <span lang="it">*nostri cugini</span>

        <span lang="it">le tue sorelle</span> (your sisters) — NOT <span lang="it">*tue sorelle</span>

        **2. When the family noun has a descriptive adjective or modifier:**

        <span lang="it">il nostro caro zio</span> (our dear uncle)

        <span lang="it">la mia sorella maggiore</span> (my older sister)

        **3. When the noun is a diminutive or altered form (a word with a suffix like <span lang="it">-ino/-etta</span>):**

        <span lang="it">la mia cuginetta</span> (my little/dear cousin)

        **4. <span lang="it">Mamma</span> ('mum') and <span lang="it">papà</span> ('dad') always keep the article:**

        <span lang="it">la mia mamma</span> (my mum) — NOT <span lang="it">*mia mamma</span>

        <span lang="it">il tuo papà</span> (your dad) — NOT <span lang="it">*tuo papà</span>

        **5. With the third-person plural possessive <span lang="it">loro</span>, the article is always kept even in the singular:**

        <span lang="it">il loro padre</span> (their father)

        ## Case 2: City names

        Most Italian city names take **no** article:

        <span lang="it">Roma è bella.</span> (Rome is beautiful.)

        <span lang="it">Abito a Milano.</span> (I live in Milan.)

        However, a small number of city names include the article as a fixed part of the name itself. These must always be written with the article and a capital letter:

        | Città | English |
        |---|---|
        | L'Aquila | L'Aquila |
        | La Spezia | La Spezia |
        | Il Cairo | Cairo |
        | L'Aia | The Hague |
        | La Valletta | Valletta |

        Additionally, when **any** city name is accompanied by an adjective or a descriptive phrase, the article is required:

        <span lang="it">la bella Napoli</span> (beautiful Naples)

        <span lang="it">la Roma dei papi</span> (the Rome of the popes)

        ## Case 3: Surnames (family names)

        Italian has specific rules about using articles before surnames (<span lang="it">cognomi</span>):

        - **Masculine surnames:** In modern everyday Italian, the article is generally **not** used before a man's surname: <span lang="it">Rossi abita qui.</span> Using the article (<span lang="it">il Rossi</span>) is an older or more literary style, sometimes still seen with famous historical figures like <span lang="it">il Petrarca</span> or <span lang="it">il Leopardi</span>, but this usage is declining.

        - **Feminine surnames:** The article **is** used before a woman's surname, whether she is famous or not: <span lang="it">la Callas, la Bianchi.</span>

        - **Surnames referring to a whole family (plural):** The article is always used: <span lang="it">i De Filippo, gli Alberti.</span>

        ## Case 4: Titles before a name

        When a title (<span lang="it">professore, dottore, signora, segretaria</span>, etc.) appears directly before a person's name, the definite article is **required** before the title:

        <span lang="it">il professor Rossi</span> (Professor Rossi)

        <span lang="it">la signora Bianchi</span> (Mrs Bianchi)

        <span lang="it">la segretaria Carla</span> (the secretary Carla)

        **Exception:** A small group of traditional titles take **no** article. Learn these as fixed expressions:

        | Titolo | Meaning | Example |
        |---|---|---|
        | don | Don (clerical/respectful title) | don Giovanni |
        | mastro | Master (craftsman title) | mastro Geppetto |
        | fra | Brother (religious title) | fra Galdino |

        ## Examples in context

        1. <span lang="it">Mia madre lavora a Roma.</span> (My mother works in Rome.) — No article before <span lang="it">madre</span> (singular family noun + possessive) and no article before <span lang="it">Roma</span> (city name).

        2. <span lang="it">I miei nonni abitano a La Spezia.</span> (My grandparents live in La Spezia.) — Article required: <span lang="it">nonni</span> is plural, and <span lang="it">La Spezia</span> is one of the fixed city names.

        3. <span lang="it">Il professor Marini è gentile.</span> (Professor Marini is kind.) — Article required before a title + name.

        4. <span lang="it">La mia mamma si chiama Anna.</span> (My mum's name is Anna.) — Article required with <span lang="it">mamma</span> even though it is singular.

        5. <span lang="it">Ho uno zio simpatico, ma il mio caro zio Luca abita lontano.</span> (I have a funny uncle, but my dear uncle Luca lives far away.) — The second example has an adjective (<span lang="it">caro</span>), so the article is required.

        6. <span lang="it">Conosci la Bianchi? — Sì, don Carlo la conosce bene.</span> (Do you know Ms Bianchi? — Yes, Father Carlo knows her well.) — Article before a woman's surname; no article after the title <span lang="it">don</span>.

        ## Common learner mistakes

        **Mistake 1:** Adding an article before a singular family noun with a possessive.

        <span lang="it">*Il mio fratello è alto.</span> ✗ → <span lang="it">Mio fratello è alto.</span> ✓ (My brother is tall.)

        **Mistake 2:** Forgetting the article when the family noun is plural.

        <span lang="it">*Miei genitori sono a casa.</span> ✗ → <span lang="it">I miei genitori sono a casa.</span> ✓ (My parents are at home.)

        **Mistake 3:** Treating <span lang="it">mamma</span> and <span lang="it">papà</span> like other family nouns and dropping the article.

        <span lang="it">*Mia mamma cucina bene.</span> ✗ → <span lang="it">La mia mamma cucina bene.</span> ✓ (My mum cooks well.)

        **Mistake 4:** Adding an article before a title that belongs to the no-article group.

        <span lang="it">*Il don Giovanni è famoso.</span> ✗ → <span lang="it">Don Giovanni è famoso.</span> ✓

        **Mistake 5:** Omitting the article before a title in the general rule.

        <span lang="it">*Professor Rossi spiega bene.</span> ✗ → <span lang="it">Il professor Rossi spiega bene.</span> ✓ (Professor Rossi explains well.)

        **Mistake 6:** Dropping the article before a city name that contains it as a fixed part.

        <span lang="it">*Abito ad Aquila.</span> ✗ → <span lang="it">Abito all'Aquila.</span> ✓ (I live in L'Aquila.)
      language: en
      why_this_matters: Definite articles — <span lang="it">il, lo, la, i, gli, le</span>
        ('the') — appear constantly in Italian, far more often than in English. But
        certain very common situations call for no article at all, and getting this
        wrong is one of the most frequent mistakes learners make. Knowing exactly
        when to drop the article will make your Italian sound immediately more natural
        in everyday conversations about family, people's names, and places.
    it:
      title: Dimostrativi al posto dell'articolo
      tip: 'In italiano, gli aggettivi dimostrativi come <span lang=''it''>questo</span>
        e <span lang=''it''>quello</span> sostituiscono l''articolo determinativo.
        Non si dice mai <span lang=''it''>il questo libro</span> o <span lang=''it''>la
        quella ragazza</span>: il dimostrativo va usato da solo davanti al nome.'
      explanation: |-
        ## Dimostrativi e articolo determinativo: regola base

        In italiano, gli aggettivi dimostrativi (demonstrative adjectives) <span lang='it'>questo</span> ('this') e <span lang='it'>quello</span> ('that') si usano **al posto** dell'articolo determinativo, non insieme ad esso. Non si combinano mai un articolo e un dimostrativo davanti allo stesso nome.

        ### Formazione

        Il dimostrativo concorda in genere e numero con il nome che accompagna.

        #### <span lang='it'>Questo</span> ('this / these')

        | | Singolare | Plurale |
        |---|---|---|
        | Maschile | <span lang='it'>questo</span> | <span lang='it'>questi</span> |
        | Femminile | <span lang='it'>questa</span> | <span lang='it'>queste</span> |

        Davanti a vocale si può usare l'apostrofo: <span lang='it'>quest'amico</span>, <span lang='it'>quest'amica</span>.

        #### <span lang='it'>Quello</span> ('that / those')

        <span lang='it'>Quello</span> segue le stesse forme dell'articolo determinativo o dell'articolo con preposizione. Di seguito le forme principali:

        | | Singolare | Plurale |
        |---|---|---|
        | Maschile (davanti a consonante) | <span lang='it'>quel</span> | <span lang='it'>quei</span> |
        | Maschile (davanti a s+consonante, z, gn, ps, x, y) | <span lang='it'>quello</span> | <span lang='it'>quegli</span> |
        | Maschile (davanti a vocale) | <span lang='it'>quell'</span> | <span lang='it'>quegli</span> |
        | Femminile (davanti a consonante) | <span lang='it'>quella</span> | <span lang='it'>quelle</span> |
        | Femminile (davanti a vocale) | <span lang='it'>quell'</span> | <span lang='it'>quelle</span> |

        ### Regola principale

        Quando c'è un dimostrativo, **l'articolo non si usa**.

        ✅ <span lang='it'>questo libro</span> (this book)
        ❌ <span lang='it'>il questo libro</span>

        ✅ <span lang='it'>quella ragazza</span> (that girl)
        ❌ <span lang='it'>la quella ragazza</span>

        ### Esempi

        1. <span lang='it'>Questo libro è interessante.</span> (This book is interesting.)
        2. <span lang='it'>Quella ragazza si chiama Maria.</span> (That girl's name is Maria.)
        3. <span lang='it'>Questi studenti sono bravi.</span> (These students are good.)
        4. <span lang='it'>Quell'uomo è il mio professore.</span> (That man is my teacher.)
        5. <span lang='it'>Quelle scarpe sono rosse.</span> (Those shoes are red.)
        6. <span lang='it'>Quest'amica abita a Roma.</span> (This friend lives in Rome.)

        ### Errori comuni

        | Errore | Correzione | Spiegazione |
        |---|---|---|
        | <span lang='it'>il questo libro</span> | <span lang='it'>questo libro</span> | Il dimostrativo sostituisce l'articolo. |
        | <span lang='it'>la quella ragazza</span> | <span lang='it'>quella ragazza</span> | Non si usa mai articolo + dimostrativo. |
        | <span lang='it'>i questi ragazzi</span> | <span lang='it'>questi ragazzi</span> | Anche al plurale vale la stessa regola. |
        | <span lang='it'>quel'amico</span> | <span lang='it'>quell'amico</span> | L'apostrofo richiede due 'l': <span lang='it'>quell'</span>. |

        ### Nota su <span lang='it'>quello</span> e le sue forme

        Fare attenzione alle forme di <span lang='it'>quello</span>: dipendono dalla lettera iniziale del nome che segue, esattamente come le forme dell'articolo determinativo <span lang='it'>il / lo / l' / i / gli / la / le</span>. Più si pratica l'articolo, più diventa facile scegliere la forma giusta di <span lang='it'>quello</span>.
      language: it
      why_this_matters: Questa regola è fondamentale perché usi i dimostrativi ogni
        volta che vuoi indicare qualcosa di preciso — <span lang='it'>questo</span>
        o <span lang='it'>quello</span>. Senza questa regola rischi di fare errori
        molto frequenti come <span lang='it'>il questo</span>, che suona immediatamente
        strano a un parlante nativo.
  source_url: https://www.unistrapg.it/profilo_lingua_italiana/site/gram_articoli_a1.html

- code: art_om_ind
  cefr_level: A1
  category: articoli
  subcategory: articolo determinativo
  unistr_code: omissione_dellarticolo_determinativo_con_gli_aggettivi_indefiniti_es_molti_libri
  unistr_label: Omissione dell’articolo determinativo con gli aggettivi indefiniti,
    es. molti libri
  label: Omissione dell'articolo determinativo con aggettivi indefiniti
  description: In Italian, the definite article is dropped after certain indefinite
    adjectives like 'ogni', 'qualche', and 'nessun'.
  examples:
  - <span lang='it'>Ogni giorno vado a scuola a piedi.</span>
  - <span lang='it'>Qualche studente arriva in ritardo.</span>
  - <span lang='it'>Non ho nessun problema con questo esercizio.</span>
  - <span lang='it'>Qualche amico viene a casa mia stasera.</span>
  - <span lang='it'>Ogni persona ha un nome.</span>
  - <span lang='it'>Non c'è nessuna sedia libera in classe.</span>
  chunk_ref: book_5_l_articolo_usi_particolari
  prerequisites:
  - all_det_in
  - indef_poco
  explanations:
    en:
      title: When to leave out the definite article
      tip: Some words in Italian — especially possessives with family members, certain
        titles, and some place names — never take a definite article. Learning exactly
        where to drop 'il/la/i/le' removes one of the most frequent beginner mistakes.
      explanation: |-
        ## The core rule

        In Italian the definite article is normally required before nouns. However, it is **omitted** in a number of specific, predictable cases. The most important ones for beginners are listed below.

        ## 1. Family members after a possessive adjective (singular only)

        When a **singular, unmodified** family noun follows a possessive adjective (<span lang="it">mio, tuo, suo, nostro, vostro, loro</span>), the definite article is dropped.

        | With article (wrong) | Without article (correct) | English |
        |---|---|---|
        | *il mio padre* | mio padre | my father |
        | *la tua sorella* | tua sorella | your sister |
        | *il suo fratello* | suo fratello | his/her brother |
        | *la nostra nonna* | nostra nonna | our grandmother |

        ### Exceptions — the article stays in four cases

        **a) Plural family nouns** always keep the article:
        <span lang="it">i miei nonni</span> (my grandparents), <span lang="it">le tue sorelle</span> (your sisters).

        **b) A modified family noun** (one with an adjective or other word added) keeps the article:
        <span lang="it">il nostro caro zio</span> (our dear uncle).

        **c) Diminutives and altered forms** keep the article:
        <span lang="it">la mia cuginetta</span> (my little cousin).

        **d)** <span lang="it">Mamma</span> (mum) and <span lang="it">papà</span> (dad) **always** keep the article even in the singular:
        <span lang="it">la mia mamma, il tuo papà.</span>

        ## 2. Titles before a name

        When a title or professional label directly precedes a person's name, the article **is required** in Italian — unlike English, which drops 'the' before titles.

        <span lang="it">il professor Rossi</span> (Professor Rossi), <span lang="it">la dottoressa Bianchi</span> (Dr Bianchi), <span lang="it">la segretaria Carla</span> (the secretary Carla).

        ### Exception — a small group of traditional titles takes **no** article:
        <span lang="it">don, mastro, fra</span> (and a handful of similar archaic or religious titles):
        <span lang="it">don Giovanni, mastro Geppetto, fra Galdino.</span>

        ## 3. Surnames

        **Women's surnames** always take the article, whether the person is famous or not:
        <span lang="it">la Callas, la Bianchi.</span>

        **Men's surnames** traditionally took the article (especially for famous figures: <span lang="it">il Leopardi, il Petrarca</span>), but this usage is declining in modern Italian. In everyday speech, men's surnames are normally used without an article.

        **A surname referring to more than one person** (a family or group) takes a plural article:
        <span lang="it">i De Filippo, gli Alberti.</span>

        ## 4. Place names

        This is a nuanced area; the key patterns to know at A1 are:

        **Cities**: most Italian city names take **no** article. A small number are exceptions because the article is actually part of the name:
        <span lang="it">L'Aquila, La Spezia, Il Cairo.</span>

        **Mountains, rivers, and lakes**: always take the article:
        <span lang="it">il Po, il Trasimeno, il Monviso.</span>

        **Islands**: some take the article (<span lang="it">la Sicilia, l'Elba</span>), others do not (<span lang="it">Capri, Cipro</span>). There is no simple rule here — learn each island name as you meet it.

        **Countries**: some always take an article (<span lang="it">gli Stati Uniti, le Filippine</span>); one refuses it entirely (<span lang="it">Israele</span>). Most countries follow the pattern 'article in some expressions, no article in others'.

        **Rule that overrides all of the above**: whenever a normally article-free place name is accompanied by a descriptive adjective or a qualifying phrase, the article returns:
        <span lang="it">la bellissima Capri</span> (beautiful Capri), <span lang="it">la Roma dei papi</span> (the Rome of the popes).

        ## Examples

        1. <span lang="it">Mia madre si chiama Anna.</span>
        (My mother's name is Anna.) — singular, unmodified family noun: no article.

        2. <span lang="it">La mia mamma lavora in ufficio.</span>
        (My mum works in an office.) — <span lang="it">mamma</span> always keeps the article.

        3. <span lang="it">I miei fratelli abitano a Milano.</span>
        (My brothers live in Milan.) — plural family noun: article required.

        4. <span lang="it">Ho un appuntamento con il dottor Verdi.</span>
        (I have an appointment with Dr Verdi.) — title + name: article required.

        5. <span lang="it">Don Camillo è un personaggio famoso.</span>
        (Don Camillo is a famous character.) — <span lang="it">don</span> is one of the titles that never takes an article.

        6. <span lang="it">Il Po è un fiume importante.</span> vs. <span lang="it">Roma è bella.</span>
        (The Po is an important river. / Rome is beautiful.) — rivers always take the article; most cities do not.

        ## Common learner mistakes

        **Mistake 1 — Adding the article before a singular possessive + family noun:**
        <span lang="it">*il mio padre*</span> ✗ → correct: <span lang="it">mio padre</span> ✓

        **Mistake 2 — Dropping the article before a plural possessive + family noun:**
        <span lang="it">*miei fratelli*</span> ✗ → correct: <span lang="it">i miei fratelli</span> ✓

        **Mistake 3 — Forgetting the article with <span lang="it">mamma</span> and <span lang="it">papà</span>:**
        <span lang="it">*mia mamma*</span> ✗ → correct: <span lang="it">la mia mamma</span> ✓

        **Mistake 4 — Omitting the article before a title + name:**
        <span lang="it">*professor Rossi arriva*</span> ✗ → correct: <span lang="it">il professor Rossi arriva</span> ✓

        **Mistake 5 — Adding the article before most city names:**
        <span lang="it">*la Roma è bella*</span> ✗ → correct: <span lang="it">Roma è bella</span> ✓ (unless a modifier follows: <span lang="it">la Roma antica</span> ✓)
      language: en
      why_this_matters: Italian uses the definite article (<span lang="it">il, la,
        i, le,</span> etc.) far more often than English uses 'the', so learners tend
        to add it everywhere. But several very common situations — talking about your
        family, addressing someone by title, or naming certain cities — require you
        to leave it out entirely. Getting this right makes your Italian sound natural
        from your very first conversations.
  source_url: https://www.unistrapg.it/profilo_lingua_italiana/site/gram_articoli_a1.html

- code: art_pos_ad
  cefr_level: A1
  category: articoli
  subcategory: determinativo
  unistr_code: presenza_dellarticolo_determinativo_in_posizione_che_precede_gli_aggettivi
  unistr_label: Presenza dell’articolo determinativo in posizione che precede gli
    aggettivi possessivi, es. la mia sedia
  label: Articolo determinativo con aggettivi possessivi
  description: 'In Italian, possessive adjectives (my, your, his…) are almost always
    preceded by a definite article: il mio, la tua, il suo.'
  examples:
  - <span lang='it'>Il mio nome è Marco.</span>
  - <span lang='it'>La mia famiglia abita a Roma.</span>
  - <span lang='it'>Dov'è il tuo zaino?</span>
  - <span lang='it'>I miei genitori lavorano molto.</span>
  - <span lang='it'>La sua macchina è nuova.</span>
  - <span lang='it'>Mia madre si chiama Anna.</span>
  chunk_ref: book_5_l_articolo_usi_particolari
  prerequisites:
  - all_det_in
  - poss_adj
  explanations:
    en:
      title: Definite articles with possessive adjectives
      tip: 'In Italian, you usually drop the definite article before singular family
        nouns used with a possessive adjective — so ''my mother'' is ''mia madre'',
        not ''la mia madre''. But there are important exceptions: always keep the
        article in the plural, with ''mamma'' and ''papà'', and when an extra describing
        word is added.'
      explanation: |-
        ## The basic rule

        When a singular family noun is directly preceded by a possessive adjective (<span lang="it">mio, tuo, suo, nostro, vostro, loro</span> — my, your, his/her, our, your, their), you do **not** use the definite article (<span lang="it">il, la, l'</span>).

        **Pattern:** possessive adjective + family noun (no article)

        | Italian | English |
        |---|---|
        | mio padre | my father |
        | tua sorella | your sister |
        | suo fratello | his/her brother |
        | nostra madre | our mother |
        | vostro zio | your uncle |
        | loro figlia | their daughter |

        This pattern applies to the most common singular family terms: <span lang="it">padre</span> (father), <span lang="it">madre</span> (mother), <span lang="it">figlio/figlia</span> (son/daughter), <span lang="it">fratello</span> (brother), <span lang="it">sorella</span> (sister), <span lang="it">nonno/nonna</span> (grandfather/grandmother), <span lang="it">zio/zia</span> (uncle/aunt), <span lang="it">cugino/cugina</span> (cousin), <span lang="it">nipote</span> (nephew/niece/grandchild).

        ## When you MUST keep the article

        There are four important exceptions — situations where the definite article is **required** even with a possessive adjective and a family noun.

        ### 1. Plural family nouns

        In the plural, the article always returns.

        | Italian | English |
        |---|---|
        | i miei nonni | my grandparents |
        | i nostri cugini | our cousins |
        | le tue sorelle | your sisters |
        | i suoi fratelli | his/her brothers |

        ### 2. 'Mamma' and 'papà' — always take the article

        The everyday words <span lang="it">mamma</span> (mum) and <span lang="it">papà</span> (dad) always keep the article, even in the singular.

        | Italian | English |
        |---|---|
        | la mia mamma | my mum |
        | il tuo papà | your dad |

        ### 3. When an adjective is added

        If any describing word (adjective) accompanies the family noun, the article is required.

        | Italian | English |
        |---|---|
        | il nostro caro zio | our dear uncle |
        | la mia piccola sorella | my little sister |

        ### 4. When an altered form (diminutive or similar) is used

        Italian family nouns can take suffixes that add a shade of meaning — for example, making a word sound smaller or more affectionate. These altered forms (<span lang="it">alterati</span>) always keep the article.

        | Italian | English |
        |---|---|
        | la mia cuginetta | my little/dear cousin |
        | il mio fratellino | my little brother |

        ## Examples in context

        <span lang="it">Mio fratello si chiama Marco.</span>
        (My brother's name is Marco.) — singular, no adjective: no article.

        <span lang="it">I miei fratelli si chiamano Marco e Luca.</span>
        (My brothers are called Marco and Luca.) — plural: article required.

        <span lang="it">La mia mamma cucina bene.</span>
        (My mum cooks well.) — 'mamma' always takes the article.

        <span lang="it">Il nostro caro nonno abita a Roma.</span>
        (Our dear grandfather lives in Rome.) — adjective 'caro' present: article required.

        <span lang="it">Tua sorella parla italiano?</span>
        (Does your sister speak Italian?) — singular, no adjective: no article.

        <span lang="it">La mia sorellina dorme.</span>
        (My little sister is sleeping.) — diminutive form: article required.

        ## Common learner mistakes

        **Mistake 1 — Adding the article in the simple singular case:**
        Learners often write <span lang="it">*la mia sorella</span> by analogy with English 'my sister', not realising Italian drops the article here. Correct form: <span lang="it">mia sorella</span>.

        **Mistake 2 — Dropping the article in the plural:**
        Having learned the 'no article' rule, learners then wrongly say <span lang="it">*miei nonni</span> without an article. Correct form: <span lang="it">i miei nonni</span>.

        **Mistake 3 — Forgetting the article with 'mamma' and 'papà':**
        Because <span lang="it">madre</span> and <span lang="it">padre</span> drop the article, learners assume the same for <span lang="it">mamma</span> and <span lang="it">papà</span>. Incorrect: <span lang="it">*mia mamma</span>. Correct: <span lang="it">la mia mamma</span>.

        **Mistake 4 — Dropping the article when an adjective is present:**
        Learners sometimes write <span lang="it">*nostro caro zio</span> instead of <span lang="it">il nostro caro zio</span>. Any time a describing word joins the phrase, the article comes back.

        ## Quick summary table

        | Situation | Article? | Example |
        |---|---|---|
        | Singular family noun, no adjective | No | mio padre |
        | Plural family noun | Yes | i miei fratelli |
        | Mamma or papà, any number | Yes | la mia mamma |
        | Family noun + adjective | Yes | il nostro caro zio |
        | Diminutive / altered form | Yes | la mia sorellina |
      language: en
      why_this_matters: Talking about your family is one of the very first things
        you do in Italian — introducing your parents, siblings, and grandparents comes
        up constantly at A1 level. The rule about dropping or keeping the article
        with family nouns is one of the most frequent sources of errors for English
        speakers, because English always says 'my brother', 'your sister' with no
        article at all, whereas Italian has a nuanced pattern you need to follow from
        day one.
  source_url: https://www.unistrapg.it/profilo_lingua_italiana/site/gram_articoli_a1.html

