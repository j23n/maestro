- code: pron_pers
  cefr_level: A1
  category: pronomi
  subcategory: pronomi personali
  unistr_code: pronomi_personali_con_particolare_riferimento_alle_3_persone_singolari_soggetto
  unistr_label: 'Pronomi personali con particolare riferimento alle 3 persone singolari:
    soggetto e complemento (tonici ed atoni)'
  label: Pronomi personali soggetto e complemento delle tre persone singolari
  description: Personal pronouns replacing a noun as subject or object. Italian has
    distinct forms for subject, direct object, and indirect object.
  examples:
  - <span lang='it'>Io mi chiamo Marco e tu come ti chiami?</span>
  - <span lang='it'>Lei parla italiano molto bene.</span>
  - <span lang='it'>Mi puoi aiutare? Non ti capisco.</span>
  - <span lang='it'>Gli dico buongiorno ogni mattina.</span>
  - <span lang='it'>La conosco da tre anni.</span>
  - <span lang='it'>Le scrivo un messaggio adesso.</span>
  chunk_ref: book_7_il_pronome_pronomi_personali_pronomi_personali_soggetto
  explanations:
    en:
      title: Subject personal pronouns in Italian
      tip: In Italian, you usually leave out the subject pronoun ('I', 'you', 'he',
        etc.) because the verb ending already shows who is acting. Use the pronoun
        only when you need to make a contrast, add emphasis, or avoid confusion.
      explanation: |-
        ## The subject pronouns — full list

        These are the Italian subject pronouns — the words that tell you *who* performs the action of the verb.

        | Person | Italian form(s) | English equivalent |
        |---|---|---|
        | 1st singular | io | I |
        | 2nd singular | tu | you (informal, one person) |
        | 3rd singular masc. | lui / egli / esso | he / it |
        | 3rd singular fem. | lei / ella / essa | she / it |
        | 1st plural | noi | we |
        | 2nd plural | voi | you (plural) |
        | 3rd plural masc./mixed | loro / essi | they |
        | 3rd plural fem. | loro / esse | they (all female) |

        At A1, the forms you will use and hear every day are: <span lang="it">io</span>, <span lang="it">tu</span>, <span lang="it">lui</span>, <span lang="it">lei</span>, <span lang="it">noi</span>, <span lang="it">voi</span>, <span lang="it">loro</span>. The others (<span lang="it">egli</span>, <span lang="it">ella</span>, <span lang="it">esso</span>, <span lang="it">essa</span>, <span lang="it">essi</span>, <span lang="it">esse</span>) appear mainly in literary or formal written Italian and are explained below under 'Variants and formal forms'.

        ## The core rule: usually omit the pronoun

        Unlike English, where 'I speak', 'you speak', 'she speaks' all need a pronoun to show who is acting, Italian verb endings already carry that information. The pronoun is therefore *optional in most sentences* and is routinely left out in speech and informal writing.

        Compare:

        English (pronoun obligatory): <span lang="it">I work → I work</span> (you cannot say just 'work')

        Italian (pronoun optional): <span lang="it">(Io) lavoro.</span> — 'I work.' The ending <span lang="it">-o</span> already signals first-person singular, so <span lang="it">io</span> adds no new information.

        ## When the pronoun IS required

        There are three clear situations in which you must include the subject pronoun:

        ### 1. Contrast between two different subjects

        When two clauses in a row have *different* subjects, use pronouns to signal the switch clearly.

        > <span lang="it">Lui va in montagna, io vado al mare.</span>
        > (He is going to the mountains; I am going to the seaside.)

        ### 2. Emphasis or focus on the subject

        When you want to stress *who* is performing the action — 'it was specifically *you*, not someone else' — the pronoun must be present. This use is also required after words such as <span lang="it">anche</span> ('also/too'), <span lang="it">neanche</span> ('not even/neither'), and <span lang="it">pure</span> ('too/also').

        > <span lang="it">Sei stato tu a dire questo.</span>
        > (It was *you* who said that — emphasising 'you and no one else'.)

        > <span lang="it">È venuta anche lei.</span>
        > (She came too.)

        ### 3. Avoiding ambiguity

        When leaving out the pronoun would make the sentence unclear about who is involved, include it.

        > <span lang="it">È bene che vada.</span>
        > (It is good that [someone] goes.) — Without context, this could mean I, you, he or she should go. If the subject needs to be clear, say: <span lang="it">È bene che vada lui.</span> (It is good that *he* goes.)

        ## Third-person singular and plural: which form to choose

        The third person has several competing forms. Here is the practical guidance for A1 students:

        **Singular — <span lang="it">lui</span> and <span lang="it">lei</span>**

        Use <span lang="it">lui</span> for 'he' and <span lang="it">lei</span> for 'she'. These are the standard forms in modern spoken and written Italian. Whenever a subject pronoun of the third person singular is *required* (contrast, emphasis, or clarity), <span lang="it">lui</span> and <span lang="it">lei</span> are the correct choices.

        > <span lang="it">Io resto, lui parte.</span>
        > (I am staying; he is leaving.)

        **Plural — <span lang="it">loro</span>**

        Use <span lang="it">loro</span> for 'they' when referring to people. Note that <span lang="it">loro</span> is the only plural third-person form permitted when a pronoun is required.

        > <span lang="it">Noi siamo italiani, loro sono francesi.</span>
        > (We are Italian; they are French.)

        ## Variants and formal forms

        The forms <span lang="it">egli</span> ('he', formal/literary), <span lang="it">ella</span> ('she', formal/literary), <span lang="it">esso</span> / <span lang="it">essa</span> ('it' — for animals or things, and in formal style also for people in the feminine), and <span lang="it">essi</span> / <span lang="it">esse</span> ('they', formal/literary, for groups of things or all-female groups) belong mainly to written, formal, or literary Italian. Historically, <span lang="it">egli</span> was prescribed for referring to a male person and <span lang="it">esso</span> for animals and things, but today even in formal writing <span lang="it">egli</span> is increasingly rare and <span lang="it">lui</span> has taken its place. As an A1 student, you do not need to *use* these forms, but you should recognise them when you see them in a text.

        **Reinforced forms**

        Any subject pronoun can be reinforced by adding <span lang="it">stesso</span> ('myself/yourself/himself' etc.) immediately after it: <span lang="it">io stesso</span>, <span lang="it">tu stesso</span>, <span lang="it">lui stesso</span>, <span lang="it">lei stessa</span>, and so on. There are also the old reinforced forms <span lang="it">noialtri</span> and <span lang="it">voialtri</span> (written as one word), used in some regional varieties to add emphasis, though these are rarely needed at A1.

        ## Examples covering the main uses

        1. Normal sentence — pronoun omitted (most common situation):
        > <span lang="it">Mangio la pasta.</span>
        > (I eat pasta.) — No pronoun needed; the <span lang="it">-o</span> ending identifies the speaker.

        2. Contrast between subjects — pronoun required:
        > <span lang="it">Lei beve il caffè, io bevo il tè.</span>
        > (She drinks coffee; I drink tea.)

        3. Emphasis — pronoun required:
        > <span lang="it">Sei tu il professore?</span>
        > (Are *you* the teacher? — 'you specifically, not someone else')

        4. After <span lang="it">anche</span> — pronoun required:
        > <span lang="it">Anche lui parla italiano.</span>
        > (He speaks Italian too.)

        5. Avoiding ambiguity — pronoun added for clarity:
        > <span lang="it">È importante che lei risponda.</span>
        > (It is important that *she* answers. — Without <span lang="it">lei</span>, we would not know who must answer.)

        6. Contrastive pair showing the difference between using and omitting the pronoun:
        > <span lang="it">Lavoro ogni giorno.</span> (I work every day. — neutral, no pronoun.)
        > <span lang="it">Io lavoro ogni giorno, tu no.</span> (I work every day; you don't. — pronoun added for contrast.)

        ## Common learner mistakes

        **Mistake 1 — Always inserting the pronoun, as in English:**

        Because English requires 'I', 'you', 'he' etc. in every sentence, English speakers often add them in Italian even when they are not needed. This is not wrong, but it sounds unnatural and over-emphatic, as if you are stressing the subject every single time.

        Avoid: <span lang="it">Io mi chiamo Marco. Io ho diciotto anni. Io abito a Roma.</span> (sounds forced)
        Better: <span lang="it">Mi chiamo Marco. Ho diciotto anni. Abito a Roma.</span>

        **Mistake 2 — Using <span lang="it">egli</span> or <span lang="it">ella</span> in conversation:**

        These forms sound archaic or literary in spoken Italian. Use <span lang="it">lui</span> and <span lang="it">lei</span> instead.

        Avoid in speech: <span lang="it">Egli è mio fratello.</span>
        Natural: <span lang="it">Lui è mio fratello.</span> (He is my brother.)

        **Mistake 3 — Confusing <span lang="it">lei</span> ('she') with <span lang="it">Lei</span> (formal 'you'):**

        In written Italian, <span lang="it">Lei</span> with a capital letter is the formal polite form of 'you' (used with strangers, teachers, etc.), while <span lang="it">lei</span> with a lower-case letter means 'she'. In speech the two sound identical, so context tells you which is meant. At A1, simply note that when someone writes <span lang="it">Lei</span> with a capital in the middle of a sentence, it signals formality, not 'she'.

        **Mistake 4 — Using <span lang="it">essi</span> / <span lang="it">esse</span> where <span lang="it">loro</span> is needed:**

        When referring to people and a pronoun is required (contrast, emphasis), only <span lang="it">loro</span> is acceptable. <span lang="it">Essi</span> and <span lang="it">esse</span> are reserved for objects or formal writing.

        Avoid in a contrast sentence: <span lang="it">*Noi mangiamo, essi bevono.</span>
        Correct: <span lang="it">Noi mangiamo, loro bevono.</span> (We eat; they drink.)
      language: en
      why_this_matters: Subject pronouns are among the very first words you meet in
        Italian, yet Italian uses them very differently from English or French — leaving
        them out is not lazy, it is the normal, correct thing to do. Understanding
        when to drop them and when to keep them will immediately make your Italian
        sound natural and will prevent one of the most common A1 mistakes. Mastering
        these pronouns also unlocks the ability to contrast two people ('I am staying,
        you are going') and to add emphasis ('It was *you* who said that').
    it:
      title: I pronomi personali soggetto e complemento
      tip: 'In italiano i pronomi personali cambiano forma a seconda della funzione
        nella frase: soggetto, complemento oggetto o complemento indiretto. Per le
        tre persone singolari le forme principali sono io/mi/mi, tu/ti/ti, lui-lei/lo-la/gli-le.'
      explanation: |-
        ## I pronomi personali soggetto e complemento singolari

        ### Regola generale

        I pronomi personali (personal pronouns) sostituiscono un nome nella frase. In italiano cambiano forma secondo la loro **funzione sintattica**: soggetto (subject), complemento oggetto diretto (direct object) o complemento oggetto indiretto (indirect object). Per le prime tre persone singolari le forme sono le seguenti.

        ---

        ### Tabella dei pronomi singolari

        | Persona | Soggetto | Compl. diretto (atono) | Compl. indiretto (atono) |
        |---|---|---|---|
        | 1ª sing. | <span lang='it'>io</span> | <span lang='it'>mi</span> | <span lang='it'>mi</span> |
        | 2ª sing. | <span lang='it'>tu</span> | <span lang='it'>ti</span> | <span lang='it'>ti</span> |
        | 3ª sing. masch. | <span lang='it'>lui</span> | <span lang='it'>lo</span> | <span lang='it'>gli</span> |
        | 3ª sing. femm. | <span lang='it'>lei</span> | <span lang='it'>la</span> | <span lang='it'>le</span> |

        > **Nota:** Le forme atone (unstressed) si chiamano così perché non portano accento e si uniscono al verbo.

        ---

        ### 1. Pronomi soggetto

        I pronomi soggetto indicano chi compie l'azione. In italiano il soggetto è spesso **omesso** perché la desinenza del verbo lo indica già (vedi il punto grammaticale *omiss_sogg*). Si usano esplicitamente per **enfasi** o **contrasto**.

        - <span lang='it'>**Io** parlo italiano, **tu** parli inglese.</span> (I speak Italian, you speak English.)
        - <span lang='it'>**Lei** studia medicina.</span> (She studies medicine.)
        - <span lang='it'>**Lui** non capisce.</span> (He doesn't understand.)

        > **Attenzione:** <span lang='it'>Lei</span> con la L maiuscola è anche il pronome formale di cortesia (formal 'you'), usato per rivolgersi a qualcuno con rispetto. Il contesto chiarisce il significato.

        ---

        ### 2. Pronomi complemento oggetto diretto (atoni)

        I pronomi diretti sostituiscono un nome che è complemento oggetto diretto, cioè risponde alla domanda *chi?* o *che cosa?* Vanno **prima del verbo** nelle frasi normali.

        - <span lang='it'>Conosci Marco? Sì, **lo** conosco bene.</span> (Do you know Marco? Yes, I know him well.)
        - <span lang='it'>Chiami Maria? **La** chiamo subito.</span> (Are you calling Maria? I'm calling her right away.)
        - <span lang='it'>**Mi** vedi?</span> (Can you see me?)
        - <span lang='it'>**Ti** aspetto qui.</span> (I'll wait for you here.)

        ---

        ### 3. Pronomi complemento oggetto indiretto (atoni)

        I pronomi indiretti sostituiscono un nome introdotto dalla preposizione <span lang='it'>*a*</span>, rispondendo alla domanda *a chi?*. Anche questi vanno **prima del verbo**.

        - <span lang='it'>Scrivi a Paolo? Sì, **gli** scrivo un messaggio.</span> (Are you writing to Paolo? Yes, I'm writing him a message.)
        - <span lang='it'>Telefoni a Sara? **Le** telefono stasera.</span> (Are you calling Sara? I'm calling her tonight.)
        - <span lang='it'>**Mi** dici il tuo nome?</span> (Will you tell me your name?)
        - <span lang='it'>**Ti** mando una email.</span> (I'll send you an email.)

        ---

        ### 4. Posizione dei pronomi atoni

        Nelle frasi normali con verbo di modo finito, i pronomi atoni vanno **prima del verbo**:

        <span lang='it'>**Lo** vedo ogni giorno.</span> (I see him every day.)

        Con l'infinito, il pronome si **attacca in fondo**:

        <span lang='it'>Voglio **vederlo** domani.</span> (I want to see him tomorrow.)

        Con l'imperativo informale (2ª persona singolare), il pronome si **attacca al verbo**:

        <span lang='it'>**Chiamami** più tardi!</span> (Call me later!)

        ---

        ### 5. Errori comuni

        | Errore | Forma corretta | Spiegazione |
        |---|---|---|
        | <span lang='it'>~~Io conosco lui~~</span> | <span lang='it'>Lo conosco.</span> | Il pronome diretto atono va prima del verbo, non dopo. |
        | <span lang='it'>~~Gli scrivo a lei~~</span> | <span lang='it'>Le scrivo.</span> | <span lang='it'>gli</span> è maschile; per il femminile usa <span lang='it'>le</span>. |
        | <span lang='it'>~~Lo dico a lui~~</span> (come indiretto) | <span lang='it'>Gli dico.</span> | Con i verbi che reggono <span lang='it'>*a*</span>, usa il pronome indiretto <span lang='it'>gli</span>, non <span lang='it'>lo</span>. |
        | <span lang='it'>~~Mi ti vedo~~</span> | <span lang='it'>Mi vedi / Ti vedo.</span> | Ogni frase ha un solo pronome atono per funzione. |

        ---

        ### 6. Riepilogo visivo

        ```
        Soggetto  →  chi fa l'azione         →  io, tu, lui, lei
        Diretto   →  chi/cosa riceve         →  mi, ti, lo, la
        Indiretto →  a chi/a cosa            →  mi, ti, gli, le
        ```
      language: it
      why_this_matters: Senza i pronomi personali non puoi sostituire i nomi nelle
        frasi e devi ripetere sempre le stesse parole. Con questi pronomi puoi capire
        e costruire quasi tutti i dialoghi quotidiani in italiano.
  source_url: https://www.unistrapg.it/profilo_lingua_italiana/site/gram_pronomi_a1.html

- code: pron_refl
  cefr_level: A1
  category: pronomi
  subcategory: riflessivi
  unistr_code: pronomi_riflessivi
  unistr_label: Pronomi riflessivi
  label: Pronomi riflessivi
  description: Pronouns used with reflexive verbs to show the subject acts on itself
    (myself, yourself, etc.).
  examples:
  - <span lang='it'>Mi chiamo Marco.</span>
  - <span lang='it'>Come ti chiami?</span>
  - <span lang='it'>Lucia si alza alle sette.</span>
  - <span lang='it'>Ci laviamo le mani prima di mangiare.</span>
  - <span lang='it'>Vi svegliate tardi la domenica?</span>
  - <span lang='it'>I bambini si vestono da soli.</span>
  chunk_ref: book_7_il_pronome_pronomi_personali_pronomi_riflessivi
  prerequisites:
  - pron_pers
  explanations:
    en:
      title: Reflexive pronouns in Italian
      tip: Reflexive pronouns go with reflexive verbs to show that the subject is
        doing something to or for themselves — like getting dressed or washing yourself.
        Each subject pronoun has its own matching reflexive pronoun, and it usually
        comes directly before the verb.
      explanation: |-
        ## The rule

        A reflexive pronoun is used when the action performed by the subject falls back onto that same subject. In other words, the subject and the object of the action are the same person. In Italian these pronouns always accompany a reflexive verb — a verb whose infinitive ends in <span lang="it">-si</span> (for example <span lang="it">lavarsi</span>, 'to wash oneself'; <span lang="it">alzarsi</span>, 'to get up'; <span lang="it">chiamarsi</span>, 'to be called').

        The reflexive pronoun must **agree with the subject** — each person has one fixed form. In a normal statement the pronoun is placed **directly before the conjugated verb**.

        ## Forms

        | Subject pronoun | Reflexive pronoun | Meaning |
        |---|---|---|
        | io | mi | myself |
        | tu | ti | yourself |
        | lui / lei / Lei | si | himself / herself / yourself (formal) |
        | noi | ci | ourselves |
        | voi | vi | yourselves |
        | loro | si | themselves |

        ## How to form a sentence

        Take the infinitive (e.g. <span lang="it">lavarsi</span>), remove <span lang="it">-si</span>, conjugate the verb normally, and place the correct reflexive pronoun immediately before it.

        Full conjugation of <span lang="it">lavarsi</span> ('to wash oneself') in the present tense:

        | | |
        |---|---|
        | io mi lavo | I wash myself |
        | tu ti lavi | you wash yourself |
        | lui / lei si lava | he / she washes himself / herself |
        | noi ci laviamo | we wash ourselves |
        | voi vi lavate | you (plural) wash yourselves |
        | loro si lavano | they wash themselves |

        ## Examples

        <span lang="it">Mi chiamo Marco.</span> (My name is Marco. Literally: I call myself Marco.) — the most common reflexive phrase at A1 level.

        <span lang="it">Mi alzo alle sette.</span> (I get up at seven o'clock.) — <span lang="it">alzarsi</span> is a key verb for daily routines.

        <span lang="it">Lei si veste in fretta.</span> (She gets dressed quickly.) — note that <span lang="it">si</span> covers both 'himself' and 'herself'.

        <span lang="it">Ci sediamo qui.</span> (We sit down here.) — <span lang="it">sedersi</span>, 'to sit down', is another very common reflexive verb.

        <span lang="it">Vi svegliate tardi la domenica?</span> (Do you all wake up late on Sundays?) — reflexive pronoun in a question; position does not change.

        Contrastive pair — reflexive vs. non-reflexive:
        <span lang="it">Lavo la macchina.</span> (I wash the car.) — no reflexive pronoun; the action falls on an external object.
        <span lang="it">Mi lavo.</span> (I wash myself.) — reflexive pronoun required because the subject is washing themselves.

        ## Common mistakes

        **Omitting the pronoun.** Learners sometimes conjugate the verb but forget the pronoun entirely. This produces a grammatically incomplete or wrong sentence.
        Mistake: <span lang="it">*Chiamo Marco.</span> — this means 'I call Marco' (someone else named Marco), not 'my name is Marco'.
        Correct: <span lang="it">Mi chiamo Marco.</span>

        **Using the wrong pronoun for the subject.** Because the reflexive pronoun must match the subject, mixing them is a very common error.
        Mistake: <span lang="it">*Lei mi lava.</span> — this means 'she washes me', not 'she washes herself'.
        Correct: <span lang="it">Lei si lava.</span>

        **Placing the pronoun after the verb in a normal statement.** In a standard present-tense sentence the pronoun comes before the verb, not after it.
        Mistake: <span lang="it">*Alzo mi alle sette.</span>
        Correct: <span lang="it">Mi alzo alle sette.</span>

        **Confusing <span lang="it">si</span> with <span lang="it">se</span>.** The reflexive pronoun for third-person singular and plural is always <span lang="it">si</span>, never <span lang="it">se</span> (which is a conjunction meaning 'if').
        Mistake: <span lang="it">*Se chiama Anna.</span>
        Correct: <span lang="it">Si chiama Anna.</span> (Her name is Anna.)
      language: en
      why_this_matters: Reflexive pronouns are everywhere in everyday Italian. Dozens
        of the most common verbs — getting up, getting dressed, washing, sitting down,
        being called — are reflexive verbs, and they cannot work at all without their
        matching reflexive pronoun. Without this rule you cannot say your name, describe
        your morning routine, or talk about how you feel.
    it:
      title: I pronomi riflessivi in italiano
      tip: 'I pronomi riflessivi si usano con i verbi riflessivi per indicare che
        l''azione ricade sul soggetto stesso. Ogni persona ha il suo pronome: <span
        lang=''it''>mi, ti, si, ci, vi, si</span>. Il pronome va sempre prima del
        verbo coniugato.'
      explanation: |-
        ## I pronomi riflessivi

        ### Che cosa sono?

        I pronomi riflessivi (reflexive pronouns) accompagnano i verbi riflessivi. Un verbo è riflessivo quando il soggetto compie un'azione su sé stesso. In italiano, i verbi riflessivi all'infinito finiscono in **-si**: <span lang='it'>chiamar**si**</span>, <span lang='it'>alzar**si**</span>, <span lang='it'>lavar**si**</span>.

        ### La tabella dei pronomi riflessivi

        | Persona | Pronome | Esempio |
        |---|---|---|
        | io | <span lang='it'>mi</span> | <span lang='it'>mi chiamo</span> |
        | tu | <span lang='it'>ti</span> | <span lang='it'>ti chiami</span> |
        | lui / lei | <span lang='it'>si</span> | <span lang='it'>si chiama</span> |
        | noi | <span lang='it'>ci</span> | <span lang='it'>ci chiamiamo</span> |
        | voi | <span lang='it'>vi</span> | <span lang='it'>vi chiamate</span> |
        | loro | <span lang='it'>si</span> | <span lang='it'>si chiamano</span> |

        ### Formazione

        Il pronome riflessivo si mette **prima** del verbo coniugato:

        > <span lang='it'>soggetto + pronome riflessivo + verbo coniugato</span>

        Quando il soggetto è espresso:
        - <span lang='it'>**Io mi** alzo alle otto.</span> (I get up at eight.)
        - <span lang='it'>**Tu ti** lavi le mani.</span> (You wash your hands.)

        Quando il soggetto è omesso (molto comune in italiano):
        - <span lang='it'>**Mi** chiamo Anna.</span> (My name is Anna. / I am called Anna.)
        - <span lang='it'>**Si** alza tardi.</span> (He/She gets up late.)

        ### Verbi riflessivi comuni a livello A1

        | Infinito | Significato |
        |---|---|
        | <span lang='it'>chiamarsi</span> | to be called |
        | <span lang='it'>alzarsi</span> | to get up |
        | <span lang='it'>svegliarsi</span> | to wake up |
        | <span lang='it'>lavarsi</span> | to wash (oneself) |
        | <span lang='it'>vestirsi</span> | to get dressed |
        | <span lang='it'>sedersi</span> | to sit down |
        | <span lang='it'>fermarsi</span> | to stop |
        | <span lang='it'>sentirsi</span> | to feel |

        ### Esempi con traduzione

        1. <span lang='it'>Mi chiamo Luca.</span> (My name is Luca.)
        2. <span lang='it'>Come ti chiami?</span> (What is your name?)
        3. <span lang='it'>Maria si sveglia alle sei.</span> (Maria wakes up at six.)
        4. <span lang='it'>Ci laviamo le mani.</span> (We wash our hands.)
        5. <span lang='it'>Vi sedete qui?</span> (Are you sitting here?)
        6. <span lang='it'>I ragazzi si vestono in fretta.</span> (The boys get dressed quickly.)

        ### Errori comuni

        **Errore 1:** Dimenticare il pronome riflessivo.
        - ❌ <span lang='it'>Chiamo Marco.</span>
        - ✅ <span lang='it'>Mi chiamo Marco.</span>

        **Errore 2:** Usare il pronome sbagliato.
        - ❌ <span lang='it'>Lei mi alza presto.</span>
        - ✅ <span lang='it'>Lei si alza presto.</span> (She gets up early.)

        **Errore 3:** Mettere il pronome dopo il verbo (nella frase normale).
        - ❌ <span lang='it'>Chiamo mi Marco.</span>
        - ✅ <span lang='it'>Mi chiamo Marco.</span>

        > **Nota:** Con l'infinito, il pronome si attacca alla fine del verbo e il verbo perde la **-e** finale: <span lang='it'>alzar**si**</span>, <span lang='it'>lavar**si**</span>. Questa forma si usa ad esempio dopo i verbi modali: <span lang='it'>Voglio alzarmi presto.</span> (I want to get up early.)
      language: it
      why_this_matters: Moltissimi verbi italiani comuni — come <span lang='it'>chiamarsi,
        alzarsi, lavarsi, vestirsi</span> — sono riflessivi e richiedono questi pronomi.
        Senza di loro non puoi presentarti, descrivere la tua routine quotidiana o
        parlare di azioni che fai su te stesso.
  source_url: https://www.unistrapg.it/profilo_lingua_italiana/site/gram_pronomi_a1.html

- code: pron_inter
  cefr_level: A1
  category: pronomi
  subcategory: interrogativi
  unistr_code: pronomi_interrogativi_chi_che_cosa_quanto_quale
  unistr_label: 'Pronomi interrogativi: chi, che (cosa), quanto, quale?'
  label: Pronomi interrogativi chi, che, quanto, quale
  description: 'Pronouns used to ask questions about people or things: chi (who),
    che (what), quanto (how much), quale (which).'
  examples:
  - <span lang="it">Chi è quella ragazza?</span>
  - <span lang="it">Che fai stasera?</span>
  - <span lang="it">Quale preferisci, il tè o il caffè?</span>
  - <span lang="it">Quanto costa questo libro?</span>
  - <span lang="it">Con chi parli?</span>
  - <span lang="it">Di che hai bisogno?</span>
  chunk_ref: book_7_il_pronome_pronomi_interrogativi
  explanations:
    en:
      title: 'Interrogative pronouns: chi, che, quanto, quale'
      tip: 'Italian has four main question pronouns: ''chi'' (who), ''che'' (what,
        for things), ''quale'' (which one), and ''quanto'' (how much/many). Each one
        covers a specific type of question, so choosing the right one depends on whether
        you are asking about a person, a thing, an identity, or a quantity.'
      explanation: |-
        ## The four interrogative pronouns

        Italian has four core interrogative pronouns. Unlike interrogative adjectives, which accompany a noun, interrogative pronouns stand alone in place of a noun — they replace it entirely.

        | Pronoun | Meaning | Refers to |
        |---|---|---|
        | chi | who / whom | people and animate beings only |
        | che | what | things only |
        | quale / quali | which one / which ones | people or things (asking for identity) |
        | quanto / quanta / quanti / quante | how much / how many | people or things (asking for quantity) |

        ## Chi — who, whom

        Use <span lang="it">chi</span> to ask about a person or animate being. It is invariable — it never changes its form, regardless of number or gender. It can function as the subject of the sentence ('who') or as the object ('whom'), including after a preposition ('to whom', 'with whom', 'for whom', etc.).

        As subject:
        <span lang="it">Chi è quella ragazza?</span> (Who is that girl?)

        As object:
        <span lang="it">Chi cerchi?</span> (Who are you looking for?)

        After a preposition:
        <span lang="it">A chi parli?</span> (Who are you talking to? / To whom are you talking?)
        <span lang="it">Con chi vieni?</span> (Who are you coming with?)

        Important: <span lang="it">chi</span> is always singular in form, even when the answer might be plural. The verb that follows agrees with the expected answer, not with <span lang="it">chi</span> itself — but in simple A1 questions this rarely causes difficulty.

        ## Che — what

        Use <span lang="it">che</span> to ask about things. Like <span lang="it">chi</span>, it is completely invariable. It cannot refer to people when used as an interrogative pronoun.

        <span lang="it">Che dici?</span> (What are you saying?)
        <span lang="it">Che mangi stasera?</span> (What are you eating tonight?)

        You will also see the longer form <span lang="it">che cosa</span> ('what thing') and the form <span lang="it">cosa</span> used alone. All three — <span lang="it">che</span>, <span lang="it">che cosa</span>, and <span lang="it">cosa</span> — mean 'what' and are interchangeable in everyday speech.

        <span lang="it">Che cosa fai?</span> = <span lang="it">Cosa fai?</span> = <span lang="it">Che fai?</span> (What are you doing?)

        ## Quale / Quali — which one, which ones

        Use <span lang="it">quale</span> (singular) or <span lang="it">quali</span> (plural) to ask someone to identify a specific person or thing from a set. It can refer to both people and things.

        <span lang="it">Ho due fratelli. Quale preferisci?</span> (I have two brothers. Which one do you prefer?)
        <span lang="it">Ci sono molte pizze. Quali vuoi?</span> (There are many pizzas. Which ones do you want?)

        Note: before the verb <span lang="it">è</span> (is), <span lang="it">quale</span> drops the final <span lang="it">-e</span> and becomes <span lang="it">qual</span> — no apostrophe is used:
        <span lang="it">Qual è il tuo nome?</span> (What is your name? / Which is your name?) — NOT <span lang="it">*quale è</span> and NOT <span lang="it">*qual'è</span>.

        ## Quanto / Quanta / Quanti / Quante — how much, how many

        Use <span lang="it">quanto</span> to ask about quantity or number. Unlike <span lang="it">chi</span> and <span lang="it">che</span>, <span lang="it">quanto</span> changes to agree in gender and number with the noun it replaces:

        | Form | Gender / Number | Example |
        |---|---|---|
        | quanto | masculine singular | Quanto costa? (How much does it cost?) |
        | quanta | feminine singular | Quanta ne vuoi? (How much of it do you want?) |
        | quanti | masculine plural | Quanti siete? (How many of you are there?) |
        | quante | feminine plural | Quante sono? (How many are there?) |

        ## Use as exclamatory pronouns

        All four pronouns can also be used in exclamations rather than questions. The form and meaning stay the same — only the context and punctuation change.

        <span lang="it">Chi l'avrebbe detto!</span> (Who would have thought it!)
        <span lang="it">Quanti sono!</span> (There are so many of them!)

        ## Examples covering the main uses

        1. <span lang="it">Chi è tua madre?</span> — Who is your mother? (<span lang="it">chi</span> as subject, referring to a person)

        2. <span lang="it">A chi scrivi?</span> — Who are you writing to? (<span lang="it">chi</span> after a preposition)

        3. <span lang="it">Che mangi a colazione?</span> — What do you eat for breakfast? (<span lang="it">che</span> referring to a thing)

        4. <span lang="it">Qual è la tua borsa?</span> — Which one is your bag? (<span lang="it">quale</span> asking for identity, with elision before <span lang="it">è</span>)

        5. <span lang="it">Quanti vengono alla festa?</span> — How many people are coming to the party? (<span lang="it">quanti</span>, masculine plural, asking for number)

        6. Contrastive pair — <span lang="it">chi</span> vs <span lang="it">che</span>:
        <span lang="it">Chi hai incontrato?</span> — Who did you meet? (a person)
        <span lang="it">Che hai mangiato?</span> — What did you eat? (a thing)

        ## Common learner mistakes

        **Mistake 1: Using <span lang="it">che</span> to ask about people**
        Incorrect: <span lang="it">*Che è tuo padre?</span>
        Correct: <span lang="it">Chi è tuo padre?</span> (Who is your father?)
        Remember: <span lang="it">che</span> refers only to things; <span lang="it">chi</span> refers only to people.

        **Mistake 2: Writing <span lang="it">qual'è</span> with an apostrophe**
        Incorrect: <span lang="it">*Qual'è il problema?</span>
        Correct: <span lang="it">Qual è il problema?</span> — no apostrophe. This is not an elision (vowel dropped); it is simply the standard short form of <span lang="it">quale</span> before <span lang="it">è</span>.

        **Mistake 3: Treating <span lang="it">quanto</span> as invariable**
        Incorrect: <span lang="it">*Quanto persone vengono?</span>
        Correct: <span lang="it">Quante persone vengono?</span> — <span lang="it">persone</span> is feminine plural, so <span lang="it">quanto</span> must become <span lang="it">quante</span>.

        **Mistake 4: Confusing <span lang="it">quale</span> (pronoun) with <span lang="it">quale</span> (adjective)**
        As a pronoun, <span lang="it">quale</span> stands alone: <span lang="it">Quale preferisci?</span> (Which one do you prefer?)
        As an adjective, it accompanies a noun: <span lang="it">Quale pizza preferisci?</span> (Which pizza do you prefer?)
        Both are correct — just make sure you are not omitting the noun by accident when you need the adjective form.
      language: en
      why_this_matters: Every conversation involves questions. Without interrogative
        pronouns — the words for 'who', 'what', 'which one', and 'how much' — you
        cannot ask who someone is, what they want, which option they prefer, or how
        many people are coming. These four pronouns appear in almost every exchange
        you will have in Italian, from greetings to shopping to making plans, so getting
        them right from the start saves you from constant confusion.
    it:
      title: 'Pronomi interrogativi: chi, che, quanto, quale'
      tip: 'I pronomi interrogativi si usano per fare domande al posto di una persona
        o di una cosa. Ogni pronome ha un uso specifico: <span lang="it">chi</span>
        per le persone, <span lang="it">che</span> per le cose, <span lang="it">quale/quali</span>
        per scegliere tra opzioni, <span lang="it">quanto/quanta/quanti/quante</span>
        per la quantità. Vanno sempre all''inizio della domanda.'
      explanation: |-
        ## Pronomi interrogativi: <span lang="it">chi, che, quanto, quale</span>

        ### Regola generale

        I pronomi interrogativi (interrogative pronouns) sostituiscono un nome e introducono una domanda diretta. In italiano i principali sono:

        | Pronome | Uso | Esempio |
        |---|---|---|
        | <span lang="it">chi</span> | persone | <span lang="it">Chi sei?</span> (Who are you?) |
        | <span lang="it">che / che cosa / cosa</span> | cose, idee | <span lang="it">Che fai?</span> (What are you doing?) |
        | <span lang="it">quale / quali</span> | scelta tra opzioni | <span lang="it">Quale vuoi?</span> (Which do you want?) |
        | <span lang="it">quanto / quanta / quanti / quante</span> | quantità | <span lang="it">Quanto costa?</span> (How much does it cost?) |

        ---

        ### <span lang="it">CHI</span>

        <span lang="it">Chi</span> si riferisce sempre a persone. È **invariabile**: non cambia per genere o numero.

        Si usa come soggetto, complemento oggetto o con una preposizione.

        - <span lang="it">Chi è il tuo professore?</span> (Who is your teacher?) — soggetto
        - <span lang="it">Chi aspetti?</span> (Who are you waiting for?) — complemento oggetto
        - <span lang="it">Con chi vai al cinema?</span> (Who are you going to the cinema with?) — con preposizione
        - <span lang="it">Di chi è questo zaino?</span> (Whose is this backpack?) — con preposizione <span lang="it">di</span>

        > ⚠️ **Attenzione:** <span lang="it">chi</span> non ha plurale. Anche per chiedere di più persone si usa sempre <span lang="it">chi</span>: <span lang="it">Chi sono quei ragazzi?</span> (Who are those boys?)

        ---

        ### <span lang="it">CHE / CHE COSA / COSA</span>

        Queste tre forme sono **sinonimi** e si riferiscono a cose, azioni o idee. Sono tutte invariabili.

        - <span lang="it">Che fai stasera?</span> (What are you doing tonight?)
        - <span lang="it">Che cosa vuoi mangiare?</span> (What do you want to eat?)
        - <span lang="it">Cosa c'è nel frigo?</span> (What's in the fridge?)

        > ✅ Tutte e tre le forme sono corrette e molto comuni. <span lang="it">Cosa</span> e <span lang="it">che cosa</span> sono leggermente più formali di <span lang="it">che</span> da solo, ma tutte si usano nel parlato quotidiano.

        Si usa anche con le preposizioni:

        - <span lang="it">Di che hai bisogno?</span> (What do you need?)
        - <span lang="it">A che pensi?</span> (What are you thinking about?)

        ---

        ### <span lang="it">QUALE / QUALI</span>

        <span lang="it">Quale</span> si usa quando si chiede di scegliere tra opzioni o identificare qualcosa. Cambia solo per il numero:

        | | Singolare | Plurale |
        |---|---|---|
        | maschile e femminile | <span lang="it">quale</span> | <span lang="it">quali</span> |

        - <span lang="it">Quale preferisci, il tè o il caffè?</span> (Which do you prefer, tea or coffee?)
        - <span lang="it">Quale è il tuo numero di telefono?</span> (What is your phone number?)
        - <span lang="it">Quali sono i tuoi hobby?</span> (What are your hobbies?)

        > ⚠️ **Attenzione:** davanti a <span lang="it">è</span> si può usare l'apostrofo: <span lang="it">qual è</span> (senza apostrofo è anche accettato oggi, ma <span lang="it">qual è</span> è la forma tradizionale e molto comune).

        ---

        ### <span lang="it">QUANTO / QUANTA / QUANTI / QUANTE</span>

        <span lang="it">Quanto</span> si usa per chiedere quantità o misura. Cambia per genere e numero come un aggettivo:

        | | Singolare | Plurale |
        |---|---|---|
        | maschile | <span lang="it">quanto</span> | <span lang="it">quanti</span> |
        | femminile | <span lang="it">quanta</span> | <span lang="it">quante</span> |

        - <span lang="it">Quanto costa?</span> (How much does it cost?) — maschile singolare
        - <span lang="it">Quanta acqua bevi?</span> (How much water do you drink?) — femminile singolare
        - <span lang="it">Quanti anni hai?</span> (How old are you?) — maschile plurale
        - <span lang="it">Quante persone ci sono?</span> (How many people are there?) — femminile plurale

        > ⚠️ **Attenzione:** <span lang="it">quanto</span> è anche un avverbio interrogativo (adverb) con i verbi: <span lang="it">Quanto costa?</span> In quel caso è invariabile.

        ---

        ### Errori comuni

        | ❌ Errore | ✅ Correzione | Spiegazione |
        |---|---|---|
        | <span lang="it">*Chi cosa vuoi?</span> | <span lang="it">Che cosa vuoi?</span> | <span lang="it">Chi</span> è solo per persone, non per cose |
        | <span lang="it">*Che è il tuo nome?</span> | <span lang="it">Qual è il tuo nome?</span> | Per identificare qualcosa di specifico si usa <span lang="it">quale</span> |
        | <span lang="it">*Quanti costa?</span> | <span lang="it">Quanto costa?</span> | <span lang="it">Quanto</span> come avverbio è invariabile |
        | <span lang="it">*Chi sono queste scarpe?</span> | <span lang="it">Quali sono queste scarpe?</span> | <span lang="it">Chi</span> non si usa per le cose |

        ---

        ### Riepilogo rapido

        - <span lang="it">Chi</span> → persone, invariabile
        - <span lang="it">Che / che cosa / cosa</span> → cose, invariabile
        - <span lang="it">Quale / quali</span> → scelta o identificazione, cambia per numero
        - <span lang="it">Quanto / quanta / quanti / quante</span> → quantità, cambia per genere e numero
      language: it
      why_this_matters: Senza questi pronomi non puoi chiedere informazioni fondamentali
        come 'Chi sei?', 'Che vuoi?' o 'Quanto costa?'. Li senti e li usi ogni giorno
        in ogni tipo di conversazione, dalla presentazione agli acquisti al bar.
  source_url: https://www.unistrapg.it/profilo_lingua_italiana/site/gram_pronomi_a1.html

- code: pron_indef
  cefr_level: A1
  category: pronomi
  subcategory: indefiniti
  unistr_code: pronomi_indefiniti_nessuno_niente_nota_i_pronomi_tonici_preceduti_da
  unistr_label: 'Pronomi indefiniti: nessuno, niente Nota: i pronomi tonici preceduti
    da preposizione (es. per me) e i pronomi atoni in alcune strutture (es. lo so)
    vengono acquisiti a livello A1 quali formule non analizzate Nota: i pronomi riflessivi
    a livello A1 vengono acquisiti quali formule non analizzate (es. mi chiamo )'
  label: Pronomi indefiniti nessuno, niente
  description: 'Indefinite pronouns meaning ''nobody'' and ''nothing''. Used with
    double negation: ''non … nessuno/niente''.'
  examples:
  - <span lang='it'>Non c'è nessuno in casa.</span>
  - <span lang='it'>Non ho niente da mangiare.</span>
  - <span lang='it'>Nessuno parla italiano qui.</span>
  - <span lang='it'>— Cosa vuoi? — Niente, grazie.</span>
  - <span lang='it'>Non vedo nessuno in strada.</span>
  - <span lang='it'>Niente è impossibile.</span>
  chunk_ref: book_7_il_pronome_pronomi_indefiniti
  explanations:
    en:
      title: Saying 'nobody' and 'nothing' in Italian
      tip: Use 'nessuno' for 'nobody/no one' and 'niente' for 'nothing'. When they
        come after the verb, you must also put 'non' before the verb — but never use
        both together before the verb.
      explanation: |-
        ## The two pronouns

        <span lang="it">**nessuno**</span> means 'nobody,' 'no one,' or 'not anyone.'
        <span lang="it">**niente**</span> (also <span lang="it">nulla</span>, which is slightly more formal) means 'nothing' or 'not anything.'

        Both are **indefinite pronouns** — they refer to a person or thing in a completely unspecified, zero-quantity way.

        ## The double-negative rule

        Italian uses a double negative that English does not. The rule works like this:

        - If <span lang="it">nessuno</span> or <span lang="it">niente</span> comes **before** the verb, no <span lang="it">non</span> is needed.
        - If <span lang="it">nessuno</span> or <span lang="it">niente</span> comes **after** the verb, you **must** add <span lang="it">non</span> before the verb.

        This is not an error — it is correct, standard Italian grammar.

        ### Position before the verb (no 'non' needed)

        | Italian | English |
        |---|---|
        | Nessuno è a casa. | Nobody is home. |
        | Niente è pronto. | Nothing is ready. |

        ### Position after the verb ('non' required before the verb)

        | Italian | English |
        |---|---|
        | Non c'è nessuno a casa. | There is nobody home. |
        | Non ho niente. | I have nothing. |

        The second pattern (<span lang="it">non</span> + verb + <span lang="it">nessuno/niente</span>) is by far the more common word order in everyday Italian. You will see and hear it constantly.

        ## Examples

        **1.** <span lang="it">Non c'è nessuno in cucina.</span>
        (There is nobody in the kitchen.)
        — Everyday situation; <span lang="it">nessuno</span> follows the verb, so <span lang="it">non</span> is required.

        **2.** <span lang="it">Nessuno mangia la verdura.</span>
        (Nobody eats the vegetables.)
        — <span lang="it">Nessuno</span> is the subject before the verb; no <span lang="it">non</span> needed.

        **3.** <span lang="it">Non ho niente da mangiare.</span>
        (I have nothing to eat.)
        — Common daily-life sentence; double negative is correct and required.

        **4.** <span lang="it">— Cosa c'è nel frigo? — Niente.</span>
        (— What is in the fridge? — Nothing.)
        — As a one-word answer, <span lang="it">niente</span> stands alone with no verb, so no <span lang="it">non</span> is needed.

        **5.** <span lang="it">Non conosco nessuno qui.</span>
        (I don't know anyone here.)
        — Contrastive note: in English you switch to 'anyone' after a negative; in Italian you keep <span lang="it">nessuno</span>, not a separate word.

        **6.** <span lang="it">Niente è difficile per lei.</span>
        (Nothing is difficult for her.)
        — <span lang="it">Niente</span> as subject before the verb; no <span lang="it">non</span> needed.

        ## Common learner mistakes

        **Mistake 1 — Omitting <span lang="it">non</span> when the negative word follows the verb:**
        <span lang="it">*Ho niente.</span> ✗
        <span lang="it">Non ho niente.</span> ✓
        English speakers drop <span lang="it">non</span> because they think 'I have nothing' already contains one negative. In Italian, both are required.

        **Mistake 2 — Using <span lang="it">non</span> when the negative word is already before the verb:**
        <span lang="it">*Non nessuno è a casa.</span> ✗
        <span lang="it">Nessuno è a casa.</span> ✓
        When <span lang="it">nessuno</span> or <span lang="it">niente</span> leads the sentence, do not also add <span lang="it">non</span>.

        **Mistake 3 — Using 'anything' logic and choosing a different word:**
        Learners sometimes try to say 'I don't know anyone' by inventing a word like <span lang="it">*qualcuno</span> in a negative sentence. This is wrong. Italian keeps <span lang="it">nessuno</span> even in sentences that are already negative: <span lang="it">Non conosco nessuno.</span> ✓

        **Mistake 4 — Confusing <span lang="it">niente</span> (pronoun) with <span lang="it">nessuno</span> (pronoun):**
        <span lang="it">nessuno</span> refers only to **people**; <span lang="it">niente</span> refers only to **things**. Do not swap them: <span lang="it">Non vedo nessuno</span> (I see nobody) vs. <span lang="it">Non vedo niente</span> (I see nothing).

        ## Quick-reference summary

        | Pronoun | Refers to | Before verb | After verb |
        |---|---|---|---|
        | nessuno | people | Nessuno viene. | Non viene nessuno. |
        | niente | things | Niente cambia. | Non cambia niente. |
      language: en
      why_this_matters: From your very first conversations in Italian, you will need
        to say things like 'Nobody is home' or 'I have nothing.' These two words —
        <span lang="it">nessuno</span> and <span lang="it">niente</span> — are among
        the most common indefinite pronouns in the language. Getting their position
        and double-negative rule right will immediately make your Italian sound natural
        and prevent one of the most persistent errors learners make.
    it:
      title: 'Nessuno e niente: nomi indefiniti negativi'
      tip: 'In italiano si usa la doppia negazione: si mette <span lang=''it''>non</span>
        prima del verbo e <span lang=''it''>nessuno</span> o <span lang=''it''>niente</span>
        dopo. Se però <span lang=''it''>nessuno</span> o <span lang=''it''>niente</span>
        vengono prima del verbo, <span lang=''it''>non</span> non serve.'
      explanation: |-
        ## <span lang='it'>Nessuno</span> e <span lang='it'>niente</span>: pronomi indefiniti negativi

        ### Regola di base

        In italiano, per dire 'nobody' o 'nothing' si usano i pronomi indefiniti (indefinite pronouns) <span lang='it'>**nessuno**</span> e <span lang='it'>**niente**</span> (oppure <span lang='it'>**nulla**</span>, sinonimo di <span lang='it'>niente</span>).

        Ci sono **due strutture** possibili:

        **1. Il pronome viene DOPO il verbo** → si usa la doppia negazione: <span lang='it'>non</span> + verbo + <span lang='it'>nessuno/niente</span>

        **2. Il pronome viene PRIMA del verbo** → si usa solo il pronome, senza <span lang='it'>non</span>

        ---

        ### Struttura 1: doppia negazione

        | Soggetto | <span lang='it'>non</span> | Verbo | Pronome |
        |---|---|---|---|
        | <span lang='it'>Io</span> | <span lang='it'>non</span> | <span lang='it'>vedo</span> | <span lang='it'>nessuno</span> |
        | <span lang='it'>Lei</span> | <span lang='it'>non</span> | <span lang='it'>mangia</span> | <span lang='it'>niente</span> |
        | <span lang='it'>Marco</span> | <span lang='it'>non</span> | <span lang='it'>dice</span> | <span lang='it'>nulla</span> |

        Esempi:
        - <span lang='it'>Non vedo nessuno.</span> (I don't see anybody. / I see nobody.)
        - <span lang='it'>Non mangio niente.</span> (I don't eat anything. / I eat nothing.)
        - <span lang='it'>Non c'è nessuno in casa.</span> (There is nobody at home.)
        - <span lang='it'>Non ho niente da fare.</span> (I have nothing to do.)

        ---

        ### Struttura 2: pronome prima del verbo (niente <span lang='it'>non</span>)

        Quando il pronome è all'inizio della frase, si usa da solo:

        - <span lang='it'>Nessuno parla.</span> (Nobody speaks.)
        - <span lang='it'>Niente è facile.</span> (Nothing is easy.)
        - <span lang='it'>Nessuno viene oggi.</span> (Nobody is coming today.)

        ---

        ### <span lang='it'>Nessuno</span> vs <span lang='it'>niente / nulla</span>

        | Pronome | Significato | Si riferisce a... |
        |---|---|---|
        | <span lang='it'>nessuno</span> | nobody, no one | **persone** |
        | <span lang='it'>niente</span> | nothing | **cose** |
        | <span lang='it'>nulla</span> | nothing | **cose** (sinonimo di <span lang='it'>niente</span>) |

        ---

        ### Uso in risposta breve

        <span lang='it'>Niente</span> e <span lang='it'>nessuno</span> si usano spesso come risposte brevi senza verbo:

        - <span lang='it'>— Chi c'è? — Nessuno.</span> (— Who is there? — Nobody.)
        - <span lang='it'>— Cosa vuoi? — Niente, grazie.</span> (— What do you want? — Nothing, thanks.)

        ---

        ### Errori comuni

        **Errore 1:** Usare solo <span lang='it'>non</span> senza il pronome, come in inglese.

        - ❌ <span lang='it'>Non vedo.</span> (questo significa solo 'I don't see', non 'I see nobody')
        - ✅ <span lang='it'>Non vedo nessuno.</span>

        **Errore 2:** Usare <span lang='it'>non</span> quando il pronome è già prima del verbo.

        - ❌ <span lang='it'>Nessuno non viene.</span>
        - ✅ <span lang='it'>Nessuno viene.</span>

        **Errore 3:** Usare <span lang='it'>nessuno</span> per le cose.

        - ❌ <span lang='it'>Non ho nessuno da mangiare.</span>
        - ✅ <span lang='it'>Non ho niente da mangiare.</span>

        ---

        ### Esempi riassuntivi

        1. <span lang='it'>Non c'è nessuno in ufficio.</span> (There is nobody in the office.)
        2. <span lang='it'>Non dico niente.</span> (I say nothing.)
        3. <span lang='it'>Nessuno sa la risposta.</span> (Nobody knows the answer.)
        4. <span lang='it'>Niente è pronto.</span> (Nothing is ready.)
        5. <span lang='it'>Non vedo nulla sul tavolo.</span> (I see nothing on the table.)
        6. <span lang='it'>— Hai fame? — No, niente grazie.</span> (— Are you hungry? — No, nothing thanks.)
      language: it
      why_this_matters: Queste parole sono indispensabili per dire che non c'è nessuna
        persona o nessuna cosa. Le troverai in quasi ogni conversazione quotidiana,
        per esempio al negozio, a scuola o a casa.
  source_url: https://www.unistrapg.it/profilo_lingua_italiana/site/gram_pronomi_a1.html

