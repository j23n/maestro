  examples:
  - <span lang='it'>Io parlo italiano ogni giorno.</span>
  - <span lang='it'>Maria beve un caffè la mattina.</span>
  - <span lang='it'>Noi abitiamo a Roma.</span>
  - <span lang='it'>Il treno parte alle nove.</span>
  - <span lang='it'>Loro finiscono il lavoro alle cinque.</span>
  - <span lang='it'>Tu hai un fratello?</span>
  chunk_ref: book_8_il_verbo_uso_dell_indicativo_presente
  explanations:
    en:
      title: The present tense (indicativo presente)
      tip: The Italian present tense covers what is happening right now, what happens
        regularly, and — very commonly in spoken Italian — what will happen in the
        future. One tense does the work of several English ones, so mastering its
        forms early unlocks a huge range of everyday conversation.
      explanation: |-
        ## What the present tense expresses

        Unlike English, which splits these ideas across several forms ('I write', 'I am writing', 'I do write'), Italian uses one form — the <span lang="it">presente</span> — to cover four distinct situations:

        1. **Something happening right now:** <span lang="it">Carlo scrive</span> means both 'Carlo writes' and 'Carlo is writing' — the Italian present covers both.
        2. **A habitual or repeated action:** things that happen regularly, always, or as a general truth.
        3. **A future action** (especially in spoken Italian): using the present with a future time word is natural and extremely common.
        4. **The historic present** (<span lang="it">presente storico</span>): retelling past events as if they are happening now, to make the story feel vivid and immediate.

        ## How to form the present tense

        Italian verbs belong to three conjugation classes, identified by the infinitive ending: <span lang="it">-are</span>, <span lang="it">-ere</span>, or <span lang="it">-ire</span>. To form the present, drop the infinitive ending and add the endings for that class.

        ### Regular -are verbs (e.g. parlare, 'to speak')

        | Person | Ending | Full form |
        |---|---|---|
        | io (I) | -o | parlo |
        | tu (you, singular) | -i | parli |
        | lui/lei (he/she) | -a | parla |
        | noi (we) | -iamo | parliamo |
        | voi (you, plural) | -ate | parlate |
        | loro (they) | -ano | parlano |

        ### Regular -ere verbs (e.g. scrivere, 'to write')

        | Person | Ending | Full form |
        |---|---|---|
        | io | -o | scrivo |
        | tu | -i | scrivi |
        | lui/lei | -e | scrive |
        | noi | -iamo | scriviamo |
        | voi | -ete | scrivete |
        | loro | -ono | scrivono |

        ### Regular -ire verbs: two patterns

        <span lang="it">-ire</span> verbs split into two groups. Most everyday <span lang="it">-ire</span> verbs you meet at A1 follow the <span lang="it">-isc-</span> pattern (also called the 'inchoative' pattern), which inserts <span lang="it">-isc-</span> between the stem and the ending in four of the six forms. A smaller group conjugates without the insert.

        **With <span lang="it">-isc-</span> insert** (e.g. <span lang="it">finire</span>, 'to finish'):

        | Person | Full form |
        |---|---|
        | io | finisco |
        | tu | finisci |
        | lui/lei | finisce |
        | noi | finiamo |
        | voi | finite |
        | loro | finiscono |

        **Without <span lang="it">-isc-</span> insert** (e.g. <span lang="it">dormire</span>, 'to sleep'):

        | Person | Full form |
        |---|---|
        | io | dormo |
        | tu | dormi |
        | lui/lei | dorme |
        | noi | dormiamo |
        | voi | dormite |
        | loro | dormono |

        ## Common irregular verbs

        Several high-frequency verbs are irregular in the present. You will need these from day one — learn them as fixed forms rather than trying to apply regular rules.

        | Infinitive | io | tu | lui/lei | noi | voi | loro |
        |---|---|---|---|---|---|---|
        | essere ('to be') | sono | sei | è | siamo | siete | sono |
        | avere ('to have') | ho | hai | ha | abbiamo | avete | hanno |
        | andare ('to go') | vado | vai | va | andiamo | andate | vanno |
        | fare ('to do/make') | faccio | fai | fa | facciamo | fate | fanno |
        | venire ('to come') | vengo | vieni | viene | veniamo | venite | vengono |
        | volere ('to want') | voglio | vuoi | vuole | vogliamo | volete | vogliono |
        | potere ('to be able to') | posso | puoi | può | possiamo | potete | possono |

        ## Examples covering all four uses

        **1. Action happening right now**

        <span lang="it">Carlo scrive una lettera.</span> — 'Carlo is writing a letter.' (or 'Carlo writes a letter.')

        <span lang="it">Mangio la pizza.</span> — 'I am eating pizza.' / 'I eat pizza.'

        Notice that where English needs 'is writing' or 'am eating' to signal an ongoing action, Italian simply uses the present tense.

        **2. Habitual action or general truth**

        <span lang="it">In montagna d'inverno nevica.</span> — 'In the mountains it snows in winter.'

        <span lang="it">La mia famiglia mangia insieme ogni sera.</span> — 'My family eats together every evening.'

        **3. Future action (with a time marker)**

        <span lang="it">L'estate prossima vado in vacanza in Sardegna.</span> — 'Next summer I am going on holiday to Sardinia.'

        The time word <span lang="it">l'estate prossima</span> ('next summer') makes it clear this is future. This use is extremely common in spoken Italian — using the present here sounds completely natural, not sloppy.

        **4. The historic present**

        <span lang="it">Dante nasce a Firenze nel 1265 e muore a Ravenna nel 1321.</span> — 'Dante was born in Florence in 1265 and died in Ravenna in 1321.'

        The present tense here ('is born', 'dies') pulls the past into the foreground and is standard in historical writing and storytelling.

        ## Common learner mistakes

        **Mistake 1: Using the wrong ending for the wrong class.**
        Learners sometimes apply <span lang="it">-are</span> endings to <span lang="it">-ere</span> or <span lang="it">-ire</span> verbs. For example, writing <span lang="it">*lui scriva</span> instead of <span lang="it">lui scrive</span>. Always identify the infinitive class before adding endings.

        **Mistake 2: Translating 'I am eating' with a separate construction.**
        English has a continuous form ('I am eating') that Italian does not. Do not try to invent one — <span lang="it">mangio</span> already covers both 'I eat' and 'I am eating'. The construction <span lang="it">sto mangiando</span> (gerund with <span lang="it">stare</span>) does exist for emphasis, but the plain present is always correct and always natural.

        **Mistake 3: Reaching for the future tense when talking about plans.**
        When you have a clear future time word (<span lang="it">domani</span> 'tomorrow', <span lang="it">la settimana prossima</span> 'next week'), Italian speakers almost always use the present, not the future tense. Saying <span lang="it">domani vado al mercato</span> ('tomorrow I am going to the market') is more natural than <span lang="it">domani andrò al mercato</span>, especially in conversation.

        **Mistake 4: Forgetting the <span lang="it">-isc-</span> insert in <span lang="it">-ire</span> verbs.**
        Writing <span lang="it">*finisco</span> is actually correct, but writing <span lang="it">*fino</span> (missing the insert entirely) is a frequent error. If you are unsure whether a verb takes <span lang="it">-isc-</span>, check a dictionary or word list — there is no simple spelling rule to predict it.

        **Mistake 5: Omitting the subject pronoun thinking it is required.**
        In Italian, subject pronouns (<span lang="it">io, tu, lui</span>, etc.) are optional because the verb ending already shows who the subject is. <span lang="it">Parlo italiano</span> and <span lang="it">io parlo italiano</span> are both correct. Pronouns are kept mainly for contrast or emphasis: <span lang="it">Io parlo italiano, tu parli spagnolo.</span> ('I speak Italian, you speak Spanish.')
      language: en
      why_this_matters: 'The <span lang="it">indicativo presente</span> (indicative
        present tense) is the single most useful verb form in Italian. Nearly every
        sentence a beginner needs — describing yourself, talking about daily routines,
        making plans — uses this tense. Without it you cannot say who you are, what
        you do, or where you are going. Mastering it also removes one of the most
        common early mistakes: reaching for a future tense when Italians simply use
        the present.'
  source_url: https://www.unistrapg.it/profilo_lingua_italiana/site/gram_verbi_a1.html

- code: cond_simp
  cefr_level: A1
  category: verbi
  subcategory: condizionale
  unistr_code: la_coniugazione_attiva_con_particolare_riferimento_a_tutte_e_tre_le_persone
  unistr_label: condizionale semplice solo del verbo volere alla I persona singolare
    ( vorrei )
  label: Condizionale semplice del verbo volere alla prima persona singolare
  description: The form 'vorrei' means 'I would like' — a polite way to express wishes
    or make requests in Italian.
  examples:
  - <span lang="it">Vorrei un caffè, per favore.</span>
  - <span lang="it">Vorrei parlare con il direttore.</span>
  - <span lang="it">Vorrei una camera singola per due notti.</span>
  - <span lang="it">Vorrei andare al mare quest'estate.</span>
  - <span lang="it">Scusi, vorrei prenotare un tavolo.</span>
  chunk_ref: book_8_il_verbo_uso_degli_altri_modi_condizionale
  prerequisites:
  - ind_pres
  explanations:
    en:
      title: Saying what you would like with 'vorrei'
      tip: Use 'vorrei' — the conditional form of 'volere' — to say what you would
        like politely. It is softer and more natural than 'voglio' (I want) in most
        everyday situations, especially when asking for something.
      explanation: |-
        ## The rule: what 'vorrei' is and how it works

        <span lang="it">Vorrei</span> is the first-person singular conditional form of the verb <span lang="it">volere</span> (to want). The conditional mood — <span lang="it">il condizionale</span> — expresses something you would do or would like under certain conditions. Think of it as the 'would' form in English.

        In Italian, the conditional has two tenses: a simple form (<span lang="it">condizionale semplice</span>, referring to the present or future) and a compound form (<span lang="it">condizionale passato</span>, referring to the past). At A1 level, you focus on the simple form, and specifically on the most important word in it: <span lang="it">vorrei</span>.

        The underlying logic is: <span lang="it">vorrei un caffè</span> means 'I would like a coffee' — that is, 'I would like one, if you have it, if I may.' The condition is often left unspoken, but it makes the sentence polite rather than demanding.

        ## Formation: the full conditional of 'volere'

        Even though you only need the first-person singular for now, it helps to see the complete pattern so you recognise all the forms when you hear them.

        <span lang="it">Volere</span> is an irregular verb in the conditional. Its conditional stem is <span lang="it">vorr-</span>, and the endings are the same for all conditional verbs:

        | Person | Forma | English |
        |---|---|---|
        | io | vorrei | I would like / I would want |
        | tu | vorresti | you would like |
        | lui / lei | vorrebbe | he / she would like |
        | noi | vorremmo | we would like |
        | voi | vorreste | you (plural) would like |
        | loro | vorrebbero | they would like |

        The stem <span lang="it">vorr-</span> is irregular — do not try to build it from the infinitive <span lang="it">volere</span> by a regular rule. Just learn <span lang="it">vorrei</span> as a single, ready-made word first.

        ## How to use 'vorrei'

        <span lang="it">Vorrei</span> is followed directly by a noun or by an infinitive verb:

        - With a noun: <span lang="it">Vorrei + [noun]</span> → 'I would like [thing]'
        - With an infinitive: <span lang="it">Vorrei + [infinitive]</span> → 'I would like to [do something]'

        ## Examples

        <span lang="it">Vorrei un caffè, per favore.</span>
        (I would like a coffee, please.) — ordering in a bar, the classic use.

        <span lang="it">Vorrei una pizza margherita.</span>
        (I would like a margherita pizza.) — ordering in a restaurant.

        <span lang="it">Vorrei parlare con il professore.</span>
        (I would like to speak with the teacher.) — polite request using an infinitive.

        <span lang="it">Vorrei un chilo di pane, grazie.</span>
        (I would like a kilo of bread, thank you.) — shopping at a bakery.

        Contrastive pair — notice the difference in tone:

        <span lang="it">Voglio un caffè.</span> (I want a coffee.) — direct, can sound blunt or even rude in a service context.

        <span lang="it">Vorrei un caffè.</span> (I would like a coffee.) — polite and natural; the form Italians actually use when ordering.

        ## Common learner mistakes

        **Mistake 1: Using <span lang="it">voglio</span> when ordering or asking for something.**

        Saying <span lang="it">voglio una birra</span> (I want a beer) is grammatically correct, but it is often too direct for a polite request. In Italian service situations, <span lang="it">vorrei</span> is the expected and natural choice. Use <span lang="it">voglio</span> when expressing a strong wish or general preference, not when addressing a waiter or shopkeeper.

        **Mistake 2: Trying to conjugate <span lang="it">vorrei</span> further or add a subject pronoun as if it changes the meaning.**

        <span lang="it">Vorrei</span> already means 'I would like.' You do not need to say <span lang="it">*io vorrei io</span> — the ending <span lang="it">-ei</span> already identifies the subject as first-person singular. The optional pronoun <span lang="it">io</span> can be added for emphasis, but it is not required: <span lang="it">Io vorrei un tè</span> is fine for emphasis, but <span lang="it">Vorrei un tè</span> is the normal, natural form.

        **Mistake 3: Spelling or pronouncing the stem incorrectly.**

        Some learners write <span lang="it">*volerei</span> or <span lang="it">*voglerei</span>, trying to keep the infinitive stem. The correct stem is <span lang="it">vorr-</span>, giving <span lang="it">vorrei</span>. The double <span lang="it">r</span> is both spelled and pronounced — do not drop it.

        **Mistake 4: Forgetting <span lang="it">di</span> or using it incorrectly before an infinitive.**

        Unlike some Italian verbs, <span lang="it">volere</span> connects directly to an infinitive with no preposition: <span lang="it">Vorrei mangiare qualcosa</span> (I would like to eat something) — NOT <span lang="it">*vorrei di mangiare</span>. Never insert <span lang="it">di</span> between <span lang="it">vorrei</span> and the infinitive.
      language: en
      why_this_matters: The single word <span lang="it">vorrei</span> (I would like)
        is one of the most useful words you will learn in Italian. You need it every
        time you order food, ask for something in a shop, or make a polite request.
        Without it, you risk sounding abrupt — knowing it immediately makes your Italian
        sound natural and courteous.
  source_url: https://www.unistrapg.it/profilo_lingua_italiana/site/gram_verbi_a1.html

- code: imper_form
  cefr_level: A1
  category: verbi
  subcategory: imperativo
  unistr_code: la_coniugazione_attiva_con_particolare_riferimento_a_tutte_e_tre_le_persone
  unistr_label: imperativo formale ed informale del verbo scusare ( scusi/scusa )
  label: Imperativo formale e informale del verbo scusare
  description: Use 'scusa' (informal) or 'scusi' (formal) to apologise or get someone's
    attention. These are the imperative forms of 'scusare'.
  examples:
  - <span lang="it">Scusa, puoi ripetere?</span>
  - <span lang="it">Scusi, dov'è la stazione?</span>
  - <span lang="it">Scusa, non capisco.</span>
  - <span lang="it">Scusi, signora, è libero questo posto?</span>
  - <span lang="it">Scusa, come ti chiami?</span>
  chunk_ref: book_8_il_verbo_uso_degli_altri_modi_imperativo
  prerequisites:
  - ind_pres
  explanations:
    en:
      title: Formal and Informal Imperative of 'scusare'
      tip: To ask someone to excuse you, say 'scusa' to a friend and 'scusi' to a
        stranger or someone older. These two forms come from different grammatical
        persons, so you cannot swap them without sounding rude or odd.
      explanation: |-
        ## The rule: imperative of scusare

        The verb <span lang="it">scusare</span> (to excuse, to forgive) is a regular <span lang="it">-are</span> verb. Its imperative forms follow the standard pattern for <span lang="it">-are</span> verbs, but there is one important twist: the <span lang="it">Lei</span> (formal 'you') form is borrowed from the <span lang="it">congiuntivo presente</span> (present subjunctive), not the indicative.

        ## Imperative forms of scusare

        | Person | Form | When to use it |
        |---|---|---|
        | tu (informal singular) | scusa | one friend, family member, child, peer |
        | Lei (formal singular) | scusi | stranger, older person, professional context |
        | voi (informal plural) | scusate | a group of friends or peers |
        | Loro (formal plural, rare) | scusino | very formal, e.g. addressing a group of clients |

        Note: the first person singular (<span lang="it">io</span>) does not exist in the imperative — you cannot give an order to yourself.

        ## Informal imperative: scusa (tu)

        Use <span lang="it">scusa</span> when speaking to one person you address as <span lang="it">tu</span>. This is the standard second-person singular imperative of a regular <span lang="it">-are</span> verb: drop the <span lang="it">-re</span> from the infinitive <span lang="it">scusare</span> to get <span lang="it">scusa</span>.

        ## Formal imperative: scusi (Lei)

        Use <span lang="it">scusi</span> when speaking to one person you address as <span lang="it">Lei</span> (the formal singular 'you'). This form ends in <span lang="it">-i</span> because it is drawn from the present subjunctive. This <span lang="it">-i</span> ending is the key marker of the formal imperative for all regular <span lang="it">-are</span> verbs.

        ## Negative imperative

        To tell someone <span lang="it">not</span> to do something, the rule changes for the informal singular only: place <span lang="it">non</span> before the infinitive <span lang="it">scusare</span>, not before the imperative form.

        | Person | Negative form |
        |---|---|
        | tu (informal) | non scusare |
        | Lei (formal) | non scusi |
        | voi | non scusate |

        For <span lang="it">Lei</span> and <span lang="it">voi</span>, the negative is simply <span lang="it">non</span> + the same imperative form. Only the <span lang="it">tu</span> negative uses the infinitive.

        ## Examples

        <span lang="it">Scusa, come ti chiami?</span> (Sorry, what's your name?) — informal, talking to a friend.

        <span lang="it">Scusi, dov'è la stazione?</span> (Excuse me, where is the station?) — formal, asking a stranger for directions.

        <span lang="it">Scusate, siete pronti?</span> (Excuse me, are you ready?) — informal plural, addressing a group of friends.

        <span lang="it">Non scusare sempre lui!</span> (Don't always make excuses for him!) — informal negative, using the infinitive after <span lang="it">non</span>.

        <span lang="it">Scusi, signora, questo posto è libero?</span> (Excuse me, madam, is this seat free?) — formal, polite address to an older woman.

        <span lang="it">Scusa, non scusare — </span>contrastive pair: <span lang="it">scusa</span> is the affirmative imperative ('say sorry / excuse me'), while <span lang="it">non scusare</span> is the negative imperative ('don't excuse / don't apologise').

        ## Common learner mistakes

        **Mistake 1 — using <span lang="it">scusa</span> in a formal situation:** Saying <span lang="it">scusa</span> to a professor or a shop assistant you have just met sounds too familiar. Always use <span lang="it">scusi</span> when in doubt about the relationship.

        **Mistake 2 — using <span lang="it">scusi</span> with friends:** Conversely, using <span lang="it">scusi</span> with a classmate or a sibling sounds comically stiff. Match the form to the relationship.

        **Mistake 3 — negative informal with the imperative form:** A common error is <span lang="it">*non scusa!</span> This is wrong. The correct informal negative is <span lang="it">non scusare!</span> — always use the infinitive after <span lang="it">non</span> for the <span lang="it">tu</span> form.

        **Mistake 4 — confusing <span lang="it">scusa</span> and <span lang="it">scusi</span> as simply 'polite vs. casual':** The difference is grammatical, not just social. <span lang="it">Scusi</span> is a subjunctive-derived form linked to the pronoun <span lang="it">Lei</span>, while <span lang="it">scusa</span> is a true imperative linked to <span lang="it">tu</span>. Understanding this helps you apply the same pattern to other verbs.
      language: en
      why_this_matters: '''Excuse me'' and ''sorry'' are among the first things you
        need in any language. In Italian, the word you choose depends on <span lang="it">registro</span>
        (register) — whether you are speaking informally to a friend or formally to
        a stranger. Getting this right immediately makes you sound polite and natural;
        getting it wrong can come across as rude or overly stiff.'
  source_url: https://www.unistrapg.it/profilo_lingua_italiana/site/gram_verbi_a1.html

- code: imper_prim
  cefr_level: A1
  category: verbi
  subcategory: imperativo
  unistr_code: la_coniugazione_attiva_con_particolare_riferimento_a_tutte_e_tre_le_persone
  unistr_label: imperativo prima persona plurale per invitare (andiamo )
  label: Imperativo prima persona plurale per invitare
  description: The first-person plural imperative (noi form) is used to suggest doing
    something together, like English 'let's'.
  examples:
  - <span lang="it">Andiamo al bar insieme!</span>
  - <span lang="it">Mangiamo la pizza stasera!</span>
  - <span lang="it">Prendiamo un caffè!</span>
  - <span lang="it">Parliamo un po' di te!</span>
  - <span lang="it">Usciamo adesso!</span>
  chunk_ref: book_8_il_verbo_uso_degli_altri_modi_imperativo
  prerequisites:
  - ind_pres
  explanations:
    en:
      title: Using 'let's' to make suggestions in Italian
      tip: To suggest doing something together in Italian, use the 'noi' (we) form
        of the present tense as a command — the same form you already know. Just say
        it with the meaning 'let's do this!' No extra word is needed.
      explanation: |-
        ## The rule: how to form it

        The imperative ('command mood') in Italian has only one tense: the present. Because you cannot give an order to yourself, the imperative has no first-person singular ('I') form. However, it does have a **first-person plural** form, used to include yourself in an invitation or suggestion — exactly like English 'let's'.

        **Formation:** The first-person plural imperative is identical to the present-tense <span lang="it">noi</span> ('we') form of the verb. You do not need to add any extra word like 'let's' — the verb form alone carries that meaning.

        <span lang="it">noi</span> present tense = first-person plural imperative

        ### Verb endings at a glance

        | Infinitive | Present noi form | Meaning as imperative |
        |---|---|---|
        | parlare (to speak) | parliamo | let's speak / let's talk |
        | mangiare (to eat) | mangiamo | let's eat |
        | prendere (to take/have) | prendiamo | let's take / let's have |
        | partire (to leave) | partiamo | let's leave |
        | andare (to go) | andiamo | let's go |
        | essere (to be) | siamo | let's be |
        | avere (to have) | abbiamo | let's have |

        ## How to make it negative: 'let's not…'

        To say 'let's not do something', simply place <span lang="it">non</span> ('not') directly before the same verb form. The verb form itself does not change.

        <span lang="it">Non mangiamo</span> lì. → Let's not eat there.

        **Important contrast:** For the second-person singular ('you') negative imperative, Italian uses the infinitive (e.g. <span lang="it">non parlare!</span> — don't speak!). But for the first-person plural, the rule is simpler: <span lang="it">non</span> + the ordinary <span lang="it">noi</span> present form, just like the positive command.

        ## Examples

        1. <span lang="it">Andiamo a casa!</span> — Let's go home!

        2. <span lang="it">Mangiamo la pizza stasera.</span> — Let's eat pizza tonight.

        3. <span lang="it">Parliamo con la maestra.</span> — Let's talk to the teacher.

        4. <span lang="it">Prendiamo un caffè insieme.</span> — Let's have a coffee together.

        5. <span lang="it">Non usciamo stasera, fa freddo.</span> — Let's not go out tonight, it's cold.

        6. <span lang="it">Siamo pazienti!</span> — Let's be patient! (edge case: <span lang="it">essere</span> is irregular in the present, so its <span lang="it">noi</span> form <span lang="it">siamo</span> is the one to remember)

        ## Common learner mistakes

        **Mistake 1: Translating 'let's' word for word.**
        English learners sometimes try to invent a word for 'let's' in Italian. There is no separate word — the verb form itself does the job.
        ✗ <span lang="it">*Lasciamo mangiare.</span> (This means 'let them/us eat' in a different sense, not a natural suggestion.)
        ✓ <span lang="it">Mangiamo!</span> — Let's eat!

        **Mistake 2: Confusing the imperative with a simple statement.**
        Because the form is identical to the present tense, context and intonation do the work of showing it is a suggestion. In writing, an exclamation mark is common; in speech, a rising-then-falling intonation signals an invitation.
        ✗ Thinking <span lang="it">Andiamo</span> can only mean 'we go/we are going' — it also means 'let's go!' depending on context.

        **Mistake 3: Using the infinitive for the negative.**
        Some learners apply the second-person singular rule (<span lang="it">non</span> + infinitive) to the <span lang="it">noi</span> form. This rule does not apply here.
        ✗ <span lang="it">*Non andare insieme.</span> (This is a command to one person: 'don't go together.')
        ✓ <span lang="it">Non andiamo insieme.</span> — Let's not go together.

        ## Quick summary

        - Positive suggestion: <span lang="it">noi</span> present form alone → <span lang="it">Mangiamo!</span> (Let's eat!)
        - Negative suggestion: <span lang="it">non</span> + <span lang="it">noi</span> present form → <span lang="it">Non mangiamo!</span> (Let's not eat!)
        - No extra word for 'let's' is needed or used.
      language: en
      why_this_matters: The moment you want to say <span lang="it">'andiamo!'</span>
        ('let's go!') or suggest a plan to a friend, you need the first-person plural
        imperative. It comes up constantly in everyday conversation — making plans,
        ordering food together, inviting someone to sit down — and the good news is
        that it is identical to a verb form you already know, so there is almost nothing
        new to memorise.
  source_url: https://www.unistrapg.it/profilo_lingua_italiana/site/gram_verbi_a1.html

- code: percez_sig
  cefr_level: A1
  category: verbi
  subcategory: verbi modali
  unistr_code: la_coniugazione_attiva_con_particolare_riferimento_a_tutte_e_tre_le_persone
  unistr_label: la percezione del significato modale dei verbi potere, volere e dovere
  label: Valore modale dei verbi potere, volere e dovere
  description: The verbs potere, volere, and dovere express ability, desire, and obligation.
    They precede an infinitive.
  examples:
  - <span lang="it">Posso parlare italiano un po'.</span>
  - <span lang="it">Vuoi venire al cinema stasera?</span>
  - <span lang="it">Devo studiare adesso.</span>
  - <span lang="it">Non posso uscire oggi.</span>
  - <span lang="it">Voglio un caffè, per favore.</span>
  - <span lang="it">Deve andare a casa.</span>
  chunk_ref: book_8_il_verbo_verbi_servili
  prerequisites:
  - ind_pres
  explanations:
    en:
      title: 'Modal verbs: potere, volere, dovere'
      tip: The verbs potere, volere, and dovere come before another verb in its infinitive
        form to say what someone can, wants, or must do. They change their ending
        to match the subject, but the second verb always stays in the infinitive.
        These three verbs appear in almost every Italian conversation.
      explanation: |-
        ## What modal verbs are

        <span lang="it">Potere</span>, <span lang="it">volere</span>, and <span lang="it">dovere</span> are called <span lang="it">verbi modali</span> (modal verbs) — sometimes also <span lang="it">verbi servili</span> (auxiliary verbs, literally 'servant verbs'). They are called this because they 'serve' another verb: they always appear together with a second verb in the <span lang="it">infinito</span> (infinitive — the base form ending in <span lang="it">-are</span>, <span lang="it">-ere</span>, or <span lang="it">-ire</span>). Each modal adds a specific meaning to that second verb:

        - <span lang="it">dovere</span> → necessity or obligation: <span lang="it">'must / have to'</span>
        - <span lang="it">volere</span> → desire or intention: <span lang="it">'want to'</span>
        - <span lang="it">potere</span> → possibility or permission: <span lang="it">'can / may / be able to'</span>

        ## How to form them

        The structure is simple:

        **modal verb (conjugated) + infinitive of the main verb**

        The modal verb changes to match the subject. The main verb never changes — it always stays in the infinitive.

        Here are the full present-tense forms of all three:



        | Subject | dovere (must) | volere (want) | potere (can) |
        |---|---|---|---|
        | io | devo | voglio | posso |
        | tu | devi | vuoi | puoi |
        | lui / lei | deve | vuole | può |
        | noi | dobbiamo | vogliamo | possiamo |
        | voi | dovete | volete | potete |
        | loro | devono | vogliono | possono |

        All three verbs are irregular — their forms must be learned individually. Notice that <span lang="it">volere</span> and <span lang="it">potere</span> have vowel changes in the stem for <span lang="it">io</span>, <span lang="it">tu</span>, <span lang="it">lui/lei</span>, and <span lang="it">loro</span> (the so-called 'boot' pattern), while <span lang="it">noi</span> and <span lang="it">voi</span> forms stay closer to the infinitive.

        ## Examples

        <span lang="it">Devo studiare stasera.</span>
        (I have to study tonight.) — obligation

        <span lang="it">Vuoi mangiare la pizza?</span>
        (Do you want to eat pizza?) — desire

        <span lang="it">Marco può venire domani.</span>
        (Marco can come tomorrow.) — possibility

        <span lang="it">Dobbiamo parlare con la mamma.</span>
        (We have to talk to Mum.) — obligation, plural subject

        <span lang="it">Non posso bere il caffè.</span>
        (I can't drink coffee.) — negation: <span lang="it">non</span> goes before the modal, not before the infinitive

        <span lang="it">Loro vogliono dormire.</span>
        (They want to sleep.) — third person plural

        ## Negation

        To make a modal sentence negative, place <span lang="it">non</span> directly before the modal verb:

        <span lang="it">Non voglio mangiare.</span> (I don't want to eat.) ✓

        <span lang="it">*Voglio non mangiare.</span> ✗ — This is incorrect in standard usage at this level.

        ## Asking questions

        In Italian, questions are formed without changing the word order — simply raise your intonation, or add a question mark in writing:

        <span lang="it">Puoi aprire la finestra?</span> (Can you open the window?)

        <span lang="it">Vuole un caffè?</span> (Would you like a coffee? — formal, addressing one person as <span lang="it">Lei</span>)

        ## Common learner mistakes

        **Mistake 1: conjugating the second verb**

        <span lang="it">*Voglio mangio la pasta.</span> ✗

        <span lang="it">Voglio mangiare la pasta.</span> ✓

        The verb after the modal must stay in the infinitive. Never conjugate it.

        **Mistake 2: confusing <span lang="it">puoi</span> and <span lang="it">puòi</span>**

        The <span lang="it">tu</span> form of <span lang="it">potere</span> is <span lang="it">puoi</span> (no accent). The <span lang="it">lui/lei</span> form is <span lang="it">può</span> (with an accent, no <span lang="it">i</span>). These are two different words.

        **Mistake 3: using <span lang="it">voglio</span> as a direct translation of 'I would like'**

        <span lang="it">Voglio un caffè.</span> is grammatically correct but can sound abrupt in some social situations. At A1, it is perfectly acceptable — just be aware that Italian also has politer alternatives you will learn later.

        **Mistake 4: wrong form of <span lang="it">dovere</span> for <span lang="it">noi</span>**

        <span lang="it">*Devemo andare.</span> ✗

        <span lang="it">Dobbiamo andare.</span> ✓

        The <span lang="it">noi</span> form of <span lang="it">dovere</span> is irregular: <span lang="it">dobbiamo</span>, not <span lang="it">devemo</span>. This is one of the most common spelling errors with this verb.
      language: en
      why_this_matters: Without modal verbs, you cannot express some of the most basic
        things people say every day — that they <span lang="it">devono lavorare</span>
        (must work), <span lang="it">vogliono mangiare</span> (want to eat), or <span
        lang="it">possono venire</span> (can come). These three verbs appear constantly
        in Italian — in requests, offers, rules, invitations, and descriptions of
        daily life. Mastering them lets you move far beyond simple statements and
        start expressing intention, obligation, and ability.
  source_url: https://www.unistrapg.it/profilo_lingua_italiana/site/gram_verbi_a1.html

- code: costru_ess
  cefr_level: A1
  category: verbi
  subcategory: costruzioni esistenziali
  unistr_code: la_coniugazione_attiva_con_particolare_riferimento_a_tutte_e_tre_le_persone
  unistr_label: la costruzione ci + verbo essere solo alla III persona singolare e
    plurale dell’indicativo presente ( c’è, ci sono )
  label: Costruzione ci + indicativo presente del verbo essere
  description: 'The construction ''ci + essere'' (c''è / ci sono) expresses existence
    or presence: ''there is / there are''.'
  examples:
  - C'è un bar vicino alla stazione.
  - Ci sono due bambini nel parco.
  - C'è latte nel frigorifero?
  - Non c'è nessuno in casa.
  - Ci sono molti studenti in classe oggi.
  - C'è un problema con il computer.
  chunk_ref: book_7_il_pronome_pronomi_dimostrativi_ci
  prerequisites:
  - ind_pres
  explanations:
    en:
      title: Using 'ci' with the verb 'essere'
      tip: Use 'ci' in front of 'essere' to say that something exists or is present
        in a place. 'C'è' means 'there is' and 'ci sono' means 'there are'. This construction
        is one of the most common in everyday Italian.
      explanation: |-
        ## The rule and how to form it

        Place the particle <span lang="it">ci</span> (meaning roughly 'here/there' in this use) directly before the present-tense forms of <span lang="it">essere</span> ('to be'). Only two forms are used in practice at this level:

        | Form | Used with | Meaning |
        |---|---|---|
        | c'è | one thing (singular noun) | 'there is' |
        | ci sono | more than one thing (plural noun) | 'there are' |

        Notice that <span lang="it">ci è</span> contracts to <span lang="it">c'è</span> (with an apostrophe) because <span lang="it">ci</span> ends in a vowel and <span lang="it">è</span> begins with one. <span lang="it">Ci sono</span> does not contract.

        ## Full present-tense paradigm

        Although only two forms appear in normal use, here is the complete picture for reference:

        | Italian | English |
        |---|---|
        | c'è | 'there is' (singular) |
        | ci sono | 'there are' (plural) |

        The forms <span lang="it">ci sei</span>, <span lang="it">ci siamo</span>, etc. exist but carry a different meaning ('are you there?', 'we are here') — they are not part of this construction and appear at higher levels.

        ## How to use it

        Put <span lang="it">c'è</span> or <span lang="it">ci sono</span> at the start of the sentence, followed by the noun (the thing that exists or is present). The noun after <span lang="it">c'è / ci sono</span> is the subject of the sentence — Italian treats it this way even though in English we say 'there is/are' first.

        Basic word order:

        <span lang="it">C'è / Ci sono + [noun] + [optional: location or extra information]</span>

        ## Examples

        <span lang="it">C'è un gatto sul divano.</span> (There is a cat on the sofa.)

        <span lang="it">Ci sono tre sedie in cucina.</span> (There are three chairs in the kitchen.)

        <span lang="it">C'è latte nel frigorifero?</span> (Is there any milk in the fridge?) — question formed simply by using a rising intonation or a question mark; no word order change is needed.

        <span lang="it">No, non c'è latte, ma ci sono due uova.</span> (No, there is no milk, but there are two eggs.) — negative formed by placing <span lang="it">non</span> directly before <span lang="it">c'è</span> or <span lang="it">ci sono</span>.

        <span lang="it">C'è mia sorella a casa oggi.</span> (My sister is at home today.) — note that <span lang="it">c'è</span> can refer to a person being present, not just an object existing.

        <span lang="it">Ci sono molti bambini nel parco.</span> (There are many children in the park.)

        ## Negatives and questions at a glance

        | Type | Singular | Plural |
        |---|---|---|
        | Positive | c'è | ci sono |
        | Negative | non c'è | non ci sono |
        | Question | c'è…? | ci sono…? |

        ## Articles after c'è and ci sono

        The noun that follows almost always carries an indefinite article (<span lang="it">un, una, uno, un'</span>) when you are introducing something for the first time, or no article at all with uncountable nouns:

        <span lang="it">C'è un bambino alla porta.</span> (There is a child at the door.) — first mention, indefinite.

        <span lang="it">C'è acqua sul tavolo.</span> (There is water on the table.) — uncountable noun, no article.

        Using a definite article (<span lang="it">il, la, i, le</span>) is possible when the thing is already known to both speakers, but at A1 level you will mostly see the indefinite article or no article.

        ## Common learner mistakes

        **Mistake 1 — using the singular form with a plural noun:**
        <span lang="it">*C'è due ragazzi.</span> ✗ — incorrect. The noun <span lang="it">ragazzi</span> is plural, so you must use <span lang="it">ci sono</span>: <span lang="it">Ci sono due ragazzi.</span> ✓

        **Mistake 2 — forgetting the apostrophe in <span lang="it">c'è</span>:**
        <span lang="it">*ci è un libro</span> ✗ — in writing, this must always be contracted: <span lang="it">c'è un libro.</span> ✓

        **Mistake 3 — confusing <span lang="it">c'è</span> (there is) with <span lang="it">è</span> (he/she/it is):**
        <span lang="it">Il gatto è sul divano</span> means 'The cat is on the sofa' (describing where a specific, known cat is). <span lang="it">C'è un gatto sul divano</span> means 'There is a cat on the sofa' (announcing its existence). Do not swap these two structures.

        **Mistake 4 — placing <span lang="it">non</span> in the wrong position:**
        <span lang="it">*C'è non latte.</span> ✗ — <span lang="it">non</span> must come before the verb, not after it: <span lang="it">Non c'è latte.</span> ✓
      language: en
      why_this_matters: 'The construction <span lang="it">ci + essere</span> — giving
        us <span lang="it">c''è</span> and <span lang="it">ci sono</span> — is the
        standard Italian way to say ''there is'' and ''there are''. You will need
        it from your very first conversations: describing a room, asking what is on
        the menu, talking about your family, or checking whether a friend is home.
        Without it, you cannot describe the world around you in the most basic way.'
  source_url: https://www.unistrapg.it/profilo_lingua_italiana/site/gram_verbi_a1.html

- code: inf_final
  cefr_level: A1
  category: verbi
  subcategory: infinito
  unistr_code: infinito_presente_nelle_proposizioni_finali_implicite_es_sono_qui_per_studiare
  unistr_label: Infinito presente nelle proposizioni finali implicite, es. Sono qui
    per studiare l’italiano .
  label: Infinito presente in proposizioni finali implicite
  description: The present infinitive used to express purpose ('in order to'), typically
    after verbs of motion or after 'per'.
  examples:
  - <span lang="it">Vado al supermercato per comprare il latte.</span>
  - <span lang="it">Studio molto per imparare l'italiano.</span>
  - <span lang="it">Telefono a Maria per invitarla a cena.</span>
  - <span lang="it">Usciamo presto per prendere il treno.</span>
  - <span lang="it">Vieni a casa mia per vedere il film?</span>
  chunk_ref: book_8_il_verbo_uso_degli_altri_modi_infinito
  prerequisites:
  - ind_pres
  explanations:
    en:
      title: The infinitive in purpose clauses
      tip: To say why you do something, use 'per' followed by the infinitive — the
        base form of the verb ending in -are, -ere, or -ire. This works whenever the
        subject of both actions is the same person.
      explanation: |-
        ## The rule

        A **purpose clause** answers the question 'why?' or 'what for?'. In Italian, when the subject of both verbs is the same person, you express purpose with:

        <span lang="it">**per + infinito presente**</span>

        (<span lang="it">per</span> = 'in order to / to' + the present infinitive — the dictionary form of the verb)

        The **present infinitive** is the base form of the verb. It has three endings depending on the verb group:

        | Group | Ending | Example | Meaning |
        |---|---|---|---|
        | 1st (-are verbs) | -are | mangiare | to eat |
        | 2nd (-ere verbs) | -ere | prendere | to take |
        | 3rd (-ire verbs) | -ire | dormire | to sleep |

        The infinitive does **not** change for person or number. The same form is used whether the subject is <span lang="it">io</span>, <span lang="it">tu</span>, <span lang="it">noi</span>, or anyone else.

        ## Formation at a glance

        <span lang="it">[main verb] + per + infinito</span>

        Example structure:
        <span lang="it">Vado al supermercato **per comprare** il pane.</span>
        (I'm going to the supermarket **to buy** bread.)

        ## Examples

        **1. Everyday errands and movement**

        <span lang="it">Vado in cucina per mangiare.</span>
        (I'm going to the kitchen to eat.)

        **2. Study and learning**

        <span lang="it">Studio ogni giorno per imparare l'italiano.</span>
        (I study every day to learn Italian.)

        **3. Communication**

        <span lang="it">Telefono a mia madre per parlare con lei.</span>
        (I call my mother to talk to her.)

        **4. With a different main verb — the infinitive stays the same**

        <span lang="it">Usciamo per prendere un caffè.</span>
        (We're going out to get a coffee.)

        **5. Contrastive pair — same infinitive, different main subject (edge case)**

        <span lang="it">Chiamo Marco per venire con noi.</span>
        (I'm calling Marco to come with us. — Here 'to come' refers to *me*, not Marco. If you mean Marco should come, you need a different structure: <span lang="it">Chiamo Marco perché venga con noi</span>, which is beyond A1. At A1, only use <span lang="it">per + infinito</span> when both verbs share the same subject.)

        **6. Negation — put <span lang="it">non</span> before the infinitive**

        <span lang="it">Parlo piano per non svegliare il bambino.</span>
        (I speak quietly so as not to wake the baby.)

        ## The infinitive as a noun

        The textbook notes that the present infinitive can also act as a noun — functioning as the subject or object of a sentence. This is a separate use from purpose clauses, but good to recognise:

        <span lang="it">Viaggiare è molto istruttivo.</span>
        (Travelling is very educational.)

        <span lang="it">Mangiare bene è importante.</span>
        (Eating well is important.)

        In this noun use there is no <span lang="it">per</span>. The infinitive simply stands at the start of the sentence like an English gerund in '-ing'.

        ## Common learner mistakes

        **Mistake 1: Using a conjugated verb after <span lang="it">per</span>**

        <span lang="it">✗ Vado al bar per compro un caffè.</span>
        (Wrong — <span lang="it">compro</span> is a conjugated form, not an infinitive.)
        <span lang="it">✓ Vado al bar per comprare un caffè.</span>
        (Correct.)

        **Mistake 2: Omitting <span lang="it">per</span> entirely (copying English word order)**

        <span lang="it">✗ Vado al supermercato comprare il pane.</span>
        (Wrong — Italian requires <span lang="it">per</span> before the infinitive in purpose clauses; you cannot simply place the infinitive after the main verb.)
        <span lang="it">✓ Vado al supermercato per comprare il pane.</span>

        **Mistake 3: Changing the infinitive ending to match the subject**

        <span lang="it">✗ Noi andiamo fuori per mangiamo.</span>
        (Wrong — the infinitive never takes a personal ending.)
        <span lang="it">✓ Noi andiamo fuori per mangiare.</span>

        **Mistake 4: Using <span lang="it">per + infinito</span> when the subjects are different**

        If the person doing the second action is *different* from the person doing the first, <span lang="it">per + infinito</span> is not correct. This situation requires a <span lang="it">perché</span> ('so that') clause with a subjunctive, which is learned at a higher level. At A1, always check that both actions have the same subject before using this structure.
      language: en
      why_this_matters: Saying *why* you do something is one of the first things you
        need in any language. Without this rule, you cannot express even the simplest
        intentions — 'I'm going to the shop to buy bread', 'I'm studying to learn
        Italian'. Once you know this pattern, you can add a reason to almost any sentence,
        making your Italian immediately more expressive and natural.
  source_url: https://www.unistrapg.it/profilo_lingua_italiana/site/gram_verbi_a1.html

