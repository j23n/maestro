- code: qual_o_a_e
  cefr_level: A1
  category: aggettivi
  subcategory: qualificativi
  unistr_code: aggettivi_qualificativi_a_suffisso_o_e_a_e_a_suffisso_-e
  unistr_label: Aggettivi qualificativi a suffisso –O e –A e a suffisso -E
  label: Aggettivo qualificativo con suffisso o, a, e
  description: Qualifying adjectives agree in gender and number with the noun they
    modify, using endings -o/-a/-i/-e or -e/-i.
  examples:
  - <span lang='it'>Il libro è nuovo.</span>
  - <span lang='it'>La borsa è nuova.</span>
  - <span lang='it'>Ho due fratelli simpatici.</span>
  - <span lang='it'>Le ragazze sono intelligenti.</span>
  - <span lang='it'>Marco è un ragazzo gentile.</span>
  - <span lang='it'>Loro sono persone gentili.</span>
  chunk_ref: book_6_l_aggettivo
  prerequisites:
  - noun_o_a_e
  explanations:
    en:
      title: 'Qualifying adjectives: forms and agreement'
      tip: Qualifying adjectives must match the noun they describe in both gender
        and number. Most adjectives have four forms ending in -o, -a, -i, -e. Always
        change the ending to match the noun.
      explanation: |-
        ## What a qualifying adjective is

        A qualifying adjective (<span lang="it">aggettivo qualificativo</span>, 'quality adjective') is a word that describes a quality of a noun: its size, colour, character, or condition. In Italian, every adjective must <span lang="it">accordarsi</span> ('agree') with the noun it modifies — that is, it must take the same gender (masculine or feminine) and the same number (singular or plural) as that noun.

        ## The four-form adjective (-o type)

        Most Italian adjectives belong to the <span lang="it">-o</span> class. They have four distinct forms:

        | | Singular | Plural |
        |---|---|---|
        | Masculine | -o | -i |
        | Feminine | -a | -e |

        Take the adjective <span lang="it">alto</span> ('tall') as a model:

        | | Singular | Plural |
        |---|---|---|
        | Masculine | alto | alti |
        | Feminine | alta | alte |

        The same pattern applies to adjectives such as <span lang="it">piccolo</span> ('small'), <span lang="it">nuovo</span> ('new'), <span lang="it">brutto</span> ('ugly'), <span lang="it">stanco</span> ('tired'), <span lang="it">buono</span> ('good'), and <span lang="it">cattivo</span> ('bad').

        ## The two-form adjective (-e type)

        A second group of adjectives ends in <span lang="it">-e</span> in the singular and <span lang="it">-i</span> in the plural. These adjectives have the same form for masculine and feminine:

        | | Singular | Plural |
        |---|---|---|
        | Masculine | -e | -i |
        | Feminine | -e | -i |

        Take <span lang="it">grande</span> ('big, great') as a model:

        | | Singular | Plural |
        |---|---|---|
        | Masculine | grande | grandi |
        | Feminine | grande | grandi |

        Other common adjectives of this type: <span lang="it">felice</span> ('happy'), <span lang="it">triste</span> ('sad'), <span lang="it">verde</span> ('green'), <span lang="it">dolce</span> ('sweet'), <span lang="it">giovane</span> ('young'), <span lang="it">forte</span> ('strong').

        ## How adjectives agree with nouns

        The rule is simple: look at the noun, identify its gender and number, then choose the matching adjective ending.

        - A masculine singular noun takes an adjective in <span lang="it">-o</span> (or <span lang="it">-e</span> for the second group).
        - A feminine singular noun takes an adjective in <span lang="it">-a</span> (or <span lang="it">-e</span> for the second group).
        - A masculine plural noun takes an adjective in <span lang="it">-i</span>.
        - A feminine plural noun takes an adjective in <span lang="it">-e</span> (first group) or <span lang="it">-i</span> (second group).

        When an adjective modifies two or more nouns of different genders, use the masculine plural form:
        <span lang="it">Marco e Maria sono stanchi.</span> (Marco and Maria are tired.)

        ## Where the adjective goes

        In Italian, the qualifying adjective usually comes after the noun: <span lang="it">un ragazzo alto</span> ('a tall boy'), <span lang="it">una pizza buona</span> ('a good pizza'). This is the safe, default word order for A1 learners. Some very common adjectives — such as <span lang="it">bello</span> ('beautiful'), <span lang="it">buono</span> ('good'), <span lang="it">grande</span> ('great'), <span lang="it">piccolo</span> ('small'), and <span lang="it">brutto</span> ('ugly') — can also precede the noun without changing the essential meaning, though adjective-before-noun tends to sound more descriptive and adjective-after-noun tends to be more specific or contrastive. At A1, placing the adjective after the noun is always correct.

        ## Invariable adjectives (no ending change)

        A small but important group of adjectives never change their ending, regardless of the gender or number of the noun. The most common at A1 are certain colour adjectives: <span lang="it">rosa</span> ('pink'), <span lang="it">blu</span> ('blue'), <span lang="it">viola</span> ('violet'), <span lang="it">lilla</span> ('lilac'). These are called <span lang="it">aggettivi invariabili</span> ('invariable adjectives'):
        <span lang="it">una scarpa rosa / due scarpe rosa / un fiore rosa / tre fiori rosa.</span> ('a pink shoe / two pink shoes / a pink flower / three pink flowers') — the adjective stays <span lang="it">rosa</span> throughout.

        ## Examples

        1. <span lang="it">Il fratello è alto.</span> — 'The brother is tall.' (masculine singular: <span lang="it">alto</span>)

        2. <span lang="it">La sorella è alta.</span> — 'The sister is tall.' (feminine singular: <span lang="it">alta</span>)

        3. <span lang="it">I bambini sono stanchi.</span> — 'The children are tired.' (masculine plural: <span lang="it">stanchi</span>)

        4. <span lang="it">Le ragazze sono felici.</span> — 'The girls are happy.' (feminine plural, <span lang="it">-e</span> type adjective: <span lang="it">felici</span> — same form as masculine plural)

        5. Contrastive pair — <span lang="it">-o</span> type vs <span lang="it">-e</span> type in the feminine:
        <span lang="it">La pizza è buona e dolce.</span> — 'The pizza is good and sweet.' (<span lang="it">buona</span>: feminine singular of <span lang="it">buono</span>, <span lang="it">-o</span> type; <span lang="it">dolce</span>: feminine singular of <span lang="it">dolce</span>, <span lang="it">-e</span> type — no change from masculine)

        6. Invariable colour adjective:
        <span lang="it">Ho una borsa blu e due scarpe blu.</span> — 'I have a blue bag and two blue shoes.' (<span lang="it">blu</span> does not change)

        ## Common learner mistakes

        **Mistake 1 — treating all adjectives as four-form:**
        Learners sometimes add an <span lang="it">-a</span> ending to a two-form adjective in the feminine:
        <span lang="it">✗ La ragazza è felica.</span>
        <span lang="it">✓ La ragazza è felice.</span> — 'The girl is happy.'
        Adjectives ending in <span lang="it">-e</span> do not change between masculine and feminine. Only the singular → plural change (<span lang="it">-e</span> → <span lang="it">-i</span>) applies.

        **Mistake 2 — forgetting to change the adjective at all:**
        Using the masculine singular form everywhere is a very frequent error:
        <span lang="it">✗ Le ragazze sono stanco.</span>
        <span lang="it">✓ Le ragazze sono stanche.</span> — 'The girls are tired.' (feminine plural: <span lang="it">stanche</span>)

        **Mistake 3 — changing invariable colour adjectives:**
        <span lang="it">✗ Ho due scarpe rosei.</span>
        <span lang="it">✓ Ho due scarpe rosa.</span> — 'I have two pink shoes.' (<span lang="it">rosa</span> never changes)
        Note: <span lang="it">rosso</span> ('red') is a regular four-form adjective (<span lang="it">rosso, rossa, rossi, rosse</span>) — do not confuse it with invariable <span lang="it">rosa</span> ('pink').

        **Mistake 4 — mixed-gender nouns: using feminine plural:**
        <span lang="it">✗ Il papà e la mamma sono alte.</span>
        <span lang="it">✓ Il papà e la mamma sono alti.</span> — 'Dad and mum are tall.' (at least one masculine noun → use masculine plural adjective)
      language: en
      why_this_matters: Adjectives are everywhere in Italian. You need them to describe
        people, places, food, and feelings — the most basic things you want to say.
        Without knowing how to change the adjective ending to match the noun, almost
        every descriptive sentence you produce will contain an error. Master this
        rule and a huge part of Italian description becomes available to you immediately.
    it:
      title: 'L''aggettivo qualificativo: forme e concordanza'
      tip: 'In italiano, l''aggettivo qualificativo cambia la sua terminazione per
        concordare con il nome a cui si riferisce. Se il nome è maschile singolare,
        l''aggettivo è maschile singolare; se è femminile plurale, l''aggettivo è
        femminile plurale. Esistono due gruppi principali: aggettivi con quattro forme
        (-o, -a, -i, -e) e aggettivi con due forme (-e, -i).'
      explanation: |-
        ## Aggettivo qualificativo: forme e concordanza

        ### Che cos'è un aggettivo qualificativo?

        Un aggettivo qualificativo (qualifying adjective) descrive una caratteristica di un nome: il colore, la dimensione, la personalità, ecc. In italiano, l'aggettivo **concorda** (agrees) con il nome in **genere** (maschile o femminile) e **numero** (singolare o plurale).

        ---

        ### Gruppo 1 — Aggettivi in -O: quattro forme

        Questi aggettivi hanno quattro forme diverse:

        | | Singolare | Plurale |
        |---|---|---|
        | **Maschile** | -o | -i |
        | **Femminile** | -a | -e |

        **Esempio con <span lang='it'>nuovo</span> (new):**

        | | Singolare | Plurale |
        |---|---|---|
        | **Maschile** | <span lang='it'>nuovo</span> | <span lang='it'>nuovi</span> |
        | **Femminile** | <span lang='it'>nuova</span> | <span lang='it'>nuove</span> |

        - <span lang='it'>Il libro è **nuovo**.</span> (The book is new.)
        - <span lang='it'>La penna è **nuova**.</span> (The pen is new.)
        - <span lang='it'>I libri sono **nuovi**.</span> (The books are new.)
        - <span lang='it'>Le penne sono **nuove**.</span> (The pens are new.)

        Altri aggettivi di questo tipo: <span lang='it'>bello, brutto, piccolo, grande, rosso, bianco, vecchio, simpatico, stanco, cattivo</span>.

        ---

        ### Gruppo 2 — Aggettivi in -E: due forme

        Questi aggettivi hanno la **stessa forma** per il maschile e il femminile al singolare, e la **stessa forma** per entrambi i generi al plurale:

        | | Singolare | Plurale |
        |---|---|---|
        | **Maschile** | -e | -i |
        | **Femminile** | -e | -i |

        **Esempio con <span lang='it'>gentile</span> (kind):**

        | | Singolare | Plurale |
        |---|---|---|
        | **Maschile** | <span lang='it'>gentile</span> | <span lang='it'>gentili</span> |
        | **Femminile** | <span lang='it'>gentile</span> | <span lang='it'>gentili</span> |

        - <span lang='it'>Marco è **gentile**.</span> (Marco is kind.)
        - <span lang='it'>Maria è **gentile**.</span> (Maria is kind.)
        - <span lang='it'>I ragazzi sono **gentili**.</span> (The boys are kind.)
        - <span lang='it'>Le ragazze sono **gentili**.</span> (The girls are kind.)

        Altri aggettivi di questo tipo: <span lang='it'>intelligente, interessante, triste, forte, felice, grande, verde</span>.

        > **Attenzione!** <span lang='it'>Grande</span> appartiene al gruppo 2 (singolare: <span lang='it'>grande</span>; plurale: <span lang='it'>grandi</span>), ma è molto comune, quindi memorizzalo bene.

        ---

        ### Posizione dell'aggettivo

        In italiano, l'aggettivo qualificativo si mette di solito **dopo** il nome:

        - <span lang='it'>un ragazzo **simpatico**</span> (a nice boy)
        - <span lang='it'>una casa **grande**</span> (a big house)

        Alcuni aggettivi molto comuni si usano spesso **prima** del nome: <span lang='it'>bello, brutto, buono, cattivo, grande, piccolo, giovane, vecchio</span>. Per ora, ricorda solo che entrambe le posizioni esistono.

        ---

        ### Concordanza con più nomi

        Se un aggettivo si riferisce a più nomi, si usa il **plurale**. Se i nomi sono di genere misto (maschile + femminile), si usa il **maschile plurale**:

        - <span lang='it'>Il ragazzo e la ragazza sono **simpatici**.</span> (The boy and the girl are nice.)
        - <span lang='it'>La borsa e il cappello sono **nuovi**.</span> (The bag and the hat are new.)

        ---

        ### Esempi riassuntivi

        1. <span lang='it'>Ho un gatto **nero** e una gatta **nera**.</span> (I have a black male cat and a black female cat.)
        2. <span lang='it'>Il professore è molto **bravo**.</span> (The teacher is very good.)
        3. <span lang='it'>Le lezioni sono **interessanti**.</span> (The lessons are interesting.)
        4. <span lang='it'>Marco e Luca sono **stanchi**.</span> (Marco and Luca are tired.)
        5. <span lang='it'>Anna è una studentessa **intelligente**.</span> (Anna is an intelligent student.)
        6. <span lang='it'>I miei amici sono **simpatici** e **gentili**.</span> (My friends are nice and kind.)

        ---

        ### Errori comuni

        | Errore tipico | Forma corretta | Spiegazione |
        |---|---|---|
        | <span lang='it'>La ragazza è simpatico.</span> | <span lang='it'>La ragazza è **simpatica**.</span> | Il nome è femminile, quindi l'aggettivo deve essere femminile. |
        | <span lang='it'>I libri sono nuovo.</span> | <span lang='it'>I libri sono **nuovi**.</span> | Il nome è plurale, quindi l'aggettivo deve essere plurale. |
        | <span lang='it'>Le ragazze sono intelligente.</span> | <span lang='it'>Le ragazze sono **intelligenti**.</span> | Anche gli aggettivi in -e cambiano al plurale: -e → -i. |
        | <span lang='it'>Una casa grande-a.</span> | <span lang='it'>Una casa **grande**.</span> | Gli aggettivi in -e non cambiano per il genere, solo per il numero. |
      language: it
      why_this_matters: 'La concordanza degli aggettivi è fondamentale in italiano:
        senza questa regola non puoi descrivere persone, oggetti o situazioni in modo
        corretto. La incontrerai in quasi ogni frase, perché gli aggettivi sono ovunque
        — nei saluti, nelle descrizioni, nelle opinioni.'
  source_url: https://www.unistrapg.it/profilo_lingua_italiana/site/gram_aggettivi_a1.html

- code: poss_adj
  cefr_level: A1
  category: aggettivi
  subcategory: possessivi
  unistr_code: aggettivi_possessivi
  unistr_label: Aggettivi possessivi
  label: Aggettivo possessivo
  description: Words like 'my', 'your', 'his/her' that show ownership. In Italian
    they agree in gender and number with the noun they modify.
  examples:
  - <span lang='it'>Questo è il mio zaino.</span>
  - <span lang='it'>Come si chiama tua sorella?</span>
  - <span lang='it'>Il nostro professore è molto bravo.</span>
  - <span lang='it'>La loro casa è grande.</span>
  - <span lang='it'>I suoi libri sono sul tavolo.</span>
  - <span lang='it'>Mia madre si chiama Anna.</span>
  chunk_ref: book_6_l_aggettivo_aggettivi_possessivi
  prerequisites:
  - noun_o_a_e
  - all_det_in
  explanations:
    en:
      title: 'Possessive adjectives: my, your, his, her…'
      tip: Possessive adjectives in Italian agree in gender and number with the thing
        owned, not the owner. They almost always appear with a definite article in
        front of them — except with singular, unmodified family members.
      explanation: |-
        Possessive adjectives tell you who something belongs to. Italian has a full set of them, and they work quite differently from English ones — they must agree with the noun they describe, and they almost always travel with a definite article. Getting these right will let you talk about your family, your things, and your daily life from your very first conversations.

        ## The full set of forms

        Each possessive has four forms: masculine singular, feminine singular, masculine plural, feminine plural. The article in front agrees with the noun in gender and number in the normal way.

        | Person | Masc. sg. | Fem. sg. | Masc. pl. | Fem. pl. |
        |---|---|---|---|---|
        | I (my) | il mio | la mia | i miei | le mie |
        | you sg. (your) | il tuo | la tua | i tuoi | le tue |
        | he/she/it (his/her/its) | il suo | la sua | i suoi | le sue |
        | we (our) | il nostro | la nostra | i nostri | le nostre |
        | you pl. (your) | il vostro | la vostra | i vostri | le vostre |
        | they (their) | il loro | la loro | i loro | le loro |

        Notice that <span lang="it">loro</span> never changes its ending — only the article changes. All other possessives agree fully with the noun.

        ## The key rule: agreement follows the object, not the owner

        In English, 'his' or 'her' depends on the sex of the owner. In Italian, <span lang="it">suo / sua / suoi / sue</span> depends entirely on the gender and number of the thing owned. So 'his bag' and 'her bag' are both <span lang="it">la sua borsa</span> — because <span lang="it">borsa</span> (bag) is feminine. Context or earlier mention tells you whose it is.

        ## The article rule — and the big exception

        Italian possessive adjectives are almost always preceded by the appropriate definite article (<span lang="it">il, la, i, le,</span> etc.).

        **Exception — singular, unmodified family members:** When the noun is a singular family-member noun in its basic, unmodified form, the article is dropped.

        Family-member nouns that trigger this rule include: <span lang="it">madre</span> (mother), <span lang="it">padre</span> (father), <span lang="it">sorella</span> (sister), <span lang="it">fratello</span> (brother), <span lang="it">figlia</span> (daughter), <span lang="it">figlio</span> (son), <span lang="it">moglie</span> (wife), <span lang="it">marito</span> (husband), <span lang="it">nonna</span> (grandmother), <span lang="it">nonno</span> (grandfather), <span lang="it">zia</span> (aunt), <span lang="it">zio</span> (uncle).

        The article **stays** when any of the following is true:
        - the noun is **plural**: <span lang="it">i miei fratelli</span> (my brothers)
        - the possessive is <span lang="it">**loro**</span>: <span lang="it">il loro padre</span> (their father)
        - the noun has a **suffix** (diminutive, etc.): <span lang="it">il mio fratellino</span> (my little brother)
        - the noun is modified by an **adjective**: <span lang="it">la mia cara sorella</span> (my dear sister)

        ## Examples

        <span lang="it">Dov'è il mio zaino?</span> (Where is my backpack?) — article present; <span lang="it">zaino</span> is not a family noun.

        <span lang="it">Questa è mia sorella.</span> (This is my sister.) — no article; singular, unmodified family noun with <span lang="it">mio/mia</span>.

        <span lang="it">Ho parlato con i miei genitori.</span> (I spoke with my parents.) — article present because the noun is plural.

        <span lang="it">Lui mangia a casa sua ogni sera.</span> (He eats at his own home every evening.) — <span lang="it">sua</span> agrees with <span lang="it">casa</span> (feminine), not with 'he'.

        <span lang="it">Come si chiama il loro cane?</span> (What is their dog's name?) — article stays because the possessive is <span lang="it">loro</span>.

        <span lang="it">La nostra scuola è grande.</span> (Our school is big.) — <span lang="it">nostra</span> agrees with <span lang="it">scuola</span> (feminine singular).

        ## The special possessive 'proprio'

        The adjective <span lang="it">proprio</span> (one's own) can replace <span lang="it">suo</span> or <span lang="it">loro</span> when the possessive refers back to the subject of the same sentence. It is especially preferred when using <span lang="it">suo</span> or <span lang="it">loro</span> would be ambiguous, or when the subject is indefinite (e.g. <span lang="it">ognuno</span> — everyone, <span lang="it">nessuno</span> — no one).

        Compare these two sentences:

        <span lang="it">Francesco parlò con Giuseppe, poi telefonò a sua sorella.</span> (Francesco spoke with Giuseppe, then called his sister.) — Ambiguous: whose sister?

        <span lang="it">Francesco parlò con Giuseppe, poi telefonò alla propria sorella.</span> (Francesco spoke with Giuseppe, then called his own sister.) — Clear: Francesco's sister.

        With an indefinite subject: <span lang="it">Ognuno ha il diritto di seguire la propria strada.</span> (Everyone has the right to follow their own path.)

        Like all other possessives, <span lang="it">proprio</span> agrees in gender and number with the noun it modifies: <span lang="it">proprio, propria, propri, proprie</span>.

        ## The invariable 'altrui'

        Italian also has <span lang="it">altrui</span> (someone else's / other people's), which functions as a possessive adjective. It has only one form — it never changes for gender or number — and it usually follows the noun rather than preceding it: <span lang="it">fare la volontà altrui</span> (to do another's will); <span lang="it">acconsentire agli altrui desideri</span> (to agree to other people's wishes). At A1 level you mainly need to recognise it; active use comes later.

        ## Common learner mistakes

        **Mistake 1 — Agreeing with the owner instead of the object:**
        ❌ <span lang="it">Maria ha perso il suo borsa.</span> — wrong; <span lang="it">borsa</span> is feminine.
        ✅ <span lang="it">Maria ha perso la sua borsa.</span> (Maria lost her bag.)

        **Mistake 2 — Forgetting the article with non-family nouns:**
        ❌ <span lang="it">Dov'è mio libro?</span>
        ✅ <span lang="it">Dov'è il mio libro?</span> (Where is my book?)

        **Mistake 3 — Adding the article with singular, unmodified family nouns:**
        ❌ <span lang="it">Questa è la mia madre.</span>
        ✅ <span lang="it">Questa è mia madre.</span> (This is my mother.)

        **Mistake 4 — Changing <span lang="it">loro</span> to agree with the noun:**
        ❌ <span lang="it">la lora casa / i lori libri</span> — <span lang="it">loro</span> is invariable.
        ✅ <span lang="it">la loro casa</span> (their house), <span lang="it">i loro libri</span> (their books).

        **Mistake 5 — Translating 'his' / 'her' as different words:**
        ❌ Thinking that 'his book' and 'her book' use different Italian words.
        ✅ Both are <span lang="it">il suo libro</span>. The gender of the owner is irrelevant; only the noun matters.
      language: en
      why_this_matters: You will need possessive adjectives constantly — to say 'my
        bag', 'her mother', 'our house', 'their names'. Without them you cannot describe
        possession, relationships, or anything that belongs to someone. Because Italian
        possessives behave very differently from English ones (they agree with the
        object, not the owner; they carry an article; 'his' and 'her' are the same
        word), this is one of the rules where learners make the most errors — and
        getting it right early removes a huge source of confusion.
    it:
      title: Gli aggettivi possessivi in italiano
      tip: Gli aggettivi possessivi in italiano cambiano forma secondo il genere e
        il numero del nome che accompagnano, non secondo il possessore. Di solito
        si usano con l'articolo determinativo davanti.
      explanation: |-
        ## Gli aggettivi possessivi (Possessive adjectives)

        ### Regola principale

        In italiano, gli aggettivi possessivi concordano in genere (maschile/femminile) e numero (singolare/plurale) con il **nome che accompagnano**, non con il possessore. Si mettono di solito **davanti al nome** e sono quasi sempre preceduti dall'**articolo determinativo** (definite article).

        ### Tabella dei possessivi

        | Persona | Maschile singolare | Femminile singolare | Maschile plurale | Femminile plurale |
        |---|---|---|---|---|
        | io | <span lang='it'>il mio</span> | <span lang='it'>la mia</span> | <span lang='it'>i miei</span> | <span lang='it'>le mie</span> |
        | tu | <span lang='it'>il tuo</span> | <span lang='it'>la tua</span> | <span lang='it'>i tuoi</span> | <span lang='it'>le tue</span> |
        | lui/lei | <span lang='it'>il suo</span> | <span lang='it'>la sua</span> | <span lang='it'>i suoi</span> | <span lang='it'>le sue</span> |
        | noi | <span lang='it'>il nostro</span> | <span lang='it'>la nostra</span> | <span lang='it'>i nostri</span> | <span lang='it'>le nostre</span> |
        | voi | <span lang='it'>il vostro</span> | <span lang='it'>la vostra</span> | <span lang='it'>i vostri</span> | <span lang='it'>le vostre</span> |
        | loro | <span lang='it'>il loro</span> | <span lang='it'>la loro</span> | <span lang='it'>i loro</span> | <span lang='it'>le loro</span> |

        > **Attenzione:** <span lang='it'>loro</span> è invariabile — non cambia mai forma!

        ### Esempi

        - <span lang='it'>Il mio libro è rosso.</span> (My book is red.)
        - <span lang='it'>La tua borsa è qui.</span> (Your bag is here.)
        - <span lang='it'>I suoi amici sono simpatici.</span> (His/Her friends are nice.)
        - <span lang='it'>La nostra scuola è grande.</span> (Our school is big.)
        - <span lang='it'>I loro figli si chiamano Marco e Sofia.</span> (Their children are called Marco and Sofia.)
        - <span lang='it'>Dov'è il vostro appartamento?</span> (Where is your apartment?)

        ### Eccezione importante: nomi di famiglia al singolare

        Con i **nomi di parentela al singolare** (family member nouns in the singular), l'articolo determinativo **non si usa** — tranne con <span lang='it'>loro</span> e con i nomi alterati (modified forms) come <span lang='it'>mamma</span> e <span lang='it'>papà</span>.

        | Con articolo ❌ | Senza articolo ✅ |
        |---|---|
        | <span lang='it'>~~la mia madre~~</span> | <span lang='it'>mia madre</span> (my mother) |
        | <span lang='it'>~~il tuo padre~~</span> | <span lang='it'>tuo padre</span> (your father) |
        | <span lang='it'>~~il suo fratello~~</span> | <span lang='it'>suo fratello</span> (his/her brother) |
        | <span lang='it'>~~la nostra sorella~~</span> | <span lang='it'>nostra sorella</span> (our sister) |

        Ma con <span lang='it'>loro</span> si usa l'articolo:
        - <span lang='it'>**la loro** madre</span> (their mother)
        - <span lang='it'>**il loro** padre</span> (their father)

        E con i nomi alterati o affettuosi si usa l'articolo:
        - <span lang='it'>**la mia** mamma</span> (my mum)
        - <span lang='it'>**il tuo** papà</span> (your dad)

        Al **plurale**, l'articolo si usa sempre:
        - <span lang='it'>**i miei** fratelli</span> (my brothers)
        - <span lang='it'>**le tue** sorelle</span> (your sisters)

        ### Errori comuni

        **1. Dimenticare l'accordo con il nome**

        ❌ <span lang='it'>~~il mio borsa~~</span>
        ✅ <span lang='it'>la mia borsa</span> (la borsa è femminile)

        **2. Usare <span lang='it'>suo/sua</span> per 'their'**

        In italiano, <span lang='it'>suo/sua/suoi/sue</span> si usa per 'his' e 'her'. Per 'their' si usa <span lang='it'>loro</span>.

        ❌ <span lang='it'>~~La sua macchina~~</span> (per dire 'their car')
        ✅ <span lang='it'>La loro macchina</span> (their car)

        **3. Mettere l'articolo con i nomi di famiglia al singolare**

        ❌ <span lang='it'>~~la mia sorella~~</span>
        ✅ <span lang='it'>mia sorella</span>

        **4. Dimenticare l'articolo quando si deve usare**

        ❌ <span lang='it'>~~Dov'è tuo libro?~~</span>
        ✅ <span lang='it'>Dov'è il tuo libro?</span>
      language: it
      why_this_matters: Gli aggettivi possessivi sono necessari per parlare di famiglia,
        oggetti personali e relazioni quotidiane. Senza di loro non puoi dire frasi
        semplici come 'il mio amico' o 'la nostra scuola'.
  source_url: https://www.unistrapg.it/profilo_lingua_italiana/site/gram_aggettivi_a1.html

- code: dem_questo
  cefr_level: A1
  category: aggettivi
  subcategory: dimostrativi
  unistr_code: aggettivi_dimostrativi_questo_quello
  unistr_label: 'Aggettivi dimostrativi: questo, quello'
  label: Aggettivo dimostrativo questo e quello
  description: Demonstrative adjectives pointing to things near (questo) or far (quello),
    agreeing in gender and number with the noun.
  examples:
  - <span lang='it'>Questo libro è molto interessante.</span>
  - <span lang='it'>Questa borsa è rossa.</span>
  - <span lang='it'>Questi pantaloni sono nuovi.</span>
  - <span lang='it'>Quell'appartamento è grande.</span>
  - <span lang='it'>Quella ragazza si chiama Marta.</span>
  - <span lang='it'>Quegli studenti sono italiani.</span>
  chunk_ref: book_6_l_aggettivo_aggettivi_dimostrativi
  prerequisites:
  - noun_o_a_e
  explanations:
    en:
      title: 'Demonstrative adjectives: questo and quello'
      tip: Use 'questo' (this/these) for people or things close to you, and 'quello'
        (that/those) for people or things far away. Both adjectives must agree in
        gender and number with the noun they describe.
      explanation: |-
        ## The core rule

        In Italian, demonstrative adjectives agree in **gender** (masculine or feminine) and **number** (singular or plural) with the noun they modify. The two main demonstrative adjectives are:

        - <span lang="it">**questo**</span> — 'this / these': points to someone or something **close to the speaker**
        - <span lang="it">**quello**</span> — 'that / those': points to someone or something **far from the speaker**

        ## Forms of questo

        The forms of <span lang="it">questo</span> follow the regular pattern of a first/second-declension adjective. Before a vowel, the singular forms <span lang="it">questo</span> and <span lang="it">questa</span> may drop their final vowel and add an apostrophe (<span lang="it">quest'</span>), though the full form is always acceptable too.

        | | Masculine | Feminine |
        |---|---|---|
        | Singular | questo | questa |
        | Plural | questi | queste |

        Before a vowel (optional elision):

        | | Masculine | Feminine |
        |---|---|---|
        | Singular before vowel | quest' | quest' |

        Example: <span lang="it">quest'uomo</span> (this man), <span lang="it">quest'arancia</span> (this orange). The plural forms <span lang="it">questi</span> and <span lang="it">queste</span> are **never** elided.

        ## Forms of quello

        The forms of <span lang="it">quello</span> follow the same pattern as the definite article (<span lang="it">il, lo, la, i, gli, le</span>). This is the trickiest part: the form changes depending on the first letter(s) of the noun that follows.

        | Context | Masculine Singular | Masculine Plural | Feminine Singular | Feminine Plural |
        |---|---|---|---|---|
        | before most consonants | quel | quei | quella | quelle |
        | before s+consonant, z, ps, gn, x, y | quello | quegli | quella | quelle |
        | before a vowel | quell' | quegli | quell' | quelle |

        A simple way to remember this: the form of <span lang="it">quello</span> before the noun mirrors whichever definite article (<span lang="it">il → quel</span>, <span lang="it">lo → quello</span>, <span lang="it">l' → quell'</span>, <span lang="it">i → quei</span>, <span lang="it">gli → quegli</span>, <span lang="it">la → quella</span>, <span lang="it">le → quelle</span>) that noun would normally take.

        ## Examples

        **1. Pointing to something close vs. far away:**

        <span lang="it">Questo libro è interessante.</span> (This book is interesting. — the book is near the speaker.)

        <span lang="it">Quel libro è interessante.</span> (That book is interesting. — the book is far from the speaker.)

        **2. Feminine plural:**

        <span lang="it">Queste scarpe sono nuove.</span> (These shoes are new.)

        <span lang="it">Quelle scarpe sono vecchie.</span> (Those shoes are old.)

        **3. Elision of <span lang="it">questo</span> before a vowel:**

        <span lang="it">Quest'arancia è buona.</span> (This orange is good.)

        **4. <span lang="it">quello</span> before <span lang="it">s+consonant</span>:**

        <span lang="it">Quello studente è bravo.</span> (That student is good.) — note <span lang="it">quello</span>, not <span lang="it">quel</span>, because <span lang="it">studente</span> begins with <span lang="it">st-</span>.

        **5. Referring back to something already mentioned:**

        <span lang="it">Ho un gatto. Questo gatto si chiama Micio.</span> (I have a cat. This cat is called Micio.) — <span lang="it">questo</span> here refers back to the cat just mentioned.

        **6. Contrastive pair (near vs. far, masculine plural):**

        <span lang="it">Questi ragazzi sono italiani, quei ragazzi sono francesi.</span> (These boys are Italian, those boys are French.)

        ## A note on codesto

        The textbook lists a third demonstrative, <span lang="it">codesto</span>, which historically pointed to something near the **listener** ('that near you'). In modern standard Italian it is virtually obsolete — you will only hear it in Tuscany. In everyday speech, Italians use either <span lang="it">questo</span> or <span lang="it">quello</span> to cover all situations, relying on context or a pointing gesture to make the distance clear. You do not need to use <span lang="it">codesto</span> at this level.

        ## Common learner mistakes

        **Mistake 1 — Using <span lang="it">quello</span> instead of <span lang="it">quel / quell'</span>:**

        <span lang="it">*Quello libro è mio.</span> ✗ — <span lang="it">libro</span> begins with a plain consonant, so the correct form is <span lang="it">quel libro</span> ✓.

        **Mistake 2 — Forgetting gender/number agreement:**

        <span lang="it">*Questo ragazza è simpatica.</span> ✗ — <span lang="it">ragazza</span> is feminine, so the correct form is <span lang="it">questa ragazza</span> ✓.

        **Mistake 3 — Eliding the plural:**

        <span lang="it">*Quest'amici sono gentili.</span> ✗ — Elision only applies in the singular. The correct form is <span lang="it">questi amici</span> ✓.

        **Mistake 4 — Using <span lang="it">quegli</span> before an ordinary consonant:**

        <span lang="it">*Quegli ragazzi giocano.</span> ✗ — <span lang="it">quegli</span> is reserved for nouns starting with a vowel or <span lang="it">s+consonant, z</span>, etc. The correct form is <span lang="it">quei ragazzi</span> ✓.
      language: en
      why_this_matters: Every time you point something out — 'this book', 'that table',
        'these shoes', 'those people' — you need a demonstrative adjective. Without
        them you cannot distinguish between what is near and what is far, or refer
        back to something already mentioned in conversation. These two words appear
        in almost every Italian exchange, so getting their forms right early removes
        a persistent source of errors.
    it:
      title: 'Questo e quello: vicino o lontano'
      tip: Usa <span lang='it'>questo</span> per le cose vicine a te e <span lang='it'>quello</span>
        per le cose lontane. Entrambi cambiano forma secondo il genere (maschile/femminile)
        e il numero (singolare/plurale) del nome che accompagnano.
      explanation: |-
        ## <span lang='it'>Questo</span> e <span lang='it'>quello</span>: aggettivi dimostrativi (demonstrative adjectives)

        ### Regola di base

        <span lang='it'>**Questo**</span> indica qualcosa di **vicino** a chi parla (this/these in inglese).
        <span lang='it'>**Quello**</span> indica qualcosa di **lontano** da chi parla (that/those in inglese).

        Entrambi si accordano in **genere** (maschile o femminile) e **numero** (singolare o plurale) con il nome che accompagnano.

        ---

        ### Forme di <span lang='it'>questo</span>

        | | Singolare | Plurale |
        |---|---|---|
        | **Maschile** | <span lang='it'>questo</span> | <span lang='it'>questi</span> |
        | **Femminile** | <span lang='it'>questa</span> | <span lang='it'>queste</span> |

        > **Nota:** davanti a una parola che inizia con vocale, <span lang='it'>questo</span> e <span lang='it'>questa</span> possono diventare <span lang='it'>quest'</span> (elisione).
        > - <span lang='it'>quest'uomo</span> (this man)
        > - <span lang='it'>quest'amica</span> (this friend)

        ---

        ### Forme di <span lang='it'>quello</span>

        <span lang='it'>Quello</span> funziona come l'articolo determinativo (definite article): le sue forme cambiano in base alla lettera iniziale del nome.

        | Iniziale del nome | Maschile singolare | Maschile plurale | Femminile singolare | Femminile plurale |
        |---|---|---|---|---|
        | consonante normale | <span lang='it'>quel</span> | <span lang='it'>quei</span> | <span lang='it'>quella</span> | <span lang='it'>quelle</span> |
        | s + consonante, z, ps, gn, x, y | <span lang='it'>quello</span> | <span lang='it'>quegli</span> | <span lang='it'>quella</span> | <span lang='it'>quelle</span> |
        | vocale | <span lang='it'>quell'</span> | <span lang='it'>quegli</span> | <span lang='it'>quell'</span> | <span lang='it'>quelle</span> |

        ---

        ### Esempi con <span lang='it'>questo</span>

        - <span lang='it'>Questo libro è mio.</span> (This book is mine.)
        - <span lang='it'>Questa pizza è buona!</span> (This pizza is good!)
        - <span lang='it'>Questi ragazzi sono simpatici.</span> (These boys are nice.)
        - <span lang='it'>Queste scarpe sono nuove.</span> (These shoes are new.)
        - <span lang='it'>Quest'arancia è dolce.</span> (This orange is sweet.)

        ### Esempi con <span lang='it'>quello</span>

        - <span lang='it'>Quel ragazzo si chiama Marco.</span> (That boy is called Marco.)
        - <span lang='it'>Quei libri sono interessanti.</span> (Those books are interesting.)
        - <span lang='it'>Quello studente studia molto.</span> (That student studies a lot.)
        - <span lang='it'>Quegli zaini sono pesanti.</span> (Those backpacks are heavy.)
        - <span lang='it'>Quella borsa è bella.</span> (That bag is beautiful.)
        - <span lang='it'>Quell'amica abita qui.</span> (That friend lives here.)
        - <span lang='it'>Quelle ragazze sono francesi.</span> (Those girls are French.)

        ---

        ### Errori comuni

        **1. Usare <span lang='it'>quello</span> davanti a una consonante normale**
        - ❌ <span lang='it'>*quello libro*</span>
        - ✅ <span lang='it'>quel libro</span>

        **2. Dimenticare l'accordo con il nome**
        - ❌ <span lang='it'>*questo ragazza*</span>
        - ✅ <span lang='it'>questa ragazza</span>

        **3. Non fare l'elisione con <span lang='it'>questo/questa</span> davanti a vocale (non è un errore grave, ma è meglio usarla)**
        - Accettabile: <span lang='it'>questo amico</span>
        - Più naturale: <span lang='it'>quest'amico</span>

        **4. Confondere <span lang='it'>quegli</span> con <span lang='it'>quei</span>**
        - <span lang='it'>quei bambini</span> (consonante normale → <span lang='it'>quei</span>)
        - <span lang='it'>quegli studenti</span> (s + consonante o vocale → <span lang='it'>quegli</span>)

        ---

        ### Omissione dell'articolo

        Quando usi <span lang='it'>questo</span> o <span lang='it'>quello</span> davanti a un nome, **non si usa l'articolo**.
        - ❌ <span lang='it'>*il questo libro*</span>
        - ✅ <span lang='it'>questo libro</span>
      language: it
      why_this_matters: Gli aggettivi dimostrativi sono indispensabili per indicare
        oggetti, persone e luoghi nella conversazione quotidiana. Senza <span lang='it'>questo</span>
        e <span lang='it'>quello</span> non puoi dire frasi semplici come 'Vorrei
        questo caffè' o 'Quanto costa quella giacca?'
  source_url: https://www.unistrapg.it/profilo_lingua_italiana/site/gram_aggettivi_a1.html

- code: inter_che
  cefr_level: A1
  category: aggettivi
  subcategory: interrogativi
  unistr_code: aggettivi_interrogativi_che_quanto
  unistr_label: 'Aggettivi interrogativi: che, quanto'
  label: Aggettivo interrogativo che e quanto
  description: The interrogative adjectives 'che' and 'quanto' are used to ask 'what
    kind of' or 'how much/many' before a noun.
  examples:
  - <span lang='it'>Che libro leggi?</span>
  - <span lang='it'>Che lingua parli?</span>
  - <span lang='it'>Quanti anni hai?</span>
  - <span lang='it'>Quanta acqua vuoi?</span>
  - <span lang='it'>Che musica ascolti?</span>
  - <span lang='it'>Quante sorelle hai?</span>
  chunk_ref: book_6_l_aggettivo_aggettivi_interrogativied_esclamativi
  prerequisites:
  - noun_o_a_e
  explanations:
    en:
      title: Asking questions with 'che' and 'quanto'
      tip: Use 'che' before a noun to ask 'what?' or 'which?' — it never changes its
        form. Use 'quanto' to ask 'how much?' or 'how many?' — it must agree in gender
        and number with the noun it describes.
      explanation: |-
        ## The interrogative adjectives: what they are and how they work

        Interrogative adjectives (<span lang="it">aggettivi interrogativi</span>, literally 'asking adjectives') are placed directly before a noun to ask a question about it. Italian has three: <span lang="it">che</span>, <span lang="it">quale</span>, and <span lang="it">quanto</span>. This entry focuses on <span lang="it">che</span> and <span lang="it">quanto</span>, the two introduced at A1.

        ## 'Che' — what / which

        <span lang="it">Che</span> means 'what' or 'which' when placed before a noun. Its most important feature is that it is **invariable** — it has one single form for masculine, feminine, singular, and plural. It never changes.

        It works exactly like <span lang="it">quale</span> in questions with a noun: <span lang="it">che giorno?</span> and <span lang="it">quale giorno?</span> both mean 'which day?' and are fully interchangeable in this context.

        **Important exception — exclamations:** <span lang="it">Che</span> can also be used as an exclamative adjective (expressing surprise or emotion) before **another adjective**. In this use, <span lang="it">quale</span> cannot replace it. For example, you can say <span lang="it">Che bello!</span> ('How beautiful!'), but <span lang="it">*Quale bello!</span> is incorrect.

        **The phrase <span lang="it">che cosa</span>:** When asking 'what?' without a following noun, Italian often uses <span lang="it">che cosa</span> (literally 'what thing'). In everyday speech, <span lang="it">che</span> can be dropped and you can simply say <span lang="it">cosa</span>. All three forms — <span lang="it">che cosa</span>, <span lang="it">che</span>, and <span lang="it">cosa</span> — are correct and common.

        ## 'Quanto' — how much / how many

        <span lang="it">Quanto</span> means 'how much' (with uncountable nouns) or 'how many' (with countable nouns). Unlike <span lang="it">che</span>, it is **variable** — it must agree in gender and number with the noun it modifies, exactly like a regular adjective.

        Here are its four forms:

        | | Masculine | Feminine |
        |---|---|---|
        | **Singular** | quanto | quanta |
        | **Plural** | quanti | quante |

        Use the singular with uncountable nouns (things you cannot count individually, like water or time) and the plural with countable nouns.

        ## Examples

        <span lang="it">Che libro leggi?</span> — 'Which book are you reading?' (<span lang="it">che</span> + singular masculine noun; invariable)

        <span lang="it">Che lingue parli?</span> — 'What languages do you speak?' (<span lang="it">che</span> + plural feminine noun; still invariable — no change)

        <span lang="it">Che bella giornata!</span> — 'What a beautiful day!' (<span lang="it">che</span> as exclamative adjective before another adjective; <span lang="it">quale</span> could not replace it here)

        <span lang="it">Quanto zucchero vuoi?</span> — 'How much sugar do you want?' (<span lang="it">quanto</span> + singular masculine uncountable noun)

        <span lang="it">Quante sorelle hai?</span> — 'How many sisters do you have?' (<span lang="it">quante</span> + plural feminine noun — agreement is required)

        <span lang="it">Dimmi cosa vuoi.</span> — 'Tell me what you want.' (<span lang="it">cosa</span> used alone in an indirect question; <span lang="it">che cosa</span> or <span lang="it">che</span> would also be correct)

        ## Common learner mistakes

        **Mistake 1 — Changing <span lang="it">che</span> to agree with the noun:**
        Learners sometimes write <span lang="it">*chi libro</span> or try to make <span lang="it">che</span> plural. Remember: <span lang="it">che</span> is always <span lang="it">che</span>, regardless of the noun. Correct form: <span lang="it">che libro</span>, <span lang="it">che libri</span>, <span lang="it">che pizza</span>, <span lang="it">che pizze</span> — always the same.

        **Mistake 2 — Not changing <span lang="it">quanto</span> to agree with the noun:**
        Because <span lang="it">che</span> is invariable, learners sometimes treat <span lang="it">quanto</span> the same way. This is wrong. <span lang="it">*Quanto sorelle hai?</span> is incorrect. The noun <span lang="it">sorelle</span> is feminine and plural, so the correct form is <span lang="it">Quante sorelle hai?</span>

        **Mistake 3 — Using <span lang="it">quale</span> in exclamations before an adjective:**
        <span lang="it">*Quale bello!</span> is not Italian. Only <span lang="it">che</span> can introduce an exclamation before a bare adjective: <span lang="it">Che bello!</span>, <span lang="it">Che buono!</span>, <span lang="it">Che strano!</span>

        **Mistake 4 — Thinking only <span lang="it">che cosa</span> is correct:**
        All three forms — <span lang="it">che cosa</span>, <span lang="it">che</span>, and <span lang="it">cosa</span> — are equally acceptable when asking or saying 'what'. Do not hesitate to use <span lang="it">cosa</span> alone in conversation; it is not informal or incorrect.
      language: en
      why_this_matters: Two of the most basic things you need to do in Italian are
        ask questions and express surprise — and both depend on a small set of adjectives
        that appear constantly in everyday conversation. Without <span lang="it">che</span>
        and <span lang="it">quanto</span>, you cannot ask 'what time is it?', 'which
        pizza do you want?', or 'how many brothers do you have?' Mastering these two
        words immediately unlocks dozens of essential questions and exclamations.
    it:
      title: Usare 'che' e 'quanto' nelle domande
      tip: '<span lang=''it''>''Che'' e ''quanto'' sono aggettivi interrogativi: si
        usano prima di un nome per fare una domanda. ''Che'' è invariabile — non cambia
        mai forma. ''Quanto'' invece cambia forma secondo il genere e il numero del
        nome che accompagna.</span>'
      explanation: |-
        ## <span lang='it'>Gli aggettivi interrogativi 'che' e 'quanto'</span>

        ### <span lang='it'>Regola generale</span>

        <span lang='it'>Un **aggettivo interrogativo** (interrogative adjective) è una parola che si mette davanti a un nome per fare una domanda su di esso. In italiano, i principali aggettivi interrogativi sono **'che'** e **'quanto'**.</span>

        ---

        ### <span lang='it'>'Che' — invariabile</span>

        <span lang='it'>'Che' si usa per chiedere **che tipo** di cosa o persona è qualcosa. È **invariabile**: ha sempre la stessa forma, sia con nomi maschili che femminili, sia al singolare che al plurale.</span>

        | <span lang='it'>Genere/Numero</span> | <span lang='it'>Forma di 'che'</span> | <span lang='it'>Esempio</span> |
        |---|---|---|
        | <span lang='it'>maschile singolare</span> | <span lang='it'>che</span> | <span lang='it'>Che libro hai?</span> |
        | <span lang='it'>femminile singolare</span> | <span lang='it'>che</span> | <span lang='it'>Che lingua parli?</span> |
        | <span lang='it'>maschile plurale</span> | <span lang='it'>che</span> | <span lang='it'>Che amici hai?</span> |
        | <span lang='it'>femminile plurale</span> | <span lang='it'>che</span> | <span lang='it'>Che scarpe porti?</span> |

        <span lang='it'>**Esempi:**</span>

        - <span lang='it'>Che libro leggi?</span> (What book are you reading?)
        - <span lang='it'>Che lavoro fai?</span> (What work do you do?)
        - <span lang='it'>Che musica ascolti?</span> (What music do you listen to?)
        - <span lang='it'>Che lingue parli?</span> (What languages do you speak?)

        ---

        ### <span lang='it'>'Quanto' — variabile</span>

        <span lang='it'>'Quanto' si usa per chiedere **quante** cose ci sono o **quanta** quantità di qualcosa. È **variabile**: cambia forma secondo il genere (maschile/femminile) e il numero (singolare/plurale) del nome che accompagna.</span>

        | <span lang='it'>Genere/Numero</span> | <span lang='it'>Forma</span> | <span lang='it'>Esempio</span> |
        |---|---|---|
        | <span lang='it'>maschile singolare</span> | <span lang='it'>quanto</span> | <span lang='it'>Quanto tempo hai?</span> |
        | <span lang='it'>femminile singolare</span> | <span lang='it'>quanta</span> | <span lang='it'>Quanta acqua vuoi?</span> |
        | <span lang='it'>maschile plurale</span> | <span lang='it'>quanti</span> | <span lang='it'>Quanti anni hai?</span> |
        | <span lang='it'>femminile plurale</span> | <span lang='it'>quante</span> | <span lang='it'>Quante sorelle hai?</span> |

        <span lang='it'>**Esempi:**</span>

        - <span lang='it'>Quanto pane vuoi?</span> (How much bread do you want?)
        - <span lang='it'>Quanta acqua bevi?</span> (How much water do you drink?)
        - <span lang='it'>Quanti studenti ci sono?</span> (How many students are there?)
        - <span lang='it'>Quante persone vengono?</span> (How many people are coming?)

        ---

        ### <span lang='it'>Errori comuni</span>

        **1.** <span lang='it'>Non cambiare 'quanto' — errore frequente!</span>

        - ❌ <span lang='it'>Quanto sorelle hai?</span>
        - ✅ <span lang='it'>Quante sorelle hai?</span>

        - ❌ <span lang='it'>Quanto acqua vuoi?</span>
        - ✅ <span lang='it'>Quanta acqua vuoi?</span>

        **2.** <span lang='it'>Usare 'che' al posto di 'quanto' quando si chiede una quantità:</span>

        - ❌ <span lang='it'>Che anni hai?</span>
        - ✅ <span lang='it'>Quanti anni hai?</span>

        ---

        ### <span lang='it'>Nota: 'che' come esclamativo</span>

        <span lang='it'>'Che' si usa anche nelle frasi esclamative (exclamatory sentences), ma in questo corso si studia solo il suo uso interrogativo.</span>

        - <span lang='it'>Che bello!</span> (How beautiful! — uso esclamativo)
        - <span lang='it'>Che film guardi?</span> (What film are you watching? — uso interrogativo)

        ---

        ### <span lang='it'>Riepilogo rapido</span>

        | | <span lang='it'>invariabile?</span> | <span lang='it'>Significato</span> |
        |---|---|---|
        | <span lang='it'>**che**</span> | ✅ <span lang='it'>sì</span> | <span lang='it'>che tipo di...</span> (what kind of) |
        | <span lang='it'>**quanto/a/i/e**</span> | ❌ <span lang='it'>no</span> | <span lang='it'>quanta quantità / quanti...</span> (how much / how many) |
      language: it
      why_this_matters: <span lang='it'>Queste parole servono per fare domande molto
        comuni nella vita di tutti i giorni, come chiedere che cosa vuole qualcuno
        o quante persone vengono a una festa. Senza queste forme, non puoi chiedere
        informazioni importanti sulle cose e sulle persone.</span>
  source_url: https://www.unistrapg.it/profilo_lingua_italiana/site/gram_aggettivi_a1.html

- code: indef_poco
  cefr_level: A1
  category: aggettivi
  subcategory: indefiniti
  unistr_code: aggettivi_indefiniti_poco_molto_tanto
  unistr_label: 'Aggettivi indefiniti: poco, molto, tanto'
  label: Aggettivo indefinito poco, molto, tanto
  description: Poco, molto, and tanto are adjectives meaning 'little/few', 'much/many',
    and 'so much/so many'. They agree in gender and number with their noun.
  examples:
  - <span lang='it'>Ho poco tempo oggi.</span>
  - <span lang='it'>C'è molta gente in piazza.</span>
  - <span lang='it'>Ho tanti amici a scuola.</span>
  - <span lang='it'>Bevo poca acqua di solito.</span>
  - <span lang='it'>Abbiamo molti compiti da fare.</span>
  - <span lang='it'>Ho tanta fame adesso!</span>
  chunk_ref: book_6_l_aggettivo_aggettivi_indefiniti
  prerequisites:
  - noun_o_a_e
  explanations:
    en:
      title: 'Indefinite adjectives: poco, molto, tanto'
      tip: The adjectives poco, molto, and tanto tell you how much or how many of
        something there is. They must agree in gender and number with the noun they
        describe, just like regular adjectives.
      explanation: |-
        ## The rule: what these adjectives mean

        The adjectives <span lang="it">poco</span>, <span lang="it">molto</span>, and <span lang="it">tanto</span> are called <span lang="it">aggettivi indefiniti</span> (indefinite adjectives). They go directly before a noun and express a vague, non-exact idea of quantity or degree:

        - <span lang="it">poco</span> — little, few, not much, not many
        - <span lang="it">molto</span> — much, many, a lot of
        - <span lang="it">tanto</span> — so much, so many; (without a correlating word) also equivalent to <span lang="it">molto</span> (a lot of)

        ## Formation: agreement with the noun

        All three adjectives follow the standard four-form pattern of Italian adjectives ending in <span lang="it">-o</span>. They must agree with the gender (masculine/feminine) and number (singular/plural) of the noun they modify.

        | | Masculine singular | Feminine singular | Masculine plural | Feminine plural |
        |---|---|---|---|---|
        | | poco | poca | pochi | poche |
        | | molto | molta | molti | molte |
        | | tanto | tanta | tanti | tante |

        Notice that the masculine plural forms of <span lang="it">poco</span> are <span lang="it">pochi</span> / <span lang="it">poche</span> — the <span lang="it">-h-</span> is added to keep the hard <span lang="it">c</span> sound, exactly as with adjectives like <span lang="it">bianco → bianchi</span>.

        ## Position: always before the noun

        As indefinite adjectives, <span lang="it">poco</span>, <span lang="it">molto</span>, and <span lang="it">tanto</span> must come directly before the noun they modify. Placing them after the noun changes their function or makes the sentence ungrammatical in this context.

        ## A note on tanto

        According to Italian grammar, <span lang="it">tanto</span> has a specific meaning of 'so much / so many' when it is used in a correlation with <span lang="it">che</span> (that) or <span lang="it">quanto</span> (as): for example, <span lang="it">Ha tanti amici che non li ricorda tutti</span> (He has so many friends that he cannot remember them all). Without this correlation, <span lang="it">tanto</span> is simply equivalent to <span lang="it">molto</span> and means 'a lot of'. At A1 level, you will mostly encounter <span lang="it">tanto</span> in this second, simpler sense.

        ## Examples

        <span lang="it">Ho poca acqua.</span> (I have little water.) — feminine singular noun, feminine singular form <span lang="it">poca</span>.

        <span lang="it">Ci sono pochi studenti in classe oggi.</span> (There are few students in class today.) — masculine plural noun, masculine plural form <span lang="it">pochi</span>.

        <span lang="it">Mia madre ha molta pazienza.</span> (My mother has a lot of patience.) — feminine singular noun, feminine singular form <span lang="it">molta</span>.

        <span lang="it">Marco ha molti libri.</span> (Marco has many books.) — masculine plural noun, masculine plural form <span lang="it">molti</span>.

        <span lang="it">Ho tanto tempo libero.</span> (I have a lot of free time.) — masculine singular noun, masculine singular form <span lang="it">tanto</span>; here <span lang="it">tanto</span> simply means 'a lot of'.

        <span lang="it">Giorgio ha tanti soldi che non sa cosa farci.</span> (Giorgio has so much money that he does not know what to do with it.) — edge case: <span lang="it">tanto</span> in correlation with <span lang="it">che</span>, meaning 'so many'.

        ## Common learner mistakes

        **Mistake 1 — not agreeing the adjective with the noun:**
        Incorrect: <span lang="it">*Ho molto amiche.</span>
        Correct: <span lang="it">Ho molte amiche.</span> (I have many friends [female].)
        The noun <span lang="it">amiche</span> is feminine plural, so the adjective must also be feminine plural: <span lang="it">molte</span>, not <span lang="it">molto</span>.

        **Mistake 2 — forgetting the <span lang="it">-h-</span> in the plural of <span lang="it">poco</span>:**
        Incorrect: <span lang="it">*poci studenti</span> or <span lang="it">*poce ragazze</span>
        Correct: <span lang="it">pochi studenti</span> (few students), <span lang="it">poche ragazze</span> (few girls).
        The <span lang="it">-h-</span> preserves the hard <span lang="it">c</span> sound before <span lang="it">-i</span> and <span lang="it">-e</span>.

        **Mistake 3 — using <span lang="it">molto</span> as an adverb but keeping adjective agreement rules confused:**
        Note that <span lang="it">molto</span>, <span lang="it">poco</span>, and <span lang="it">tanto</span> can also work as adverbs modifying a verb or another adjective (e.g. <span lang="it">Mangio molto</span> — I eat a lot). When used as adverbs, they do not change form. This entry covers only their use as adjectives before a noun, where agreement is required.

        **Mistake 4 — placing the adjective after the noun:**
        Incorrect: <span lang="it">*Ho tempo molto.</span>
        Correct: <span lang="it">Ho molto tempo.</span> (I have a lot of time.) As indefinite adjectives, these words must precede the noun.
      language: en
      why_this_matters: These three words appear in almost every Italian conversation
        — you need them to say things like 'a little water', 'many friends', or 'so
        much time'. Without them, you cannot talk about quantities in everyday situations
        such as ordering food, describing your family, or explaining your daily routine.
        Getting their forms right also builds the habit of adjective agreement, which
        is one of the most important skills in Italian grammar.
    it:
      title: 'Poco, molto, tanto: aggettivi di quantità'
      tip: Gli aggettivi <span lang='it'>poco</span>, <span lang='it'>molto</span>
        e <span lang='it'>tanto</span> indicano una quantità. Cambiano forma secondo
        il genere (maschile/femminile) e il numero (singolare/plurale) del nome che
        accompagnano.
      explanation: |-
        ## <span lang='it'>Poco, molto, tanto</span>: aggettivi indefiniti di quantità

        ### Regola generale

        <span lang='it'>Poco</span> (little/few), <span lang='it'>molto</span> (much/many/a lot of) e <span lang='it'>tanto</span> (so much/so many) sono **aggettivi indefiniti** (indefinite adjectives). Vengono usati davanti a un nome per indicare una quantità non precisa. Come tutti gli aggettivi italiani, **concordano** (agree) in genere e numero con il nome.

        ---

        ### Forme

        | | Maschile singolare | Maschile plurale | Femminile singolare | Femminile plurale |
        |---|---|---|---|---|
        | | <span lang='it'>poco</span> | <span lang='it'>pochi</span> | <span lang='it'>poca</span> | <span lang='it'>poche</span> |
        | | <span lang='it'>molto</span> | <span lang='it'>molti</span> | <span lang='it'>molta</span> | <span lang='it'>molte</span> |
        | | <span lang='it'>tanto</span> | <span lang='it'>tanti</span> | <span lang='it'>tanta</span> | <span lang='it'>tante</span> |

        > **Attenzione:** <span lang='it'>poco → pochi / poca → poche</span>. Il plurale maschile finisce in **-chi** (non *-ci*) per mantenere il suono /k/.

        ---

        ### Formazione

        L'aggettivo si mette **prima del nome**:

        - <span lang='it'>poco + nome maschile singolare</span> → <span lang='it'>poco zucchero</span> (little sugar)
        - <span lang='it'>pochi + nome maschile plurale</span> → <span lang='it'>pochi amici</span> (few friends)
        - <span lang='it'>poca + nome femminile singolare</span> → <span lang='it'>poca acqua</span> (little water)
        - <span lang='it'>poche + nome femminile plurale</span> → <span lang='it'>poche persone</span> (few people)

        Lo stesso schema si applica a <span lang='it'>molto</span> e <span lang='it'>tanto</span>.

        ---

        ### Esempi

        1. <span lang='it'>Ho poco tempo oggi.</span> (I have little time today.)
        2. <span lang='it'>C'è molta gente in piazza.</span> (There are many people in the square.)
        3. <span lang='it'>Abbiamo tanti compiti da fare.</span> (We have so much homework to do.)
        4. <span lang='it'>Bevo poca acqua di solito.</span> (I usually drink little water.)
        5. <span lang='it'>Conosco molte ragazze simpatiche.</span> (I know many nice girls.)
        6. <span lang='it'>Ho tanta fame adesso!</span> (I am so hungry right now!)

        ---

        ### Eccezioni e varianti importanti

        **<span lang='it'>Un po' di</span>**: nella lingua parlata, al posto di <span lang='it'>poco/poca</span> si usa spesso <span lang='it'>un po' di</span> + nome (invariabile):
        - <span lang='it'>Voglio un po' di latte.</span> (I want a little milk.)
        - <span lang='it'>Mangio un po' di pane.</span> (I eat a little bread.)

        **Uso avverbiale**: <span lang='it'>molto</span>, <span lang='it'>poco</span> e <span lang='it'>tanto</span> possono anche funzionare come avverbi (adverbs), quando modificano un verbo o un aggettivo. In questo caso **non cambiano forma**:
        - <span lang='it'>Mangio molto.</span> (I eat a lot.) — avverbio, invariabile
        - <span lang='it'>Sono molto stanca.</span> (I am very tired.) — avverbio, invariabile

        Questo punto grammaticale riguarda solo l'uso come **aggettivi** davanti a un nome.

        ---

        ### Errori comuni

        | Errore | Correzione | Spiegazione |
        |---|---|---|---|
        | <span lang='it'>*molti acqua*</span> | <span lang='it'>molta acqua</span> | <span lang='it'>acqua</span> è femminile singolare |
        | <span lang='it'>*pocis amici*</span> | <span lang='it'>pochi amici</span> | il plurale maschile di <span lang='it'>poco</span> è <span lang='it'>pochi</span> |
        | <span lang='it'>*poche ragazzi*</span> | <span lang='it'>pochi ragazzi</span> | <span lang='it'>ragazzi</span> è maschile plurale |
        | <span lang='it'>*tanto libri*</span> | <span lang='it'>tanti libri</span> | <span lang='it'>libri</span> è maschile plurale |

        ---

        ### Schema rapido

        | Nome | Genere/Numero | Aggettivo corretto |
        |---|---|---|
        | <span lang='it'>caffè</span> | m. sing. | <span lang='it'>poco / molto / tanto caffè</span> |
        | <span lang='it'>amici</span> | m. plur. | <span lang='it'>pochi / molti / tanti amici</span> |
        | <span lang='it'>acqua</span> | f. sing. | <span lang='it'>poca / molta / tanta acqua</span> |
        | <span lang='it'>ragazze</span> | f. plur. | <span lang='it'>poche / molte / tante ragazze</span> |
      language: it
      why_this_matters: Questi aggettivi si usano ogni giorno per parlare di cibo,
        tempo, persone e cose. Senza di loro non puoi dire quante cose hai o quanto
        di qualcosa vuoi.
  source_url: https://www.unistrapg.it/profilo_lingua_italiana/site/gram_aggettivi_a1.html

- code: card_1_100
  cefr_level: A1
  category: aggettivi
  subcategory: numerali cardinali
  unistr_code: aggettivi_numerali_cardinali_da_1_a_100
  unistr_label: 'Aggettivi numerali cardinali: da 1 a 100'
  label: Aggettivi numerali cardinali da uno a cento
  description: Cardinal numbers from 1 to 100 used to count, express quantities, ages,
    prices, and more.
  examples:
  - <span lang='it'>Ho due fratelli e una sorella.</span>
  - <span lang='it'>Il treno parte alle undici e venti.</span>
  - <span lang='it'>Questa borsa costa cinquantacinque euro.</span>
  - <span lang='it'>Mia nonna ha settantadue anni.</span>
  - <span lang='it'>Ci sono trenta studenti in classe.</span>
  - <span lang='it'>Vivo al terzo piano, numero cento.</span>
  chunk_ref: book_6_l_aggettivo_aggettivi_numerali
  prerequisites:
  - noun_o_a_e
  explanations:
    en:
      title: 'Cardinal numbers: one to one hundred'
      tip: Cardinal numbers in Italian almost never change form — only 'uno' (one)
        has a feminine form, 'una'. All other cardinal numbers stay the same regardless
        of the gender or number of the noun they describe.
      explanation: |-
        ## What cardinal numbers are

        <span lang="it">I numerali cardinali</span> (cardinal numbers) are the ordinary counting numbers: <span lang="it">uno, due, tre...</span> They answer the question 'how many?' They can be used before a noun like an adjective, or on their own as a number.

        ## The core rule: cardinal numbers are invariable

        With one important exception, all Italian cardinal numbers are **invariable** — they do not change for grammatical gender (masculine/feminine) or number (singular/plural). The same form is used with masculine and feminine nouns alike.

        > <span lang="it">diciotto ragazzi</span> — eighteen boys
        > <span lang="it">diciotto ragazze</span> — eighteen girls

        The number stays <span lang="it">diciotto</span> in both cases.

        ## The one exception: uno / una

        <span lang="it">Uno</span> (one) has a feminine form <span lang="it">una</span>. Use <span lang="it">uno</span> before masculine nouns and <span lang="it">una</span> before feminine nouns.

        > <span lang="it">un fratello</span> — one brother (masculine)
        > <span lang="it">una sorella</span> — one sister (feminine)

        Note: before a masculine noun beginning with a vowel or <span lang="it">z</span>, the form is <span lang="it">uno</span>: <span lang="it">uno zaino</span> (one backpack), <span lang="it">uno studente</span> (one student). Before a feminine noun beginning with a vowel, <span lang="it">una</span> shortens to <span lang="it">un'</span>: <span lang="it">un'amica</span> (one friend, female).

        ## The numbers from 1 to 100

        | Numeral | Italian | | Numeral | Italian |
        |---|---|---|---|---|
        | 1 | uno / una | | 11 | undici |
        | 2 | due | | 12 | dodici |
        | 3 | tre | | 13 | tredici |
        | 4 | quattro | | 14 | quattordici |
        | 5 | cinque | | 15 | quindici |
        | 6 | sei | | 16 | sedici |
        | 7 | sette | | 17 | diciassette |
        | 8 | otto | | 18 | diciotto |
        | 9 | nove | | 19 | diciannove |
        | 10 | dieci | | 20 | venti |

        | Numeral | Italian | | Numeral | Italian |
        |---|---|---|---|---|
        | 20 | venti | | 60 | sessanta |
        | 30 | trenta | | 70 | settanta |
        | 40 | quaranta | | 80 | ottanta |
        | 50 | cinquanta | | 90 | novanta |
        | 100 | cento | | | |

        ## How compound numbers (21–99) are formed

        Compound numbers are built by joining the tens form and the units form into a single word.

        **Key spelling rules for compounds:**

        1. When the units digit is <span lang="it">uno</span> or <span lang="it">otto</span>, drop the final vowel of the tens word before adding the units: <span lang="it">venti + uno → ventuno</span>, <span lang="it">venti + otto → ventotto</span>, <span lang="it">trenta + uno → trentuno</span>, <span lang="it">trenta + otto → trentotto</span>, and so on through all the tens.

        2. In all other cases, simply join the two parts with no change: <span lang="it">venti + due → ventidue</span>, <span lang="it">trenta + tre → trentatré</span> (note the written accent on <span lang="it">tré</span> when it ends a compound number).

        3. The feminine rule for <span lang="it">uno</span> carries through to compounds: <span lang="it">ventuno studenti</span> (masculine), <span lang="it">ventuna studentesse</span> (feminine).

        ### Selected compound examples

        | Numeral | Italian |
        |---|---|
        | 21 | ventuno |
        | 22 | ventidue |
        | 23 | ventitrè |
        | 28 | ventotto |
        | 31 | trentuno |
        | 33 | trentatré |
        | 38 | trentotto |
        | 44 | quarantaquattro |
        | 55 | cinquantacinque |
        | 68 | sessantotto |
        | 81 | ottantuno |
        | 99 | novantanove |

        ## Examples in context

        1. <span lang="it">Ho due fratelli e una sorella.</span> — I have two brothers and one sister.
        *(<span lang="it">due</span> is invariable; <span lang="it">una</span> is feminine because <span lang="it">sorella</span> is feminine.)*

        2. <span lang="it">La classe ha ventidue studenti.</span> — The class has twenty-two students.
        *(<span lang="it">ventidue</span> does not change.)*

        3. <span lang="it">Ho trentun anni.</span> — I am thirty-one years old.
        *(<span lang="it">trentuno</span> drops the final <span lang="it">-o</span> before a noun beginning with a consonant; the full form <span lang="it">trentuno</span> is also widely accepted.)*

        4. <span lang="it">Il negozio apre alle otto.</span> — The shop opens at eight.
        *(Used on its own without a noun — cardinal numbers work independently too.)*

        5. <span lang="it">Ci sono cinquanta ragazzi e cinquanta ragazze.</span> — There are fifty boys and fifty girls.
        *(Contrastive pair: the same form <span lang="it">cinquanta</span> is used with both masculine and feminine nouns.)*

        6. <span lang="it">Ventotto studentesse sono in aula.</span> — Twenty-eight female students are in the classroom.
        *(<span lang="it">Ventotto</span> — the tens vowel is dropped before <span lang="it">otto</span> — and the number is still invariable despite the feminine noun.)*

        ## Common learner mistakes

        **Mistake 1 — Changing the number to match gender:**
        <span lang="it">*due fratelli / *duei fratelli / *due sorelle → duE sorelle</span> — wrong; the correct form is just <span lang="it">due sorelle</span>. Only <span lang="it">uno/una</span> changes.

        **Mistake 2 — Forgetting the feminine of uno:**
        <span lang="it">*Ho uno sorella.</span> — incorrect. Correct: <span lang="it">Ho una sorella.</span> Always use <span lang="it">una</span> (or <span lang="it">un'</span> before a vowel) with feminine nouns.

        **Mistake 3 — Not dropping the vowel before uno or otto in compounds:**
        <span lang="it">*ventiuno, *ventiotto</span> — incorrect spellings. Correct: <span lang="it">ventuno, ventotto</span>.

        **Mistake 4 — Forgetting the accent on trè in compounds:**
        <span lang="it">*ventitre</span> — missing accent. Correct written form: <span lang="it">ventitrè</span>.

        **Mistake 5 — Writing numbers as digits in ordinary prose:**
        In normal written Italian, numbers are preferred in full letters except for dates, technical contexts, and proper names: write <span lang="it">ventidue alunni</span>, not <span lang="it">22 alunni</span>, in a standard sentence.
      language: en
      why_this_matters: Numbers are everywhere in Italian — telling the time, shopping,
        giving your age, counting people in a family. Without cardinal numbers you
        cannot handle the most basic everyday transactions. Because Italian numbers
        work differently from English in a few important ways (especially the single
        irregular form <span lang="it">uno/una</span>), learning the rule precisely
        now will save you from a persistent error that appears even at advanced levels.
    it:
      title: I numeri cardinali da uno a cento
      tip: 'I numeri cardinali sono invariabili: non cambiano mai in base al genere
        o al numero del sostantivo. L''unica eccezione è <span lang=''it''>uno</span>,
        che si comporta come l''articolo indeterminativo. Impara prima i numeri base,
        poi le regole di combinazione — sono poche e regolari.'
      explanation: |-
        ## I numeri cardinali (cardinal numbers) da 1 a 100

        ### Regola generale

        I numeri cardinali in italiano sono **invariabili**: non hanno forma femminile o plurale diversa. Si usano davanti a qualsiasi sostantivo senza cambiare.

        > <span lang='it'>due ragazzi / due ragazze</span> — two boys / two girls

        L'unica eccezione importante è **uno / una**, che segue le stesse regole dell'articolo indeterminativo.

        ---

        ### Tabella dei numeri base

        | Numero | Italiano |
        |--------|----------|
        | 1 | <span lang='it'>uno / una</span> |
        | 2 | <span lang='it'>due</span> |
        | 3 | <span lang='it'>tre</span> |
        | 4 | <span lang='it'>quattro</span> |
        | 5 | <span lang='it'>cinque</span> |
        | 6 | <span lang='it'>sei</span> |
        | 7 | <span lang='it'>sette</span> |
        | 8 | <span lang='it'>otto</span> |
        | 9 | <span lang='it'>nove</span> |
        | 10 | <span lang='it'>dieci</span> |
        | 11 | <span lang='it'>undici</span> |
        | 12 | <span lang='it'>dodici</span> |
        | 13 | <span lang='it'>tredici</span> |
        | 14 | <span lang='it'>quattordici</span> |
        | 15 | <span lang='it'>quindici</span> |
        | 16 | <span lang='it'>sedici</span> |
        | 17 | <span lang='it'>diciassette</span> |
        | 18 | <span lang='it'>diciotto</span> |
        | 19 | <span lang='it'>diciannove</span> |
        | 20 | <span lang='it'>venti</span> |
        | 30 | <span lang='it'>trenta</span> |
        | 40 | <span lang='it'>quaranta</span> |
        | 50 | <span lang='it'>cinquanta</span> |
        | 60 | <span lang='it'>sessanta</span> |
        | 70 | <span lang='it'>settanta</span> |
        | 80 | <span lang='it'>ottanta</span> |
        | 90 | <span lang='it'>novanta</span> |
        | 100 | <span lang='it'>cento</span> |

        ---

        ### Come si formano i numeri composti (21–99)

        I numeri da 21 a 99 si formano combinando le decine con le unità. Ci sono due regole fonetiche da ricordare:

        **Regola 1:** Le decine da 20 in poi perdono la vocale finale davanti a <span lang='it'>uno</span> e <span lang='it'>otto</span>.

        | Forma base | + uno | + otto |
        |---|---|---|
        | <span lang='it'>venti</span> | <span lang='it'>ventuno</span> | <span lang='it'>ventotto</span> |
        | <span lang='it'>trenta</span> | <span lang='it'>trentuno</span> | <span lang='it'>trentotto</span> |
        | <span lang='it'>quaranta</span> | <span lang='it'>quarantuno</span> | <span lang='it'>quarantotto</span> |
        | <span lang='it'>cinquanta</span> | <span lang='it'>cinquantuno</span> | <span lang='it'>cinquantotto</span> |
        | <span lang='it'>sessanta</span> | <span lang='it'>sessantuno</span> | <span lang='it'>sessantotto</span> |
        | <span lang='it'>settanta</span> | <span lang='it'>settantuno</span> | <span lang='it'>settantotto</span> |
        | <span lang='it'>ottanta</span> | <span lang='it'>ottantuno</span> | <span lang='it'>ottantotto</span> |
        | <span lang='it'>novanta</span> | <span lang='it'>novantuno</span> | <span lang='it'>novantotto</span> |

        **Regola 2:** Tutti gli altri numeri composti si scrivono uniti, senza spazi né trattini.

        - <span lang='it'>ventidue, ventitré, ventiquattro, venticinque, ventisei, ventisette, ventinove</span>
        - <span lang='it'>trentatré, quarantasei, settantanove</span>...

        **Attenzione:** <span lang='it'>tre</span> diventa <span lang='it'>-tré</span> con l'accento quando è alla fine di un numero composto:
        - <span lang='it'>tre</span> → <span lang='it'>ventitré, trentatré, quarantatré</span>...

        ---

        ### L'eccezione: uno / una

        <span lang='it'>Uno</span> cambia forma davanti ai sostantivi esattamente come l'articolo indeterminativo:

        | Contesto | Forma | Esempio |
        |---|---|---|
        | davanti a consonante (m.) | <span lang='it'>un</span> | <span lang='it'>un libro</span> (one book) |
        | davanti a vocale (m.) | <span lang='it'>un</span> | <span lang='it'>un amico</span> (one friend) |
        | davanti a s+cons., z, ps... (m.) | <span lang='it'>uno</span> | <span lang='it'>uno studente</span> (one student) |
        | femminile (consonante) | <span lang='it'>una</span> | <span lang='it'>una casa</span> (one house) |
        | femminile (vocale) | <span lang='it'>un'</span> | <span lang='it'>un'amica</span> (one friend, f.) |

        Negli altri numeri composti con <span lang='it'>-uno</span>, la stessa regola si applica:
        - <span lang='it'>Ho ventun anni.</span> (I am twenty-one years old.) — si omette spesso la variazione nell'uso comune
        - <span lang='it'>Ho comprato ventuno mele.</span> (I bought twenty-one apples.)

        ---

        ### Esempi di uso

        1. <span lang='it'>Ho tre gatti.</span> (I have three cats.)
        2. <span lang='it'>Il treno parte alle diciotto e quarantacinque.</span> (The train leaves at 18:45.)
        3. <span lang='it'>Questa maglietta costa dodici euro.</span> (This T-shirt costs twelve euros.)
        4. <span lang='it'>Mio padre ha cinquantasei anni.</span> (My father is fifty-six years old.)
        5. <span lang='it'>Ci sono novantanove problemi.</span> (There are ninety-nine problems.)
        6. <span lang='it'>Abito al numero trentadue.</span> (I live at number thirty-two.)

        ---

        ### Errori comuni

        **Errore 1:** Aggiungere uno spazio nei numeri composti.
        - ❌ <span lang='it'>venti due</span>
        - ✅ <span lang='it'>ventidue</span>

        **Errore 2:** Dimenticare l'elisione della vocale finale davanti a <span lang='it'>uno</span> e <span lang='it'>otto</span>.
        - ❌ <span lang='it'>ventiootto</span>
        - ✅ <span lang='it'>ventotto</span>

        **Errore 3:** Dimenticare l'accento su <span lang='it'>-tré</span> nei composti.
        - ❌ <span lang='it'>ventitré → ventitre</span> (senza accento)
        - ✅ <span lang='it'>ventitré</span>

        **Errore 4:** Usare <span lang='it'>uno</span> invece di <span lang='it'>un</span> davanti a sostantivo maschile normale.
        - ❌ <span lang='it'>uno libro</span>
        - ✅ <span lang='it'>un libro</span>

        ---

        ### Nota su <span lang='it'>cento</span>

        <span lang='it'>Cento</span> è invariabile e non prende l'articolo indeterminativo:
        - ✅ <span lang='it'>cento persone</span> (one hundred people)
        - ❌ <span lang='it'>un cento persone</span>
      language: it
      why_this_matters: 'I numeri servono ogni giorno: per dire l''età, il prezzo,
        l''ora, il numero di telefono e molto altro. Senza di loro non puoi fare una
        spesa, prenotare un tavolo o capire un orario.'
  source_url: https://www.unistrapg.it/profilo_lingua_italiana/site/gram_aggettivi_a1.html

- code: ord_primo
  cefr_level: A1
  category: aggettivi
  subcategory: ordinali
  unistr_code: aggettivi_numerali_ordinali_da_primo_a_decimo_nota_principalmente_prima
  unistr_label: 'Aggettivi numerali ordinali da primo a decimo Nota: principalmente
    prima singolare con i nomi di famiglia'
  label: Aggettivi numerali ordinali da primo a decimo
  description: Ordinal adjectives (first–tenth) indicate position in a sequence. They
    agree in gender and number with the noun they modify.
  examples:
  - <span lang='it'>Abito al terzo piano.</span>
  - <span lang='it'>È il primo giorno di scuola.</span>
  - <span lang='it'>La seconda porta a destra è il bagno.</span>
  - <span lang='it'>Oggi è il quinto mese dell'anno.</span>
  - <span lang='it'>Siamo arrivati quarti nella gara.</span>
  - <span lang='it'>La decima lezione è molto difficile.</span>
  chunk_ref: book_6_l_aggettivo_aggettivi_numerali
  prerequisites:
  - card_1_100
  explanations:
    en:
      title: 'Ordinal numbers: primo to decimo'
      tip: Ordinal numbers (first, second, third…) tell you the position of something
        in a sequence. Unlike most cardinal numbers, they change their ending to match
        the noun they describe — just like regular adjectives.
      explanation: |-
        ## The rule: what ordinal numbers are

        Ordinal numbers — called <span lang="it">numerali ordinali</span> (ordinal numerals) in Italian — answer the question 'which one in a series?' They correspond to English 'first', 'second', 'third', and so on. In Italian, they are adjectives, so they must agree in gender (masculine/feminine) and number (singular/plural) with the noun they modify. This is different from cardinal numbers like <span lang="it">due</span> or <span lang="it">tre</span>, which never change their form.

        ## The ten forms: primo to decimo

        Here are the ten ordinals with their four possible endings. The masculine singular form is the base form you should memorise first.

        | Cardinal | Masc. sg. | Fem. sg. | Masc. pl. | Fem. pl. | English |
        |---|---|---|---|---|---|
        | uno | primo | prima | primi | prime | first |
        | due | secondo | seconda | secondi | seconde | second |
        | tre | terzo | terza | terzi | terze | third |
        | quattro | quarto | quarta | quarti | quarte | fourth |
        | cinque | quinto | quinta | quinti | quinte | fifth |
        | sei | sesto | sesta | sesti | seste | sixth |
        | sette | settimo | settima | settimi | settime | seventh |
        | otto | ottavo | ottava | ottavi | ottave | eighth |
        | nove | nono | nona | noni | none | ninth |
        | dieci | decimo | decima | decimi | decime | tenth |

        ## How agreement works

        Treat ordinal numbers exactly like a regular adjective ending in <span lang="it">-o</span> (like <span lang="it">rosso</span>, red). Choose the ending that matches the noun:

        - masculine singular → <span lang="it">-o</span> (e.g. <span lang="it">il primo giorno</span>, the first day)
        - feminine singular → <span lang="it">-a</span> (e.g. <span lang="it">la prima lezione</span>, the first lesson)
        - masculine plural → <span lang="it">-i</span> (e.g. <span lang="it">i primi giorni</span>, the first days)
        - feminine plural → <span lang="it">-e</span> (e.g. <span lang="it">le prime lezioni</span>, the first lessons)

        ## Examples

        <span lang="it">Abito al terzo piano.</span> (I live on the third floor.) — masculine singular, agreeing with <span lang="it">piano</span> (floor, masc.).

        <span lang="it">Oggi è la mia prima lezione di italiano.</span> (Today is my first Italian lesson.) — feminine singular, agreeing with <span lang="it">lezione</span> (lesson, fem.).

        <span lang="it">Marco arriva secondo e Luca arriva quinto.</span> (Marco comes second and Luca comes fifth.) — both masculine singular, used without a noun after a verb.

        <span lang="it">La quinta porta a sinistra è la cucina.</span> (The fifth door on the left is the kitchen.) — feminine singular, agreeing with <span lang="it">porta</span> (door, fem.).

        <span lang="it">I primi giorni di scuola sono difficili.</span> (The first days of school are difficult.) — masculine plural, agreeing with <span lang="it">giorni</span> (days, masc.).

        Contrastive pair — ordinal vs. cardinal: <span lang="it">Ho due sorelle</span> (I have two sisters) uses the invariable cardinal <span lang="it">due</span>. But <span lang="it">la mia seconda sorella</span> (my second sister) uses the ordinal <span lang="it">seconda</span>, which agrees with the feminine noun <span lang="it">sorella</span>.

        ## Position in the sentence

        Ordinal numbers almost always come before the noun, just like in English: <span lang="it">il primo caffè della mattina</span> (the first coffee of the morning). They can also follow a verb directly — <span lang="it">sono arrivato terzo</span> (I arrived third) — where they still agree with the subject.

        ## Writing ordinals: words vs. symbols

        In normal writing, Italian prefers the word form: <span lang="it">il terzo capitolo</span> (the third chapter) is preferred over <span lang="it">il 3° capitolo</span>. Roman numerals (<span lang="it">I, II, III, IV</span>…) are used for popes, kings, and centuries: <span lang="it">Giovanni Paolo II</span>, <span lang="it">il XX secolo</span>. At A1 level, simply focus on knowing and using the word form.

        ## Common learner mistakes

        **Mistake 1 — treating ordinals as invariable like cardinals:** Learners sometimes write <span lang="it">*la primo lezione*</span> by analogy with cardinals, which never change. Correction: ordinals always agree, so the correct form is <span lang="it">la prima lezione</span>.

        **Mistake 2 — using a cardinal where an ordinal is needed:** Saying <span lang="it">*abito al tre piano*</span> (using the cardinal <span lang="it">tre</span>) instead of <span lang="it">abito al terzo piano</span> (using the ordinal <span lang="it">terzo</span>) is a very common error, especially for floors of a building and numbered sequences.

        **Mistake 3 — wrong ending on a feminine noun:** Writing <span lang="it">*la quinto strada*</span> instead of <span lang="it">la quinta strada</span> (the fifth street). Always check the gender of the noun and choose the matching <span lang="it">-o / -a / -i / -e</span> ending.

        **Mistake 4 — forgetting the article:** In Italian, ordinal numbers used with a noun almost always require the definite article: <span lang="it">il primo giorno</span>, not <span lang="it">*primo giorno*</span> (unless in a title or heading). This is different from English, which sometimes drops 'the' ('first day of school').
      language: en
      why_this_matters: Ordinal numbers come up constantly in everyday Italian — telling
        someone you live on the third floor, talking about the first day of school,
        or describing the second street on the left. Without them, you cannot place
        things in order or talk about sequences, rankings, or positions. Mastering
        these ten forms also gives you the pattern you need to build every higher
        ordinal number later.
    it:
      title: Gli aggettivi ordinali da primo a decimo
      tip: 'Gli aggettivi ordinali indicano la posizione di qualcosa in una serie:
        primo, secondo, terzo… Come tutti gli aggettivi, si accordano in genere e
        numero con il nome a cui si riferiscono. Di solito si usano con l''articolo
        determinativo.'
      explanation: |-
        ## Gli aggettivi ordinali da <span lang='it'>primo</span> a <span lang='it'>decimo</span>

        ### Che cosa sono?

        Gli aggettivi ordinali (ordinal adjectives) indicano la posizione o il rango di qualcosa in una serie ordinata. In italiano i primi dieci sono forme speciali da imparare a memoria.

        ---

        ### Elenco degli ordinali da 1° a 10°

        | Numero | Maschile singolare | Femminile singolare | Maschile plurale | Femminile plurale |
        |--------|-------------------|--------------------|-----------------|-----------------|
        | 1° | <span lang='it'>primo</span> | <span lang='it'>prima</span> | <span lang='it'>primi</span> | <span lang='it'>prime</span> |
        | 2° | <span lang='it'>secondo</span> | <span lang='it'>seconda</span> | <span lang='it'>secondi</span> | <span lang='it'>seconde</span> |
        | 3° | <span lang='it'>terzo</span> | <span lang='it'>terza</span> | <span lang='it'>terzi</span> | <span lang='it'>terze</span> |
        | 4° | <span lang='it'>quarto</span> | <span lang='it'>quarta</span> | <span lang='it'>quarti</span> | <span lang='it'>quarte</span> |
        | 5° | <span lang='it'>quinto</span> | <span lang='it'>quinta</span> | <span lang='it'>quinti</span> | <span lang='it'>quinte</span> |
        | 6° | <span lang='it'>sesto</span> | <span lang='it'>sesta</span> | <span lang='it'>sesti</span> | <span lang='it'>seste</span> |
        | 7° | <span lang='it'>settimo</span> | <span lang='it'>settima</span> | <span lang='it'>settimi</span> | <span lang='it'>settime</span> |
        | 8° | <span lang='it'>ottavo</span> | <span lang='it'>ottava</span> | <span lang='it'>ottavi</span> | <span lang='it'>ottave</span> |
        | 9° | <span lang='it'>nono</span> | <span lang='it'>nona</span> | <span lang='it'>noni</span> | <span lang='it'>none</span> |
        | 10° | <span lang='it'>decimo</span> | <span lang='it'>decima</span> | <span lang='it'>decimi</span> | <span lang='it'>decime</span> |

        ---

        ### Accordo (agreement)

        Come tutti gli aggettivi qualificativi in italiano, gli ordinali si accordano in **genere** (maschile/femminile) e **numero** (singolare/plurale) con il nome a cui si riferiscono.

        - <span lang='it'>il **primo** giorno</span> (the first day — maschile singolare)
        - <span lang='it'>la **prima** settimana</span> (the first week — femminile singolare)
        - <span lang='it'>i **primi** esercizi</span> (the first exercises — maschile plurale)
        - <span lang='it'>le **prime** pagine</span> (the first pages — femminile plurale)

        ---

        ### Posizione nella frase

        Di solito l'aggettivo ordinale si mette **prima** del nome, preceduto dall'articolo determinativo (the).

        > <span lang='it'>Prendi la **seconda** strada a sinistra.</span> (Take the second street on the left.)

        In alcuni contesti formali o nelle date, l'ordinale può seguire il nome:

        > <span lang='it'>Il capitolo **quinto** è difficile.</span> (Chapter five is difficult.)

        ---

        ### Uso con le date

        In italiano, per indicare il giorno del mese si usa solo <span lang='it'>**primo**</span> (ordinale). Per tutti gli altri giorni si usano i numeri cardinali.

        - <span lang='it'>Oggi è il **primo** marzo.</span> (Today is the first of March.)
        - <span lang='it'>Oggi è il **due** marzo.</span> (Today is the second of March.) ← cardinale, non ordinale

        ---

        ### Esempi con traduzione

        1. <span lang='it'>Abito al **terzo** piano.</span> (I live on the third floor.)
        2. <span lang='it'>È il **primo** giorno di scuola.</span> (It's the first day of school.)
        3. <span lang='it'>La **seconda** porta a destra è il bagno.</span> (The second door on the right is the bathroom.)
        4. <span lang='it'>Siamo arrivati **quarti** nella gara.</span> (We arrived fourth in the race.)
        5. <span lang='it'>La **decima** lezione è molto difficile.</span> (The tenth lesson is very difficult.)
        6. <span lang='it'>Oggi è il **primo** aprile.</span> (Today is the first of April.)

        ---

        ### Errori comuni

        **1. Usare il cardinale invece dell'ordinale**

        ❌ <span lang='it'>Abito al *tre* piano.</span>
        ✅ <span lang='it'>Abito al **terzo** piano.</span>

        Ricorda: per i piani degli edifici e per le posizioni in una serie si usa l'ordinale, non il cardinale.

        **2. Non accordare l'ordinale con il nome**

        ❌ <span lang='it'>La *primo* lezione è facile.</span>
        ✅ <span lang='it'>La **prima** lezione è facile.</span>

        L'ordinale deve avere lo stesso genere e numero del nome.

        **3. Usare l'ordinale per le date (tranne 'primo')**

        ❌ <span lang='it'>Oggi è il *secondo* marzo.</span>
        ✅ <span lang='it'>Oggi è il **due** marzo.</span>

        Solo per il primo giorno del mese si dice <span lang='it'>*primo*</span>; per tutti gli altri giorni si usa il cardinale.
      language: it
      why_this_matters: Gli ordinali sono indispensabili per parlare di piani degli
        edifici, date, capitoli, classifiche e molto altro ancora. Senza di essi non
        puoi dire in modo preciso 'il primo piano' o 'la seconda strada a sinistra',
        espressioni che usi ogni giorno.
  source_url: https://www.unistrapg.it/profilo_lingua_italiana/site/gram_aggettivi_a1.html

