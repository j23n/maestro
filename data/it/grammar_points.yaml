- code: ord_svo
  cefr_level: A1
  category: costruzione_frase
  subcategory: ordine delle parole
  unistr_code: percezione_della_pertinenza_dellordine_non_marcato_svo_dei_costituenti_di_un
  unistr_label: Percezione della pertinenza dell’ordine non marcato (SVO) dei costituenti
    di un enunciato semplice
  label: Ordine non marcato SVO dei costituenti in enunciato semplice
  description: In Italian, the default sentence order is Subject–Verb–Object (SVO),
    just like in English.
  examples:
  - <span lang="it">Marco mangia una pizza.</span>
  - <span lang="it">La bambina beve il latte.</span>
  - <span lang="it">Io ho un gatto.</span>
  - <span lang="it">Mia madre compra il pane ogni giorno.</span>
  - <span lang="it">Il professore spiega la lezione.</span>
  chunk_ref: book_2_la_frase
  prerequisites:
  - sent_affir
  explanations:
    en:
      title: Basic word order in Italian sentences
      tip: Italian sentences usually follow Subject–Verb–Object order, just like English.
        Getting this right from the start means you can build clear, correct sentences
        immediately, even with a very small vocabulary.
      explanation: |-
        ## The basic rule: Subject – Verb – Object (SVO)

        In a simple Italian sentence (<span lang="it">una frase semplice</span>, a sentence with exactly one verb and one complete thought), the default, neutral word order is:

        **Subject → Verb → Object**

        This is called the <span lang="it">ordine non marcato</span> — the 'unmarked order', meaning the plain, neutral arrangement with no special emphasis. It is the order you should use unless you have a specific reason to do otherwise.

        - The **subject** (<span lang="it">il soggetto</span>) is who or what performs the action.
        - The **verb** (<span lang="it">il verbo</span>) expresses the action or state.
        - The **object** (<span lang="it">l'oggetto</span>) is who or what receives the action.

        ## Forming the sentence

        Simply place the three elements in order. There is no inversion or rearrangement needed for a basic statement:

        | Subject | Verb | Object |
        |---|---|---|
        | Marco | mangia | la pizza. |
        | La mamma | beve | il caffè. |
        | I bambini | guardano | la televisione. |

        ## Examples with translations

        <span lang="it">Marco mangia la pizza.</span>
        (Marco eats pizza.) — the classic S–V–O pattern.

        <span lang="it">La mamma beve il caffè.</span>
        (Mum drinks coffee.) — subject is a noun phrase with an article; order is unchanged.

        <span lang="it">Il gatto dorme.</span>
        (The cat sleeps.) — no object needed; a verb can stand alone after the subject when there is nothing to receive the action.

        <span lang="it">Anna studia l'italiano.</span>
        (Anna studies Italian.) — object includes its article; the article travels with the noun but does not change its position.

        <span lang="it">I bambini mangiano il pane.</span>
        (The children eat bread.) — plural subject and plural verb, same S–V–O order.

        <span lang="it">Mio padre legge un libro.</span>
        (My father reads a book.) — subject is a possessive noun phrase; order is still S–V–O.

        ## Important variants and notes

        **The subject pronoun is often dropped**

        Italian is a <span lang="it">lingua pro-drop</span> — a language that drops the subject pronoun when it is clear from the verb ending. This does not change the underlying S–V–O order; it simply removes the spoken subject:

        <span lang="it">Mangio la pasta.</span> (I eat pasta.) — <span lang="it">io</span> (I) is implied by the ending <span lang="it">-o</span>, so it is left out. The verb still comes before the object.

        **Sentences with no object**

        Many Italian verbs — especially verbs of motion or state — need no object at all. The sentence is simply Subject + Verb:

        <span lang="it">Il bambino dorme.</span> (The child is sleeping.)
        <span lang="it">La nonna arriva.</span> (Grandma is arriving.)

        **Adjectives after the noun (a side note)**

        Inside the noun phrases that make up your subject or object, adjectives most commonly follow the noun in Italian — <span lang="it">una pizza buona</span> (a good pizza) rather than before it as in English. This is a separate rule, but it is worth knowing it does not affect S–V–O order.

        **Marked order exists — but not at A1**

        Italian speakers sometimes move the object to the front of the sentence for emphasis or contrast: <span lang="it">La pizza, Marco la mangia volentieri.</span> (Pizza — Marco happily eats it.) This is called <span lang="it">ordine marcato</span> (marked order) and involves extra grammar (a repeated pronoun). You do not need to produce it at A1, but recognising that it exists explains why you will occasionally hear sentences that seem to start with the 'wrong' word.

        ## Common learner mistakes

        **Mistake 1 — Placing the verb at the end (influence from German or Japanese)**

        Some learners put the verb last: <span lang="it">*Marco la pizza mangia.</span> This is not standard Italian. Correction: <span lang="it">Marco mangia la pizza.</span>

        **Mistake 2 — Inverting subject and verb to form questions**

        In English, questions invert subject and verb: 'Does Marco eat pizza?' Learners sometimes copy this: <span lang="it">*Mangia Marco la pizza?</span> In everyday Italian, you can form a yes/no question simply by keeping S–V–O order and using a rising intonation, or by adding <span lang="it">?</span> in writing: <span lang="it">Marco mangia la pizza?</span> (Is Marco eating pizza?) The inversion form does exist in formal or written Italian, but it is not the default at A1.

        **Mistake 3 — Omitting the article on the object**

        Learners sometimes drop the article thinking it affects the word order: <span lang="it">*Marco mangia pizza.</span> The article is a separate rule, but it belongs attached to its noun in the object slot: <span lang="it">Marco mangia la pizza.</span> Order and articles are independent — fix each separately.

        **Mistake 4 — Confusing subject and object because Italian nouns do not change form**

        Unlike Latin or German, Italian nouns do not have case endings to mark subject versus object. Word order does this job. So <span lang="it">Il cane morde l'uomo</span> (The dog bites the man) means something completely different from <span lang="it">L'uomo morde il cane</span> (The man bites the dog). Position in the sentence is the signal: first noun phrase = subject, noun phrase after the verb = object. Never swap them without meaning to change the meaning.
      language: en
      why_this_matters: Word order is the skeleton of every sentence you produce.
        Italian's default order — Subject, then Verb, then Object — matches English
        closely enough that you can transfer this instinct directly, making it one
        of the first things you get right without extra effort. Understanding it explicitly
        also prepares you to notice when Italian speakers deliberately change the
        order for emphasis, which you will encounter very soon after A1.
  source_url: https://www.unistrapg.it/profilo_lingua_italiana/site/gram_costruz_a1.html

- code: omiss_sogg
  cefr_level: A1
  category: costruzione_frase
  subcategory: pronomi soggetto
  unistr_code: consapevolezza_dellomissione_del_soggetto_in_frasi_dichiarative_e_interrogative
  unistr_label: 'Consapevolezza dell’omissione del soggetto in frasi dichiarative
    e interrogative: Sono americano; vai al cinema ?'
  label: Omissione del soggetto in frasi dichiarative e interrogative
  description: In Italian, subject pronouns are usually dropped because the verb ending
    already shows who is acting. They are kept only for emphasis or clarity.
  examples:
  - <span lang='it'>Parlo italiano.</span>
  - <span lang='it'>Sei italiano?</span>
  - <span lang='it'>Abita a Roma con la sua famiglia.</span>
  - <span lang='it'>Studiamo insieme stasera?</span>
  - <span lang='it'>— Chi viene alla festa? — Vengo io!</span>
  - <span lang='it'>Lei lavora in banca, lui lavora a scuola.</span>
  chunk_ref: book_7_il_pronome_pronomi_personali_pronomi_personali_soggetto
  prerequisites:
  - pron_pers
  explanations:
    en:
      title: Dropping or keeping the subject pronoun
      tip: In Italian, you usually leave out the subject pronoun — the verb ending
        already tells you who is acting. Keep the pronoun only when you need to avoid
        confusion, contrast two subjects, or add emphasis.
      explanation: |-
        ## The basic rule: drop the pronoun by default

        Italian is a <span lang="it">lingua pro-drop</span> (a 'subject-dropping language'). Because each verb form has its own ending that identifies the person and number, the pronoun adds no new information and is normally left out.

        Compare English and Italian:

        | English (pronoun required) | Italiano (pronoun optional / usually dropped) |
        |---|---|
        | I speak | (Io) parlo |
        | You eat | (Tu) mangi |
        | He/She works | (Lui/Lei) lavora |
        | We are | (Noi) siamo |
        | You (pl.) have | (Voi) avete |
        | They go | (Loro) vanno |

        The forms in parentheses are grammatically correct but are usually omitted in normal speech and writing.

        ## When you MUST keep the pronoun

        There are three clear situations where the subject pronoun is required or strongly preferred.

        ### 1. Contrasting two different subjects

        When two clauses follow each other with different subjects, the pronoun makes it clear who does what:

        > <span lang="it">Lui va in montagna, io vado al mare.</span>
        > (He is going to the mountains; I am going to the sea.)

        Without <span lang="it">lui</span> and <span lang="it">io</span>, the sentence would be confusing because both verbs could belong to the same person.

        ### 2. Emphasis on who is acting

        When you want to stress that it is a particular person — and not someone else — who performs the action, you keep the pronoun. This is especially common after words like <span lang="it">anche</span> ('also'), <span lang="it">neanche</span> ('not even'), and <span lang="it">pure</span> ('too/also'):

        > <span lang="it">Sei stato tu a dire questo.</span>
        > (It was YOU who said this — not someone else.)

        > <span lang="it">È venuta anche lei.</span>
        > (She came too.)

        ### 3. Avoiding ambiguity

        Some verb forms are identical across different persons. In those cases, dropping the pronoun can make the sentence unclear:

        > <span lang="it">È bene che vada.</span>
        > (It is good that [someone] goes.) — Who? The pronoun is needed to clarify: <span lang="it">È bene che tu vada</span> / <span lang="it">È bene che lui vada</span>, etc.

        ## The subject pronouns: full list and notes on the third person

        The Italian subject pronouns are:

        | Person | Singular | Plural |
        |---|---|---|
        | 1st | io (I) | noi (we) |
        | 2nd | tu (you, informal) | voi (you all) |
        | 3rd masc. | lui / egli / esso (he / it) | loro / essi (they) |
        | 3rd fem. | lei / ella / essa (she / it) | loro / esse (they) |

        **Important note on the third person:** Historically, <span lang="it">egli</span> (he) and <span lang="it">ella</span> (she) were the 'correct' forms for referring to people, while <span lang="it">esso / essa</span> were reserved for animals and things. Today, <span lang="it">egli</span> and <span lang="it">ella</span> are very rare — even in writing — and have been largely replaced by <span lang="it">lui</span> and <span lang="it">lei</span>. At A1 level, use <span lang="it">lui</span> and <span lang="it">lei</span> without hesitation.

        **Rule for obligatory third-person pronouns:** Whenever the situation requires a subject pronoun in the third person (contrast, emphasis, clarity), the only acceptable forms are <span lang="it">lui</span>, <span lang="it">lei</span>, and <span lang="it">loro</span>:

        > <span lang="it">Io sono italiana, lui è francese.</span>
        > (I am Italian; he is French.)

        ## Reinforced pronouns

        Subject pronouns can be strengthened by adding <span lang="it">stesso</span> ('himself/herself/myself', etc.) after any pronoun:

        > <span lang="it">io stesso, tu stesso, lui stesso, lei stessa, noi stessi, voi stessi, loro stessi</span>

        There are also the combined forms <span lang="it">noialtri</span> and <span lang="it">voialtri</span> (written as one word), used regionally or for extra emphasis on 'we' and 'you all' as a group. These are less common and not essential at A1.

        ## Full examples covering main uses

        **Pronoun dropped (normal default):**

        > <span lang="it">Mangio la pizza.</span>
        > (I am eating pizza.) — <span lang="it">Io</span> is omitted; the ending <span lang="it">-o</span> already signals first person singular.

        > <span lang="it">Parli italiano?</span>
        > (Do you speak Italian?) — <span lang="it">Tu</span> is dropped in the question; the <span lang="it">-i</span> ending identifies second person singular.

        **Pronoun kept for contrast:**

        > <span lang="it">Lei beve il caffè, io bevo il tè.</span>
        > (She drinks coffee; I drink tea.) — Two different subjects require the pronouns to be explicit.

        **Pronoun kept for emphasis:**

        > <span lang="it">L'ho fatto io!</span>
        > (I did it! / It was ME who did it!) — <span lang="it">Io</span> placed after the verb for strong emphasis.

        **After <span lang="it">anche</span>:**

        > <span lang="it">Viene anche lui alla festa?</span>
        > (Is he coming to the party too?) — The pronoun is required after <span lang="it">anche</span>.

        **Avoiding ambiguity (contrastive pair):**

        > <span lang="it">Spero che vada bene.</span>
        > (I hope it goes well.) — Here no specific person is implied; the sentence is fine.

        > <span lang="it">È importante che tu vada adesso.</span>
        > (It is important that YOU go now.) — Without <span lang="it">tu</span>, it would be unclear who must go.

        ## Common learner mistakes

        **Mistake 1 — Always copying English and using the pronoun:**
        Learners whose first language requires a subject (e.g. English, French) often write <span lang="it">Io mangio, io bevo, io dormo</span> in every sentence. This is not wrong, but it sounds unnatural and over-emphatic. Drop it unless one of the three conditions above applies.

        **Mistake 2 — Using <span lang="it">egli</span> or <span lang="it">ella</span> in speech:**
        Students who learn from older textbooks may use <span lang="it">egli</span> and <span lang="it">ella</span> in conversation. These forms sound archaic or overly literary today. Use <span lang="it">lui</span> and <span lang="it">lei</span> instead.

        **Mistake 3 — Confusing <span lang="it">lei</span> (she) with <span lang="it">Lei</span> (formal 'you'):**
        The pronoun <span lang="it">Lei</span> (with a capital L) is also used as the formal second-person singular ('you', polite). In writing, the capital letter marks the difference; in speech, context makes it clear. This is a separate topic, but be aware that <span lang="it">lei</span> and <span lang="it">Lei</span> are distinct uses of the same word.

        **Mistake 4 — Dropping the pronoun when it is needed for clarity:**
        In a sentence like <span lang="it">Quando lavoro, non voglio essere disturbato</span>, dropping both pronouns is fine — the context is clear. But in <span lang="it">Lui va in montagna, vado al mare</span>, omitting <span lang="it">io</span> from the second clause is confusing because the subject shifts. Keep <span lang="it">io</span> whenever the subject changes mid-sentence.
      language: en
      why_this_matters: 'Italian verb endings carry so much information that repeating
        the subject pronoun is usually unnecessary — and leaving it out is what sounds
        natural. From your very first lessons you will see sentences like <span lang="it">Parlo
        italiano</span> instead of <span lang="it">Io parlo italiano</span>, and you
        may wonder whether the pronoun has been forgotten. It has not: dropping it
        is the default. Understanding when to drop it — and when to keep it — removes
        one of the most persistent sources of unnatural-sounding Italian among beginners.'
  source_url: https://www.unistrapg.it/profilo_lingua_italiana/site/gram_costruz_a1.html

- code: ord_vs
  cefr_level: A1
  category: costruzione_frase
  subcategory: ordine delle parole
  unistr_code: consapevolezza_dellordine_vs_nelle_interrogative_introdotte_da_un_pronome_o_un
  unistr_label: 'Consapevolezza dell’ordine VS nelle interrogative introdotte da un
    pronome o un avverbio: Dove va Luca? Quando parte Luca?'
  label: Ordine VS nelle interrogative con pronome o avverbio
  description: In Italian questions with a question word, the verb often comes before
    the subject (VS order), unlike in statements.
  examples:
  - Dove abita tua sorella?
  - Come si chiama il tuo professore?
  - Quando arriva il treno?
  - Perché piange il bambino?
  - Chi è la tua amica?
  - Quanto costa questo libro?
  chunk_ref: book_2_la_frase
  prerequisites:
  - sent_inter
  explanations:
    en:
      title: Word order in questions with question words
      tip: When you ask a question using a question word like 'who', 'what', or 'where',
        put the question word first, then the verb, then the subject. This order is
        the most natural way to ask these questions in Italian.
      explanation: |-
        ## The basic rule

        In Italian questions that begin with a question word (an interrogative pronoun or adverb), the standard word order is:

        **Question word → Verb → Subject (if stated)**

        <span lang="it">Domanda word + Verbo + Soggetto</span> — the subject, if you include it, comes *after* the verb. This is called Subject-Verb inversion, and it is the default in these questions. You do not add a separate word like English 'do' or 'does': the verb form alone carries the question.

        ## How to form it

        1. Start with the interrogative word.
        2. Follow immediately with the conjugated verb.
        3. Place the subject noun or pronoun after the verb (or leave it out if it is obvious from context).

        Compare the statement and the question:

        | Statement | Question |
        |---|---|
        | Maria abita qui. | Dove abita Maria? |
        | (Maria lives here.) | (Where does Maria live?) |
        | Tuo fratello si chiama Luca. | Come si chiama tuo fratello? |
        | (Your brother is called Luca.) | (What is your brother called?) |

        ## The main interrogative words at A1

        | Italian | Meaning | Notes |
        |---|---|---|
        | chi | who / whom | always singular, never changes |
        | cosa / che cosa / che | what | three equally correct forms |
        | dove | where | |
        | quando | when | |
        | come | how | |
        | perché | why | |
        | quanto / quanta / quanti / quante | how much / how many | agrees with noun in gender and number |

        ## Examples

        **1. <span lang="it">Dove</span> ('where') — verb immediately after:**
        <span lang="it">Dove abita tuo padre?</span>
        (Where does your father live?)

        **2. <span lang="it">Chi</span> ('who') — subject unknown, so <span lang="it">chi</span> itself acts as subject:**
        <span lang="it">Chi parla italiano?</span>
        (Who speaks Italian?) — here <span lang="it">chi</span> is the subject; no separate subject follows.

        **3. <span lang="it">Cosa</span> ('what') — verb then subject:**
        <span lang="it">Cosa mangia Marco a colazione?</span>
        (What does Marco eat for breakfast?)

        **4. <span lang="it">Come</span> ('how') — common greeting pattern:**
        <span lang="it">Come stai?</span>
        (How are you?) — subject <span lang="it">tu</span> is dropped because it is obvious from the verb ending.

        **5. <span lang="it">Quanto</span> ('how much') agreeing with the noun:**
        <span lang="it">Quanti fratelli hai?</span>
        (How many brothers do you have?) — <span lang="it">quanti</span> is masculine plural to match <span lang="it">fratelli</span>.

        **6. Contrastive pair — subject before vs. after verb:**
        <span lang="it">✓ Dove lavora tua madre?</span> (Where does your mother work?) — correct inversion.
        <span lang="it">✗ Dove tua madre lavora?</span> — this feels unnatural in standard Italian; avoid placing the subject between the question word and the verb.

        ## When the subject can come before the verb

        In informal spoken Italian, especially for emphasis or contrast, a noun subject sometimes appears before the verb:
        <span lang="it">E Marco, dove abita?</span>
        (And Marco, where does he live?) — the subject is fronted for emphasis, almost as a 'topic'. This is acceptable in conversation but is not the neutral default. At A1, practise the standard order first.

        ## Common learner mistakes

        **Mistake 1: Copying English 'do/does' word order without inversion.**
        <span lang="it">✗ Dove Maria abita?</span> — subject between question word and verb, mirroring 'Where does Maria live?' literally.
        <span lang="it">✓ Dove abita Maria?</span> — verb comes directly after the question word.

        **Mistake 2: Adding a redundant pronoun after the question word.**
        <span lang="it">✗ Dove lei abita?</span> — the pronoun <span lang="it">lei</span> interrupts the pattern.
        <span lang="it">✓ Dove abita lei?</span> — if you want to include the pronoun for clarity or emphasis, it goes after the verb.

        **Mistake 3: Using only <span lang="it">che</span> and forgetting <span lang="it">cosa</span> or <span lang="it">che cosa</span>.**
        All three forms — <span lang="it">che</span>, <span lang="it">cosa</span>, <span lang="it">che cosa</span> — mean 'what' when asking questions. Any one of them is correct: <span lang="it">Che mangi? / Cosa mangi? / Che cosa mangi?</span> are all fine.

        **Mistake 4: Forgetting gender/number agreement with <span lang="it">quanto</span>.**
        <span lang="it">✗ Quanto sorelle hai?</span>
        <span lang="it">✓ Quante sorelle hai?</span> — <span lang="it">sorelle</span> is feminine plural, so <span lang="it">quanto</span> becomes <span lang="it">quante</span>.
      language: en
      why_this_matters: Question words like <span lang="it">chi</span> ('who'), <span
        lang="it">cosa</span> ('what'), <span lang="it">dove</span> ('where'), and
        <span lang="it">quando</span> ('when') appear in almost every real conversation.
        Without knowing where to place them, you cannot ask basic questions about
        people, places, or things — and misplacing the verb or subject is one of the
        most noticeable errors beginners make. Getting this pattern right immediately
        makes your Italian sound natural.
  source_url: https://www.unistrapg.it/profilo_lingua_italiana/site/gram_costruz_a1.html

