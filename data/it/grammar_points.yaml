- code: coord_copu
  cefr_level: A1
  category: frase_complessa
  subcategory: coordinate copulative
  unistr_code: proposizioni_coordinate_copulative_utilizzando_il_connettivo_e_es_abito_a
  unistr_label: Proposizioni coordinate copulative utilizzando il connettivo e , es.
    Abito a Madrid e studio economia .
  label: Proposizioni coordinate copulative con congiunzione e
  description: Use 'e' (and) to link two words, phrases, or clauses together, adding
    one idea to another.
  examples:
  - <span lang='it'>Ho un fratello e una sorella.</span>
  - <span lang='it'>Marco studia e lavora ogni giorno.</span>
  - <span lang='it'>La casa è grande e bella.</span>
  - <span lang='it'>Compro il pane e il latte al supermercato.</span>
  - <span lang='it'>Lei parla italiano e io parlo inglese.</span>
  - <span lang='it'>Mangio una mela ed bevo un caffè.</span>
  chunk_ref: book_11_la_congiunzione_congiunzioni_coordinative
  prerequisites:
  - sent_affir
  explanations:
    en:
      title: Joining sentences and words with 'e'
      tip: The word 'e' (and) links two words or two sentences of equal importance.
        Before a word starting with 'e', use 'ed' instead to make pronunciation easier.
      explanation: |-
        ## The rule

        Use <span lang="it">e</span> to link two elements that have the same grammatical role, or two complete sentences of equal importance. This type of linking conjunction is called <span lang="it">congiunzione coordinativa copulativa</span> (a joining coordinator). Both sides of <span lang="it">e</span> must carry the same weight — neither is more important than the other.

        **Linking two nouns (or names):**
        <span lang="it">Marco e Sofia</span> — Marco and Sofia (both are the subject, so they have the same role)

        **Linking two adjectives:**
        <span lang="it">buono e fresco</span> — good and fresh

        **Linking two verbs or two actions:**
        <span lang="it">Mangio e bevo.</span> — I eat and drink.

        **Linking two whole sentences:**
        <span lang="it">Ho fame e voglio mangiare.</span> — I am hungry and I want to eat. (Two complete sentences, equally important, joined into one.)

        ## The variant: 'ed' before a vowel

        When the word immediately after <span lang="it">e</span> begins with a vowel — especially the letter <span lang="it">e</span> — it is standard practice in written and careful spoken Italian to add a <span lang="it">d</span> and write <span lang="it">ed</span>. This is called a <span lang="it">d eufonica</span> (euphonic d), and its only purpose is to make pronunciation smoother. It is never required, but it is very common and always correct before a vowel.

        **Most common case — before a word starting with 'e':**
        <span lang="it">pane ed acqua</span> — bread and water
        <span lang="it">Luigi ed Elena</span> — Luigi and Elena

        **Also acceptable before other vowels:**
        <span lang="it">bello ed intelligente</span> — beautiful and intelligent

        **Plain 'e' before a consonant — never 'ed' here:**
        <span lang="it">Marco e Luca</span> — Marco and Luca

        ## Examples

        <span lang="it">Ho una sorella e un fratello.</span>
        (I have a sister and a brother.) — linking two noun phrases with the same grammatical role

        <span lang="it">La minestra è calda e buona.</span>
        (The soup is hot and good.) — linking two adjectives describing the same noun

        <span lang="it">Mi alzo, faccio colazione e vado a scuola.</span>
        (I get up, have breakfast, and go to school.) — linking three actions in a daily routine; 'e' appears only before the last item in a list, just as in English

        <span lang="it">Parla italiano ed è di Roma.</span>
        (She speaks Italian and is from Rome.) — 'ed' before 'è' (a vowel), linking two full sentences

        <span lang="it">Mia madre lavora e mio padre cucina.</span>
        (My mother works and my father cooks.) — two complete sentences of equal importance joined into one

        <span lang="it">Il caffè è forte e amaro, ma mi piace.</span>
        (The coffee is strong and bitter, but I like it.) — contrastive pair: 'e' links two adjectives of equal weight; 'ma' (but) then adds a contrast; notice only 'e' makes both adjectives equal, while 'ma' signals opposition)

        ## Lists: where does 'e' go?

        In a list of three or more items, Italian follows the same pattern as English: <span lang="it">e</span> appears only before the **last** item. A comma separates all earlier items.

        <span lang="it">Ho comprato il pane, il latte e le mele.</span>
        (I bought bread, milk, and apples.)

        Do **not** write <span lang="it">il pane e il latte e le mele</span> — that reads as clumsy repetition, though it is grammatically possible for emphasis in poetry or storytelling.

        ## Common learner mistakes

        **Mistake 1: Using 'ed' before a consonant.**
        Incorrect: <span lang="it">*Marco ed Luca*</span>
        Correct: <span lang="it">Marco e Luca</span>
        The <span lang="it">d eufonica</span> is only for words starting with a vowel. Before a consonant, always use plain <span lang="it">e</span>.

        **Mistake 2: Placing 'e' between every item in a list.**
        Incorrect: <span lang="it">*il pane e il latte e le mele*</span> (as normal speech)
        Correct: <span lang="it">il pane, il latte e le mele</span>
        Only the last item in a list is introduced by <span lang="it">e</span>; the rest are separated by commas.

        **Mistake 3: Confusing 'e' (and) with 'è' (is).**
        These sound identical in speech but are written differently. <span lang="it">è</span> (with the grave accent) is the third-person singular of <span lang="it">essere</span> (to be). <span lang="it">e</span> (no accent) is the conjunction. Compare:
        <span lang="it">Marco è a casa.</span> — Marco is at home. (verb)
        <span lang="it">Marco e Sofia sono a casa.</span> — Marco and Sofia are at home. (conjunction)

        **Mistake 4: Assuming 'e' can express contrast.**
        Incorrect reasoning: thinking <span lang="it">e</span> can mean 'but'. It cannot. <span lang="it">e</span> always signals that the two elements are equal and compatible. For contrast, Italian uses <span lang="it">ma</span> (but) or <span lang="it">però</span> (however).
        Incorrect: <span lang="it">*È gentile e non mi piace.*</span> (intended as contrast)
        Correct: <span lang="it">È gentile, ma non mi piace.</span> — He is kind, but I do not like him.

        ## Quick-reference table

        | Form | When to use | Example |
        |---|---|---|
        | e | Before a consonant, or generally before any vowel | pane e burro |
        | ed | Preferred before a word starting with a vowel (especially 'e') | pane ed acqua |
      language: en
      why_this_matters: The conjunction <span lang="it">e</span> (and) is one of the
        most frequent words in Italian. Without it, you cannot list things, describe
        people, or connect two actions — all of which come up in the very first conversations
        you will have. Mastering this tiny word, including when to swap it for <span
        lang="it">ed</span>, removes a surprisingly common source of errors right
        at the start of your learning.
  source_url: https://www.unistrapg.it/profilo_lingua_italiana/site/gram_frasecomplessa_a1.html

- code: coord_disj
  cefr_level: A1
  category: frase_complessa
  subcategory: coordinate disgiuntive
  unistr_code: proposizioni_coordinate_disgiuntive_utilizzando_il_connettivo_o_es_mangi_qui_o
  unistr_label: Proposizioni coordinate disgiuntive utilizzando il connettivo o ,
    es. Mangi qui o vai a casa?
  label: Proposizioni coordinate disgiuntive con congiunzione o
  description: Uses 'o' (or) to link two words, phrases, or clauses as alternatives.
    Either option is possible, but not necessarily both.
  examples:
  - <span lang='it'>Vuoi caffè o tè?</span>
  - <span lang='it'>Vieni tu o viene Marco?</span>
  - <span lang='it'>Prendo il treno o l'autobus.</span>
  - <span lang='it'>Studi italiano o spagnolo?</span>
  - <span lang='it'>Andiamo al mare o in montagna quest'estate.</span>
  chunk_ref: book_11_la_congiunzione_congiunzioni_coordinative
  prerequisites:
  - sent_affir
  explanations:
    en:
      title: Joining alternatives with 'o'
      tip: Use 'o' (or) between two words or sentences to show a choice between alternatives.
        It works exactly like English 'or' — place it between the two options you
        want to connect.
      explanation: |-
        ## The rule

        The coordinating conjunction <span lang="it">o</span> (meaning 'or') joins two words, phrases, or whole sentences ('proposizioni coordinate disgiuntive' — disjunctive co-ordinate clauses) that are alternatives: choosing one logically excludes the other. Simply place <span lang="it">o</span> between the two items you want to contrast.

        **Basic pattern:** [option A] + <span lang="it">o</span> + [option B]

        There is no change for gender, number, or person — <span lang="it">o</span> is invariable.

        ## Variants and related words

        Italian offers several words that mean 'or'. They are interchangeable in most everyday situations, but each has a slightly different register or nuance:

        | Forma | English | Notes |
        |---|---|---|
        | o | or | the most common, neutral form |
        | oppure | or / or else | slightly more emphatic; very common in speech |
        | ovvero | or / that is to say | more formal; can also introduce a clarification |

        At A1 level, focus on <span lang="it">o</span> and <span lang="it">oppure</span>. You will hear and read both constantly.

        ### The doubled form: o...o

        When you want to stress that the choice is strictly between two options and no others, Italian repeats the conjunction: <span lang="it">o... o...</span> ('either... or...'). This is called a correlative use.

        <span lang="it">O ora o mai più.</span> (Either now or never.)

        You do not need to produce this form at A1, but you will encounter it, so it is worth recognising.

        ## Examples

        **Joining two nouns (a simple choice):**
        <span lang="it">Vuoi tè o caffè?</span>
        (Do you want tea or coffee?)

        **Joining two adjectives:**
        <span lang="it">Il latte è caldo o freddo?</span>
        (Is the milk hot or cold?)

        **Joining two verb phrases:**
        <span lang="it">Mangi a casa o al ristorante?</span>
        (Are you eating at home or at a restaurant?)

        **Joining two full sentences:**
        <span lang="it">Non ho deciso se scrivere oppure telefonare.</span>
        (I haven't decided whether to write or to call.)

        **Edge case — <span lang="it">o</span> versus <span lang="it">e</span> (and):**
        <span lang="it">Prendo il pane e il latte.</span> (I'm buying bread and milk.) — both items, no choice
        <span lang="it">Prendo il pane o il latte.</span> (I'm buying bread or milk.) — one item, a choice must be made

        This contrast is important: <span lang="it">e</span> adds things together, while <span lang="it">o</span> separates them into alternatives.

        ## Common learner mistakes

        **Mistake 1: Confusing <span lang="it">o</span> with <span lang="it">e</span>.**
        Learners sometimes write <span lang="it">e</span> when they mean <span lang="it">o</span> because both connect two items. Ask yourself: are both things happening together? Use <span lang="it">e</span>. Is only one possible? Use <span lang="it">o</span>.

        ✗ <span lang="it">Vieni martedì e mercoledì?</span> (Are you coming Tuesday and Wednesday? — implies both days)
        ✓ <span lang="it">Vieni martedì o mercoledì?</span> (Are you coming Tuesday or Wednesday? — one day, a choice)

        **Mistake 2: Adding an accent — writing <span lang="it">ò</span> instead of <span lang="it">o</span>.**
        The conjunction <span lang="it">o</span> ('or') has no accent. The accented form <span lang="it">ò</span> does not exist as a standard word. Do not confuse this with <span lang="it">è</span> (accented form of <span lang="it">e</span>, meaning 'is'), which does carry an accent. Write simply <span lang="it">o</span>.

        **Mistake 3: Omitting <span lang="it">o</span> and listing options without a connector.**
        In English, informal speech sometimes drops 'or' ('Tea? Coffee?'). In Italian, it is normal and much clearer to include <span lang="it">o</span> between the final two options.

        ✗ <span lang="it">Vuoi tè, caffè?</span>
        ✓ <span lang="it">Vuoi tè o caffè?</span>
      language: en
      why_this_matters: Almost every conversation involves making choices or offering
        alternatives — 'tea or coffee?', 'today or tomorrow?', 'do you want to walk
        or take the bus?' Without <span lang="it">o</span> ('or'), you cannot express
        any of these ideas in Italian. This tiny word appears in questions, suggestions,
        and everyday decisions at every level of the language, so recognising and
        using it correctly from day one removes a constant gap in your speech.
  source_url: https://www.unistrapg.it/profilo_lingua_italiana/site/gram_frasecomplessa_a1.html

- code: subord_cau
  cefr_level: A1
  category: frase_complessa
  subcategory: causali
  unistr_code: proposizioni_causali_introdotte_da_perche_es_perche_vai_a_casa_perche_sono
  unistr_label: Proposizioni causali introdotte da perché , es. (Perché vai a casa?)
    Perché sono stanco .
  label: Proposizioni causali con congiunzione perché
  description: Use 'perché' to introduce a reason clause explaining why something
    happens. It links two clauses with cause and effect.
  examples:
  - <span lang='it'>Non vengo perché sono stanco.</span>
  - <span lang='it'>Mangio la pizza perché mi piace molto.</span>
  - <span lang='it'>Marco studia l'italiano perché vuole vivere a Roma.</span>
  - <span lang='it'>Lei non parla perché non capisce la domanda.</span>
  - <span lang='it'>Resto a casa perché fa freddo.</span>
  chunk_ref: book_11_la_congiunzione_congiunzioni_subordinative
  prerequisites:
  - sent_affir
  explanations:
    en:
      title: Giving reasons with 'perché'
      tip: Use 'perché' to explain why something happens. It connects two parts of
        a sentence, where the second part gives the reason for the first. This is
        one of the most common words in Italian — you will hear and use it every day.
      explanation: |-
        ## The rule

        A causal clause, called a <span lang="it">proposizione causale</span> (reason clause), explains the cause or reason behind the action in the main clause, called the <span lang="it">proposizione reggente</span> (main/governing clause). At A1 level, you form it simply by placing <span lang="it">perché</span> between the main clause and the reason clause:

        **[main clause]** + <span lang="it">perché</span> + **[reason clause]**

        Both clauses use a normal, straightforward verb form — at A1, this is always the present tense (<span lang="it">presente indicativo</span>). No subjunctive, no special verb change is needed at this level.

        **Formation at a glance:**

        <span lang="it">Mangio la pizza perché mi piace.</span>
        (I eat pizza because I like it.)

        The sentence has two parts:
        - <span lang="it">Mangio la pizza</span> — main clause (what happens)
        - <span lang="it">perché mi piace</span> — reason clause (why it happens)

        ## Position: before or after?

        The reason clause with <span lang="it">perché</span> almost always comes **after** the main clause in everyday speech. This is the safest and most natural order at A1 level. In Italian it is also possible — though less common — to place another causal conjunction such as <span lang="it">siccome</span> (since/as) at the very start of the sentence, but <span lang="it">perché</span> does **not** normally open a sentence on its own in standard usage.

        ## Examples

        <span lang="it">Studio l'italiano perché è bella lingua.</span>
        (I study Italian because it is a beautiful language.) — giving a reason for a habit

        <span lang="it">Non mangio la carne perché non mi piace.</span>
        (I don't eat meat because I don't like it.) — giving a reason for a negative action

        <span lang="it">Maria beve acqua perché ha sete.</span>
        (Maria drinks water because she is thirsty.) — third-person subject in both clauses

        <span lang="it">Siamo a casa perché fa freddo.</span>
        (We are at home because it is cold.) — state of being, not an action

        <span lang="it">Non dormo bene perché il bambino piange.</span>
        (I don't sleep well because the baby cries.) — the subjects of the two clauses are different: 'I' and 'the baby'

        <span lang="it">Vado al supermercato perché non c'è pane.</span>
        (I'm going to the supermarket because there is no bread.) — everyday, A1-level scenario

        ## Important note: 'perché' has two meanings

        The word <span lang="it">perché</span> does **double duty** in Italian: it means both **'because'** (giving a reason) and **'why'** (asking a question). You tell them apart by context:

        | Use | Example | Meaning |
        |---|---|---|
        | Question | Perché studi? | 'Why do you study?' |
        | Answer/reason | Studio perché mi piace. | 'I study because I like it.' |

        When <span lang="it">perché</span> opens a question, it means 'why'. When it follows a main clause inside a sentence, it means 'because'. At A1, you will use both constantly — in question-and-answer pairs especially.

        ## Other causal conjunctions (for awareness)

        Italian has several other words that also introduce reason clauses. You do not need to use them at A1, but you may hear them:

        - <span lang="it">siccome</span> (since/as) — goes at the **start** of the sentence: <span lang="it">Siccome ho fame, mangio.</span> (Since I'm hungry, I eat.)
        - <span lang="it">dato che</span> (given that): <span lang="it">Dato che è tardi, andiamo.</span> (Given that it's late, let's go.)
        - <span lang="it">visto che</span> (seeing that): <span lang="it">Visto che piove, resto a casa.</span> (Seeing that it's raining, I'm staying home.)

        For now, focus on <span lang="it">perché</span>: it is by far the most frequent and the most useful.

        ## Common learner mistakes

        **Mistake 1 — Confusing 'because' and 'why':**
        Learners sometimes write <span lang="it">*perché vuoi?*</span> when they mean 'because I want to' (as an answer), or forget that the question form also uses <span lang="it">perché</span>. Remember: in an answer, <span lang="it">perché</span> always sits **after** the main clause, not at the start.

        **Mistake 2 — Using 'because' to start a standalone sentence:**
        In English, people sometimes write 'Because I like it.' as a full sentence (especially in informal writing). In Italian, <span lang="it">perché</span> must always be connected to a main clause. <span lang="it">*Perché mi piace.*</span> alone is not a complete sentence — it is a fragment. Always attach it: <span lang="it">Lo faccio perché mi piace.</span> (I do it because I like it.)

        **Mistake 3 — Using 'perché' with a noun instead of a verb:**
        Learners sometimes write <span lang="it">*Sono stanco perché il lavoro.*</span> This is wrong — <span lang="it">perché</span> must be followed by a full clause with a conjugated verb, not just a noun. Correct form: <span lang="it">Sono stanco perché lavoro molto.</span> (I am tired because I work a lot.)

        **Mistake 4 — Accent confusion:**
        Note that <span lang="it">perché</span> always carries an accent on the final <span lang="it">é</span>. Writing it without the accent (<span lang="it">*perche*</span>) is a spelling error in Italian.
      language: en
      why_this_matters: Every time you explain why you do something — why you are
        hungry, why you are tired, why you like something — you need a word to link
        the reason to the action. In Italian, that word is <span lang="it">perché</span>
        (because). Without it, you can state facts, but you cannot explain them. Mastering
        this one word immediately lets you answer questions like <span lang="it">Perché
        studi l'italiano?</span> (Why do you study Italian?) and unlocks a huge range
        of everyday conversation.
  source_url: https://www.unistrapg.it/profilo_lingua_italiana/site/gram_frasecomplessa_a1.html

- code: subord_fin
  cefr_level: A1
  category: frase_complessa
  subcategory: proposizioni finali
  unistr_code: proposizioni_finali_implicite_con_uso_della_preposizione_per_infinito_es_sono
  unistr_label: Proposizioni finali implicite con uso della preposizione per + infinito,
    es. Sono qui per imparare l’italiano .
  label: Proposizioni finali implicite con preposizione per e infinito
  description: Use 'per' + infinitive to say why you do something — like 'in order
    to'. It links an action to its purpose.
  examples:
  - <span lang="it">Studio per imparare l'italiano.</span>
  - <span lang="it">Vado al bar per prendere un caffè.</span>
  - <span lang="it">Uso il dizionario per capire le parole nuove.</span>
  - <span lang="it">Chiamo Marco per parlare con lui.</span>
  - <span lang="it">Andiamo in centro per fare la spesa.</span>
  chunk_ref: book_11_la_congiunzione_congiunzioni_subordinative
  prerequisites:
  - sent_affir
  explanations:
    en:
      title: Expressing purpose with 'per' and the infinitive
      tip: To say why you do something, use 'per' followed by the infinitive. This
        works whenever the subject of both verbs is the same person. It is the simplest
        and most natural way to express purpose in Italian.
      explanation: |-
        ## The rule

        To express purpose — the reason or goal behind an action — Italian uses the preposition <span lang="it">per</span> ('in order to', 'to', 'for') followed by the **infinitive** of a verb. This construction is called an *implicit final clause* because the purpose is expressed without a full subordinate clause.

        **Formula:**

        Main clause + <span lang="it">per</span> + infinitive

        Example:
        <span lang="it">Studio l'italiano per parlare con la mia famiglia.</span>
        (I study Italian to speak with my family.)

        The infinitive is always in its base form — the form you find in the dictionary, ending in <span lang="it">-are</span>, <span lang="it">-ere</span>, or <span lang="it">-ire</span>. It does **not** change to agree with the subject.

        ## The key condition: same subject

        This structure is only used when **both verbs share the same subject** — that is, the person doing the main action and the person doing the purpose action are the same.

        ✔ Same subject (use <span lang="it">per</span> + infinitive):
        <span lang="it">Vado al bar per prendere un caffè.</span>
        (I go to the bar to get a coffee. — *I* go, *I* get.)

        ✘ Different subjects (do NOT use this structure — use <span lang="it">affinché/perché</span> + subjunctive instead):
        <span lang="it">Ti scrivo perché tu sappia la verità.</span>
        (I write to you so that *you* know the truth. — *I* write, *you* know.)

        At A1 level, you will almost always be dealing with the same-subject case, so <span lang="it">per</span> + infinitive is your go-to tool for expressing purpose.

        ## Forming the construction

        No changes are needed to the infinitive. Here is how the structure looks with verbs from all three conjugation classes:

        | Infinitive class | Example infinitive | With per |
        |---|---|---|
        | -are | mangiare (to eat) | per mangiare |
        | -ere | prendere (to take) | per prendere |
        | -ire | dormire (to sleep) | per dormire |

        Irregular verbs use their standard infinitive form too:

        | Infinitive | With per |
        |---|---|
        | essere (to be) | per essere |
        | avere (to have) | per avere |
        | fare (to do/make) | per fare |
        | andare (to go) | per andare |

        ## Position in the sentence

        The <span lang="it">per</span> + infinitive phrase most naturally comes **after** the main clause, but it can also appear at the **beginning** of the sentence for emphasis. Both positions are correct.

        After the main clause (most common):
        <span lang="it">Apro la finestra per prendere aria.</span>
        (I open the window to get some air.)

        At the start of the sentence (for emphasis):
        <span lang="it">Per mangiare bene, andiamo al ristorante.</span>
        (To eat well, we go to the restaurant.)

        ## Examples

        **1. Daily routine (basic use)**
        <span lang="it">Mi alzo presto per fare colazione con la mia famiglia.</span>
        (I get up early to have breakfast with my family.)

        **2. Movement with a goal (very common at A1)**
        <span lang="it">Vado al supermercato per comprare il pane.</span>
        (I go to the supermarket to buy bread.)

        **3. Learning a language**
        <span lang="it">Studio l'italiano per capire i miei amici.</span>
        (I study Italian to understand my friends.)

        **4.** <span lang="it">Per</span> at the start of the sentence
        <span lang="it">Per dormire meglio, bevo una camomilla la sera.</span>
        (To sleep better, I drink chamomile tea in the evening.)

        **5. Edge case — contrastive pair (same vs. different subject)**
        <span lang="it">Chiamo la nonna per salutarla.</span>
        (I call grandma to greet her. ← same subject: *I* call, *I* greet. ✔ Use <span lang="it">per</span> + infinitive.)

        <span lang="it">Chiamo la nonna perché lei sappia che sto bene.</span>
        (I call grandma so that *she* knows I am well. ← different subjects: *I* call, *she* knows. ✘ Cannot use <span lang="it">per</span> + infinitive here.)

        **6. Negative purpose (to avoid doing something)**
        <span lang="it">Parlo piano per non svegliare il bambino.</span>
        (I speak quietly so as not to wake the baby.)
        (Add <span lang="it">non</span> directly before the infinitive to make the purpose negative.)

        ## Common learner mistakes

        **Mistake 1: Conjugating the infinitive**
        <span lang="it">✘ Vado al bar per prendo un caffè.</span>
        (Incorrect — <span lang="it">prendo</span> is a conjugated form, not an infinitive.)
        <span lang="it">✔ Vado al bar per prendere un caffè.</span>

        **Mistake 2: Inserting a second subject pronoun**
        <span lang="it">✘ Studio per io parlare italiano.</span>
        (Incorrect — no subject pronoun is used inside the <span lang="it">per</span> + infinitive phrase.)
        <span lang="it">✔ Studio per parlare italiano.</span>

        **Mistake 3: Using** <span lang="it">per</span> **when the subjects are different**
        <span lang="it">✘ Le parlo per lei capisce.</span>
        (Incorrect structure entirely.)
        <span lang="it">✔ Le parlo perché lei capisca.</span>
        (Correct — use <span lang="it">perché</span> + subjunctive when subjects differ. This is a B1 structure; at A1 simply remember that <span lang="it">per</span> + infinitive requires the same subject.)

        **Mistake 4: Confusing purposive** <span lang="it">per</span> **with causal** <span lang="it">perché</span>
        These two words look similar but work differently.
        <span lang="it">Resto a casa perché sono stanco.</span> (I stay home *because* I am tired. ← <span lang="it">perché</span> gives a reason/cause with a full conjugated clause.)
        <span lang="it">Resto a casa per riposare.</span> (I stay home *in order to* rest. ← <span lang="it">per</span> + infinitive gives a purpose/goal.)
      language: en
      why_this_matters: Saying *why* you do something is one of the first things you
        need in any language. Without this structure, you cannot explain that you
        are studying Italian *to travel*, eating *to stay healthy*, or going to the
        shop *to buy bread*. The pattern <span lang="it">per</span> + infinitive appears
        in almost every real conversation, so mastering it early removes a major gap
        in your ability to communicate.
  source_url: https://www.unistrapg.it/profilo_lingua_italiana/site/gram_frasecomplessa_a1.html

