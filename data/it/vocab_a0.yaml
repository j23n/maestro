# A0 Vocabulary — words and phrases not in the EPUB dictionary
#
# These entries create VocabularyWord + VocabularyWordDefinition(student_level="A0")
# records.  Words already in the EPUB dictionary (the vast majority of A0 vocab)
# are handled automatically by the standard ingest pipeline.
#
# All entries are implicitly cefr_level: A0.
#
# For single words, the issue is usually that:
#   - the word doesn't appear in the EPUB dictionary at all (menù, tiramisù)
#   - spaCy lemmatises the surface form to something wrong (scusi → scondere)
#   - the word is a truncated / irregular form (buon, buona)
#
# For phrases, the standard per-token matching can't find them — they're
# matched via the phrase index instead (exact text match on lang="it" elements).

##############################################################################
# Single words not in EPUB dictionary
##############################################################################

