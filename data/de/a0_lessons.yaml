a0-05-um-hilfe-bitten:
  activities:
  - type: vocab_review
  - content: '## When you''re stuck


      You''re on a street in Munich and someone gives you directions — but too fast. Use these phrases to stay in the conversation:


      - <span lang="de">**Entschuldigung!**</span> — Excuse me! / Sorry! (*ent-shool-dee-goong*)

      - <span lang="de">**Können Sie das wiederholen?**</span> — Can you repeat that? (*kur-nen zee das vee-der-hoh-len*)

      - <span lang="de">**Noch einmal, bitte.**</span> — Once more, please. (*nohkh ayn-mahl bit-teh*)

      - <span lang="de">**Ich verstehe nicht.**</span> — I don''t understand. (*ikh fair-shtay-uh nikht*)

      - <span lang="de">**Ich weiß nicht.**</span> — I don''t know. (*ikh vice nikht*)

      - <span lang="de">**Sprechen Sie Englisch?**</span> — Do you speak English? (*shpreh-khen zee eng-lish*)

      - <span lang="de">**Langsamer, bitte.**</span> — Slower, please. (*lang-zah-mer bit-teh*)

      - <span lang="de">**Danke schön!**</span> — Thank you very much! (*dan-keh shurn*)


      > <span lang="de">*Entschuldigung*</span> is the word you''ll use most on the street — it grabs attention politely and
      starts any awkward moment on the right foot.

      '
    description: Phrases that keep conversations going
    grammar_point_code: hoeflich_ausdruecke
    title: Getting unstuck
    type: grammar
