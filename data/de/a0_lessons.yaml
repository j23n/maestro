  - title: Uhrzeit und Wochentage
    type: grammar
    description: Telling time and days of the week
    grammar_point_code: uhrzeit_wochentage
    content: '## Wie spät ist es? — What time is it?


      ### Asking and telling the time


      - <span lang="de">**Wie spät ist es?**</span> — What time is it? *(vee shpayt ist es)*

      - <span lang="de">**Es ist zwei Uhr.**</span> — It''s 2 o''clock.

      - <span lang="de">**Es ist halb drei.**</span> — It''s 2:30. *(literally: half three)*

      - <span lang="de">**Es ist Viertel nach zehn.**</span> — It''s 10:15.

      - <span lang="de">**Es ist Viertel vor drei.**</span> — It''s 2:45.


      Germany uses the **24-hour clock** for timetables and appointments:

      - <span lang="de">**achtzehn Uhr dreißig**</span> = 18:30 = 6:30 PM

      - <span lang="de">**Der Zug fährt um vierzehn Uhr ab.**</span> — The train leaves at 2 PM.


      > **Watch out!** <span lang="de">**halb drei**</span> = **2:30**, NOT 3:30! It means "halfway *to* three."


      ### Die Wochentage — Days of the week


      | Deutsch | Englisch | | Deutsch | Englisch |

      |---------|---------|---|---------|---------|

      | <span lang="de">Montag</span> | Monday | | <span lang="de">Freitag</span> | Friday |

      | <span lang="de">Dienstag</span> | Tuesday | | <span lang="de">Samstag</span> | Saturday |

      | <span lang="de">Mittwoch</span> | Wednesday | | <span lang="de">Sonntag</span> | Sunday |

      | <span lang="de">Donnerstag</span> | Thursday | | | |


      Days are **always capitalised** in German!


      - <span lang="de">*Heute ist Freitag.*</span> (Today is Friday.)

      - <span lang="de">*Am Sonntag ist das Geschäft geschlossen.*</span> (The shop is closed on Sunday.)

      '
