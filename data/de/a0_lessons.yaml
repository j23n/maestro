a0-08-grosse-zahlen:
  activities:
  - type: vocab_review
  - title: Zahlen von zwanzig bis hundert
    type: grammar
    description: Big numbers for prices and addresses
    grammar_point_code: zahlen_20_100
    content: '## Die Zahlen von 20 bis 100


      | Zahl | Deutsch | | Zahl | Deutsch |

      |------|---------|---|------|---------|

      | 20 | **<span lang="de">zwanzig</span>** | | 60 | **<span lang="de">sechzig</span>** |

      | 30 | **<span lang="de">dreißig</span>** | | 70 | **<span lang="de">siebzig</span>** |

      | 40 | **<span lang="de">vierzig</span>** | | 80 | **<span lang="de">achtzig</span>** |

      | 50 | **<span lang="de">fünfzig</span>** | | 90 | **<span lang="de">neunzig</span>** |

      | | | | 100 | **<span lang="de">hundert</span>** |


      ### The German twist: units come FIRST!


      Join the unit + <span lang="de">**und**</span> + ten — all as **one word**:


      - 21 → <span lang="de">**einundzwanzig**</span> *(ine-oont-tsvahn-tsig)*

      - 35 → <span lang="de">**fünfunddreißig**</span> *(fuenf-oont-dry-sig)*

      - 47 → <span lang="de">**siebenundvierzig**</span> *(zee-ben-oont-feer-tsig)*


      **Examples:**

      - <span lang="de">*Das kostet fünfundvierzig Euro.*</span> (That costs €45.)

      - <span lang="de">*Gleis einundzwanzig.*</span> (Platform 21.)


      > **Tip:** Think of "four-and-twenty blackbirds" — German works exactly like that for every number!

      '
