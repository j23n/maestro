a0-07-das-mag-ich:
  activities:
  - type: vocab_review
  - content: '## Saying What You Like and Don''t Like


      German has two common ways to express likes:


      ### 1. Ich mag... (I like...)


      Use <span lang="de">**Ich mag**</span> for food, drinks, and people:


      | German | Pronunciation | English |

      |---|---|---|

      | <span lang="de">Ich mag Weißwurst.</span> | *ikh mahg VYS-voorst* | I like Weißwurst. |

      | <span lang="de">Ich mag Kaffee.</span> | *ikh mahg kah-FAY* | I like coffee. |

      | <span lang="de">Ich mag keine Milch.</span> | *ikh mahg KY-neh milkh* | I don''t like milk. |

      | <span lang="de">Magst du Bier?</span> | *mahkst doo beer* | Do you like beer? |


      ### 2. Mir gefällt... (I like... / It pleases me)


      Use <span lang="de">**Mir gefällt**</span> for places, experiences, and things:


      - <span lang="de">**Mir gefällt München.**</span> — I like Munich.

      - <span lang="de">**Mir gefällt das Hotel.**</span> — I like the hotel.


      For **plural** things, use <span lang="de">**Mir gefallen**</span>:


      - <span lang="de">**Mir gefallen die Berge.**</span> — I like the mountains.


      > **Tip:** Start with <span lang="de">**Ich mag**</span> — it''s the easiest and most useful for food and everyday things!

      '
    description: Expressing likes and dislikes in German
    grammar_point_code: ich_mag
    title: Ich mag / Mir gefällt
    type: grammar
  - description: Practice ich mag and mir gefällt
    exercise_type: fill_blank
    grammar_point_code: ich_mag
    hint: Use "mag" for food/drinks. Use "nicht" or "keine/kein" to say you don't like something. Use "gefällt" for places/experiences.
    items:
    - correct_answer: mag
      prompt: I like Weißwurst. = Ich ___ Weißwurst.
    - correct_answer: mag
      prompt: I like beer. = Ich ___ Bier.
    - correct_answer: keine
      prompt: I don't like milk. = Ich mag ___ Milch.
    - correct_answer: Magst
      prompt: Do you like coffee? = ___ du Kaffee?
    - correct_answer: gefällt
      prompt: I like Munich. = Mir ___ München.
    - correct_answer: gefallen
      prompt: I like the mountains. = Mir ___ die Berge.
    title: Ich mag...
    type: drill
  - content: '## "The" in the plural — always **die**


      You know <span lang="de">**der**</span> (m.), <span lang="de">**die**</span> (f.), and <span lang="de">**das**</span>
      (n.) for single things. Great news: in the **plural**, all three genders use the same article:


      > <span lang="de">**die**</span> = the (plural, all genders)


      | Singular | Plural |

      |---|---|

      | <span lang="de">der Käse</span> (the cheese) | <span lang="de">die Käse</span> |

      | <span lang="de">die Wurst</span> (the sausage) | <span lang="de">die Würste</span> |

      | <span lang="de">das Bier</span> (the beer) | <span lang="de">die Biere</span> |

      | <span lang="de">der Mann</span> (the man) | <span lang="de">die Männer</span> |

      | <span lang="de">das Kind</span> (the child) | <span lang="de">die Kinder</span> |


      ### Common plural patterns

      - Add **-e**: <span lang="de">der Tisch → die Tische</span>

      - Add **-er**: <span lang="de">das Kind → die Kinder</span>

      - Add **-en**: <span lang="de">die Frau → die Frauen</span>

      - Add umlaut + **-e**: <span lang="de">die Wurst → die Würste</span>

      - No change: <span lang="de">das Mädchen → die Mädchen</span>


      > **Tip:** Learn each noun with its plural — just like you learn it with its article!

      '
    description: The definite article in the plural
    grammar_point_code: art_plural
    title: 'Plural articles: die'
    type: grammar
