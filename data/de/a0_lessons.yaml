  - content: '## Prepositions of Place: nach, in, zu


      Small words that tell you **where** — essential for understanding directions:


      | German | Use it for | Example |

      |--------|-----------|---------|

      | <span lang="de">**nach**</span> | cities and countries | <span lang="de">Ich fahre **nach** München.</span> (I''m
      going to Munich.) |

      | <span lang="de">**in**</span> | inside a place | <span lang="de">Ich bin **in** München.</span> (I''m in Munich.)
      |

      | <span lang="de">**zu / zum / zur**</span> | to a specific place | <span lang="de">Gehen Sie **zum** Bahnhof.</span>
      (Go to the train station.) |


      **Shortcuts to remember:**


      - <span lang="de">**zum**</span> = <span lang="de">zu + dem</span> (used with masculine and neuter nouns) → *tsoom*

      - <span lang="de">**zur**</span> = <span lang="de">zu + der</span> (used with feminine nouns) → *tsoor*


      **More examples:**

      - <span lang="de">*Wir fliegen **nach** Deutschland.*</span> (We''re flying to Germany.)

      - <span lang="de">*Gehen Sie **zur** Apotheke.*</span> (Go to the pharmacy.)

      - <span lang="de">*Das Café ist **in** der Stadtmitte.*</span> (The café is in the city centre.)


      > **Tip:** Start with <span lang="de">**nach**</span> (to cities/countries) and <span lang="de">**in**</span> (inside).
      You''ll pick up <span lang="de">**zum/zur**</span> with practice!

      '
    description: nach, in, zu — the three key place prepositions
    grammar_point_code: ortspraepositionen
