      <span lang="de">— Ja, mir gefallen die Bäume. Es ist schön hier.</span> *(Yes, I like the trees. It''s nice here.)*


      <span lang="de">— Kommst du oft hierher?</span> *(Do you come here often?)*


      <span lang="de">— Ja, ich mag München sehr!</span> *(Yes, I like Munich a lot!)*

      '
