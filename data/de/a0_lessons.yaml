a0-06-im-biergarten:
  activities:
  - type: vocab_review
  - content: '## Im Biergarten


      A traditional Bavarian Biergarten menu is full of hearty classics. Here are the key food and drink words:


      | German | Pronunciation | English |

      |--------|--------------|---------|

      | <span lang="de">die Brezel</span> | *BREH-tsel* | the pretzel |

      | <span lang="de">die Weißwurst</span> | *VICE-voorst* | the white sausage |

      | <span lang="de">das Schnitzel</span> | *SHNIT-sel* | the schnitzel |

      | <span lang="de">die Suppe</span> | *ZOO-puh* | the soup |

      | <span lang="de">der Salat</span> | *zah-LAHT* | the salad |

      | <span lang="de">die Kartoffeln</span> | *kar-TOF-eln* | the potatoes |

      | <span lang="de">der Kuchen</span> | *KOO-khen* | the cake |

      | <span lang="de">das Brot</span> | *broht* | the bread |

      | <span lang="de">das Bier</span> | *beer* | the beer |

      | <span lang="de">der Kaffee</span> | *KAH-feh* | the coffee |

      | <span lang="de">das Wasser</span> | *VAH-ser* | the water |

      | <span lang="de">der Saft</span> | *zahft* | the juice |

      | <span lang="de">die Apfelschorle</span> | *AHP-fel-SHOR-luh* | the apple spritzer |


      ### At the table


      - <span lang="de">**Einen Tisch für zwei, bitte.**</span> — A table for two, please.

      - <span lang="de">**Die Speisekarte, bitte.**</span> — The menu, please.

      - <span lang="de">**Die Rechnung, bitte.**</span> — The bill, please.

      - <span lang="de">**Mit oder ohne Kohlensäure?**</span> — With or without carbonation?

      '
    description: Biergarten food and drink vocabulary
    grammar_point_code: essen_trinken
    title: Die Speisekarte
    type: grammar
  - description: Menu and restaurant basics
    exercise_type: fill_blank
    grammar_point_code: essen_trinken
    hint: Tisch = table. Speisekarte = menu. Rechnung = bill. Bier, Wasser, Saft — all drinks.
    items:
    - correct_answer: zwei
      prompt: A table for two, please. = Einen Tisch für ___, bitte.
    - correct_answer: Speisekarte
      prompt: The menu, please. = Die ___, bitte.
    - correct_answer: Rechnung
      prompt: The bill, please. = Die ___, bitte.
    - correct_answer: Kohlensäure
      prompt: With or without carbonation? = Mit oder ohne ___?
    - correct_answer: Schnitzel
      prompt: A breaded meat cutlet = das ___
    - correct_answer: Apfelschorle
      prompt: Apple juice mixed with sparkling water = die ___
    title: Restaurant-Grundlagen
    type: drill
  - content: '## Was ist das?


      You are sitting in the Biergarten and you see an unfamiliar dish at the next table. Point and ask:


      - <span lang="de">**Was ist das?**</span> — *vahs ist dahs?* — What is that?

      - <span lang="de">**Was ist das hier?**</span> — *vahs ist dahs heer?* — What is this here?


      ### How to answer


      Use <span lang="de">**Das ist...**</span> (*dahs ist*) — "That is..." — to identify anything, regardless of gender:


      | Question | Answer |

      |----------|--------|

      | <span lang="de">Was ist das?</span> | <span lang="de">Das ist eine Brezel.</span> — That is a pretzel. |

      | <span lang="de">Was ist das?</span> | <span lang="de">Das ist ein Schnitzel.</span> — That is a schnitzel. |

      | <span lang="de">Was ist das?</span> | <span lang="de">Das ist die Weißwurst.</span> — That is the white sausage. |


      > **Tip:** <span lang="de">**Das**</span> here means "that" or "this" — it does not change based on the gender of the
      noun. Always start your answer with <span lang="de">**Das ist...**</span>


      ### Dietary needs


      - <span lang="de">**Ich bin Vegetarier.**</span> *(m.)* / <span lang="de">**Ich bin Vegetarierin.**</span> *(f.)* —
      I am vegetarian.

      - <span lang="de">**Ich bin allergisch gegen...**</span> — I am allergic to...

      - <span lang="de">**Glutenfrei**</span> — Gluten-free

      '
    description: Asking what things are
    grammar_point_code: was_ist_das
    title: Was ist das?
    type: grammar
  - description: Identifying dishes and dietary needs
    exercise_type: fill_blank
    grammar_point_code: was_ist_das
    hint: Was ist das? = What is that? Das ist... = That is... Vegetarier/Vegetarierin, allergisch, glutenfrei.
    items:
    - correct_answer: Was
      prompt: What is that? = ___ ist das?
    - correct_answer: Das
      prompt: That is a pretzel. = ___ ist eine Brezel.
    - correct_answer: Vegetarierin
      prompt: I'm vegetarian. (f.) = Ich bin ___.
    - correct_answer: allergisch
      prompt: I'm allergic to... = Ich bin ___ gegen...
    - correct_answer: Glutenfrei
      prompt: Gluten-free = ___
    - correct_answer: Schnitzel
      prompt: Das ist ein ___. → That is a schnitzel.
    title: Was ist das?
    type: drill
  - type: vocab_review
  - content: '*Two friends arrive at a Biergarten in Munich on a sunny afternoon. Long wooden tables stretch under chestnut
      trees. A waiter approaches.*


      <span lang="de">— Guten Tag! Einen Tisch für zwei, bitte.</span>


      <span lang="de">— Natürlich. Hier, bitte. Die Speisekarte.</span>


      <span lang="de">— Danke. Was ist das hier?</span> *pointing at the menu*


      <span lang="de">— Das ist die Weißwurst. Eine Spezialität aus Bayern.</span>


      <span lang="de">— Ah, interessant! Ich möchte die Weißwurst und eine Brezel, bitte.</span>


      <span lang="de">— Und zu trinken?</span>


      <span lang="de">— Eine Apfelschorle, bitte. Ich bin Vegetarierin.</span>


      <span lang="de">— Kein Problem. Und für Sie?</span>


      <span lang="de">— Ein Schnitzel mit Kartoffeln, bitte. Und ein Wasser ohne Kohlensäure.</span>


      <span lang="de">— Sehr gut!</span>

      '
