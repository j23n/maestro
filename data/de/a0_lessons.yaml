  - content: 'Say these sentences out loud. Listen to how the word stress falls on *MAG* and *ge-FÄLLT*:


      **Singular food:**

      <span lang="de">Ich mag Weißwurst.</span> (*ikh mahg VYS-voorst*)

      <span lang="de">Ich mag Brezeln.</span> (*ikh mahg BRAY-tseln*)

      <span lang="de">Ich mag keinen Kaffee.</span> (*ikh mahg KY-nen kah-FAY*)


      **Asking a friend:**

      <span lang="de">Magst du Bier?</span> (*mahkst doo beer*)

      <span lang="de">Magst du Weißwurst?</span> (*mahkst doo VYS-voorst*)


      **Mir gefällt / gefallen:**

      <span lang="de">Mir gefällt der Biergarten.</span> (*meer geh-FELLT dair BEER-gar-ten*)

      <span lang="de">Mir gefallen die Würste.</span> (*meer geh-FAH-len dee VOOR-steh*)


      Now say two things YOU like and one thing you don''t like. Use <span lang="de">Ich mag...</span> and <span lang="de">Ich
      mag kein/keine...</span>

