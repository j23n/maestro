a0-04-in-der-stadt:
  activities:
  - type: vocab_review
  - content: '## "The" in German: der, die, das


      Every German noun has one of **three genders**: masculine, feminine, or neuter. The word for "the" changes depending
      on the gender:


      | Gender | Article | Example |

      |--------|---------|---------|

      | Masculine | <span lang="de">**der**</span> | <span lang="de">**der** Bahnhof</span> (the train station) |

      | Feminine | <span lang="de">**die**</span> | <span lang="de">**die** Kirche</span> (the church) |

      | Neuter | <span lang="de">**das**</span> | <span lang="de">**das** Hotel</span> (the hotel) |


      ### Patterns to help you remember


      - **der** (masculine): male people, days, months — <span lang="de">der Mann, der Montag</span>

      - **die** (feminine): female people, most nouns ending in **-e** — <span lang="de">die Frau, die Straße, die Kirche</span>

      - **das** (neuter): diminutives (-chen, -lein), many foreign loanwords — <span lang="de">das Mädchen, das Hotel</span>


      > **Key habit:** Always learn the article with the noun. Don''t just learn <span lang="de">Bahnhof</span> — learn <span
      lang="de">**der** Bahnhof</span>. This is the most important habit in German!


      **City examples:**

      - <span lang="de">**der** Bahnhof</span> — the train station

      - <span lang="de">**die** Apotheke</span> — the pharmacy

      - <span lang="de">**das** Hotel</span> — the hotel

      '
    description: Every German noun has a gender — and the article changes with it
    grammar_point_code: art_der_die_das
    title: Der, die, das — the
    type: grammar
