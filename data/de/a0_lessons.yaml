  - content: '## The magic words


      These polite phrases will get you through almost any situation on the plane and at the airport:


      | German | Meaning | Pronunciation |

      |--------|---------|---------------|

      | **<span lang="de">Bitte</span>** | Please / You''re welcome | *BIT-uh* |

      | **<span lang="de">Danke!</span>** | Thank you! | *DAHN-kuh* |

      | **<span lang="de">Danke schön!</span>** | Thank you very much! | *DAHN-kuh shurn* |

      | **<span lang="de">Entschuldigung!</span>** | Excuse me! / Sorry! | *ent-SHOOL-dee-goong* |

      | **<span lang="de">Es tut mir leid.</span>** | I''m sorry. | *es toot meer lyte* |


      ### When to use them


      - Flight attendant brings your drink? **<span lang="de">Danke!</span>**

      - Someone thanks you? **<span lang="de">Bitte!</span>** (You''re welcome!)

      - Need to get past someone in the aisle? **<span lang="de">Entschuldigung!</span>**

      - You accidentally bump into someone? **<span lang="de">Es tut mir leid.</span>**


      ### The power phrase: <span lang="de">Ich möchte…</span>


      This one phrase lets you order anything:


      | German | Meaning | Pronunciation |

      |--------|---------|---------------|

      | **<span lang="de">Ich möchte einen Kaffee, bitte.</span>** | I''d like a coffee, please. | *ikh MURK-tuh EYE-nen KAH-feh
      BIT-uh* |

      | **<span lang="de">Ich möchte ein Wasser, bitte.</span>** | I''d like a water, please. | *ikh MURK-tuh eyen VAH-ser
      BIT-uh* |


      > **<span lang="de">Ich möchte</span>** means "I would like" — it''s polite and natural. Learn it as a chunk for now.

      '
    description: Thank you, please, excuse me, and ordering
    grammar_point_code: hoeflich_ausdruecke
    title: Polite phrases
    type: grammar
