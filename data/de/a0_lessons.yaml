  - content: '## Ich möchte — I would like


      <span lang="de">**Ich möchte**</span> (*ikh mœkh-tuh*) is the polite way to order in German. Always use it instead of
      <span lang="de">*ich will*</span> (I want) — it''s much more courteous.


      **Formula:** <span lang="de">**Ich möchte**</span> + article + item + <span lang="de">**bitte**</span>


      | Example | Meaning |

      |---------|---------|

      | <span lang="de">*Ich möchte einen Kaffee.*</span> | I''d like a coffee. |

      | <span lang="de">*Ich möchte eine Brezel, bitte.*</span> | I''d like a pretzel, please. |

      | <span lang="de">*Ich möchte ein Wasser.*</span> | I''d like a water. |


      Now add numbers:

      - <span lang="de">*Ich möchte **zwei** Kaffee, bitte.*</span> — I''d like two coffees.

      - <span lang="de">*Ich möchte **drei** Stück Kuchen.*</span> — I''d like three pieces of cake.


      To ask the price:

      - <span lang="de">**Was kostet das?**</span> (*vas kos-tet das*) — How much does that cost?

      '
    description: Ordering politely with numbers
    grammar_point_code: ich_moechte
    title: Ich möchte bestellen
    type: grammar
