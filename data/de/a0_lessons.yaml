  - content: '*After lunch at a Biergarten in Munich, you strike up a conversation with the person at the next table.*


      <span lang="de">— Na, wie war die Weißwurst?</span> *(So, how was the Weißwurst?)*


      <span lang="de">— Sehr gut! Ich mag Weißwurst sehr.</span> *(Very good! I like Weißwurst a lot.)*


      <span lang="de">— Und der Leberkäse? Magst du Leberkäse?</span> *(And the Leberkäse? Do you like Leberkäse?)*


