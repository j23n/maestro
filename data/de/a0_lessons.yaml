    content: '*Emma trifft am Marienplatz einen Deutschen namens Felix.*


      <span lang="de">— Hallo! Ich heiße Felix. Wie heißt du?</span>


      <span lang="de">— Hallo! Ich heiße Emma. Ich bin aus London.</span>


      <span lang="de">— Ah, schön! Magst du München?</span>


      <span lang="de">— Ja, mir gefällt München sehr! Ich mag das Essen hier — die Brezeln und das Schnitzel sind toll.</span>


      <span lang="de">— Super! Möchtest du einen Kaffee? Das Café ist dort — links.</span>


      <span lang="de">— Ja, gerne! Ich möchte einen Kaffee und eine Brezel, bitte.</span>


      *Im Café fragt Emma nach dem Zug.*


      <span lang="de">— Entschuldigung, wann fährt der Zug nach Salzburg?</span>


      <span lang="de">— Um vierzehn Uhr dreißig. Von Gleis sieben.</span>


      <span lang="de">— Danke schön! Auf Wiedersehen, Felix!</span>


      <span lang="de">— Tschüß! Gute Reise!</span>

      '
