  - content: '## Einfache Sätze — Simple Sentences


      German has one golden rule: **the verb goes in second position** (V2 rule).


      ### Subject + Verb + Rest

      - <span lang="de">**Ich komme aus London.**</span> — I come from London.

      - <span lang="de">**Er wohnt in München.**</span> — He lives in Munich.


      ### Saying where you''re from

      - <span lang="de">**Ich komme aus [country/city].**</span> — I come from…

      - <span lang="de">**Ich bin aus [country/city].**</span> — I''m from…

      - <span lang="de">**Woher kommen Sie?**</span> — Where are you from? (formal) *voh-hair KOM-en zee*

      - <span lang="de">**Woher kommst du?**</span> — Where are you from? (informal) *voh-hair KOMST doo*


      ### Nationalities

      | German | English |

      |--------|---------|

      | <span lang="de">deutsch</span> | German |

      | <span lang="de">amerikanisch</span> | American |

      | <span lang="de">englisch</span> | English |

      | <span lang="de">französisch</span> | French |

      | <span lang="de">spanisch</span> | Spanish |


      > **Tip:** For yes/no questions, put the verb *first*: <span lang="de">**Bist du Deutsch?**</span>

      '
    description: Origin, nationality, and simple sentences
    grammar_point_code: einfache_saetze
    title: Woher kommen Sie?
