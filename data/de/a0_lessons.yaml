a0-13-wiederholung:
  activities:
  - type: info
    title: Was du gelernt hast
    description: Summary of A0
    content: '## Glückwunsch!


      In 12 Lektionen hast du gelernt:


      - **Begrüßen und verabschieden:** <span lang="de">Hallo, Guten Tag, Guten Morgen, Auf Wiedersehen, Tschüß, Servus</span>

      - **Höflich sein:** <span lang="de">Bitte, Danke, Danke schön, Entschuldigung, Es tut mir leid</span>

      - **Um Hilfe bitten:** <span lang="de">Ich verstehe nicht., Sprechen Sie Englisch?, Noch einmal, bitte.</span>

      - **Bestellen:** <span lang="de">Ich möchte + ein/eine + item + bitte</span>

      - **Zählen und bezahlen:** Zahlen 0–100, <span lang="de">Was kostet das?</span>

      - **Nach dem Weg fragen:** <span lang="de">Wo ist...? Rechts, links, geradeaus</span>

      - **Die Uhrzeit sagen:** <span lang="de">Wie spät ist es? Es ist drei Uhr. Halb vier.</span>

      - **Fahrkarten kaufen:** <span lang="de">Fahrkarte, hin und zurück, Gleis</span>

      - **Sich vorstellen:** <span lang="de">Ich heiße... Ich bin aus... Ich bin + Nationalität</span>

      - **sein und haben:** <span lang="de">bin, bist, ist / habe, hast, hat</span>

      - **Vorlieben ausdrücken:** <span lang="de">Ich mag / Ich mag kein / Mir gefällt</span>

      - **Probleme beschreiben:** <span lang="de">Ich habe ein Problem. Ich habe ... verloren. Ich brauche...</span>

      - **Artikel:** <span lang="de">der/die/das, ein/eine, die (Plural)</span>


      <span lang="de">**Sehr gut gemacht!**</span>

      '
