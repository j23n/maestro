a0-03-im-cafe:
  activities:
  - type: vocab_review
  - content: '## Ein und eine — a / an in German


      When you order in a German café, you need the right word for "a":


      - <span lang="de">**ein**</span> = a (masculine) — <span lang="de">ein Kaffee, ein Kuchen, ein Tisch</span>

      - <span lang="de">**eine**</span> = a (feminine) — <span lang="de">eine Brezel, eine Tasse, eine Torte</span>

      - <span lang="de">**ein**</span> = a (neuter) — <span lang="de">ein Bier, ein Wasser, ein Stück</span>


      | Gender | Article | Example |

      |--------|---------|---------|

      | masculine (<span lang="de">der</span>) | <span lang="de">**ein**</span> | <span lang="de">ein Kaffee</span> |

      | feminine (<span lang="de">die</span>) | <span lang="de">**eine**</span> | <span lang="de">eine Brezel</span> |

      | neuter (<span lang="de">das</span>) | <span lang="de">**ein**</span> | <span lang="de">ein Wasser</span> |


      > **Tip:** Masculine and neuter look the same — both use <span lang="de">**ein**</span>. Only feminine is different:
      <span lang="de">**eine**</span>.


      **Cultural note:** In Bavaria, a café visit means *Kaffee und Kuchen* — coffee and cake. It''s a beloved afternoon tradition!

      '
    description: A/an in German
    grammar_point_code: art_ein_eine
    title: Ein Kaffee, eine Brezel
    type: grammar
  - description: Choose the right article
    exercise_type: fill_blank
    grammar_point_code: art_ein_eine
