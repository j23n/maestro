  - content: '## German sounds — reference card


      Great news: German spelling is mostly **phonetic** — once you know the sounds, you can read almost any word!


      ### The special vowels (Umlaute)


      | Letter | Sound | Example | Pronunciation |

      |--------|-------|---------|---------------|

      | **<span lang="de">ä</span>** | like "eh" (open) | <span lang="de">spät</span> (late) | *shpayt* |

      | **<span lang="de">ö</span>** | like "ur" — round your lips | <span lang="de">schön</span> (beautiful) | *shurn* |

      | **<span lang="de">ü</span>** | say "ee" with rounded lips | <span lang="de">Tschüss</span> (bye) | *chüss* |


      ### Tricky consonants


      | Letters | Sound | Example | Pronunciation |

      |---------|-------|---------|---------------|

      | **<span lang="de">w</span>** | like English "v" | <span lang="de">Wasser</span> (water) | *VAH-ser* |

      | **<span lang="de">v</span>** | like English "f" | <span lang="de">Vielen Dank</span> (many thanks) | *FEE-len dahnk*
      |

      | **<span lang="de">z</span>** | like "ts" | <span lang="de">Zusammen</span> (together) | *tsoo-ZAH-men* |

      | **<span lang="de">sch</span>** | like English "sh" | <span lang="de">schön</span> (beautiful) | *shurn* |

      | **<span lang="de">ch</span>** | soft hiss (after e/i) | <span lang="de">ich</span> (I) | *ikh* |

      | **<span lang="de">ß</span>** | like "ss" | <span lang="de">Straße</span> (street) | *SHTRAH-suh* |

      | **<span lang="de">ei</span>** | like "eye" | <span lang="de">nein</span> (no) | *nine* |

      | **<span lang="de">ie</span>** | like "ee" | <span lang="de">viel</span> (much) | *feel* |


      ### Quick tips

      - Stress usually falls on the **first syllable**: <span lang="de">**Dan**-ke</span>, <span lang="de">**Hal**-lo</span>,
      <span lang="de">**Mor**-gen</span>.

      - German **W** sounds like English **V** — and German **V** sounds like English **F**. This surprises everyone at first!

      - <span lang="de">**ß**</span> (called Eszett) is simply a fancy way to write **ss**.


      > You don''t need to memorise this now — come back whenever you meet a new word.

      '
    description: A pronunciation reference card for German
    grammar_point_code: aussprache_bas
    title: German sounds
    type: grammar
  - content: 'Say these phrases out loud, one after the other. Imagine the flight attendant is right in front of you!


      **<span lang="de">Guten Morgen!</span>** (*GOO-ten MOR-gen*) ... **<span lang="de">Ich möchte einen Kaffee, bitte.</span>**
      (*ikh MURK-tuh EYE-nen KAH-feh BIT-uh*) ... **<span lang="de">Danke schön!</span>** (*DAHN-kuh shurn*) ... **<span lang="de">Auf
      Wiedersehen!</span>** (*owf VEE-der-zay-en*)


      Try to say them smoothly, without pausing too long. Germans will love the effort — and now you''re ready to land in
      Munich!

      '
    description: Practise your first German phrases out loud
    grammar_point_codes:
    - begruessungen
    - hoeflich_ausdruecke
    - aussprache_bas
    title: Say it out loud
    type: speaking
a0-02-im-hotel:
  activities:
  - type: vocab_review
  - content: '## Sich vorstellen — Introducing yourself


      In German, the most natural way to say your name is:


      > <span lang="de">**Ich heiße...**</span> (*ikh HY-suh*) — My name is...


      **The formula is simple:**

      <span lang="de">**Ich heiße**</span> + [your name]


      ### Examples

      - <span lang="de">**Ich heiße Anna.**</span> — My name is Anna.

      - <span lang="de">**Ich heiße Thomas.**</span> — My name is Thomas.

      - <span lang="de">**Mein Name ist Sofia.**</span> (*myne NAH-muh ist*) — My name is Sofia.


      ### Asking someone''s name

      - <span lang="de">**Wie heißen Sie?**</span> (*vee HY-sun zee*) — What is your name? (formal)

      - <span lang="de">**Wie heißt du?**</span> (*vee hysst doo*) — What is your name? (informal)


      > **Tip:** At a hotel reception, always use <span lang="de">**Sie**</span> (formal). It shows respect and is standard
      with strangers.

      '
    description: Giving your name at the hotel
    grammar_point_code: ich_heisse
    title: Ich heiße...
    type: grammar
  - description: Introduce yourself at reception
    exercise_type: fill_blank
