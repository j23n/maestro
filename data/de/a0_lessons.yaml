    type: drill
  - content: '## Wo ist...? — Where is...?


      <span lang="de">**Wo ist...?**</span> means "Where is...?" — simply add the noun after it:


      > <span lang="de">**Wo ist**</span> + [the place]


      ### Examples


      - <span lang="de">**Wo ist der Bahnhof?**</span> — Where is the train station?

      - <span lang="de">**Wo ist die Apotheke?**</span> — Where is the pharmacy?

      - <span lang="de">**Wo ist das Hotel?**</span> — Where is the hotel?


      ### Getting attention first


      Start with <span lang="de">**Entschuldigung!**</span> (*en-tshool-dee-goong*) to politely get someone''s attention —
      like "Excuse me!"


      ### Basic directions


      - <span lang="de">**rechts**</span> (*rexts*) — on the right

      - <span lang="de">**links**</span> (*links*) — on the left

      - <span lang="de">**geradeaus**</span> (*geh-rah-deh-ows*) — straight ahead

      - <span lang="de">**hier**</span> (*heer*) — here

      - <span lang="de">**dort / da**</span> (*dort / dah*) — there


      > <span lang="de">*Entschuldigung, wo ist die Apotheke?*</span>

      > <span lang="de">*Geradeaus, dann rechts.*</span>

      '
    description: Asking where things are and understanding basic directions
    grammar_point_code: wo_ist
    title: Wo ist...? — Where is it?
