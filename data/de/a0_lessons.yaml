  - content: '## Am Bahnhof — At the Station


      | German | Pronunciation | English |

      |--------|--------------|--------|

      | <span lang="de">**der Zug**</span> | *tsoog* | the train |

      | <span lang="de">**die Fahrkarte**</span> | *far-kar-tuh* | the ticket |

      | <span lang="de">**einfach**</span> | *ine-fakh* | one way |

      | <span lang="de">**hin und zurück**</span> | *hin oont tsoo-rück* | round trip |

      | <span lang="de">**das Gleis**</span> | *glice* | the platform / track |

      | <span lang="de">**die Haltestelle**</span> | *hal-tuh-shtel-uh* | the stop (bus/tram) |

      | <span lang="de">**der Bahnhof**</span> | *bahn-hoff* | the train station |

      | <span lang="de">**die Abfahrt**</span> | *ap-fart* | the departure |

      | <span lang="de">**die Ankunft**</span> | *an-koonft* | the arrival |

      | <span lang="de">**die S-Bahn**</span> | *ess-bahn* | the suburban train |

      | <span lang="de">**die U-Bahn**</span> | *oo-bahn* | the metro / underground |

      | <span lang="de">**der Flughafen**</span> | *floog-hah-fen* | the airport |


      ### Essential travel phrases


      - <span lang="de">**Ich möchte eine Fahrkarte nach Salzburg.**</span> — I''d like a ticket to Salzburg.

      - <span lang="de">**Hin und zurück.**</span> — Round trip.

      - <span lang="de">**Wann fährt der Zug?**</span> — When does the train leave?

      - <span lang="de">**Von welchem Gleis?**</span> — From which platform?

      - <span lang="de">**Was kostet die Fahrkarte?**</span> — How much is the ticket?

      - <span lang="de">**Wo ist die Haltestelle?**</span> — Where is the stop?


      > **Tip:** At München Hauptbahnhof, trains to Austria depart from high-numbered platforms. Always check the *Abfahrtstafel*
      (departures board)!

      '
