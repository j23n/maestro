  - audio_path: /static/audio/a0_07_das_mag_ich.wav
    content: '<span lang="de">— Magst du Weißwurst?</span>

      <span lang="de">— Ja! Ich mag Weißwurst sehr. Und ich mag Brezeln.</span>

