a0-01-im-flugzeug:
  activities:
  - content: What's your name? Type it below — we'll show you how to say it in German!
    description: Tell us your name
    profile_field: name
    response_template: 'Nice to meet you! In German you''d say: **<span lang="de">Ich heiße {answer}.</span>** (*ikh HY-suh*)
      — "My name is {answer}."

      '
    title: Wie heißt du?
    type: onboarding
  - content: '## Your first German words


      You''re on the plane to Munich. The flight attendant smiles and says something — and now you''ll know exactly what to
      say back.


      ### Greetings


      | German | Meaning | When | Pronunciation |

      |--------|---------|------|---------------|

      | **<span lang="de">Hallo!</span>** | Hello! | Informal, any time | *HAH-lo* |

      | **<span lang="de">Guten Morgen!</span>** | Good morning! | Before noon | *GOO-ten MOR-gen* |

      | **<span lang="de">Guten Tag!</span>** | Good day! | Formal, daytime | *GOO-ten TAHK* |

      | **<span lang="de">Guten Abend!</span>** | Good evening! | Formal, evening | *GOO-ten AH-bent* |

      | **<span lang="de">Auf Wiedersehen!</span>** | Goodbye! | Formal | *owf VEE-der-zay-en* |

      | **<span lang="de">Tschüss!</span>** | Bye! | Informal | *chüss* |


      ### Formal vs informal


      | | Formal | Informal |

      |---|---|---|

      | **Hello** | <span lang="de">Guten Tag!</span> | <span lang="de">Hallo!</span> |

      | **Goodbye** | <span lang="de">Auf Wiedersehen!</span> | <span lang="de">Tschüss!</span> |


      ### Bavarian bonus


      Munich is in Bavaria — you may also hear:


      | German | Meaning | Note |

      |--------|---------|------|

      | **<span lang="de">Grüß Gott!</span>** | Hello! | Formal, Southern Germany |

      | **<span lang="de">Servus!</span>** | Hi! / Bye! | Informal, Bavaria & Austria |


      > **Tip:** When in doubt, use <span lang="de">**Guten Tag**</span>. Germans will switch to informal if they prefer it.

      '
    description: Hello, goodbye, and formal vs informal
    grammar_point_code: begruessungen
    title: Greetings
    type: grammar
  - description: Practise greetings
    exercise_type: fill_blank
    grammar_point_code: begruessungen
    hint: Think about the time of day and whether the situation is formal or informal.
    items:
