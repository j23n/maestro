a0-10-neue-leute:
  activities:
  - type: vocab_review
  - content: '## Das Verb *sein* (to be)


      In German, <span lang="de">**sein**</span> means *to be*. It is irregular — you simply need to learn each form.


      | German | English |

      |--------|---------|

      | <span lang="de">ich **bin**</span> | I am |

      | <span lang="de">du **bist**</span> | you are (informal) |

      | <span lang="de">er/sie/es **ist**</span> | he/she/it is |

      | <span lang="de">wir **sind**</span> | we are |

      | <span lang="de">sie/Sie **sind**</span> | they/you (formal) are |


      **Examples:**

      - <span lang="de">*Ich bin Anna.*</span> — I am Anna.

      - <span lang="de">*Du bist sehr nett.*</span> — You are very nice.

      - <span lang="de">*Er ist aus München.*</span> — He is from Munich.

      - <span lang="de">*Sie sind Herr Müller?*</span> — You are Mr. Müller? (formal)


      > **Focus now on:** <span lang="de">bin</span>, <span lang="de">bist</span>, and <span lang="de">ist</span> — you''ll
      use these most in this lesson!

      '
    description: The most important German verb
    grammar_point_code: sein_praesens
    title: Sein — to be
    type: grammar
  - description: Fill in the correct form of sein
    exercise_type: fill_blank
    grammar_point_code: sein_praesens
    hint: ich → bin, du → bist, er/sie/es → ist, wir/sie/Sie → sind
    items:
    - correct_answer: bin
      prompt: I am Anna. = Ich ___ Anna.
    - correct_answer: bist
      prompt: Are you German? = Du ___ Deutsch?
    - correct_answer: ist
      prompt: He is from Munich. = Er ___ aus München.
    - correct_answer: ist
      prompt: She is a student. = Sie ___ Studentin.
    - correct_answer: sind
      prompt: You are Mr. Müller? (formal) = Sie ___ Herr Müller?
    - correct_answer: sind
      prompt: We are from Berlin. = Wir ___ aus Berlin.
    title: Sein — verb forms
    type: drill
  - content: '## Personalpronomen (Subject Pronouns)


      Subject pronouns tell us *who* is doing the action. German has a formal "you" that English no longer has.


      | German | English |

      |--------|---------|

      | <span lang="de">**ich**</span> | I |

      | <span lang="de">**du**</span> | you (informal) |

      | <span lang="de">**er**</span> | he |

      | <span lang="de">**sie**</span> | she |

      | <span lang="de">**es**</span> | it |

      | <span lang="de">**wir**</span> | we |

      | <span lang="de">**sie**</span> | they |

      | <span lang="de">**Sie**</span> | you (formal — always capitalised) |


      **Examples:**

      - <span lang="de">**Ich** bin Thomas.</span> — *I* am Thomas.

      - <span lang="de">**Du** bist nett.</span> — *You* are nice.

      - <span lang="de">**Er** kommt aus Berlin.</span> — *He* comes from Berlin.

      - <span lang="de">**Sie** ist Studentin.</span> — *She* is a student.


      > **Tip:** <span lang="de">sie</span> (lowercase) = "she" or "they". <span lang="de">Sie</span> (capital S) = formal
      "you". Context — and the verb — make it clear!

      '
    description: Subject pronouns in German
    grammar_point_code: personalpronomen
    title: Ich, du, er, sie — pronouns
    type: grammar
