a0-11-ein-problem:
  activities:
  - type: vocab_review
  - content: '## When things go wrong


      You may already know <span lang="de">*Entschuldigung*</span> and <span lang="de">*Danke*</span>. Here''s the full toolkit
      for staying calm:


      - <span lang="de">**Langsamer, bitte.**</span> — More slowly, please.

      - <span lang="de">**Ich verstehe nicht.**</span> — I don''t understand.

      - <span lang="de">**Können Sie das wiederholen?**</span> — Can you repeat that?

      - <span lang="de">**Sprechen Sie Englisch?**</span> — Do you speak English?

      - <span lang="de">**Können Sie mir helfen?**</span> — Can you help me?

      '
    description: Phrases for when it's all too fast or confusing
    grammar_point_code: hoeflich_ausdruecke
    title: Slowing things down
    type: grammar
  - description: What do you say in each situation?
    exercise_type: fill_blank
    grammar_point_code: hoeflich_ausdruecke
    hint: Think about the situation — which phrase fits?
    items:
    - correct_answer: Langsamer
      prompt: More slowly, please. = ___ , bitte.
    - correct_answer: nicht
      prompt: I don't understand. = Ich verstehe ___.
    - correct_answer: Englisch
      prompt: Do you speak English? = Sprechen Sie ___?
    - correct_answer: helfen
      prompt: Can you help me? = Können Sie mir ___?
    - correct_answer: Entschuldigung
      prompt: Excuse me! (to get attention) = ___!
    title: Staying calm
    type: drill
  - content: '## Ich habe — I have, I need, I''ve lost


      When things go wrong, <span lang="de">**ich habe**</span> (I have) is your most useful phrase:


      | Pattern | Meaning | Example |

      |---------|---------|---------|

      | <span lang="de">**Ich habe ein Problem.**</span> | I have a problem. | <span lang="de">Ich habe ein Problem.</span>
      |

      | <span lang="de">**Ich habe ... verloren.**</span> | I''ve lost ... | <span lang="de">Ich habe meinen Pass verloren.</span>
      |

      | <span lang="de">**Ich brauche ...**</span> | I need ... | <span lang="de">Ich brauche einen Arzt.</span> |


      Here are all the forms of <span lang="de">**haben**</span>:


      | German | English |

      |--------|---------|

      | <span lang="de">ich **habe**</span> | I have |

      | <span lang="de">du **hast**</span> | you have |

      | <span lang="de">er/sie/es **hat**</span> | he/she/it has |


      ### More examples


      - <span lang="de">**Ich habe Hunger.**</span> — I''m hungry. (literally: I have hunger.)

      - <span lang="de">**Ich habe mein Portemonnaie verloren.**</span> — I''ve lost my wallet.

      - <span lang="de">**Ich brauche Hilfe.**</span> — I need help.

      '
    description: Saying what you have, what you need, and what you've lost
    grammar_point_code: haben_praesens
    title: Ich habe / Ich brauche / Ich habe verloren
    type: grammar
  - description: What you need and what you've lost
    exercise_type: fill_blank
    grammar_point_code: haben_praesens
    hint: Ich habe ... verloren = I've lost. Ich brauche = I need.
    items:
    - correct_answer: habe
      prompt: I have a problem. = Ich ___ ein Problem.
    - correct_answer: verloren
      prompt: I've lost my wallet. = Ich habe mein Portemonnaie ___.
    - correct_answer: brauche
      prompt: I need help. = Ich ___ Hilfe.
    - correct_answer: hast
      prompt: You have a ticket. = Du ___ ein Ticket.
    - correct_answer: hat
      prompt: She has a problem. = Sie ___ ein Problem.
    - correct_answer: Arzt
      prompt: I need a doctor. = Ich brauche einen ___.
    title: Ich habe / Ich brauche
    type: drill
  - content: '## Notfall-Phrasen — Emergency phrases


      Hopefully you won''t need these, but just in case:


      - <span lang="de">**Hilfe!**</span> — Help! (*hill-feh*)

      - <span lang="de">**Notruf: 110 (Polizei), 112 (Feuerwehr / Notarzt)**</span> — Emergency: 110 (police), 112 (fire /
      ambulance)

      - <span lang="de">**Wo ist die Apotheke?**</span> — Where is the pharmacy? (*voh ist dee ah-po-tay-keh*)

      - <span lang="de">**Wo ist das Krankenhaus?**</span> — Where is the hospital?

      - <span lang="de">**Ich brauche einen Arzt.**</span> — I need a doctor.


      > German pharmacies (<span lang="de">*Apotheken*</span>) display a red letter A sign. Pharmacists can advise on minor
      ailments without a prescription.


      ### Negation


      Use <span lang="de">**nicht**</span> to say "not":

      - <span lang="de">**Ich verstehe nicht.**</span> — I don''t understand.

      - <span lang="de">**Das ist nicht richtig.**</span> — That is not correct.


      Use <span lang="de">**kein/keine**</span> to negate nouns:

      - <span lang="de">**Ich habe kein Portemonnaie.**</span> — I don''t have a wallet.

      '
    description: Key phrases for emergencies and negation
    grammar_point_code: ja_nein_nicht
    title: Notfall und Verneinung
    type: grammar
  - description: Practice emergency and negation phrases
    exercise_type: fill_blank
    grammar_point_code: ja_nein_nicht
    hint: Hilfe = help. Nicht = not. Kein/keine = no/not a.
    items:
    - correct_answer: Hilfe
      prompt: Help! = ___!
    - correct_answer: Apotheke
      prompt: Where is the pharmacy? = Wo ist die ___?
    - correct_answer: Krankenhaus
      prompt: Where is the hospital? = Wo ist das ___?
    - correct_answer: nicht
      prompt: I don't understand. = Ich verstehe ___.
    - correct_answer: kein
      prompt: I don't have a wallet. = Ich habe ___ Portemonnaie.
    - correct_answer: nein
      prompt: No, I don't have a ticket. = ___, ich habe kein Ticket.
    title: Notfall-Drill
    type: drill
  - type: vocab_review
  - content: '*A tourist stops a passerby on the street, looking worried.*


      <span lang="de">— Entschuldigung! Können Sie mir helfen?</span>


      <span lang="de">— Ja, natürlich. Was ist los?</span>


