a0-12-letzter-tag:
  activities:
  - type: vocab_review
  - content: '## Saying goodbye in German


      It''s your last day in Munich. Here are all the farewell phrases you need:


      - <span lang="de">**Auf Wiedersehen!**</span> — Goodbye! (formal) *owf VEE-der-zay-en*

      - <span lang="de">**Tschüß!**</span> — Bye! (informal) *choos*

      - <span lang="de">**Bis bald!**</span> — See you soon! *biss balt*

      - <span lang="de">**Bis morgen!**</span> — See you tomorrow! *biss MOR-gen*

      - <span lang="de">**Gute Reise!**</span> — Have a good trip! *GOO-teh RYE-zeh*

      - <span lang="de">**Servus!**</span> — Bye! (Bavarian informal) *ZAIR-voos*


      ### Expressing thanks


      - <span lang="de">**Danke!**</span> — Thanks! *DAHN-keh*

      - <span lang="de">**Danke schön!**</span> — Thank you! *DAHN-keh shurn*

      - <span lang="de">**Vielen Dank!**</span> — Many thanks! *FEE-len dahnk*

      - <span lang="de">**Vielen Dank für alles!**</span> — Thank you for everything! *FEE-len dahnk fyur AH-les*

      - <span lang="de">**Es war wunderbar!**</span> — It was wonderful! *es var VOON-der-bar*


      > **Bavarian tip:** In Munich, locals often say <span lang="de">**Servus**</span> both as a hello and a goodbye. You''ll
      hear it everywhere from the hotel to the Viktualienmarkt!

      '
    description: Farewell phrases and thanks
    grammar_point_code: begruessungen
    title: Goodbyes and thanks
    type: grammar
