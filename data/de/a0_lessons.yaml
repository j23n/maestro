  - audio_path: /static/audio/a0_10_neue_leute.wav
    content: '*A woman approaches a man standing near the Eisbach viewing bridge. She strikes up a conversation.*


      <span lang="de">— Guten Tag! Mein Name ist Petra. Und Sie?</span>


      <span lang="de">— Guten Tag! Ich bin James.</span>


      <span lang="de">— Woher kommen Sie, James?</span>


