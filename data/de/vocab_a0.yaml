# A0 Vocabulary — words and phrases not in the DWDS dictionary
#
# These entries create VocabularyWord + VocabularyWordDefinition(student_level="A0")
# records.  Words already in the DWDS dictionary (the vast majority of A0 vocab)
# are handled automatically by the standard ingest pipeline.
#
# All entries are implicitly cefr_level: A0.
#
# Single words here are only those truly absent from DWDS (compound numbers).
# Inflected forms (möchte, heiße, Magst, etc.) resolve via spaCy lemmatisation.
#
# Phrases are limited to genuinely idiomatic or non-compositional expressions
# where understanding the individual words doesn't convey the meaning.
# Compositional phrases (e.g. "Wo ist der Bahnhof") are better learned by
# understanding each word separately.

##############################################################################
# Single words — compound numbers not in DWDS
##############################################################################

- word: einundzwanzig
