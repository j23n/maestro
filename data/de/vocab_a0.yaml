- word: Wie bitte
  part_of_speech: loc.
  ipa: /ˌviː ˈbɪtə/
  translation: pardon? (lit. how please)

- word: Ein bisschen
  part_of_speech: loc.
  ipa: /aɪ̯n ˈbɪsçən/
  translation: a little

- word: Kein Problem
  part_of_speech: loc.
  ipa: /kaɪ̯n pʁoˈbleːm/
