  category: verb
  subcategory: Modus
  label: Konjunktiv II haben und können
  description: Konjunktiv II forms of haben and können used for polite requests and
    hypothetical statements, extending the A1 coverage of mögen/werden.
  examples:
  - Ich hätte gerne ein Brot, bitte.
  - Könnten Sie bitte zu mir kommen.
  source_note: Konjunktiv II der Verben haben*, können* (mögen and werden already
    in A1)
  explanations: {}

- code: dativ_case_nouns
  cefr_level: A2
  category: nomen
  subcategory: Kasus
  label: Dativ aller Nomen der Wortliste
  description: The dative case for all nouns in the A2 word list, extending A1 coverage
    of nominative and accusative cases.
  examples:
  - dem Mann
  - Gib mir bitte mal dein Wörterbuch.
  - Kann ich dir helfen?
  source_note: Nominativ, Akkusativ, Dativ* aller Nomen in der Wortliste
  explanations: {}

- code: genitiv_eigennamen
  cefr_level: A2
  category: nomen
  subcategory: Kasus
  label: Genitiv bei Eigennamen im Singular
  description: Genitive case used with proper names (Eigennamen) in the singular to
    express possession.
  examples:
  - Karls Freunde kommen heute Nachmittag.
  source_note: Genitiv bei Eigennamen im Singular
  explanations: {}

- code: genitiv_receptive
  cefr_level: A2
  category: nomen
  subcategory: Kasus
  label: Genitiv rezeptiv
  description: Receptive understanding of the genitive case with definite articles,
    recognising possession or attribution without requiring active production.
  examples:
  - die Nummer des Wagens
  source_note: Genitiv (rezeptiv)
  explanations: {}

- code: genitiv_ersatzform
  cefr_level: A2
  category: nomen
  subcategory: Kasus
  label: Genitiv Ersatzform mit von
  description: The use of 'von + Dativ' as a colloquial substitute for the genitive
    case to express possession or association.
  examples:
  - Freunde von Karl kommen heute.
  source_note: Ersatzform* — von + Dativ as substitute for genitive
  explanations: {}

- code: indef_pronoun_jemand
  cefr_level: A2
