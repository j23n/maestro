  subcategory: Pronomen
  label: Indefinitpronomen jemand und niemand
  description: The indefinite pronouns jemand (someone) and niemand (no one) used
    to refer to unspecified persons.
  examples:
  - Hat jemand meine Schlüssel gesehen?
  - Hier ist niemand.
  source_note: 'Indefinit: jemand*, niemand*'
  explanations: {}

- code: interrogativ_welch
