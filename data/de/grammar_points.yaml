- code: present_tense
  cefr_level: A1
  category: verb
  subcategory: Tempus
  label: Präsens aller Verben der Wortliste
  description: Present tense forms of all verbs in the A1 word list, including regular,
    irregular, and mixed verbs.
  examples:
  - Kommst du mit?
  - Wann fängt der Kurs an?
  - Wo kaufst du gerne ein?
  source_note: Präsens aller Verben der Wortliste
  explanations:
    en:
      title: The present tense in German
      tip: German present tense is formed by adding personal endings to the verb stem.
        Most verbs follow a regular pattern, but some common verbs change their stem
        vowel in the du and er/sie/es forms.
      explanation: |-
        ## The German Present Tense (<span lang="de">Präsens</span>)

        The <span lang="de">Präsens</span> (present tense) is used to describe actions happening now, habitual actions, and general facts. It is the foundation of German verb grammar.

        ---

        ### 1. Regular Verbs (<span lang="de">regelmäßige Verben</span>)

        To form the present tense, find the **stem** by removing <span lang="de">-en</span> (or <span lang="de">-n</span>) from the infinitive, then add the personal endings.

        | Pronoun | Ending | Example: <span lang="de">kommen</span> (to come) |
        |---|---|---|
        | <span lang="de">ich</span> | <span lang="de">-e</span> | <span lang="de">ich komme</span> |
        | <span lang="de">du</span> | <span lang="de">-st</span> | <span lang="de">du kommst</span> |
        | <span lang="de">er/sie/es</span> | <span lang="de">-t</span> | <span lang="de">er kommt</span> |
        | <span lang="de">wir</span> | <span lang="de">-en</span> | <span lang="de">wir kommen</span> |
        | <span lang="de">ihr</span> | <span lang="de">-t</span> | <span lang="de">ihr kommt</span> |
        | <span lang="de">sie/Sie</span> | <span lang="de">-en</span> | <span lang="de">sie kommen</span> |

        ---

        ### 2. Stems Ending in <span lang="de">-t</span>, <span lang="de">-d</span>, or Consonant Clusters

        When the verb stem ends in <span lang="de">-t</span>, <span lang="de">-d</span>, or a difficult consonant cluster (e.g. <span lang="de">-fn</span>, <span lang="de">-gn</span>), an extra <span lang="de">-e-</span> is inserted before the <span lang="de">-st</span> and <span lang="de">-t</span> endings to make pronunciation easier.

        | Pronoun | <span lang="de">arbeiten</span> (to work) | <span lang="de">finden</span> (to find) |
        |---|---|---|
        | <span lang="de">ich</span> | <span lang="de">arbeite</span> | <span lang="de">finde</span> |
        | <span lang="de">du</span> | <span lang="de">arbeitest</span> | <span lang="de">findest</span> |
        | <span lang="de">er/sie/es</span> | <span lang="de">arbeitet</span> | <span lang="de">findet</span> |
        | <span lang="de">wir</span> | <span lang="de">arbeiten</span> | <span lang="de">finden</span> |
        | <span lang="de">ihr</span> | <span lang="de">arbeitet</span> | <span lang="de">findet</span> |
        | <span lang="de">sie/Sie</span> | <span lang="de">arbeiten</span> | <span lang="de">finden</span> |

        ---

        ### 3. Stems Ending in a Sibilant (<span lang="de">-s</span>, <span lang="de">-ss</span>, <span lang="de">-ß</span>, <span lang="de">-z</span>)

        When the stem ends in a sibilant, the <span lang="de">du</span>-form loses the <span lang="de">-s</span> of the ending (because the stem already provides it), leaving only <span lang="de">-t</span>.

        - <span lang="de">heißen</span> → stem <span lang="de">heiß-</span> → <span lang="de">du heißt</span> (not <span lang="de">~~du heißst~~</span>)
        - <span lang="de">reisen</span> → stem <span lang="de">reis-</span> → <span lang="de">du reist</span>

        ---

        ### 4. Strong (Irregular) Verbs — Stem Vowel Change

        Many very common German verbs change their stem vowel in the <span lang="de">du</span> and <span lang="de">er/sie/es</span> forms. The <span lang="de">ich</span>, <span lang="de">wir</span>, <span lang="de">ihr</span>, and <span lang="de">sie/Sie</span> forms are regular. There are three main patterns:

        #### Pattern A: <span lang="de">a → ä</span>

        | Pronoun | <span lang="de">fahren</span> (to drive/go) | <span lang="de">schlafen</span> (to sleep) |
        |---|---|---|
        | <span lang="de">ich</span> | <span lang="de">fahre</span> | <span lang="de">schlafe</span> |
        | <span lang="de">du</span> | <span lang="de">fährst</span> | <span lang="de">schläfst</span> |
        | <span lang="de">er/sie/es</span> | <span lang="de">fährt</span> | <span lang="de">schläft</span> |
        | <span lang="de">wir</span> | <span lang="de">fahren</span> | <span lang="de">schlafen</span> |
        | <span lang="de">ihr</span> | <span lang="de">fahrt</span> | <span lang="de">schlaft</span> |
        | <span lang="de">sie/Sie</span> | <span lang="de">fahren</span> | <span lang="de">schlafen</span> |

        Other common verbs: <span lang="de">anfangen</span> (to begin) → <span lang="de">fängst an / fängt an</span>; <span lang="de">tragen</span> (to carry/wear) → <span lang="de">trägst / trägt</span>

        #### Pattern B: <span lang="de">e → i</span>

        | Pronoun | <span lang="de">sprechen</span> (to speak) | <span lang="de">helfen</span> (to help) |
        |---|---|---|
        | <span lang="de">ich</span> | <span lang="de">spreche</span> | <span lang="de">helfe</span> |
        | <span lang="de">du</span> | <span lang="de">sprichst</span> | <span lang="de">hilfst</span> |
        | <span lang="de">er/sie/es</span> | <span lang="de">spricht</span> | <span lang="de">hilft</span> |
        | <span lang="de">wir</span> | <span lang="de">sprechen</span> | <span lang="de">helfen</span> |
        | <span lang="de">ihr</span> | <span lang="de">sprecht</span> | <span lang="de">helft</span> |
        | <span lang="de">sie/Sie</span> | <span lang="de">sprechen</span> | <span lang="de">helfen</span> |

        Other common verbs: <span lang="de">essen</span> (to eat) → <span lang="de">isst</span>; <span lang="de">geben</span> (to give) → <span lang="de">gibt</span>; <span lang="de">nehmen</span> (to take) → <span lang="de">nimmst / nimmt</span>; <span lang="de">treffen</span> (to meet) → <span lang="de">trifft</span>

        #### Pattern C: <span lang="de">e → ie</span>

        | Pronoun | <span lang="de">lesen</span> (to read) | <span lang="de">sehen</span> (to see) |
        |---|---|---|
        | <span lang="de">ich</span> | <span lang="de">lese</span> | <span lang="de">sehe</span> |
        | <span lang="de">du</span> | <span lang="de">liest</span> | <span lang="de">siehst</span> |
        | <span lang="de">er/sie/es</span> | <span lang="de">liest</span> | <span lang="de">sieht</span> |
        | <span lang="de">wir</span> | <span lang="de">lesen</span> | <span lang="de">sehen</span> |
        | <span lang="de">ihr</span> | <span lang="de">lest</span> | <span lang="de">seht</span> |
        | <span lang="de">sie/Sie</span> | <span lang="de">lesen</span> | <span lang="de">sehen</span> |

        ---

        ### 5. Fully Irregular Verbs: <span lang="de">sein</span>, <span lang="de">haben</span>, <span lang="de">werden</span>

        These three verbs are used constantly and must be memorised separately.

        | Pronoun | <span lang="de">sein</span> (to be) | <span lang="de">haben</span> (to have) | <span lang="de">werden</span> (to become) |
        |---|---|---|---|
        | <span lang="de">ich</span> | <span lang="de">bin</span> | <span lang="de">habe</span> | <span lang="de">werde</span> |
        | <span lang="de">du</span> | <span lang="de">bist</span> | <span lang="de">hast</span> | <span lang="de">wirst</span> |
        | <span lang="de">er/sie/es</span> | <span lang="de">ist</span> | <span lang="de">hat</span> | <span lang="de">wird</span> |
        | <span lang="de">wir</span> | <span lang="de">sind</span> | <span lang="de">haben</span> | <span lang="de">werden</span> |
        | <span lang="de">ihr</span> | <span lang="de">seid</span> | <span lang="de">habt</span> | <span lang="de">werden</span> |
        | <span lang="de">sie/Sie</span> | <span lang="de">sind</span> | <span lang="de">haben</span> | <span lang="de">werden</span> |

        ---

        ### 6. Separable Verbs (<span lang="de">Verben mit trennbarem Präfix</span>)

        Some verbs have a prefix that splits off and moves to the end of the sentence in the present tense. The conjugated part still follows the regular rules.

        - <span lang="de">einkaufen</span> (to shop) → <span lang="de">Ich kaufe im Supermarkt ein.</span> (I shop at the supermarket.)
        - <span lang="de">anfangen</span> (to begin) → <span lang="de">Der Kurs fängt um neun Uhr an.</span> (The course begins at nine o'clock.)

        See the sibling grammar point on separable verbs for full detail.

        ---

        ### 7. Examples in Context

        - <span lang="de">Ich komme aus Deutschland.</span> — I come from Germany.
        - <span lang="de">Du sprichst sehr gut Deutsch!</span> — You speak German very well!
        - <span lang="de">Wann fängt der Kurs an?</span> — When does the course begin?
        - <span lang="de">Wo kaufst du gerne ein?</span> — Where do you like to shop?
        - <span lang="de">Er liest jeden Tag die Zeitung.</span> — He reads the newspaper every day.
        - <span lang="de">Wir arbeiten von Montag bis Freitag.</span> — We work from Monday to Friday.

        ---

        ### 8. Common Learner Mistakes

        **Mistake 1: Forgetting the vowel change in strong verbs**
        - ❌ <span lang="de">Er esst viel.</span>
        - ✅ <span lang="de">Er isst viel.</span> (He eats a lot.)

        **Mistake 2: Not inserting the extra <span lang="de">-e-</span> with stems ending in <span lang="de">-t</span> or <span lang="de">-d</span>**
        - ❌ <span lang="de">Er arbeit viel.</span>
        - ✅ <span lang="de">Er arbeitet viel.</span> (He works a lot.)

        **Mistake 3: Using <span lang="de">sein</span> as if it were regular**
        - ❌ <span lang="de">Ich sein müde.</span>
        - ✅ <span lang="de">Ich bin müde.</span> (I am tired.)

        **Mistake 4: Keeping the separable prefix attached**
        - ❌ <span lang="de">Ich einkaufe morgen.</span>
        - ✅ <span lang="de">Ich kaufe morgen ein.</span> (I am shopping tomorrow.)

        **Mistake 5: Adding endings to <span lang="de">du</span> form of sibilant-stem verbs**
        - ❌ <span lang="de">Du heißst Maria.</span>
        - ✅ <span lang="de">Du heißt Maria.</span> (Your name is Maria.)
      language: en
      why_this_matters: The present tense is the single most important verb form at
        A1 level — nearly every sentence you say or read will use it. Without it,
        you cannot describe daily routines, ask questions, or talk about anything
        happening now.

- code: perfect_tense
  cefr_level: A1
  category: verb
  subcategory: Tempus
  label: Perfekt ausgewählter Verben
  description: Perfect tense of a selected set of verbs including arbeiten, bleiben,
    essen, fahren, fragen, glauben, haben, lesen, lernen, machen, schlafen, sehen,
    passieren, trinken, verstehen.
  examples:
  - Ich habe schon gegessen.
  source_note: 'Perfekt der Verben: arbeiten/bleiben/essen/fahren/fragen/glauben/haben/lesen/lernen/machen/schlafen/sehen/passieren/trinken/verstehen'
  explanations:
    en:
      title: The perfect tense in German
      tip: The perfect tense describes finished actions in the past. You build it
        with the present tense of <span lang="de">haben</span> or <span lang="de">sein</span>
        plus a past participle at the end of the sentence. Most verbs use <span lang="de">haben</span>;
        verbs of movement or change of state often use <span lang="de">sein</span>.
      explanation: |-
        ## The Perfect Tense (<span lang="de">das Perfekt</span>)

        ### What is it?

        The <span lang="de">Perfekt</span> (perfect tense) is the most common way to talk about **finished past events** in spoken German and informal writing. It corresponds roughly to both the English simple past ('I ate') and the present perfect ('I have eaten').

        ---

        ### How to build it

        You need **two parts**:

        1. A present-tense form of <span lang="de">haben</span> (to have) **or** <span lang="de">sein</span> (to be) — called the **auxiliary** (<span lang="de">das Hilfsverb</span>)
        2. The **past participle** (<span lang="de">das Partizip II</span>) of the main verb — placed at the **end** of the sentence

        > **Formula:** subject + <span lang="de">haben/sein</span> (conjugated) + … + <span lang="de">Partizip II</span>

        This two-part structure creates the **sentence bracket** (<span lang="de">Satzklammer</span>): the auxiliary sits in position 2 and the participle closes the sentence.

        ---

        ### Forming the past participle (<span lang="de">Partizip II</span>)

        #### Regular (weak) verbs

        Most regular verbs follow this pattern:

        > <span lang="de">ge-</span> + verb stem + <span lang="de">-(e)t</span>

        | Infinitive | Stem | <span lang="de">Partizip II</span> |
        |---|---|---|
        | <span lang="de">machen</span> | <span lang="de">mach-</span> | <span lang="de">gemacht</span> |
        | <span lang="de">fragen</span> | <span lang="de">frag-</span> | <span lang="de">gefragt</span> |
        | <span lang="de">lernen</span> | <span lang="de">lern-</span> | <span lang="de">gelernt</span> |
        | <span lang="de">glauben</span> | <span lang="de">glaub-</span> | <span lang="de">geglaubt</span> |
        | <span lang="de">arbeiten</span> | <span lang="de">arbeit-</span> | <span lang="de">gearbeitet</span> |

        **Note:** Verbs whose stem ends in <span lang="de">-t</span> or <span lang="de">-d</span> (like <span lang="de">arbeiten</span>) add <span lang="de">-et</span> to make pronunciation easier.

        #### Irregular (strong) verbs

        These change their stem vowel and end in <span lang="de">-en</span>. You must learn these individually.

        | Infinitive | <span lang="de">Partizip II</span> |
        |---|---|
        | <span lang="de">essen</span> | <span lang="de">gegessen</span> |
        | <span lang="de">fahren</span> | <span lang="de">gefahren</span> |
        | <span lang="de">lesen</span> | <span lang="de">gelesen</span> |
        | <span lang="de">schlafen</span> | <span lang="de">geschlafen</span> |
        | <span lang="de">sehen</span> | <span lang="de">gesehen</span> |
        | <span lang="de">trinken</span> | <span lang="de">getrunken</span> |
        | <span lang="de">verstehen</span> | <span lang="de">verstanden</span> |
        | <span lang="de">bleiben</span> | <span lang="de">geblieben</span> |

        #### Special cases

        - <span lang="de">haben</span> → <span lang="de">gehabt</span>
        - <span lang="de">passieren</span> → <span lang="de">passiert</span> (no <span lang="de">ge-</span> prefix because it ends in <span lang="de">-ieren</span>)

        ---

        ### Choosing the auxiliary: <span lang="de">haben</span> or <span lang="de">sein</span>?

        **Use <span lang="de">haben</span>** with most verbs, including all verbs that take a direct object:

        > <span lang="de">essen, fragen, glauben, haben, lesen, lernen, machen, schlafen, trinken, verstehen, arbeiten</span>

        **Use <span lang="de">sein</span>** with verbs that express:
        - movement from one place to another
        - a change of state
        - a few fixed verbs (including <span lang="de">bleiben</span> and <span lang="de">passieren</span>)

        From this list: <span lang="de">fahren</span>, <span lang="de">bleiben</span>, <span lang="de">passieren</span> use <span lang="de">sein</span>.

        ---

        ### Conjugation tables

        #### <span lang="de">haben</span> (auxiliary) — present tense

        | Person | Form |
        |---|---|
        | <span lang="de">ich</span> | <span lang="de">habe</span> |
        | <span lang="de">du</span> | <span lang="de">hast</span> |
        | <span lang="de">er/sie/es</span> | <span lang="de">hat</span> |
        | <span lang="de">wir</span> | <span lang="de">haben</span> |
        | <span lang="de">ihr</span> | <span lang="de">habt</span> |
        | <span lang="de">sie/Sie</span> | <span lang="de">haben</span> |

        #### <span lang="de">sein</span> (auxiliary) — present tense

        | Person | Form |
        |---|---|
        | <span lang="de">ich</span> | <span lang="de">bin</span> |
        | <span lang="de">du</span> | <span lang="de">bist</span> |
        | <span lang="de">er/sie/es</span> | <span lang="de">ist</span> |
        | <span lang="de">wir</span> | <span lang="de">sind</span> |
        | <span lang="de">ihr</span> | <span lang="de">seid</span> |
        | <span lang="de">sie/Sie</span> | <span lang="de">sind</span> |

        ---

        ### Examples with translations

        1. <span lang="de">Ich habe schon gegessen.</span> — I have already eaten. / I already ate.
        2. <span lang="de">Wir haben Deutsch gelernt.</span> — We learned German.
        3. <span lang="de">Sie hat viel Wasser getrunken.</span> — She drank a lot of water.
        4. <span lang="de">Er ist nach Berlin gefahren.</span> — He drove / travelled to Berlin.
        5. <span lang="de">Was ist passiert?</span> — What happened?
        6. <span lang="de">Du hast das Buch gelesen.</span> — You read the book.

        ---

        ### Common learner mistakes

        #### ❌ Wrong auxiliary
        > <span lang="de">*Ich habe nach Berlin gefahren.</span>
        > ✅ <span lang="de">Ich bin nach Berlin gefahren.</span>

        <span lang="de">fahren</span> (movement to a place) takes <span lang="de">sein</span>, not <span lang="de">haben</span>.

        #### ❌ Putting the participle in position 2
        > <span lang="de">*Ich gegessen habe schon.</span>
        > ✅ <span lang="de">Ich habe schon gegessen.</span>

        The auxiliary goes in position 2; the participle **always** goes to the end.

        #### ❌ Forgetting <span lang="de">ge-</span>
        > <span lang="de">*Ich habe trinkt.</span>
        > ✅ <span lang="de">Ich habe getrunken.</span>

        Always use the full <span lang="de">Partizip II</span> form, not the present-tense form.

        #### ❌ Adding <span lang="de">ge-</span> to <span lang="de">-ieren</span> verbs
        > <span lang="de">*Es hat gepassiert.</span>
        > ✅ <span lang="de">Es ist passiert.</span>

        Verbs ending in <span lang="de">-ieren</span> never add <span lang="de">ge-</span>, and <span lang="de">passieren</span> also takes <span lang="de">sein</span>.

        ---

        ### Quick reference: key verbs at a glance

        | Infinitive | <span lang="de">Partizip II</span> | Auxiliary | Example |
        |---|---|---|---|
        | <span lang="de">arbeiten</span> | <span lang="de">gearbeitet</span> | <span lang="de">haben</span> | <span lang="de">Ich habe gearbeitet.</span> |
        | <span lang="de">bleiben</span> | <span lang="de">geblieben</span> | <span lang="de">sein</span> | <span lang="de">Er ist geblieben.</span> |
        | <span lang="de">essen</span> | <span lang="de">gegessen</span> | <span lang="de">haben</span> | <span lang="de">Wir haben gegessen.</span> |
        | <span lang="de">fahren</span> | <span lang="de">gefahren</span> | <span lang="de">sein</span> | <span lang="de">Sie ist gefahren.</span> |
        | <span lang="de">fragen</span> | <span lang="de">gefragt</span> | <span lang="de">haben</span> | <span lang="de">Er hat gefragt.</span> |
        | <span lang="de">glauben</span> | <span lang="de">geglaubt</span> | <span lang="de">haben</span> | <span lang="de">Du hast geglaubt.</span> |
        | <span lang="de">haben</span> | <span lang="de">gehabt</span> | <span lang="de">haben</span> | <span lang="de">Ich habe Hunger gehabt.</span> |
        | <span lang="de">lesen</span> | <span lang="de">gelesen</span> | <span lang="de">haben</span> | <span lang="de">Sie hat gelesen.</span> |
        | <span lang="de">lernen</span> | <span lang="de">gelernt</span> | <span lang="de">haben</span> | <span lang="de">Ihr habt gelernt.</span> |
        | <span lang="de">machen</span> | <span lang="de">gemacht</span> | <span lang="de">haben</span> | <span lang="de">Wir haben Hausaufgaben gemacht.</span> |
        | <span lang="de">passieren</span> | <span lang="de">passiert</span> | <span lang="de">sein</span> | <span lang="de">Was ist passiert?</span> |
        | <span lang="de">schlafen</span> | <span lang="de">geschlafen</span> | <span lang="de">haben</span> | <span lang="de">Er hat gut geschlafen.</span> |
        | <span lang="de">sehen</span> | <span lang="de">gesehen</span> | <span lang="de">haben</span> | <span lang="de">Ich habe das gesehen.</span> |
        | <span lang="de">trinken</span> | <span lang="de">getrunken</span> | <span lang="de">haben</span> | <span lang="de">Sie haben getrunken.</span> |
        | <span lang="de">verstehen</span> | <span lang="de">verstanden</span> | <span lang="de">haben</span> | <span lang="de">Ich habe verstanden.</span> |
      language: en
      why_this_matters: The perfect tense is the everyday way Germans talk about the
        past in conversation and informal writing — you will need it constantly to
        say what you did, ate, read, or experienced. Without it you cannot describe
        any finished past event, which means you are stuck talking only about the
        present.

- code: selected_participles
  cefr_level: A1
  category: verb
  subcategory: Tempus
  label: Ausgewählte Partizipien
  description: Selected past participles used in isolation or as adjectives, e.g.
    in signs or notices.
  examples:
  - Heute geöffnet.
  - Bis Donnerstag geschlossen.
  source_note: Ausgewählte Partizipien
  explanations:
    en:
      title: Participles used alone as notices
      tip: A past participle can stand on its own — without a verb like 'is' or 'are'
        — to act as a short notice or label. Think of it as a clipped sentence where
        everything except the key word has been dropped. You see this on signs, doors,
        and announcements every day.
      explanation: |-
        ## Participles as Stand-Alone Notices

        ### What is a participle?

        A <span lang="de">Partizip II</span> (past participle) is the form of a verb used in the <span lang="de">Perfekt</span> (perfect tense) and as an adjective. At A1 level you mainly meet it in short notices where it stands completely alone — no subject, no auxiliary verb, nothing else.

        ---

        ### The full sentence behind the notice

        Every short notice hides a longer sentence. The participle is what remains after everything 'obvious' is removed:

        | Full sentence | Short notice |
        |---|---|
        | <span lang="de">Das Geschäft ist heute geöffnet.</span> | <span lang="de">Heute geöffnet.</span> |
        | <span lang="de">Das Büro ist bis Donnerstag geschlossen.</span> | <span lang="de">Bis Donnerstag geschlossen.</span> |
        | <span lang="de">Der Aufzug ist besetzt.</span> | <span lang="de">Besetzt.</span> |
        | <span lang="de">Der Parkplatz ist reserviert.</span> | <span lang="de">Reserviert.</span> |

        The missing verb is almost always a form of <span lang="de">sein</span> (to be).

        ---

        ### How to form the Partizip II

        You need to recognise these forms, not produce them from scratch at A1. Here is a quick guide to the two main patterns:

        #### Regular (weak) verbs
        **Formula:** <span lang="de">ge-</span> + verb stem + <span lang="de">-t</span>

        | Infinitive | Partizip II |
        |---|---|
        | <span lang="de">öffnen</span> (to open) | <span lang="de">geöffnet</span> |
        | <span lang="de">schließen</span> (to close) | <span lang="de">geschlossen</span>* |
        | <span lang="de">reservieren</span> (to reserve) | <span lang="de">reserviert</span>** |
        | <span lang="de">besetzen</span> (to occupy) | <span lang="de">besetzt</span>** |

        \* <span lang="de">schließen</span> is irregular — it keeps a strong/mixed form: <span lang="de">geschlossen</span>.
        \*\* Verbs with inseparable prefixes (<span lang="de">be-, ver-, re-,</span> etc.) or verbs ending in <span lang="de">-ieren</span> do **not** add <span lang="de">ge-</span>.

        #### Irregular (strong) verbs
        These change the stem vowel and usually end in <span lang="de">-en</span>. You simply have to learn them.

        | Infinitive | Partizip II |
        |---|---|
        | <span lang="de">schreiben</span> (to write) | <span lang="de">geschrieben</span> |
        | <span lang="de">kommen</span> (to come) | <span lang="de">gekommen</span> |

        ---

        ### Verbs with inseparable prefixes — no ge-

        If a verb already starts with <span lang="de">be-, ge-, emp-, ent-, er-, miss-, ver-, zer-</span>, the <span lang="de">ge-</span> is dropped:

        - <span lang="de">besetzt</span> (occupied) — NOT <span lang="de">gebesetzt</span>
        - <span lang="de">reserviert</span> (reserved) — NOT <span lang="de">gereserviert</span>
        - <span lang="de">verkauft</span> (sold) — NOT <span lang="de">geverkauft</span>

        ---

        ### Example sentences

        1. <span lang="de">Heute geöffnet.</span> — Open today.
        2. <span lang="de">Bis Donnerstag geschlossen.</span> — Closed until Thursday.
        3. <span lang="de">Dieser Sitzplatz ist reserviert.</span> — This seat is reserved.
        4. <span lang="de">Besetzt.</span> — Occupied. *(on a toilet door or lift)*
        5. <span lang="de">Ausverkauft.</span> — Sold out.
        6. <span lang="de">Frisch gestrichen!</span> — Wet paint! *(literally: freshly painted)*

        ---

        ### Common learner mistakes

        **1. Adding ge- to verbs that already have a prefix**

        ❌ <span lang="de">gereserviert</span>
        ✅ <span lang="de">reserviert</span>

        Verbs ending in <span lang="de">-ieren</span> never take <span lang="de">ge-</span>.

        **2. Confusing the participle with the adjective ending**

        When the participle stands alone as a notice, it has **no extra ending**. When it is used directly before a noun, it does need an adjective ending — but that is a higher-level topic.

        ❌ <span lang="de">Heute geöffnete.</span>
        ✅ <span lang="de">Heute geöffnet.</span>

        **3. Using the wrong auxiliary in the full sentence**

        When the participle is expanded back into a full sentence, the verb is <span lang="de">sein</span>, not <span lang="de">haben</span>:

        ❌ <span lang="de">Das Büro hat geschlossen.</span> *(means 'the office has closed' — a different meaning)*
        ✅ <span lang="de">Das Büro ist geschlossen.</span> — The office is closed. *(a state)*

        ---

        ### Quick recognition checklist

        - Does it start with <span lang="de">ge-</span> and end in <span lang="de">-t</span> or <span lang="de">-en</span>? → Probably a <span lang="de">Partizip II</span>.
        - Is it on a sign with no full verb? → Read it as '(is/are) + participle'.
        - No <span lang="de">ge-</span> but ends in <span lang="de">-iert</span>? → Still a participle (<span lang="de">-ieren</span> verb).
      language: en
      why_this_matters: These one-word or two-word notices are everywhere in German
        life — on shop doors, museum displays, menus, and public transport. Recognising
        them instantly lets you navigate daily situations before you can read full
        sentences.

- code: praeteritum_haben_se
  cefr_level: A1
  category: verb
  subcategory: Tempus
  label: Präteritum haben/sein 1./3. Person
  description: Simple past (Präteritum) of haben and sein in the 1st and 3rd person
    singular only.
  examples:
  - Sie/ich hatte keine Zeit.
  - Ich/er war nicht da.
  source_note: 'Präteritum: ausgewählte Form: 1. und 3. Person haben/sein'
  explanations:
    en:
      title: Simple past of haben and sein
      tip: 'In German, <span lang="de">haben</span> (to have) and <span lang="de">sein</span>
        (to be) have special simple-past forms that are used even in everyday speech.
        Learn just the 1st and 3rd person singular forms for now: <span lang="de">hatte/hatte</span>
        and <span lang="de">war/war</span> — they are identical for both persons.'
      explanation: |-
        ## Simple Past (<span lang="de">Präteritum</span>) of <span lang="de">haben</span> and <span lang="de">sein</span>

        ### What is the <span lang="de">Präteritum</span>?

        The <span lang="de">Präteritum</span> (simple past) is a verb tense used to describe actions or states in the past. While most past events in everyday German speech use the <span lang="de">Perfekt</span> (perfect tense), <span lang="de">haben</span> (to have) and <span lang="de">sein</span> (to be) are almost always used in the <span lang="de">Präteritum</span> even in spoken language. This makes these forms especially important to learn early.

        ---

        ### The Forms: 1st and 3rd Person Singular

        At A1 level, focus on just two persons:

        | Person | <span lang="de">haben</span> (to have) | <span lang="de">sein</span> (to be) |
        |---|---|---|
        | 1st person singular (<span lang="de">ich</span>) | <span lang="de">hatte</span> | <span lang="de">war</span> |
        | 3rd person singular (<span lang="de">er/sie/es</span>) | <span lang="de">hatte</span> | <span lang="de">war</span> |

        **Key observation:** The 1st and 3rd person singular forms are **identical** — no extra ending is added. This is unlike regular verbs, where the 3rd person adds <span lang="de">-t</span>.

        ---

        ### Formation

        **<span lang="de">haben</span> → <span lang="de">hatte</span>**
        The stem changes from <span lang="de">hab-</span> to <span lang="de">hatt-</span>, then the past-tense ending is added. For 1st and 3rd person singular, no personal ending is added (the form ends in <span lang="de">-e</span>).

        **<span lang="de">sein</span> → <span lang="de">war</span>**
        This is a completely irregular form. The entire word changes — there is no recognisable connection to <span lang="de">sein</span> or <span lang="de">ist</span>. You simply need to memorise it.

        ---

        ### Examples

        1. <span lang="de">Ich hatte keine Zeit.</span> — I had no time.
        2. <span lang="de">Sie hatte ein Buch.</span> — She had a book.
        3. <span lang="de">Ich war nicht da.</span> — I was not there.
        4. <span lang="de">Er war sehr müde.</span> — He was very tired.
        5. <span lang="de">Das Kind hatte Hunger.</span> — The child was hungry. (lit. The child had hunger.)
        6. <span lang="de">Es war kalt.</span> — It was cold.

        ---

        ### Negation in the Simple Past

        Negation works the same way as in the present tense:
        - Use <span lang="de">nicht</span> to negate verbs and adjectives.
        - Use <span lang="de">kein/keine</span> to negate nouns.

        <span lang="de">Ich hatte keine Zeit.</span> — I had no time. (noun negated with <span lang="de">keine</span>)
        <span lang="de">Er war nicht da.</span> — He was not there. (adverb negated with <span lang="de">nicht</span>)

        ---

        ### Common Learner Mistakes

        **Mistake 1: Using the present tense instead of <span lang="de">Präteritum</span>**
        - ❌ <span lang="de">Ich bin gestern müde.</span>
        - ✅ <span lang="de">Ich war gestern müde.</span> — I was tired yesterday.

        When describing past states with <span lang="de">sein</span>, always switch to <span lang="de">war</span>, not <span lang="de">bin</span>.

        **Mistake 2: Adding a 3rd-person <span lang="de">-t</span> ending**
        - ❌ <span lang="de">Er hatte-t keine Zeit.</span>
        - ✅ <span lang="de">Er hatte keine Zeit.</span> — He had no time.

        Remember: no extra ending is added for 1st or 3rd person singular.

        **Mistake 3: Confusing <span lang="de">war</span> with <span lang="de">wurde</span>**
        - <span lang="de">war</span> = was (state of being)
        - <span lang="de">wurde</span> = became / was (passive — not needed at A1)

        At A1, only use <span lang="de">war</span>.

        ---

        ### Quick Reference

        | Pronoun | <span lang="de">haben</span> past | <span lang="de">sein</span> past |
        |---|---|---|
        | <span lang="de">ich</span> | <span lang="de">hatte</span> | <span lang="de">war</span> |
        | <span lang="de">er / sie / es</span> | <span lang="de">hatte</span> | <span lang="de">war</span> |

        These two forms — <span lang="de">hatte</span> and <span lang="de">war</span> — are the foundation of talking about the past in German.
      language: en
      why_this_matters: These two verbs appear in almost every sentence about the
        past. Without them you cannot say things like 'I had no time' or 'She was
        not there', and you cannot form past descriptions of states, feelings, or
        conditions.

- code: indicative_mood
  cefr_level: A1
  category: verb
  subcategory: Modus
  label: Indikativ aller Verben der Wortliste
  description: Indicative mood for all verbs in the A1 word list, used for statements
    and questions about real situations.
  examples:
  - Kommst du mit?
  - Wann fängt der Kurs an?
  source_note: Indikativ aller Verben der Wortliste
  explanations:
    en:
      title: The indicative mood
      tip: The indicative is the default mood in German — you use it whenever you
        talk about real things, real actions, or real states. Almost every statement
        and question you make at A1 level is in the indicative. If you are not using
        a special form like Konjunktiv or Imperativ, you are already using it.
      explanation: |-
        ## The Indicative Mood in German

        ### What is a mood?

        In grammar, **mood** (German: <span lang="de">Modus</span>) tells you the speaker's relationship to reality. German has three main moods:

        | Mood | German term | Typical use |
        |------|-------------|-------------|
        | Indicative | <span lang="de">Indikativ</span> | Real facts, statements, questions |
        | Subjunctive II | <span lang="de">Konjunktiv II</span> | Hypotheticals, polite requests |
        | Imperative | <span lang="de">Imperativ</span> | Commands, instructions |

        At A1 level, almost everything you say is in the **indicative**.

        ---

        ### What the indicative does

        The indicative mood is used whenever you:
        - state a fact: <span lang="de">Ich wohne in Berlin.</span> (I live in Berlin.)
        - describe an action: <span lang="de">Sie kauft Brot.</span> (She is buying bread.)
        - ask a real question: <span lang="de">Kommst du mit?</span> (Are you coming along?)
        - talk about the past: <span lang="de">Er hat geschlafen.</span> (He slept / He has slept.)

        The indicative is **not** a tense — it is a label for the mood that runs across all tenses (present, past, perfect, etc.).

        ---

        ### Indicative across A1 tenses

        All three tenses you learn at A1 exist in the indicative:

        #### 1. Present tense (<span lang="de">Präsens</span>)

        The most common tense. Used for present actions, habits, and near-future plans.

        **Regular verb endings (<span lang="de">spielen</span> — to play):**

        | Person | Form | Example |
        |--------|------|---------|
        | <span lang="de">ich</span> | <span lang="de">-e</span> | <span lang="de">ich spiele</span> |
        | <span lang="de">du</span> | <span lang="de">-st</span> | <span lang="de">du spielst</span> |
        | <span lang="de">er/sie/es</span> | <span lang="de">-t</span> | <span lang="de">er spielt</span> |
        | <span lang="de">wir</span> | <span lang="de">-en</span> | <span lang="de">wir spielen</span> |
        | <span lang="de">ihr</span> | <span lang="de">-t</span> | <span lang="de">ihr spielt</span> |
        | <span lang="de">sie/Sie</span> | <span lang="de">-en</span> | <span lang="de">sie spielen</span> |

        #### 2. Perfect tense (<span lang="de">Perfekt</span>)

        Used in spoken German to talk about completed past actions. Formed with a helper verb (<span lang="de">haben</span> or <span lang="de">sein</span>) + past participle (<span lang="de">Partizip II</span>).

        - <span lang="de">Ich habe Kaffee getrunken.</span> (I drank coffee.)
        - <span lang="de">Sie ist nach Hause gegangen.</span> (She went home.)

        #### 3. Simple past (<span lang="de">Präteritum</span>)

        At A1, only <span lang="de">haben</span> and <span lang="de">sein</span> are commonly used in the simple past in everyday speech.

        - <span lang="de">Ich hatte keine Zeit.</span> (I had no time.)
        - <span lang="de">Er war müde.</span> (He was tired.)

        ---

        ### Irregular verbs in the indicative

        Many very common German verbs change their stem vowel in the <span lang="de">du</span> and <span lang="de">er/sie/es</span> forms of the present tense indicative. These are called **strong verbs** (<span lang="de">starke Verben</span>).

        | Infinitive | <span lang="de">ich</span> | <span lang="de">du</span> | <span lang="de">er/sie/es</span> |
        |------------|------|------|------------|
        | <span lang="de">fahren</span> (to drive/go) | <span lang="de">fahre</span> | <span lang="de">fährst</span> | <span lang="de">fährt</span> |
        | <span lang="de">lesen</span> (to read) | <span lang="de">lese</span> | <span lang="de">liest</span> | <span lang="de">liest</span> |
        | <span lang="de">sprechen</span> (to speak) | <span lang="de">spreche</span> | <span lang="de">sprichst</span> | <span lang="de">spricht</span> |
        | <span lang="de">sehen</span> (to see) | <span lang="de">sehe</span> | <span lang="de">siehst</span> | <span lang="de">sieht</span> |

        The key irregular verbs <span lang="de">sein</span> (to be) and <span lang="de">haben</span> (to have) must be memorised:

        **<span lang="de">sein</span>:**

        | Person | Form |
        |--------|------|
        | <span lang="de">ich</span> | <span lang="de">bin</span> |
        | <span lang="de">du</span> | <span lang="de">bist</span> |
        | <span lang="de">er/sie/es</span> | <span lang="de">ist</span> |
        | <span lang="de">wir</span> | <span lang="de">sind</span> |
        | <span lang="de">ihr</span> | <span lang="de">seid</span> |
        | <span lang="de">sie/Sie</span> | <span lang="de">sind</span> |

        **<span lang="de">haben</span>:**

        | Person | Form |
        |--------|------|
        | <span lang="de">ich</span> | <span lang="de">habe</span> |
        | <span lang="de">du</span> | <span lang="de">hast</span> |
        | <span lang="de">er/sie/es</span> | <span lang="de">hat</span> |
        | <span lang="de">wir</span> | <span lang="de">haben</span> |
        | <span lang="de">ihr</span> | <span lang="de">habt</span> |
        | <span lang="de">sie/Sie</span> | <span lang="de">haben</span> |

        ---

        ### Examples

        1. <span lang="de">Ich lerne Deutsch.</span> — I am learning German. *(present indicative, regular verb)*
        2. <span lang="de">Wann fängt der Kurs an?</span> — When does the course start? *(present indicative, irregular strong verb, separable)*
        3. <span lang="de">Sie hat gestern gearbeitet.</span> — She worked yesterday. *(perfect indicative)*
        4. <span lang="de">Das Kind ist krank.</span> — The child is sick. *(present indicative, sein)*
        5. <span lang="de">Wir waren zu Hause.</span> — We were at home. *(simple past indicative, sein)*
        6. <span lang="de">Er hat ein Auto.</span> — He has a car. *(present indicative, haben)*

        ---

        ### Common learner mistakes

        **Mistake 1:** Forgetting the vowel change in strong verbs.
        - ✗ <span lang="de">Er lesst das Buch.</span>
        - ✓ <span lang="de">Er liest das Buch.</span> (He reads the book.)

        **Mistake 2:** Using the wrong form of <span lang="de">sein</span>.
        - ✗ <span lang="de">Ich ist müde.</span>
        - ✓ <span lang="de">Ich bin müde.</span> (I am tired.)

        **Mistake 3:** Confusing <span lang="de">haben</span> and <span lang="de">sein</span> as helpers in the perfect tense.
        - ✗ <span lang="de">Ich habe nach Hause gegangen.</span>
        - ✓ <span lang="de">Ich bin nach Hause gegangen.</span> (I went home.) — verbs of movement or change of state take <span lang="de">sein</span>.

        ---

        ### Quick summary

        The indicative is not something you have to 'activate' — it is simply the normal mode of German verb forms. Every verb form you learn for real statements or questions is automatically indicative. Focus on learning correct verb endings, irregular stems, and when to use <span lang="de">haben</span> versus <span lang="de">sein</span>, and you are already mastering the indicative.
      language: en
      why_this_matters: The indicative covers every tense you need at A1 — present,
        simple past, and perfect — so understanding it as a concept ties all your
        verb learning together. Without it you cannot describe your day, ask basic
        questions, or say where you live. It is the foundation of almost every German
        sentence you will ever produce.

- code: konjunktiv2_moegen_w
  cefr_level: A1
  category: verb
  subcategory: Modus
  label: Konjunktiv II mögen/werden
  description: Konjunktiv II forms of mögen (möchte) and werden (würde), used as lexical
    items for polite requests and wishes.
  examples:
  - Ich möchte mehr Deutsch lernen.
  - Ich würde gerne ins Kino gehen.
  source_note: Konjunktiv II der Verben mögen und werden; treated as lexical units,
    not systematically
  explanations:
    en:
      title: Polite wishes with möchte and würde
      tip: German uses two special verb forms — <span lang="de">möchte</span> and
        <span lang="de">würde</span> — to make polite requests and express wishes.
        Think of them as the German equivalents of 'would like' and 'would'. They
        are learned as fixed vocabulary items at this level, not built from a grammar
        rule.
      explanation: |-
        ## Polite wishes with <span lang="de">möchte</span> and <span lang="de">würde</span>

        ### What are these forms?

        <span lang="de">Möchte</span> and <span lang="de">würde</span> are Konjunktiv II (subjunctive mood) forms, but at A1 level you treat them as **vocabulary items** — ready-made, polite verb forms you learn and use directly, the same way English speakers just learn 'would like' without analysing it.

        - <span lang="de">möchte</span> = 'would like' (a polite wish or desire)
        - <span lang="de">würde</span> = 'would' (a polite offer, suggestion, or hypothetical action)

        ---

        ### <span lang="de">möchte</span> — 'would like'

        <span lang="de">Möchte</span> is the Konjunktiv II of the modal verb <span lang="de">mögen</span> (to like). In everyday use it expresses a polite wish or desire, especially in shops, restaurants, and service situations.

        #### Full paradigm of <span lang="de">möchte</span>

        | Person | Form |
        |---|---|
        | <span lang="de">ich</span> | <span lang="de">möchte</span> |
        | <span lang="de">du</span> | <span lang="de">möchtest</span> |
        | <span lang="de">er/sie/es</span> | <span lang="de">möchte</span> |
        | <span lang="de">wir</span> | <span lang="de">möchten</span> |
        | <span lang="de">ihr</span> | <span lang="de">möchtet</span> |
        | <span lang="de">sie/Sie</span> | <span lang="de">möchten</span> |

        > **Key feature:** Like all modal verbs, <span lang="de">möchte</span> sends a second verb (the main action) to the **end of the sentence** in its infinitive form. This is the Satzklammer (sentence bracket) pattern.

        #### Formation

        <span lang="de">Subjekt + möchte + (other elements) + Infinitiv</span>

        #### Examples with <span lang="de">möchte</span>

        1. <span lang="de">Ich möchte einen Kaffee.</span> — 'I would like a coffee.' *(no second verb needed when the object is a noun)*
        2. <span lang="de">Ich möchte mehr Deutsch lernen.</span> — 'I would like to learn more German.'
        3. <span lang="de">Sie möchte ins Restaurant gehen.</span> — 'She would like to go to the restaurant.'
        4. <span lang="de">Wir möchten ein Zimmer buchen.</span> — 'We would like to book a room.'

        ---

        ### <span lang="de">würde</span> — 'would'

        <span lang="de">Würde</span> is the Konjunktiv II of <span lang="de">werden</span> (to become / will). It is used to express polite offers, suggestions, and hypothetical actions — wherever English uses 'would + verb'.

        #### Full paradigm of <span lang="de">würde</span>

        | Person | Form |
        |---|---|
        | <span lang="de">ich</span> | <span lang="de">würde</span> |
        | <span lang="de">du</span> | <span lang="de">würdest</span> |
        | <span lang="de">er/sie/es</span> | <span lang="de">würde</span> |
        | <span lang="de">wir</span> | <span lang="de">würden</span> |
        | <span lang="de">ihr</span> | <span lang="de">würdet</span> |
        | <span lang="de">sie/Sie</span> | <span lang="de">würden</span> |

        > **Key feature:** <span lang="de">Würde</span> always works together with an infinitive, which goes to the **end of the sentence**.

        #### Formation

        <span lang="de">Subjekt + würde + (other elements) + Infinitiv</span>

        #### Examples with <span lang="de">würde</span>

        1. <span lang="de">Ich würde gerne ins Kino gehen.</span> — 'I would like to go to the cinema.'
        2. <span lang="de">Würden Sie mir bitte helfen?</span> — 'Would you please help me?'
        3. <span lang="de">Er würde gerne mehr schlafen.</span> — 'He would like to sleep more.'
        4. <span lang="de">Was würdest du trinken?</span> — 'What would you drink?'

        ---

        ### The adverb <span lang="de">gerne</span>

        The word <span lang="de">gerne</span> (gladly / with pleasure) is very often added to <span lang="de">würde</span> constructions to make them sound warmer and more natural. It sits before the infinitive or after the verb.

        - <span lang="de">Ich würde gerne kommen.</span> — 'I would gladly come / I'd love to come.'
        - <span lang="de">Ich möchte gerne einen Tee.</span> — 'I would really like a tea.'

        ---

        ### <span lang="de">möchte</span> vs. <span lang="de">würde</span> — when to use which?

        | Situation | Use | Example |
        |---|---|---|
        | Expressing a desire / wish for something | <span lang="de">möchte</span> | <span lang="de">Ich möchte ein Wasser.</span> |
        | Polite request for an action | <span lang="de">möchte + Infinitiv</span> | <span lang="de">Ich möchte bezahlen.</span> |
        | Hypothetical / conditional action | <span lang="de">würde + Infinitiv</span> | <span lang="de">Ich würde gerne kommen.</span> |
        | Polite question or offer | <span lang="de">würde + Infinitiv</span> | <span lang="de">Würden Sie bitte warten?</span> |

        In many everyday situations the two are interchangeable for expressing polite wishes.

        ---

        ### Word order reminder (Satzklammer)

        Both <span lang="de">möchte</span> and <span lang="de">würde</span> occupy **position 2** in a statement, and the infinitive goes to the **end**. This creates a bracket around the middle of the sentence.

        <span lang="de">Ich **möchte** morgen ins Museum **gehen**.</span>

        ('I would like to go to the museum tomorrow.')

        <span lang="de">Er **würde** gerne mehr Sport **machen**.</span>

        ('He would like to do more sport.')

        In a yes/no question, the verb moves to **position 1**:

        <span lang="de">**Möchten** Sie einen Kaffee **trinken**?</span>

        ('Would you like to drink a coffee?')

        ---

        ### Common learner mistakes

        **1. Forgetting the infinitive at the end**

        ❌ <span lang="de">Ich möchte ins Kino.</span> *(acceptable only when the verb is obvious from context — better to include it)*
        ✅ <span lang="de">Ich möchte ins Kino gehen.</span>

        **2. Putting the infinitive in position 2 instead of at the end**

        ❌ <span lang="de">Ich würde gehen gerne ins Kino.</span>
        ✅ <span lang="de">Ich würde gerne ins Kino gehen.</span>

        **3. Confusing <span lang="de">möchte</span> with <span lang="de">mag</span>**

        <span lang="de">Mag</span> is the indicative present of <span lang="de">mögen</span> and means 'to like (something)' in a general sense. <span lang="de">Möchte</span> means 'would like' and is used for requests and polite wishes.

        ❌ <span lang="de">Ich mag einen Kaffee, bitte.</span> *(sounds unnatural for ordering)*
        ✅ <span lang="de">Ich möchte einen Kaffee, bitte.</span>

        **4. Using the wrong ending for <span lang="de">er/sie/es</span>**

        Note that <span lang="de">er möchte</span> has **no extra -t** (unlike regular verbs like <span lang="de">er kommt</span>). This is normal for Konjunktiv II and for modal verbs.

        ❌ <span lang="de">Er möchtet ein Wasser.</span>
        ✅ <span lang="de">Er möchte ein Wasser.</span>
      language: en
      why_this_matters: You will need <span lang="de">möchte</span> and <span lang="de">würde</span>
        in almost every real-life situation — ordering food, asking for help, or saying
        what you want to do. Without them your requests will sound blunt or rude,
        so mastering these forms early makes a huge practical difference.

- code: imperative
  cefr_level: A1
  category: verb
  subcategory: Modus
  label: Imperativ du-, ihr- und Sie-Form
  description: Imperative forms of verbs in the du, ihr, and Sie address forms, used
    for instructions and requests.
  examples:
  - Geh bitte nach Hause!
  - Kommt bitte alle mit!
  - Kommen Sie bitte mit!
  - Mach bitte das Fenster zu!
  source_note: Imperativ in der du-, ihr- und Sie-Form
  explanations:
    en:
      title: Giving commands and requests
      tip: 'German has three imperative forms depending on who you are talking to:
        one for a single person you know well (du), one for a group you know well
        (ihr), and one for formal address (Sie). Each form is built differently from
        the verb stem.'
      explanation: |-
        ## The German Imperative

        The <span lang="de">Imperativ</span> (imperative mood) is used to give commands, instructions, requests, and invitations. German has three imperative forms, one for each way of addressing people.

        ---

        ### The three address forms at a glance

        | Who you are talking to | German address | Example |
        |---|---|---|
        | One person, informal | <span lang="de">du</span> | <span lang="de">Komm!</span> *(Come!)* |
        | Several people, informal | <span lang="de">ihr</span> | <span lang="de">Kommt!</span> *(Come!)* |
        | One or more people, formal | <span lang="de">Sie</span> | <span lang="de">Kommen Sie!</span> *(Come!)* |

        ---

        ### Formation

        #### 1. <span lang="de">du</span>-form (one person, informal)

        Take the infinitive, remove <span lang="de">-en</span>, and use the bare stem. An exclamation mark is usual but not required.

        > Stem of <span lang="de">kommen</span> → <span lang="de">komm</span> → **<span lang="de">Komm!</span>**

        An optional <span lang="de">-e</span> ending can be added and sounds slightly more formal or old-fashioned:

        > <span lang="de">Komme!</span> / <span lang="de">Gehe!</span>

        **Important exception — stem-vowel change (e → i/ie):** Verbs that change their stem vowel from <span lang="de">e</span> to <span lang="de">i</span> or <span lang="de">ie</span> in the second and third person singular present tense *keep that changed vowel* in the <span lang="de">du</span>-imperative, and *never* add <span lang="de">-e</span>.

        | Infinitive | Present <span lang="de">du</span>-form | Imperative |
        |---|---|---|
        | <span lang="de">geben</span> *(to give)* | <span lang="de">du gibst</span> | <span lang="de">Gib!</span> |
        | <span lang="de">sprechen</span> *(to speak)* | <span lang="de">du sprichst</span> | <span lang="de">Sprich!</span> |
        | <span lang="de">lesen</span> *(to read)* | <span lang="de">du liest</span> | <span lang="de">Lies!</span> |
        | <span lang="de">nehmen</span> *(to take)* | <span lang="de">du nimmst</span> | <span lang="de">Nimm!</span> |

        Verbs that change <span lang="de">a → ä</span> (e.g. <span lang="de">fahren</span>) do **not** carry the umlaut into the imperative:

        > <span lang="de">fahren</span> → <span lang="de">Fahr!</span> *(not <span lang="de">Fähr!</span>)*

        ---

        #### 2. <span lang="de">ihr</span>-form (several people, informal)

        This is identical to the regular present-tense <span lang="de">ihr</span> form — just leave out the pronoun <span lang="de">ihr</span>.

        > <span lang="de">ihr kommt</span> → **<span lang="de">Kommt!</span>**

        | Infinitive | Present <span lang="de">ihr</span>-form | Imperative |
        |---|---|---|
        | <span lang="de">kommen</span> | <span lang="de">ihr kommt</span> | <span lang="de">Kommt!</span> |
        | <span lang="de">machen</span> | <span lang="de">ihr macht</span> | <span lang="de">Macht!</span> |
        | <span lang="de">gehen</span> | <span lang="de">ihr geht</span> | <span lang="de">Geht!</span> |

        ---

        #### 3. <span lang="de">Sie</span>-form (formal, singular or plural)

        Use the infinitive and keep the pronoun <span lang="de">Sie</span> immediately after the verb. The capital <span lang="de">S</span> is always written.

        > **<span lang="de">Kommen Sie!</span>** *(Come!)*

        | Infinitive | Imperative |
        |---|---|
        | <span lang="de">kommen</span> | <span lang="de">Kommen Sie!</span> |
        | <span lang="de">machen</span> | <span lang="de">Machen Sie!</span> |
        | <span lang="de">gehen</span> | <span lang="de">Gehen Sie!</span> |

        Note: this is the only imperative form where the pronoun stays in.

        ---

        ### Irregular verbs: <span lang="de">sein</span> and <span lang="de">haben</span>

        These two very common verbs are irregular.

        | | <span lang="de">sein</span> *(to be)* | <span lang="de">haben</span> *(to have)* |
        |---|---|---|
        | <span lang="de">du</span> | <span lang="de">Sei!</span> | <span lang="de">Hab(e)!</span> |
        | <span lang="de">ihr</span> | <span lang="de">Seid!</span> | <span lang="de">Habt!</span> |
        | <span lang="de">Sie</span> | <span lang="de">Seien Sie!</span> | <span lang="de">Haben Sie!</span> |

        ---

        ### Separable verbs

        With <span lang="de">trennbare Verben</span> (separable verbs), the prefix splits off and moves to the end, just as in a normal sentence.

        > <span lang="de">aufmachen</span> → <span lang="de">**Mach** das Fenster **auf**!</span> *(Open the window!)*
        > <span lang="de">mitkommen</span> → <span lang="de">**Kommen** Sie **mit**!</span> *(Come along!)*

        ---

        ### Softening a command with <span lang="de">bitte</span>

        Adding <span lang="de">bitte</span> *(please)* makes any imperative more polite. It can appear at the start, middle, or end of the sentence.

        > <span lang="de">Geh bitte nach Hause!</span> *(Please go home!)*
        > <span lang="de">Bitte kommen Sie herein!</span> *(Please come in!)*

        ---

        ### Examples with translations

        1. <span lang="de">Mach bitte das Fenster zu!</span> — *Please close the window!* (<span lang="de">du</span>-form)
        2. <span lang="de">Geh nach Hause!</span> — *Go home!* (<span lang="de">du</span>-form)
        3. <span lang="de">Kommt bitte alle mit!</span> — *Please all come along!* (<span lang="de">ihr</span>-form)
        4. <span lang="de">Wartet hier!</span> — *Wait here!* (<span lang="de">ihr</span>-form)
        5. <span lang="de">Kommen Sie bitte mit!</span> — *Please come along!* (<span lang="de">Sie</span>-form)
        6. <span lang="de">Sprechen Sie bitte langsam!</span> — *Please speak slowly!* (<span lang="de">Sie</span>-form)

        ---

        ### Common learner mistakes

        **1. Keeping the pronoun in the <span lang="de">du</span>- or <span lang="de">ihr</span>-form**

        > ❌ <span lang="de">Du komm hier!</span>
        > ✅ <span lang="de">Komm hier!</span>

        The pronouns <span lang="de">du</span> and <span lang="de">ihr</span> are dropped. Only <span lang="de">Sie</span> stays.

        **2. Forgetting the stem-vowel change**

        > ❌ <span lang="de">Gebe mir das Buch!</span>
        > ✅ <span lang="de">Gib mir das Buch!</span>

        When the present tense <span lang="de">du</span>-form has <span lang="de">e → i/ie</span>, the imperative must too.

        **3. Wrong word order with <span lang="de">Sie</span>**

        > ❌ <span lang="de">Sie kommen bitte!</span> (This sounds like a statement, not a command.)
        > ✅ <span lang="de">Kommen Sie bitte!</span>

        The verb must come first in the <span lang="de">Sie</span>-imperative.

        **4. Adding <span lang="de">-e</span> to a stem-change verb**

        > ❌ <span lang="de">Giebe!</span>
        > ✅ <span lang="de">Gib!</span>

        Verbs with <span lang="de">e → i/ie</span> never add <span lang="de">-e</span> in the <span lang="de">du</span>-imperative.
      language: en
      why_this_matters: You will need the imperative every time you give an instruction,
        make a request, or follow directions — in recipes, signs, classroom language,
        and everyday conversation. Without it, you cannot tell someone to sit down,
        come along, or open a window.

- code: modal_verbs_present
  cefr_level: A1
  category: verb
  subcategory: Modalverben
  label: Modalverben im Präsens
  description: 'Present tense of all six modal verbs: können, wollen, müssen, dürfen,
    sollen, möchten, expressing ability, desire, necessity, permission, obligation,
    and polite requests.'
  examples:
  - Kannst du Gitarre spielen?
  - Er will eine Ausbildung als Schreiner machen.
  - Du musst zuerst die Hausaufgaben machen.
  - Sie dürfen hier nicht rauchen.
  - Was soll ich machen?
  - Möchtest du eine Tasse Tee?
  source_note: Präsens von können, wollen, müssen, dürfen, sollen, möchten
  explanations:
    en:
      title: Modal verbs in the present tense
      tip: Modal verbs express ability, desire, necessity, permission, and obligation.
        They follow special conjugation patterns and push the main verb to the end
        of the sentence as an infinitive.
      explanation: |-
        ## Modal verbs in the present tense

        ### What are modal verbs?

        German has six modal verbs. Each one adds a meaning — ability, desire, necessity, permission, obligation, or polite request — to another verb. The modal verb is conjugated and placed in second position; the main verb stays as an infinitive at the end of the sentence. This creates the <span lang="de">Satzklammer</span> (sentence bracket), a key feature of German word order.

        **Pattern:** <span lang="de">Subjekt + Modalverb (konjugiert) + … + Infinitiv</span>

        > <span lang="de">Ich kann Gitarre spielen.</span> — I can play guitar.

        ---

        ### The six modal verbs and their meanings

        | German | Meaning |
        |---|---|
        | <span lang="de">können</span> | can / to be able to |
        | <span lang="de">wollen</span> | to want to |
        | <span lang="de">müssen</span> | must / to have to |
        | <span lang="de">dürfen</span> | may / to be allowed to |
        | <span lang="de">sollen</span> | should / to be supposed to |
        | <span lang="de">möchten</span> | would like to |

        ---

        ### Conjugation tables

        All modal verbs except <span lang="de">möchten</span> share one key pattern: the **1st and 3rd person singular forms are identical**, and they often have a **vowel change** in the singular compared to the infinitive.

        #### <span lang="de">können</span> (can, to be able to)

        | Person | Form |
        |---|---|
        | <span lang="de">ich</span> | <span lang="de">kann</span> |
        | <span lang="de">du</span> | <span lang="de">kannst</span> |
        | <span lang="de">er/sie/es</span> | <span lang="de">kann</span> |
        | <span lang="de">wir</span> | <span lang="de">können</span> |
        | <span lang="de">ihr</span> | <span lang="de">könnt</span> |
        | <span lang="de">sie/Sie</span> | <span lang="de">können</span> |

        #### <span lang="de">wollen</span> (to want to)

        | Person | Form |
        |---|---|
        | <span lang="de">ich</span> | <span lang="de">will</span> |
        | <span lang="de">du</span> | <span lang="de">willst</span> |
        | <span lang="de">er/sie/es</span> | <span lang="de">will</span> |
        | <span lang="de">wir</span> | <span lang="de">wollen</span> |
        | <span lang="de">ihr</span> | <span lang="de">wollt</span> |
        | <span lang="de">sie/Sie</span> | <span lang="de">wollen</span> |

        #### <span lang="de">müssen</span> (must, to have to)

        | Person | Form |
        |---|---|
        | <span lang="de">ich</span> | <span lang="de">muss</span> |
        | <span lang="de">du</span> | <span lang="de">musst</span> |
        | <span lang="de">er/sie/es</span> | <span lang="de">muss</span> |
        | <span lang="de">wir</span> | <span lang="de">müssen</span> |
        | <span lang="de">ihr</span> | <span lang="de">müsst</span> |
        | <span lang="de">sie/Sie</span> | <span lang="de">müssen</span> |

        #### <span lang="de">dürfen</span> (may, to be allowed to)

        | Person | Form |
        |---|---|
        | <span lang="de">ich</span> | <span lang="de">darf</span> |
        | <span lang="de">du</span> | <span lang="de">darfst</span> |
        | <span lang="de">er/sie/es</span> | <span lang="de">darf</span> |
        | <span lang="de">wir</span> | <span lang="de">dürfen</span> |
        | <span lang="de">ihr</span> | <span lang="de">dürft</span> |
        | <span lang="de">sie/Sie</span> | <span lang="de">dürfen</span> |

        #### <span lang="de">sollen</span> (should, to be supposed to)

        | Person | Form |
        |---|---|
        | <span lang="de">ich</span> | <span lang="de">soll</span> |
        | <span lang="de">du</span> | <span lang="de">sollst</span> |
        | <span lang="de">er/sie/es</span> | <span lang="de">soll</span> |
        | <span lang="de">wir</span> | <span lang="de">sollen</span> |
        | <span lang="de">ihr</span> | <span lang="de">sollt</span> |
        | <span lang="de">sie/Sie</span> | <span lang="de">sollen</span> |

        #### <span lang="de">möchten</span> (would like to)

        <span lang="de">Möchten</span> is technically the <span lang="de">Konjunktiv II</span> (subjunctive II) form of <span lang="de">mögen</span>, but at A1 level it is best treated as an independent modal verb. It has **no vowel change** and the 1st and 3rd person singular are the same, with **no ending in the singular**.

        | Person | Form |
        |---|---|
        | <span lang="de">ich</span> | <span lang="de">möchte</span> |
        | <span lang="de">du</span> | <span lang="de">möchtest</span> |
        | <span lang="de">er/sie/es</span> | <span lang="de">möchte</span> |
        | <span lang="de">wir</span> | <span lang="de">möchten</span> |
        | <span lang="de">ihr</span> | <span lang="de">möchtet</span> |
        | <span lang="de">sie/Sie</span> | <span lang="de">möchten</span> |

        ---

        ### Word order: the sentence bracket

        When a modal verb is used with another verb, the main verb goes to the **end of the sentence as an infinitive**. The modal verb stays in position 2.

        > <span lang="de">Ich **will** eine Ausbildung als Schreiner **machen**.</span> — I want to do an apprenticeship as a carpenter.

        > <span lang="de">Du **musst** zuerst die Hausaufgaben **machen**.</span> — You must do your homework first.

        > <span lang="de">Sie **dürfen** hier nicht rauchen.</span> — You are not allowed to smoke here.

        In a **yes/no question**, the modal verb moves to position 1:

        > <span lang="de">**Kannst** du Gitarre **spielen**?</span> — Can you play guitar?

        > <span lang="de">**Möchtest** du eine Tasse Tee?</span> — Would you like a cup of tea?

        In a **wh-question**, the question word is position 1 and the modal verb stays in position 2:

        > <span lang="de">Was **soll** ich **machen**?</span> — What am I supposed to do?

        ---

        ### Using a modal verb without a main verb

        Sometimes the main verb is left out when it is obvious from context. This is common with verbs of motion or with <span lang="de">möchten</span>.

        > <span lang="de">Ich möchte einen Kaffee.</span> — I would like a coffee. (no infinitive needed)

        > <span lang="de">Ich muss jetzt nach Hause.</span> — I have to go home now. (the verb 'go' is implied)

        ---

        ### Common learner mistakes

        **1. Forgetting to send the main verb to the end**

        - ✗ <span lang="de">Ich kann spielen Gitarre.</span>
        - ✓ <span lang="de">Ich kann Gitarre spielen.</span>

        **2. Conjugating the main verb instead of the modal**

        - ✗ <span lang="de">Ich kann spielst Gitarre.</span>
        - ✓ <span lang="de">Ich kann Gitarre spielen.</span> (main verb stays in the infinitive)

        **3. Using the wrong form for <span lang="de">wollen</span> — confusing it with English 'will'**

        <span lang="de">Wollen</span> expresses *wanting*, not future tense. <span lang="de">Ich will</span> means 'I want to', not 'I will'.

        - ✗ Using <span lang="de">ich will kommen</span> to mean 'I will come' (as a future promise)
        - ✓ <span lang="de">Ich will kommen</span> means 'I want to come'

        **4. Adding an extra ending to the <span lang="de">ich</span> form**

        Modal verbs have **no <span lang="de">-e</span> ending** in the 1st person singular.

        - ✗ <span lang="de">Ich kanne Deutsch sprechen.</span>
        - ✓ <span lang="de">Ich kann Deutsch sprechen.</span>

        ---

        ### Quick meaning summary

        > <span lang="de">Ich **kann** schwimmen.</span> — I can swim. *(ability)*

        > <span lang="de">Ich **will** schwimmen.</span> — I want to swim. *(desire)*

        > <span lang="de">Ich **muss** schwimmen.</span> — I must swim. *(necessity)*

        > <span lang="de">Ich **darf** hier schwimmen.</span> — I am allowed to swim here. *(permission)*

        > <span lang="de">Ich **soll** schwimmen.</span> — I am supposed to swim. *(obligation from outside)*

        > <span lang="de">Ich **möchte** schwimmen.</span> — I would like to swim. *(polite wish)*
      language: en
      why_this_matters: Modal verbs appear in almost every German conversation — you
        need them to say what you can do, what you want, or what you must do. Without
        them, you cannot express nuance, make polite requests, or talk about rules
        and permissions.

- code: separable_verbs
  cefr_level: A1
  category: verb
  subcategory: Verben mit trennbarem Präfix
  label: Verben mit trennbarem Präfix
  description: Verbs with separable prefixes where the prefix is split off and placed
    at the end of the main clause.
  examples:
  - Wann fängt der Kurs an?
  - Wo kaufst du gerne ein?
  - Mach bitte das Fenster zu!
  - Der Unterricht fängt um 9 Uhr an.
  source_note: Verben mit trennbarem Präfix
  explanations:
    en:
      title: 'Separable verbs: splitting the prefix'
      tip: Some German verbs have a detachable prefix that jumps to the very end of
        the sentence in the present tense. The base verb still sits in its normal
        second position — only the prefix moves.
      explanation: |-
        ## Separable Verbs in German

        ### What is a separable verb?

        A <span lang="de">trennbares Verb</span> (separable verb) is a verb made up of a **base verb** plus a **prefix** that can be detached. In a normal main-clause statement or question, the conjugated base verb stays in its usual position (position 2 in a statement), while the **prefix moves to the very end** of the clause. The two parts together form what is called the <span lang="de">Satzklammer</span> (sentence bracket) — they 'bracket' the rest of the sentence.

        ---

        ### Common separable prefixes

        The most frequent separable prefixes at A1 level are:

        | Prefix | Example verb | Meaning |
        |---|---|---|
        | <span lang="de">an-</span> | <span lang="de">anfangen</span> | to begin |
        | <span lang="de">auf-</span> | <span lang="de">aufmachen</span> | to open |
        | <span lang="de">aus-</span> | <span lang="de">ausgehen</span> | to go out |
        | <span lang="de">ein-</span> | <span lang="de">einkaufen</span> | to shop |
        | <span lang="de">mit-</span> | <span lang="de">mitkommen</span> | to come along |
        | <span lang="de">zu-</span> | <span lang="de">zumachen</span> | to close |
        | <span lang="de">ab-</span> | <span lang="de">abfahren</span> | to depart |
        | <span lang="de">an-</span> | <span lang="de">ankommen</span> | to arrive |
        | <span lang="de">vor-</span> | <span lang="de">vorstellen</span> | to introduce |
        | <span lang="de">zurück-</span> | <span lang="de">zurückkommen</span> | to come back |

        ---

        ### Formation in the present tense

        **Step 1:** Conjugate the base verb normally and place it in position 2.
        **Step 2:** Send the prefix to the very end of the clause.

        > <span lang="de">anfangen</span> → base verb <span lang="de">fängt</span> (position 2) + prefix <span lang="de">an</span> (end)

        **Pattern:**

        > Subject + [other words] + **conjugated base verb** + [rest of sentence] + **prefix**

        ---

        ### Examples with translations

        1. <span lang="de">Der Kurs **fängt** um 9 Uhr **an**.</span>
           — The course begins at 9 o'clock.

        2. <span lang="de">Ich **kaufe** heute im Supermarkt **ein**.</span>
           — I am shopping at the supermarket today.

        3. <span lang="de">**Machst** du das Fenster **auf**?</span>
           — Are you opening the window?

        4. <span lang="de">Wann **kommt** der Zug **an**?</span>
           — When does the train arrive?

        5. <span lang="de">Sie **geht** jeden Abend **aus**.</span>
           — She goes out every evening.

        6. <span lang="de">Wir **kommen** morgen **zurück**.</span>
           — We are coming back tomorrow.

        ---

        ### In questions

        In yes/no questions, the conjugated verb moves to position 1, but the prefix **still goes to the end**:

        > <span lang="de">**Fängst** du jetzt **an**?</span> — Are you starting now?

        In questions with a question word (<span lang="de">Ergänzungsfragen</span>), the question word takes position 1, the verb takes position 2, and the prefix goes to the end:

        > <span lang="de">Wann **fährt** der Bus **ab**?</span> — When does the bus depart?

        ---

        ### In imperative sentences

        In commands, the base verb comes first and the prefix goes to the end:

        > <span lang="de">**Mach** bitte das Fenster **zu**!</span> — Please close the window!
        > <span lang="de">**Kommen** Sie bitte **mit**!</span> — Please come along!

        ---

        ### The infinitive and dictionary form

        In dictionaries and word lists, separable verbs are written as **one word** with the prefix attached:
        <span lang="de">anfangen, einkaufen, zumachen, ausgehen</span>.

        When the infinitive is used after a modal verb (e.g. <span lang="de">müssen, können, wollen</span>), the verb is **not separated** — it stays as one word at the end:

        > <span lang="de">Ich muss jetzt **einkaufen**.</span> — I have to go shopping now.
        > <span lang="de">Kannst du das Fenster **aufmachen**?</span> — Can you open the window?

        ---

        ### Past participle (<span lang="de">Partizip II</span>)

        The <span lang="de">ge-</span> of the past participle is inserted **between** the prefix and the base verb:

        | Infinitive | Past participle |
        |---|---|
        | <span lang="de">anfangen</span> | <span lang="de">ange**fangen**</span> |
        | <span lang="de">einkaufen</span> | <span lang="de">ein**ge**kauft</span> |
        | <span lang="de">ausgehen</span> | <span lang="de">aus**ge**gangen</span> |
        | <span lang="de">ankommen</span> | <span lang="de">an**ge**kommen</span> |

        > <span lang="de">Ich habe heute **eingekauft**.</span> — I went shopping today.

        ---

        ### Common learner mistakes

        **Mistake 1: Keeping the prefix attached to the verb**

        ❌ <span lang="de">Ich anfange jetzt.</span>
        ✅ <span lang="de">Ich fange jetzt an.</span>

        **Mistake 2: Putting the prefix in the middle of the sentence**

        ❌ <span lang="de">Ich fange an jetzt.</span>
        ✅ <span lang="de">Ich fange jetzt an.</span>

        **Mistake 3: Separating the verb when using a modal**

        ❌ <span lang="de">Ich muss jetzt fange an.</span>
        ✅ <span lang="de">Ich muss jetzt anfangen.</span>

        **Mistake 4: Incorrect past participle — forgetting to insert <span lang="de">-ge-</span>**

        ❌ <span lang="de">Ich habe angefangt.</span>
        ✅ <span lang="de">Ich habe angefangen.</span>

        ---

        ### Quick reference: present tense of <span lang="de">anfangen</span>

        | Person | Form | Example |
        |---|---|---|
        | <span lang="de">ich</span> | <span lang="de">fange … an</span> | <span lang="de">Ich fange an.</span> |
        | <span lang="de">du</span> | <span lang="de">fängst … an</span> | <span lang="de">Du fängst an.</span> |
        | <span lang="de">er/sie/es</span> | <span lang="de">fängt … an</span> | <span lang="de">Er fängt an.</span> |
        | <span lang="de">wir</span> | <span lang="de">fangen … an</span> | <span lang="de">Wir fangen an.</span> |
        | <span lang="de">ihr</span> | <span lang="de">fangt … an</span> | <span lang="de">Ihr fangt an.</span> |
        | <span lang="de">sie/Sie</span> | <span lang="de">fangen … an</span> | <span lang="de">Sie fangen an.</span> |
      language: en
      why_this_matters: Separable verbs are everywhere in everyday German — shopping,
        arriving, starting, opening, and hundreds more everyday actions use them.
        If you don't move the prefix to the end, your sentence will sound incomplete
        or confusing to a native speaker.

- code: noun_gender
  cefr_level: A1
  category: nomen
  subcategory: Genus
  label: 'Genus der Nomen: der/die/das'
  description: Grammatical gender of nouns (masculine, feminine, neuter) as listed
    in the word list.
  examples:
  - der Apfel/die Sonne/das Kind
  source_note: 'Genus: der/die/das'
  explanations:
    en:
      title: 'Noun gender: der, die, das'
      tip: 'Every German noun has a grammatical gender: masculine (der), feminine
        (die), or neuter (das). Gender is not always logical — you must learn each
        noun together with its article as one unit.'
      explanation: |-
        ## Noun Gender in German

        ### What is grammatical gender?

        Every German noun belongs to one of three grammatical genders:

        | Gender | Article | Example |
        |--------|---------|------------------|
        | Masculine | <span lang="de">der</span> | <span lang="de">der Apfel</span> (the apple) |
        | Feminine | <span lang="de">die</span> | <span lang="de">die Sonne</span> (the sun) |
        | Neuter | <span lang="de">das</span> | <span lang="de">das Kind</span> (the child) |

        Grammatical gender is not the same as natural gender. <span lang="de">das Mädchen</span> (the girl) is grammatically neuter, even though it refers to a female person.

        ---

        ### The golden rule

        **Always learn every noun together with its definite article.** Do not memorise <span lang="de">Apfel</span> — memorise <span lang="de">der Apfel</span>. This habit will protect you as you advance to cases, adjective endings, and pronouns.

        ---

        ### Helpful gender patterns

        While there are exceptions, several endings and categories are strongly associated with a particular gender.

        #### Masculine — <span lang="de">der</span>

        - **Male people and animals:** <span lang="de">der Mann</span> (the man), <span lang="de">der Hund</span> (the dog — male)
        - **Nouns ending in <span lang="de">-er</span> (agent nouns):** <span lang="de">der Lehrer</span> (the teacher), <span lang="de">der Bäcker</span> (the baker)
        - **Days, months, seasons:** <span lang="de">der Montag</span> (Monday), <span lang="de">der Januar</span> (January), <span lang="de">der Winter</span> (winter)
        - **Nouns ending in <span lang="de">-ig, -ling, -ismus</span>:** <span lang="de">der Honig</span> (honey), <span lang="de">der Frühling</span> (spring)

        #### Feminine — <span lang="de">die</span>

        - **Female people and animals:** <span lang="de">die Frau</span> (the woman), <span lang="de">die Katze</span> (the cat — female)
        - **Nouns ending in <span lang="de">-ung</span>:** <span lang="de">die Wohnung</span> (the flat/apartment), <span lang="de">die Zeitung</span> (the newspaper)
        - **Nouns ending in <span lang="de">-heit, -keit, -schaft, -tion, -ität</span>:** <span lang="de">die Freiheit</span> (freedom), <span lang="de">die Freundschaft</span> (friendship), <span lang="de">die Station</span> (the station)
        - **Nouns ending in <span lang="de">-e</span> (many, not all):** <span lang="de">die Sonne</span> (the sun), <span lang="de">die Straße</span> (the street)

        #### Neuter — <span lang="de">das</span>

        - **Diminutives ending in <span lang="de">-chen</span> or <span lang="de">-lein</span>:** <span lang="de">das Mädchen</span> (the girl), <span lang="de">das Büchlein</span> (the little book)
        - **Infinitives used as nouns:** <span lang="de">das Essen</span> (the food/eating), <span lang="de">das Schreiben</span> (the writing)
        - **Nouns ending in <span lang="de">-um</span>:** <span lang="de">das Zentrum</span> (the centre), <span lang="de">das Museum</span> (the museum)
        - **Most metals and chemical elements:** <span lang="de">das Gold</span> (gold), <span lang="de">das Eisen</span> (iron)

        ---

        ### Examples in sentences

        1. <span lang="de">Der Apfel ist rot.</span> — The apple is red.
        2. <span lang="de">Die Sonne scheint heute.</span> — The sun is shining today.
        3. <span lang="de">Das Kind spielt im Park.</span> — The child is playing in the park.
        4. <span lang="de">Der Lehrer erklärt die Aufgabe.</span> — The teacher explains the task.
        5. <span lang="de">Die Wohnung ist groß.</span> — The flat is big.
        6. <span lang="de">Das Mädchen liest ein Buch.</span> — The girl is reading a book.

        ---

        ### Common learner mistakes

        **Mistake:** Guessing gender based on meaning.
        > ❌ <span lang="de">*die Apfel</span> (because an apple feels like a common word?)
        > ✅ <span lang="de">der Apfel</span>

        **Mistake:** Assuming natural gender always matches grammatical gender.
        > ❌ <span lang="de">*der Mädchen</span> (because a girl is female)
        > ✅ <span lang="de">das Mädchen</span> (the <span lang="de">-chen</span> ending makes it neuter)

        **Mistake:** Learning the noun alone without the article.
        > ❌ Memorising just <span lang="de">Tisch</span>
        > ✅ Memorising <span lang="de">der Tisch</span> (the table)

        ---

        ### Quick-reference: gender by common ending

        | Ending | Gender | Example |
        |------------|--------|---------------------------|
        | <span lang="de">-ung</span> | <span lang="de">die</span> | <span lang="de">die Zeitung</span> |
        | <span lang="de">-heit / -keit</span> | <span lang="de">die</span> | <span lang="de">die Freiheit</span> |
        | <span lang="de">-schaft</span> | <span lang="de">die</span> | <span lang="de">die Freundschaft</span> |
        | <span lang="de">-tion</span> | <span lang="de">die</span> | <span lang="de">die Station</span> |
        | <span lang="de">-er</span> (agent) | <span lang="de">der</span> | <span lang="de">der Lehrer</span> |
        | <span lang="de">-ig / -ling</span> | <span lang="de">der</span> | <span lang="de">der Frühling</span> |
        | <span lang="de">-chen / -lein</span> | <span lang="de">das</span> | <span lang="de">das Mädchen</span> |
        | <span lang="de">-um</span> | <span lang="de">das</span> | <span lang="de">das Zentrum</span> |

        > **Note:** These patterns help, but exceptions exist. Always verify the gender when you learn a new word.
      language: en
      why_this_matters: Gender controls which article form you use, and it ripples
        through cases, adjective endings, and pronouns — so getting it right from
        the start saves you enormous effort later. Almost every German sentence contains
        a noun, so you will meet this rule constantly.

- code: noun_plural
  cefr_level: A1
  category: nomen
  subcategory: Numerus
  label: Singular und Plural der Nomen
  description: Singular and plural forms of nouns as specified in the A1 word list.
  examples:
  - Drei Fahrkarten nach Berlin und eine Fahrkarte nach Karlsruhe, bitte.
  source_note: Singular/Plural der Nomen wie in der Wortliste
  explanations:
    en:
      title: Singular and plural forms of nouns
      tip: German nouns form their plurals in several different ways — there is no
        single rule like adding -s in English. You must learn the plural form of each
        noun together with its gender when you first meet the word.
      explanation: |-
        ## Singular and Plural of German Nouns

        ### The Core Rule

        Every German noun has a **singular** (one) and a **plural** (more than one) form. Unlike English, which almost always adds *-s* or *-es*, German uses **several different strategies** to build the plural. There is no single ending that works for all nouns. This means the plural form is a fixed property of each noun — like its gender — and must be memorised.

        Dictionaries and word lists always give the plural form alongside the noun. It is written after the gender, for example: <span lang="de">der Zug, die Züge</span> (the train, the trains).

        ---

        ### The Six Main Plural Patterns

        Below are the main ways German nouns form their plural. Each pattern may also involve an **umlaut** (a vowel change: <span lang="de">a → ä, o → ö, u → ü, au → äu</span>).

        | Pattern | What happens | Singular | Plural |
        |---|---|---|---|
        | **-e** | add <span lang="de">-e</span> | <span lang="de">der Tag</span> | <span lang="de">die Tage</span> |
        | **-e + umlaut** | add <span lang="de">-e</span>, change vowel | <span lang="de">der Zug</span> | <span lang="de">die Züge</span> |
        | **-er** | add <span lang="de">-er</span> | <span lang="de">das Kind</span> | <span lang="de">die Kinder</span> |
        | **-er + umlaut** | add <span lang="de">-er</span>, change vowel | <span lang="de">das Haus</span> | <span lang="de">die Häuser</span> |
        | **-(e)n** | add <span lang="de">-(e)n</span> | <span lang="de">die Frau</span> | <span lang="de">die Frauen</span> |
        | **no ending (∅)** | no change (umlaut possible) | <span lang="de">der Lehrer</span> | <span lang="de">die Lehrer</span> |
        | **no ending + umlaut** | no change, change vowel | <span lang="de">der Vater</span> | <span lang="de">die Väter</span> |
        | **-s** | add <span lang="de">-s</span> (loanwords) | <span lang="de">das Kino</span> | <span lang="de">die Kinos</span> |

        ---

        ### The Plural Article

        In the plural, **all genders use the same definite article**: <span lang="de">die</span>.

        - <span lang="de">der Mann → die Männer</span> (the man → the men)
        - <span lang="de">die Frau → die Frauen</span> (the woman → the women)
        - <span lang="de">das Kind → die Kinder</span> (the child → the children)

        The **indefinite article** (<span lang="de">ein/eine/ein</span>) has **no plural form**. In the plural you either use <span lang="de">die</span> or no article at all.

        - <span lang="de">ein Apfel → Äpfel / die Äpfel</span> (an apple → apples / the apples)

        ---

        ### Useful Patterns by Gender

        While there are many exceptions, these tendencies can help:

        - **Feminine nouns** (<span lang="de">die</span>) very often take <span lang="de">-(e)n</span> in the plural:
          <span lang="de">die Frau → die Frauen</span>, <span lang="de">die Straße → die Straßen</span>
        - **Masculine nouns** (<span lang="de">der</span>) often take <span lang="de">-e</span> (with or without umlaut):
          <span lang="de">der Brief → die Briefe</span>, <span lang="de">der Arzt → die Ärzte</span>
        - **Neuter nouns** (<span lang="de">das</span>) often take <span lang="de">-e</span> or <span lang="de">-er</span>:
          <span lang="de">das Jahr → die Jahre</span>, <span lang="de">das Buch → die Bücher</span>
        - **Nouns ending in <span lang="de">-er, -el, -en</span>** (mostly masculine/neuter) often have **no ending change**:
          <span lang="de">der Lehrer → die Lehrer</span>, <span lang="de">das Messer → die Messer</span>
        - **Loanwords** (especially from English) usually take <span lang="de">-s</span>:
          <span lang="de">das Handy → die Handys</span>, <span lang="de">das Café → die Cafés</span>

        ---

        ### Examples from the A1 Word List

        | Singular | Plural | English |
        |---|---|---|
        | <span lang="de">die Fahrkarte</span> | <span lang="de">die Fahrkarten</span> | ticket / tickets |
        | <span lang="de">das Zimmer</span> | <span lang="de">die Zimmer</span> | room / rooms |
        | <span lang="de">der Kurs</span> | <span lang="de">die Kurse</span> | course / courses |
        | <span lang="de">das Buch</span> | <span lang="de">die Bücher</span> | book / books |
        | <span lang="de">die Stadt</span> | <span lang="de">die Städte</span> | city / cities |
        | <span lang="de">das Haus</span> | <span lang="de">die Häuser</span> | house / houses |
        | <span lang="de">der Mann</span> | <span lang="de">die Männer</span> | man / men |
        | <span lang="de">die Frau</span> | <span lang="de">die Frauen</span> | woman / women |
        | <span lang="de">das Kind</span> | <span lang="de">die Kinder</span> | child / children |
        | <span lang="de">das Auto</span> | <span lang="de">die Autos</span> | car / cars |

        ---

        ### Example Sentences

        1. <span lang="de">Drei Fahrkarten nach Berlin und eine Fahrkarte nach Karlsruhe, bitte.</span>
           — Three tickets to Berlin and one ticket to Karlsruhe, please.

        2. <span lang="de">Die Kinder spielen im Garten.</span>
           — The children are playing in the garden.

        3. <span lang="de">Ich brauche zwei Zimmer.</span>
           — I need two rooms.

        4. <span lang="de">Wo sind die Bücher?</span>
           — Where are the books?

        5. <span lang="de">Die Häuser hier sind sehr alt.</span>
           — The houses here are very old.

        6. <span lang="de">Wie viele Kurse hast du?</span>
           — How many courses do you have?

        ---

        ### Common Learner Mistakes

        **❌ Adding -s to all nouns (English transfer)**
        > <span lang="de">*die Kinds, die Manns, die Tags</span>

        **✓ Correct:**
        > <span lang="de">die Kinder, die Männer, die Tage</span>

        German only uses <span lang="de">-s</span> as a plural ending for loanwords and a small group of other nouns. Do not apply it generally.

        ---

        **❌ Forgetting the umlaut**
        > <span lang="de">*die Bucher, *die Stadte</span>

        **✓ Correct:**
        > <span lang="de">die Bücher, die Städte</span>

        The umlaut is part of the plural form — always write and pronounce it.

        ---

        **❌ Using the wrong article in the plural**
        > <span lang="de">*der Männer, *das Kinder</span>

        **✓ Correct:**
        > <span lang="de">die Männer, die Kinder</span>

        All plural nouns use <span lang="de">die</span>, regardless of the singular gender.

        ---

        ### Practical Tip

        Whenever you learn a new noun, always learn **three things together**: the article, the noun, and the plural form. For example, learn <span lang="de">der Zug – die Züge</span> as one unit, not just <span lang="de">Zug</span> alone. This habit will save you a great deal of effort later.
      language: en
      why_this_matters: You cannot talk about more than one thing without knowing
        the plural form. Plurals appear in almost every sentence, and getting them
        wrong can make you hard to understand or sound unnatural.

- code: nominative_case
  cefr_level: A1
  category: nomen
  subcategory: Kasus
  label: Nominativ aller Nomen der Wortliste
  description: Nominative case of all nouns in the word list, used for the subject
    of a sentence.
  examples:
  - der Mann
  - Er heißt Heinz Bartels.
  source_note: Nominativ aller Nomen in der Wortliste
  explanations:
    en:
      title: 'The nominative case: the subject'
      tip: 'The nominative case marks the subject of a sentence — the person or thing
        doing or being something. It is the ''default'' form you find in a dictionary.
        Watch the article: it tells you the gender and the case.'
      explanation: |-
        ## The Nominative Case in German

        ### What is the nominative case?

        German nouns change their article depending on their role in a sentence. This system is called **case** (<span lang="de">Kasus</span>). The nominative (<span lang="de">Nominativ</span>) is the case used for the **subject** of a sentence — the noun that performs the action of the verb, or the noun that is described by a linking verb like <span lang="de">sein</span> (to be) or <span lang="de">heißen</span> (to be called).

        The nominative is also the form listed in dictionaries, so every new noun you look up is already in the nominative.

        ---

        ### Definite articles in the nominative

        The definite article (<span lang="de">bestimmter Artikel</span>) has three forms in the nominative, one for each grammatical gender, plus a plural form:

        | Gender | Nominative article | Example |
        |--------|-------------------|----------|
        | masculine (<span lang="de">maskulin</span>) | <span lang="de">der</span> | <span lang="de">der Mann</span> (the man) |
        | feminine (<span lang="de">feminin</span>) | <span lang="de">die</span> | <span lang="de">die Frau</span> (the woman) |
        | neuter (<span lang="de">neutrum</span>) | <span lang="de">das</span> | <span lang="de">das Kind</span> (the child) |
        | plural (all genders) | <span lang="de">die</span> | <span lang="de">die Männer</span> (the men) |

        ---

        ### Indefinite articles in the nominative

        The indefinite article (<span lang="de">unbestimmter Artikel</span>) follows a similar pattern:

        | Gender | Nominative article | Example |
        |--------|-------------------|----------|
        | masculine | <span lang="de">ein</span> | <span lang="de">ein Mann</span> (a man) |
        | feminine | <span lang="de">eine</span> | <span lang="de">eine Frau</span> (a woman) |
        | neuter | <span lang="de">ein</span> | <span lang="de">ein Kind</span> (a child) |
        | plural | — (no article) | <span lang="de">Männer</span> (men) |

        ---

        ### How to find the subject

        Ask: *Who or what is doing the action?* That noun is the subject and takes the nominative case.

        In <span lang="de">Der Mann kauft Brot.</span> (The man buys bread.), ask: *Who buys?* → <span lang="de">der Mann</span> → nominative.

        With linking verbs like <span lang="de">sein</span> (to be) and <span lang="de">heißen</span> (to be called), **both** the subject and the noun or pronoun after the verb are in the nominative. This is called a **nominative complement** (<span lang="de">Nominativergänzung</span>).

        > <span lang="de">Das ist ein Tisch.</span> — *That is a table.* (Both <span lang="de">das</span> and <span lang="de">ein Tisch</span> are nominative.)

        ---

        ### Examples

        1. <span lang="de">Der Mann heißt Heinz Bartels.</span> — *The man is called Heinz Bartels.*
        2. <span lang="de">Die Frau ist Ärztin.</span> — *The woman is a doctor.*
        3. <span lang="de">Das Kind spielt.</span> — *The child plays.*
        4. <span lang="de">Ein Bus kommt.</span> — *A bus is coming.*
        5. <span lang="de">Die Kinder essen.</span> — *The children are eating.*
        6. <span lang="de">Das ist meine Mutter.</span> — *That is my mother.*

        ---

        ### Common learner mistakes

        **Mistake 1: Using the wrong article gender**

        Learners sometimes use <span lang="de">die</span> for all nouns because it sounds familiar.

        - ❌ <span lang="de">Die Mann kommt.</span>
        - ✅ <span lang="de">Der Mann kommt.</span>

        Always learn the article together with each new noun: not just <span lang="de">Mann</span>, but <span lang="de">der Mann</span>.

        **Mistake 2: Confusing nominative with accusative**

        The masculine article changes in the accusative (<span lang="de">den</span>), but feminine and neuter do **not** change. In the nominative, masculine is always <span lang="de">der</span>.

        - ❌ <span lang="de">Den Mann ist nett.</span> (accusative article used for subject)
        - ✅ <span lang="de">Der Mann ist nett.</span>

        **Mistake 3: Forgetting that both nouns after 'sein' are nominative**

        - ❌ <span lang="de">Er ist einen Lehrer.</span> (accusative article wrongly used)
        - ✅ <span lang="de">Er ist ein Lehrer.</span>

        ---

        ### Quick reference: nominative articles at a glance

        | | masculine | feminine | neuter | plural |
        |---|---|---|---|---|
        | definite | <span lang="de">der</span> | <span lang="de">die</span> | <span lang="de">das</span> | <span lang="de">die</span> |
        | indefinite | <span lang="de">ein</span> | <span lang="de">eine</span> | <span lang="de">ein</span> | — |

        Memorising this table is one of the most valuable investments you can make in German at A1 level.
      language: en
      why_this_matters: Every German sentence has a subject, so you will use the nominative
        in absolutely every sentence you speak or write. Knowing which form the article
        takes in the nominative is also the foundation for understanding how articles
        change in other cases.

- code: accusative_case
  cefr_level: A1
  category: nomen
  subcategory: Kasus
  label: Akkusativ aller Nomen der Wortliste
  description: Accusative case of all nouns in the word list, used for direct objects
    and with certain prepositions.
  examples:
  - den Mann
  - Ich nehme eine Coca Cola.
  source_note: Akkusativ aller Nomen in der Wortliste
  explanations:
    en:
      title: The accusative case
      tip: 'The accusative case marks the direct object of a sentence — the person
        or thing directly receiving the action. In German, only masculine nouns change
        their article in the accusative: ''der'' becomes ''den''.'
      explanation: |-
        ## The Accusative Case in German

        ### What is the accusative case?

        German nouns appear in different **cases** depending on their role in a sentence. The **accusative case** (<span lang="de">der Akkusativ</span>) marks the **direct object** — the noun that directly receives the action of the verb. It also appears after certain prepositions.

        > <span lang="de">Ich sehe **den Mann**.</span> — I see the man.

        Here, <span lang="de">der Mann</span> is the direct object (the man being seen), so it takes the accusative form <span lang="de">den Mann</span>.

        ---

        ### How does the accusative change the article?

        Only **masculine** nouns change their article in the accusative. Feminine, neuter, and plural nouns look exactly the same as in the nominative.

        #### Definite article (<span lang="de">bestimmter Artikel</span>)

        | Gender | Nominative | Accusative |
        |--------|-----------|------------|
        | masculine (<span lang="de">der</span>) | <span lang="de">der</span> | <span lang="de">**den**</span> |
        | feminine (<span lang="de">die</span>) | <span lang="de">die</span> | <span lang="de">die</span> |
        | neuter (<span lang="de">das</span>) | <span lang="de">das</span> | <span lang="de">das</span> |
        | plural (<span lang="de">die</span>) | <span lang="de">die</span> | <span lang="de">die</span> |

        #### Indefinite article (<span lang="de">unbestimmter Artikel</span>)

        | Gender | Nominative | Accusative |
        |--------|-----------|------------|
        | masculine | <span lang="de">ein</span> | <span lang="de">**einen**</span> |
        | feminine | <span lang="de">eine</span> | <span lang="de">eine</span> |
        | neuter | <span lang="de">ein</span> | <span lang="de">ein</span> |
        | plural | <span lang="de">—</span> | <span lang="de">—</span> |

        #### Negative article (<span lang="de">Negativartikel</span>)

        | Gender | Nominative | Accusative |
        |--------|-----------|------------|
        | masculine | <span lang="de">kein</span> | <span lang="de">**keinen**</span> |
        | feminine | <span lang="de">keine</span> | <span lang="de">keine</span> |
        | neuter | <span lang="de">kein</span> | <span lang="de">kein</span> |
        | plural | <span lang="de">keine</span> | <span lang="de">keine</span> |

        #### Possessive article (<span lang="de">Possessivartikel</span> — e.g. <span lang="de">mein</span>)

        Possessive articles follow the same pattern as <span lang="de">kein</span>:

        | Gender | Nominative | Accusative |
        |--------|-----------|------------|
        | masculine | <span lang="de">mein</span> | <span lang="de">**meinen**</span> |
        | feminine | <span lang="de">meine</span> | <span lang="de">meine</span> |
        | neuter | <span lang="de">mein</span> | <span lang="de">mein</span> |
        | plural | <span lang="de">meine</span> | <span lang="de">meine</span> |

        The same applies to <span lang="de">dein, sein, ihr, Ihr</span>, etc.

        ---

        ### When do you use the accusative?

        #### 1. Direct objects

        The most common use. Ask yourself: *What/whom is the subject acting on?*

        - <span lang="de">Ich kaufe **einen Kaffee**.</span> — I'm buying a coffee.
        - <span lang="de">Sie nimmt **das Buch**.</span> — She takes the book.
        - <span lang="de">Hast du **einen Stift**?</span> — Do you have a pen?
        - <span lang="de">Er hat **keine Zeit**.</span> — He has no time.

        #### 2. After certain prepositions

        Some prepositions always take the accusative. At A1 level, the most important ones are:

        | Preposition | Meaning |
        |-------------|--------|
        | <span lang="de">durch</span> | through |
        | <span lang="de">für</span> | for |
        | <span lang="de">gegen</span> | against |
        | <span lang="de">ohne</span> | without |
        | <span lang="de">um</span> | around / at (time) |

        - <span lang="de">Das ist **für meinen Vater**.</span> — That is for my father.
        - <span lang="de">Ich gehe **ohne einen Regenschirm**.</span> — I'm going without an umbrella.

        ---

        ### Examples at a glance

        | German | English |
        |--------|---------|
        | <span lang="de">Ich sehe den Mann.</span> | I see the man. |
        | <span lang="de">Ich nehme eine Coca Cola.</span> | I'll have a Coca-Cola. |
        | <span lang="de">Er kauft einen Apfel.</span> | He buys an apple. |
        | <span lang="de">Wir haben keine Milch.</span> | We have no milk. |
        | <span lang="de">Das ist für dich.</span> | That is for you. |
        | <span lang="de">Sie sucht ihren Schlüssel.</span> | She is looking for her key. |

        ---

        ### Common learner mistakes

        **Mistake 1: Forgetting to change masculine articles**

        ❌ <span lang="de">Ich sehe der Mann.</span>
        ✅ <span lang="de">Ich sehe **den** Mann.</span>

        Remember: only masculine changes — <span lang="de">der → den</span>, <span lang="de">ein → einen</span>, <span lang="de">kein → keinen</span>.

        **Mistake 2: Changing feminine or neuter articles unnecessarily**

        ❌ <span lang="de">Ich kaufe dien Tasche.</span>
        ✅ <span lang="de">Ich kaufe **die** Tasche.</span>

        Feminine <span lang="de">die</span> stays <span lang="de">die</span> in the accusative.

        **Mistake 3: Confusing subject and object**

        ❌ <span lang="de">Den Mann sieht ein Hund.</span> (misreading — the man is the object here, and the dog is the subject)

        Always identify *who is doing* the action (nominative/subject) vs. *who receives* the action (accusative/direct object). Word order in German can vary, so the case ending is your guide.

        ---

        ### Quick memory tip

        Only **one** change to learn at A1: masculine <span lang="de">**der → den**</span> and <span lang="de">**ein → einen**</span>. Everything else stays the same. If you know the gender of a noun, you know whether to change the article.
      language: en
      why_this_matters: Almost every German sentence with an action verb has a direct
        object in the accusative case. Without it, you cannot say 'I see the man',
        'I want a coffee', or 'Do you have a pen?' — some of the most basic things
        you need to communicate.

- code: dative_case
  cefr_level: A1
  category: nomen
  subcategory: Kasus
  label: Dativ aller Nomen der Wortliste
  description: Dative case of all nouns in the word list, used for indirect objects
    and with certain verbs and prepositions. Marked as A2 addition (*) but listed
    here.
  examples:
  - dem Mann
  - Gib mir bitte mal dein Wörterbuch.
  - Kann ich dir helfen?
  source_note: Dativ* aller Nomen in der Wortliste (marked with * as A2 addition)
  explanations:
    en:
      title: The dative case
      tip: 'The dative case marks the indirect object — the person or thing that receives
        or benefits from an action. It is also required after certain verbs and prepositions.
        The article changes to show dative: <span lang="de">dem</span> (masc./neut.),
        <span lang="de">der</span> (fem.), <span lang="de">den</span> (plural).'
      explanation: |-
        ## The Dative Case in German

        ### What is the dative case?

        German nouns appear in different **cases** depending on their role in a sentence. The dative case (Dativ) most often marks the **indirect object** — the person or thing that something is given to, done for, or directed at. It is also required after a fixed set of verbs and prepositions.

        ---

        ### How dative articles differ from nominative

        The article (definite, indefinite, possessive, etc.) changes form in the dative. The noun itself usually stays the same, with one important exception noted below.

        #### Definite article (<span lang="de">der/die/das</span>)

        | Gender | Nominative | Dative |
        |--------|-----------|--------|
        | Masculine | <span lang="de">der Mann</span> | <span lang="de">dem Mann</span> |
        | Feminine | <span lang="de">die Frau</span> | <span lang="de">der Frau</span> |
        | Neuter | <span lang="de">das Kind</span> | <span lang="de">dem Kind</span> |
        | Plural | <span lang="de">die Kinder</span> | <span lang="de">den Kindern</span> |

        #### Indefinite article (<span lang="de">ein/eine</span>)

        | Gender | Nominative | Dative |
        |--------|-----------|--------|
        | Masculine | <span lang="de">ein Mann</span> | <span lang="de">einem Mann</span> |
        | Feminine | <span lang="de">eine Frau</span> | <span lang="de">einer Frau</span> |
        | Neuter | <span lang="de">ein Kind</span> | <span lang="de">einem Kind</span> |

        #### Possessive article (<span lang="de">mein, dein</span>, etc.) — same endings as indefinite

        | Gender | Nominative | Dative |
        |--------|-----------|--------|
        | Masculine | <span lang="de">mein Vater</span> | <span lang="de">meinem Vater</span> |
        | Feminine | <span lang="de">meine Mutter</span> | <span lang="de">meiner Mutter</span> |
        | Neuter | <span lang="de">mein Kind</span> | <span lang="de">meinem Kind</span> |
        | Plural | <span lang="de">meine Eltern</span> | <span lang="de">meinen Eltern</span> |

        #### Negative article (<span lang="de">kein/keine</span>) — same endings as indefinite/possessive

        | Gender | Nominative | Dative |
        |--------|-----------|--------|
        | Masculine | <span lang="de">kein Bruder</span> | <span lang="de">keinem Bruder</span> |
        | Feminine | <span lang="de">keine Schwester</span> | <span lang="de">keiner Schwester</span> |
        | Neuter | <span lang="de">kein Buch</span> | <span lang="de">keinem Buch</span> |
        | Plural | <span lang="de">keine Bücher</span> | <span lang="de">keinen Büchern</span> |

        ---

        ### The plural dative ending on the noun

        In the dative plural, the noun itself gets an extra <span lang="de">-n</span> if it does not already end in <span lang="de">-n</span> or <span lang="de">-s</span>:

        - <span lang="de">die Kinder</span> → <span lang="de">den Kindern</span>
        - <span lang="de">die Freunde</span> → <span lang="de">den Freunden</span>
        - <span lang="de">die Autos</span> → <span lang="de">den Autos</span> (no extra <span lang="de">-n</span> because it ends in <span lang="de">-s</span>)

        ---

        ### Three main uses of the dative

        #### 1. Indirect object

        The indirect object is the person who **receives** or **benefits from** the action.

        > <span lang="de">Ich gebe dem Mann das Buch.</span>
        > I give the man the book. (<span lang="de">dem Mann</span> = indirect object)

        > <span lang="de">Sie schreibt ihrer Mutter eine E-Mail.</span>
        > She writes her mother an email.

        #### 2. Dative verbs — verbs that always take dative

        Some common verbs take a dative object instead of an accusative one. You must memorise these:

        | Verb | Meaning |
        |------|---------|
        | <span lang="de">helfen</span> | to help |
        | <span lang="de">danken</span> | to thank |
        | <span lang="de">gefallen</span> | to please / to like |
        | <span lang="de">gehören</span> | to belong to |
        | <span lang="de">antworten</span> | to answer |
        | <span lang="de">schmecken</span> | to taste (to s.o.) |

        > <span lang="de">Kann ich dir helfen?</span>
        > Can I help you?

        > <span lang="de">Das Buch gehört meiner Schwester.</span>
        > The book belongs to my sister.

        #### 3. Dative prepositions — prepositions that always take dative

        These prepositions are **always** followed by dative:

        | Preposition | Meaning |
        |-------------|---------|
        | <span lang="de">mit</span> | with |
        | <span lang="de">bei</span> | at / near / with |
        | <span lang="de">nach</span> | after / to (cities) |
        | <span lang="de">von</span> | from / of |
        | <span lang="de">aus</span> | from / out of |
        | <span lang="de">zu</span> | to |
        | <span lang="de">seit</span> | since / for |
        | <span lang="de">gegenüber</span> | opposite |

        > <span lang="de">Ich fahre mit dem Bus.</span>
        > I travel by bus.

        > <span lang="de">Er wohnt bei seiner Tante.</span>
        > He lives with his aunt.

        > <span lang="de">Wir kommen aus der Schule.</span>
        > We are coming from school.

        ---

        ### Examples with translations

        1. <span lang="de">Gib mir bitte mal dein Wörterbuch.</span> — Please give me your dictionary.
        2. <span lang="de">Kann ich dir helfen?</span> — Can I help you?
        3. <span lang="de">Das Essen schmeckt meinem Vater gut.</span> — My father likes the food.
        4. <span lang="de">Sie spricht mit einem Freund.</span> — She is talking with a friend.
        5. <span lang="de">Ich danke meiner Lehrerin.</span> — I thank my teacher.
        6. <span lang="de">Er zeigt dem Kind das Foto.</span> — He shows the child the photo.

        ---

        ### Common learner mistakes

        **Mistake 1 — Using accusative instead of dative with dative verbs:**

        ❌ <span lang="de">Ich helfe meinen Bruder.</span>
        ✅ <span lang="de">Ich helfe meinem Bruder.</span>
        (<span lang="de">helfen</span> always takes dative)

        **Mistake 2 — Using accusative instead of dative after dative prepositions:**

        ❌ <span lang="de">Ich gehe mit meinen Vater.</span>
        ✅ <span lang="de">Ich gehe mit meinem Vater.</span>
        (<span lang="de">mit</span> always takes dative)

        **Mistake 3 — Forgetting the extra <span lang="de">-n</span> on plural nouns in dative:**

        ❌ <span lang="de">Ich spreche mit den Kinder.</span>
        ✅ <span lang="de">Ich spreche mit den Kindern.</span>

        **Mistake 4 — Confusing feminine dative (<span lang="de">der</span>) with the masculine nominative (<span lang="de">der</span>):**

        In the dative, <span lang="de">der</span> is the feminine article, not masculine. Compare:
        - <span lang="de">die Frau</span> (nom. fem.) → <span lang="de">der Frau</span> (dat. fem.)
        - <span lang="de">der Mann</span> (nom. masc.) → <span lang="de">dem Mann</span> (dat. masc.)

        ---

        ### Quick reference summary

        | | Masc. | Fem. | Neut. | Plural |
        |---|---|---|---|---|
        | **Definite** | <span lang="de">dem</span> | <span lang="de">der</span> | <span lang="de">dem</span> | <span lang="de">den (+n)</span> |
        | **Indefinite** | <span lang="de">einem</span> | <span lang="de">einer</span> | <span lang="de">einem</span> | — |
        | **Possessive / kein-** | <span lang="de">meinem</span> | <span lang="de">meiner</span> | <span lang="de">meinem</span> | <span lang="de">meinen (+n)</span> |
      language: en
      why_this_matters: Dative appears in everyday sentences whenever you give, show,
        help, or say something to someone. Without it you cannot correctly use verbs
        like <span lang="de">helfen</span>, <span lang="de">geben</span>, or <span
        lang="de">danken</span>, or prepositions like <span lang="de">mit</span>,
        <span lang="de">bei</span>, and <span lang="de">zu</span>.

- code: genitive_proper_name
  cefr_level: A1
  category: nomen
  subcategory: Kasus
  label: Genitiv bei Eigennamen im Singular
  description: Genitive case used with proper names in the singular (possessive -s),
    and genitive recognized receptively.
  examples:
  - Karls Freunde kommen heute Nachmittag.
  - die Nummer des Wagens
  source_note: Genitiv bei Eigennamen im Singular; Genitiv (rezeptiv)
  explanations:
    en:
      title: The genitive case with proper names
      tip: In German, you can show that something belongs to a person by adding -s
        directly to their name — no apostrophe needed, unlike English. You will also
        see the genitive used with a definite article and a changed noun ending in
        more formal or written German.
      explanation: |-
        ## The Genitive Case with Proper Names

        ### What the genitive does

        The **genitive case** expresses possession or belonging — it answers the question *whose?* In English you use either an apostrophe-s (*Karl's friends*) or the word *of* (*the number of the car*). German has two parallel patterns.

        ---

        ### Pattern 1 — Name + -s (the productive A1 pattern)

        Attach **-s** directly to a person's name. No apostrophe is written.

        | English | German |
        |---|---|
        | Karl's friends | <span lang="de">Karls Freunde</span> |
        | Anna's bag | <span lang="de">Annas Tasche</span> |
        | Thomas's car | <span lang="de">Thomas' Auto</span> |

        **Formation rules:**

        - Most names: simply add **-s** → <span lang="de">Anna → Annas</span>, <span lang="de">Karl → Karls</span>
        - Names already ending in **-s, -ss, -ß, -x, -z**: add only an apostrophe (no extra -s) → <span lang="de">Thomas → Thomas'</span>, <span lang="de">Max → Max'</span>
        - The genitive name comes **directly before** the noun it modifies, like an adjective.

        **Word order:** The possessive name leads the phrase.

        > <span lang="de">Karls Freunde kommen heute Nachmittag.</span>
        > *Karl's friends are coming this afternoon.*

        > <span lang="de">Annas Nummer ist nicht bekannt.</span>
        > *Anna's number is not known.*

        ---

        ### Pattern 2 — Article-based genitive (receptive recognition at A1)

        For common nouns (not proper names), German uses a **definite article** in the genitive form plus a noun ending. You need to **recognise** this pattern when reading or listening, but you are not yet expected to produce it freely at A1.

        **Genitive article forms:**

        | Gender | Nominative article | Genitive article | Noun ending |
        |---|---|---|---|
        | masculine | <span lang="de">der</span> | <span lang="de">des</span> | **-(e)s** |
        | neuter | <span lang="de">das</span> | <span lang="de">des</span> | **-(e)s** |
        | feminine | <span lang="de">die</span> | <span lang="de">der</span> | — |
        | plural | <span lang="de">die</span> | <span lang="de">der</span> | — |

        **Examples:**

        > <span lang="de">die Nummer des Wagens</span>
        > *the number of the car* (masculine: <span lang="de">der Wagen → des Wagens</span>)

        > <span lang="de">der Name des Kindes</span>
        > *the name of the child* (neuter: <span lang="de">das Kind → des Kindes</span>)

        > <span lang="de">die Tasche der Frau</span>
        > *the woman's bag* (feminine: <span lang="de">die Frau → der Frau</span>)

        **Note on the noun ending:** Masculine and neuter nouns add **-s** (for short words and most nouns) or **-es** (words ending in -s, -ß, -x, -z, or single-syllable words, e.g. <span lang="de">des Mannes</span>). Feminine and plural nouns do **not** change their ending.

        ---

        ### Summary of A1 focus

        | What to do | Pattern |
        |---|---|
        | **Produce** (speaking & writing) | Name + -s: <span lang="de">Karls Freunde</span> |
        | **Recognise** (reading & listening) | <span lang="de">des/der</span> + changed noun |

        ---

        ### Common learner mistakes

        **Mistake 1 — Writing an apostrophe before -s (English habit)**

        ❌ <span lang="de">Karl's Freunde</span>
        ✅ <span lang="de">Karls Freunde</span>

        German uses an apostrophe *only* when the name already ends in -s: <span lang="de">Thomas' Auto</span>.

        **Mistake 2 — Forgetting the noun ending in the article-based genitive**

        ❌ <span lang="de">die Nummer des Wagen</span>
        ✅ <span lang="de">die Nummer des Wagens</span>

        Masculine and neuter nouns need **-(e)s** after <span lang="de">des</span>.

        **Mistake 3 — Using <span lang="de">von</span> instead of the genitive**

        In spoken German, <span lang="de">von + dative</span> is very common as an alternative (e.g. <span lang="de">die Nummer von dem Wagen</span>), and this is acceptable. However, the article-based genitive is standard in writing, so learn to recognise both.
      language: en
      why_this_matters: Possession comes up constantly — whose bag is this, whose
        friend is coming, whose number is that. The name + -s pattern is the quickest
        way to express this at A1, and recognising the article-based genitive prepares
        you for reading real German texts from the very beginning.

- code: definite_article
  cefr_level: A1
  category: artikelwoerter_pronomen
  subcategory: Artikel
  label: Definiter Artikel der/die/das/die
  description: Definite articles der, die, das (singular) and die (plural) used with
    nouns across cases.
  examples:
  - der Tisch/die Lampe/das Bett/die Sachen
  source_note: 'Definit: der/die/das/die'
  explanations:
    en:
      title: 'Using definite articles: der, die, das, die'
      tip: German has three singular definite articles — <span lang="de">der</span>
        (masculine), <span lang="de">die</span> (feminine), and <span lang="de">das</span>
        (neuter) — plus <span lang="de">die</span> for all plurals. The article you
        use depends on the grammatical gender of the noun and its role in the sentence
        (case).
      explanation: |-
        ## Definite Articles in German

        The German definite article corresponds to English 'the', but it changes form depending on three factors: **grammatical gender** (masculine, feminine, neuter), **number** (singular or plural), and **case** (the role the noun plays in the sentence). At A1 level you need to know the four most common cases: **Nominative**, **Accusative**, **Dative**, and **Genitive**.

        ---

        ### What is grammatical gender?

        Every German noun belongs to one of three genders:
        - **Masculine** (<span lang="de">maskulin</span>): e.g. <span lang="de">der Tisch</span> (the table), <span lang="de">der Mann</span> (the man)
        - **Feminine** (<span lang="de">feminin</span>): e.g. <span lang="de">die Lampe</span> (the lamp), <span lang="de">die Frau</span> (the woman)
        - **Neuter** (<span lang="de">neutral</span>): e.g. <span lang="de">das Bett</span> (the bed), <span lang="de">das Kind</span> (the child)

        Gender is a grammatical property — it does not always match natural gender. You must **learn each noun together with its article**.

        ---

        ### The four cases

        The **case** of a noun tells you its role in the sentence:

        | Case | Role | English equivalent |
        |---|---|---|
        | **Nominative** | subject (who/what does the action) | — |
        | **Accusative** | direct object (what is directly affected) | — |
        | **Dative** | indirect object (to/for whom) | — |
        | **Genitive** | possession (of whom/what) | — |

        ---

        ### The definite article table

        | | Masculine | Feminine | Neuter | Plural (all genders) |
        |---|---|---|---|---|
        | **Nominative** | <span lang="de">der</span> | <span lang="de">die</span> | <span lang="de">das</span> | <span lang="de">die</span> |
        | **Accusative** | <span lang="de">den</span> | <span lang="de">die</span> | <span lang="de">das</span> | <span lang="de">die</span> |
        | **Dative** | <span lang="de">dem</span> | <span lang="de">der</span> | <span lang="de">dem</span> | <span lang="de">den</span> |
        | **Genitive** | <span lang="de">des</span> | <span lang="de">der</span> | <span lang="de">des</span> | <span lang="de">der</span> |

        > **Tip:** Only the masculine singular changes in the accusative (<span lang="de">der</span> → <span lang="de">den</span>). All other genders stay the same in nominative and accusative.

        ---

        ### Case-by-case examples

        **Nominative** (subject of the sentence):
        - <span lang="de">Der Tisch ist groß.</span> — The table is big.
        - <span lang="de">Die Lampe ist neu.</span> — The lamp is new.
        - <span lang="de">Das Bett ist weich.</span> — The bed is soft.
        - <span lang="de">Die Kinder spielen.</span> — The children are playing.

        **Accusative** (direct object):
        - <span lang="de">Ich kaufe den Tisch.</span> — I am buying the table.
        - <span lang="de">Er sieht die Lampe.</span> — He sees the lamp.
        - <span lang="de">Wir nehmen das Bett.</span> — We are taking the bed.
        - <span lang="de">Sie kauft die Sachen.</span> — She is buying the things.

        **Dative** (indirect object or after dative prepositions):
        - <span lang="de">Er gibt dem Mann das Buch.</span> — He gives the man the book.
        - <span lang="de">Ich helfe der Frau.</span> — I am helping the woman.
        - <span lang="de">Das Spielzeug gehört dem Kind.</span> — The toy belongs to the child.
        - <span lang="de">Wir danken den Lehrern.</span> — We thank the teachers.

        **Genitive** (possession — mainly with proper names at A1):
        - <span lang="de">Das ist das Auto des Mannes.</span> — That is the man's car.
        - <span lang="de">Die Farbe des Tisches gefällt mir.</span> — I like the colour of the table.

        ---

        ### Important variants and notes

        **Dative plural:** All plural nouns add <span lang="de">-n</span> to the noun in the dative (if they do not already end in <span lang="de">-n</span> or <span lang="de">-s</span>), and the article is <span lang="de">den</span>:
        - <span lang="de">mit den Kindern</span> (with the children) — note <span lang="de">Kindern</span>, not <span lang="de">Kinder</span>.

        **Genitive masculine/neuter nouns:** These nouns add <span lang="de">-(e)s</span> to the noun:
        - <span lang="de">das Buch des Mannes</span> (the man's book)
        - <span lang="de">die Tür des Hauses</span> (the door of the house)

        **Feminine dative looks like masculine nominative:** <span lang="de">der</span> appears in both masculine nominative and feminine dative/genitive — context (and the noun's gender) tells you which it is.

        ---

        ### Common learner mistakes

        **Mistake 1 — Using the wrong gender:**
        ❌ <span lang="de">die Tisch</span>
        ✅ <span lang="de">der Tisch</span>
        → Gender must be memorised with the noun.

        **Mistake 2 — Forgetting to change the masculine article in the accusative:**
        ❌ <span lang="de">Ich sehe der Mann.</span>
        ✅ <span lang="de">Ich sehe den Mann.</span>
        → Masculine nouns change from <span lang="de">der</span> to <span lang="de">den</span> in the accusative.

        **Mistake 3 — Using the wrong article in the dative:**
        ❌ <span lang="de">Ich gebe die Frau das Buch.</span>
        ✅ <span lang="de">Ich gebe der Frau das Buch.</span>
        → Feminine nouns use <span lang="de">der</span> (not <span lang="de">die</span>) in the dative.

        **Mistake 4 — Forgetting the dative plural <span lang="de">-n</span> on the noun:**
        ❌ <span lang="de">mit den Kinder</span>
        ✅ <span lang="de">mit den Kindern</span>
        → In the dative plural, add <span lang="de">-n</span> to the noun as well as using <span lang="de">den</span>.

        ---

        ### Quick-reference summary

        - **Singular:** <span lang="de">der</span> (masc.) / <span lang="de">die</span> (fem.) / <span lang="de">das</span> (neut.) in the nominative.
        - **Plural:** always <span lang="de">die</span> in the nominative and accusative.
        - **Only one change in accusative:** masculine <span lang="de">der</span> → <span lang="de">den</span>.
        - **Dative** endings: <span lang="de">dem / der / dem / den</span>.
        - Always learn new nouns with their article: <span lang="de">der Tisch</span>, <span lang="de">die Lampe</span>, <span lang="de">das Bett</span>.
      language: en
      why_this_matters: Nearly every German noun you encounter will be accompanied
        by an article, so getting these forms right is essential from day one. Without
        the correct article, you cannot signal whether a noun is the subject, object,
        or recipient of an action — meaning your sentences will be misunderstood.

- code: demonstrative_articl
  cefr_level: A1
  category: artikelwoerter_pronomen
  subcategory: Artikel
  label: Demonstrativartikel dieser/diese/dieses
  description: Demonstrative articles dieser, diese, dieses, diese used to point to
    specific nouns.
  examples:
  - dieser Tisch/diese Lampe/dieses Bett/diese Sachen
  source_note: 'Demonstrativ: dieser/diese/dieses/diese'
  explanations:
    en:
      title: 'Demonstrative articles: dieser, diese, dieses'
      tip: Use <span lang="de">dieser/diese/dieses/diese</span> to point to a specific
        thing — like saying 'this' or 'these' in English. The ending changes to match
        the gender, number, and case of the noun it goes with.
      explanation: |-
        ## Demonstrative articles: dieser, diese, dieses

        ### What is a demonstrative article?

        A demonstrative article points to a specific person, thing, or group. In English, this is 'this' (singular) and 'these' (plural). In German, the word is <span lang="de">dieser/diese/dieses/diese</span>, and its ending must agree with the **gender**, **number**, and **case** of the noun it modifies.

        German nouns have three genders:
        - **masculine** (<span lang="de">maskulin</span>): <span lang="de">der Tisch</span> (the table)
        - **feminine** (<span lang="de">feminin</span>): <span lang="de">die Lampe</span> (the lamp)
        - **neuter** (<span lang="de">neutral</span>): <span lang="de">das Bett</span> (the bed)
        - **plural** (<span lang="de">Plural</span>): <span lang="de">die Sachen</span> (the things)

        ---

        ### Formation: the endings

        The demonstrative article follows the same pattern as the definite article (<span lang="de">der/die/das/die</span>). Think of it as the definite article with a <span lang="de">dies-</span> stem in front.

        #### Nominative case (<span lang="de">Nominativ</span>) — the subject of the sentence

        | Gender | Definite article | Demonstrative article |
        |---|---|---|
        | Masculine | <span lang="de">der</span> | <span lang="de">dieser</span> |
        | Feminine | <span lang="de">die</span> | <span lang="de">diese</span> |
        | Neuter | <span lang="de">das</span> | <span lang="de">dieses</span> |
        | Plural | <span lang="de">die</span> | <span lang="de">diese</span> |

        #### Accusative case (<span lang="de">Akkusativ</span>) — the direct object

        | Gender | Definite article | Demonstrative article |
        |---|---|---|
        | Masculine | <span lang="de">den</span> | <span lang="de">diesen</span> |
        | Feminine | <span lang="de">die</span> | <span lang="de">diese</span> |
        | Neuter | <span lang="de">das</span> | <span lang="de">dieses</span> |
        | Plural | <span lang="de">die</span> | <span lang="de">diese</span> |

        #### Dative case (<span lang="de">Dativ</span>) — the indirect object

        | Gender | Definite article | Demonstrative article |
        |---|---|---|
        | Masculine | <span lang="de">dem</span> | <span lang="de">diesem</span> |
        | Feminine | <span lang="de">der</span> | <span lang="de">dieser</span> |
        | Neuter | <span lang="de">dem</span> | <span lang="de">diesem</span> |
        | Plural | <span lang="de">den</span> | <span lang="de">diesen</span> |

        > **Key pattern:** The ending on <span lang="de">dies-</span> is always the same ending you see on the definite article for that gender and case.

        ---

        ### Examples

        1. <span lang="de">Dieser Tisch ist groß.</span> — *This table is big.* (masculine, nominative)
        2. <span lang="de">Diese Lampe ist neu.</span> — *This lamp is new.* (feminine, nominative)
        3. <span lang="de">Dieses Bett ist bequem.</span> — *This bed is comfortable.* (neuter, nominative)
        4. <span lang="de">Diese Sachen sind billig.</span> — *These things are cheap.* (plural, nominative)
        5. <span lang="de">Ich kaufe diesen Stuhl.</span> — *I am buying this chair.* (masculine, accusative)
        6. <span lang="de">Kannst du mir mit diesem Koffer helfen?</span> — *Can you help me with this suitcase?* (masculine, dative)

        ---

        ### Common learner mistakes

        **Mistake 1: Using the same form for every gender**

        ❌ <span lang="de">Diese Tisch ist groß.</span>
        ✅ <span lang="de">Dieser Tisch ist groß.</span>

        The noun <span lang="de">Tisch</span> is masculine, so the article must be <span lang="de">dieser</span>, not <span lang="de">diese</span>.

        **Mistake 2: Forgetting to change the ending for accusative masculine**

        ❌ <span lang="de">Ich nehme dieser Apfel.</span>
        ✅ <span lang="de">Ich nehme diesen Apfel.</span>

        Masculine nouns change from <span lang="de">dieser</span> (nominative) to <span lang="de">diesen</span> (accusative) when they are the direct object.

        **Mistake 3: Confusing feminine dative with masculine nominative**

        Both are <span lang="de">dieser</span>, but for different genders and cases — always check the noun's gender and the sentence role first.

        ---

        ### Quick tip

        At A1 level, focus first on the **nominative** forms: <span lang="de">dieser / diese / dieses / diese</span>. These four cover most situations where you simply want to say 'this' or 'these' about something.
      language: en
      why_this_matters: You will need these words every time you point something out
        — in a shop, at home, or in a classroom. Without them, you cannot say 'this
        one' precisely in German, and getting the endings right also trains you for
        the broader German article system.

- code: indefinite_article
  cefr_level: A1
  category: artikelwoerter_pronomen
  subcategory: Artikel
  label: Indefiniter Artikel ein/eine/ein
  description: Indefinite articles ein, eine, ein used to introduce unspecified nouns.
  examples:
  - ein Tisch/eine Lampe/ein Bett
  source_note: 'Indefinit: ein/eine/ein'
  explanations:
    en:
      title: 'The indefinite article: ein, eine, ein'
      tip: Use <span lang="de">ein</span>, <span lang="de">eine</span>, or <span lang="de">ein</span>
        before a noun to mean 'a' or 'an' in English — one unspecified thing out of
        many. The form changes depending on the noun's gender and its role in the
        sentence.
      explanation: |-
        ## The Indefinite Article: <span lang="de">ein / eine / ein</span>

        ### What is the indefinite article?

        The indefinite article corresponds to English 'a' or 'an'. It introduces a noun that is not yet known to the listener — something unspecified or mentioned for the first time. German has three forms: <span lang="de">ein</span>, <span lang="de">eine</span>, and <span lang="de">ein</span>, matching the three grammatical genders.

        ---

        ### Why three forms?

        Every German noun has a grammatical gender: masculine (<span lang="de">der</span>), feminine (<span lang="de">die</span>), or neuter (<span lang="de">das</span>). The indefinite article must agree with that gender. Additionally, the article changes its ending depending on the grammatical case — the role the noun plays in the sentence (subject, object, etc.).

        ---

        ### The basic forms (Nominative case)

        The **nominative** (<span lang="de">Nominativ</span>) is the case used for the subject of a sentence — the person or thing performing the action.

        | Gender | Definite article | Indefinite article | Example noun |
        |--------|-----------------|-------------------|------------------|
        | masculine (<span lang="de">maskulin</span>) | <span lang="de">der</span> | <span lang="de">ein</span> | <span lang="de">ein Tisch</span> (a table) |
        | feminine (<span lang="de">feminin</span>) | <span lang="de">die</span> | <span lang="de">eine</span> | <span lang="de">eine Lampe</span> (a lamp) |
        | neuter (<span lang="de">neutral</span>) | <span lang="de">das</span> | <span lang="de">ein</span> | <span lang="de">ein Bett</span> (a bed) |

        Note: masculine and neuter share the same form <span lang="de">ein</span> in the nominative.

        ---

        ### Forms in all four cases

        German has four cases. At A1 level the most important are nominative (subject), accusative (<span lang="de">Akkusativ</span> — direct object), and dative (<span lang="de">Dativ</span> — indirect object).

        | Case | masculine | feminine | neuter |
        |------|-----------|----------|--------|
        | Nominative | <span lang="de">ein</span> | <span lang="de">eine</span> | <span lang="de">ein</span> |
        | Accusative | <span lang="de">einen</span> | <span lang="de">eine</span> | <span lang="de">ein</span> |
        | Dative | <span lang="de">einem</span> | <span lang="de">einer</span> | <span lang="de">einem</span> |
        | Genitive | <span lang="de">eines</span> | <span lang="de">einer</span> | <span lang="de">eines</span> |

        The key change to notice first: masculine nouns add **-en** in the accusative (<span lang="de">ein</span> → <span lang="de">einen</span>). Feminine and neuter forms stay the same between nominative and accusative.

        ---

        ### Examples

        1. <span lang="de">Das ist ein Tisch.</span> — That is a table. (masculine, nominative)
        2. <span lang="de">Ich habe eine Schwester.</span> — I have a sister. (feminine, accusative — same form as nominative)
        3. <span lang="de">Er kauft einen Stuhl.</span> — He is buying a chair. (masculine, accusative — note <span lang="de">einen</span>)
        4. <span lang="de">Sie trinkt ein Glas Wasser.</span> — She is drinking a glass of water. (neuter, accusative)
        5. <span lang="de">Ich helfe einem Kind.</span> — I am helping a child. (neuter, dative)
        6. <span lang="de">Wir wohnen in einer Wohnung.</span> — We live in a flat. (feminine, dative)

        ---

        ### No plural form

        The indefinite article has **no plural**. You simply use no article (the zero article) when talking about an unspecified group: <span lang="de">Das sind Stühle.</span> (Those are chairs.) — not <span lang="de">~~Das sind eine Stühle.~~</span>

        ---

        ### Common learner mistakes

        **Mistake 1: Using <span lang="de">ein</span> instead of <span lang="de">einen</span> for masculine accusative**

        ❌ <span lang="de">Ich kaufe ein Hund.</span>
        ✅ <span lang="de">Ich kaufe einen Hund.</span> — I am buying a dog.

        The masculine accusative ending <span lang="de">-en</span> is one of the first endings students must memorise. It is triggered whenever a masculine noun is the direct object of a verb.

        **Mistake 2: Adding an article in the plural**

        ❌ <span lang="de">Das sind eine Bücher.</span>
        ✅ <span lang="de">Das sind Bücher.</span> — Those are books.

        **Mistake 3: Choosing the wrong gender**

        If you do not yet know the gender of a noun, you may use the wrong article form. Always learn every noun together with its definite article (<span lang="de">der</span>, <span lang="de">die</span>, or <span lang="de">das</span>) so you always know which indefinite form to use.

        For example: <span lang="de">das Mädchen</span> (the girl) is neuter, so: <span lang="de">ein Mädchen</span> — NOT <span lang="de">~~eine Mädchen~~</span>.

        ---

        ### Quick reminder: how to pick the right form

        1. Find out the gender of the noun (learn it with <span lang="de">der / die / das</span>).
        2. Decide the case: is the noun the subject (nominative), the direct object (accusative), or the indirect object (dative)?
        3. Pick the matching form from the table above.
      language: en
      why_this_matters: Almost every sentence that introduces something new uses the
        indefinite article — 'I need a pen', 'There is a problem', 'She has a sister'.
        Without it you cannot talk about things for the first time or describe what
        someone owns or wants.

- code: zero_article
  cefr_level: A1
  category: artikelwoerter_pronomen
  subcategory: Artikel
  label: Nullartikel bei Nomen
  description: Use of nouns without any article, e.g. with uncountable nouns or in
    certain fixed expressions.
  examples:
  - Ich esse gern Fleisch.
  - Sachen
  source_note: Nullartikel
  explanations:
    en:
      title: When to use no article at all
      tip: German nouns sometimes appear with no article at all — no <span lang="de">der/die/das</span>,
        no <span lang="de">ein/eine</span>. This happens with uncountable substances,
        languages, nationalities, professions, and many fixed phrases. When the noun
        is used in a general, unspecified way, the article simply disappears.
      explanation: "## The Zero Article in German\n\n### What is the zero article?\n\
        \nThe **zero article** (German: <span lang=\"de\">Nullartikel</span>) means\
        \ a noun is used with **no article at all** — no definite article (<span lang=\"\
        de\">der/die/das</span>), no indefinite article (<span lang=\"de\">ein/eine/ein</span>),\
        \ and no other determiner. The noun stands alone. This is not a mistake; it\
        \ is a grammatical rule with specific, learnable contexts.\n\n---\n\n### When\
        \ is the zero article used?\n\n#### 1. Uncountable nouns and substances (in\
        \ general statements)\n\nWhen you talk about a substance or material **in\
        \ general** — without specifying an amount — you use no article.\n\n| German\
        \ | English |\n|---|---|\n| <span lang=\"de\">Ich esse gern **Fleisch**.</span>\
        \ | I like eating meat. |\n| <span lang=\"de\">**Wasser** ist gesund.</span>\
        \ | Water is healthy. |\n| <span lang=\"de\">Ich trinke **Kaffee**.</span>\
        \ | I drink coffee. |\n\n> Compare: <span lang=\"de\">Ich trinke **einen**\
        \ Kaffee</span> = I'll have **one** coffee (a cup — now it's countable).\n\
        \n---\n\n#### 2. Professions, nationalities, and roles after <span lang=\"\
        de\">sein</span> (to be)\n\nAfter the verb <span lang=\"de\">sein</span> (and\
        \ a few similar verbs like <span lang=\"de\">werden, bleiben</span>), professions\
        \ and nationalities take **no article** unless an adjective is added.\n\n\
        | German | English |\n|---|---|\n| <span lang=\"de\">Sie ist **Ärztin**.</span>\
        \ | She is a doctor. |\n| <span lang=\"de\">Er ist **Lehrer**.</span> | He\
        \ is a teacher. |\n| <span lang=\"de\">Ich bin **Deutscher**.</span> | I am\
        \ German. |\n\n> **With an adjective:** <span lang=\"de\">Er ist **ein guter**\
        \ Lehrer.</span> (He is a good teacher.) — the adjective forces an article\
        \ back in.\n\n---\n\n#### 3. Languages\n\nLanguage names used alone, especially\
        \ after <span lang=\"de\">sprechen</span> (to speak), take no article.\n\n\
        | German | English |\n|---|---|\n| <span lang=\"de\">Ich spreche **Deutsch**.</span>\
        \ | I speak German. |\n| <span lang=\"de\">Sie lernt **Spanisch**.</span>\
        \ | She is learning Spanish. |\n\n---\n\n#### 4. Proper names\n\nNames of\
        \ people and most place names (cities, most countries) take no article.\n\n\
        | German | English |\n|---|---|\n| <span lang=\"de\">**Maria** kommt aus **Wien**.</span>\
        \ | Maria comes from Vienna. |\n| <span lang=\"de\">Ich wohne in **Berlin**.</span>\
        \ | I live in Berlin. |\n\n> **Exceptions:** Some countries are always used\
        \ with a definite article: <span lang=\"de\">**die** Schweiz, **die** Türkei,\
        \ **der** Iran, **die** USA</span>.\n\n---\n\n#### 5. Fixed expressions and\
        \ set phrases\n\nMany everyday phrases and idioms use no article.\n\n| German\
        \ | English |\n|---|---|\n| <span lang=\"de\">**Guten Morgen!**</span> | Good\
        \ morning! |\n| <span lang=\"de\">Ich habe **Hunger**.</span> | I am hungry.\
        \ |\n| <span lang=\"de\">Sie hat **Fieber**.</span> | She has a fever. |\n\
        | <span lang=\"de\">Ich fahre mit dem Bus zur **Schule**.</span> | I go to\
        \ school by bus. |\n\n---\n\n#### 6. Nouns in lists and headlines\n\nWhen\
        \ nouns appear in lists, labels, or headlines, the article is often dropped\
        \ for brevity.\n\n<span lang=\"de\">**Sachen**, **Bücher**, **Kleider** —\
        \ alles liegt auf dem Boden.</span>  \n(Things, books, clothes — everything\
        \ is on the floor.)\n\n---\n\n### Summary table\n\n| Context | Example | Translation\
        \ |\n|---|---|---|\n| Uncountable substance (general) | <span lang=\"de\"\
        >Ich esse **Brot**.</span> | I eat bread. |\n| Profession after <span lang=\"\
        de\">sein</span> | <span lang=\"de\">Er ist **Koch**.</span> | He is a cook.\
        \ |\n| Language | <span lang=\"de\">Sie spricht **Französisch**.</span> |\
        \ She speaks French. |\n| City / country name | <span lang=\"de\">Ich liebe\
        \ **Hamburg**.</span> | I love Hamburg. |\n| Fixed expression | <span lang=\"\
        de\">Ich habe **Durst**.</span> | I am thirsty. |\n\n---\n\n### Common learner\
        \ mistakes\n\n**❌ Adding an article to a profession after <span lang=\"de\"\
        >sein</span>:**  \n<span lang=\"de\">~~Sie ist eine Ärztin.~~</span> (without\
        \ a describing adjective)  \n**✓** <span lang=\"de\">Sie ist Ärztin.</span>\n\
        \n**❌ Adding an article to a language name:**  \n<span lang=\"de\">~~Ich spreche\
        \ das Deutsch.~~</span>  \n**✓** <span lang=\"de\">Ich spreche Deutsch.</span>\n\
        \n**❌ Forgetting that uncountable nouns in general statements need no article:**\
        \  \n<span lang=\"de\">~~Ich trinke die Milch gern.~~</span> (if you mean\
        \ milk in general)  \n**✓** <span lang=\"de\">Ich trinke gern Milch.</span>\
        \  \n(But <span lang=\"de\">Ich trinke **die** Milch</span> = I am drinking\
        \ **the** milk [a specific glass you both know about] — that is correct with\
        \ a definite article.)\n\n---\n\n### Key takeaway\n\nThe zero article is not\
        \ random. It follows clear patterns: **general substances, professions/nationalities\
        \ after <span lang=\"de\">sein</span>, languages, proper names, and set phrases**.\
        \ Once you recognise these contexts, you will use the zero article naturally."
      language: en
      why_this_matters: The zero article appears constantly in everyday German — whenever
        you talk about food, drink, jobs, languages, or nationalities. Without this
        rule you will either sound unnatural by adding an article where none belongs,
        or you will misread sentences where the missing article is itself the grammar
        signal.

- code: possessive_article
  cefr_level: A1
  category: artikelwoerter_pronomen
  subcategory: Artikel
  label: Possessivartikel mein/dein/sein/ihr
  description: Possessive articles mein, dein, sein, ihr, Ihr, unser and their inflected
    forms to express ownership or belonging.
  examples:
  - mein/dein/sein/ihr/Ihr Tisch
  - meine/deine/seine/ihre/Ihre Lampe
  - unser Lehrer
  - uns(e)re Lehrerin
  source_note: 'Possessiv: mein/dein/sein/ihr/Ihr; unser'
  explanations:
    en:
      title: 'Possessive articles: my, your, his, her…'
      tip: Possessive articles replace the definite article to show who something
        belongs to. They take the same endings as the indefinite article <span lang="de">ein/eine/ein</span>,
        so you just swap the stem (<span lang="de">mein-, dein-, sein-</span>, etc.)
        and add the right ending. The ending depends on the gender and case of the
        noun they go with.
      explanation: |-
        ## Possessive articles in German

        ### What they are

        A <span lang="de">Possessivartikel</span> (possessive article) is a word like <span lang="de">mein</span> ('my'), <span lang="de">dein</span> ('your'), <span lang="de">sein</span> ('his/its'), <span lang="de">ihr</span> ('her/their'), <span lang="de">Ihr</span> ('your' — formal), <span lang="de">unser</span> ('our'), or <span lang="de">euer</span> ('your' — plural). They go directly before a noun and show who something belongs to or is connected with.

        ---

        ### Choosing the right stem

        First, pick the stem that matches the *owner* (the person possessing):

        | Owner | Stem | English |
        |---|---|---|
        | <span lang="de">ich</span> | <span lang="de">mein-</span> | my |
        | <span lang="de">du</span> | <span lang="de">dein-</span> | your (singular informal) |
        | <span lang="de">er / es</span> | <span lang="de">sein-</span> | his / its |
        | <span lang="de">sie</span> (she) | <span lang="de">ihr-</span> | her |
        | <span lang="de">wir</span> | <span lang="de">unser-</span> | our |
        | <span lang="de">ihr</span> (you pl.) | <span lang="de">euer-</span> / <span lang="de">eu(e)r-</span> | your (plural informal) |
        | <span lang="de">sie</span> (they) | <span lang="de">ihr-</span> | their |
        | <span lang="de">Sie</span> (formal you) | <span lang="de">Ihr-</span> | your (formal) |

        > **Note:** <span lang="de">ihr</span> (her/their) and <span lang="de">Ihr</span> (formal 'your') look the same except that <span lang="de">Ihr</span> is always capitalised.

        ---

        ### Adding the ending

        Next, add an ending that matches the *noun* the possessive article goes with — specifically its **grammatical gender** (masculine / feminine / neuter) and **case** (Nominative / Accusative / Dative). At A1 level you mainly need Nominative and Accusative.

        The endings are the same as for the indefinite article <span lang="de">ein/eine/ein</span> — simply attach them to the possessive stem.

        #### Nominative (subject of the sentence)

        | | Masculine | Feminine | Neuter | Plural |
        |---|---|---|---|---|
        | <span lang="de">ein-</span> pattern | <span lang="de">-</span> (no ending) | <span lang="de">-e</span> | <span lang="de">-</span> (no ending) | <span lang="de">-e</span> |
        | Example (<span lang="de">mein</span>) | <span lang="de">mein</span> | <span lang="de">meine</span> | <span lang="de">mein</span> | <span lang="de">meine</span> |

        #### Accusative (direct object)

        | | Masculine | Feminine | Neuter | Plural |
        |---|---|---|---|---|
        | ending | <span lang="de">-en</span> | <span lang="de">-e</span> | <span lang="de">-</span> (no ending) | <span lang="de">-e</span> |
        | Example (<span lang="de">mein</span>) | <span lang="de">meinen</span> | <span lang="de">meine</span> | <span lang="de">mein</span> | <span lang="de">meine</span> |

        #### Dative (indirect object — introduced at A1)

        | | Masculine | Feminine | Neuter | Plural |
        |---|---|---|---|---|
        | ending | <span lang="de">-em</span> | <span lang="de">-er</span> | <span lang="de">-em</span> | <span lang="de">-en</span> |
        | Example (<span lang="de">mein</span>) | <span lang="de">meinem</span> | <span lang="de">meiner</span> | <span lang="de">meinem</span> | <span lang="de">meinen</span> |

        ---

        ### Full paradigm for <span lang="de">mein</span>

        All other possessives follow the exact same pattern — just replace <span lang="de">mein-</span> with <span lang="de">dein-, sein-, ihr-</span>, etc.

        | Case | Masculine | Feminine | Neuter | Plural |
        |---|---|---|---|---|
        | Nom. | <span lang="de">mein Bruder</span> | <span lang="de">meine Schwester</span> | <span lang="de">mein Kind</span> | <span lang="de">meine Kinder</span> |
        | Acc. | <span lang="de">meinen Bruder</span> | <span lang="de">meine Schwester</span> | <span lang="de">mein Kind</span> | <span lang="de">meine Kinder</span> |
        | Dat. | <span lang="de">meinem Bruder</span> | <span lang="de">meiner Schwester</span> | <span lang="de">meinem Kind</span> | <span lang="de">meinen Kindern</span> |

        ---

        ### Special notes on <span lang="de">unser</span> and <span lang="de">euer</span>

        - <span lang="de">unser</span> sometimes drops the inner <span lang="de">-e-</span> in speech: <span lang="de">uns(e)re Lehrerin</span>.
        - <span lang="de">euer</span> ('your', plural informal) drops the <span lang="de">-e-</span> before most endings: <span lang="de">euer Hund</span> (nom. masc.) but <span lang="de">eure Katze</span> (nom. fem.), <span lang="de">euren Hund</span> (acc. masc.).

        ---

        ### Examples

        1. <span lang="de">Das ist mein Tisch.</span> — 'That is my table.' (nom. masc.)
        2. <span lang="de">Wie heißt deine Lehrerin?</span> — 'What is your teacher's name?' (nom. fem.)
        3. <span lang="de">Er sucht seinen Schlüssel.</span> — 'He is looking for his key.' (acc. masc.)
        4. <span lang="de">Wir essen in unserem Zimmer.</span> — 'We are eating in our room.' (dat. neut.)
        5. <span lang="de">Ihr Bruder ist sehr nett.</span> — 'Her/Their brother is very nice.' (nom. masc.)
        6. <span lang="de">Haben Sie Ihr Ticket?</span> — 'Do you have your ticket?' (formal, acc. neut.)

        ---

        ### Common learner mistakes

        **Mistake 1: Using the stem without an ending**
        - ✗ <span lang="de">Ich sehe mein Bruder.</span>
        - ✓ <span lang="de">Ich sehe meinen Bruder.</span> (accusative masculine → needs <span lang="de">-en</span>)

        **Mistake 2: Confusing <span lang="de">sein</span> (his) with <span lang="de">ihr</span> (her)**
        - Remember: <span lang="de">sein-</span> refers to a male owner (<span lang="de">er</span>), <span lang="de">ihr-</span> refers to a female owner (<span lang="de">sie</span>). The possessive agrees with the *owner*, not the noun.
        - <span lang="de">Der Mann nimmt seinen Kaffee.</span> — 'The man takes his coffee.'
        - <span lang="de">Die Frau nimmt ihren Kaffee.</span> — 'The woman takes her coffee.'

        **Mistake 3: Capitalising <span lang="de">ihr</span> (her/their) like <span lang="de">Ihr</span> (formal your)**
        - <span lang="de">ihr</span> meaning 'her' or 'their' is lowercase (except at the start of a sentence).
        - <span lang="de">Ihr</span> meaning formal 'your' is always capitalised.

        **Mistake 4: Over-applying <span lang="de">-e</span> to neuter**
        - ✗ <span lang="de">Das ist meine Kind.</span>
        - ✓ <span lang="de">Das ist mein Kind.</span> (nom./acc. neuter → no ending)
      language: en
      why_this_matters: You need possessive articles to talk about people, family,
        belongings, and relationships — some of the most common topics in everyday
        German. Without them you cannot say things like 'my friend', 'his phone',
        or 'our teacher', which come up in almost every conversation.

- code: negative_article_kei
  cefr_level: A1
  category: artikelwoerter_pronomen
  subcategory: Artikel
  label: Negativartikel kein/keine
  description: Negative article kein/keine/kein used to negate nouns, corresponding
    to the indefinite article.
  examples:
  - Er ist kein Lehrer.
  - Sie ist keine Ärztin.
  - Wir haben jetzt keine Zeit.
  source_note: 'Negativ: kein'
  explanations:
    en:
      title: Negating nouns with kein/keine
      tip: Use <span lang='de'>kein</span> (not 'not a' or 'not any') to negate a
        noun — it works exactly like the indefinite article <span lang='de'>ein</span>,
        just with a '<span lang='de'>k-</span>' in front. It changes its ending to
        match the noun's gender and grammatical case, just as <span lang='de'>ein/eine/ein</span>
        does.
      explanation: |-
        ## Negating nouns with <span lang='de'>kein / keine / kein</span>

        ### What is <span lang='de'>kein</span>?

        <span lang='de'>Kein</span> is the **negative article** (Negativartikel — the article used to say 'no', 'not a', or 'not any' before a noun). It directly negates a noun rather than the verb or another word (that is the job of <span lang='de'>nicht</span>).

        Think of it as the negative twin of the indefinite article <span lang='de'>ein / eine / ein</span> — wherever you would place <span lang='de'>ein</span>, you can replace it with <span lang='de'>kein</span> to make the meaning negative.

        ---

        ### When to use <span lang='de'>kein</span> vs. <span lang='de'>nicht</span>

        | Situation | Use | Example |
        |---|---|---|
        | Negating a noun with an indefinite article | <span lang='de'>kein</span> | <span lang='de'>Das ist kein Auto.</span> |
        | Negating a noun with no article (zero article) | <span lang='de'>kein</span> | <span lang='de'>Ich habe keine Zeit.</span> |
        | Negating a noun with a definite article | <span lang='de'>nicht</span> | <span lang='de'>Das ist nicht das Auto.</span> |
        | Negating a verb, adjective, or adverb | <span lang='de'>nicht</span> | <span lang='de'>Sie kommt nicht.</span> |

        The key rule: if the noun would take <span lang='de'>ein/eine</span> or **no article at all**, use <span lang='de'>kein</span>.

        ---

        ### Forms of <span lang='de'>kein</span>

        <span lang='de'>Kein</span> follows exactly the same endings as <span lang='de'>ein</span>. At A1, the most important cases are nominative and accusative.

        #### Nominative (subject of the sentence)

        | Gender | Indefinite article | Negative article |
        |---|---|---|
        | Masculine (<span lang='de'>der</span>) | <span lang='de'>ein</span> | <span lang='de'>kein</span> |
        | Feminine (<span lang='de'>die</span>) | <span lang='de'>eine</span> | <span lang='de'>keine</span> |
        | Neuter (<span lang='de'>das</span>) | <span lang='de'>ein</span> | <span lang='de'>kein</span> |
        | Plural (<span lang='de'>die</span>) | <span lang='de'>—</span> (no article) | <span lang='de'>keine</span> |

        #### Accusative (direct object of the sentence)

        | Gender | Indefinite article | Negative article |
        |---|---|---|
        | Masculine (<span lang='de'>der</span>) | <span lang='de'>einen</span> | <span lang='de'>keinen</span> |
        | Feminine (<span lang='de'>die</span>) | <span lang='de'>eine</span> | <span lang='de'>keine</span> |
        | Neuter (<span lang='de'>das</span>) | <span lang='de'>ein</span> | <span lang='de'>kein</span> |
        | Plural (<span lang='de'>die</span>) | <span lang='de'>—</span> (no article) | <span lang='de'>keine</span> |

        #### Dative (indirect object — for reference)

        | Gender | Negative article |
        |---|---|
        | Masculine | <span lang='de'>keinem</span> |
        | Feminine | <span lang='de'>keiner</span> |
        | Neuter | <span lang='de'>keinem</span> |
        | Plural | <span lang='de'>keinen</span> |

        ---

        ### Examples with English translations

        1. <span lang='de'>Er ist kein Lehrer.</span> — He is not a teacher. *(masculine, nominative)*
        2. <span lang='de'>Sie ist keine Ärztin.</span> — She is not a doctor. *(feminine, nominative)*
        3. <span lang='de'>Das ist kein Problem.</span> — That is not a problem. *(neuter, nominative)*
        4. <span lang='de'>Wir haben jetzt keine Zeit.</span> — We have no time now. *(feminine, accusative — zero-article noun negated)*
        5. <span lang='de'>Ich habe keinen Hunger.</span> — I am not hungry. / I have no hunger. *(masculine, accusative)*
        6. <span lang='de'>Hier sind keine Stühle.</span> — There are no chairs here. *(plural, nominative)*

        ---

        ### Common learner mistakes

        **Mistake 1: Using <span lang='de'>nicht ein</span> instead of <span lang='de'>kein</span>**

        ❌ <span lang='de'>Das ist nicht ein Hund.</span>
        ✅ <span lang='de'>Das ist kein Hund.</span> — That is not a dog.

        In German, <span lang='de'>nicht ein</span> is not used to negate nouns with the indefinite article. Always replace <span lang='de'>ein</span> with <span lang='de'>kein</span>.

        **Mistake 2: Using <span lang='de'>nicht</span> with zero-article nouns**

        ❌ <span lang='de'>Ich habe nicht Zeit.</span>
        ✅ <span lang='de'>Ich habe keine Zeit.</span> — I have no time.

        When a noun has no article (time, money, abstract nouns, plurals), use <span lang='de'>kein/keine</span>, not <span lang='de'>nicht</span>.

        **Mistake 3: Wrong ending (forgetting the accusative masculine <span lang='de'>-en</span>)**

        ❌ <span lang='de'>Ich habe kein Bruder.</span>
        ✅ <span lang='de'>Ich habe keinen Bruder.</span> — I have no brother.

        <span lang='de'>Bruder</span> is masculine and the direct object, so accusative requires the ending <span lang='de'>-en</span>: <span lang='de'>keinen</span>.

        ---

        ### Quick memory trick

        Just put a <span lang='de'>k-</span> in front of <span lang='de'>ein/eine/ein</span> and keep the same ending. If there is no article at all, ask yourself: which gender is this noun? Then use the matching <span lang='de'>kein / keine / kein</span> form.
      language: en
      why_this_matters: Without <span lang='de'>kein</span>, you cannot say things
        like 'I have no time', 'He is not a teacher', or 'There is no problem' — all
        extremely common in everyday German. This is one of the most frequently used
        words in German, so mastering it early gives you enormous expressive power
        right away.

- code: indef_pronoun_man
  cefr_level: A1
  category: artikelwoerter_pronomen
  subcategory: Pronomen
  label: Indefinitpronomen man
  description: Indefinite pronoun man used to refer to people in general without specifying
    who.
  examples:
  - Kann man hier Fahrkarten kaufen?
  source_note: 'Indefinit: man'
  explanations:
    en:
      title: Using 'man' for general statements
      tip: The word <span lang="de">man</span> means 'one', 'you', 'we', or 'people
        in general' — it refers to no specific person. It always takes a third-person
        singular verb form, the same form you use with <span lang="de">er/sie/es</span>.
      explanation: |-
        ## The indefinite pronoun <span lang="de">man</span>

        ### What it means

        <span lang="de">Man</span> is an indefinite pronoun used to make general statements about people without naming anyone specific. In English, it most closely matches 'one', but in everyday speech it is usually best translated as 'you', 'we', 'they', or 'people'.

        > <span lang="de">Man</span> does **not** mean 'a man' (<span lang="de">ein Mann</span>). The pronoun is always written with a lowercase <span lang="de">m</span>.

        ---

        ### Formation

        <span lang="de">Man</span> is always the **subject** of the sentence (nominative case). It always uses the **third-person singular** verb form — exactly the same ending as <span lang="de">er</span> (he), <span lang="de">sie</span> (she), or <span lang="de">es</span> (it).

        | Subject pronoun | Verb form (<span lang="de">kaufen</span>) |
        |---|---|
        | <span lang="de">ich</span> | <span lang="de">kaufe</span> |
        | <span lang="de">du</span> | <span lang="de">kaufst</span> |
        | <span lang="de">er / sie / es / **man**</span> | <span lang="de">**kauft**</span> |

        ---

        ### Common uses

        **1. Signs and instructions**

        Public signs and written instructions often use <span lang="de">man</span> to address people in general.

        - <span lang="de">Hier zahlt man mit Karte.</span> — 'You pay by card here.'
        - <span lang="de">Man darf hier nicht parken.</span> — 'You are not allowed to park here.'

        **2. General facts or customs**

        - <span lang="de">In Deutschland trinkt man viel Kaffee.</span> — 'In Germany, people drink a lot of coffee.'
        - <span lang="de">Man lernt nie aus.</span> — 'You never stop learning.' / 'One never stops learning.'

        **3. Polite questions**

        <span lang="de">Man</span> is often used to ask politely about what is possible or allowed.

        - <span lang="de">Kann man hier Fahrkarten kaufen?</span> — 'Can one buy tickets here?' / 'Is it possible to buy tickets here?'
        - <span lang="de">Wie schreibt man das?</span> — 'How do you write that?'

        **4. With modal verbs**

        <span lang="de">Man</span> combines naturally with modal verbs like <span lang="de">können</span>, <span lang="de">müssen</span>, <span lang="de">dürfen</span>, and <span lang="de">sollen</span>.

        - <span lang="de">Hier muss man leise sein.</span> — 'You have to be quiet here.'
        - <span lang="de">Man soll täglich Wasser trinken.</span> — 'One should drink water every day.'

        ---

        ### More examples with translations

        | German | English |
        |---|---|
        | <span lang="de">Wie sagt man das auf Deutsch?</span> | 'How do you say that in German?' |
        | <span lang="de">Man kann hier gut essen.</span> | 'You can eat well here.' |
        | <span lang="de">Hier darf man nicht rauchen.</span> | 'You are not allowed to smoke here.' |
        | <span lang="de">Man braucht ein Ticket.</span> | 'You need a ticket.' |
        | <span lang="de">Was macht man hier?</span> | 'What do people do here?' |

        ---

        ### Important note: <span lang="de">man</span> is only nominative

        <span lang="de">Man</span> is only used as the **subject** of a sentence. It has no accusative or dative form that learners need at A1 level. If you need a general pronoun in the accusative or dative, this is an advanced topic covered later.

        ---

        ### Common learner mistakes

        **❌ Confusing <span lang="de">man</span> with <span lang="de">Mann</span>**

        - ❌ <span lang="de">Der Man arbeitet hier.</span>
        - ✅ <span lang="de">Der Mann arbeitet hier.</span> — 'The man works here.'
        - ✅ <span lang="de">Man arbeitet hier.</span> — 'People work here.'

        <span lang="de">Mann</span> (with double <span lang="de">n</span>) is a noun meaning 'man' or 'husband'. <span lang="de">Man</span> (single <span lang="de">n</span>) is the pronoun.

        **❌ Using the wrong verb form**

        - ❌ <span lang="de">Man kaufen Tickets hier.</span>
        - ✅ <span lang="de">Man kauft Tickets hier.</span> — 'You buy tickets here.'

        Always use the third-person singular ending with <span lang="de">man</span>.

        **❌ Capitalising <span lang="de">man</span>**

        - ❌ <span lang="de">Man kann hier essen.</span> (at the start of a sentence — this is actually correct!)
        - ❌ <span lang="de">Hier kann Man essen.</span> — incorrect in the middle of a sentence
        - ✅ <span lang="de">Hier kann man essen.</span>

        Only capitalise <span lang="de">man</span> when it begins a sentence, as with any German word.
      language: en
      why_this_matters: <span lang="de">Man</span> appears constantly in everyday
        German — on signs, in instructions, and in polite conversation. Without it,
        you cannot make general statements like 'You can pay here' or 'People say
        that' in a natural German way.

- code: indef_pronoun_etwas
  cefr_level: A1
  category: artikelwoerter_pronomen
  subcategory: Pronomen
  label: Indefinitpronomen etwas/nichts/mehr/alles/welch-
  description: Indefinite pronouns etwas, nichts, mehr, alles, and welch- used for
    unspecified quantities or amounts.
  examples:
  - Möchten Sie etwas trinken?
  - Ich esse jetzt nichts.
  - Möchten Sie noch mehr?
  - Er versteht alles.
  - Ich habe keine Milch mehr. Hast du welche?
  source_note: 'Indefinit: etwas, nichts, mehr, alles, welch-'
  explanations:
    en:
      title: 'Indefinite pronouns: etwas, nichts, mehr, alles, welch-'
      tip: These pronouns stand in for unspecified things or amounts without naming
        them directly. They never change their form — except <span lang="de">welch-</span>,
        which takes a short ending to match the noun it replaces. Use them wherever
        you would say 'something', 'nothing', 'more', 'everything', or 'some' in English.
      explanation: |-
        ## Indefinite pronouns: <span lang="de">etwas, nichts, mehr, alles, welch-</span>

        ### What are they?

        Indefinite pronouns refer to things or quantities without identifying them specifically. The five pronouns in this group each cover a distinct meaning:

        | German | English equivalent |
        |---|---|
        | <span lang="de">etwas</span> | something / anything / a little |
        | <span lang="de">nichts</span> | nothing / not anything |
        | <span lang="de">mehr</span> | more |
        | <span lang="de">alles</span> | everything / all |
        | <span lang="de">welch-</span> | some / any (replacing a countable noun) |

        ---

        ### <span lang="de">etwas</span> — 'something / anything'

        <span lang="de">Etwas</span> is **uninflected** — its form never changes regardless of case or context.

        It can be:
        - the **subject** of a sentence: <span lang="de">Etwas stimmt nicht.</span> (Something is wrong.)
        - the **direct object**: <span lang="de">Ich möchte etwas essen.</span> (I would like to eat something.)
        - used in questions: <span lang="de">Möchten Sie etwas trinken?</span> (Would you like something to drink?)
        - used to mean 'a little' before adjectives or adverbs: <span lang="de">Das ist etwas teuer.</span> (That is a little expensive.)

        ---

        ### <span lang="de">nichts</span> — 'nothing / not anything'

        <span lang="de">Nichts</span> is also **uninflected**. It is the direct negative of <span lang="de">etwas</span>.

        Important: <span lang="de">nichts</span> is itself a negation. Do **not** combine it with <span lang="de">nicht</span> — that would be a double negative.

        - <span lang="de">Ich esse jetzt nichts.</span> (I'm not eating anything now. / I'm eating nothing now.)
        - <span lang="de">Er sagt nichts.</span> (He says nothing.)
        - <span lang="de">Das bedeutet nichts.</span> (That means nothing.)

        ---

        ### <span lang="de">mehr</span> — 'more'

        <span lang="de">Mehr</span> is **uninflected** as a pronoun. It expresses an additional, unspecified quantity.

        - <span lang="de">Möchten Sie noch mehr?</span> (Would you like some more?)
        - <span lang="de">Ich brauche mehr.</span> (I need more.)

        Note: <span lang="de">mehr</span> also appears in negative expressions: <span lang="de">nicht mehr</span> (no longer / not any more) and <span lang="de">kein/keine ... mehr</span> (no more ...).

        - <span lang="de">Ich habe keine Milch mehr.</span> (I have no more milk. / I don't have any milk left.)
        - <span lang="de">Er kommt nicht mehr.</span> (He is not coming any more.)

        ---

        ### <span lang="de">alles</span> — 'everything / all'

        <span lang="de">Alles</span> is **uninflected** and refers to the totality of things.

        - <span lang="de">Er versteht alles.</span> (He understands everything.)
        - <span lang="de">Alles ist gut.</span> (Everything is fine.)
        - <span lang="de">Ich mache alles.</span> (I'll do everything.)

        ---

        ### <span lang="de">welch-</span> — 'some / any' (replacing a noun)

        Unlike the others, <span lang="de">welch-</span> **inflects** — it takes an ending to agree with the gender and case of the noun it replaces. At A1 level the most common forms are nominative and accusative.

        Think of it as answering the question 'Do you have any?' when the specific noun has already been mentioned and doesn't need to be repeated.

        **Common forms (nominative / accusative):**

        | Gender of replaced noun | Form |
        |---|---|
        | masculine (<span lang="de">der</span>) | <span lang="de">welcher</span> |
        | feminine (<span lang="de">die</span>) | <span lang="de">welche</span> |
        | neuter (<span lang="de">das</span>) | <span lang="de">welches</span> |
        | plural (<span lang="de">die</span>) | <span lang="de">welche</span> |

        Examples:
        - <span lang="de">Ich habe keine Milch mehr. Hast du welche?</span> (I have no more milk. Do you have any?) — <span lang="de">Milch</span> is feminine, so <span lang="de">welche</span>.
        - <span lang="de">Ich brauche Zucker. Hast du welchen?</span> (I need sugar. Do you have any?) — <span lang="de">Zucker</span> is masculine accusative, so <span lang="de">welchen</span>.
        - <span lang="de">Wir haben kein Brot. Kaufst du welches?</span> (We have no bread. Are you buying any?) — <span lang="de">Brot</span> is neuter, so <span lang="de">welches</span>.

        ---

        ### Examples with English translations

        1. <span lang="de">Möchten Sie etwas trinken?</span> — Would you like something to drink?
        2. <span lang="de">Ich esse jetzt nichts.</span> — I'm not eating anything right now.
        3. <span lang="de">Möchten Sie noch mehr?</span> — Would you like some more?
        4. <span lang="de">Er versteht alles.</span> — He understands everything.
        5. <span lang="de">Ich habe keine Milch mehr. Hast du welche?</span> — I have no more milk. Do you have any?
        6. <span lang="de">Alles ist fertig.</span> — Everything is ready.

        ---

        ### Common learner mistakes

        **1. Double negation with <span lang="de">nichts</span>**

        ❌ <span lang="de">Ich sage nicht nichts.</span>
        ✅ <span lang="de">Ich sage nichts.</span> — <span lang="de">nichts</span> is already negative; adding <span lang="de">nicht</span> is wrong.

        **2. Forgetting to inflect <span lang="de">welch-</span>**

        ❌ <span lang="de">Ich brauche Zucker. Hast du welche?</span> (wrong gender ending)
        ✅ <span lang="de">Ich brauche Zucker. Hast du welchen?</span> (<span lang="de">Zucker</span> is masculine → accusative → <span lang="de">welchen</span>)

        **3. Confusing <span lang="de">mehr</span> as a pronoun vs. in negation**

        <span lang="de">Mehr</span> alone means 'more'. In the phrase <span lang="de">nicht mehr</span> or <span lang="de">keine/kein ... mehr</span> it means 'no longer' or 'no more' — the meaning shifts depending on context.

        **4. Trying to inflect <span lang="de">etwas</span>, <span lang="de">nichts</span>, <span lang="de">alles</span>, or <span lang="de">mehr</span>**

        These four are always invariable. Never add endings to them.
      language: en
      why_this_matters: You will hear and need these words in almost every German
        conversation — ordering food, shopping, asking for help, or saying you don't
        want anything. Without them you cannot make basic requests or refusals, so
        mastering them early gives you a huge practical boost.

- code: personal_pronoun_nom
  cefr_level: A1
  category: artikelwoerter_pronomen
  subcategory: Pronomen
  label: Personalpronomen im Nominativ
  description: Personal pronouns in the nominative case (ich, du, er, sie, es, wir,
    ihr, sie, Sie) used as subjects.
  examples:
  - Ich gehe jetzt.
  - Wer ist da?
  source_note: Personalpronomen im Nominativ
  explanations:
    en:
      title: Personal pronouns in the nominative case
      tip: Nominative personal pronouns are the 'subject' pronouns — they name who
        is doing the action. In German, every sentence needs a subject, and these
        pronouns stand in for people or things when you don't repeat the noun.
      explanation: |-
        ## Personal Pronouns in the Nominative Case

        ### What is the nominative case?

        The **nominative case** is used for the **subject** of a sentence — the person or thing that performs the action of the verb. In <span lang="de">Ich gehe.</span> ('I go'), <span lang="de">ich</span> is the subject and therefore stands in the nominative case.

        ---

        ### The full nominative pronoun table

        | Person | Singular | English | Plural | English |
        |---|---|---|---|---|
        | 1st | <span lang="de">ich</span> | I | <span lang="de">wir</span> | we |
        | 2nd (informal) | <span lang="de">du</span> | you | <span lang="de">ihr</span> | you (plural) |
        | 3rd masc. | <span lang="de">er</span> | he / it | <span lang="de">sie</span> | they |
        | 3rd fem. | <span lang="de">sie</span> | she / it | <span lang="de">sie</span> | they |
        | 3rd neut. | <span lang="de">es</span> | it | <span lang="de">sie</span> | they |
        | 2nd (formal) | <span lang="de">Sie</span> | you (formal) | <span lang="de">Sie</span> | you (formal pl.) |

        > **Note:** The formal <span lang="de">Sie</span> is always written with a capital **S**, even in the middle of a sentence. All other pronouns are lower-case.

        ---

        ### Formation and use

        Nominative pronouns are used:

        1. **As the subject of a verb** — the doer of the action.
        2. **After the verb <span lang="de">sein</span>** (to be) — because <span lang="de">sein</span> links the subject to a description or identity (nominative complement).

        They replace nouns once the noun is already known:
        - <span lang="de">Das ist Maria. **Sie** kommt aus Berlin.</span> — 'That is Maria. **She** comes from Berlin.'

        ---

        ### Examples

        | German | English |
        |---|---|
        | <span lang="de">Ich heiße Tom.</span> | I am called Tom. |
        | <span lang="de">Du bist sehr nett.</span> | You are very kind. |
        | <span lang="de">Er wohnt in Hamburg.</span> | He lives in Hamburg. |
        | <span lang="de">Sie arbeitet heute nicht.</span> | She is not working today. |
        | <span lang="de">Wir lernen Deutsch.</span> | We are learning German. |
        | <span lang="de">Sie kommen um acht Uhr.</span> | They come at eight o'clock. |
        | <span lang="de">Sind Sie Herr Müller?</span> | Are you Mr Müller? (formal) |

        ---

        ### Special note: <span lang="de">er</span>, <span lang="de">sie</span>, <span lang="de">es</span> for things

        In German, every noun has a grammatical gender: masculine (<span lang="de">der</span>), feminine (<span lang="de">die</span>), or neuter (<span lang="de">das</span>). When you replace a noun with a pronoun, you must match its **grammatical gender**, not natural gender.

        - <span lang="de">Der Tisch</span> (the table, masc.) → <span lang="de">**Er** ist groß.</span> ('It is big.')
        - <span lang="de">Die Lampe</span> (the lamp, fem.) → <span lang="de">**Sie** ist neu.</span> ('It is new.')
        - <span lang="de">Das Buch</span> (the book, neut.) → <span lang="de">**Es** ist interessant.</span> ('It is interesting.')

        This is a common source of errors for English speakers, who use 'it' for all objects.

        ---

        ### <span lang="de">sie</span> vs. <span lang="de">Sie</span>

        Three forms look identical but mean different things:

        | Form | Meaning | Clue |
        |---|---|---|
        | <span lang="de">sie</span> (lower-case, sg.) | she | verb in 3rd person singular |
        | <span lang="de">sie</span> (lower-case, pl.) | they | verb in 3rd person plural |
        | <span lang="de">Sie</span> (capital, sg./pl.) | you (formal) | always capital S; verb same form as plural <span lang="de">sie</span> |

        Example contrast:
        - <span lang="de">**Sie** wohnt in Köln.</span> — She lives in Cologne.
        - <span lang="de">**Sie** wohnen in Köln.</span> — They live in Cologne. / You live in Cologne. (formal)

        Context usually makes the meaning clear.

        ---

        ### Common learner mistakes

        **1. Leaving out the subject pronoun**

        Unlike Spanish or Italian, German does **not** allow you to drop the subject pronoun.

        - ❌ <span lang="de">Bin müde.</span>
        - ✅ <span lang="de">Ich bin müde.</span> — 'I am tired.'

        **2. Using 'es' for all things**

        English speakers say 'it' for all objects, but German uses <span lang="de">er</span>, <span lang="de">sie</span>, or <span lang="de">es</span> based on the noun's gender.

        - ❌ <span lang="de">Der Stuhl ist alt. Es ist kaputt.</span>
        - ✅ <span lang="de">Der Stuhl ist alt. **Er** ist kaputt.</span> — 'The chair is old. It is broken.'

        **3. Forgetting to capitalise <span lang="de">Sie</span> (formal)**

        - ❌ <span lang="de">Woher kommen sie?</span> (ambiguous or means 'Where do they come from?')
        - ✅ <span lang="de">Woher kommen **Sie**?</span> — 'Where do you come from?' (formal)

        **4. Confusing <span lang="de">ihr</span> (you plural, nominative) with <span lang="de">ihr</span> (her/their, possessive)**

        - <span lang="de">**Ihr** kommt morgen.</span> — **You** (plural) are coming tomorrow. (pronoun, subject)
        - <span lang="de">Das ist **ihr** Buch.</span> — That is **her** book. (possessive article)

        The role in the sentence tells you which <span lang="de">ihr</span> it is.
      language: en
      why_this_matters: You will use these pronouns in almost every German sentence
        you speak or write. Without them, you cannot say 'I go', 'she works', or 'we
        live here' — they are the foundation of all basic conversation.

- code: personal_pronoun_acc
  cefr_level: A1
  category: artikelwoerter_pronomen
  subcategory: Pronomen
  label: Personalpronomen im Akkusativ
  description: 'Personal pronouns in the accusative case: mich, dich, ihn, sie, es,
    used as direct objects.'
  examples:
  - Ich liebe dich/ihn/sie.
  source_note: 'Akkusativ: mich/dich/ihn/sie/es'
  explanations:
    en:
      title: Personal pronouns in the accusative case
      tip: When a person or thing is the direct object of a verb — the one receiving
        the action — you use the accusative form of the pronoun. In German, these
        forms are different from the subject (nominative) forms, so you need to learn
        the new set.
      explanation: |-
        ## Personal pronouns in the accusative case

        ### What is the accusative case?

        In German, nouns and pronouns change their form depending on their role in the sentence. The **accusative case** marks the **direct object** — the person or thing that directly receives the action of the verb.

        - Subject (nominative): <span lang="de">**Ich** liebe dich.</span> → *I* love you. (<span lang="de">ich</span> is doing the loving)
        - Direct object (accusative): <span lang="de">Ich liebe **dich**.</span> → I love *you*. (<span lang="de">dich</span> is receiving the love)

        ---

        ### The accusative pronoun forms

        | Nominative (subject) | Accusative (direct object) | English |
        |---|---|---|
        | <span lang="de">ich</span> | <span lang="de">**mich**</span> | me |
        | <span lang="de">du</span> | <span lang="de">**dich**</span> | you (singular informal) |
        | <span lang="de">er</span> | <span lang="de">**ihn**</span> | him / it (masc.) |
        | <span lang="de">sie</span> | <span lang="de">**sie**</span> | her / it (fem.) |
        | <span lang="de">es</span> | <span lang="de">**es**</span> | it (neut.) |
        | <span lang="de">wir</span> | <span lang="de">**uns**</span> | us |
        | <span lang="de">ihr</span> | <span lang="de">**euch**</span> | you (plural informal) |
        | <span lang="de">sie</span> | <span lang="de">**sie**</span> | them |
        | <span lang="de">Sie</span> | <span lang="de">**Sie**</span> | you (formal) |

        > **Key pattern:** Only three forms actually change: <span lang="de">ich → mich</span>, <span lang="de">du → dich</span>, and <span lang="de">er → ihn</span>. All other pronouns look the same in nominative and accusative.

        ---

        ### Formation: how to use accusative pronouns

        Accusative pronouns replace a noun that is the **direct object** of the verb. To find the direct object, ask: *Who or what is the verb acting on?*

        **Step 1:** Find the verb and its subject.
        **Step 2:** Ask 'Whom? / What?' after the verb.
        **Step 3:** Replace the direct object noun with the matching accusative pronoun.

        <span lang="de">Ich sehe den Mann.</span> → *I see the man.*
        → <span lang="de">Ich sehe **ihn**.</span> → *I see him.* (masculine noun → <span lang="de">ihn</span>)

        <span lang="de">Er kennt die Frau.</span> → *He knows the woman.*
        → <span lang="de">Er kennt **sie**.</span> → *He knows her.* (feminine noun → <span lang="de">sie</span>)

        ---

        ### Examples

        | German | English |
        |---|---|
        | <span lang="de">Liebst du **mich**?</span> | Do you love me? |
        | <span lang="de">Ich liebe **dich**.</span> | I love you. |
        | <span lang="de">Siehst du den Hund? Ja, ich sehe **ihn**.</span> | Do you see the dog? Yes, I see it/him. |
        | <span lang="de">Wo ist die Tasche? Ich habe **sie**.</span> | Where is the bag? I have it. |
        | <span lang="de">Das Kind — kennst du **es**?</span> | The child — do you know it? |
        | <span lang="de">Wir brauchen **euch**.</span> | We need you (all). |

        ---

        ### Important: <span lang="de">sie</span> can mean several things

        <span lang="de">sie</span> (lowercase) in the accusative can mean:
        - *her* (referring to a feminine noun or a woman)
        - *them* (referring to a plural noun or group of people)

        Context and the verb ending usually make the meaning clear:

        <span lang="de">Ich sehe **sie**.</span>
        - = *I see her.* (one woman/feminine thing)
        - = *I see them.* (multiple people/things)

        <span lang="de">Sie</span> (uppercase) = formal *you* — always capitalised.

        ---

        ### Pronoun gender follows noun gender, not natural gender

        In German, the pronoun you use must match the **grammatical gender** of the noun it replaces, not the biological sex of the object.

        - <span lang="de">der Wagen</span> (the car, masculine) → <span lang="de">Ich kaufe **ihn**.</span> (*I buy it/him.*)
        - <span lang="de">die Lampe</span> (the lamp, feminine) → <span lang="de">Ich kaufe **sie**.</span> (*I buy it/her.*)
        - <span lang="de">das Buch</span> (the book, neuter) → <span lang="de">Ich lese **es**.</span> (*I read it.*)

        This is why knowing noun genders (covered in <span lang="de">Genus der Nomen</span>) is so important — it directly affects which pronoun you choose.

        ---

        ### Common learner mistakes

        **Mistake 1:** Using the nominative instead of the accusative.

        ❌ <span lang="de">Ich liebe *er*.</span>
        ✅ <span lang="de">Ich liebe **ihn**.</span> — *I love him.*

        **Mistake 2:** Using <span lang="de">sie</span> for a masculine noun.

        ❌ <span lang="de">Der Hund ist süß. Ich liebe *sie*.</span>
        ✅ <span lang="de">Der Hund ist süß. Ich liebe **ihn**.</span> — *The dog is cute. I love him/it.*

        **Mistake 3:** Confusing <span lang="de">ihr</span> (nominative, 'you plural') with <span lang="de">euch</span> (accusative, 'you plural').

        ❌ <span lang="de">Ich sehe *ihr*.</span>
        ✅ <span lang="de">Ich sehe **euch**.</span> — *I see you (all).*

        ---

        ### Quick-reference: the three forms that change

        | Nominative | Accusative | Memory tip |
        |---|---|---|
        | <span lang="de">ich</span> | <span lang="de">mich</span> | Both end in <span lang="de">-ch</span> |
        | <span lang="de">du</span> | <span lang="de">dich</span> | Both start with <span lang="de">d-</span>, accusative adds <span lang="de">-ich</span> |
        | <span lang="de">er</span> | <span lang="de">ihn</span> | Completely different — must memorise |

        All other pronouns look the same in both cases.
      language: en
      why_this_matters: Almost every sentence with a verb like <span lang="de">lieben</span>,
        <span lang="de">sehen</span>, <span lang="de">haben</span>, or <span lang="de">kennen</span>
        needs a direct object, and pronouns are among the most common direct objects.
        Without accusative pronouns you cannot say 'I love you', 'She knows him',
        or 'Do you see me?' — some of the most basic things people say to each other.

- code: personal_pronoun_dat
  cefr_level: A1
  category: artikelwoerter_pronomen
  subcategory: Pronomen
  label: Personalpronomen im Dativ
  description: Dative personal pronouns mir, dir, euch, Ihnen used with specific dative
    verbs such as danken, gehören, helfen, and in the expression es geht.
  examples:
  - Ich danke Ihnen sehr.
  - Es geht mir gut.
  - Kann ich dir helfen?
  source_note: 'Dativ bei den Verben: danken/gehören/helfen/es geht/mir/dir/euch/Ihnen'
  explanations: {}

- code: reciprocal_pronoun
  cefr_level: A1
  category: artikelwoerter_pronomen
  subcategory: Pronomen
  label: Reziprokpronomen sich/uns
  description: Reciprocal pronouns sich and uns used to express mutual actions.
  examples:
  - Wir sehen uns morgen.
  source_note: 'Reziprokpronomen: sich/uns'
  explanations: {}

- code: interrogative_pronou
  cefr_level: A1
  category: artikelwoerter_pronomen
  subcategory: Pronomen
  label: Fragepronomen wer/was/wen/wem
  description: Interrogative pronouns wer and was in the nominative, wen and was in
    the accusative, and wem in the dative.
  examples:
  - Wer ist da?
  - Was ist das?
  - Wen besuchst du?
  - Was machst du morgen?
  - Wem gehört die Jacke?
  source_note: 'Fragepronomen im Nominativ: Wer?/Was?, im Akkusativ: Wen?/Was? und
    im Dativ: Wem?'
  explanations: {}

- code: adj_predicative
  cefr_level: A1
  category: adjektiv
  subcategory: prädikativ
  label: Adjektiv prädikativ
  description: Adjectives used predicatively after verbs like sein, werden, without
    inflectional endings.
  examples:
  - Das Haus ist modern.
  - Der Film ist langweilig.
  source_note: Adjektiv prädikativ
  explanations: {}

- code: adj_adverbial
  cefr_level: A1
  category: adjektiv
  subcategory: adverbial
  label: Adjektiv adverbial
  description: Adjectives used adverbially to modify verbs, without inflectional endings.
  examples:
  - Ich lese gern.
  - Wo kaufst du gerne ein?
  source_note: Adjektiv adverbial
  explanations: {}

- code: prep_temporal
  cefr_level: A1
  category: praeposition
  subcategory: temporal
  label: Temporale Präpositionen
  description: 'Prepositions used to express time relationships: an, ab, für, in,
    nach, über, um, von...bis, vor with their required cases.'
  examples:
  - am Morgen/am Dienstag
  - ab Februar 2004
  - für die nächsten drei Wochen
  - im Sommer/in dieser Woche
  - nach dem Essen
  - über 20 Minuten
  - um halb sieben/um 18.30 Uhr
  - geschlossen von Dienstag bis Donnerstag
  - vor dem Konzert
  source_note: 'temporal: an + Dativ, ab + Akkusativ, für + Akkusativ, in + Dativ,
    nach + Dativ, über, um + Akkusativ, von...bis, vor + Dativ'
  explanations: {}

- code: prep_local
  cefr_level: A1
  category: praeposition
  subcategory: lokal
  label: Lokale Präpositionen
  description: 'Prepositions used to express location and direction: an, auf, aus,
    bei, in, nach, von...nach, unter, zu with their required cases.'
  examples:
  - Ferien am Meer/an den See fahren
  - auf dem Marktplatz/auf dem Tisch
  - aus Italien
  - bei Familie Müller/bei Siemens
  - im Park spielen/in die Stadt fahren
  - nach Paris/nach Deutschland fahren
  - von Hamburg nach Bremen
  - unter der Nummer
  - zur Schule/zu meiner Freundin gehen
  source_note: 'lokal: an + Dativ/Akkusativ, auf + Dativ, aus + Dativ, bei + Dativ,
    in + Dativ/Akkusativ, nach + Dativ, von...nach + Dativ/–, unter + Dativ, zu +
    Dativ'
  explanations: {}

- code: prep_modal
  cefr_level: A1
  category: praeposition
  subcategory: modal
  label: Modale Präpositionen
  description: 'Prepositions used to express manner or means: aus, für, mit, ohne
    with their required cases.'
  examples:
  - aus Plastik
  - für meinen Freund/für dich
  - mit dem Auto
  - ohne Hilfe/ohne dich
  source_note: 'modal: aus + Dativ, für + Akkusativ, mit + Dativ, ohne + Akkusativ'
  explanations: {}

- code: verb_second_position
  cefr_level: A1
  category: syntax
  subcategory: Verbzweitstellung
  label: Verbzweitstellung im Aussagesatz
  description: The finite verb always occupies the second position in declarative
    main clauses, even when an adverb or other element is placed first.
  examples:
  - Morgen fahre ich nach Stuttgart.
  - Ich fahre morgen nach Paris.
  source_note: Verbzweitstellung
  explanations: {}

- code: verb_complement_nom
  cefr_level: A1
  category: syntax
  subcategory: Verbergänzung
  label: Nominativergänzung
  description: Nominative complement required by certain verbs such as heißen and
    sein.
  examples:
  - Er heißt Heinz Bartels.
  source_note: Nominativergänzung
  explanations: {}

- code: verb_complement_acc
  cefr_level: A1
  category: syntax
  subcategory: Verbergänzung
  label: Akkusativergänzung
  description: Accusative complement (direct object) required by transitive verbs.
  examples:
  - Ich nehme eine Coca Cola.
  source_note: Akkusativergänzung
  explanations: {}

- code: verb_complement_dat
  cefr_level: A1
  category: syntax
  subcategory: Verbergänzung
  label: Dativergänzung bei ausgewählten Verben
  description: Dative complement required by verbs danken, gehören, geben, and helfen.
  examples:
  - Gib mir bitte mal dein Wörterbuch.
  source_note: Dativergänzung bei den Verben danken/gehören/geben/helfen
  explanations: {}

- code: verb_complement_loca
  cefr_level: A1
  category: syntax
  subcategory: Verbergänzung
  label: Lokalergänzung
  description: Local complement expressing place where an action occurs or direction
    of movement, required by verbs like wohnen.
  examples:
  - Wir wohnen in der Heinestraße 7.
  source_note: Lokalergänzung
  explanations: {}

- code: verb_complement_qual
  cefr_level: A1
  category: syntax
  subcategory: Verbergänzung
  label: Qualitativergänzung
  description: Qualitative complement (predicate adjective) required by verbs like
    sein expressing a quality or state.
  examples:
  - Der Film ist langweilig.
  source_note: Qualitativergänzung
  explanations: {}

- code: sentence_bracket
  cefr_level: A1
  category: syntax
  subcategory: Satzklammer
  label: Satzklammer
  description: The verbal bracket formed by the finite verb in second position and
    a non-finite verb element (infinitive, participle, or separable prefix) at the
    end of the clause.
  examples:
  - Der Unterricht fängt um 9 Uhr an.
  - Ich will meine Tante besuchen.
  - Ich habe schon gegessen.
  source_note: Satzklammer
  explanations: {}

- code: negation_nicht
  cefr_level: A1
  category: syntax
  subcategory: Negation
  label: Negation mit nicht
  description: Negation of verbs, adjectives, and adverbs using nicht.
  examples:
  - Leider verstehe ich dich nicht.
  - Ich gehe heute nicht spazieren, denn es ist zu kalt.
  source_note: 'Negation: nicht'
  explanations: {}

- code: negation_kein
  cefr_level: A1
  category: syntax
  subcategory: Negation
  label: Negation mit kein
  description: Negation of nouns using kein/keine as a negative article replacing
    ein/eine or the zero article.
  examples:
  - Wir haben jetzt keine Zeit.
  - Er ist kein Lehrer.
  source_note: 'Negation: kein'
  explanations: {}

- code: yes_no_question
  cefr_level: A1
  category: syntax
  subcategory: Fragesatz
  label: Entscheidungsfrage
  description: Yes/no questions formed by placing the finite verb in first position.
  examples:
  - Kaufst du heute ein?
  - Kommst du mit?
  source_note: Entscheidungsfrage
  explanations: {}

- code: wh_question
  cefr_level: A1
  category: syntax
  subcategory: Fragesatz
  label: Ergänzungsfrage mit Fragewort
  description: Information questions (W-questions) formed with an interrogative word
    in first position followed by the finite verb.
  examples:
  - Wo ist Peter?
  - Wann fängt der Kurs an?
  - Was machst du morgen?
  source_note: Ergänzungsfrage
  explanations: {}

- code: coord_conj_und_oder
  cefr_level: A1
  category: syntax
  subcategory: Satzverbindungen
  label: Satzverbindung mit und/oder
  description: Coordinating conjunctions und (and) and oder (or) used to connect clauses
    or elements.
  examples:
  - Ich hätte gern eine Coca und ein Brötchen.
  - Möchten Sie lieber Tee oder Kaffee?
  source_note: 'Satzverbindungen: und, oder'
  explanations: {}

- code: coord_conj_aber_denn
  cefr_level: A1
  category: syntax
  subcategory: Satzverbindungen
  label: Satzverbindung mit aber/denn
  description: Coordinating conjunctions aber (but) and denn (because/for) used to
    connect contrasting or causal clauses.
  examples:
  - Das ist sehr schön, aber leider zu teuer.
  - Ich gehe heute nicht spazieren, denn es ist zu kalt.
  source_note: 'Satzverbindungen: aber, denn'
  explanations: {}

- code: coord_conj_dann
  cefr_level: A1
  category: syntax
  subcategory: Satzverbindungen
  label: Satzverbindung mit dann
  description: The adverbial connector dann (then) used to sequence events or actions
    in connected sentences.
  examples:
  - Ich muss noch kurz telefonieren, dann gehen wir.
  source_note: 'Satzverbindungen: dann'
  explanations: {}

- code: subord_conj_wenn
  cefr_level: A1
  category: syntax
  subcategory: Satzverbindungen
  label: Satzverbindung mit wenn
  description: Subordinating conjunction wenn (when/if) introducing a subordinate
    clause with verb-final word order. Marked as A2 addition.
  examples: []
  source_note: 'Satzverbindungen: wenn* (A2 addition)'
  explanations: {}

- code: noun_deriv_er
  cefr_level: A1
  category: wortbildung
  subcategory: Nomen
  label: Nominalisierung mit -er
  description: Nouns derived from verbs using the suffix -er to form (typically masculine)
    agent nouns.
  examples:
  - Ausländer, Arbeiter, Bewohner, Teilnehmer
  source_note: 'Nominalisierung -er: Ausländer, Arbeiter, Bewohner, Teilnehmer'
  explanations: {}

- code: noun_deriv_ung
  cefr_level: A1
  category: wortbildung
  subcategory: Nomen
  label: Nominalisierung mit -ung
  description: Nouns derived from verbs using the suffix -ung to form feminine abstract
    nouns.
  examples:
  - Wohnung, Lösung, Mitteilung, Zahlung
  source_note: 'Nominalisierung -ung: Wohnung, Lösung, Mitteilung, Zahlung'
  explanations: {}

- code: noun_feminine_in
  cefr_level: A1
  category: wortbildung
  subcategory: Nomen
  label: Feminine Formen mit -in
  description: Formation of feminine nouns by adding the suffix -in to the masculine
    base form.
  examples:
  - Nachbarin, Kollegin, Kundin, Leiterin
  source_note: 'feminine Formen -in: Nachbarin, Kollegin, Kundin, Leiterin'
  explanations: {}

- code: noun_compound_same_d
  cefr_level: A1
  category: wortbildung
  subcategory: Nomen
  label: Komposita mit gleichem Bestimmungswort
  description: Compound nouns sharing the same first element (Bestimmungswort), illustrating
    how one modifier can combine with multiple base nouns.
  examples:
  - Reisegruppe, Reiseführer
  source_note: 'Komposita gleiches Bestimmungswort: Reisegruppe, Reiseführer'
  explanations: {}

- code: noun_compound_same_b
  cefr_level: A1
  category: wortbildung
  subcategory: Nomen
  label: Komposita mit gleichem Grundwort
  description: Compound nouns sharing the same final element (Grundwort), illustrating
    how one base noun can combine with multiple modifiers.
  examples:
  - Frauenarzt, Zahnarzt
  - Postkarte, Scheckkarte
  - Familienfoto, Passfoto
  source_note: 'Komposita gleiches Grundwort: Frauenarzt/Zahnarzt, Postkarte/Scheckkarte,
    Familienfoto/Passfoto'
  explanations: {}

- code: noun_participle
  cefr_level: A1
  category: wortbildung
  subcategory: Nomen
  label: Nominalisierte Partizipien
  description: Nouns formed from participles, such as agent or patient nouns derived
    from present or past participles.
  examples:
  - Reisender
  source_note: 'Partizipien (nominalisiert): Reisender'
  explanations: {}

- code: adj_prefix_un
  cefr_level: A1
  category: wortbildung
  subcategory: Adjektive
  label: Adjektiv mit Vorsilbe un-
  description: Adjectives negated or reversed in meaning by adding the prefix un-.
  examples:
  - unbekannt
  source_note: 'Adjektive Vorsilbe un-: unbekannt'
  explanations: {}

- code: adj_suffix_los
  cefr_level: A1
  category: wortbildung
  subcategory: Adjektive
  label: Adjektiv mit Nachsilbe -los
  description: Adjectives formed by adding the suffix -los (meaning 'without' or 'lacking')
    to a noun stem.
  examples:
  - arbeitslos
  source_note: 'Adjektive Nachsilbe -los: arbeitslos'
  explanations: {}

- code: adj_suffix_bar
  cefr_level: A1
  category: wortbildung
  subcategory: Adjektive
  label: Adjektiv mit Nachsilbe -bar
  description: Adjectives formed by adding the suffix -bar (meaning 'able to be')
    to a verb stem.
  examples:
  - erreichbar
  source_note: 'Adjektive Nachsilbe -bar: erreichbar'
  explanations: {}

- code: adj_compound_colour
  cefr_level: A1
  category: wortbildung
  subcategory: Adjektive
  label: Adjektiv-Komposita mit Farben
  description: Compound adjectives formed by combining a modifier with a colour adjective,
    e.g. to express shades.
  examples:
  - hellblau, dunkelblau
  source_note: 'Adjektive Komposita: hellblau, dunkelblau'
  explanations: {}

- code: perfekt_all_verbs
  cefr_level: A2
  category: verb
  subcategory: Tempus
  label: Perfekt aller Verben der Wortliste
  description: Formation and use of the Perfekt (present perfect) tense for all verbs
    in the A2 word list, extending beyond the limited set of verbs covered at A1.
  examples: []
  source_note: Perfekt aller Verben der Wortliste* — extends A1 Perfekt which covered
    only a select list of verbs
  explanations: {}

- code: praeteritum_kommen_s
  cefr_level: A2
  category: verb
  subcategory: Tempus
  label: Präteritum von kommen und sagen
  description: Simple past (Präteritum) forms of the verbs kommen and sagen, used
    in narrative contexts at A2 level.
  examples:
  - Wir kamen zu spät.
  - Sie sagte nichts.
  source_note: Präteritum der Verben kommen*, sagen*
  explanations: {}

- code: praeteritum_modal
  cefr_level: A2
  category: verb
  subcategory: Tempus
  label: Präteritum der Modalverben
  description: Simple past (Präteritum) forms of modal verbs (müssen, dürfen, sollen,
    können, wollen, mögen), used for expressing past obligation, ability, or permission.
  examples:
  - Ich konnte gestern leider nicht.
  source_note: Modalverben* Präteritum
  explanations: {}

- code: passiv_present
  cefr_level: A2
  category: verb
  subcategory: Modus
  label: Passiv Präsens
  description: The present passive voice (werden + Partizip II), used to describe
    actions where the agent is not the focus. Also includes passive-like participial
    phrases.
  examples:
  - Das Auto wird repariert.
  - Heute geöffnet.
  - Bis Donnerstag geschlossen.
  source_note: Passiv* — including short participial passive forms
  explanations: {}

- code: konjunktiv2_haben_ko
