  - bis morgen
  source_note: bis + Akkusativ*
  explanations: {}

- code: temporal_prep_seit
  cefr_level: A2
  category: praeposition
  subcategory: temporal
  label: Temporale Präposition seit
  description: The temporal preposition seit (since/for) with dative, expressing the
    starting point or duration of an ongoing situation.
  examples:
  - seit einer Woche
  source_note: seit + Dativ*
  explanations: {}

- code: temporal_prep_vom_an
  cefr_level: A2
  category: praeposition
  subcategory: temporal
  label: Temporale Präposition vom … an
  description: The temporal expression vom … an (from … onwards), used to indicate
    the starting point of a period.
  examples:
  - vom Herbst an
  source_note: vom ... an*
  explanations: {}

- code: temporal_prep_waehre
  cefr_level: A2
  category: praeposition
  subcategory: temporal
  label: Temporale Präposition während
  description: The temporal preposition während (during) governing the genitive case,
    expressing concurrent events.
  examples:
  - während des Urlaubs
  source_note: während + Genitiv*
  explanations: {}

- code: temporal_prep_zu
  cefr_level: A2
  category: praeposition
  subcategory: temporal
  label: Temporale Präposition zu
  description: The temporal preposition zu (at/for) with dative, used to express time
    in relation to meals or occasions.
  examples:
  - zum Frühstück
  source_note: zu + Dativ* (temporal)
  explanations: {}

- code: lokal_prep_hinter
  cefr_level: A2
  category: praeposition
  subcategory: lokal
  label: Lokale Präposition hinter
  description: The two-way preposition hinter (behind) with dative for location and
    accusative for direction.
  examples:
  - hinter dem Haus
  source_note: hinter + Dativ / Akkusativ*
  explanations: {}

- code: lokal_prep_gegenuebe
  cefr_level: A2
  category: praeposition
  subcategory: lokal
  label: Lokale Präposition gegenüber
  description: The local preposition gegenüber (opposite/across from) with dative,
    typically postposed after a noun or pronoun.
  examples:
  - in dem Geschäft gegenüber
  source_note: gegenüber + Dativ* (nachgestellt)
  explanations: {}

- code: lokal_prep_neben
  cefr_level: A2
  category: praeposition
  subcategory: lokal
  label: Lokale Präposition neben
  description: The two-way preposition neben (next to/beside) with dative for static
    location and accusative for movement.
  examples:
  - in der Wohnung neben mir
  source_note: neben + Dativ / Akkusativ*
  explanations: {}

- code: lokal_prep_unter
  cefr_level: A2
  category: praeposition
  subcategory: lokal
  label: Lokale Präposition unter
  description: The two-way preposition unter (under/below) with dative for static
    location and accusative for directional movement.
  examples:
  - unter dem Tisch
  - unter der Nummer
  source_note: unter + Dativ / Akkusativ*
  explanations: {}

- code: lokal_prep_ueber
  cefr_level: A2
  category: praeposition
  subcategory: lokal
  label: Lokale Präposition über
  description: The two-way preposition über (above/over) with dative for static location
    and accusative for directional movement.
  examples:
  - über dem Tisch
  source_note: über + Dativ / Akkusativ*
  explanations: {}

- code: lokal_prep_von
  cefr_level: A2
  category: praeposition
  subcategory: lokal
  label: Lokale Präposition von
  description: The local preposition von (from) with dative, indicating origin or
    starting point of movement.
  examples:
  - von der Arbeit / vom Arzt kommen
  - von Hamburg nach Bremen
  source_note: von + Dativ*
  explanations: {}

- code: lokal_prep_vor
  cefr_level: A2
  category: praeposition
  subcategory: lokal
  label: Lokale Präposition vor
  description: The local preposition vor (in front of) with dative, indicating position
    in front of a place or object.
  examples:
  - vor dem Kino
  source_note: vor + Dativ* (lokal)
  explanations: {}

- code: lokal_prep_zwischen
  cefr_level: A2
  category: praeposition
  subcategory: lokal
  label: Lokale Präposition zwischen
  description: The two-way preposition zwischen (between) with dative for location
    and accusative for direction, indicating a position between two points.
  examples:
  - zwischen Frankfurt und Stuttgart
  source_note: zwischen + Dativ / Akkusativ*
  explanations: {}

- code: konj_deshalb
  cefr_level: A2
  category: syntax
  subcategory: Satzverbindungen
  label: Konjunktion deshalb
  description: The connective deshalb (therefore/so) used as a coordinating adverbial
    conjunction to express consequence, triggering verb-second word order.
  examples:
  - Peter muss lernen, deshalb kommt er heute nicht mit.
  source_note: deshalb*
  explanations: {}

- code: konj_weil
  cefr_level: A2
  category: syntax
  subcategory: Satzverbindungen
  label: Konjunktion weil (Kausalangabe)
  description: The subordinating conjunction weil (because), which introduces a causal
    subordinate clause with verb-final word order.
  examples:
  - Er kommt nicht mit, weil er krank ist.
  source_note: weil*
  explanations: {}

- code: konj_wenn
  cefr_level: A2
  category: syntax
  subcategory: Satzverbindungen
  label: Konjunktion wenn (Konditional/Temporal)
  description: The subordinating conjunction wenn (when/if), introducing conditional
    or temporal subordinate clauses with verb-final word order.
  examples:
  - Schreib mir bitte, wenn du Zeit hast.
  source_note: wenn*
  explanations: {}

- code: wortbildung_nomen_er
  cefr_level: A2
  category: wortbildung
  subcategory: Nomen
  label: Nomenbildung mit Suffix -er
  description: Formation of nouns using the suffix -er, typically to derive agent
    nouns (people who do something) from verbs.
  examples:
  - Ausländer
  - Arbeiter
  - Bewohner
  - Teilnehmer
  source_note: 'Nomen -er: Ausländer, Arbeiter, Bewohner, Teilnehmer'
  explanations: {}

- code: wortbildung_nomen_un
  cefr_level: A2
  category: wortbildung
  subcategory: Nomen
  label: Nomenbildung mit Suffix -ung
  description: Formation of feminine nouns using the suffix -ung, typically derived
    from verbs to express a process or result.
  examples:
  - Wohnung
  - Lösung
  - Mitteilung
  - Zahlung
  source_note: 'Nomen -ung: Wohnung, Lösung, Mitteilung, Zahlung'
  explanations: {}

- code: wortbildung_nomen_in
  cefr_level: A2
  category: wortbildung
  subcategory: Nomen
  label: Nomenbildung feminine Formen auf -in
  description: Formation of feminine agent nouns using the suffix -in, used to derive
    the female form from a masculine base noun.
  examples:
  - Nachbarin
  - Kollegin
  - Kundin
  - Leiterin
  source_note: 'feminine Formen -in: Nachbarin, Kollegin, Kundin, Leiterin'
  explanations: {}

- code: wortbildung_komposit
  cefr_level: A2
  category: wortbildung
  subcategory: Nomen
  label: Komposita mit gleichem Bestimmungs- oder Grundwort
  description: Formation of compound nouns (Komposita) by combining two nouns, either
    sharing the same first element (Bestimmungswort) or the same final element (Grundwort).
  examples:
  - Reisegruppe
  - Reiseführer
  - Frauenarzt
  - Zahnarzt
  - Postkarte
  - Familienfoto
  source_note: Komposita — gleiches Bestimmungswort (z.B. Reise-) oder gleiches Grundwort
    (z.B. -arzt, -karte, -foto)
  explanations: {}

- code: wortbildung_partizip
  cefr_level: A2
  category: wortbildung
  subcategory: Nomen
  label: Nominalisierung von Partizipien
  description: Nominalisation of present or past participles to form nouns referring
    to persons or things.
  examples:
  - Reisender
  source_note: 'Nominalisierung — Partizipien: Reisender'
  explanations: {}

- code: wortbildung_adj_un
  cefr_level: A2
  category: wortbildung
  subcategory: Adjektive
  label: Adjektivbildung mit Vorsilbe un-
  description: Formation of adjectives with the negative prefix un-, which reverses
    or negates the meaning of the base adjective.
  examples:
  - unbekannt
  source_note: 'Adjektive Vorsilbe un-: unbekannt'
  explanations: {}

- code: wortbildung_adj_los
  cefr_level: A2
  category: wortbildung
  subcategory: Adjektive
  label: Adjektivbildung mit Nachsilbe -los
  description: Formation of adjectives with the suffix -los (without/lacking), typically
    derived from nouns to express the absence of something.
  examples:
  - arbeitslos
  source_note: 'Adjektive Nachsilbe -los: arbeitslos'
  explanations: {}

- code: wortbildung_adj_bar
  cefr_level: A2
  category: wortbildung
  subcategory: Adjektive
  label: Adjektivbildung mit Nachsilbe -bar
  description: Formation of adjectives with the suffix -bar (expressible as '-able'
    or '-ible' in English), typically derived from verbs to express possibility or
    capability.
  examples:
  - erreichbar
  source_note: 'Adjektive Nachsilbe -bar: erreichbar'
  explanations: {}

- code: wortbildung_adj_komp
  cefr_level: A2
  category: wortbildung
  subcategory: Adjektive
  label: Adjektiv-Komposita mit hell- und dunkel-
  description: Formation of compound adjectives using hell- (light) or dunkel- (dark)
    as the first element to modify a colour adjective.
  examples:
  - hellblau
  - dunkelblau
  source_note: 'Adjektive Komposita: hellblau, dunkelblau'
  explanations: {}
