  category: artikelwoerter_pronomen
  subcategory: Artikel
  label: Interrogativartikel welch- und alle
  description: The interrogative article welch- (which) in nominative and accusative
    forms, and the determiner alle (all), used in questions and general statements.
  examples:
  - Welchen Film meinst du?
  - alle Kursteilnehmer
