- code: present_tense
  cefr_level: A1
  category: verb
  subcategory: Tempus
  label: Präsens aller Verben der Wortliste
  description: Present tense forms of all verbs in the A1 word list, including regular,
    irregular, and mixed verbs.
  examples:
  - Kommst du mit?
  - Wann fängt der Kurs an?
  - Wo kaufst du gerne ein?
  source_note: Präsens aller Verben der Wortliste
  explanations:
    en:
      title: The present tense in German
      tip: German present tense is formed by adding personal endings to the verb stem.
        Most verbs follow a regular pattern, but some common verbs change their stem
        vowel in the du and er/sie/es forms.
      explanation: |-
        ## The German Present Tense (<span lang="de">Präsens</span>)

        The <span lang="de">Präsens</span> (present tense) is used to describe actions happening now, habitual actions, and general facts. It is the foundation of German verb grammar.

        ---

        ### 1. Regular Verbs (<span lang="de">regelmäßige Verben</span>)

        To form the present tense, find the **stem** by removing <span lang="de">-en</span> (or <span lang="de">-n</span>) from the infinitive, then add the personal endings.

        | Pronoun | Ending | Example: <span lang="de">kommen</span> (to come) |
        |---|---|---|
        | <span lang="de">ich</span> | <span lang="de">-e</span> | <span lang="de">ich komme</span> |
        | <span lang="de">du</span> | <span lang="de">-st</span> | <span lang="de">du kommst</span> |
        | <span lang="de">er/sie/es</span> | <span lang="de">-t</span> | <span lang="de">er kommt</span> |
        | <span lang="de">wir</span> | <span lang="de">-en</span> | <span lang="de">wir kommen</span> |
        | <span lang="de">ihr</span> | <span lang="de">-t</span> | <span lang="de">ihr kommt</span> |
        | <span lang="de">sie/Sie</span> | <span lang="de">-en</span> | <span lang="de">sie kommen</span> |

        ---

        ### 2. Stems Ending in <span lang="de">-t</span>, <span lang="de">-d</span>, or Consonant Clusters

        When the verb stem ends in <span lang="de">-t</span>, <span lang="de">-d</span>, or a difficult consonant cluster (e.g. <span lang="de">-fn</span>, <span lang="de">-gn</span>), an extra <span lang="de">-e-</span> is inserted before the <span lang="de">-st</span> and <span lang="de">-t</span> endings to make pronunciation easier.

        | Pronoun | <span lang="de">arbeiten</span> (to work) | <span lang="de">finden</span> (to find) |
        |---|---|---|
        | <span lang="de">ich</span> | <span lang="de">arbeite</span> | <span lang="de">finde</span> |
        | <span lang="de">du</span> | <span lang="de">arbeitest</span> | <span lang="de">findest</span> |
        | <span lang="de">er/sie/es</span> | <span lang="de">arbeitet</span> | <span lang="de">findet</span> |
        | <span lang="de">wir</span> | <span lang="de">arbeiten</span> | <span lang="de">finden</span> |
        | <span lang="de">ihr</span> | <span lang="de">arbeitet</span> | <span lang="de">findet</span> |
        | <span lang="de">sie/Sie</span> | <span lang="de">arbeiten</span> | <span lang="de">finden</span> |

        ---

        ### 3. Stems Ending in a Sibilant (<span lang="de">-s</span>, <span lang="de">-ss</span>, <span lang="de">-ß</span>, <span lang="de">-z</span>)

        When the stem ends in a sibilant, the <span lang="de">du</span>-form loses the <span lang="de">-s</span> of the ending (because the stem already provides it), leaving only <span lang="de">-t</span>.

        - <span lang="de">heißen</span> → stem <span lang="de">heiß-</span> → <span lang="de">du heißt</span> (not <span lang="de">~~du heißst~~</span>)
        - <span lang="de">reisen</span> → stem <span lang="de">reis-</span> → <span lang="de">du reist</span>

        ---

        ### 4. Strong (Irregular) Verbs — Stem Vowel Change

        Many very common German verbs change their stem vowel in the <span lang="de">du</span> and <span lang="de">er/sie/es</span> forms. The <span lang="de">ich</span>, <span lang="de">wir</span>, <span lang="de">ihr</span>, and <span lang="de">sie/Sie</span> forms are regular. There are three main patterns:

        #### Pattern A: <span lang="de">a → ä</span>

        | Pronoun | <span lang="de">fahren</span> (to drive/go) | <span lang="de">schlafen</span> (to sleep) |
        |---|---|---|
        | <span lang="de">ich</span> | <span lang="de">fahre</span> | <span lang="de">schlafe</span> |
        | <span lang="de">du</span> | <span lang="de">fährst</span> | <span lang="de">schläfst</span> |
        | <span lang="de">er/sie/es</span> | <span lang="de">fährt</span> | <span lang="de">schläft</span> |
        | <span lang="de">wir</span> | <span lang="de">fahren</span> | <span lang="de">schlafen</span> |
        | <span lang="de">ihr</span> | <span lang="de">fahrt</span> | <span lang="de">schlaft</span> |
        | <span lang="de">sie/Sie</span> | <span lang="de">fahren</span> | <span lang="de">schlafen</span> |

        Other common verbs: <span lang="de">anfangen</span> (to begin) → <span lang="de">fängst an / fängt an</span>; <span lang="de">tragen</span> (to carry/wear) → <span lang="de">trägst / trägt</span>

        #### Pattern B: <span lang="de">e → i</span>

        | Pronoun | <span lang="de">sprechen</span> (to speak) | <span lang="de">helfen</span> (to help) |
        |---|---|---|
        | <span lang="de">ich</span> | <span lang="de">spreche</span> | <span lang="de">helfe</span> |
        | <span lang="de">du</span> | <span lang="de">sprichst</span> | <span lang="de">hilfst</span> |
        | <span lang="de">er/sie/es</span> | <span lang="de">spricht</span> | <span lang="de">hilft</span> |
        | <span lang="de">wir</span> | <span lang="de">sprechen</span> | <span lang="de">helfen</span> |
        | <span lang="de">ihr</span> | <span lang="de">sprecht</span> | <span lang="de">helft</span> |
        | <span lang="de">sie/Sie</span> | <span lang="de">sprechen</span> | <span lang="de">helfen</span> |

        Other common verbs: <span lang="de">essen</span> (to eat) → <span lang="de">isst</span>; <span lang="de">geben</span> (to give) → <span lang="de">gibt</span>; <span lang="de">nehmen</span> (to take) → <span lang="de">nimmst / nimmt</span>; <span lang="de">treffen</span> (to meet) → <span lang="de">trifft</span>

        #### Pattern C: <span lang="de">e → ie</span>

        | Pronoun | <span lang="de">lesen</span> (to read) | <span lang="de">sehen</span> (to see) |
        |---|---|---|
        | <span lang="de">ich</span> | <span lang="de">lese</span> | <span lang="de">sehe</span> |
        | <span lang="de">du</span> | <span lang="de">liest</span> | <span lang="de">siehst</span> |
        | <span lang="de">er/sie/es</span> | <span lang="de">liest</span> | <span lang="de">sieht</span> |
        | <span lang="de">wir</span> | <span lang="de">lesen</span> | <span lang="de">sehen</span> |
        | <span lang="de">ihr</span> | <span lang="de">lest</span> | <span lang="de">seht</span> |
        | <span lang="de">sie/Sie</span> | <span lang="de">lesen</span> | <span lang="de">sehen</span> |

        ---

        ### 5. Fully Irregular Verbs: <span lang="de">sein</span>, <span lang="de">haben</span>, <span lang="de">werden</span>

        These three verbs are used constantly and must be memorised separately.

        | Pronoun | <span lang="de">sein</span> (to be) | <span lang="de">haben</span> (to have) | <span lang="de">werden</span> (to become) |
        |---|---|---|---|
        | <span lang="de">ich</span> | <span lang="de">bin</span> | <span lang="de">habe</span> | <span lang="de">werde</span> |
        | <span lang="de">du</span> | <span lang="de">bist</span> | <span lang="de">hast</span> | <span lang="de">wirst</span> |
        | <span lang="de">er/sie/es</span> | <span lang="de">ist</span> | <span lang="de">hat</span> | <span lang="de">wird</span> |
        | <span lang="de">wir</span> | <span lang="de">sind</span> | <span lang="de">haben</span> | <span lang="de">werden</span> |
        | <span lang="de">ihr</span> | <span lang="de">seid</span> | <span lang="de">habt</span> | <span lang="de">werden</span> |
        | <span lang="de">sie/Sie</span> | <span lang="de">sind</span> | <span lang="de">haben</span> | <span lang="de">werden</span> |

        ---

        ### 6. Separable Verbs (<span lang="de">Verben mit trennbarem Präfix</span>)

        Some verbs have a prefix that splits off and moves to the end of the sentence in the present tense. The conjugated part still follows the regular rules.

        - <span lang="de">einkaufen</span> (to shop) → <span lang="de">Ich kaufe im Supermarkt ein.</span> (I shop at the supermarket.)
        - <span lang="de">anfangen</span> (to begin) → <span lang="de">Der Kurs fängt um neun Uhr an.</span> (The course begins at nine o'clock.)

        See the sibling grammar point on separable verbs for full detail.

        ---

        ### 7. Examples in Context

        - <span lang="de">Ich komme aus Deutschland.</span> — I come from Germany.
        - <span lang="de">Du sprichst sehr gut Deutsch!</span> — You speak German very well!
        - <span lang="de">Wann fängt der Kurs an?</span> — When does the course begin?
        - <span lang="de">Wo kaufst du gerne ein?</span> — Where do you like to shop?
        - <span lang="de">Er liest jeden Tag die Zeitung.</span> — He reads the newspaper every day.
        - <span lang="de">Wir arbeiten von Montag bis Freitag.</span> — We work from Monday to Friday.

        ---

        ### 8. Common Learner Mistakes

        **Mistake 1: Forgetting the vowel change in strong verbs**
        - ❌ <span lang="de">Er esst viel.</span>
        - ✅ <span lang="de">Er isst viel.</span> (He eats a lot.)

        **Mistake 2: Not inserting the extra <span lang="de">-e-</span> with stems ending in <span lang="de">-t</span> or <span lang="de">-d</span>**
        - ❌ <span lang="de">Er arbeit viel.</span>
        - ✅ <span lang="de">Er arbeitet viel.</span> (He works a lot.)

        **Mistake 3: Using <span lang="de">sein</span> as if it were regular**
        - ❌ <span lang="de">Ich sein müde.</span>
        - ✅ <span lang="de">Ich bin müde.</span> (I am tired.)

        **Mistake 4: Keeping the separable prefix attached**
        - ❌ <span lang="de">Ich einkaufe morgen.</span>
        - ✅ <span lang="de">Ich kaufe morgen ein.</span> (I am shopping tomorrow.)

        **Mistake 5: Adding endings to <span lang="de">du</span> form of sibilant-stem verbs**
        - ❌ <span lang="de">Du heißst Maria.</span>
        - ✅ <span lang="de">Du heißt Maria.</span> (Your name is Maria.)
      language: en
      why_this_matters: The present tense is the single most important verb form at
        A1 level — nearly every sentence you say or read will use it. Without it,
        you cannot describe daily routines, ask questions, or talk about anything
        happening now.

- code: perfect_tense
  cefr_level: A1
  category: verb
  subcategory: Tempus
  label: Perfekt ausgewählter Verben
  description: Perfect tense of a selected set of verbs including arbeiten, bleiben,
    essen, fahren, fragen, glauben, haben, lesen, lernen, machen, schlafen, sehen,
    passieren, trinken, verstehen.
  examples:
  - Ich habe schon gegessen.
  prerequisites:
  - present_tense
  source_note: 'Perfekt der Verben: arbeiten/bleiben/essen/fahren/fragen/glauben/haben/lesen/lernen/machen/schlafen/sehen/passieren/trinken/verstehen'
  explanations:
    en:
      title: The perfect tense in German
      tip: The perfect tense describes finished actions in the past. You build it
        with the present tense of <span lang="de">haben</span> or <span lang="de">sein</span>
        plus a past participle at the end of the sentence. Most verbs use <span lang="de">haben</span>;
        verbs of movement or change of state often use <span lang="de">sein</span>.
      explanation: |-
        ## The Perfect Tense (<span lang="de">das Perfekt</span>)

        ### What is it?

        The <span lang="de">Perfekt</span> (perfect tense) is the most common way to talk about **finished past events** in spoken German and informal writing. It corresponds roughly to both the English simple past ('I ate') and the present perfect ('I have eaten').

        ---

        ### How to build it

        You need **two parts**:

        1. A present-tense form of <span lang="de">haben</span> (to have) **or** <span lang="de">sein</span> (to be) — called the **auxiliary** (<span lang="de">das Hilfsverb</span>)
        2. The **past participle** (<span lang="de">das Partizip II</span>) of the main verb — placed at the **end** of the sentence

        > **Formula:** subject + <span lang="de">haben/sein</span> (conjugated) + … + <span lang="de">Partizip II</span>

        This two-part structure creates the **sentence bracket** (<span lang="de">Satzklammer</span>): the auxiliary sits in position 2 and the participle closes the sentence.

        ---

        ### Forming the past participle (<span lang="de">Partizip II</span>)

        #### Regular (weak) verbs

        Most regular verbs follow this pattern:

        > <span lang="de">ge-</span> + verb stem + <span lang="de">-(e)t</span>

        | Infinitive | Stem | <span lang="de">Partizip II</span> |
        |---|---|---|
        | <span lang="de">machen</span> | <span lang="de">mach-</span> | <span lang="de">gemacht</span> |
        | <span lang="de">fragen</span> | <span lang="de">frag-</span> | <span lang="de">gefragt</span> |
        | <span lang="de">lernen</span> | <span lang="de">lern-</span> | <span lang="de">gelernt</span> |
        | <span lang="de">glauben</span> | <span lang="de">glaub-</span> | <span lang="de">geglaubt</span> |
        | <span lang="de">arbeiten</span> | <span lang="de">arbeit-</span> | <span lang="de">gearbeitet</span> |

        **Note:** Verbs whose stem ends in <span lang="de">-t</span> or <span lang="de">-d</span> (like <span lang="de">arbeiten</span>) add <span lang="de">-et</span> to make pronunciation easier.

        #### Irregular (strong) verbs

        These change their stem vowel and end in <span lang="de">-en</span>. You must learn these individually.

        | Infinitive | <span lang="de">Partizip II</span> |
        |---|---|
        | <span lang="de">essen</span> | <span lang="de">gegessen</span> |
        | <span lang="de">fahren</span> | <span lang="de">gefahren</span> |
        | <span lang="de">lesen</span> | <span lang="de">gelesen</span> |
        | <span lang="de">schlafen</span> | <span lang="de">geschlafen</span> |
        | <span lang="de">sehen</span> | <span lang="de">gesehen</span> |
        | <span lang="de">trinken</span> | <span lang="de">getrunken</span> |
        | <span lang="de">verstehen</span> | <span lang="de">verstanden</span> |
        | <span lang="de">bleiben</span> | <span lang="de">geblieben</span> |

        #### Special cases

        - <span lang="de">haben</span> → <span lang="de">gehabt</span>
        - <span lang="de">passieren</span> → <span lang="de">passiert</span> (no <span lang="de">ge-</span> prefix because it ends in <span lang="de">-ieren</span>)

        ---

        ### Choosing the auxiliary: <span lang="de">haben</span> or <span lang="de">sein</span>?

        **Use <span lang="de">haben</span>** with most verbs, including all verbs that take a direct object:

        > <span lang="de">essen, fragen, glauben, haben, lesen, lernen, machen, schlafen, trinken, verstehen, arbeiten</span>

        **Use <span lang="de">sein</span>** with verbs that express:
        - movement from one place to another
        - a change of state
        - a few fixed verbs (including <span lang="de">bleiben</span> and <span lang="de">passieren</span>)

        From this list: <span lang="de">fahren</span>, <span lang="de">bleiben</span>, <span lang="de">passieren</span> use <span lang="de">sein</span>.

        ---

        ### Conjugation tables

        #### <span lang="de">haben</span> (auxiliary) — present tense

        | Person | Form |
        |---|---|
        | <span lang="de">ich</span> | <span lang="de">habe</span> |
        | <span lang="de">du</span> | <span lang="de">hast</span> |
        | <span lang="de">er/sie/es</span> | <span lang="de">hat</span> |
        | <span lang="de">wir</span> | <span lang="de">haben</span> |
        | <span lang="de">ihr</span> | <span lang="de">habt</span> |
        | <span lang="de">sie/Sie</span> | <span lang="de">haben</span> |

        #### <span lang="de">sein</span> (auxiliary) — present tense

        | Person | Form |
        |---|---|
        | <span lang="de">ich</span> | <span lang="de">bin</span> |
        | <span lang="de">du</span> | <span lang="de">bist</span> |
        | <span lang="de">er/sie/es</span> | <span lang="de">ist</span> |
        | <span lang="de">wir</span> | <span lang="de">sind</span> |
        | <span lang="de">ihr</span> | <span lang="de">seid</span> |
        | <span lang="de">sie/Sie</span> | <span lang="de">sind</span> |

        ---

        ### Examples with translations

        1. <span lang="de">Ich habe schon gegessen.</span> — I have already eaten. / I already ate.
        2. <span lang="de">Wir haben Deutsch gelernt.</span> — We learned German.
        3. <span lang="de">Sie hat viel Wasser getrunken.</span> — She drank a lot of water.
        4. <span lang="de">Er ist nach Berlin gefahren.</span> — He drove / travelled to Berlin.
        5. <span lang="de">Was ist passiert?</span> — What happened?
        6. <span lang="de">Du hast das Buch gelesen.</span> — You read the book.

        ---

        ### Common learner mistakes

        #### ❌ Wrong auxiliary
        > <span lang="de">*Ich habe nach Berlin gefahren.</span>
        > ✅ <span lang="de">Ich bin nach Berlin gefahren.</span>

        <span lang="de">fahren</span> (movement to a place) takes <span lang="de">sein</span>, not <span lang="de">haben</span>.

        #### ❌ Putting the participle in position 2
        > <span lang="de">*Ich gegessen habe schon.</span>
        > ✅ <span lang="de">Ich habe schon gegessen.</span>

        The auxiliary goes in position 2; the participle **always** goes to the end.

        #### ❌ Forgetting <span lang="de">ge-</span>
        > <span lang="de">*Ich habe trinkt.</span>
        > ✅ <span lang="de">Ich habe getrunken.</span>

        Always use the full <span lang="de">Partizip II</span> form, not the present-tense form.

        #### ❌ Adding <span lang="de">ge-</span> to <span lang="de">-ieren</span> verbs
        > <span lang="de">*Es hat gepassiert.</span>
        > ✅ <span lang="de">Es ist passiert.</span>

        Verbs ending in <span lang="de">-ieren</span> never add <span lang="de">ge-</span>, and <span lang="de">passieren</span> also takes <span lang="de">sein</span>.

        ---

        ### Quick reference: key verbs at a glance

        | Infinitive | <span lang="de">Partizip II</span> | Auxiliary | Example |
        |---|---|---|---|
        | <span lang="de">arbeiten</span> | <span lang="de">gearbeitet</span> | <span lang="de">haben</span> | <span lang="de">Ich habe gearbeitet.</span> |
        | <span lang="de">bleiben</span> | <span lang="de">geblieben</span> | <span lang="de">sein</span> | <span lang="de">Er ist geblieben.</span> |
        | <span lang="de">essen</span> | <span lang="de">gegessen</span> | <span lang="de">haben</span> | <span lang="de">Wir haben gegessen.</span> |
        | <span lang="de">fahren</span> | <span lang="de">gefahren</span> | <span lang="de">sein</span> | <span lang="de">Sie ist gefahren.</span> |
        | <span lang="de">fragen</span> | <span lang="de">gefragt</span> | <span lang="de">haben</span> | <span lang="de">Er hat gefragt.</span> |
        | <span lang="de">glauben</span> | <span lang="de">geglaubt</span> | <span lang="de">haben</span> | <span lang="de">Du hast geglaubt.</span> |
        | <span lang="de">haben</span> | <span lang="de">gehabt</span> | <span lang="de">haben</span> | <span lang="de">Ich habe Hunger gehabt.</span> |
        | <span lang="de">lesen</span> | <span lang="de">gelesen</span> | <span lang="de">haben</span> | <span lang="de">Sie hat gelesen.</span> |
        | <span lang="de">lernen</span> | <span lang="de">gelernt</span> | <span lang="de">haben</span> | <span lang="de">Ihr habt gelernt.</span> |
        | <span lang="de">machen</span> | <span lang="de">gemacht</span> | <span lang="de">haben</span> | <span lang="de">Wir haben Hausaufgaben gemacht.</span> |
        | <span lang="de">passieren</span> | <span lang="de">passiert</span> | <span lang="de">sein</span> | <span lang="de">Was ist passiert?</span> |
        | <span lang="de">schlafen</span> | <span lang="de">geschlafen</span> | <span lang="de">haben</span> | <span lang="de">Er hat gut geschlafen.</span> |
        | <span lang="de">sehen</span> | <span lang="de">gesehen</span> | <span lang="de">haben</span> | <span lang="de">Ich habe das gesehen.</span> |
        | <span lang="de">trinken</span> | <span lang="de">getrunken</span> | <span lang="de">haben</span> | <span lang="de">Sie haben getrunken.</span> |
        | <span lang="de">verstehen</span> | <span lang="de">verstanden</span> | <span lang="de">haben</span> | <span lang="de">Ich habe verstanden.</span> |
      language: en
      why_this_matters: The perfect tense is the everyday way Germans talk about the
        past in conversation and informal writing — you will need it constantly to
        say what you did, ate, read, or experienced. Without it you cannot describe
        any finished past event, which means you are stuck talking only about the
        present.

- code: selected_participles
  cefr_level: A1
  category: verb
  subcategory: Tempus
  label: Ausgewählte Partizipien
  description: Selected past participles used in isolation or as adjectives, e.g.
    in signs or notices.
  examples:
  - Heute geöffnet.
  - Bis Donnerstag geschlossen.
  prerequisites:
  - present_tense
  source_note: Ausgewählte Partizipien
  explanations:
    en:
      title: Participles used alone as notices
      tip: A past participle can stand on its own — without a verb like 'is' or 'are'
        — to act as a short notice or label. Think of it as a clipped sentence where
        everything except the key word has been dropped. You see this on signs, doors,
        and announcements every day.
      explanation: |-
        ## Participles as Stand-Alone Notices

        ### What is a participle?

        A <span lang="de">Partizip II</span> (past participle) is the form of a verb used in the <span lang="de">Perfekt</span> (perfect tense) and as an adjective. At A1 level you mainly meet it in short notices where it stands completely alone — no subject, no auxiliary verb, nothing else.

        ---

        ### The full sentence behind the notice

        Every short notice hides a longer sentence. The participle is what remains after everything 'obvious' is removed:

        | Full sentence | Short notice |
        |---|---|
        | <span lang="de">Das Geschäft ist heute geöffnet.</span> | <span lang="de">Heute geöffnet.</span> |
        | <span lang="de">Das Büro ist bis Donnerstag geschlossen.</span> | <span lang="de">Bis Donnerstag geschlossen.</span> |
        | <span lang="de">Der Aufzug ist besetzt.</span> | <span lang="de">Besetzt.</span> |
        | <span lang="de">Der Parkplatz ist reserviert.</span> | <span lang="de">Reserviert.</span> |

        The missing verb is almost always a form of <span lang="de">sein</span> (to be).

        ---

        ### How to form the Partizip II

        You need to recognise these forms, not produce them from scratch at A1. Here is a quick guide to the two main patterns:

        #### Regular (weak) verbs
        **Formula:** <span lang="de">ge-</span> + verb stem + <span lang="de">-t</span>

        | Infinitive | Partizip II |
        |---|---|
        | <span lang="de">öffnen</span> (to open) | <span lang="de">geöffnet</span> |
        | <span lang="de">schließen</span> (to close) | <span lang="de">geschlossen</span>* |
        | <span lang="de">reservieren</span> (to reserve) | <span lang="de">reserviert</span>** |
        | <span lang="de">besetzen</span> (to occupy) | <span lang="de">besetzt</span>** |

        \* <span lang="de">schließen</span> is irregular — it keeps a strong/mixed form: <span lang="de">geschlossen</span>.
        \*\* Verbs with inseparable prefixes (<span lang="de">be-, ver-, re-,</span> etc.) or verbs ending in <span lang="de">-ieren</span> do **not** add <span lang="de">ge-</span>.

        #### Irregular (strong) verbs
        These change the stem vowel and usually end in <span lang="de">-en</span>. You simply have to learn them.

        | Infinitive | Partizip II |
        |---|---|
        | <span lang="de">schreiben</span> (to write) | <span lang="de">geschrieben</span> |
        | <span lang="de">kommen</span> (to come) | <span lang="de">gekommen</span> |

        ---

        ### Verbs with inseparable prefixes — no ge-

        If a verb already starts with <span lang="de">be-, ge-, emp-, ent-, er-, miss-, ver-, zer-</span>, the <span lang="de">ge-</span> is dropped:

        - <span lang="de">besetzt</span> (occupied) — NOT <span lang="de">gebesetzt</span>
        - <span lang="de">reserviert</span> (reserved) — NOT <span lang="de">gereserviert</span>
        - <span lang="de">verkauft</span> (sold) — NOT <span lang="de">geverkauft</span>

        ---

        ### Example sentences

        1. <span lang="de">Heute geöffnet.</span> — Open today.
        2. <span lang="de">Bis Donnerstag geschlossen.</span> — Closed until Thursday.
        3. <span lang="de">Dieser Sitzplatz ist reserviert.</span> — This seat is reserved.
        4. <span lang="de">Besetzt.</span> — Occupied. *(on a toilet door or lift)*
        5. <span lang="de">Ausverkauft.</span> — Sold out.
        6. <span lang="de">Frisch gestrichen!</span> — Wet paint! *(literally: freshly painted)*

        ---

        ### Common learner mistakes

        **1. Adding ge- to verbs that already have a prefix**

        ❌ <span lang="de">gereserviert</span>
        ✅ <span lang="de">reserviert</span>

        Verbs ending in <span lang="de">-ieren</span> never take <span lang="de">ge-</span>.

        **2. Confusing the participle with the adjective ending**

        When the participle stands alone as a notice, it has **no extra ending**. When it is used directly before a noun, it does need an adjective ending — but that is a higher-level topic.

        ❌ <span lang="de">Heute geöffnete.</span>
        ✅ <span lang="de">Heute geöffnet.</span>

        **3. Using the wrong auxiliary in the full sentence**

        When the participle is expanded back into a full sentence, the verb is <span lang="de">sein</span>, not <span lang="de">haben</span>:

        ❌ <span lang="de">Das Büro hat geschlossen.</span> *(means 'the office has closed' — a different meaning)*
        ✅ <span lang="de">Das Büro ist geschlossen.</span> — The office is closed. *(a state)*

        ---

        ### Quick recognition checklist

        - Does it start with <span lang="de">ge-</span> and end in <span lang="de">-t</span> or <span lang="de">-en</span>? → Probably a <span lang="de">Partizip II</span>.
        - Is it on a sign with no full verb? → Read it as '(is/are) + participle'.
        - No <span lang="de">ge-</span> but ends in <span lang="de">-iert</span>? → Still a participle (<span lang="de">-ieren</span> verb).
      language: en
      why_this_matters: These one-word or two-word notices are everywhere in German
        life — on shop doors, museum displays, menus, and public transport. Recognising
        them instantly lets you navigate daily situations before you can read full
        sentences.

- code: praeteritum_haben_se
  cefr_level: A1
  category: verb
  subcategory: Tempus
  label: Präteritum haben/sein 1./3. Person
  description: Simple past (Präteritum) of haben and sein in the 1st and 3rd person
    singular only.
  examples:
  - Sie/ich hatte keine Zeit.
  - Ich/er war nicht da.
  prerequisites:
  - haben_praesens
  - sein_praesens
  source_note: 'Präteritum: ausgewählte Form: 1. und 3. Person haben/sein'
  explanations:
    en:
      title: Simple past of haben and sein
      tip: 'In German, <span lang="de">haben</span> (to have) and <span lang="de">sein</span>
        (to be) have special simple-past forms that are used even in everyday speech.
        Learn just the 1st and 3rd person singular forms for now: <span lang="de">hatte/hatte</span>
        and <span lang="de">war/war</span> — they are identical for both persons.'
      explanation: |-
        ## Simple Past (<span lang="de">Präteritum</span>) of <span lang="de">haben</span> and <span lang="de">sein</span>

        ### What is the <span lang="de">Präteritum</span>?

        The <span lang="de">Präteritum</span> (simple past) is a verb tense used to describe actions or states in the past. While most past events in everyday German speech use the <span lang="de">Perfekt</span> (perfect tense), <span lang="de">haben</span> (to have) and <span lang="de">sein</span> (to be) are almost always used in the <span lang="de">Präteritum</span> even in spoken language. This makes these forms especially important to learn early.

        ---

        ### The Forms: 1st and 3rd Person Singular

        At A1 level, focus on just two persons:

        | Person | <span lang="de">haben</span> (to have) | <span lang="de">sein</span> (to be) |
        |---|---|---|
        | 1st person singular (<span lang="de">ich</span>) | <span lang="de">hatte</span> | <span lang="de">war</span> |
        | 3rd person singular (<span lang="de">er/sie/es</span>) | <span lang="de">hatte</span> | <span lang="de">war</span> |

        **Key observation:** The 1st and 3rd person singular forms are **identical** — no extra ending is added. This is unlike regular verbs, where the 3rd person adds <span lang="de">-t</span>.

        ---

        ### Formation

        **<span lang="de">haben</span> → <span lang="de">hatte</span>**
        The stem changes from <span lang="de">hab-</span> to <span lang="de">hatt-</span>, then the past-tense ending is added. For 1st and 3rd person singular, no personal ending is added (the form ends in <span lang="de">-e</span>).

        **<span lang="de">sein</span> → <span lang="de">war</span>**
        This is a completely irregular form. The entire word changes — there is no recognisable connection to <span lang="de">sein</span> or <span lang="de">ist</span>. You simply need to memorise it.

        ---

        ### Examples

        1. <span lang="de">Ich hatte keine Zeit.</span> — I had no time.
        2. <span lang="de">Sie hatte ein Buch.</span> — She had a book.
        3. <span lang="de">Ich war nicht da.</span> — I was not there.
        4. <span lang="de">Er war sehr müde.</span> — He was very tired.
        5. <span lang="de">Das Kind hatte Hunger.</span> — The child was hungry. (lit. The child had hunger.)
        6. <span lang="de">Es war kalt.</span> — It was cold.

        ---

        ### Negation in the Simple Past

        Negation works the same way as in the present tense:
        - Use <span lang="de">nicht</span> to negate verbs and adjectives.
        - Use <span lang="de">kein/keine</span> to negate nouns.

        <span lang="de">Ich hatte keine Zeit.</span> — I had no time. (noun negated with <span lang="de">keine</span>)
        <span lang="de">Er war nicht da.</span> — He was not there. (adverb negated with <span lang="de">nicht</span>)

        ---

        ### Common Learner Mistakes

        **Mistake 1: Using the present tense instead of <span lang="de">Präteritum</span>**
        - ❌ <span lang="de">Ich bin gestern müde.</span>
        - ✅ <span lang="de">Ich war gestern müde.</span> — I was tired yesterday.

        When describing past states with <span lang="de">sein</span>, always switch to <span lang="de">war</span>, not <span lang="de">bin</span>.

        **Mistake 2: Adding a 3rd-person <span lang="de">-t</span> ending**
        - ❌ <span lang="de">Er hatte-t keine Zeit.</span>
        - ✅ <span lang="de">Er hatte keine Zeit.</span> — He had no time.

        Remember: no extra ending is added for 1st or 3rd person singular.

        **Mistake 3: Confusing <span lang="de">war</span> with <span lang="de">wurde</span>**
        - <span lang="de">war</span> = was (state of being)
        - <span lang="de">wurde</span> = became / was (passive — not needed at A1)

        At A1, only use <span lang="de">war</span>.

        ---

        ### Quick Reference

        | Pronoun | <span lang="de">haben</span> past | <span lang="de">sein</span> past |
        |---|---|---|
        | <span lang="de">ich</span> | <span lang="de">hatte</span> | <span lang="de">war</span> |
        | <span lang="de">er / sie / es</span> | <span lang="de">hatte</span> | <span lang="de">war</span> |

        These two forms — <span lang="de">hatte</span> and <span lang="de">war</span> — are the foundation of talking about the past in German.
      language: en
      why_this_matters: These two verbs appear in almost every sentence about the
        past. Without them you cannot say things like 'I had no time' or 'She was
        not there', and you cannot form past descriptions of states, feelings, or
        conditions.

- code: indicative_mood
  cefr_level: A1
  category: verb
  subcategory: Modus
  label: Indikativ aller Verben der Wortliste
  description: Indicative mood for all verbs in the A1 word list, used for statements
    and questions about real situations.
  examples:
  - Kommst du mit?
  - Wann fängt der Kurs an?
  prerequisites:
  - present_tense
  source_note: Indikativ aller Verben der Wortliste
  explanations:
    en:
      title: The indicative mood
      tip: The indicative is the default mood in German — you use it whenever you
        talk about real things, real actions, or real states. Almost every statement
        and question you make at A1 level is in the indicative. If you are not using
        a special form like Konjunktiv or Imperativ, you are already using it.
      explanation: |-
        ## The Indicative Mood in German

        ### What is a mood?

        In grammar, **mood** (German: <span lang="de">Modus</span>) tells you the speaker's relationship to reality. German has three main moods:

        | Mood | German term | Typical use |
        |------|-------------|-------------|
        | Indicative | <span lang="de">Indikativ</span> | Real facts, statements, questions |
        | Subjunctive II | <span lang="de">Konjunktiv II</span> | Hypotheticals, polite requests |
        | Imperative | <span lang="de">Imperativ</span> | Commands, instructions |

        At A1 level, almost everything you say is in the **indicative**.

        ---

        ### What the indicative does

        The indicative mood is used whenever you:
        - state a fact: <span lang="de">Ich wohne in Berlin.</span> (I live in Berlin.)
        - describe an action: <span lang="de">Sie kauft Brot.</span> (She is buying bread.)
        - ask a real question: <span lang="de">Kommst du mit?</span> (Are you coming along?)
        - talk about the past: <span lang="de">Er hat geschlafen.</span> (He slept / He has slept.)

        The indicative is **not** a tense — it is a label for the mood that runs across all tenses (present, past, perfect, etc.).

        ---

        ### Indicative across A1 tenses

        All three tenses you learn at A1 exist in the indicative:

        #### 1. Present tense (<span lang="de">Präsens</span>)

        The most common tense. Used for present actions, habits, and near-future plans.

        **Regular verb endings (<span lang="de">spielen</span> — to play):**

        | Person | Form | Example |
        |--------|------|---------|
        | <span lang="de">ich</span> | <span lang="de">-e</span> | <span lang="de">ich spiele</span> |
        | <span lang="de">du</span> | <span lang="de">-st</span> | <span lang="de">du spielst</span> |
        | <span lang="de">er/sie/es</span> | <span lang="de">-t</span> | <span lang="de">er spielt</span> |
        | <span lang="de">wir</span> | <span lang="de">-en</span> | <span lang="de">wir spielen</span> |
        | <span lang="de">ihr</span> | <span lang="de">-t</span> | <span lang="de">ihr spielt</span> |
        | <span lang="de">sie/Sie</span> | <span lang="de">-en</span> | <span lang="de">sie spielen</span> |

        #### 2. Perfect tense (<span lang="de">Perfekt</span>)

        Used in spoken German to talk about completed past actions. Formed with a helper verb (<span lang="de">haben</span> or <span lang="de">sein</span>) + past participle (<span lang="de">Partizip II</span>).

        - <span lang="de">Ich habe Kaffee getrunken.</span> (I drank coffee.)
        - <span lang="de">Sie ist nach Hause gegangen.</span> (She went home.)

        #### 3. Simple past (<span lang="de">Präteritum</span>)

        At A1, only <span lang="de">haben</span> and <span lang="de">sein</span> are commonly used in the simple past in everyday speech.

        - <span lang="de">Ich hatte keine Zeit.</span> (I had no time.)
        - <span lang="de">Er war müde.</span> (He was tired.)

        ---

        ### Irregular verbs in the indicative

        Many very common German verbs change their stem vowel in the <span lang="de">du</span> and <span lang="de">er/sie/es</span> forms of the present tense indicative. These are called **strong verbs** (<span lang="de">starke Verben</span>).

        | Infinitive | <span lang="de">ich</span> | <span lang="de">du</span> | <span lang="de">er/sie/es</span> |
        |------------|------|------|------------|
        | <span lang="de">fahren</span> (to drive/go) | <span lang="de">fahre</span> | <span lang="de">fährst</span> | <span lang="de">fährt</span> |
        | <span lang="de">lesen</span> (to read) | <span lang="de">lese</span> | <span lang="de">liest</span> | <span lang="de">liest</span> |
        | <span lang="de">sprechen</span> (to speak) | <span lang="de">spreche</span> | <span lang="de">sprichst</span> | <span lang="de">spricht</span> |
        | <span lang="de">sehen</span> (to see) | <span lang="de">sehe</span> | <span lang="de">siehst</span> | <span lang="de">sieht</span> |

        The key irregular verbs <span lang="de">sein</span> (to be) and <span lang="de">haben</span> (to have) must be memorised:

        **<span lang="de">sein</span>:**

        | Person | Form |
        |--------|------|
        | <span lang="de">ich</span> | <span lang="de">bin</span> |
        | <span lang="de">du</span> | <span lang="de">bist</span> |
        | <span lang="de">er/sie/es</span> | <span lang="de">ist</span> |
        | <span lang="de">wir</span> | <span lang="de">sind</span> |
        | <span lang="de">ihr</span> | <span lang="de">seid</span> |
        | <span lang="de">sie/Sie</span> | <span lang="de">sind</span> |

        **<span lang="de">haben</span>:**

        | Person | Form |
        |--------|------|
        | <span lang="de">ich</span> | <span lang="de">habe</span> |
        | <span lang="de">du</span> | <span lang="de">hast</span> |
        | <span lang="de">er/sie/es</span> | <span lang="de">hat</span> |
        | <span lang="de">wir</span> | <span lang="de">haben</span> |
        | <span lang="de">ihr</span> | <span lang="de">habt</span> |
        | <span lang="de">sie/Sie</span> | <span lang="de">haben</span> |

        ---

        ### Examples

        1. <span lang="de">Ich lerne Deutsch.</span> — I am learning German. *(present indicative, regular verb)*
        2. <span lang="de">Wann fängt der Kurs an?</span> — When does the course start? *(present indicative, irregular strong verb, separable)*
        3. <span lang="de">Sie hat gestern gearbeitet.</span> — She worked yesterday. *(perfect indicative)*
        4. <span lang="de">Das Kind ist krank.</span> — The child is sick. *(present indicative, sein)*
        5. <span lang="de">Wir waren zu Hause.</span> — We were at home. *(simple past indicative, sein)*
        6. <span lang="de">Er hat ein Auto.</span> — He has a car. *(present indicative, haben)*

        ---

        ### Common learner mistakes

        **Mistake 1:** Forgetting the vowel change in strong verbs.
        - ✗ <span lang="de">Er lesst das Buch.</span>
        - ✓ <span lang="de">Er liest das Buch.</span> (He reads the book.)

        **Mistake 2:** Using the wrong form of <span lang="de">sein</span>.
        - ✗ <span lang="de">Ich ist müde.</span>
        - ✓ <span lang="de">Ich bin müde.</span> (I am tired.)

        **Mistake 3:** Confusing <span lang="de">haben</span> and <span lang="de">sein</span> as helpers in the perfect tense.
        - ✗ <span lang="de">Ich habe nach Hause gegangen.</span>
        - ✓ <span lang="de">Ich bin nach Hause gegangen.</span> (I went home.) — verbs of movement or change of state take <span lang="de">sein</span>.

        ---

        ### Quick summary

        The indicative is not something you have to 'activate' — it is simply the normal mode of German verb forms. Every verb form you learn for real statements or questions is automatically indicative. Focus on learning correct verb endings, irregular stems, and when to use <span lang="de">haben</span> versus <span lang="de">sein</span>, and you are already mastering the indicative.
      language: en
      why_this_matters: The indicative covers every tense you need at A1 — present,
        simple past, and perfect — so understanding it as a concept ties all your
        verb learning together. Without it you cannot describe your day, ask basic
        questions, or say where you live. It is the foundation of almost every German
        sentence you will ever produce.

- code: konjunktiv2_moegen_w
  cefr_level: A1
  category: verb
  subcategory: Modus
  label: Konjunktiv II mögen/werden
  description: Konjunktiv II forms of mögen (möchte) and werden (würde), used as lexical
    items for polite requests and wishes.
  examples:
  - Ich möchte mehr Deutsch lernen.
  - Ich würde gerne ins Kino gehen.
  prerequisites:
  - ich_moechte
  source_note: Konjunktiv II der Verben mögen und werden; treated as lexical units,
    not systematically
  explanations:
    en:
      title: Polite wishes with möchte and würde
      tip: German uses two special verb forms — <span lang="de">möchte</span> and
        <span lang="de">würde</span> — to make polite requests and express wishes.
        Think of them as the German equivalents of 'would like' and 'would'. They
        are learned as fixed vocabulary items at this level, not built from a grammar
        rule.
      explanation: |-
        ## Polite wishes with <span lang="de">möchte</span> and <span lang="de">würde</span>

        ### What are these forms?

        <span lang="de">Möchte</span> and <span lang="de">würde</span> are Konjunktiv II (subjunctive mood) forms, but at A1 level you treat them as **vocabulary items** — ready-made, polite verb forms you learn and use directly, the same way English speakers just learn 'would like' without analysing it.

        - <span lang="de">möchte</span> = 'would like' (a polite wish or desire)
        - <span lang="de">würde</span> = 'would' (a polite offer, suggestion, or hypothetical action)

        ---

        ### <span lang="de">möchte</span> — 'would like'

        <span lang="de">Möchte</span> is the Konjunktiv II of the modal verb <span lang="de">mögen</span> (to like). In everyday use it expresses a polite wish or desire, especially in shops, restaurants, and service situations.

        #### Full paradigm of <span lang="de">möchte</span>

        | Person | Form |
        |---|---|
        | <span lang="de">ich</span> | <span lang="de">möchte</span> |
        | <span lang="de">du</span> | <span lang="de">möchtest</span> |
        | <span lang="de">er/sie/es</span> | <span lang="de">möchte</span> |
        | <span lang="de">wir</span> | <span lang="de">möchten</span> |
        | <span lang="de">ihr</span> | <span lang="de">möchtet</span> |
        | <span lang="de">sie/Sie</span> | <span lang="de">möchten</span> |

        > **Key feature:** Like all modal verbs, <span lang="de">möchte</span> sends a second verb (the main action) to the **end of the sentence** in its infinitive form. This is the Satzklammer (sentence bracket) pattern.

        #### Formation

        <span lang="de">Subjekt + möchte + (other elements) + Infinitiv</span>

        #### Examples with <span lang="de">möchte</span>

        1. <span lang="de">Ich möchte einen Kaffee.</span> — 'I would like a coffee.' *(no second verb needed when the object is a noun)*
        2. <span lang="de">Ich möchte mehr Deutsch lernen.</span> — 'I would like to learn more German.'
        3. <span lang="de">Sie möchte ins Restaurant gehen.</span> — 'She would like to go to the restaurant.'
        4. <span lang="de">Wir möchten ein Zimmer buchen.</span> — 'We would like to book a room.'

        ---

        ### <span lang="de">würde</span> — 'would'

        <span lang="de">Würde</span> is the Konjunktiv II of <span lang="de">werden</span> (to become / will). It is used to express polite offers, suggestions, and hypothetical actions — wherever English uses 'would + verb'.

        #### Full paradigm of <span lang="de">würde</span>

        | Person | Form |
        |---|---|
        | <span lang="de">ich</span> | <span lang="de">würde</span> |
        | <span lang="de">du</span> | <span lang="de">würdest</span> |
        | <span lang="de">er/sie/es</span> | <span lang="de">würde</span> |
        | <span lang="de">wir</span> | <span lang="de">würden</span> |
        | <span lang="de">ihr</span> | <span lang="de">würdet</span> |
        | <span lang="de">sie/Sie</span> | <span lang="de">würden</span> |

        > **Key feature:** <span lang="de">Würde</span> always works together with an infinitive, which goes to the **end of the sentence**.

        #### Formation

        <span lang="de">Subjekt + würde + (other elements) + Infinitiv</span>

        #### Examples with <span lang="de">würde</span>

        1. <span lang="de">Ich würde gerne ins Kino gehen.</span> — 'I would like to go to the cinema.'
        2. <span lang="de">Würden Sie mir bitte helfen?</span> — 'Would you please help me?'
        3. <span lang="de">Er würde gerne mehr schlafen.</span> — 'He would like to sleep more.'
        4. <span lang="de">Was würdest du trinken?</span> — 'What would you drink?'

        ---

        ### The adverb <span lang="de">gerne</span>

        The word <span lang="de">gerne</span> (gladly / with pleasure) is very often added to <span lang="de">würde</span> constructions to make them sound warmer and more natural. It sits before the infinitive or after the verb.

        - <span lang="de">Ich würde gerne kommen.</span> — 'I would gladly come / I'd love to come.'
        - <span lang="de">Ich möchte gerne einen Tee.</span> — 'I would really like a tea.'

        ---

        ### <span lang="de">möchte</span> vs. <span lang="de">würde</span> — when to use which?

        | Situation | Use | Example |
        |---|---|---|
        | Expressing a desire / wish for something | <span lang="de">möchte</span> | <span lang="de">Ich möchte ein Wasser.</span> |
        | Polite request for an action | <span lang="de">möchte + Infinitiv</span> | <span lang="de">Ich möchte bezahlen.</span> |
        | Hypothetical / conditional action | <span lang="de">würde + Infinitiv</span> | <span lang="de">Ich würde gerne kommen.</span> |
        | Polite question or offer | <span lang="de">würde + Infinitiv</span> | <span lang="de">Würden Sie bitte warten?</span> |

        In many everyday situations the two are interchangeable for expressing polite wishes.

        ---

        ### Word order reminder (Satzklammer)

        Both <span lang="de">möchte</span> and <span lang="de">würde</span> occupy **position 2** in a statement, and the infinitive goes to the **end**. This creates a bracket around the middle of the sentence.

        <span lang="de">Ich **möchte** morgen ins Museum **gehen**.</span>

        ('I would like to go to the museum tomorrow.')

        <span lang="de">Er **würde** gerne mehr Sport **machen**.</span>

        ('He would like to do more sport.')

        In a yes/no question, the verb moves to **position 1**:

        <span lang="de">**Möchten** Sie einen Kaffee **trinken**?</span>

        ('Would you like to drink a coffee?')

        ---

        ### Common learner mistakes

        **1. Forgetting the infinitive at the end**

        ❌ <span lang="de">Ich möchte ins Kino.</span> *(acceptable only when the verb is obvious from context — better to include it)*
        ✅ <span lang="de">Ich möchte ins Kino gehen.</span>

        **2. Putting the infinitive in position 2 instead of at the end**

        ❌ <span lang="de">Ich würde gehen gerne ins Kino.</span>
        ✅ <span lang="de">Ich würde gerne ins Kino gehen.</span>

        **3. Confusing <span lang="de">möchte</span> with <span lang="de">mag</span>**

        <span lang="de">Mag</span> is the indicative present of <span lang="de">mögen</span> and means 'to like (something)' in a general sense. <span lang="de">Möchte</span> means 'would like' and is used for requests and polite wishes.

        ❌ <span lang="de">Ich mag einen Kaffee, bitte.</span> *(sounds unnatural for ordering)*
        ✅ <span lang="de">Ich möchte einen Kaffee, bitte.</span>

        **4. Using the wrong ending for <span lang="de">er/sie/es</span>**

        Note that <span lang="de">er möchte</span> has **no extra -t** (unlike regular verbs like <span lang="de">er kommt</span>). This is normal for Konjunktiv II and for modal verbs.

        ❌ <span lang="de">Er möchtet ein Wasser.</span>
        ✅ <span lang="de">Er möchte ein Wasser.</span>
      language: en
      why_this_matters: You will need <span lang="de">möchte</span> and <span lang="de">würde</span>
        in almost every real-life situation — ordering food, asking for help, or saying
        what you want to do. Without them your requests will sound blunt or rude,
        so mastering these forms early makes a huge practical difference.

- code: imperative
  cefr_level: A1
  category: verb
  subcategory: Modus
  label: Imperativ du-, ihr- und Sie-Form
  description: Imperative forms of verbs in the du, ihr, and Sie address forms, used
    for instructions and requests.
  examples:
  - Geh bitte nach Hause!
  - Kommt bitte alle mit!
  - Kommen Sie bitte mit!
  - Mach bitte das Fenster zu!
  prerequisites:
  - present_tense
  source_note: Imperativ in der du-, ihr- und Sie-Form
  explanations:
    en:
      title: Giving commands and requests
      tip: 'German has three imperative forms depending on who you are talking to:
        one for a single person you know well (du), one for a group you know well
        (ihr), and one for formal address (Sie). Each form is built differently from
        the verb stem.'
      explanation: |-
        ## The German Imperative

        The <span lang="de">Imperativ</span> (imperative mood) is used to give commands, instructions, requests, and invitations. German has three imperative forms, one for each way of addressing people.

        ---

        ### The three address forms at a glance

        | Who you are talking to | German address | Example |
        |---|---|---|
        | One person, informal | <span lang="de">du</span> | <span lang="de">Komm!</span> *(Come!)* |
        | Several people, informal | <span lang="de">ihr</span> | <span lang="de">Kommt!</span> *(Come!)* |
        | One or more people, formal | <span lang="de">Sie</span> | <span lang="de">Kommen Sie!</span> *(Come!)* |

        ---

        ### Formation

        #### 1. <span lang="de">du</span>-form (one person, informal)

        Take the infinitive, remove <span lang="de">-en</span>, and use the bare stem. An exclamation mark is usual but not required.

        > Stem of <span lang="de">kommen</span> → <span lang="de">komm</span> → **<span lang="de">Komm!</span>**

        An optional <span lang="de">-e</span> ending can be added and sounds slightly more formal or old-fashioned:

        > <span lang="de">Komme!</span> / <span lang="de">Gehe!</span>

        **Important exception — stem-vowel change (e → i/ie):** Verbs that change their stem vowel from <span lang="de">e</span> to <span lang="de">i</span> or <span lang="de">ie</span> in the second and third person singular present tense *keep that changed vowel* in the <span lang="de">du</span>-imperative, and *never* add <span lang="de">-e</span>.

        | Infinitive | Present <span lang="de">du</span>-form | Imperative |
        |---|---|---|
        | <span lang="de">geben</span> *(to give)* | <span lang="de">du gibst</span> | <span lang="de">Gib!</span> |
        | <span lang="de">sprechen</span> *(to speak)* | <span lang="de">du sprichst</span> | <span lang="de">Sprich!</span> |
        | <span lang="de">lesen</span> *(to read)* | <span lang="de">du liest</span> | <span lang="de">Lies!</span> |
        | <span lang="de">nehmen</span> *(to take)* | <span lang="de">du nimmst</span> | <span lang="de">Nimm!</span> |

        Verbs that change <span lang="de">a → ä</span> (e.g. <span lang="de">fahren</span>) do **not** carry the umlaut into the imperative:

        > <span lang="de">fahren</span> → <span lang="de">Fahr!</span> *(not <span lang="de">Fähr!</span>)*

        ---

        #### 2. <span lang="de">ihr</span>-form (several people, informal)

        This is identical to the regular present-tense <span lang="de">ihr</span> form — just leave out the pronoun <span lang="de">ihr</span>.

        > <span lang="de">ihr kommt</span> → **<span lang="de">Kommt!</span>**

        | Infinitive | Present <span lang="de">ihr</span>-form | Imperative |
        |---|---|---|
        | <span lang="de">kommen</span> | <span lang="de">ihr kommt</span> | <span lang="de">Kommt!</span> |
        | <span lang="de">machen</span> | <span lang="de">ihr macht</span> | <span lang="de">Macht!</span> |
        | <span lang="de">gehen</span> | <span lang="de">ihr geht</span> | <span lang="de">Geht!</span> |

        ---

        #### 3. <span lang="de">Sie</span>-form (formal, singular or plural)

        Use the infinitive and keep the pronoun <span lang="de">Sie</span> immediately after the verb. The capital <span lang="de">S</span> is always written.

        > **<span lang="de">Kommen Sie!</span>** *(Come!)*

        | Infinitive | Imperative |
        |---|---|
        | <span lang="de">kommen</span> | <span lang="de">Kommen Sie!</span> |
        | <span lang="de">machen</span> | <span lang="de">Machen Sie!</span> |
        | <span lang="de">gehen</span> | <span lang="de">Gehen Sie!</span> |

        Note: this is the only imperative form where the pronoun stays in.

        ---

        ### Irregular verbs: <span lang="de">sein</span> and <span lang="de">haben</span>

        These two very common verbs are irregular.

        | | <span lang="de">sein</span> *(to be)* | <span lang="de">haben</span> *(to have)* |
        |---|---|---|
        | <span lang="de">du</span> | <span lang="de">Sei!</span> | <span lang="de">Hab(e)!</span> |
        | <span lang="de">ihr</span> | <span lang="de">Seid!</span> | <span lang="de">Habt!</span> |
        | <span lang="de">Sie</span> | <span lang="de">Seien Sie!</span> | <span lang="de">Haben Sie!</span> |

        ---

        ### Separable verbs

        With <span lang="de">trennbare Verben</span> (separable verbs), the prefix splits off and moves to the end, just as in a normal sentence.

        > <span lang="de">aufmachen</span> → <span lang="de">**Mach** das Fenster **auf**!</span> *(Open the window!)*
        > <span lang="de">mitkommen</span> → <span lang="de">**Kommen** Sie **mit**!</span> *(Come along!)*

        ---

        ### Softening a command with <span lang="de">bitte</span>

        Adding <span lang="de">bitte</span> *(please)* makes any imperative more polite. It can appear at the start, middle, or end of the sentence.

        > <span lang="de">Geh bitte nach Hause!</span> *(Please go home!)*
        > <span lang="de">Bitte kommen Sie herein!</span> *(Please come in!)*

        ---

        ### Examples with translations

        1. <span lang="de">Mach bitte das Fenster zu!</span> — *Please close the window!* (<span lang="de">du</span>-form)
        2. <span lang="de">Geh nach Hause!</span> — *Go home!* (<span lang="de">du</span>-form)
        3. <span lang="de">Kommt bitte alle mit!</span> — *Please all come along!* (<span lang="de">ihr</span>-form)
        4. <span lang="de">Wartet hier!</span> — *Wait here!* (<span lang="de">ihr</span>-form)
        5. <span lang="de">Kommen Sie bitte mit!</span> — *Please come along!* (<span lang="de">Sie</span>-form)
        6. <span lang="de">Sprechen Sie bitte langsam!</span> — *Please speak slowly!* (<span lang="de">Sie</span>-form)

        ---

        ### Common learner mistakes

        **1. Keeping the pronoun in the <span lang="de">du</span>- or <span lang="de">ihr</span>-form**

        > ❌ <span lang="de">Du komm hier!</span>
        > ✅ <span lang="de">Komm hier!</span>

        The pronouns <span lang="de">du</span> and <span lang="de">ihr</span> are dropped. Only <span lang="de">Sie</span> stays.

        **2. Forgetting the stem-vowel change**

        > ❌ <span lang="de">Gebe mir das Buch!</span>
        > ✅ <span lang="de">Gib mir das Buch!</span>

        When the present tense <span lang="de">du</span>-form has <span lang="de">e → i/ie</span>, the imperative must too.

        **3. Wrong word order with <span lang="de">Sie</span>**

        > ❌ <span lang="de">Sie kommen bitte!</span> (This sounds like a statement, not a command.)
        > ✅ <span lang="de">Kommen Sie bitte!</span>

        The verb must come first in the <span lang="de">Sie</span>-imperative.

        **4. Adding <span lang="de">-e</span> to a stem-change verb**

        > ❌ <span lang="de">Giebe!</span>
        > ✅ <span lang="de">Gib!</span>

        Verbs with <span lang="de">e → i/ie</span> never add <span lang="de">-e</span> in the <span lang="de">du</span>-imperative.
      language: en
      why_this_matters: You will need the imperative every time you give an instruction,
        make a request, or follow directions — in recipes, signs, classroom language,
        and everyday conversation. Without it, you cannot tell someone to sit down,
        come along, or open a window.

- code: modal_verbs_present
  cefr_level: A1
  category: verb
  subcategory: Modalverben
  label: Modalverben im Präsens
  description: 'Present tense of all six modal verbs: können, wollen, müssen, dürfen,
    sollen, möchten, expressing ability, desire, necessity, permission, obligation,
    and polite requests.'
  examples:
  - Kannst du Gitarre spielen?
  - Er will eine Ausbildung als Schreiner machen.
  - Du musst zuerst die Hausaufgaben machen.
  - Sie dürfen hier nicht rauchen.
  - Was soll ich machen?
  - Möchtest du eine Tasse Tee?
  prerequisites:
  - present_tense
  source_note: Präsens von können, wollen, müssen, dürfen, sollen, möchten
  explanations:
    en:
      title: Modal verbs in the present tense
      tip: Modal verbs express ability, desire, necessity, permission, and obligation.
        They follow special conjugation patterns and push the main verb to the end
        of the sentence as an infinitive.
      explanation: |-
        ## Modal verbs in the present tense

        ### What are modal verbs?

        German has six modal verbs. Each one adds a meaning — ability, desire, necessity, permission, obligation, or polite request — to another verb. The modal verb is conjugated and placed in second position; the main verb stays as an infinitive at the end of the sentence. This creates the <span lang="de">Satzklammer</span> (sentence bracket), a key feature of German word order.

        **Pattern:** <span lang="de">Subjekt + Modalverb (konjugiert) + … + Infinitiv</span>

        > <span lang="de">Ich kann Gitarre spielen.</span> — I can play guitar.

        ---

        ### The six modal verbs and their meanings

        | German | Meaning |
        |---|---|
        | <span lang="de">können</span> | can / to be able to |
        | <span lang="de">wollen</span> | to want to |
        | <span lang="de">müssen</span> | must / to have to |
        | <span lang="de">dürfen</span> | may / to be allowed to |
        | <span lang="de">sollen</span> | should / to be supposed to |
        | <span lang="de">möchten</span> | would like to |

        ---

        ### Conjugation tables

        All modal verbs except <span lang="de">möchten</span> share one key pattern: the **1st and 3rd person singular forms are identical**, and they often have a **vowel change** in the singular compared to the infinitive.

        #### <span lang="de">können</span> (can, to be able to)

        | Person | Form |
        |---|---|
        | <span lang="de">ich</span> | <span lang="de">kann</span> |
        | <span lang="de">du</span> | <span lang="de">kannst</span> |
        | <span lang="de">er/sie/es</span> | <span lang="de">kann</span> |
        | <span lang="de">wir</span> | <span lang="de">können</span> |
        | <span lang="de">ihr</span> | <span lang="de">könnt</span> |
        | <span lang="de">sie/Sie</span> | <span lang="de">können</span> |

        #### <span lang="de">wollen</span> (to want to)

        | Person | Form |
        |---|---|
        | <span lang="de">ich</span> | <span lang="de">will</span> |
        | <span lang="de">du</span> | <span lang="de">willst</span> |
        | <span lang="de">er/sie/es</span> | <span lang="de">will</span> |
        | <span lang="de">wir</span> | <span lang="de">wollen</span> |
        | <span lang="de">ihr</span> | <span lang="de">wollt</span> |
        | <span lang="de">sie/Sie</span> | <span lang="de">wollen</span> |

        #### <span lang="de">müssen</span> (must, to have to)

        | Person | Form |
        |---|---|
        | <span lang="de">ich</span> | <span lang="de">muss</span> |
        | <span lang="de">du</span> | <span lang="de">musst</span> |
        | <span lang="de">er/sie/es</span> | <span lang="de">muss</span> |
        | <span lang="de">wir</span> | <span lang="de">müssen</span> |
        | <span lang="de">ihr</span> | <span lang="de">müsst</span> |
        | <span lang="de">sie/Sie</span> | <span lang="de">müssen</span> |

        #### <span lang="de">dürfen</span> (may, to be allowed to)

        | Person | Form |
        |---|---|
        | <span lang="de">ich</span> | <span lang="de">darf</span> |
        | <span lang="de">du</span> | <span lang="de">darfst</span> |
        | <span lang="de">er/sie/es</span> | <span lang="de">darf</span> |
        | <span lang="de">wir</span> | <span lang="de">dürfen</span> |
        | <span lang="de">ihr</span> | <span lang="de">dürft</span> |
        | <span lang="de">sie/Sie</span> | <span lang="de">dürfen</span> |

        #### <span lang="de">sollen</span> (should, to be supposed to)

        | Person | Form |
        |---|---|
        | <span lang="de">ich</span> | <span lang="de">soll</span> |
        | <span lang="de">du</span> | <span lang="de">sollst</span> |
        | <span lang="de">er/sie/es</span> | <span lang="de">soll</span> |
        | <span lang="de">wir</span> | <span lang="de">sollen</span> |
        | <span lang="de">ihr</span> | <span lang="de">sollt</span> |
        | <span lang="de">sie/Sie</span> | <span lang="de">sollen</span> |

        #### <span lang="de">möchten</span> (would like to)

        <span lang="de">Möchten</span> is technically the <span lang="de">Konjunktiv II</span> (subjunctive II) form of <span lang="de">mögen</span>, but at A1 level it is best treated as an independent modal verb. It has **no vowel change** and the 1st and 3rd person singular are the same, with **no ending in the singular**.

        | Person | Form |
        |---|---|
        | <span lang="de">ich</span> | <span lang="de">möchte</span> |
        | <span lang="de">du</span> | <span lang="de">möchtest</span> |
        | <span lang="de">er/sie/es</span> | <span lang="de">möchte</span> |
        | <span lang="de">wir</span> | <span lang="de">möchten</span> |
        | <span lang="de">ihr</span> | <span lang="de">möchtet</span> |
        | <span lang="de">sie/Sie</span> | <span lang="de">möchten</span> |

        ---

        ### Word order: the sentence bracket

        When a modal verb is used with another verb, the main verb goes to the **end of the sentence as an infinitive**. The modal verb stays in position 2.

        > <span lang="de">Ich **will** eine Ausbildung als Schreiner **machen**.</span> — I want to do an apprenticeship as a carpenter.

        > <span lang="de">Du **musst** zuerst die Hausaufgaben **machen**.</span> — You must do your homework first.

        > <span lang="de">Sie **dürfen** hier nicht rauchen.</span> — You are not allowed to smoke here.

        In a **yes/no question**, the modal verb moves to position 1:

        > <span lang="de">**Kannst** du Gitarre **spielen**?</span> — Can you play guitar?

        > <span lang="de">**Möchtest** du eine Tasse Tee?</span> — Would you like a cup of tea?

        In a **wh-question**, the question word is position 1 and the modal verb stays in position 2:

        > <span lang="de">Was **soll** ich **machen**?</span> — What am I supposed to do?

        ---

        ### Using a modal verb without a main verb

        Sometimes the main verb is left out when it is obvious from context. This is common with verbs of motion or with <span lang="de">möchten</span>.

        > <span lang="de">Ich möchte einen Kaffee.</span> — I would like a coffee. (no infinitive needed)

        > <span lang="de">Ich muss jetzt nach Hause.</span> — I have to go home now. (the verb 'go' is implied)

        ---

        ### Common learner mistakes

        **1. Forgetting to send the main verb to the end**

        - ✗ <span lang="de">Ich kann spielen Gitarre.</span>
        - ✓ <span lang="de">Ich kann Gitarre spielen.</span>

        **2. Conjugating the main verb instead of the modal**

        - ✗ <span lang="de">Ich kann spielst Gitarre.</span>
        - ✓ <span lang="de">Ich kann Gitarre spielen.</span> (main verb stays in the infinitive)

        **3. Using the wrong form for <span lang="de">wollen</span> — confusing it with English 'will'**

        <span lang="de">Wollen</span> expresses *wanting*, not future tense. <span lang="de">Ich will</span> means 'I want to', not 'I will'.

        - ✗ Using <span lang="de">ich will kommen</span> to mean 'I will come' (as a future promise)
        - ✓ <span lang="de">Ich will kommen</span> means 'I want to come'

        **4. Adding an extra ending to the <span lang="de">ich</span> form**

        Modal verbs have **no <span lang="de">-e</span> ending** in the 1st person singular.

        - ✗ <span lang="de">Ich kanne Deutsch sprechen.</span>
        - ✓ <span lang="de">Ich kann Deutsch sprechen.</span>

        ---

        ### Quick meaning summary

        > <span lang="de">Ich **kann** schwimmen.</span> — I can swim. *(ability)*

        > <span lang="de">Ich **will** schwimmen.</span> — I want to swim. *(desire)*

        > <span lang="de">Ich **muss** schwimmen.</span> — I must swim. *(necessity)*

        > <span lang="de">Ich **darf** hier schwimmen.</span> — I am allowed to swim here. *(permission)*

        > <span lang="de">Ich **soll** schwimmen.</span> — I am supposed to swim. *(obligation from outside)*

        > <span lang="de">Ich **möchte** schwimmen.</span> — I would like to swim. *(polite wish)*
      language: en
      why_this_matters: Modal verbs appear in almost every German conversation — you
        need them to say what you can do, what you want, or what you must do. Without
        them, you cannot express nuance, make polite requests, or talk about rules
        and permissions.

- code: separable_verbs
  cefr_level: A1
  category: verb
  subcategory: Verben mit trennbarem Präfix
  label: Verben mit trennbarem Präfix
  description: Verbs with separable prefixes where the prefix is split off and placed
    at the end of the main clause.
  examples:
  - Wann fängt der Kurs an?
  - Wo kaufst du gerne ein?
  - Mach bitte das Fenster zu!
  - Der Unterricht fängt um 9 Uhr an.
  prerequisites:
  - present_tense
  source_note: Verben mit trennbarem Präfix
  explanations:
    en:
      title: 'Separable verbs: splitting the prefix'
      tip: Some German verbs have a detachable prefix that jumps to the very end of
        the sentence in the present tense. The base verb still sits in its normal
        second position — only the prefix moves.
      explanation: |-
        ## Separable Verbs in German

        ### What is a separable verb?

        A <span lang="de">trennbares Verb</span> (separable verb) is a verb made up of a **base verb** plus a **prefix** that can be detached. In a normal main-clause statement or question, the conjugated base verb stays in its usual position (position 2 in a statement), while the **prefix moves to the very end** of the clause. The two parts together form what is called the <span lang="de">Satzklammer</span> (sentence bracket) — they 'bracket' the rest of the sentence.

        ---

        ### Common separable prefixes

        The most frequent separable prefixes at A1 level are:

        | Prefix | Example verb | Meaning |
        |---|---|---|
        | <span lang="de">an-</span> | <span lang="de">anfangen</span> | to begin |
        | <span lang="de">auf-</span> | <span lang="de">aufmachen</span> | to open |
        | <span lang="de">aus-</span> | <span lang="de">ausgehen</span> | to go out |
        | <span lang="de">ein-</span> | <span lang="de">einkaufen</span> | to shop |
        | <span lang="de">mit-</span> | <span lang="de">mitkommen</span> | to come along |
        | <span lang="de">zu-</span> | <span lang="de">zumachen</span> | to close |
        | <span lang="de">ab-</span> | <span lang="de">abfahren</span> | to depart |
        | <span lang="de">an-</span> | <span lang="de">ankommen</span> | to arrive |
        | <span lang="de">vor-</span> | <span lang="de">vorstellen</span> | to introduce |
        | <span lang="de">zurück-</span> | <span lang="de">zurückkommen</span> | to come back |

        ---

        ### Formation in the present tense

        **Step 1:** Conjugate the base verb normally and place it in position 2.
        **Step 2:** Send the prefix to the very end of the clause.

        > <span lang="de">anfangen</span> → base verb <span lang="de">fängt</span> (position 2) + prefix <span lang="de">an</span> (end)

        **Pattern:**

        > Subject + [other words] + **conjugated base verb** + [rest of sentence] + **prefix**

        ---

        ### Examples with translations

        1. <span lang="de">Der Kurs **fängt** um 9 Uhr **an**.</span>
           — The course begins at 9 o'clock.

        2. <span lang="de">Ich **kaufe** heute im Supermarkt **ein**.</span>
           — I am shopping at the supermarket today.

        3. <span lang="de">**Machst** du das Fenster **auf**?</span>
           — Are you opening the window?

        4. <span lang="de">Wann **kommt** der Zug **an**?</span>
           — When does the train arrive?

        5. <span lang="de">Sie **geht** jeden Abend **aus**.</span>
           — She goes out every evening.

        6. <span lang="de">Wir **kommen** morgen **zurück**.</span>
           — We are coming back tomorrow.

        ---

        ### In questions

        In yes/no questions, the conjugated verb moves to position 1, but the prefix **still goes to the end**:

        > <span lang="de">**Fängst** du jetzt **an**?</span> — Are you starting now?

        In questions with a question word (<span lang="de">Ergänzungsfragen</span>), the question word takes position 1, the verb takes position 2, and the prefix goes to the end:

        > <span lang="de">Wann **fährt** der Bus **ab**?</span> — When does the bus depart?

        ---

        ### In imperative sentences

        In commands, the base verb comes first and the prefix goes to the end:

        > <span lang="de">**Mach** bitte das Fenster **zu**!</span> — Please close the window!
        > <span lang="de">**Kommen** Sie bitte **mit**!</span> — Please come along!

        ---

        ### The infinitive and dictionary form

        In dictionaries and word lists, separable verbs are written as **one word** with the prefix attached:
        <span lang="de">anfangen, einkaufen, zumachen, ausgehen</span>.

        When the infinitive is used after a modal verb (e.g. <span lang="de">müssen, können, wollen</span>), the verb is **not separated** — it stays as one word at the end:

        > <span lang="de">Ich muss jetzt **einkaufen**.</span> — I have to go shopping now.
        > <span lang="de">Kannst du das Fenster **aufmachen**?</span> — Can you open the window?

        ---

        ### Past participle (<span lang="de">Partizip II</span>)

        The <span lang="de">ge-</span> of the past participle is inserted **between** the prefix and the base verb:

        | Infinitive | Past participle |
        |---|---|
        | <span lang="de">anfangen</span> | <span lang="de">ange**fangen**</span> |
        | <span lang="de">einkaufen</span> | <span lang="de">ein**ge**kauft</span> |
        | <span lang="de">ausgehen</span> | <span lang="de">aus**ge**gangen</span> |
        | <span lang="de">ankommen</span> | <span lang="de">an**ge**kommen</span> |

        > <span lang="de">Ich habe heute **eingekauft**.</span> — I went shopping today.

        ---

        ### Common learner mistakes

        **Mistake 1: Keeping the prefix attached to the verb**

        ❌ <span lang="de">Ich anfange jetzt.</span>
        ✅ <span lang="de">Ich fange jetzt an.</span>

        **Mistake 2: Putting the prefix in the middle of the sentence**

        ❌ <span lang="de">Ich fange an jetzt.</span>
        ✅ <span lang="de">Ich fange jetzt an.</span>

        **Mistake 3: Separating the verb when using a modal**

        ❌ <span lang="de">Ich muss jetzt fange an.</span>
        ✅ <span lang="de">Ich muss jetzt anfangen.</span>

        **Mistake 4: Incorrect past participle — forgetting to insert <span lang="de">-ge-</span>**

        ❌ <span lang="de">Ich habe angefangt.</span>
        ✅ <span lang="de">Ich habe angefangen.</span>

        ---

        ### Quick reference: present tense of <span lang="de">anfangen</span>

        | Person | Form | Example |
        |---|---|---|
        | <span lang="de">ich</span> | <span lang="de">fange … an</span> | <span lang="de">Ich fange an.</span> |
        | <span lang="de">du</span> | <span lang="de">fängst … an</span> | <span lang="de">Du fängst an.</span> |
        | <span lang="de">er/sie/es</span> | <span lang="de">fängt … an</span> | <span lang="de">Er fängt an.</span> |
        | <span lang="de">wir</span> | <span lang="de">fangen … an</span> | <span lang="de">Wir fangen an.</span> |
        | <span lang="de">ihr</span> | <span lang="de">fangt … an</span> | <span lang="de">Ihr fangt an.</span> |
        | <span lang="de">sie/Sie</span> | <span lang="de">fangen … an</span> | <span lang="de">Sie fangen an.</span> |
      language: en
      why_this_matters: Separable verbs are everywhere in everyday German — shopping,
        arriving, starting, opening, and hundreds more everyday actions use them.
        If you don't move the prefix to the end, your sentence will sound incomplete
        or confusing to a native speaker.

- code: noun_gender
  cefr_level: A1
  category: nomen
  subcategory: Genus
  label: 'Genus der Nomen: der/die/das'
  description: Grammatical gender of nouns (masculine, feminine, neuter) as listed
    in the word list.
  examples:
  - der Apfel/die Sonne/das Kind
  source_note: 'Genus: der/die/das'
  explanations:
    en:
      title: 'Noun gender: der, die, das'
      tip: 'Every German noun has a grammatical gender: masculine (der), feminine
        (die), or neuter (das). Gender is not always logical — you must learn each
        noun together with its article as one unit.'
      explanation: |-
        ## Noun Gender in German

        ### What is grammatical gender?

        Every German noun belongs to one of three grammatical genders:

        | Gender | Article | Example |
        |--------|---------|------------------|
        | Masculine | <span lang="de">der</span> | <span lang="de">der Apfel</span> (the apple) |
        | Feminine | <span lang="de">die</span> | <span lang="de">die Sonne</span> (the sun) |
        | Neuter | <span lang="de">das</span> | <span lang="de">das Kind</span> (the child) |

        Grammatical gender is not the same as natural gender. <span lang="de">das Mädchen</span> (the girl) is grammatically neuter, even though it refers to a female person.

        ---

        ### The golden rule

        **Always learn every noun together with its definite article.** Do not memorise <span lang="de">Apfel</span> — memorise <span lang="de">der Apfel</span>. This habit will protect you as you advance to cases, adjective endings, and pronouns.

        ---

        ### Helpful gender patterns

        While there are exceptions, several endings and categories are strongly associated with a particular gender.

        #### Masculine — <span lang="de">der</span>

        - **Male people and animals:** <span lang="de">der Mann</span> (the man), <span lang="de">der Hund</span> (the dog — male)
        - **Nouns ending in <span lang="de">-er</span> (agent nouns):** <span lang="de">der Lehrer</span> (the teacher), <span lang="de">der Bäcker</span> (the baker)
        - **Days, months, seasons:** <span lang="de">der Montag</span> (Monday), <span lang="de">der Januar</span> (January), <span lang="de">der Winter</span> (winter)
        - **Nouns ending in <span lang="de">-ig, -ling, -ismus</span>:** <span lang="de">der Honig</span> (honey), <span lang="de">der Frühling</span> (spring)

        #### Feminine — <span lang="de">die</span>

        - **Female people and animals:** <span lang="de">die Frau</span> (the woman), <span lang="de">die Katze</span> (the cat — female)
        - **Nouns ending in <span lang="de">-ung</span>:** <span lang="de">die Wohnung</span> (the flat/apartment), <span lang="de">die Zeitung</span> (the newspaper)
        - **Nouns ending in <span lang="de">-heit, -keit, -schaft, -tion, -ität</span>:** <span lang="de">die Freiheit</span> (freedom), <span lang="de">die Freundschaft</span> (friendship), <span lang="de">die Station</span> (the station)
        - **Nouns ending in <span lang="de">-e</span> (many, not all):** <span lang="de">die Sonne</span> (the sun), <span lang="de">die Straße</span> (the street)

        #### Neuter — <span lang="de">das</span>

        - **Diminutives ending in <span lang="de">-chen</span> or <span lang="de">-lein</span>:** <span lang="de">das Mädchen</span> (the girl), <span lang="de">das Büchlein</span> (the little book)
        - **Infinitives used as nouns:** <span lang="de">das Essen</span> (the food/eating), <span lang="de">das Schreiben</span> (the writing)
        - **Nouns ending in <span lang="de">-um</span>:** <span lang="de">das Zentrum</span> (the centre), <span lang="de">das Museum</span> (the museum)
        - **Most metals and chemical elements:** <span lang="de">das Gold</span> (gold), <span lang="de">das Eisen</span> (iron)

        ---

        ### Examples in sentences

        1. <span lang="de">Der Apfel ist rot.</span> — The apple is red.
        2. <span lang="de">Die Sonne scheint heute.</span> — The sun is shining today.
        3. <span lang="de">Das Kind spielt im Park.</span> — The child is playing in the park.
        4. <span lang="de">Der Lehrer erklärt die Aufgabe.</span> — The teacher explains the task.
        5. <span lang="de">Die Wohnung ist groß.</span> — The flat is big.
        6. <span lang="de">Das Mädchen liest ein Buch.</span> — The girl is reading a book.

        ---

        ### Common learner mistakes

        **Mistake:** Guessing gender based on meaning.
        > ❌ <span lang="de">*die Apfel</span> (because an apple feels like a common word?)
        > ✅ <span lang="de">der Apfel</span>

        **Mistake:** Assuming natural gender always matches grammatical gender.
        > ❌ <span lang="de">*der Mädchen</span> (because a girl is female)
        > ✅ <span lang="de">das Mädchen</span> (the <span lang="de">-chen</span> ending makes it neuter)

        **Mistake:** Learning the noun alone without the article.
        > ❌ Memorising just <span lang="de">Tisch</span>
        > ✅ Memorising <span lang="de">der Tisch</span> (the table)

        ---

        ### Quick-reference: gender by common ending

        | Ending | Gender | Example |
        |------------|--------|---------------------------|
        | <span lang="de">-ung</span> | <span lang="de">die</span> | <span lang="de">die Zeitung</span> |
        | <span lang="de">-heit / -keit</span> | <span lang="de">die</span> | <span lang="de">die Freiheit</span> |
        | <span lang="de">-schaft</span> | <span lang="de">die</span> | <span lang="de">die Freundschaft</span> |
        | <span lang="de">-tion</span> | <span lang="de">die</span> | <span lang="de">die Station</span> |
        | <span lang="de">-er</span> (agent) | <span lang="de">der</span> | <span lang="de">der Lehrer</span> |
        | <span lang="de">-ig / -ling</span> | <span lang="de">der</span> | <span lang="de">der Frühling</span> |
        | <span lang="de">-chen / -lein</span> | <span lang="de">das</span> | <span lang="de">das Mädchen</span> |
        | <span lang="de">-um</span> | <span lang="de">das</span> | <span lang="de">das Zentrum</span> |

        > **Note:** These patterns help, but exceptions exist. Always verify the gender when you learn a new word.
      language: en
      why_this_matters: Gender controls which article form you use, and it ripples
        through cases, adjective endings, and pronouns — so getting it right from
        the start saves you enormous effort later. Almost every German sentence contains
        a noun, so you will meet this rule constantly.

- code: noun_plural
  cefr_level: A1
  category: nomen
  subcategory: Numerus
  label: Singular und Plural der Nomen
  description: Singular and plural forms of nouns as specified in the A1 word list.
  examples:
  - Drei Fahrkarten nach Berlin und eine Fahrkarte nach Karlsruhe, bitte.
  prerequisites:
  - noun_gender
  source_note: Singular/Plural der Nomen wie in der Wortliste
  explanations:
    en:
      title: Singular and plural forms of nouns
      tip: German nouns form their plurals in several different ways — there is no
        single rule like adding -s in English. You must learn the plural form of each
        noun together with its gender when you first meet the word.
      explanation: |-
        ## Singular and Plural of German Nouns

        ### The Core Rule

        Every German noun has a **singular** (one) and a **plural** (more than one) form. Unlike English, which almost always adds *-s* or *-es*, German uses **several different strategies** to build the plural. There is no single ending that works for all nouns. This means the plural form is a fixed property of each noun — like its gender — and must be memorised.

        Dictionaries and word lists always give the plural form alongside the noun. It is written after the gender, for example: <span lang="de">der Zug, die Züge</span> (the train, the trains).

        ---

        ### The Six Main Plural Patterns

        Below are the main ways German nouns form their plural. Each pattern may also involve an **umlaut** (a vowel change: <span lang="de">a → ä, o → ö, u → ü, au → äu</span>).

        | Pattern | What happens | Singular | Plural |
        |---|---|---|---|
        | **-e** | add <span lang="de">-e</span> | <span lang="de">der Tag</span> | <span lang="de">die Tage</span> |
        | **-e + umlaut** | add <span lang="de">-e</span>, change vowel | <span lang="de">der Zug</span> | <span lang="de">die Züge</span> |
        | **-er** | add <span lang="de">-er</span> | <span lang="de">das Kind</span> | <span lang="de">die Kinder</span> |
        | **-er + umlaut** | add <span lang="de">-er</span>, change vowel | <span lang="de">das Haus</span> | <span lang="de">die Häuser</span> |
        | **-(e)n** | add <span lang="de">-(e)n</span> | <span lang="de">die Frau</span> | <span lang="de">die Frauen</span> |
        | **no ending (∅)** | no change (umlaut possible) | <span lang="de">der Lehrer</span> | <span lang="de">die Lehrer</span> |
        | **no ending + umlaut** | no change, change vowel | <span lang="de">der Vater</span> | <span lang="de">die Väter</span> |
        | **-s** | add <span lang="de">-s</span> (loanwords) | <span lang="de">das Kino</span> | <span lang="de">die Kinos</span> |

        ---

        ### The Plural Article

        In the plural, **all genders use the same definite article**: <span lang="de">die</span>.

        - <span lang="de">der Mann → die Männer</span> (the man → the men)
        - <span lang="de">die Frau → die Frauen</span> (the woman → the women)
        - <span lang="de">das Kind → die Kinder</span> (the child → the children)

        The **indefinite article** (<span lang="de">ein/eine/ein</span>) has **no plural form**. In the plural you either use <span lang="de">die</span> or no article at all.

        - <span lang="de">ein Apfel → Äpfel / die Äpfel</span> (an apple → apples / the apples)

        ---

        ### Useful Patterns by Gender

        While there are many exceptions, these tendencies can help:

        - **Feminine nouns** (<span lang="de">die</span>) very often take <span lang="de">-(e)n</span> in the plural:
          <span lang="de">die Frau → die Frauen</span>, <span lang="de">die Straße → die Straßen</span>
        - **Masculine nouns** (<span lang="de">der</span>) often take <span lang="de">-e</span> (with or without umlaut):
          <span lang="de">der Brief → die Briefe</span>, <span lang="de">der Arzt → die Ärzte</span>
        - **Neuter nouns** (<span lang="de">das</span>) often take <span lang="de">-e</span> or <span lang="de">-er</span>:
          <span lang="de">das Jahr → die Jahre</span>, <span lang="de">das Buch → die Bücher</span>
        - **Nouns ending in <span lang="de">-er, -el, -en</span>** (mostly masculine/neuter) often have **no ending change**:
          <span lang="de">der Lehrer → die Lehrer</span>, <span lang="de">das Messer → die Messer</span>
        - **Loanwords** (especially from English) usually take <span lang="de">-s</span>:
          <span lang="de">das Handy → die Handys</span>, <span lang="de">das Café → die Cafés</span>

        ---

        ### Examples from the A1 Word List

        | Singular | Plural | English |
        |---|---|---|
        | <span lang="de">die Fahrkarte</span> | <span lang="de">die Fahrkarten</span> | ticket / tickets |
        | <span lang="de">das Zimmer</span> | <span lang="de">die Zimmer</span> | room / rooms |
        | <span lang="de">der Kurs</span> | <span lang="de">die Kurse</span> | course / courses |
        | <span lang="de">das Buch</span> | <span lang="de">die Bücher</span> | book / books |
        | <span lang="de">die Stadt</span> | <span lang="de">die Städte</span> | city / cities |
        | <span lang="de">das Haus</span> | <span lang="de">die Häuser</span> | house / houses |
        | <span lang="de">der Mann</span> | <span lang="de">die Männer</span> | man / men |
        | <span lang="de">die Frau</span> | <span lang="de">die Frauen</span> | woman / women |
        | <span lang="de">das Kind</span> | <span lang="de">die Kinder</span> | child / children |
        | <span lang="de">das Auto</span> | <span lang="de">die Autos</span> | car / cars |

        ---

        ### Example Sentences

        1. <span lang="de">Drei Fahrkarten nach Berlin und eine Fahrkarte nach Karlsruhe, bitte.</span>
           — Three tickets to Berlin and one ticket to Karlsruhe, please.

        2. <span lang="de">Die Kinder spielen im Garten.</span>
           — The children are playing in the garden.

        3. <span lang="de">Ich brauche zwei Zimmer.</span>
           — I need two rooms.

        4. <span lang="de">Wo sind die Bücher?</span>
           — Where are the books?

        5. <span lang="de">Die Häuser hier sind sehr alt.</span>
           — The houses here are very old.

        6. <span lang="de">Wie viele Kurse hast du?</span>
           — How many courses do you have?

        ---

        ### Common Learner Mistakes

        **❌ Adding -s to all nouns (English transfer)**
        > <span lang="de">*die Kinds, die Manns, die Tags</span>

        **✓ Correct:**
        > <span lang="de">die Kinder, die Männer, die Tage</span>

        German only uses <span lang="de">-s</span> as a plural ending for loanwords and a small group of other nouns. Do not apply it generally.

        ---

        **❌ Forgetting the umlaut**
        > <span lang="de">*die Bucher, *die Stadte</span>

        **✓ Correct:**
        > <span lang="de">die Bücher, die Städte</span>

        The umlaut is part of the plural form — always write and pronounce it.

        ---

        **❌ Using the wrong article in the plural**
        > <span lang="de">*der Männer, *das Kinder</span>

        **✓ Correct:**
        > <span lang="de">die Männer, die Kinder</span>

        All plural nouns use <span lang="de">die</span>, regardless of the singular gender.

        ---

        ### Practical Tip

        Whenever you learn a new noun, always learn **three things together**: the article, the noun, and the plural form. For example, learn <span lang="de">der Zug – die Züge</span> as one unit, not just <span lang="de">Zug</span> alone. This habit will save you a great deal of effort later.
      language: en
      why_this_matters: You cannot talk about more than one thing without knowing
        the plural form. Plurals appear in almost every sentence, and getting them
        wrong can make you hard to understand or sound unnatural.

- code: nominative_case
  cefr_level: A1
  category: nomen
  subcategory: Kasus
  label: Nominativ aller Nomen der Wortliste
  description: Nominative case of all nouns in the word list, used for the subject
    of a sentence.
  examples:
  - der Mann
  - Er heißt Heinz Bartels.
  prerequisites:
  - noun_gender
  source_note: Nominativ aller Nomen in der Wortliste
  explanations:
    en:
      title: 'The nominative case: the subject'
      tip: 'The nominative case marks the subject of a sentence — the person or thing
        doing or being something. It is the ''default'' form you find in a dictionary.
        Watch the article: it tells you the gender and the case.'
      explanation: |-
        ## The Nominative Case in German

        ### What is the nominative case?

        German nouns change their article depending on their role in a sentence. This system is called **case** (<span lang="de">Kasus</span>). The nominative (<span lang="de">Nominativ</span>) is the case used for the **subject** of a sentence — the noun that performs the action of the verb, or the noun that is described by a linking verb like <span lang="de">sein</span> (to be) or <span lang="de">heißen</span> (to be called).

        The nominative is also the form listed in dictionaries, so every new noun you look up is already in the nominative.

        ---

        ### Definite articles in the nominative

        The definite article (<span lang="de">bestimmter Artikel</span>) has three forms in the nominative, one for each grammatical gender, plus a plural form:

        | Gender | Nominative article | Example |
        |--------|-------------------|----------|
        | masculine (<span lang="de">maskulin</span>) | <span lang="de">der</span> | <span lang="de">der Mann</span> (the man) |
        | feminine (<span lang="de">feminin</span>) | <span lang="de">die</span> | <span lang="de">die Frau</span> (the woman) |
        | neuter (<span lang="de">neutrum</span>) | <span lang="de">das</span> | <span lang="de">das Kind</span> (the child) |
        | plural (all genders) | <span lang="de">die</span> | <span lang="de">die Männer</span> (the men) |

        ---

        ### Indefinite articles in the nominative

        The indefinite article (<span lang="de">unbestimmter Artikel</span>) follows a similar pattern:

        | Gender | Nominative article | Example |
        |--------|-------------------|----------|
        | masculine | <span lang="de">ein</span> | <span lang="de">ein Mann</span> (a man) |
        | feminine | <span lang="de">eine</span> | <span lang="de">eine Frau</span> (a woman) |
        | neuter | <span lang="de">ein</span> | <span lang="de">ein Kind</span> (a child) |
        | plural | — (no article) | <span lang="de">Männer</span> (men) |

        ---

        ### How to find the subject

        Ask: *Who or what is doing the action?* That noun is the subject and takes the nominative case.

        In <span lang="de">Der Mann kauft Brot.</span> (The man buys bread.), ask: *Who buys?* → <span lang="de">der Mann</span> → nominative.

        With linking verbs like <span lang="de">sein</span> (to be) and <span lang="de">heißen</span> (to be called), **both** the subject and the noun or pronoun after the verb are in the nominative. This is called a **nominative complement** (<span lang="de">Nominativergänzung</span>).

        > <span lang="de">Das ist ein Tisch.</span> — *That is a table.* (Both <span lang="de">das</span> and <span lang="de">ein Tisch</span> are nominative.)

        ---

        ### Examples

        1. <span lang="de">Der Mann heißt Heinz Bartels.</span> — *The man is called Heinz Bartels.*
        2. <span lang="de">Die Frau ist Ärztin.</span> — *The woman is a doctor.*
        3. <span lang="de">Das Kind spielt.</span> — *The child plays.*
        4. <span lang="de">Ein Bus kommt.</span> — *A bus is coming.*
        5. <span lang="de">Die Kinder essen.</span> — *The children are eating.*
        6. <span lang="de">Das ist meine Mutter.</span> — *That is my mother.*

        ---

        ### Common learner mistakes

        **Mistake 1: Using the wrong article gender**

        Learners sometimes use <span lang="de">die</span> for all nouns because it sounds familiar.

        - ❌ <span lang="de">Die Mann kommt.</span>
        - ✅ <span lang="de">Der Mann kommt.</span>

        Always learn the article together with each new noun: not just <span lang="de">Mann</span>, but <span lang="de">der Mann</span>.

        **Mistake 2: Confusing nominative with accusative**

        The masculine article changes in the accusative (<span lang="de">den</span>), but feminine and neuter do **not** change. In the nominative, masculine is always <span lang="de">der</span>.

        - ❌ <span lang="de">Den Mann ist nett.</span> (accusative article used for subject)
        - ✅ <span lang="de">Der Mann ist nett.</span>

        **Mistake 3: Forgetting that both nouns after 'sein' are nominative**

        - ❌ <span lang="de">Er ist einen Lehrer.</span> (accusative article wrongly used)
        - ✅ <span lang="de">Er ist ein Lehrer.</span>

        ---

        ### Quick reference: nominative articles at a glance

        | | masculine | feminine | neuter | plural |
        |---|---|---|---|---|
        | definite | <span lang="de">der</span> | <span lang="de">die</span> | <span lang="de">das</span> | <span lang="de">die</span> |
        | indefinite | <span lang="de">ein</span> | <span lang="de">eine</span> | <span lang="de">ein</span> | — |

        Memorising this table is one of the most valuable investments you can make in German at A1 level.
      language: en
      why_this_matters: Every German sentence has a subject, so you will use the nominative
        in absolutely every sentence you speak or write. Knowing which form the article
        takes in the nominative is also the foundation for understanding how articles
        change in other cases.

- code: accusative_case
  cefr_level: A1
  category: nomen
  subcategory: Kasus
  label: Akkusativ aller Nomen der Wortliste
  description: Accusative case of all nouns in the word list, used for direct objects
    and with certain prepositions.
  examples:
  - den Mann
  - Ich nehme eine Coca Cola.
  prerequisites:
  - nominative_case
  source_note: Akkusativ aller Nomen in der Wortliste
  explanations:
    en:
      title: The accusative case
      tip: 'The accusative case marks the direct object of a sentence — the person
        or thing directly receiving the action. In German, only masculine nouns change
        their article in the accusative: ''der'' becomes ''den''.'
      explanation: |-
        ## The Accusative Case in German

        ### What is the accusative case?

        German nouns appear in different **cases** depending on their role in a sentence. The **accusative case** (<span lang="de">der Akkusativ</span>) marks the **direct object** — the noun that directly receives the action of the verb. It also appears after certain prepositions.

        > <span lang="de">Ich sehe **den Mann**.</span> — I see the man.

        Here, <span lang="de">der Mann</span> is the direct object (the man being seen), so it takes the accusative form <span lang="de">den Mann</span>.

        ---

        ### How does the accusative change the article?

        Only **masculine** nouns change their article in the accusative. Feminine, neuter, and plural nouns look exactly the same as in the nominative.

        #### Definite article (<span lang="de">bestimmter Artikel</span>)

        | Gender | Nominative | Accusative |
        |--------|-----------|------------|
        | masculine (<span lang="de">der</span>) | <span lang="de">der</span> | <span lang="de">**den**</span> |
        | feminine (<span lang="de">die</span>) | <span lang="de">die</span> | <span lang="de">die</span> |
        | neuter (<span lang="de">das</span>) | <span lang="de">das</span> | <span lang="de">das</span> |
        | plural (<span lang="de">die</span>) | <span lang="de">die</span> | <span lang="de">die</span> |

        #### Indefinite article (<span lang="de">unbestimmter Artikel</span>)

        | Gender | Nominative | Accusative |
        |--------|-----------|------------|
        | masculine | <span lang="de">ein</span> | <span lang="de">**einen**</span> |
        | feminine | <span lang="de">eine</span> | <span lang="de">eine</span> |
        | neuter | <span lang="de">ein</span> | <span lang="de">ein</span> |
        | plural | <span lang="de">—</span> | <span lang="de">—</span> |

        #### Negative article (<span lang="de">Negativartikel</span>)

        | Gender | Nominative | Accusative |
        |--------|-----------|------------|
        | masculine | <span lang="de">kein</span> | <span lang="de">**keinen**</span> |
        | feminine | <span lang="de">keine</span> | <span lang="de">keine</span> |
        | neuter | <span lang="de">kein</span> | <span lang="de">kein</span> |
        | plural | <span lang="de">keine</span> | <span lang="de">keine</span> |

        #### Possessive article (<span lang="de">Possessivartikel</span> — e.g. <span lang="de">mein</span>)

        Possessive articles follow the same pattern as <span lang="de">kein</span>:

        | Gender | Nominative | Accusative |
        |--------|-----------|------------|
        | masculine | <span lang="de">mein</span> | <span lang="de">**meinen**</span> |
        | feminine | <span lang="de">meine</span> | <span lang="de">meine</span> |
        | neuter | <span lang="de">mein</span> | <span lang="de">mein</span> |
        | plural | <span lang="de">meine</span> | <span lang="de">meine</span> |

        The same applies to <span lang="de">dein, sein, ihr, Ihr</span>, etc.

        ---

        ### When do you use the accusative?

        #### 1. Direct objects

        The most common use. Ask yourself: *What/whom is the subject acting on?*

        - <span lang="de">Ich kaufe **einen Kaffee**.</span> — I'm buying a coffee.
        - <span lang="de">Sie nimmt **das Buch**.</span> — She takes the book.
        - <span lang="de">Hast du **einen Stift**?</span> — Do you have a pen?
        - <span lang="de">Er hat **keine Zeit**.</span> — He has no time.

        #### 2. After certain prepositions

        Some prepositions always take the accusative. At A1 level, the most important ones are:

        | Preposition | Meaning |
        |-------------|--------|
        | <span lang="de">durch</span> | through |
        | <span lang="de">für</span> | for |
        | <span lang="de">gegen</span> | against |
        | <span lang="de">ohne</span> | without |
        | <span lang="de">um</span> | around / at (time) |

        - <span lang="de">Das ist **für meinen Vater**.</span> — That is for my father.
        - <span lang="de">Ich gehe **ohne einen Regenschirm**.</span> — I'm going without an umbrella.

        ---

        ### Examples at a glance

        | German | English |
        |--------|---------|
        | <span lang="de">Ich sehe den Mann.</span> | I see the man. |
        | <span lang="de">Ich nehme eine Coca Cola.</span> | I'll have a Coca-Cola. |
        | <span lang="de">Er kauft einen Apfel.</span> | He buys an apple. |
        | <span lang="de">Wir haben keine Milch.</span> | We have no milk. |
        | <span lang="de">Das ist für dich.</span> | That is for you. |
        | <span lang="de">Sie sucht ihren Schlüssel.</span> | She is looking for her key. |

        ---

        ### Common learner mistakes

        **Mistake 1: Forgetting to change masculine articles**

        ❌ <span lang="de">Ich sehe der Mann.</span>
        ✅ <span lang="de">Ich sehe **den** Mann.</span>

        Remember: only masculine changes — <span lang="de">der → den</span>, <span lang="de">ein → einen</span>, <span lang="de">kein → keinen</span>.

        **Mistake 2: Changing feminine or neuter articles unnecessarily**

        ❌ <span lang="de">Ich kaufe dien Tasche.</span>
        ✅ <span lang="de">Ich kaufe **die** Tasche.</span>

        Feminine <span lang="de">die</span> stays <span lang="de">die</span> in the accusative.

        **Mistake 3: Confusing subject and object**

        ❌ <span lang="de">Den Mann sieht ein Hund.</span> (misreading — the man is the object here, and the dog is the subject)

        Always identify *who is doing* the action (nominative/subject) vs. *who receives* the action (accusative/direct object). Word order in German can vary, so the case ending is your guide.

        ---

        ### Quick memory tip

        Only **one** change to learn at A1: masculine <span lang="de">**der → den**</span> and <span lang="de">**ein → einen**</span>. Everything else stays the same. If you know the gender of a noun, you know whether to change the article.
      language: en
      why_this_matters: Almost every German sentence with an action verb has a direct
        object in the accusative case. Without it, you cannot say 'I see the man',
        'I want a coffee', or 'Do you have a pen?' — some of the most basic things
        you need to communicate.

- code: dative_case
  cefr_level: A1
  category: nomen
  subcategory: Kasus
  label: Dativ aller Nomen der Wortliste
  description: Dative case of all nouns in the word list, used for indirect objects
    and with certain verbs and prepositions. Marked as A2 addition (*) but listed
    here.
  examples:
  - dem Mann
  - Gib mir bitte mal dein Wörterbuch.
  - Kann ich dir helfen?
  prerequisites:
  - accusative_case
  source_note: Dativ* aller Nomen in der Wortliste (marked with * as A2 addition)
  explanations:
    en:
      title: The dative case
      tip: 'The dative case marks the indirect object — the person or thing that receives
        or benefits from an action. It is also required after certain verbs and prepositions.
        The article changes to show dative: <span lang="de">dem</span> (masc./neut.),
        <span lang="de">der</span> (fem.), <span lang="de">den</span> (plural).'
      explanation: |-
        ## The Dative Case in German

        ### What is the dative case?

        German nouns appear in different **cases** depending on their role in a sentence. The dative case (Dativ) most often marks the **indirect object** — the person or thing that something is given to, done for, or directed at. It is also required after a fixed set of verbs and prepositions.

        ---

        ### How dative articles differ from nominative

        The article (definite, indefinite, possessive, etc.) changes form in the dative. The noun itself usually stays the same, with one important exception noted below.

        #### Definite article (<span lang="de">der/die/das</span>)

        | Gender | Nominative | Dative |
        |--------|-----------|--------|
        | Masculine | <span lang="de">der Mann</span> | <span lang="de">dem Mann</span> |
        | Feminine | <span lang="de">die Frau</span> | <span lang="de">der Frau</span> |
        | Neuter | <span lang="de">das Kind</span> | <span lang="de">dem Kind</span> |
        | Plural | <span lang="de">die Kinder</span> | <span lang="de">den Kindern</span> |

        #### Indefinite article (<span lang="de">ein/eine</span>)

        | Gender | Nominative | Dative |
        |--------|-----------|--------|
        | Masculine | <span lang="de">ein Mann</span> | <span lang="de">einem Mann</span> |
        | Feminine | <span lang="de">eine Frau</span> | <span lang="de">einer Frau</span> |
        | Neuter | <span lang="de">ein Kind</span> | <span lang="de">einem Kind</span> |

        #### Possessive article (<span lang="de">mein, dein</span>, etc.) — same endings as indefinite

        | Gender | Nominative | Dative |
        |--------|-----------|--------|
        | Masculine | <span lang="de">mein Vater</span> | <span lang="de">meinem Vater</span> |
        | Feminine | <span lang="de">meine Mutter</span> | <span lang="de">meiner Mutter</span> |
        | Neuter | <span lang="de">mein Kind</span> | <span lang="de">meinem Kind</span> |
        | Plural | <span lang="de">meine Eltern</span> | <span lang="de">meinen Eltern</span> |

        #### Negative article (<span lang="de">kein/keine</span>) — same endings as indefinite/possessive

        | Gender | Nominative | Dative |
        |--------|-----------|--------|
        | Masculine | <span lang="de">kein Bruder</span> | <span lang="de">keinem Bruder</span> |
        | Feminine | <span lang="de">keine Schwester</span> | <span lang="de">keiner Schwester</span> |
        | Neuter | <span lang="de">kein Buch</span> | <span lang="de">keinem Buch</span> |
        | Plural | <span lang="de">keine Bücher</span> | <span lang="de">keinen Büchern</span> |

        ---

        ### The plural dative ending on the noun

        In the dative plural, the noun itself gets an extra <span lang="de">-n</span> if it does not already end in <span lang="de">-n</span> or <span lang="de">-s</span>:

        - <span lang="de">die Kinder</span> → <span lang="de">den Kindern</span>
        - <span lang="de">die Freunde</span> → <span lang="de">den Freunden</span>
        - <span lang="de">die Autos</span> → <span lang="de">den Autos</span> (no extra <span lang="de">-n</span> because it ends in <span lang="de">-s</span>)

        ---

        ### Three main uses of the dative

        #### 1. Indirect object

        The indirect object is the person who **receives** or **benefits from** the action.

        > <span lang="de">Ich gebe dem Mann das Buch.</span>
        > I give the man the book. (<span lang="de">dem Mann</span> = indirect object)

        > <span lang="de">Sie schreibt ihrer Mutter eine E-Mail.</span>
        > She writes her mother an email.

        #### 2. Dative verbs — verbs that always take dative

        Some common verbs take a dative object instead of an accusative one. You must memorise these:

        | Verb | Meaning |
        |------|---------|
        | <span lang="de">helfen</span> | to help |
        | <span lang="de">danken</span> | to thank |
        | <span lang="de">gefallen</span> | to please / to like |
        | <span lang="de">gehören</span> | to belong to |
        | <span lang="de">antworten</span> | to answer |
        | <span lang="de">schmecken</span> | to taste (to s.o.) |

        > <span lang="de">Kann ich dir helfen?</span>
        > Can I help you?

        > <span lang="de">Das Buch gehört meiner Schwester.</span>
        > The book belongs to my sister.

        #### 3. Dative prepositions — prepositions that always take dative

        These prepositions are **always** followed by dative:

        | Preposition | Meaning |
        |-------------|---------|
        | <span lang="de">mit</span> | with |
        | <span lang="de">bei</span> | at / near / with |
        | <span lang="de">nach</span> | after / to (cities) |
        | <span lang="de">von</span> | from / of |
        | <span lang="de">aus</span> | from / out of |
        | <span lang="de">zu</span> | to |
        | <span lang="de">seit</span> | since / for |
        | <span lang="de">gegenüber</span> | opposite |

        > <span lang="de">Ich fahre mit dem Bus.</span>
        > I travel by bus.

        > <span lang="de">Er wohnt bei seiner Tante.</span>
        > He lives with his aunt.

        > <span lang="de">Wir kommen aus der Schule.</span>
        > We are coming from school.

        ---

        ### Examples with translations

        1. <span lang="de">Gib mir bitte mal dein Wörterbuch.</span> — Please give me your dictionary.
        2. <span lang="de">Kann ich dir helfen?</span> — Can I help you?
        3. <span lang="de">Das Essen schmeckt meinem Vater gut.</span> — My father likes the food.
        4. <span lang="de">Sie spricht mit einem Freund.</span> — She is talking with a friend.
        5. <span lang="de">Ich danke meiner Lehrerin.</span> — I thank my teacher.
        6. <span lang="de">Er zeigt dem Kind das Foto.</span> — He shows the child the photo.

        ---

        ### Common learner mistakes

        **Mistake 1 — Using accusative instead of dative with dative verbs:**

        ❌ <span lang="de">Ich helfe meinen Bruder.</span>
        ✅ <span lang="de">Ich helfe meinem Bruder.</span>
        (<span lang="de">helfen</span> always takes dative)

        **Mistake 2 — Using accusative instead of dative after dative prepositions:**

        ❌ <span lang="de">Ich gehe mit meinen Vater.</span>
        ✅ <span lang="de">Ich gehe mit meinem Vater.</span>
        (<span lang="de">mit</span> always takes dative)

        **Mistake 3 — Forgetting the extra <span lang="de">-n</span> on plural nouns in dative:**

        ❌ <span lang="de">Ich spreche mit den Kinder.</span>
        ✅ <span lang="de">Ich spreche mit den Kindern.</span>

        **Mistake 4 — Confusing feminine dative (<span lang="de">der</span>) with the masculine nominative (<span lang="de">der</span>):**

        In the dative, <span lang="de">der</span> is the feminine article, not masculine. Compare:
        - <span lang="de">die Frau</span> (nom. fem.) → <span lang="de">der Frau</span> (dat. fem.)
        - <span lang="de">der Mann</span> (nom. masc.) → <span lang="de">dem Mann</span> (dat. masc.)

        ---

        ### Quick reference summary

        | | Masc. | Fem. | Neut. | Plural |
        |---|---|---|---|---|
        | **Definite** | <span lang="de">dem</span> | <span lang="de">der</span> | <span lang="de">dem</span> | <span lang="de">den (+n)</span> |
        | **Indefinite** | <span lang="de">einem</span> | <span lang="de">einer</span> | <span lang="de">einem</span> | — |
        | **Possessive / kein-** | <span lang="de">meinem</span> | <span lang="de">meiner</span> | <span lang="de">meinem</span> | <span lang="de">meinen (+n)</span> |
      language: en
      why_this_matters: Dative appears in everyday sentences whenever you give, show,
        help, or say something to someone. Without it you cannot correctly use verbs
        like <span lang="de">helfen</span>, <span lang="de">geben</span>, or <span
        lang="de">danken</span>, or prepositions like <span lang="de">mit</span>,
        <span lang="de">bei</span>, and <span lang="de">zu</span>.

- code: genitive_proper_name
  cefr_level: A1
  category: nomen
  subcategory: Kasus
  label: Genitiv bei Eigennamen im Singular
  description: Genitive case used with proper names in the singular (possessive -s),
    and genitive recognized receptively.
  examples:
  - Karls Freunde kommen heute Nachmittag.
  - die Nummer des Wagens
  prerequisites:
  - noun_gender
  source_note: Genitiv bei Eigennamen im Singular; Genitiv (rezeptiv)
  explanations:
    en:
      title: The genitive case with proper names
      tip: In German, you can show that something belongs to a person by adding -s
        directly to their name — no apostrophe needed, unlike English. You will also
        see the genitive used with a definite article and a changed noun ending in
        more formal or written German.
      explanation: |-
        ## The Genitive Case with Proper Names

        ### What the genitive does

        The **genitive case** expresses possession or belonging — it answers the question *whose?* In English you use either an apostrophe-s (*Karl's friends*) or the word *of* (*the number of the car*). German has two parallel patterns.

        ---

        ### Pattern 1 — Name + -s (the productive A1 pattern)

        Attach **-s** directly to a person's name. No apostrophe is written.

        | English | German |
        |---|---|
        | Karl's friends | <span lang="de">Karls Freunde</span> |
        | Anna's bag | <span lang="de">Annas Tasche</span> |
        | Thomas's car | <span lang="de">Thomas' Auto</span> |

        **Formation rules:**

        - Most names: simply add **-s** → <span lang="de">Anna → Annas</span>, <span lang="de">Karl → Karls</span>
        - Names already ending in **-s, -ss, -ß, -x, -z**: add only an apostrophe (no extra -s) → <span lang="de">Thomas → Thomas'</span>, <span lang="de">Max → Max'</span>
        - The genitive name comes **directly before** the noun it modifies, like an adjective.

        **Word order:** The possessive name leads the phrase.

        > <span lang="de">Karls Freunde kommen heute Nachmittag.</span>
        > *Karl's friends are coming this afternoon.*

        > <span lang="de">Annas Nummer ist nicht bekannt.</span>
        > *Anna's number is not known.*

        ---

        ### Pattern 2 — Article-based genitive (receptive recognition at A1)

        For common nouns (not proper names), German uses a **definite article** in the genitive form plus a noun ending. You need to **recognise** this pattern when reading or listening, but you are not yet expected to produce it freely at A1.

        **Genitive article forms:**

        | Gender | Nominative article | Genitive article | Noun ending |
        |---|---|---|---|
        | masculine | <span lang="de">der</span> | <span lang="de">des</span> | **-(e)s** |
        | neuter | <span lang="de">das</span> | <span lang="de">des</span> | **-(e)s** |
        | feminine | <span lang="de">die</span> | <span lang="de">der</span> | — |
        | plural | <span lang="de">die</span> | <span lang="de">der</span> | — |

        **Examples:**

        > <span lang="de">die Nummer des Wagens</span>
        > *the number of the car* (masculine: <span lang="de">der Wagen → des Wagens</span>)

        > <span lang="de">der Name des Kindes</span>
        > *the name of the child* (neuter: <span lang="de">das Kind → des Kindes</span>)

        > <span lang="de">die Tasche der Frau</span>
        > *the woman's bag* (feminine: <span lang="de">die Frau → der Frau</span>)

        **Note on the noun ending:** Masculine and neuter nouns add **-s** (for short words and most nouns) or **-es** (words ending in -s, -ß, -x, -z, or single-syllable words, e.g. <span lang="de">des Mannes</span>). Feminine and plural nouns do **not** change their ending.

        ---

        ### Summary of A1 focus

        | What to do | Pattern |
        |---|---|
        | **Produce** (speaking & writing) | Name + -s: <span lang="de">Karls Freunde</span> |
        | **Recognise** (reading & listening) | <span lang="de">des/der</span> + changed noun |

        ---

        ### Common learner mistakes

        **Mistake 1 — Writing an apostrophe before -s (English habit)**

        ❌ <span lang="de">Karl's Freunde</span>
        ✅ <span lang="de">Karls Freunde</span>

        German uses an apostrophe *only* when the name already ends in -s: <span lang="de">Thomas' Auto</span>.

        **Mistake 2 — Forgetting the noun ending in the article-based genitive**

        ❌ <span lang="de">die Nummer des Wagen</span>
        ✅ <span lang="de">die Nummer des Wagens</span>

        Masculine and neuter nouns need **-(e)s** after <span lang="de">des</span>.

        **Mistake 3 — Using <span lang="de">von</span> instead of the genitive**

        In spoken German, <span lang="de">von + dative</span> is very common as an alternative (e.g. <span lang="de">die Nummer von dem Wagen</span>), and this is acceptable. However, the article-based genitive is standard in writing, so learn to recognise both.
      language: en
      why_this_matters: Possession comes up constantly — whose bag is this, whose
        friend is coming, whose number is that. The name + -s pattern is the quickest
        way to express this at A1, and recognising the article-based genitive prepares
        you for reading real German texts from the very beginning.

- code: definite_article
  cefr_level: A1
  category: artikelwoerter_pronomen
  subcategory: Artikel
  label: Definiter Artikel der/die/das/die
  description: Definite articles der, die, das (singular) and die (plural) used with
    nouns across cases.
  examples:
  - der Tisch/die Lampe/das Bett/die Sachen
  prerequisites:
  - art_der_die_das
  source_note: 'Definit: der/die/das/die'
  explanations:
    en:
      title: 'Using definite articles: der, die, das, die'
      tip: German has three singular definite articles — <span lang="de">der</span>
        (masculine), <span lang="de">die</span> (feminine), and <span lang="de">das</span>
        (neuter) — plus <span lang="de">die</span> for all plurals. The article you
        use depends on the grammatical gender of the noun and its role in the sentence
        (case).
      explanation: |-
        ## Definite Articles in German

        The German definite article corresponds to English 'the', but it changes form depending on three factors: **grammatical gender** (masculine, feminine, neuter), **number** (singular or plural), and **case** (the role the noun plays in the sentence). At A1 level you need to know the four most common cases: **Nominative**, **Accusative**, **Dative**, and **Genitive**.

        ---

        ### What is grammatical gender?

        Every German noun belongs to one of three genders:
        - **Masculine** (<span lang="de">maskulin</span>): e.g. <span lang="de">der Tisch</span> (the table), <span lang="de">der Mann</span> (the man)
        - **Feminine** (<span lang="de">feminin</span>): e.g. <span lang="de">die Lampe</span> (the lamp), <span lang="de">die Frau</span> (the woman)
        - **Neuter** (<span lang="de">neutral</span>): e.g. <span lang="de">das Bett</span> (the bed), <span lang="de">das Kind</span> (the child)

        Gender is a grammatical property — it does not always match natural gender. You must **learn each noun together with its article**.

        ---

        ### The four cases

        The **case** of a noun tells you its role in the sentence:

        | Case | Role | English equivalent |
        |---|---|---|
        | **Nominative** | subject (who/what does the action) | — |
        | **Accusative** | direct object (what is directly affected) | — |
        | **Dative** | indirect object (to/for whom) | — |
        | **Genitive** | possession (of whom/what) | — |

        ---

        ### The definite article table

        | | Masculine | Feminine | Neuter | Plural (all genders) |
        |---|---|---|---|---|
        | **Nominative** | <span lang="de">der</span> | <span lang="de">die</span> | <span lang="de">das</span> | <span lang="de">die</span> |
        | **Accusative** | <span lang="de">den</span> | <span lang="de">die</span> | <span lang="de">das</span> | <span lang="de">die</span> |
        | **Dative** | <span lang="de">dem</span> | <span lang="de">der</span> | <span lang="de">dem</span> | <span lang="de">den</span> |
        | **Genitive** | <span lang="de">des</span> | <span lang="de">der</span> | <span lang="de">des</span> | <span lang="de">der</span> |

        > **Tip:** Only the masculine singular changes in the accusative (<span lang="de">der</span> → <span lang="de">den</span>). All other genders stay the same in nominative and accusative.

        ---

        ### Case-by-case examples

        **Nominative** (subject of the sentence):
        - <span lang="de">Der Tisch ist groß.</span> — The table is big.
        - <span lang="de">Die Lampe ist neu.</span> — The lamp is new.
        - <span lang="de">Das Bett ist weich.</span> — The bed is soft.
        - <span lang="de">Die Kinder spielen.</span> — The children are playing.

        **Accusative** (direct object):
        - <span lang="de">Ich kaufe den Tisch.</span> — I am buying the table.
        - <span lang="de">Er sieht die Lampe.</span> — He sees the lamp.
        - <span lang="de">Wir nehmen das Bett.</span> — We are taking the bed.
        - <span lang="de">Sie kauft die Sachen.</span> — She is buying the things.

        **Dative** (indirect object or after dative prepositions):
        - <span lang="de">Er gibt dem Mann das Buch.</span> — He gives the man the book.
        - <span lang="de">Ich helfe der Frau.</span> — I am helping the woman.
        - <span lang="de">Das Spielzeug gehört dem Kind.</span> — The toy belongs to the child.
        - <span lang="de">Wir danken den Lehrern.</span> — We thank the teachers.

        **Genitive** (possession — mainly with proper names at A1):
        - <span lang="de">Das ist das Auto des Mannes.</span> — That is the man's car.
        - <span lang="de">Die Farbe des Tisches gefällt mir.</span> — I like the colour of the table.

        ---

        ### Important variants and notes

        **Dative plural:** All plural nouns add <span lang="de">-n</span> to the noun in the dative (if they do not already end in <span lang="de">-n</span> or <span lang="de">-s</span>), and the article is <span lang="de">den</span>:
        - <span lang="de">mit den Kindern</span> (with the children) — note <span lang="de">Kindern</span>, not <span lang="de">Kinder</span>.

        **Genitive masculine/neuter nouns:** These nouns add <span lang="de">-(e)s</span> to the noun:
        - <span lang="de">das Buch des Mannes</span> (the man's book)
        - <span lang="de">die Tür des Hauses</span> (the door of the house)

        **Feminine dative looks like masculine nominative:** <span lang="de">der</span> appears in both masculine nominative and feminine dative/genitive — context (and the noun's gender) tells you which it is.

        ---

        ### Common learner mistakes

        **Mistake 1 — Using the wrong gender:**
        ❌ <span lang="de">die Tisch</span>
        ✅ <span lang="de">der Tisch</span>
        → Gender must be memorised with the noun.

        **Mistake 2 — Forgetting to change the masculine article in the accusative:**
        ❌ <span lang="de">Ich sehe der Mann.</span>
        ✅ <span lang="de">Ich sehe den Mann.</span>
        → Masculine nouns change from <span lang="de">der</span> to <span lang="de">den</span> in the accusative.

        **Mistake 3 — Using the wrong article in the dative:**
        ❌ <span lang="de">Ich gebe die Frau das Buch.</span>
        ✅ <span lang="de">Ich gebe der Frau das Buch.</span>
        → Feminine nouns use <span lang="de">der</span> (not <span lang="de">die</span>) in the dative.

        **Mistake 4 — Forgetting the dative plural <span lang="de">-n</span> on the noun:**
        ❌ <span lang="de">mit den Kinder</span>
        ✅ <span lang="de">mit den Kindern</span>
        → In the dative plural, add <span lang="de">-n</span> to the noun as well as using <span lang="de">den</span>.

        ---

        ### Quick-reference summary

        - **Singular:** <span lang="de">der</span> (masc.) / <span lang="de">die</span> (fem.) / <span lang="de">das</span> (neut.) in the nominative.
        - **Plural:** always <span lang="de">die</span> in the nominative and accusative.
        - **Only one change in accusative:** masculine <span lang="de">der</span> → <span lang="de">den</span>.
        - **Dative** endings: <span lang="de">dem / der / dem / den</span>.
        - Always learn new nouns with their article: <span lang="de">der Tisch</span>, <span lang="de">die Lampe</span>, <span lang="de">das Bett</span>.
      language: en
      why_this_matters: Nearly every German noun you encounter will be accompanied
        by an article, so getting these forms right is essential from day one. Without
        the correct article, you cannot signal whether a noun is the subject, object,
        or recipient of an action — meaning your sentences will be misunderstood.

- code: demonstrative_articl
  cefr_level: A1
  category: artikelwoerter_pronomen
  subcategory: Artikel
  label: Demonstrativartikel dieser/diese/dieses
  description: Demonstrative articles dieser, diese, dieses, diese used to point to
    specific nouns.
  examples:
  - dieser Tisch/diese Lampe/dieses Bett/diese Sachen
  prerequisites:
  - definite_article
  source_note: 'Demonstrativ: dieser/diese/dieses/diese'
  explanations:
    en:
      title: 'Demonstrative articles: dieser, diese, dieses'
      tip: Use <span lang="de">dieser/diese/dieses/diese</span> to point to a specific
        thing — like saying 'this' or 'these' in English. The ending changes to match
        the gender, number, and case of the noun it goes with.
      explanation: |-
        ## Demonstrative articles: dieser, diese, dieses

        ### What is a demonstrative article?

        A demonstrative article points to a specific person, thing, or group. In English, this is 'this' (singular) and 'these' (plural). In German, the word is <span lang="de">dieser/diese/dieses/diese</span>, and its ending must agree with the **gender**, **number**, and **case** of the noun it modifies.

        German nouns have three genders:
        - **masculine** (<span lang="de">maskulin</span>): <span lang="de">der Tisch</span> (the table)
        - **feminine** (<span lang="de">feminin</span>): <span lang="de">die Lampe</span> (the lamp)
        - **neuter** (<span lang="de">neutral</span>): <span lang="de">das Bett</span> (the bed)
        - **plural** (<span lang="de">Plural</span>): <span lang="de">die Sachen</span> (the things)

        ---

        ### Formation: the endings

        The demonstrative article follows the same pattern as the definite article (<span lang="de">der/die/das/die</span>). Think of it as the definite article with a <span lang="de">dies-</span> stem in front.

        #### Nominative case (<span lang="de">Nominativ</span>) — the subject of the sentence

        | Gender | Definite article | Demonstrative article |
        |---|---|---|
        | Masculine | <span lang="de">der</span> | <span lang="de">dieser</span> |
        | Feminine | <span lang="de">die</span> | <span lang="de">diese</span> |
        | Neuter | <span lang="de">das</span> | <span lang="de">dieses</span> |
        | Plural | <span lang="de">die</span> | <span lang="de">diese</span> |

        #### Accusative case (<span lang="de">Akkusativ</span>) — the direct object

        | Gender | Definite article | Demonstrative article |
        |---|---|---|
        | Masculine | <span lang="de">den</span> | <span lang="de">diesen</span> |
        | Feminine | <span lang="de">die</span> | <span lang="de">diese</span> |
        | Neuter | <span lang="de">das</span> | <span lang="de">dieses</span> |
        | Plural | <span lang="de">die</span> | <span lang="de">diese</span> |

        #### Dative case (<span lang="de">Dativ</span>) — the indirect object

        | Gender | Definite article | Demonstrative article |
        |---|---|---|
        | Masculine | <span lang="de">dem</span> | <span lang="de">diesem</span> |
        | Feminine | <span lang="de">der</span> | <span lang="de">dieser</span> |
        | Neuter | <span lang="de">dem</span> | <span lang="de">diesem</span> |
        | Plural | <span lang="de">den</span> | <span lang="de">diesen</span> |

        > **Key pattern:** The ending on <span lang="de">dies-</span> is always the same ending you see on the definite article for that gender and case.

        ---

        ### Examples

        1. <span lang="de">Dieser Tisch ist groß.</span> — *This table is big.* (masculine, nominative)
        2. <span lang="de">Diese Lampe ist neu.</span> — *This lamp is new.* (feminine, nominative)
        3. <span lang="de">Dieses Bett ist bequem.</span> — *This bed is comfortable.* (neuter, nominative)
        4. <span lang="de">Diese Sachen sind billig.</span> — *These things are cheap.* (plural, nominative)
        5. <span lang="de">Ich kaufe diesen Stuhl.</span> — *I am buying this chair.* (masculine, accusative)
        6. <span lang="de">Kannst du mir mit diesem Koffer helfen?</span> — *Can you help me with this suitcase?* (masculine, dative)

        ---

        ### Common learner mistakes

        **Mistake 1: Using the same form for every gender**

        ❌ <span lang="de">Diese Tisch ist groß.</span>
        ✅ <span lang="de">Dieser Tisch ist groß.</span>

        The noun <span lang="de">Tisch</span> is masculine, so the article must be <span lang="de">dieser</span>, not <span lang="de">diese</span>.

        **Mistake 2: Forgetting to change the ending for accusative masculine**

        ❌ <span lang="de">Ich nehme dieser Apfel.</span>
        ✅ <span lang="de">Ich nehme diesen Apfel.</span>

        Masculine nouns change from <span lang="de">dieser</span> (nominative) to <span lang="de">diesen</span> (accusative) when they are the direct object.

        **Mistake 3: Confusing feminine dative with masculine nominative**

        Both are <span lang="de">dieser</span>, but for different genders and cases — always check the noun's gender and the sentence role first.

        ---

        ### Quick tip

        At A1 level, focus first on the **nominative** forms: <span lang="de">dieser / diese / dieses / diese</span>. These four cover most situations where you simply want to say 'this' or 'these' about something.
      language: en
      why_this_matters: You will need these words every time you point something out
        — in a shop, at home, or in a classroom. Without them, you cannot say 'this
        one' precisely in German, and getting the endings right also trains you for
        the broader German article system.

- code: indefinite_article
  cefr_level: A1
  category: artikelwoerter_pronomen
  subcategory: Artikel
  label: Indefiniter Artikel ein/eine/ein
  description: Indefinite articles ein, eine, ein used to introduce unspecified nouns.
  examples:
  - ein Tisch/eine Lampe/ein Bett
  prerequisites:
  - art_ein_eine
  source_note: 'Indefinit: ein/eine/ein'
  explanations:
    en:
      title: 'The indefinite article: ein, eine, ein'
      tip: Use <span lang="de">ein</span>, <span lang="de">eine</span>, or <span lang="de">ein</span>
        before a noun to mean 'a' or 'an' in English — one unspecified thing out of
        many. The form changes depending on the noun's gender and its role in the
        sentence.
      explanation: |-
        ## The Indefinite Article: <span lang="de">ein / eine / ein</span>

        ### What is the indefinite article?

        The indefinite article corresponds to English 'a' or 'an'. It introduces a noun that is not yet known to the listener — something unspecified or mentioned for the first time. German has three forms: <span lang="de">ein</span>, <span lang="de">eine</span>, and <span lang="de">ein</span>, matching the three grammatical genders.

        ---

        ### Why three forms?

        Every German noun has a grammatical gender: masculine (<span lang="de">der</span>), feminine (<span lang="de">die</span>), or neuter (<span lang="de">das</span>). The indefinite article must agree with that gender. Additionally, the article changes its ending depending on the grammatical case — the role the noun plays in the sentence (subject, object, etc.).

        ---

        ### The basic forms (Nominative case)

        The **nominative** (<span lang="de">Nominativ</span>) is the case used for the subject of a sentence — the person or thing performing the action.

        | Gender | Definite article | Indefinite article | Example noun |
        |--------|-----------------|-------------------|------------------|
        | masculine (<span lang="de">maskulin</span>) | <span lang="de">der</span> | <span lang="de">ein</span> | <span lang="de">ein Tisch</span> (a table) |
        | feminine (<span lang="de">feminin</span>) | <span lang="de">die</span> | <span lang="de">eine</span> | <span lang="de">eine Lampe</span> (a lamp) |
        | neuter (<span lang="de">neutral</span>) | <span lang="de">das</span> | <span lang="de">ein</span> | <span lang="de">ein Bett</span> (a bed) |

        Note: masculine and neuter share the same form <span lang="de">ein</span> in the nominative.

        ---

        ### Forms in all four cases

        German has four cases. At A1 level the most important are nominative (subject), accusative (<span lang="de">Akkusativ</span> — direct object), and dative (<span lang="de">Dativ</span> — indirect object).

        | Case | masculine | feminine | neuter |
        |------|-----------|----------|--------|
        | Nominative | <span lang="de">ein</span> | <span lang="de">eine</span> | <span lang="de">ein</span> |
        | Accusative | <span lang="de">einen</span> | <span lang="de">eine</span> | <span lang="de">ein</span> |
        | Dative | <span lang="de">einem</span> | <span lang="de">einer</span> | <span lang="de">einem</span> |
        | Genitive | <span lang="de">eines</span> | <span lang="de">einer</span> | <span lang="de">eines</span> |

        The key change to notice first: masculine nouns add **-en** in the accusative (<span lang="de">ein</span> → <span lang="de">einen</span>). Feminine and neuter forms stay the same between nominative and accusative.

        ---

        ### Examples

        1. <span lang="de">Das ist ein Tisch.</span> — That is a table. (masculine, nominative)
        2. <span lang="de">Ich habe eine Schwester.</span> — I have a sister. (feminine, accusative — same form as nominative)
        3. <span lang="de">Er kauft einen Stuhl.</span> — He is buying a chair. (masculine, accusative — note <span lang="de">einen</span>)
        4. <span lang="de">Sie trinkt ein Glas Wasser.</span> — She is drinking a glass of water. (neuter, accusative)
        5. <span lang="de">Ich helfe einem Kind.</span> — I am helping a child. (neuter, dative)
        6. <span lang="de">Wir wohnen in einer Wohnung.</span> — We live in a flat. (feminine, dative)

        ---

        ### No plural form

        The indefinite article has **no plural**. You simply use no article (the zero article) when talking about an unspecified group: <span lang="de">Das sind Stühle.</span> (Those are chairs.) — not <span lang="de">~~Das sind eine Stühle.~~</span>

        ---

        ### Common learner mistakes

        **Mistake 1: Using <span lang="de">ein</span> instead of <span lang="de">einen</span> for masculine accusative**

        ❌ <span lang="de">Ich kaufe ein Hund.</span>
        ✅ <span lang="de">Ich kaufe einen Hund.</span> — I am buying a dog.

        The masculine accusative ending <span lang="de">-en</span> is one of the first endings students must memorise. It is triggered whenever a masculine noun is the direct object of a verb.

        **Mistake 2: Adding an article in the plural**

        ❌ <span lang="de">Das sind eine Bücher.</span>
        ✅ <span lang="de">Das sind Bücher.</span> — Those are books.

        **Mistake 3: Choosing the wrong gender**

        If you do not yet know the gender of a noun, you may use the wrong article form. Always learn every noun together with its definite article (<span lang="de">der</span>, <span lang="de">die</span>, or <span lang="de">das</span>) so you always know which indefinite form to use.

        For example: <span lang="de">das Mädchen</span> (the girl) is neuter, so: <span lang="de">ein Mädchen</span> — NOT <span lang="de">~~eine Mädchen~~</span>.

        ---

        ### Quick reminder: how to pick the right form

        1. Find out the gender of the noun (learn it with <span lang="de">der / die / das</span>).
        2. Decide the case: is the noun the subject (nominative), the direct object (accusative), or the indirect object (dative)?
        3. Pick the matching form from the table above.
      language: en
      why_this_matters: Almost every sentence that introduces something new uses the
        indefinite article — 'I need a pen', 'There is a problem', 'She has a sister'.
        Without it you cannot talk about things for the first time or describe what
        someone owns or wants.

- code: zero_article
  cefr_level: A1
  category: artikelwoerter_pronomen
  subcategory: Artikel
  label: Nullartikel bei Nomen
  description: Use of nouns without any article, e.g. with uncountable nouns or in
    certain fixed expressions.
  examples:
  - Ich esse gern Fleisch.
  - Sachen
  source_note: Nullartikel
  explanations:
    en:
      title: When to use no article at all
      tip: German nouns sometimes appear with no article at all — no <span lang="de">der/die/das</span>,
        no <span lang="de">ein/eine</span>. This happens with uncountable substances,
        languages, nationalities, professions, and many fixed phrases. When the noun
        is used in a general, unspecified way, the article simply disappears.
      explanation: "## The Zero Article in German\n\n### What is the zero article?\n\
        \nThe **zero article** (German: <span lang=\"de\">Nullartikel</span>) means\
        \ a noun is used with **no article at all** — no definite article (<span lang=\"\
        de\">der/die/das</span>), no indefinite article (<span lang=\"de\">ein/eine/ein</span>),\
        \ and no other determiner. The noun stands alone. This is not a mistake; it\
        \ is a grammatical rule with specific, learnable contexts.\n\n---\n\n### When\
        \ is the zero article used?\n\n#### 1. Uncountable nouns and substances (in\
        \ general statements)\n\nWhen you talk about a substance or material **in\
        \ general** — without specifying an amount — you use no article.\n\n| German\
        \ | English |\n|---|---|\n| <span lang=\"de\">Ich esse gern **Fleisch**.</span>\
        \ | I like eating meat. |\n| <span lang=\"de\">**Wasser** ist gesund.</span>\
        \ | Water is healthy. |\n| <span lang=\"de\">Ich trinke **Kaffee**.</span>\
        \ | I drink coffee. |\n\n> Compare: <span lang=\"de\">Ich trinke **einen**\
        \ Kaffee</span> = I'll have **one** coffee (a cup — now it's countable).\n\
        \n---\n\n#### 2. Professions, nationalities, and roles after <span lang=\"\
        de\">sein</span> (to be)\n\nAfter the verb <span lang=\"de\">sein</span> (and\
        \ a few similar verbs like <span lang=\"de\">werden, bleiben</span>), professions\
        \ and nationalities take **no article** unless an adjective is added.\n\n\
        | German | English |\n|---|---|\n| <span lang=\"de\">Sie ist **Ärztin**.</span>\
        \ | She is a doctor. |\n| <span lang=\"de\">Er ist **Lehrer**.</span> | He\
        \ is a teacher. |\n| <span lang=\"de\">Ich bin **Deutscher**.</span> | I am\
        \ German. |\n\n> **With an adjective:** <span lang=\"de\">Er ist **ein guter**\
        \ Lehrer.</span> (He is a good teacher.) — the adjective forces an article\
        \ back in.\n\n---\n\n#### 3. Languages\n\nLanguage names used alone, especially\
        \ after <span lang=\"de\">sprechen</span> (to speak), take no article.\n\n\
        | German | English |\n|---|---|\n| <span lang=\"de\">Ich spreche **Deutsch**.</span>\
        \ | I speak German. |\n| <span lang=\"de\">Sie lernt **Spanisch**.</span>\
        \ | She is learning Spanish. |\n\n---\n\n#### 4. Proper names\n\nNames of\
        \ people and most place names (cities, most countries) take no article.\n\n\
        | German | English |\n|---|---|\n| <span lang=\"de\">**Maria** kommt aus **Wien**.</span>\
        \ | Maria comes from Vienna. |\n| <span lang=\"de\">Ich wohne in **Berlin**.</span>\
        \ | I live in Berlin. |\n\n> **Exceptions:** Some countries are always used\
        \ with a definite article: <span lang=\"de\">**die** Schweiz, **die** Türkei,\
        \ **der** Iran, **die** USA</span>.\n\n---\n\n#### 5. Fixed expressions and\
        \ set phrases\n\nMany everyday phrases and idioms use no article.\n\n| German\
        \ | English |\n|---|---|\n| <span lang=\"de\">**Guten Morgen!**</span> | Good\
        \ morning! |\n| <span lang=\"de\">Ich habe **Hunger**.</span> | I am hungry.\
        \ |\n| <span lang=\"de\">Sie hat **Fieber**.</span> | She has a fever. |\n\
        | <span lang=\"de\">Ich fahre mit dem Bus zur **Schule**.</span> | I go to\
        \ school by bus. |\n\n---\n\n#### 6. Nouns in lists and headlines\n\nWhen\
        \ nouns appear in lists, labels, or headlines, the article is often dropped\
        \ for brevity.\n\n<span lang=\"de\">**Sachen**, **Bücher**, **Kleider** —\
        \ alles liegt auf dem Boden.</span>  \n(Things, books, clothes — everything\
        \ is on the floor.)\n\n---\n\n### Summary table\n\n| Context | Example | Translation\
        \ |\n|---|---|---|\n| Uncountable substance (general) | <span lang=\"de\"\
        >Ich esse **Brot**.</span> | I eat bread. |\n| Profession after <span lang=\"\
        de\">sein</span> | <span lang=\"de\">Er ist **Koch**.</span> | He is a cook.\
        \ |\n| Language | <span lang=\"de\">Sie spricht **Französisch**.</span> |\
        \ She speaks French. |\n| City / country name | <span lang=\"de\">Ich liebe\
        \ **Hamburg**.</span> | I love Hamburg. |\n| Fixed expression | <span lang=\"\
        de\">Ich habe **Durst**.</span> | I am thirsty. |\n\n---\n\n### Common learner\
        \ mistakes\n\n**❌ Adding an article to a profession after <span lang=\"de\"\
        >sein</span>:**  \n<span lang=\"de\">~~Sie ist eine Ärztin.~~</span> (without\
        \ a describing adjective)  \n**✓** <span lang=\"de\">Sie ist Ärztin.</span>\n\
        \n**❌ Adding an article to a language name:**  \n<span lang=\"de\">~~Ich spreche\
        \ das Deutsch.~~</span>  \n**✓** <span lang=\"de\">Ich spreche Deutsch.</span>\n\
        \n**❌ Forgetting that uncountable nouns in general statements need no article:**\
        \  \n<span lang=\"de\">~~Ich trinke die Milch gern.~~</span> (if you mean\
        \ milk in general)  \n**✓** <span lang=\"de\">Ich trinke gern Milch.</span>\
        \  \n(But <span lang=\"de\">Ich trinke **die** Milch</span> = I am drinking\
        \ **the** milk [a specific glass you both know about] — that is correct with\
        \ a definite article.)\n\n---\n\n### Key takeaway\n\nThe zero article is not\
        \ random. It follows clear patterns: **general substances, professions/nationalities\
        \ after <span lang=\"de\">sein</span>, languages, proper names, and set phrases**.\
        \ Once you recognise these contexts, you will use the zero article naturally."
      language: en
      why_this_matters: The zero article appears constantly in everyday German — whenever
        you talk about food, drink, jobs, languages, or nationalities. Without this
        rule you will either sound unnatural by adding an article where none belongs,
        or you will misread sentences where the missing article is itself the grammar
        signal.

- code: possessive_article
  cefr_level: A1
  category: artikelwoerter_pronomen
  subcategory: Artikel
  label: Possessivartikel mein/dein/sein/ihr
  description: Possessive articles mein, dein, sein, ihr, Ihr, unser and their inflected
    forms to express ownership or belonging.
  examples:
  - mein/dein/sein/ihr/Ihr Tisch
  - meine/deine/seine/ihre/Ihre Lampe
  - unser Lehrer
  - uns(e)re Lehrerin
  prerequisites:
  - noun_gender
  - indefinite_article
  source_note: 'Possessiv: mein/dein/sein/ihr/Ihr; unser'
  explanations:
    en:
      title: 'Possessive articles: my, your, his, her…'
      tip: Possessive articles replace the definite article to show who something
        belongs to. They take the same endings as the indefinite article <span lang="de">ein/eine/ein</span>,
        so you just swap the stem (<span lang="de">mein-, dein-, sein-</span>, etc.)
        and add the right ending. The ending depends on the gender and case of the
        noun they go with.
      explanation: |-
        ## Possessive articles in German

        ### What they are

        A <span lang="de">Possessivartikel</span> (possessive article) is a word like <span lang="de">mein</span> ('my'), <span lang="de">dein</span> ('your'), <span lang="de">sein</span> ('his/its'), <span lang="de">ihr</span> ('her/their'), <span lang="de">Ihr</span> ('your' — formal), <span lang="de">unser</span> ('our'), or <span lang="de">euer</span> ('your' — plural). They go directly before a noun and show who something belongs to or is connected with.

        ---

        ### Choosing the right stem

        First, pick the stem that matches the *owner* (the person possessing):

        | Owner | Stem | English |
        |---|---|---|
        | <span lang="de">ich</span> | <span lang="de">mein-</span> | my |
        | <span lang="de">du</span> | <span lang="de">dein-</span> | your (singular informal) |
        | <span lang="de">er / es</span> | <span lang="de">sein-</span> | his / its |
        | <span lang="de">sie</span> (she) | <span lang="de">ihr-</span> | her |
        | <span lang="de">wir</span> | <span lang="de">unser-</span> | our |
        | <span lang="de">ihr</span> (you pl.) | <span lang="de">euer-</span> / <span lang="de">eu(e)r-</span> | your (plural informal) |
        | <span lang="de">sie</span> (they) | <span lang="de">ihr-</span> | their |
        | <span lang="de">Sie</span> (formal you) | <span lang="de">Ihr-</span> | your (formal) |

        > **Note:** <span lang="de">ihr</span> (her/their) and <span lang="de">Ihr</span> (formal 'your') look the same except that <span lang="de">Ihr</span> is always capitalised.

        ---

        ### Adding the ending

        Next, add an ending that matches the *noun* the possessive article goes with — specifically its **grammatical gender** (masculine / feminine / neuter) and **case** (Nominative / Accusative / Dative). At A1 level you mainly need Nominative and Accusative.

        The endings are the same as for the indefinite article <span lang="de">ein/eine/ein</span> — simply attach them to the possessive stem.

        #### Nominative (subject of the sentence)

        | | Masculine | Feminine | Neuter | Plural |
        |---|---|---|---|---|
        | <span lang="de">ein-</span> pattern | <span lang="de">-</span> (no ending) | <span lang="de">-e</span> | <span lang="de">-</span> (no ending) | <span lang="de">-e</span> |
        | Example (<span lang="de">mein</span>) | <span lang="de">mein</span> | <span lang="de">meine</span> | <span lang="de">mein</span> | <span lang="de">meine</span> |

        #### Accusative (direct object)

        | | Masculine | Feminine | Neuter | Plural |
        |---|---|---|---|---|
        | ending | <span lang="de">-en</span> | <span lang="de">-e</span> | <span lang="de">-</span> (no ending) | <span lang="de">-e</span> |
        | Example (<span lang="de">mein</span>) | <span lang="de">meinen</span> | <span lang="de">meine</span> | <span lang="de">mein</span> | <span lang="de">meine</span> |

        #### Dative (indirect object — introduced at A1)

        | | Masculine | Feminine | Neuter | Plural |
        |---|---|---|---|---|
        | ending | <span lang="de">-em</span> | <span lang="de">-er</span> | <span lang="de">-em</span> | <span lang="de">-en</span> |
        | Example (<span lang="de">mein</span>) | <span lang="de">meinem</span> | <span lang="de">meiner</span> | <span lang="de">meinem</span> | <span lang="de">meinen</span> |

        ---

        ### Full paradigm for <span lang="de">mein</span>

        All other possessives follow the exact same pattern — just replace <span lang="de">mein-</span> with <span lang="de">dein-, sein-, ihr-</span>, etc.

        | Case | Masculine | Feminine | Neuter | Plural |
        |---|---|---|---|---|
        | Nom. | <span lang="de">mein Bruder</span> | <span lang="de">meine Schwester</span> | <span lang="de">mein Kind</span> | <span lang="de">meine Kinder</span> |
        | Acc. | <span lang="de">meinen Bruder</span> | <span lang="de">meine Schwester</span> | <span lang="de">mein Kind</span> | <span lang="de">meine Kinder</span> |
        | Dat. | <span lang="de">meinem Bruder</span> | <span lang="de">meiner Schwester</span> | <span lang="de">meinem Kind</span> | <span lang="de">meinen Kindern</span> |

        ---

        ### Special notes on <span lang="de">unser</span> and <span lang="de">euer</span>

        - <span lang="de">unser</span> sometimes drops the inner <span lang="de">-e-</span> in speech: <span lang="de">uns(e)re Lehrerin</span>.
        - <span lang="de">euer</span> ('your', plural informal) drops the <span lang="de">-e-</span> before most endings: <span lang="de">euer Hund</span> (nom. masc.) but <span lang="de">eure Katze</span> (nom. fem.), <span lang="de">euren Hund</span> (acc. masc.).

        ---

        ### Examples

        1. <span lang="de">Das ist mein Tisch.</span> — 'That is my table.' (nom. masc.)
        2. <span lang="de">Wie heißt deine Lehrerin?</span> — 'What is your teacher's name?' (nom. fem.)
        3. <span lang="de">Er sucht seinen Schlüssel.</span> — 'He is looking for his key.' (acc. masc.)
        4. <span lang="de">Wir essen in unserem Zimmer.</span> — 'We are eating in our room.' (dat. neut.)
        5. <span lang="de">Ihr Bruder ist sehr nett.</span> — 'Her/Their brother is very nice.' (nom. masc.)
        6. <span lang="de">Haben Sie Ihr Ticket?</span> — 'Do you have your ticket?' (formal, acc. neut.)

        ---

        ### Common learner mistakes

        **Mistake 1: Using the stem without an ending**
        - ✗ <span lang="de">Ich sehe mein Bruder.</span>
        - ✓ <span lang="de">Ich sehe meinen Bruder.</span> (accusative masculine → needs <span lang="de">-en</span>)

        **Mistake 2: Confusing <span lang="de">sein</span> (his) with <span lang="de">ihr</span> (her)**
        - Remember: <span lang="de">sein-</span> refers to a male owner (<span lang="de">er</span>), <span lang="de">ihr-</span> refers to a female owner (<span lang="de">sie</span>). The possessive agrees with the *owner*, not the noun.
        - <span lang="de">Der Mann nimmt seinen Kaffee.</span> — 'The man takes his coffee.'
        - <span lang="de">Die Frau nimmt ihren Kaffee.</span> — 'The woman takes her coffee.'

        **Mistake 3: Capitalising <span lang="de">ihr</span> (her/their) like <span lang="de">Ihr</span> (formal your)**
        - <span lang="de">ihr</span> meaning 'her' or 'their' is lowercase (except at the start of a sentence).
        - <span lang="de">Ihr</span> meaning formal 'your' is always capitalised.

        **Mistake 4: Over-applying <span lang="de">-e</span> to neuter**
        - ✗ <span lang="de">Das ist meine Kind.</span>
        - ✓ <span lang="de">Das ist mein Kind.</span> (nom./acc. neuter → no ending)
      language: en
      why_this_matters: You need possessive articles to talk about people, family,
        belongings, and relationships — some of the most common topics in everyday
        German. Without them you cannot say things like 'my friend', 'his phone',
        or 'our teacher', which come up in almost every conversation.

- code: negative_article_kei
  cefr_level: A1
  category: artikelwoerter_pronomen
  subcategory: Artikel
  label: Negativartikel kein/keine
  description: Negative article kein/keine/kein used to negate nouns, corresponding
    to the indefinite article.
  examples:
  - Er ist kein Lehrer.
  - Sie ist keine Ärztin.
  - Wir haben jetzt keine Zeit.
  prerequisites:
  - indefinite_article
  source_note: 'Negativ: kein'
  explanations:
    en:
      title: Negating nouns with kein/keine
      tip: Use <span lang='de'>kein</span> (not 'not a' or 'not any') to negate a
        noun — it works exactly like the indefinite article <span lang='de'>ein</span>,
        just with a '<span lang='de'>k-</span>' in front. It changes its ending to
        match the noun's gender and grammatical case, just as <span lang='de'>ein/eine/ein</span>
        does.
      explanation: |-
        ## Negating nouns with <span lang='de'>kein / keine / kein</span>

        ### What is <span lang='de'>kein</span>?

        <span lang='de'>Kein</span> is the **negative article** (Negativartikel — the article used to say 'no', 'not a', or 'not any' before a noun). It directly negates a noun rather than the verb or another word (that is the job of <span lang='de'>nicht</span>).

        Think of it as the negative twin of the indefinite article <span lang='de'>ein / eine / ein</span> — wherever you would place <span lang='de'>ein</span>, you can replace it with <span lang='de'>kein</span> to make the meaning negative.

        ---

        ### When to use <span lang='de'>kein</span> vs. <span lang='de'>nicht</span>

        | Situation | Use | Example |
        |---|---|---|
        | Negating a noun with an indefinite article | <span lang='de'>kein</span> | <span lang='de'>Das ist kein Auto.</span> |
        | Negating a noun with no article (zero article) | <span lang='de'>kein</span> | <span lang='de'>Ich habe keine Zeit.</span> |
        | Negating a noun with a definite article | <span lang='de'>nicht</span> | <span lang='de'>Das ist nicht das Auto.</span> |
        | Negating a verb, adjective, or adverb | <span lang='de'>nicht</span> | <span lang='de'>Sie kommt nicht.</span> |

        The key rule: if the noun would take <span lang='de'>ein/eine</span> or **no article at all**, use <span lang='de'>kein</span>.

        ---

        ### Forms of <span lang='de'>kein</span>

        <span lang='de'>Kein</span> follows exactly the same endings as <span lang='de'>ein</span>. At A1, the most important cases are nominative and accusative.

        #### Nominative (subject of the sentence)

        | Gender | Indefinite article | Negative article |
        |---|---|---|
        | Masculine (<span lang='de'>der</span>) | <span lang='de'>ein</span> | <span lang='de'>kein</span> |
        | Feminine (<span lang='de'>die</span>) | <span lang='de'>eine</span> | <span lang='de'>keine</span> |
        | Neuter (<span lang='de'>das</span>) | <span lang='de'>ein</span> | <span lang='de'>kein</span> |
        | Plural (<span lang='de'>die</span>) | <span lang='de'>—</span> (no article) | <span lang='de'>keine</span> |

        #### Accusative (direct object of the sentence)

        | Gender | Indefinite article | Negative article |
        |---|---|---|
        | Masculine (<span lang='de'>der</span>) | <span lang='de'>einen</span> | <span lang='de'>keinen</span> |
        | Feminine (<span lang='de'>die</span>) | <span lang='de'>eine</span> | <span lang='de'>keine</span> |
        | Neuter (<span lang='de'>das</span>) | <span lang='de'>ein</span> | <span lang='de'>kein</span> |
        | Plural (<span lang='de'>die</span>) | <span lang='de'>—</span> (no article) | <span lang='de'>keine</span> |

        #### Dative (indirect object — for reference)

        | Gender | Negative article |
        |---|---|
        | Masculine | <span lang='de'>keinem</span> |
        | Feminine | <span lang='de'>keiner</span> |
        | Neuter | <span lang='de'>keinem</span> |
        | Plural | <span lang='de'>keinen</span> |

        ---

        ### Examples with English translations

        1. <span lang='de'>Er ist kein Lehrer.</span> — He is not a teacher. *(masculine, nominative)*
        2. <span lang='de'>Sie ist keine Ärztin.</span> — She is not a doctor. *(feminine, nominative)*
        3. <span lang='de'>Das ist kein Problem.</span> — That is not a problem. *(neuter, nominative)*
        4. <span lang='de'>Wir haben jetzt keine Zeit.</span> — We have no time now. *(feminine, accusative — zero-article noun negated)*
        5. <span lang='de'>Ich habe keinen Hunger.</span> — I am not hungry. / I have no hunger. *(masculine, accusative)*
        6. <span lang='de'>Hier sind keine Stühle.</span> — There are no chairs here. *(plural, nominative)*

        ---

        ### Common learner mistakes

        **Mistake 1: Using <span lang='de'>nicht ein</span> instead of <span lang='de'>kein</span>**

        ❌ <span lang='de'>Das ist nicht ein Hund.</span>
        ✅ <span lang='de'>Das ist kein Hund.</span> — That is not a dog.

        In German, <span lang='de'>nicht ein</span> is not used to negate nouns with the indefinite article. Always replace <span lang='de'>ein</span> with <span lang='de'>kein</span>.

        **Mistake 2: Using <span lang='de'>nicht</span> with zero-article nouns**

        ❌ <span lang='de'>Ich habe nicht Zeit.</span>
        ✅ <span lang='de'>Ich habe keine Zeit.</span> — I have no time.

        When a noun has no article (time, money, abstract nouns, plurals), use <span lang='de'>kein/keine</span>, not <span lang='de'>nicht</span>.

        **Mistake 3: Wrong ending (forgetting the accusative masculine <span lang='de'>-en</span>)**

        ❌ <span lang='de'>Ich habe kein Bruder.</span>
        ✅ <span lang='de'>Ich habe keinen Bruder.</span> — I have no brother.

        <span lang='de'>Bruder</span> is masculine and the direct object, so accusative requires the ending <span lang='de'>-en</span>: <span lang='de'>keinen</span>.

        ---

        ### Quick memory trick

        Just put a <span lang='de'>k-</span> in front of <span lang='de'>ein/eine/ein</span> and keep the same ending. If there is no article at all, ask yourself: which gender is this noun? Then use the matching <span lang='de'>kein / keine / kein</span> form.
      language: en
      why_this_matters: Without <span lang='de'>kein</span>, you cannot say things
        like 'I have no time', 'He is not a teacher', or 'There is no problem' — all
        extremely common in everyday German. This is one of the most frequently used
        words in German, so mastering it early gives you enormous expressive power
        right away.

- code: indef_pronoun_man
  cefr_level: A1
  category: artikelwoerter_pronomen
  subcategory: Pronomen
  label: Indefinitpronomen man
  description: Indefinite pronoun man used to refer to people in general without specifying
    who.
  examples:
  - Kann man hier Fahrkarten kaufen?
  source_note: 'Indefinit: man'
  explanations:
    en:
      title: Using 'man' for general statements
      tip: The word <span lang="de">man</span> means 'one', 'you', 'we', or 'people
        in general' — it refers to no specific person. It always takes a third-person
        singular verb form, the same form you use with <span lang="de">er/sie/es</span>.
      explanation: |-
        ## The indefinite pronoun <span lang="de">man</span>

        ### What it means

        <span lang="de">Man</span> is an indefinite pronoun used to make general statements about people without naming anyone specific. In English, it most closely matches 'one', but in everyday speech it is usually best translated as 'you', 'we', 'they', or 'people'.

        > <span lang="de">Man</span> does **not** mean 'a man' (<span lang="de">ein Mann</span>). The pronoun is always written with a lowercase <span lang="de">m</span>.

        ---

        ### Formation

        <span lang="de">Man</span> is always the **subject** of the sentence (nominative case). It always uses the **third-person singular** verb form — exactly the same ending as <span lang="de">er</span> (he), <span lang="de">sie</span> (she), or <span lang="de">es</span> (it).

        | Subject pronoun | Verb form (<span lang="de">kaufen</span>) |
        |---|---|
        | <span lang="de">ich</span> | <span lang="de">kaufe</span> |
        | <span lang="de">du</span> | <span lang="de">kaufst</span> |
        | <span lang="de">er / sie / es / **man**</span> | <span lang="de">**kauft**</span> |

        ---

        ### Common uses

        **1. Signs and instructions**

        Public signs and written instructions often use <span lang="de">man</span> to address people in general.

        - <span lang="de">Hier zahlt man mit Karte.</span> — 'You pay by card here.'
        - <span lang="de">Man darf hier nicht parken.</span> — 'You are not allowed to park here.'

        **2. General facts or customs**

        - <span lang="de">In Deutschland trinkt man viel Kaffee.</span> — 'In Germany, people drink a lot of coffee.'
        - <span lang="de">Man lernt nie aus.</span> — 'You never stop learning.' / 'One never stops learning.'

        **3. Polite questions**

        <span lang="de">Man</span> is often used to ask politely about what is possible or allowed.

        - <span lang="de">Kann man hier Fahrkarten kaufen?</span> — 'Can one buy tickets here?' / 'Is it possible to buy tickets here?'
        - <span lang="de">Wie schreibt man das?</span> — 'How do you write that?'

        **4. With modal verbs**

        <span lang="de">Man</span> combines naturally with modal verbs like <span lang="de">können</span>, <span lang="de">müssen</span>, <span lang="de">dürfen</span>, and <span lang="de">sollen</span>.

        - <span lang="de">Hier muss man leise sein.</span> — 'You have to be quiet here.'
        - <span lang="de">Man soll täglich Wasser trinken.</span> — 'One should drink water every day.'

        ---

        ### More examples with translations

        | German | English |
        |---|---|
        | <span lang="de">Wie sagt man das auf Deutsch?</span> | 'How do you say that in German?' |
        | <span lang="de">Man kann hier gut essen.</span> | 'You can eat well here.' |
        | <span lang="de">Hier darf man nicht rauchen.</span> | 'You are not allowed to smoke here.' |
        | <span lang="de">Man braucht ein Ticket.</span> | 'You need a ticket.' |
        | <span lang="de">Was macht man hier?</span> | 'What do people do here?' |

        ---

        ### Important note: <span lang="de">man</span> is only nominative

        <span lang="de">Man</span> is only used as the **subject** of a sentence. It has no accusative or dative form that learners need at A1 level. If you need a general pronoun in the accusative or dative, this is an advanced topic covered later.

        ---

        ### Common learner mistakes

        **❌ Confusing <span lang="de">man</span> with <span lang="de">Mann</span>**

        - ❌ <span lang="de">Der Man arbeitet hier.</span>
        - ✅ <span lang="de">Der Mann arbeitet hier.</span> — 'The man works here.'
        - ✅ <span lang="de">Man arbeitet hier.</span> — 'People work here.'

        <span lang="de">Mann</span> (with double <span lang="de">n</span>) is a noun meaning 'man' or 'husband'. <span lang="de">Man</span> (single <span lang="de">n</span>) is the pronoun.

        **❌ Using the wrong verb form**

        - ❌ <span lang="de">Man kaufen Tickets hier.</span>
        - ✅ <span lang="de">Man kauft Tickets hier.</span> — 'You buy tickets here.'

        Always use the third-person singular ending with <span lang="de">man</span>.

        **❌ Capitalising <span lang="de">man</span>**

        - ❌ <span lang="de">Man kann hier essen.</span> (at the start of a sentence — this is actually correct!)
        - ❌ <span lang="de">Hier kann Man essen.</span> — incorrect in the middle of a sentence
        - ✅ <span lang="de">Hier kann man essen.</span>

        Only capitalise <span lang="de">man</span> when it begins a sentence, as with any German word.
      language: en
      why_this_matters: <span lang="de">Man</span> appears constantly in everyday
        German — on signs, in instructions, and in polite conversation. Without it,
        you cannot make general statements like 'You can pay here' or 'People say
        that' in a natural German way.

- code: indef_pronoun_etwas
  cefr_level: A1
  category: artikelwoerter_pronomen
  subcategory: Pronomen
  label: Indefinitpronomen etwas/nichts/mehr/alles/welch-
  description: Indefinite pronouns etwas, nichts, mehr, alles, and welch- used for
    unspecified quantities or amounts.
  examples:
  - Möchten Sie etwas trinken?
  - Ich esse jetzt nichts.
  - Möchten Sie noch mehr?
  - Er versteht alles.
  - Ich habe keine Milch mehr. Hast du welche?
  source_note: 'Indefinit: etwas, nichts, mehr, alles, welch-'
  explanations:
    en:
      title: 'Indefinite pronouns: etwas, nichts, mehr, alles, welch-'
      tip: These pronouns stand in for unspecified things or amounts without naming
        them directly. They never change their form — except <span lang="de">welch-</span>,
        which takes a short ending to match the noun it replaces. Use them wherever
        you would say 'something', 'nothing', 'more', 'everything', or 'some' in English.
      explanation: |-
        ## Indefinite pronouns: <span lang="de">etwas, nichts, mehr, alles, welch-</span>

        ### What are they?

        Indefinite pronouns refer to things or quantities without identifying them specifically. The five pronouns in this group each cover a distinct meaning:

        | German | English equivalent |
        |---|---|
        | <span lang="de">etwas</span> | something / anything / a little |
        | <span lang="de">nichts</span> | nothing / not anything |
        | <span lang="de">mehr</span> | more |
        | <span lang="de">alles</span> | everything / all |
        | <span lang="de">welch-</span> | some / any (replacing a countable noun) |

        ---

        ### <span lang="de">etwas</span> — 'something / anything'

        <span lang="de">Etwas</span> is **uninflected** — its form never changes regardless of case or context.

        It can be:
        - the **subject** of a sentence: <span lang="de">Etwas stimmt nicht.</span> (Something is wrong.)
        - the **direct object**: <span lang="de">Ich möchte etwas essen.</span> (I would like to eat something.)
        - used in questions: <span lang="de">Möchten Sie etwas trinken?</span> (Would you like something to drink?)
        - used to mean 'a little' before adjectives or adverbs: <span lang="de">Das ist etwas teuer.</span> (That is a little expensive.)

        ---

        ### <span lang="de">nichts</span> — 'nothing / not anything'

        <span lang="de">Nichts</span> is also **uninflected**. It is the direct negative of <span lang="de">etwas</span>.

        Important: <span lang="de">nichts</span> is itself a negation. Do **not** combine it with <span lang="de">nicht</span> — that would be a double negative.

        - <span lang="de">Ich esse jetzt nichts.</span> (I'm not eating anything now. / I'm eating nothing now.)
        - <span lang="de">Er sagt nichts.</span> (He says nothing.)
        - <span lang="de">Das bedeutet nichts.</span> (That means nothing.)

        ---

        ### <span lang="de">mehr</span> — 'more'

        <span lang="de">Mehr</span> is **uninflected** as a pronoun. It expresses an additional, unspecified quantity.

        - <span lang="de">Möchten Sie noch mehr?</span> (Would you like some more?)
        - <span lang="de">Ich brauche mehr.</span> (I need more.)

        Note: <span lang="de">mehr</span> also appears in negative expressions: <span lang="de">nicht mehr</span> (no longer / not any more) and <span lang="de">kein/keine ... mehr</span> (no more ...).

        - <span lang="de">Ich habe keine Milch mehr.</span> (I have no more milk. / I don't have any milk left.)
        - <span lang="de">Er kommt nicht mehr.</span> (He is not coming any more.)

        ---

        ### <span lang="de">alles</span> — 'everything / all'

        <span lang="de">Alles</span> is **uninflected** and refers to the totality of things.

        - <span lang="de">Er versteht alles.</span> (He understands everything.)
        - <span lang="de">Alles ist gut.</span> (Everything is fine.)
        - <span lang="de">Ich mache alles.</span> (I'll do everything.)

        ---

        ### <span lang="de">welch-</span> — 'some / any' (replacing a noun)

        Unlike the others, <span lang="de">welch-</span> **inflects** — it takes an ending to agree with the gender and case of the noun it replaces. At A1 level the most common forms are nominative and accusative.

        Think of it as answering the question 'Do you have any?' when the specific noun has already been mentioned and doesn't need to be repeated.

        **Common forms (nominative / accusative):**

        | Gender of replaced noun | Form |
        |---|---|
        | masculine (<span lang="de">der</span>) | <span lang="de">welcher</span> |
        | feminine (<span lang="de">die</span>) | <span lang="de">welche</span> |
        | neuter (<span lang="de">das</span>) | <span lang="de">welches</span> |
        | plural (<span lang="de">die</span>) | <span lang="de">welche</span> |

        Examples:
        - <span lang="de">Ich habe keine Milch mehr. Hast du welche?</span> (I have no more milk. Do you have any?) — <span lang="de">Milch</span> is feminine, so <span lang="de">welche</span>.
        - <span lang="de">Ich brauche Zucker. Hast du welchen?</span> (I need sugar. Do you have any?) — <span lang="de">Zucker</span> is masculine accusative, so <span lang="de">welchen</span>.
        - <span lang="de">Wir haben kein Brot. Kaufst du welches?</span> (We have no bread. Are you buying any?) — <span lang="de">Brot</span> is neuter, so <span lang="de">welches</span>.

        ---

        ### Examples with English translations

        1. <span lang="de">Möchten Sie etwas trinken?</span> — Would you like something to drink?
        2. <span lang="de">Ich esse jetzt nichts.</span> — I'm not eating anything right now.
        3. <span lang="de">Möchten Sie noch mehr?</span> — Would you like some more?
        4. <span lang="de">Er versteht alles.</span> — He understands everything.
        5. <span lang="de">Ich habe keine Milch mehr. Hast du welche?</span> — I have no more milk. Do you have any?
        6. <span lang="de">Alles ist fertig.</span> — Everything is ready.

        ---

        ### Common learner mistakes

        **1. Double negation with <span lang="de">nichts</span>**

        ❌ <span lang="de">Ich sage nicht nichts.</span>
        ✅ <span lang="de">Ich sage nichts.</span> — <span lang="de">nichts</span> is already negative; adding <span lang="de">nicht</span> is wrong.

        **2. Forgetting to inflect <span lang="de">welch-</span>**

        ❌ <span lang="de">Ich brauche Zucker. Hast du welche?</span> (wrong gender ending)
        ✅ <span lang="de">Ich brauche Zucker. Hast du welchen?</span> (<span lang="de">Zucker</span> is masculine → accusative → <span lang="de">welchen</span>)

        **3. Confusing <span lang="de">mehr</span> as a pronoun vs. in negation**

        <span lang="de">Mehr</span> alone means 'more'. In the phrase <span lang="de">nicht mehr</span> or <span lang="de">keine/kein ... mehr</span> it means 'no longer' or 'no more' — the meaning shifts depending on context.

        **4. Trying to inflect <span lang="de">etwas</span>, <span lang="de">nichts</span>, <span lang="de">alles</span>, or <span lang="de">mehr</span>**

        These four are always invariable. Never add endings to them.
      language: en
      why_this_matters: You will hear and need these words in almost every German
        conversation — ordering food, shopping, asking for help, or saying you don't
        want anything. Without them you cannot make basic requests or refusals, so
        mastering them early gives you a huge practical boost.

- code: personal_pronoun_nom
  cefr_level: A1
  category: artikelwoerter_pronomen
  subcategory: Pronomen
  label: Personalpronomen im Nominativ
  description: Personal pronouns in the nominative case (ich, du, er, sie, es, wir,
    ihr, sie, Sie) used as subjects.
  examples:
  - Ich gehe jetzt.
  - Wer ist da?
  source_note: Personalpronomen im Nominativ
  explanations:
    en:
      title: Personal pronouns in the nominative case
      tip: Nominative personal pronouns are the 'subject' pronouns — they name who
        is doing the action. In German, every sentence needs a subject, and these
        pronouns stand in for people or things when you don't repeat the noun.
      explanation: |-
        ## Personal Pronouns in the Nominative Case

        ### What is the nominative case?

        The **nominative case** is used for the **subject** of a sentence — the person or thing that performs the action of the verb. In <span lang="de">Ich gehe.</span> ('I go'), <span lang="de">ich</span> is the subject and therefore stands in the nominative case.

        ---

        ### The full nominative pronoun table

        | Person | Singular | English | Plural | English |
        |---|---|---|---|---|
        | 1st | <span lang="de">ich</span> | I | <span lang="de">wir</span> | we |
        | 2nd (informal) | <span lang="de">du</span> | you | <span lang="de">ihr</span> | you (plural) |
        | 3rd masc. | <span lang="de">er</span> | he / it | <span lang="de">sie</span> | they |
        | 3rd fem. | <span lang="de">sie</span> | she / it | <span lang="de">sie</span> | they |
        | 3rd neut. | <span lang="de">es</span> | it | <span lang="de">sie</span> | they |
        | 2nd (formal) | <span lang="de">Sie</span> | you (formal) | <span lang="de">Sie</span> | you (formal pl.) |

        > **Note:** The formal <span lang="de">Sie</span> is always written with a capital **S**, even in the middle of a sentence. All other pronouns are lower-case.

        ---

        ### Formation and use

        Nominative pronouns are used:

        1. **As the subject of a verb** — the doer of the action.
        2. **After the verb <span lang="de">sein</span>** (to be) — because <span lang="de">sein</span> links the subject to a description or identity (nominative complement).

        They replace nouns once the noun is already known:
        - <span lang="de">Das ist Maria. **Sie** kommt aus Berlin.</span> — 'That is Maria. **She** comes from Berlin.'

        ---

        ### Examples

        | German | English |
        |---|---|
        | <span lang="de">Ich heiße Tom.</span> | I am called Tom. |
        | <span lang="de">Du bist sehr nett.</span> | You are very kind. |
        | <span lang="de">Er wohnt in Hamburg.</span> | He lives in Hamburg. |
        | <span lang="de">Sie arbeitet heute nicht.</span> | She is not working today. |
        | <span lang="de">Wir lernen Deutsch.</span> | We are learning German. |
        | <span lang="de">Sie kommen um acht Uhr.</span> | They come at eight o'clock. |
        | <span lang="de">Sind Sie Herr Müller?</span> | Are you Mr Müller? (formal) |

        ---

        ### Special note: <span lang="de">er</span>, <span lang="de">sie</span>, <span lang="de">es</span> for things

        In German, every noun has a grammatical gender: masculine (<span lang="de">der</span>), feminine (<span lang="de">die</span>), or neuter (<span lang="de">das</span>). When you replace a noun with a pronoun, you must match its **grammatical gender**, not natural gender.

        - <span lang="de">Der Tisch</span> (the table, masc.) → <span lang="de">**Er** ist groß.</span> ('It is big.')
        - <span lang="de">Die Lampe</span> (the lamp, fem.) → <span lang="de">**Sie** ist neu.</span> ('It is new.')
        - <span lang="de">Das Buch</span> (the book, neut.) → <span lang="de">**Es** ist interessant.</span> ('It is interesting.')

        This is a common source of errors for English speakers, who use 'it' for all objects.

        ---

        ### <span lang="de">sie</span> vs. <span lang="de">Sie</span>

        Three forms look identical but mean different things:

        | Form | Meaning | Clue |
        |---|---|---|
        | <span lang="de">sie</span> (lower-case, sg.) | she | verb in 3rd person singular |
        | <span lang="de">sie</span> (lower-case, pl.) | they | verb in 3rd person plural |
        | <span lang="de">Sie</span> (capital, sg./pl.) | you (formal) | always capital S; verb same form as plural <span lang="de">sie</span> |

        Example contrast:
        - <span lang="de">**Sie** wohnt in Köln.</span> — She lives in Cologne.
        - <span lang="de">**Sie** wohnen in Köln.</span> — They live in Cologne. / You live in Cologne. (formal)

        Context usually makes the meaning clear.

        ---

        ### Common learner mistakes

        **1. Leaving out the subject pronoun**

        Unlike Spanish or Italian, German does **not** allow you to drop the subject pronoun.

        - ❌ <span lang="de">Bin müde.</span>
        - ✅ <span lang="de">Ich bin müde.</span> — 'I am tired.'

        **2. Using 'es' for all things**

        English speakers say 'it' for all objects, but German uses <span lang="de">er</span>, <span lang="de">sie</span>, or <span lang="de">es</span> based on the noun's gender.

        - ❌ <span lang="de">Der Stuhl ist alt. Es ist kaputt.</span>
        - ✅ <span lang="de">Der Stuhl ist alt. **Er** ist kaputt.</span> — 'The chair is old. It is broken.'

        **3. Forgetting to capitalise <span lang="de">Sie</span> (formal)**

        - ❌ <span lang="de">Woher kommen sie?</span> (ambiguous or means 'Where do they come from?')
        - ✅ <span lang="de">Woher kommen **Sie**?</span> — 'Where do you come from?' (formal)

        **4. Confusing <span lang="de">ihr</span> (you plural, nominative) with <span lang="de">ihr</span> (her/their, possessive)**

        - <span lang="de">**Ihr** kommt morgen.</span> — **You** (plural) are coming tomorrow. (pronoun, subject)
        - <span lang="de">Das ist **ihr** Buch.</span> — That is **her** book. (possessive article)

        The role in the sentence tells you which <span lang="de">ihr</span> it is.
      language: en
      why_this_matters: You will use these pronouns in almost every German sentence
        you speak or write. Without them, you cannot say 'I go', 'she works', or 'we
        live here' — they are the foundation of all basic conversation.

- code: personal_pronoun_acc
  cefr_level: A1
  category: artikelwoerter_pronomen
  subcategory: Pronomen
  label: Personalpronomen im Akkusativ
  description: 'Personal pronouns in the accusative case: mich, dich, ihn, sie, es,
    used as direct objects.'
  examples:
  - Ich liebe dich/ihn/sie.
  prerequisites:
  - personal_pronoun_nom
  - accusative_case
  source_note: 'Akkusativ: mich/dich/ihn/sie/es'
  explanations:
    en:
      title: Personal pronouns in the accusative case
      tip: When a person or thing is the direct object of a verb — the one receiving
        the action — you use the accusative form of the pronoun. In German, these
        forms are different from the subject (nominative) forms, so you need to learn
        the new set.
      explanation: |-
        ## Personal pronouns in the accusative case

        ### What is the accusative case?

        In German, nouns and pronouns change their form depending on their role in the sentence. The **accusative case** marks the **direct object** — the person or thing that directly receives the action of the verb.

        - Subject (nominative): <span lang="de">**Ich** liebe dich.</span> → *I* love you. (<span lang="de">ich</span> is doing the loving)
        - Direct object (accusative): <span lang="de">Ich liebe **dich**.</span> → I love *you*. (<span lang="de">dich</span> is receiving the love)

        ---

        ### The accusative pronoun forms

        | Nominative (subject) | Accusative (direct object) | English |
        |---|---|---|
        | <span lang="de">ich</span> | <span lang="de">**mich**</span> | me |
        | <span lang="de">du</span> | <span lang="de">**dich**</span> | you (singular informal) |
        | <span lang="de">er</span> | <span lang="de">**ihn**</span> | him / it (masc.) |
        | <span lang="de">sie</span> | <span lang="de">**sie**</span> | her / it (fem.) |
        | <span lang="de">es</span> | <span lang="de">**es**</span> | it (neut.) |
        | <span lang="de">wir</span> | <span lang="de">**uns**</span> | us |
        | <span lang="de">ihr</span> | <span lang="de">**euch**</span> | you (plural informal) |
        | <span lang="de">sie</span> | <span lang="de">**sie**</span> | them |
        | <span lang="de">Sie</span> | <span lang="de">**Sie**</span> | you (formal) |

        > **Key pattern:** Only three forms actually change: <span lang="de">ich → mich</span>, <span lang="de">du → dich</span>, and <span lang="de">er → ihn</span>. All other pronouns look the same in nominative and accusative.

        ---

        ### Formation: how to use accusative pronouns

        Accusative pronouns replace a noun that is the **direct object** of the verb. To find the direct object, ask: *Who or what is the verb acting on?*

        **Step 1:** Find the verb and its subject.
        **Step 2:** Ask 'Whom? / What?' after the verb.
        **Step 3:** Replace the direct object noun with the matching accusative pronoun.

        <span lang="de">Ich sehe den Mann.</span> → *I see the man.*
        → <span lang="de">Ich sehe **ihn**.</span> → *I see him.* (masculine noun → <span lang="de">ihn</span>)

        <span lang="de">Er kennt die Frau.</span> → *He knows the woman.*
        → <span lang="de">Er kennt **sie**.</span> → *He knows her.* (feminine noun → <span lang="de">sie</span>)

        ---

        ### Examples

        | German | English |
        |---|---|
        | <span lang="de">Liebst du **mich**?</span> | Do you love me? |
        | <span lang="de">Ich liebe **dich**.</span> | I love you. |
        | <span lang="de">Siehst du den Hund? Ja, ich sehe **ihn**.</span> | Do you see the dog? Yes, I see it/him. |
        | <span lang="de">Wo ist die Tasche? Ich habe **sie**.</span> | Where is the bag? I have it. |
        | <span lang="de">Das Kind — kennst du **es**?</span> | The child — do you know it? |
        | <span lang="de">Wir brauchen **euch**.</span> | We need you (all). |

        ---

        ### Important: <span lang="de">sie</span> can mean several things

        <span lang="de">sie</span> (lowercase) in the accusative can mean:
        - *her* (referring to a feminine noun or a woman)
        - *them* (referring to a plural noun or group of people)

        Context and the verb ending usually make the meaning clear:

        <span lang="de">Ich sehe **sie**.</span>
        - = *I see her.* (one woman/feminine thing)
        - = *I see them.* (multiple people/things)

        <span lang="de">Sie</span> (uppercase) = formal *you* — always capitalised.

        ---

        ### Pronoun gender follows noun gender, not natural gender

        In German, the pronoun you use must match the **grammatical gender** of the noun it replaces, not the biological sex of the object.

        - <span lang="de">der Wagen</span> (the car, masculine) → <span lang="de">Ich kaufe **ihn**.</span> (*I buy it/him.*)
        - <span lang="de">die Lampe</span> (the lamp, feminine) → <span lang="de">Ich kaufe **sie**.</span> (*I buy it/her.*)
        - <span lang="de">das Buch</span> (the book, neuter) → <span lang="de">Ich lese **es**.</span> (*I read it.*)

        This is why knowing noun genders (covered in <span lang="de">Genus der Nomen</span>) is so important — it directly affects which pronoun you choose.

        ---

        ### Common learner mistakes

        **Mistake 1:** Using the nominative instead of the accusative.

        ❌ <span lang="de">Ich liebe *er*.</span>
        ✅ <span lang="de">Ich liebe **ihn**.</span> — *I love him.*

        **Mistake 2:** Using <span lang="de">sie</span> for a masculine noun.

        ❌ <span lang="de">Der Hund ist süß. Ich liebe *sie*.</span>
        ✅ <span lang="de">Der Hund ist süß. Ich liebe **ihn**.</span> — *The dog is cute. I love him/it.*

        **Mistake 3:** Confusing <span lang="de">ihr</span> (nominative, 'you plural') with <span lang="de">euch</span> (accusative, 'you plural').

        ❌ <span lang="de">Ich sehe *ihr*.</span>
        ✅ <span lang="de">Ich sehe **euch**.</span> — *I see you (all).*

        ---

        ### Quick-reference: the three forms that change

        | Nominative | Accusative | Memory tip |
        |---|---|---|
        | <span lang="de">ich</span> | <span lang="de">mich</span> | Both end in <span lang="de">-ch</span> |
        | <span lang="de">du</span> | <span lang="de">dich</span> | Both start with <span lang="de">d-</span>, accusative adds <span lang="de">-ich</span> |
        | <span lang="de">er</span> | <span lang="de">ihn</span> | Completely different — must memorise |

        All other pronouns look the same in both cases.
      language: en
      why_this_matters: Almost every sentence with a verb like <span lang="de">lieben</span>,
        <span lang="de">sehen</span>, <span lang="de">haben</span>, or <span lang="de">kennen</span>
        needs a direct object, and pronouns are among the most common direct objects.
        Without accusative pronouns you cannot say 'I love you', 'She knows him',
        or 'Do you see me?' — some of the most basic things people say to each other.

- code: personal_pronoun_dat
  cefr_level: A1
  category: artikelwoerter_pronomen
  subcategory: Pronomen
  label: Personalpronomen im Dativ
  description: Dative personal pronouns mir, dir, euch, Ihnen used with specific dative
    verbs such as danken, gehören, helfen, and in the expression es geht.
  examples:
  - Ich danke Ihnen sehr.
  - Es geht mir gut.
  - Kann ich dir helfen?
  prerequisites:
  - personal_pronoun_nom
  - dative_case
  source_note: 'Dativ bei den Verben: danken/gehören/helfen/es geht/mir/dir/euch/Ihnen'
  explanations:
    en:
      title: Dative personal pronouns
      tip: In German, some verbs always require their object in the dative case, and
        personal pronouns must change form to match. Instead of 'ich' or 'du', you
        use special dative forms like 'mir' and 'dir'.
      explanation: |-
        ## Dative Personal Pronouns

        ### What is the dative case?

        The **dative case** marks the indirect object of a sentence — typically the person or thing that *receives* something or *benefits from* an action. In English this is often expressed with 'to' or 'for': *I'm giving the book **to her***.  In German, this relationship is shown by changing the form of the pronoun itself.

        ---

        ### The full pronoun table

        Here are all German personal pronouns in the nominative and dative cases:

        | Person | Nominative (subject) | Dative (indirect object) |
        |---|---|---|
        | 1st sg. | <span lang="de">ich</span> (I) | <span lang="de">mir</span> (me / to me) |
        | 2nd sg. informal | <span lang="de">du</span> (you) | <span lang="de">dir</span> (you / to you) |
        | 3rd sg. masc. | <span lang="de">er</span> (he) | <span lang="de">ihm</span> (him / to him) |
        | 3rd sg. fem. | <span lang="de">sie</span> (she) | <span lang="de">ihr</span> (her / to her) |
        | 3rd sg. neut. | <span lang="de">es</span> (it) | <span lang="de">ihm</span> (it / to it) |
        | 1st pl. | <span lang="de">wir</span> (we) | <span lang="de">uns</span> (us / to us) |
        | 2nd pl. informal | <span lang="de">ihr</span> (you all) | <span lang="de">euch</span> (you all / to you all) |
        | 3rd pl. / 3rd sg. formal | <span lang="de">sie / Sie</span> (they / you) | <span lang="de">ihnen / Ihnen</span> (them/you / to them/you) |

        > **Note:** The formal 'you' <span lang="de">Ihnen</span> is always capitalised, even in the middle of a sentence. This helps you spot it immediately.

        ---

        ### Which verbs take the dative?

        A core set of very common German verbs always takes a dative object. At A1 level you need to know these in particular:

        | Verb | Meaning | Example |
        |---|---|---|
        | <span lang="de">danken</span> | to thank | <span lang="de">Ich danke **dir**.</span> |
        | <span lang="de">helfen</span> | to help | <span lang="de">Er hilft **mir**.</span> |
        | <span lang="de">gehören</span> | to belong to | <span lang="de">Das gehört **ihr**.</span> |
        | <span lang="de">gefallen</span> | to please / to like | <span lang="de">Das gefällt **mir**.</span> |
        | <span lang="de">passen</span> | to suit / to fit | <span lang="de">Das passt **mir** nicht.</span> |
        | <span lang="de">schmecken</span> | to taste good (to) | <span lang="de">Das schmeckt **ihm**.</span> |

        These verbs do **not** take an accusative object in German, even though their English translations might suggest otherwise. You must always use the dative pronoun with them.

        ---

        ### The fixed expression: <span lang="de">Es geht + dative</span>

        One of the most important dative expressions at A1 is the phrase <span lang="de">es geht + dative pronoun</span>, used to talk about how someone is doing:

        - <span lang="de">Es geht **mir** gut.</span> — I'm doing well.
        - <span lang="de">Es geht **dir** nicht gut.</span> — You're not doing well.
        - <span lang="de">Wie geht es **Ihnen**?</span> — How are you? (formal)
        - <span lang="de">Wie geht es **euch**?</span> — How are you all? (informal plural)

        This phrase is fixed — the verb is always <span lang="de">geht</span> and the subject is always <span lang="de">es</span>. Only the dative pronoun changes.

        ---

        ### More example sentences

        1. <span lang="de">Ich danke Ihnen sehr.</span> — Thank you very much. (formal)
        2. <span lang="de">Kann ich dir helfen?</span> — Can I help you? (informal)
        3. <span lang="de">Das Buch gehört mir.</span> — The book belongs to me.
        4. <span lang="de">Wie geht es euch?</span> — How are you all doing?
        5. <span lang="de">Das gefällt mir nicht.</span> — I don't like that. (literally: That doesn't please me.)
        6. <span lang="de">Kann sie uns helfen?</span> — Can she help us?

        ---

        ### Common learner mistakes

        **Mistake 1: Using the nominative instead of the dative**

        > ✗ <span lang="de">Es geht ich gut.</span>
        > ✓ <span lang="de">Es geht **mir** gut.</span>

        The subject of this sentence is <span lang="de">es</span>, not <span lang="de">ich</span>. The person being described is in the dative.

        **Mistake 2: Using the accusative instead of the dative**

        > ✗ <span lang="de">Kann ich dich helfen?</span>
        > ✓ <span lang="de">Kann ich **dir** helfen?</span>

        <span lang="de">Helfen</span> always takes the dative, never the accusative. <span lang="de">Dich</span> is accusative; the correct dative form is <span lang="de">dir</span>.

        **Mistake 3: Confusing <span lang="de">ihr</span> (dative of 'she') with <span lang="de">ihr</span> (nominative 'you all') or possessive <span lang="de">ihr</span>**

        The form <span lang="de">ihr</span> appears in several different roles in German. Context — especially the verb form — tells you which one it is:

        - <span lang="de">Das gehört **ihr**.</span> — It belongs to **her**. (dative of <span lang="de">sie</span>)
        - <span lang="de">**Ihr** seid müde.</span> — **You all** are tired. (nominative pronoun)
        - <span lang="de">Das ist **ihr** Buch.</span> — That is **her** book. (possessive article)

        **Mistake 4: Forgetting the capital letter on <span lang="de">Ihnen</span>**

        > ✗ <span lang="de">Ich danke ihnen.</span> (= I thank them)
        > ✓ <span lang="de">Ich danke **Ihnen**.</span> (= I thank you — formal)

        The capital letter is the only visual difference between the formal 'you' and 'them' in the dative. Always capitalise <span lang="de">Ihnen</span> when addressing someone formally.

        ---

        ### Quick-reference summary

        | Nominative | Dative |
        |---|---|
        | <span lang="de">ich</span> | <span lang="de">**mir**</span> |
        | <span lang="de">du</span> | <span lang="de">**dir**</span> |
        | <span lang="de">er</span> | <span lang="de">**ihm**</span> |
        | <span lang="de">sie</span> (she) | <span lang="de">**ihr**</span> |
        | <span lang="de">es</span> | <span lang="de">**ihm**</span> |
        | <span lang="de">wir</span> | <span lang="de">**uns**</span> |
        | <span lang="de">ihr</span> | <span lang="de">**euch**</span> |
        | <span lang="de">sie</span> (they) | <span lang="de">**ihnen**</span> |
        | <span lang="de">Sie</span> (formal) | <span lang="de">**Ihnen**</span> |
      language: en
      why_this_matters: Dative pronouns appear in some of the most common everyday
        phrases in German — 'Es geht mir gut' and 'Kann ich dir helfen?' are things
        you will say and hear from day one. Without these forms, you cannot express
        how you are feeling or offer help to someone.

- code: reciprocal_pronoun
  cefr_level: A1
  category: artikelwoerter_pronomen
  subcategory: Pronomen
  label: Reziprokpronomen sich/uns
  description: Reciprocal pronouns sich and uns used to express mutual actions.
  examples:
  - Wir sehen uns morgen.
  source_note: 'Reziprokpronomen: sich/uns'
  explanations:
    en:
      title: 'Reciprocal pronouns: each other'
      tip: Reciprocal pronouns show that two or more people do something to or with
        each other. In German, use <span lang='de'>uns</span> for 'we/us' and <span
        lang='de'>sich</span> for 'they/you (formal)'. They replace repeated noun
        phrases and signal a mutual action.
      explanation: |-
        ## Reciprocal pronouns in German

        ### What is a reciprocal pronoun?

        A reciprocal pronoun expresses a mutual action: A does something to B, and B does the same thing back to A. In English this is 'each other' or 'one another'. In German, the same words used for reflexive pronouns also serve as reciprocal pronouns — context (plural subject) tells you which meaning is intended.

        ---

        ### The forms at A1 level

        At A1, you need two forms:

        | Subject | Reciprocal pronoun | Meaning |
        |---|---|---|
        | <span lang='de'>wir</span> (we) | <span lang='de'>uns</span> | each other (us) |
        | <span lang='de'>sie</span> (they) | <span lang='de'>sich</span> | each other (them) |
        | <span lang='de'>Sie</span> (you, formal) | <span lang='de'>sich</span> | each other (you) |

        Note: <span lang='de'>uns</span> is also the first-person plural accusative/dative personal pronoun. When the subject is <span lang='de'>wir</span> and <span lang='de'>uns</span> refers back to the same group acting on each other, it is reciprocal.

        ---

        ### Position in the sentence

        The reciprocal pronoun follows the verb directly, just like an object pronoun. The verb stays in second position in a normal statement (see the <span lang='de'>Verbzweitstellung</span> rule).

        **Pattern:** Subject + Verb + Reciprocal pronoun (+ rest of sentence)

        ---

        ### Examples

        1. <span lang='de'>Wir sehen uns morgen.</span> — We'll see each other tomorrow.
        2. <span lang='de'>Wir kennen uns gut.</span> — We know each other well.
        3. <span lang='de'>Sie lieben sich.</span> — They love each other.
        4. <span lang='de'>Die Kinder helfen sich.</span> — The children help each other.
        5. <span lang='de'>Wir treffen uns um drei Uhr.</span> — We're meeting each other at three o'clock.
        6. <span lang='de'>Verstehen Sie sich?</span> — Do you (formal) understand each other?

        ---

        ### Accusative vs. dative use

        Most common verbs at A1 take the reciprocal pronoun in the **accusative** case (e.g. <span lang='de'>sehen, kennen, lieben, treffen</span>). A few verbs that normally take a dative object also use the dative reciprocal (e.g. <span lang='de'>helfen</span> → dative). At A1, the form does not change: <span lang='de'>uns</span> and <span lang='de'>sich</span> are the same in both cases, so you do not need to worry about this distinction yet.

        ---

        ### How to recognise it vs. a reflexive pronoun

        The same form (<span lang='de'>sich</span> / <span lang='de'>uns</span>) is used for both **reflexive** (subject acts on itself) and **reciprocal** (subjects act on each other) meanings. With a **plural subject**, the reciprocal reading ('each other') is usually the natural one.

        - <span lang='de'>Sie waschen sich.</span> — They wash themselves. *(reflexive — each person washes themselves)*
        - <span lang='de'>Sie sehen sich.</span> — They see each other. *(reciprocal — they see one another)*

        Context and the meaning of the verb make the difference clear.

        ---

        ### Common learner mistakes

        **Mistake:** Using the full pronoun instead of the reciprocal form.
        > ✗ <span lang='de'>Wir sehen wir morgen.</span>
        > ✓ <span lang='de'>Wir sehen uns morgen.</span>

        **Mistake:** Using <span lang='de'>sich</span> with a <span lang='de'>wir</span> subject.
        > ✗ <span lang='de'>Wir kennen sich gut.</span>
        > ✓ <span lang='de'>Wir kennen uns gut.</span>

        **Mistake:** Placing the reciprocal pronoun at the end instead of after the verb.
        > ✗ <span lang='de'>Wir morgen sehen uns.</span>
        > ✓ <span lang='de'>Wir sehen uns morgen.</span>
      language: en
      why_this_matters: Everyday phrases like 'we see each other', 'they know each
        other', or 'we help each other' all need a reciprocal pronoun — you simply
        cannot build them without one. These forms appear constantly in social and
        conversational German, so mastering them early lets you sound natural from
        day one.

- code: interrogative_pronou
  cefr_level: A1
  category: artikelwoerter_pronomen
  subcategory: Pronomen
  label: Fragepronomen wer/was/wen/wem
  description: Interrogative pronouns wer and was in the nominative, wen and was in
    the accusative, and wem in the dative.
  examples:
  - Wer ist da?
  - Was ist das?
  - Wen besuchst du?
  - Was machst du morgen?
  - Wem gehört die Jacke?
  prerequisites:
  - nominative_case
  - accusative_case
  source_note: 'Fragepronomen im Nominativ: Wer?/Was?, im Akkusativ: Wen?/Was? und
    im Dativ: Wem?'
  explanations:
    en:
      title: 'Interrogative pronouns: who, what, whom'
      tip: German uses different forms of 'who' depending on the role the word plays
        in the sentence. <span lang="de">Wer</span> is the subject, <span lang="de">wen</span>
        is the direct object, and <span lang="de">wem</span> is the indirect object.
        <span lang="de">Was</span> means 'what' and does not change form for subject
        or direct object.
      explanation: |-
        ## Interrogative Pronouns: <span lang="de">wer / was / wen / wem</span>

        ### What are interrogative pronouns?

        Interrogative pronouns are question words that stand in place of a noun. In English the main ones are *who*, *whom*, *what*, and *to whom*. German has a small set of forms that change depending on **grammatical case** — the role the pronoun plays in the sentence.

        ---

        ### The forms at a glance

        | Case | Meaning | Form (persons) | Form (things/ideas) |
        |------|---------|---------------|---------------------|
        | Nominative | subject | <span lang="de">wer</span> | <span lang="de">was</span> |
        | Accusative | direct object | <span lang="de">wen</span> | <span lang="de">was</span> |
        | Dative | indirect object | <span lang="de">wem</span> | *(rare at A1)* |

        > **Note:** There is no genitive form required at A1 level.

        ---

        ### Nominative: <span lang="de">wer</span> and <span lang="de">was</span>

        Use the **nominative** form when the interrogative pronoun is the **subject** of the sentence — the person or thing doing the action or being described.

        - <span lang="de">**Wer**</span> asks about a **person**.
        - <span lang="de">**Was**</span> asks about a **thing or idea**.

        **Examples:**

        | German | English |
        |--------|---------|
        | <span lang="de">Wer ist da?</span> | Who is there? |
        | <span lang="de">Wer kommt heute?</span> | Who is coming today? |
        | <span lang="de">Was ist das?</span> | What is that? |
        | <span lang="de">Was liegt auf dem Tisch?</span> | What is lying on the table? |

        Notice that <span lang="de">wer</span> is **singular** in German grammar, so the verb is always conjugated in the third-person singular: <span lang="de">Wer *ist* das? Wer *kommt*?</span>

        ---

        ### Accusative: <span lang="de">wen</span> and <span lang="de">was</span>

        Use the **accusative** form when the interrogative pronoun is the **direct object** — the person or thing that receives the action of the verb directly.

        - <span lang="de">**Wen**</span> asks about a **person** as the direct object.
        - <span lang="de">**Was**</span> asks about a **thing** as the direct object. (The form does **not** change from the nominative.)

        **Examples:**

        | German | English |
        |--------|---------|
        | <span lang="de">Wen besuchst du?</span> | Whom are you visiting? |
        | <span lang="de">Wen siehst du dort?</span> | Whom do you see there? |
        | <span lang="de">Was machst du morgen?</span> | What are you doing tomorrow? |
        | <span lang="de">Was kaufst du?</span> | What are you buying? |

        A useful test: if you can replace the answer with a person in the accusative (e.g., <span lang="de">Ich besuche *ihn*</span> — I am visiting *him*), ask with <span lang="de">wen</span>. If the answer is a thing (e.g., <span lang="de">Ich kaufe *es*</span>), ask with <span lang="de">was</span>.

        ---

        ### Dative: <span lang="de">wem</span>

        Use <span lang="de">**wem**</span> when asking about the **indirect object** — the person *to whom* or *for whom* something is done. Only persons use <span lang="de">wem</span> at this level.

        **Examples:**

        | German | English |
        |--------|---------|
        | <span lang="de">Wem gehört die Jacke?</span> | Whose jacket is this? / To whom does the jacket belong? |
        | <span lang="de">Wem gibst du das Buch?</span> | To whom are you giving the book? |

        Verbs that take a dative object at A1 include <span lang="de">gehören</span> (to belong to), <span lang="de">geben</span> (to give), <span lang="de">helfen</span> (to help), and <span lang="de">danken</span> (to thank).

        ---

        ### Word order in questions

        Interrogative pronouns come at the **very beginning** of the sentence, and the verb comes directly after in **second position** — just as in all German questions with a question word.

        > <span lang="de">**Wer** | **ist** | da?</span>
        > <span lang="de">**Wen** | **besuchst** | du?</span>
        > <span lang="de">**Wem** | **gehört** | die Jacke?</span>

        The interrogative pronoun counts as position 1, the conjugated verb is position 2.

        ---

        ### Summary table

        | Question word | Case | Asks about | Example |
        |--------------|------|------------|---------|
        | <span lang="de">wer</span> | Nominative | a person (subject) | <span lang="de">Wer kommt?</span> |
        | <span lang="de">was</span> | Nominative | a thing (subject) | <span lang="de">Was ist das?</span> |
        | <span lang="de">wen</span> | Accusative | a person (direct object) | <span lang="de">Wen siehst du?</span> |
        | <span lang="de">was</span> | Accusative | a thing (direct object) | <span lang="de">Was kaufst du?</span> |
        | <span lang="de">wem</span> | Dative | a person (indirect object) | <span lang="de">Wem gibst du es?</span> |

        ---

        ### Common learner mistakes

        **1. Using <span lang="de">wer</span> instead of <span lang="de">wen</span> for direct objects**

        > ❌ <span lang="de">Wer besuchst du?</span>
        > ✅ <span lang="de">Wen besuchst du?</span> (the person is the direct object, not the subject)

        Tip: Ask yourself — is the pronoun the *doer* of the action (subject → <span lang="de">wer</span>) or the *receiver* of the action (direct object → <span lang="de">wen</span>)?

        **2. Changing <span lang="de">was</span> in the accusative**

        Some learners expect a different form for things in the accusative, like <span lang="de">wen</span> for people. There is none — <span lang="de">was</span> stays <span lang="de">was</span> in both nominative and accusative.

        > ✅ <span lang="de">Was siehst du?</span> (What do you see? — accusative, but still <span lang="de">was</span>)

        **3. Forgetting <span lang="de">wem</span> after dative verbs**

        > ❌ <span lang="de">Wen gehört das?</span>
        > ✅ <span lang="de">Wem gehört das?</span> (because <span lang="de">gehören</span> takes a dative object)

        Whenever a verb requires a dative person (e.g. <span lang="de">helfen, geben, gehören</span>), the question word must be <span lang="de">wem</span>, not <span lang="de">wen</span>.
      language: en
      why_this_matters: You need these pronouns every time you ask a question about
        a person or thing — who is coming, what is that, whom do you see, to whom
        does this belong. Without them you cannot form the most basic information
        questions in German. They appear in almost every real conversation from day
        one.

- code: adj_predicative
  cefr_level: A1
  category: adjektiv
  subcategory: prädikativ
  label: Adjektiv prädikativ
  description: Adjectives used predicatively after verbs like sein, werden, without
    inflectional endings.
  examples:
  - Das Haus ist modern.
  - Der Film ist langweilig.
  source_note: Adjektiv prädikativ
  explanations:
    en:
      title: 'Predicative adjectives: no endings needed'
      tip: When an adjective comes after <span lang="de">sein</span> (to be), <span
        lang="de">werden</span> (to become), or <span lang="de">bleiben</span> (to
        stay), it never changes its form. You always use the plain dictionary form
        of the adjective, no matter what noun you are describing.
      explanation: |-
        ## Predicative Adjectives in German

        ### What is a predicative adjective?

        An adjective is **predicative** when it does not sit directly in front of a noun but instead appears after a linking verb and describes the subject. The three main linking verbs in German are:

        - <span lang="de">sein</span> — to be
        - <span lang="de">werden</span> — to become
        - <span lang="de">bleiben</span> — to stay / remain

        ### The core rule

        **Predicative adjectives never take any inflectional ending.** You always use the base (dictionary) form, regardless of the gender, number, or case of the subject noun.

        | Subject | Linking verb | Adjective |
        |---|---|---|
        | <span lang="de">der Mann</span> (masc.) | <span lang="de">ist</span> | <span lang="de">müde</span> |
        | <span lang="de">die Frau</span> (fem.) | <span lang="de">ist</span> | <span lang="de">müde</span> |
        | <span lang="de">das Kind</span> (neut.) | <span lang="de">ist</span> | <span lang="de">müde</span> |
        | <span lang="de">die Kinder</span> (pl.) | <span lang="de">sind</span> | <span lang="de">müde</span> |

        The adjective <span lang="de">müde</span> (tired) stays exactly the same in every row.

        ### Formation

        The pattern is simply:

        > **Subject + linking verb + adjective (base form)**

        There is nothing to add to the adjective — no <span lang="de">-e</span>, no <span lang="de">-er</span>, no <span lang="de">-en</span>.

        ### Examples

        1. <span lang="de">Das Haus ist modern.</span> — The house is modern.
        2. <span lang="de">Der Film ist langweilig.</span> — The film is boring.
        3. <span lang="de">Die Suppe ist heiß.</span> — The soup is hot.
        4. <span lang="de">Das Wetter wird kalt.</span> — The weather is getting cold.
        5. <span lang="de">Die Kinder sind müde.</span> — The children are tired.
        6. <span lang="de">Bleib ruhig!</span> — Stay calm!

        ### Contrast with attributive adjectives

        When an adjective comes **directly before** a noun (attributive position), it must carry an ending that matches the noun's gender, case, and number:

        - Predicative (no ending): <span lang="de">Der Kaffee ist kalt.</span> — The coffee is cold.
        - Attributive (with ending): <span lang="de">Ich trinke kalten Kaffee.</span> — I drink cold coffee.

        At A1 level, you do not yet need to master attributive endings — but it is useful to know that predicative adjectives are the simpler form.

        ### Common learner mistakes

        **Mistake 1: Adding an ending after <span lang="de">sein</span>**

        - ❌ <span lang="de">Der Mann ist müder.</span>
        - ✅ <span lang="de">Der Mann ist müde.</span>

        Learners sometimes copy the pattern from attributive adjectives and add an ending. After a linking verb, never add one.

        **Mistake 2: Changing the adjective for plural subjects**

        - ❌ <span lang="de">Die Kinder sind müdes.</span>
        - ✅ <span lang="de">Die Kinder sind müde.</span>

        Plural does not change the adjective form. Only the verb changes (<span lang="de">ist</span> → <span lang="de">sind</span>).

        **Mistake 3: Confusing predicative and adverbial adjectives**

        Predicative adjectives describe the **subject** via a linking verb. Adverbial adjectives describe **how an action is done**. Both use the uninflected base form in German, so the forms look identical — but their function differs:

        - Predicative: <span lang="de">Er ist schnell.</span> — He is fast. (describes *him*)
        - Adverbial: <span lang="de">Er läuft schnell.</span> — He runs fast. (describes *how he runs*)

        ### Quick reference

        | Rule | Detail |
        |---|---|
        | Position | After a linking verb |
        | Ending | None — always the base form |
        | Gender agreement | Not needed |
        | Number agreement | Not needed |
        | Main linking verbs | <span lang="de">sein, werden, bleiben</span> |
      language: en
      why_this_matters: This is one of the most common sentence patterns in German
        — you will use it every time you describe something or someone. It is also
        the easiest adjective pattern because there are zero endings to memorise,
        making it the perfect starting point before you tackle adjective endings in
        other positions.

- code: adj_adverbial
  cefr_level: A1
  category: adjektiv
  subcategory: adverbial
  label: Adjektiv adverbial
  description: Adjectives used adverbially to modify verbs, without inflectional endings.
  examples:
  - Ich lese gern.
  - Wo kaufst du gerne ein?
  source_note: Adjektiv adverbial
  explanations:
    en:
      title: Adjectives used as adverbs
      tip: In German, adjectives can describe how something is done by placing them
        directly after a verb — no special ending is added. The adjective stays in
        its base (dictionary) form.
      explanation: |-
        ## Adjectives used as adverbs

        ### What is an adverbial adjective?

        An **adverb** modifies a verb — it tells you *how*, *how often*, or *to what degree* an action happens. In English you often add *-ly* to form an adverb ('quick → quickly'). In German, the **adjective is used unchanged** — no ending is added. The same word that describes a noun ('a fast car') simply slots in next to the verb with no modification.

        ### The key rule

        When an adjective modifies a **verb** (not a noun), it takes **no inflectional ending**. You use the bare, dictionary form — exactly as it appears in a word list.

        > Adjective + verb = no ending on the adjective.

        ### Formation

        | Role | German | English |
        |---|---|---|
        | Predicative (after <span lang="de">sein</span>) | <span lang="de">Das Auto ist schnell.</span> | The car is fast. |
        | **Adverbial (modifies verb)** | <span lang="de">Er fährt schnell.</span> | He drives fast. |
        | Attributive (before noun) | <span lang="de">das schnelle Auto</span> | the fast car |

        Notice that the adverbial and predicative forms look identical — both use the base form. Only the **attributive** form (before a noun) gets an ending.

        ### Common adverbial adjectives at A1

        | German | English |
        |---|---|
        | <span lang="de">schnell</span> | fast, quickly |
        | <span lang="de">langsam</span> | slowly |
        | <span lang="de">gut</span> | well |
        | <span lang="de">schlecht</span> | badly, poorly |
        | <span lang="de">laut</span> | loudly |
        | <span lang="de">leise</span> | quietly |
        | <span lang="de">gern / gerne</span> | gladly, with pleasure |
        | <span lang="de">richtig</span> | correctly, really |
        | <span lang="de">falsch</span> | wrongly, incorrectly |

        ### Special case: <span lang="de">gern / gerne</span>

        <span lang="de">Gern</span> (also written <span lang="de">gerne</span> — both are correct) is the most important adverbial adjective at A1. It is used after a verb to express that you *like* doing something. It has no English single-word equivalent as a direct adjective; think of it as meaning 'with pleasure' or 'willingly.'

        - <span lang="de">Ich trinke gern Kaffee.</span> — I like drinking coffee.
        - <span lang="de">Spielst du gerne Fußball?</span> — Do you like playing football?

        <span lang="de">Gern</span> is placed **after the conjugated verb** and any objects typically follow it, though in practice word order can vary.

        ### Examples

        1. <span lang="de">Sie singt schön.</span> — She sings beautifully.
        2. <span lang="de">Er spricht langsam.</span> — He speaks slowly.
        3. <span lang="de">Wir essen gern Pizza.</span> — We like eating pizza.
        4. <span lang="de">Du schreibst richtig.</span> — You write correctly.
        5. <span lang="de">Das Kind schläft tief.</span> — The child sleeps deeply.
        6. <span lang="de">Ich lerne gut Deutsch.</span> — I learn German well.

        ### Position in the sentence

        Adverbial adjectives typically appear **directly after the conjugated verb** or after the object, depending on emphasis. In a sentence with a sentence bracket (<span lang="de">Satzklammer</span>), the adverb sits inside the bracket:

        - <span lang="de">Er kann gut singen.</span> — He can sing well. *(modal verb bracket)*
        - <span lang="de">Sie hat schön geschrieben.</span> — She wrote beautifully. *(perfect tense bracket)*

        ### Common learner mistakes

        **Mistake 1 — Adding an adjective ending:**

        > ✗ <span lang="de">Er fährt schnellen.</span>
        > ✓ <span lang="de">Er fährt schnell.</span>

        Adverbs never take case endings. Endings only appear on adjectives that directly precede a noun.

        **Mistake 2 — Translating from English with *-ly*:**

        English 'He runs quickly' tempts learners to look for a German *-lich* or *-lich* suffix. There is none needed — <span lang="de">Er läuft schnell</span> is the complete, correct sentence.

        **Mistake 3 — Confusing <span lang="de">gut</span> (adverb: well) with <span lang="de">gern</span> (adverb: like to):**

        - <span lang="de">Ich singe gut.</span> — I sing *well*. (quality of singing)
        - <span lang="de">Ich singe gern.</span> — I *like* singing. (enjoyment)

        These are different meanings; choose based on what you want to express.

        **Mistake 4 — Placing the adverb before the verb:**

        > ✗ <span lang="de">Ich schnell laufe.</span>
        > ✓ <span lang="de">Ich laufe schnell.</span>

        The verb holds second position; adverbs come after it (or before the subject if you want to emphasise the adverb, but then the verb still stays in position 2: <span lang="de">Schnell laufe ich.</span>).
      language: en
      why_this_matters: This pattern appears in almost every German sentence that
        describes how, how well, or how much someone does something. Without it, you
        cannot say things like 'She sings beautifully' or 'He works fast.'

- code: prep_temporal
  cefr_level: A1
  category: praeposition
  subcategory: temporal
  label: Temporale Präpositionen
  description: 'Prepositions used to express time relationships: an, ab, für, in,
    nach, über, um, von...bis, vor with their required cases.'
  examples:
  - am Morgen/am Dienstag
  - ab Februar 2004
  - für die nächsten drei Wochen
  - im Sommer/in dieser Woche
  - nach dem Essen
  - über 20 Minuten
  - um halb sieben/um 18.30 Uhr
  - geschlossen von Dienstag bis Donnerstag
  - vor dem Konzert
  prerequisites:
  - accusative_case
  source_note: 'temporal: an + Dativ, ab + Akkusativ, für + Akkusativ, in + Dativ,
    nach + Dativ, über, um + Akkusativ, von...bis, vor + Dativ'
  explanations:
    en:
      title: Prepositions for time expressions
      tip: German uses specific prepositions to talk about time — when something happens,
        how long it lasts, or how it relates to another event. Each preposition requires
        a specific grammatical case (usually dative or accusative). Learning these
        fixed combinations by heart is the fastest path to fluency.
      explanation: |-
        ## Temporal Prepositions in German

        Temporal prepositions (German: <span lang="de">temporale Präpositionen</span>) link a noun phrase to a point in time, a period, a duration, or a sequence of events. Each preposition governs a fixed grammatical case, most commonly the **dative** or **accusative**.

        ---

        ### Overview table

        | Preposition | Case | Core meaning | Typical use |
        |---|---|---|---|
        | <span lang="de">an</span> | Dative | on / at | days, parts of day |
        | <span lang="de">ab</span> | Dative | from (a point onwards) | start of a period |
        | <span lang="de">für</span> | Accusative | for (a duration) | planned length of time |
        | <span lang="de">in</span> | Dative | in / within | months, seasons, weeks, years |
        | <span lang="de">nach</span> | Dative | after | sequence of events |
        | <span lang="de">über</span> | Accusative | over / for more than | duration exceeding a limit |
        | <span lang="de">um</span> | Accusative | at (clock time) | exact time of day |
        | <span lang="de">von … bis</span> | Dative | from … to / until | start and end of a period |
        | <span lang="de">vor</span> | Dative | before | sequence of events |

        ---

        ### Each preposition in detail

        #### <span lang="de">an</span> — 'on' (days and parts of the day)

        <span lang="de">an</span> + dative is used with **days of the week** and **parts of the day** (morning, afternoon, evening). It contracts with the definite article: <span lang="de">an + dem = am</span>.

        - Days of the week: <span lang="de">am Montag</span> (on Monday), <span lang="de">am Freitag</span> (on Friday)
        - Parts of the day: <span lang="de">am Morgen</span> (in the morning), <span lang="de">am Abend</span> (in the evening)
        - Exception — **at night** uses <span lang="de">in der Nacht</span>, NOT <span lang="de">an der Nacht</span>.
        - Dates: <span lang="de">am 3. Mai</span> (on the 3rd of May)

        > <span lang="de">Das Geschäft öffnet am Montag.</span> — The shop opens on Monday.
        > <span lang="de">Wir frühstücken am Morgen.</span> — We have breakfast in the morning.

        #### <span lang="de">ab</span> — 'from' (starting point)

        <span lang="de">ab</span> + dative marks the **beginning of a period** that continues into the future. It is often used with months, dates, or clock times.

        > <span lang="de">Der Kurs beginnt ab September.</span> — The course starts from September.
        > <span lang="de">Ab nächster Woche arbeite ich hier.</span> — From next week I'll be working here.

        Note: When used with a bare month name (no article), the noun stays in its base form: <span lang="de">ab Februar</span>, not <span lang="de">ab dem Februar</span>. Both forms are grammatically possible, but the bare form is standard in everyday speech.

        #### <span lang="de">für</span> — 'for' (planned duration)

        <span lang="de">für</span> + accusative describes **how long something is planned to last**.

        > <span lang="de">Ich bleibe für drei Tage.</span> — I am staying for three days.
        > <span lang="de">Sie lernt Deutsch für die nächsten zwei Monate.</span> — She is learning German for the next two months.

        Common learner mistake: using <span lang="de">seit</span> instead of <span lang="de">für</span> for future/planned durations. <span lang="de">seit</span> (since/for) looks backwards from the present; <span lang="de">für</span> looks forward.

        #### <span lang="de">in</span> — 'in' (months, seasons, years, weeks)

        <span lang="de">in</span> + dative is used with **months**, **seasons**, **years**, and **weeks**. It contracts with the definite article: <span lang="de">in + dem = im</span>.

        - Months: <span lang="de">im Januar</span> (in January), <span lang="de">im Oktober</span> (in October)
        - Seasons: <span lang="de">im Sommer</span> (in summer), <span lang="de">im Winter</span> (in winter)
        - Years: <span lang="de">im Jahr 2024</span> (in the year 2024); but just a year number alone: <span lang="de">2024</span> (no preposition)
        - Weeks: <span lang="de">in dieser Woche</span> (this week), <span lang="de">in der nächsten Woche</span> (next week)

        > <span lang="de">Im Sommer fahren wir ans Meer.</span> — In summer we go to the sea.
        > <span lang="de">Das Konzert ist im März.</span> — The concert is in March.

        #### <span lang="de">nach</span> — 'after'

        <span lang="de">nach</span> + dative describes something that happens **after** another event or a specific time.

        > <span lang="de">Nach dem Essen machen wir einen Spaziergang.</span> — After the meal we go for a walk.
        > <span lang="de">Nach der Arbeit bin ich müde.</span> — After work I am tired.

        #### <span lang="de">über</span> — 'over' / 'for more than'

        <span lang="de">über</span> + accusative indicates a duration that **exceeds** a stated amount.

        > <span lang="de">Das dauert über eine Stunde.</span> — That takes over an hour.
        > <span lang="de">Ich habe über zwanzig Minuten gewartet.</span> — I waited for more than twenty minutes.

        #### <span lang="de">um</span> — 'at' (exact clock time)

        <span lang="de">um</span> + accusative is used exclusively with **clock times**.

        > <span lang="de">Der Zug fährt um 18:30 Uhr ab.</span> — The train departs at 18:30.
        > <span lang="de">Wir treffen uns um halb sieben.</span> — We meet at half past six.

        'Half past' in German means half before the next hour: <span lang="de">halb sieben</span> = 6:30 (half [way to] seven).

        #### <span lang="de">von … bis</span> — 'from … to/until'

        Both <span lang="de">von</span> and <span lang="de">bis</span> take the **dative** when used with a definite article; bare nouns or proper names take no article.

        > <span lang="de">Das Museum ist von Montag bis Freitag geöffnet.</span> — The museum is open from Monday to Friday.
        > <span lang="de">Der Shop ist von 9 Uhr bis 18 Uhr offen.</span> — The shop is open from 9 to 18.
        > <span lang="de">Von Januar bis März ist es kalt.</span> — From January to March it is cold.

        #### <span lang="de">vor</span> — 'before'

        <span lang="de">vor</span> + dative describes something that happens **before** another event.

        > <span lang="de">Vor dem Konzert essen wir etwas.</span> — Before the concert we eat something.
        > <span lang="de">Bitte kommen Sie vor dem Unterricht.</span> — Please come before the lesson.

        ---

        ### Contractions to memorise

        | Full form | Contraction | Example |
        |---|---|---|
        | <span lang="de">an dem</span> | <span lang="de">am</span> | <span lang="de">am Dienstag</span> |
        | <span lang="de">in dem</span> | <span lang="de">im</span> | <span lang="de">im Sommer</span> |

        ---

        ### Common learner mistakes

        | Mistake | Correction | Note |
        |---|---|---|
        | <span lang="de">*in Montag*</span> | <span lang="de">am Montag</span> | Days of the week use <span lang="de">an</span>, not <span lang="de">in</span> |
        | <span lang="de">*an dem Sommer*</span> | <span lang="de">im Sommer</span> | Seasons use <span lang="de">in</span>, not <span lang="de">an</span> |
        | <span lang="de">*um dem Abend*</span> | <span lang="de">am Abend</span> | <span lang="de">um</span> is only for clock times |
        | <span lang="de">*in der Morgen*</span> | <span lang="de">am Morgen</span> | Parts of day use <span lang="de">am</span> |
        | <span lang="de">*seit drei Tage*</span> | <span lang="de">für drei Tage</span> | Use <span lang="de">für</span> for future/planned duration |

        ---

        ### Quick examples across all prepositions

        1. <span lang="de">Am Dienstag habe ich frei.</span> — I have the day off on Tuesday.
        2. <span lang="de">Im Winter ist es hier sehr kalt.</span> — In winter it is very cold here.
        3. <span lang="de">Nach der Schule gehe ich nach Hause.</span> — After school I go home.
        4. <span lang="de">Der Film beginnt um 20 Uhr.</span> — The film starts at 20:00.
        5. <span lang="de">Wir sind für eine Woche in Berlin.</span> — We are in Berlin for a week.
        6. <span lang="de">Vor dem Frühstück mache ich Sport.</span> — Before breakfast I do sport.
      language: en
      why_this_matters: You need time prepositions in almost every real conversation
        — arranging meetings, describing your day, or asking when something opens.
        Without them, you cannot say things like 'on Monday', 'in the morning', or
        'after dinner' in German.

- code: prep_local
  cefr_level: A1
  category: praeposition
  subcategory: lokal
  label: Lokale Präpositionen
  description: 'Prepositions used to express location and direction: an, auf, aus,
    bei, in, nach, von...nach, unter, zu with their required cases.'
  examples:
  - Ferien am Meer/an den See fahren
  - auf dem Marktplatz/auf dem Tisch
  - aus Italien
  - bei Familie Müller/bei Siemens
  - im Park spielen/in die Stadt fahren
  - nach Paris/nach Deutschland fahren
  - von Hamburg nach Bremen
  - unter der Nummer
  - zur Schule/zu meiner Freundin gehen
  prerequisites:
  - ortspraepositionen
  source_note: 'lokal: an + Dativ/Akkusativ, auf + Dativ, aus + Dativ, bei + Dativ,
    in + Dativ/Akkusativ, nach + Dativ, von...nach + Dativ/–, unter + Dativ, zu +
    Dativ'
  explanations:
    en:
      title: 'Local prepositions: place and direction'
      tip: German local prepositions tell you WHERE something is or WHERE something
        is going. Many of them require a specific case (dative or accusative), and
        some switch case depending on whether you mean location (dative) or movement
        toward a destination (accusative).
      explanation: |-
        ## Local prepositions in German

        ### What are local prepositions?

        Local prepositions express **where** something is (location) or **where** something is going (direction/destination). In German, every preposition requires a noun to appear in a specific grammatical case. Some local prepositions always take the same case; others switch case depending on meaning.

        ---

        ### The two-way prepositions (Wechselpräpositionen)

        These prepositions take **dative for location** and **accusative for direction**:

        | Preposition | Location (Dative) — Where? | Direction (Accusative) — Where to? |
        |---|---|---|
        | <span lang="de">an</span> | <span lang="de">am Meer sein</span> (to be at the sea) | <span lang="de">an den See fahren</span> (to go to the lake) |
        | <span lang="de">auf</span> | <span lang="de">auf dem Tisch liegen</span> (to lie on the table) | <span lang="de">auf den Marktplatz gehen</span> (to go to the market square) |
        | <span lang="de">in</span> | <span lang="de">im Park spielen</span> (to play in the park) | <span lang="de">in die Stadt fahren</span> (to drive into the city) |
        | <span lang="de">unter</span> | <span lang="de">unter der Nummer</span> (at/under the number) | <span lang="de">unter den Tisch legen</span> (to put under the table) |

        **Key rule:** Ask yourself — is this a **static location** (*Wo?* — where?) → dative. Is this **movement toward a place** (*Wohin?* — where to?) → accusative.

        > <span lang="de">Ich bin **im** Park.</span> (I am in the park.) — location → dative
        > <span lang="de">Ich gehe **in den** Park.</span> (I am going into the park.) — direction → accusative

        ---

        ### Prepositions that always take the dative

        | Preposition | Meaning | Example |
        |---|---|---|
        | <span lang="de">aus</span> | from, out of (origin) | <span lang="de">aus Italien kommen</span> (to come from Italy) |
        | <span lang="de">bei</span> | at (someone's place), at (a company) | <span lang="de">bei Familie Müller</span> (at the Müller family's) |
        | <span lang="de">nach</span> | to (cities, countries, home) | <span lang="de">nach Paris fahren</span> (to travel to Paris) |
        | <span lang="de">von</span> | from (starting point) | <span lang="de">von Hamburg</span> (from Hamburg) |
        | <span lang="de">zu</span> | to (people, places) | <span lang="de">zur Schule gehen</span> (to go to school) |

        ---

        ### Detailed notes on each preposition

        #### <span lang="de">an</span> — at, on (vertical surfaces or edges)

        Used for things you are **at the edge of** or **touching** (a wall, a lake, a sea, a border).

        - <span lang="de">an</span> + <span lang="de">dem</span> → contracts to <span lang="de">**am**</span> (dative masculine/neuter)
        - <span lang="de">an</span> + <span lang="de">das</span> → contracts to <span lang="de">**ans**</span> (accusative neuter)

        > <span lang="de">Wir machen Ferien **am** Meer.</span> (We are on holiday at the sea.)
        > <span lang="de">Wir fahren **ans** Meer.</span> (We are going to the sea.)

        #### <span lang="de">auf</span> — on (horizontal surfaces), at (public spaces)

        Used for things **on top of** a surface or at an open public place.

        > <span lang="de">Das Buch liegt **auf dem** Tisch.</span> (The book is lying on the table.)
        > <span lang="de">Ich gehe **auf den** Marktplatz.</span> (I am going to the market square.)

        #### <span lang="de">aus</span> — from, out of (always dative)

        Used for **origin** (country, city, building).

        > <span lang="de">Er kommt **aus** Italien.</span> (He comes from Italy.)
        > <span lang="de">Sie kommt **aus dem** Haus.</span> (She is coming out of the house.)

        #### <span lang="de">bei</span> — at (someone's home or workplace) (always dative)

        Used for being **at a person's place** or **at a company/institution**.

        > <span lang="de">Ich bin **bei** Familie Müller.</span> (I am at the Müller family's home.)
        > <span lang="de">Er arbeitet **bei** Siemens.</span> (He works at Siemens.)

        #### <span lang="de">in</span> — in, into (enclosed spaces)

        Used for **enclosed spaces** (rooms, buildings, countries with an article). With countries that have an article (e.g. <span lang="de">die Schweiz</span>, <span lang="de">die USA</span>), use <span lang="de">in</span>. For most countries and cities, use <span lang="de">nach</span> instead (see below).

        - <span lang="de">in</span> + <span lang="de">dem</span> → contracts to <span lang="de">**im**</span> (dative masculine/neuter)
        - <span lang="de">in</span> + <span lang="de">das</span> → contracts to <span lang="de">**ins**</span> (accusative neuter)

        > <span lang="de">Wir spielen **im** Park.</span> (We are playing in the park.)
        > <span lang="de">Wir fahren **in die** Schweiz.</span> (We are going to Switzerland.)

        #### <span lang="de">nach</span> — to (cities, most countries, home) (always dative)

        Used before **city names**, most **country names** (no article), and the word <span lang="de">Hause</span>.

        > <span lang="de">Wir fahren **nach** Paris.</span> (We are travelling to Paris.)
        > <span lang="de">Ich gehe **nach** Hause.</span> (I am going home.)

        #### <span lang="de">von … nach</span> — from … to (always dative)

        Used for travel **between** two places.

        > <span lang="de">Wir fahren **von** Hamburg **nach** Bremen.</span> (We are travelling from Hamburg to Bremen.)

        #### <span lang="de">unter</span> — under, below (two-way)

        At A1, <span lang="de">unter</span> often appears in the fixed phrase <span lang="de">unter der Nummer</span> (at/on the number [e.g. a phone number]).

        > <span lang="de">Sie erreichen uns **unter der** Nummer 030 …</span> (You can reach us at the number 030 …)

        #### <span lang="de">zu</span> — to (people, buildings, home direction) (always dative)

        Used for going **to a person** or **to a specific building/institution**. Not used before bare city or country names.

        - <span lang="de">zu</span> + <span lang="de">dem</span> → contracts to <span lang="de">**zum**</span> (dative masculine/neuter)
        - <span lang="de">zu</span> + <span lang="de">der</span> → contracts to <span lang="de">**zur**</span> (dative feminine)

        > <span lang="de">Ich gehe **zur** Schule.</span> (I am going to school.)
        > <span lang="de">Ich gehe **zu** meiner Freundin.</span> (I am going to my friend's place.)

        ---

        ### Common contractions (Verschmelzungen) at a glance

        | Full form | Contracted form | Case |
        |---|---|---|
        | <span lang="de">an dem</span> | <span lang="de">**am**</span> | Dative m./n. |
        | <span lang="de">an das</span> | <span lang="de">**ans**</span> | Accusative n. |
        | <span lang="de">in dem</span> | <span lang="de">**im**</span> | Dative m./n. |
        | <span lang="de">in das</span> | <span lang="de">**ins**</span> | Accusative n. |
        | <span lang="de">zu dem</span> | <span lang="de">**zum**</span> | Dative m./n. |
        | <span lang="de">zu der</span> | <span lang="de">**zur**</span> | Dative f. |

        These contractions are standard and always used in normal speech.

        ---

        ### nach vs. zu vs. in — choosing the right preposition for destinations

        This is one of the most common areas of confusion for learners.

        | Situation | Preposition | Example |
        |---|---|---|
        | City or country name (no article) | <span lang="de">nach</span> | <span lang="de">nach Berlin, nach Deutschland</span> |
        | Country with article | <span lang="de">in + accusative</span> | <span lang="de">in die Schweiz, in die USA</span> |
        | A person's home/place | <span lang="de">zu</span> | <span lang="de">zu meiner Freundin</span> |
        | An institution/building | <span lang="de">zu</span> or <span lang="de">in</span> | <span lang="de">zur Schule / in die Schule</span> |
        | Home (going home) | <span lang="de">nach Hause</span> | <span lang="de">Ich gehe nach Hause.</span> |
        | At home (being home) | <span lang="de">zu Hause</span> | <span lang="de">Ich bin zu Hause.</span> |

        ---

        ### Common learner mistakes

        **Mistake 1: Using <span lang="de">nach</span> for countries with an article.**

        ❌ <span lang="de">Ich fahre nach die Schweiz.</span>
        ✅ <span lang="de">Ich fahre in die Schweiz.</span> (I am going to Switzerland.)

        **Mistake 2: Confusing location and direction with two-way prepositions.**

        ❌ <span lang="de">Ich gehe in dem Park.</span> (meant: I am going into the park)
        ✅ <span lang="de">Ich gehe in den Park.</span> (direction → accusative)
        ✅ <span lang="de">Ich bin in dem/im Park.</span> (location → dative)

        **Mistake 3: Forgetting the contraction.**

        ❌ <span lang="de">Ich gehe zu der Schule.</span> (not wrong, but unnatural)
        ✅ <span lang="de">Ich gehe zur Schule.</span>

        **Mistake 4: Using <span lang="de">zu Hause</span> instead of <span lang="de">nach Hause</span> for going home.**

        ❌ <span lang="de">Ich gehe zu Hause.</span>
        ✅ <span lang="de">Ich gehe nach Hause.</span> (I am going home.)
        ✅ <span lang="de">Ich bin zu Hause.</span> (I am at home.)

        ---

        ### Example sentences with translations

        1. <span lang="de">Wir fahren **an den** See.</span> — We are going to the lake.
        2. <span lang="de">Das Buch liegt **auf dem** Tisch.</span> — The book is on the table.
        3. <span lang="de">Er kommt **aus** Italien.</span> — He comes from Italy.
        4. <span lang="de">Wir spielen **im** Park.</span> — We are playing in the park.
        5. <span lang="de">Ich gehe **zur** Schule.</span> — I am going to school.
        6. <span lang="de">Wir fahren **von** Hamburg **nach** Bremen.</span> — We are travelling from Hamburg to Bremen.
      language: en
      why_this_matters: You need local prepositions in almost every sentence about
        daily life — going to school, being at home, travelling to a city, or calling
        someone. Without them you cannot say where you are or where you are going.

- code: prep_modal
  cefr_level: A1
  category: praeposition
  subcategory: modal
  label: Modale Präpositionen
  description: 'Prepositions used to express manner or means: aus, für, mit, ohne
    with their required cases.'
  examples:
  - aus Plastik
  - für meinen Freund/für dich
  - mit dem Auto
  - ohne Hilfe/ohne dich
  prerequisites:
  - accusative_case
  source_note: 'modal: aus + Dativ, für + Akkusativ, mit + Dativ, ohne + Akkusativ'
  explanations:
    en:
      title: 'Modal prepositions: manner and means'
      tip: Some German prepositions tell you *how* something is done or *what* something
        is made of. The four key ones — <span lang="de">aus</span>, <span lang="de">für</span>,
        <span lang="de">mit</span>, and <span lang="de">ohne</span> — each require
        a specific grammatical case after them.
      explanation: |-
        ## Modal prepositions: manner and means

        Modal prepositions express *how* something happens, *by what means*, *for whom* or *what*, or *without* what. At A1 level, four prepositions cover this area: <span lang="de">aus</span>, <span lang="de">für</span>, <span lang="de">mit</span>, and <span lang="de">ohne</span>.

        Each preposition governs a fixed grammatical case — the noun or pronoun that follows must appear in that case.

        ---

        ### The four modal prepositions

        | Preposition | Case required | Core meaning |
        |---|---|---|
        | <span lang="de">aus</span> | Dative | made of / out of |
        | <span lang="de">für</span> | Accusative | for (a person or purpose) |
        | <span lang="de">mit</span> | Dative | with / by means of |
        | <span lang="de">ohne</span> | Accusative | without |

        ---

        ### <span lang="de">aus</span> + Dative — *made of* or *out of*

        <span lang="de">aus</span> (out of / made of) is used to say what material something consists of.

        **Formation:** <span lang="de">aus</span> + noun/pronoun in the **dative** case.

        | | Masculine | Feminine | Neuter | Plural |
        |---|---|---|---|---|
        | Definite | <span lang="de">aus dem</span> | <span lang="de">aus der</span> | <span lang="de">aus dem</span> | <span lang="de">aus den</span> |
        | Indefinite | <span lang="de">aus einem</span> | <span lang="de">aus einer</span> | <span lang="de">aus einem</span> | <span lang="de">aus —</span> |

        **Examples:**
        - <span lang="de">Das Haus ist aus Holz.</span> — The house is made of wood.
        - <span lang="de">Die Flasche ist aus Plastik.</span> — The bottle is made of plastic.
        - <span lang="de">Der Ring ist aus Gold.</span> — The ring is made of gold.

        > **Note:** When the noun is used without an article (material nouns like <span lang="de">Holz</span>, <span lang="de">Plastik</span>, <span lang="de">Gold</span>), the dative ending is simply not visible — the noun itself does not change.

        ---

        ### <span lang="de">für</span> + Accusative — *for*

        <span lang="de">für</span> (for) indicates the beneficiary of an action or object, or a purpose.

        **Formation:** <span lang="de">für</span> + noun/pronoun in the **accusative** case.

        | | Masculine | Feminine | Neuter | Plural |
        |---|---|---|---|---|
        | Definite | <span lang="de">für den</span> | <span lang="de">für die</span> | <span lang="de">für das</span> | <span lang="de">für die</span> |
        | Indefinite | <span lang="de">für einen</span> | <span lang="de">für eine</span> | <span lang="de">für ein</span> | <span lang="de">für —</span> |

        **With personal pronouns (accusative):**

        | Nominative | Accusative after <span lang="de">für</span> |
        |---|---|
        | <span lang="de">ich</span> | <span lang="de">für mich</span> |
        | <span lang="de">du</span> | <span lang="de">für dich</span> |
        | <span lang="de">er/sie/es</span> | <span lang="de">für ihn / für sie / für es</span> |
        | <span lang="de">wir</span> | <span lang="de">für uns</span> |
        | <span lang="de">ihr</span> | <span lang="de">für euch</span> |
        | <span lang="de">Sie/sie</span> | <span lang="de">für Sie / für sie</span> |

        **Examples:**
        - <span lang="de">Das Geschenk ist für meinen Freund.</span> — The gift is for my friend.
        - <span lang="de">Ich kaufe etwas für dich.</span> — I am buying something for you.
        - <span lang="de">Für wen ist das?</span> — Who is that for?

        ---

        ### <span lang="de">mit</span> + Dative — *with* or *by (means of)*

        <span lang="de">mit</span> (with / by) expresses accompaniment or the means of transport or instrument used.

        **Formation:** <span lang="de">mit</span> + noun/pronoun in the **dative** case.

        | | Masculine | Feminine | Neuter | Plural |
        |---|---|---|---|---|
        | Definite | <span lang="de">mit dem</span> | <span lang="de">mit der</span> | <span lang="de">mit dem</span> | <span lang="de">mit den</span> |
        | Indefinite | <span lang="de">mit einem</span> | <span lang="de">mit einer</span> | <span lang="de">mit einem</span> | <span lang="de">mit —</span> |

        **With personal pronouns (dative):**

        | Nominative | Dative after <span lang="de">mit</span> |
        |---|---|
        | <span lang="de">ich</span> | <span lang="de">mit mir</span> |
        | <span lang="de">du</span> | <span lang="de">mit dir</span> |
        | <span lang="de">er/sie/es</span> | <span lang="de">mit ihm / mit ihr / mit ihm</span> |
        | <span lang="de">wir</span> | <span lang="de">mit uns</span> |
        | <span lang="de">ihr</span> | <span lang="de">mit euch</span> |
        | <span lang="de">Sie/sie</span> | <span lang="de">mit Ihnen / mit ihnen</span> |

        **Examples:**
        - <span lang="de">Ich fahre mit dem Auto.</span> — I travel by car.
        - <span lang="de">Sie kommt mit dem Bus.</span> — She comes by bus.
        - <span lang="de">Er spielt mit mir.</span> — He is playing with me.

        > **Transport tip:** In German, you always use <span lang="de">mit</span> + dative definite article for means of transport: <span lang="de">mit dem Zug</span> (by train), <span lang="de">mit dem Fahrrad</span> (by bike). There is no equivalent of English 'by bus' without an article.

        ---

        ### <span lang="de">ohne</span> + Accusative — *without*

        <span lang="de">ohne</span> (without) is the direct opposite of <span lang="de">mit</span> and takes the **accusative** case.

        **Formation:** <span lang="de">ohne</span> + noun/pronoun in the **accusative** case.

        **Examples:**
        - <span lang="de">Er kommt ohne Hilfe.</span> — He manages without help.
        - <span lang="de">Ich trinke Kaffee ohne Zucker.</span> — I drink coffee without sugar.
        - <span lang="de">Sie geht ohne mich.</span> — She is going without me.

        > **Note:** Material and abstract nouns after <span lang="de">ohne</span> are often used without an article: <span lang="de">ohne Hilfe</span>, <span lang="de">ohne Geld</span>, <span lang="de">ohne Arbeit</span>.

        ---

        ### Common learner mistakes

        **1. Confusing <span lang="de">mit</span> and <span lang="de">ohne</span> cases**
        Both deal with accompaniment/means, but they take *different* cases.
        - ❌ <span lang="de">ohne dem Auto</span>
        - ✅ <span lang="de">ohne das Auto</span> (accusative)

        **2. Using the wrong pronoun form after <span lang="de">für</span>**
        Remember: <span lang="de">für</span> needs the accusative pronoun, not the nominative.
        - ❌ <span lang="de">Das ist für du.</span>
        - ✅ <span lang="de">Das ist für dich.</span>

        **3. Using the wrong pronoun form after <span lang="de">mit</span>**
        <span lang="de">mit</span> needs the dative pronoun.
        - ❌ <span lang="de">Komm mit ich!</span>
        - ✅ <span lang="de">Komm mit mir!</span>

        **4. Adding an article to material nouns after <span lang="de">aus</span>**
        Materials like <span lang="de">Holz</span>, <span lang="de">Plastik</span>, <span lang="de">Gold</span> typically appear without an article.
        - ❌ <span lang="de">aus dem Plastik</span> (usually wrong in this context)
        - ✅ <span lang="de">aus Plastik</span>

        ---

        ### Quick reference summary

        | Preposition | Case | Example |
        |---|---|---|
        | <span lang="de">aus</span> | Dative | <span lang="de">aus Holz</span> — made of wood |
        | <span lang="de">für</span> | Accusative | <span lang="de">für dich</span> — for you |
        | <span lang="de">mit</span> | Dative | <span lang="de">mit dem Zug</span> — by train |
        | <span lang="de">ohne</span> | Accusative | <span lang="de">ohne Hilfe</span> — without help |
      language: en
      why_this_matters: You will use these prepositions in almost every conversation
        — describing how you travel, what things are made of, who something is for,
        or what you are doing without. Without them, you cannot build basic sentences
        like 'I come by car' or 'a gift for my friend'.

- code: verb_second_position
  cefr_level: A1
  category: syntax
  subcategory: Verbzweitstellung
  label: Verbzweitstellung im Aussagesatz
  description: The finite verb always occupies the second position in declarative
    main clauses, even when an adverb or other element is placed first.
  examples:
  - Morgen fahre ich nach Stuttgart.
  - Ich fahre morgen nach Paris.
  prerequisites:
  - einfache_saetze
  source_note: Verbzweitstellung
  explanations:
    en:
      title: The verb always comes second
      tip: In a German statement, the finite verb must be the second 'chunk' — not
        the second word, but the second unit of meaning. Whatever you put first, the
        verb follows immediately after.
      explanation: |-
        ## Verb-Second Order in German Statements

        ### The Core Rule

        In every German declarative main clause, the finite verb (the conjugated verb that carries tense and agreement) occupies **position 2** — the second slot in the sentence. This is called <span lang="de">Verbzweitstellung</span> (verb-second position).

        'Position' here means a **topological slot**, not the second individual word. An entire phrase such as <span lang="de">morgen früh</span> ('tomorrow morning') counts as one unit and fills position 1, still leaving position 2 free for the verb.

        ---

        ### The Three Positions in a Basic German Statement

        | Slot | Role | Also called |
        |------|------|-------------|
        | **Position 1** | The topic / starting element | <span lang="de">Vorfeld</span> |
        | **Position 2** | The finite verb | <span lang="de">linke Satzklammer</span> |
        | **Position 3+** | Subject (if not in P1) + rest of sentence | <span lang="de">Mittelfeld / Nachfeld</span> |

        ---

        ### Normal (Subject-First) Word Order

        When the **subject** stands first, the result looks like English:

        | Position 1 | Position 2 | Rest |
        |------------|------------|------|
        | <span lang="de">Ich</span> | <span lang="de">fahre</span> | <span lang="de">morgen nach Paris.</span> |
        | <span lang="de">Anna</span> | <span lang="de">kauft</span> | <span lang="de">ein Buch.</span> |

        - <span lang="de">Ich fahre morgen nach Paris.</span> — I am travelling to Paris tomorrow.
        - <span lang="de">Anna kauft ein Buch.</span> — Anna is buying a book.

        ---

        ### Inverted (Non-Subject-First) Word Order

        Anything can move to position 1 — a time expression, a place, an object. When it does, the verb **stays in position 2**, and the subject moves to position 3 (right after the verb). This is called **inversion** (<span lang="de">Inversion</span>).

        | Position 1 | Position 2 | Position 3 (subject) | Rest |
        |------------|------------|----------------------|------|
        | <span lang="de">Morgen</span> | <span lang="de">fahre</span> | <span lang="de">ich</span> | <span lang="de">nach Stuttgart.</span> |
        | <span lang="de">Heute</span> | <span lang="de">lernt</span> | <span lang="de">er</span> | <span lang="de">Deutsch.</span> |
        | <span lang="de">In Berlin</span> | <span lang="de">wohnt</span> | <span lang="de">meine Schwester.</span> | |
        | <span lang="de">Das Buch</span> | <span lang="de">lese</span> | <span lang="de">ich</span> | <span lang="de">gerade.</span> |

        - <span lang="de">Morgen fahre ich nach Stuttgart.</span> — Tomorrow I am travelling to Stuttgart.
        - <span lang="de">Heute lernt er Deutsch.</span> — Today he is studying German.
        - <span lang="de">In Berlin wohnt meine Schwester.</span> — My sister lives in Berlin.
        - <span lang="de">Das Buch lese ich gerade.</span> — I am reading the book right now.

        ---

        ### More Examples with Translations

        1. <span lang="de">Wir essen um sieben.</span> — We eat at seven.
        2. <span lang="de">Um sieben essen wir.</span> — At seven we eat.
        3. <span lang="de">Jeden Tag trinkt sie Kaffee.</span> — Every day she drinks coffee.
        4. <span lang="de">Das Kind spielt im Garten.</span> — The child is playing in the garden.
        5. <span lang="de">Im Garten spielt das Kind.</span> — In the garden the child is playing.
        6. <span lang="de">Leider komme ich zu spät.</span> — Unfortunately I am arriving too late.

        ---

        ### What Counts as One 'Position 1 Unit'?

        An entire phrase — however many words — counts as a single position-1 unit:

        - Single word: <span lang="de">Morgen **fährt** er.</span>
        - Two words: <span lang="de">Morgen früh **fährt** er.</span>
        - Longer phrase: <span lang="de">Am nächsten Morgen **fährt** er.</span>

        In every case the verb is still second.

        ---

        ### Special Case: Separable Verbs

        With separable verbs (see the <span lang="de">Verben mit trennbarem Präfix</span> grammar point), the **prefix splits off** and goes to the very end of the sentence, while the conjugated stem stays in position 2:

        | Position 1 | Position 2 (stem) | Middle | End (prefix) |
        |------------|-------------------|--------|---------------|
        | <span lang="de">Ich</span> | <span lang="de">**stehe**</span> | <span lang="de">um sieben</span> | <span lang="de">**auf**.</span> |
        | <span lang="de">Morgen</span> | <span lang="de">**rufe**</span> | <span lang="de">ich dich</span> | <span lang="de">**an**.</span> |

        - <span lang="de">Ich stehe um sieben auf.</span> — I get up at seven.
        - <span lang="de">Morgen rufe ich dich an.</span> — Tomorrow I will call you.

        The prefix at the end is part of the <span lang="de">Satzklammer</span> (sentence bracket) — see that grammar point for details.

        ---

        ### Common Learner Mistakes

        **Mistake 1: Keeping the subject in position 1 after a fronted adverb**

        > ❌ <span lang="de">Morgen ich fahre nach Stuttgart.</span>
        > ✅ <span lang="de">Morgen fahre ich nach Stuttgart.</span>

        English does not require inversion, but German always does.

        **Mistake 2: Moving the verb to position 3**

        > ❌ <span lang="de">Heute ich kaufe ein Buch.</span>
        > ✅ <span lang="de">Heute kaufe ich ein Buch.</span>

        **Mistake 3: Treating every individual word as a position**

        > ❌ Treating <span lang="de">Morgen früh</span> as two positions and moving the verb to position 3.
        > ✅ <span lang="de">Morgen früh fahre ich.</span> — The entire phrase is position 1.

        ---

        ### Quick Reference Summary

        | What is in Position 1 | Position 2 | Immediately after verb |
        |-----------------------|------------|------------------------|
        | Subject | verb | rest of sentence |
        | Time / adverb | verb | subject + rest |
        | Place phrase | verb | subject + rest |
        | Object | verb | subject + rest |

        The verb **never** moves. Everything else rearranges around it.
      language: en
      why_this_matters: This rule governs every single statement you will ever make
        in German. Without it, your sentences will sound broken to native speakers,
        and you will struggle to vary your sentence rhythm or emphasise different
        information.

- code: verb_complement_nom
  cefr_level: A1
  category: syntax
  subcategory: Verbergänzung
  label: Nominativergänzung
  description: Nominative complement required by certain verbs such as heißen and
    sein.
  examples:
  - Er heißt Heinz Bartels.
  prerequisites:
  - nominative_case
  source_note: Nominativergänzung
  explanations:
    en:
      title: Nominative complements with sein and heißen
      tip: Some verbs — especially <span lang="de">sein</span> (to be) and <span lang="de">heißen</span>
        (to be called) — link the subject to a second noun or pronoun that stays in
        the nominative case. Both sides of the verb describe the same person or thing,
        so both take the same case.
      explanation: |-
        ## Nominative Complements (<span lang="de">Nominativergänzung</span>)

        ### What is a nominative complement?

        A **nominative complement** (German: <span lang="de">Nominativergänzung</span>) is a noun, pronoun, or noun phrase that is required by certain verbs and that refers back to the subject of the sentence. Because it refers to the same entity as the subject, it takes the **nominative case** — just like the subject itself.

        Think of these verbs as an **equals sign**: *subject = complement*.

        ---

        ### Which verbs take a nominative complement?

        At A1 level, the two most important verbs are:

        | German verb | Meaning |
        |---|---|
        | <span lang="de">sein</span> | to be |
        | <span lang="de">heißen</span> | to be called / to be named |

        Both verbs **link** (rather than act on) something, so no accusative is involved.

        ---

        ### Formation

        The structure is simple:

        **Subject (nominative) + linking verb + complement (nominative)**

        Because the complement is in the nominative, its article must match the gender of the noun in the nominative form:

        | Grammatical gender | Definite article | Indefinite article |
        |---|---|---|
        | masculine | <span lang="de">der</span> | <span lang="de">ein</span> |
        | feminine | <span lang="de">die</span> | <span lang="de">eine</span> |
        | neuter | <span lang="de">das</span> | <span lang="de">ein</span> |
        | plural | <span lang="de">die</span> | — |

        ---

        ### Examples

        1. <span lang="de">Er heißt Heinz Bartels.</span> — *He is called Heinz Bartels.*
        2. <span lang="de">Ich bin ein Student.</span> — *I am a student.* (masculine nominative: <span lang="de">ein Student</span>)
        3. <span lang="de">Sie ist die Lehrerin.</span> — *She is the teacher.* (feminine nominative: <span lang="de">die Lehrerin</span>)
        4. <span lang="de">Das ist ein Hund.</span> — *That is a dog.* (neuter subject + masculine complement, both nominative)
        5. <span lang="de">Wir sind Freunde.</span> — *We are friends.* (plural nominative, no article)
        6. <span lang="de">Wie heißt du?</span> — *What is your name?* (question form with <span lang="de">heißen</span>)

        ---

        ### Important notes

        **Professions and nationalities** after <span lang="de">sein</span> usually take **no article** (zero article):
        - <span lang="de">Er ist Arzt.</span> — *He is a doctor.*
        - <span lang="de">Sie ist Lehrerin.</span> — *She is a teacher.*

        This is different from English, where 'a' is always used. Compare the sibling grammar point on zero article (<span lang="de">Nullartikel</span>) for more detail.

        **Pronouns** used as complements are also nominative:
        - <span lang="de">Das bin ich.</span> — *That is me.* (literally: *That am I.*) — note: <span lang="de">ich</span>, not <span lang="de">mich</span>

        ---

        ### Common learner mistakes

        **Mistake 1 — Using accusative instead of nominative after <span lang="de">sein</span>:**

        ❌ <span lang="de">Er ist einen Lehrer.</span>
        ✅ <span lang="de">Er ist ein Lehrer.</span> — *He is a teacher.*

        <span lang="de">Sein</span> does not take an accusative object. Both the subject and the complement stay in the nominative.

        **Mistake 2 — Wrong pronoun form:**

        ❌ <span lang="de">Das ist mich.</span>
        ✅ <span lang="de">Das bin ich.</span> — *That is me.*

        Because the complement refers back to the subject, the pronoun must be in the nominative (<span lang="de">ich</span>, not <span lang="de">mich</span>).

        **Mistake 3 — Adding an article before a profession:**

        ❌ <span lang="de">Sie ist eine Ärztin.</span> (when simply stating her job)
        ✅ <span lang="de">Sie ist Ärztin.</span> — *She is a doctor.*

        Use the indefinite article only when there is an adjective: <span lang="de">Sie ist eine gute Ärztin.</span> — *She is a good doctor.*
      language: en
      why_this_matters: You will use <span lang="de">sein</span> and <span lang="de">heißen</span>
        in almost every German conversation — to introduce yourself, say what something
        is, or describe a role. Without this rule you might reach for the wrong case
        and confuse your listeners.

- code: verb_complement_acc
  cefr_level: A1
  category: syntax
  subcategory: Verbergänzung
  label: Akkusativergänzung
  description: Accusative complement (direct object) required by transitive verbs.
  examples:
  - Ich nehme eine Coca Cola.
  prerequisites:
  - accusative_case
  source_note: Akkusativergänzung
  explanations:
    en:
      title: The accusative complement (direct object)
      tip: Some verbs need a direct object — the thing or person that receives the
        action. This object is in the accusative case, which changes the article form
        for masculine nouns (der → den, ein → einen). Feminine, neuter, and plural
        forms look the same as the nominative.
      explanation: |-
        ## The Accusative Complement (Direct Object)

        ### What it is

        A **transitive verb** is a verb that acts on something or someone. The noun or pronoun that receives that action is called the **direct object**, or in German grammar the <span lang='de'>Akkusativergänzung</span> (accusative complement). It is placed in the **accusative case**.

        Example: <span lang='de'>Ich kaufe **einen Kaffee**.</span> — *I buy a coffee.* The coffee is what is being bought — it is the direct object.

        ---

        ### How the accusative case changes articles

        Only the **masculine singular** article changes form in the accusative. All other genders look identical to the nominative.

        #### Definite articles (<span lang='de'>der/die/das</span>)

        | Gender | Nominative | Accusative |
        |--------|-----------|------------|
        | Masculine | <span lang='de'>der</span> | <span lang='de'>**den**</span> |
        | Feminine | <span lang='de'>die</span> | <span lang='de'>die</span> |
        | Neuter | <span lang='de'>das</span> | <span lang='de'>das</span> |
        | Plural | <span lang='de'>die</span> | <span lang='de'>die</span> |

        #### Indefinite articles (<span lang='de'>ein/eine/ein</span>)

        | Gender | Nominative | Accusative |
        |--------|-----------|------------|
        | Masculine | <span lang='de'>ein</span> | <span lang='de'>**einen**</span> |
        | Feminine | <span lang='de'>eine</span> | <span lang='de'>eine</span> |
        | Neuter | <span lang='de'>ein</span> | <span lang='de'>ein</span> |

        #### Negative article (<span lang='de'>kein/keine</span>)

        | Gender | Nominative | Accusative |
        |--------|-----------|------------|
        | Masculine | <span lang='de'>kein</span> | <span lang='de'>**keinen**</span> |
        | Feminine | <span lang='de'>keine</span> | <span lang='de'>keine</span> |
        | Neuter | <span lang='de'>kein</span> | <span lang='de'>kein</span> |
        | Plural | <span lang='de'>keine</span> | <span lang='de'>keine</span> |

        #### Possessive articles (<span lang='de'>mein, dein, sein, ihr …</span>)

        Possessive articles follow the same pattern — only masculine singular adds <span lang='de'>-en</span>:

        | Gender | Nominative | Accusative |
        |--------|-----------|------------|
        | Masculine | <span lang='de'>mein</span> | <span lang='de'>**meinen**</span> |
        | Feminine | <span lang='de'>meine</span> | <span lang='de'>meine</span> |
        | Neuter | <span lang='de'>mein</span> | <span lang='de'>mein</span> |

        ---

        ### Common transitive verbs at A1

        These verbs almost always appear with an accusative complement:

        | German verb | English meaning |
        |-------------|----------------|
        | <span lang='de'>haben</span> | to have |
        | <span lang='de'>kaufen</span> | to buy |
        | <span lang='de'>nehmen</span> | to take |
        | <span lang='de'>essen</span> | to eat |
        | <span lang='de'>trinken</span> | to drink |
        | <span lang='de'>sehen</span> | to see |
        | <span lang='de'>suchen</span> | to look for |
        | <span lang='de'>brauchen</span> | to need |
        | <span lang='de'>kennen</span> | to know (a person/place) |
        | <span lang='de'>möchten</span> | would like |
        | <span lang='de'>lieben</span> | to love |
        | <span lang='de'>finden</span> | to find |

        ---

        ### Examples

        1. <span lang='de'>Ich nehme eine Coca Cola.</span> — *I'll take a Coca-Cola.* (feminine → no change)
        2. <span lang='de'>Er kauft **den** Kaffee.</span> — *He buys the coffee.* (masculine definite: <span lang='de'>der → den</span>)
        3. <span lang='de'>Wir brauchen **einen** Tisch.</span> — *We need a table.* (masculine indefinite: <span lang='de'>ein → einen</span>)
        4. <span lang='de'>Hast du **das** Buch?</span> — *Do you have the book?* (neuter → no change)
        5. <span lang='de'>Sie sucht **ihren** Schlüssel.</span> — *She is looking for her key.* (masculine possessive: <span lang='de'>ihr → ihren</span>)
        6. <span lang='de'>Ich esse **keinen** Fisch.</span> — *I don't eat fish.* (masculine negative: <span lang='de'>kein → keinen</span>)

        ---

        ### Position in the sentence

        The accusative complement usually comes **after the verb**, or after the subject if the verb is in second position:

        <span lang='de'>Ich kaufe **einen Apfel**.</span> ✔

        When another element comes first (e.g. a time expression), the subject and verb swap, but the accusative object stays in the same relative position after the verb:

        <span lang='de'>Heute kaufe ich **einen Apfel**.</span> ✔

        ---

        ### Personal pronouns in the accusative

        Pronouns also take accusative forms when they are the direct object:

        | Nominative | Accusative |
        |-----------|------------|
        | <span lang='de'>ich</span> | <span lang='de'>mich</span> |
        | <span lang='de'>du</span> | <span lang='de'>dich</span> |
        | <span lang='de'>er</span> | <span lang='de'>ihn</span> |
        | <span lang='de'>sie</span> (she) | <span lang='de'>sie</span> |
        | <span lang='de'>es</span> | <span lang='de'>es</span> |
        | <span lang='de'>wir</span> | <span lang='de'>uns</span> |
        | <span lang='de'>ihr</span> | <span lang='de'>euch</span> |
        | <span lang='de'>sie/Sie</span> | <span lang='de'>sie/Sie</span> |

        Example: <span lang='de'>Er sieht **mich**.</span> — *He sees me.*

        ---

        ### Common learner mistakes

        **Mistake 1:** Forgetting to change <span lang='de'>ein → einen</span> for masculine nouns.

        - ✘ <span lang='de'>Ich kaufe ein Apfel.</span>
        - ✔ <span lang='de'>Ich kaufe **einen** Apfel.</span>

        **Mistake 2:** Changing feminine or neuter articles unnecessarily.

        - ✘ <span lang='de'>Ich esse dien Suppe.</span> (invented form)
        - ✔ <span lang='de'>Ich esse **die** Suppe.</span> (feminine stays <span lang='de'>die</span>)

        **Mistake 3:** Confusing subject (<span lang='de'>Nominativ</span>, nominative) and object (<span lang='de'>Akkusativ</span>, accusative).

        - ✘ <span lang='de'>Den Mann kauft ein Brot.</span> (sounds like the man is buying, but <span lang='de'>den Mann</span> is accusative — object)
        - ✔ <span lang='de'>**Der Mann** kauft ein Brot.</span> — *The man buys a bread.*

        **Mistake 4:** Using <span lang='de'>kein</span> instead of <span lang='de'>keinen</span> with masculine nouns.

        - ✘ <span lang='de'>Ich habe kein Hunger.</span> (<span lang='de'>Hunger</span> is masculine)
        - ✔ <span lang='de'>Ich habe **keinen** Hunger.</span> — *I am not hungry.*
      language: en
      why_this_matters: Most everyday verbs — 'have', 'want', 'buy', 'eat', 'see',
        'need' — require a direct object, so you will use the accusative constantly
        from your very first conversations. Without it you cannot say what you are
        eating, what you want, or what you are looking for.

- code: verb_complement_dat
  cefr_level: A1
  category: syntax
  subcategory: Verbergänzung
  label: Dativergänzung bei ausgewählten Verben
  description: Dative complement required by verbs danken, gehören, geben, and helfen.
  examples:
  - Gib mir bitte mal dein Wörterbuch.
  prerequisites:
  - dative_case
  source_note: Dativergänzung bei den Verben danken/gehören/geben/helfen
  explanations:
    en:
      title: Verbs that require a dative object
      tip: Some German verbs always take a dative object instead of an accusative
        one. The most common at this level are <span lang='de'>danken</span> (to thank),
        <span lang='de'>gehören</span> (to belong to), <span lang='de'>geben</span>
        (to give), and <span lang='de'>helfen</span> (to help). If you know these
        verbs, you know to use dative forms automatically.
      explanation: |-
        ## Verbs that require a dative object

        In German, most verbs that take an object use the **accusative** case. However, a small but very common group of verbs requires the **dative** case for their object. At A1 level, the four most important are:

        | German verb | English meaning |
        |---|---|
        | <span lang='de'>danken</span> | to thank |
        | <span lang='de'>gehören</span> | to belong to |
        | <span lang='de'>geben</span> | to give |
        | <span lang='de'>helfen</span> | to help |

        These verbs are sometimes called **dative verbs** (<span lang='de'>Dativverben</span>) because the person or thing they refer to must always be in the dative case.

        ---

        ### How to form the dative object

        The dative case changes the articles and pronouns used. Here are the key forms you need at A1:

        **Definite articles in the dative:**

        | Gender | Nominative | Dative |
        |---|---|---|
        | masculine | <span lang='de'>der</span> | <span lang='de'>dem</span> |
        | feminine | <span lang='de'>die</span> | <span lang='de'>der</span> |
        | neuter | <span lang='de'>das</span> | <span lang='de'>dem</span> |
        | plural | <span lang='de'>die</span> | <span lang='de'>den</span> |

        **Personal pronouns in the dative:**

        | Nominative | Dative |
        |---|---|
        | <span lang='de'>ich</span> | <span lang='de'>mir</span> |
        | <span lang='de'>du</span> | <span lang='de'>dir</span> |
        | <span lang='de'>er/es</span> | <span lang='de'>ihm</span> |
        | <span lang='de'>sie</span> (she) | <span lang='de'>ihr</span> |
        | <span lang='de'>wir</span> | <span lang='de'>uns</span> |
        | <span lang='de'>ihr</span> (you pl.) | <span lang='de'>euch</span> |
        | <span lang='de'>sie/Sie</span> | <span lang='de'>ihnen/Ihnen</span> |

        ---

        ### Examples

        1. <span lang='de'>Ich danke dir.</span> — I thank you.
        2. <span lang='de'>Das Buch gehört dem Lehrer.</span> — The book belongs to the teacher.
        3. <span lang='de'>Gib mir bitte mal dein Wörterbuch.</span> — Please give me your dictionary.
        4. <span lang='de'>Er hilft seiner Mutter.</span> — He helps his mother.
        5. <span lang='de'>Kannst du mir helfen?</span> — Can you help me?
        6. <span lang='de'>Sie gibt dem Kind einen Apfel.</span> — She gives the child an apple.

        ---

        ### Special note on <span lang='de'>geben</span>

        <span lang='de'>Geben</span> is special because it can take **two** objects: a dative object (the person receiving) and an accusative object (the thing being given).

        > <span lang='de'>Sie gibt **dem Kind** (dative) **einen Apfel** (accusative).</span>
        > She gives **the child** an apple.

        The dative object is always the person; the accusative object is always the thing.

        ---

        ### Common learner mistakes

        **Mistake:** Using accusative instead of dative.
        > ❌ <span lang='de'>Ich helfe ihn.</span>
        > ✅ <span lang='de'>Ich helfe ihm.</span> — I help him.

        **Mistake:** Using nominative pronoun as object.
        > ❌ <span lang='de'>Danke sie.</span>
        > ✅ <span lang='de'>Ich danke ihr.</span> — I thank her.

        **Mistake:** Wrong article with <span lang='de'>gehören</span>.
        > ❌ <span lang='de'>Das gehört die Frau.</span>
        > ✅ <span lang='de'>Das gehört der Frau.</span> — That belongs to the woman.

        ---

        ### Quick checklist

        Whenever you use <span lang='de'>danken</span>, <span lang='de'>gehören</span>, <span lang='de'>geben</span>, or <span lang='de'>helfen</span>, ask yourself: *Is my object in the dative form?* Check the article or pronoun against the tables above before finishing your sentence.
      language: en
      why_this_matters: These four verbs appear constantly in everyday German — asking
        for help, giving things, thanking people, and talking about ownership. Without
        knowing they take dative, you will use the wrong pronoun or article every
        time and sound unnatural to native speakers.

- code: verb_complement_loca
  cefr_level: A1
  category: syntax
  subcategory: Verbergänzung
  label: Lokalergänzung
  description: Local complement expressing place where an action occurs or direction
    of movement, required by verbs like wohnen.
  examples:
  - Wir wohnen in der Heinestraße 7.
  prerequisites:
  - prep_local
  source_note: Lokalergänzung
  explanations:
    en:
      title: 'Local complements: saying where'
      tip: Some German verbs require a place to complete their meaning — without it,
        the sentence feels unfinished. This place phrase is called a Lokalergänzung
        (local complement) and answers the questions 'where?' or 'where to?'.
      explanation: |-
        ## Local Complements (Lokalergänzung)

        ### What is a Lokalergänzung?

        A <span lang='de'>Lokalergänzung</span> (local complement) is a obligatory phrase that completes the meaning of certain verbs by stating **where** something is or happens, or **where** someone or something is moving **to**. Unlike optional place phrases that you can drop without breaking the sentence, the <span lang='de'>Lokalergänzung</span> is required — the sentence is grammatically incomplete or sounds very odd without it.

        Compare:
        - Optional: <span lang='de'>Ich esse **im Park**.</span> → <span lang='de'>Ich esse.</span> ✔ (still complete)
        - Required: <span lang='de'>Ich wohne **in Berlin**.</span> → <span lang='de'>Ich wohne.</span> ✗ (feels incomplete)

        ---

        ### Which verbs require a Lokalergänzung?

        At A1 level, the most important verbs that need a local complement are:

        | German verb | English meaning | Question answered |
        |---|---|---|
        | <span lang='de'>wohnen</span> | to live / reside | where? (<span lang='de'>wo?</span>) |
        | <span lang='de'>sein</span> | to be | where? (<span lang='de'>wo?</span>) |
        | <span lang='de'>liegen</span> | to lie / be located | where? (<span lang='de'>wo?</span>) |
        | <span lang='de'>stehen</span> | to stand / be | where? (<span lang='de'>wo?</span>) |
        | <span lang='de'>hängen</span> | to hang | where? (<span lang='de'>wo?</span>) |
        | <span lang='de'>gehen</span> | to go | where to? (<span lang='de'>wohin?</span>) |
        | <span lang='de'>fahren</span> | to travel / drive | where to? (<span lang='de'>wohin?</span>) |
        | <span lang='de'>kommen</span> | to come | where from? (<span lang='de'>woher?</span>) |

        ---

        ### Two types of local complement

        **1. Static location (wo? — where?)**
        Describes where someone or something *is*. These phrases typically use the **dative** case after a two-way preposition.

        Common prepositions: <span lang='de'>in</span>, <span lang='de'>an</span>, <span lang='de'>auf</span>, <span lang='de'>bei</span>, <span lang='de'>neben</span>, <span lang='de'>vor</span>, <span lang='de'>hinter</span>, <span lang='de'>über</span>, <span lang='de'>unter</span>, <span lang='de'>zwischen</span>

        > <span lang='de'>Das Buch liegt **auf dem Tisch**.</span> — The book is lying on the table.
        > <span lang='de'>Ich wohne **in der Heinestraße 7**.</span> — I live at Heinestraße 7.

        **2. Directed movement (wohin? — where to?)**
        Describes where someone or something *moves to*. Two-way prepositions take the **accusative** case here. Some verbs use fixed prepositions (<span lang='de'>gehen + in/auf/zu/nach</span>).

        > <span lang='de'>Sie geht **in die Schule**.</span> — She is going to school.
        > <span lang='de'>Wir fahren **nach Berlin**.</span> — We are travelling to Berlin.

        ---

        ### Formation: preposition + noun phrase

        A <span lang='de'>Lokalergänzung</span> is almost always built from a **preposition + a noun phrase** (with article and noun in the correct case). The preposition signals the spatial relationship.

        **Key preposition rules at A1:**

        - <span lang='de'>**in + Dativ**</span> (static): <span lang='de'>in dem → im</span>
         - <span lang='de'>im Zimmer</span> (in the room), <span lang='de'>in der Stadt</span> (in the city)
        - <span lang='de'>**in + Akkusativ**</span> (movement toward): <span lang='de'>in das → ins</span>
         - <span lang='de'>ins Kino</span> (to the cinema), <span lang='de'>in die Küche</span> (into the kitchen)
        - <span lang='de'>**nach**</span> (movement toward cities/countries without article):
         - <span lang='de'>nach Berlin</span>, <span lang='de'>nach Hause</span>
        - <span lang='de'>**bei + Dativ**</span> (at someone's place):
         - <span lang='de'>bei meiner Mutter</span> (at my mother's)
        - <span lang='de'>**auf + Dativ**</span> (static, on a surface or open space):
         - <span lang='de'>auf dem Tisch</span> (on the table)

        ---

        ### Examples with translations

        1. <span lang='de'>Wir wohnen **in der Heinestraße 7**.</span> — We live at Heinestraße 7.
        2. <span lang='de'>Das Café ist **hier**.</span> — The café is here.
        3. <span lang='de'>Die Kinder sind **im Garten**.</span> — The children are in the garden.
        4. <span lang='de'>Er geht **in die Küche**.</span> — He goes into the kitchen.
        5. <span lang='de'>Wir fahren **nach München**.</span> — We are travelling to Munich.
        6. <span lang='de'>Das Bild hängt **an der Wand**.</span> — The picture is hanging on the wall.

        ---

        ### Position in the sentence

        The <span lang='de'>Lokalergänzung</span> usually comes **after the verb** or at the **end of the sentence**. When placed at the start for emphasis, the verb still stays in second position (see the <span lang='de'>Verbzweitstellung</span> rule).

        > <span lang='de'>**Im Park** wohne ich nicht.</span> — I don't live in the park.
        > <span lang='de'>Ich wohne **im Park**.</span> — I live in the park.

        ---

        ### Common learner mistakes

        **Mistake 1: Forgetting the local complement entirely**
        > ✗ <span lang='de'>Ich wohne.</span>
        > ✔ <span lang='de'>Ich wohne **in Hamburg**.</span>

        Verbs like <span lang='de'>wohnen</span> sound unfinished without a place.

        **Mistake 2: Using accusative instead of dative for static location**
        > ✗ <span lang='de'>Das Buch liegt auf **den** Tisch.</span>
        > ✔ <span lang='de'>Das Buch liegt auf **dem** Tisch.</span>

        Static location → dative. Movement → accusative.

        **Mistake 3: Using 'in' before city names**
        > ✗ <span lang='de'>Wir fahren **in** Berlin.</span>
        > ✔ <span lang='de'>Wir fahren **nach** Berlin.</span>

        Use <span lang='de'>nach</span> for cities and most countries (those without a definite article).

        **Mistake 4: Confusing 'wo?' and 'wohin?' prepositions**
        > ✗ <span lang='de'>Er geht **im** Supermarkt.</span> (dative = static)
        > ✔ <span lang='de'>Er geht **in den** Supermarkt.</span> (accusative = movement)
      language: en
      why_this_matters: You need this pattern every time you say where someone lives,
        works, sits, stands, or is going. It appears in almost every conversation
        about daily life, and without it you cannot form complete sentences with verbs
        like <span lang='de'>wohnen</span>, <span lang='de'>sein</span>, or <span
        lang='de'>gehen</span>.

- code: verb_complement_qual
  cefr_level: A1
  category: syntax
  subcategory: Verbergänzung
  label: Qualitativergänzung
  description: Qualitative complement (predicate adjective) required by verbs like
    sein expressing a quality or state.
  examples:
  - Der Film ist langweilig.
  source_note: Qualitativergänzung
  explanations:
    en:
      title: 'Qualitative complements: describing with ''sein'''
      tip: Some verbs — especially <span lang="de">sein</span> (to be), <span lang="de">werden</span>
        (to become), and <span lang="de">bleiben</span> (to stay) — require an adjective
        to complete their meaning. This adjective is called a qualitative complement
        and describes a quality or state of the subject.
      explanation: |-
        ## Qualitative Complements (Qualitativergänzung)

        ### What is a qualitative complement?

        A **qualitative complement** (German: <span lang="de">Qualitativergänzung</span>) is an adjective — or sometimes a noun phrase — that a verb **requires** to make a complete sentence. It describes a quality, property, or state of the subject. Without it, the sentence feels unfinished.

        The most important verb that takes a qualitative complement is <span lang="de">sein</span> (to be). Other common ones are <span lang="de">werden</span> (to become) and <span lang="de">bleiben</span> (to stay/remain).

        > **Key rule:** The qualitative complement follows the verb directly and refers back to the subject. It does NOT change its form to match the subject's gender — it stays in its base (uninflected) adjective form.

        ---

        ### Formation

        The basic pattern is:

        **Subject + <span lang="de">sein/werden/bleiben</span> + adjective (qualitative complement)**

        | Subject | Verb | Qualitative Complement |
        |---|---|---|
        | <span lang="de">Der Film</span> | <span lang="de">ist</span> | <span lang="de">langweilig.</span> |
        | <span lang="de">Das Kind</span> | <span lang="de">ist</span> | <span lang="de">klein.</span> |
        | <span lang="de">Die Suppe</span> | <span lang="de">ist</span> | <span lang="de">heiß.</span> |
        | <span lang="de">Er</span> | <span lang="de">wird</span> | <span lang="de">müde.</span> |
        | <span lang="de">Das Wetter</span> | <span lang="de">bleibt</span> | <span lang="de">schön.</span> |

        Notice that <span lang="de">langweilig</span>, <span lang="de">klein</span>, <span lang="de">heiß</span>, <span lang="de">müde</span>, and <span lang="de">schön</span> all use their base form — no endings are added.

        ---

        ### Qualitative complement vs. attributive adjective

        This is one of the most important distinctions for learners:

        - A **qualitative complement** (predicate adjective) comes **after** <span lang="de">sein</span> and has **no ending**:
          - <span lang="de">Der Mann ist alt.</span> — The man is old.
        - An **attributive adjective** comes **before** a noun and **does** take an ending:
          - <span lang="de">der alte Mann</span> — the old man

        At A1 level, focus on the complement form (no endings after <span lang="de">sein</span>).

        ---

        ### Key verbs that require a qualitative complement

        | German | English |
        |---|---|
        | <span lang="de">sein</span> | to be |
        | <span lang="de">werden</span> | to become / to get |
        | <span lang="de">bleiben</span> | to stay / to remain |

        These verbs are sometimes called **copula verbs** because they link the subject to a description rather than expressing an action.

        ---

        ### Examples with English translations

        1. <span lang="de">Der Film ist langweilig.</span> — The film is boring.
        2. <span lang="de">Das Wetter ist heute schön.</span> — The weather is nice today.
        3. <span lang="de">Meine Schwester ist sehr nett.</span> — My sister is very nice.
        4. <span lang="de">Das Essen wird kalt.</span> — The food is getting cold.
        5. <span lang="de">Ich bin müde.</span> — I am tired.
        6. <span lang="de">Die Aufgabe ist nicht einfach.</span> — The task is not easy.

        ---

        ### Common learner mistakes

        **Mistake 1: Adding adjective endings after <span lang="de">sein</span>**

        - ❌ <span lang="de">Der Mann ist alter.</span>
        - ✅ <span lang="de">Der Mann ist alt.</span> — The man is old.

        Adjectives used as qualitative complements never take endings in German.

        **Mistake 2: Leaving out the complement**

        Unlike in some languages, leaving out the complement makes the sentence incomplete or changes its meaning:

        - ❌ <span lang="de">Das Wetter ist.</span> (not a complete sentence)
        - ✅ <span lang="de">Das Wetter ist schön.</span> — The weather is nice.

        **Mistake 3: Confusing the qualitative complement with an adverb**

        Adjectives after <span lang="de">sein</span> describe the **subject**, not the action. Compare:

        - <span lang="de">Er ist schnell.</span> — He is fast. (describes him → qualitative complement)
        - <span lang="de">Er läuft schnell.</span> — He runs fast. (describes how he runs → adverb)

        Both use the same base adjective form in German, which can be confusing, but the function is different.

        ---

        ### Quick reference

        | Pattern | Example | Translation |
        |---|---|---|
        | <span lang="de">Subject + sein + Adj.</span> | <span lang="de">Das Buch ist interessant.</span> | The book is interesting. |
        | <span lang="de">Subject + werden + Adj.</span> | <span lang="de">Es wird dunkel.</span> | It is getting dark. |
        | <span lang="de">Subject + bleiben + Adj.</span> | <span lang="de">Bleib ruhig!</span> | Stay calm! |
      language: en
      why_this_matters: You will use <span lang="de">sein</span> in almost every conversation
        to describe people, places, and things. Without the qualitative complement,
        sentences like <span lang="de">'Das Wetter ist schön'</span> or <span lang="de">'Ich
        bin müde'</span> would be impossible to form.

- code: sentence_bracket
  cefr_level: A1
  category: syntax
  subcategory: Satzklammer
  label: Satzklammer
  description: The verbal bracket formed by the finite verb in second position and
    a non-finite verb element (infinitive, participle, or separable prefix) at the
    end of the clause.
  examples:
  - Der Unterricht fängt um 9 Uhr an.
  - Ich will meine Tante besuchen.
  - Ich habe schon gegessen.
  prerequisites:
  - verb_second_position
  source_note: Satzklammer
  explanations:
    en:
      title: The Sentence Bracket (Satzklammer)
      tip: In German, the finite verb always sits in second position, but any non-finite
        part — a separable prefix, an infinitive, or a past participle — is pushed
        to the very end of the clause. These two verb parts form a 'bracket' around
        the middle of the sentence.
      explanation: |-
        ## The Sentence Bracket

        The <span lang="de">Satzklammer</span> (sentence bracket) is the grammatical frame created when a clause contains two verb elements: a **finite verb** (the conjugated verb) locked in **second position**, and a **non-finite element** sent to the **end of the clause**. Everything else in the sentence — objects, adverbs, complements — sits *inside* this bracket.

        ---

        ### Why it exists

        German verbs can consist of more than one part: a conjugated helper or main verb plus an infinitive, a past participle, or a separable prefix. German grammar rules force the conjugated part to position 2, and everything non-finite to the final position. This creates a frame with content in the middle.

        ---

        ### The three main situations

        #### 1. Separable verbs

        Separable verbs split into two parts: the conjugated stem stays at position 2, and the detached prefix moves to the end.

        | Position 1 | Position 2 (finite) | Middle | End (non-finite) |
        |---|---|---|---|
        | <span lang="de">Der Unterricht</span> | <span lang="de">fängt</span> | <span lang="de">um 9 Uhr</span> | <span lang="de">an.</span> |
        | <span lang="de">Ich</span> | <span lang="de">rufe</span> | <span lang="de">meine Mutter</span> | <span lang="de">an.</span> |

        - <span lang="de">Der Unterricht fängt um 9 Uhr an.</span> — *The lesson starts at 9 o'clock.*
        - <span lang="de">Ich rufe meine Mutter an.</span> — *I call my mother.*

        #### 2. Modal verbs + infinitive

        The modal verb (<span lang="de">können, wollen, müssen, dürfen, sollen, mögen</span>) is conjugated at position 2. The full infinitive of the main verb sits at the end.

        | Position 1 | Position 2 (finite modal) | Middle | End (infinitive) |
        |---|---|---|---|
        | <span lang="de">Ich</span> | <span lang="de">will</span> | <span lang="de">meine Tante</span> | <span lang="de">besuchen.</span> |
        | <span lang="de">Sie</span> | <span lang="de">kann</span> | <span lang="de">gut</span> | <span lang="de">kochen.</span> |

        - <span lang="de">Ich will meine Tante besuchen.</span> — *I want to visit my aunt.*
        - <span lang="de">Sie kann gut kochen.</span> — *She can cook well.*

        #### 3. Perfect tense (<span lang="de">Perfekt</span>)

        The auxiliary verb <span lang="de">haben</span> or <span lang="de">sein</span> is conjugated at position 2. The past participle (<span lang="de">Partizip II</span>) goes to the end.

        | Position 1 | Position 2 (finite auxiliary) | Middle | End (participle) |
        |---|---|---|---|
        | <span lang="de">Ich</span> | <span lang="de">habe</span> | <span lang="de">schon</span> | <span lang="de">gegessen.</span> |
        | <span lang="de">Er</span> | <span lang="de">ist</span> | <span lang="de">gestern</span> | <span lang="de">gekommen.</span> |

        - <span lang="de">Ich habe schon gegessen.</span> — *I have already eaten.*
        - <span lang="de">Er ist gestern gekommen.</span> — *He came yesterday.*

        ---

        ### How the bracket looks visually

        ```
        [ finite verb ] ... content ... [ non-finite element ]
        ```

        <span lang="de">Ich **will** morgen früh ins Kino **gehen**.</span>
        *I want to go to the cinema early tomorrow.*

        The words <span lang="de">morgen früh ins Kino</span> are held inside the bracket formed by <span lang="de">will … gehen</span>.

        ---

        ### What goes inside the bracket?

        Almost everything: objects, time expressions, place expressions, adverbs. None of these interrupt the finite verb's position 2 slot or push past the non-finite element at the end.

        - <span lang="de">Wir **haben** gestern Abend einen Film **gesehen**.</span> — *We watched a film yesterday evening.*
        - <span lang="de">Du **musst** jetzt sofort nach Hause **gehen**.</span> — *You must go home right now.*

        ---

        ### Common learner mistakes

        **Mistake 1 — Forgetting to move the prefix to the end:**

        ❌ <span lang="de">Ich anrufe meine Mutter.</span>
        ✅ <span lang="de">Ich rufe meine Mutter an.</span>

        **Mistake 2 — Putting the infinitive in the middle:**

        ❌ <span lang="de">Ich will besuchen meine Tante.</span>
        ✅ <span lang="de">Ich will meine Tante besuchen.</span>

        **Mistake 3 — Putting the participle in the middle:**

        ❌ <span lang="de">Ich habe gegessen schon.</span>
        ✅ <span lang="de">Ich habe schon gegessen.</span>

        **Mistake 4 — Forgetting the bracket in questions:**

        In yes/no questions the finite verb moves to position 1, but the non-finite element still stays at the end:

        ✅ <span lang="de">Willst du meine Tante besuchen?</span> — *Do you want to visit my aunt?*
        ✅ <span lang="de">Hast du schon gegessen?</span> — *Have you already eaten?*

        ---

        ### Quick reference summary

        | Verb type | Position 2 | End of clause |
        |---|---|---|
        | Separable verb | conjugated stem | detached prefix |
        | Modal + infinitive | conjugated modal | infinitive |
        | Perfect tense | <span lang="de">haben / sein</span> (conjugated) | past participle |
      language: en
      why_this_matters: The sentence bracket is one of the most distinctive features
        of German word order, and you will meet it in almost every sentence that uses
        a modal verb, the perfect tense, or a separable verb. Without understanding
        it, you cannot correctly place verb parts or follow where a sentence is heading.

- code: negation_nicht
  cefr_level: A1
  category: syntax
  subcategory: Negation
  label: Negation mit nicht
  description: Negation of verbs, adjectives, and adverbs using nicht.
  examples:
  - Leider verstehe ich dich nicht.
  - Ich gehe heute nicht spazieren, denn es ist zu kalt.
  prerequisites:
  - ja_nein_nicht
  source_note: 'Negation: nicht'
  explanations:
    en:
      title: Negating verbs, adjectives, and adverbs with nicht
      tip: Use <span lang="de">nicht</span> (not) to negate verbs, adjectives, and
        adverbs. Its position in the sentence depends on what you are negating — it
        generally comes late in the sentence, but moves directly before the word it
        negates when targeting an adjective or adverb.
      explanation: |-
        ## Negation with <span lang="de">nicht</span>

        ### What is <span lang="de">nicht</span>?

        <span lang="de">Nicht</span> is the German adverb meaning *not*. It is used to negate **verbs**, **adjectives**, **adverbs**, and **prepositional phrases**. It does NOT negate nouns directly — for that, German uses <span lang="de">kein</span> (see the *Negation mit kein* grammar point).

        ---

        ### Rule 1 — Negating the whole verb or sentence

        When <span lang="de">nicht</span> negates the **entire action** (the verb), it goes **as late as possible** in the sentence — typically at the very end, or just before a separable prefix, an infinitive, or a past participle.

        | Position | Example |
        |---|---|
        | End of sentence | <span lang="de">Ich schlafe nicht.</span> — *I am not sleeping.* |
        | Before separable prefix | <span lang="de">Er steht nicht auf.</span> — *He is not getting up.* |
        | Before infinitive | <span lang="de">Sie kann nicht kommen.</span> — *She cannot come.* |
        | Before past participle | <span lang="de">Wir haben nicht geschlafen.</span> — *We did not sleep.* |

        ---

        ### Rule 2 — Negating a specific element

        When <span lang="de">nicht</span> negates a **specific adjective, adverb, or prepositional phrase**, it is placed **directly before** that element.

        - <span lang="de">Das Essen ist **nicht** gut.</span> — *The food is not good.* (negates the adjective <span lang="de">gut</span>)
        - <span lang="de">Er kommt **nicht** heute.</span> — *He is not coming today.* (negates the adverb <span lang="de">heute</span>)
        - <span lang="de">Ich wohne **nicht** in Berlin.</span> — *I don't live in Berlin.* (negates the prepositional phrase)

        ---

        ### Sentence bracket (<span lang="de">Satzklammer</span>)

        German sentences often have a **sentence bracket** — the conjugated verb sits in second position, and a second verbal element (infinitive, participle, separable prefix) goes to the very end. <span lang="de">Nicht</span> slots in **just before** that final verbal element when negating the whole sentence.

        | Sentence | <span lang="de">nicht</span> before... |
        |---|---|
        | <span lang="de">Ich rufe dich **nicht** an.</span> — *I'm not calling you.* | separable prefix <span lang="de">an</span> |
        | <span lang="de">Du musst das **nicht** machen.</span> — *You don't have to do that.* | infinitive <span lang="de">machen</span> |
        | <span lang="de">Er hat heute **nicht** gearbeitet.</span> — *He didn't work today.* | participle <span lang="de">gearbeitet</span> |

        ---

        ### Common positions summarised

        | What is negated | Position of <span lang="de">nicht</span> | Example |
        |---|---|---|
        | Whole action / verb | End of sentence (or before final verb element) | <span lang="de">Ich verstehe das nicht.</span> |
        | Predicate adjective | Directly before the adjective | <span lang="de">Das ist nicht schwer.</span> |
        | Adverb | Directly before the adverb | <span lang="de">Er schläft nicht gut.</span> |
        | Prepositional phrase | Directly before the preposition | <span lang="de">Sie wohnt nicht hier.</span> |

        ---

        ### More examples with translations

        1. <span lang="de">Leider verstehe ich dich nicht.</span> — *Unfortunately I don't understand you.*
        2. <span lang="de">Das Café ist nicht weit.</span> — *The café is not far.*
        3. <span lang="de">Ich gehe heute nicht spazieren, denn es ist zu kalt.</span> — *I'm not going for a walk today because it's too cold.*
        4. <span lang="de">Das Kind schläft noch nicht.</span> — *The child is not sleeping yet.*
        5. <span lang="de">Der Film ist nicht interessant.</span> — *The film is not interesting.*
        6. <span lang="de">Wir fahren nicht mit dem Bus.</span> — *We are not going by bus.*

        ---

        ### <span lang="de">nicht</span> vs. <span lang="de">kein</span>

        A very common mistake is using <span lang="de">nicht</span> to negate a noun. German uses <span lang="de">kein</span> for that:

        | ❌ Incorrect | ✅ Correct | Meaning |
        |---|---|---|
        | <span lang="de">Ich habe nicht Hunger.</span> | <span lang="de">Ich habe keinen Hunger.</span> | *I'm not hungry.* |
        | <span lang="de">Er hat nicht ein Auto.</span> | <span lang="de">Er hat kein Auto.</span> | *He doesn't have a car.* |

        Use <span lang="de">nicht</span> when there is **no article** or when negating a verb, adjective, or adverb. Use <span lang="de">kein</span> when negating a **noun** that would otherwise take <span lang="de">ein</span> or no article.

        ---

        ### Common learner mistakes

        **Mistake 1 — Putting <span lang="de">nicht</span> too early:**
        - ❌ <span lang="de">Ich nicht verstehe das.</span>
        - ✅ <span lang="de">Ich verstehe das nicht.</span> — *I don't understand that.*

        **Mistake 2 — Forgetting the sentence bracket rule:**
        - ❌ <span lang="de">Ich habe nicht das gemacht.</span>
        - ✅ <span lang="de">Ich habe das nicht gemacht.</span> — *I didn't do that.*

        **Mistake 3 — Using <span lang="de">nicht</span> instead of <span lang="de">kein</span> before a noun:**
        - ❌ <span lang="de">Ich habe nicht Zeit.</span>
        - ✅ <span lang="de">Ich habe keine Zeit.</span> — *I don't have time.*
      language: en
      why_this_matters: Negation is one of the first things you need in any language
        — you cannot say 'I don't understand,' 'She is not at home,' or 'That's not
        right' without it. <span lang="de">Nicht</span> is the workhorse of German
        negation and appears in almost every conversation.

- code: negation_kein
  cefr_level: A1
  category: syntax
  subcategory: Negation
  label: Negation mit kein
  description: Negation of nouns using kein/keine as a negative article replacing
    ein/eine or the zero article.
  examples:
  - Wir haben jetzt keine Zeit.
  - Er ist kein Lehrer.
  prerequisites:
  - negative_article_kei
  source_note: 'Negation: kein'
  explanations:
    en:
      title: Negating nouns with kein
      tip: Use <span lang="de">kein</span> (not <span lang="de">nicht</span>) to negate
        a noun — it means 'no' or 'not a/any'. It follows the same endings as the
        indefinite article <span lang="de">ein</span>, but it also has plural forms.
      explanation: |-
        ## Negating nouns with <span lang="de">kein</span>

        ### What is <span lang="de">kein</span>?

        <span lang="de">Kein</span> is the **negative article** (Negativartikel). It is placed directly before a noun to negate it, meaning 'no', 'not a', or 'not any' in English. It replaces:

        - the indefinite article <span lang="de">ein/eine</span> — e.g. <span lang="de">ein Hund</span> → <span lang="de">kein Hund</span>
        - the **zero article** (when a noun has no article at all) — e.g. <span lang="de">Ich trinke Kaffee.</span> → <span lang="de">Ich trinke keinen Kaffee.</span>

        > **Important:** Never use <span lang="de">kein</span> to replace a definite article (<span lang="de">der/die/das</span>). In that case, use <span lang="de">nicht</span> instead.

        ---

        ### Formation: endings of <span lang="de">kein</span>

        <span lang="de">Kein</span> takes the same endings as <span lang="de">ein</span> in the singular, but unlike <span lang="de">ein</span>, it also has **plural forms**.

        #### Nominative (subject)

        | Gender | Article | Negative Article |
        |---|---|---|
        | Masculine (<span lang="de">der</span>) | <span lang="de">ein</span> | <span lang="de">kein</span> |
        | Feminine (<span lang="de">die</span>) | <span lang="de">eine</span> | <span lang="de">keine</span> |
        | Neuter (<span lang="de">das</span>) | <span lang="de">ein</span> | <span lang="de">kein</span> |
        | Plural (<span lang="de">die</span>) | — (zero article) | <span lang="de">keine</span> |

        #### Accusative (direct object)

        | Gender | Article | Negative Article |
        |---|---|---|
        | Masculine (<span lang="de">den</span>) | <span lang="de">einen</span> | <span lang="de">keinen</span> |
        | Feminine (<span lang="de">die</span>) | <span lang="de">eine</span> | <span lang="de">keine</span> |
        | Neuter (<span lang="de">das</span>) | <span lang="de">ein</span> | <span lang="de">kein</span> |
        | Plural (<span lang="de">die</span>) | — (zero article) | <span lang="de">keine</span> |

        #### Dative (indirect object / after dative prepositions)

        | Gender | Negative Article |
        |---|---|
        | Masculine (<span lang="de">dem</span>) | <span lang="de">keinem</span> |
        | Feminine (<span lang="de">der</span>) | <span lang="de">keiner</span> |
        | Neuter (<span lang="de">dem</span>) | <span lang="de">keinem</span> |
        | Plural (<span lang="de">den</span>) | <span lang="de">keinen</span> |

        > At A1 level, focus especially on the **nominative** and **accusative** forms.

        ---

        ### Examples

        1. <span lang="de">Er ist kein Lehrer.</span> — He is not a teacher. *(nominative, masculine)*
        2. <span lang="de">Wir haben jetzt keine Zeit.</span> — We have no time now. *(accusative, feminine)*
        3. <span lang="de">Ich habe keinen Hunger.</span> — I am not hungry. (lit. I have no hunger.) *(accusative, masculine)*
        4. <span lang="de">Sie hat kein Auto.</span> — She has no car. *(accusative, neuter)*
        5. <span lang="de">Hier sind keine Kinder.</span> — There are no children here. *(nominative, plural)*
        6. <span lang="de">Ich trinke keinen Kaffee.</span> — I don't drink coffee. *(accusative, masculine — zero article negated)*

        ---

        ### <span lang="de">Kein</span> vs. <span lang="de">nicht</span>

        A very common learner mistake is using <span lang="de">nicht</span> where <span lang="de">kein</span> is needed, or vice versa.

        | Situation | Use | Example |
        |---|---|---|
        | Negating a noun (with <span lang="de">ein</span> or zero article) | <span lang="de">kein</span> | <span lang="de">Ich habe **kein** Geld.</span> |
        | Negating a noun with a definite article | <span lang="de">nicht</span> | <span lang="de">Ich nehme **nicht** den Bus.</span> |
        | Negating a verb, adjective, or adverb | <span lang="de">nicht</span> | <span lang="de">Er schläft **nicht**.</span> |

        **Wrong:** <span lang="de">~~Ich habe nicht ein Auto.~~</span>
        **Right:** <span lang="de">Ich habe kein Auto.</span> — I don't have a car.

        **Wrong:** <span lang="de">~~Sie ist keine müde.~~</span>
        **Right:** <span lang="de">Sie ist nicht müde.</span> — She is not tired.

        ---

        ### Quick tip

        If you can put <span lang="de">ein/eine</span> before the noun in the positive sentence, replace it with <span lang="de">kein/keine</span> to negate. If there is no article (zero article), add <span lang="de">kein/keine</span> with the correct ending. If the noun already has <span lang="de">der/die/das</span>, use <span lang="de">nicht</span> instead.
      language: en
      why_this_matters: You will need <span lang="de">kein</span> constantly — to
        say you have no time, no money, no car, or that someone is not a teacher.
        Without it, you cannot correctly negate the most basic everyday statements
        about things and people.

- code: yes_no_question
  cefr_level: A1
  category: syntax
  subcategory: Fragesatz
  label: Entscheidungsfrage
  description: Yes/no questions formed by placing the finite verb in first position.
  examples:
  - Kaufst du heute ein?
  - Kommst du mit?
  prerequisites:
  - verb_second_position
  source_note: Entscheidungsfrage
  explanations:
    en:
      title: 'Yes/No Questions: Verb in First Position'
      tip: To ask a yes/no question in German, simply move the verb to the very first
        position in the sentence. The subject comes right after it, and the rest of
        the sentence follows normally. No extra question word is needed.
      explanation: |-
        ## Yes/No Questions in German

        ### What Is a Yes/No Question?

        A yes/no question (German: <span lang="de">Entscheidungsfrage</span>, literally 'decision question') is a question that can be answered with <span lang="de">ja</span> (yes), <span lang="de">nein</span> (no), or <span lang="de">doch</span> (yes, contradicting a negative). It asks whether something is true or not.

        ---

        ### The Core Rule: Verb-First (Verb in Position 1)

        In a normal German statement, the finite verb sits in **second position** (<span lang="de">Verbzweitstellung</span>). To form a yes/no question, you move the finite verb to **first position** — before the subject. This is called <span lang="de">Verberststellung</span> (verb-first position).

        | Statement | Yes/No Question |
        |---|---|
        | <span lang="de">Du kaufst heute ein.</span> (You are shopping today.) | <span lang="de">Kaufst du heute ein?</span> (Are you shopping today?) |
        | <span lang="de">Er kommt mit.</span> (He is coming along.) | <span lang="de">Kommt er mit?</span> (Is he coming along?) |
        | <span lang="de">Sie hat Zeit.</span> (She has time.) | <span lang="de">Hat sie Zeit?</span> (Does she have time?) |

        The word order is simply: **Verb → Subject → (rest of sentence)**

        ---

        ### Formation Steps

        1. Start with your statement: <span lang="de">Du trinkst Kaffee.</span>
        2. Move the verb to position 1: <span lang="de">Trinkst</span>
        3. Place the subject right after: <span lang="de">Trinkst du</span>
        4. Add the rest: <span lang="de">Trinkst du Kaffee?</span>
        5. Add a question mark at the end.

        ---

        ### Examples

        | German | English |
        |---|---|
        | <span lang="de">Kaufst du heute ein?</span> | Are you shopping today? |
        | <span lang="de">Kommst du mit?</span> | Are you coming along? |
        | <span lang="de">Ist das dein Buch?</span> | Is that your book? |
        | <span lang="de">Haben Sie einen Moment?</span> | Do you have a moment? |
        | <span lang="de">Spricht er Deutsch?</span> | Does he speak German? |
        | <span lang="de">Möchtest du einen Kaffee?</span> | Would you like a coffee? |

        ---

        ### Separable Verbs

        With <span lang="de">trennbare Verben</span> (separable verbs), the prefix stays at the **end** of the sentence, just as it does in statements. Only the main part of the verb moves to first position.

        - Statement: <span lang="de">Du rufst mich an.</span> (You are calling me.)
        - Question: <span lang="de">Rufst du mich an?</span> (Are you calling me?)

        - Statement: <span lang="de">Er macht das Fenster auf.</span> (He is opening the window.)
        - Question: <span lang="de">Macht er das Fenster auf?</span> (Is he opening the window?)

        ---

        ### Modal Verbs and Perfect Tense

        When a sentence has two verb parts (a modal verb + infinitive, or a <span lang="de">Perfekt</span> form with <span lang="de">haben</span>/<span lang="de">sein</span>), only the **finite** (conjugated) verb moves to first position. The second part stays at the end.

        **Modal verb:**
        - Statement: <span lang="de">Du kannst schwimmen.</span> (You can swim.)
        - Question: <span lang="de">Kannst du schwimmen?</span> (Can you swim?)

        **Perfect tense:**
        - Statement: <span lang="de">Er hat gegessen.</span> (He has eaten.)
        - Question: <span lang="de">Hat er gegessen?</span> (Has he eaten?)

        This follows the same <span lang="de">Satzklammer</span> (sentence bracket) pattern used in all German sentences with two verb parts.

        ---

        ### Answering Yes/No Questions

        German has three short answers:

        | Situation | Answer |
        |---|---|
        | Positive answer | <span lang="de">Ja.</span> (Yes.) |
        | Negative answer | <span lang="de">Nein.</span> (No.) |
        | Contradicting a negative question | <span lang="de">Doch!</span> (Yes, actually!) |

        Example of <span lang="de">doch</span>: <span lang="de">Kommst du nicht mit? — Doch!</span> (Aren't you coming along? — Yes, I am!)

        ---

        ### Common Learner Mistakes

        **1. Forgetting to move the verb and using English-style word order:**
        - ❌ <span lang="de">Du kommst mit?</span> (with rising intonation — very informal, not standard written form)
        - ✅ <span lang="de">Kommst du mit?</span>

        Note: In very casual spoken German, a statement with rising intonation can function as a question, but in formal and written German, you should always use verb-first order.

        **2. Adding a helping word like 'do':**

        English uses 'do/does' to form questions ('Do you speak German?'). German does NOT have this — the verb simply moves.
        - ❌ <span lang="de">Tust du Deutsch sprechen?</span>
        - ✅ <span lang="de">Sprichst du Deutsch?</span>

        **3. Moving the wrong verb in two-verb sentences:**
        - ❌ <span lang="de">Schwimmen kannst du?</span>
        - ✅ <span lang="de">Kannst du schwimmen?</span>

        Always move the **finite** (conjugated) verb — the one that changes for person and number.

        ---

        ### Quick Reference: Statement vs. Question

        | Type | Position 1 | Position 2 | Rest |
        |---|---|---|---|
        | Statement | Subject or other element | **Verb** | … |
        | Yes/No Question | **Verb** | Subject | … |
      language: en
      why_this_matters: You will need yes/no questions from your very first conversation
        — to ask if a shop is open, if someone is coming, or if a friend wants something.
        Without this structure, you cannot ask the most basic questions in German.

- code: wh_question
  cefr_level: A1
  category: syntax
  subcategory: Fragesatz
  label: Ergänzungsfrage mit Fragewort
  description: Information questions (W-questions) formed with an interrogative word
    in first position followed by the finite verb.
  examples:
  - Wo ist Peter?
  - Wann fängt der Kurs an?
  - Was machst du morgen?
  prerequisites:
  - interrogative_pronou
  source_note: Ergänzungsfrage
  explanations:
    en:
      title: 'W-questions: asking for information'
      tip: To ask a question that needs a real answer (not just yes or no), start
        with a question word like <span lang="de">wer</span>, <span lang="de">was</span>,
        <span lang="de">wo</span>, or <span lang="de">wann</span>. The verb comes
        immediately after the question word, in second position. The rest of the sentence
        follows normally.
      explanation: |-
        ## W-questions (Ergänzungsfragen)

        ### What is a W-question?

        A **W-question** (called <span lang="de">Ergänzungsfrage</span> — 'completion question' — in German grammar) is an information question. It asks for a specific piece of missing information: a person, a thing, a place, a time, a reason, etc. The answer cannot be just <span lang="de">ja</span> or <span lang="de">nein</span>.

        ---

        ### The rule: question word → verb → rest

        The structure is always:

        | Position 1 | Position 2 (finite verb) | Rest of sentence |
        |---|---|---|
        | Question word | conjugated verb | subject, objects, other info |

        > **Key point:** The finite verb always stays in second position, directly after the question word. This is the same rule as in a normal statement (<span lang="de">Verbzweitstellung</span> — verb-second rule), except that a question word fills position 1 instead of the subject.

        ---

        ### The W-question words at A1

        | German | English | Asks about |
        |---|---|---|
        | <span lang="de">wer</span> | who | a person (subject) |
        | <span lang="de">wen</span> | who(m) | a person (accusative object) |
        | <span lang="de">wem</span> | (to/for) whom | a person (dative object) |
        | <span lang="de">was</span> | what | a thing or action |
        | <span lang="de">wo</span> | where | a place (location) |
        | <span lang="de">woher</span> | where from | origin |
        | <span lang="de">wohin</span> | where to | destination |
        | <span lang="de">wann</span> | when | time |
        | <span lang="de">wie</span> | how / what ... like | manner, quality |
        | <span lang="de">wie viel / wie viele</span> | how much / how many | quantity |
        | <span lang="de">warum</span> | why | reason |
        | <span lang="de">welch-</span> | which | choice from a group |

        ---

        ### Formation in detail

        **Step 1 — Choose the right question word** for the information you need.

        **Step 2 — Put the question word first.**

        **Step 3 — Conjugate the verb for the subject and place it in position 2.**

        **Step 4 — Place the subject immediately after the verb** (unless the question word itself is the subject — see below).

        #### Normal pattern (question word ≠ subject)

        <span lang="de">**Wo** wohnst **du**?</span> — *Where do you live?*
        <span lang="de">**Wann** kommt **der Zug**?</span> — *When does the train come?*
        <span lang="de">**Was** kauft **Maria**?</span> — *What is Maria buying?*

        #### Special pattern: question word IS the subject

        When <span lang="de">wer</span> or <span lang="de">was</span> is the subject, there is no separate subject after the verb. The verb takes 3rd-person singular form:

        <span lang="de">**Wer** kommt heute?</span> — *Who is coming today?*
        <span lang="de">**Wer** hat das Buch?</span> — *Who has the book?*

        ---

        ### Examples with translations

        1. <span lang="de">Wo ist das Café?</span> — *Where is the café?*
        2. <span lang="de">Wann fängt der Kurs an?</span> — *When does the course start?*
        3. <span lang="de">Was machst du morgen?</span> — *What are you doing tomorrow?*
        4. <span lang="de">Wie heißt du?</span> — *What is your name?*
        5. <span lang="de">Woher kommst du?</span> — *Where are you from?*
        6. <span lang="de">Wer ist das?</span> — *Who is that?*

        ---

        ### Separable verbs in W-questions

        When a separable verb is used, the prefix goes to the end of the sentence — exactly as in a normal statement:

        <span lang="de">Wann fängt der Film **an**?</span> — *When does the film start?*
        <span lang="de">Wo steigt du **aus**?</span> — *Where do you get off?*

        See also the grammar point on <span lang="de">Satzklammer</span> (sentence bracket).

        ---

        ### Common learner mistakes

        #### ❌ Putting the subject before the verb

        | Wrong | Correct |
        |---|---|
        | <span lang="de">Wo du wohnst?</span> | <span lang="de">Wo wohnst du?</span> |
        | <span lang="de">Was du machst?</span> | <span lang="de">Was machst du?</span> |

        The verb must come directly after the question word — the subject follows the verb.

        #### ❌ Using the wrong case for wer/wen/wem

        <span lang="de">**Wen</span> siehst du?</span> — *Who(m) do you see?* (accusative — direct object)
        <span lang="de">**Wem</span> gibst du das?</span> — *Who(m) are you giving that to?* (dative — indirect object)

        Using <span lang="de">wer</span> in place of <span lang="de">wen</span> or <span lang="de">wem</span> is a frequent error. Match the case to the verb's requirement, just as you would with a noun.

        #### ❌ Confusing wo / wohin / woher

        - <span lang="de">Wo</span> = location (staying in a place): <span lang="de">Wo bist du?</span>
        - <span lang="de">Wohin</span> = destination (movement towards): <span lang="de">Wohin gehst du?</span>
        - <span lang="de">Woher</span> = origin (movement from): <span lang="de">Woher kommst du?</span>

        ---

        ### Quick comparison: W-question vs. yes/no question vs. statement

        | Type | Position 1 | Position 2 | Example |
        |---|---|---|---|
        | Statement | Subject | Verb | <span lang="de">Du wohnst in Berlin.</span> |
        | Yes/no question | Verb | Subject | <span lang="de">Wohnst du in Berlin?</span> |
        | W-question | Question word | Verb | <span lang="de">Wo wohnst du?</span> |
      language: en
      why_this_matters: Almost every real conversation requires you to ask for information
        — a name, a place, a time, a reason. Without W-questions you can only answer
        questions, not ask them. These structures appear in every lesson, every dialogue,
        and every exam from A1 onwards.

- code: coord_conj_und_oder
  cefr_level: A1
  category: syntax
  subcategory: Satzverbindungen
  label: Satzverbindung mit und/oder
  description: Coordinating conjunctions und (and) and oder (or) used to connect clauses
    or elements.
  examples:
  - Ich hätte gern eine Coca und ein Brötchen.
  - Möchten Sie lieber Tee oder Kaffee?
  source_note: 'Satzverbindungen: und, oder'
  explanations:
    en:
      title: Connecting clauses with und and oder
      tip: Use <span lang="de">und</span> to mean 'and' and <span lang="de">oder</span>
        to mean 'or' to join words, phrases, or whole sentences. Word order in each
        part stays exactly the same as it would be on its own — these conjunctions
        do not move the verb.
      explanation: |-
        ## Connecting clauses with <span lang="de">und</span> and <span lang="de">oder</span>

        ### What are they?

        <span lang="de">Und</span> (and) and <span lang="de">oder</span> (or) are **coordinating conjunctions** — they sit between two equal elements and link them together. They can connect:

        - two **nouns or noun phrases**
        - two **verb phrases**
        - two **full clauses** (sentences with their own subject and verb)

        ---

        ### The key rule: no change to word order

        Unlike some German conjunctions (such as <span lang="de">wenn</span>), <span lang="de">und</span> and <span lang="de">oder</span> do **not** change the word order of the clause that follows them. The verb stays in **second position** in each clause, just as it would in a normal statement.

        > Pattern: **[Clause 1] + <span lang="de">und</span>/<span lang="de">oder</span> + [Clause 2]**

        If the subject in the second clause is the same as in the first, it is often left out to avoid repetition.

        ---

        ### Connecting nouns and noun phrases

        The simplest use: two nouns joined by <span lang="de">und</span> or <span lang="de">oder</span>.

        | German | English |
        |---|---|
        | <span lang="de">Ich hätte gern eine Cola und ein Brötchen.</span> | I would like a cola and a bread roll. |
        | <span lang="de">Möchten Sie Tee oder Kaffee?</span> | Would you like tea or coffee? |
        | <span lang="de">Das ist mein Vater und meine Mutter.</span> | That is my father and my mother. |

        ---

        ### Connecting two full clauses

        Each clause keeps its own subject and verb in second position.

        | German | English |
        |---|---|
        | <span lang="de">Ich arbeite und sie lernt.</span> | I work and she studies. |
        | <span lang="de">Er kommt heute oder er schreibt eine Nachricht.</span> | He is coming today or he will send a message. |
        | <span lang="de">Das Café ist klein, aber es ist schön.</span> | The café is small, but it is nice. |

        ---

        ### Dropping the repeated subject

        When both clauses share the same subject, the second subject is usually omitted. The verb still stays in its normal position.

        | German | English |
        |---|---|
        | <span lang="de">Sie kauft Brot und geht nach Hause.</span> | She buys bread and goes home. |
        | <span lang="de">Ich trinke Kaffee oder esse ein Brötchen.</span> | I drink coffee or eat a bread roll. |

        Notice that after dropping the subject, the verb in the second part appears to come first — this is normal and correct. The subject is simply understood from context.

        ---

        ### Connecting more than two items (lists)

        For three or more items, <span lang="de">und</span>/<span lang="de">oder</span> typically appears only before the **last** item. The other items are separated by commas.

        | German | English |
        |---|---|
        | <span lang="de">Ich kaufe Milch, Brot und Käse.</span> | I am buying milk, bread, and cheese. |
        | <span lang="de">Möchten Sie Wasser, Saft oder Tee?</span> | Would you like water, juice, or tea? |

        ---

        ### Comma usage

        - When linking **nouns or short phrases**, no comma is used before <span lang="de">und</span> or <span lang="de">oder</span>.
        - When linking **two full clauses**, a comma before <span lang="de">und</span>/<span lang="de">oder</span> is optional in German (unlike in English). Either is acceptable at A1 level.

        ---

        ### Common learner mistakes

        **Mistake 1: Moving the verb to the end after <span lang="de">und</span>/<span lang="de">oder</span>**

        Learners sometimes treat <span lang="de">und</span>/<span lang="de">oder</span> like a subordinating conjunction and push the verb to the end. This is wrong.

        | ❌ Incorrect | ✅ Correct |
        |---|---|
        | <span lang="de">Ich esse und sie kocht.</span> → ~~<span lang="de">Ich esse und sie kocht nicht.</span>~~ — no error here actually | <span lang="de">Er trinkt Tee und sie isst Kuchen.</span> |
        | <span lang="de">~~Ich esse und sie Kuchen isst.~~</span> | <span lang="de">Ich esse und sie isst Kuchen.</span> |

        **Mistake 2: Forgetting the article or inflection after <span lang="de">und</span>/<span lang="de">oder</span>**

        Each noun still needs its own article with the correct case.

        | ❌ Incorrect | ✅ Correct |
        |---|---|
        | <span lang="de">~~Ich möchte ein Kaffee und Tee.~~</span> | <span lang="de">Ich möchte einen Kaffee und einen Tee.</span> |

        **Mistake 3: Using <span lang="de">und</span> where <span lang="de">oder</span> is needed for a choice**

        When presenting an alternative, use <span lang="de">oder</span>, not <span lang="de">und</span>.

        | ❌ Incorrect | ✅ Correct |
        |---|---|
        | <span lang="de">~~Möchten Sie Tee und Kaffee?~~</span> (if meaning 'one or the other') | <span lang="de">Möchten Sie Tee oder Kaffee?</span> |

        ---

        ### Quick summary table

        | Conjunction | Meaning | Word order after it |
        |---|---|---|
        | <span lang="de">und</span> | and | unchanged (verb 2nd position) |
        | <span lang="de">oder</span> | or | unchanged (verb 2nd position) |
      language: en
      why_this_matters: You need <span lang="de">und</span> and <span lang="de">oder</span>
        in almost every conversation — to list things you want, describe your day,
        or offer choices. Without them, you are limited to short, disconnected sentences
        and cannot express even basic ideas like 'I would like tea or coffee' or 'She
        works and studies.'

- code: coord_conj_aber_denn
  cefr_level: A1
  category: syntax
  subcategory: Satzverbindungen
  label: Satzverbindung mit aber/denn
  description: Coordinating conjunctions aber (but) and denn (because/for) used to
    connect contrasting or causal clauses.
  examples:
  - Das ist sehr schön, aber leider zu teuer.
  - Ich gehe heute nicht spazieren, denn es ist zu kalt.
  prerequisites:
  - coord_conj_und_oder
  source_note: 'Satzverbindungen: aber, denn'
  explanations:
    en:
      title: Connecting sentences with aber and denn
      tip: Use <span lang="de">aber</span> to mean 'but' (contrast) and <span lang="de">denn</span>
        to mean 'because/for' (reason). Both join two main clauses and do NOT change
        the word order of the second clause.
      explanation: |-
        ## Connecting sentences with <span lang="de">aber</span> and <span lang="de">denn</span>

        ### What are they?

        <span lang="de">Aber</span> (but / however) and <span lang="de">denn</span> (because / for) are **coordinating conjunctions** (<span lang="de">koordinierende Konjunktionen</span> — words that join two clauses of equal status). They sit between two main clauses and have **no effect on word order** — the verb stays in second position in both clauses.

        ---

        ### <span lang="de">Aber</span> — expressing contrast

        <span lang="de">Aber</span> corresponds to English 'but'. Use it when the second clause says something that contrasts with or limits the first clause.

        **Pattern:**
        > Clause 1, <span lang="de">aber</span> Clause 2.

        A comma is written before <span lang="de">aber</span>.

        | Position | 1 | 2 | 3 | … |
        |---|---|---|---|---|
        | Clause 1 | <span lang="de">Das ist schön,</span> | | | |
        | Conjunction | | <span lang="de">aber</span> | | |
        | Clause 2 | | | <span lang="de">es</span> | <span lang="de">ist zu teuer.</span> |

        **Examples:**

        - <span lang="de">Das Zimmer ist groß, aber es ist sehr kalt.</span>
          — The room is big, but it is very cold.
        - <span lang="de">Ich mag Kaffee, aber ich trinke lieber Tee.</span>
          — I like coffee, but I prefer to drink tea.
        - <span lang="de">Sie ist müde, aber sie arbeitet weiter.</span>
          — She is tired, but she keeps working.
        - <span lang="de">Das Hemd ist schön, aber leider zu klein.</span>
          — The shirt is nice, but unfortunately too small.

        > **Note:** <span lang="de">Aber</span> can also appear inside a single clause for emphasis: <span lang="de">Das ist aber schön!</span> (That is really nice!) — but at A1 level, focus on the two-clause pattern.

        ---

        ### <span lang="de">Denn</span> — expressing a reason

        <span lang="de">Denn</span> corresponds to English 'because' or 'for' (in the formal/literary sense). Use it when the second clause gives the **reason** for what was stated in the first clause.

        **Pattern:**
        > Clause 1, <span lang="de">denn</span> Clause 2.

        A comma is written before <span lang="de">denn</span>.

        | Position | 1 | 2 | 3 | … |
        |---|---|---|---|---|
        | Clause 1 | <span lang="de">Ich gehe nicht spazieren,</span> | | | |
        | Conjunction | | <span lang="de">denn</span> | | |
        | Clause 2 | | | <span lang="de">es</span> | <span lang="de">ist zu kalt.</span> |

        **Examples:**

        - <span lang="de">Ich esse nichts, denn ich habe keinen Hunger.</span>
          — I am not eating anything, because I am not hungry.
        - <span lang="de">Wir nehmen ein Taxi, denn es ist schon spät.</span>
          — We are taking a taxi, because it is already late.
        - <span lang="de">Er lernt Deutsch, denn er wohnt jetzt in Berlin.</span>
          — He is learning German, because he now lives in Berlin.
        - <span lang="de">Sie kauft das Buch nicht, denn es ist sehr teuer.</span>
          — She is not buying the book, because it is very expensive.

        ---

        ### Word order — the key rule

        Both <span lang="de">aber</span> and <span lang="de">denn</span> are **zero-position conjunctions** — they occupy a slot *between* the two clauses but do **not** count as Position 1 inside the second clause. The subject of the second clause still comes directly after the conjunction, and the verb stays in second position within that clause.

        | | Correct ✔ | Wrong ✘ |
        |---|---|---|
        | <span lang="de">denn</span> | <span lang="de">… denn **er** **ist** krank.</span> | <span lang="de">… denn **ist** er krank.</span> |
        | <span lang="de">aber</span> | <span lang="de">… aber **sie** **kommt** morgen.</span> | <span lang="de">… aber **kommt** sie morgen.</span> |

        This is different from subordinating conjunctions such as <span lang="de">wenn</span> (when/if), which **do** send the verb to the end.

        ---

        ### <span lang="de">Denn</span> vs. <span lang="de">weil</span>

        Both mean 'because', but they work differently:

        | Conjunction | Clause type | Verb position |
        |---|---|---|
        | <span lang="de">denn</span> | main clause | 2nd position (normal) |
        | <span lang="de">weil</span> | subordinate clause | **final** position |

        - <span lang="de">Ich bleibe zu Hause, **denn** es **regnet**.</span> — verb second ✔
        - <span lang="de">Ich bleibe zu Hause, **weil** es **regnet**.</span> — verb final ✔

        At A1 level, <span lang="de">denn</span> is easier because you do not need to move the verb.

        ---

        ### Common learner mistakes

        **1. Inverting the verb after <span lang="de">denn</span>**

        - ✘ <span lang="de">Ich komme nicht, denn bin ich krank.</span>
        - ✔ <span lang="de">Ich komme nicht, denn ich bin krank.</span>

        Do not invert subject and verb after <span lang="de">denn</span>. Normal subject–verb order applies.

        **2. Forgetting the comma**

        - ✘ <span lang="de">Das ist gut aber es ist zu teuer.</span>
        - ✔ <span lang="de">Das ist gut, aber es ist zu teuer.</span>

        In German, a comma is required before both <span lang="de">aber</span> and <span lang="de">denn</span> when connecting two clauses.

        **3. Confusing <span lang="de">denn</span> (conjunction) with the particle <span lang="de">denn</span>**

        <span lang="de">Denn</span> also appears as a flavouring particle in questions: <span lang="de">Was ist das denn?</span> (What on earth is that?). At A1, just recognise both uses exist — in questions it is a particle, not a conjunction.
      language: en
      why_this_matters: You need these conjunctions the moment you want to explain
        why you are doing something or contrast two ideas — both extremely common
        in everyday speech and writing. Without them, your German sounds choppy and
        you cannot express cause or contradiction naturally.

- code: coord_conj_dann
  cefr_level: A1
  category: syntax
  subcategory: Satzverbindungen
  label: Satzverbindung mit dann
  description: The adverbial connector dann (then) used to sequence events or actions
    in connected sentences.
  examples:
  - Ich muss noch kurz telefonieren, dann gehen wir.
  prerequisites:
  - coord_conj_und_oder
  source_note: 'Satzverbindungen: dann'
  explanations:
    en:
      title: Sequencing events with 'dann'
      tip: The word <span lang="de">dann</span> means 'then' and connects two sentences
        to show that one action happens after another. When <span lang="de">dann</span>
        starts the second sentence, the verb comes right after it — not the subject.
        This is the normal verb-second rule in German.
      explanation: |-
        ## Sequencing events with <span lang="de">dann</span>

        ### What is <span lang="de">dann</span>?

        <span lang="de">Dann</span> is an adverbial connector (a linking adverb) meaning **then** or **after that**. It joins two separate sentences to show that the second action follows the first in time. Unlike coordinating conjunctions such as <span lang="de">und</span> (and) or <span lang="de">aber</span> (but), <span lang="de">dann</span> is not a conjunction — it is an adverb that takes up the first position in the second sentence.

        ---

        ### The verb-second rule with <span lang="de">dann</span>

        German main clauses always follow the **verb-second rule**: the finite (conjugated) verb must be the second element in the sentence. When <span lang="de">dann</span> opens a sentence, it occupies position 1, so the verb must come immediately in position 2, and the subject is pushed to position 3.

        | Position 1 | Position 2 (verb) | Position 3 (subject) | Rest |
        |---|---|---|---|
        | <span lang="de">Dann</span> | <span lang="de">gehen</span> | <span lang="de">wir</span> | <span lang="de">nach Hause.</span> |
        | <span lang="de">Dann</span> | <span lang="de">kauft</span> | <span lang="de">sie</span> | <span lang="de">das Brot.</span> |
        | <span lang="de">Dann</span> | <span lang="de">muss</span> | <span lang="de">er</span> | <span lang="de">arbeiten.</span> |

        This inversion (verb before subject) is **not optional** — it is required whenever any element other than the subject opens the sentence.

        ---

        ### Formation

        Two patterns are common:

        **Pattern A — Separate sentences with a full stop or semicolon:**
        > <span lang="de">Ich frühstücke.</span> <span lang="de">Dann gehe ich zur Arbeit.</span>
        > *I have breakfast. Then I go to work.*

        **Pattern B — Two clauses joined by a comma:**
        > <span lang="de">Ich frühstücke, dann gehe ich zur Arbeit.</span>
        > *I have breakfast, then I go to work.*

        Both patterns are correct. The comma version is very common in spoken German.

        ---

        ### Examples

        1. <span lang="de">Wir essen zu Abend, dann sehen wir fern.</span>
           *We eat dinner, then we watch TV.*

        2. <span lang="de">Ich muss noch kurz telefonieren, dann gehen wir.</span>
           *I still need to make a quick call, then we'll go.*

        3. <span lang="de">Zuerst kaufe ich ein, dann koche ich das Mittagessen.</span>
           *First I go shopping, then I cook lunch.*

        4. <span lang="de">Er duscht. Dann zieht er sich an.</span>
           *He showers. Then he gets dressed.*

        5. <span lang="de">Die Kinder spielen draußen, dann machen sie die Hausaufgaben.</span>
           *The children play outside, then they do their homework.*

        6. <span lang="de">Trinkst du einen Kaffee? Dann gehen wir zusammen.</span>
           *Are you having a coffee? Then we'll go together.*

        ---

        ### <span lang="de">dann</span> vs. <span lang="de">und dann</span>

        You will often hear <span lang="de">und dann</span> (and then), where <span lang="de">und</span> (and) connects the clauses and <span lang="de">dann</span> adds the time sequence. In this case, because <span lang="de">und</span> is a zero-position conjunction, the word order is **subject–verb** (no inversion):

        | With <span lang="de">und dann</span> (no inversion) | With <span lang="de">dann</span> alone (inversion) |
        |---|---|
        | <span lang="de">Ich esse, und dann gehe ich spazieren.</span> | <span lang="de">Ich esse, dann gehe ich spazieren.</span> |

        Both sentences mean the same thing. The difference is only structural.

        ---

        ### Common learner mistakes

        **Mistake 1 — Keeping the subject in position 2 after <span lang="de">dann</span>:**
        > ❌ <span lang="de">Dann ich gehe nach Hause.</span>
        > ✅ <span lang="de">Dann gehe ich nach Hause.</span>
        > *Then I go home.*

        The verb must come before the subject when <span lang="de">dann</span> is in position 1.

        **Mistake 2 — Confusing <span lang="de">dann</span> (then/at that time) with <span lang="de">denn</span> (because/for):**
        > <span lang="de">Dann</span> = then (time sequence)
        > <span lang="de">Denn</span> = because / for (reason)
        > ❌ <span lang="de">Ich bin müde, dann ich schlafe früh.</span>
        > ✅ <span lang="de">Ich bin müde, dann schlafe ich früh.</span> (inversion!) or <span lang="de">Ich bin müde, denn ich habe nicht geschlafen.</span> (giving a reason)

        **Mistake 3 — Using <span lang="de">dann</span> like a conjunction (no inversion needed):**
        Remember: <span lang="de">dann</span> is an adverb, not a conjunction. Unlike <span lang="de">und</span> or <span lang="de">oder</span>, it always triggers inversion when it starts the clause.
      language: en
      why_this_matters: You will need <span lang="de">dann</span> every time you describe
        a sequence of events — giving directions, telling a story, or explaining a
        routine. Without it, your sentences sound choppy and disconnected, and you
        cannot express the idea of 'first this, then that.'

- code: subord_conj_wenn
  cefr_level: A1
  category: syntax
  subcategory: Satzverbindungen
  label: Satzverbindung mit wenn
  description: Subordinating conjunction wenn (when/if) introducing a subordinate
    clause with verb-final word order. Marked as A2 addition.
  examples:
  - <span lang='de'>Wenn es regnet, bleibe ich zu Hause.</span>
  - <span lang='de'>Ich bin glücklich, wenn ich Musik höre.</span>
  - <span lang='de'>Wenn du Hunger hast, essen wir zusammen.</span>
  - <span lang='de'>Wir gehen spazieren, wenn das Wetter schön ist.</span>
  - <span lang='de'>Wenn ich müde bin, gehe ich früh ins Bett.</span>
  prerequisites:
  - verb_second_position
  source_note: 'Satzverbindungen: wenn* (A2 addition)'
  explanations:
    en:
      title: Connecting clauses with 'wenn'
      tip: The word <span lang='de'>wenn</span> means 'when' or 'if' and starts a
        subordinate clause. In that subordinate clause, the verb must go to the very
        end. The two clauses are always separated by a comma.
      explanation: |-
        ## Using <span lang='de'>wenn</span> to connect clauses

        ### What is <span lang='de'>wenn</span>?

        <span lang='de'>Wenn</span> is a **subordinating conjunction** (a connecting word that introduces a dependent clause). It translates as **'when'** (referring to time) or **'if'** (referring to a condition). Unlike coordinating conjunctions such as <span lang='de'>und</span> (and) or <span lang='de'>aber</span> (but), <span lang='de'>wenn</span> changes the word order inside its clause.

        ---

        ### The key rule: verb goes to the end

        In a <span lang='de'>wenn</span>-clause, the **conjugated verb moves to the final position**. This is called <span lang='de'>Verbendstellung</span> (verb-final position).

        Compare normal word order with a <span lang='de'>wenn</span>-clause:

        | Normal clause | <span lang='de'>wenn</span>-clause |
        |---|---|
        | <span lang='de'>Es regnet.</span> | <span lang='de'>wenn es **regnet**</span> |
        | <span lang='de'>Ich bin müde.</span> | <span lang='de'>wenn ich müde **bin**</span> |
        | <span lang='de'>Du hast Hunger.</span> | <span lang='de'>wenn du Hunger **hast**</span> |

        ---

        ### Two sentence structures

        A <span lang='de'>wenn</span>-clause can come **before or after** the main clause. A comma always separates the two clauses.

        **Structure 1 — Main clause first:**
        > Main clause **,** <span lang='de'>wenn</span> + subject + … + **verb**

        **Structure 2 — <span lang='de'>wenn</span>-clause first:**
        > <span lang='de'>wenn</span> + subject + … + **verb** **,** main clause

        ⚠️ When the <span lang='de'>wenn</span>-clause comes **first**, the main clause must start with its **verb** (not the subject). This is because the whole <span lang='de'>wenn</span>-clause counts as the first element of the sentence, so the main verb still holds the second position.

        ---

        ### Examples

        1. <span lang='de'>Wenn es regnet, bleibe ich zu Hause.</span>
           — *When it rains, I stay at home.* (wenn-clause first → main verb <span lang='de'>bleibe</span> comes before <span lang='de'>ich</span>)

        2. <span lang='de'>Ich bleibe zu Hause, wenn es regnet.</span>
           — *I stay at home when it rains.* (main clause first → normal word order in main clause)

        3. <span lang='de'>Ich bin glücklich, wenn ich Musik höre.</span>
           — *I am happy when I listen to music.*

        4. <span lang='de'>Wenn du Hunger hast, essen wir zusammen.</span>
           — *If you are hungry, we'll eat together.*

        5. <span lang='de'>Wenn ich müde bin, gehe ich früh ins Bett.</span>
           — *When I am tired, I go to bed early.*

        6. <span lang='de'>Wir gehen spazieren, wenn das Wetter schön ist.</span>
           — *We go for a walk when the weather is nice.*

        ---

        ### Separable verbs in <span lang='de'>wenn</span>-clauses

        With separable verbs (e.g. <span lang='de'>aufstehen</span> — to get up), the prefix does **not** separate in a <span lang='de'>wenn</span>-clause. The whole verb stays together at the end:

        - ✅ <span lang='de'>Wenn ich früh **aufstehe**, bin ich müde.</span> — *When I get up early, I am tired.*
        - ❌ <span lang='de'>Wenn ich stehe früh auf …</span>

        ---

        ### Common learner mistakes

        | Mistake | Correction | Note |
        |---|---|---|
        | <span lang='de'>Wenn ich bin müde, …</span> | <span lang='de'>Wenn ich müde **bin**, …</span> | Verb must go to the end of the <span lang='de'>wenn</span>-clause. |
        | <span lang='de'>Wenn es regnet ich bleibe zu Hause.</span> | <span lang='de'>Wenn es regnet**,** **bleibe** ich zu Hause.</span> | Missing comma; verb inversion needed in main clause. |
        | <span lang='de'>Wenn ich habe Hunger, …</span> | <span lang='de'>Wenn ich Hunger **habe**, …</span> | Verb goes last, even <span lang='de'>haben</span>. |

        ---

        ### Quick summary

        - <span lang='de'>wenn</span> = 'when' / 'if'
        - The verb in the <span lang='de'>wenn</span>-clause goes to the **end**.
        - Always use a **comma** between the two clauses.
        - If the <span lang='de'>wenn</span>-clause comes first, the main clause starts with its **verb**.
      language: en
      why_this_matters: Almost every real-life conversation involves conditions and
        time ('if you are tired', 'when we arrive') — and <span lang='de'>wenn</span>
        is the tool for both. Without it, you can only make simple statements and
        you cannot express cause, condition, or timing between two events.

- code: noun_deriv_er
  cefr_level: A1
  category: wortbildung
  subcategory: Nomen
  label: Nominalisierung mit -er
  description: Nouns derived from verbs using the suffix -er to form (typically masculine)
    agent nouns.
  examples:
  - Ausländer, Arbeiter, Bewohner, Teilnehmer
  prerequisites:
  - noun_gender
  source_note: 'Nominalisierung -er: Ausländer, Arbeiter, Bewohner, Teilnehmer'
  explanations:
    en:
      title: Making nouns with -er
      tip: In German, you can add <span lang="de">-er</span> to the stem of a verb
        to make a noun meaning 'person who does X' or 'thing that does X'. These nouns
        are almost always masculine (<span lang="de">der</span>). Plurals are usually
        identical to the singular.
      explanation: |-
        ## Agent Nouns with the Suffix <span lang="de">-er</span>

        ### What is an agent noun?

        An **agent noun** names a person (or thing) that performs an action. In English we do exactly the same with '-er': *work → worker*, *teach → teacher*. German uses the same logic with the suffix <span lang="de">-er</span>.

        ---

        ### How to form it

        Take the **verb stem** (the infinitive minus <span lang="de">-en</span>) and add <span lang="de">-er</span>:

        | Verb | Stem | <span lang="de">-er</span> noun | Meaning |
        |---|---|---|---|
        | <span lang="de">arbeiten</span> | <span lang="de">arbeit-</span> | <span lang="de">der Arbeiter</span> | worker |
        | <span lang="de">spielen</span> | <span lang="de">spiel-</span> | <span lang="de">der Spieler</span> | player |
        | <span lang="de">lehren</span> | <span lang="de">lehr-</span> | <span lang="de">der Lehrer</span> | teacher |
        | <span lang="de">besuchen</span> | <span lang="de">besuch-</span> | <span lang="de">der Besucher</span> | visitor |
        | <span lang="de">fahren</span> | <span lang="de">fahr-</span> | <span lang="de">der Fahrer</span> | driver |
        | <span lang="de">lesen</span> | <span lang="de">les-</span> | <span lang="de">der Leser</span> | reader |

        Some verbs already end in <span lang="de">-ern</span> or <span lang="de">-eln</span>; in those cases the <span lang="de">-er</span> is simply the final syllable of the existing stem, so no extra <span lang="de">-er</span> is added.

        ---

        ### Gender and article

        <span lang="de">-er</span> nouns derived from verbs are **almost always masculine**: <span lang="de">der Arbeiter</span>, <span lang="de">der Lehrer</span>, <span lang="de">der Fahrer</span>. This is a reliable rule — treat any new <span lang="de">-er</span> agent noun as <span lang="de">der</span> unless you have a specific reason not to.

        ---

        ### Plural: no change

        The plural of most <span lang="de">-er</span> nouns is **identical** to the singular. Only the article changes:

        | Singular | Plural |
        |---|---|
        | <span lang="de">der Arbeiter</span> | <span lang="de">die Arbeiter</span> |
        | <span lang="de">der Lehrer</span> | <span lang="de">die Lehrer</span> |
        | <span lang="de">der Fahrer</span> | <span lang="de">die Fahrer</span> |

        Context or the article tells you whether it is singular or plural.

        ---

        ### Not only verbs — some come from other sources

        A small number of common <span lang="de">-er</span> nouns do **not** come from a German verb but from place names or other languages:

        - <span lang="de">der Ausländer</span> (foreigner) ← <span lang="de">Ausland</span> (abroad, a noun)
        - <span lang="de">der Berliner</span> (person from Berlin)
        - <span lang="de">der Computer</span> (borrowed from English)

        These still follow the same gender and plural rules.

        ---

        ### Things that do actions too

        <span lang="de">-er</span> nouns can also name **objects** that perform a function:

        - <span lang="de">der Drucker</span> (printer, from <span lang="de">drucken</span> – to print)
        - <span lang="de">der Kocher</span> (cooker/boiler, from <span lang="de">kochen</span> – to cook)
        - <span lang="de">der Wecker</span> (alarm clock, from <span lang="de">wecken</span> – to wake)

        ---

        ### Example sentences

        1. <span lang="de">Der Lehrer erklärt die Grammatik.</span> — The teacher explains the grammar.
        2. <span lang="de">Die Arbeiter kommen um acht Uhr.</span> — The workers come at eight o'clock.
        3. <span lang="de">Der Fahrer wartet vor der Schule.</span> — The driver waits in front of the school.
        4. <span lang="de">Viele Besucher kommen aus dem Ausland.</span> — Many visitors come from abroad.
        5. <span lang="de">Ist er ein guter Spieler?</span> — Is he a good player?
        6. <span lang="de">Der Drucker funktioniert nicht.</span> — The printer is not working.

        ---

        ### Feminine forms

        When referring specifically to a woman, German adds <span lang="de">-in</span> to the masculine form: <span lang="de">die Lehrerin</span> (female teacher), <span lang="de">die Arbeiterin</span> (female worker). This is covered separately in the grammar point on feminine forms with <span lang="de">-in</span>.

        ---

        ### Common learner mistakes

        **Wrong gender:**
        > ❌ <span lang="de">die Fahrer</span> (singular)
        > ✅ <span lang="de">der Fahrer</span>

        Remember: <span lang="de">-er</span> agent nouns are masculine.

        **Adding an extra <span lang="de">-er</span>:**
        > ❌ <span lang="de">der Arbeiterer</span>
        > ✅ <span lang="de">der Arbeiter</span>

        Just add <span lang="de">-er</span> once to the verb stem.

        **Inventing a wrong plural:**
        > ❌ <span lang="de">die Lehrers</span> or <span lang="de">die Lehrere</span>
        > ✅ <span lang="de">die Lehrer</span>

        The plural form does not change — only the article changes from <span lang="de">der</span> to <span lang="de">die</span>.
      language: en
      why_this_matters: Agent nouns built with <span lang="de">-er</span> are everywhere
        in everyday German — jobs, nationalities, and common objects all use this
        pattern. Recognising it means you can often guess the meaning of an unfamiliar
        noun from a verb you already know.

- code: noun_deriv_ung
  cefr_level: A1
  category: wortbildung
  subcategory: Nomen
  label: Nominalisierung mit -ung
  description: Nouns derived from verbs using the suffix -ung to form feminine abstract
    nouns.
  examples:
  - Wohnung, Lösung, Mitteilung, Zahlung
  prerequisites:
  - noun_gender
  source_note: 'Nominalisierung -ung: Wohnung, Lösung, Mitteilung, Zahlung'
  explanations:
    en:
      title: Making nouns with -ung
      tip: Add <span lang="de">-ung</span> to a verb stem to create a feminine noun
        meaning the action or result of that verb. These nouns always use the article
        <span lang="de">die</span> and never change gender.
      explanation: |-
        ## Nouns formed with <span lang="de">-ung</span>

        ### What is this pattern?

        German regularly turns verbs into nouns by adding the suffix <span lang="de">-ung</span> to the verb stem. The resulting noun is always **feminine** and takes the article <span lang="de">die</span>. It usually refers to the **action, process, or result** described by the original verb.

        ---

        ### How to form an <span lang="de">-ung</span> noun

        Take the **infinitive** of the verb, remove the ending <span lang="de">-en</span> (or <span lang="de">-n</span>), and add <span lang="de">-ung</span>:

        | Verb | Stem | <span lang="de">-ung</span> noun | Meaning |
        |---|---|---|---|
        | <span lang="de">wohnen</span> | <span lang="de">wohn-</span> | <span lang="de">die Wohnung</span> | apartment / dwelling |
        | <span lang="de">lösen</span> | <span lang="de">lös-</span> | <span lang="de">die Lösung</span> | solution |
        | <span lang="de">zahlen</span> | <span lang="de">zahl-</span> | <span lang="de">die Zahlung</span> | payment |
        | <span lang="de">teilen</span> | <span lang="de">teil-</span> | <span lang="de">die Teilung</span> | division / partition |
        | <span lang="de">mitteilen</span> | <span lang="de">mitteil-</span> | <span lang="de">die Mitteilung</span> | message / notification |
        | <span lang="de">üben</span> | <span lang="de">üb-</span> | <span lang="de">die Übung</span> | exercise / practice |
        | <span lang="de">ordnen</span> | <span lang="de">ordn-</span> | <span lang="de">die Ordnung</span> | order |
        | <span lang="de">öffnen</span> | <span lang="de">öffn-</span> | <span lang="de">die Öffnung</span> | opening |

        > **Key fact:** Every single <span lang="de">-ung</span> noun is feminine — no exceptions. If you see a noun ending in <span lang="de">-ung</span>, you can always use <span lang="de">die</span>.

        ---

        ### Plural form

        Almost all <span lang="de">-ung</span> nouns form their plural by adding <span lang="de">-en</span>:

        | Singular | Plural |
        |---|---|
        | <span lang="de">die Wohnung</span> | <span lang="de">die Wohnungen</span> |
        | <span lang="de">die Lösung</span> | <span lang="de">die Lösungen</span> |
        | <span lang="de">die Mitteilung</span> | <span lang="de">die Mitteilungen</span> |
        | <span lang="de">die Übung</span> | <span lang="de">die Übungen</span> |

        ---

        ### Examples in sentences

        1. <span lang="de">Die Wohnung ist sehr groß.</span> — The apartment is very big.
        2. <span lang="de">Ich habe eine Lösung für das Problem.</span> — I have a solution to the problem.
        3. <span lang="de">Die Zahlung kommt morgen.</span> — The payment is coming tomorrow.
        4. <span lang="de">Hast du meine Mitteilung gelesen?</span> — Did you read my message?
        5. <span lang="de">Die Übung ist nicht schwer.</span> — The exercise is not difficult.
        6. <span lang="de">Die Öffnungszeiten sind von 9 bis 18 Uhr.</span> — The opening hours are from 9 to 6 o'clock.

        ---

        ### Separable verbs

        When the base verb has a **separable prefix** (like <span lang="de">mit-</span>, <span lang="de">an-</span>, <span lang="de">ein-</span>), the prefix stays attached in the noun:

        | Verb | Noun | Meaning |
        |---|---|---|
        | <span lang="de">mitteilen</span> | <span lang="de">die Mitteilung</span> | message |
        | <span lang="de">anmelden</span> | <span lang="de">die Anmeldung</span> | registration |
        | <span lang="de">einladung</span> → <span lang="de">einladen</span> | <span lang="de">die Einladung</span> | invitation |
        | <span lang="de">vorbereiten</span> | <span lang="de">die Vorbereitung</span> | preparation |

        ---

        ### Common learner mistakes

        **❌ Wrong gender:**
        > <span lang="de">~~der Lösung~~</span> ✗
        > <span lang="de">die Lösung</span> ✓

        All <span lang="de">-ung</span> nouns are feminine. Always use <span lang="de">die</span>.

        **❌ Wrong plural:**
        > <span lang="de">~~die Wohnunge~~</span> ✗
        > <span lang="de">die Wohnungen</span> ✓

        The plural ending is <span lang="de">-en</span>, not just <span lang="de">-e</span>.

        **❌ Forgetting the pattern exists:**
        When you see an unfamiliar noun ending in <span lang="de">-ung</span>, ask yourself: what verb could this come from? For example, <span lang="de">Heizung</span> comes from <span lang="de">heizen</span> (to heat), so it means 'heating system'. This strategy helps you learn vocabulary much faster.
      language: en
      why_this_matters: Hundreds of everyday German nouns are built this way — words
        like <span lang="de">Wohnung</span> (apartment), <span lang="de">Lösung</span>
        (solution), and <span lang="de">Zahlung</span> (payment) appear constantly
        in daily life, signs, and forms. Recognising the pattern lets you guess the
        meaning of new nouns you have never seen before.

- code: noun_feminine_in
  cefr_level: A1
  category: wortbildung
  subcategory: Nomen
  label: Feminine Formen mit -in
  description: Formation of feminine nouns by adding the suffix -in to the masculine
    base form.
  examples:
  - Nachbarin, Kollegin, Kundin, Leiterin
  prerequisites:
  - noun_gender
  source_note: 'feminine Formen -in: Nachbarin, Kollegin, Kundin, Leiterin'
  explanations:
    en:
      title: Making feminine nouns with -in
      tip: To make a feminine form of a noun referring to a person, add <span lang="de">-in</span>
        to the masculine base. If the masculine form ends in a vowel or <span lang="de">-er</span>,
        just attach <span lang="de">-in</span> directly. The vowel <span lang="de">a</span>,
        <span lang="de">o</span>, or <span lang="de">u</span> in the last syllable
        often gets an umlaut.
      explanation: |-
        ## Feminine Nouns with <span lang="de">-in</span>

        ### What is this rule?

        In German, many nouns that refer to people have a masculine base form and a separate feminine form. The feminine form is created by adding the suffix <span lang="de">-in</span> (always stressed) to the masculine base. These feminine nouns are always <span lang="de">die</span> (feminine gender) and their plural ends in <span lang="de">-innen</span>.

        ---

        ### Formation

        **Basic rule:** masculine base + <span lang="de">-in</span>

        | Masculine | Feminine | English |
        |---|---|---|
        | <span lang="de">der Lehrer</span> | <span lang="de">die Lehrerin</span> | teacher |
        | <span lang="de">der Nachbar</span> | <span lang="de">die Nachbarin</span> | neighbour |
        | <span lang="de">der Kollege</span> | <span lang="de">die Kollegin</span> | colleague |
        | <span lang="de">der Kunde</span> | <span lang="de">die Kundin</span> | customer |
        | <span lang="de">der Freund</span> | <span lang="de">die Freundin</span> | friend / girlfriend |
        | <span lang="de">der Schüler</span> | <span lang="de">die Schülerin</span> | pupil |

        ---

        ### Key variants

        #### 1. Drop a final <span lang="de">-e</span> before adding <span lang="de">-in</span>

        When the masculine base ends in <span lang="de">-e</span>, drop it first:

        | Masculine | → Remove <span lang="de">-e</span> | + <span lang="de">-in</span> | Feminine |
        |---|---|---|---|
        | <span lang="de">der Kollege</span> | <span lang="de">Kolleg-</span> | <span lang="de">-in</span> | <span lang="de">die Kollegin</span> |
        | <span lang="de">der Kunde</span> | <span lang="de">Kund-</span> | <span lang="de">-in</span> | <span lang="de">die Kundin</span> |
        | <span lang="de">der Zeuge</span> | <span lang="de">Zeug-</span> | <span lang="de">-in</span> | <span lang="de">die Zeugin</span> |

        #### 2. Umlaut on the stem vowel

        Many masculine nouns with <span lang="de">a</span>, <span lang="de">o</span>, or <span lang="de">u</span> in the stressed syllable add an umlaut in the feminine form:

        | Masculine | Feminine | English |
        |---|---|---|
        | <span lang="de">der Arzt</span> | <span lang="de">die Ärztin</span> | doctor |
        | <span lang="de">der Koch</span> | <span lang="de">die Köchin</span> | cook |
        | <span lang="de">der Bruder</span> | <span lang="de">die Schwester</span> | brother / sister (suppletive — see below) |
        | <span lang="de">der Anwalt</span> | <span lang="de">die Anwältin</span> | lawyer |

        > **Note:** Not every noun takes an umlaut. You need to learn the most common ones. <span lang="de">Lehrer → Lehrerin</span> has **no** umlaut.

        #### 3. Plural: always <span lang="de">-innen</span>

        The plural of all <span lang="de">-in</span> feminines adds <span lang="de">-nen</span> (giving a double <span lang="de">n</span>):

        | Singular | Plural |
        |---|---|
        | <span lang="de">die Lehrerin</span> | <span lang="de">die Lehrerinnen</span> |
        | <span lang="de">die Ärztin</span> | <span lang="de">die Ärztinnen</span> |
        | <span lang="de">die Freundin</span> | <span lang="de">die Freundinnen</span> |

        ---

        ### Suppletive forms (irregular)

        A few common words do **not** use the <span lang="de">-in</span> pattern at all — they have completely different stems:

        | Masculine | Feminine | English |
        |---|---|---|
        | <span lang="de">der Mann</span> | <span lang="de">die Frau</span> | man / woman |
        | <span lang="de">der Bruder</span> | <span lang="de">die Schwester</span> | brother / sister |
        | <span lang="de">der Vater</span> | <span lang="de">die Mutter</span> | father / mother |
        | <span lang="de">der Sohn</span> | <span lang="de">die Tochter</span> | son / daughter |

        These must be memorised individually.

        ---

        ### Examples in context

        1. <span lang="de">Meine Lehrerin heißt Frau Müller.</span> — My (female) teacher is called Ms Müller.
        2. <span lang="de">Die Ärztin kommt gleich.</span> — The (female) doctor is coming right away.
        3. <span lang="de">Meine Freundin wohnt in Berlin.</span> — My (female) friend / girlfriend lives in Berlin.
        4. <span lang="de">Die Kundin möchte einen Kaffee.</span> — The (female) customer would like a coffee.
        5. <span lang="de">Unsere Nachbarin ist sehr nett.</span> — Our (female) neighbour is very nice.
        6. <span lang="de">Die Lehrerinnen sind alle im Konferenzzimmer.</span> — The (female) teachers are all in the staffroom.

        ---

        ### Common learner mistakes

        **Mistake 1: Forgetting to drop the final <span lang="de">-e</span>**

        > ❌ <span lang="de">die Kollegein</span>
        > ✅ <span lang="de">die Kollegin</span>

        Always drop the final <span lang="de">-e</span> of the masculine before adding <span lang="de">-in</span>.

        **Mistake 2: Writing the plural with a single <span lang="de">n</span>**

        > ❌ <span lang="de">die Freundinnen</span> ... wait — this IS correct!
        > ❌ <span lang="de">die Freundinen</span> (one <span lang="de">n</span>)
        > ✅ <span lang="de">die Freundinnen</span> (double <span lang="de">n</span>)

        The suffix <span lang="de">-in</span> + plural <span lang="de">-nen</span> always gives double <span lang="de">nn</span>.

        **Mistake 3: Forgetting the umlaut**

        > ❌ <span lang="de">die Arztin</span>
        > ✅ <span lang="de">die Ärztin</span>

        Learn the most frequent umlaut pairs (<span lang="de">Arzt/Ärztin</span>, <span lang="de">Koch/Köchin</span>, <span lang="de">Anwalt/Anwältin</span>) as fixed vocabulary items.

        **Mistake 4: Using the masculine article**

        > ❌ <span lang="de">der Lehrerin</span>
        > ✅ <span lang="de">die Lehrerin</span>

        All <span lang="de">-in</span> nouns are feminine — always use <span lang="de">die</span> in the nominative.
      language: en
      why_this_matters: German uses this pattern constantly for jobs, roles, and relationships
        — you need it to talk about a female teacher, colleague, neighbour, or customer.
        Without it you cannot correctly refer to the women around you, and you will
        misread or mishear half the people-words you encounter.

- code: noun_compound_same_d
  cefr_level: A1
  category: wortbildung
  subcategory: Nomen
  label: Komposita mit gleichem Bestimmungswort
  description: Compound nouns sharing the same first element (Bestimmungswort), illustrating
    how one modifier can combine with multiple base nouns.
  examples:
  - Reisegruppe, Reiseführer
  prerequisites:
  - noun_gender
  source_note: 'Komposita gleiches Bestimmungswort: Reisegruppe, Reiseführer'
  explanations:
    en:
      title: Compound nouns with the same first part
      tip: German builds new nouns by sticking two (or more) nouns together. When
        several compounds share the same first element, that one word acts as a common
        modifier for all of them. The gender and plural of the whole compound always
        follow the last noun.
      explanation: "## Compound nouns with the same first element\n\n### What is a\
        \ compound noun?\n\nA German compound noun (<span lang=\"de\">Kompositum</span>,\
        \ plural <span lang=\"de\">Komposita</span>) is formed by joining two or more\
        \ words into one. The last element is called the <span lang=\"de\">Grundwort</span>\
        \ (base word) and determines the gender and plural. Every element before it\
        \ is called a <span lang=\"de\">Bestimmungswort</span> (determining/modifying\
        \ word) and narrows the meaning.\n\n> <span lang=\"de\">Grund**wort**</span>\
        \ (last element) → sets gender & plural  \n> <span lang=\"de\">Bestimmungs**wort**</span>\
        \ (first element) → adds meaning\n\n---\n\n### The key pattern: one first\
        \ element, many compounds\n\nWhen the same <span lang=\"de\">Bestimmungswort</span>\
        \ combines with different <span lang=\"de\">Grundwörter</span>, it produces\
        \ a whole family of related nouns. Recognising the shared first part immediately\
        \ tells you something about the meaning of every member of that family.\n\n\
        **Formation**\n\n| <span lang=\"de\">Bestimmungswort</span> | + | <span lang=\"\
        de\">Grundwort</span> | = Compound | Gender |\n|---|---|---|---|---|\n| <span\
        \ lang=\"de\">Reise-</span> | | <span lang=\"de\">die Gruppe</span> | <span\
        \ lang=\"de\">die Reisegruppe</span> | feminine |\n| <span lang=\"de\">Reise-</span>\
        \ | | <span lang=\"de\">der Führer</span> | <span lang=\"de\">der Reiseführer</span>\
        \ | masculine |\n| <span lang=\"de\">Reise-</span> | | <span lang=\"de\">das\
        \ Büro</span> | <span lang=\"de\">das Reisebüro</span> | neuter |\n| <span\
        \ lang=\"de\">Reise-</span> | | <span lang=\"de\">die Tasche</span> | <span\
        \ lang=\"de\">die Reisetasche</span> | feminine |\n\nNotice how <span lang=\"\
        de\">Reise-</span> stays the same; only the <span lang=\"de\">Grundwort</span>\
        \ changes, and it is the <span lang=\"de\">Grundwort</span> that decides each\
        \ compound's gender.\n\n---\n\n### More families to know at A1\n\n**<span\
        \ lang=\"de\">Schul-</span>** (school-related)\n\n| Compound | Meaning |\n\
        |---|---|\n| <span lang=\"de\">die Schulklasse</span> | school class |\n|\
        \ <span lang=\"de\">die Schulstunde</span> | school lesson |\n| <span lang=\"\
        de\">das Schulbuch</span> | schoolbook / textbook |\n| <span lang=\"de\">der\
        \ Schulweg</span> | way to school |\n\n**<span lang=\"de\">Haus-</span>**\
        \ (house/home-related)\n\n| Compound | Meaning |\n|---|---|\n| <span lang=\"\
        de\">die Hausaufgabe</span> | homework |\n| <span lang=\"de\">die Haustür</span>\
        \ | front door |\n| <span lang=\"de\">der Hausschlüssel</span> | house key\
        \ |\n| <span lang=\"de\">das Haustier</span> | pet |\n\n**<span lang=\"de\"\
        >Stadt-</span>** (city-related)\n\n| Compound | Meaning |\n|---|---|\n| <span\
        \ lang=\"de\">die Stadtmitte</span> | city centre |\n| <span lang=\"de\">der\
        \ Stadtplan</span> | city map |\n| <span lang=\"de\">das Stadtbild</span>\
        \ | cityscape |\n\n---\n\n### Linking elements (<span lang=\"de\">Fugenelemente</span>)\n\
        \nSometimes a small connecting sound is inserted between the two parts. The\
        \ most common ones are <span lang=\"de\">-s-</span> and <span lang=\"de\"\
        >-e(n)-</span>. You do not need to produce these yourself at A1, but you need\
        \ to recognise them.\n\n| Without linking element | With linking element |\n\
        |---|---|\n| <span lang=\"de\">Reisebüro</span> | <span lang=\"de\">Arbeit**s**tag</span>\
        \ (<span lang=\"de\">Arbeit</span> + <span lang=\"de\">s</span> + <span lang=\"\
        de\">Tag</span>) |\n| <span lang=\"de\">Hausschlüssel</span> | <span lang=\"\
        de\">Frau**en**arzt</span> (<span lang=\"de\">Frau</span> + <span lang=\"\
        de\">en</span> + <span lang=\"de\">Arzt</span>) |\n\nJust treat the linking\
        \ element as part of the spelling.\n\n---\n\n### Examples with translations\n\
        \n1. <span lang=\"de\">Die Reisegruppe fährt nach Berlin.</span> — The travel\
        \ group is going to Berlin.\n2. <span lang=\"de\">Ich kaufe einen Reiseführer\
        \ für Wien.</span> — I am buying a travel guide for Vienna.\n3. <span lang=\"\
        de\">Das Schulbuch kostet zehn Euro.</span> — The textbook costs ten euros.\n\
        4. <span lang=\"de\">Wo ist der Hausschlüssel?</span> — Where is the house\
        \ key?\n5. <span lang=\"de\">Das Haustier schläft auf dem Sofa.</span> — The\
        \ pet is sleeping on the sofa.\n6. <span lang=\"de\">Der Stadtplan ist sehr\
        \ nützlich.</span> — The city map is very useful.\n\n---\n\n### Common learner\
        \ mistakes\n\n**Mistake 1 — Writing the compound as two separate words**\n\
        \n❌ <span lang=\"de\">Haus Schlüssel</span>  \n✅ <span lang=\"de\">Hausschlüssel</span>\n\
        \nIn German, compound nouns are always written as one word (unlike in English,\
        \ where 'house key' stays separate).\n\n---\n\n**Mistake 2 — Using the wrong\
        \ gender**\n\n❌ <span lang=\"de\">der Haustier</span>  \n✅ <span lang=\"de\"\
        >das Haustier</span> (because <span lang=\"de\">das Tier</span> is neuter)\n\
        \nAlways check the gender of the <span lang=\"de\">Grundwort</span>, not the\
        \ <span lang=\"de\">Bestimmungswort</span>.\n\n---\n\n**Mistake 3 — Reversing\
        \ the word order**\n\n❌ <span lang=\"de\">Bücherschule</span> (a school made\
        \ of books?)  \n✅ <span lang=\"de\">Schulbuch</span> (a book for school)\n\
        \nThe <span lang=\"de\">Grundwort</span> always comes last and names the general\
        \ category; the <span lang=\"de\">Bestimmungswort</span> comes first and specifies\
        \ which kind.\n\n---\n\n### Quick reference rule\n\n> **<span lang=\"de\"\
        >Bestimmungswort</span> (first) + <span lang=\"de\">Grundwort</span> (last)\
        \ = Compound**  \n> Gender = gender of the <span lang=\"de\">Grundwort</span>\
        \  \n> Plural = plural of the <span lang=\"de\">Grundwort</span>  \n> Always\
        \ written as one word."
      language: en
      why_this_matters: German vocabulary expands massively through compounding, so
        recognising a shared first element lets you decode dozens of new words from
        a single known root. Without this pattern you would have to memorise every
        compound as a completely new word instead of seeing the logical family it
        belongs to.

- code: noun_compound_same_b
  cefr_level: A1
  category: wortbildung
  subcategory: Nomen
  label: Komposita mit gleichem Grundwort
  description: Compound nouns sharing the same final element (Grundwort), illustrating
    how one base noun can combine with multiple modifiers.
  examples:
  - Frauenarzt, Zahnarzt
  - Postkarte, Scheckkarte
  - Familienfoto, Passfoto
  prerequisites:
  - noun_gender
  source_note: 'Komposita gleiches Grundwort: Frauenarzt/Zahnarzt, Postkarte/Scheckkarte,
    Familienfoto/Passfoto'
  explanations:
    en:
      title: Compound nouns with the same base word
      tip: In German, you can build many new nouns by combining different modifier
        words with the same base noun. The base word (called the <span lang="de">Grundwort</span>)
        always comes last and determines the gender of the whole compound. This pattern
        lets you expand your vocabulary quickly once you know one base noun.
      explanation: |-
        ## Compound nouns with the same base word (<span lang="de">Grundwort</span>)

        ### What is a compound noun?

        German frequently joins two (or more) nouns into one word. The last element is the **<span lang="de">Grundwort</span>** (base word). Every word before it is a **<span lang="de">Bestimmungswort</span>** (modifier word) that narrows the meaning. The gender and plural of the whole compound always follow the <span lang="de">Grundwort</span>.

        > **Rule:** <span lang="de">Bestimmungswort + Grundwort = Kompositum</span>

        ---

        ### The gender rule

        Because the gender comes from the <span lang="de">Grundwort</span>, any number of compounds built on the same base share the same gender:

        | <span lang="de">Grundwort</span> | Gender | Example compounds |
        |---|---|---|
        | <span lang="de">der Arzt</span> | masculine | <span lang="de">der Frauenarzt, der Zahnarzt, der Hausarzt</span> |
        | <span lang="de">die Karte</span> | feminine | <span lang="de">die Postkarte, die Scheckkarte, die Fahrkarte</span> |
        | <span lang="de">das Foto</span> | neuter | <span lang="de">das Familienfoto, das Passfoto, das Urlaubsfoto</span> |

        ---

        ### How the words join together

        Most compounds simply attach the two parts directly:

        <span lang="de">Post + Karte → Postkarte</span>

        Sometimes a linking element (**<span lang="de">Fugenzeichen</span>**) is inserted between the two parts. The most common is <span lang="de">-s-</span>:

        <span lang="de">Familie**s** + Foto → Familienfoto</span> *(no linking -s here)*
        <span lang="de">Pass + Foto → Passfoto</span> *(no linking element)*
        <span lang="de">Arbeit**s** + zimmer → Arbeitszimmer</span> *(linking -s)*

        At A1 level you do not need to produce these forms from scratch — just recognise the pattern when you read.

        ---

        ### Examples with translations

        1. <span lang="de">Der Zahnarzt hat heute keine Zeit.</span> — 'The dentist has no time today.'
        2. <span lang="de">Ich brauche eine Fahrkarte nach Berlin.</span> — 'I need a ticket to Berlin.'
        3. <span lang="de">Das Passfoto ist zu klein.</span> — 'The passport photo is too small.'
        4. <span lang="de">Mein Hausarzt ist sehr nett.</span> — 'My GP is very nice.'
        5. <span lang="de">Hast du eine Scheckkarte?</span> — 'Do you have a debit card?'
        6. <span lang="de">Das Familienfoto hängt an der Wand.</span> — 'The family photo is hanging on the wall.'

        ---

        ### Recognising the base word in a long compound

        Always read from right to left:
        - <span lang="de">**Frauen**arzt</span> → base = <span lang="de">Arzt</span> (doctor) → it is a type of doctor
        - <span lang="de">**Pass**foto</span> → base = <span lang="de">Foto</span> (photo) → it is a type of photo
        - <span lang="de">**Scheck**karte</span> → base = <span lang="de">Karte</span> (card) → it is a type of card

        Once you identify the base, you already know the general meaning and the gender.

        ---

        ### Common learner mistakes

        **Mistake 1 — Wrong gender:** Using the gender of the modifier instead of the base.

        > ✗ <span lang="de">der Postkarte</span> (because <span lang="de">die Post</span> is feminine)
        > ✓ <span lang="de">die Postkarte</span> (because <span lang="de">die Karte</span> is feminine)

        **Mistake 2 — Writing the compound as two separate words:**

        > ✗ <span lang="de">Pass Foto</span>
        > ✓ <span lang="de">Passfoto</span>

        In German, compound nouns are always written as **one word** with a capital letter.

        **Mistake 3 — Capitalising the modifier mid-word:**

        > ✗ <span lang="de">PassFoto</span>
        > ✓ <span lang="de">Passfoto</span>

        Only the very first letter of the whole compound is capitalised.

        ---

        ### Quick summary

        - The <span lang="de">Grundwort</span> is always last.
        - It gives the compound its **gender** and **plural**.
        - Many different modifiers can attach to the same <span lang="de">Grundwort</span>, creating a whole family of related words.
        - Compounds are written as **one word** with a capital first letter.
      language: en
      why_this_matters: German constantly builds new nouns by stacking words together,
        and sharing a base is one of the most common patterns you will see. Recognising
        the <span lang="de">Grundwort</span> lets you guess the meaning and gender
        of unfamiliar compounds right away. Without this skill, long compound nouns
        will look intimidating — with it, they become easy to decode.

- code: noun_participle
  cefr_level: A1
  category: wortbildung
  subcategory: Nomen
  label: Nominalisierte Partizipien
  description: Nouns formed from participles, such as agent or patient nouns derived
    from present or past participles.
  examples:
  - Reisender
  prerequisites:
  - selected_participles
  source_note: 'Partizipien (nominalisiert): Reisender'
  explanations:
    en:
      title: Nouns made from participles
      tip: German can turn participles — the '-ing' or '-ed' forms of verbs — directly
        into nouns simply by capitalizing them and adding the right adjective ending.
        The noun still behaves like an adjective, so its ending changes depending
        on the article and case in front of it.
      explanation: |-
        ## Nouns made from participles

        ### What is a nominalized participle?

        German allows any present participle (<span lang='de'>Partizip I</span>) or past participle (<span lang='de'>Partizip II</span>) to be used as a noun. You simply capitalize the participle and treat it like an **adjective used as a noun** — a pattern called <span lang='de'>substantiviertes Adjektiv</span> (adjectival noun). The noun keeps adjectival endings that reflect its gender, number, and case.

        ---

        ### Step 1 — Form the participle

        **Present participle (<span lang='de'>Partizip I</span>):** infinitive + <span lang='de'>-d</span>

        | Infinitive | Present participle |
        |---|---|
        | <span lang='de'>reisen</span> (to travel) | <span lang='de'>reisend</span> |
        | <span lang='de'>studieren</span> (to study) | <span lang='de'>studierend</span> |
        | <span lang='de'>lernend</span> | <span lang='de'>lernend</span> |

        **Past participle (<span lang='de'>Partizip II</span>):** typically <span lang='de'>ge-…-t</span> or <span lang='de'>ge-…-en</span>

        | Infinitive | Past participle |
        |---|---|
        | <span lang='de'>anstellen</span> (to employ) | <span lang='de'>angestellt</span> |
        | <span lang='de'>bekannt sein</span> (to be known) | <span lang='de'>bekannt</span> |
        | <span lang='de'>verletzen</span> (to injure) | <span lang='de'>verletzt</span> |

        ---

        ### Step 2 — Capitalize and add an adjective ending

        Once nominalized, the word takes **adjective endings** — the same endings you use for adjectives that come before a noun. Which ending you use depends on:

        - the **article** in front (definite, indefinite, or no article)
        - the **case** (nominative, accusative, dative, genitive)
        - the **number** (singular or plural)

        Because these nouns refer to people most often, they are masculine (for a man), feminine (for a woman), or plural (for a group).

        #### Endings after the definite article (<span lang='de'>der/die/das/die</span>)

        | Case | Masculine | Feminine | Plural |
        |---|---|---|---|
        | Nominative | <span lang='de'>der Reisende</span> | <span lang='de'>die Reisende</span> | <span lang='de'>die Reisenden</span> |
        | Accusative | <span lang='de'>den Reisenden</span> | <span lang='de'>die Reisende</span> | <span lang='de'>die Reisenden</span> |
        | Dative | <span lang='de'>dem Reisenden</span> | <span lang='de'>der Reisenden</span> | <span lang='de'>den Reisenden</span> |

        #### Endings after the indefinite article (<span lang='de'>ein/eine</span>)

        | Case | Masculine | Feminine |
        |---|---|---|
        | Nominative | <span lang='de'>ein Reisender</span> | <span lang='de'>eine Reisende</span> |
        | Accusative | <span lang='de'>einen Reisenden</span> | <span lang='de'>eine Reisende</span> |
        | Dative | <span lang='de'>einem Reisenden</span> | <span lang='de'>einer Reisenden</span> |

        > **Key pattern:** After a definite article, singular forms end in <span lang='de'>-e</span> (nominative) or <span lang='de'>-en</span> (other cases). After an indefinite article, the masculine nominative ends in <span lang='de'>-er</span> because the article itself does not show gender there.

        ---

        ### Common A1 examples

        | Participle source | Nominalized form | Meaning |
        |---|---|---|
        | <span lang='de'>reisen</span> → <span lang='de'>reisend</span> | <span lang='de'>der/die Reisende</span> | traveller |
        | <span lang='de'>anstellen</span> → <span lang='de'>angestellt</span> | <span lang='de'>der/die Angestellte</span> | employee |
        | <span lang='de'>kennen</span> → <span lang='de'>bekannt</span> | <span lang='de'>der/die Bekannte</span> | acquaintance |
        | <span lang='de'>verletzen</span> → <span lang='de'>verletzt</span> | <span lang='de'>der/die Verletzte</span> | injured person |

        ---

        ### Example sentences

        1. <span lang='de'>Ein Reisender fragt nach dem Weg.</span> — A traveller asks for directions.
        2. <span lang='de'>Die Angestellte arbeitet im Büro.</span> — The (female) employee works in the office.
        3. <span lang='de'>Ich kenne einen Bekannten dort.</span> — I know an acquaintance there.
        4. <span lang='de'>Der Verletzte liegt im Krankenhaus.</span> — The injured person is in hospital.
        5. <span lang='de'>Die Reisenden warten am Bahnhof.</span> — The travellers are waiting at the station.
        6. <span lang='de'>Sie hilft dem Verletzten.</span> — She helps the injured person.

        ---

        ### Common learner mistakes

        **Mistake:** Using a fixed ending regardless of article or case.
        > ✗ <span lang='de'>Ich sehe ein Reisende.</span>
        > ✓ <span lang='de'>Ich sehe eine Reisende.</span> (feminine, accusative after <span lang='de'>eine</span>)

        **Mistake:** Forgetting that the masculine nominative after <span lang='de'>ein</span> needs <span lang='de'>-er</span>, not <span lang='de'>-e</span>.
        > ✗ <span lang='de'>Ein Reisende kommt.</span>
        > ✓ <span lang='de'>Ein Reisender kommt.</span>

        **Mistake:** Treating the noun as having a fixed gender. These nouns reflect the biological sex of the person: <span lang='de'>der Angestellte</span> (male), <span lang='de'>die Angestellte</span> (female).

        ---

        ### Quick summary

        1. Take the present or past participle.
        2. Capitalize it.
        3. Add the correct adjective ending based on article, case, and number.
        4. The meaning is usually 'a person who [verb]s' or 'a person who has been [verb]ed'.
      language: en
      why_this_matters: Words like <span lang='de'>Reisender</span> (traveller), <span
        lang='de'>Angestellte</span> (employee), and <span lang='de'>Bekannte</span>
        (acquaintance) appear constantly in everyday German. Without this pattern
        you will not recognise or produce some of the most common words for people
        and things you encounter every day.

- code: adj_prefix_un
  cefr_level: A1
  category: wortbildung
  subcategory: Adjektive
  label: Adjektiv mit Vorsilbe un-
  description: Adjectives negated or reversed in meaning by adding the prefix un-.
  examples:
  - unbekannt
  source_note: 'Adjektive Vorsilbe un-: unbekannt'
  explanations:
    en:
      title: Negating adjectives with the prefix un-
      tip: Add <span lang="de">un-</span> to the front of many German adjectives to
        flip their meaning to the opposite, just like English 'un-' in 'unhappy'.
        The base adjective does not change at all — you simply attach the prefix.
        Not every adjective accepts <span lang="de">un-</span>, so it is best to learn
        common pairs together.
      explanation: |-
        ## Negating Adjectives with <span lang="de">un-</span>

        ### What the rule says

        The prefix <span lang="de">un-</span> attaches directly to the front of a base adjective and reverses or negates its meaning, equivalent to English *un-*, *in-*, or *not*. The base word is left completely unchanged.

        ### Formation

        <span lang="de">un-</span> + base adjective → negated adjective

        | Base adjective | Meaning | With <span lang="de">un-</span> | Meaning |
        |---|---|---|---|
        | <span lang="de">bekannt</span> | known / familiar | <span lang="de">unbekannt</span> | unknown |
        | <span lang="de">freundlich</span> | friendly | <span lang="de">unfreundlich</span> | unfriendly |
        | <span lang="de">glücklich</span> | happy | <span lang="de">unglücklich</span> | unhappy / unfortunate |
        | <span lang="de">gesund</span> | healthy | <span lang="de">ungesund</span> | unhealthy |
        | <span lang="de">möglich</span> | possible | <span lang="de">unmöglich</span> | impossible |
        | <span lang="de">wichtig</span> | important | <span lang="de">unwichtig</span> | unimportant |
        | <span lang="de">ordentlich</span> | tidy | <span lang="de">unordentlich</span> | untidy |
        | <span lang="de">sicher</span> | safe / certain | <span lang="de">unsicher</span> | unsafe / uncertain |
        | <span lang="de">ruhig</span> | calm / quiet | <span lang="de">unruhig</span> | restless / noisy |

        ### How <span lang="de">un-</span> adjectives behave in sentences

        Once formed, an <span lang="de">un-</span> adjective works exactly like any other adjective. It can be used:

        **Predicatively** (after <span lang="de">sein</span>, <span lang="de">werden</span>, etc. — no ending added):

        - <span lang="de">Das Zimmer ist unordentlich.</span> — *The room is untidy.*
        - <span lang="de">Das ist unmöglich!</span> — *That is impossible!*

        **Adverbially** (modifying a verb — no ending added):

        - <span lang="de">Er schläft unruhig.</span> — *He sleeps restlessly.*

        **Attributively** (before a noun — endings apply as normal):

        - <span lang="de">ein unbekannter Mann</span> — *an unknown man*
        - <span lang="de">eine unfreundliche Antwort</span> — *an unfriendly answer*

        > **Note for A1:** Attributive adjective endings (the change in <span lang="de">unbekannt**er**</span>) are a separate grammar topic. At this level, focus on recognising and using <span lang="de">un-</span> adjectives predicatively and adverbially.

        ### Common examples in context

        1. <span lang="de">Der Name ist mir unbekannt.</span> — *The name is unknown to me.*
        2. <span lang="de">Die Lehrerin ist nie unfreundlich.</span> — *The teacher is never unfriendly.*
        3. <span lang="de">Fast Food ist sehr ungesund.</span> — *Fast food is very unhealthy.*
        4. <span lang="de">Das Wetter ist heute ungemütlich.</span> — *The weather is unpleasant today.*
        5. <span lang="de">Der Weg ist unsicher.</span> — *The path is unsafe.*
        6. <span lang="de">Ihr Zimmer ist immer unordentlich.</span> — *Her room is always untidy.*

        ### Important exceptions and limits

        Not every adjective accepts <span lang="de">un-</span>. German does not say <span lang="de">*ungroß</span> for *not big* or <span lang="de">*unkalt</span> for *not cold*. When you are unsure, check a dictionary or learn the pair as a set phrase. Common adjectives that **do not** take <span lang="de">un-</span> typically already have a natural opposite (e.g. <span lang="de">groß / klein</span>, <span lang="de">warm / kalt</span>).

        Some <span lang="de">un-</span> words have a slightly shifted meaning rather than a simple negation:

        - <span lang="de">unglücklich</span> means *unhappy* but also *unfortunate* or *clumsy*.
        - <span lang="de">unsicher</span> means both *unsafe* and *uncertain* or *insecure*.

        ### Common learner mistakes

        | Mistake | Correction | Note |
        |---|---|---|
        | <span lang="de">*Er ist nicht-freundlich.</span> | <span lang="de">Er ist unfreundlich.</span> | Use the prefix, not a hyphen with <span lang="de">nicht</span>. |
        | <span lang="de">*Das ist unkalt.</span> | <span lang="de">Das ist nicht kalt.</span> | <span lang="de">kalt</span> does not take <span lang="de">un-</span>; use <span lang="de">nicht</span> instead. |
        | Writing <span lang="de">un-</span> separately | Always write it joined: <span lang="de">unbekannt</span>, not <span lang="de">un bekannt</span>. | It is a prefix, not a separate word. |
      language: en
      why_this_matters: 'You will meet <span lang="de">un-</span> adjectives constantly
        in everyday German — on signs, in forms, in simple conversations. Knowing
        this pattern lets you double your descriptive vocabulary instantly: every
        adjective you already know may have an <span lang="de">un-</span> partner.
        Without it you cannot describe things as unknown, unfriendly, impossible,
        or unhealthy.'

- code: adj_suffix_los
  cefr_level: A1
  category: wortbildung
  subcategory: Adjektive
  label: Adjektiv mit Nachsilbe -los
  description: Adjectives formed by adding the suffix -los (meaning 'without' or 'lacking')
    to a noun stem.
  examples:
  - arbeitslos
  source_note: 'Adjektive Nachsilbe -los: arbeitslos'
  explanations:
    en:
      title: Adjectives ending in -los
      tip: Add <span lang="de">-los</span> to a noun to make an adjective meaning
        'without' that thing. It works like the English suffix '-less' in words like
        'homeless' or 'jobless'. The noun's meaning stays recognisable in the new
        adjective.
      explanation: |-
        ## How <span lang="de">-los</span> adjectives work

        **Rule:** Attach the suffix <span lang="de">-los</span> directly to a noun stem to create an adjective meaning *without [noun]* or *lacking [noun]*. The pattern is identical to the English '-less' suffix.

        **Formation:**

        | Noun | Noun meaning | <span lang="de">-los</span> adjective | Adjective meaning |
        |------|-------------|----------------------|-------------------|
        | <span lang="de">die Arbeit</span> | work / job | <span lang="de">arbeitslos</span> | unemployed / jobless |
        | <span lang="de">die Kosten</span> | costs | <span lang="de">kostenlos</span> | free of charge |
        | <span lang="de">der Sinn</span> | sense / meaning | <span lang="de">sinnlos</span> | senseless / pointless |
        | <span lang="de">die Hilfe</span> | help | <span lang="de">hilflos</span> | helpless |
        | <span lang="de">die Kraft</span> | strength | <span lang="de">kraftlos</span> | weak / without strength |
        | <span lang="de">der Fehler</span> | mistake | <span lang="de">fehlerlos</span> | without mistakes / flawless |

        **Linking vowel:** Some nouns insert a linking element before <span lang="de">-los</span>. The most common is <span lang="de">-s-</span> (called a <span lang="de">Fugenlaut</span>, or linking sound), as in <span lang="de">Arbeit → arbeits-los</span>. This mirrors how the same noun forms compounds elsewhere (e.g. <span lang="de">Arbeitsplatz</span>). You do not need to memorise a separate rule — if you know the compound form, you know the linking element.

        **Using the adjective:** Like all German adjectives, <span lang="de">-los</span> adjectives can be used:

        1. **Predicatively** (after <span lang="de">sein</span>, <span lang="de">werden</span>, etc.) — no ending added:
           - <span lang="de">Er ist arbeitslos.</span> — *He is unemployed.*
           - <span lang="de">Das ist kostenlos.</span> — *That is free of charge.*

        2. **Adverbially** (modifying a verb or adjective) — no ending added:
           - <span lang="de">Sie hilft hilflos.</span> — *She helps helplessly.*

        3. **Attributively** (directly before a noun) — endings are added according to case, gender, and article (covered in attributive adjective grammar points):
           - <span lang="de">ein arbeitsloser Mann</span> — *an unemployed man*
           - <span lang="de">eine kostenlose App</span> — *a free app*

        At A1 level you will mostly see and use the predicative and adverbial forms, which require no added ending.

        ### Examples with translations

        - <span lang="de">Mein Vater ist seit einem Jahr arbeitslos.</span> — *My father has been unemployed for a year.*
        - <span lang="de">Der Eintritt ist kostenlos.</span> — *Admission is free.*
        - <span lang="de">Das Kind ist hilflos.</span> — *The child is helpless.*
        - <span lang="de">Die Antwort ist sinnlos.</span> — *The answer is pointless.*
        - <span lang="de">Ich bin sprachlos!</span> — *I am speechless!*
        - <span lang="de">Das Formular ist fehlerlos.</span> — *The form is without mistakes.*

        ### Common learner mistakes

        **Mistake:** Trying to translate '-less' words directly without knowing whether German uses <span lang="de">-los</span> or a different form.
        - ✗ <span lang="de">nutzlos</span> does exist, but some English '-less' words have no direct <span lang="de">-los</span> equivalent — always check.

        **Mistake:** Forgetting the linking <span lang="de">-s-</span> on certain stems.
        - ✗ <span lang="de">Arbeitlos</span>
        - ✓ <span lang="de">arbeitslos</span>

        **Mistake:** Adding an ending when using the adjective predicatively.
        - ✗ <span lang="de">Er ist arbeitslose.</span>
        - ✓ <span lang="de">Er ist arbeitslos.</span>
      language: en
      why_this_matters: Many common German adjectives — including everyday words like
        <span lang="de">arbeitslos</span> (unemployed) and <span lang="de">kostenlos</span>
        (free of charge) — are built this way. Recognising the pattern lets you decode
        and produce dozens of new words from nouns you already know.

- code: adj_suffix_bar
  cefr_level: A1
  category: wortbildung
  subcategory: Adjektive
  label: Adjektiv mit Nachsilbe -bar
  description: Adjectives formed by adding the suffix -bar (meaning 'able to be')
    to a verb stem.
  examples:
  - erreichbar
  source_note: 'Adjektive Nachsilbe -bar: erreichbar'
  explanations:
    en:
      title: Adjectives ending in -bar
      tip: Add <span lang="de">-bar</span> to a verb stem to make an adjective meaning
        'able to be [done]'. It works like the English suffix '-able' or '-ible'.
        These adjectives follow normal adjective rules in a sentence.
      explanation: |-
        ## Adjectives with the suffix <span lang="de">-bar</span>

        ### What does <span lang="de">-bar</span> mean?

        The suffix <span lang="de">-bar</span> attaches to a verb stem to create an adjective. It is equivalent to the English suffixes **-able** and **-ible**. The resulting adjective means **'able to be [done]'** or **'capable of being [done]'**.

        > <span lang="de">erreich**bar**</span> = able to be reached → **reachable**

        ---

        ### How is it formed?

        Take the infinitive of a verb, remove the <span lang="de">-en</span> ending to get the stem, then add <span lang="de">-bar</span>.

        | Verb (infinitive) | Stem | + <span lang="de">-bar</span> | Meaning |
        |---|---|---|---|
        | <span lang="de">erreich**en**</span> (to reach) | <span lang="de">erreich-</span> | <span lang="de">erreichbar</span> | reachable |
        | <span lang="de">trink**en**</span> (to drink) | <span lang="de">trink-</span> | <span lang="de">trinkbar</span> | drinkable |
        | <span lang="de">ess**en**</span> (to eat) | <span lang="de">ess-</span> | <span lang="de">essbar</span> | edible |
        | <span lang="de">verfüg**en**</span> (to be available) | <span lang="de">verfüg-</span> | <span lang="de">verfügbar</span> | available |
        | <span lang="de">les**en**</span> (to read) | <span lang="de">les-</span> | <span lang="de">lesbar</span> | readable |
        | <span lang="de">bezahl**en**</span> (to pay) | <span lang="de">bezahl-</span> | <span lang="de">bezahlbar</span> | affordable, payable |

        ---

        ### Using <span lang="de">-bar</span> adjectives in a sentence

        <span lang="de">-bar</span> adjectives are normal adjectives. At A1 level you will most often see them used **predicatively** (after <span lang="de">sein</span>), with no ending change needed.

        **Examples:**

        1. <span lang="de">Das Wasser ist trinkbar.</span> — The water is drinkable.
        2. <span lang="de">Ist dieses Pilz essbar?</span> — Is this mushroom edible?
        3. <span lang="de">Der Arzt ist nicht erreichbar.</span> — The doctor is not reachable.
        4. <span lang="de">Das Zimmer ist verfügbar.</span> — The room is available.
        5. <span lang="de">Die Schrift ist gut lesbar.</span> — The writing is easy to read (readable).
        6. <span lang="de">Ist das bezahlbar?</span> — Is that affordable?

        ---

        ### Important variants

        - Some very common <span lang="de">-bar</span> adjectives have meanings that have shifted slightly from the base verb, so always check if a word feels unfamiliar. For example, <span lang="de">dankbar</span> (thankful/grateful) comes from <span lang="de">danken</span> (to thank).
        - Separable verbs drop their prefix before adding <span lang="de">-bar</span> in some cases, but at A1 level this is rare — focus on the common words listed above.

        ---

        ### Common learner mistakes

        | Mistake | Correction | Why |
        |---|---|---|
        | <span lang="de">*trinkenbar*</span> | <span lang="de">trinkbar</span> | Remove the full <span lang="de">-en</span> ending first; do not keep it. |
        | <span lang="de">*Das ist trinkbares.*</span> | <span lang="de">Das ist trinkbar.</span> | After <span lang="de">sein</span> (predicative use), no adjective ending is added. |
        | Guessing any verb can take <span lang="de">-bar</span> | Only established words are correct | Not every verb forms a common <span lang="de">-bar</span> adjective — learn the frequent ones first. |

        ---

        ### Quick recognition tip

        Whenever you see a German word ending in <span lang="de">-bar</span>, ask yourself: *what verb could this come from?* You will often be able to guess the meaning immediately.
      language: en
      why_this_matters: Words ending in <span lang="de">-bar</span> appear constantly
        in everyday German — on signs, menus, instructions, and in conversation. Recognising
        the pattern lets you decode dozens of new words instantly, even ones you have
        never seen before.

- code: adj_compound_colour
  cefr_level: A1
  category: wortbildung
  subcategory: Adjektive
  label: Adjektiv-Komposita mit Farben
  description: Compound adjectives formed by combining a modifier with a colour adjective,
    e.g. to express shades.
  examples:
  - hellblau, dunkelblau
  source_note: 'Adjektive Komposita: hellblau, dunkelblau'
  explanations:
    en:
      title: Compound colour adjectives
      tip: German lets you build new colour words by joining a modifier directly onto
        a base colour — no space, no hyphen. The modifier tells you how light, dark,
        or similar to something the colour is. The compound word works just like any
        simple colour adjective.
      explanation: |-
        ## Compound colour adjectives in German

        ### What is this rule?

        German forms new colour adjectives by **compounding** — joining two elements into one written word. The first element (the **modifier**) narrows or shades the meaning of the second element (the **base colour**). The result is a single adjective with no space and no hyphen.

        ---

        ### Formation

        > **modifier + base colour = compound colour adjective**

        The most common modifiers at A1 level are:

        | Modifier | Meaning | Example compound |
        |---|---|---|
        | <span lang="de">hell-</span> | light / pale | <span lang="de">hellblau</span> (light blue) |
        | <span lang="de">dunkel-</span> | dark | <span lang="de">dunkelgrün</span> (dark green) |
        | <span lang="de">hoch-</span> | intense / deep | <span lang="de">hochrot</span> (deep red) |

        Base colours you already know at A1 include <span lang="de">blau, rot, grün, gelb, grau, braun, schwarz, weiß, rosa, orange</span>.

        You can combine freely:
        - <span lang="de">hell-</span> + <span lang="de">grün</span> → <span lang="de">hellgrün</span> (light green)
        - <span lang="de">dunkel-</span> + <span lang="de">rot</span> → <span lang="de">dunkelrot</span> (dark red)
        - <span lang="de">hell-</span> + <span lang="de">grau</span> → <span lang="de">hellgrau</span> (light grey)
        - <span lang="de">dunkel-</span> + <span lang="de">braun</span> → <span lang="de">dunkelbraun</span> (dark brown)

        ---

        ### A second type: noun + colour

        A colour can also be modified by a **noun** that the colour resembles. Again, one word, no hyphen:

        | Noun | Base colour | Compound |
        |---|---|---|
        | <span lang="de">Himmel</span> (sky) | <span lang="de">blau</span> | <span lang="de">himmelblau</span> (sky blue) |
        | <span lang="de">Gras</span> (grass) | <span lang="de">grün</span> | <span lang="de">grasgrün</span> (grass green) |
        | <span lang="de">Schnee</span> (snow) | <span lang="de">weiß</span> | <span lang="de">schneeweiß</span> (snow white) |

        These are less common at A1 but you will recognise them when you see them.

        ---

        ### How compound colour adjectives behave grammatically

        A compound colour adjective works **exactly like any simple colour adjective**. It can be used:

        **Predicatively** (after <span lang="de">sein</span> — no ending added):
        > <span lang="de">Das Auto ist dunkelblau.</span> — The car is dark blue.

        **Attributively** (before a noun — add the normal adjective ending):
        > <span lang="de">Ich trage ein hellblaues Hemd.</span> — I am wearing a light-blue shirt.

        At A1, predicative use (no ending) is the most common and the safest to start with.

        ---

        ### Examples

        1. <span lang="de">Mein Fahrrad ist dunkelgrün.</span> — My bicycle is dark green.
        2. <span lang="de">Sie hat ein hellgelbes T-Shirt.</span> — She has a light-yellow T-shirt.
        3. <span lang="de">Der Himmel ist hellblau.</span> — The sky is light blue.
        4. <span lang="de">Er trägt eine dunkelrote Jacke.</span> — He is wearing a dark-red jacket.
        5. <span lang="de">Die Wand ist hellgrau.</span> — The wall is light grey.
        6. <span lang="de">Das ist ein dunkelbraunes Sofa.</span> — That is a dark-brown sofa.

        ---

        ### Common learner mistakes

        | Mistake | Correction | Why |
        |---|---|---|
        | <span lang="de">hell blau</span> (two words) | <span lang="de">hellblau</span> | German compounds are always written as one word. |
        | <span lang="de">hell-blau</span> (hyphen) | <span lang="de">hellblau</span> | No hyphen is used in German colour compounds. |
        | <span lang="de">Das Auto ist dunkelblauer.</span> | <span lang="de">Das Auto ist dunkelblau.</span> | Predicative adjectives never take an ending, even when compound. |

        ---

        ### Quick reference: common A1 compound colours

        | German | English |
        |---|---|
        | <span lang="de">hellblau</span> | light blue |
        | <span lang="de">dunkelblau</span> | dark blue |
        | <span lang="de">hellgrün</span> | light green |
        | <span lang="de">dunkelgrün</span> | dark green |
        | <span lang="de">hellrot / hellrosa</span> | light red / pale pink |
        | <span lang="de">dunkelrot</span> | dark red |
        | <span lang="de">hellgrau</span> | light grey |
        | <span lang="de">dunkelgrau</span> | dark grey |
        | <span lang="de">hellbraun</span> | light brown |
        | <span lang="de">dunkelbraun</span> | dark brown |
      language: en
      why_this_matters: Colours come up constantly when describing clothes, objects,
        and surroundings. Without compound colour adjectives you can only say 'blue'
        — with them you can say 'light blue', 'dark blue', or 'sky blue', making your
        descriptions far more precise from day one.

- code: perfekt_all_verbs
  cefr_level: A2
  category: verb
  subcategory: Tempus
  label: Perfekt aller Verben der Wortliste
  description: Formation and use of the Perfekt (present perfect) tense for all verbs
    in the A2 word list, extending beyond the limited set of verbs covered at A1.
  examples: []
  source_note: Perfekt aller Verben der Wortliste* — extends A1 Perfekt which covered
    only a select list of verbs
  explanations: {}

- code: praeteritum_kommen_s
  cefr_level: A2
  category: verb
  subcategory: Tempus
  label: Präteritum von kommen und sagen
  description: Simple past (Präteritum) forms of the verbs kommen and sagen, used
    in narrative contexts at A2 level.
  examples:
  - Wir kamen zu spät.
  - Sie sagte nichts.
  source_note: Präteritum der Verben kommen*, sagen*
  explanations: {}

- code: praeteritum_modal
  cefr_level: A2
  category: verb
  subcategory: Tempus
  label: Präteritum der Modalverben
  description: Simple past (Präteritum) forms of modal verbs (müssen, dürfen, sollen,
    können, wollen, mögen), used for expressing past obligation, ability, or permission.
  examples:
  - Ich konnte gestern leider nicht.
  source_note: Modalverben* Präteritum
  explanations: {}

- code: passiv_present
  cefr_level: A2
  category: verb
  subcategory: Modus
  label: Passiv Präsens
  description: The present passive voice (werden + Partizip II), used to describe
    actions where the agent is not the focus. Also includes passive-like participial
    phrases.
  examples:
  - Das Auto wird repariert.
  - Heute geöffnet.
  - Bis Donnerstag geschlossen.
  source_note: Passiv* — including short participial passive forms
  explanations: {}

- code: konjunktiv2_haben_ko
  cefr_level: A2
  category: verb
  subcategory: Modus
  label: Konjunktiv II haben und können
  description: Konjunktiv II forms of haben and können used for polite requests and
    hypothetical statements, extending the A1 coverage of mögen/werden.
  examples:
  - Ich hätte gerne ein Brot, bitte.
  - Könnten Sie bitte zu mir kommen.
  source_note: Konjunktiv II der Verben haben*, können* (mögen and werden already
    in A1)
  explanations: {}

- code: dativ_case_nouns
  cefr_level: A2
  category: nomen
  subcategory: Kasus
  label: Dativ aller Nomen der Wortliste
  description: The dative case for all nouns in the A2 word list, extending A1 coverage
    of nominative and accusative cases.
  examples:
  - dem Mann
  - Gib mir bitte mal dein Wörterbuch.
  - Kann ich dir helfen?
  source_note: Nominativ, Akkusativ, Dativ* aller Nomen in der Wortliste
  explanations: {}

- code: genitiv_eigennamen
  cefr_level: A2
  category: nomen
  subcategory: Kasus
  label: Genitiv bei Eigennamen im Singular
  description: Genitive case used with proper names (Eigennamen) in the singular to
    express possession.
  examples:
  - Karls Freunde kommen heute Nachmittag.
  source_note: Genitiv bei Eigennamen im Singular
  explanations: {}

- code: genitiv_receptive
  cefr_level: A2
  category: nomen
  subcategory: Kasus
  label: Genitiv rezeptiv
  description: Receptive understanding of the genitive case with definite articles,
    recognising possession or attribution without requiring active production.
  examples:
  - die Nummer des Wagens
  source_note: Genitiv (rezeptiv)
  explanations: {}

- code: genitiv_ersatzform
  cefr_level: A2
  category: nomen
  subcategory: Kasus
  label: Genitiv Ersatzform mit von
  description: The use of 'von + Dativ' as a colloquial substitute for the genitive
    case to express possession or association.
  examples:
  - Freunde von Karl kommen heute.
  source_note: Ersatzform* — von + Dativ as substitute for genitive
  explanations: {}

- code: indef_pronoun_jemand
  cefr_level: A2
  category: artikelwoerter_pronomen
  subcategory: Pronomen
  label: Indefinitpronomen jemand und niemand
  description: The indefinite pronouns jemand (someone) and niemand (no one) used
    to refer to unspecified persons.
  examples:
  - Hat jemand meine Schlüssel gesehen?
  - Hier ist niemand.
  source_note: 'Indefinit: jemand*, niemand*'
  explanations: {}

- code: interrogativ_welch
  cefr_level: A2
  category: artikelwoerter_pronomen
  subcategory: Artikel
  label: Interrogativartikel welch- und alle
  description: The interrogative article welch- (which) in nominative and accusative
    forms, and the determiner alle (all), used in questions and general statements.
  examples:
  - Welchen Film meinst du?
  - alle Kursteilnehmer
  source_note: 'interrogativ*: Nominativ / Akkusativ: welch-, alle'
  explanations: {}

- code: possessiv_unser_euer
  cefr_level: A2
  category: artikelwoerter_pronomen
  subcategory: Artikel
  label: Possessivartikel unser und euer
  description: The possessive determiners unser (our) and euer (your, plural informal)
    with their inflected forms across genders.
  examples:
  - unser / euer Lehrer
  - uns(e)re / eure Lehrerin
  - unser / euer Haus
  source_note: 'Possessiv: unser / euer*'
  explanations: {}

- code: reflexivpron_akkusat
  cefr_level: A2
  category: artikelwoerter_pronomen
  subcategory: Pronomen
  label: Reflexivpronomen im Akkusativ
  description: Reflexive pronouns in the accusative case (mich, dich, euch, sich)
    used with reflexive verbs to indicate that the subject acts upon itself.
  examples:
  - Er wäscht sich.
  - Wir sehen uns morgen.
  source_note: 'Reflexivpronomen* im Akkusativ: mich / dich / euch / sich; Reziprokpronomen:
    sich / uns'
  explanations: {}

- code: dativ_fragepronomen
  cefr_level: A2
  category: artikelwoerter_pronomen
  subcategory: Pronomen
  label: Fragepronomen Wem im Dativ
  description: The interrogative pronoun wem used in the dative case to ask about
    the indirect object of a sentence.
  examples:
  - Wem gehört die Jacke?
  source_note: 'Fragepronomen im Dativ: Wem? — extends A1 Nominativ/Akkusativ coverage'
  explanations: {}

- code: adjektiv_attributiv
  cefr_level: A2
  category: adjektiv
  subcategory: attributiv
  label: Attributives Adjektiv nach definitem und indefinitem Artikel
  description: Adjective declension in attributive position after both definite and
    indefinite articles, covering nominative, accusative and dative cases.
  examples:
  - der neue Arbeitsplatz / die neue Stelle / das neue Haus
  - ein neuer Arbeitsplatz / eine neue Stelle / ein neues Haus
  source_note: attributiv* — nach definitem Artikel im Nominativ / Akkusativ / Dativ;
    nach indefinitem Artikel im Nominativ / Akkusativ / Dativ
  explanations: {}

- code: komparation_adj
  cefr_level: A2
  category: adjektiv
  subcategory: Komparation
  label: Komparation ausgewählter Adjektive
  description: Comparative and superlative forms of selected adjectives and adverbs,
    including irregular forms like gern/lieber/am liebsten and gut/besser/am besten.
  examples:
  - Hier ist das Obst billiger.
  - Er ist jünger als ich.
  - Ich trinke lieber Tee.
  - Ich verstehe jetzt besser Deutsch als vor drei Monaten.
  source_note: Komparation* — ausgewählte Komparative; gern/lieber/am liebsten, viel/mehr/am
    meisten, gut/besser/am besten
  explanations: {}

- code: temporal_prep_bis
  cefr_level: A2
  category: praeposition
  subcategory: temporal
  label: Temporale Präposition bis
  description: The temporal preposition bis (until/by) with accusative, expressing
    a time limit or deadline.
  examples:
  - bis nächsten Montag
  - bis morgen
  source_note: bis + Akkusativ*
  explanations: {}

- code: temporal_prep_seit
  cefr_level: A2
  category: praeposition
  subcategory: temporal
  label: Temporale Präposition seit
  description: The temporal preposition seit (since/for) with dative, expressing the
    starting point or duration of an ongoing situation.
  examples:
  - seit einer Woche
  source_note: seit + Dativ*
  explanations: {}

- code: temporal_prep_vom_an
  cefr_level: A2
  category: praeposition
  subcategory: temporal
  label: Temporale Präposition vom … an
  description: The temporal expression vom … an (from … onwards), used to indicate
    the starting point of a period.
  examples:
  - vom Herbst an
  source_note: vom ... an*
  explanations: {}

- code: temporal_prep_waehre
  cefr_level: A2
  category: praeposition
  subcategory: temporal
  label: Temporale Präposition während
  description: The temporal preposition während (during) governing the genitive case,
    expressing concurrent events.
  examples:
  - während des Urlaubs
  source_note: während + Genitiv*
  explanations: {}

- code: temporal_prep_zu
  cefr_level: A2
  category: praeposition
  subcategory: temporal
  label: Temporale Präposition zu
  description: The temporal preposition zu (at/for) with dative, used to express time
    in relation to meals or occasions.
  examples:
  - zum Frühstück
  source_note: zu + Dativ* (temporal)
  explanations: {}

- code: lokal_prep_hinter
  cefr_level: A2
  category: praeposition
  subcategory: lokal
  label: Lokale Präposition hinter
  description: The two-way preposition hinter (behind) with dative for location and
    accusative for direction.
  examples:
  - hinter dem Haus
  source_note: hinter + Dativ / Akkusativ*
  explanations: {}

- code: lokal_prep_gegenuebe
  cefr_level: A2
  category: praeposition
  subcategory: lokal
  label: Lokale Präposition gegenüber
  description: The local preposition gegenüber (opposite/across from) with dative,
    typically postposed after a noun or pronoun.
  examples:
  - in dem Geschäft gegenüber
  source_note: gegenüber + Dativ* (nachgestellt)
  explanations: {}

- code: lokal_prep_neben
  cefr_level: A2
  category: praeposition
  subcategory: lokal
  label: Lokale Präposition neben
  description: The two-way preposition neben (next to/beside) with dative for static
    location and accusative for movement.
  examples:
  - in der Wohnung neben mir
  source_note: neben + Dativ / Akkusativ*
  explanations: {}

- code: lokal_prep_unter
  cefr_level: A2
  category: praeposition
  subcategory: lokal
  label: Lokale Präposition unter
  description: The two-way preposition unter (under/below) with dative for static
    location and accusative for directional movement.
  examples:
  - unter dem Tisch
  - unter der Nummer
  source_note: unter + Dativ / Akkusativ*
  explanations: {}

- code: lokal_prep_ueber
  cefr_level: A2
  category: praeposition
  subcategory: lokal
  label: Lokale Präposition über
  description: The two-way preposition über (above/over) with dative for static location
    and accusative for directional movement.
  examples:
  - über dem Tisch
  source_note: über + Dativ / Akkusativ*
  explanations: {}

- code: lokal_prep_von
  cefr_level: A2
  category: praeposition
  subcategory: lokal
  label: Lokale Präposition von
  description: The local preposition von (from) with dative, indicating origin or
    starting point of movement.
  examples:
  - von der Arbeit / vom Arzt kommen
  - von Hamburg nach Bremen
  source_note: von + Dativ*
  explanations: {}

- code: lokal_prep_vor
  cefr_level: A2
  category: praeposition
  subcategory: lokal
  label: Lokale Präposition vor
  description: The local preposition vor (in front of) with dative, indicating position
    in front of a place or object.
  examples:
  - vor dem Kino
  source_note: vor + Dativ* (lokal)
  explanations: {}

- code: lokal_prep_zwischen
  cefr_level: A2
  category: praeposition
  subcategory: lokal
  label: Lokale Präposition zwischen
  description: The two-way preposition zwischen (between) with dative for location
    and accusative for direction, indicating a position between two points.
  examples:
  - zwischen Frankfurt und Stuttgart
  source_note: zwischen + Dativ / Akkusativ*
  explanations: {}

- code: konj_deshalb
  cefr_level: A2
  category: syntax
  subcategory: Satzverbindungen
  label: Konjunktion deshalb
  description: The connective deshalb (therefore/so) used as a coordinating adverbial
    conjunction to express consequence, triggering verb-second word order.
  examples:
  - Peter muss lernen, deshalb kommt er heute nicht mit.
  source_note: deshalb*
  explanations: {}

- code: konj_weil
  cefr_level: A2
  category: syntax
  subcategory: Satzverbindungen
  label: Konjunktion weil (Kausalangabe)
  description: The subordinating conjunction weil (because), which introduces a causal
    subordinate clause with verb-final word order.
  examples:
  - Er kommt nicht mit, weil er krank ist.
  source_note: weil*
  explanations: {}

- code: konj_wenn
  cefr_level: A2
  category: syntax
  subcategory: Satzverbindungen
  label: Konjunktion wenn (Konditional/Temporal)
  description: The subordinating conjunction wenn (when/if), introducing conditional
    or temporal subordinate clauses with verb-final word order.
  examples:
  - Schreib mir bitte, wenn du Zeit hast.
  source_note: wenn*
  explanations: {}

- code: wortbildung_nomen_er
  cefr_level: A2
  category: wortbildung
  subcategory: Nomen
  label: Nomenbildung mit Suffix -er
  description: Formation of nouns using the suffix -er, typically to derive agent
    nouns (people who do something) from verbs.
  examples:
  - Ausländer
  - Arbeiter
  - Bewohner
  - Teilnehmer
  source_note: 'Nomen -er: Ausländer, Arbeiter, Bewohner, Teilnehmer'
  explanations: {}

- code: wortbildung_nomen_un
  cefr_level: A2
  category: wortbildung
  subcategory: Nomen
  label: Nomenbildung mit Suffix -ung
  description: Formation of feminine nouns using the suffix -ung, typically derived
    from verbs to express a process or result.
  examples:
  - Wohnung
  - Lösung
  - Mitteilung
  - Zahlung
  source_note: 'Nomen -ung: Wohnung, Lösung, Mitteilung, Zahlung'
  explanations: {}

- code: wortbildung_nomen_in
  cefr_level: A2
  category: wortbildung
  subcategory: Nomen
  label: Nomenbildung feminine Formen auf -in
  description: Formation of feminine agent nouns using the suffix -in, used to derive
    the female form from a masculine base noun.
  examples:
  - Nachbarin
  - Kollegin
  - Kundin
  - Leiterin
  source_note: 'feminine Formen -in: Nachbarin, Kollegin, Kundin, Leiterin'
  explanations: {}

- code: wortbildung_komposit
  cefr_level: A2
  category: wortbildung
  subcategory: Nomen
  label: Komposita mit gleichem Bestimmungs- oder Grundwort
  description: Formation of compound nouns (Komposita) by combining two nouns, either
    sharing the same first element (Bestimmungswort) or the same final element (Grundwort).
  examples:
  - Reisegruppe
  - Reiseführer
  - Frauenarzt
  - Zahnarzt
  - Postkarte
  - Familienfoto
  source_note: Komposita — gleiches Bestimmungswort (z.B. Reise-) oder gleiches Grundwort
    (z.B. -arzt, -karte, -foto)
  explanations: {}

- code: wortbildung_partizip
  cefr_level: A2
  category: wortbildung
  subcategory: Nomen
  label: Nominalisierung von Partizipien
  description: Nominalisation of present or past participles to form nouns referring
    to persons or things.
  examples:
  - Reisender
  source_note: 'Nominalisierung — Partizipien: Reisender'
  explanations: {}

- code: wortbildung_adj_un
  cefr_level: A2
  category: wortbildung
  subcategory: Adjektive
  label: Adjektivbildung mit Vorsilbe un-
  description: Formation of adjectives with the negative prefix un-, which reverses
    or negates the meaning of the base adjective.
  examples:
  - unbekannt
  source_note: 'Adjektive Vorsilbe un-: unbekannt'
  explanations: {}

- code: wortbildung_adj_los
  cefr_level: A2
  category: wortbildung
  subcategory: Adjektive
  label: Adjektivbildung mit Nachsilbe -los
  description: Formation of adjectives with the suffix -los (without/lacking), typically
    derived from nouns to express the absence of something.
  examples:
  - arbeitslos
  source_note: 'Adjektive Nachsilbe -los: arbeitslos'
  explanations: {}

- code: wortbildung_adj_bar
  cefr_level: A2
  category: wortbildung
  subcategory: Adjektive
  label: Adjektivbildung mit Nachsilbe -bar
  description: Formation of adjectives with the suffix -bar (expressible as '-able'
    or '-ible' in English), typically derived from verbs to express possibility or
    capability.
  examples:
  - erreichbar
  source_note: 'Adjektive Nachsilbe -bar: erreichbar'
  explanations: {}

- code: wortbildung_adj_komp
  cefr_level: A2
  category: wortbildung
  subcategory: Adjektive
  label: Adjektiv-Komposita mit hell- und dunkel-
  description: Formation of compound adjectives using hell- (light) or dunkel- (dark)
    as the first element to modify a colour adjective.
  examples:
  - hellblau
  - dunkelblau
  source_note: 'Adjektive Komposita: hellblau, dunkelblau'
  explanations: {}
