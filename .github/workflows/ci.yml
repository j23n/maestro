name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --group dev
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pytest tests/unit/ -v
      - run: uv run python -m authoring.cli validate
      - run: uv run python -m authoring.cli build
      - uses: actions/upload-artifact@v4
        with:
          name: it-pack
          path: build/it.pack.sqlite

  core:
    runs-on: ubuntu-latest
    needs: python
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - uses: actions/download-artifact@v4
        with:
          name: it-pack
          path: build
      - run: cargo test --manifest-path core/Cargo.toml
      - run: MAESTRO_PACK_PATH=../build/it.pack.sqlite cargo test --manifest-path core/Cargo.toml --test pack_compat
      - run: cargo clippy --manifest-path core/Cargo.toml --all-targets -- -D warnings
