# CI (docs/10 § CI): j23n/apple-ci's shared Linux and macOS jobs, which run `make ci-linux` and `make ci-macos`.
# Linux: Swift 6.4.0 (the Swift of Xcode 27, ADR-01), uv + Python: the guards, LearningCore, Storage, the pipeline
# and the content checks. macOS: Storage, the dev pack built twice (it must be deterministic), the app built for the
# iOS Simulator and the Mac, and its unit and snapshot tests.
name: CI
on:
  pull_request:
  push:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    uses: j23n/apple-ci/.github/workflows/linux.yml@main
    with:
      name: LearningCore + pipeline + content (Linux)
      swift: "6.4.0"
      apt-packages: python3 libsqlite3-dev ffmpeg
      uv: true
      cache-path: pipeline/data
      cache-key: pipeline-data
      cache-hash-files: pipeline/data/SOURCES.md

  macos:
    uses: j23n/apple-ci/.github/workflows/macos.yml@main
    with:
      name: Storage + app builds and tests (macOS)
      brew: xcodegen ffmpeg
      uv: true
      lfs: true
