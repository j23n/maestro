# CI (docs/10 § CI; adapted in M0.5). Every step is guarded until the thing it checks exists.
# Linux: Swift 6.4.0 (the official image, the same Swift as Xcode 27, verified 2026-10-07 by pulling
# swift:6.4.0-noble), uv + Python, LearningCore, Storage (GRDB 7.11.1 builds on Linux too), pipeline, content.
# macOS: the image name and the Xcode path are unverified from the Linux session that wrote this; the owner
# confirms them on the first PR run (docs/11 M0.5 [owner]).
name: CI
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: LearningCore + pipeline + content (Linux)
    runs-on: ubuntu-latest
    container: swift:6.4.0-noble               # pinned: the same Swift as Xcode 27 (Swift 6.4)
    steps:
      - uses: actions/checkout@v4
        with: { lfs: false }
      - name: Tools for the pipeline
        run: apt-get update && apt-get install -y --no-install-recommends python3 curl git make ca-certificates libsqlite3-dev
      - name: uv
        uses: astral-sh/setup-uv@v6             # confirm the current major version at M0.5
      - name: Cache reference data
        uses: actions/cache@v4
        with:
          path: pipeline/data
          key: pipeline-data-${{ hashFiles('pipeline/data/SOURCES.md') }}
      - name: Guards
        run: make lint-guards
      - name: LearningCore tests
        if: hashFiles('Packages/LearningCore/Package.swift') != ''
        run: make test-core
      - name: Storage tests (Linux bonus; the macOS job is the reference)
        if: hashFiles('Packages/Storage/Package.swift') != ''
        run: make test-storage
      - name: Reference data
        if: hashFiles('pipeline/pyproject.toml') != ''
        run: make data
      - name: Pipeline tests
        if: hashFiles('pipeline/pyproject.toml') != ''
        run: make test-pipeline
      - name: Pipeline lint (ruff)
        if: hashFiles('pipeline/pyproject.toml') != ''
        run: uv run --project pipeline ruff check pipeline && uv run --project pipeline ruff format --check pipeline
      - name: Content checks (once the CLI has `check`)
        if: hashFiles('pipeline/pyproject.toml') != ''
        run: |
          if uv run --project pipeline content check --help >/dev/null 2>&1; then make check-content
          else echo "content check is not implemented yet (M1.8)"; fi

  macos:
    name: Storage + app builds and tests (macOS)
    runs-on: macos-26                           # confirm the image name; Xcode 27 needs macOS 26.6+
    steps:
      - uses: actions/checkout@v4
        with: { lfs: true }
      - name: Select Xcode 27
        run: sudo xcode-select -s /Applications/Xcode_27.0.app   # adjust to the installed path
      - uses: astral-sh/setup-uv@v6
      - name: Storage tests
        if: hashFiles('Packages/Storage/Package.swift') != ''
        run: make test-storage
      - name: Pack is fresh (once a pack is committed)
        if: hashFiles('App/Italiano/Resources/Content/content.sqlite') != ''
        run: |
          python3 -c "import sqlite3,sys; v=sqlite3.connect('App/Italiano/Resources/Content/content.sqlite').execute(\"select value from meta where key='release'\").fetchone(); sys.exit(0 if v and v[0]=='0' else 'the committed pack must be a dev build (meta.release = 0)')"
          make data
          committed="$(uv run --project pipeline content pack-hash --pack App/Italiano/Resources/Content/content.sqlite)"
          make pack
          fresh="$(uv run --project pipeline content pack-hash --pack App/Italiano/Resources/Content/content.sqlite)"
          test "$committed" = "$fresh" || { echo "content.sqlite is stale: run make pack and commit"; exit 1; }
      - name: App builds (unsigned)
        if: hashFiles('App/Italiano.xcodeproj/project.pbxproj') != ''
        run: make build-ios build-mac
      - name: App unit and snapshot tests (iOS unsigned, macOS ad-hoc; pinned simulator runtime, perceptualPrecision 0.98)
        if: hashFiles('App/Italiano.xcodeproj/project.pbxproj') != ''
        run: make test-app
