# Claude answers @claude in issues, pull requests and reviews: it reads the
# request, replies in a comment, and can push commits and open a pull request
# for what it was asked (docs/10 § CI). Only people with write access to the
# repository can trigger it. Feedback approved in j23n/feedback arrives as an
# issue with the owner's @claude comment, so Claude starts on it straight away.
# It runs on Linux minutes, and only for comments that mention @claude.
# Needs the Claude GitHub App on the repository and the CLAUDE_CODE_OAUTH_TOKEN
# secret (from `claude setup-token`). Comment-triggered runs use the copy of
# this file on the default branch.
name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    # Comments without @claude start no runner.
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    # A stuck run stops here rather than at GitHub's six hours.
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # lets Claude read CI results on pull requests
    steps:
      - uses: actions/checkout@v6
        with:
          # The whole history, so git log, blame and a merge base with main work.
          fetch-depth: 0
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The model, and how hard it thinks (--effort: low, medium, high, xhigh or max; the
          # owner's choice is high, above the model's default of medium). `gh pr create` and
          # link-pr.sh let Claude open its pull request and link it to the issue it finishes
          # (.apple-ci/claude/j23n.md, "Pull requests"); the action's own tools (reading, editing,
          # committing, pushing) stay as they are. --strict-mcp-config keeps .mcp.json's MobileBuildMCP,
          # which needs Xcode, out of the run; the action's own servers stay.
          claude_args: >-
            --model claude-opus-5-5
            --effort high
            --strict-mcp-config
            --allowedTools "Bash(gh pr create:*),Bash(.apple-ci/claude/link-pr.sh:*)"
