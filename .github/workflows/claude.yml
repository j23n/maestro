# Claude answers @claude in issues, pull requests and reviews: it reads the
# request, replies in a comment, and can push commits and open a pull request
# for what it was asked. It starts on an issue once the issue is labeled `ready`,
# with the issue's text as the request, and takes `needs refinement` off it.
# Only people with write access to the repository can trigger it.
# Needs the Claude GitHub App on the repository and the CLAUDE_CODE_OAUTH_TOKEN
# secret (from `claude setup-token`). Comment-triggered runs use the copy of
# this file on the default branch.
name: Claude

on:
  issue_comment:
    types: [created, edited]
  pull_request_review_comment:
    types: [created, edited]
  issues:
    types: [opened, labeled]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    # Comments without @claude, and labels other than ready, start no runner. An edited comment
    # starts it only when the edit added @claude, so fixing a typo doesn't ask Claude twice.
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') && !contains(github.event.changes.body.from, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude') && !contains(github.event.changes.body.from, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && github.event.action == 'labeled' && github.event.label.name == 'ready') ||
      (github.event_name == 'issues' && github.event.action == 'opened' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    # A stuck run stops here rather than at GitHub's six hours.
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # lets Claude read CI results on pull requests
    steps:
      # A ready issue no longer needs refinement.
      - name: Take needs refinement off the issue
        if: github.event.action == 'labeled' && contains(github.event.issue.labels.*.name, 'needs refinement')
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
        run: gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --remove-label "needs refinement"
      - uses: actions/checkout@v6
        with:
          # The whole history, so git log, blame and a merge base with main work.
          fetch-depth: 0
          # Claude pushes with the Claude app's token, as claude[bot]. Checkout's persisted
          # GITHUB_TOKEN would take precedence over it, and a push with that token starts no CI
          # and leaves the review waiting for approval.
          persist-credentials: false
      # Stacked pull requests (.apple-ci/claude/apps.md, "Stacks"), pinned so a new release
      # changes nothing until it's picked here.
      - name: Install gh stack
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh extension install github/gh-stack --pin v0.2.1
      - uses: anthropics/claude-code-action@v1
        env:
          # No release checks or upgrade notices in Claude's output, from gh-stack or from gh.
          GH_STACK_NO_UPDATE_NOTIFIER: "1"
          GH_NO_EXTENSION_UPDATE_NOTIFIER: "1"
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The label that starts Claude on an issue (.apple-ci/claude/apps.md, "Claude on GitHub").
          label_trigger: ready
          # The model, and how hard it thinks (--effort: low, medium, high, xhigh or max; the
          # owner's choice is high, above the model's default of medium). `gh pr create` lets Claude
          # open its pull request (.apple-ci/claude/j23n.md, "Pull requests"); the read-only
          # `gh issue` and `gh pr` commands let it see the other issues and pull requests in flight
          # (.apple-ci/claude/apps.md, "Claude on GitHub"). `git switch` and `gh stack` build stacks
          # (apps.md, "Stacks"); `rebase` only with `--upstack`, and `--continue` or `--abort` to
          # finish or undo one; `gh stack merge`, `unstack` and `sync` stay out. The action's own
          # tools (reading, editing, committing, pushing) stay as they are.
          claude_args: >-
            --model claude-opus-5-5
            --effort high
            --allowedTools "Bash(gh pr create:*),Bash(gh issue list:*),Bash(gh issue view:*),Bash(gh pr list:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(git switch:*),Bash(gh stack init:*),Bash(gh stack add:*),Bash(gh stack push:*),Bash(gh stack link:*),Bash(gh stack checkout:*),Bash(gh stack rebase --upstack:*),Bash(gh stack rebase --continue:*),Bash(gh stack rebase --abort:*),Bash(gh stack view:*),Bash(gh stack up:*),Bash(gh stack down:*),Bash(gh stack top:*),Bash(gh stack bottom:*)"
